SUTDescription: >-
  Converts chronological market bars into fixed-size Renko bricks based on
  close-price movement. The adapter makes the bars, box size, and reversal
  amount explicit in one RenkoCase input.

MRInput: >-
  the follow-up RenkoCase is created using the fixed positive scale factor k = 2;
  multiply every source bar's open, high, low, and close prices by k, multiply
  its monetary amount by k, and multiply the Renko boxSize by k, while preserving
  bar order, time period, begin and end timestamps, volume, trade count,
  reversalAmount, and Num implementation
MROutput: >-
  the source and follow-up executions produce the same number of Renko bricks in
  the same direction sequence and with identical timestamps, time periods,
  volumes, and trade counts; each follow-up brick's open, high, low, close, and
  monetary amount equals the corresponding source brick value multiplied by k = 2
MR: >-
  Scaling every market price, monetary amount, and the Renko box size by the same
  positive factor must preserve the Renko chart structure; corresponding output-
  brick prices and monetary amounts must be multiplied by that factor, while
  brick count, direction, timestamps, time period, volume, and trade count remain
  unchanged.

Count: 50
InputDomain: >-
  Generate deterministic source cases containing a positive finite boxSize, a
  positive reversalAmount (normally 2), and a non-null List<Bar>. Each list must
  contain at least two chronological, contiguous, evenly spaced time bars, using
  a consistent duration such as one minute. Every bar must have finite,
  non-null, positive OHLC prices satisfying low <= open and close <= high;
  non-negative volume, amount, and trade count; and the same Num implementation.
  Keep every source OHLC value between 1 and 500000 inclusive so multiplying it
  by 2 keeps each follow-up value between 2 and 1000000. Coordinate close-price
  movement with boxSize: a no-brick case has absolute movement smaller than
  boxSize; an exactly-one-brick case has movement equal to boxSize; a multiple-
  brick case has movement of at least 2 * boxSize; and a confirmed-reversal case
  first establishes a direction and then moves in the opposite direction by at
  least reversalAmount * boxSize. Include at least one case for every requested
  category: no bricks, exactly one brick, multiple upward bricks, multiple
  downward bricks, residual movement smaller than one box, an exact box-size
  boundary, and a confirmed reversal. Limit intentional zero-brick cases and
  ensure most cases produce at least one brick so element-level MR assertions
  execute. Use multiple practical boxSize values and at least two practical
  reversalAmount values, coordinating each with its price movement. Do not
  generate exact duplicate source inputs. Name each test according to its actual
  SUT output after verifying brick count and direction sequence; do not claim a
  reversal unless the output changes brick direction. Do not use null bars,
  uneven intervals, non-contiguous timestamps, NaN prices, infinite prices, zero
  or negative box sizes, or invalid OHLC ordering. Treat Count as the maximum
  number of source cases, not a required exact count. Construct source inputs
  with the public RenkoBarAggregatorSut.RenkoCase record; do not define a separate
  test-local case type. Use a fixed Instant literal for every test and derive each
  bar's begin and end times from that same value. Never use Instant.now() or
  separate clock reads.

