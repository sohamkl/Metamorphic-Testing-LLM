# Ta4j Renko aggregation MR: positive scaling of prices and box size.
# Paths are relative to the MT-testing repository root, where OpenaiRunner reads
# this configuration.
ProjectRoot: examples/ta4j
AutomaticDiscovery: true
SUTClassFile: examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/aggregator/RenkoBarAggregator.java
SUTClasspath:
  - examples/ta4j/ta4j-core/target/classes
TargetFunction: public List<Bar> RenkoBarAggregator.aggregate(List<Bar> bars)
SUTDescription: >-
  The original Ta4j Renko aggregator converts chronological market bars into
  fixed-size bricks. Its receiver stores boxSize and reversalAmount, while its
  aggregate method receives the source bars directly.

MRInput: >-
  create a follow-up receiver and bar list using the fixed positive scale factor k = 2;
  multiply every source bar's open, high, low, and close prices by k, multiply
  its monetary amount by k, and multiply the Renko boxSize by k, while preserving
  bar order, time period, begin and end timestamps, volume, trade count,
  reversalAmount, and Num implementation
MROutput: >-
  the source and follow-up executions produce the same number of Renko bricks in
  the same direction sequence and with identical timestamps, time periods,
  volumes, and trade counts; each follow-up brick's open, high, low, close, and
  monetary amount equals the corresponding source brick value multiplied by k = 2
MR: >-
  Scaling every market price, monetary amount, and the Renko box size by the same
  positive factor must preserve the Renko chart structure; corresponding output-
  brick prices and monetary amounts must be multiplied by that factor, while
  brick count, direction, timestamps, time period, volume, and trade count remain
  unchanged.

