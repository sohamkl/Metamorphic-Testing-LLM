# Ta4j Renko aggregation MR: positive scaling of prices and box size.
# Paths are relative to the MT-testing repository root, where OpenaiRunner reads
# this configuration.
SUTClassFile: examples/ta4j/src/main/java/mtllm/examples/ta4j/RenkoBarAggregatorSut.java
SUTSupportFiles:
  - examples/ta4j/src/main/java/mtllm/examples/ta4j/RenkoCaseFactory.java
SUTClasspath:
  - examples/ta4j/ta4j-core/target/classes
TargetFunction: public static List<Bar> RenkoBarAggregatorSut.aggregate(RenkoBarAggregatorSut.RenkoCase source)
SUTDescription: >-
  Converts chronological market bars into fixed-size Renko bricks based on
  close-price movement. The adapter makes the bars, box size, and reversal
  amount explicit in one RenkoCase input.

MRInput: >-
  the follow-up RenkoCase is created using the fixed positive scale factor k = 2;
  multiply every source bar's open, high, low, and close prices by k, multiply
  its monetary amount by k, and multiply the Renko boxSize by k, while preserving
  bar order, time period, begin and end timestamps, volume, trade count,
  reversalAmount, and Num implementation
MROutput: >-
  the source and follow-up executions produce the same number of Renko bricks in
  the same direction sequence and with identical timestamps, time periods,
  volumes, and trade counts; each follow-up brick's open, high, low, close, and
  monetary amount equals the corresponding source brick value multiplied by k = 2
MR: >-
  Scaling every market price, monetary amount, and the Renko box size by the same
  positive factor must preserve the Renko chart structure; corresponding output-
  brick prices and monetary amounts must be multiplied by that factor, while
  brick count, direction, timestamps, time period, volume, and trade count remain
  unchanged.

Count: 50
InputDomain:
  summary: >-
    Generate deterministic, valid RenkoCase source inputs that coordinate close-price
    movement with boxSize and reversalAmount so most cases produce meaningful bricks.
  globalConstraints:
    - Use a non-null list containing at least two chronological, contiguous, evenly spaced bars.
    - Use finite positive OHLC prices satisfying low <= open and close <= high.
    - Keep every source OHLC value between 1 and 500000 inclusive.
    - Use non-negative volume, monetary amount, and trade count.
    - Use a positive finite boxSize and a positive reversalAmount.
    - Use the same Num implementation for every bar in a source case.
    - Construct inputs with RenkoBarAggregatorSut.RenkoCase and the visible RenkoCaseFactory methods.
    - Use fixed timestamps and never use current time or randomness.
    - Do not generate duplicate source inputs.
    - Name each test from its scenario ID and actual source-output behavior.
  diversity:
    barCounts: [2, 3, 4, 5, 6, 8, 10]
    priceBands: ["1 to 10", "50 to 500", "10000 to 500000"]
    boxSizes: [1, 5, 10, 25, 50, 100]
    reversalAmounts: [2, 3, 4, 10]
    directions: [upward, downward, reversal]
  scenarios:
    - id: NO_BRICK
      category: NORMAL
      description: Price movement remains below one complete box.
      preconditions:
        - Every displacement from the first close is smaller than boxSize.
      expectedSourceBehavior:
        - Source output contains zero bricks.
      targetCases: 4
      emptyOutputAllowed: true
    - id: ONE_UP
      category: BOUNDARY
      description: Produce exactly one upward brick.
      preconditions:
        - Upward displacement from the first close equals exactly boxSize.
      expectedSourceBehavior:
        - Source output direction signature is U.
      targetCases: 5
      emptyOutputAllowed: false
    - id: ONE_DOWN
      category: BOUNDARY
      description: Produce exactly one downward brick.
      preconditions:
        - Downward displacement from the first close equals exactly boxSize.
      expectedSourceBehavior:
        - Source output direction signature is D.
      targetCases: 5
      emptyOutputAllowed: false
    - id: MULTIPLE_UP
      category: NORMAL
      description: Produce multiple consecutive upward bricks.
      preconditions:
        - Upward displacement from the first close is at least 2 * boxSize.
      expectedSourceBehavior:
        - Source output contains at least two upward bricks.
      targetCases: 8
      emptyOutputAllowed: false
    - id: MULTIPLE_DOWN
      category: NORMAL
      description: Produce multiple consecutive downward bricks.
      preconditions:
        - Downward displacement from the first close is at least 2 * boxSize.
      expectedSourceBehavior:
        - Source output contains at least two downward bricks.
      targetCases: 8
      emptyOutputAllowed: false
    - id: RESIDUAL_UP
      category: EDGE
      description: Produce upward bricks with a remaining movement smaller than one box.
      preconditions:
        - Upward displacement is N * boxSize plus a positive residual smaller than boxSize, where N >= 1.
      expectedSourceBehavior:
        - Source output contains N upward bricks and ignores the residual movement.
      targetCases: 5
      emptyOutputAllowed: false
    - id: RESIDUAL_DOWN
      category: EDGE
      description: Produce downward bricks with a remaining movement smaller than one box.
      preconditions:
        - Downward displacement is N * boxSize plus a positive residual smaller than boxSize, where N >= 1.
      expectedSourceBehavior:
        - Source output contains N downward bricks and ignores the residual movement.
      targetCases: 5
      emptyOutputAllowed: false
    - id: EXACT_BOUNDARY
      category: BOUNDARY
      description: Exercise exact multi-box movement boundaries in both directions.
      preconditions:
        - Displacement is an exact integer multiple of boxSize and the multiplier is at least 2.
      expectedSourceBehavior:
        - Brick count equals the exact box multiplier with no residual movement.
      targetCases: 4
      emptyOutputAllowed: false
    - id: CONFIRMED_REVERSAL
      category: EDGE
      description: Establish one direction and then produce bricks in the opposite direction.
      preconditions:
        - The first movement establishes at least one brick.
        - Later opposite movement reaches at least reversalAmount * boxSize from the current brick level.
      expectedSourceBehavior:
        - Source output direction signature contains both U and D.
      targetCases: 6
      emptyOutputAllowed: false

GeneratedClassName: GeneratedRenkoBarAggregatorMetamorphicTest
OutputRoot: examples/ta4j/generated/renko
InputGenerator: HYBRID
RandoopTargetClasses:
  - mtllm.examples.ta4j.RenkoCaseFactory
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/ta4j/mr/mtllm/examples/ta4j/RenkoBarAggregatorMetamorphicSpec.java
DeveloperFollowUpMethod: RenkoBarAggregatorMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: RenkoBarAggregatorMetamorphicSpec.assertRelation
MaxRepairAttempts: 3
