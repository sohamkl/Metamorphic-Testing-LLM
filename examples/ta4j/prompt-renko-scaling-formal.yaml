# Ta4j Renko aggregation MR: positive scaling of prices and box size.
# Paths are relative to the MT-testing repository root, where OpenaiRunner reads
# this configuration.
ProjectRoot: examples/ta4j
AutomaticDiscovery: true
SUTClassFile: examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/aggregator/RenkoBarAggregator.java
SUTClasspath:
  - examples/ta4j/ta4j-core/target/classes
TargetFunction: public List<Bar> RenkoBarAggregator.aggregate(List<Bar> bars)
SUTDescription: >-
  The original Ta4j Renko aggregator converts chronological market bars into
  fixed-size bricks. Its receiver stores boxSize and reversalAmount, while its
  aggregate method receives the source bars directly.

MRInput: >-
  Let x = (A(b,r), B), where A(b,r) is a RenkoBarAggregator with box size b and
  reversal amount r, and B = [bar_i] from i=0 to n-1. For k = 2, define
  T_k(x) = (A(k*b,r), B'), where for every i:
  (open_i', high_i', low_i', close_i', amount_i') =
  k*(open_i, high_i, low_i, close_i, amount_i), and period_i', begin_i', end_i',
  volume_i', trades_i', order, and NumFactory_i' equal their source values.
MROutput: >-
  Let F(x) = Y = [brick_j] from j=0 to m-1 and F(T_k(x)) = Y'. Then |Y'|=|Y|
  and for every j: direction(Y'_j)=direction(Y_j); (open,high,low,close,amount)(Y'_j)
  = k*(open,high,low,close,amount)(Y_j); and (period,begin,end,volume,trades)(Y'_j)
  = (period,begin,end,volume,trades)(Y_j).

Count: 50

GeneratedClassName: GeneratedRenkoBarAggregatorMetamorphicTest
OutputRoot: examples/ta4j/generated/renko
MavenProfiles: [ta4j]
InputGenerator: LLM
RandoopTargetClasses:
  - org.ta4j.core.aggregator.RenkoBarAggregator
  - org.ta4j.core.BaseBar
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/ta4j/mr/mtllm/examples/ta4j/RenkoBarAggregatorMetamorphicSpec.java
DeveloperFollowUpMethod: RenkoBarAggregatorMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: RenkoBarAggregatorMetamorphicSpec.assertRelation
MaxRepairAttempts: 3
