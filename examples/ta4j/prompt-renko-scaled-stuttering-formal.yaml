# Ta4j Renko MR: double the observation count while scaling prices and box size.
ProjectRoot: examples/ta4j
AutomaticDiscovery: true
SUTClassFile: examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/aggregator/RenkoBarAggregator.java
SUTClasspath:
  - examples/ta4j/ta4j-core/target/classes
TargetFunction: public List<Bar> RenkoBarAggregator.aggregate(List<Bar> bars)
SUTDescription: >-
  The original Ta4j Renko aggregator converts chronological market bars into
  fixed-size bricks. Its receiver stores boxSize and reversalAmount, while its
  aggregate method receives the source bars directly.

MRInput: >-
  Let x = (A(b,r), B), B=[bar_i] from i=0 to n-1, and k=2. Define T(x) =
  (A(k*b,r), B'), where |B'|=2|B|. For every i, B'_(2i) has OHLC and amount equal
  to k times those of bar_i, with volume and trades preserved. B'_(2i+1) has
  open=high=low=close=close(B'_(2i)), volume=amount=trades=0. All follow-up bars
  have the source period and form one chronological contiguous sequence.
MROutput: >-
  Let F(x)=Y=[brick_j] and F(T(x))=Y'. Then |Y'|=|Y| and for every j:
  direction(Y'_j)=direction(Y_j); (open,high,low,close,amount)(Y'_j)=
  k*(open,high,low,close,amount)(Y_j); and (period,volume,trades)(Y'_j)=
  (period,volume,trades)(Y_j). Absolute timestamps are unconstrained.

Count: 50
InputDomain: >-
  Generate deterministic source cases containing a positive finite boxSize, a
  positive reversalAmount (normally 2), and a non-null List<Bar>. Each source
  list must contain two, three, or four chronological, contiguous, evenly spaced
  time bars using a consistent duration such as one minute; the MR will expand
  these into follow-up lists containing four, six, or eight bars. Every bar must have
  finite, non-null, positive OHLC prices satisfying low <= open and close <=
  high; non-negative volume, amount, and trade count; and the same Num
  implementation. Keep original and doubled prices within 1 to 1000000. Include
  unchanged prices, residual movement below one box, exact box boundaries,
  multiple upward and downward bricks, and confirmed reversals. Include source
  cases with different bar-list sizes. Do not use null bars, uneven intervals,
  non-contiguous timestamps, NaN or infinite prices, non-positive box sizes, or
  invalid OHLC ordering. Treat Count as the maximum number of source cases.
  Construct the original RenkoBarAggregator receiver and List<Bar> argument
  through public Ta4j APIs, and use a fixed Instant rather than Instant.now().

