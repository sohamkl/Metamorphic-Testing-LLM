# Ta4j slope-change swing detection MR: uniform translation of market prices.
ProjectRoot: examples/ta4j
AutomaticDiscovery: true
SUTClassFile: examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/analysis/elliott/swing/SlopeChangeSwingDetector.java
SUTClasspath:
  - examples/ta4j/ta4j-core/target/classes
  - ~/.m2/repository/org/slf4j/slf4j-api/2.0.18/slf4j-api-2.0.18.jar
TargetFunction: public SwingDetectorResult SlopeChangeSwingDetector.detect(BarSeries series, int index, ElliottDegree degree)
SUTDescription: >-
  Detects confirmed high and low swing pivots in a market BarSeries by comparing
  rolling price slopes, requiring the new direction to persist, and filtering
  weak reversals using ATR. The result contains ordered pivots and the Elliott
  swings joining consecutive pivots.

MRInput: >-
  create the follow-up case using the fixed translation c = 100.0; add c to the
  open, high, low, and close price of every source bar, preserve its duration,
  begin and end timestamps, volume, trade count, order, and Num implementation,
  and set monetary amount to source amount + c * source volume; preserve the
  SlopeChangeConfig, evaluation index, and ElliottDegree exactly
MROutput: >-
  source and follow-up results contain the same number and order of pivots and
  swings; corresponding pivots have identical indices and types and follow-up
  pivot price equals source pivot price + c; corresponding swings have identical
  fromIndex, toIndex, and degree and their follow-up fromPrice and toPrice equal
  the source prices plus c; compare Num values using a small tolerance suitable
  for the source series' numeric implementation
MR: >-
  Uniformly translating every market price by c = 100.0 must preserve detected
  slope changes, ATR-based reversal magnitudes, pivot positions and types, and
  Elliott swing structure, while translating every reported pivot and swing
  price by the same c.

Count: 50
# InputDomain intentionally REMOVED (08 Sep). All SUTs now rely on the separate
# LLM input-domain inference call (App.java gate: needsApiKey && requirements.isEmpty()),
# so every dataset is generated the same way rather than some hand-authored and some inferred.
# The original hand-written domain is preserved in git:
#   git show 8ead3e7:examples/ta4j/prompt3-new-hybrid-dev.yaml

GeneratedClassName: GeneratedSlopeChangeSwingDetectorMetamorphicTest
OutputRoot: examples/ta4j/generated/slope-change-swing
# Without MavenProfiles the generated suite is run by GeneratedTestRunner with no -P flag, so
# maven.compiler.release stays 17 (ta4j-core is release 25), ta4j-core is not on the test
# classpath, and generated/slope-change-swing/junit-tests is never registered. Both ta4j LLM
# arms set this; both NEW_HYBRID arms were missing it. Added 08 Sep.
MavenProfiles: [ta4j]
InputGenerator: NEW_HYBRID
RandoopTargetClasses:
  - org.ta4j.core.analysis.elliott.swing.SlopeChangeSwingDetector
  - org.ta4j.core.BaseBarSeries
  - org.ta4j.core.BaseBar
  # detect(BarSeries, int, ElliottDegree) takes this enum as a parameter. Without it in the
  # exploration set Randoop cannot produce a third argument and silently harvests NOTHING
  # (verified 08 Sep: 2 bytes '[]' before, 104,982 bytes of seeds after). Same failure mode as
  # threeten Days.between needing java.time.LocalDate.
  - org.ta4j.core.indicators.elliott.ElliottDegree
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/ta4j/mr/mtllm/examples/ta4j/SlopeChangeSwingDetectorMetamorphicSpec.java
DeveloperFollowUpMethod: SlopeChangeSwingDetectorMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: SlopeChangeSwingDetectorMetamorphicSpec.assertRelation
MaxRepairAttempts: 3
