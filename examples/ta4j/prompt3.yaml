# Ta4j slope-change swing detection MR: uniform translation of market prices.
SUTClassFile: examples/ta4j/src/main/java/mtllm/examples/ta4j/SlopeChangeSwingDetectorSut.java
SUTSupportFiles:
  - examples/ta4j/src/main/java/mtllm/examples/ta4j/SlopeChangeCaseFactory.java
  - examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/analysis/elliott/swing/SlopeChangeConfig.java
  - examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/analysis/elliott/swing/SwingDetectorResult.java
  - examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/analysis/elliott/swing/SwingPivot.java
  - examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/analysis/elliott/swing/SwingPivotType.java
  - examples/ta4j/ta4j-core/src/main/java/org/ta4j/core/indicators/elliott/ElliottSwing.java
SUTClasspath:
  - examples/ta4j/ta4j-core/target/classes
  - ~/.m2/repository/org/slf4j/slf4j-api/2.0.18/slf4j-api-2.0.18.jar
TargetFunction: public static SwingDetectorResult SlopeChangeSwingDetectorSut.detect(SlopeChangeSwingDetectorSut.SlopeChangeCase source)
SUTDescription: >-
  Detects confirmed high and low swing pivots in a market BarSeries by comparing
  rolling price slopes, requiring the new direction to persist, and filtering
  weak reversals using ATR. The result contains ordered pivots and the Elliott
  swings joining consecutive pivots.

MRInput: >-
  create the follow-up case using the fixed translation c = 100.0; add c to the
  open, high, low, and close price of every source bar, preserve its duration,
  begin and end timestamps, volume, trade count, order, and Num implementation,
  and set monetary amount to source amount + c * source volume; preserve the
  SlopeChangeConfig, evaluation index, and ElliottDegree exactly
MROutput: >-
  source and follow-up results contain the same number and order of pivots and
  swings; corresponding pivots have identical indices and types and follow-up
  pivot price equals source pivot price + c; corresponding swings have identical
  fromIndex, toIndex, and degree and their follow-up fromPrice and toPrice equal
  the source prices plus c; compare Num values using a small tolerance suitable
  for the source series' numeric implementation
MR: >-
  Uniformly translating every market price by c = 100.0 must preserve detected
  slope changes, ATR-based reversal magnitudes, pivot positions and types, and
  Elliott swing structure, while translating every reported pivot and swing
  price by the same c.

Count: 50
InputDomain:
  summary: >-
    Generate deterministic SlopeChangeSwingDetector cases with coordinated
    piecewise price paths and detector configurations. Most cases must produce
    at least two confirmed pivots so both pivot and Elliott-swing assertions
    execute.
  globalConstraints:
    - Each source case must contain a valid SlopeChangeConfig, a non-null BaseBarSeries, an evaluation index, and a non-null ElliottDegree.
    - Each source BarSeries must have begin index zero so absolute pivot indices are preserved by the follow-up reconstruction.
    - Use window values from 2 to 6, confirmationBars from 1 to 3, and atrPeriod values from 2 to 14.
    - Use finite non-negative minSlopeChange and minAtrReversal values accepted by SlopeChangeConfig.
    - Except for the INDEX_CLAMP scenario, provide at least 2 * window + confirmationBars - 1 bars and evaluate at the series end index.
    - Normally use 12 to 80 chronological, contiguous, evenly spaced bars so turns have enough history to be confirmed.
    - Use finite positive OHLC prices satisfying low <= open and close <= high, with every source OHLC value at most 999900.
    - Set each source bar's monetary amount consistently to close * volume so the follow-up amount can be translated by c * volume.
    - Use non-negative volume and trade count and one consistent Num implementation within each series.
    - Use Bar.getTrades() for the primitive long trade count; Bar has no getTradeCount() method.
    - Construct BaseBar with timePeriod, beginTime, endTime, six Num values for OHLC-volume-amount, and a primitive long trades value.
    - Convert constants to Num with the series NumFactory before calling Num arithmetic methods; do not pass double values directly to Num.plus or Num.multipliedBy.
    - Use fixed Instant literals and derive all bar times from them; never use Instant.now() or randomness.
    - Do not generate duplicate source cases, null values, invalid OHLC ordering, non-positive prices, NaN, infinity, or rejected configurations.
    - Verify the actual source result before naming a test, and include the scenario ID in every generated test method name.
    - Treat Count as the maximum and generate as many distinct valid cases as practical up to that limit.
  diversity:
    barCounts: [12, 16, 20, 30, 40, 60, 80]
    windows: [2, 3, 4, 5, 6]
    confirmationBars: [1, 2, 3]
    atrPeriods: [2, 5, 10, 14]
    minSlopeChanges: [0.0, 0.1, 0.5, 2.0]
    minAtrReversals: [0.0, 0.5, 1.0, 2.0]
    priceBands: ["1 to 20", "50 to 500", "10000 to 999900"]
    barDurations: [one-minute, five-minute, one-hour, one-day]
    elliottDegrees: [SUB_MINUETTE, MINUETTE, MINUTE, MINOR, INTERMEDIATE]
  scenarios:
    - id: NO_PIVOT_MONOTONIC
      category: NORMAL
      description: Exercise steadily rising, steadily falling, and flat paths that contain no confirmed direction change.
      preconditions:
        - The close-price slope never changes from positive to negative or from negative to positive.
      expectedSourceBehavior:
        - The source result contains no pivots and no swings.
      targetCases: 2
      emptyOutputAllowed: true
    - id: BELOW_FILTERS
      category: EDGE
      description: Present apparent turns that are rejected by the slope-change or ATR magnitude filter.
      preconditions:
        - The path changes direction but either the slope difference is below minSlopeChange or pivot displacement is below minAtrReversal * ATR.
      expectedSourceBehavior:
        - The rejected turn does not appear as a source pivot.
        - The source output may be empty only when every candidate is rejected.
      targetCases: 2
      emptyOutputAllowed: true
    - id: HIGH_THEN_LOW
      category: NORMAL
      description: Confirm a high pivot followed later by a low pivot.
      preconditions:
        - A sustained rise is followed by a confirmed fall and then by a confirmed rise.
        - Both reversals satisfy slope-change, persistence, and ATR magnitude filters.
      expectedSourceBehavior:
        - The source result contains at least two pivots beginning with HIGH then LOW.
        - The source result contains at least one Elliott swing.
      targetCases: 9
      emptyOutputAllowed: false
    - id: LOW_THEN_HIGH
      category: NORMAL
      description: Confirm a low pivot followed later by a high pivot.
      preconditions:
        - A sustained fall is followed by a confirmed rise and then by a confirmed fall.
        - Both reversals satisfy slope-change, persistence, and ATR magnitude filters.
      expectedSourceBehavior:
        - The source result contains at least two pivots beginning with LOW then HIGH.
        - The source result contains at least one Elliott swing.
      targetCases: 9
      emptyOutputAllowed: false
    - id: MULTIPLE_ALTERNATING
      category: NORMAL
      description: Exercise a longer path containing several confirmed alternating market turns.
      preconditions:
        - The path contains at least three sufficiently long alternating trend segments.
        - Every retained turn satisfies the configured filters and confirmation period.
      expectedSourceBehavior:
        - The source result contains at least three pivots whose types alternate.
        - The source result contains at least two Elliott swings.
      targetCases: 10
      emptyOutputAllowed: false
    - id: ROUNDED_TURN
      category: EDGE
      description: Detect gradual rounded trend changes instead of a single sharp reversal.
      preconditions:
        - Successive close-price increments gradually approach zero and then change sign.
        - The new slope direction persists for the configured confirmationBars.
      expectedSourceBehavior:
        - The source result contains at least two confirmed pivots and at least one swing.
      targetCases: 6
      emptyOutputAllowed: false
    - id: NOISY_CONFIRMED
      category: EDGE
      description: Detect genuine turns despite small fluctuations inside sustained trend segments.
      preconditions:
        - Add small non-monotonic fluctuations without violating the required post-turn persistence.
        - The main reversal displacement remains above the configured filters.
      expectedSourceBehavior:
        - The source result contains at least two confirmed pivots and at least one swing.
        - Minor fluctuations do not create adjacent pivots of the same type.
      targetCases: 5
      emptyOutputAllowed: false
    - id: CONFIRMATION_BOUNDARY
      category: BOUNDARY
      description: Exercise turns whose new direction persists for exactly the required number of confirmation windows.
      preconditions:
        - The post-turn slope has the required sign for exactly confirmationBars consecutive checks.
        - The candidate satisfies the slope-change and ATR magnitude thresholds.
      expectedSourceBehavior:
        - The boundary turn is retained as a pivot.
        - The complete source path contains at least two pivots and one swing.
      targetCases: 4
      emptyOutputAllowed: false
    - id: INDEX_CLAMP
      category: BOUNDARY
      description: Exercise evaluation indices below the begin index and above the end index.
      preconditions:
        - Include at least one case below the series begin index and one above the series end index.
        - The underlying complete path contains enough confirmed turns for the clamped endpoint being exercised.
      expectedSourceBehavior:
        - An index below the begin index behaves like evaluation at the begin index.
        - An index above the end index behaves like evaluation at the end index.
      targetCases: 3
      emptyOutputAllowed: true

