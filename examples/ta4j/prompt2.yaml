MRInput: >-
  create a follow-up receiver and bar list using the fixed positive scale factor k = 2.0;
  replace every source bar with two chronological bars of the same duration:
  first add a scaled bar whose OHLC prices and monetary amount are multiplied by
  k while volume and trade count are preserved, then add a contiguous no-change
  bar at the same scaled close price with zero volume, zero amount, and zero
  trades; multiply boxSize by k and preserve reversalAmount, so the follow-up
  contains exactly twice as many input bars
MROutput: >-
  source and follow-up executions produce the same number of Renko bricks in the
  same direction sequence; corresponding bricks have the same time period,
  volume, and trade count, while each follow-up open, high, low, close, and
  monetary amount equals the corresponding source value multiplied by k = 2.0;
  absolute brick timestamps are not compared because the inserted observations
  extend the follow-up timeline
MR: >-
  Scaling every price, monetary amount, and Renko box size by 2.0 while inserting
  one zero-metadata repeated-close observation after every source bar must
  preserve the Renko brick structure and double its monetary output values.

Count: 50
InputDomain: >-
  Generate deterministic source cases containing a positive finite boxSize, a
  positive reversalAmount (normally 2), and a non-null List<Bar>. Each source
  list must contain two, three, or four chronological, contiguous, evenly spaced
  time bars using a consistent duration such as one minute; the MR will expand
  these into follow-up lists containing four, six, or eight bars. Every bar must have
  finite, non-null, positive OHLC prices satisfying low <= open and close <=
  high; non-negative volume, amount, and trade count; and the same Num
  implementation. Keep original and doubled prices within 1 to 1000000. Include
  unchanged prices, residual movement below one box, exact box boundaries,
  multiple upward and downward bricks, and confirmed reversals. Include source
  cases with different bar-list sizes. Do not use null bars, uneven intervals,
  non-contiguous timestamps, NaN or infinite prices, non-positive box sizes, or
  invalid OHLC ordering. Treat Count as the maximum number of source cases.
  Construct the original RenkoBarAggregator receiver and List<Bar> argument
  through public Ta4j APIs, and use a fixed Instant rather than Instant.now().

