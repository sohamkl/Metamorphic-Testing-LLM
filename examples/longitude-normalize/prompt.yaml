TargetFunction: LongitudeNormalizer.normalize
SUTDescription: Longitude normalizer over Spatial4j. The target function receives a LongitudeInput holding one longitude in degrees and returns the equivalent longitude folded into the range -180 to +180.

MRInput: the follow-up input is created by adding one full revolution of 360 degrees to the source longitude
MROutput: the normalized longitude is unchanged, treating -180 and +180 as the same meridian
MR: Longitude is periodic with a period of 360 degrees, so adding a full revolution should normalize to the same meridian.
InputDomain: Generate valid LongitudeInput objects holding one finite double longitude in degrees. Include values already inside the range such as 0, 45.5 and -73.2; the exact boundaries -180 and 180; values just inside and just outside those boundaries such as -179.9, -180.1, 179.9 and 180.1; values well outside the range in both directions such as 270, 540, -450 and -720; and values just above and below exact multiples of 360. Keep magnitudes below 100000 so that adding 360 does not lose double precision.

