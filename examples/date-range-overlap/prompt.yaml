TargetFunction: DateRangeOverlapCalculator.overlaps
SUTDescription: Date-range overlap check over threeten-extra. The target function receives a DateRangePairInput holding the start and end dates of two half-open ranges, builds a LocalDateRange for each, and returns whether the first overlaps the second.

MRInput: the follow-up input is created by swapping the two ranges, so the range that was second becomes first
MROutput: the overlap answer is unchanged
MR: Overlapping is mutual, so whether two date ranges overlap must not depend on which one the question is asked from.
InputDomain: Generate valid DateRangePairInput objects holding four non-null LocalDate values forming two half-open ranges [start, end). For each range the start must not be after the end. Include ranges that clearly overlap, ranges that are completely disjoint, ranges that abut exactly (one ends on the day the other starts), ranges where one fully encloses the other, ranges that share exactly one day, identical ranges, and empty ranges where start equals end. Keep all dates between years 1900 and 2100.

