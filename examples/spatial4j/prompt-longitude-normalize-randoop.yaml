# Spatial4j DistanceUtils.normLonDEG - adding one full turn of longitude.
#
# Real SUT from the SBFT'23 paper (Jahangirova & Terragni, 2023). Classpath comes from
# Spatial4j's own pom. No adapter - it's static and takes one double, so there's no wrapper,
# the relation just maps one number to another.
#
# Note: MRInput/MROutput is what actually reaches the model. The MR line is just for us.

ProjectRoot: examples/spatial4j
AutomaticDiscovery: true
SUTClassFile: examples/spatial4j/src/main/java/org/locationtech/spatial4j/distance/DistanceUtils.java
TargetFunction: public static double normLonDEG(double lon_deg)
SUTDescription: >-
  Longitude normalizing. Takes a longitude that might be way outside the normal range and
  folds it back into -180..180. If it's already in that range it's returned as-is, which is
  why -180 and +180 (the same spot) can both come back unchanged.

MRInput: the follow-up is made by adding one full turn, 360 degrees, to the source longitude
MROutput: the normalized longitude still points at the same spot on the globe
MR: >-
  Longitude repeats every 360 degrees, so adding one full turn to a longitude should
  normalize back to the same spot.

Count: 50
InputGenerator: RANDOOP
MavenProfiles:
  - spatial4j-randoop
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/spatial4j/mr/LongitudeNormalizeMetamorphicSpec.java
DeveloperFollowUpMethod: LongitudeNormalizeMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: LongitudeNormalizeMetamorphicSpec.assertRelation
GeneratedClassName: GeneratedLongitudeNormalizeRandoopMetamorphicTest
OutputRoot: examples/spatial4j/generated/longitude-normalize-randoop
MaxRepairAttempts: 2
