# Spatial4j CircleImpl.relate(Rectangle) - translation invariance.
# This prompt targets the original repository class directly. The framework discovers
# Spatial4j's Maven output and dependencies, so no adapter or support-file list is needed.

ProjectRoot: examples/spatial4j
AutomaticDiscovery: true
SUTClassFile: examples/spatial4j/src/main/java/org/locationtech/spatial4j/shape/impl/CircleImpl.java
TargetFunction: public SpatialRelation relate(Rectangle rectangle)
SUTDescription: >-
  Circle-versus-rectangle spatial-relation classifier over Spatial4j. Treat the
  CircleImpl receiver and Rectangle argument together as the source scenario. Build
  both through the same Cartesian SpatialContext and call circle.relate(rectangle).

MRInput: the follow-up input is created by sliding both the circle centre and the rectangle by the same offset across the plane, leaving the radius and the rectangle's width and height unchanged
MROutput: the spatial relation is unchanged
MR: Translating a circle and a rectangle by the same offset on a plane moves them together, so how they sit relative to each other cannot change.
InputDomain: >-
  Generate valid source scenarios containing a CircleImpl receiver and Rectangle
  argument created by one non-geodetic SpatialContext. Use seven finite doubles:
  circle centreX, centreY and radius, then rectangle minX, maxX, minY and maxY.
  Radius must be non-negative, minX <= maxX, and minY <= maxY. Include a circle
  entirely inside the rectangle, a rectangle entirely inside the circle, clearly
  disjoint pairs, partial overlaps, exact edge contact, centre on a rectangle corner,
  zero radius, zero-area rectangles, barely reached corners, and bounding-box overlap
  without actual circle overlap. Keep source and translated coordinates between -1000
  and 1000. Generate as many distinct valid scenarios as possible up to Count.

Count: 10
InputGenerator: LLM
MavenProfiles:
  - spatial4j
JsonRequired: false
TestSuiteRequired: true
MRProvider: LLM
GeneratedClassName: GeneratedCircleRelateMetamorphicTest
OutputRoot: examples/spatial4j/generated/circle-relate
MaxRepairAttempts: 2
