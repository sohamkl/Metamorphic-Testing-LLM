TargetFunction: CircleRelateCalculator.relate
SUTDescription: Circle-versus-rectangle spatial-relation classifier over Spatial4j. The target function receives a CircleRectangleInput holding a circle centre and radius plus rectangle bounds, builds both shapes in a Euclidean (non-geodetic) context, and returns the spatial relation (CONTAINS, WITHIN, INTERSECTS or DISJOINT).

MRInput: the follow-up input is created by sliding both the circle centre and the rectangle by the same offset across the plane, leaving the radius and the rectangle's width and height unchanged
MROutput: the spatial relation is unchanged
MR: Translating a circle and a rectangle by the same offset on a plane moves them together, so how they sit relative to each other cannot change.
InputDomain: Generate valid CircleRectangleInput objects holding seven finite doubles: circle centreX, centreY and radius, then rectangle minX, maxX, minY, maxY. The radius must be non-negative, minX must not exceed maxX, and minY must not exceed maxY. Include a circle entirely inside the rectangle, a rectangle entirely inside the circle, clearly disjoint pairs, partially overlapping pairs, a circle exactly touching one rectangle edge, a circle whose centre sits exactly on a rectangle corner, a zero-radius circle, a zero-area rectangle, a circle just barely reaching a corner of the rectangle, and a circle whose bounding box overlaps the rectangle while the circle itself does not. Keep coordinates between -1000 and 1000.

