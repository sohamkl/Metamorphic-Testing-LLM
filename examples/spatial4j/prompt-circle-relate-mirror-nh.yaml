# Spatial4j CircleImpl.relate(Rectangle) - NEW_HYBRID arm of the MIRRORING relation.
#
# Third and final arm for the mirroring relation, so circle-relate-mirror now has LLM,
# RANDOOP and NEW_HYBRID and can carry the circle-relate row of the three-arm table on its
# own. Identical to prompt-circle-relate-mirror.yaml except for InputGenerator,
# MavenProfiles, GeneratedClassName and OutputRoot.
#
# Needs its OWN Maven profile (spatial4j-mirror-nh) rather than joining spatial4j-nh:
# circle-relate-dev-nh is already in that profile and targets the same
# CircleImpl.relate(Rectangle), so the Randoop invocation wrapper (named from the target
# method signature alone) would be emitted twice and javac would see a duplicate class.
#
# MaxRepairAttempts is 2, matching the other NEW_HYBRID configs. NEW_HYBRID is the arm that
# actually spends tokens, so the bound matters: worst case is 2 domain-inference calls
# (InputDomainInferenceService.MAX_ATTEMPTS) + 1 initial generation + 2 repair rounds.
# The sibling circle-relate-dev-nh run cost $1.56 for 67,764 tokens in 214s.

ProjectRoot: examples/spatial4j
AutomaticDiscovery: true
SUTClassFile: examples/spatial4j/src/main/java/org/locationtech/spatial4j/shape/impl/CircleImpl.java
TargetFunction: public SpatialRelation relate(Rectangle rectangle)
SUTDescription: >-
  A circle on a flat, non-geo SpatialContext. relate(Rectangle) says how the circle sits
  next to a rectangle - CONTAINS, WITHIN, INTERSECTS or DISJOINT. Non-geo means no
  antimeridian or pole to worry about here.

MRInput: >-
  the follow-up is made by mirroring both shapes left to right about the y axis, so every x
  coordinate flips sign and the y coordinates are left alone
MROutput: the spatial relation doesn't change
MR: >-
  Holding a circle and a rectangle up to a mirror doesn't stretch or move them, it only
  flips left and right, so how they sit next to each other can't change.

Count: 50
InputGenerator: NEW_HYBRID
MavenProfiles:
  - spatial4j-mirror-nh
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/spatial4j/mr/CircleRelateMirrorMetamorphicSpec.java
DeveloperFollowUpMethod: CircleRelateMirrorMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: CircleRelateMirrorMetamorphicSpec.assertRelation
GeneratedClassName: GeneratedCircleRelateMirrorNhMetamorphicTest
OutputRoot: examples/spatial4j/generated/circle-relate-mirror-nh
MaxRepairAttempts: 2
