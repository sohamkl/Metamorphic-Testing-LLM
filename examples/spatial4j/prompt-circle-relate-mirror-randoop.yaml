# Spatial4j CircleImpl.relate(Rectangle) - RANDOOP arm of the MIRRORING relation.
#
# Same SUT and same mirroring relation as prompt-circle-relate-mirror.yaml. The only thing
# that changes is InputGenerator, so this is the raw-Randoop arm of the second relation and
# is directly comparable to that LLM arm.
#
# Why this did not exist before: the Randoop invocation wrapper is named from the target
# method signature alone, so this dataset emits the SAME
# MtllmGeneratedCircleImplRelateInvocation* class as circle-relate-randoop. That is a
# build-wiring collision, not a generation problem - each dataset compiles its suite through
# its own gate - so generation here is fine as long as both are never registered on one
# Maven source path at the same time. See the comments in pom.xml around the spatial4j and
# spatial4j-randoop profiles.
#
# RANDOOP pairs with MRProvider: DEV. needsApiKey is false for raw Randoop, so this arm runs
# fully offline and costs no API spend.

ProjectRoot: examples/spatial4j
AutomaticDiscovery: true
SUTClassFile: examples/spatial4j/src/main/java/org/locationtech/spatial4j/shape/impl/CircleImpl.java
TargetFunction: public SpatialRelation relate(Rectangle rectangle)
SUTDescription: >-
  A circle on a flat, non-geo SpatialContext. relate(Rectangle) says how the circle sits
  next to a rectangle - CONTAINS, WITHIN, INTERSECTS or DISJOINT. Non-geo means no
  antimeridian or pole to worry about here.

MRInput: >-
  the follow-up is made by mirroring both shapes left to right about the y axis, so every x
  coordinate flips sign and the y coordinates are left alone
MROutput: the spatial relation doesn't change
MR: >-
  Holding a circle and a rectangle up to a mirror doesn't stretch or move them, it only
  flips left and right, so how they sit next to each other can't change.

Count: 50
InputGenerator: RANDOOP
MavenProfiles:
  - spatial4j-randoop
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/spatial4j/mr/CircleRelateMirrorMetamorphicSpec.java
DeveloperFollowUpMethod: CircleRelateMirrorMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: CircleRelateMirrorMetamorphicSpec.assertRelation
GeneratedClassName: GeneratedCircleRelateMirrorRandoopMetamorphicTest
OutputRoot: examples/spatial4j/generated/circle-relate-mirror-randoop
MaxRepairAttempts: 2
