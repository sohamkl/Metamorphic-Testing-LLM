# Smoke test: matrix-rank transpose relation, LLM arm.
# No InputDomain on purpose, so the separate LLM inference call runs (RANDOOP needs no API key
# and therefore infers nothing). Own OutputRoot and GeneratedClassName so the six smoke datasets
# and the original examples/matrix-rank/generated dataset never overwrite each other.
# computeRank is static and unary, so InvocationWrapperGenerator emits no wrapper and only
# junit-tests needs registering; junit-support must NOT be registered because the developer MR is
# copied into it and examples/matrix-rank/mr is already a main source (duplicate class).

SUTClassFile: examples/matrix-rank/src/MatrixRank.java
SUTSupportFiles: []
TargetFunction: computeRank
SUTDescription: Matrix rank calculator. The target function receives a 2D double matrix and returns its rank.

MRInput: >-
  the follow-up matrix is the transpose of the source matrix
MROutput: the source and follow-up matrices have the same rank
MR: >-
  Transposing a matrix should not change its rank.

Count: 8
InputGenerator: LLM
# Own profile so only this dataset's junit-tests is on the test source path. All matrix-rank
# datasets share the computeRank target, so registering several at once means one stale or
# malformed suite breaks the test-compile for every other run.
MavenProfiles: [matrixrank-transpose-llm]
RandoopTargetClasses:
  - MatrixRank
# JsonRequired must be false here: the data-backed JUnit writer names methods
# testGeneratedCaseNNN, which can never satisfy the scenario-coverage gate that matches
# method names against inferred scenario ids. Every other live config is false too.
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/matrix-rank/mr/MatrixRankMetamorphicSpec.java
DeveloperFollowUpMethod: MatrixRankMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: MatrixRankMetamorphicSpec.assertRelation
GeneratedClassName: GeneratedMatrixRankTransposeLlmMetamorphicTest
OutputRoot: examples/matrix-rank/generated/transpose-llm
MaxRepairAttempts: 2
