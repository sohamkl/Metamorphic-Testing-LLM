TargetFunction: DaysBetweenCalculator.daysBetween
SUTDescription: Day-count calculator over threeten-extra. The target function receives a DaysBetweenInput holding a start and an end LocalDate, and returns the number of whole days between them as an int (negative when the end precedes the start).

MRInput: the follow-up input is created by shifting both the start date and the end date forward by the same number of days, leaving the gap between them unchanged
MROutput: the day count is unchanged
MR: Shifting both endpoints of a date interval forward by the same number of days should not change the number of days between them.
InputDomain: Generate valid DaysBetweenInput objects holding two non-null LocalDate values. Include ranges where the end is after the start, where the end is before the start (negative counts), and where both dates are equal (zero). Include single-day gaps, multi-year gaps, ranges spanning a leap day such as 2024-02-28 to 2024-03-01, ranges spanning a year boundary, and ranges spanning a month boundary. Keep all dates between years 1900 and 2100 so that shifting them forward cannot overflow the supported LocalDate range.

