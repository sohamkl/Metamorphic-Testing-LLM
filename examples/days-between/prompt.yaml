#
# Real-world SUT sourced from the SBFT'23 Java test-generation benchmark
# (Jahangirova & Terragni, 2023). Target: org.threeten.extra.Days.between (threeten-extra).
#
# The SUT file is a thin adapter that unwraps a single reference-type source input and
# delegates to the library method; the library itself is vendored under
