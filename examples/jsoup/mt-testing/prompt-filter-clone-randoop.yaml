# RAW RANDOOP arm, derived from examples/jsoup/mt-testing/prompt1.yaml.
# Only InputGenerator, MavenProfiles, GeneratedClassName and OutputRoot differ from that config:
# same SUT, same target, same developer MR, so this is directly comparable to it.
#
# Its own profile (matrixless per-dataset isolation) because several of Soham's MRs share a target
# method and the Randoop invocation wrapper is named from the target signature alone, so two
# datasets on one test source path emit the same wrapper class. The profile is SELF-CONTAINED and
# is used INSTEAD of the base jsoup profile, not alongside it.
#
# RANDOOP pairs with MRProvider: DEV and makes no LLM calls, so this arm is free and needs no key.

ProjectRoot: examples/jsoup
AutomaticDiscovery: true
SUTClassFile: examples/jsoup/src/main/java/org/jsoup/select/NodeTraversor.java
SUTClasspath:
  - examples/jsoup/target/classes
TargetFunction: public static NodeFilter.FilterResult NodeTraversor.filter(NodeFilter filter, Node root)
SUTDescription: >-
  Traverses a jsoup DOM tree in depth-first order. The NodeFilter callback chooses
  whether traversal continues, skips children, skips an entire node, removes a
  subtree, or stops. The method returns its terminal FilterResult.

MRInput: >-
  Deep-clone a non-null detached DOM root before execution. Apply fresh
  NodeFilter instances with the same deterministic policy to the original and
  cloned roots.
MROutput: >-
  Both executions must return the same FilterResult, callback sequence, actions,
  and final outerHtml. Any configured non-CONTINUE action must occur at least
  once.
MR: >-
  Filtering a detached DOM tree and its deep clone with equivalent deterministic
  filters must produce equivalent traversal behaviour and final DOMs.

Count: 50

GeneratedClassName: GeneratedNodeFilterCloneRandoopMetamorphicTest
OutputRoot: examples/jsoup/mt-testing/generated/filter-clone-randoop
MavenProfiles: [jsoup-filter-clone-randoop]
InputGenerator: RANDOOP
RandoopTargetClasses:
  - org.jsoup.select.NodeTraversor
  - org.jsoup.select.NodeFilter
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/jsoup/mt-testing/mr/NodeTraversorFilterCloneMetamorphicSpec.java
DeveloperFollowUpMethod: NodeTraversorFilterCloneMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: NodeTraversorFilterCloneMetamorphicSpec.assertRelation
MaxRepairAttempts: 3
