# jsoup NodeTraversor.filter MR 2: content appended after STOP is traversal-invariant.
ProjectRoot: examples/jsoup
AutomaticDiscovery: true
SUTClassFile: examples/jsoup/src/main/java/org/jsoup/select/NodeTraversor.java
SUTClasspath:
  - examples/jsoup/target/classes
TargetFunction: public static NodeFilter.FilterResult NodeTraversor.filter(NodeFilter filter, Node root)
SUTDescription: >-
  Traverses a jsoup DOM tree in depth-first order and lets a NodeFilter callback
  continue, skip, remove, or stop traversal. The method returns its terminal
  FilterResult.

MRInput: >-
  Use a deterministic NodeFilter that returns STOP at a guaranteed target. Clone
  the source root and append one uniquely marked, non-target subtree after that
  STOP point. Use a fresh, behaviorally equivalent filter for the follow-up; do
  not reuse a stateful recording filter between executions.
MROutput: >-
  Both direct NodeTraversor.filter calls must return STOP and record the same
  ordered callback events before termination. The appended subtree must not be
  visited and must remain unchanged. The generated test may define a small local
  recording NodeFilter to observe callbacks.
MR: >-
  Appending an independent subtree after a guaranteed STOP point must not affect
  traversal behaviour before termination.

Count: 50
InputDomain: >-
  Generate valid detached jsoup Node trees and deterministic NodeFilter callbacks.
  Every filter must return STOP at a target that depth-first traversal is guaranteed
  to reach. Include targets near the start, middle, end, and at nested depths, with
  non-target nodes after the STOP point. Vary tree depth, sibling width, text,
  comments, empty elements, and repeated targets. Use no nulls, randomness,
  external resources, or network access. Treat Count as an upper limit.

