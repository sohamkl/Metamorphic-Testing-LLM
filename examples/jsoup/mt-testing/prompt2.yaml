# jsoup NodeTraversor.filter MR 2: content appended after STOP is traversal-invariant.
SUTClassFile: examples/jsoup/mt-testing/src/main/java/jsoupmt/NodeTraversorFilterSut.java
SUTSupportFiles:
  - examples/jsoup/mt-testing/src/main/java/jsoupmt/NodeFilterCaseFactory.java
SUTClasspath:
  - examples/jsoup/target/classes
TargetFunction: public static NodeTraversorFilterSut.FilterTrace NodeTraversorFilterSut.run(NodeTraversorFilterSut.FilterCase source)
SUTDescription: >-
  Executes jsoup NodeTraversor.filter on a selected DOM subtree and records the
  terminal result, ordered traversal events, action counts, and final DOM.

MRInput: >-
  The source policy must use STOP and must reach its target. Create the follow-up
  by appending one uniquely marked, non-target subtree as the selected root's last
  child. Preserve the original HTML, selector, scenario ID, policy, and clone flag.
MROutput: >-
  Both executions must terminate with STOP after the same visited-node sequence
  and exactly one applied action. The appended subtree must not be visited and
  must remain unchanged in the follow-up DOM. Removing that subtree from the
  follow-up final DOM must recover the source final DOM.
MR: >-
  Appending an independent subtree after a guaranteed STOP point must not affect
  traversal behaviour before termination.

Count: 50
InputDomain:
  summary: >-
    Generate deterministic FilterCase objects whose STOP target is guaranteed to
    be reached before any content that should remain unvisited.
  globalConstraints:
    - Construct every source with NodeFilterCaseFactory.source or a named NodeFilterCaseFactory method.
    - Every source must use FilterAction.STOP and cloneRootBeforeFiltering must be false.
    - Use a non-blank unique scenarioId and include it in the JUnit method name.
    - Use valid deterministic HTML containing exactly one element selected by rootSelector.
    - Ensure targetNodeName matches at least one descendant of the selected root.
    - Never target the selected root or the reserved node name mr-stop-suffix.
    - Ensure depth-first traversal reaches a target before the end of the selected subtree.
    - Include existing nodes after the first target in all scenarios except STOP_TARGET_AT_END.
    - Include nested elements, siblings, text, comments, empty elements, and repeated targets across the suite.
    - Vary selectors, target names, target depth, sibling width, and unvisited suffix size.
    - Do not use nulls, randomness, current time, scripts, external resources, or network access.
    - Treat Count as an upper limit and generate as many distinct valid cases as practical.
  diversity:
    treeDepths: [1, 2, 3, 5, 8]
    siblingWidths: [1, 2, 4, 8]
    existingNodesAfterStop: [0, 1, 3, 8]
    targetOccurrences: [1, 2, 3, 5]
    targetPositions: [first, middle, last, deeply-nested]
    rootSelectors: [id, class, tag, attribute]
    targetNodeNames: [target, stop, marker, halt]
    contentKinds: [elements, text, comments, empty-elements, mixed]
  scenarios:
    - id: STOP_TARGET_FIRST
      category: NORMAL
      description: Stop at the first child while several later siblings remain.
      preconditions:
        - The first descendant visited after the root matches targetNodeName.
        - Include at least three nodes after that target.
      expectedSourceBehavior:
        - The target is reached and exactly one STOP action is applied.
        - No later sibling is visited.
      targetCases: 10
      emptyOutputAllowed: false
    - id: STOP_TARGET_MIDDLE
      category: NORMAL
      description: Visit a non-target prefix, then stop before a non-target suffix.
      preconditions:
        - Include at least one visited node before the target and one unvisited node after it.
      expectedSourceBehavior:
        - Prefix nodes and the target are visited in depth-first order.
        - Nodes following the target are not visited.
      targetCases: 10
      emptyOutputAllowed: false
    - id: STOP_TARGET_DEEP
      category: EDGE
      description: Stop at a target nested several levels below the selected root.
      preconditions:
        - Place the first matching target at depth 3, 5, or 8.
        - Include ancestor siblings and root-level content after the target path.
      expectedSourceBehavior:
        - Traversal reaches the deep target and terminates without unwinding through tail callbacks.
      targetCases: 10
      emptyOutputAllowed: false
    - id: STOP_MULTIPLE_TARGETS
      category: EDGE
      description: Include several targets but stop at the first target reached.
      preconditions:
        - Include 2, 3, or 5 matching target nodes in separate positions or subtrees.
      expectedSourceBehavior:
        - Exactly one target and one STOP action are recorded.
        - Later matching targets are not visited.
      targetCases: 10
      emptyOutputAllowed: false
    - id: STOP_TARGET_AT_END
      category: BOUNDARY
      description: Place the source target at the end so the MR-added subtree becomes the only new suffix.
      preconditions:
        - Include a non-empty visited prefix and place the only target last in depth-first order.
      expectedSourceBehavior:
        - Traversal visits the prefix and terminates at the final source target.
        - In the follow-up, the newly appended subtree remains unvisited.
      targetCases: 10
      emptyOutputAllowed: false

