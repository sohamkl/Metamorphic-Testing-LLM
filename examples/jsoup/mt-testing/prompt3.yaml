# jsoup Cleaner MR: cleaning already-clean HTML is idempotent.
SUTClassFile: examples/jsoup/src/main/java/org/jsoup/Jsoup.java
SUTClasspath:
  - examples/jsoup/target/classes
TargetFunction: public static String Jsoup.clean(String bodyHtml, String baseUri, Safelist safelist)
SUTDescription: >-
  Sanitises an HTML body fragment using a jsoup Safelist, removing unsafe tags,
  attributes, and URL protocols while retaining content allowed by that policy.

MRInput: >-
  Clean the source HTML once, then use that cleaned result as the follow-up HTML.
  Preserve the source base URI and Safelist instance.
MROutput: >-
  Cleaning the follow-up HTML with the same base URI and Safelist must produce
  exactly the same string as the first cleaning.
MR: >-
  HTML cleaning is idempotent: clean(clean(html, policy), policy) must equal
  clean(html, policy).

Count: 50
InputDomain: >-
  Generate as many distinct valid source inputs as practical, up to Count. Use
  non-null HTML body fragments, base URIs, and standard jsoup Safelists such as
  none(), simpleText(), basic(), basicWithImages(), and relaxed(). Include nested
  safe and unsafe tags, script and style content, event-handler attributes,
  relative and absolute links, safe and unsafe URL protocols, encoded entities,
  comments, malformed fragments, images, tables, lists, and Unicode text. Include
  both already-safe and dirty HTML, but avoid cases whose source and cleaned output
  are both empty unless the Safelist intentionally removes all content. Vary DOM
  depth, sibling count, attribute count, URL form, Safelist, and fragment length.
  Do not use nulls, external files, network access, or nondeterministic values.

