# jsoup NodeTraversor.filter MR 1: filtering a detached deep clone is equivalent.
ProjectRoot: examples/jsoup
AutomaticDiscovery: true
SUTClassFile: examples/jsoup/src/main/java/org/jsoup/select/NodeTraversor.java
SUTClasspath:
  - examples/jsoup/target/classes
TargetFunction: public static NodeFilter.FilterResult NodeTraversor.filter(NodeFilter filter, Node root)
SUTDescription: >-
  Traverses a jsoup DOM tree in depth-first order. The NodeFilter callback chooses
  whether traversal continues, skips children, skips an entire node, removes a
  subtree, or stops. The method returns its terminal FilterResult.

MRInput: >-
  Create the source from a valid detached jsoup Node root and a deterministic
  NodeFilter. Create the follow-up with root.clone() and a fresh, behaviorally
  equivalent NodeFilter instance. Do not reuse a stateful filter between runs.
MROutput: >-
  Source and follow-up executions must return the same terminal FilterResult,
  record the same ordered head and tail callback events, apply the same actions,
  and leave their two DOM roots with identical outerHtml. The generated test may
  use a small recording NodeFilter implementation local to the test solely to
  observe callback events; it must invoke NodeTraversor.filter directly.
MR: >-
  Applying the same deterministic NodeFilter policy to a DOM subtree and its
  detached deep clone must produce the same traversal events, filtering effects,
  terminal result, and final DOM structure.

Count: 50

GeneratedClassName: GeneratedNodeTraversorFilterCloneMetamorphicTest
OutputRoot: examples/jsoup/mt-testing/generated/node-filter-clone
MavenProfiles: [jsoup]
InputGenerator: NEW_HYBRID
RandoopTargetClasses:
  - org.jsoup.select.NodeTraversor
  - org.jsoup.select.NodeFilter
JsonRequired: false
