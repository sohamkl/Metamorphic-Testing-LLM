# jsoup NodeTraversor.filter MR 1: filtering a detached deep clone is equivalent.
SUTClassFile: examples/jsoup/mt-testing/src/main/java/jsoupmt/NodeTraversorFilterSut.java
SUTSupportFiles:
  - examples/jsoup/mt-testing/src/main/java/jsoupmt/NodeFilterCaseFactory.java
SUTClasspath:
  - examples/jsoup/target/classes
TargetFunction: public static NodeTraversorFilterSut.FilterTrace NodeTraversorFilterSut.run(NodeTraversorFilterSut.FilterCase source)
SUTDescription: >-
  Executes jsoup NodeTraversor.filter on a detached DOM root using a deterministic
  node-name policy. The policy can continue, skip children, skip a node entirely,
  remove a subtree, or stop traversal. The output records the terminal result,
  ordered head and tail visits, action counts, and final DOM serialization.

MRInput: >-
  Preserve the source HTML, root selector, scenario ID, filter action, and target
  node name exactly. Create the follow-up by setting cloneRootBeforeFiltering to
  true so the adapter filters a detached deep clone instead of the original
  detached parsed root.
MROutput: >-
  Source and follow-up traces must have identical terminal FilterResult, policy,
  matched-target count, applied-action count, ordered VisitEvent list, and final
  HTML. Both executions must visit nodes and apply the configured action. STOP
  cases must terminate with FilterResult.STOP.
MR: >-
  Applying the same deterministic NodeFilter policy to a DOM subtree and its
  detached deep clone must produce the same traversal events, filtering effects,
  terminal result, and final DOM structure.

Count: 50
InputDomain:
  summary: >-
    Generate deterministic FilterCase objects containing valid HTML trees and
    policies that exercise every control-flow result of NodeTraversor.filter.
  globalConstraints:
    - Construct every source with NodeFilterCaseFactory.source or one of its named methods.
    - Set cloneRootBeforeFiltering to false; the developer MR creates the cloned follow-up.
    - Use a non-blank unique scenarioId and include it in the JUnit method name.
    - Use valid deterministic HTML containing exactly one element selected by rootSelector.
    - Ensure targetNodeName identifies at least one descendant reached by the policy.
    - Never target the selected root because removing a traversal root has different ownership semantics.
    - Include nested elements, siblings, text, comments, repeated targets, and empty elements across the suite.
    - Vary target position, tree depth, and width rather than changing only labels or text.
    - Do not use nulls, randomness, current time, scripts, external resources, or network access.
    - Verify that the source action is applied before naming the generated test.
    - Treat Count as an upper limit and generate as many distinct valid cases as practical.
  diversity:
    treeDepths: [1, 2, 3, 5, 8]
    siblingWidths: [1, 2, 4, 8]
    targetOccurrences: [1, 2, 3, 5]
    targetPositions: [first, middle, last]
    contentKinds: [elements, text, comments, empty-elements, mixed]
    actions: [CONTINUE, SKIP_CHILDREN, SKIP_ENTIRELY, REMOVE, STOP]
  scenarios:
    - id: CONTINUE_FULL_TRAVERSAL
      category: NORMAL
      description: Match target descendants and continue through their children and later siblings.
      preconditions:
        - Use FilterAction.CONTINUE and include a matching target with descendants.
      expectedSourceBehavior:
        - The action is applied and traversal visits the complete root subtree.
        - The final HTML is unchanged.
      targetCases: 6
      emptyOutputAllowed: false
    - id: SKIP_CHILDREN
      category: NORMAL
      description: Skip descendants of matching targets while continuing with later siblings.
      preconditions:
        - Use FilterAction.SKIP_CHILDREN and give every target a child.
        - Place a non-target sibling after a target.
      expectedSourceBehavior:
        - Target HEAD events occur but descendant events do not.
        - Target TAIL and later-sibling events occur.
      targetCases: 10
      emptyOutputAllowed: false
    - id: SKIP_ENTIRELY
      category: NORMAL
      description: Skip matching targets, their descendants, and their tail callbacks.
      preconditions:
        - Use FilterAction.SKIP_ENTIRELY and give every target a child.
        - Place a non-target sibling after a target.
      expectedSourceBehavior:
        - Target HEAD events occur, but target TAIL and descendant events do not.
        - Traversal continues with later siblings.
      targetCases: 10
      emptyOutputAllowed: false
    - id: REMOVE_SUBTREE
      category: EDGE
      description: Remove matching target subtrees while preserving unrelated branches.
      preconditions:
        - Use FilterAction.REMOVE and target non-root descendants.
        - Include unrelated siblings before and after a target.
      expectedSourceBehavior:
        - Matching target subtrees are absent from finalHtml.
        - Unrelated branches remain in finalHtml.
      targetCases: 12
      emptyOutputAllowed: false
    - id: STOP_TRAVERSAL
      category: BOUNDARY
      description: Stop traversal when the first matching target is reached.
      preconditions:
        - Use FilterAction.STOP and include nodes after the first target.
        - Vary whether the target occurs near the beginning, middle, or end.
      expectedSourceBehavior:
        - The terminal result is STOP and later nodes are not visited.
        - Exactly one STOP action is applied.
      targetCases: 12
      emptyOutputAllowed: false

