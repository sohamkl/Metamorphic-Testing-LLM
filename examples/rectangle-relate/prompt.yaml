TargetFunction: RectangleRelateCalculator.relate
SUTDescription: Rectangle spatial-relation classifier over Spatial4j. The target function receives a RectanglePairInput holding the bounds of two rectangles, builds a RectangleImpl for each in a geodetic context, and returns a RelateOutcome holding the spatial relation (CONTAINS, WITHIN, INTERSECTS or DISJOINT) plus whether the two rectangles were equal.

MRInput: the follow-up input is created by swapping the two rectangles, so the rectangle that was second becomes first
MROutput: the relation is transposed: CONTAINS becomes WITHIN and WITHIN becomes CONTAINS, while INTERSECTS and DISJOINT are unchanged; when the two rectangles are equal the relation is unchanged instead
MR: Swapping two shapes should transpose their spatial relation, as documented on Spatial4j's SpatialRelation.transpose().
InputDomain: Generate valid RectanglePairInput objects holding eight finite doubles: minX, maxX, minY, maxY for each of two rectangles. Longitudes must lie in -180 to 180 and latitudes in -90 to 90. For each rectangle minY must not exceed maxY; minX may exceed maxX, which denotes a rectangle crossing the antimeridian. Include disjoint pairs, partially overlapping pairs, one rectangle fully inside the other, identical rectangles, rectangles sharing only an edge, zero-width and zero-height rectangles, rectangles touching the poles at latitude 90 or -90, rectangles touching the antimeridian at longitude 180 or -180, and at least one pair where a rectangle crosses the antimeridian.

