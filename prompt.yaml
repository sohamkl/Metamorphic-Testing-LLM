# Ta4j Renko aggregation MR: positive scaling of prices and box size.
# Paths are relative to the MT-testing repository root because OpenaiRunner reads
# configuration using that root even though this prompt is stored in the Ta4j example.
SUTClassFile: examples/ta4j/src/main/java/mtllm/examples/ta4j/RenkoBarAggregatorSut.java
SUTSupportFiles:
  - examples/ta4j/src/main/java/mtllm/examples/ta4j/RenkoCaseFactory.java
SUTClasspath:
  - examples/ta4j/ta4j-core/target/classes
TargetFunction: public static List<Bar> RenkoBarAggregatorSut.aggregate(RenkoBarAggregatorSut.RenkoCase source)
SUTDescription: >-
  Converts chronological market bars into fixed-size Renko bricks based on
  close-price movement. The adapter makes the bars, box size, and reversal
  amount explicit in one RenkoCase input.

MRInput: >-
  the follow-up RenkoCase is created using the fixed positive scale factor k = 2;
  multiply every source bar's open, high, low, and close prices by k, multiply
  its monetary amount by k, and multiply the Renko boxSize by k, while preserving
  bar order, time period, begin and end timestamps, volume, trade count,
  reversalAmount, and Num implementation
MROutput: >-
  the source and follow-up executions produce the same number of Renko bricks in
  the same direction sequence and with identical timestamps, time periods,
  volumes, and trade counts; each follow-up brick's open, high, low, close, and
  monetary amount equals the corresponding source brick value multiplied by k = 2
MR: >-
  Scaling every market price, monetary amount, and the Renko box size by the same
  positive factor must preserve the Renko chart structure; only monetary output
  values should be scaled by that factor.

Count: 10
InputDomain: >-
  Generate deterministic source cases containing a positive finite boxSize, a
  positive reversalAmount (normally 2), and a non-null List<Bar>. Each list must
  contain at least two chronological, contiguous, evenly spaced time bars, using
  a consistent duration such as one minute. Every bar must have finite,
  non-null, positive OHLC prices satisfying low <= open and close <= high;
  non-negative volume, amount, and trade count; and the same Num implementation.
  Keep prices and scaled values within a practical range, for example 1 to
  1000000. Include cases that produce no bricks, exactly one brick, multiple
  upward bricks, multiple downward bricks, residual movement smaller than one
  box, an exact box-size boundary, and confirmed reversals. Do not use null bars,
  uneven intervals, non-contiguous timestamps, NaN prices, infinite prices,
  zero or negative box sizes, or invalid OHLC ordering. Treat Count as the
  maximum number of source cases, not a required exact count. Construct source
  inputs with the public RenkoBarAggregatorSut.RenkoCase record; do not define a
  separate test-local case type. Use a fixed Instant literal for every test and
  derive each bar's begin and end times from that same value. Never use
  Instant.now() or separate clock reads.

