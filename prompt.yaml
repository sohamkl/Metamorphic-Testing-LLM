TargetFunction: public static JodaMoneyRoundTripSut.ConversionResult convert(JodaMoneyRoundTripSut.ConversionCase source)
SUTDescription: Joda-Money BigMoney currency conversion adapter. The target function receives a ConversionCase containing a BigMoney amount, a positive BigDecimal conversion rate, and a different target CurrencyUnit, then calls BigMoney.convertedTo and returns both the input amount and converted amount.

MRInput: the follow-up input is created by converting the source BigMoney amount from its original currency into the target currency using rate r, then using that converted amount with the original currency and the inverse rate 1/r
MROutput: the follow-up converted amount, which is the amount recovered after converting back, must be within one minor unit of the original source BigMoney amount
MR: Converting a BigMoney amount from currency A to a different currency B using a strictly positive rate r, then converting the result back from B to A using the inverse rate 1/r, should recover the original amount within one minor unit of currency A.

Count: 30
InputDomain: Generate non-null JodaMoneyRoundTripSut.ConversionCase objects. The money field must be a non-null org.joda.money.BigMoney with a real CurrencyUnit such as USD, EUR, GBP, JPY, CHF, AUD, or CAD. The targetCurrency must be non-null and different from money.getCurrencyUnit(). The rate must be a non-null BigDecimal strictly greater than zero because the MR computes 1/r; negative rates are rejected by BigMoney, and zero is accepted by BigMoney but invalid for this MR because it has no inverse. Keep rates in a practical range such as 0.0001 to 10000 and keep absolute source amounts at or below 1000000 to avoid false failures caused by finite inverse-rate precision. Include 2-decimal currencies, 0-decimal currencies such as JPY, integer amounts, fractional amounts, very small valid rates, rates greater than 1, rates less than 1, and negative monetary amounts.
