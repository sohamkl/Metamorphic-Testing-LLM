# Final experiment run manifest.
# Paths are relative to the MT-testing repository root.

models:
  - id: terra
    openaiModel: gpt-5.6-terra
  - id: sol
    openaiModel: gpt-5.6-sol
  - id: luna
    openaiModel: gpt-5.6-luna

modes:
  - dev
  - nl

inputGenerators:
  - id: llm
    configValue: LLM
    modelDependent: true
    modes: [dev, nl]
  - id: new-hybrid
    configValue: NEW_HYBRID
    modelDependent: true
    modes: [dev, nl]
  - id: hybrid
    configValue: HYBRID
    modelDependent: true
    modes: [dev, nl]
  - id: randoop
    configValue: RANDOOP
    modelDependent: false
    modes: [dev]

defaults:
  serial: true
  runsPerCombination: 1
  promptArchiveRoot: final-experiment/final-experiment-sut-prompts
  metadataRoot: final-experiment/final-experiment-run-metadata
  pitReportArchiveRoot: final-experiment/final-experiment-pit-reports
  envFile: .env
  modelEnvKey: OPENAI_MODEL
  generationCommandTemplate: >-
    mvn -P{generationProfiles} -DskipTests compile exec:java
    -Dexec.mainClass=mtllm.OpenaiRunner
    -Dexec.args="{prompt}"
  testCommandTemplate: >-
    mvn -P{generationProfiles} -Dtest={passingTestClass} test
  pitCommandTemplate: >-
    mvn -P{generationProfiles},{pitProfile}
    process-classes test-compile
    org.pitest:pitest-maven:mutationCoverage

runs:
  - id: the-algorithms-java__matrix-transpose
    sut: the-algorithms-java
    target: MatrixRank
    mr: matrix-transpose
    outputSlug: matrix-transpose
    javaVersion: 21
    generationProfiles:
      - the-algorithms-java
    prompts:
      dev: final-experiment/final-experiment-sut-prompts/the-algorithms-java/MatrixRank/prompt-matrix-transpose-dev.yaml
      nl: final-experiment/final-experiment-sut-prompts/the-algorithms-java/MatrixRank/prompt-matrix-transpose-nl.yaml
    generatedOutputRoot: examples/the-algorithms-java/mt-testing/generated/matrix-rank-transpose
    generatedClassName: GeneratedTheAlgorithmsMatrixRankTransposeMetamorphicTest
    passingTestClass: GeneratedTheAlgorithmsMatrixRankTransposeMetamorphicPassingTest
    pit:
      status: ready
      profile: pitest-the-algorithms-java-matrix-rank
      reportDir: target/pit-reports/the-algorithms-java-matrix-rank

  - id: jsoup__cleaner-idempotence
    sut: jsoup
    target: CleanJsoup
    mr: cleaner-idempotence
    outputSlug: cleaner-idempotence
    javaVersion: 8
    generationProfiles:
      - jsoup
    prompts:
      dev: final-experiment/final-experiment-sut-prompts/jsoup/CleanJsoup/prompt-cleaner-idempotence-dev.yaml
      nl: final-experiment/final-experiment-sut-prompts/jsoup/CleanJsoup/prompt-cleaner-idempotence-nl.yaml
    generatedOutputRoot: examples/jsoup/mt-testing/generated/cleaner-idempotence
    generatedClassName: GeneratedJsoupCleanerIdempotenceMetamorphicTest
    passingTestClass: GeneratedJsoupCleanerIdempotenceMetamorphicPassingTest
    pit:
      status: ready
      profile: pitest-jsoup-cleaner
      reportDir: target/pit-reports/jsoup-cleaner-idempotence

  - id: jsoup__node-filter-clone
    sut: jsoup
    target: NodeTraversorFilter
    mr: node-filter-clone
    outputSlug: node-filter-clone
    javaVersion: 8
    generationProfiles:
      - jsoup
    prompts:
      dev: final-experiment/final-experiment-sut-prompts/jsoup/NodeTraversorFilter/prompt-node-filter-clone-dev.yaml
      nl: final-experiment/final-experiment-sut-prompts/jsoup/NodeTraversorFilter/prompt-node-filter-clone-nl.yaml
    generatedOutputRoot: examples/jsoup/mt-testing/generated/node-filter-clone
    generatedClassName: GeneratedNodeTraversorFilterCloneMetamorphicTest
    passingTestClass: GeneratedNodeTraversorFilterCloneMetamorphicPassingTest
    pit:
      status: ready
      profile: pitest-jsoup
      reportDir: target/pit-reports/jsoup-node-traversor

  - id: ta4j__slope-change
    sut: ta4j
    target: SlopeChangeSwingDetector
    mr: slope-change
    outputSlug: slope-change
    javaVersion: 25
    generationProfiles:
      - ta4j
    prompts:
      dev: final-experiment/final-experiment-sut-prompts/ta4j/SlopeChangeSwingDetector/prompt-slope-change-dev.yaml
      nl: final-experiment/final-experiment-sut-prompts/ta4j/SlopeChangeSwingDetector/prompt-slope-change-nl.yaml
    generatedOutputRoot: examples/ta4j/generated/slope-change-swing
    generatedClassName: GeneratedSlopeChangeSwingDetectorMetamorphicTest
    passingTestClass: GeneratedSlopeChangeSwingDetectorMetamorphicPassingTest
    pit:
      status: ready
      profile: pitest
      reportDir: target/pit-reports

  - id: ta4j__renko-scaling
    sut: ta4j
    target: RenkoBarAggregator
    mr: renko-scaling
    outputSlug: renko-scaling
    javaVersion: 25
    generationProfiles:
      - ta4j
    prompts:
      dev: final-experiment/final-experiment-sut-prompts/ta4j/RenkoBarAggregator/prompt-renko-scaling-dev.yaml
      nl: final-experiment/final-experiment-sut-prompts/ta4j/RenkoBarAggregator/prompt-renko-scaling-nl.yaml
    generatedOutputRoot: examples/ta4j/generated/renko
    generatedClassName: GeneratedRenkoBarAggregatorMetamorphicTest
    passingTestClass: GeneratedRenkoBarAggregatorMetamorphicPassingTest
    pit:
      status: ready
      profile: pitest-ta4j-renko
      reportDir: target/pit-reports
