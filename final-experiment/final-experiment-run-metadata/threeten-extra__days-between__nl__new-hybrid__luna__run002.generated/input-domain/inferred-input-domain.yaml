InputDomain:
  summary: Domain of non-null, day-compatible Temporal pairs whose follow-up values
    are obtained by adding exactly 37 days to both inputs, with successful cases covering
    zero, positive, negative, whole-day, boundary, and temporal-type paths.
  globalConstraints:
  - Each source input is a non-null Temporal whose DAYS.between operation is defined
    for the pair.
  - The follow-up is formed by applying plus 37 days to both original temporals, and
    both shifted temporals must remain representable.
  - Successful-count scenarios must have a DAYS.between result in the int range because
    the source applies Math.toIntExact before constructing Days.
  - The primary relation oracle compares startResult.getAmount() with followUpResult.getAmount().
  - Use date-based temporals, LocalDateTime values with unchanged local time, or fixed-offset
    OffsetDateTime values; variable-zone temporal pairs crossing offset transitions
    are excluded because shifting by 37 calendar days can change the elapsed whole-day
    calculation even when both endpoints are shifted equally.
  - Null inputs and temporals for which DAYS.between is unsupported are excluded because
    the supplied relation requires two shiftable, executable source inputs and does
    not request invalid-input behavior.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - fixed-offset OffsetDateTime
    direction:
    - zero
    - positive
    - negative
    resultMagnitude:
    - '0'
    - '1'
    - greater-than-1
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    calendarPosition:
    - ordinary-date
    - month-boundary
    - year-boundary
    - leap-day-boundary
    - near-LocalDate.MIN
    - near-LocalDate.MAX
    followUpDistance:
    - exactly-37-days-shifted
    sourceSentinelPath:
    - Days.ZERO
    - Days.ONE
    - new-Days-value
  scenarios:
  - id: LOCAL_DATE_ZERO_GAP
    category: NORMAL
    description: Identical LocalDate start and end produce a zero-day result.
    preconditions:
    - startDateInclusive is LocalDate 2024-01-15.
    - endDateExclusive is LocalDate 2024-01-15.
    - The follow-up pair is LocalDate 2024-02-21 and LocalDate 2024-02-21, respectively.
    expectedSourceBehavior:
    - DAYS.between returns 0 for the original pair.
    - getAmount() returns 0 and therefore exercises Days.ZERO.
    - The follow-up getAmount() is also 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_FORWARD
    category: NORMAL
    description: Consecutive LocalDate values produce the one-day singleton result.
    preconditions:
    - startDateInclusive is LocalDate 2024-01-15.
    - endDateExclusive is LocalDate 2024-01-16.
    - The follow-up pair is LocalDate 2024-02-21 and LocalDate 2024-02-22.
    expectedSourceBehavior:
    - DAYS.between returns 1.
    - getAmount() returns 1 and exercises Days.ONE.
    - The follow-up getAmount() remains 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_BACKWARD
    category: NORMAL
    description: Consecutive LocalDate values in reverse order produce a negative
      one-day result.
    preconditions:
    - startDateInclusive is LocalDate 2024-01-16.
    - endDateExclusive is LocalDate 2024-01-15.
    - The follow-up pair is LocalDate 2024-02-22 and LocalDate 2024-02-21.
    expectedSourceBehavior:
    - DAYS.between returns -1.
    - getAmount() returns -1 and the result is negative.
    - The follow-up getAmount() remains -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_POSITIVE_MULTI_DAY
    category: NORMAL
    description: An ordinary positive LocalDate interval greater than one day.
    preconditions:
    - startDateInclusive is LocalDate 2024-03-10.
    - endDateExclusive is LocalDate 2024-03-17.
    - The follow-up pair is LocalDate 2024-04-16 and LocalDate 2024-04-23.
    expectedSourceBehavior:
    - DAYS.between returns 7.
    - getAmount() returns 7 through the non-singleton Days construction path.
    - The follow-up getAmount() is 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_MULTI_DAY
    category: NORMAL
    description: An ordinary negative LocalDate interval with magnitude greater than
      one day.
    preconditions:
    - startDateInclusive is LocalDate 2024-03-17.
    - endDateExclusive is LocalDate 2024-03-10.
    - The follow-up pair is LocalDate 2024-04-23 and LocalDate 2024-04-16.
    expectedSourceBehavior:
    - DAYS.between returns -7.
    - getAmount() returns -7 and isNegative() would be true.
    - The follow-up getAmount() is -7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_EXACT_SHIFT_DISTANCE
    category: BOUNDARY
    description: The original gap equals the metamorphic shift distance itself.
    preconditions:
    - startDateInclusive is LocalDate 2024-01-01.
    - endDateExclusive is LocalDate 2024-02-07, exactly 37 days later.
    - The follow-up pair is LocalDate 2024-02-07 and LocalDate 2024-03-15.
    expectedSourceBehavior:
    - Both invocations return getAmount() equal to 37.
    - The result is nonzero and uses the ordinary Days value path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: A positive interval crosses from the end of one month into the next.
    preconditions:
    - startDateInclusive is LocalDate 2023-01-31.
    - endDateExclusive is LocalDate 2023-02-02.
    - The follow-up pair is LocalDate 2023-03-09 and LocalDate 2023-03-11.
    expectedSourceBehavior:
    - DAYS.between returns 2 for both pairs.
    - getAmount() is 2 for the original and follow-up results.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: A positive interval crosses the end of a calendar year.
    preconditions:
    - startDateInclusive is LocalDate 2023-12-30.
    - endDateExclusive is LocalDate 2024-01-02.
    - The follow-up pair is LocalDate 2024-02-05 and LocalDate 2024-02-08.
    expectedSourceBehavior:
    - DAYS.between returns 3 for both pairs.
    - getAmount() remains 3 after the 37-day shift.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_BOUNDARY
    category: BOUNDARY
    description: A positive interval includes the leap day in a leap year.
    preconditions:
    - startDateInclusive is LocalDate 2024-02-28.
    - endDateExclusive is LocalDate 2024-03-02.
    - The follow-up pair is LocalDate 2024-04-05 and LocalDate 2024-04-08.
    expectedSourceBehavior:
    - DAYS.between returns 3, counting February 29.
    - Both getAmount() values are 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_REPRESENTABLE_SHIFT
    category: EDGE
    description: The original pair is near LocalDate.MIN while both endpoints still
      support the 37-day follow-up.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is LocalDate.MIN.plusDays(100).
    - The follow-up pair is LocalDate.MIN.plusDays(37) and LocalDate.MIN.plusDays(137).
    expectedSourceBehavior:
    - DAYS.between returns 100 for both pairs.
    - getAmount() remains 100 without date-range overflow.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_FOLLOWUP_BOUNDARY
    category: EDGE
    description: The end date is at the greatest date that can still be shifted forward
      by 37 days.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(100).
    - endDateExclusive is LocalDate.MAX.minusDays(37).
    - The follow-up pair is LocalDate.MAX.minusDays(63) and LocalDate.MAX.
    expectedSourceBehavior:
    - DAYS.between returns 63 for both pairs.
    - getAmount() remains 63, and the shifted end is exactly LocalDate.MAX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAXIMUM_RESULT
    category: EDGE
    description: The day gap is exactly Integer.MAX_VALUE while the 37-day follow-up
      remains representable.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is LocalDate.MIN.plusDays(2147483647).
    - The follow-up pair is LocalDate.MIN.plusDays(37) and LocalDate.MIN.plusDays(2147483684).
    expectedSourceBehavior:
    - DAYS.between returns Integer.MAX_VALUE for both pairs.
    - Math.toIntExact succeeds at the upper int boundary.
    - Both getAmount() values are Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MINIMUM_RESULT
    category: EDGE
    description: The day gap is exactly Integer.MIN_VALUE in the negative direction.
    preconditions:
    - startDateInclusive is LocalDate.MIN.plusDays(2147483648).
    - endDateExclusive is LocalDate.MIN.
    - The follow-up pair is LocalDate.MIN.plusDays(2147483685) and LocalDate.MIN.plusDays(37).
    expectedSourceBehavior:
    - DAYS.between returns Integer.MIN_VALUE for both pairs.
    - Math.toIntExact succeeds at the lower int boundary.
    - Both getAmount() values are Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_RESULT_INT_OVERFLOW
    category: EDGE
    description: The temporals are valid and shiftable, but their gap is one day beyond
      the positive int result range.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is LocalDate.MIN.plusDays(2147483648).
    - The follow-up pair is LocalDate.MIN.plusDays(37) and LocalDate.MIN.plusDays(2147483685).
    expectedSourceBehavior:
    - DAYS.between produces 2147483648.
    - Math.toIntExact throws ArithmeticException before a Days result is returned.
    - The follow-up invocation also throws ArithmeticException, so no getAmount comparison
      is made.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_WHOLE_DAY_TRUNCATION
    category: NORMAL
    description: LocalDateTime endpoints have a sub-day remainder, so the returned
      value is the whole-day count.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-01-01T12:00.
    - endDateExclusive is LocalDateTime 2024-01-03T11:00.
    - The follow-up pair is LocalDateTime 2024-02-07T12:00 and LocalDateTime 2024-02-09T11:00.
    expectedSourceBehavior:
    - DAYS.between returns 1 rather than 2 because only one whole 24-hour day separates
      the endpoints.
    - Both getAmount() values are 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY_INTERVAL
    category: NORMAL
    description: LocalDateTime endpoints are separated by an exact whole number of
      days at the same local time.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-06-01T08:30.
    - endDateExclusive is LocalDateTime 2024-06-04T08:30.
    - The follow-up pair is LocalDateTime 2024-07-08T08:30 and LocalDateTime 2024-07-11T08:30.
    expectedSourceBehavior:
    - DAYS.between returns 3 for both pairs.
    - getAmount() remains 3 after adding 37 days to both LocalDateTime values.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIXED_OFFSET_DATETIME_INTERVAL
    category: NORMAL
    description: Fixed-offset OffsetDateTime values test a non-LocalDate Temporal
      while preserving the offset during the 37-day shift.
    preconditions:
    - startDateInclusive is OffsetDateTime 2024-01-01T10:00 plus offset +02:00.
    - endDateExclusive is OffsetDateTime 2024-01-05T10:00 plus offset +02:00.
    - The follow-up pair is OffsetDateTime 2024-02-07T10:00 plus offset +02:00 and
      OffsetDateTime 2024-02-11T10:00 plus offset +02:00.
    expectedSourceBehavior:
    - DAYS.between returns 4 for both pairs.
    - Both getAmount() values are 4.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIXED_OFFSET_DATETIME_NEGATIVE_INTERVAL
    category: NORMAL
    description: Fixed-offset OffsetDateTime values in reverse order test a negative
      non-date-only result.
    preconditions:
    - startDateInclusive is OffsetDateTime 2024-05-10T18:00 plus offset -05:00.
    - endDateExclusive is OffsetDateTime 2024-05-07T18:00 plus offset -05:00.
    - The follow-up pair is OffsetDateTime 2024-06-16T18:00 plus offset -05:00 and
      OffsetDateTime 2024-06-13T18:00 plus offset -05:00.
    expectedSourceBehavior:
    - DAYS.between returns -3 for both pairs.
    - getAmount() remains -3 and is negative for both invocations.
    targetCases: 1
    emptyOutputAllowed: false
