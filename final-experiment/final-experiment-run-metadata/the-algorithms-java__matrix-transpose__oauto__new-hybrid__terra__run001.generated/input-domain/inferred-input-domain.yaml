InputDomain:
  summary: Non-null, non-empty rectangular double matrices spanning row/column shapes,
    exact and threshold-sensitive finite values, elimination patterns, and Java double
    special values; each source is transposed by the supplied follow-up generator.
  globalConstraints:
  - Source is a non-null double[][] with rows >= 1 and columns in row 0 >= 1.
  - Every source row is non-null and has exactly source[0].length elements, so both
    computeRank and generateFollowUp can index every declared cell.
  - Each scenario's targetCases are concrete matrices satisfying its stated dimensions
    and entry conditions; total targetCases is 49.
  - No invalid structural inputs are included because the supplied metamorphic relation
    dereferences source[0] and assumes a rectangular matrix rather than defining an
    invalid-input relation.
  diversity:
    shape:
    - distinct
    - matrix dimensions and orientation
    - 1x1, 1xN, Nx1, square, tall, wide
    rankStructure:
    - distinct
    - expected source rank relative to min(rows, columns)
    - 0, 1, intermediate, full row rank, full column rank
    pivotPath:
    - distinct
    - pivot availability and selected row/column positions
    - no pivot sentinel, first-row pivot, later-row pivot, skipped leading column,
      skipped interior column, final-column pivot
    numericRegime:
    - distinct
    - entry magnitude and IEEE-754 classification
    - zero, signed zero, finite normal, below EPSILON, exactly EPSILON, above EPSILON,
      extreme finite, NaN, positive infinity, negative infinity
    eliminationEffect:
    - distinct
    - whether elimination leaves a usable later pivot
    - no elimination needed, dependent rows, cancellation below EPSILON, residual
      at or above EPSILON, non-finite propagation
  scenarios:
  - id: SINGLE_ZERO_SENTINEL
    category: BOUNDARY
    description: A 1x1 zero matrix exercises the no-pivot sentinel result in its only
      column.
    preconditions:
    - Matrix is exactly [[0.0]].
    expectedSourceBehavior:
    - computeRank returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_NONZERO
    category: BOUNDARY
    description: A 1x1 matrix with a nonzero finite entry creates one pivot with no
      trailing normalization columns.
    preconditions:
    - Matrix dimensions are exactly 1x1.
    - Sole entry is finite and abs(entry) >= 1.0E-10.
    - Use one positive and one negative entry across the cases.
    expectedSourceBehavior:
    - computeRank returns 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_RECTANGULAR_MATRICES
    category: NORMAL
    description: All-zero non-square matrices cause every scanned column to have no
      suitable pivot row.
    preconditions:
    - Every entry is 0.0.
    - Use one tall shape with rows > columns and one wide shape with columns > rows.
    expectedSourceBehavior:
    - computeRank returns 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FULL_COLUMN_RANK_TALL
    category: NORMAL
    description: Tall finite matrices with independent columns exercise full rank
      when rows exceed columns.
    preconditions:
    - Matrix has rows > columns >= 2.
    - Matrix contains a columns-by-columns identity block, with any additional rows
      all 0.0.
    expectedSourceBehavior:
    - computeRank returns the number of columns.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FULL_ROW_RANK_WIDE
    category: NORMAL
    description: Wide finite matrices with independent rows exercise full rank when
      columns exceed rows.
    preconditions:
    - Matrix has columns > rows >= 2.
    - Matrix contains a rows-by-rows identity block, with any additional columns all
      0.0.
    expectedSourceBehavior:
    - computeRank returns the number of rows.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SQUARE_DIAGONAL_FULL_RANK
    category: NORMAL
    description: Square diagonal matrices force pivots through successive columns,
      including a pivot in the final column.
    preconditions:
    - Matrix is diagonal with dimension 2x2 or larger.
    - Every diagonal entry is finite and has absolute value >= 1.0E-10.
    - Every off-diagonal entry is 0.0.
    expectedSourceBehavior:
    - computeRank returns the matrix dimension.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RANK_ONE_MULTIPLE_ROWS
    category: NORMAL
    description: Nonzero rows that are finite scalar multiples of one base row require
      elimination and leave only one marked pivot row.
    preconditions:
    - Matrix has at least 2 rows and 2 columns.
    - At least one row has an entry with absolute value >= 1.0E-10.
    - Every nonzero row is a finite scalar multiple of the same base row.
    expectedSourceBehavior:
    - computeRank returns 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INTERMEDIATE_RANK_DEPENDENCY
    category: NORMAL
    description: Matrices with both independent and dependent rows exercise an intermediate
      rank rather than zero, one, or full rank.
    preconditions:
    - Matrix has at least 3 rows and 3 columns.
    - Construct exactly two independent finite rows and make every remaining row their
      finite linear combination.
    - All intended pivot magnitudes and nonzero residuals are at least 1.0E-10 in
      absolute value.
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LEADING_ZERO_COLUMN
    category: EDGE
    description: A leading all-zero column is skipped before later columns produce
      pivots.
    preconditions:
    - Matrix has at least 2 columns.
    - Column 0 is entirely 0.0.
    - Remaining columns contain an identity block of size 1 or greater with finite
      diagonal entries of absolute value >= 1.0E-10.
    expectedSourceBehavior:
    - computeRank equals the size of the identity block in the remaining columns.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INTERIOR_ZERO_COLUMN
    category: EDGE
    description: An all-zero interior column is skipped between successful pivot columns.
    preconditions:
    - Matrix has at least 3 columns.
    - At least one nonzero pivot column occurs before and after an entirely 0.0 interior
      column.
    - Nonzero pivot columns form a finite diagonal or identity pattern with pivot
      magnitudes >= 1.0E-10.
    expectedSourceBehavior:
    - computeRank equals the number of nonzero pivot columns.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LATER_ROW_PIVOT_SELECTION
    category: EDGE
    description: The first usable pivot in a column occurs below one or more unmarked
      rows whose entry in that column is zero.
    preconditions:
    - Matrix has at least 2 rows and 2 columns.
    - In column 0, row 0 is 0.0 and a later row has a finite entry with absolute value
      >= 1.0E-10.
    - Include a later independent pivot column or make all other rows dependent, as
      specified by the concrete case.
    expectedSourceBehavior:
    - computeRank matches the explicitly constructed number of independent rows.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MARKED_ROW_SKIPPED_ON_LATER_COLUMNS
    category: EDGE
    description: A row selected as an early pivot remains nonzero in later columns
      but must not be selected again because it is marked.
    preconditions:
    - Matrix has at least 2 rows and 2 columns.
    - Row 0 has finite nonzero entries in columns 0 and 1.
    - Row 1 has 0.0 in column 0 and a finite value in column 1 that is independent
      after elimination.
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NONUNIT_PIVOT_NORMALIZATION
    category: NORMAL
    description: Finite nonunit pivot values require normalizePivotRow to divide trailing
      values before elimination.
    preconditions:
    - Matrix has at least 2 columns.
    - At least one selected pivot is finite, nonzero, and not equal to 1.0 or -1.0.
    - Construct a known finite rank-2 matrix whose later pivot remains at absolute
      value >= 1.0E-10 after elimination.
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ELIMINATION_REQUIRED_FOR_DEPENDENCE
    category: NORMAL
    description: Multiple rows have nonzero values in the same pivot column and elimination
      must remove their later independent-looking entries.
    preconditions:
    - Matrix has at least 2 rows and 2 columns.
    - Every row is a finite scalar multiple of one nonzero base row.
    - At least two rows have a first-column entry with absolute value >= 1.0E-10.
    expectedSourceBehavior:
    - computeRank returns 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SINGLE_ROW_MATRICES
    category: BOUNDARY
    description: One-row matrices test transpose-changing orientation while allowing
      either the no-pivot or one-pivot result.
    preconditions:
    - Matrix has exactly 1 row and at least 2 columns.
    - One case has every entry 0.0; one case has at least one finite entry with absolute
      value >= 1.0E-10.
    expectedSourceBehavior:
    - computeRank returns 0 for the all-zero case and 1 for the nonzero case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SINGLE_COLUMN_MATRICES
    category: BOUNDARY
    description: One-column matrices test the single scanned column with both absent
      and present pivots.
    preconditions:
    - Matrix has at least 2 rows and exactly 1 column.
    - One case has every entry 0.0; one case has at least one finite entry with absolute
      value >= 1.0E-10.
    expectedSourceBehavior:
    - computeRank returns 0 for the all-zero case and 1 for the nonzero case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BELOW_EPSILON_ENTRIES
    category: BOUNDARY
    description: Entries strictly below the isZero threshold are treated as zero during
      pivot search.
    preconditions:
    - Every entry is finite and has absolute value strictly less than 1.0E-10.
    - Include positive and negative sub-threshold values.
    expectedSourceBehavior:
    - computeRank returns 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_EPSILON_PIVOTS
    category: BOUNDARY
    description: Values whose absolute value is exactly EPSILON are not zero because
      isZero uses a strict less-than comparison.
    preconditions:
    - Matrix is diagonal or 1xN/Nx1 with intended nonzero entries exactly 1.0E-10
      or -1.0E-10.
    - All other entries are 0.0.
    expectedSourceBehavior:
    - computeRank equals the number of intended threshold-valued pivots.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ELIMINATION_RESIDUAL_BELOW_EPSILON
    category: BOUNDARY
    description: Elimination produces a later residual strictly below EPSILON, preventing
      a later pivot.
    preconditions:
    - Matrix is [[1.0, 1.0], [1.0, 1.0 + d]].
    - d is a positive binary power strictly below 1.0E-10, such as Math.scalb(1.0,
      -35).
    expectedSourceBehavior:
    - computeRank returns 1 because the post-elimination second-column residual is
      treated as zero.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ELIMINATION_RESIDUAL_ABOVE_EPSILON
    category: BOUNDARY
    description: Elimination produces a later residual above EPSILON, allowing a second
      pivot.
    preconditions:
    - Matrix is [[1.0, 1.0], [1.0, 1.0 + d]].
    - d is a positive binary power greater than 1.0E-10, such as Math.scalb(1.0, -33).
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_AND_SIGNED_ZERO_VALUES
    category: EDGE
    description: Negative pivots and negative zero exercise Math.abs-based zero classification.
    preconditions:
    - One case uses a diagonal matrix with negative finite diagonal entries whose
      absolute values are >= 1.0E-10.
    - One case uses only 0.0 and -0.0 entries.
    expectedSourceBehavior:
    - computeRank equals the diagonal dimension for the negative-pivot case and 0
      for the signed-zero case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXTREME_FINITE_MAGNITUDES
    category: EDGE
    description: Finite values near the representable extremes exercise normalization
      without requiring non-finite input entries.
    preconditions:
    - Matrix is diagonal with dimension at least 2.
    - Use finite nonzero diagonal entries including a very large value such as Double.MAX_VALUE
      and a moderate finite value.
    - Do not use entries with absolute value below 1.0E-10.
    expectedSourceBehavior:
    - computeRank equals the diagonal dimension.
    targetCases: 2
    emptyOutputAllowed: false
  - id: TINY_FINITE_VALUES
    category: EDGE
    description: Representable finite values far below EPSILON, including subnormal
      values, follow the zero-classification path.
    preconditions:
    - Every entry is finite and nonzero but has absolute value strictly below 1.0E-10.
    - Include Double.MIN_VALUE in one case and another positive subnormal or very
      small normal value in the other.
    expectedSourceBehavior:
    - computeRank returns 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NAN_ENTRIES
    category: EDGE
    description: NaN is not classified as zero by Math.abs(value) < EPSILON and can
      therefore be selected as a pivot.
    preconditions:
    - One case is a 2x3 matrix containing NaN in every entry.
    - One case is [[NaN, 0.0], [0.0, 0.0]].
    expectedSourceBehavior:
    - computeRank returns 2 for the all-NaN 2x3 case.
    - computeRank returns 1 for the mixed NaN/zero case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INFINITE_ENTRIES
    category: EDGE
    description: Infinite values are not classified as zero and exercise division
      and elimination involving infinities.
    preconditions:
    - One case is [[Double.POSITIVE_INFINITY, 0.0], [0.0, 1.0]].
    - One case is [[Double.POSITIVE_INFINITY, 1.0], [1.0, 0.0]].
    expectedSourceBehavior:
    - computeRank returns 2 for the diagonal-infinity case.
    - computeRank returns 1 for the second case after the normalized infinite pivot
      yields a zero trailing pivot candidate.
    targetCases: 2
    emptyOutputAllowed: false
