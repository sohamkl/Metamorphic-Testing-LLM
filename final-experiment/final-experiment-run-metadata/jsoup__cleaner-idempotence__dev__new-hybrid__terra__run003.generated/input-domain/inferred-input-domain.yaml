InputDomain:
  summary: Non-null HTML body fragments cleaned with non-null base-URI strings and
    each discovered Safelist factory or constructor result; cases emphasize parser
    normalization, allowed-content retention, disallowed markup removal, URL handling,
    malformed fragments, and empty-output paths under the idempotence relation.
  globalConstraints:
  - bodyHtml, baseUri, and safelist must each be non-null because generateFollowUp
    requires all three with Objects.requireNonNull.
  - Each source case uses the same non-null baseUri and same non-null Safelist instance
    for its follow-up invocation, as generated by the supplied relation.
  - bodyHtml is treated as an HTML body fragment, not as a required complete HTML
    document, because Jsoup.clean parses it through parseBodyFragment.
  - '{No null-input cases are included=the metamorphic relation explicitly rejects
    null before invoking the target, so they cannot produce a source/follow-up output
    pair for assertRelation.}'
  diversity:
    safelistConstruction:
    - 6 distinct values
    - Safelist.none(), simpleText(), basic(), basicWithImages(), relaxed(), and new
      Safelist()
    - all discovered static Safelist factories plus the public no-argument constructor
    baseUriState:
    - 3 distinct values
    - '"", "https://example.test/root/page.html", and "https://example.test/root/sub/"'
    - empty versus two non-empty absolute HTTP(S) base URIs
    bodyFragmentShape:
    - 13 distinct values
    - empty, text-only, entities, allowed markup, disallowed markup, nested mixed
      markup, URL attributes, image attributes, malformed tags, comments, declarations,
      raw-text-like content, and whitespace
    - each scenario has a structurally distinct bodyHtml condition
    sanitizerOutcome:
    - 4 distinct values
    - retained text, normalized retained markup, removed unsafe structure or attribute,
      and empty output
    - expected observable source-output class
  scenarios:
  - id: EMPTY_FRAGMENT_NONE
    category: BOUNDARY
    description: Empty body fragment cleaned with the text-only Safelist.none policy.
    preconditions:
    - bodyHtml equals "".
    - baseUri equals "".
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Source output is empty.
    - The follow-up receives the empty source output and must produce the same empty
      string.
    targetCases: 1
    emptyOutputAllowed: true
  - id: WHITESPACE_ONLY_NONE
    category: BOUNDARY
    description: Fragment consisting only of ASCII spaces, tab, and newline under
      Safelist.none.
    preconditions:
    - bodyHtml contains no HTML tag delimiters and consists only of " \t\n ".
    - baseUri equals "".
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Source output contains no HTML elements because Safelist.none permits no elements.
    - This case exercises parser/output whitespace normalization before the idempotence
      follow-up.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PLAIN_TEXT_NONE
    category: NORMAL
    description: Ordinary visible text with no markup under Safelist.none.
    preconditions:
    - bodyHtml equals "plain visible text".
    - baseUri equals "".
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Source output retains the visible text.
    - Source output is non-empty.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TEXT_WITH_ENTITY_NONE
    category: EDGE
    description: Text containing an HTML entity and literal ampersand under Safelist.none.
    preconditions:
    - bodyHtml equals "5 &lt; 6 &amp; 7".
    - baseUri equals "".
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Source output is non-empty and represents the text as HTML output.
    - Entity parsing and output escaping occur before the follow-up cleaning pass.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DISALLOWED_TAG_WITH_VISIBLE_TEXT_NONE
    category: NORMAL
    description: Visible text enclosed by a tag that Safelist.none does not permit.
    preconditions:
    - bodyHtml equals "<p>retained text</p>".
    - baseUri equals "".
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - The source output contains "retained text".
    - The source output contains no permitted HTML element from the input because
      Safelist.none permits no elements.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMENT_AND_TEXT_NONE
    category: EDGE
    description: HTML comment adjacent to visible text under Safelist.none.
    preconditions:
    - bodyHtml equals "<!-- comment --><p>visible</p>".
    - baseUri equals "".
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Source output contains the visible text.
    - The comment and disallowed paragraph structure do not provide a permitted element
      path under Safelist.none.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SCRIPT_ONLY_NONE
    category: EDGE
    description: Fragment containing only script markup under Safelist.none.
    preconditions:
    - bodyHtml equals "<script>alert(1)</script>".
    - baseUri equals "".
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Source output contains no permitted HTML element.
    - Empty output is permitted because the fragment has no independent visible text
      outside unsafe markup.
    targetCases: 1
    emptyOutputAllowed: true
  - id: SIMPLE_TEXT_FORMATTING
    category: NORMAL
    description: Nested simple formatting tags with visible text using Safelist.simpleText.
    preconditions:
    - bodyHtml equals "<b>bold <em>emphasized</em></b>".
    - baseUri equals "".
    - safelist is Safelist.simpleText().
    expectedSourceBehavior:
    - Source output is non-empty and contains both visible words "bold" and "emphasized".
    - The case exercises nested-element cleaning and serializer normalization.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_LINK_REMOVAL
    category: NORMAL
    description: Anchor markup with a URL attribute under Safelist.simpleText.
    preconditions:
    - bodyHtml equals "<a href=\"https://example.test/path\">link text</a>".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.simpleText().
    expectedSourceBehavior:
    - Source output is non-empty and contains "link text".
    - The case distinguishes visible anchor content from any unsupported element or
      attribute handling by the simple-text policy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_ALLOWED_LINK_ABSOLUTE_HTTP
    category: NORMAL
    description: Basic Safelist with an anchor whose href is an absolute HTTPS URL.
    preconditions:
    - bodyHtml equals "<a href=\"https://example.test/docs?q=1\">docs</a>".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "docs".
    - The case reaches URL-attribute processing with a non-empty base URI and an absolute
      HTTPS value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_LINK_RELATIVE_WITH_BASE
    category: NORMAL
    description: Basic Safelist with a relative anchor URL and a non-empty absolute
      base URI.
    preconditions:
    - bodyHtml equals "<a href=\"guide/start.html\">guide</a>".
    - baseUri equals "https://example.test/root/sub/".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "guide".
    - The case reaches relative URL resolution or protocol evaluation using the supplied
      base URI.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_LINK_RELATIVE_EMPTY_BASE
    category: BOUNDARY
    description: Basic Safelist with a relative anchor URL and the empty base-URI
      sentinel.
    preconditions:
    - bodyHtml equals "<a href=\"guide/start.html\">guide</a>".
    - baseUri equals "".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "guide".
    - The target evaluates its baseUri.isEmpty branch before parsing and cleaning.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_LINK_JAVASCRIPT_PROTOCOL
    category: EDGE
    description: Basic Safelist with a script-protocol href and independent visible
      text.
    preconditions:
    - bodyHtml equals "<a href=\"javascript:alert(1)\">unsafe link text</a>".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "unsafe link text".
    - The case reaches unsafe URL-protocol filtering for an anchor attribute.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_LINK_CASE_MIXED_PROTOCOL
    category: EDGE
    description: Basic Safelist with mixed-case JavaScript protocol spelling.
    preconditions:
    - bodyHtml equals "<a href=\"JaVaScRiPt:alert(1)\">mixed protocol</a>".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "mixed protocol".
    - The case exercises protocol handling after HTML attribute parsing with non-lowercase
      input.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_LINK_ENTITY_OBFUSCATED_PROTOCOL
    category: EDGE
    description: Basic Safelist with a character-reference-obfuscated JavaScript protocol.
    preconditions:
    - bodyHtml equals "<a href=\"java&#x73;cript:alert(1)\">entity protocol</a>".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "entity protocol".
    - The case exercises entity decoding in an URL-valued attribute before cleaner
      protocol checks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_DISALLOWED_ATTRIBUTE
    category: NORMAL
    description: Basic Safelist with an otherwise ordinary paragraph carrying an event-handler
      attribute.
    preconditions:
    - bodyHtml equals "<p onclick=\"alert(1)\">paragraph text</p>".
    - baseUri equals "".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "paragraph text".
    - The case reaches attribute filtering independently of URL protocol handling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_DISALLOWED_ELEMENT_NESTED
    category: NORMAL
    description: Basic Safelist with an unsafe nested element inside visible paragraph
      content.
    preconditions:
    - bodyHtml equals "<p>before<script>alert(1)</script>after</p>".
    - baseUri equals "".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains both "before" and "after".
    - The case exercises removal of nested unsafe structure while retaining surrounding
      allowed content.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_MALFORMED_NESTING
    category: EDGE
    description: Basic Safelist with mismatched and implicitly closed formatting tags.
    preconditions:
    - bodyHtml equals "<p><b>one</p>two</b>".
    - baseUri equals "".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains both "one" and "two".
    - The source invocation must parse and normalize the malformed body fragment before
      the cleaner result is re-cleaned.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_UNKNOWN_TAG_CONTENT
    category: EDGE
    description: Basic Safelist with an unknown custom-looking element containing
      visible text.
    preconditions:
    - bodyHtml equals "<unknown-widget data-x=\"1\">widget text</unknown-widget>".
    - baseUri equals "".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "widget text".
    - The case exercises handling of an element not established by the supplied API
      as permitted by the selected Safelist.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_WITH_IMAGES_HTTP_IMAGE
    category: NORMAL
    description: Basic-with-images Safelist with an image source using absolute HTTPS.
    preconditions:
    - bodyHtml equals "<img src=\"https://example.test/image.png\" alt=\"image alternative\">".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.basicWithImages().
    expectedSourceBehavior:
    - Source output is non-empty.
    - The case reaches image-element and URL-valued source-attribute cleaning using
      the image-enabled discovered Safelist preset.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_WITH_IMAGES_RELATIVE_IMAGE
    category: NORMAL
    description: Basic-with-images Safelist with a relative image source and non-empty
      base URI.
    preconditions:
    - bodyHtml equals "<img src=\"images/pic.png\" alt=\"relative image\">".
    - baseUri equals "https://example.test/root/sub/".
    - safelist is Safelist.basicWithImages().
    expectedSourceBehavior:
    - Source output is non-empty.
    - The case reaches relative URL handling for an image source rather than an anchor
      href.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_WITH_IMAGES_DATA_IMAGE
    category: EDGE
    description: Basic-with-images Safelist with a data URI image source.
    preconditions:
    - bodyHtml equals "<img src=\"data:image/png;base64,AA==\" alt=\"data image\">".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.basicWithImages().
    expectedSourceBehavior:
    - Source output is non-empty.
    - The case reaches protocol filtering for a non-HTTP URL form in an image source
      attribute.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_TABLE_STRUCTURE
    category: NORMAL
    description: Relaxed Safelist with table-related nested structure and text in
      cells.
    preconditions:
    - bodyHtml equals "<table><tr><td>left</td><td>right</td></tr></table>".
    - baseUri equals "".
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - Source output is non-empty and contains both "left" and "right".
    - The case exercises parser tree construction and cleaning of multi-level tabular
      markup.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_LIST_STRUCTURE
    category: NORMAL
    description: Relaxed Safelist with ordered-list structure and two list items.
    preconditions:
    - bodyHtml equals "<ol><li>first</li><li>second</li></ol>".
    - baseUri equals "".
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - Source output is non-empty and contains both "first" and "second".
    - The case exercises repeated sibling elements and output serialization.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_STYLE_ATTRIBUTE
    category: EDGE
    description: Relaxed Safelist with a style attribute containing a URL-like CSS
      value.
    preconditions:
    - bodyHtml equals "<p style=\"background:url(javascript:alert(1))\">styled text</p>".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - Source output is non-empty and contains "styled text".
    - The case distinguishes ordinary HTML attribute cleaning from URL-valued href
      and src attribute paths.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_BASE_ELEMENT_IN_FRAGMENT
    category: EDGE
    description: Relaxed Safelist with a base element and a relative anchor inside
      the body fragment.
    preconditions:
    - bodyHtml equals "<base href=\"https://other.test/assets/\"><a href=\"item.html\">item</a>".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - Source output is non-empty and contains "item".
    - The case exercises body-fragment parsing where URL resolution may observe a
      base declaration in the supplied HTML.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEFAULT_CONSTRUCTOR_TEXT
    category: NORMAL
    description: Public no-argument Safelist constructor with plain visible text.
    preconditions:
    - bodyHtml equals "constructor policy text".
    - baseUri equals "".
    - safelist is created with new Safelist().
    expectedSourceBehavior:
    - Source output is non-empty and contains "constructor policy text".
    - The case covers the discovered public constructor rather than a predefined Safelist
      factory.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEFAULT_CONSTRUCTOR_TAG_ONLY
    category: BOUNDARY
    description: Public no-argument Safelist constructor with a fragment containing
      only markup and no text node.
    preconditions:
    - bodyHtml equals "<div></div>".
    - baseUri equals "".
    - safelist is created with new Safelist().
    expectedSourceBehavior:
    - Empty output is permitted because the input has no visible text content.
    - The case distinguishes element-only input from text preservation under the constructed
      Safelist.
    targetCases: 1
    emptyOutputAllowed: true
  - id: DOCTYPE_AND_VISIBLE_TEXT_BASIC
    category: EDGE
    description: Body fragment beginning with a doctype-like declaration followed
      by visible content.
    preconditions:
    - bodyHtml equals "<!doctype html><p>declaration text</p>".
    - baseUri equals "".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "declaration text".
    - The case exercises parser treatment of declaration input in a body-fragment
      context before cleaning.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CHARACTER_REFERENCE_IN_ATTRIBUTE_BASIC
    category: EDGE
    description: Basic Safelist anchor whose href contains an encoded ampersand query
      separator.
    preconditions:
    - bodyHtml equals "<a href=\"https://example.test/search?a=1&amp;b=2\">search</a>".
    - baseUri equals "https://example.test/root/page.html".
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Source output is non-empty and contains "search".
    - The case exercises parsing and serialization of character references in an allowed
      URL-valued attribute.
    targetCases: 1
    emptyOutputAllowed: false
