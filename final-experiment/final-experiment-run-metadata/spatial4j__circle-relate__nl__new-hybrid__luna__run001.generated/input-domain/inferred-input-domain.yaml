InputDomain:
  summary: Finite, non-empty Cartesian circles and finite non-empty rectangles in
    one flat, non-geographic SpatialContext, exercised in paired source/follow-up
    cases related by a common translation.
  globalConstraints:
  - The CircleImpl receiver uses a non-empty point with finite x and y coordinates,
    and a finite radiusDEG >= 0; negative, NaN, and infinite radii are excluded because
    the constructor states that parameter validation has already occurred and the
    supplied relation does not define their behavior.
  - The Rectangle argument has finite minX, maxX, minY, and maxY with minX <= maxX
    and minY <= maxY; empty or non-finite rectangles are excluded because their direct
    relate(Rectangle) behavior is not specified by the supplied source.
  - The same flat, non-geographic SpatialContext is used for both members of every
    metamorphic pair; no antimeridian, pole, dateline, or world-wrap behavior is included.
  - Every follow-up translates the circle center and all four rectangle bounds by
    the same finite offset, while preserving the radius, rectangle width, and rectangle
    height; translated coordinates remain finite and within the flat context.
  - The rectangle must be supplied through the available typed target-generation path;
    no undiscovered Rectangle constructor or same-type factory is assumed.
  diversity:
    radiusClass:
    - zero point-radius
    - positive radius
    boundingBoxRelation:
    - DISJOINT
    - WITHIN
    - CONTAINS
    - INTERSECTS
    - CONTAINS with exact equality
    centerAxisPosition:
    - left of rectangle
    - right of rectangle
    - inside rectangle x-range
    - below rectangle
    - above rectangle
    - inside rectangle y-range
    phase2ClosestPoint:
    - outside circle
    - on circle boundary
    - inside circle
    - not applicable because bbox shortcut returns
    phase2FarthestPoint:
    - outside circle
    - inside circle
    - tie between opposite rectangle corners
    expectedRelation:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
    translationOffset:
    - (100, 200)
    - (-150, 75)
  scenarios:
  - id: BBOX_DISJOINT_FAR
    category: NORMAL
    description: A positive-radius circle is far from the rectangle, so the circle's
      enclosingBox is DISJOINT from the rectangle.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [20, 22] x [20, 22].
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [120, 122] x [220, 222].
    expectedSourceBehavior:
    - The enclosingBox.relate(rectangle) shortcut returns DISJOINT, so relate(Rectangle)
      returns DISJOINT without entering rectangle phase 2.
    - The translated follow-up also returns DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_RECTANGLE
    category: NORMAL
    description: The rectangle strictly contains the circle's enclosing box.
    preconditions:
    - Source circle center is (0, 0) with radius 5, giving an enclosing box strictly
      inside the rectangle.
    - Source rectangle is [-10, 10] x [-10, 10].
    - Follow-up translates both objects by (-150, 75), giving center (-150, 75) and
      rectangle [-160, -140] x [65, 85].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN, so relate(Rectangle) returns WITHIN
      immediately.
    - The translated follow-up also returns WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_EXACT_RECTANGLE_IDENTITY
    category: EDGE
    description: The rectangle is exactly equal to the circle's calculated enclosingBox,
      exercising the explicit equality identity edge case.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [-5, 5] x [-5, 5], matching the flat enclosing-box bounds
      calculated from the center and radius.
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [95, 105] x [195, 205].
    expectedSourceBehavior:
    - The enclosing box relates as CONTAINS and equals the rectangle, so the explicit
      equality branch returns WITHIN.
    - The translated follow-up also returns WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CENTER_LEFT_AXIS_SPAN
    category: NORMAL
    description: The circle center is left of the rectangle but within its y-range;
      the rectangle overlaps the enclosing box and cannot be DISJOINT merely from
      the closest-corner test.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [4, 6] x [-1, 1].
    - The circle x-axis is left of the rectangle, while its y-axis lies inside the
      rectangle's y-range.
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [104, 106] x [199, 201].
    expectedSourceBehavior:
    - Phase 2 takes the xAxis < minX branch and the y-axis-inside branch.
    - Because the enclosing box does not CONTAIN the rectangle, the non-disjoint result
      is INTERSECTS.
    - The translated follow-up also returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CENTER_RIGHT_AXIS_SPAN
    category: NORMAL
    description: The circle center is right of the rectangle but within its y-range,
      exercising the symmetric xAxis > maxX path.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [-6, -4] x [-1, 1].
    - The circle x-axis is right of the rectangle, while its y-axis lies inside the
      rectangle's y-range.
    - Follow-up translates both objects by (-150, 75), giving center (-150, 75) and
      rectangle [-156, -154] x [74, 76].
    expectedSourceBehavior:
    - Phase 2 takes the xAxis > maxX branch and the y-axis-inside branch.
    - The result is INTERSECTS because the rectangle is not contained by the enclosing
      box.
    - The translated follow-up also returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CENTER_BELOW_AXIS_SPAN
    category: NORMAL
    description: The circle center is below the rectangle but within its x-range,
      exercising the yAxis < minY path.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [-1, 1] x [4, 6].
    - The circle y-axis is below the rectangle, while its x-axis lies inside the rectangle's
      x-range.
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [99, 101] x [204, 206].
    expectedSourceBehavior:
    - Phase 2 takes the yAxis < minY branch and the x-axis-inside branch.
    - The result is INTERSECTS rather than DISJOINT because the rectangle spans the
      circle's x-axis and the enclosing boxes overlap.
    - The translated follow-up also returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CENTER_ABOVE_AXIS_SPAN
    category: NORMAL
    description: The circle center is above the rectangle but within its x-range,
      exercising the yAxis > maxY path.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [-1, 1] x [-6, -4].
    - The circle y-axis is above the rectangle, while its x-axis lies inside the rectangle's
      x-range.
    - Follow-up translates both objects by (-150, 75), giving center (-150, 75) and
      rectangle [-151, -149] x [69, 71].
    expectedSourceBehavior:
    - Phase 2 takes the yAxis > maxY branch and the x-axis-inside branch.
    - The result is INTERSECTS.
    - The translated follow-up also returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CLOSEST_CORNER_OUTSIDE
    category: NORMAL
    description: Both circle axes lie outside the rectangle and the closest rectangle
      corner lies outside the circle, while the enclosing boxes still overlap.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [4, 6] x [4, 6], whose closest corner (4, 4) has distance
      greater than 5 from the center.
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [104, 106] x [204, 206].
    expectedSourceBehavior:
    - Phase 2 takes the xAxis < minX and yAxis < minY branches.
    - The closest-corner contains test fails, so relate(Rectangle) returns DISJOINT.
    - The translated follow-up also returns DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_PARTIAL
    category: NORMAL
    description: The rectangle is inside the circle's enclosing box, but its farthest
      corner is outside the circle.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [-4, 4] x [3, 4], which is contained by [-5, 5] x [-5, 5]
      but has farthest corner (4, 4) outside the radius-5 circle.
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [96, 104] x [203, 204].
    expectedSourceBehavior:
    - The enclosing box relates as CONTAINS, so phase 2 evaluates the farthest point.
    - The farthest-point contains test fails, so the result is INTERSECTS.
    - The translated follow-up also returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_FULL
    category: NORMAL
    description: The rectangle is contained by the enclosing box and every relevant
      farthest corner is inside the circle.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [-2, 2] x [-2, 2], fully inside the circle.
    - Follow-up translates both objects by (-150, 75), giving center (-150, 75) and
      rectangle [-152, -148] x [73, 77].
    expectedSourceBehavior:
    - The enclosing box relates as CONTAINS.
    - The farthest-point contains test succeeds, so relate(Rectangle) returns CONTAINS.
    - The translated follow-up also returns CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FARTHEST_POINT_TIE
    category: EDGE
    description: The rectangle is centered on both circle axes, making the source's
      strict greater-than farthest-X choice take its tie branch.
    preconditions:
    - Source circle center is (0, 0) with radius 10.
    - Source rectangle is [-3, 3] x [-4, 4], contained by the circle's enclosing box
      and symmetric about both axes.
    - The farthest-X comparison is equal on both sides, so the source chooses minX;
      the selected farthest point and the opposite-corner check remain inside the
      circle.
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [97, 103] x [196, 204].
    expectedSourceBehavior:
    - Phase 2 reaches the xAxis-inside and yAxis-inside branches and exercises the
      strict tie behavior in farthest-X selection.
    - The result is CONTAINS.
    - The translated follow-up also returns CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_WITHIN
    category: EDGE
    description: A zero-radius circle follows the point-like path while its enclosing
      box lies inside a larger rectangle.
    preconditions:
    - Source circle center is (0, 0) with radius 0.
    - Source rectangle is [-1, 1] x [-1, 1].
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [99, 101] x [199, 201].
    expectedSourceBehavior:
    - The radius is zero, so hasArea would be false, but relate(Rectangle) still uses
      the calculated enclosingBox and rectangle relation.
    - The enclosing box is WITHIN the rectangle, so relate(Rectangle) returns WITHIN.
    - The translated follow-up also returns WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT
    category: EDGE
    description: A zero-radius circle is separated from the rectangle, exercising
      the point-like enclosing-box DISJOINT shortcut.
    preconditions:
    - Source circle center is (0, 0) with radius 0.
    - Source rectangle is [2, 3] x [2, 3].
    - Follow-up translates both objects by (-150, 75), giving center (-150, 75) and
      rectangle [-148, -147] x [77, 78].
    expectedSourceBehavior:
    - The zero-radius enclosing box is DISJOINT from the rectangle, so relate(Rectangle)
      returns DISJOINT.
    - The translated follow-up also returns DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CLOSEST_POINT_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: The rectangle begins at the circle's radius along x while spanning
      the circle's y-axis, exercising a closest-point boundary contact.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [5, 7] x [-1, 1], so its closest point (5, 0) is exactly
      at the radius boundary.
    - Follow-up translates both objects by (-150, 75), giving center (-150, 75) and
      rectangle [-145, -143] x [74, 76].
    expectedSourceBehavior:
    - Phase 2 takes xAxis < minX and y-axis-inside branches.
    - The closest point is on the circle boundary; because the y-axis is spanned,
      the source does not use that point to declare DISJOINT, and the result is INTERSECTS.
    - The translated follow-up also returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RECTANGLE_CORNER_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: The rectangle is inside the enclosing box with a farthest corner
      exactly on the circle boundary.
    preconditions:
    - Source circle center is (0, 0) with radius 5.
    - Source rectangle is [3, 4] x [0, 3], whose farthest corner (4, 3) has distance
      exactly 5.
    - Follow-up translates both objects by (100, 200), giving center (100, 200) and
      rectangle [103, 104] x [200, 203].
    expectedSourceBehavior:
    - The enclosing box CONTAINS the rectangle, and the farthest-point test reaches
      the circle boundary.
    - The relation is not DISJOINT; the boundary case is observable as CONTAINS if
      the supplied distance calculator treats within as inclusive, otherwise this
      case exposes the calculator's boundary convention without changing the metamorphic
      oracle.
    - The translated follow-up must return the same SpatialRelation as the source.
    targetCases: 2
    emptyOutputAllowed: false
