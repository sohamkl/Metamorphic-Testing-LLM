InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be advanced by exactly
    23 days, including bounded, empty, calendar-transition, construction-path, saturation,
    and transformable unbounded-start ranges.
  globalConstraints:
  - The source receiver is non-null and is a successfully constructed LocalDateRange.
  - The source satisfies range.getEnd().compareTo(LocalDate.MAX.minusDays(23)) <=
    0, so range.getEnd().plusDays(23) completes without overflow.
  - 'The source start and end satisfy the LocalDateRange constructor invariants: start
    <= end, start is neither LocalDate.MAX nor LocalDate.MAX.minusDays(1), end is
    neither LocalDate.MIN nor LocalDate.MIN.plusDays(1), and an empty range is not
    located at LocalDate.MIN or LocalDate.MAX.'
  - Ranges unbounded at the end, including LocalDateRange.ofUnbounded(), are excluded
    because getEnd() is LocalDate.MAX and the required plusDays(23) transformation
    throws before the relation can apply.
  - Ranges unbounded only at the start are retained when their end has 23 days of
    headroom; lengthInDays() returns Integer.MAX_VALUE and the supplied assertion
    deliberately skips them.
  - For a bounded source whose source and follow-up outputs are both below Integer.MAX_VALUE,
    the asserted increase must be exactly 23.
  diversity:
    boundedness:
    - bounded
    - unbounded-start
    - follow-up-becomes-unbounded-end
    sourceLengthBand:
    - zero
    - one
    - '22'
    - '23'
    - '24'
    - ordinary
    - near-Integer-MAX_VALUE
    - Integer-MAX_VALUE
    - above-Integer-MAX_VALUE
    constructionPath:
    - of-dates
    - of-period
    - ofClosed
    - ofEmpty
    - from-Temporal
    - parse-date-date
    - parse-date-period
    - parse-period-date
    - ofUnboundedStart
    calendarFeature:
    - ordinary-day
    - month-boundary
    - common-February
    - leap-February
    - leap-day
    - year-boundary
    - week-boundary
    endHeadroomDays:
    - exactly-23
    - exactly-24
    - more-than-24
    relationObservability:
    - non-vacuous-arithmetic
    - source-sentinel-skip
    - follow-up-sentinel-skip
  scenarios:
  - id: EMPTY_VIA_OF_EMPTY
    category: EDGE
    description: An empty range created with ofEmpty at an ordinary interior date.
    preconditions:
    - range.equals(LocalDateRange.ofEmpty(LocalDate.of(2020, 6, 15)))
    expectedSourceBehavior:
    - lengthInDays() returns 0 rather than Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_VIA_HALF_OPEN_OF
    category: EDGE
    description: An empty range created by passing the same interior date as both
      half-open bounds.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2021, 1, 10), LocalDate.of(2021,
      1, 10)))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN
    category: BOUNDARY
    description: The smallest non-empty half-open bounded range.
    preconditions:
    - range.getEnd().equals(range.getStart().plusDays(1))
    - Neither bound is a LocalDateRange unbounded sentinel.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DAY
    category: BOUNDARY
    description: A single included date constructed through ofClosed.
    preconditions:
    - range.equals(LocalDateRange.ofClosed(LocalDate.of(2022, 8, 9), LocalDate.of(2022,
      8, 9)))
    expectedSourceBehavior:
    - The stored exclusive end is one day after the start and lengthInDays() returns
      1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_22_DAYS
    category: NORMAL
    description: A bounded range one day shorter than the transformation amount.
    preconditions:
    - range.getEnd().toEpochDay() - range.getStart().toEpochDay() == 22
    - The range is bounded at both ends.
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EXACTLY_EXTRA_DAYS
    category: BOUNDARY
    description: A bounded source whose length equals EXTRA_DAYS.
    preconditions:
    - range.getEnd().toEpochDay() - range.getStart().toEpochDay() == 23
    - The range is bounded at both ends.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_24_DAYS
    category: NORMAL
    description: A bounded range one day longer than the transformation amount.
    preconditions:
    - range.getEnd().toEpochDay() - range.getStart().toEpochDay() == 24
    - The range is bounded at both ends.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MULTI_WEEK_RANGE
    category: NORMAL
    description: A bounded range spanning several complete weeks and additional days.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2023, 3, 1), LocalDate.of(2023,
      4, 10)))
    expectedSourceBehavior:
    - lengthInDays() returns 40.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THIRTY_DAY_MONTH
    category: NORMAL
    description: A half-open range covering all of April.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2021, 4, 1), LocalDate.of(2021,
      5, 1)))
    expectedSourceBehavior:
    - lengthInDays() returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THIRTY_ONE_DAY_MONTH
    category: NORMAL
    description: A half-open range covering all of January.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2021, 1, 1), LocalDate.of(2021,
      2, 1)))
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_FEBRUARY
    category: BOUNDARY
    description: A range spanning February in a non-leap year.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2019, 2, 1), LocalDate.of(2019,
      3, 1)))
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_FEBRUARY
    category: BOUNDARY
    description: A range spanning February in a leap year.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2020, 2, 1), LocalDate.of(2020,
      3, 1)))
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_LEAP_DAY
    category: BOUNDARY
    description: A short range whose included dates cross February 29.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2020, 2, 28), LocalDate.of(2020,
      3, 2)))
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_YEAR_RANGE
    category: NORMAL
    description: A bounded range covering a complete common year.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2021, 1, 1), LocalDate.of(2022,
      1, 1)))
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_YEAR_RANGE
    category: BOUNDARY
    description: A bounded range covering a complete leap year.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2021,
      1, 1)))
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_CONSTRUCTION
    category: EDGE
    description: An empty interior range constructed with of(start, Period.ZERO).
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2020, 5, 20), Period.ZERO))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DAY_PERIOD_CONSTRUCTION
    category: NORMAL
    description: A range constructed from a positive day-based Period.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2020, 5, 20), Period.ofDays(17)))
    expectedSourceBehavior:
    - lengthInDays() returns 17.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_PERIOD_CONSTRUCTION
    category: NORMAL
    description: A range constructed from a one-month Period where the elapsed day
      count is 31.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2020, 1, 15), Period.ofMonths(1)))
    expectedSourceBehavior:
    - The end is 2020-02-15 and lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_PERIOD_CROSSES_LEAP_DAY
    category: BOUNDARY
    description: A one-year Period construction whose resulting interval contains
      February 29.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.of(2019, 3, 1), Period.ofYears(1)))
    expectedSourceBehavior:
    - The end is 2020-03-01 and lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A receiver produced by from(Temporal) when the temporal directly
      supplies a LocalDate.
    preconditions:
    - range.equals(LocalDateRange.from(LocalDate.of(2024, 4, 5)))
    expectedSourceBehavior:
    - from creates a closed single-day range and lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_TEMPORAL_WITH_LOCAL_DATE_QUERY
    category: NORMAL
    description: A receiver produced by from(Temporal) through the non-null TemporalQueries.localDate()
      branch using a temporal with a time component.
    preconditions:
    - The supplied Temporal queries to LocalDate.of(2024, 4, 5).
    - range.equals(LocalDateRange.from(the supplied Temporal))
    expectedSourceBehavior:
    - The time component is ignored, a one-day range is created, and lengthInDays()
      returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: A receiver produced by the Year branch of from(Temporal) for a common
      year.
    preconditions:
    - The supplied Temporal is Year.of(2021).
    - range.equals(LocalDateRange.from(Year.of(2021)))
    expectedSourceBehavior:
    - The range covers the complete year and lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: BOUNDARY
    description: A receiver produced by the Year branch of from(Temporal) for a leap
      year.
    preconditions:
    - The supplied Temporal is Year.of(2020).
    - range.equals(LocalDateRange.from(Year.of(2020)))
    expectedSourceBehavior:
    - The range covers the complete year and lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARMONTH_28_DAYS
    category: NORMAL
    description: A receiver produced by the YearMonth branch for a 28-day February.
    preconditions:
    - The supplied Temporal represents YearMonth 2019-02.
    - range.equals(LocalDateRange.from(the supplied Temporal))
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARMONTH_29_DAYS
    category: BOUNDARY
    description: A receiver produced by the YearMonth branch for a leap-year February.
    preconditions:
    - The supplied Temporal represents YearMonth 2020-02.
    - range.equals(LocalDateRange.from(the supplied Temporal))
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARMONTH_30_DAYS
    category: NORMAL
    description: A receiver produced by the YearMonth branch for a 30-day month.
    preconditions:
    - The supplied Temporal represents YearMonth 2021-04.
    - range.equals(LocalDateRange.from(the supplied Temporal))
    expectedSourceBehavior:
    - lengthInDays() returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARMONTH_31_DAYS
    category: NORMAL
    description: A receiver produced by the YearMonth branch for a 31-day month.
    preconditions:
    - The supplied Temporal represents YearMonth 2021-01.
    - range.equals(LocalDateRange.from(the supplied Temporal))
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A receiver produced by the YearHalf branch of from(Temporal).
    preconditions:
    - The supplied Temporal is a YearHalf whose first date is 2020-01-01 and last
      date is 2020-06-30.
    - range.equals(LocalDateRange.from(the supplied Temporal))
    expectedSourceBehavior:
    - The closed half-year is represented with an exclusive end of 2020-07-01 and
      lengthInDays() returns 182.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A receiver produced by the YearQuarter branch of from(Temporal).
    preconditions:
    - The supplied Temporal is a YearQuarter whose first date is 2021-04-01 and last
      date is 2021-06-30.
    - range.equals(LocalDateRange.from(the supplied Temporal))
    expectedSourceBehavior:
    - The exclusive end is 2021-07-01 and lengthInDays() returns 91.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: BOUNDARY
    description: A receiver produced by the YearWeek branch, including a week that
      crosses a calendar-year boundary.
    preconditions:
    - The supplied YearWeek maps Monday through Sunday to seven consecutive valid
      dates crossing December 31.
    - range.equals(LocalDateRange.from(the supplied YearWeek))
    expectedSourceBehavior:
    - The closed Monday-to-Sunday range has lengthInDays() equal to 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A receiver parsed through the date/date format branch.
    preconditions:
    - range.equals(LocalDateRange.parse("2020-01-10/2020-02-10"))
    expectedSourceBehavior:
    - The parsed exclusive bounds differ by 31 days and lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: A receiver parsed through the date/period format branch.
    preconditions:
    - range.equals(LocalDateRange.parse("2020-01-10/P23D"))
    expectedSourceBehavior:
    - The parsed end is the start plus 23 days and lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: A receiver parsed through the period/date format branch.
    preconditions:
    - range.equals(LocalDateRange.parse("P23D/2020-02-02"))
    expectedSourceBehavior:
    - The parsed start is 23 days before the end and lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_EARLIEST_LEGAL_END
    category: BOUNDARY
    description: An unbounded-start range ending at the earliest exclusive end accepted
      by the constructor.
    preconditions:
    - range.equals(LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2)))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded sentinel.
    - The supplied relation skips arithmetic for this source output.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: An unbounded-start range with an ordinary bounded end and ample transformation
      headroom.
    preconditions:
    - range.equals(LocalDateRange.ofUnboundedStart(LocalDate.of(2020, 1, 1)))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - Advancing the end preserves the unbounded start, so the assertion remains on
      its sentinel skip path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_END_EXACT_HEADROOM
    category: BOUNDARY
    description: An unbounded-start source whose end is exactly 23 days below LocalDate.MAX.
    preconditions:
    - range.equals(LocalDateRange.ofUnboundedStart(LocalDate.MAX.minusDays(23)))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The transformation is defined and produces the fully unbounded range, which
      is skipped by the assertion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_BOUNDED_ONE_DAY_RANGE
    category: BOUNDARY
    description: The earliest one-day range that is bounded at the start and satisfies
      the prohibited-end rules.
    preconditions:
    - range.equals(LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)))
    expectedSourceBehavior:
    - The range is not unbounded at the start and lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_LEGAL_EMPTY_RANGE
    category: BOUNDARY
    description: An empty range at the earliest date allowed by ofEmpty.
    preconditions:
    - range.equals(LocalDateRange.ofEmpty(LocalDate.MIN.plusDays(2)))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: END_WITH_24_DAYS_HEADROOM
    category: BOUNDARY
    description: A bounded source ending 24 days below LocalDate.MAX, so the follow-up
      remains bounded.
    preconditions:
    - range.getEnd().equals(LocalDate.MAX.minusDays(24))
    - range.getStart().equals(LocalDate.MAX.minusDays(47))
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The source output is non-sentinel and the follow-up end is LocalDate.MAX.minusDays(1).
    targetCases: 1
    emptyOutputAllowed: false
  - id: END_WITH_EXACTLY_23_DAYS_HEADROOM
    category: BOUNDARY
    description: A bounded source whose end advances exactly onto the unbounded-end
      sentinel.
    preconditions:
    - range.getEnd().equals(LocalDate.MAX.minusDays(23))
    - range.getStart().equals(LocalDate.MAX.minusDays(46))
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The source is finite, while the generated follow-up has end LocalDate.MAX and
      causes the assertion to skip.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATEST_TRANSFORMABLE_EMPTY_RANGE
    category: BOUNDARY
    description: An empty bounded range at the latest date allowed by the 23-day transformation
      headroom constraint.
    preconditions:
    - range.equals(LocalDateRange.ofEmpty(LocalDate.MAX.minusDays(23)))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The generated follow-up ends at LocalDate.MAX and is therefore sentinel-valued.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_REACHING_EXACT_HEADROOM_END
    category: BOUNDARY
    description: A closed construction whose inclusive end is converted to an exclusive
      end exactly 23 days below LocalDate.MAX.
    preconditions:
    - range.equals(LocalDateRange.ofClosed(LocalDate.MAX.minusDays(29), LocalDate.MAX.minusDays(24)))
    expectedSourceBehavior:
    - The stored exclusive end is LocalDate.MAX.minusDays(23) and lengthInDays() returns
      6.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INTEGER_MAX_MINUS_24
    category: BOUNDARY
    description: A very large bounded source immediately below the band where adding
      23 can reach Integer.MAX_VALUE.
    preconditions:
    - range.getEnd().toEpochDay() - range.getStart().toEpochDay() == Integer.MAX_VALUE
      - 24
    - range.getEnd().compareTo(LocalDate.MAX.minusDays(24)) <= 0
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24, not the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INTEGER_MAX_MINUS_23
    category: BOUNDARY
    description: A bounded source whose follow-up mathematical length is exactly Integer.MAX_VALUE.
    preconditions:
    - range.getEnd().toEpochDay() - range.getStart().toEpochDay() == Integer.MAX_VALUE
      - 23
    - range.getEnd().compareTo(LocalDate.MAX.minusDays(23)) <= 0
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - The source is non-sentinel, but the follow-up output equals the assertion's
      sentinel and is skipped.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INTEGER_MAX_MINUS_1
    category: BOUNDARY
    description: A bounded source just below the maximum int-representable length.
    preconditions:
    - range.getEnd().toEpochDay() - range.getStart().toEpochDay() == Integer.MAX_VALUE
      - 1
    - range.getEnd().compareTo(LocalDate.MAX.minusDays(23)) <= 0
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 1.
    - Extending by 23 enters the target method's too-large sentinel path, so the assertion
      skips the follow-up.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EXACT_INTEGER_MAX
    category: EDGE
    description: A bounded range whose exact epoch-day difference equals Integer.MAX_VALUE.
    preconditions:
    - range.getEnd().toEpochDay() - range.getStart().toEpochDay() == Integer.MAX_VALUE
    - range.getEnd().compareTo(LocalDate.MAX.minusDays(23)) <= 0
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - Although the range is bounded, the supplied assertion treats this output as
      its sentinel and skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_ABOVE_INTEGER_MAX
    category: EDGE
    description: A bounded range whose exact day difference is one greater than Integer.MAX_VALUE.
    preconditions:
    - range.getEnd().toEpochDay() - range.getStart().toEpochDay() == (long) Integer.MAX_VALUE
      + 1
    - range.getEnd().compareTo(LocalDate.MAX.minusDays(23)) <= 0
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE through the too-large-length sentinel
      path.
    - The supplied assertion skips the source.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_LARGE_BOUNDED_TIMELINE_RANGE
    category: EDGE
    description: A bounded range spanning almost the full LocalDate timeline without
      using either unbounded sentinel as a bound.
    preconditions:
    - range.getStart().equals(LocalDate.MIN.plusDays(1))
    - range.getEnd().equals(LocalDate.MAX.minusDays(23))
    expectedSourceBehavior:
    - Both bounds are formally bounded, but the day count is too large for a real
      int length and lengthInDays() returns Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_ENDING_BEFORE_TRANSFORM_LIMIT
    category: BOUNDARY
    description: A near-maximum closed range whose conversion to an exclusive end
      leaves exactly 24 days of transformation headroom.
    preconditions:
    - range.equals(LocalDateRange.ofClosed(LocalDate.MAX.minusDays(30), LocalDate.MAX.minusDays(25)))
    expectedSourceBehavior:
    - The stored exclusive end is LocalDate.MAX.minusDays(24) and lengthInDays() returns
      6.
    - Its follow-up remains bounded.
    targetCases: 1
    emptyOutputAllowed: false
