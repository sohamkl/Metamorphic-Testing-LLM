InputDomain:
  summary: Finite, non-empty Cartesian circles and finite, non-empty rectangles constructed
    in one non-geographic SpatialContext; cases emphasize enclosing-box shortcuts,
    phase-2 axis and corner tests, containment, intersection, disjointness, equality,
    tangency, degenerate rectangles, and zero-radius circles.
  globalConstraints:
  - Use one non-geographic SpatialContext for the circle and rectangle, and use that
    same context for the metamorphic follow-up.
  - Construct the circle with a finite, non-empty point, a finite radius satisfying
    radius >= 0, and the supplied CircleImpl(Point,double,SpatialContext) constructor.
  - Construct each rectangle with finite minX, maxX, minY, and maxY satisfying minX
    <= maxX and minY <= maxY; zero-width and zero-height rectangles are permitted.
  - Keep source coordinates bounded enough that adding SHIFT_X = 17.5 and SHIFT_Y
    = -9.25 leaves every follow-up coordinate finite and leaves rectangle ordering
    valid.
  - Exclude empty points, empty circles, empty rectangles, NaN, infinities, negative
    radii, nulls, and other unvalidated inputs because the supplied follow-up constructs
    a shifted point and RectangleImpl directly, while the supplied relation defines
    no required invalid-input behavior.
  - For every case, invoke CircleImpl.relate(Rectangle) on the source pair and on
    the generated shifted pair, and require the two returned SpatialRelation enum
    values to be identical.
  diversity:
    circleRadius:
    - '0.0'
    - '1.0'
    - '3.0'
    - '5.0'
    - '8.0'
    centerPosition:
    - origin
    - negative-x-positive-y
    - positive-x-negative-y
    - on-rectangle-edge
    - outside-rectangle-on-both-axes
    - inside-rectangle-on-both-axes
    rectangleRelationToCircleBoundingBox:
    - DISJOINT
    - WITHIN
    - equal-to-bounding-box
    - INTERSECTS
    - CONTAINS
    rectangleShape:
    - area rectangle
    - zero-width rectangle
    - zero-height rectangle
    - point rectangle
    phase2AxisPlacement:
    - circle axis outside on both axes
    - x axis outside and y axis inside
    - x axis inside and y axis outside
    - both axes inside
    - axis exactly on rectangle boundary
    phase2ClosestPoint:
    - outside circle
    - strictly inside circle
    - exactly on circle
    phase2FarthestPoint:
    - outside circle
    - strictly inside circle
    - exactly on circle
    expectedRelation:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
  scenarios:
  - id: BBOX_DISJOINT_BOTH_AXES
    category: NORMAL
    description: A radius-5 circle at (0,0) and rectangle [20,22] x [20,22] are separated
      before rectangle phase 2.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle has minX=20, maxX=22, minY=20, and maxY=22.
    - The circle enclosing box [-5,5] x [-5,5] is disjoint from the rectangle.
    expectedSourceBehavior:
    - enclosingBox.relate(r) returns DISJOINT.
    - relate(Rectangle) returns DISJOINT without entering relateRectanglePhase2.
    - The shifted source and follow-up results are both DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_CORNER_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the circle bounding box, but its nearest corner
      is outside the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [4.5,6] x [4.5,6].
    - The circle bounding box intersects the rectangle, while the closest rectangle
      corner (4.5,4.5) has distance greater than 5.
    - The circle axis is outside the rectangle on both x and y axes.
    expectedSourceBehavior:
    - The bounding-box result does not take the early DISJOINT or WITHIN return.
    - Phase 2 tests the closest corner and returns DISJOINT.
    - The follow-up remains DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_X_OUTSIDE_Y_INSIDE
    category: NORMAL
    description: The circle axis is left of the rectangle while its y-axis lies inside
      the rectangle; overlap is non-empty.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [4,6] x [-1,1].
    - xAxis < minX and minY < yAxis < maxY.
    - The closest point (4,0) is strictly inside the circle.
    expectedSourceBehavior:
    - Phase 2 takes the xAxis < minX branch and the y-axis-inside branch.
    - The result is INTERSECTS because the bounding box is not CONTAINS.
    - The follow-up result is also INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_X_INSIDE_Y_OUTSIDE
    category: NORMAL
    description: The circle axis is below the rectangle while its x-axis lies inside
      the rectangle; overlap is non-empty.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-1,1] x [4,6].
    - minX < xAxis < maxX and yAxis < minY.
    - The closest point (0,4) is strictly inside the circle.
    expectedSourceBehavior:
    - Phase 2 takes the yAxis < minY branch and the x-axis-inside branch.
    - The result is INTERSECTS.
    - The follow-up result is also INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_LARGER_RECTANGLE
    category: NORMAL
    description: The rectangle strictly contains the complete circle bounding box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-6,6] x [-6,6].
    - The enclosing box [-5,5] x [-5,5] is WITHIN the rectangle.
    expectedSourceBehavior:
    - relate(Rectangle) returns WITHIN through the enclosing-box early return.
    - The follow-up result remains WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_EQUALS_RECTANGLE_IDENTITY
    category: EDGE
    description: The rectangle is exactly equal to the circle's enclosing box, exercising
      the explicit equality exception.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-5,5] x [-5,5].
    - enclosingBox.equals(r) is true.
    - The enclosing-box relation is CONTAINS before the equality check.
    expectedSourceBehavior:
    - The equality edge case returns WITHIN rather than proceeding to phase 2.
    - The follow-up enclosing boxes and rectangles remain equal after the common shift.
    - The follow-up result is WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_INTERSECTS_SIDE_OVERLAP
    category: NORMAL
    description: The rectangle overlaps the circle bounding box on one side and contains
      points of the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [3,6] x [-1,1].
    - The bounding-box relation is INTERSECTS.
    - The closest point (3,0) is strictly inside the circle.
    expectedSourceBehavior:
    - Phase 2 cannot return DISJOINT because the closest point is contained.
    - Because bboxSect is not CONTAINS, the result is INTERSECTS.
    - The follow-up result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE
    category: NORMAL
    description: The circle bounding box contains a smaller rectangle whose farthest
      corner remains inside the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-2,2] x [-2,2].
    - The bounding-box relation is CONTAINS.
    - The farthest rectangle corner has distance sqrt(8), which is less than 5.
    expectedSourceBehavior:
    - Phase 2 passes the bboxSect == CONTAINS check.
    - The farthest-point test succeeds and the result is CONTAINS.
    - The follow-up result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_FARTHEST_OUTSIDE
    category: NORMAL
    description: The rectangle lies inside the circle bounding box but extends outside
      the circle at a farthest corner.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-4,4] x [-4,4].
    - The bounding-box relation is CONTAINS.
    - The farthest corner distance is sqrt(32), which is greater than 5.
    expectedSourceBehavior:
    - Phase 2 reaches the farthest-point containment test.
    - The farthest point is not contained, so the result is INTERSECTS rather than
      CONTAINS.
    - The follow-up result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIDE_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at a side point while extending
      beyond the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [5,7] x [-1,1].
    - The closest point is (5,0), exactly at distance 5.
    - The rectangle is not contained by the circle bounding box.
    expectedSourceBehavior:
    - The closest-point test does not classify the shapes as DISJOINT at tangency.
    - The result is INTERSECTS.
    - The follow-up result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CORNER_TANGENCY_WITH_FARTHER_OUTSIDE
    category: BOUNDARY
    description: The rectangle's closest corner is exactly on the circle while another
      corner is outside.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [3,5] x [4,6].
    - The closest corner (3,4) has distance exactly 5.
    - The bounding-box relation is INTERSECTS and the farthest corner is outside the
      circle.
    expectedSourceBehavior:
    - The closest-point test does not return DISJOINT.
    - The farthest-point test returns false, producing INTERSECTS.
    - The follow-up result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_TANGENCY
    category: BOUNDARY
    description: All rectangle corners are on or inside the circle, with the selected
      farthest corner exactly on the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [0,3] x [4,4].
    - The farthest corner (3,4) has distance exactly 5.
    - The bounding-box relation is CONTAINS.
    expectedSourceBehavior:
    - The farthest-point containment test accepts the boundary point.
    - The result is CONTAINS.
    - The follow-up result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXES_EXACTLY_ON_RECTANGLE_MINIMUMS
    category: EDGE
    description: Both circle axes equal the rectangle minimum coordinates while the
      rectangle is contained by the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [0,2] x [0,2].
    - xAxis == minX and yAxis == minY.
    - The rectangle's farthest corner (2,2) is strictly inside the circle.
    expectedSourceBehavior:
    - Phase 2 uses the equality path rather than either axis-outside branch.
    - The farthest-point test succeeds and the result is CONTAINS.
    - The follow-up result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXES_EXACTLY_ON_RECTANGLE_MAXIMUMS
    category: EDGE
    description: Both circle axes equal the rectangle maximum coordinates, exercising
      the opposite equality boundary.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-2,0] x [-2,0].
    - xAxis == maxX and yAxis == maxY.
    - The rectangle's farthest corner (-2,-2) is strictly inside the circle.
    expectedSourceBehavior:
    - Phase 2 uses the equality path for both axes.
    - The result is CONTAINS.
    - The follow-up result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_RECTANGLE_INSIDE
    category: EDGE
    description: A zero-width rectangle segment lies strictly inside the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle has minX=maxX=1 and minY=-2, maxY=2.
    - Every rectangle endpoint and the selected farthest point is strictly inside
      the circle.
    expectedSourceBehavior:
    - The degenerate rectangle remains a valid Rectangle input.
    - The bounding-box CONTAINS path and farthest-point test return CONTAINS.
    - The follow-up result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_RECTANGLE_INSIDE
    category: EDGE
    description: A zero-height rectangle segment lies strictly inside the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle has minX=-2, maxX=2, and minY=maxY=1.
    - Every rectangle endpoint and the selected farthest point is strictly inside
      the circle.
    expectedSourceBehavior:
    - The degenerate rectangle is processed through the same rectangle relation logic.
    - The result is CONTAINS.
    - The follow-up result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_ON_CIRCLE
    category: BOUNDARY
    description: A point rectangle lies exactly on the circle boundary.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle has minX=maxX=3 and minY=maxY=4.
    - The only rectangle point has distance exactly 5.
    expectedSourceBehavior:
    - The point rectangle is not classified as DISJOINT at the containment boundary.
    - The result is CONTAINS if the supplied distance calculator treats within as
      inclusive, as used by the source contains call.
    - The follow-up must return the same enum value as the source.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_OUTSIDE
    category: EDGE
    description: A point rectangle is outside the circle and outside its enclosing
      box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle has minX=maxX=6 and minY=maxY=0.
    - The point rectangle is outside the enclosing box on x.
    expectedSourceBehavior:
    - The enclosing-box relation is DISJOINT.
    - relate(Rectangle) returns DISJOINT through the early return.
    - The follow-up result is DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_RECTANGLE_CONTAINS_POINT
    category: BOUNDARY
    description: A zero-radius circle is represented by a non-empty center point and
      is surrounded by a positive-area rectangle.
    preconditions:
    - Circle center is (2,-3) and radius is 0.
    - Rectangle is [1,3] x [-4,-2].
    - The circle enclosing box is the center point and is WITHIN the rectangle.
    expectedSourceBehavior:
    - The constructor creates a non-empty circle with radius 0.
    - The enclosing-box early path returns WITHIN.
    - The follow-up result is WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUAL_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and a point rectangle have identical bounding
      boxes.
    preconditions:
    - Circle center is (-2,3) and radius is 0.
    - Rectangle has minX=maxX=-2 and minY=maxY=3.
    - The circle enclosing box equals the rectangle.
    expectedSourceBehavior:
    - The explicit enclosing-box equality edge case returns WITHIN.
    - The common translation preserves equality.
    - The follow-up result is WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_RECTANGLE_OUTSIDE
    category: EDGE
    description: A zero-radius circle is disjoint from a point rectangle at a different
      coordinate.
    preconditions:
    - Circle center is (2,-3) and radius is 0.
    - Rectangle has minX=maxX=5 and minY=maxY=-3.
    - The rectangle point is outside the circle enclosing box.
    expectedSourceBehavior:
    - The enclosing-box relation is DISJOINT.
    - relate(Rectangle) returns DISJOINT.
    - The follow-up result is DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_COORDINATE_CONTAINS
    category: NORMAL
    description: A translated-coordinate case exercises containment in the negative-x,
      positive-y quadrant.
    preconditions:
    - Circle center is (-20,15) and radius is 3.
    - Rectangle is [-22,-18] x [13,17].
    - The rectangle is strictly inside the circle's enclosing box and every corner
      is strictly inside the circle.
    expectedSourceBehavior:
    - The source result is CONTAINS.
    - The fixed positive and negative follow-up shifts do not alter the geometric
      relation.
    - The follow-up result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_COORDINATE_PHASE2_DISJOINT
    category: NORMAL
    description: A negative-coordinate rectangle overlaps the circle bounding box
      but misses the circle at its closest corner.
    preconditions:
    - Circle center is (-20,15) and radius is 3.
    - Rectangle is [-17,-14] x [17,20].
    - The circle axis is outside the rectangle on both axes.
    - The closest corner (-17,17) has distance greater than 3, while the bounding
      boxes intersect.
    expectedSourceBehavior:
    - Phase 2 reaches the closest-point test.
    - The result is DISJOINT.
    - The follow-up result is DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ASYMMETRIC_FARTHEST_SELECTION
    category: NORMAL
    description: An asymmetric rectangle exercises the strict comparison used to choose
      the farther x and y edges.
    preconditions:
    - Circle center is (10,-10) and radius is 8.
    - Rectangle is [7,16] x [-15,-5].
    - The circle axis lies inside the rectangle on both axes.
    - The distances from the axis to the two x edges and to the two y edges are unequal.
    - The selected farthest corner is strictly inside the circle.
    expectedSourceBehavior:
    - Phase 2 uses the both-axes-inside branches and deterministic farthest-edge selections.
    - The result is CONTAINS.
    - The follow-up result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ASYMMETRIC_FARTHEST_OUTSIDE
    category: NORMAL
    description: An asymmetric rectangle has a contained closest point but an outside
      selected farthest corner.
    preconditions:
    - Circle center is (10,-10) and radius is 8.
    - Rectangle is [4,17] x [-14,-3].
    - The circle axis lies inside the rectangle on both axes.
    - The closest point is strictly inside the circle, but the selected farthest corner
      is outside.
    expectedSourceBehavior:
    - The closest-point test avoids DISJOINT.
    - The farthest-point test returns false and the result is INTERSECTS.
    - The follow-up result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
