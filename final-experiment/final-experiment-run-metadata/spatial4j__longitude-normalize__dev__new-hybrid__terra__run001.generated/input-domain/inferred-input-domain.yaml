InputDomain:
  summary: All Java double longitude values are valid source inputs; the domain covers
    the in-range identity path, each out-of-range modulus branch, antimeridian sentinels,
    remainder discontinuities, finite precision regimes, and non-finite IEEE-754 values.
  globalConstraints:
  - arg0 must be a representable Java double value, including finite values, signed
    zero, subnormal values, NaN, and positive or negative infinity; the supplied method
    declares no narrower input validity restriction.
  - Each source case is executed with follow-up input arg0 + 360.0 exactly as generated
    by LongitudeNormalizeMetamorphicSpec.generateFollowUp.
  - '{No input class is excluded=NaN and infinities are reachable double inputs and
    produce NaN through the modulus calculation rather than throwing an exception.}'
  diversity:
    normalizationPath:
    - distinct
    - measurable
    - inclusive fast path for -180 <= lon_deg <= 180; negative modulus remainder path;
      zero-remainder positive sentinel path; nonnegative nonzero modulus remainder
      path; IEEE-754 NaN propagation
  scenarios:
  - id: LOWER_ANTIMERIDIAN_IN_RANGE
    category: BOUNDARY
    description: Exact -180.0 is included by the lower bound of the fast-path condition.
    preconditions:
    - arg0 == -180.0
    expectedSourceBehavior:
    - Returns -180.0 unchanged without evaluating the modulus expression.
    - The follow-up is 180.0, so the supplied relation uses its antimeridian equivalence
      exception.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_ANTIMERIDIAN_IN_RANGE
    category: BOUNDARY
    description: Exact 180.0 is included by the upper bound of the fast-path condition.
    preconditions:
    - arg0 == 180.0
    expectedSourceBehavior:
    - Returns 180.0 unchanged without evaluating the modulus expression.
    - The follow-up is 540.0, whose zero remainder follows the positive sentinel path
      and returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_LOWER_IN_RANGE_BOUND
    category: BOUNDARY
    description: The immediately representable value above -180.0 remains in the identity
      interval.
    preconditions:
    - arg0 == Math.nextUp(-180.0)
    - arg0 > -180.0
    - arg0 <= 180.0
    expectedSourceBehavior:
    - Returns arg0 exactly through the inclusive fast path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_UPPER_IN_RANGE_BOUND
    category: BOUNDARY
    description: The immediately representable value below 180.0 remains in the identity
      interval.
    preconditions:
    - arg0 == Math.nextDown(180.0)
    - arg0 >= -180.0
    - arg0 < 180.0
    expectedSourceBehavior:
    - Returns arg0 exactly through the inclusive fast path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_IN_RANGE
    category: NORMAL
    description: Ordinary zero uses the common in-range return path.
    preconditions:
    - arg0 == 0.0
    expectedSourceBehavior:
    - Returns 0.0 unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_IN_RANGE
    category: EDGE
    description: IEEE-754 negative zero satisfies both in-range comparisons.
    preconditions:
    - Double.doubleToRawLongBits(arg0) == Double.doubleToRawLongBits(-0.0)
    expectedSourceBehavior:
    - Returns the source value directly through the fast path, preserving the observable
      signed-zero representation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_MIN_SUBNORMAL_IN_RANGE
    category: EDGE
    description: The smallest positive nonzero double is an in-range longitude.
    preconditions:
    - arg0 == Double.MIN_VALUE
    expectedSourceBehavior:
    - Returns arg0 exactly without precision-changing normalization arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_MIN_SUBNORMAL_IN_RANGE
    category: EDGE
    description: The smallest-magnitude negative nonzero double is an in-range longitude.
    preconditions:
    - arg0 == -Double.MIN_VALUE
    expectedSourceBehavior:
    - Returns arg0 exactly without precision-changing normalization arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_JUST_OUTSIDE_RANGE
    category: NORMAL
    description: A positive longitude above 180 with a nonzero positive modulus remainder
      reaches the final else branch.
    preconditions:
    - arg0 == 181.25
    - arg0 > 180.0
    - ((arg0 + 180.0) % 360.0) > 0.0
    expectedSourceBehavior:
    - Computes off as 1.25.
    - Returns -178.75 from -180.0 + off.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_JUST_OUTSIDE_RANGE
    category: NORMAL
    description: A negative longitude below -180 with a negative modulus remainder
      reaches the off < 0 branch.
    preconditions:
    - arg0 == -181.25
    - arg0 < -180.0
    - ((arg0 + 180.0) % 360.0) < 0.0
    expectedSourceBehavior:
    - Computes off as -1.25.
    - Returns 178.75 from 180.0 + off.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FULL_REVOLUTION_OFFSET
    category: NORMAL
    description: A positive out-of-range input with remainder 180 exercises the nonnegative
      nonzero remainder path.
    preconditions:
    - arg0 == 360.0
    - ((arg0 + 180.0) % 360.0) == 180.0
    expectedSourceBehavior:
    - Returns 0.0 from -180.0 + 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FULL_REVOLUTION_OFFSET
    category: NORMAL
    description: A negative out-of-range input with remainder -180 exercises the negative-remainder
      branch.
    preconditions:
    - arg0 == -360.0
    - ((arg0 + 180.0) % 360.0) == -180.0
    expectedSourceBehavior:
    - Returns 0.0 from 180.0 + -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ZERO_REMAINDER_SENTINEL
    category: BOUNDARY
    description: Positive 540.0 produces zero remainder and therefore selects the
      explicit positive-antimeridian sentinel.
    preconditions:
    - arg0 == 540.0
    - ((arg0 + 180.0) % 360.0) == 0.0
    - arg0 > 0.0
    expectedSourceBehavior:
    - Takes the off == 0 && lon_deg > 0 branch.
    - Returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_REMAINDER_SENTINEL
    category: BOUNDARY
    description: Negative -540.0 produces zero remainder but cannot satisfy the positive-longitude
      sentinel condition.
    preconditions:
    - arg0 == -540.0
    - ((arg0 + 180.0) % 360.0) == 0.0
    - arg0 < 0.0
    expectedSourceBehavior:
    - Does not take the positive-antimeridian sentinel branch.
    - Returns -180.0 through the final else branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_POSITIVE_ZERO_REMAINDER
    category: BOUNDARY
    description: The representable value immediately below 540.0 has a remainder just
      below 360 and normalizes just below positive 180.
    preconditions:
    - arg0 == Math.nextDown(540.0)
    - arg0 > 180.0
    - ((arg0 + 180.0) % 360.0) > 0.0
    expectedSourceBehavior:
    - Takes the final else branch rather than the exact-zero sentinel branch.
    - Returns a value strictly less than 180.0 and close to 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_POSITIVE_ZERO_REMAINDER
    category: BOUNDARY
    description: The representable value immediately above 540.0 has a small positive
      remainder and normalizes just above negative 180.
    preconditions:
    - arg0 == Math.nextUp(540.0)
    - arg0 > 180.0
    - ((arg0 + 180.0) % 360.0) > 0.0
    expectedSourceBehavior:
    - Takes the final else branch rather than the exact-zero sentinel branch.
    - Returns a value strictly greater than -180.0 and close to -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_NEGATIVE_ZERO_REMAINDER
    category: BOUNDARY
    description: The representable value immediately above -540.0 has a negative remainder
      just above -360 and normalizes near negative 180.
    preconditions:
    - arg0 == Math.nextUp(-540.0)
    - arg0 < -180.0
    - ((arg0 + 180.0) % 360.0) < 0.0
    expectedSourceBehavior:
    - Takes the off < 0 branch.
    - Returns a value strictly greater than -180.0 and close to -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_NEGATIVE_ZERO_REMAINDER
    category: BOUNDARY
    description: The representable value immediately below -540.0 has a small negative
      remainder and normalizes near positive 180.
    preconditions:
    - arg0 == Math.nextDown(-540.0)
    - arg0 < -180.0
    - ((arg0 + 180.0) % 360.0) < 0.0
    expectedSourceBehavior:
    - Takes the off < 0 branch.
    - Returns a value strictly less than 180.0 and close to 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_POSITIVE_MULTI_REVOLUTION_FRACTION
    category: EDGE
    description: A large finite positive longitude with a fractional residual exercises
      modulus normalization beyond a single revolution.
    preconditions:
    - arg0 == 1000012.5
    - arg0 > 180.0
    - Double.isFinite(arg0)
    expectedSourceBehavior:
    - Skips the fast path and returns a finite normalized value in the inclusive interval
      [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_MULTI_REVOLUTION_FRACTION
    category: EDGE
    description: A large finite negative longitude with a fractional residual exercises
      negative Java remainder behavior across many revolutions.
    preconditions:
    - arg0 == -1000012.5
    - arg0 < -180.0
    - Double.isFinite(arg0)
    expectedSourceBehavior:
    - Skips the fast path and returns a finite normalized value in the inclusive interval
      [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ULP_256_PRECISION_REGIME
    category: EDGE
    description: At 2^60, double spacing is 256 degrees, so adding 360.0 to form the
      follow-up is subject to representational rounding.
    preconditions:
    - arg0 == 0x1.0p60
    - Math.ulp(arg0) == 256.0
    expectedSourceBehavior:
    - Returns a finite normalized value in the inclusive interval [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ULP_256_PRECISION_REGIME
    category: EDGE
    description: The negative 2^60 precision regime combines rounded follow-up addition
      with the negative remainder branch.
    preconditions:
    - arg0 == -0x1.0p60
    - Math.ulp(arg0) == 256.0
    expectedSourceBehavior:
    - Returns a finite normalized value in the inclusive interval [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ULP_512_PRECISION_REGIME
    category: EDGE
    description: At 2^61, double spacing is 512 degrees, larger than one full-revolution
      shift.
    preconditions:
    - arg0 == 0x1.0p61
    - Math.ulp(arg0) == 512.0
    expectedSourceBehavior:
    - Returns a finite normalized value in the inclusive interval [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ULP_512_PRECISION_REGIME
    category: EDGE
    description: The negative 2^61 precision regime tests rounded follow-up addition
      with negative modulus semantics.
    preconditions:
    - arg0 == -0x1.0p61
    - Math.ulp(arg0) == 512.0
    expectedSourceBehavior:
    - Returns a finite normalized value in the inclusive interval [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FOLLOW_UP_ABSORPTION_REGIME
    category: EDGE
    description: At 2^62, the 1024-degree ULP causes adding 360.0 to be absorbed by
      floating-point representation.
    preconditions:
    - arg0 == 0x1.0p62
    - Math.ulp(arg0) == 1024.0
    - arg0 + 360.0 == arg0
    expectedSourceBehavior:
    - Returns a finite normalized value in the inclusive interval [-180.0, 180.0].
    - The generated follow-up is bitwise the same numerical value as the source.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FOLLOW_UP_ABSORPTION_REGIME
    category: EDGE
    description: Negative 2^62 also absorbs the 360-degree follow-up addition.
    preconditions:
    - arg0 == -0x1.0p62
    - Math.ulp(arg0) == 1024.0
    - arg0 + 360.0 == arg0
    expectedSourceBehavior:
    - Returns a finite normalized value in the inclusive interval [-180.0, 180.0].
    - The generated follow-up is numerically equal to the source.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_FINITE_POSITIVE
    category: EDGE
    description: The greatest finite positive double reaches the modulus path at the
      largest finite magnitude.
    preconditions:
    - arg0 == Double.MAX_VALUE
    - Double.isFinite(arg0)
    - arg0 > 180.0
    - arg0 + 360.0 == arg0
    expectedSourceBehavior:
    - Returns a finite normalized value in the inclusive interval [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_FINITE_NEGATIVE
    category: EDGE
    description: The greatest-magnitude finite negative double reaches the negative
      modulus path at the largest finite magnitude.
    preconditions:
    - arg0 == -Double.MAX_VALUE
    - Double.isFinite(arg0)
    - arg0 < -180.0
    - arg0 + 360.0 == arg0
    expectedSourceBehavior:
    - Returns a finite normalized value in the inclusive interval [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_INPUT
    category: EDGE
    description: NaN fails both in-range comparisons and propagates through the remainder
      and arithmetic operations.
    preconditions:
    - Double.isNaN(arg0)
    expectedSourceBehavior:
    - Does not take the fast path.
    - Returns NaN because (arg0 + 180.0) % 360.0 is NaN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INFINITY_INPUT
    category: EDGE
    description: Positive infinity is outside the fast path and produces NaN when
      used with the remainder operator.
    preconditions:
    - arg0 == Double.POSITIVE_INFINITY
    expectedSourceBehavior:
    - Does not take the fast path.
    - Returns NaN because positive infinity modulo 360.0 is NaN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INFINITY_INPUT
    category: EDGE
    description: Negative infinity is outside the fast path and produces NaN when
      used with the remainder operator.
    preconditions:
    - arg0 == Double.NEGATIVE_INFINITY
    expectedSourceBehavior:
    - Does not take the fast path.
    - Returns NaN because negative infinity modulo 360.0 is NaN.
    targetCases: 1
    emptyOutputAllowed: false
