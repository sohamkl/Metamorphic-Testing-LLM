InputDomain:
  summary: Finite, valid geographic rectangles and points, including ordinary, dateline-wrapping,
    degenerate, polar, boundary, and disjoint cases; R=[minX,maxX,minY,maxY] and P=(x,y).
  globalConstraints:
  - The rectangle and point are non-null, as required by generateFollowUp.
  - rectangle.getContext() is non-null and rectangle.getContext().isGeo() is true;
    the MR is specifically a longitude rotation on a geographic context.
  - Construct the source rectangle with RectangleImpl(double,double,double,double,SpatialContext)
    and construct the point with rectangle.getContext().makePoint(x,y).
  - 'All rectangle and point coordinates are finite: no NaN or positive or negative
    infinity.'
  - Rectangle longitudes and point longitude are in the closed interval [-180,180].
  - Rectangle latitudes and point latitude are in the closed interval [-90,90].
  - rectangle.getMinY() <= rectangle.getMaxY(), matching the ordering asserted by
    RectangleImpl.reset.
  - rectangle.getWidth() < 360; a 360-degree rectangle is excluded because independently
    normalizing both endpoints in generateFollowUp can collapse its two longitudes
    to the same normalized longitude, so the supplied transformation does not preserve
    that valid source class.
  - No empty rectangle is generated because RectangleImpl uses a NaN minX as its empty
    sentinel, and the MR does not request invalid or empty inputs.
  diversity:
    rectangleLongitudeTopology:
    - non_wrapping_minX_less_than_maxX
    - dateline_wrapping_minX_greater_than_maxX
    - zero_width_minX_equals_maxX
    - dateline_zero_width_180_to_minus180
    latitudePosition:
    - strictly_inside
    - exactly_minY
    - exactly_maxY
    - below_minY
    - above_maxY
    - south_pole
    - north_pole
    longitudePosition:
    - direct_interval_inside
    - shifted_by_plus360_inside
    - shifted_by_minus360_inside
    - west_disjoint
    - east_disjoint
    - wrapped_gap_disjoint
    - exactly_minX
    - exactly_maxX
    - equivalent_dateline_endpoint
    sourceRelation:
    - CONTAINS
    - DISJOINT
    rotationTopologyChange:
    - unwrapped_to_unwrapped
    - unwrapped_to_wrapped
    - wrapped_to_unwrapped
    - wrapped_to_wrapped
    rectangleDimension:
    - positive_width_and_height
    - zero_width
    - zero_height
    - point_rectangle
    - very_narrow
    - very_wide
  scenarios:
  - id: UNWRAPPED_INTERIOR_ROTATES_UNWRAPPED
    category: NORMAL
    description: An ordinary non-wrapping rectangle contains a point strictly inside,
      and the 150-degree rotation remains non-wrapping.
    preconditions:
    - R=[-100,-40,-20,30] and P=(-70,0).
    expectedSourceBehavior:
    - relate(P) returns SpatialRelation.CONTAINS through the geographic direct-overlap
      short circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNWRAPPED_INTERIOR_ROTATES_WRAPPED
    category: NORMAL
    description: An ordinary rectangle contains its interior point while rotation
      moves one longitude endpoint across 180 degrees.
    preconditions:
    - R=[0,60,-20,30] and P=(30,0).
    expectedSourceBehavior:
    - relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_DIRECT_SEGMENT_ROTATES_WRAPPED
    category: NORMAL
    description: A dateline-wrapping rectangle contains a point in its numerically
      direct eastern segment.
    preconditions:
    - R=[20,-100,-20,30] and P=(100,0).
    expectedSourceBehavior:
    - The negative raw width is unwrapped by adding 360 to maxX, and relate(P) returns
      SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_SHIFTED_SEGMENT_ROTATES_UNWRAPPED
    category: NORMAL
    description: A dateline-wrapping rectangle contains a western-longitude point
      only after the point is shifted by 360 degrees.
    preconditions:
    - R=[140,-100,-20,30] and P=(-120,0).
    expectedSourceBehavior:
    - After pX < minX causes pX += 360, relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NARROW_WRAP_EASTERN_INTERIOR
    category: NORMAL
    description: A narrow rectangle crossing the dateline contains a point east of
      its positive-longitude edge.
    preconditions:
    - R=[170,-170,-10,10] and P=(175,0).
    expectedSourceBehavior:
    - relate(P) returns SpatialRelation.CONTAINS without shifting the source point.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NARROW_WRAP_WESTERN_INTERIOR
    category: NORMAL
    description: A narrow rectangle crossing the dateline contains a negative-longitude
      point via the plus-360 shift.
    preconditions:
    - R=[170,-170,-10,10] and P=(-175,0).
    expectedSourceBehavior:
    - relate(P) returns SpatialRelation.CONTAINS after shifting pX by 360.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNWRAPPED_MIN_X_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on a non-wrapping rectangle's minimum longitude.
    preconditions:
    - R=[-40,20,-20,30] and P=(-40,0).
    expectedSourceBehavior:
    - Inclusive longitude comparisons produce SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNWRAPPED_MAX_X_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on a non-wrapping rectangle's maximum longitude.
    preconditions:
    - R=[-40,20,-20,30] and P=(20,0).
    expectedSourceBehavior:
    - Inclusive longitude comparisons produce SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_MIN_X_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the positive-longitude endpoint of a wrapping
      rectangle.
    preconditions:
    - R=[170,-170,-10,10] and P=(170,0).
    expectedSourceBehavior:
    - After rectangle unwrapping, the point equals minX and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_MAX_X_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the negative-longitude endpoint of a wrapping
      rectangle.
    preconditions:
    - R=[170,-170,-10,10] and P=(-170,0).
    expectedSourceBehavior:
    - The point is shifted to 190, equal to the unwrapped maxX, and relate(P) returns
      SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIN_Y_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the rectangle's minimum latitude.
    preconditions:
    - R=[-40,20,-20,30] and P=(0,-20).
    expectedSourceBehavior:
    - The strict latitude rejection conditions do not reject equality, so relate(P)
      returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_Y_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the rectangle's maximum latitude.
    preconditions:
    - R=[-40,20,-20,30] and P=(0,30).
    expectedSourceBehavior:
    - The strict latitude rejection conditions do not reject equality, so relate(P)
      returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_CORNER
    category: BOUNDARY
    description: The point equals both minimum coordinates of a non-wrapping rectangle.
    preconditions:
    - R=[-40,20,-20,30] and P=(-40,-20).
    expectedSourceBehavior:
    - Both rectangle boundaries are inclusive and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_NORTHWEST_ENDPOINT_CORNER
    category: BOUNDARY
    description: The point combines maximum latitude with the shifted negative-longitude
      endpoint of a wrapping rectangle.
    preconditions:
    - R=[170,-170,-10,10] and P=(-170,10).
    expectedSourceBehavior:
    - Inclusive latitude and shifted inclusive longitude comparisons return SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_ABOVE_UNWRAPPED
    category: NORMAL
    description: A point with an otherwise interior longitude is above an ordinary
      rectangle.
    preconditions:
    - R=[-40,20,-20,30] and P=(0,31).
    expectedSourceBehavior:
    - point.getY() > getMaxY() causes the early SpatialRelation.DISJOINT return.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_BELOW_UNWRAPPED
    category: NORMAL
    description: A point with an otherwise interior longitude is below an ordinary
      rectangle.
    preconditions:
    - R=[-40,20,-20,30] and P=(0,-21).
    expectedSourceBehavior:
    - point.getY() < getMinY() causes the early SpatialRelation.DISJOINT return.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_ABOVE_WRAPPED
    category: NORMAL
    description: A point whose longitude belongs to a wrapping rectangle is above
      its latitude range.
    preconditions:
    - R=[170,-170,-10,10] and P=(-175,11).
    expectedSourceBehavior:
    - The latitude check returns SpatialRelation.DISJOINT before dateline unwrapping.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_BELOW_WRAPPED
    category: NORMAL
    description: A point whose longitude belongs to a wrapping rectangle is below
      its latitude range.
    preconditions:
    - R=[170,-170,-10,10] and P=(175,-11).
    expectedSourceBehavior:
    - The latitude check returns SpatialRelation.DISJOINT before dateline unwrapping.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LONGITUDE_WEST_OF_UNWRAPPED
    category: NORMAL
    description: A latitude-interior point is west of a non-wrapping rectangle.
    preconditions:
    - R=[-40,20,-20,30] and P=(-41,0).
    expectedSourceBehavior:
    - pX < minX causes pX += 360, after which pX > maxX and relate(P) returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LONGITUDE_EAST_OF_UNWRAPPED
    category: NORMAL
    description: A latitude-interior point is east of a non-wrapping rectangle.
    preconditions:
    - R=[-40,20,-20,30] and P=(21,0).
    expectedSourceBehavior:
    - pX > maxX causes pX -= 360, after which pX < minX and relate(P) returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NARROW_WRAP_CENTRAL_GAP
    category: NORMAL
    description: A point lies in the large central gap excluded by a narrow dateline-wrapping
      rectangle.
    preconditions:
    - R=[170,-170,-10,10] and P=(0,0).
    expectedSourceBehavior:
    - After rectangle unwrapping and pX += 360, pX exceeds maxX and relate(P) returns
      SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_WRAP_GAP
    category: NORMAL
    description: A point lies in the excluded gap of an asymmetric wrapping rectangle.
    preconditions:
    - R=[-20,-100,-20,30] and P=(-50,0).
    expectedSourceBehavior:
    - The shifted point remains beyond the unwrapped maximum longitude, producing
      SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LINE_CONTAINS_POINT
    category: EDGE
    description: A non-wrapping zero-width rectangle contains a point on its vertical
      line.
    preconditions:
    - R=[10,10,-20,30] and P=(10,0).
    expectedSourceBehavior:
    - Inclusive equality at minX=maxX produces SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LINE_REJECTS_WEST_POINT
    category: EDGE
    description: A point is immediately west of a zero-width rectangle.
    preconditions:
    - R=[10,10,-20,30] and P=(9,0).
    expectedSourceBehavior:
    - The longitude adjustment cannot place the point on x=10, so relate(P) returns
      SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LINE_REJECTS_EAST_POINT
    category: EDGE
    description: A point is immediately east of a zero-width rectangle.
    preconditions:
    - R=[10,10,-20,30] and P=(11,0).
    expectedSourceBehavior:
    - The longitude adjustment cannot place the point on x=10, so relate(P) returns
      SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_ZERO_WIDTH_CONTAINS_POSITIVE_180
    category: EDGE
    description: The 180-to-minus-180 representation denotes a zero-width dateline
      line probed at positive 180.
    preconditions:
    - R=[180,-180,-20,30] and P=(180,0).
    expectedSourceBehavior:
    - The raw width -360 unwraps maxX to 180, and equality produces SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_ZERO_WIDTH_CONTAINS_NEGATIVE_180
    category: EDGE
    description: The dateline zero-width rectangle is probed using the equivalent
      negative-180 longitude.
    preconditions:
    - R=[180,-180,-20,30] and P=(-180,0).
    expectedSourceBehavior:
    - pX is shifted by 360 to 180 and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_ZERO_WIDTH_REJECTS_ZERO
    category: EDGE
    description: A point away from the dateline is outside the 180-to-minus-180 zero-width
      rectangle.
    preconditions:
    - R=[180,-180,-20,30] and P=(0,0).
    expectedSourceBehavior:
    - After pX += 360, pX is greater than the unwrapped maxX and relate(P) returns
      SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_LINE_CONTAINS_POINT
    category: EDGE
    description: A zero-height rectangle contains a point on its horizontal line.
    preconditions:
    - R=[-40,20,5,5] and P=(0,5).
    expectedSourceBehavior:
    - Latitude equality passes both strict rejection checks and relate(P) returns
      SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_LINE_REJECTS_POINT
    category: EDGE
    description: A point not on a zero-height rectangle's latitude is rejected.
    preconditions:
    - R=[-40,20,5,5] and P=(0,6).
    expectedSourceBehavior:
    - The early upper-latitude check returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_EXACT_MATCH
    category: EDGE
    description: Both rectangle dimensions are zero and the point exactly matches
      the rectangle coordinate.
    preconditions:
    - R=[10,10,5,5] and P=(10,5).
    expectedSourceBehavior:
    - Inclusive equality in both dimensions produces SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_LONGITUDE_MISMATCH
    category: EDGE
    description: A point has the correct latitude but not the longitude of a point
      rectangle.
    preconditions:
    - R=[10,10,5,5] and P=(11,5).
    expectedSourceBehavior:
    - The final longitude check returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_LATITUDE_MISMATCH
    category: EDGE
    description: A point has the correct longitude but not the latitude of a point
      rectangle.
    preconditions:
    - R=[10,10,5,5] and P=(10,6).
    expectedSourceBehavior:
    - The early latitude check returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTH_POLE_BOUNDARY
    category: BOUNDARY
    description: A rectangle reaches the south pole and the point lies exactly at
      latitude -90.
    preconditions:
    - R=[-40,20,-90,-70] and P=(0,-90).
    expectedSourceBehavior:
    - Minimum-latitude equality is included and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTH_POLE_BOUNDARY
    category: BOUNDARY
    description: A rectangle reaches the north pole and the point lies exactly at
      latitude 90.
    preconditions:
    - R=[-40,20,70,90] and P=(0,90).
    expectedSourceBehavior:
    - Maximum-latitude equality is included and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_180_RECTANGLE_ENDPOINT_WITH_POSITIVE_180_POINT
    category: BOUNDARY
    description: A point at positive 180 is tested against an unwrapped rectangle
      beginning at negative 180.
    preconditions:
    - R=[-180,-170,-10,10] and P=(180,0).
    expectedSourceBehavior:
    - pX > maxX causes subtraction of 360, yielding -180 and SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_180_RECTANGLE_ENDPOINT_WITH_NEGATIVE_180_POINT
    category: BOUNDARY
    description: A point at negative 180 is tested against an unwrapped rectangle
      ending at positive 180.
    preconditions:
    - R=[170,180,-10,10] and P=(-180,0).
    expectedSourceBehavior:
    - pX < minX causes addition of 360, yielding 180 and SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_WIDE_UNWRAPPED_INTERIOR
    category: EDGE
    description: A 340-degree non-wrapping rectangle contains an ordinary interior
      longitude.
    preconditions:
    - R=[-170,170,-10,10] and P=(0,0).
    expectedSourceBehavior:
    - The direct geographic interval check returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_WIDE_UNWRAPPED_DATELINE_GAP
    category: EDGE
    description: A point at the dateline lies in the 20-degree gap of a 340-degree
      unwrapped rectangle.
    preconditions:
    - R=[-170,170,-10,10] and P=(180,0).
    expectedSourceBehavior:
    - pX is shifted to -180, which is below minX, so relate(P) returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_WIDE_WRAPPED_INTERIOR
    category: EDGE
    description: A 350-degree wrapping rectangle contains longitude zero after dateline
      unwrapping.
    preconditions:
    - R=[170,160,-10,10] and P=(0,0).
    expectedSourceBehavior:
    - The rectangle unwraps to [170,520], the point shifts to 360, and relate(P) returns
      SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_WIDE_WRAPPED_NARROW_GAP
    category: EDGE
    description: A point lies in the 10-degree gap excluded by a 350-degree wrapping
      rectangle.
    preconditions:
    - R=[170,160,-10,10] and P=(165,0).
    expectedSourceBehavior:
    - The point shifts to 525, beyond the unwrapped maxX of 520, and relate(P) returns
      SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_CUT_ENDPOINT_AT_180
    category: BOUNDARY
    description: The rectangle's maximum longitude becomes exactly 180 after the supplied
      150-degree rotation.
    preconditions:
    - R=[-30,30,-10,10] and P=(30,0).
    expectedSourceBehavior:
    - The source point is on maxX and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_CUT_STARTS_AT_180
    category: BOUNDARY
    description: The rectangle's minimum longitude becomes exactly 180 while its maximum
      wraps under the supplied rotation.
    preconditions:
    - R=[30,60,-10,10] and P=(30,0).
    expectedSourceBehavior:
    - The source point is on minX and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_MIN_X
    category: BOUNDARY
    description: The point is one billionth of a degree inside the minimum-longitude
      boundary.
    preconditions:
    - R=[-40,20,-20,30] and P=(-39.999999999,0).
    expectedSourceBehavior:
    - The point is strictly inside the longitude interval and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_MIN_X
    category: BOUNDARY
    description: The point is one billionth of a degree outside the minimum-longitude
      boundary.
    preconditions:
    - R=[-40,20,-20,30] and P=(-40.000000001,0).
    expectedSourceBehavior:
    - After the plus-360 adjustment, the point is beyond maxX and relate(P) returns
      SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_MAX_X
    category: BOUNDARY
    description: The point is one billionth of a degree inside the maximum-longitude
      boundary.
    preconditions:
    - R=[-40,20,-20,30] and P=(19.999999999,0).
    expectedSourceBehavior:
    - The point is strictly inside the longitude interval and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_MAX_X
    category: BOUNDARY
    description: The point is one billionth of a degree outside the maximum-longitude
      boundary.
    preconditions:
    - R=[-40,20,-20,30] and P=(20.000000001,0).
    expectedSourceBehavior:
    - After the minus-360 adjustment, the point is below minX and relate(P) returns
      SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_MAX_Y
    category: BOUNDARY
    description: The point is one billionth of a degree below the maximum-latitude
      boundary.
    preconditions:
    - R=[-40,20,-20,30] and P=(0,29.999999999).
    expectedSourceBehavior:
    - The point passes the latitude check and relate(P) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_MAX_Y
    category: BOUNDARY
    description: The point is one billionth of a degree above the maximum-latitude
      boundary.
    preconditions:
    - R=[-40,20,-20,30] and P=(0,30.000000001).
    expectedSourceBehavior:
    - The strict upper-latitude comparison returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
