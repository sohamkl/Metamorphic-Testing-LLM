InputDomain:
  summary: Finite Java double longitudes, broadly covering the direct-return interval,
    both modulo branches, dateline sentinels, multiple turns, floating-point neighbors,
    precision-loss regions, and finite extrema; each follow-up is computed as source
    + 360.0.
  globalConstraints:
  - The source input is exactly one Java double supplied to the static method normLonDEG(double).
  - 'The source input must be finite: Double.isFinite(lon_deg) is true.'
  - NaN and positive or negative infinity are excluded because the supplied description
    defines longitude normalization, the metamorphic relation does not request invalid
    inputs, and the source specifies no invalid-input contract.
  - The follow-up input is computed using Java double arithmetic as lon_deg + 360.0;
    no decimal or arbitrary-precision replacement is used.
  - Both +0.0 and -0.0 are valid finite source inputs and must remain distinguishable
    when checking the source method's direct-return behavior.
  - Normalized results must be observed as Java doubles; +180.0 and -180.0 are treated
    as the same geographic spot for the metamorphic relation because the supplied
    description explicitly permits both representations.
  - For non-endpoint results, compare source and follow-up as circular longitudes
    rather than treating a difference of 360 degrees as a different spot.
  - Do not discard cases where floating-point addition rounds lon_deg + 360.0 to a
    change other than exactly 360.0, or rounds it back to lon_deg; these are reachable
    finite-double classes and must be recorded as precision-stress cases.
  diversity:
    sourceRegion:
    - '[-180,180] direct-return region'
    - less than -180
    - greater than 180
    sourceBranch:
    - direct return
    - off less than zero
    - positive off
    - zero off with positive source
    - zero off with nonpositive source
    datelinePosition:
    - -180 endpoint
    - +180 endpoint
    - immediately inside
    - immediately outside
    - congruent to an endpoint
    - not endpoint-congruent
    turnDirection:
    - negative multiple-turn
    - no completed source turn
    - positive multiple-turn
    numericForm:
    - signed zero
    - integer
    - binary-exact fraction
    - subnormal or near-zero
    - large finite
    - finite extremum
    followUpArithmetic:
    - changes by exactly 360.0
    - changes by a rounded amount other than 360.0
    - rounds to the source value
  scenarios:
  - id: EXACT_LOWER_DATELINE_ENDPOINT
    category: BOUNDARY
    description: The source is the inclusive lower endpoint of the direct-return interval,
      while adding one turn produces the inclusive upper endpoint.
    preconditions:
    - lon_deg == -180.0
    expectedSourceBehavior:
    - The condition lon_deg >= -180 && lon_deg <= 180 is true.
    - The method returns exactly -180.0 without executing the remainder calculation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_UPPER_DATELINE_ENDPOINT
    category: BOUNDARY
    description: The source is the inclusive upper endpoint and its follow-up is outside
      the direct-return interval.
    preconditions:
    - lon_deg == 180.0
    expectedSourceBehavior:
    - The direct-return condition is true.
    - The method returns exactly 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IMMEDIATELY_INSIDE_DATELINE_ENDPOINTS
    category: BOUNDARY
    description: The source is the closest representable double strictly inside either
      endpoint.
    preconditions:
    - lon_deg is either Math.nextUp(-180.0) or Math.nextDown(180.0).
    expectedSourceBehavior:
    - The source remains within the inclusive direct-return interval.
    - The method returns the source double exactly, avoiding modulo-induced shifting.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SIGNED_ZERO_DIRECT_RETURN
    category: EDGE
    description: The source is one of the two IEEE-754 signed zero representations.
    preconditions:
    - Double.doubleToRawLongBits(lon_deg) equals the raw bits of either +0.0 or -0.0.
    expectedSourceBehavior:
    - The direct-return condition is true.
    - The returned value is the original zero value, preserving its raw sign because
      the argument is returned as-is.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ORDINARY_NEGATIVE_INTERIOR
    category: NORMAL
    description: A negative longitude lies strictly between the lower endpoint and
      zero.
    preconditions:
    - -180.0 < lon_deg && lon_deg < 0.0
    - lon_deg is a normal finite double.
    expectedSourceBehavior:
    - The direct-return condition is true.
    - The method returns lon_deg exactly.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ORDINARY_POSITIVE_INTERIOR
    category: NORMAL
    description: A positive longitude lies strictly between zero and the upper endpoint.
    preconditions:
    - 0.0 < lon_deg && lon_deg < 180.0
    - lon_deg is a normal finite double.
    expectedSourceBehavior:
    - The direct-return condition is true.
    - The method returns lon_deg exactly.
    targetCases: 2
    emptyOutputAllowed: false
  - id: TINY_FINITE_LONGITUDES
    category: EDGE
    description: The source has a nonzero magnitude so small that adding it to 360
      may lose the source displacement through double rounding.
    preconditions:
    - lon_deg is finite and lon_deg != 0.0.
    - Math.abs(lon_deg) < Math.ulp(360.0) / 2.0.
    - Include one positive and one negative source.
    expectedSourceBehavior:
    - The source is inside the direct-return interval.
    - The source result remains exactly the tiny nonzero input, even if the follow-up
      construction loses that displacement.
    targetCases: 2
    emptyOutputAllowed: false
  - id: IMMEDIATELY_OUTSIDE_DATELINE_ENDPOINTS
    category: BOUNDARY
    description: The source is the closest representable double immediately beyond
      either inclusive endpoint.
    preconditions:
    - lon_deg is either Math.nextDown(-180.0) or Math.nextUp(180.0).
    expectedSourceBehavior:
    - The direct-return condition is false.
    - The result is computed through off = (lon_deg + 180.0) % 360.0 and remains within
      the documented inclusive range.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_NONSENTINEL_MODULO
    category: NORMAL
    description: A positive out-of-range source has a strictly positive, nonzero remainder
      and is not dateline-congruent.
    preconditions:
    - lon_deg > 180.0
    - off = (lon_deg + 180.0) % 360.0 satisfies 0.0 < off && off < 360.0.
    - Select sources from at least three distinct 360-degree turn bands.
    expectedSourceBehavior:
    - The direct-return and off < 0 branches are false.
    - The off == 0 sentinel is false.
    - The method returns -180.0 + off.
    targetCases: 4
    emptyOutputAllowed: false
  - id: NEGATIVE_NONSENTINEL_MODULO
    category: NORMAL
    description: A negative out-of-range source produces Java's negative nonzero remainder.
    preconditions:
    - lon_deg < -180.0
    - off = (lon_deg + 180.0) % 360.0 satisfies -360.0 < off && off < 0.0.
    - Select sources from at least three distinct negative 360-degree turn bands.
    expectedSourceBehavior:
    - The direct-return condition is false.
    - The off < 0 branch is taken.
    - The method returns 180.0 + off.
    targetCases: 4
    emptyOutputAllowed: false
  - id: POSITIVE_DATELINE_SENTINELS
    category: EDGE
    description: A positive source is one or more full turns beyond +180 and reaches
      the positive zero-remainder sentinel.
    preconditions:
    - lon_deg == 180.0 + 360.0 * k for an exactly represented positive integer k.
    - k >= 1 and lon_deg is finite.
    - (lon_deg + 180.0) % 360.0 == 0.0.
    expectedSourceBehavior:
    - The direct-return condition is false.
    - The off == 0 && lon_deg > 0 branch is taken.
    - The method returns exactly 180.0 rather than -180.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_DATELINE_SENTINELS
    category: EDGE
    description: A negative source is one or more full turns below -180 and reaches
      a zero-remainder path without satisfying the positive-source sentinel.
    preconditions:
    - lon_deg == -180.0 - 360.0 * k for an exactly represented positive integer k.
    - k >= 1 and lon_deg is finite.
    - (lon_deg + 180.0) % 360.0 == 0.0.
    expectedSourceBehavior:
    - The direct-return condition is false.
    - The off < 0 test is false for a zero remainder, and lon_deg > 0 is false.
    - The method returns exactly -180.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: FULL_TURN_CONGRUENT_TO_ZERO
    category: EDGE
    description: The out-of-range source is an exact positive or negative nonzero
      multiple of 360 degrees.
    preconditions:
    - lon_deg == 360.0 * k for an exactly represented nonzero integer k.
    - Math.abs(lon_deg) > 180.0.
    - Include both positive and negative k and more than one turn magnitude.
    expectedSourceBehavior:
    - The source bypasses the direct-return branch.
    - The remainder path returns exactly 0.0 as the normalized longitude.
    targetCases: 4
    emptyOutputAllowed: false
  - id: NEIGHBORS_OF_OUT_OF_RANGE_DATELINE_SENTINELS
    category: BOUNDARY
    description: The source is one representable step on either side of positive or
      negative 540 degrees, probing transitions around zero remainder.
    preconditions:
    - lon_deg is one of Math.nextDown(540.0), Math.nextUp(540.0), Math.nextDown(-540.0),
      or Math.nextUp(-540.0).
    expectedSourceBehavior:
    - The source bypasses the direct-return branch.
    - The computed remainder is checked on the appropriate side of zero instead of
      assuming the exact ±540 sentinel behavior.
    - The result remains within -180.0 through 180.0.
    targetCases: 4
    emptyOutputAllowed: false
  - id: LARGE_EXACT_FULL_TURN_ADDITION
    category: EDGE
    description: A large-magnitude source still has sufficient precision for Java
      addition to change it by exactly 360 degrees.
    preconditions:
    - Math.abs(lon_deg) > 1000000.0.
    - (lon_deg + 360.0) - lon_deg == 360.0.
    - lon_deg + 360.0 != lon_deg.
    - Include both signs.
    expectedSourceBehavior:
    - The source uses a remainder-based branch.
    - The normalized source result is finite and within the documented inclusive range.
    targetCases: 3
    emptyOutputAllowed: false
  - id: LARGE_ROUNDED_FOLLOW_UP_INCREMENT
    category: EDGE
    description: The source is so large that adding 360 changes the double, but the
      representable increment is not exactly 360.
    preconditions:
    - lon_deg + 360.0 != lon_deg.
    - (lon_deg + 360.0) - lon_deg != 360.0.
    - Math.abs(lon_deg) > 180.0.
    - Include both signs where representable.
    expectedSourceBehavior:
    - The source follows one of the out-of-range remainder paths.
    - The normalized source result is finite and lies in the inclusive range -180.0
      through 180.0.
    - The case exposes the floating-point transformation discrepancy rather than filtering
      it out.
    targetCases: 3
    emptyOutputAllowed: false
  - id: POSITIVE_FOLLOW_UP_ROUNDS_TO_SOURCE
    category: EDGE
    description: A very large positive finite source is unchanged by Java double addition
      of 360.
    preconditions:
    - lon_deg > 180.0.
    - lon_deg + 360.0 == lon_deg.
    - lon_deg < Double.MAX_VALUE.
    expectedSourceBehavior:
    - The source uses the positive out-of-range remainder logic.
    - The result is finite and within -180.0 through 180.0.
    - The unchanged follow-up is explicitly observable as a vacuous transformation
      caused by double precision.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_FOLLOW_UP_ROUNDS_TO_SOURCE
    category: EDGE
    description: A very large negative finite source is unchanged by Java double addition
      of 360.
    preconditions:
    - lon_deg < -180.0.
    - lon_deg + 360.0 == lon_deg.
    - lon_deg > -Double.MAX_VALUE.
    expectedSourceBehavior:
    - The source executes the negative out-of-range remainder logic, including either
      a negative or zero remainder according to Java arithmetic.
    - The result is finite and within -180.0 through 180.0.
    - The unchanged follow-up is explicitly observable as a precision-induced vacuous
      transformation.
    targetCases: 3
    emptyOutputAllowed: false
  - id: FINITE_DOUBLE_EXTREMA
    category: BOUNDARY
    description: The source is the largest finite positive or negative Java double.
    preconditions:
    - lon_deg is either Double.MAX_VALUE or -Double.MAX_VALUE.
    expectedSourceBehavior:
    - The source is outside the direct-return interval and executes remainder-based
      normalization.
    - Finite remainder arithmetic produces a finite result in the inclusive range
      -180.0 through 180.0.
    - The method does not require object construction or any state.
    targetCases: 2
    emptyOutputAllowed: false
