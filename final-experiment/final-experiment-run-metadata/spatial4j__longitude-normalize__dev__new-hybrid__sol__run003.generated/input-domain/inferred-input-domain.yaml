InputDomain:
  summary: Finite Java double longitudes spanning the direct-return interval, both
    normalization directions, exact and near wrap sentinels, fractional revolutions,
    and large stable magnitudes.
  globalConstraints:
  - The source input is exactly one Java double supplied to the static normLonDEG(double)
    method.
  - 'The source longitude must be finite: Double.isFinite(longitudeDeg) is true.'
  - 'The generated follow-up must remain finite and distinct from the source: Double.isFinite(longitudeDeg
    + 360.0) is true and longitudeDeg + 360.0 != longitudeDeg.'
  - 'The floating-point transformation must represent one measurable revolution: (longitudeDeg
    + 360.0) - longitudeDeg == 360.0.'
  - Require (longitudeDeg + 360.0) + 180.0 == (longitudeDeg + 180.0) + 360.0 so the
    two remainder operands differ by a representable full revolution; values failing
    this are excluded because floating-point absorption or inconsistent rounding no
    longer implements the supplied transformation.
  - NaN and either infinity are excluded because the SUT remainder calculation produces
    NaN and the supplied assertion treats a NaN difference as a vacuous pass.
  diversity:
    sourceRegion:
    - '[-180, 180] direct-return interval'
    - greater than 180
    - less than -180
    normalizationPath:
    - direct return
    - off < 0
    - off == 0 and positive source
    - remaining -180 + off path
    wrapPosition:
    - ordinary interior
    - exact antimeridian
    - immediately inside antimeridian
    - immediately outside antimeridian
    - near an out-of-range antimeridian sentinel
    - exact full-turn multiple
    signClass:
    - negative
    - negative zero
    - positive zero
    - positive
    magnitudeClass:
    - subnormal
    - ordinary
    - multiple revolutions
    - large stable finite
    numericForm:
    - integer
    - binary-exact fraction
    - decimal boundary offset
    - adjacent representable double
  scenarios:
  - id: SIGNED_ZERO_DIRECT_RETURN
    category: EDGE
    description: Exercise both IEEE-754 zero encodings in the inclusive direct-return
      branch.
    preconditions:
    - longitudeDeg is selected from {+0.0, -0.0}.
    expectedSourceBehavior:
    - The result is returned as-is because the source is within [-180, 180].
    - The result preserves the source zero sign when compared with Double.doubleToRawLongBits.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SUBNORMAL_DIRECT_RETURN
    category: EDGE
    description: Use the smallest nonzero finite longitudes, whose 360-degree follow-up
      loses the subnormal displacement.
    preconditions:
    - longitudeDeg is selected from {Double.MIN_VALUE, -Double.MIN_VALUE}.
    expectedSourceBehavior:
    - The source result equals the nonzero subnormal input exactly through the direct-return
      branch.
    - The result is finite and lies within [-180, 180].
    targetCases: 2
    emptyOutputAllowed: false
  - id: ORDINARY_INTERIOR_DIRECT_RETURN
    category: NORMAL
    description: Cover negative, central, and positive values strictly inside the
      documented normalized interval.
    preconditions:
    - longitudeDeg is selected from {-135.0, 1.0, 135.0}.
    expectedSourceBehavior:
    - The result equals longitudeDeg exactly without modulo normalization.
    - The result is finite and strictly between -180 and 180.
    targetCases: 3
    emptyOutputAllowed: false
  - id: INCLUSIVE_ANTIMERIDIAN_ENDPOINTS
    category: BOUNDARY
    description: Exercise both inclusive endpoints that represent the same meridian
      but are intentionally not merged.
    preconditions:
    - longitudeDeg is selected from {-180.0, 180.0}.
    expectedSourceBehavior:
    - The result equals the source endpoint exactly through the direct-return branch.
    - The two cases retain their distinct numeric representations, -180.0 and 180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: IMMEDIATELY_INSIDE_ANTIMERIDIAN
    category: BOUNDARY
    description: Exercise the closest representable in-range values to the lower and
      upper endpoints.
    preconditions:
    - longitudeDeg is selected from {Math.nextUp(-180.0), Math.nextDown(180.0)}.
    expectedSourceBehavior:
    - The result equals longitudeDeg exactly through the direct-return branch.
    - The result remains strictly inside [-180, 180] and adjacent to the selected
      endpoint.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ONE_ULP_OUTSIDE_ANTIMERIDIAN
    category: BOUNDARY
    description: Cross each direct-return boundary by one representable double and
      exercise modulo rounding at the wrap.
    preconditions:
    - longitudeDeg is selected from {Math.nextDown(-180.0), Math.nextUp(180.0)}.
    expectedSourceBehavior:
    - The direct-return condition is false and modulo normalization is used.
    - The finite result lies within [-180, 180] and within 1e-9 degrees of an antimeridian
      representation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DECIMAL_OFFSET_OUTSIDE_ANTIMERIDIAN
    category: BOUNDARY
    description: Cross each endpoint by a displacement larger than one ULP but smaller
      than the relation tolerance.
    preconditions:
    - longitudeDeg is selected from {-180.0 - 1e-10, 180.0 + 1e-10}.
    expectedSourceBehavior:
    - The direct-return condition is false and modulo normalization is used.
    - The lower-side source normalizes near +180 and the upper-side source normalizes
      near -180.
    - Each result is finite and within [-180, 180].
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_FIRST_WRAP_GENERAL
    category: NORMAL
    description: Exercise ordinary positive out-of-range inputs whose remainder is
      nonzero.
    preconditions:
    - longitudeDeg is selected from {181.0, 359.5, 539.0}.
    expectedSourceBehavior:
    - The source bypasses the direct-return branch.
    - The nonnegative, nonzero offset reaches the -180 + off return path.
    - The result is finite and within [-180, 180].
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_FIRST_WRAP_GENERAL
    category: NORMAL
    description: Exercise ordinary negative out-of-range inputs with a strictly negative
      Java remainder.
    preconditions:
    - longitudeDeg is selected from {-181.0, -359.5, -539.0}.
    expectedSourceBehavior:
    - The source bypasses the direct-return branch.
    - The computed off value is less than zero and the 180 + off return path is taken.
    - The result is finite and within [-180, 180].
    targetCases: 3
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_ANTIMERIDIAN_SENTINELS
    category: EDGE
    description: Exercise positive out-of-range values for which lon + 180 is exactly
      divisible by 360.
    preconditions:
    - longitudeDeg is selected from {540.0, 900.0, 1260.0}.
    expectedSourceBehavior:
    - The computed off value equals zero and longitudeDeg is positive.
    - The positive zero-offset sentinel branch returns exactly 180.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_ANTIMERIDIAN_SENTINELS
    category: EDGE
    description: Exercise negative out-of-range antimeridian equivalents, including
      the negative-zero remainder path.
    preconditions:
    - longitudeDeg is selected from {-540.0, -900.0, -1260.0}.
    expectedSourceBehavior:
    - The computed remainder compares equal to zero but the source is not positive.
    - The final -180 + off path returns exactly -180.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: EXACT_FULL_TURN_MULTIPLES
    category: EDGE
    description: Normalize nonzero positive and negative whole-revolution inputs back
      to the prime meridian.
    preconditions:
    - longitudeDeg is selected from {360.0, 720.0, -360.0, -720.0}.
    expectedSourceBehavior:
    - The source bypasses the direct-return branch.
    - The normalized result is numerically zero and lies within [-180, 180].
    targetCases: 4
    emptyOutputAllowed: false
  - id: PERIODIC_QUADRANT_POSITIONS
    category: NORMAL
    description: Cover equivalent positive and negative quarter-turn positions reached
      through different remainder signs.
    preconditions:
    - longitudeDeg is selected from {450.0, 630.0, -450.0, -630.0}.
    expectedSourceBehavior:
    - Each source uses modulo normalization rather than direct return.
    - Each result is exactly either -90.0 or 90.0.
    - Both the off < 0 path and the final -180 + off path are represented.
    targetCases: 4
    emptyOutputAllowed: false
  - id: NEAR_POSITIVE_ANTIMERIDIAN_WRAP_TRANSITIONS
    category: BOUNDARY
    description: Approach positive exact antimeridian sentinels from both sides to
      cover the discontinuous numeric representation.
    preconditions:
    - longitudeDeg is selected from {540.0 - 1e-10, 540.0 + 1e-10, 900.0 - 1e-10,
      900.0 + 1e-10}.
    expectedSourceBehavior:
    - The computed offset is nonzero, so the exact positive zero-offset sentinel branch
      is not used.
    - Values below a sentinel normalize near +180, while values above it normalize
      near -180.
    - Every result is finite and within [-180, 180].
    targetCases: 4
    emptyOutputAllowed: false
  - id: NEAR_NEGATIVE_ANTIMERIDIAN_WRAP_TRANSITIONS
    category: BOUNDARY
    description: Approach negative exact antimeridian sentinels from both sides and
      exercise negative nonzero remainders.
    preconditions:
    - longitudeDeg is selected from {-540.0 - 1e-10, -540.0 + 1e-10, -900.0 - 1e-10,
      -900.0 + 1e-10}.
    expectedSourceBehavior:
    - The computed off value is strictly negative rather than the exact-zero sentinel.
    - The 180 + off path produces results near one of the two antimeridian representations.
    - Every result is finite and within [-180, 180].
    targetCases: 4
    emptyOutputAllowed: false
  - id: DISTANT_FRACTIONAL_REVOLUTIONS
    category: NORMAL
    description: Exercise many-revolution normalization while retaining measurable
      fractional longitude components.
    preconditions:
    - longitudeDeg is selected from {123456.25, -123456.25, 1000000.125}.
    expectedSourceBehavior:
    - The source uses modulo normalization and produces a finite result within [-180,
      180].
    - The fractional component is represented in the normalized result rather than
      collapsing to an exact wrap sentinel.
    targetCases: 3
    emptyOutputAllowed: false
  - id: LARGE_STABLE_FINITE_MAGNITUDES
    category: EDGE
    description: Exercise way-outside finite longitudes while the supplied 360-degree
      transformation remains exactly representable.
    preconditions:
    - longitudeDeg is selected from {1.0e12, -1.0e12, 1099511627776.0, -1099511627776.0}.
    - (longitudeDeg + 360.0) - longitudeDeg == 360.0.
    expectedSourceBehavior:
    - The source bypasses the direct-return branch and completes modulo normalization
      without NaN or infinity.
    - The result is finite and lies within the documented inclusive range [-180, 180].
    - Both positive-remainder and negative-remainder normalization paths are represented.
    targetCases: 4
    emptyOutputAllowed: false
