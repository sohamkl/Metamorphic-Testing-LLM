InputDomain:
  summary: 44 valid source cases over day-capable Java Temporal implementations, covering
    zero, positive, negative, truncation, calendar transitions, chronology transitions,
    DST behavior, range sentinels, and int result boundaries.
  globalConstraints:
  - Both source arguments must be non-null because the follow-up generator explicitly
    rejects null endpoints.
  - Each endpoint must be one of LocalDate, LocalDateTime, Instant, OffsetDateTime,
    ZonedDateTime, JapaneseDate, ThaiBuddhistDate, MinguoDate, or HijrahDate.
  - Both endpoints in a case must belong to the same listed temporal family; mixed-family
    pairs are excluded because Temporal.until conversion compatibility and shift behavior
    are not uniform across families.
  - For ZonedDateTime cases, both endpoints must have the same ZoneId; different-zone
    calendar-day shifts can alter their relative instant displacement when zone transitions
    differ.
  - Chronology-specific date pairs must use the same chronology.
  - DAYS.between(startDateInclusive, endDateExclusive) must complete normally and
    produce a long value in the inclusive range -2147483648 through 2147483647, because
    Days.between converts it with Math.toIntExact.
  - For each endpoint t, t.plus(37, ChronoUnit.DAYS) must complete normally and remain
    in the same temporal family, as required by generateFollowUp.
  - Time-only and month- or year-only Temporal implementations are excluded because
    they do not support the DAYS operations required by both the target and follow-up.
  - Custom Temporal implementations are excluded because the supplied API gives no
    enforceable contract that their DAYS.between and plus(DAYS) implementations are
    translation invariant.
  - Exceptional source invocations, including unsupported DAYS operations, temporal
    range overflow, and day counts outside the int range, are excluded because the
    relation requires non-null Days outputs from both invocations.
  diversity:
    temporalFamily:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - ThaiBuddhistDate
    - MinguoDate
    - HijrahDate
    resultClass:
    - Integer.MIN_VALUE
    - negative
    - minus_one
    - zero
    - one
    - positive
    - Integer.MAX_VALUE
    ordering:
    - end_before_start
    - equal_endpoints
    - end_after_start
    calendarFeature:
    - ordinary_day
    - month_boundary
    - year_boundary
    - leap_day
    - non_leap_century
    - proleptic_year_zero
    - BCE_CE_boundary
    - chronology_era_boundary
    timeFeature:
    - exact_whole_day
    - positive_fractional_day
    - negative_fractional_day
    - midnight_crossing
    - nanosecond_below_day
    zoneFeature:
    - UTC
    - fixed_equal_offset
    - fixed_different_offsets
    - DST_spring_gap
    - DST_autumn_overlap
    rangeFeature:
    - minimum_supported_value
    - maximum_follow_up_safe_value
    - int_minimum_result
    - int_maximum_result
  scenarios:
  - id: LOCAL_DATE_EQUAL
    category: EDGE
    description: Equal LocalDate endpoints exercise the Days.ZERO result path.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 15) and endDateExclusive = LocalDate.of(2024,
      6, 15).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FORWARD_ONE_DAY
    category: BOUNDARY
    description: Adjacent increasing dates exercise the Days.ONE result path.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 15) and endDateExclusive = LocalDate.of(2024,
      6, 16).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_BACKWARD_ONE_DAY
    category: BOUNDARY
    description: Adjacent decreasing dates produce the smallest-magnitude negative
      result.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 16) and endDateExclusive = LocalDate.of(2024,
      6, 15).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_POSITIVE_MULTI_DAY
    category: NORMAL
    description: An ordinary increasing LocalDate interval produces a non-sentinel
      positive Days value.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 4, 3) and endDateExclusive = LocalDate.of(2024,
      4, 15).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 12.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_MULTI_DAY
    category: NORMAL
    description: An ordinary decreasing LocalDate interval produces a multi-day negative
      value.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 4, 15) and endDateExclusive = LocalDate.of(2024,
      4, 3).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns -12.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SHORT_MONTH_BOUNDARY
    category: BOUNDARY
    description: The interval crosses the end of a 30-day month.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 4, 30) and endDateExclusive = LocalDate.of(2024,
      5, 1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: The interval crosses from the last day of one year to the first day
      of the next.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 12, 31) and endDateExclusive = LocalDate.of(2024,
      1, 1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_INCLUDED
    category: EDGE
    description: A leap-year interval spans February 29.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 2, 28) and endDateExclusive = LocalDate.of(2024,
      3, 1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_COMMON_YEAR_FEBRUARY
    category: BOUNDARY
    description: The corresponding non-leap-year February interval contains only one
      day.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 2, 28) and endDateExclusive = LocalDate.of(2023,
      3, 1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_CENTURY
    category: EDGE
    description: The interval covers February 2100, which has no leap day.
    preconditions:
    - startDateInclusive = LocalDate.of(2100, 2, 28) and endDateExclusive = LocalDate.of(2100,
      3, 1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_PROLEPTIC_YEAR_ZERO
    category: EDGE
    description: The interval lies in ISO proleptic year zero.
    preconditions:
    - startDateInclusive = LocalDate.of(0, 2, 28) and endDateExclusive = LocalDate.of(0,
      3, 1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 2 because proleptic
      year zero is a leap year.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_BCE_CE_BOUNDARY
    category: EDGE
    description: The interval crosses the proleptic transition from year zero to year
      one.
    preconditions:
    - startDateInclusive = LocalDate.of(0, 12, 31) and endDateExclusive = LocalDate.of(1,
      1, 1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_SENTINEL
    category: BOUNDARY
    description: Equal endpoints at LocalDate.MIN exercise the lower representable
      date boundary while allowing the positive follow-up shift.
    preconditions:
    - startDateInclusive = LocalDate.MIN and endDateExclusive = LocalDate.MIN.
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_FOLLOW_UP_SAFE
    category: BOUNDARY
    description: Equal endpoints are exactly 37 days below LocalDate.MAX, so the follow-up
      reaches the maximum date.
    preconditions:
    - startDateInclusive = LocalDate.MAX.minusDays(37) and endDateExclusive = LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - The source invocation completes normally and getAmount() returns 0.
    - Adding the specified 37-day shift to either endpoint yields LocalDate.MAX without
      overflow.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAX_RESULT
    category: BOUNDARY
    description: The day count is exactly the largest value accepted by Math.toIntExact.
    preconditions:
    - Let anchor = LocalDate.of(0, 1, 1).
    - startDateInclusive = anchor and endDateExclusive = anchor.plusDays(2147483647L).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MIN_RESULT
    category: BOUNDARY
    description: The day count is exactly the smallest int value.
    preconditions:
    - Let anchor = LocalDate.of(0, 1, 1).
    - startDateInclusive = anchor.plusDays(2147483648L) and endDateExclusive = anchor.
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_REVERSE_LEAP_SPAN
    category: EDGE
    description: A decreasing interval crosses a leap day and tests negative calendar
      counting.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 3, 1) and endDateExclusive = LocalDate.of(2024,
      2, 28).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_YEAR_SPAN
    category: NORMAL
    description: A long interval includes both leap and common years.
    preconditions:
    - startDateInclusive = LocalDate.of(2019, 1, 1) and endDateExclusive = LocalDate.of(2025,
      1, 1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 2192.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SAME_INSTANT_FIELDS
    category: EDGE
    description: Equal LocalDateTime endpoints exercise zero with time fields present.
    preconditions:
    - Both endpoints equal LocalDateTime.of(2024, 6, 15, 12, 30, 45, 123456789).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_UNDER_ONE_DAY
    category: BOUNDARY
    description: A positive elapsed interval just below one whole day is truncated
      to zero days.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 15, 0, 0) and endDateExclusive
      = LocalDateTime.of(2024, 6, 15, 23, 59, 59, 999999999).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_ONE_DAY
    category: BOUNDARY
    description: An exact 24-hour LocalDateTime interval reaches one whole day.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 15, 12, 0) and endDateExclusive
      = LocalDateTime.of(2024, 6, 16, 12, 0).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_PARTIAL_SECOND_DAY
    category: EDGE
    description: A positive interval just below two days demonstrates whole-day truncation.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 15, 0, 0) and endDateExclusive
      = LocalDateTime.of(2024, 6, 16, 23, 59, 59, 999999999).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_UNDER_ONE_DAY
    category: BOUNDARY
    description: A negative interval whose magnitude is below one day truncates toward
      zero.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 15, 23, 0) and endDateExclusive
      = LocalDateTime.of(2024, 6, 15, 0, 0).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_NEGATIVE_DAY
    category: BOUNDARY
    description: An exact negative 24-hour interval produces minus one day.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 16, 12, 0) and endDateExclusive
      = LocalDateTime.of(2024, 6, 15, 12, 0).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_MIDNIGHT_CROSSING_PARTIAL_DAY
    category: EDGE
    description: The endpoints have different calendar dates but are less than one
      whole day apart.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 15, 23, 0) and endDateExclusive
      = LocalDateTime.of(2024, 6, 16, 1, 0).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_MAXIMUM_FOLLOW_UP_SAFE
    category: BOUNDARY
    description: Equal LocalDateTime endpoints are positioned so the follow-up reaches
      LocalDateTime.MAX.
    preconditions:
    - startDateInclusive = LocalDateTime.MAX.minusDays(37) and endDateExclusive =
      LocalDateTime.MAX.minusDays(37).
    expectedSourceBehavior:
    - The source invocation completes normally and getAmount() returns 0.
    - Each shifted endpoint equals LocalDateTime.MAX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EQUAL
    category: EDGE
    description: Equal Instant endpoints exercise zero on timeline-based temporals.
    preconditions:
    - startDateInclusive = Instant.parse("2024-06-15T12:00:00Z") and endDateExclusive
      has the same value.
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NANOSECOND_BELOW_DAY
    category: BOUNDARY
    description: An Instant interval one nanosecond below 86400 seconds contains no
      whole day.
    preconditions:
    - startDateInclusive = Instant.parse("2024-06-15T00:00:00Z").
    - endDateExclusive = startDateInclusive.plus(1, ChronoUnit.DAYS).minusNanos(1).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: BOUNDARY
    description: Exactly 86400 seconds between Instants is one ChronoUnit day.
    preconditions:
    - startDateInclusive = Instant.parse("2024-06-15T00:00:00Z") and endDateExclusive
      = Instant.parse("2024-06-16T00:00:00Z").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_PARTIAL_DAY
    category: EDGE
    description: A negative Instant interval shorter than 86400 seconds truncates
      to zero.
    preconditions:
    - startDateInclusive = Instant.parse("2024-06-15T12:00:00Z") and endDateExclusive
      = Instant.parse("2024-06-15T00:00:00Z").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_MAXIMUM_FOLLOW_UP_SAFE
    category: BOUNDARY
    description: Equal Instants are exactly 37 days below Instant.MAX.
    preconditions:
    - startDateInclusive = Instant.MAX.minus(37, ChronoUnit.DAYS) and endDateExclusive
      has the same value.
    expectedSourceBehavior:
    - The source invocation completes normally and getAmount() returns 0.
    - Each shifted endpoint equals Instant.MAX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EQUAL_OFFSET_DAY
    category: NORMAL
    description: A fixed-offset exact-day interval behaves like a timeline day.
    preconditions:
    - startDateInclusive = OffsetDateTime.parse("2024-06-15T12:00:00+05:30") and endDateExclusive
      = OffsetDateTime.parse("2024-06-16T12:00:00+05:30").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_SAME_INSTANT
    category: EDGE
    description: Different local fields and offsets represent the same instant.
    preconditions:
    - startDateInclusive = OffsetDateTime.parse("2024-01-01T00:00:00Z").
    - endDateExclusive = OffsetDateTime.parse("2023-12-31T19:00:00-05:00").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EXTREME_OFFSET_POSITIVE_DAY
    category: EDGE
    description: Identical local date-times at the extreme +14:00 and -12:00 offsets
      are 26 elapsed hours apart.
    preconditions:
    - startDateInclusive = OffsetDateTime.parse("2024-01-01T00:00:00+14:00").
    - endDateExclusive = OffsetDateTime.parse("2024-01-01T00:00:00-12:00").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EXTREME_OFFSET_NEGATIVE_DAY
    category: EDGE
    description: Reversing the extreme-offset pair produces a negative whole-day result.
    preconditions:
    - startDateInclusive = OffsetDateTime.parse("2024-01-01T00:00:00-12:00").
    - endDateExclusive = OffsetDateTime.parse("2024-01-01T00:00:00+14:00").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_UTC_EXACT_DAY
    category: NORMAL
    description: A same-zone UTC interval contains one exact day.
    preconditions:
    - startDateInclusive = ZonedDateTime.parse("2024-06-15T12:00:00Z[UTC]") and endDateExclusive
      = ZonedDateTime.parse("2024-06-16T12:00:00Z[UTC]").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_FORWARD_DAY
    category: EDGE
    description: A calendar day across the New York spring DST transition has only
      23 elapsed hours.
    preconditions:
    - startDateInclusive = ZonedDateTime.parse("2024-03-09T12:00:00-05:00[America/New_York]").
    - endDateExclusive = ZonedDateTime.parse("2024-03-10T12:00:00-04:00[America/New_York]").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1 using date-based
      DAYS semantics.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FALL_BACK_DAY
    category: EDGE
    description: A calendar day across the New York autumn DST transition has 25 elapsed
      hours.
    preconditions:
    - startDateInclusive = ZonedDateTime.parse("2024-11-02T12:00:00-04:00[America/New_York]").
    - endDateExclusive = ZonedDateTime.parse("2024-11-03T12:00:00-05:00[America/New_York]").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1 using date-based
      DAYS semantics.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_OVERLAP_REPEATED_LOCAL_TIME
    category: EDGE
    description: The two New York endpoints select different occurrences of the repeated
      01:30 local time during the autumn overlap.
    preconditions:
    - startDateInclusive = ZonedDateTime.parse("2024-11-03T01:30:00-04:00[America/New_York]").
    - endDateExclusive = ZonedDateTime.parse("2024-11-03T01:30:00-05:00[America/New_York]").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 0 because no whole
      calendar day separates the local date-times.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_NEGATIVE_ACROSS_SPRING
    category: EDGE
    description: A reversed same-zone interval crosses the spring DST transition.
    preconditions:
    - startDateInclusive = ZonedDateTime.parse("2024-03-10T12:00:00-04:00[America/New_York]").
    - endDateExclusive = ZonedDateTime.parse("2024-03-09T12:00:00-05:00[America/New_York]").
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_TRANSITION
    category: EDGE
    description: JapaneseDate endpoints cross from the Heisei era to the Reiwa era.
    preconditions:
    - startDateInclusive = JapaneseDate.from(LocalDate.of(2019, 4, 30)).
    - endDateExclusive = JapaneseDate.from(LocalDate.of(2019, 5, 1)).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_LEAP_SPAN
    category: EDGE
    description: ThaiBuddhistDate endpoints span the ISO-corresponding 2024 leap day.
    preconditions:
    - startDateInclusive = ThaiBuddhistDate.from(LocalDate.of(2024, 2, 28)).
    - endDateExclusive = ThaiBuddhistDate.from(LocalDate.of(2024, 3, 1)).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_NEGATIVE_INTERVAL
    category: NORMAL
    description: A chronology-specific MinguoDate pair has the end before the start.
    preconditions:
    - startDateInclusive = MinguoDate.from(LocalDate.of(2024, 1, 10)).
    - endDateExclusive = MinguoDate.from(LocalDate.of(2024, 1, 1)).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns -9.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_EPOCH_DAY_INTERVAL
    category: NORMAL
    description: HijrahDate endpoints are constructed from ISO dates ten epoch days
      apart.
    preconditions:
    - startDateInclusive = HijrahDate.from(LocalDate.of(2024, 5, 1)).
    - endDateExclusive = HijrahDate.from(LocalDate.of(2024, 5, 11)).
    expectedSourceBehavior:
    - The invocation completes normally and getAmount() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
