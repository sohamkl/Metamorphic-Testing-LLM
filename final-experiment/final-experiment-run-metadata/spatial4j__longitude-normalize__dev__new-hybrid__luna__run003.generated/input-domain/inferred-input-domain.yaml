InputDomain:
  summary: Finite IEEE-754 double longitudes, spanning the identity interval, both
    modulo branches, antimeridian sentinels, revolution boundaries, signed zero, precision
    limits, and overflow-adjacent magnitudes under the +360-degree follow-up.
  globalConstraints:
  - The source input is one finite double value; NaN and positive or negative infinity
    are excluded because the supplied metamorphic relation does not request invalid-input
    testing.
  - The follow-up is computed exactly as source input + 360.0 degrees.
  - The relation compares normalized outputs numerically within 1e-9 degrees, except
    that outputs within 1e-9 degrees of either -180 or +180 are accepted together
    as the antimeridian.
  - Source cases must remain within the finite-double domain even when source input
    + 360.0 may round or overflow during follow-up generation.
  diversity:
    interval:
    - less_than_minus_180
    - exactly_minus_180
    - strictly_between_minus_180_and_0
    - negative_zero
    - exactly_zero
    - strictly_between_0_and_180
    - exactly_180
    - greater_than_180
    sourceBranch:
    - in_range_identity
    - modulo_with_negative_remainder
    - modulo_with_positive_nonzero_remainder
    - modulo_zero_positive_input
    - modulo_zero_nonpositive_input
    magnitude:
    - subnormal
    - ordinary_degree_scale
    - several_revolutions
    - large_but_finite
    - near_2_pow_53
    - near_maximum_finite
    boundaryRelation:
    - interior_output
    - antimeridian_output
    - zero_output
    - follow_up_crosses_positive_boundary
    - follow_up_preserves_or_rounds_large_magnitude
  scenarios:
  - id: NEGATIVE_INTERIOR_IDENTITY
    category: NORMAL
    description: A finite negative longitude strictly inside the documented inclusive
      range.
    preconditions:
    - -180.0 < sourceInput < 0.0
    - sourceInput is finite
    expectedSourceBehavior:
    - The first if condition is true and normLonDEG returns sourceInput without modulo
      arithmetic.
    - The follow-up source input is greater than 180.0 and exercises normalization
      after adding one revolution.
    - The relation compares the two normalized positions normally within 1e-9 degrees.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INTERIOR_IDENTITY
    category: NORMAL
    description: A finite positive longitude strictly inside the documented inclusive
      range.
    preconditions:
    - 0.0 < sourceInput < 180.0
    - sourceInput is finite
    expectedSourceBehavior:
    - The first if condition is true and normLonDEG returns sourceInput unchanged.
    - The follow-up takes the modulo path because sourceInput + 360.0 is greater than
      180.0.
    - The relation checks ordinary numeric equality within 1e-9 degrees.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ZERO_IDENTITY
    category: BOUNDARY
    description: Positive zero at the center of the identity interval.
    preconditions:
    - sourceInput is exactly +0.0, including its IEEE-754 sign
    expectedSourceBehavior:
    - The inclusive range condition returns +0.0 directly.
    - The follow-up is 360.0 and normalizes to 0.0 through the positive-remainder
      path.
    - The absolute output difference used by the relation is zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_IDENTITY
    category: EDGE
    description: Negative zero, which satisfies the in-range comparison but preserves
      a distinct signed-zero source result.
    preconditions:
    - sourceInput is exactly -0.0, including its IEEE-754 sign
    expectedSourceBehavior:
    - The inclusive range condition returns sourceInput without modulo arithmetic.
    - The follow-up evaluates to 360.0 and normalizes to zero.
    - The supplied relation uses absolute difference, so the signed-zero distinction
      does not violate it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_NEGATIVE_ANTIMERIDIAN
    category: BOUNDARY
    description: The lower inclusive endpoint of the documented range.
    preconditions:
    - sourceInput == -180.0
    expectedSourceBehavior:
    - The in-range identity branch returns -180.0 unchanged.
    - The follow-up is +180.0 and also takes the in-range identity branch.
    - The relation accepts the two outputs through its bothAreAntimeridian exception.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_POSITIVE_ANTIMERIDIAN
    category: BOUNDARY
    description: The upper inclusive endpoint of the documented range.
    preconditions:
    - sourceInput == 180.0
    expectedSourceBehavior:
    - The in-range identity branch returns +180.0 unchanged.
    - The follow-up is 540.0 and normalizes to +180.0 through the positive zero-remainder
      sentinel path.
    - Both outputs are recognized as antimeridian values by the relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_NEGATIVE_ENDPOINT
    category: BOUNDARY
    description: A representable value immediately inside the lower endpoint.
    preconditions:
    - sourceInput is the greatest representable finite double less than -180.0 in
      magnitude toward zero
    - -180.0 < sourceInput < 0.0
    expectedSourceBehavior:
    - The identity branch returns the value without shifting it.
    - The follow-up is outside the range and must use the modulo normalization path.
    - The relation tests that the boundary-adjacent longitude survives one full revolution.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_POSITIVE_ENDPOINT
    category: BOUNDARY
    description: A representable value immediately inside the upper endpoint.
    preconditions:
    - sourceInput is the greatest representable finite double less than 180.0
    - 0.0 < sourceInput < 180.0
    expectedSourceBehavior:
    - The identity branch returns the value without double arithmetic.
    - The follow-up is greater than 180.0 and uses modulo normalization.
    - The relation checks the ordinary numeric difference rather than the antimeridian
      exception.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_NEGATIVE_ENDPOINT
    category: BOUNDARY
    description: A representable value immediately below -180 degrees.
    preconditions:
    - sourceInput < -180.0
    - sourceInput is the greatest representable finite double below -180.0
    expectedSourceBehavior:
    - The identity branch is false.
    - (sourceInput + 180.0) % 360.0 is negative, so the off < 0 branch returns 180.0
      + off.
    - The follow-up exercises a different normalization location while representing
      the same wrapped longitude.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_POSITIVE_ENDPOINT
    category: BOUNDARY
    description: A representable value immediately above +180 degrees.
    preconditions:
    - sourceInput > 180.0
    - sourceInput is the least representable finite double above 180.0
    expectedSourceBehavior:
    - The identity branch is false.
    - The positive-remainder path returns -180.0 plus the nonzero remainder.
    - The follow-up must normalize after another full revolution.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ONE_REVOLUTION
    category: NORMAL
    description: Exactly one positive revolution from zero.
    preconditions:
    - sourceInput == 360.0
    expectedSourceBehavior:
    - off is 180.0, so the final else branch returns 0.0.
    - The follow-up is 720.0 and follows the same positive nonzero-remainder result.
    - The relation observes equal normalized outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_REVOLUTION
    category: NORMAL
    description: Exactly one negative revolution from zero.
    preconditions:
    - sourceInput == -360.0
    expectedSourceBehavior:
    - off is -180.0, so the off < 0 branch returns 0.0.
    - The follow-up remains on the negative-remainder path after adding 360.0.
    - The relation observes equal normalized outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ZERO_REMAINDER_SENTINEL
    category: BOUNDARY
    description: A positive longitude beyond the range whose shifted value is an exact
      multiple of 360.
    preconditions:
    - sourceInput == 540.0
    expectedSourceBehavior:
    - off is exactly zero and sourceInput > 0, so the explicit return-180 sentinel
      branch is bypassed and the method returns +180.0.
    - The follow-up is 900.0 and reaches the same positive zero-remainder behavior.
    - The relation accepts the antimeridian result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_REMAINDER_SENTINEL
    category: BOUNDARY
    description: A negative longitude beyond the range whose shifted value is an exact
      negative multiple of 360.
    preconditions:
    - sourceInput == -540.0
    expectedSourceBehavior:
    - The remainder is signed zero rather than negative, so off < 0 and sourceInput
      > 0 are both false.
    - The final else branch returns -180.0.
    - The follow-up is -180.0 and the relation treats the two antimeridian representations
      as equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_NONZERO_REMAINDER
    category: NORMAL
    description: A positive out-of-range longitude with a nonzero positive remainder.
    preconditions:
    - sourceInput == 181.0
    expectedSourceBehavior:
    - The identity branch is false and the modulo remainder is positive and nonzero.
    - The final else branch returns -179.0.
    - The follow-up exercises the same wrapped meridian through a larger positive
      input.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_REMAINDER
    category: NORMAL
    description: A negative out-of-range longitude with a negative modulo remainder.
    preconditions:
    - sourceInput == -181.0
    expectedSourceBehavior:
    - The identity branch is false and off is negative.
    - The off < 0 branch returns 179.0.
    - The follow-up is -?
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_MULTI_REVOLUTION_INTERIOR
    category: NORMAL
    description: A positive longitude several complete revolutions beyond the range
      with a non-boundary normalized result.
    preconditions:
    - sourceInput == 1234.5
    - sourceInput > 180.0
    - sourceInput is not congruent to -180.0, 0.0, or 180.0 modulo 360.0
    expectedSourceBehavior:
    - The modulo path is taken with a positive nonzero remainder.
    - The returned value lies strictly between -180.0 and 180.0.
    - The follow-up adds one complete revolution and should normalize to the same
      result within the supplied tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_MULTI_REVOLUTION_INTERIOR
    category: NORMAL
    description: A negative longitude several complete revolutions beyond the range
      with a non-boundary normalized result.
    preconditions:
    - sourceInput == -1234.5
    - sourceInput < -180.0
    - sourceInput is not congruent to -180.0, 0.0, or 180.0 modulo 360.0
    expectedSourceBehavior:
    - The modulo path produces a negative remainder and uses the off < 0 branch.
    - The returned value lies strictly between -180.0 and 180.0.
    - The follow-up should preserve the normalized result within 1e-9 degrees.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_ANTIMERIDIAN_SERIES
    category: BOUNDARY
    description: A positive exact antimeridian congruence beyond the first positive
      sentinel case.
    preconditions:
    - sourceInput == 900.0
    - sourceInput > 180.0
    - (sourceInput + 180.0) % 360.0 == 0.0
    expectedSourceBehavior:
    - The positive zero-remainder branch returns +180.0.
    - The follow-up also has an exact zero remainder and returns +180.0.
    - The relation accepts the antimeridian outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_ANTIMERIDIAN_SERIES
    category: BOUNDARY
    description: A negative exact antimeridian congruence beyond the first negative
      sentinel case.
    preconditions:
    - sourceInput == -900.0
    - sourceInput < -180.0
    - (sourceInput + 180.0) % 360.0 == 0.0
    expectedSourceBehavior:
    - The negative zero-remainder case reaches the final else branch and returns -180.0.
    - The follow-up is -540.0 and returns -180.0.
    - The relation accepts the antimeridian outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SUBNORMAL_POSITIVE
    category: EDGE
    description: The least positive subnormal finite double, which is inside the identity
      range.
    preconditions:
    - sourceInput == Double.MIN_VALUE
    expectedSourceBehavior:
    - The identity branch returns the subnormal input unchanged.
    - The follow-up rounds to a value near 360.0 and takes the modulo path.
    - The relation checks whether the tiny source longitude and its shifted representation
      normalize consistently within 1e-9 degrees.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SUBNORMAL_NEGATIVE
    category: EDGE
    description: The least negative subnormal finite double.
    preconditions:
    - sourceInput == -Double.MIN_VALUE
    expectedSourceBehavior:
    - The identity branch returns the negative subnormal unchanged.
    - The follow-up is near 360.0 after floating-point addition and exercises modulo
      normalization.
    - The relation uses absolute difference and does not distinguish the tiny sign
      through an antimeridian exception.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_EXACT_POWER_OF_TWO
    category: EDGE
    description: A large finite longitude where degree-scale additions remain representable
      but floating-point precision is materially coarser than one degree.
    preconditions:
    - sourceInput == 4503599627370496.0
    - sourceInput is finite
    - abs(sourceInput) >= 2^52
    - sourceInput + 180.0 is finite
    expectedSourceBehavior:
    - The identity branch is false and modulo arithmetic is used.
    - The follow-up addition of 360.0 is subject to large-magnitude rounding.
    - The relation checks the supplied 1e-9 tolerance without assuming decimal-degree
      precision that the source does not provide.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_EXACT_POWER_OF_TWO
    category: EDGE
    description: The negative counterpart of a large finite power-of-two longitude.
    preconditions:
    - sourceInput == -4503599627370496.0
    - sourceInput is finite
    - abs(sourceInput) >= 2^52
    - sourceInput + 180.0 is finite
    expectedSourceBehavior:
    - The modulo path uses the sign of the negative remainder.
    - Adding 360.0 for the follow-up may round at this magnitude.
    - The relation compares the resulting normalized values under its stated tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_DOUBLE_PRECISION_INTEGER_LIMIT_POSITIVE
    category: EDGE
    description: A positive finite longitude near 2^53, where unit spacing and the
      360-degree shift are represented with limited precision.
    preconditions:
    - sourceInput == 9007199254740991.0
    - sourceInput is finite
    - sourceInput + 180.0 is finite
    expectedSourceBehavior:
    - The identity branch is false and the modulo path is used.
    - The follow-up addition is computed in binary64 and may not preserve every nominal
      degree-level distinction.
    - The metamorphic assertion still applies its 1e-9 comparison to the two returned
      doubles.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_DOUBLE_PRECISION_INTEGER_LIMIT_NEGATIVE
    category: EDGE
    description: A negative finite longitude near -2^53.
    preconditions:
    - sourceInput == -9007199254740991.0
    - sourceInput is finite
    - sourceInput + 180.0 is finite
    expectedSourceBehavior:
    - The negative modulo-remainder branch is reachable.
    - The +360.0 follow-up is subject to binary64 rounding at this magnitude.
    - The relation evaluates the actual normalized outputs rather than an exact mathematical
      remainder.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_ROUNDS_TO_SAME_LARGE_VALUE
    category: EDGE
    description: A large finite source for which adding 360.0 does not change the
      represented double.
    preconditions:
    - sourceInput is finite
    - abs(sourceInput) is at least 2^55
    - sourceInput + 360.0 == sourceInput
    - sourceInput + 180.0 is finite
    expectedSourceBehavior:
    - Both source and follow-up invoke normLonDEG with the same represented input.
    - The two outputs are therefore the same unless the invocation itself has nondeterministic
      behavior, which the supplied source does not show.
    - The relation observes zero difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_FINITE_LONGITUDE
    category: EDGE
    description: The most negative finite double, exercising modulo arithmetic at
      the lower magnitude limit without positive overflow in sourceInput + 180.0.
    preconditions:
    - sourceInput == -Double.MAX_VALUE
    - sourceInput + 180.0 is finite
    - sourceInput + 360.0 is finite
    expectedSourceBehavior:
    - The in-range branch is false and the negative-remainder normalization path is
      used.
    - Adding 360.0 may round to the same represented value.
    - The relation compares the actual normalized outputs within its tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_OVERFLOW_IN_SOURCE_OFFSET
    category: EDGE
    description: A finite positive longitude whose sourceInput + 180.0 overflows to
      positive infinity inside normLonDEG.
    preconditions:
    - sourceInput is finite
    - sourceInput > 180.0
    - sourceInput + 180.0 == Double.POSITIVE_INFINITY
    expectedSourceBehavior:
    - The identity branch is false.
    - The modulo expression receives positive infinity and produces NaN under Java
      floating-point arithmetic.
    - The follow-up is also infinite after adding 360.0, so its normalization likewise
      reaches NaN; the supplied relation's difference comparison does not report a
      violation for NaN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_ONLY_OVERFLOW
    category: EDGE
    description: A finite positive longitude whose source normalization remains finite
      but the +360.0 follow-up overflows.
    preconditions:
    - sourceInput is finite
    - sourceInput + 180.0 is finite
    - sourceInput + 360.0 == Double.POSITIVE_INFINITY
    expectedSourceBehavior:
    - The source invocation uses finite modulo arithmetic and returns a finite normalized
      value.
    - The follow-up invocation receives positive infinity and reaches NaN through
      the modulo expression.
    - The supplied relation therefore exercises its NaN comparison behavior rather
      than an ordinary numeric tolerance comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_LARGE_NONOVERFLOWING_FOLLOW_UP
    category: EDGE
    description: A very large negative finite longitude near the lower magnitude limit
      where the +360.0 follow-up remains finite.
    preconditions:
    - sourceInput is finite
    - sourceInput < -180.0
    - sourceInput + 180.0 is finite
    - sourceInput + 360.0 is finite
    - abs(sourceInput) >= 2^60
    expectedSourceBehavior:
    - Both invocations use the negative modulo path.
    - The follow-up addition may round away because 360.0 is below the local unit
      in the last place.
    - The relation checks the outputs produced by the actual Java double operations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_NEGATIVE_MULTIPLE_WITH_ZERO_REMAINDER
    category: BOUNDARY
    description: A negative exact multiple of 360 whose normalized result is zero
      rather than an antimeridian value.
    preconditions:
    - sourceInput == -720.0
    - sourceInput < -180.0
    - (sourceInput + 180.0) % 360.0 == -180.0
    expectedSourceBehavior:
    - The off < 0 branch returns 0.0.
    - The follow-up is -360.0 and also returns 0.0.
    - The relation observes equal ordinary numeric outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_POSITIVE_MULTIPLE_WITH_ZERO_REMAINDER
    category: BOUNDARY
    description: A positive exact multiple of 360 whose normalized result is zero.
    preconditions:
    - sourceInput == 720.0
    - sourceInput > 180.0
    - (sourceInput + 180.0) % 360.0 == 180.0
    expectedSourceBehavior:
    - The final else branch returns 0.0 from the positive remainder of 180.0.
    - The follow-up is 1080.0 and returns the same normalized value.
    - The relation observes equal ordinary numeric outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FRACTIONAL_NEGATIVE_WRAP
    category: NORMAL
    description: A negative longitude whose wrapped result is fractional and not close
      to an endpoint.
    preconditions:
    - sourceInput == -540.25
    - sourceInput < -180.0
    - the normalized result is strictly between -180.0 and 180.0 and more than 1e-9
      degrees from both endpoints
    expectedSourceBehavior:
    - The off < 0 branch returns the positive wrapped fractional longitude.
    - The follow-up uses the same mathematical revolution class.
    - The relation performs its ordinary tolerance comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FRACTIONAL_POSITIVE_WRAP
    category: NORMAL
    description: A positive longitude whose wrapped result is fractional and not close
      to an endpoint.
    preconditions:
    - sourceInput == 540.25
    - sourceInput > 180.0
    - the normalized result is strictly between -180.0 and 180.0 and more than 1e-9
      degrees from both endpoints
    expectedSourceBehavior:
    - The positive nonzero-remainder path returns the wrapped fractional longitude.
    - The follow-up adds one complete revolution and should return the same normalized
      result.
    - The relation performs its ordinary tolerance comparison.
    targetCases: 1
    emptyOutputAllowed: false
