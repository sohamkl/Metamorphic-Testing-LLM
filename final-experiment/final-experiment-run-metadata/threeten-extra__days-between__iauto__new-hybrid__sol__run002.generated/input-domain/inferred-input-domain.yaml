InputDomain:
  summary: Non-null, mutually compatible day-capable Temporal endpoint pairs whose
    source and 37-day-shifted intervals are representable as int-valued Days.
  globalConstraints:
  - Both source endpoints must be non-null, as required by the target contract and
    by generateFollowUp.
  - Each endpoint must support plus(37, ChronoUnit.DAYS), because generateFollowUp
    applies exactly that operation.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) must complete normally
    for both the source pair and the pair obtained by shifting both endpoints forward
    37 days.
  - The source and shifted day counts must each lie in the inclusive range [Integer.MIN_VALUE,
    Integer.MAX_VALUE], because Days.between converts the long result with Math.toIntExact.
  - Neither endpoint may be so close to its temporal type's maximum supported value
    that adding 37 days overflows or throws.
  - Endpoint pairs must use the same concrete temporal representation, except that
    OffsetDateTime endpoints may have different ZoneOffset values; heterogeneous temporal
    classes are excluded because DAYS.between dispatches through the starting Temporal
    and cross-type conversion support is directional and not guaranteed by the supplied
    API.
  - ZonedDateTime endpoint pairs must use the same ZoneId; different-zone pairs are
    excluded because adding calendar days in two independently changing zone-rule
    systems does not guarantee preservation of the start-relative whole-day count
    required by the MR.
  - Supported source representations are LocalDate, LocalDateTime, Instant, OffsetDateTime,
    ZonedDateTime, JapaneseDate, HijrahDate, MinguoDate, and ThaiBuddhistDate; arbitrary
    custom Temporal implementations are excluded because the supplied API provides
    no measurable guarantee that their DAYS.between and plus(DAYS) implementations
    obey the MR.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - HijrahDate
    - MinguoDate
    - ThaiBuddhistDate
    direction:
    - equal
    - forward
    - backward
    resultClass:
    - zero
    - one
    - negativeOne
    - positiveGeneral
    - negativeGeneral
    - IntegerMAX_VALUE
    - IntegerMIN_VALUE
    calendarBoundary:
    - ordinary
    - monthEnd
    - yearEnd
    - leapDay
    - eraBoundary
    - supportedRangeBoundary
    timeRemainder:
    - none
    - positiveSubDay
    - negativeSubDay
    - justBelowWholeDay
    - exactWholeDay
    - multipleDaysWithRemainder
    offsetRelation:
    - sameOffset
    - differentOffsets
    zoneTransition:
    - none
    - springGap
    - autumnOverlap
  scenarios:
  - id: LOCAL_DATE_EQUAL_ENDPOINTS
    category: EDGE
    description: Both LocalDate endpoints are the same date.
    preconditions:
    - startDateInclusive equals endDateExclusive.
    expectedSourceBehavior:
    - Days.between returns a non-null Days whose getAmount() is 0, exercising Days.of(0).
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_FORWARD
    category: BOUNDARY
    description: The LocalDate end is exactly one day after the start.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(1, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The source getAmount() is 1, exercising Days.of(1).
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_BACKWARD
    category: BOUNDARY
    description: The LocalDate end is exactly one day before the start.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(-1, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The source getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_GENERAL_POSITIVE_GAP
    category: NORMAL
    description: An ordinary forward LocalDate interval uses the non-singleton positive
      Days path.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(36, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The source getAmount() is 36.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_GENERAL_NEGATIVE_GAP
    category: NORMAL
    description: An ordinary backward LocalDate interval produces a directed negative
      amount.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(-36, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The source getAmount() is -36.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_END
    category: BOUNDARY
    description: A one-day LocalDate interval crosses a month boundary.
    preconditions:
    - The endpoints are 2023-01-31 and 2023-02-01 in that order.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_END
    category: BOUNDARY
    description: A one-day LocalDate interval crosses a year boundary.
    preconditions:
    - The endpoints are 2023-12-31 and 2024-01-01 in that order.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_FEBRUARY_SPAN
    category: BOUNDARY
    description: A forward LocalDate interval spans February 29 in a leap year.
    preconditions:
    - The endpoints are 2024-02-28 and 2024-03-01 in that order.
    expectedSourceBehavior:
    - The source getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_COMMON_FEBRUARY_SPAN
    category: BOUNDARY
    description: The corresponding interval spans February in a non-leap year.
    preconditions:
    - The endpoints are 2023-02-28 and 2023-03-01 in that order.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FROM_LEAP_DAY
    category: BOUNDARY
    description: The inclusive start is February 29 and the exclusive end is the following
      day.
    preconditions:
    - The endpoints are 2024-02-29 and 2024-03-01 in that order.
    expectedSourceBehavior:
    - The source getAmount() is 1, consistent with the documented inclusive-start
      and exclusive-end interpretation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_PROLEPTIC_ERA_BOUNDARY
    category: EDGE
    description: A LocalDate interval crosses from proleptic year 0 to year 1.
    preconditions:
    - The endpoints are 0000-12-31 and 0001-01-01 in that order.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAX_GAP
    category: BOUNDARY
    description: The LocalDate interval produces the largest result accepted by Math.toIntExact.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(Integer.MAX_VALUE, ChronoUnit.DAYS).
    - Both endpoints and their 37-day shifts remain within the LocalDate range.
    expectedSourceBehavior:
    - The source returns normally with getAmount() equal to Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MIN_GAP
    category: BOUNDARY
    description: The LocalDate interval produces the smallest result accepted by Math.toIntExact.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(Integer.MIN_VALUE, ChronoUnit.DAYS).
    - Both endpoints and their 37-day shifts remain within the LocalDate range.
    expectedSourceBehavior:
    - The source returns normally with getAmount() equal to Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM_SHIFT_LIMIT
    category: EDGE
    description: Both dates are near LocalDate.MAX while still permitting the required
      follow-up shift.
    preconditions:
    - startDateInclusive equals LocalDate.MAX.minusDays(38).
    - endDateExclusive equals LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - The source getAmount() is 1.
    - Shifting by 37 days remains representable and places the follow-up end at LocalDate.MAX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM
    category: EDGE
    description: The source interval begins at LocalDate.MIN.
    preconditions:
    - startDateInclusive equals LocalDate.MIN.
    - endDateExclusive equals LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - The source getAmount() is 1.
    - The required positive 37-day shift remains representable.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_YEAR_FORWARD
    category: NORMAL
    description: A forward LocalDate interval covers multiple complete calendar years.
    preconditions:
    - The endpoints are 2018-01-01 and 2022-01-01 in that order.
    expectedSourceBehavior:
    - The source getAmount() is 1461.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_REVERSE_LEAP_SPAN
    category: EDGE
    description: A backward LocalDate interval traverses a leap day.
    preconditions:
    - The endpoints are 2024-03-01 and 2024-02-28 in that order.
    expectedSourceBehavior:
    - The source getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SHIFT_CROSSES_LEAP_REGION
    category: NORMAL
    description: The source interval and its 37-day-shifted counterpart occupy different
      month positions around a leap year.
    preconditions:
    - The endpoints are 2019-12-31 and 2020-03-01 in that order.
    expectedSourceBehavior:
    - The source getAmount() is 61.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EQUAL
    category: EDGE
    description: Both LocalDateTime endpoints are identical.
    preconditions:
    - startDateInclusive equals endDateExclusive.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_SUBDAY
    category: EDGE
    description: The LocalDateTime end is later but less than one complete day away.
    preconditions:
    - The elapsed local time is exactly 23 hours, 59 minutes, 59 seconds, and 999999999
      nanoseconds.
    expectedSourceBehavior:
    - The source getAmount() is 0 because ChronoUnit.DAYS reports whole days.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: The LocalDateTime endpoints are exactly 24 hours apart.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(1, ChronoUnit.DAYS) with the
      same local time.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_ONE_NANO_BELOW_DAY
    category: BOUNDARY
    description: The positive LocalDateTime interval is one nanosecond short of one
      complete day.
    preconditions:
    - The elapsed local time is 23 hours, 59 minutes, 59 seconds, and 999999999 nanoseconds.
    expectedSourceBehavior:
    - The source getAmount() is 0 rather than 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_SUBDAY
    category: EDGE
    description: The LocalDateTime end precedes the start by less than one complete
      day.
    preconditions:
    - The end is exactly 23 hours before the start.
    expectedSourceBehavior:
    - The source getAmount() is 0 because the whole-day result truncates toward zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_NEGATIVE_DAY
    category: BOUNDARY
    description: The LocalDateTime end is exactly one day before the start.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(-1, ChronoUnit.DAYS) with the
      same local time.
    expectedSourceBehavior:
    - The source getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SHORT_MIDNIGHT_CROSSING
    category: EDGE
    description: The LocalDateTime endpoints lie on different dates but are less than
      a day apart.
    preconditions:
    - The start is 2024-01-31T23:30 and the end is 2024-02-01T00:30.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_MULTIDAY_REMAINDER
    category: NORMAL
    description: The LocalDateTime interval contains multiple whole days plus a positive
      sub-day remainder.
    preconditions:
    - The end is exactly 2 days and 23 hours after the start.
    expectedSourceBehavior:
    - The source getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EQUAL
    category: EDGE
    description: Both Instant endpoints identify the same instant.
    preconditions:
    - startDateInclusive equals endDateExclusive.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_POSITIVE_SUBDAY
    category: EDGE
    description: The Instant end is one second short of a complete 86400-second day.
    preconditions:
    - The end is exactly 86399 seconds after the start.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: BOUNDARY
    description: The Instant endpoints are exactly one ChronoUnit day apart.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(1, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The source getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_SUBDAY
    category: EDGE
    description: The Instant end is 86399 seconds before the start.
    preconditions:
    - The end is exactly 86399 seconds before the start.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_MULTIDAY_REMAINDER
    category: NORMAL
    description: The Instant end precedes the start by more than two but fewer than
      three complete days.
    preconditions:
    - The end is exactly 2 days and 1 second before the start.
    expectedSourceBehavior:
    - The source getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EQUAL
    category: EDGE
    description: Both OffsetDateTime endpoints have the same local date-time and offset.
    preconditions:
    - startDateInclusive equals endDateExclusive.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET_DAY
    category: NORMAL
    description: OffsetDateTime endpoints with the same offset are one local day apart.
    preconditions:
    - Both endpoints have the same ZoneOffset.
    - The end equals the start plus one day.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_FORWARD_SUBDAY
    category: EDGE
    description: Different offsets make adjacent local dates less than one elapsed
      day apart.
    preconditions:
    - The start is 2020-01-01T00:00Z.
    - The end is 2020-01-02T00:00+02:00.
    expectedSourceBehavior:
    - The source getAmount() is 0 because the end is only 22 hours after the start.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_BACKWARD_SUBDAY
    category: EDGE
    description: A reverse different-offset interval is less than one complete day.
    preconditions:
    - The start is 2020-01-02T00:00+02:00.
    - The end is 2020-01-01T00:00Z.
    expectedSourceBehavior:
    - The source getAmount() is 0 because the end is only 22 hours before the start.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_EQUAL
    category: EDGE
    description: Both ZonedDateTime endpoints are identical and use the same ZoneId.
    preconditions:
    - startDateInclusive equals endDateExclusive.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_GAP
    category: BOUNDARY
    description: A same-zone one-day interval crosses a daylight-saving spring gap.
    preconditions:
    - Both endpoints use America/New_York.
    - The start is 2020-03-07T12:00 and the end is 2020-03-08T12:00 in that zone.
    expectedSourceBehavior:
    - The source getAmount() is 1 even though the corresponding elapsed timeline duration
      is 23 hours.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_OVERLAP
    category: BOUNDARY
    description: A same-zone one-day interval crosses a daylight-saving autumn overlap.
    preconditions:
    - Both endpoints use America/New_York.
    - The start is 2020-10-31T12:00 and the end is 2020-11-01T12:00 in that zone.
    expectedSourceBehavior:
    - The source getAmount() is 1 even though the corresponding elapsed timeline duration
      is 25 hours.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_MULTIDAY_TRANSITION
    category: NORMAL
    description: A same-zone multi-day interval contains a daylight-saving transition.
    preconditions:
    - Both endpoints use America/New_York.
    - The start is 2020-03-07T12:00 and the end is 2020-03-10T12:00 in that zone.
    expectedSourceBehavior:
    - The source getAmount() is 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_FORWARD
    category: NORMAL
    description: A JapaneseDate pair exercises a non-ISO chronology that supports
      day arithmetic.
    preconditions:
    - Both endpoints are JapaneseDate values.
    - endDateExclusive equals startDateInclusive.plus(10, ChronoUnit.DAYS).
    - Both dates are at least 37 days below the chronology's maximum supported date.
    expectedSourceBehavior:
    - The source getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_BACKWARD
    category: NORMAL
    description: A HijrahDate pair produces a negative day count in a non-ISO chronology.
    preconditions:
    - Both endpoints are HijrahDate values.
    - endDateExclusive equals startDateInclusive.plus(-10, ChronoUnit.DAYS).
    - Both dates and their 37-day shifts are supported.
    expectedSourceBehavior:
    - The source getAmount() is -10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_EQUAL
    category: EDGE
    description: Equal MinguoDate endpoints exercise the zero singleton path in a
      non-ISO chronology.
    preconditions:
    - Both endpoints are the same MinguoDate.
    - The date and its 37-day shift are supported.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: ThaiBuddhistDate endpoints are consecutive dates on opposite sides
      of a month boundary.
    preconditions:
    - Both endpoints are ThaiBuddhistDate values.
    - endDateExclusive equals startDateInclusive.plus(1, ChronoUnit.DAYS).
    - The endpoints have different month-of-year values.
    - Both shifted endpoints remain supported.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
