    emptyOutputAllowed: false
  - id: RELAXED_TABLE_FRAGMENT
    category: NORMAL
    description: Table-shaped fragment using Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<table><tr><th>H</th><td>C</td></tr></table>"
    - baseUri equals ""
    - safelist is Safelist.relaxed()
