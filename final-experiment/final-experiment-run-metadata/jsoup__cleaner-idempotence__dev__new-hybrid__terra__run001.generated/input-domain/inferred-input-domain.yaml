    preconditions:
    - bodyHtml equals "<a href=\"child\">nonabsolute base</a>"
    - baseUri equals "not an absolute URI"
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The target takes the non-empty-base path without imposing a documented target-level
      URI validation rule.
    - Returned serialization must be non-null and idempotent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_WITH_IMAGES_IMAGE_URL
    category: NORMAL
    description: Image-like markup with an absolute source URL using Safelist.basicWithImages().
    preconditions:
    - bodyHtml equals "<img src=\"https://images.example.test/p.png\" alt=\"picture\">"
    - baseUri equals "https://base.test/"
    - safelist is Safelist.basicWithImages()
    expectedSourceBehavior:
    - The distinct basicWithImages preset is exercised with image attributes and URL
      protocol checking.
    - Output may retain or remove policy-controlled markup but must stabilize.
    targetCases: 1
    emptyOutputAllowed: true
  - id: BASIC_WITH_IMAGES_RELATIVE_IMAGE
    category: NORMAL
    description: Image-like markup with a path-relative source URL and path-bearing
      base URI.
    preconditions:
    - bodyHtml equals "<img src=\"images/p.png\" alt=\"relative picture\">"
    - baseUri equals "https://base.test/articles/page.html"
    - safelist is Safelist.basicWithImages()
    expectedSourceBehavior:
    - Relative URL resolution is exercised on an image source attribute.
    - Output is a stable serialized fragment.
    targetCases: 1
    emptyOutputAllowed: true
  - id: BASIC_WITH_IMAGES_SCRIPT_SCHEME_IMAGE
    category: EDGE
    description: Image-like markup whose source uses a script-like URL protocol.
    preconditions:
    - bodyHtml equals "<img src=\"javascript:alert(1)\" alt=\"unsafe image\">"
    - baseUri equals "https://base.test/"
    - safelist is Safelist.basicWithImages()
    expectedSourceBehavior:
    - URL protocol filtering is exercised on an image source rather than a link href.
    - Empty output is permitted if the element is removed by the policy.
    targetCases: 1
    emptyOutputAllowed: true
  - id: RELAXED_STRUCTURAL_FRAGMENT
