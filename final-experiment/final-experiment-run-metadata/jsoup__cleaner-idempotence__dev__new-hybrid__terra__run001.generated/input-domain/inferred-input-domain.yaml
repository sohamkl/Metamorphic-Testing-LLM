    - baseUri equals "https://base.test/"
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - HTML attribute normalization and URL policy filtering are exercised together.
    - Link text makes the output non-empty.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_MIXED_CASE_NAMES
    category: EDGE
    description: Mixed-case element and attribute names with an absolute URL.
    preconditions:
    - bodyHtml equals "<A HREF=\"https://example.test/\">mixed case</A>"
    - baseUri equals "https://base.test/"
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - Parser name normalization is exercised before safelist evaluation.
    - Output must be stable after the follow-up parse and clean.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_WHITESPACE_OBFUSCATED_URL
