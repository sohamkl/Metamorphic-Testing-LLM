    - The text node ensures non-empty output.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_NON_ABSOLUTE_BASE_URI
    category: EDGE
    description: Relative link with a non-empty baseUri that is not an absolute HTTP
