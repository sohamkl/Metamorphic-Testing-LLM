    preconditions:
    - bodyHtml equals "<p onclick=\"x()\">visible <em>content</em></p><script>bad()</script><div>tail</div>"
    - baseUri equals "https://base.test/"
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - Cleaner traverses a mixture of policy-controlled tags, attributes, text nodes,
