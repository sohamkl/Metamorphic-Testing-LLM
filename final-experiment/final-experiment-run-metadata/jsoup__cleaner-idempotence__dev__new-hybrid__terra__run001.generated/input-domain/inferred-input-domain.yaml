    preconditions:
    - bodyHtml equals "<div><div><div><p><span><strong>deep leaf</strong></span></p></div></div></div>"
    - baseUri equals "https://base.test/"
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - Recursive parse-tree cleaning is exercised beyond one nesting level.
    - Leaf text makes output non-empty and suitable for idempotence checking.
    targetCases: 1
    emptyOutputAllowed: false
