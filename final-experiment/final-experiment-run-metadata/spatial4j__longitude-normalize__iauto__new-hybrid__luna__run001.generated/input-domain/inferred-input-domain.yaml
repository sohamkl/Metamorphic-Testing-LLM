InputDomain:
  summary: Java double source longitudes spanning the inclusive normal interval, both
    modulo branches, exact and near-period boundary values, antimeridian representations,
    precision limits, and IEEE-754 special values; each follow-up is generated as
    sourceInput + 360.0.
  globalConstraints:
  - Each source case is exactly one Java double value; no object construction or auxiliary
    arguments are required.
  - The follow-up input is computed exactly as longitudeDeg + 360.0 using Java double
    arithmetic, without pre-normalizing the source value.
  - Finite source values are not restricted to [-180.0, 180.0], because normLonDEG
    explicitly accepts out-of-range finite longitudes and folds them with the Java
    remainder operator.
  - NaN and infinities remain included as reachable double inputs; they are not labeled
    INVALID because the supplied metamorphic relation does not request invalid-input
    testing.
  - A non-vacuous relation check requires comparing the two returned doubles with
    the supplied 1e-9 tolerance, except when both outputs are within 1e-9 of an antimeridian
    representation.
  diversity:
    rangePosition:
    - less than -180.0
    - exactly -180.0
    - strictly between -180.0 and 180.0
    - exactly 180.0
    - greater than 180.0
    remainderBranch:
    - in-range early return
    - off < 0
    - off == 0 with positive source
    - off == 0 with non-positive source
    - off is positive and nonzero
    - NaN remainder
    periodicStructure:
    - zero revolutions
    - positive integer revolutions
    - negative integer revolutions
    - integer revolution plus fractional offset
    - values near an integer revolution
    precisionClass:
    - ordinary finite
    - subnormal
    - very large finite
    - maximum finite
    - infinity
    - NaN
    outputRepresentation:
    - unchanged source value
    - normalized interior value
    - normalized near -180
    - normalized near 180
    - NaN
  scenarios:
  - id: IN_RANGE_NEGATIVE_INTERIOR
    category: NORMAL
    description: A negative longitude strictly inside the documented inclusive range.
    preconditions:
    - longitudeDeg = -45.0, so -180.0 < longitudeDeg < 180.0.
    expectedSourceBehavior:
    - The first if condition is true and normLonDEG returns -45.0 unchanged.
    - The follow-up 315.0 is normalized back to -45.0, so the supplied relation compares
      equal finite outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_POSITIVE_INTERIOR
    category: NORMAL
    description: A positive longitude strictly inside the documented inclusive range.
    preconditions:
    - longitudeDeg = 45.0, so -180.0 < longitudeDeg < 180.0.
    expectedSourceBehavior:
    - The common-case early return preserves 45.0 exactly.
    - The follow-up 405.0 reaches the modulo path and returns 45.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_ENDPOINT
    category: BOUNDARY
    description: The inclusive lower endpoint of the documented output range.
    preconditions:
    - longitudeDeg = -180.0.
    expectedSourceBehavior:
    - The early return preserves -180.0.
    - The follow-up is 180.0; both outputs are recognized as antimeridian representations
      by the supplied relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_ENDPOINT
    category: BOUNDARY
    description: The inclusive upper endpoint of the documented output range.
    preconditions:
    - longitudeDeg = 180.0.
    expectedSourceBehavior:
    - The early return preserves 180.0.
    - The follow-up is 540.0 and the modulo path returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_LOWER_ENDPOINT
    category: BOUNDARY
    description: A finite value immediately above -180.0.
    preconditions:
    - longitudeDeg = Math.nextUp(-180.0).
    expectedSourceBehavior:
    - The early return preserves the next representable value above -180.0.
    - The follow-up is outside the range and should normalize to the same value within
      double-rounding tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_UPPER_ENDPOINT
    category: BOUNDARY
    description: A finite value immediately below 180.0.
    preconditions:
    - longitudeDeg = Math.nextDown(180.0).
    expectedSourceBehavior:
    - The early return preserves the next representable value below 180.0.
    - The follow-up modulo path should return the same longitude within the supplied
      tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_LOWER_ENDPOINT
    category: BOUNDARY
    description: A finite value immediately below -180.0, entering the negative-remainder
      branch.
    preconditions:
    - longitudeDeg = Math.nextDown(-180.0).
    expectedSourceBehavior:
    - The early return is skipped.
    - off is negative, so the result is 180.0 + off, a value just below 180.0.
    - The follow-up is just below 180.0 and reaches the early return, exercising the
      inverse boundary representation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_UPPER_ENDPOINT
    category: BOUNDARY
    description: A finite value immediately above 180.0, entering the positive-remainder
      path.
    preconditions:
    - longitudeDeg = Math.nextUp(180.0).
    expectedSourceBehavior:
    - The early return is skipped and the nonnegative, nonzero remainder path returns
      a value just above -180.0.
    - The follow-up is just above 540.0 and should produce the same normalized value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_REVOLUTION
    category: NORMAL
    description: A positive out-of-range longitude with a positive nonzero remainder.
    preconditions:
    - longitudeDeg = 540.5, so (longitudeDeg + 180.0) % 360.0 = 0.5.
    expectedSourceBehavior:
    - The off < 0 and off == 0 branches are skipped.
    - The result is -180.0 + 0.5 = -179.5.
    - Adding 360.0 preserves the normalized result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_REVOLUTION
    category: NORMAL
    description: A negative out-of-range longitude with a negative remainder.
    preconditions:
    - longitudeDeg = -540.5, so (longitudeDeg + 180.0) % 360.0 = -0.5.
    expectedSourceBehavior:
    - The off < 0 branch returns 180.0 - 0.5 = 179.5.
    - The follow-up is -180.5 and reaches the same negative-remainder normalization
      result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_REVOLUTION
    category: EDGE
    description: A positive exact multiple of 360 degrees.
    preconditions:
    - longitudeDeg = 360.0.
    expectedSourceBehavior:
    - The remainder is exactly zero and longitudeDeg > 0, so the dedicated sentinel
      branch returns 180.0.
    - The follow-up 720.0 takes the same sentinel branch and returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_TWO_REVOLUTIONS
    category: EDGE
    description: A larger positive exact multiple of 360 degrees.
    preconditions:
    - longitudeDeg = 720.0.
    expectedSourceBehavior:
    - The positive zero-remainder sentinel returns 180.0 rather than -180.0.
    - The follow-up 1080.0 exercises the same branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_REVOLUTION
    category: EDGE
    description: A negative exact multiple of 360 degrees.
    preconditions:
    - longitudeDeg = -360.0.
    expectedSourceBehavior:
    - The remainder is -0.0; off < 0 is false and longitudeDeg > 0 is false, so the
      final branch returns 0.0.
    - The follow-up is 0.0 and the source early return also returns 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_TWO_REVOLUTIONS
    category: EDGE
    description: A more negative exact multiple of 360 degrees.
    preconditions:
    - longitudeDeg = -720.0.
    expectedSourceBehavior:
    - The negative zero remainder reaches the final branch and returns 0.0.
    - The follow-up -360.0 also normalizes to 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_SOURCE_MR_COUNTEREXAMPLE
    category: EDGE
    description: Zero is preserved by the source, while its 360-degree follow-up uses
      the positive zero-remainder sentinel.
    preconditions:
    - longitudeDeg = 0.0.
    expectedSourceBehavior:
    - The source early return produces 0.0.
    - The follow-up 360.0 produces 180.0.
    - The supplied relation does not classify 0.0 and 180.0 as both antimeridian values,
      so this case exposes a relation violation rather than a vacuous pass.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_SOURCE_MR_COUNTEREXAMPLE
    category: EDGE
    description: Negative zero is preserved as an in-range value and has the same
      follow-up sentinel issue.
    preconditions:
    - longitudeDeg = -0.0; the value satisfies both in-range comparisons and its sign
      bit is negative.
    expectedSourceBehavior:
    - The source early return preserves -0.0.
    - The follow-up rounds to 360.0 and returns 180.0.
    - The supplied relation observes a difference of approximately 180 degrees and
      reports a violation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ANTIMERIDIAN_PLUS_REVOLUTION
    category: BOUNDARY
    description: A positive out-of-range value whose normalized result is the +180
      representation.
    preconditions:
    - longitudeDeg = 540.0.
    expectedSourceBehavior:
    - The zero-remainder and positive-source sentinel returns 180.0.
    - The follow-up 900.0 returns 180.0, so both outputs are the same antimeridian
      representation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ANTIMERIDIAN_PLUS_REVOLUTION
    category: BOUNDARY
    description: A negative out-of-range value whose normalized result is the -180
      representation.
    preconditions:
    - longitudeDeg = -540.0.
    expectedSourceBehavior:
    - The remainder is negative zero, and the final branch returns -180.0.
    - The follow-up -180.0 is returned unchanged; the relation accepts the two antimeridian
      representations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_POSITIVE_REVOLUTION_BELOW
    category: BOUNDARY
    description: A value just below a positive 360-degree multiple.
    preconditions:
    - longitudeDeg = Math.nextDown(360.0).
    expectedSourceBehavior:
    - The remainder is positive and nonzero, producing a normalized value just below
      180.0.
    - The follow-up is just below 720.0 and should follow the same modulo branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_POSITIVE_REVOLUTION_ABOVE
    category: BOUNDARY
    description: A value just above a positive 360-degree multiple.
    preconditions:
    - longitudeDeg = Math.nextUp(360.0).
    expectedSourceBehavior:
    - The positive nonzero remainder produces a normalized value just above -180.0.
    - The follow-up remains just above 720.0 and should normalize identically within
      tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_NEGATIVE_REVOLUTION_BELOW
    category: BOUNDARY
    description: A value just below -360 degrees.
    preconditions:
    - longitudeDeg = Math.nextDown(-360.0).
    expectedSourceBehavior:
    - The negative remainder branch produces a normalized value just above 0.0.
    - The follow-up is just below 0.0 and is returned unchanged, exercising cross-boundary
      equivalence.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_NEGATIVE_REVOLUTION_ABOVE
    category: BOUNDARY
    description: A value just above -360 degrees.
    preconditions:
    - longitudeDeg = Math.nextUp(-360.0).
    expectedSourceBehavior:
    - The negative remainder branch produces a normalized value just below 0.0.
    - The follow-up is just above 0.0 and is returned unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_SUBNORMAL
    category: EDGE
    description: The smallest positive subnormal double, close to the zero sentinel
      boundary.
    preconditions:
    - longitudeDeg = Double.MIN_VALUE.
    expectedSourceBehavior:
    - The in-range early return preserves Double.MIN_VALUE.
    - Adding 360.0 rounds the follow-up to 360.0, whose normalization returns 180.0;
      the supplied relation reports a non-antimeridian mismatch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_SUBNORMAL
    category: EDGE
    description: The smallest negative subnormal double, close to the zero sentinel
      boundary.
    preconditions:
    - longitudeDeg = -Double.MIN_VALUE.
    expectedSourceBehavior:
    - The in-range early return preserves the negative subnormal.
    - The follow-up rounds to 360.0 and returns 180.0, exposing the same supplied-relation
      mismatch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_POSITIVE
    category: EDGE
    description: A very large positive finite longitude for which modulo arithmetic
      loses ordinary decimal precision.
    preconditions:
    - longitudeDeg = 1.0e15, which is finite and greater than 180.0.
    expectedSourceBehavior:
    - The in-range return is skipped and normalization is determined by the Java double
      remainder operation.
    - The follow-up is also finite; the relation checks whether the two independently
      computed remainders remain within 1e-9.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_NEGATIVE
    category: EDGE
    description: A very large negative finite longitude for the negative-remainder
      path.
    preconditions:
    - longitudeDeg = -1.0e15, which is finite and less than -180.0.
    expectedSourceBehavior:
    - The result is produced by the off < 0 or final modulo branch, depending on the
      exact double remainder.
    - The finite follow-up is checked against the source result using the supplied
      tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_FINITE
    category: EDGE
    description: The largest finite positive double, whose follow-up overflows to
      positive infinity.
    preconditions:
    - longitudeDeg = Double.MAX_VALUE.
    expectedSourceBehavior:
    - The source is outside the normal range and its (longitudeDeg + 180.0) remainder
      expression becomes non-finite, yielding NaN through Java floating-point arithmetic.
    - The follow-up overflows to positive infinity and also yields NaN from the modulo
      expression.
    - The supplied relation compares NaN values without throwing because its difference
      test is false, making this an explicitly vacuous relation path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_FINITE
    category: EDGE
    description: The most negative finite double.
    preconditions:
    - longitudeDeg = -Double.MAX_VALUE.
    expectedSourceBehavior:
    - The source uses the out-of-range modulo path and returns a finite normalized
      result or a Java floating-point remainder result determined by that expression.
    - The follow-up remains finite and exercises the same large-magnitude arithmetic
      regime.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INFINITY
    category: EDGE
    description: Positive infinity as a reachable double argument.
    preconditions:
    - longitudeDeg = Double.POSITIVE_INFINITY.
    expectedSourceBehavior:
    - Both range comparisons are false; the modulo expression is NaN, so normLonDEG
      returns NaN.
    - The follow-up remains positive infinity and follows the same NaN path; the supplied
      relation therefore passes vacuously.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INFINITY
    category: EDGE
    description: Negative infinity as a reachable double argument.
    preconditions:
    - longitudeDeg = Double.NEGATIVE_INFINITY.
    expectedSourceBehavior:
    - The range checks fail and the modulo expression produces NaN, so normLonDEG
      returns NaN.
    - The follow-up remains negative infinity and produces NaN again; the relation
      check is vacuous.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_INPUT
    category: EDGE
    description: NaN input, exercising false comparisons and NaN remainder propagation.
    preconditions:
    - longitudeDeg = Double.NaN.
    expectedSourceBehavior:
    - Neither in-range comparison is true; (NaN + 180.0) % 360.0 is NaN; all subsequent
      comparisons are false; the final expression returns NaN.
    - The follow-up is NaN and also returns NaN, so the supplied relation does not
      fail because NaN comparisons make difference > 1e-9 false.
    targetCases: 1
    emptyOutputAllowed: false
