InputDomain:
  summary: Temporal endpoint pairs whose day distance is representable as an int and
    for which adding 37 ChronoUnit.DAYS to both endpoints is supported and remains
    in range.
  globalConstraints:
  - Both endpoints are non-null Temporal values.
  - Both endpoints support ChronoUnit.DAYS for the between operation.
  - Both endpoints support plus(37, ChronoUnit.DAYS) for follow-up generation.
  - Endpoints use the same temporal type or mutually compatible chronology so ChronoUnit.DAYS.between
    is defined.
  - The source day distance is between -2147483648 and 2147483647 inclusive so Math.toIntExact
    succeeds.
  - The follow-up endpoints remain representable after adding exactly 37 days.
  - For zoned or offset temporals, the selected endpoints preserve the intended whole-day
    relation after the common 37-day shift.
  diversity:
    temporalType:
    - LocalDate
    - LocalDateTime
    - OffsetDateTime
    - ZonedDateTime with UTC
    - Instant
    - JapaneseDate
    ordering:
    - end before start
    - end equal to start
    - end after start
    distanceClass:
    - zero days
    - one day
    - multiple days
    - exactly 37 days
    - Integer.MAX_VALUE days
    - Integer.MIN_VALUE days
    calendarCondition:
    - ordinary date
    - leap-day transition
    - year boundary
    - minimum representable date with follow-up headroom
    - maximum representable date with follow-up headroom
    timeOfDayCondition:
    - exact whole-day alignment
    - same date-time with non-zero time
    - sub-day remainder
    - differing offsets
  scenarios:
  - id: LOCAL_DATE_EQUAL
    category: NORMAL
    description: Two equal LocalDate endpoints produce the zero-day sentinel.
    preconditions:
    - startDateInclusive and endDateExclusive are the same LocalDate.
    - The date is at least 37 days from the LocalDate minimum and maximum.
    expectedSourceBehavior:
    - Days.between returns a non-null Days whose getAmount() is 0.
    - The follow-up endpoints are equal and the follow-up getAmount() is also 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_FORWARD
    category: NORMAL
    description: A LocalDate end exactly one calendar day after the start exercises
      the one-day result.
    preconditions:
    - endDateExclusive is exactly one day after startDateInclusive.
    - Both dates have at least 37 days of representable range after them.
    expectedSourceBehavior:
    - getAmount() is 1.
    - The common 37-day shift preserves the amount at 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_REVERSE
    category: NORMAL
    description: A LocalDate end exactly one day before the start exercises a negative
      result.
    preconditions:
    - endDateExclusive is exactly one day before startDateInclusive.
    - Both dates remain valid after adding 37 days.
    expectedSourceBehavior:
    - getAmount() is -1.
    - The follow-up amount remains -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_DAY_FORWARD
    category: NORMAL
    description: Ordinary LocalDate endpoints separated by several whole days exercise
      the general positive path.
    preconditions:
    - endDateExclusive is 12 calendar days after startDateInclusive.
    - The pair and both shifted dates are representable.
    expectedSourceBehavior:
    - getAmount() is 12.
    - The follow-up amount equals 12.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_EXACT_SHIFT_DISTANCE
    category: EDGE
    description: The source gap equals the metamorphic shift amount.
    preconditions:
    - endDateExclusive is exactly 37 calendar days after startDateInclusive.
    - Both shifted endpoints remain representable.
    expectedSourceBehavior:
    - getAmount() is 37.
    - The shifted pair still has a 37-day gap rather than being confused with an endpoint
      shift.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: A LocalDate interval crosses February 29 in a leap year.
    preconditions:
    - startDateInclusive is in the days immediately before a leap-year February 29.
    - endDateExclusive is after February 29 by a positive whole-day distance.
    - Both endpoints and their 37-day shifts are representable.
    expectedSourceBehavior:
    - getAmount() counts the leap day as an ordinary elapsed calendar day.
    - The follow-up amount equals the source amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: A LocalDate interval crosses December 31 and January 1.
    preconditions:
    - startDateInclusive is in the final two days of a year.
    - endDateExclusive is in the first two days of the next year.
    - The interval is a positive whole-day interval and has shift headroom.
    expectedSourceBehavior:
    - getAmount() equals the exact calendar-day distance across the year boundary.
    - The common shift leaves that amount unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_WITH_HEADROOM
    category: EDGE
    description: The pair begins at the minimum representable LocalDate while allowing
      the required follow-up shift.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is LocalDate.MIN plus exactly 1 day.
    - Adding 37 days to both endpoints remains representable.
    expectedSourceBehavior:
    - getAmount() is 1.
    - Follow-up generation succeeds and the follow-up amount is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_WITH_HEADROOM
    category: EDGE
    description: The pair ends at the maximum representable LocalDate after the required
      shift.
    preconditions:
    - endDateExclusive is LocalDate.MAX minus exactly 37 days.
    - startDateInclusive is exactly one day before endDateExclusive.
    - Adding 37 days makes the follow-up end equal LocalDate.MAX and remains representable.
    expectedSourceBehavior:
    - getAmount() is 1.
    - The follow-up amount remains 1 at the upper representable boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAX_DISTANCE
    category: EDGE
    description: LocalDate endpoints are separated by Integer.MAX_VALUE whole days.
    preconditions:
    - The LocalDate epoch-day distance from startDateInclusive to endDateExclusive
      is exactly 2147483647.
    - Both shifted epoch days remain within LocalDate range.
    expectedSourceBehavior:
    - Math.toIntExact succeeds and getAmount() is 2147483647.
    - The follow-up amount is also 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MIN_DISTANCE
    category: EDGE
    description: LocalDate endpoints are separated by Integer.MIN_VALUE whole days
      in the negative direction.
    preconditions:
    - The LocalDate epoch-day distance from startDateInclusive to endDateExclusive
      is exactly -2147483648.
    - Both shifted epoch days remain within LocalDate range.
    expectedSourceBehavior:
    - Math.toIntExact succeeds and getAmount() is -2147483648.
    - The follow-up amount remains -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: LocalDateTime endpoints have identical time-of-day values and are
      separated by an exact whole day.
    preconditions:
    - endDateExclusive is exactly 1 day after startDateInclusive with the same local
      time and nanosecond.
    - Both shifted LocalDateTime values are representable.
    expectedSourceBehavior:
    - getAmount() is 1.
    - The common 37-day shift preserves the exact one-day amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_ZERO_SUBDAY_INTERVAL
    category: BOUNDARY
    description: LocalDateTime endpoints span less than one whole day while crossing
      a date boundary.
    preconditions:
    - endDateExclusive is later than startDateInclusive.
    - The elapsed LocalDateTime interval is less than 24 hours but crosses midnight.
    - The pair and shifted pair are representable.
    expectedSourceBehavior:
    - getAmount() is 0 because the target returns whole days.
    - The follow-up amount is also 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_WHOLE_DAY
    category: NORMAL
    description: LocalDateTime endpoints are separated by an exact negative whole-day
      interval.
    preconditions:
    - endDateExclusive is exactly 2 days before startDateInclusive with identical
      time and nanosecond.
    - Both shifted values are representable.
    expectedSourceBehavior:
    - getAmount() is -2.
    - The follow-up amount remains -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET
    category: NORMAL
    description: OffsetDateTime endpoints use the same UTC offset and have a positive
      whole-day gap.
    preconditions:
    - Both endpoints have the same fixed offset.
    - endDateExclusive is exactly 5 local days after startDateInclusive with the same
      local time.
    - Both shifted endpoints are representable.
    expectedSourceBehavior:
    - getAmount() is 5.
    - Adding 37 days to both endpoints preserves the amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERING_OFFSETS
    category: EDGE
    description: OffsetDateTime endpoints have different offsets, so the temporal
      distance is not inferred solely from local dates.
    preconditions:
    - The endpoints have distinct fixed offsets.
    - Their actual temporal distance is a positive whole number of days.
    - Adding 37 days preserves both offsets and remains representable.
    expectedSourceBehavior:
    - getAmount() equals the whole-day distance computed by ChronoUnit.DAYS between
      the offset-aware endpoints.
    - The follow-up amount equals the source amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_UTC
    category: NORMAL
    description: ZonedDateTime endpoints use UTC and cross multiple whole days.
    preconditions:
    - Both endpoints use the UTC zone.
    - endDateExclusive is exactly 9 days after startDateInclusive at the same local
      time.
    - The source and shifted values are representable.
    expectedSourceBehavior:
    - getAmount() is 9.
    - The follow-up amount remains 9.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: NORMAL
    description: Instant endpoints are separated by an exact multiple of 24 hours.
    preconditions:
    - endDateExclusive is exactly 3 times 24 hours after startDateInclusive.
    - Both instants support adding 37 days without range overflow.
    expectedSourceBehavior:
    - getAmount() is 3.
    - The follow-up amount remains 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_INTERVAL
    category: BOUNDARY
    description: Instant endpoints are separated by a positive duration less than
      24 hours.
    preconditions:
    - endDateExclusive is later than startDateInclusive by a duration strictly between
      0 and 24 hours.
    - Both shifted instants remain representable.
    expectedSourceBehavior:
    - getAmount() is 0 because only whole days are returned.
    - The follow-up amount is also 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_WHOLE_DAY
    category: NORMAL
    description: JapaneseDate endpoints exercise a non-ISO date chronology with a
      whole-day interval.
    preconditions:
    - Both endpoints are JapaneseDate values in the same chronology.
    - endDateExclusive is 4 chronology-supported days after startDateInclusive.
    - Both endpoints and their 37-day shifts are representable.
    expectedSourceBehavior:
    - getAmount() is 4.
    - The follow-up amount remains 4.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_REVERSE_INTERVAL
    category: NORMAL
    description: JapaneseDate endpoints in the same chronology have a negative whole-day
      interval.
    preconditions:
    - endDateExclusive is exactly 4 supported days before startDateInclusive.
    - Both shifted endpoints remain representable.
    expectedSourceBehavior:
    - getAmount() is -4.
    - The follow-up amount remains -4.
    targetCases: 1
    emptyOutputAllowed: false
