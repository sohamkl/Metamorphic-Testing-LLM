InputDomain:
  summary: Valid flat Cartesian circles and rectangles, including empty sentinels,
    zero-radius circles, degenerate rectangles, strict separation, containment, overlap,
    and exact tangency; every source must remain constructible after the prescribed
    common translation.
  globalConstraints:
  - The circle context is non-null, non-geodetic, and uses flat Cartesian distance,
    as required by the SUT description and by relateRectanglePhase2's non-geo assumption.
  - The source circle and source rectangle are non-null and use coordinates interpreted
    in the circle's SpatialContext.
  - A non-empty source circle has a context-accepted finite center (cx,cy) and a finite
    radius r >= 0 that satisfies the context's circle-construction validation.
  - A non-empty source rectangle has finite coordinates with minX <= maxX and minY
    <= maxY and is accepted by the context; equality is permitted on either axis so
    line and point rectangles remain in-domain.
  - An empty source shape uses only the context's accepted empty representation, observable
    through isEmpty(); arbitrary NaN or infinity payloads that are not accepted empty
    sentinels are excluded because neither the constructor nor MR specifies their
    behavior.
  - For every non-empty source, cx + 17.5, cy - 9.25, rectangle.minX + 17.5, rectangle.maxX
    + 17.5, rectangle.minY - 9.25, and rectangle.maxY - 9.25 are finite and accepted
    by the circle's context.
  - For an empty-source scenario, the context must accept the corresponding translated
    empty point or rectangle produced by the supplied follow-up generator.
  - Neither source shape is mutated between source invocation, follow-up generation,
    and follow-up invocation.
  - All concrete geometric scenarios below use r = 5 and rectangle coordinates expressed
    relative to the circle center (cx,cy); cx, cy are chosen so both the source and
    translated coordinates satisfy the preceding context bounds.
  - Exact boundary scenarios use exactly representable offsets such as 0, 1, 2, 3,
    4, 5, and 6 so that the intended 3-4-5 tangencies are measurable before and after
    the exactly representable shifts 17.5 and -9.25.
  diversity:
    circleState:
    - empty
    - zero-radius
    - positive-radius
    rectangleAreaClass:
    - empty
    - point
    - horizontal-line
    - vertical-line
    - positive-area
    boundingBoxRelation:
    - DISJOINT
    - WITHIN
    - CONTAINS-equal
    - CONTAINS-non-equal
    - INTERSECTS
    axisPosition:
    - left
    - right
    - below
    - above
    - x-axis-spanning
    - y-axis-spanning
    - both-axes-spanning
    - neither-axis-spanning
    geometricBoundary:
    - strict-gap
    - exact-side-tangent
    - exact-corner-tangent
    - strict-overlap
    - exact-contained-corner
    - strict-containment
    expectedRelation:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
  scenarios:
  - id: EMPTY_CIRCLE_SENTINEL
    category: EDGE
    description: An empty circle is related directly to a non-empty rectangle.
    preconditions:
    - circle.isEmpty() is true and rectangle.isEmpty() is false.
    - The circle's enclosing bounding box is the context-created empty rectangle established
      by the CircleImpl constructor.
    expectedSourceBehavior:
    - relate(Rectangle) returns DISJOINT through the empty enclosing-box sentinel
      path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RECTANGLE_SENTINEL
    category: EDGE
    description: A non-empty positive-radius circle is related directly to an empty
      rectangle.
    preconditions:
    - circle.isEmpty() is false, circle.getRadius() > 0, and rectangle.isEmpty() is
      true.
    expectedSourceBehavior:
    - The enclosing-box relation recognizes the empty rectangle as DISJOINT, and relate(Rectangle)
      returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SHAPES_EMPTY
    category: EDGE
    description: Both operands use their context-accepted empty representations.
    preconditions:
    - circle.isEmpty() is true and rectangle.isEmpty() is true.
    expectedSourceBehavior:
    - relate(Rectangle) returns DISJOINT rather than null.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDING_BOX_STRICTLY_DISJOINT
    category: NORMAL
    description: The rectangle lies wholly beyond one side of the circle's enclosing
      box.
    preconditions:
    - Use r = 5 and one of the four rectangles [cx+6,cx+8]x[cy-1,cy+1], [cx-8,cx-6]x[cy-1,cy+1],
      [cx-1,cx+1]x[cy+6,cy+8], or [cx-1,cx+1]x[cy-8,cy-6].
    - There is a strict gap of 1 between the rectangle and enclosing box on the selected
      side.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(Rectangle) returns DISJOINT without entering phase 2.
    targetCases: 4
    emptyOutputAllowed: false
  - id: CIRCLE_BOUNDING_BOX_WITHIN_RECTANGLE
    category: NORMAL
    description: The rectangle encloses the complete circle bounding box, either strictly
      or while sharing only part of its boundary.
    preconditions:
    - Use r = 5 with either [cx-6,cx+6]x[cy-6,cy+6] or [cx-5,cx+6]x[cy-6,cy+6].
    - The rectangle is not exactly equal to the enclosing box.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN.
    - relate(Rectangle) returns WITHIN via the bounding-box shortcut.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RECTANGLE_EQUALS_CIRCLE_BOUNDING_BOX
    category: EDGE
    description: The rectangle is exactly the positive-radius circle's enclosing square.
    preconditions:
    - Use r = 5 and rectangle [cx-5,cx+5]x[cy-5,cy+5].
    - rectangle.equals(circle.getBoundingBox()) is true.
    expectedSourceBehavior:
    - The bbox relation is CONTAINS and the explicit equality edge case returns WITHIN.
    - Phase 2 is not used.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_BBOX_OVERLAP_BUT_GEOMETRIC_GAP
    category: NORMAL
    description: A rectangle overlaps a corner of the enclosing box but its closest
      corner is outside the circle.
    preconditions:
    - Use r = 5 and reflect [cx+4,cx+6]x[cy+4,cy+6] into each of the four quadrants.
    - The closest corner has squared center distance 4^2 + 4^2 = 32 > 25.
    - The rectangle overlaps neither the horizontal nor vertical center axis.
    expectedSourceBehavior:
    - The bounding boxes are not DISJOINT, so phase 2 is reached.
    - contains(closestX,closestY) is false and relate(Rectangle) returns DISJOINT.
    targetCases: 4
    emptyOutputAllowed: false
  - id: EXACT_DIAGONAL_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at exactly one 3-4-5 corner while
      extending outward.
    preconditions:
    - Use r = 5 and reflect [cx+3,cx+6]x[cy+4,cy+6] into each of the four quadrants,
      exchanging 3 and 4 only if needed to preserve a 3-4-5 closest corner.
    - The closest corner has squared center distance exactly 25.
    expectedSourceBehavior:
    - The closest corner is contained under the distance-boundary test, so the shapes
      are not classified DISJOINT.
    - Because the rectangle extends beyond the bounding box, relate(Rectangle) returns
      INTERSECTS.
    targetCases: 4
    emptyOutputAllowed: false
  - id: EXACT_SIDE_TANGENCY
    category: BOUNDARY
    description: A rectangle touches the circle at the right, left, top, or bottom
      axial extremum.
    preconditions:
    - Use r = 5 and one of [cx+5,cx+7]x[cy-1,cy+1], [cx-7,cx-5]x[cy-1,cy+1], [cx-1,cx+1]x[cy+5,cy+7],
      or [cx-1,cx+1]x[cy-7,cy-5].
    - The rectangle spans one center axis and its nearest coordinate on the other
      axis is exactly radius 5 away.
    expectedSourceBehavior:
    - The enclosing boxes touch rather than being strictly disjoint.
    - Phase 2 returns INTERSECTS, preserving boundary contact as an intersection.
    targetCases: 4
    emptyOutputAllowed: false
  - id: SIDE_PENETRATION_WITH_AXIS_SPANNING
    category: NORMAL
    description: A rectangle penetrates one side of the circle and spans the perpendicular
      center axis.
    preconditions:
    - Use r = 5 and one of [cx+4,cx+6]x[cy-1,cy+1], [cx-6,cx-4]x[cy-1,cy+1], [cx-1,cx+1]x[cy+4,cy+6],
      or [cx-1,cx+1]x[cy-6,cy-4].
    - Exactly one axis coordinate of the center lies in the rectangle's corresponding
      interval.
    expectedSourceBehavior:
    - The phase-2 axis-spanning condition rules out the diagonal-disjoint return.
    - The bbox does not contain the rectangle, so relate(Rectangle) returns INTERSECTS.
    targetCases: 4
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_BUT_CIRCLE_DOES_NOT
    category: NORMAL
    description: The rectangle lies inside the enclosing square, has some points in
      the circle, but its farthest corner is outside the circle.
    preconditions:
    - Use r = 5 and reflect [cx+3,cx+4]x[cy+3,cy+4] into each of the four quadrants.
    - The closest corner has squared distance 18 < 25 and the farthest corner has
      squared distance 32 > 25.
    - enclosingBox.relate(rectangle) is CONTAINS.
    expectedSourceBehavior:
    - The rectangle is not DISJOINT.
    - contains(farthestX,farthestY) is false, so relate(Rectangle) returns INTERSECTS.
    targetCases: 4
    emptyOutputAllowed: false
  - id: STRICT_RECTANGLE_CONTAINMENT_BY_CIRCLE
    category: NORMAL
    description: A positive-area rectangle is strictly inside the circle in each quadrant.
    preconditions:
    - Use r = 5 and reflect [cx+1,cx+2]x[cy+1,cy+3] into each of the four quadrants.
    - Every rectangle corner has squared center distance strictly less than 25.
    - The enclosing box contains the rectangle.
    expectedSourceBehavior:
    - The farthest selected corner is contained.
    - relate(Rectangle) returns CONTAINS.
    targetCases: 4
    emptyOutputAllowed: false
  - id: CONTAINED_RECTANGLE_WITH_BOUNDARY_CORNER
    category: BOUNDARY
    description: The circle contains the rectangle with its farthest corner exactly
      on the circumference.
    preconditions:
    - Use r = 5 and reflect [cx,cx+3]x[cy,cy+4] into each of the four quadrants.
    - The farthest corner has squared center distance exactly 3^2 + 4^2 = 25 and all
      other corners are no farther.
    expectedSourceBehavior:
    - The inclusive contains test accepts the farthest boundary corner.
    - relate(Rectangle) returns CONTAINS rather than INTERSECTS.
    targetCases: 4
    emptyOutputAllowed: false
  - id: BOTH_AXES_CROSSED_AND_FARTHEST_SELECTION
    category: EDGE
    description: A contained rectangle crosses both center axes, exercising the farthest-side
      comparisons and their tie behavior.
    preconditions:
    - Use r = 5 with either [cx-2,cx+2]x[cy-1,cy+1] or [cx-3,cx+2]x[cy-1,cy+4].
    - For the first rectangle both farthest-side comparisons tie; for the second they
      select cx-3 and cy+4, whose squared distance is exactly 25.
    expectedSourceBehavior:
    - closestX equals the x axis and closestY equals the y axis, so the diagonal-disjoint
      test is skipped.
    - The selected farthest corner is contained and relate(Rectangle) returns CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: AXIS_CROSSING_STRIP_INTERSECTION
    category: NORMAL
    description: A long horizontal or vertical strip crosses the circle and extends
      beyond its enclosing box.
    preconditions:
    - Use r = 5 with [cx-6,cx+6]x[cy-1,cy+1] or [cx-1,cx+1]x[cy-6,cy+6].
    - The rectangle spans both center axes but is not contained by the circle bounding
      box.
    expectedSourceBehavior:
    - The bounding boxes INTERSECT and phase 2 cannot classify the shapes as diagonally
      disjoint.
    - Because bboxSect is not CONTAINS, relate(Rectangle) returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_RECTANGLES
    category: EDGE
    description: The rectangle is a single point strictly inside, exactly on, or outside
      the circle while still inside its enclosing square.
    preconditions:
    - Use r = 5 and respectively [cx+1,cx+1]x[cy+1,cy+1], [cx+3,cx+3]x[cy+4,cy+4],
      or [cx+4,cx+4]x[cy+4,cy+4].
    - The corresponding squared distances are 2, 25, and 32.
    expectedSourceBehavior:
    - The inside and boundary point rectangles produce CONTAINS.
    - The outside point rectangle reaches the closest-point check and produces DISJOINT.
    targetCases: 3
    emptyOutputAllowed: false
  - id: DEGENERATE_LINE_RECTANGLES
    category: EDGE
    description: Zero-width or zero-height rectangles exercise containment and crossing
      without positive rectangle area.
    preconditions:
    - For containment use r = 5 and [cx+1,cx+1]x[cy-2,cy+2].
    - For crossing use r = 5 and [cx-6,cx+6]x[cy,cy].
    expectedSourceBehavior:
    - The contained vertical segment produces CONTAINS because its farthest endpoint
      is inside the circle.
    - The horizontal segment extending through and beyond the circle produces INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_CIRCLE_RELATIONS
    category: EDGE
    description: A non-empty zero-radius circle is tested against an enclosing rectangle,
      an identical point rectangle, and a separated rectangle.
    preconditions:
    - Use r = 0.
    - Use respectively [cx-1,cx+1]x[cy-1,cy+1], [cx,cx]x[cy,cy], or [cx+1,cx+2]x[cy-1,cy+1].
    expectedSourceBehavior:
    - The enclosing rectangle produces WITHIN through the bounding-box WITHIN shortcut.
    - The identical point rectangle produces WITHIN through the bounding-box equality
      edge case.
    - The separated rectangle produces DISJOINT through the bounding-box shortcut.
    targetCases: 3
    emptyOutputAllowed: false
