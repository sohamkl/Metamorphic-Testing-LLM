InputDomain:
  summary: Domain of constructible LocalDateRange source inputs whose end can be advanced
    by the metamorphic relation's fixed 23 days, covering bounded, empty, unbounded-start,
    boundary-date, construction, parsing, and integer-length cases.
  globalConstraints:
  - The source receiver is a non-null LocalDateRange.
  - The source range satisfies the class invariant that start is on or before end.
  - The source start is not LocalDate.MAX.minusDays(1) or LocalDate.MAX.
  - The source end is not LocalDate.MIN or LocalDate.MIN.plusDays(1).
  - The source end is no later than LocalDate.MAX.minusDays(23), because generateFollowUp
    calls range.getEnd().plusDays(23).
  - The follow-up is constructed as LocalDateRange.of(sourceStart, sourceEnd.plusDays(23));
    therefore the source start must remain valid for that construction.
  - Source cases used to check the arithmetic relation have finite source and follow-up
    lengths that are representable by the int-returning target.
  - Ranges with end equal to LocalDate.MAX are excluded only because the supplied
    follow-up transformation cannot add 23 days to LocalDate.MAX; this is a metamorphic-generator
    limitation, not a LocalDateRange validity restriction.
  diversity:
    constructionPath:
    - of(LocalDate
    - LocalDate)
    - of(LocalDate
    - Period)
    - ofClosed(LocalDate
    - LocalDate)
    - ofEmpty(LocalDate)
    - from(Temporal)
    - ofUnboundedStart(LocalDate)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    boundedness:
    - finite bounded
    - unbounded start
    - follow-up becomes unbounded at end
    length:
    - zero
    - one day
    - 23 days
    - ordinary positive length
    - Integer.MAX_VALUE minus 23 days
    dateBoundary:
    - ordinary dates
    - leap-day boundary
    - earliest permitted finite end near LocalDate.MIN
    - end at LocalDate.MAX.minusDays(23)
    followUpOutcome:
    - finite follow-up with increase of 23
    - follow-up output skipped because it is Integer.MAX_VALUE
  scenarios:
  - id: EMPTY_FINITE_RANGE
    category: EDGE
    description: An empty bounded range whose start and exclusive end are equal at
      an ordinary date.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 5, 10), LocalDate.of(2024, 5,
      10)).
    - source start equals source end.
    - source end.plusDays(23) is valid.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a 23-day bounded range starting at the same date.
    - The relation observes a follow-up increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: A non-empty half-open range containing exactly one whole day.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 5, 10), LocalDate.of(2024, 5,
      11)).
    - The exclusive end is exactly one day after the inclusive start.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24 and differs by exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_FINITE_HALF_OPEN_RANGE
    category: NORMAL
    description: An ordinary multi-day bounded range constructed directly with half-open
      endpoints.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2020, 1, 15), LocalDate.of(2020, 3,
      1)).
    - Both endpoints are ordinary finite dates and the end is after the start.
    expectedSourceBehavior:
    - lengthInDays() returns the whole-day difference between the two endpoints.
    - The follow-up remains bounded and its length is the source length plus 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: BOUNDARY
    description: A bounded range crossing February 29 in a leap year.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024, 3,
      2)).
    - The range contains the leap day and has a finite end at least 23 days before
      LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() counts the leap day as a whole day.
    - Extending the exclusive end by 23 days increases the returned length by exactly
      23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE_RANGE
    category: BOUNDARY
    description: A closed range containing one inclusive date, exercising conversion
      from inclusive end to exclusive end.
    preconditions:
    - source is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 15)).
    expectedSourceBehavior:
    - The resulting half-open range has an exclusive end one day after the inclusive
      date.
    - lengthInDays() returns 1.
    - The follow-up relation increases the length by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DAY_RANGE
    category: NORMAL
    description: A multi-day range built through the closed-range factory.
    preconditions:
    - source is LocalDateRange.ofClosed(LocalDate.of(2023, 12, 29), LocalDate.of(2024,
      1, 2)).
    - The inclusive end is after the inclusive start.
    expectedSourceBehavior:
    - lengthInDays() equals the number of included whole days after the closed-to-half-open
      conversion.
    - The follow-up length is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_RANGE
    category: EDGE
    description: A range created with a zero Period, producing an empty range at an
      ordinary date.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2022, 8, 4), Period.ZERO).
    expectedSourceBehavior:
    - The period creates equal start and end dates.
    - lengthInDays() returns 0.
    - The follow-up is finite and has length 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_CONSTRUCTED_RANGE
    category: NORMAL
    description: A range created by adding a positive Period to its start.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2021, 1, 31), Period.ofMonths(1)).
    - The period is non-negative and its date addition succeeds.
    - The resulting end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() reflects the dates produced by LocalDate.plus(Period), including
      the calendar-month adjustment.
    - The follow-up extends the resulting exclusive end by 23 days and increases the
      length by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_DATE_RANGE
    category: NORMAL
    description: A range parsed from two LocalDate representations separated by a
      slash.
    preconditions:
    - source is LocalDateRange.parse("2024-04-01/2024-04-30").
    - The first parsed date is not after the second.
    expectedSourceBehavior:
    - Parsing produces the corresponding half-open range.
    - lengthInDays() returns the difference between the parsed end and start.
    - The follow-up relation increases that result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_PERIOD_RANGE
    category: NORMAL
    description: A range parsed from a LocalDate followed by a positive Period.
    preconditions:
    - source is LocalDateRange.parse("2024-04-01/P23D").
    - The parsed period addition succeeds and the resulting end is at least 23 days
      before LocalDate.MAX.
    expectedSourceBehavior:
    - Parsing uses the date-plus-period form and produces a finite range of 23 days.
    - lengthInDays() returns 23.
    - The follow-up length is 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_PERIOD_DATE_RANGE
    category: NORMAL
    description: A range parsed from a Period followed by a LocalDate.
    preconditions:
    - source is LocalDateRange.parse("P23D/2024-04-24").
    - Subtracting the period from the end succeeds.
    expectedSourceBehavior:
    - Parsing uses the period-before-date form and produces a finite 23-day range.
    - lengthInDays() returns 23.
    - The follow-up length is 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A range obtained from a LocalDate through the from(Temporal) factory.
    preconditions:
    - source is LocalDateRange.from(LocalDate.of(2024, 7, 8)).
    - The chosen date is not LocalDate.MAX and its one-day closed range has a finite
      follow-up.
    expectedSourceBehavior:
    - from(Temporal) creates a closed one-date range.
    - lengthInDays() returns 1.
    - The follow-up relation increases the length by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A range obtained from a Year temporal.
    preconditions:
    - source is LocalDateRange.from(Year.of(2024)).
    - The year range ends no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - from(Temporal) creates the closed range from the first through the last day
      of the year.
    - lengthInDays() returns the number of days in that year.
    - The follow-up remains finite and is 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A range obtained from a YearMonth temporal.
    preconditions:
    - source is LocalDateRange.from(YearMonth.of(2024, 2)).
    - The YearMonth is not the terminal YearMonth whose end is LocalDate.MAX.
    expectedSourceBehavior:
    - from(Temporal) creates the closed range from the first through the last day
      of February.
    - lengthInDays() returns 29 for the leap-year month.
    - The follow-up relation increases the length by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_RANGE
    category: EDGE
    description: A range with an unbounded start and a finite exclusive end.
    preconditions:
    - source is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 1, 1)).
    - The finite end is at least 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the source is unbounded.
    - The follow-up remains unbounded at the start and also returns Integer.MAX_VALUE.
    - The supplied relation skips arithmetic when either output is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_PERMITTED_UNBOUNDED_START_END
    category: BOUNDARY
    description: An unbounded-start range using the earliest exclusive end permitted
      by the constructor.
    preconditions:
    - source is LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2)).
    - The exclusive end is LocalDate.MIN.plusDays(2), not LocalDate.MIN or LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - The range is valid and unbounded at the start.
    - lengthInDays() returns Integer.MAX_VALUE.
    - The relation follows its sentinel-output skip path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_MINIMUM_FINITE_RANGE
    category: BOUNDARY
    description: A finite range beginning at LocalDate.MIN with the first permitted
      finite exclusive end.
    preconditions:
    - source is LocalDateRange.of(LocalDate.MIN, LocalDate.MIN.plusDays(2)).
    - The end is not LocalDate.MIN.plusDays(1), which the constructor forbids.
    expectedSourceBehavior:
    - lengthInDays() returns 2 for the finite date difference.
    - The follow-up remains valid and finite.
    - The follow-up length is exactly 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: END_AT_MAX_MINUS_24
    category: BOUNDARY
    description: A bounded range whose 23-day extension ends at LocalDate.MAX.minusDays(1),
      exercising the latest finite follow-up endpoint.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.MAX.minusDays(24)).
    - The source end is exactly 24 days before LocalDate.MAX.
    expectedSourceBehavior:
    - The source and follow-up both have finite ends.
    - The follow-up end is LocalDate.MAX.minusDays(1), which is permitted as an exclusive
      end.
    - For representable returned lengths, the relation requires an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_BECOMES_UNBOUNDED_END
    category: EDGE
    description: A bounded source whose end is exactly LocalDate.MAX.minusDays(23),
      so the follow-up end becomes LocalDate.MAX.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.MAX.minusDays(23)).
    - source start is not a forbidden near-LocalDate.MAX start.
    expectedSourceBehavior:
    - The source is finite and its lengthInDays() follows the bounded-range path.
    - generateFollowUp constructs a range with end LocalDate.MAX.
    - followUpOutput is Integer.MAX_VALUE because the follow-up has an unbounded end.
    - The supplied assertion skips arithmetic because followUpOutput is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_INT_RELATION_LENGTH
    category: EDGE
    description: A finite bounded range whose source length is Integer.MAX_VALUE minus
      23, making the follow-up length exactly Integer.MAX_VALUE while both endpoints
      remain constructible.
    preconditions:
    - source start is LocalDate.of(1970, 1, 1).
    - source end is source start plus Integer.MAX_VALUE minus 23 days.
    - The resulting LocalDate and its 23-day extension are valid and the follow-up
      end is not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 23 for the finite source range.
    - The follow-up finite length is Integer.MAX_VALUE.
    - The relation's sentinel check skips the arithmetic assertion because followUpOutput
      equals Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_THREE_DAY_BASELINE
    category: NORMAL
    description: A finite source whose length equals the metamorphic increment.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2025, 1, 1), LocalDate.of(2025, 1,
      24)).
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46, making the fixed increment directly observable.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_RANGE
    category: BOUNDARY
    description: A finite range crossing a year boundary without relying on leap-day
      behavior.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024, 1,
      2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up remains bounded and has length 25.
    targetCases: 1
    emptyOutputAllowed: false
