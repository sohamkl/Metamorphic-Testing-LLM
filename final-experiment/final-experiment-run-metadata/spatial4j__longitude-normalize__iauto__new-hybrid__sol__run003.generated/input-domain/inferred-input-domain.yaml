InputDomain:
  summary: Finite Java double longitudes whose generated follow-up is observably one
    full 360-degree revolution, covering the direct-return branch, all modulo branches,
    antimeridian handling, signed zero, multiple revolutions, and floating-point precision
    stress.
  globalConstraints:
  - 'The source input must be a finite Java double: Double.isFinite(longitudeDeg)
    is true. NaN and infinities are excluded because they are not finite longitudes
    and would produce NaN differences that make the supplied assertion vacuous.'
  - The Java evaluation of longitudeDeg + 360.0 must be finite.
  - 'The generated shift must remain exactly one representable revolution: (longitudeDeg
    + 360.0) - longitudeDeg == 360.0. Values for which overflow, absorption, or rounding
    changes the declared transformation are excluded.'
  - Inputs are supplied directly to the public static normLonDEG(double) method; no
    object construction is required.
  diversity:
    sourceRegion:
    - inside [-180,180]
    - below -180
    - above 180
    sourceBranch:
    - direct return
    - off < 0
    - off == 0 and longitude > 0
    - remaining modulo branch
    boundaryPosition:
    - exactly -180
    - exactly 180
    - immediately inside
    - immediately outside
    revolutionClass:
    - zero revolutions
    - first wrapped band
    - exact antimeridian lattice
    - exact zero-meridian lattice
    - multiple wrapped bands
    numericFeature:
    - positive zero
    - negative zero
    - fractional longitude
    - large exactly shifted value
    - large rounding-stress value
    normalizedRegion:
    - near -180
    - near 0
    - near 180
    - ordinary interior
  scenarios:
  - id: SIGNED_ZERO_DIRECT_RETURN
    category: EDGE
    description: Positive and negative zero take the inclusive direct-return path.
    preconditions:
    - longitudeDeg is exactly +0.0 or -0.0, with one case for each raw double value.
    expectedSourceBehavior:
    - The result compares equal to zero.
    - The method returns the input directly, so the raw sign of zero is preserved.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ORDINARY_INTERIOR_DIRECT_RETURN
    category: NORMAL
    description: Ordinary interior longitudes exercise the common path without normalization.
    preconditions:
    - longitudeDeg is selected once from each of {-179.0, -90.0, -1.0, 90.0, 179.0}.
    expectedSourceBehavior:
    - The result is exactly equal to longitudeDeg.
    - The result lies strictly between -180.0 and 180.0.
    targetCases: 5
    emptyOutputAllowed: false
  - id: INNER_ANTIMERIDIAN_NEIGHBORS
    category: BOUNDARY
    description: The closest listed representable values inside the inclusive antimeridian
      bounds remain unchanged.
    preconditions:
    - longitudeDeg is -179.99999999999997 or 179.99999999999997.
    expectedSourceBehavior:
    - The inclusive range test succeeds and the result is exactly the source input.
    - The result remains strictly inside the corresponding antimeridian endpoint.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_ANTIMERIDIAN_ENDPOINTS
    category: BOUNDARY
    description: Both supported numeric representations of the antimeridian are accepted
      unchanged.
    preconditions:
    - longitudeDeg is exactly -180.0 or exactly 180.0.
    expectedSourceBehavior:
    - The result is exactly equal to the source input.
    - The two cases may return different numbers even though the supplied relation
      treats both as the same meridian.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OUTER_ANTIMERIDIAN_NEIGHBORS
    category: BOUNDARY
    description: Values immediately outside the inclusive range enter modulo normalization.
    preconditions:
    - longitudeDeg is -180.00000000000003 or 180.00000000000003.
    expectedSourceBehavior:
    - The result is finite and lies in the inclusive range [-180.0, 180.0].
    - A value just below -180.0 normalizes near +180.0, while a value just above +180.0
      normalizes near -180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FIRST_POSITIVE_WRAPPED_BAND
    category: NORMAL
    description: Positive values in the first band above 180 exercise the ordinary
      nonzero modulo path.
    preconditions:
    - longitudeDeg is selected once from each of {181.0, 270.0, 359.5}.
    expectedSourceBehavior:
    - The respective normalized results are -179.0, -90.0, and -0.5.
    - Each result lies in [-180.0, 180.0].
    targetCases: 3
    emptyOutputAllowed: false
  - id: FIRST_NEGATIVE_WRAPPED_BAND
    category: NORMAL
    description: Negative values in the first band below -180 exercise the off < 0
      branch.
    preconditions:
    - longitudeDeg is selected once from each of {-181.0, -270.0, -359.5}.
    expectedSourceBehavior:
    - The respective normalized results are 179.0, 90.0, and 0.5.
    - Each result lies in [-180.0, 180.0].
    targetCases: 3
    emptyOutputAllowed: false
  - id: POSITIVE_ANTIMERIDIAN_LATTICE
    category: EDGE
    description: Positive odd half-revolution values reach the off == 0 and longitudeDeg
      > 0 sentinel branch.
    preconditions:
    - longitudeDeg is selected once from each of {540.0, 900.0, 1260.0}.
    expectedSourceBehavior:
    - The computed remainder off is zero.
    - The result is exactly 180.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_ANTIMERIDIAN_LATTICE
    category: EDGE
    description: Negative odd half-revolution values have zero remainder but do not
      satisfy the positive-longitude sentinel.
    preconditions:
    - longitudeDeg is selected once from each of {-540.0, -900.0, -1260.0}.
    expectedSourceBehavior:
    - The computed remainder off compares equal to zero.
    - The result is exactly -180.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: POSITIVE_ZERO_MERIDIAN_LATTICE
    category: EDGE
    description: Positive whole-revolution values normalize to the zero meridian through
      the ordinary modulo branch.
    preconditions:
    - longitudeDeg is selected once from each of {360.0, 720.0, 1080.0}.
    expectedSourceBehavior:
    - The result compares exactly equal to 0.0.
    - The result is not an antimeridian endpoint.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_MERIDIAN_LATTICE
    category: EDGE
    description: Negative whole-revolution values exercise the negative-remainder
      branch and normalize to zero.
    preconditions:
    - longitudeDeg is selected once from each of {-360.0, -720.0, -1080.0}.
    expectedSourceBehavior:
    - The off < 0 branch is taken.
    - The result compares exactly equal to 0.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: HIGHER_POSITIVE_NONZERO_REMAINDERS
    category: NORMAL
    description: Positive multi-revolution inputs retain nonzero offsets on both sides
      of the zero meridian.
    preconditions:
    - longitudeDeg is selected once from each of {541.0, 719.0, 721.0}.
    expectedSourceBehavior:
    - The respective normalized results are -179.0, -1.0, and 1.0.
    - No case uses the zero-remainder sentinel branch.
    targetCases: 3
    emptyOutputAllowed: false
  - id: HIGHER_NEGATIVE_NONZERO_REMAINDERS
    category: NORMAL
    description: Negative multi-revolution inputs exercise negative remainders with
      outputs on both sides of zero.
    preconditions:
    - longitudeDeg is selected once from each of {-541.0, -719.0, -721.0}.
    expectedSourceBehavior:
    - The respective normalized results are 179.0, 1.0, and -1.0.
    - The off < 0 branch is taken in every case.
    targetCases: 3
    emptyOutputAllowed: false
  - id: DIRECT_OUTPUTS_WITHIN_ANTIMERIDIAN_TOLERANCE
    category: EDGE
    description: In-range values close enough to an endpoint to activate the relation's
      antimeridian predicate are returned directly.
    preconditions:
    - longitudeDeg is -179.9999999995 or 179.9999999995.
    - Math.abs(Math.abs(longitudeDeg) - 180.0) <= 1.0e-9.
    expectedSourceBehavior:
    - The result is exactly equal to longitudeDeg.
    - The supplied relation classifies the source result as an antimeridian value.
    targetCases: 2
    emptyOutputAllowed: false
  - id: WRAPPED_OUTPUTS_WITHIN_ANTIMERIDIAN_TOLERANCE
    category: EDGE
    description: Just-outside inputs wrap to the opposite numeric endpoint within
      the relation's antimeridian tolerance.
    preconditions:
    - longitudeDeg is -180.0000000005 or 180.0000000005.
    - Math.abs(Math.abs(longitudeDeg) - 180.0) <= 1.0e-9.
    expectedSourceBehavior:
    - The result is finite and in [-180.0, 180.0].
    - The result is near the opposite-signed antimeridian and satisfies Math.abs(Math.abs(result)
      - 180.0) <= 1.0e-9.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_FRACTIONAL_MULTI_REVOLUTION
    category: EDGE
    description: Large but exactly shiftable fractional longitudes test modulo quotient
      reduction without losing the fraction.
    preconditions:
    - longitudeDeg is 1000000000.25 or -1000000000.25.
    expectedSourceBehavior:
    - The respective normalized results are -79.75 and 79.75.
    - Each result is finite and strictly inside the normalized range.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_EXACT_INTEGER_REMAINDERS
    category: EDGE
    description: Large exactly represented powers of two exercise modulo normalization
      far outside ordinary longitude magnitudes.
    preconditions:
    - longitudeDeg is 4503599627370496.0 or -4503599627370496.0.
    expectedSourceBehavior:
    - The respective normalized results are 16.0 and -16.0.
    - The generated addition remains an exact 360.0-degree change.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INTERNAL_ADDITION_ROUNDING_STRESS
    category: EDGE
    description: Large powers of two preserve the generated 360-degree shift but stress
      rounding in the SUT's separate longitudeDeg + 180 computation.
    preconditions:
    - longitudeDeg is 36028797018963968.0 or -72057594037927936.0.
    - (longitudeDeg + 360.0) - longitudeDeg == 360.0.
    expectedSourceBehavior:
    - For 36028797018963968.0, the source result is 124.0.
    - For -72057594037927936.0, the source result is 100.0.
    - Both results are finite and in [-180.0, 180.0].
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_REMAINDER_TRANSITION_NEIGHBORS
    category: BOUNDARY
    description: Representable neighbors of antimeridian-lattice values cover transitions
      into and out of the zero-remainder sentinel.
    preconditions:
    - longitudeDeg is selected once from each of {539.9999999999999, 540.0000000000001,
      -540.0000000000001}.
    - longitudeDeg is not exactly 540.0 or -540.0.
    expectedSourceBehavior:
    - The computed off value is nonzero, so the exact zero-remainder sentinel is not
      taken.
    - Each result is finite, lies in [-180.0, 180.0], and is very close to an antimeridian
      endpoint.
    targetCases: 3
    emptyOutputAllowed: false
