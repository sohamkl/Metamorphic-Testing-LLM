InputDomain:
  summary: Non-empty rectangular double matrices whose transpose is also tested, covering
    pivot discovery, row marking, normalization, elimination, zero detection at the
    1e-10 threshold, rectangular shapes, and IEEE-754 double values.
  globalConstraints:
  - The source matrix has at least 1 row and at least 1 column.
  - Every row has exactly the same positive length, so the matrix is rectangular and
    non-empty.
  - Each cell is a Java double value; finite values, signed zero, NaN, and infinities
    are included because the supplied source imposes no value-domain restriction before
    processing.
  - The metamorphic follow-up is the transpose with dimensions columns by rows and
    element relation transposed[j][i] = source[i][j].
  - Each source case and its transpose are passed independently to computeRank.
  - The source input is inspected after each call to detect mutation; computeRank
    is expected to leave it unchanged because it operates on deepCopy(matrix).
  diversity:
    matrixShape:
    - 1x1
    - 1xN
    - Nx1
    - 2x2
    - 2x3
    - 3x2
    - 3x3
    - tall MxN with M>N
    - wide MxN with M<N
    rankStructure:
    - zero rank
    - rank one
    - deficient nonzero rank
    - full row rank
    - full column rank
    - full square rank
    pivotPath:
    - pivot in first row
    - pivot found after leading zeros
    - marked rows skipped
    - column with no pivot
    - multiple pivots
    - no pivots
    eliminationPath:
    - no elimination
    - elimination of nonzero entries in other rows
    - zero elimination entries skipped
    - elimination across later columns
    zeroClassification:
    - exact zero
    - signed zero
    - absolute value below 1e-10
    - absolute value exactly 1e-10
    - absolute value above 1e-10
    numericValues:
    - small finite values
    - ordinary finite values
    - large finite values
    - cancellation-prone values
    - NaN
    - positive infinity
    - negative infinity
  scenarios:
  - id: SINGLE_ZERO_ENTRY
    category: BOUNDARY
    description: A 1x1 matrix containing exactly zero reaches the no-pivot sentinel
      for its only column.
    preconditions:
    - The matrix shape is 1x1.
    - matrix[0][0] == 0.0.
    expectedSourceBehavior:
    - computeRank returns 0 for the source and its 1x1 transpose.
    - The source cell remains zero after invocation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_NONZERO_ENTRY
    category: BOUNDARY
    description: A 1x1 matrix containing a nonzero pivot reaches rank increment without
      entering any later-column normalization loop.
    preconditions:
    - The matrix shape is 1x1.
    - matrix[0][0] is finite and nonzero.
    expectedSourceBehavior:
    - computeRank returns 1 for the source and its transpose.
    - The source value is unchanged after invocation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ALL_ZERO_RECTANGULAR
    category: NORMAL
    description: A non-square matrix whose every entry is zero causes every column
      to return the no-pivot sentinel.
    preconditions:
    - The matrix has at least 2 rows and at least 2 columns.
    - Every entry is exactly positive or negative zero.
    expectedSourceBehavior:
    - computeRank returns 0 for both orientations.
    - No pivot normalization or elimination is entered.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_BY_MANY_ROW
    category: BOUNDARY
    description: A 1xN matrix with a nonzero entry exercises a single row pivot followed
      by columns with no unmarked row available.
    preconditions:
    - The matrix has one row and at least two columns.
    - At least one entry is finite and nonzero.
    - All other entries are finite.
    expectedSourceBehavior:
    - computeRank returns 1 for the source and its Nx1 transpose.
    - The source row is unchanged after the call.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MANY_BY_ONE_COLUMN
    category: BOUNDARY
    description: An Nx1 matrix with at least one nonzero entry exercises pivot selection
      in a single column while later transposed processing has one row.
    preconditions:
    - The matrix has at least two rows and exactly one column.
    - At least one entry is finite and nonzero.
    expectedSourceBehavior:
    - computeRank returns 1 for both orientations.
    - The result is bounded by min(row count, column count).
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_FULL_RANK
    category: NORMAL
    description: A square diagonal matrix with nonzero diagonal entries takes a distinct
      pivot in each column and has no nonzero off-diagonal elimination operands.
    preconditions:
    - The matrix is square with dimension at least 2.
    - Every diagonal entry is finite and nonzero.
    - Every off-diagonal entry is exactly zero.
    expectedSourceBehavior:
    - computeRank returns the matrix dimension for both orientations.
    - The source matrix is unchanged after invocation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TALL_FULL_COLUMN_RANK
    category: NORMAL
    description: A tall matrix with independent columns reaches a pivot in every column
      and leaves at least one unmarked row.
    preconditions:
    - The matrix has more rows than columns.
    - Its columns are linearly independent over ordinary finite values.
    - All entries are finite.
    expectedSourceBehavior:
    - computeRank returns the column count for the source and transpose.
    - The source remains rectangular and unchanged after the call.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDE_FULL_ROW_RANK
    category: NORMAL
    description: A wide matrix with independent rows reaches a pivot for every row,
      after which remaining columns have no available pivot row.
    preconditions:
    - The matrix has more columns than rows.
    - Its rows are linearly independent over ordinary finite values.
    - All entries are finite.
    expectedSourceBehavior:
    - computeRank returns the row count for both orientations.
    - Columns after the last row pivot follow the no-pivot sentinel path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DUPLICATE_ROWS
    category: NORMAL
    description: A matrix containing duplicate nonzero rows exercises elimination
      that reduces a dependent row to zero.
    preconditions:
    - The matrix has at least two rows and at least two columns.
    - Two distinct rows are exactly equal and nonzero.
    - All entries are finite.
    expectedSourceBehavior:
    - The returned rank is strictly less than the number of rows.
    - The source and transpose return the same rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PROPORTIONAL_ROWS
    category: NORMAL
    description: A matrix with nonzero proportional rows requires pivot-row normalization
      and elimination using a non-unit multiple.
    preconditions:
    - The matrix has at least two rows and at least two columns.
    - One row is a nonzero finite scalar multiple of another.
    - At least one additional row or column prevents the case from being only a 1x1
      input.
    expectedSourceBehavior:
    - The returned rank reflects the row dependency and is equal for the transpose.
    - Normalization and nonzero-row elimination are reached.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PIVOT_BELOW_LEADING_ZERO
    category: NORMAL
    description: The first candidate row is zero in a column and a later unmarked
      row supplies the pivot.
    preconditions:
    - There is a column c with matrix[0][c] exactly zero.
    - Some later row r has a finite nonzero value at column c.
    - The matrix has at least two rows.
    expectedSourceBehavior:
    - findPivotRow must skip at least one row before selecting a pivot in that column.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MARKED_ROW_SKIPPED
    category: NORMAL
    description: A later pivot search encounters a previously selected row before
      finding an unmarked pivot row.
    preconditions:
    - The matrix has at least two rows and at least two columns.
    - The first pivot is selected from a row that is nonzero in an earlier column.
    - In a later column, that same row is nonzero and at least one different unmarked
      row is also a pivot candidate.
    expectedSourceBehavior:
    - The later findPivotRow path skips the previously marked row.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COLUMN_WITHOUT_AVAILABLE_PIVOT
    category: NORMAL
    description: At least one column contains no nonzero value in any unmarked row
      after earlier pivots have been selected.
    preconditions:
    - The matrix has at least two columns.
    - At least one earlier column has a valid pivot.
    - For some later column, every unmarked row has an exactly zero or epsilon-zero
      value.
    expectedSourceBehavior:
    - That column returns numRows from findPivotRow and does not increment rank.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONZERO_ELIMINATION
    category: NORMAL
    description: A pivot column contains nonzero values in other rows, entering the
      inner elimination loop and updating later columns.
    preconditions:
    - The matrix has at least two rows and at least two columns.
    - A selected pivot value is finite and nonzero.
    - At least one other row has a finite nonzero value in that pivot column.
    - At least one later-column value is finite.
    expectedSourceBehavior:
    - eliminateRows processes at least one other row and at least one later column.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_ELIMINATION_OPERANDS
    category: NORMAL
    description: Other rows exist but their current pivot-column values are zero,
      so the conditional elimination body is skipped.
    preconditions:
    - The matrix has at least two rows and at least two columns.
    - A pivot is selected.
    - At least one other row has exactly zero in the pivot column.
    - At least one later column exists.
    expectedSourceBehavior:
    - The other-row condition !isZero(matrix[otherRow][colIndex]) is false for at
      least one row.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BELOW_EPSILON_PIVOT
    category: EDGE
    description: A value whose absolute magnitude is strictly below EPSILON is treated
      as zero by isZero.
    preconditions:
    - At least one candidate pivot entry has finite absolute value greater than 0
      and less than 1e-10.
    - The matrix has another finite nonzero entry arranged so that pivot discovery
      remains observable.
    expectedSourceBehavior:
    - The below-threshold entry is not selected as a pivot.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_EPSILON_PIVOT
    category: EDGE
    description: A value with absolute magnitude exactly 1e-10 tests the strict less-than
      comparison in isZero.
    preconditions:
    - At least one candidate entry is exactly 1e-10 or -1e-10.
    - The matrix has at least one row and one column where this entry can be considered
      for pivot selection.
    expectedSourceBehavior:
    - The exact-threshold value is not classified as zero by isZero.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIGNED_ZERO_VALUES
    category: EDGE
    description: Positive and negative zero values exercise Math.abs and zero checks
      while preserving the same numerical zero classification.
    preconditions:
    - The matrix has at least two rows or two columns.
    - At least one entry is +0.0 and at least one entry is -0.0.
    - Any nonzero entries are finite.
    expectedSourceBehavior:
    - Both signed-zero forms follow the isZero path.
    - The source and transpose return equal ranks and the source values are unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ABOVE_EPSILON_SMALL_VALUES
    category: EDGE
    description: Small finite values just above the zero threshold are eligible pivot
      candidates and can be used in normalization.
    preconditions:
    - At least one entry has finite absolute value greater than 1e-10 and less than
      1e-8.
    - The matrix has at least two columns so normalizePivotRow has a later-column
      iteration.
    expectedSourceBehavior:
    - The above-threshold entry is eligible for pivot selection.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CANCELLATION_DURING_ELIMINATION
    category: EDGE
    description: Elimination produces a value near zero in a later column, exercising
      post-arithmetic isZero decisions in subsequent pivot searches.
    preconditions:
    - The matrix has at least two rows and at least two columns.
    - It contains finite values arranged so a later-column subtraction produces an
      exact zero or a finite magnitude below 1e-10.
    expectedSourceBehavior:
    - The returned rank is an int bounded by min(row count, column count).
    - The source and transpose are compared for equal rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_VALUES
    category: EDGE
    description: Large finite entries exercise deep copying, normalization, and elimination
      without using non-finite input values.
    preconditions:
    - Every entry is finite.
    - At least one absolute entry is greater than 1e100.
    - The matrix has at least two rows and two columns.
    expectedSourceBehavior:
    - computeRank returns an int for each orientation.
    - The source is unchanged and the two returned ranks are compared.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SMALL_FINITE_VALUES
    category: EDGE
    description: Very small finite entries exercise the EPSILON classification and
      arithmetic under values near the lower normal range.
    preconditions:
    - Every entry is finite.
    - At least one nonzero entry has absolute value less than 1e-100.
    - The matrix has at least two rows and two columns.
    expectedSourceBehavior:
    - Values below the threshold follow isZero while any larger entries remain eligible.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_ENTRY
    category: EDGE
    description: A matrix containing NaN exercises the supplied isZero implementation,
      for which Math.abs(NaN) is not less than EPSILON.
    preconditions:
    - The matrix is non-empty and rectangular.
    - At least one entry is Double.NaN.
    - All remaining entries are finite.
    expectedSourceBehavior:
    - The source and transpose are both invoked without changing the source array.
    - Their returned int ranks are compared by the metamorphic relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INFINITY_ENTRY
    category: EDGE
    description: A matrix containing positive infinity exercises a nonzero value outside
      the finite range used by ordinary pivot arithmetic.
    preconditions:
    - The matrix is non-empty and rectangular.
    - At least one entry is Double.POSITIVE_INFINITY.
    - At least one other entry is finite.
    expectedSourceBehavior:
    - The source and transpose are both processed and their returned ranks are compared.
    - The source array is inspected for unintended mutation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INFINITY_ENTRY
    category: EDGE
    description: A matrix containing negative infinity exercises the same isZero branch
      with the opposite infinite sign.
    preconditions:
    - The matrix is non-empty and rectangular.
    - At least one entry is Double.NEGATIVE_INFINITY.
    - At least one other entry is finite.
    expectedSourceBehavior:
    - The source and transpose are both processed and their returned ranks are compared.
    - The source array remains unchanged after invocation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_SPECIAL_VALUES
    category: EDGE
    description: A rectangular matrix containing NaN and both signs of infinity exercises
      special-value interactions across pivot selection and elimination.
    preconditions:
    - The matrix has at least two rows and two columns.
    - It contains at least one NaN, one positive infinity, and one negative infinity.
    - The matrix remains rectangular and non-empty.
    expectedSourceBehavior:
    - Both orientations are invoked independently.
    - Returned ranks are compared for the transpose relation and the source is checked
      for mutation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TRANSPOSE_DIMENSION_SWAP
    category: NORMAL
    description: A non-square matrix with distinct row and column counts explicitly
      verifies that the follow-up changes dimensions while preserving the rank relation.
    preconditions:
    - The matrix has at least 2 rows and at least 3 columns, or at least 3 rows and
      at least 2 columns.
    - All entries are finite and the matrix is not all zero.
    expectedSourceBehavior:
    - The transposed input has exactly the original column count as rows and the original
      row count as columns.
    - computeRank returns the same rank for both orientations.
    targetCases: 1
    emptyOutputAllowed: false
