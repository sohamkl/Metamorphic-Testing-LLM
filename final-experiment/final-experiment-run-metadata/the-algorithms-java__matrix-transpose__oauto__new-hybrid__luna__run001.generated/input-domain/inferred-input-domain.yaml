InputDomain:
  summary: Finite, non-empty rectangular double matrices whose exact transpose is
    generated as the follow-up; cases emphasize pivot discovery, normalization, elimination,
    epsilon boundaries, rank extremes, and rectangular dimensions.
  globalConstraints:
  - The source matrix has at least 1 row and at least 1 column, because computeRank
    reads matrix.length and matrix[0].length and generateFollowUp reads source[0].
  - Every row is non-null and has exactly the same positive length, so the source
    is rectangular and the transpose loop can read every source[r][c].
  - Every entry is a finite double; this keeps normalization and elimination in ordinary
    finite arithmetic and gives the transpose relation its usual linear-algebra meaning.
    NaN and infinities are excluded because the supplied source provides no documented
    rank semantics for them.
  - The follow-up is exactly the generated transpose, with dimensions sourceColumns
    by sourceRows and followUp[c][r] equal to source[r][c].
  - No invalid-input scenario is included because the supplied metamorphic relation
    assumes source.length and source[0].length are readable and no invalid-input behavior
    is specified.
  - Source cases use distinct structural or numerical conditions; targetCases across
    all scenarios total 50.
  diversity:
    shape:
    - 1x1
    - single-row
    - single-column
    - square
    - wide rectangular
    - tall rectangular
    rankStructure:
    - zero rank
    - rank one
    - deficient positive rank
    - full row rank
    - full column rank
    - full square rank
    pivotPath:
    - first-row pivot
    - pivot after leading zero
    - skipped marked rows
    - no pivot in a column
    - negative pivot
    - multiple pivots
    eliminationStructure:
    - no elimination
    - proportional-row elimination
    - proportional-column dependence
    - sparse elimination
    - multi-column elimination
    epsilonRelation:
    - exact zero
    - absolute value below 1e-10
    - absolute value exactly 1e-10
    - absolute value above 1e-10
    valueScale:
    - unit-scale
    - negative values
    - small finite values
    - large finite values
  scenarios:
  - id: ALL_ZERO_MATRICES
    category: NORMAL
    description: Matrices whose every entry is exactly 0, covering zero-rank behavior
      across square and rectangular shapes.
    preconditions:
    - The matrix has 1 to 4 rows and 1 to 4 columns.
    - Every entry equals 0.0.
    - Include 1x1, 1x4, 4x1, and 3x3 shapes.
    expectedSourceBehavior:
    - Every column has no eligible pivot because every value isZero.
    - computeRank returns 0.
    - The transposed matrix also returns 0.
    - The source matrix is unchanged by the call.
    targetCases: 3
    emptyOutputAllowed: false
  - id: IDENTITY_AND_DIAGONAL_FULL_RANK
    category: NORMAL
    description: Identity or diagonal matrices with nonzero diagonal entries, exercising
      one pivot per diagonal position.
    preconditions:
    - The matrix is square with size n from 1 through 5.
    - All off-diagonal entries are 0.0.
    - Each diagonal entry is finite and has absolute value at least 1.0.
    expectedSourceBehavior:
    - Each diagonal column supplies one previously unmarked pivot row.
    - computeRank returns n.
    - The transpose has the same diagonal rank n.
    - The source matrix is unchanged by the call.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDE_FULL_ROW_RANK
    category: NORMAL
    description: Wide matrices with more columns than rows and independent rows.
    preconditions:
    - The matrix has 1 to 4 rows and strictly more columns than rows.
    - The first rows contain an identity block in the first rowCount columns.
    - Remaining entries are finite and arbitrary, with at least one case containing
      nonzero entries outside the identity block.
    expectedSourceBehavior:
    - At least one pivot is found for every row, while later columns may have no unmarked
      row available.
    - computeRank returns the row count.
    - The transposed tall matrix returns the same rank.
    targetCases: 4
    emptyOutputAllowed: false
  - id: TALL_FULL_COLUMN_RANK
    category: NORMAL
    description: Tall matrices with more rows than columns and independent columns.
    preconditions:
    - The matrix has strictly more rows than columns, with 1 to 4 columns.
    - The first columnCount rows contain an identity block in the first columnCount
      columns.
    - Additional rows are finite and do not make an identity pivot column dependent.
    expectedSourceBehavior:
    - Each column finds an eligible pivot in an unmarked row.
    - Remaining rows are processed by elimination but cannot increase rank beyond
      the column count.
    - computeRank returns the column count.
    - The transposed wide matrix returns the same rank.
    targetCases: 4
    emptyOutputAllowed: false
  - id: PROPORTIONAL_ROWS
    category: NORMAL
    description: Matrices containing nonzero rows that are scalar multiples of one
      another.
    preconditions:
    - The matrix has 2 or 3 rows and 2 or 3 columns.
    - At least two nonzero rows satisfy rowB = k times rowA for a finite nonzero k.
    - Include both positive and negative k.
    expectedSourceBehavior:
    - A pivot is found for the first independent row and elimination makes the proportional
      row dependent within the implementation's epsilon test.
    - computeRank is less than the row count.
    - The transpose has the same rank.
    targetCases: 3
    emptyOutputAllowed: false
  - id: PROPORTIONAL_COLUMNS
    category: NORMAL
    description: Matrices containing columns that are scalar multiples of one another,
      exercising dependence that becomes row dependence after transpose.
    preconditions:
    - The matrix has 2 or 3 rows and 2 or 3 columns.
    - At least two nonzero columns satisfy columnB = k times columnA for a finite
      nonzero k.
    - Include one case with an additional independent column.
    expectedSourceBehavior:
    - The source rank is lower than the number of columns because at least one column
      is dependent.
    - The transposed matrix exposes the same dependency as proportional rows and returns
      the same rank.
    targetCases: 3
    emptyOutputAllowed: false
  - id: LEADING_ZERO_REQUIRES_LATER_PIVOT_ROW
    category: NORMAL
    description: A column has a zero in the first available row but a nonzero value
      in a later unmarked row, forcing findPivotRow to skip the leading row.
    preconditions:
    - The matrix has 2 or 3 rows and 2 or 3 columns.
    - In at least one pivot-search column, the earliest unmarked row has absolute
      value below 1e-10 and a later unmarked row has absolute value at least 1e-10.
    - Include a case where the later row is needed for a positive-rank result.
    expectedSourceBehavior:
    - findPivotRow returns a later row rather than the first row.
    - The later row is marked, normalized, and used for elimination.
    - computeRank returns the number of independent pivot rows, and the transpose
      returns the same value.
    targetCases: 3
    emptyOutputAllowed: false
  - id: MARKED_ROWS_ARE_SKIPPED
    category: NORMAL
    description: After an early pivot marks a row, a later column must skip that marked
      row and seek another row.
    preconditions:
    - The matrix has 2 or 3 rows and at least 2 columns.
    - The first pivot column has a nonzero value in the earliest row.
    - A later column has a nonzero value in that already marked row and also in an
      unmarked row.
    - The unmarked row contributes an independent pivot.
    expectedSourceBehavior:
    - findPivotRow does not reuse the marked row.
    - A later unmarked row is selected for the later pivot.
    - computeRank counts both independent pivots, and transpose preserves that count.
    targetCases: 3
    emptyOutputAllowed: false
  - id: ZERO_PIVOT_COLUMNS_BETWEEN_PIVOTS
    category: NORMAL
    description: One or more columns contain no eligible pivot while a later column
      contains an eligible pivot.
    preconditions:
    - The matrix has at least 2 rows and 2 columns.
    - At least one intermediate column is zero in every unmarked row at the time it
      is searched.
    - A subsequent column contains a nonzero value in an unmarked row.
    expectedSourceBehavior:
    - findPivotRow returns numRows for the skipped column and rank is not incremented
      there.
    - A later column still contributes a pivot.
    - The transpose returns the same final rank.
    targetCases: 3
    emptyOutputAllowed: false
  - id: MULTI_COLUMN_ELIMINATION
    category: NORMAL
    description: Dense finite matrices where pivot normalization and elimination modify
      several entries to the right of each pivot.
    preconditions:
    - The matrix has 2 or 3 rows and 2 or 3 columns.
    - At least two pivot rows have nonzero entries to the right of their pivot columns.
    - At least one non-pivot row has a nonzero value in a pivot column.
    expectedSourceBehavior:
    - normalizePivotRow executes for more than one trailing entry in at least one
      pivot row.
    - eliminateRows executes for at least one other row and at least one trailing
      column.
    - computeRank returns the number of independent rows, and the transpose returns
      the same value.
    targetCases: 3
    emptyOutputAllowed: false
  - id: BELOW_EPSILON_ENTRIES
    category: EDGE
    description: Matrices containing nonzero values whose absolute values are strictly
      below EPSILON and are therefore treated as zero by isZero.
    preconditions:
    - At least one entry has absolute value in the interval (0, 1e-10).
    - Include positive and negative such entries.
    - Other entries, if present, have absolute value at least 1.0 so the near-zero
      effect is structurally observable.
    expectedSourceBehavior:
    - The below-epsilon entries do not qualify as pivots and do not trigger elimination
      conditions.
    - The returned rank follows the same pivot structure as replacing those entries
      with zero.
    - The transposed matrix returns the same rank.
    targetCases: 3
    emptyOutputAllowed: false
  - id: EPSILON_BOUNDARY_AND_ABOVE
    category: EDGE
    description: Matrices distinguishing the strict isZero boundary at absolute value
      exactly 1e-10 from values just above it.
    preconditions:
    - Include one case with an entry whose absolute value is exactly 1e-10.
    - Include one case with an entry whose absolute value is 1e-10 plus a finite positive
      increment no greater than 1e-12.
    - Include positive and negative signs across the cases.
    expectedSourceBehavior:
    - An entry with absolute value exactly 1e-10 is not isZero because the comparison
      is strictly less than EPSILON.
    - An entry just above the boundary is also eligible as a pivot or elimination
      value when encountered.
    - The source and transpose produce equal ranks for each case.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_AND_MIXED_SIGN_PIVOTS
    category: NORMAL
    description: Full-rank and deficient matrices whose pivot values and elimination
      coefficients include negative finite values.
    preconditions:
    - The matrix has 2 or 3 rows and 2 or 3 columns.
    - At least one eligible pivot is negative and at least one other nonzero entry
      has the opposite sign.
    - All absolute values are at least 1e-8.
    expectedSourceBehavior:
    - Negative pivots pass isZero and are used by normalizePivotRow.
    - Elimination uses signed division and subtraction without changing the rank result.
    - The transpose returns the same rank.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SINGLE_ROW_MATRICES
    category: BOUNDARY
    description: One-row matrices covering zero, nonzero, and mixed finite row contents.
    preconditions:
    - The matrix has exactly 1 row and 1 to 5 columns.
    - Include an all-zero row, a row with exactly one eligible nonzero entry, and
      a row with multiple eligible nonzero entries.
    expectedSourceBehavior:
    - The all-zero row returns rank 0.
    - Any row containing an eligible nonzero entry returns rank 1.
    - The transpose has the same rank.
    targetCases: 3
    emptyOutputAllowed: false
  - id: SINGLE_COLUMN_MATRICES
    category: BOUNDARY
    description: One-column matrices covering zero, repeated, and independently nonzero
      row values.
    preconditions:
    - The matrix has 1 to 5 rows and exactly 1 column.
    - Include an all-zero column, one nonzero row with remaining zero rows, and multiple
      nonzero rows.
    expectedSourceBehavior:
    - The only column can contribute at most one pivot.
    - The result is 0 when every entry is zero and 1 when at least one entry is eligible.
    - The transposed single-row matrix returns the same rank.
    targetCases: 3
    emptyOutputAllowed: false
  - id: INTERLEAVED_ZERO_AND_DUPLICATE_ROWS
    category: EDGE
    description: Matrices with zero rows and duplicate rows interspersed around independent
      rows.
    preconditions:
    - The matrix has 3 or 4 rows and 2 or 3 columns.
    - At least one row is all zero.
    - At least two nonzero rows are identical or scalar multiples, and at least one
      row is independent of them.
    expectedSourceBehavior:
    - Zero rows do not supply pivots.
    - Duplicate or proportional rows do not increase rank after elimination.
    - At least one independent row still supplies a pivot, and transpose preserves
      the rank.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SMALL_FINITE_SCALE
    category: EDGE
    description: Matrices with small but safely finite values whose magnitudes remain
      above the epsilon threshold.
    preconditions:
    - The matrix has 2 or 3 rows and 2 or 3 columns.
    - Every nonzero entry has absolute value between 1e-8 and 1e-6.
    - Choose values so normalization and elimination remain finite.
    expectedSourceBehavior:
    - Nonzero entries remain eligible under isZero.
    - Pivot normalization and elimination execute on small finite values without relying
      on exact unit-scale values.
    - The source and transpose return equal ranks.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_FINITE_SCALE
    category: EDGE
    description: Matrices with large but safely finite values, including scaled independent
      and dependent rows.
    preconditions:
    - The matrix has 2 or 3 rows and 2 or 3 columns.
    - Every nonzero entry has absolute value between 1e6 and 1e150.
    - Values are selected so every intermediate division and subtraction remains finite.
    expectedSourceBehavior:
    - Large finite pivots pass isZero and exercise normalization with non-unit denominators.
    - The intended independent or proportional structure determines the returned rank.
    - The transposed matrix returns the same rank.
    targetCases: 2
    emptyOutputAllowed: false
