InputDomain:
  summary: Non-null, non-empty rectangular double matrices with at least one row and
    one column; sources span zero and nonzero pivots, EPSILON threshold boundaries,
    pivot-search misses, row marking, normalization, elimination, rectangular shapes,
    and IEEE-754 special values. Each source is transposed to form the follow-up matrix.
  globalConstraints:
  - Source is a non-null double[][] with matrix.length >= 1.
  - Source has matrix[0] != null and matrix[0].length >= 1.
  - Every source row is non-null and has exactly matrix[0].length elements, so deepCopy
    and indexed column access are defined.
  - '{Follow-up input is the rectangular transpose=followUp[j][i] = source[i][j],
    with dimensions source[0].length by source.length.}'
  - Source and follow-up must both be submitted to computeRank, and their returned
    integer ranks must be equal.
  - Inputs are not reused as mutable working matrices between invocations; computeRank
    deep-copies the supplied rectangular matrix before pivot processing.
  diversity:
    matrixShape:
    - distinct
    - measurable
    - 1x1; 1xN; Nx1; square; wide; tall
    pivotAvailability:
    - distinct
    - measurable
    - no pivot; immediate pivot; delayed-column pivot; delayed-row pivot; exhausted
      marked rows
    numericClassification:
    - distinct
    - measurable
    - zero; signed zero; abs(value) < 1e-10; abs(value) = 1e-10; abs(value) > 1e-10;
      negative; fractional; large finite; infinity; NaN
    structuralRank:
    - distinct
    - measurable
    - rank 0; rank 1; intermediate rank; full row rank; full column rank; full square
      rank
    eliminationOutcome:
    - distinct
    - measurable
    - no elimination columns; exact cancellation; near-zero residual; threshold residual;
      non-finite residual
  scenarios:
  - id: SINGLE_ZERO
    category: BOUNDARY
    description: Smallest valid matrix whose only candidate pivot is zero.
    preconditions:
    - Source is [[0.0]].
    expectedSourceBehavior:
    - computeRank returns 0 because findPivotRow finds no non-zero entry in the only
      column.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_NONZERO
    category: BOUNDARY
    description: Smallest valid matrix with an immediate pivot.
    preconditions:
    - Source is [[7.0]].
    expectedSourceBehavior:
    - computeRank returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_BELOW_EPSILON
    category: BOUNDARY
    description: A nonzero stored value classified as zero by the strict EPSILON comparison.
    preconditions:
    - Source is [[0.00000000001]].
    - abs(source[0][0]) = 1e-11 < 1e-10.
    expectedSourceBehavior:
    - computeRank returns 0 because isZero returns true.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_POSITIVE_EPSILON
    category: BOUNDARY
    description: A value exactly at the positive pivot threshold.
    preconditions:
    - Source is [[0.0000000001]].
    - abs(source[0][0]) = 1e-10.
    expectedSourceBehavior:
    - computeRank returns 1 because isZero uses a strict less-than comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_NEGATIVE_EPSILON
    category: BOUNDARY
    description: A negative value exactly at the magnitude threshold.
    preconditions:
    - Source is [[-0.0000000001]].
    - abs(source[0][0]) = 1e-10.
    expectedSourceBehavior:
    - computeRank returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIGNED_ZERO_MATRIX
    category: EDGE
    description: A matrix containing positive and negative IEEE-754 zero values only.
    preconditions:
    - Source is [[-0.0, 0.0], [0.0, -0.0]].
    expectedSourceBehavior:
    - computeRank returns 0 because Math.abs of either signed zero is below EPSILON.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDE_ROW
    category: NORMAL
    description: A one-row wide matrix with no pivots in any column.
    preconditions:
    - Source is [[0.0, 0.0, 0.0, 0.0]].
    expectedSourceBehavior:
    - computeRank returns 0 after every column takes the no-pivot sentinel path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATE_COLUMN_PIVOT
    category: NORMAL
    description: A wide row whose first usable pivot occurs after leading all-zero
      columns.
    preconditions:
    - Source is [[0.0, 0.0, 5.0, 9.0]].
    expectedSourceBehavior:
    - computeRank returns 1; the first two columns have no pivot and column 2 marks
      the only row.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATE_ROW_PIVOT
    category: NORMAL
    description: A tall one-column matrix whose pivot is found below leading zero
      rows.
    preconditions:
    - Source is [[0.0], [0.0], [5.0], [0.0]].
    expectedSourceBehavior:
    - computeRank returns 1 and selects row index 2 as the pivot row.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_COLUMN_MULTIPLE_NONZERO_ROWS
    category: NORMAL
    description: Multiple nonzero candidates in a one-column matrix, where normalization
      and elimination have no later columns to process.
    preconditions:
    - Source is [[2.0], [-3.0], [4.0]].
    expectedSourceBehavior:
    - computeRank returns 1 and only the first nonzero row is marked.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ANTI_DIAGONAL_TWO_BY_TWO
    category: NORMAL
    description: A full-rank square matrix requiring the first pivot row to be found
      below row zero.
    preconditions:
    - Source is [[0.0, 1.0], [1.0, 0.0]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DUPLICATE_ROWS_RANK_ONE
    category: NORMAL
    description: Two identical nonzero rows requiring elimination to make a later
      column unusable.
    preconditions:
    - Source is [[1.0, 2.0, 3.0], [1.0, 2.0, 3.0]].
    expectedSourceBehavior:
    - computeRank returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SCALAR_MULTIPLE_ROWS_RANK_ONE
    category: NORMAL
    description: Non-identical rows that are scalar multiples, including a negative
      multiplier.
    preconditions:
    - Source is [[1.0, -2.0, 4.0], [-3.0, 6.0, -12.0], [0.5, -1.0, 2.0]].
    expectedSourceBehavior:
    - computeRank returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_ELIMINATION_CANCELLATION
    category: NORMAL
    description: A dependent two-by-two matrix where elimination produces an exact
      zero trailing entry.
    preconditions:
    - Source is [[1.0, 1.0], [1.0, 1.0]].
    expectedSourceBehavior:
    - computeRank returns 1 after the second-row trailing value is eliminated to zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULL_RANK_TWO_BY_TWO
    category: NORMAL
    description: A basic full-rank square matrix with immediate pivots.
    preconditions:
    - Source is [[1.0, 2.0], [3.0, 4.0]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_THREE_BY_THREE
    category: NORMAL
    description: A full-rank diagonal matrix that visits independent pivots in each
      column.
    preconditions:
    - Source is [[2.0, 0.0, 0.0], [0.0, -3.0, 0.0], [0.0, 0.0, 4.0]].
    expectedSourceBehavior:
    - computeRank returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDE_FULL_ROW_RANK
    category: NORMAL
    description: A wide matrix whose rank reaches its row bound before all columns
      are processed.
    preconditions:
    - Source is [[1.0, 0.0, 2.0, 3.0], [0.0, 1.0, 4.0, 5.0]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDE_EXHAUSTED_MARKED_ROWS
    category: EDGE
    description: A wide matrix with explicit trailing columns after all rows have
      been marked as pivots.
    preconditions:
    - Source is [[1.0, 0.0, 0.0, 7.0], [0.0, 1.0, 0.0, 8.0]].
    expectedSourceBehavior:
    - computeRank returns 2 and later columns take the no-unmarked-pivot sentinel
      path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TALL_FULL_COLUMN_RANK
    category: NORMAL
    description: A tall matrix whose rank reaches its column bound while unmarked
      rows remain.
    preconditions:
    - Source is [[1.0, 0.0], [0.0, 1.0], [2.0, 3.0], [-1.0, 4.0]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TALL_RANK_ONE_WITH_LEADING_ZERO
    category: NORMAL
    description: A tall rank-one matrix with an initial zero row before the selected
      pivot.
    preconditions:
    - Source is [[0.0, 0.0], [2.0, 4.0], [-1.0, -2.0], [3.0, 6.0]].
    expectedSourceBehavior:
    - computeRank returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERMEDIATE_RANK_THREE_BY_THREE
    category: NORMAL
    description: A square matrix with rank between zero and its dimension.
    preconditions:
    - Source is [[1.0, 2.0, 3.0], [2.0, 4.0, 6.0], [0.0, 1.0, 1.0]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONCONSECUTIVE_PIVOT_COLUMNS
    category: NORMAL
    description: Independent pivots occur in separated columns with a skipped zero
      column.
    preconditions:
    - Source is [[1.0, 0.0, 2.0], [0.0, 0.0, 3.0], [0.0, 0.0, 0.0]].
    expectedSourceBehavior:
    - computeRank returns 2; column 1 has no pivot and columns 0 and 2 supply pivots.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_TRIANGULAR_FRACTIONAL
    category: NORMAL
    description: A full-rank matrix using negative and fractional non-pivot values
      during normalization.
    preconditions:
    - Source is [[-2.0, 0.5, 1.5], [0.0, 3.0, -0.25], [0.0, 0.0, 4.0]].
    expectedSourceBehavior:
    - computeRank returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_TRIANGULAR_LATE_PIVOTS
    category: NORMAL
    description: A full-rank lower-triangular matrix that causes elimination against
      lower rows.
    preconditions:
    - Source is [[2.0, 0.0, 0.0], [3.0, -1.0, 0.0], [4.0, 5.0, 6.0]].
    expectedSourceBehavior:
    - computeRank returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RESIDUAL_BELOW_EPSILON
    category: BOUNDARY
    description: Elimination leaves a nonzero mathematical residual smaller than EPSILON.
    preconditions:
    - Source is [[1.0, 1.0], [1.0, 1.00000000001]].
    - The second-row trailing residual after first-column elimination has magnitude
      below 1e-10.
    expectedSourceBehavior:
    - computeRank returns 1 because the residual is classified as zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RESIDUAL_AT_EPSILON
    category: BOUNDARY
    description: Elimination leaves a trailing residual at the strict pivot threshold.
    preconditions:
    - Source is [[1.0, 1.0], [1.0, 1.0000000001]].
    - The intended second-row trailing residual is approximately 1e-10.
    expectedSourceBehavior:
    - computeRank returns 2 when the computed residual is not classified as zero by
      the strict comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_SUBTHRESHOLD_AND_USABLE_PIVOT
    category: BOUNDARY
    description: A leading stored nonzero is ignored while a later above-threshold
      entry supplies the pivot.
    preconditions:
    - Source is [[0.00000000001, 2.0], [0.0, 0.0]].
    - abs(source[0][0]) < 1e-10 and abs(source[0][1]) > 1e-10.
    expectedSourceBehavior:
    - computeRank returns 1; column 0 has no pivot and column 1 selects row 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_VALUES
    category: EDGE
    description: Large finite values exercise normalization and elimination near double
      overflow limits.
    preconditions:
    - Source is [[1.0E308, 1.0E308], [1.0E308, -1.0E308]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_SMALL_ALL_SUBTHRESHOLD
    category: EDGE
    description: Every stored entry is nonzero but below EPSILON.
    preconditions:
    - Source is [[1.0E-300, -1.0E-300], [5.0E-200, 0.0]].
    - Every entry has magnitude below 1e-10.
    expectedSourceBehavior:
    - computeRank returns 0 because every candidate is classified as zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INFINITY_SCALAR
    category: EDGE
    description: A one-element matrix containing positive infinity.
    preconditions:
    - Source is [[Infinity]].
    expectedSourceBehavior:
    - computeRank returns 1 because Math.abs(Infinity) is not below EPSILON.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INFINITY_SCALAR
    category: EDGE
    description: A one-element matrix containing negative infinity.
    preconditions:
    - Source is [[-Infinity]].
    expectedSourceBehavior:
    - computeRank returns 1 because Math.abs(-Infinity) is not below EPSILON.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_SCALAR
    category: EDGE
    description: A one-element matrix containing NaN, for which the isZero comparison
      is false.
    preconditions:
    - Source is [[NaN]].
    expectedSourceBehavior:
    - computeRank returns 1 because Math.abs(NaN) < EPSILON evaluates false.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_WITH_FINITE_DIAGONAL
    category: EDGE
    description: A two-by-two matrix where NaN is selected as one pivot and a finite
      value as another.
    preconditions:
    - Source is [[NaN, 0.0], [0.0, 1.0]].
    expectedSourceBehavior:
    - computeRank returns 2 because NaN is not classified as zero and the finite diagonal
      entry supplies a second pivot.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_CREATED_ELIMINATION_RESIDUAL
    category: EDGE
    description: A finite pivot multiplies a NaN elimination factor, producing a NaN
      trailing residual.
    preconditions:
    - Source is [[1.0, 1.0], [NaN, 1.0]].
    expectedSourceBehavior:
    - computeRank returns 2 because the NaN residual is not classified as zero in
      the second column.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INFINITY_NORMALIZATION_AND_ELIMINATION
    category: EDGE
    description: An infinite first pivot is normalized before eliminating a finite
      second row.
    preconditions:
    - Source is [[Infinity, 1.0], [1.0, 1.0]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGULAR_THREE_BY_FOUR_RANK_TWO
    category: NORMAL
    description: A non-square matrix with two independent rows and one dependent row.
    preconditions:
    - Source is [[1.0, 2.0, 0.0, 1.0], [0.0, 1.0, 1.0, 2.0], [1.0, 3.0, 1.0, 3.0]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGULAR_FOUR_BY_THREE_RANK_TWO
    category: NORMAL
    description: A tall matrix with two independent row directions and additional
      dependent rows.
    preconditions:
    - Source is [[1.0, 0.0, 1.0], [0.0, 1.0, 1.0], [1.0, 1.0, 2.0], [2.0, -1.0, 1.0]].
    expectedSourceBehavior:
    - computeRank returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIRST_PIVOT_NOT_TOPMOST_AFTER_MARKING
    category: NORMAL
    description: Later columns must skip an already marked early row and choose a
      lower unmarked row.
    preconditions:
    - Source is [[1.0, 1.0, 0.0], [0.0, 2.0, 1.0], [0.0, 0.0, 3.0]].
    expectedSourceBehavior:
    - computeRank returns 3 and each successive pivot uses a distinct row.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOURCE_ARRAY_PRESERVATION_WITH_ELIMINATION
    category: NORMAL
    description: A matrix requiring elimination, used to observe that computeRank
      operates on its deep copy rather than modifying source cells.
    preconditions:
    - Source is [[2.0, 4.0], [1.0, 3.0]].
    - A bitwise snapshot of all source entries is retained before invocation.
    expectedSourceBehavior:
    - computeRank returns 2.
    - Source entries remain bitwise equal to their pre-invocation snapshot after computeRank
      returns.
    targetCases: 1
    emptyOutputAllowed: false
