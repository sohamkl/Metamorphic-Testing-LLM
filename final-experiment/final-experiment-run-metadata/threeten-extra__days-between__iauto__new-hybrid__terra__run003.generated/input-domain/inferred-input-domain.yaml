InputDomain:
  summary: Non-null Temporal endpoint pairs for which ChronoUnit.DAYS.between returns
    a representable int and both endpoints can be advanced by 37 DAYS. Cover zero,
    singleton-one, negative, ordinary, calendar-boundary, date-time truncation, zone/offset,
    instant-duration, int-limit, chronology, and compatible mixed-temporal cases.
  globalConstraints:
  - Both source endpoints are non-null; the follow-up generator explicitly rejects
    null endpoints.
  - Each endpoint supports plus(37, ChronoUnit.DAYS) without exception or temporal-range
    overflow.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) completes successfully
    and its result is within Integer.MIN_VALUE through Integer.MAX_VALUE, because
    Days.between applies Math.toIntExact.
  - The endpoint pair is mutually compatible for ChronoUnit.DAYS.between; temporals
    that do not support this operation are excluded because neither the source invocation
    nor the required follow-up relation produces two Days outputs.
  - Inputs whose source or follow-up temporal adjustment overflows are excluded because
    the supplied MR requires successful 37-day adjustment of both endpoints.
  diversity:
    outputAmountClass:
    - zero
    - positive-one
    - negative-one
    - positive-general
    - negative-general
    - Integer.MIN_VALUE
    - Integer.MAX_VALUE
    temporalFamily:
    - LocalDate
    - LocalDateTime
    - OffsetDateTime
    - ZonedDateTime
    - Instant
    - JapaneseDate
    - HijrahDate
    - MinguoDate
    - ThaiBuddhistDate
    - mixed-compatible-date-types
    dayCountingBasis:
    - calendar-date
    - complete-local-days
    - offset-normalized-local-days
    - zone-calendar-days-across-DST
    - exact-24-hour-instant-days
    calendarBoundary:
    - same-date
    - month-end
    - leap-day
    - year-end
    - LocalDate-min-side
    - LocalDate-max-side
    - daylight-saving-transition
  scenarios:
  - id: LOCAL_DATE_SAME_DATE_ZERO
    category: NORMAL
    description: Equal ISO LocalDate endpoints.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is the same LocalDate value as startDateInclusive.
    expectedSourceBehavior:
    - getAmount() is 0.
    - The result is Days.ZERO.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ADJACENT_FORWARD_ONE
    category: NORMAL
    description: Consecutive ISO calendar dates in increasing order.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is LocalDate.of(2024, 6, 16).
    expectedSourceBehavior:
    - getAmount() is 1.
    - The result is Days.ONE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ADJACENT_REVERSE_MINUS_ONE
    category: NORMAL
    description: Consecutive ISO calendar dates in decreasing order.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 16).
    - endDateExclusive is LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_END_CROSSING
    category: BOUNDARY
    description: ISO date interval crossing from the last day of a 31-day month into
      the next month.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 31).
    - endDateExclusive is LocalDate.of(2024, 2, 2).
    expectedSourceBehavior:
    - getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: ISO date interval spanning leap day in a leap year.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28).
    - endDateExclusive is LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_END_CROSSING
    category: BOUNDARY
    description: ISO date interval crossing a calendar year boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 12, 31).
    - endDateExclusive is LocalDate.of(2024, 1, 2).
    expectedSourceBehavior:
    - getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM_RANGE
    category: EDGE
    description: ISO LocalDate values near LocalDate.MIN while retaining room for
      the MR's 37-day shift.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is LocalDate.MIN.plusDays(37).
    expectedSourceBehavior:
    - getAmount() is 37.
    - Both follow-up endpoints remain valid LocalDate values.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM_RANGE
    category: EDGE
    description: ISO LocalDate values near LocalDate.MAX while retaining room for
      the MR's 37-day shift.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(38).
    - endDateExclusive is LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - getAmount() is 1.
    - Both follow-up endpoints remain valid LocalDate values.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_INCOMPLETE_FORWARD_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints separated by less than one complete day despite
      crossing a date boundary.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 11, 59, 59).
    expectedSourceBehavior:
    - getAmount() is 0 because no complete local day is between the date-times.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_FORWARD_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints exactly one complete day apart.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 12, 0).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_INCOMPLETE_REVERSE_DAY
    category: BOUNDARY
    description: Reverse LocalDateTime interval whose magnitude is less than one complete
      day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 16, 11, 59, 59).
    - endDateExclusive is LocalDateTime.of(2024, 6, 15, 12, 0).
    expectedSourceBehavior:
    - getAmount() is 0 because the reverse interval does not contain a complete day.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_REVERSE_DAY
    category: NORMAL
    description: LocalDateTime endpoints exactly one complete day apart in reverse
      order.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 16, 12, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 15, 12, 0).
    expectedSourceBehavior:
    - getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET_DAY
    category: NORMAL
    description: OffsetDateTime endpoints one day apart with the same offset.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is OffsetDateTime.parse("2024-01-02T00:00:00Z").
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSET_INCOMPLETE_DAY
    category: EDGE
    description: OffsetDateTime endpoints whose displayed dates differ but whose offset-normalized
      interval is 23 hours.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is OffsetDateTime.parse("2024-01-02T00:00:00+01:00").
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_DAY
    category: EDGE
    description: Same-zone ZonedDateTime interval across the US spring daylight-saving
      transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-03-09T12:00:00-05:00[America/New_York]").
    - endDateExclusive is ZonedDateTime.parse("2024-03-10T12:00:00-04:00[America/New_York]").
    expectedSourceBehavior:
    - getAmount() is 1 calendar day despite the elapsed duration being 23 hours.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FALL_DST_DAY
    category: EDGE
    description: Same-zone ZonedDateTime interval across the US autumn daylight-saving
      transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-11-02T12:00:00-04:00[America/New_York]").
    - endDateExclusive is ZonedDateTime.parse("2024-11-03T12:00:00-05:00[America/New_York]").
    expectedSourceBehavior:
    - getAmount() is 1 calendar day despite the elapsed duration being 25 hours.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_DURATION
    category: BOUNDARY
    description: Instant endpoints separated by 23 hours, 59 minutes, and 59 seconds.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-01T23:59:59Z").
    expectedSourceBehavior:
    - getAmount() is 0 because the duration is less than 24 hours.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_24_HOUR_DURATION
    category: BOUNDARY
    description: Instant endpoints separated by exactly 24 hours.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-02T00:00:00Z").
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAXIMUM_DAYS
    category: EDGE
    description: Instant interval at the largest day count accepted by Days.between.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.plus(2147483647L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is Integer.MAX_VALUE.
    - The source conversion through Math.toIntExact succeeds at its upper inclusive
      boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MINIMUM_DAYS
    category: EDGE
    description: Instant interval at the smallest day count accepted by Days.between.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.minus(2147483648L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is Integer.MIN_VALUE.
    - The source conversion through Math.toIntExact succeeds at its lower inclusive
      boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_LEAP_BOUNDARY
    category: NORMAL
    description: JapaneseDate endpoints spanning the ISO leap-day-equivalent calendar
      positions.
    preconditions:
    - startDateInclusive is JapaneseDate.of(2024, 2, 28).
    - endDateExclusive is JapaneseDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_DAY_INCREMENT
    category: NORMAL
    description: HijrahDate endpoints related by an explicit two-day Temporal adjustment.
    preconditions:
    - startDateInclusive is a valid HijrahDate.
    - endDateExclusive equals startDateInclusive.plus(2, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_REVERSE_INCREMENT
    category: NORMAL
    description: MinguoDate endpoints related by an explicit reverse three-day adjustment.
    preconditions:
    - endDateExclusive is a valid MinguoDate.
    - startDateInclusive equals endDateExclusive.plus(3, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is -3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_WEEK_LENGTH
    category: NORMAL
    description: ThaiBuddhistDate endpoints exactly one seven-day week apart.
    preconditions:
    - startDateInclusive is a valid ThaiBuddhistDate.
    - endDateExclusive equals startDateInclusive.plus(7, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_ISO_AND_JAPANESE_DATE
    category: EDGE
    description: Compatible mixed date implementations representing consecutive ISO
      timeline dates.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1).
    - endDateExclusive is JapaneseDate.of(2024, 1, 2).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) completes successfully.
    expectedSourceBehavior:
    - getAmount() is 1.
    - The source result demonstrates delegation to the start temporal's DAYS calculation
      for a compatible mixed pair.
    targetCases: 1
    emptyOutputAllowed: false
