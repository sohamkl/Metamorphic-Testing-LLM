InputDomain:
  summary: Non-null HTML body fragments, non-null base URI strings, and Safelist instances
    created through the supplied constructors or factory methods, emphasizing sanitization,
    parsing normalization, URL resolution, policy boundaries, and the idempotence
    follow-up.
  globalConstraints:
  - bodyHtml is a non-null java.lang.String because generateFollowUp calls Objects.requireNonNull(bodyHtml).
  - baseUri is a non-null java.lang.String because generateFollowUp calls Objects.requireNonNull(baseUri).
  - safelist is a non-null org.jsoup.safety.Safelist because generateFollowUp calls
    Objects.requireNonNull(safelist).
  - Each source case is a body fragment rather than a requirement to supply a complete
    html document, matching Jsoup.clean's parseBodyFragment call.
  - Each source case uses a Safelist obtained from Safelist(), Safelist(Safelist),
    Safelist.basic(), Safelist.basicWithImages(), Safelist.none(), Safelist.relaxed(),
    or Safelist.simpleText().
  - The follow-up is always generated by cleaning the source output with the same
    baseUri and safelist, and the oracle is exact String equality between the source
    and follow-up outputs.
  - No null-input case is included because null is rejected by the metamorphic relation
    before a follow-up can be generated.
  diversity:
    bodyFragmentForm:
    - empty fragment
    - plain text
    - entity-containing text
    - policy-permitted element
    - policy-disallowed element
    - allowed and disallowed attributes
    - relative URL attribute
    - absolute URL attribute
    - unsafe-protocol URL attribute
    - malformed or unbalanced markup
    - comments and declarations
    - nested mixed content
    - whitespace-only content
    baseUri:
    - empty string
    - absolute http URI
    - absolute https URI
    - URI with path
    - non-empty relative-looking string
    safelistConstruction:
    - new Safelist()
    - Safelist.none()
    - Safelist.simpleText()
    - Safelist.basic()
    - Safelist.basicWithImages()
    - Safelist.relaxed()
    - copy constructed from another supplied Safelist
    policyBoundary:
    - no element or attribute permitted
    - text-oriented policy
    - basic element policy
    - basic policy with images
    - relaxed element and attribute policy
    - element permitted but attribute not permitted
    - attribute permitted but URL protocol rejected
    outputPossibility:
    - empty output permitted
    - non-empty text output required
    - normalized non-empty HTML output required
  scenarios:
  - id: EMPTY_FRAGMENT_WITH_EMPTY_BASE
    category: EDGE
    description: Clean an empty body fragment with an empty base URI and an empty-policy
      Safelist.
    preconditions:
    - bodyHtml is exactly "".
    - baseUri is exactly "".
    - safelist is Safelist.none() or a newly constructed empty Safelist.
    expectedSourceBehavior:
    - Jsoup.clean parses the empty body fragment and returns the cleaned body HTML.
    - The source output is expected to be empty, and that output is a valid follow-up
      input.
    - Cleaning the returned output with the same arguments must produce the identical
      String.
    targetCases: 1
    emptyOutputAllowed: true
  - id: WHITESPACE_ONLY_FRAGMENT
    category: BOUNDARY
    description: Clean a fragment containing only spaces, tabs, and line breaks.
    preconditions:
    - bodyHtml contains no element markup and at least one whitespace character.
    - baseUri is non-null and may be empty.
    - safelist is Safelist.none() or Safelist.simpleText().
    expectedSourceBehavior:
    - The parser and cleaner process whitespace as body-fragment content rather than
      as a null or absent value.
    - The returned serialization is used unchanged as the follow-up bodyHtml.
    - The second cleaning must equal the first even if serialization normalizes whitespace.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PLAIN_TEXT_WITH_NONE_POLICY
    category: NORMAL
    description: Clean ordinary text under a text-free policy.
    preconditions:
    - bodyHtml is non-empty plain text with no '<' or '>' markup delimiters.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Text content is retained as safe body HTML, with any required HTML escaping
      represented in the returned String.
    - The output is non-empty when the text contains a non-whitespace character.
    - The output must be stable under the idempotence follow-up.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ENTITY_ESCAPING_WITH_NONE_POLICY
    category: NORMAL
    description: Clean text containing characters represented both literally and as
      HTML entities.
    preconditions:
    - bodyHtml contains text such as an escaped less-than entity and an ampersand
      entity.
    - safelist is Safelist.none() or Safelist.simpleText().
    expectedSourceBehavior:
    - The result remains HTML rather than being converted to a plain-text return value.
    - Entity serialization is normalized by parseBodyFragment and clean.body().html().
    - The normalized result must remain unchanged on the second cleaning.
    targetCases: 2
    emptyOutputAllowed: false
  - id: TEXT_WITH_DISALLOWED_ELEMENT
    category: NORMAL
    description: Supply text nested inside an element that the selected Safelist does
      not permit.
    preconditions:
    - bodyHtml contains a disallowed element surrounding visible text.
    - The selected safelist does not permit that element.
    - The fragment contains no required external resource.
    expectedSourceBehavior:
    - The disallowed markup is not present in the cleaned output.
    - Any text retained by the Cleaner is represented in the returned body HTML.
    - The output, whether empty or text-only, is idempotent.
    targetCases: 2
    emptyOutputAllowed: true
  - id: PERMITTED_ELEMENT_WITH_SAFE_CONTENT
    category: NORMAL
    description: Supply an element known to be permitted by the selected Safelist
      together with ordinary text content.
    preconditions:
    - The body fragment contains an element permitted by the chosen policy.
    - The element contains no attributes or descendants outside the selected policy.
    - safelist is one of Safelist.simpleText(), Safelist.basic(), Safelist.basicWithImages(),
      or Safelist.relaxed().
    expectedSourceBehavior:
    - The permitted element and its retained text are present in the cleaned body
      serialization.
    - The returned HTML is normalized by jsoup parsing and serialization.
    - A second cleaning with the same Safelist must not remove or rewrite additional
      content.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERMITTED_ELEMENT_WITH_DISALLOWED_ATTRIBUTE
    category: NORMAL
    description: Combine a policy-permitted element with an attribute not permitted
      by that Safelist.
    preconditions:
    - The element is permitted by the selected Safelist.
    - The element has at least one attribute outside the policy.
    - The element also has visible text so removal of the attribute is observable
      without relying on an empty result.
    expectedSourceBehavior:
    - The permitted element and text remain eligible for output.
    - The disallowed attribute is absent from the source output.
    - The source output is already safe for the exact idempotence follow-up.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PERMITTED_ATTRIBUTE_WITH_NORMAL_VALUE
    category: NORMAL
    description: Exercise an attribute value that is accepted by the selected policy
      without URL resolution.
    preconditions:
    - bodyHtml contains a policy-permitted element and an attribute accepted for that
      element.
    - The attribute value is a non-empty ordinary value without a URL protocol.
    - safelist is Safelist.basic(), Safelist.basicWithImages(), or Safelist.relaxed().
    expectedSourceBehavior:
    - The permitted attribute is retained when the selected Safelist permits it.
    - The element's text and serialized attributes form the source output.
    - The follow-up must return exactly the same serialization.
    targetCases: 3
    emptyOutputAllowed: false
  - id: RELATIVE_URL_WITH_ABSOLUTE_BASE
    category: NORMAL
    description: Clean a permitted URL-bearing element whose attribute contains a
      relative URL and whose base URI is absolute.
    preconditions:
    - bodyHtml contains a URL-bearing element permitted by the selected Safelist.
    - Its URL attribute contains a relative reference.
    - baseUri is an absolute http or https URI.
    - The selected Safelist permits the element and URL attribute.
    expectedSourceBehavior:
    - URL handling is exercised through parseBodyFragment and Cleaner with the supplied
      base URI.
    - The output contains either the policy-approved resolved URL representation or
      no URL if the policy rejects it; the result must be observed rather than assumed.
    - The cleaned result must be idempotent with the same absolute base URI.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RELATIVE_URL_WITH_EMPTY_BASE_AND_PRESERVE_RELATIVE_SETTING
    category: EDGE
    description: Exercise the source method's explicit empty-base branch for a Safelist
      that preserves relative links.
    preconditions:
    - baseUri is exactly "".
    - safelist.preserveRelativeLinks() is true.
    - bodyHtml contains a URL-bearing element and a relative URL value.
    expectedSourceBehavior:
    - Jsoup.clean replaces the empty base URI with DummyUri before parsing.
    - The placeholder must not leak into the returned output according to the source
      comment.
    - The follow-up uses the returned output with the original empty base URI and
      must produce the identical result.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RELATIVE_URL_WITH_EMPTY_BASE_AND_NONPRESERVING_POLICY
    category: EDGE
    description: Exercise relative URL handling with an empty base URI when the Safelist
      does not preserve relative links.
    preconditions:
    - baseUri is exactly "".
    - safelist.preserveRelativeLinks() is false.
    - bodyHtml contains a URL-bearing element with a relative URL.
    expectedSourceBehavior:
    - The source method does not enter its DummyUri assignment branch.
    - URL retention or removal is determined by Cleaner and the Safelist.
    - The output must remain stable when cleaned again with the same empty base URI
      and policy.
    targetCases: 2
    emptyOutputAllowed: true
  - id: ABSOLUTE_SAFE_PROTOCOL_URL
    category: NORMAL
    description: Supply an absolute URL using a protocol accepted by the selected
      Safelist.
    preconditions:
    - bodyHtml contains a permitted URL-bearing element with an absolute http or https
      URL.
    - The selected Safelist permits that element, attribute, and protocol.
    - baseUri is non-null and may be empty or absolute.
    expectedSourceBehavior:
    - The URL attribute is a candidate for retention rather than relative resolution.
    - The cleaned serialization retains only policy-approved markup and attributes.
    - The exact source output must be reproduced by the follow-up.
    targetCases: 2
    emptyOutputAllowed: false
  - id: UNSAFE_PROTOCOL_URL
    category: NORMAL
    description: Supply a permitted URL-bearing element whose URL uses a protocol
      rejected by the Safelist.
    preconditions:
    - bodyHtml contains a URL-bearing element and an unsafe protocol URL such as a
      javascript URL.
    - The element and URL attribute are otherwise candidates for the selected Safelist.
    - baseUri is non-null.
    expectedSourceBehavior:
    - URL protocol filtering is exercised independently of element filtering.
    - The unsafe URL attribute or unsafe element content is absent from the cleaned
      output according to the policy.
    - The resulting output must be unchanged by the follow-up.
    targetCases: 3
    emptyOutputAllowed: true
  - id: MIXED_SAFE_AND_UNSAFE_URLS
    category: NORMAL
    description: Include multiple URL-bearing elements in one fragment, mixing relative,
      safe absolute, and unsafe-protocol values.
    preconditions:
    - bodyHtml contains at least three URL-bearing elements.
    - At least one URL is relative, one uses an accepted absolute protocol, and one
      uses a rejected protocol.
    - The selected Safelist permits the relevant element and attribute types.
    expectedSourceBehavior:
    - The cleaner processes URL candidates independently while applying the same base
      URI and Safelist.
    - Safe and unsafe URL outcomes are distinguishable in the source output.
    - The complete normalized output must be a fixed point under the follow-up.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BASIC_WITH_IMAGE_CONTENT
    category: NORMAL
    description: Use Safelist.basicWithImages() with image markup and a mixture of
      image attributes.
    preconditions:
    - safelist is Safelist.basicWithImages().
    - bodyHtml contains an image element with a URL attribute and at least one additional
      attribute.
    - baseUri is absolute or empty.
    expectedSourceBehavior:
    - Image-specific policy behavior is exercised separately from the basic policy.
    - URL and attribute filtering are observable in the returned body HTML.
    - The cleaned image serialization must be idempotent.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RELAXED_POLICY_NESTED_CONTENT
    category: NORMAL
    description: Use Safelist.relaxed() on nested markup containing several policy-relevant
      elements and attributes.
    preconditions:
    - safelist is Safelist.relaxed().
    - bodyHtml contains at least two nested elements and at least one attribute.
    - At least one descendant is disallowed or has an attribute requiring filtering.
    expectedSourceBehavior:
    - Cleaner traverses nested content under a broader policy.
    - Retained elements and attributes remain, while disallowed descendants or attributes
      do not.
    - The normalized nested output is a fixed point under the follow-up.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_POLICY_MARKUP
    category: NORMAL
    description: Use Safelist.simpleText() on markup containing text-oriented elements
      and a disallowed richer element.
    preconditions:
    - safelist is Safelist.simpleText().
    - bodyHtml contains visible text inside both a text-oriented element and a richer
      element not permitted by the policy.
    expectedSourceBehavior:
    - The result demonstrates the distinction between retained text and removed unsafe
      markup.
    - The output is body HTML, including any required escaping, rather than a plain-text
      API result.
    - Re-cleaning the output must not change it.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NONE_POLICY_MARKUP_ONLY
    category: NORMAL
    description: Use Safelist.none() on a fragment made entirely of markup with no
      visible text outside the elements.
    preconditions:
    - safelist is Safelist.none().
    - bodyHtml contains one or more elements whose content is empty or has no retained
      text.
    expectedSourceBehavior:
    - The cleaner removes the unsafe markup under the text-node-only policy.
    - Empty output is allowed and is still passed as the follow-up bodyHtml.
    - Cleaning that empty result again must return the same empty String.
    targetCases: 2
    emptyOutputAllowed: true
  - id: EMPTY_CONSTRUCTED_SAFELIST
    category: BOUNDARY
    description: Use a Safelist created with the public no-argument constructor rather
      than a named factory.
    preconditions:
    - safelist is created with new Safelist().
    - bodyHtml contains both plain text and at least one element.
    - baseUri is non-null.
    expectedSourceBehavior:
    - The constructor-created policy is applied without substituting a different policy.
    - The output exposes which content that policy retains or removes.
    - The output must be idempotent regardless of whether it is empty or text-only.
    targetCases: 1
    emptyOutputAllowed: true
  - id: COPIED_SAFELIST_POLICY
    category: NORMAL
    description: Use a Safelist copy constructed from one of the supplied factory-created
      Safelists.
    preconditions:
    - An original Safelist is created by basic(), basicWithImages(), none(), relaxed(),
      or simpleText().
    - safelist is created with new Safelist(original).
    - bodyHtml contains at least one policy-sensitive element or attribute.
    expectedSourceBehavior:
    - Cleaning uses the copied Safelist instance supplied to Jsoup.clean.
    - The result exercises the same policy state through the copy construction path
      without changing the MR arguments.
    - The source result must equal the result of cleaning that result again with the
      copied policy.
    targetCases: 2
    emptyOutputAllowed: true
  - id: MALFORMED_UNBALANCED_FRAGMENT
    category: EDGE
    description: Supply HTML with unclosed, crossed, or otherwise unbalanced tags.
    preconditions:
    - bodyHtml is non-empty and contains malformed or unbalanced HTML markup.
    - baseUri and safelist are non-null.
    expectedSourceBehavior:
    - parseBodyFragment constructs a normalized fragment before Cleaner runs.
    - The returned output is parser-normalized and contains only policy-approved content.
    - The normalized output must be a fixed point under a second clean.
    targetCases: 2
    emptyOutputAllowed: true
  - id: NESTED_DISALLOWED_AND_PERMITTED_ELEMENTS
    category: NORMAL
    description: Nest a policy-permitted element inside a disallowed element and include
      visible text at both levels.
    preconditions:
    - bodyHtml contains at least one permitted element nested within at least one
      disallowed element.
    - The selected Safelist distinguishes the two element classes.
    - baseUri is non-null.
    expectedSourceBehavior:
    - Cleaner traverses the nested structure and applies the allow-list to each element.
    - Retained text and permitted markup are observable without requiring preservation
      of the disallowed ancestor.
    - The resulting serialization is stable on the follow-up.
    targetCases: 2
    emptyOutputAllowed: false
  - id: COMMENTS_AND_DECLARATIONS
    category: EDGE
    description: Include HTML comments or declarations adjacent to ordinary visible
      content.
    preconditions:
    - bodyHtml contains at least one comment or declaration and at least one visible
      text node.
    - safelist is Safelist.none(), Safelist.simpleText(), or another supplied policy.
    expectedSourceBehavior:
    - Parsing and cleaning process non-content markup together with the visible body
      fragment.
    - The source output reveals whether such nodes survive the Cleaner while retaining
      any permitted visible text.
    - The observed normalized output must be unchanged by the follow-up.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ABSOLUTE_BASE_WITH_PATH
    category: BOUNDARY
    description: Resolve relative URL candidates against an absolute base URI that
      includes a path component.
    preconditions:
    - baseUri is a non-empty absolute http or https URI containing a path.
    - bodyHtml contains at least one relative URL in a policy-permitted URL-bearing
      element.
    - safelist permits the relevant element and attribute.
    expectedSourceBehavior:
    - URL resolution receives the complete supplied base URI rather than only its
      scheme and host.
    - The resulting serialized URL or filtered attribute is used as the source output.
    - The follow-up with the same path-bearing base URI must be exactly idempotent.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NONEMPTY_NONURL_BASE_STRING
    category: EDGE
    description: Provide a non-empty baseUri string that is not selected as the empty-base
      sentinel.
    preconditions:
    - baseUri is non-null, non-empty, and is a relative-looking or otherwise non-empty
      String.
    - bodyHtml contains ordinary text and optionally a relative URL candidate.
    - safelist is non-null.
    expectedSourceBehavior:
    - The source method does not execute its explicit baseUri.isEmpty() branch.
    - Parsing and cleaning still receive exactly the supplied non-empty baseUri.
    - The returned output, including any URL filtering or normalization, must be idempotent.
    targetCases: 1
    emptyOutputAllowed: true
  - id: SPECIAL_CHARACTER_TEXT
    category: BOUNDARY
    description: Clean text containing quotes, ampersands, angle-bracket characters,
      and non-ASCII characters.
    preconditions:
    - bodyHtml contains no required markup but includes characters requiring HTML
      parsing or serialization treatment.
    - safelist is Safelist.none() or Safelist.simpleText().
    expectedSourceBehavior:
    - The returned value is serialized HTML from clean.body().html(), not an unescaped
      raw-text result.
    - Character escaping and Unicode preservation are observable in the source output.
    - A second cleaning must preserve the serialized representation exactly.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MULTIPLE_SIBLING_FRAGMENTS
    category: NORMAL
    description: Clean several adjacent sibling elements and text nodes in one body
      fragment.
    preconditions:
    - bodyHtml contains at least three sibling content units, including text and elements.
    - At least one sibling is policy-permitted and at least one is policy-disallowed.
    - safelist is one of the supplied named factory policies.
    expectedSourceBehavior:
    - Cleaning applies the policy across the complete fragment rather than only its
      first node.
    - The order and normalized serialization of retained siblings are observable.
    - The full sibling output must remain unchanged during the follow-up.
    targetCases: 2
    emptyOutputAllowed: false
