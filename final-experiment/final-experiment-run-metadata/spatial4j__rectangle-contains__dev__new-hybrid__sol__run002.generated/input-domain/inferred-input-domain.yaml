InputDomain:
  summary: Finite valid geographic rectangles and points, using T(x)=DistanceUtils.normLonDEG(x+150.0)
    and geographic width W=(maxX-minX) when nonnegative or (maxX-minX+360) otherwise.
  globalConstraints:
  - rectangle, point, and rectangle.getContext() are non-null.
  - rectangle.getContext().isGeo() is true, because the stated rotation relation and
    relate(Point) dateline-unwrapping behavior are geographic.
  - The point is created by rectangle.getContext().makePoint(pointX,pointY), so source
    and follow-up points use the rectangle's context.
  - minX, maxX, and pointX are finite values in the inclusive geographic longitude
    range [-180.0,180.0].
  - minY, maxY, and pointY are finite values in the inclusive geographic latitude
    range [-90.0,90.0].
  - minY <= maxY.
  - The represented geographic width W is at least 0.0 and strictly less than 360.0.
  - 'Exclude minX=-180.0 and maxX=180.0, the full-width representation: the supplied
    transformation normalizes its two rotated endpoints to the same longitude and
    therefore does not preserve that rectangle.'
  - NaN and infinities are excluded because they are sentinel or non-geographic coordinates
    and the supplied MR does not request invalid inputs.
  diversity:
    sourceLatitudeRelation:
    - strictly_below
    - at_minY
    - strictly_inside
    - at_maxY
    - strictly_above
    sourceLongitudeRepresentation:
    - non_wrapping
    - wrapping_minX_greater_than_maxX
    - zero_width
    - dateline_alias
    sourceLongitudeRelation:
    - strictly_inside
    - at_minX
    - at_maxX
    - west_outside
    - east_outside
    - wrapped_gap
    sourceGeoBranch:
    - direct_short_circuit
    - pX_plus_360
    - pX_minus_360
    - final_contains
    - final_disjoint
    rotatedRectangleRepresentation:
    - non_wrapping
    - wrapping
    expectedRelation:
    - CONTAINS
    - DISJOINT
    widthClassDegrees:
    - zero
    - tiny_positive
    - less_than_180
    - exactly_180
    - greater_than_180
    - almost_360
    coordinateClass:
    - integer
    - fractional
    - signed_zero
    - negative_180
    - positive_180
    - pole
  scenarios:
  - id: STRICT_INTERIOR_NON_WRAPPING
    category: NORMAL
    description: A point is strictly inside both axes of a non-wrapping rectangle.
    preconditions:
    - minX < maxX and minY < maxY.
    - minX < pointX < maxX and minY < pointY < maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the geographic direct-longitude short
      circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_STRICTLY_ABOVE
    category: NORMAL
    description: Longitude is inside, but the point is north of the rectangle.
    preconditions:
    - minX <= pointX <= maxX with minX <= maxX.
    - pointY > maxY.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT at the first latitude comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_STRICTLY_BELOW
    category: NORMAL
    description: Longitude is inside, but the point is south of the rectangle.
    preconditions:
    - minX <= pointX <= maxX with minX <= maxX.
    - pointY < minY.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT at the second latitude comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ON_MIN_LATITUDE
    category: BOUNDARY
    description: The point lies exactly on the rectangle's minimum-latitude edge.
    preconditions:
    - pointY = minY and minY < maxY.
    - The point longitude is contained by the rectangle.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because latitude edges are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ON_MAX_LATITUDE
    category: BOUNDARY
    description: The point lies exactly on the rectangle's maximum-latitude edge.
    preconditions:
    - pointY = maxY and minY < maxY.
    - The point longitude is contained by the rectangle.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because latitude edges are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_MATCH
    category: EDGE
    description: A zero-height rectangle and point share the same latitude.
    preconditions:
    - minY = maxY = pointY.
    - The point longitude is contained by the rectangle.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_MISMATCH
    category: EDGE
    description: A point misses a zero-height rectangle in latitude.
    preconditions:
    - minY = maxY.
    - pointY != minY.
    - The point longitude is contained by the rectangle.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT from a latitude comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTH_POLE_EDGE
    category: BOUNDARY
    description: The rectangle and point meet at geographic latitude +90.
    preconditions:
    - maxY = pointY = 90.0.
    - minY < 90.0 and the point longitude is contained.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTH_POLE_EDGE
    category: BOUNDARY
    description: The rectangle and point meet at geographic latitude -90.
    preconditions:
    - minY = pointY = -90.0.
    - maxY > -90.0 and the point longitude is contained.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_WRAPPING_MIN_LONGITUDE_EDGE
    category: BOUNDARY
    description: The point lies exactly on a non-wrapping rectangle's minimum-longitude
      edge.
    preconditions:
    - minX < maxX and pointX = minX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS via the direct-longitude short circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_WRAPPING_MAX_LONGITUDE_EDGE
    category: BOUNDARY
    description: The point lies exactly on a non-wrapping rectangle's maximum-longitude
      edge.
    preconditions:
    - minX < maxX and pointX = maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS via the direct-longitude short circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_WRAPPING_WEST_OUTSIDE_AFTER_SHIFT
    category: NORMAL
    description: A point west of a non-wrapping rectangle remains outside after the
      code adds 360 degrees.
    preconditions:
    - minX <= maxX and pointX < minX.
    - pointX + 360.0 > maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - The pX < minX branch adds 360.0, then relate(point) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_WRAPPING_EAST_OUTSIDE_AFTER_SHIFT
    category: NORMAL
    description: A point east of a non-wrapping rectangle remains outside after the
      code subtracts 360 degrees.
    preconditions:
    - minX <= maxX and pointX > maxX.
    - pointX - 360.0 < minX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - The pX > maxX branch subtracts 360.0, then relate(point) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_DATELINE_ALIAS_TO_POSITIVE_EDGE
    category: EDGE
    description: Longitude -180 is accepted as the alias of a rectangle edge at +180.
    preconditions:
    - minX < maxX = 180.0 and pointX = -180.0.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - The pX < minX branch changes pointX to 180.0 and relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_DATELINE_ALIAS_TO_NEGATIVE_EDGE
    category: EDGE
    description: Longitude +180 is accepted as the alias of a rectangle edge at -180.
    preconditions:
    - minX = -180.0 < maxX and pointX = 180.0.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - The pX > maxX branch changes pointX to -180.0 and relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LONGITUDE_MATCH
    category: EDGE
    description: A point exactly matches an ordinary zero-width rectangle longitude.
    preconditions:
    - minX = maxX = pointX with -180.0 < pointX < 180.0.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LONGITUDE_WEST_MISS
    category: EDGE
    description: A point west of an ordinary zero-width rectangle does not match it.
    preconditions:
    - minX = maxX with -180.0 < minX < 180.0.
    - pointX < minX and pointX + 360.0 > maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT after adding 360.0 to pX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LONGITUDE_EAST_MISS
    category: EDGE
    description: A point east of an ordinary zero-width rectangle does not match it.
    preconditions:
    - minX = maxX with -180.0 < minX < 180.0.
    - pointX > maxX and pointX - 360.0 < minX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT after subtracting 360.0 from pX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_DATELINE_ZERO_WIDTH_ALIAS
    category: EDGE
    description: A zero-width rectangle at -180 contains a point represented as +180.
    preconditions:
    - minX = maxX = -180.0 and pointX = 180.0.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - The point is shifted to -180.0 and relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_DATELINE_ZERO_WIDTH_ALIAS
    category: EDGE
    description: A zero-width rectangle at +180 contains a point represented as -180.
    preconditions:
    - minX = maxX = 180.0 and pointX = -180.0.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - The point is shifted to 180.0 and relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_EAST_SEGMENT_INTERIOR
    category: NORMAL
    description: A point is strictly inside the eastern segment of a dateline-wrapping
      rectangle.
    preconditions:
    - minX > maxX.
    - minX < pointX <= 180.0.
    - minY < pointY < maxY.
    expectedSourceBehavior:
    - The rectangle maxX is unwrapped by 360.0 and relate(point) returns CONTAINS
      without shifting pX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_WEST_SEGMENT_INTERIOR
    category: NORMAL
    description: A point is strictly inside the western segment of a dateline-wrapping
      rectangle.
    preconditions:
    - minX > maxX.
    - -180.0 <= pointX < maxX.
    - minY < pointY < maxY.
    expectedSourceBehavior:
    - The code adds 360.0 to pX and relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_MIN_LONGITUDE_EDGE
    category: BOUNDARY
    description: A point lies on the eastern edge denoted by minX of a wrapped rectangle.
    preconditions:
    - minX > maxX and pointX = minX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the direct-longitude short circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_MAX_LONGITUDE_EDGE
    category: BOUNDARY
    description: A point lies on the western edge denoted by maxX of a wrapped rectangle.
    preconditions:
    - minX > maxX and pointX = maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - The code adds 360.0 to pX and relate(point) returns CONTAINS at the unwrapped
      maximum.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_GAP_INTERIOR
    category: NORMAL
    description: A point lies strictly in the excluded longitude gap of a wrapped
      rectangle.
    preconditions:
    - minX > maxX.
    - maxX < pointX < minX.
    - minY < pointY < maxY.
    expectedSourceBehavior:
    - The code adds 360.0 to pX, which exceeds the unwrapped maxX, and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_GAP_JUST_BELOW_MIN
    category: BOUNDARY
    description: A gap point is close to but strictly below the wrapped rectangle's
      minX edge.
    preconditions:
    - minX > maxX.
    - 0.0 < minX - pointX <= 0.000001 and pointX > maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Despite proximity to the inclusive edge, relate(point) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_GAP_JUST_ABOVE_MAX
    category: BOUNDARY
    description: A gap point is close to but strictly above the wrapped rectangle's
      maxX edge.
    preconditions:
    - minX > maxX.
    - 0.0 < pointX - maxX <= 0.000001 and pointX < minX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Despite proximity to the inclusive edge, relate(point) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NARROW_WRAPPED_RECTANGLE
    category: EDGE
    description: A wrapped rectangle narrower than 180 degrees contains a point in
      one represented segment.
    preconditions:
    - minX > maxX and 0.0 < W < 180.0.
    - pointX >= minX or pointX <= maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS after geographic unwrapping.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SEMICIRCLE_WRAPPED_RECTANGLE
    category: BOUNDARY
    description: A wrapped rectangle has exactly 180 degrees of longitude width.
    preconditions:
    - minX > maxX and W = 180.0.
    - pointX >= minX or pointX <= maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDE_WRAPPED_RECTANGLE
    category: EDGE
    description: A wrapped rectangle wider than 180 but narrower than 360 degrees
      contains a point.
    preconditions:
    - minX > maxX and 180.0 < W < 360.0.
    - pointX >= minX or pointX <= maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS after unwrapping the wide longitude interval.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ALMOST_WORLD_WRAPPED_GAP
    category: EDGE
    description: An almost-360-degree wrapped rectangle still excludes a point in
      its tiny gap.
    preconditions:
    - minX > maxX and 359.0 < W < 360.0.
    - maxX < pointX < minX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT; the width does not trigger any world-width shortcut
      in relate(Point).
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_ENDPOINT_PAIR_ZERO_WIDTH
    category: EDGE
    description: The endpoint pair minX=+180 and maxX=-180 unwraps to a zero-width
      longitude at the dateline.
    preconditions:
    - minX = 180.0 and maxX = -180.0.
    - pointX is either -180.0 or 180.0.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - After unwrapping and any point shift, relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_CREATES_WRAPPED_CONTAINS
    category: EDGE
    description: A non-wrapping source rectangle becomes wrapped after the supplied
      150-degree rotation while containing the point.
    preconditions:
    - minX <= maxX and T(minX) > T(maxX).
    - minX <= pointX <= maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Source relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_CREATES_WRAPPED_DISJOINT
    category: EDGE
    description: A non-wrapping source rectangle becomes wrapped after rotation while
      the source point is horizontally disjoint.
    preconditions:
    - minX <= maxX and T(minX) > T(maxX).
    - minY <= pointY <= maxY.
    - pointX is outside the rectangle and is not a -180/+180 alias of an included
      edge.
    expectedSourceBehavior:
    - Source relate(point) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_REMOVES_WRAP_EAST_CONTAINS
    category: EDGE
    description: A wrapped source rectangle becomes non-wrapping after rotation, with
      the point in its eastern segment.
    preconditions:
    - minX > maxX and T(minX) <= T(maxX).
    - pointX >= minX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Source relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_REMOVES_WRAP_WEST_CONTAINS
    category: EDGE
    description: A wrapped source rectangle becomes non-wrapping after rotation, with
      the point in its western segment.
    preconditions:
    - minX > maxX and T(minX) <= T(maxX).
    - pointX <= maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Source relate(point) returns CONTAINS after adding 360.0 to pX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_REMOVES_WRAP_GAP_DISJOINT
    category: EDGE
    description: A wrapped source rectangle becomes non-wrapping after rotation, with
      the point in the source gap.
    preconditions:
    - minX > maxX and T(minX) <= T(maxX).
    - maxX < pointX < minX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Source relate(point) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_PRESERVES_NON_WRAP
    category: NORMAL
    description: Both source and rotated rectangle use non-wrapping endpoint order.
    preconditions:
    - minX <= maxX and T(minX) <= T(maxX).
    - minX < pointX < maxX and minY < pointY < maxY.
    expectedSourceBehavior:
    - Source relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_PRESERVES_WRAP
    category: NORMAL
    description: Both source and rotated rectangle use wrapped endpoint order.
    preconditions:
    - minX > maxX and T(minX) > T(maxX).
    - pointX > minX or pointX < maxX.
    - minY < pointY < maxY.
    expectedSourceBehavior:
    - Source relate(point) returns CONTAINS after the source dateline-unwrapping logic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOURCE_DIRECT_ROTATED_SHIFTED
    category: EDGE
    description: The source contains through its direct interval, while the rotated
      coordinates require a point-shift branch.
    preconditions:
    - minX <= pointX <= maxX with minX <= maxX.
    - T(pointX) < T(minX) or T(pointX) > T(maxX).
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Source relate(point) returns CONTAINS through the direct-longitude short circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOURCE_SHIFTED_ROTATED_DIRECT
    category: EDGE
    description: The source contains only after a dateline alias shift, while the
      rotated point lies directly between rotated endpoints.
    preconditions:
    - Either maxX=180.0 and pointX=-180.0, or minX=-180.0 and pointX=180.0.
    - T(minX) <= T(pointX) <= T(maxX).
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Source relate(point) returns CONTAINS after adding or subtracting 360.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ROTATION_CROSSES_DATELINE
    category: EDGE
    description: The point's longitude itself normalizes across the dateline under
      the 150-degree rotation.
    preconditions:
    - pointX > 30.0, so pointX + 150.0 > 180.0.
    - The source rectangle contains pointX in longitude.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - Source relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIGNED_ZERO_LONGITUDE_EDGE
    category: BOUNDARY
    description: Signed zero is used on an inclusive longitude edge.
    preconditions:
    - pointX is +0.0 or -0.0.
    - pointX = minX or pointX = maxX.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because the numeric comparisons treat the edge
      as inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FRACTIONAL_INTERIOR_COORDINATES
    category: NORMAL
    description: Finite fractional coordinates exercise the same geometric path without
      relying only on integer degrees.
    preconditions:
    - At least one of minX, maxX, minY, maxY, pointX, or pointY has a nonzero fractional
      part.
    - minX < pointX < maxX and minY < pointY < maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the direct-longitude short circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TINY_POSITIVE_NON_WRAPPED_WIDTH
    category: EDGE
    description: A non-wrapping rectangle has a tiny but positive longitude width.
    preconditions:
    - 0.0 < maxX - minX <= 0.000001.
    - pointX = minX + (maxX - minX) / 2.0.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TINY_WRAPPED_GAP
    category: EDGE
    description: A nearly world-wide wrapped rectangle excludes a point in a tiny
      positive gap.
    preconditions:
    - minX > maxX and 0.0 < minX - maxX <= 0.000001.
    - pointX = maxX + (minX - maxX) / 2.0.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT after pX is shifted beyond the unwrapped maximum.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_POSITIVE_DATELINE_INTERIOR
    category: BOUNDARY
    description: A point and contained interval approach +180 without using the alias
      endpoint.
    preconditions:
    - minX < pointX < maxX < 180.0.
    - 0.0 < 180.0 - maxX <= 0.000001.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the direct-longitude short circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_NEGATIVE_DATELINE_INTERIOR
    category: BOUNDARY
    description: A point and contained interval approach -180 without using the alias
      endpoint.
    preconditions:
    - -180.0 < minX < pointX < maxX.
    - 0.0 < minX + 180.0 <= 0.000001.
    - minY <= pointY <= maxY.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the direct-longitude short circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LONGITUDE_CONTAINED_LATITUDE_ABOVE_AFTER_ROTATION_CROSSING
    category: EDGE
    description: The rectangle changes wrap representation under rotation, but latitude
      independently makes the point disjoint.
    preconditions:
    - T(minX) > T(maxX).
    - The source rectangle contains pointX in longitude.
    - pointY > maxY.
    expectedSourceBehavior:
    - Source relate(point) returns DISJOINT before evaluating longitude.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LONGITUDE_CONTAINED_LATITUDE_BELOW_AFTER_ROTATION_CROSSING
    category: EDGE
    description: The rectangle changes wrap representation under rotation, but a southern
      latitude miss takes precedence.
    preconditions:
    - T(minX) > T(maxX).
    - The source rectangle contains pointX in longitude.
    - pointY < minY.
    expectedSourceBehavior:
    - Source relate(point) returns DISJOINT before evaluating longitude.
    targetCases: 1
    emptyOutputAllowed: false
