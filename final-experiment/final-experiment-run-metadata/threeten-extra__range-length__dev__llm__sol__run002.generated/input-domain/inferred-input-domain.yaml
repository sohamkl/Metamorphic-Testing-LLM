InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be moved 23 days
    later; includes finite empty, ordinary, calendar-boundary, extreme-length, saturation,
    and unbounded-start ranges.
  globalConstraints:
  - The source receiver is non-null and is a successfully constructed LocalDateRange.
  - Let S = range.getStart() and E = range.getEnd(); S and E are non-null LocalDate
    values and S is not after E.
  - 'The source satisfies LocalDateRange invariants: S is neither LocalDate.MAX nor
    LocalDate.MAX.minusDays(1), E is neither LocalDate.MIN nor LocalDate.MIN.plusDays(1),
    and an empty range is not located at LocalDate.MIN or LocalDate.MAX.'
  - E is on or before LocalDate.MAX.minusDays(23), so E.plusDays(23) used by generateFollowUp
    is defined.
  - Ranges with an unbounded end, and bounded ranges ending in the final 22 dates
    before LocalDate.MAX, are excluded because generateFollowUp would call plusDays(23)
    beyond LocalDate.MAX before assertRelation could apply its sentinel skip.
  - Unbounded-start ranges are retained when their end satisfies the transformation
    bound; lengthInDays() returns Integer.MAX_VALUE and assertRelation deliberately
    skips them.
  - Only valid source inputs are included because the metamorphic relation does not
    request invalid-input testing.
  diversity:
    boundedness:
    - bounded
    - unbounded-start
    mathematicalLengthInDays:
    - '0'
    - '1'
    - '22'
    - '23'
    - '24'
    - medium
    - Integer.MAX_VALUE-minus-24
    - Integer.MAX_VALUE-minus-23
    - Integer.MAX_VALUE-minus-22
    - Integer.MAX_VALUE-minus-1
    - Integer.MAX_VALUE
    - greater-than-Integer.MAX_VALUE
    calendarPosition:
    - ordinary-date
    - month-boundary
    - February-common-year
    - February-leap-year
    - year-boundary
    - epoch-boundary
    - negative-year
    - year-zero
    endpointExtremity:
    - near-LocalDate.MIN
    - ordinary
    - exactly-LocalDate.MAX-minus-23
    relationDisposition:
    - checked-exact-increase
    - skipped-source-sentinel
    - skipped-follow-up-sentinel
  scenarios:
  - id: EMPTY_ORDINARY
    category: EDGE
    description: An ordinary bounded empty range.
    preconditions:
    - S equals E and S equals 2000-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a non-empty 23-day bounded range, so the relation checks an
      increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_NEAR_MINIMUM
    category: BOUNDARY
    description: The earliest valid empty range under the constructor restrictions.
    preconditions:
    - S equals E and both equal LocalDate.MIN.plusDays(2).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up end is LocalDate.MIN.plusDays(25), yielding a checked 23-day increase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_ORDINARY
    category: NORMAL
    description: Ordinary bounded one-day ranges away from calendar and LocalDate
      extremes.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals 1.
    - Use two cases whose 23-day extension remains within the same year and does not
      end at LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The bounded follow-up returns 24, so the relation is non-vacuously checked.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LENGTH_EXTRA_MINUS_ONE
    category: BOUNDARY
    description: Bounded ranges one day shorter than the transformation amount.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals 22.
    - Use two ordinary calendar placements with E.plusDays(23) below LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    - The follow-up returns 45.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LENGTH_EQUALS_EXTRA
    category: BOUNDARY
    description: Bounded ranges whose source length equals the 23-day extension.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals 23.
    - Use two ordinary calendar placements with E.plusDays(23) below LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up returns 46.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LENGTH_EXTRA_PLUS_ONE
    category: BOUNDARY
    description: Bounded ranges one day longer than the transformation amount.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals 24.
    - Use two ordinary calendar placements with E.plusDays(23) below LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    - The follow-up returns 47.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MEDIUM_BOUNDED_RANGES
    category: NORMAL
    description: Non-empty bounded ranges substantially longer than 23 days but far
      below int saturation.
    preconditions:
    - The mathematical length is respectively 100 and 1000 days.
    - E.plusDays(23) is below LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns the respective mathematical length.
    - Each bounded follow-up returns exactly 23 more.
    targetCases: 2
    emptyOutputAllowed: false
  - id: THIRTY_ONE_DAY_MONTH_CROSSING
    category: EDGE
    description: The added 23 days cross the end of a 31-day month.
    preconditions:
    - Use two bounded sources with E in January or July and E.plusDays(23) in the
      following month.
    - Each mathematical source length is positive and below Integer.MAX_VALUE minus
      23.
    expectedSourceBehavior:
    - lengthInDays() returns the epoch-day difference E minus S.
    - Month-length variation does not alter the exact 23-day increase.
    targetCases: 2
    emptyOutputAllowed: false
  - id: THIRTY_DAY_MONTH_CROSSING
    category: EDGE
    description: The added 23 days cross the end of a 30-day month.
    preconditions:
    - Use two bounded sources with E in April or September and E.plusDays(23) in the
      following month.
    - Each mathematical source length is positive and below Integer.MAX_VALUE minus
      23.
    expectedSourceBehavior:
    - lengthInDays() returns the epoch-day difference E minus S.
    - The follow-up length is exactly 23 greater despite the 30-day month.
    targetCases: 2
    emptyOutputAllowed: false
  - id: COMMON_FEBRUARY_CROSSING
    category: EDGE
    description: The extension crosses February in a non-leap year.
    preconditions:
    - Use two bounded sources in years not divisible by 4, with E.plusDays(23) crossing
      February 28.
    - Each mathematical source length is below Integer.MAX_VALUE minus 23.
    expectedSourceBehavior:
    - lengthInDays() returns the whole-day epoch difference.
    - The follow-up adds exactly 23 days across the 28-day February.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LEAP_FEBRUARY_CROSSING
    category: EDGE
    description: The extension crosses February 29 in a leap year.
    preconditions:
    - Use two bounded sources in leap years, with E.plusDays(23) crossing February
      29.
    - Each mathematical source length is below Integer.MAX_VALUE minus 23.
    expectedSourceBehavior:
    - lengthInDays() returns the whole-day epoch difference.
    - The follow-up adds exactly 23 days across leap day.
    targetCases: 2
    emptyOutputAllowed: false
  - id: END_ON_COMMON_FEBRUARY_LAST_DAY
    category: BOUNDARY
    description: A bounded source whose exclusive end is February 28 in a common year.
    preconditions:
    - E has month-day February 28 in a non-leap year.
    - S is before E and the mathematical length is below Integer.MAX_VALUE minus 23.
    expectedSourceBehavior:
    - lengthInDays() returns E.toEpochDay() minus S.toEpochDay().
    - E.plusDays(23) is in March and the resulting length increases by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: END_ON_LEAP_DAY
    category: BOUNDARY
    description: A bounded source whose exclusive end is February 29.
    preconditions:
    - E has month-day February 29 in a leap year.
    - S is before E and the mathematical length is below Integer.MAX_VALUE minus 23.
    expectedSourceBehavior:
    - lengthInDays() returns E.toEpochDay() minus S.toEpochDay().
    - E.plusDays(23) is in March and the resulting length increases by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_EXTENSION
    category: EDGE
    description: The extension moves the exclusive end into the next year.
    preconditions:
    - Use two bounded cases with E in the final 22 days of an ordinary year.
    - The years and endpoints are far from LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns the source epoch-day difference.
    - Changing the calendar year does not alter the exact 23-day increase.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FULL_COMMON_AND_LEAP_YEARS
    category: EDGE
    description: Ranges spanning exactly one complete common year and one complete
      leap year.
    preconditions:
    - One case has mathematical length 365 and one has mathematical length 366.
    - Both have E.plusDays(23) below LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 365 for the common-year case and 366 for the leap-year
      case.
    - The respective follow-up outputs are 388 and 389.
    targetCases: 2
    emptyOutputAllowed: false
  - id: UNIX_EPOCH_CROSSING
    category: EDGE
    description: Bounded ranges crossing 1970-01-01, including dates with negative
      and non-negative epoch days.
    preconditions:
    - S is before 1970-01-01 and E is after 1970-01-01.
    - Use two distinct positive lengths below Integer.MAX_VALUE minus 23.
    expectedSourceBehavior:
    - lengthInDays() returns E.toEpochDay() minus S.toEpochDay().
    - Epoch-day sign changes do not affect the 23-day increase.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_PROLEPTIC_YEAR
    category: EDGE
    description: A bounded range wholly within a negative proleptic ISO year.
    preconditions:
    - S and E have negative year values, S is before E, and the mathematical length
      is below Integer.MAX_VALUE minus 23.
    expectedSourceBehavior:
    - lengthInDays() returns the positive epoch-day difference.
    - The bounded follow-up output is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PROLEPTIC_YEAR_ZERO
    category: EDGE
    description: A bounded range that includes dates in ISO proleptic year zero.
    preconditions:
    - S is on or before 0000-01-01 and E is after 0000-01-01.
    - The mathematical length is below Integer.MAX_VALUE minus 23.
    expectedSourceBehavior:
    - lengthInDays() returns the positive whole-day difference.
    - The follow-up output increases by exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_BOUNDED_START
    category: BOUNDARY
    description: A bounded range beginning one day after LocalDate.MIN.
    preconditions:
    - S equals LocalDate.MIN.plusDays(1).
    - E equals LocalDate.MIN.plusDays(2).
    expectedSourceBehavior:
    - The range is bounded because S is not LocalDate.MIN.
    - lengthInDays() returns 1 and the follow-up returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_MINIMUM_END
    category: BOUNDARY
    description: An unbounded-start range with the earliest constructor-permitted
      exclusive end.
    preconditions:
    - S equals LocalDate.MIN.
    - E equals LocalDate.MIN.plusDays(2).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded sentinel.
    - assertRelation skips the case based on the source output, although follow-up
      generation succeeds.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: Unbounded-start ranges ending at ordinary historical or future dates.
    preconditions:
    - S equals LocalDate.MIN.
    - Use two cases with ordinary E values strictly between LocalDate.MIN.plusDays(2)
      and LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE for both cases.
    - The assertion follows its documented unbounded-range skip.
    targetCases: 2
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_LATEST_SAFE_END
    category: BOUNDARY
    description: An unbounded-start range at the latest end accepted by the follow-up
      transformation.
    preconditions:
    - S equals LocalDate.MIN.
    - E equals LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - Follow-up generation reaches E.plusDays(23) equal to LocalDate.MAX, and the
      assertion skips on sentinel output.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_AT_LATEST_SAFE_DATE
    category: BOUNDARY
    description: A bounded empty range at the latest date whose end can be extended
      by 23 days.
    preconditions:
    - S equals E and both equal LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up end is LocalDate.MAX, so the follow-up is unbounded-end and returns
      Integer.MAX_VALUE; the assertion skips it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_TO_LATEST_SAFE_END
    category: BOUNDARY
    description: A one-day bounded source whose extension reaches the unbounded-end
      sentinel.
    preconditions:
    - S equals LocalDate.MAX.minusDays(24).
    - E equals LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up ends at LocalDate.MAX, returns Integer.MAX_VALUE, and is skipped
      by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MEDIUM_RANGE_TO_LATEST_SAFE_END
    category: BOUNDARY
    description: A nontrivial bounded source whose exclusive end is the latest transformation-safe
      date.
    preconditions:
    - E equals LocalDate.MAX.minusDays(23).
    - S equals LocalDate.MAX.minusDays(100).
    expectedSourceBehavior:
    - lengthInDays() returns 77.
    - The follow-up has an unbounded end and sentinel output, so the assertion skips
      it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_MAX_MINUS_24
    category: BOUNDARY
    description: The largest bounded mathematical length for which both outputs remain
      below the int sentinel.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals Integer.MAX_VALUE minus 24.
    - E.plusDays(23) is strictly before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 24.
    - The follow-up returns Integer.MAX_VALUE minus 1, allowing a non-vacuous exact-increase
      check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_MAX_MINUS_23
    category: BOUNDARY
    description: A bounded source whose 23-day extension reaches the numeric sentinel
      length.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals Integer.MAX_VALUE minus 23.
    - E.plusDays(23) is strictly before LocalDate.MAX, so neither range is endpoint-unbounded.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 23.
    - The follow-up length result is Integer.MAX_VALUE, causing the relation assertion
      to skip.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_MAX_MINUS_22
    category: BOUNDARY
    description: A bounded source just inside the region whose follow-up length exceeds
      the int sentinel threshold.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals Integer.MAX_VALUE minus 22.
    - E.plusDays(23) is strictly before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 22.
    - The follow-up returns the Integer.MAX_VALUE saturation flag and the assertion
      skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_MAX_MINUS_1
    category: BOUNDARY
    description: A bounded source one day below the maximum representable non-sentinel
      int length.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals Integer.MAX_VALUE minus 1.
    - E.plusDays(23) is strictly before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 1.
    - The extended bounded range produces Integer.MAX_VALUE and is skipped.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EQUALS_INT_MAX
    category: BOUNDARY
    description: A bounded range whose mathematical length equals Integer.MAX_VALUE.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals Integer.MAX_VALUE.
    - S is not LocalDate.MIN and E is not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The assertion skips because the source int result is indistinguishable from
      the documented sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_MAX_PLUS_ONE
    category: EDGE
    description: A bounded range whose mathematical length exceeds Integer.MAX_VALUE
      by one day.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals Integer.MAX_VALUE plus 1 as a long
      value.
    - S is not LocalDate.MIN, E is not LocalDate.MAX, and E.plusDays(23) is defined.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE for the oversized bounded length.
    - The assertion skips on the source result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_LARGE_BOUNDED_LENGTHS
    category: EDGE
    description: Bounded ranges with mathematical lengths far beyond int capacity
      but still within the LocalDate timeline.
    preconditions:
    - Use mathematical lengths of 10 times and 100 times Integer.MAX_VALUE days, computed
      as long values.
    - For both cases S is not LocalDate.MIN, E is not LocalDate.MAX, and E is on or
      before LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE for both oversized bounded ranges.
    - assertRelation skips both source outputs.
    targetCases: 2
    emptyOutputAllowed: false
  - id: WEEK_ALIGNED_RANGES
    category: NORMAL
    description: Seven-day bounded ranges aligned to complete Monday-through-Sunday
      weeks.
    preconditions:
    - E.toEpochDay() minus S.toEpochDay() equals 7.
    - Use two cases in different years, with S on Monday and E on the following Monday.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up returns 30 regardless of week or year placement.
    targetCases: 2
    emptyOutputAllowed: false
  - id: QUARTER_AND_HALF_YEAR_RANGES
    category: NORMAL
    description: Bounded ranges covering one complete calendar quarter and one complete
      calendar half-year.
    preconditions:
    - One case starts on the first day of a quarter and ends immediately after that
      quarter.
    - One case starts on the first day of a half-year and ends immediately after that
      half-year.
    - Both mathematical lengths are below Integer.MAX_VALUE minus 23 and E.plusDays(23)
      is below LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns the actual epoch-day count of the represented quarter
      or half-year.
    - Each follow-up output is exactly 23 greater.
    targetCases: 2
    emptyOutputAllowed: false
