InputDomain:
  summary: Constructible LocalDateRange receivers spanning finite, empty, unbounded,
    boundary, construction-path, and int-representability cases; relation-evaluable
    cases must permit the supplied 23-day follow-up, while overflow and sentinel paths
    are explicitly covered.
  globalConstraints:
  - Each source receiver is a non-null LocalDateRange successfully returned by one
    of the supplied construction paths.
  - 'For every constructed source range, getStart() is on or before getEnd(), and
    the constructor restrictions hold: getStart() is not LocalDate.MAX or LocalDate.MAX.minusDays(1),
    and getEnd() is not LocalDate.MIN or LocalDate.MIN.plusDays(1).'
  - The follow-up transformation is exactly LocalDateRange.of(range.getStart(), range.getEnd().plusDays(23)).
  - A relation-evaluable finite follow-up requires getEnd().plusDays(23) to be representable
    and accepted by LocalDateRange.of.
  - A source with getEnd() equal to LocalDate.MAX.minusDays(23) is allowed because
    its follow-up end is LocalDate.MAX and the follow-up output is the unbounded sentinel.
  - Sources whose end is LocalDate.MAX.minusDays(22) through LocalDate.MAX are retained
    as follow-up-overflow or unbounded-end scenarios rather than silently omitted.
  - Finite ranges with an endpoint day difference greater than Integer.MAX_VALUE are
    retained as target-boundary scenarios because they are constructible even though
    the int return type cannot represent their day count.
  - The metamorphic assertion performs arithmetic only when neither output is Integer.MAX_VALUE;
    any source or follow-up unbounded sentinel therefore produces an intentionally
    skipped relation check.
  diversity:
    constructionPath:
    - of(LocalDate, LocalDate)
    - of(LocalDate, Period)
    - ofClosed(LocalDate, LocalDate)
    - ofEmpty(LocalDate)
    - ofUnbounded()
    - ofUnboundedStart(LocalDate)
    - ofUnboundedEnd(LocalDate)
    - from(LocalDate)
    - from(Year)
    - from(YearMonth)
    - from(YearHalf)
    - from(YearQuarter)
    - from(YearWeek)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    sourceLengthClass:
    - zero
    - one
    - seven
    - exactly-23
    - '24'
    - ordinary-positive
    - Integer.MAX_VALUE-minus-23
    - Integer.MAX_VALUE
    - greater-than-Integer.MAX_VALUE
    - Integer.MAX_VALUE sentinel
    endpointSituation:
    - ordinary finite dates
    - month boundary
    - year boundary
    - leap-day boundary
    - near LocalDate.MIN
    - near LocalDate.MAX
    - end-extension remains finite
    - end-extension reaches LocalDate.MAX
    - end-extension overflows
    followUpOutcome:
    - finite length increases by 23
    - unbounded-start sentinel retained
    - unbounded-end sentinel introduced
    - follow-up end arithmetic overflows
  scenarios:
  - id: EMPTY_MID_TIMELINE
    category: EDGE
    description: An empty finite range created with ofEmpty at an ordinary date.
    preconditions:
    - The source start equals the source end.
    - The empty date is not LocalDate.MIN, LocalDate.MIN.plusDays(1), LocalDate.MAX.minusDays(1),
      or LocalDate.MAX.
    - The empty date plus 23 days is representable.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a finite 23-day range.
    - assertRelation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: ONE_DAY_HALF_OPEN
    category: BOUNDARY
    description: A one-day finite half-open range created with of(LocalDate, LocalDate).
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() equals 1.
    - getEnd().plusDays(23) is representable and is not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    - The relation increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACTLY_TWENTY_THREE_DAYS
    category: BOUNDARY
    description: A finite source whose length equals the transformation increment.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() equals 23.
    - The extended end is finite and accepted by LocalDateRange.of.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46.
    - The relation increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_FOUR_DAYS
    category: BOUNDARY
    description: A finite source just longer than the 23-day increment.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() equals 24.
    - The extended end is finite and accepted by LocalDateRange.of.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    - The follow-up length is 47.
    - The relation increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING
    category: BOUNDARY
    description: A finite range crossing a leap-day boundary.
    preconditions:
    - The source crosses a date such as 2020-02-29.
    - The source has a positive finite span.
    - The extended end is finite and accepted by LocalDateRange.of.
    expectedSourceBehavior:
    - lengthInDays() counts the endpoint epoch-day difference, including the leap
      day.
    - The follow-up length is the source length plus 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_AND_YEAR_BOUNDARIES
    category: NORMAL
    description: Finite ranges crossing month-end or year-end boundaries.
    preconditions:
    - At least one source crosses a month boundary and at least one crosses a year
      boundary.
    - Each source has a positive finite span.
    - Each extended end is finite and accepted by LocalDateRange.of.
    expectedSourceBehavior:
    - lengthInDays() equals the difference between the endpoint epoch days.
    - Each follow-up length increases by exactly 23.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE
    category: BOUNDARY
    description: A one-date inclusive range created with ofClosed.
    preconditions:
    - The inclusive start and inclusive end supplied to ofClosed are equal.
    - The supplied date is not LocalDate.MIN.
    - The resulting exclusive end can be extended by 23 days without overflow.
    expectedSourceBehavior:
    - ofClosed creates a one-day half-open range.
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DAY
    category: NORMAL
    description: A multi-day inclusive range created with ofClosed.
    preconditions:
    - The inclusive end is after the inclusive start.
    - The resulting exclusive end plus 23 days is representable and finite.
    expectedSourceBehavior:
    - The source length equals the number of inclusive dates.
    - The follow-up length is the source length plus 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO
    category: EDGE
    description: A zero-period range created with of(LocalDate, Period.ZERO).
    preconditions:
    - The start date is not a forbidden empty-range location.
    - The start date plus 23 days is representable.
    expectedSourceBehavior:
    - The period construction produces an empty range.
    - lengthInDays() returns 0.
    - The follow-up length is 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERIOD_CALENDAR_DURATION
    category: NORMAL
    description: A finite range created with a non-negative Period containing months
      or years.
    preconditions:
    - The Period is non-negative.
    - start.plus(period) is representable and on or after the start.
    - The resulting end plus 23 days is finite.
    expectedSourceBehavior:
    - lengthInDays() reports the actual endpoint day difference after Period addition.
    - The follow-up length increases by exactly 23.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A finite range parsed from date/date text.
    preconditions:
    - The text contains a valid non-decreasing LocalDate pair separated by one slash.
    - The parsed end plus 23 days is finite.
    expectedSourceBehavior:
    - parse creates the half-open range represented by the two dates.
    - lengthInDays() returns the endpoint day difference.
    - The follow-up increase is 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: A finite range parsed from date/period text.
    preconditions:
    - The text has a valid LocalDate followed by a non-negative Period.
    - Adding the Period to the date is representable.
    - The resulting end plus 23 days is finite.
    expectedSourceBehavior:
    - parse computes the end by adding the Period to the parsed start.
    - lengthInDays() uses the resulting endpoints.
    - The follow-up increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: A finite range parsed from period/date text.
    preconditions:
    - The text has a valid non-negative Period followed by a LocalDate.
    - Subtracting the Period from the date is representable and produces a start on
      or before the end.
    - The parsed end plus 23 days is finite.
    expectedSourceBehavior:
    - parse computes the start by subtracting the Period from the parsed end.
    - lengthInDays() returns the resulting endpoint day difference.
    - The follow-up increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A range created through from(LocalDate), using the temporal local-date
      query path.
    preconditions:
    - The date is one for which ofClosed(date, date) produces a finite range.
    - The resulting exclusive end plus 23 days is finite.
    expectedSourceBehavior:
    - from(LocalDate) creates a one-day range through ofClosed.
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A range created through from(Year).
    preconditions:
    - The Year produces a finite January-1-through-December-31 range.
    - The resulting exclusive end plus 23 days is finite.
    expectedSourceBehavior:
    - from creates the closed range for the entire year.
    - lengthInDays() returns that year's day count.
    - The follow-up increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A range created through from(YearMonth).
    preconditions:
    - The YearMonth produces a finite month range.
    - The resulting exclusive end plus 23 days is finite.
    expectedSourceBehavior:
    - from creates the range from the first through the last day of the month.
    - lengthInDays() returns the month length.
    - The follow-up increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A range created through from(YearHalf).
    preconditions:
    - The YearHalf produces a finite end.
    - The exclusive end plus 23 days is finite.
    expectedSourceBehavior:
    - from uses the first and last day of the half-year.
    - lengthInDays() returns the half-year endpoint difference.
    - The follow-up increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A range created through from(YearQuarter).
    preconditions:
    - The YearQuarter produces a finite end.
    - The exclusive end plus 23 days is finite.
    expectedSourceBehavior:
    - from uses the first and last day of the quarter.
    - lengthInDays() returns the quarter endpoint difference.
    - The follow-up increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A range created through from(YearWeek).
    preconditions:
    - The YearWeek produces a finite Monday-through-Sunday range.
    - The resulting exclusive end plus 23 days is finite.
    expectedSourceBehavior:
    - from creates a seven-day range.
    - lengthInDays() returns 7.
    - The follow-up length is 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_MINIMUM_UNBOUNDED_START
    category: EDGE
    description: An unbounded-start range with the smallest permitted finite exclusive
      end.
    preconditions:
    - getStart() equals LocalDate.MIN.
    - getEnd() equals LocalDate.MIN.plusDays(2).
    - getEnd().plusDays(23) is representable.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE for the unbounded start.
    - The follow-up remains unbounded at the start and returns Integer.MAX_VALUE.
    - assertRelation skips arithmetic because a sentinel output is present.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FINITE_END
    category: EDGE
    description: An unbounded-start range with an ordinary finite end.
    preconditions:
    - The source is created with ofUnboundedStart(end).
    - end is neither LocalDate.MIN nor LocalDate.MIN.plusDays(1).
    - end.plusDays(23) is representable.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The follow-up also has an unbounded start and returns Integer.MAX_VALUE.
    - The relation assertion intentionally skips sentinel arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULLY_UNBOUNDED
    category: EDGE
    description: The fully unbounded range created with ofUnbounded.
    preconditions:
    - The source is LocalDateRange.ofUnbounded().
    - getStart() equals LocalDate.MIN and getEnd() equals LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - generateFollowUp attempts getEnd().plusDays(23), which is outside the LocalDate
      domain.
    - The follow-up cannot be formed because the supplied transformation is not representable
      for LocalDate.MAX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_END
    category: EDGE
    description: A source with an unbounded end created with ofUnboundedEnd.
    preconditions:
    - The source is created with ofUnboundedEnd(start).
    - start is not LocalDate.MAX or LocalDate.MAX.minusDays(1).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - generateFollowUp attempts to add 23 days to LocalDate.MAX.
    - The supplied follow-up transformation cannot produce a LocalDate end beyond
      LocalDate.MAX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_BECOMES_UNBOUNDED_END
    category: EDGE
    description: A finite source whose end is exactly 23 days before LocalDate.MAX.
    preconditions:
    - getEnd() equals LocalDate.MAX.minusDays(23).
    - getStart() is strictly before getEnd().
    - The source day difference is no greater than Integer.MAX_VALUE.
    expectedSourceBehavior:
    - The source lengthInDays() is finite.
    - The follow-up end equals LocalDate.MAX.
    - The follow-up lengthInDays() returns Integer.MAX_VALUE.
    - assertRelation skips arithmetic because the follow-up output is the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_END_OVERFLOW
    category: EDGE
    description: A constructible source whose end is within 22 days of LocalDate.MAX,
      so the supplied follow-up end calculation overflows.
    preconditions:
    - getEnd() is one of LocalDate.MAX.minusDays(22) through LocalDate.MAX.minusDays(1).
    - The source satisfies all LocalDateRange construction restrictions.
    expectedSourceBehavior:
    - The source receiver is constructible and lengthInDays() can be invoked on it.
    - generateFollowUp evaluates getEnd().plusDays(23), which is outside the LocalDate
      domain.
    - No relation assertion is reached because the supplied follow-up cannot be constructed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_FINITE_INT_FOLLOW_UP
    category: BOUNDARY
    description: A finite range whose source length is the largest value that permits
      a 23-day follow-up length to equal Integer.MAX_VALUE.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() equals Integer.MAX_VALUE minus
      23.
    - getEnd().plusDays(23) is representable and is not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 23.
    - The follow-up length returns Integer.MAX_VALUE.
    - The assertion's subtraction yields exactly 23 without int overflow.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_INT_MAXIMUM_LENGTH
    category: BOUNDARY
    description: A finite range whose day difference equals Integer.MAX_VALUE.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() equals Integer.MAX_VALUE.
    - The source end plus 23 days is representable and finite.
    expectedSourceBehavior:
    - The source exercises the largest finite day difference representable by the
      int return type.
    - The follow-up day difference exceeds Integer.MAX_VALUE.
    - The case is retained to expose the target's int-boundary behavior rather than
      excluding a constructible range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_EXCEEDS_INT
    category: EDGE
    description: A constructible finite range whose endpoint day difference is greater
      than Integer.MAX_VALUE.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() is greater than Integer.MAX_VALUE.
    - The endpoints satisfy LocalDateRange construction restrictions.
    - getEnd().plusDays(23) is representable and finite.
    expectedSourceBehavior:
    - The source exercises a finite range whose whole-day length cannot be represented
      by the int return type.
    - The target's observable handling of this representability boundary is recorded
      rather than excluding the source range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_LONG_FINITE_RANGE
    category: NORMAL
    description: A long but int-representable finite range well beyond ordinary month,
      quarter, and year lengths.
    preconditions:
    - 23 is less than getEnd().toEpochDay() - getStart().toEpochDay().
    - The difference is less than Integer.MAX_VALUE minus 23.
    - getEnd().plusDays(23) is finite and accepted by LocalDateRange.of.
    expectedSourceBehavior:
    - lengthInDays() returns the full endpoint day difference as an int.
    - The follow-up length is exactly 23 greater.
    targetCases: 2
    emptyOutputAllowed: false
