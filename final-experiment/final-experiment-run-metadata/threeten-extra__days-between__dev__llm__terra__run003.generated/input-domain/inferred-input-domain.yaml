InputDomain:
  summary: Non-null Temporal endpoint pairs for which ChronoUnit.DAYS.between succeeds,
    its long result is representable as an int, and both endpoints can each be advanced
    by 37 ChronoUnit.DAYS for the metamorphic follow-up. The domain includes ISO date/time
    temporals, instant-based temporals, zone/offset-aware temporals, and non-ISO chronology
    temporals.
  globalConstraints:
  - startDateInclusive != null and endDateExclusive != null, because generateFollowUp
    rejects either null endpoint.
  - Each source endpoint must support plus(37, ChronoUnit.DAYS), and each shifted
    endpoint must be constructible without DateTimeException or ArithmeticException.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) must complete successfully
    and return a value in [-2147483648, 2147483647], because Days.between applies
    Math.toIntExact.
  - Both the source invocation and the shifted follow-up invocation must return Days
    normally; failure-producing temporals are excluded because the supplied relation
    compares two Days outputs and specifies no exception relation.
  - Temporals that do not support day-based between or day-based plus, including null
    endpoints, are outside this source domain rather than INVALID cases because the
    supplied MR does not request invalid-input testing.
  diversity:
    endpointTemporalFamily:
    - distinct
    - 'measurable: runtime endpoint classes and chronology/zone configuration'
    - 'values: LocalDate, LocalDateTime, Instant, OffsetDateTime, ZonedDateTime, JapaneseDate,
      MinguoDate, ThaiBuddhistDate, HijrahDate, and mixed compatible Temporal pairs'
    sourceDayCountClass:
    - distinct
    - 'measurable: source Days.getAmount()'
    - 'values: 0, 1, positive values greater than 1, negative values, Integer.MAX_VALUE,
      Integer.MIN_VALUE'
    calendarBoundary:
    - distinct
    - 'measurable: source endpoints cross a calendar boundary'
    - 'values: ordinary day, month end, leap day, non-leap century, year boundary,
      daylight-saving gap, daylight-saving overlap'
    timeOfDayTreatment:
    - distinct
    - 'measurable: elapsed or local-date distance relative to a complete day'
    - 'values: equal times, less than one day, exactly one day, non-integral multi-day
      interval, reverse interval'
    endpointCompatibility:
    - distinct
    - 'measurable: endpoint runtime types or zone/offset differ'
    - 'values: same type, LocalDate-to-LocalDateTime, LocalDate-to-JapaneseDate, differing
      offsets, differing zones'
  scenarios:
  - id: LOCAL_DATE_SAME_DAY_ZERO
    category: NORMAL
    description: Identical ISO LocalDate endpoints exercise the zero-day result path.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - Days.between returns a non-null Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ADJACENT_DAY_ONE
    category: BOUNDARY
    description: Consecutive ISO dates exercise the one-day result path.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is LocalDate.of(2024, 6, 16).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FORWARD_MULTI_DAY
    category: NORMAL
    description: Ordinary forward ISO date interval with a positive count greater
      than one.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is LocalDate.of(2024, 6, 25).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_REVERSE_MULTI_DAY
    category: NORMAL
    description: Reversing an ordinary ISO date interval produces a negative day count.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 25).
    - endDateExclusive is LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_END_CROSSING
    category: BOUNDARY
    description: ISO LocalDate interval crosses from the end of a 31-day month into
      the next month.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 31).
    - endDateExclusive is LocalDate.of(2024, 2, 2).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: ISO LocalDate interval crosses leap day in leap year 2024.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28).
    - endDateExclusive is LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_CENTURY_CROSSING
    category: BOUNDARY
    description: ISO LocalDate interval crosses February in century year 1900, which
      is not a leap year.
    preconditions:
    - startDateInclusive is LocalDate.of(1900, 2, 28).
    - endDateExclusive is LocalDate.of(1900, 3, 1).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: ISO LocalDate interval crosses an ISO calendar year boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 12, 31).
    - endDateExclusive is LocalDate.of(2024, 1, 2).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_ZERO
    category: EDGE
    description: LocalDateTime endpoints are less than one complete day apart.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 11, 59).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints are exactly one complete day apart.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 12, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NONINTEGRAL_MULTI_DAY
    category: EDGE
    description: LocalDateTime endpoints span two calendar dates but only one complete
      day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 10, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 17, 9, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_REVERSE_EXACT_DAYS
    category: NORMAL
    description: Reverse LocalDateTime interval has an exact negative whole-day count.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 17, 12, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 15, 12, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: EDGE
    description: A LocalDate start delegates day-between calculation to a compatible
      LocalDateTime end.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is LocalDateTime.of(2024, 6, 17, 18, 30).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_ZERO
    category: EDGE
    description: Instant endpoints are 23 hours apart, testing elapsed-time day truncation.
    preconditions:
    - startDateInclusive is Instant.parse('2024-06-15T00:00:00Z').
    - endDateExclusive is Instant.parse('2024-06-15T23:00:00Z').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: BOUNDARY
    description: Instant endpoints are exactly 24 hours apart.
    preconditions:
    - startDateInclusive is Instant.parse('2024-06-15T00:00:00Z').
    - endDateExclusive is Instant.parse('2024-06-16T00:00:00Z').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NONINTEGRAL_MULTI_DAY
    category: EDGE
    description: Instant endpoints span 47 elapsed hours, yielding one complete elapsed
      day.
    preconditions:
    - startDateInclusive is Instant.parse('2024-06-15T00:00:00Z').
    - endDateExclusive is Instant.parse('2024-06-16T23:00:00Z').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS
    category: EDGE
    description: OffsetDateTime endpoints have different offsets but represent instants
      exactly one day apart.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse('2024-06-15T00:00:00Z').
    - endDateExclusive is OffsetDateTime.parse('2024-06-16T01:00:00+01:00').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_INSTANT
    category: EDGE
    description: OffsetDateTime endpoints use different offsets while representing
      the same instant.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse('2024-06-15T00:00:00Z').
    - endDateExclusive is OffsetDateTime.parse('2024-06-15T02:00:00+02:00').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_TWO_LOCAL_DAYS
    category: EDGE
    description: America/New_York ZonedDateTime interval crosses the spring daylight-saving
      gap.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse('2024-03-09T12:00:00-05:00[America/New_York]').
    - endDateExclusive is ZonedDateTime.parse('2024-03-11T12:00:00-04:00[America/New_York]').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_ONE_LOCAL_DAY
    category: EDGE
    description: America/New_York ZonedDateTime interval crosses the spring daylight-saving
      gap over adjacent local dates.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse('2024-03-09T12:00:00-05:00[America/New_York]').
    - endDateExclusive is ZonedDateTime.parse('2024-03-10T12:00:00-04:00[America/New_York]').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FALL_DST_TWO_LOCAL_DAYS
    category: EDGE
    description: America/New_York ZonedDateTime interval crosses the autumn daylight-saving
      overlap.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse('2024-11-02T12:00:00-04:00[America/New_York]').
    - endDateExclusive is ZonedDateTime.parse('2024-11-04T12:00:00-05:00[America/New_York]').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DIFFERENT_ZONES_SAME_INSTANT
    category: EDGE
    description: ZonedDateTime endpoints use different zones while representing the
      same instant.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse('2024-06-15T00:00:00-04:00[America/New_York]').
    - endDateExclusive is ZonedDateTime.parse('2024-06-14T21:00:00-07:00[America/Los_Angeles]').
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_FORWARD
    category: NORMAL
    description: JapaneseDate endpoints verify day calculation for a non-ISO chronology.
    preconditions:
    - startDateInclusive is JapaneseDate.of(JapaneseEra.REIWA, 6, 6, 15).
    - endDateExclusive is startDateInclusive.plus(10, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_FORWARD
    category: NORMAL
    description: MinguoDate endpoints verify day calculation for another non-ISO chronology.
    preconditions:
    - startDateInclusive is MinguoDate.of(113, 6, 15).
    - endDateExclusive is startDateInclusive.plus(10, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_FORWARD
    category: NORMAL
    description: ThaiBuddhistDate endpoints verify day calculation for another chronology
      implementation.
    preconditions:
    - startDateInclusive is ThaiBuddhistDate.of(2567, 6, 15).
    - endDateExclusive is startDateInclusive.plus(10, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_FORWARD
    category: NORMAL
    description: HijrahDate endpoints verify day calculation using a variable-length
      lunar calendar chronology.
    preconditions:
    - startDateInclusive is HijrahDate.of(1445, 9, 1).
    - endDateExclusive is startDateInclusive.plus(10, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TO_JAPANESE_DATE
    category: EDGE
    description: ISO LocalDate start and JapaneseDate end represent ISO dates two
      days apart.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is JapaneseDate.of(JapaneseEra.REIWA, 6, 6, 17).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAX_DAY_COUNT
    category: BOUNDARY
    description: Instant interval produces the largest day count accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.plus(2147483647L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MIN_DAY_COUNT
    category: BOUNDARY
    description: Instant interval produces the smallest day count accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.minus(2147483648L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
