InputDomain:
  summary: Valid detector invocations spanning index clamping, candidate-count boundaries,
    finite and non-finite slope paths, reversal directions, persistence, extreme selection,
    ATR filtering, pivot replacement, swing construction, and metadata-preserving
    price translation.
  globalConstraints:
  - The receiver is constructed by SlopeChangeSwingDetector(int) with an accepted
    window or by SlopeChangeSwingDetector(SlopeChangeConfig) with a non-null configuration
    accepted by that API.
  - The BarSeries and ElliottDegree are non-null; degree is any declared ElliottDegree
    constant, and no particular constant name is assumed.
  - Each source BarSeries is a valid instance accepted by the supplied API, including
    an empty series where specified; every follow-up series is also valid after adding
    exactly 100.0 to each OHLC value.
  - For every source bar, the follow-up preserves duration, begin timestamp, end timestamp,
    volume, trade count, order, and Num implementation, and sets monetary amount to
    source amount plus 100.0 multiplied by source volume.
  - Bar count, logical bar indices, series begin index, series end index, and bar
    order are identical between source and follow-up.
  - The source detector configuration, evaluation index, and ElliottDegree object
    are reused unchanged in the follow-up invocation.
  - Let w = config.window(), q = config.confirmationBars(), a = config.atrPeriod(),
    m = config.minAtrReversal(), and s = config.minSlopeChange(); all scenario calculations
    use these actual accepted configuration values.
  - Derived candidate bounds and accessed bar indices are representable as int values
    and remain within the indices available under the source algorithm whenever the
    candidate loop or an indicator is evaluated.
  - Finite source OHLC values, their values plus 100.0, source amounts, translated
    amounts, volumes, ATR computations, slope intermediates, and expected pivot prices
    are representable by the series Num implementation without overflow.
  - Except in scenarios explicitly exercising Num.isFinite sentinel paths, all close,
    high, low, slope, ATR, and comparison operands used by detect are finite.
  - A scenario using a non-finite value is included only when that Num implementation
    and BarSeries construction API accept that value; the corresponding translated
    value must remain a supported non-finite Num.
  - For floating numeric implementations, branch-determining comparisons are separated
    from their thresholds by a numeric safety margin larger than translation-induced
    rounding error; exact-threshold scenarios require a Num representation for which
    the stated equality is preserved after translation.
  - Strict high/low ordering and stated ties in extreme-selection scenarios remain
    the same after adding 100.0 under the selected Num implementation.
  - Result Num comparisons use a small implementation-appropriate tolerance, while
    pivot indices, pivot types, swing endpoints, degree, list sizes, and list order
    are compared exactly.
  - No source class accepted by the API is excluded based solely on absolute price
    level, sign of price, volume, trade count, amount, timestamp spacing, or ElliottDegree,
    provided the translated series remains valid and the representability constraints
    hold.
  diversity:
    seriesCardinality:
    - empty
    - nonempty-too-short
    - exactly-one-candidate
    - multiple-candidates
    evaluationIndex:
    - below-begin-index
    - at-candidate-boundary
    - inside-series
    - at-end-index
    - above-end-index
    seriesIndexOrigin:
    - zero-begin-index
    - positive-begin-index
    slopeState:
    - non-finite-before
    - non-finite-after
    - below-minimum-change
    - exactly-minimum-change
    - same-sign
    - zero-sign
    - positive-to-negative
    - negative-to-positive
    persistenceState:
    - passes-all-bars
    - fails-first-bar
    - fails-later-bar
    extremeLocation:
    - first-transition-bar
    - interior-transition-bar
    - last-transition-bar
    - tied-earliest-bar
    - non-finite-extreme
    atrFilterState:
    - first-pivot-bypass
    - zero-multiplier-bypass
    - non-finite-atr
    - below-threshold
    - exactly-threshold
    - above-threshold
    pivotUpdateState:
    - first-add
    - opposite-type-append
    - higher-high-replace
    - non-higher-high-keep
    - lower-low-replace
    - non-lower-low-keep
    resultShape:
    - no-pivots
    - one-pivot-no-swings
    - multiple-pivots-and-swings
    barMetadata:
    - zero-volume
    - positive-volume
    - fractional-volume-when-supported
    - nonzero-amount
    numericRepresentation:
    - each-available-Num-implementation-that-supports-the-case
  scenarios:
  - id: EMPTY_SERIES
    category: EDGE
    description: The source BarSeries is empty, exercising the immediate empty-result
      return before index clamping or indicator construction.
    preconditions:
    - series.isEmpty() is true.
    - The evaluation index is any int value.
    expectedSourceBehavior:
    - The result contains zero pivots and zero swings.
    targetCases: 1
    emptyOutputAllowed: true
  - id: INDEX_BELOW_BEGIN_CLAMP
    category: BOUNDARY
    description: A nonempty series is evaluated below its begin index.
    preconditions:
    - index < series.getBeginIndex().
    - With endIndex equal to series.getBeginIndex(), firstCandidate is greater than
      lastCandidate.
    expectedSourceBehavior:
    - The clamped evaluation range contains no candidate and the result has zero pivots
      and zero swings.
    targetCases: 1
    emptyOutputAllowed: true
  - id: INDEX_ABOVE_END_CLAMP
    category: BOUNDARY
    description: The evaluation index exceeds the series end index, exercising upper
      clamping.
    preconditions:
    - The series is nonempty.
    - index > series.getEndIndex().
    expectedSourceBehavior:
    - The result is the result obtained from candidates ending no later than series.getEndIndex();
      no bar beyond the series is read.
    targetCases: 1
    emptyOutputAllowed: true
  - id: CANDIDATE_RANGE_JUST_EMPTY
    category: BOUNDARY
    description: The clamped prefix is exactly one bar short of permitting a candidate.
    preconditions:
    - firstCandidate = series.getBeginIndex() + w - 1.
    - lastCandidate = endIndex - w - q + 1 equals firstCandidate - 1.
    expectedSourceBehavior:
    - The candidate loop executes zero times and the result contains no pivots or
      swings.
    targetCases: 2
    emptyOutputAllowed: true
  - id: EXACTLY_ONE_CANDIDATE
    category: BOUNDARY
    description: The clamped prefix permits exactly one candidate iteration.
    preconditions:
    - firstCandidate equals lastCandidate.
    - All close and required high, low, and ATR values for that iteration are available.
    expectedSourceBehavior:
    - 'The result reflects only that one candidate: it contains either no pivot or
      one pivot, and never contains a swing.'
    targetCases: 2
    emptyOutputAllowed: true
  - id: POSITIVE_BEGIN_INDEX
    category: EDGE
    description: A retained or otherwise indexed series has a positive begin index,
      exercising candidate arithmetic relative to series.getBeginIndex().
    preconditions:
    - series.getBeginIndex() > 0.
    - At least one candidate lies between firstCandidate and lastCandidate.
    expectedSourceBehavior:
    - All returned pivot and swing indices are logical series indices at or above
      series.getBeginIndex(), not zero-based offsets.
    targetCases: 1
    emptyOutputAllowed: true
  - id: NONFINITE_BEFORE_SLOPE
    category: EDGE
    description: The sole candidate has a non-finite close in its before regression
      window.
    preconditions:
    - Exactly one candidate is evaluated.
    - At least one close from candidate - w + 1 through candidate is not finite.
    expectedSourceBehavior:
    - The candidate is skipped and the result contains zero pivots and zero swings.
    targetCases: 1
    emptyOutputAllowed: true
  - id: NONFINITE_AFTER_SLOPE
    category: EDGE
    description: The sole candidate has a finite before slope but a non-finite close
      in its after regression window.
    preconditions:
    - Exactly one candidate is evaluated.
    - All before-window closes are finite.
    - At least one close from candidate + 1 through candidate + w is not finite.
    expectedSourceBehavior:
    - The candidate is skipped and the result contains zero pivots and zero swings.
    targetCases: 1
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_BELOW_MINIMUM
    category: NORMAL
    description: Finite adjacent regression slopes differ by less than the configured
      minimum slope change.
    preconditions:
    - The evaluated candidate has finite before and after slopes.
    - abs(before - after) < s with the required numeric safety margin.
    - No other candidate can produce a pivot.
    expectedSourceBehavior:
    - The candidate is filtered before direction classification and the result contains
      no pivots.
    targetCases: 2
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_EXACT_THRESHOLD
    category: BOUNDARY
    description: The finite slope difference is exactly the configured minimum, exercising
      the strict isLessThan rejection boundary.
    preconditions:
    - abs(before - after) equals s in both source and translated slope computations.
    - The slopes have opposite nonzero signs and persistence succeeds.
    - The candidate extreme is finite.
    expectedSourceBehavior:
    - The candidate is not rejected by the minimum-slope-change comparison and produces
      the first pivot.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FINITE_SLOPES_WITHOUT_REVERSAL
    category: NORMAL
    description: The slope-change magnitude passes, but the before and after slopes
      have the same sign.
    preconditions:
    - abs(before - after) >= s.
    - Both slopes are positive, or both slopes are negative.
    - No other candidate produces a pivot.
    expectedSourceBehavior:
    - Direction classification rejects the candidate and the result contains no pivots.
    targetCases: 2
    emptyOutputAllowed: true
  - id: ZERO_SLOPE_DIRECTION_SENTINEL
    category: EDGE
    description: At least one finite adjacent slope is zero, so neither strict reversal
      condition matches.
    preconditions:
    - The slope-change magnitude is not rejected before direction classification.
    - before is zero or after is zero.
    - No other candidate produces a pivot.
    expectedSourceBehavior:
    - The candidate is skipped because zero is neither positive nor negative for the
      required reversal.
    targetCases: 2
    emptyOutputAllowed: true
  - id: CONFIRMED_HIGH_FIRST_PIVOT
    category: NORMAL
    description: A positive-to-negative slope reversal persists and yields a finite
      HIGH as the first pivot.
    preconditions:
    - before is positive, after is negative, and abs(before - after) >= s.
    - Every required persistence slope is finite and negative.
    - All highs in candidate through candidate + w - 1 are finite.
    - No earlier candidate is accepted.
    expectedSourceBehavior:
    - The first returned pivot has type HIGH, its index is the maximum-high location
      in the transition interval, and there are no swings if it is the only pivot.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CONFIRMED_LOW_FIRST_PIVOT
    category: NORMAL
    description: A negative-to-positive slope reversal persists and yields a finite
      LOW as the first pivot.
    preconditions:
    - before is negative, after is positive, and abs(before - after) >= s.
    - Every required persistence slope is finite and positive.
    - All lows in candidate through candidate + w - 1 are finite.
    - No earlier candidate is accepted.
    expectedSourceBehavior:
    - The first returned pivot has type LOW, its index is the minimum-low location
      in the transition interval, and there are no swings if it is the only pivot.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PERSISTENCE_FAILS_FIRST_BAR
    category: NORMAL
    description: A classified reversal immediately fails its first confirmation slope.
    preconditions:
    - The candidate passes finite slope-change and direction classification.
    - The persistence slope ending at candidate + w is non-finite or has the wrong
      sign for the classified type.
    - No other candidate produces a pivot.
    expectedSourceBehavior:
    - The candidate is rejected by persists and no pivot is returned.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERSISTENCE_FAILS_LATER_BAR
    category: NORMAL
    description: Persistence succeeds initially but fails at a later confirmation
      offset.
    preconditions:
    - q is at least 2.
    - The candidate passes slope-change and direction classification.
    - At least the first persistence slope has the required sign.
    - A later required persistence slope is non-finite or has the wrong sign.
    - No other candidate produces a pivot.
    expectedSourceBehavior:
    - The candidate is rejected and contributes no pivot.
    targetCases: 2
    emptyOutputAllowed: true
  - id: HIGH_EXTREME_AT_FIRST_BAR
    category: BOUNDARY
    description: A confirmed HIGH has its strict maximum at the candidate index.
    preconditions:
    - A HIGH candidate passes persistence and filtering.
    - The high at candidate is greater than every later high through candidate + w
      - 1.
    expectedSourceBehavior:
    - The returned HIGH pivot index equals candidate and its price equals that bar's
      high.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_EXTREME_AT_INTERIOR_BAR
    category: NORMAL
    description: A confirmed HIGH has its strict maximum inside the transition interval.
    preconditions:
    - A HIGH candidate passes persistence and filtering.
    - A unique maximum high occurs strictly between candidate and candidate + w -
      1.
    expectedSourceBehavior:
    - The returned HIGH pivot index is the interior maximum's index and its price
      is that high.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_EXTREME_AT_LAST_BAR
    category: BOUNDARY
    description: A confirmed HIGH has its strict maximum at the final transition bar.
    preconditions:
    - A HIGH candidate passes persistence and filtering.
    - The high at candidate + w - 1 is greater than every earlier transition high.
    expectedSourceBehavior:
    - The returned HIGH pivot index equals candidate + w - 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_EXTREME_TIE_KEEPS_EARLIEST
    category: EDGE
    description: A confirmed HIGH has equal maximum highs at multiple transition indices.
    preconditions:
    - A HIGH candidate passes persistence and filtering.
    - The maximum high occurs at least twice in the transition interval.
    expectedSourceBehavior:
    - Because replacement uses a strict greater-than comparison, the pivot index is
      the earliest maximum-high index.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOW_EXTREME_LOCATION_COVERAGE
    category: NORMAL
    description: Confirmed LOW candidates place the minimum at the first, interior,
      and last transition positions.
    preconditions:
    - Each case has a LOW candidate that passes persistence and filtering.
    - Each case has a unique minimum low at its designated first, interior, or last
      position.
    expectedSourceBehavior:
    - Each returned LOW pivot uses the designated minimum-low index and that bar's
      low price.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NONFINITE_EXTREME_VALUE
    category: EDGE
    description: Slope and persistence checks pass, but the selected high or low transition
      interval contains a non-finite value.
    preconditions:
    - The candidate is classified as HIGH or LOW and passes persistence.
    - The corresponding high or low at the start or a later transition index is not
      finite.
    - No other candidate produces a pivot.
    expectedSourceBehavior:
    - extremePivot returns null and the candidate contributes no pivot.
    targetCases: 2
    emptyOutputAllowed: true
  - id: FIRST_PIVOT_BYPASSES_ATR
    category: EDGE
    description: The first accepted pivot exercises the empty-pivot-list magnitude-filter
      bypass.
    preconditions:
    - A candidate has a finite extreme and passes slope and persistence checks.
    - The pivot list is empty at that candidate.
    - The associated ATR may be finite or non-finite.
    expectedSourceBehavior:
    - The pivot is accepted without requiring an ATR magnitude comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_ATR_MULTIPLIER_BYPASS
    category: EDGE
    description: A later candidate is evaluated with a zero minimum ATR reversal multiplier.
    preconditions:
    - m equals zero.
    - At least one pivot already exists.
    - A later candidate passes slope, persistence, and extreme selection.
    expectedSourceBehavior:
    - The later candidate passes the magnitude filter without requiring a finite ATR.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NONFINITE_ATR_REJECTS_LATER_PIVOT
    category: EDGE
    description: A later finite pivot candidate encounters a non-finite ATR with a
      nonzero multiplier.
    preconditions:
    - At least one pivot already exists.
    - m is nonzero.
    - The candidate's ATR value is not finite.
    - The candidate otherwise passes slope, persistence, and extreme selection.
    expectedSourceBehavior:
    - The candidate is rejected and the previously accepted pivots remain in the result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ATR_REVERSAL_BELOW_THRESHOLD
    category: NORMAL
    description: A later pivot's absolute price reversal is strictly below ATR multiplied
      by the configured multiplier.
    preconditions:
    - At least one pivot already exists and m is nonzero.
    - The candidate ATR is finite.
    - abs(candidate.price - previous.price) < ATR * m with a numeric safety margin.
    expectedSourceBehavior:
    - The candidate is rejected by the magnitude filter and does not alter the pivot
      list.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ATR_REVERSAL_EXACT_THRESHOLD
    category: BOUNDARY
    description: A later pivot's reversal equals ATR multiplied by the multiplier.
    preconditions:
    - At least one pivot already exists and m is nonzero.
    - The candidate ATR is finite.
    - abs(candidate.price - previous.price) equals ATR * m in source and translated
      computations.
    - The candidate otherwise qualifies.
    expectedSourceBehavior:
    - The candidate passes the greater-than-or-equal magnitude comparison and is appended
      or processed by the same-type update logic.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OPPOSITE_TYPES_APPEND
    category: NORMAL
    description: Two or more accepted candidates alternate pivot type and pass the
      magnitude filter.
    preconditions:
    - A candidate qualifies after an existing pivot.
    - The candidate type differs from the previous pivot type.
    - The candidate passes the configured ATR filter.
    expectedSourceBehavior:
    - The candidate is appended after the previous pivot, preserving detection order,
      and creates a swing between those consecutive pivots.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SAME_TYPE_HIGH_REPLACED
    category: NORMAL
    description: A later accepted HIGH candidate is higher than the current final
      HIGH.
    preconditions:
    - The previous and candidate pivot types are both HIGH.
    - The candidate passes the magnitude filter.
    - candidate.price is strictly greater than previous.price.
    expectedSourceBehavior:
    - The final HIGH is replaced by the later candidate rather than appended, so pivot
      count does not increase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_TYPE_HIGH_NOT_REPLACED
    category: BOUNDARY
    description: A later accepted HIGH candidate is equal to or lower than the current
      final HIGH.
    preconditions:
    - The previous and candidate pivot types are both HIGH.
    - The candidate reaches same-type update logic.
    - candidate.price is less than or equal to previous.price.
    expectedSourceBehavior:
    - The existing HIGH remains unchanged and pivot count does not increase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_TYPE_LOW_REPLACED
    category: NORMAL
    description: A later accepted LOW candidate is lower than the current final LOW.
    preconditions:
    - The previous and candidate pivot types are both LOW.
    - The candidate passes the magnitude filter.
    - candidate.price is strictly less than previous.price.
    expectedSourceBehavior:
    - The final LOW is replaced by the later candidate rather than appended.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_TYPE_LOW_NOT_REPLACED
    category: BOUNDARY
    description: A later accepted LOW candidate is equal to or higher than the current
      final LOW.
    preconditions:
    - The previous and candidate pivot types are both LOW.
    - The candidate reaches same-type update logic.
    - candidate.price is greater than or equal to previous.price.
    expectedSourceBehavior:
    - The existing LOW remains unchanged and pivot count does not increase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MULTIPLE_PIVOTS_BUILD_ORDERED_SWINGS
    category: NORMAL
    description: The source produces at least three ordered, alternating pivots and
      therefore multiple Elliott swings.
    preconditions:
    - At least three pivots survive all filters and same-type replacement.
    - Consecutive surviving pivots have increasing indices.
    - The invocation uses a non-null declared ElliottDegree.
    expectedSourceBehavior:
    - The result contains one swing for each consecutive pivot pair; every swing uses
      those pivots' indices and prices and carries the supplied degree.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EVALUATION_PREFIX_EXCLUDES_LATER_REVERSAL
    category: EDGE
    description: The series contains a qualifying reversal after the clamped evaluation
      index, while an earlier prefix already has an observable result.
    preconditions:
    - index is less than series.getEndIndex().
    - At least one pivot is confirmed using only bars at or before endIndex.
    - A distinct qualifying reversal exists only in bars beyond endIndex.
    expectedSourceBehavior:
    - The result includes the prefix pivots and swings but excludes the later reversal,
      demonstrating that detect does not read later bars.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VOLUME_AMOUNT_AND_TIMESTAMP_METADATA
    category: NORMAL
    description: A non-vacuous source series uses varied supported volumes, amounts,
      trade counts, durations, and timestamp spacing while producing pivots.
    preconditions:
    - The source result contains at least one pivot.
    - Bars include supported metadata variation, including zero and positive volume
      where accepted and at least one nonzero monetary amount.
    - The follow-up amount for each bar is exactly source amount + 100.0 * source
      volume.
    expectedSourceBehavior:
    - Detection depends on close, high, low, ATR, configuration, index, and degree;
      the source still yields the designed pivots and swings despite metadata variation.
    targetCases: 1
    emptyOutputAllowed: false
