InputDomain:
  summary: Non-null Temporal endpoint pairs for which ChronoUnit.DAYS can compute
    an int-sized source day count and both endpoints can be advanced by 37 DAYS. The
    domain includes date-only, date-time, instant, offset, zoned, and non-ISO chronology
    temporals, including positive, zero, negative, partial-day, calendar-boundary,
    DST, and integer-limit counts.
  globalConstraints:
  - startDateInclusive and endDateExclusive are non-null Temporal instances.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) completes successfully
    and its result is within Integer.MIN_VALUE through Integer.MAX_VALUE, because
    Days.between applies Math.toIntExact.
  - startDateInclusive.plus(37, ChronoUnit.DAYS) and endDateExclusive.plus(37, ChronoUnit.DAYS)
    both complete successfully.
  - ChronoUnit.DAYS.between on the two generated follow-up endpoints also completes
    successfully and produces an int-sized result, because the relation requires two
    Days outputs.
  - 'Null endpoints and endpoint pairs that do not support the required DAYS operations,
    overflow during the 37-day follow-up shift, or make Days.between throw are excluded:
    the supplied MR requires non-null inputs and compares successful Days outputs
    rather than exceptions.'
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - HijrahDate
    - MinguoDate
    - ThaiBuddhistDate
    - mixed supported Temporal pairs
    sourceGapClass:
    - zero
    - positive whole day
    - negative whole day
    - positive partial-day truncation
    - negative partial-day truncation
    - month boundary
    - leap-day boundary
    - year boundary
    - DST transition
    - int-sized extreme
    endpointBoundary:
    - ordinary dates
    - LocalDate minimum vicinity
    - LocalDate maximum vicinity
    - LocalDateTime maximum vicinity
    - Instant int maximum interval
    - Instant int minimum interval
  scenarios:
  - id: LOCAL_DATE_SAME_DATE_ZERO
    category: NORMAL
    description: Identical ISO LocalDate endpoints.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is the same LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEXT_DAY_POSITIVE_ONE
    category: NORMAL
    description: Consecutive ISO dates in increasing order.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is LocalDate.of(2024, 6, 16).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_PREVIOUS_DAY_NEGATIVE_ONE
    category: NORMAL
    description: Consecutive ISO dates in decreasing order.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 16).
    - endDateExclusive is LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SIX_DAY_POSITIVE_GAP
    category: NORMAL
    description: Positive ISO date gap smaller than one week.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 10).
    - endDateExclusive is LocalDate.of(2024, 6, 16).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 6.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SIX_DAY_NEGATIVE_GAP
    category: NORMAL
    description: Negative ISO date gap smaller than one week.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 16).
    - endDateExclusive is LocalDate.of(2024, 6, 10).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to -6.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_END_TO_NEXT_MONTH
    category: BOUNDARY
    description: ISO date gap crossing from the last day of January into February.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 31).
    - endDateExclusive is LocalDate.of(2024, 2, 1).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: ISO date interval containing leap day in leap year 2024.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28).
    - endDateExclusive is LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY_CROSSING
    category: BOUNDARY
    description: Corresponding February-to-March interval in non-leap year 2023.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 2, 28).
    - endDateExclusive is LocalDate.of(2023, 3, 1).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: ISO date interval crossing a calendar year boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 12, 31).
    - endDateExclusive is LocalDate.of(2024, 1, 1).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_EXACT_SHIFT_SIZED_GAP
    category: NORMAL
    description: ISO date interval whose source gap equals the MR shift amount.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1).
    - endDateExclusive is LocalDate.of(2024, 2, 7).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_VICINITY
    category: EDGE
    description: ISO LocalDate endpoints near LocalDate.MAX while retaining room for
      the 37-day follow-up shift.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(38).
    - endDateExclusive is LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_VICINITY
    category: EDGE
    description: ISO LocalDate endpoints near LocalDate.MIN with a positive one-day
      source gap.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: LocalDateTime endpoints exactly one 24-hour local day apart.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 10, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 10, 0).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_PARTIAL_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints 23 local hours apart, testing whole-day truncation.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 10, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 9, 0).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_DAY_PLUS_HOUR
    category: BOUNDARY
    description: LocalDateTime endpoints one day and one hour apart.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 10, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 11, 0).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_EXACT_DAY
    category: NORMAL
    description: LocalDateTime endpoints exactly one local day apart in reverse order.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 16, 10, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 15, 10, 0).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_PARTIAL_DAY
    category: BOUNDARY
    description: Reverse LocalDateTime interval of 23 local hours, testing negative
      whole-day truncation.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 16, 9, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 15, 10, 0).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NANO_BOUNDARY
    category: BOUNDARY
    description: LocalDateTime endpoints just below a complete day because of nanosecond
      precision.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 0, 0, 0, 1).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 0, 0, 0, 0).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_MAXIMUM_VICINITY
    category: EDGE
    description: LocalDateTime endpoints near LocalDateTime.MAX with room for the
      follow-up shift.
    preconditions:
    - startDateInclusive is LocalDateTime.MAX.minusDays(38).
    - endDateExclusive is LocalDateTime.MAX.minusDays(37).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_UTC_DAY
    category: NORMAL
    description: Instant endpoints exactly 86,400 seconds apart.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-02T00:00:00Z").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_POSITIVE_PARTIAL_DAY
    category: BOUNDARY
    description: Instant endpoints 23 elapsed hours apart.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-01T23:00:00Z").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_PARTIAL_DAY
    category: BOUNDARY
    description: Reverse Instant interval of 23 elapsed hours.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T23:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-01T00:00:00Z").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAXIMUM_DAY_COUNT
    category: EDGE
    description: Instant interval exactly Integer.MAX_VALUE whole days long.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.plus(Integer.MAX_VALUE, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MINIMUM_DAY_COUNT
    category: EDGE
    description: Instant interval exactly Integer.MIN_VALUE whole days long.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.plus(Integer.MIN_VALUE, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET
    category: NORMAL
    description: OffsetDateTime endpoints with the same fixed offset and a whole-day
      gap.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00+05:30").
    - endDateExclusive is OffsetDateTime.parse("2024-01-03T00:00:00+05:30").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_PARTIAL_DAY
    category: EDGE
    description: OffsetDateTime endpoints whose local dates differ but whose offset-normalized
      elapsed interval is 23 hours.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00+02:00").
    - endDateExclusive is OffsetDateTime.parse("2024-01-02T00:00:00+01:00").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_NEGATIVE_WHOLE_DAY
    category: NORMAL
    description: OffsetDateTime endpoints one whole day apart in reverse order.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-02T12:00:00-04:00").
    - endDateExclusive is OffsetDateTime.parse("2024-01-01T12:00:00-04:00").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST
    category: BOUNDARY
    description: Europe/Paris ZonedDateTime interval crossing the 2024 spring DST
      transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-03-30T12:00:00+01:00[Europe/Paris]").
    - endDateExclusive is ZonedDateTime.parse("2024-04-01T12:00:00+02:00[Europe/Paris]").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_DST
    category: BOUNDARY
    description: Europe/Paris ZonedDateTime interval crossing the 2024 autumn DST
      transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-10-26T12:00:00+02:00[Europe/Paris]").
    - endDateExclusive is ZonedDateTime.parse("2024-10-28T12:00:00+01:00[Europe/Paris]").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_NEGATIVE_DST_CROSSING
    category: BOUNDARY
    description: Reverse Europe/Paris interval crossing the spring DST transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-04-01T12:00:00+02:00[Europe/Paris]").
    - endDateExclusive is ZonedDateTime.parse("2024-03-30T12:00:00+01:00[Europe/Paris]").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FIXED_UTC
    category: NORMAL
    description: ZonedDateTime endpoints in the UTC region without offset transition
      effects.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-06-15T10:00:00Z[UTC]").
    - endDateExclusive is ZonedDateTime.parse("2024-06-16T10:00:00Z[UTC]").
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_WHOLE_DAY_GAP
    category: NORMAL
    description: JapaneseDate endpoints one chronology day apart.
    preconditions:
    - startDateInclusive is JapaneseDate.of(2019, 4, 30).
    - endDateExclusive is JapaneseDate.of(2019, 5, 1).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_TIME_PARTIAL_DAY
    category: BOUNDARY
    description: Japanese chronology date-time endpoints 23 hours apart.
    preconditions:
    - startDateInclusive is JapaneseDate.of(2019, 5, 1).atTime(10, 0).
    - endDateExclusive is JapaneseDate.of(2019, 5, 2).atTime(9, 0).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_WHOLE_DAY_GAP
    category: NORMAL
    description: HijrahDate endpoints one supported chronology day apart.
    preconditions:
    - startDateInclusive is HijrahDate.of(1445, 9, 1).
    - endDateExclusive is HijrahDate.of(1445, 9, 2).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: HijrahDate interval from the final day of one Hijrah month to the
      first day of the next.
    preconditions:
    - startDateInclusive is HijrahDate.of(1445, 9, 29).
    - endDateExclusive is HijrahDate.of(1445, 10, 1).
    expectedSourceBehavior:
    - Days.between returns a positive whole-day count determined by the chronology's
      consecutive dates.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_WHOLE_DAY_GAP
    category: NORMAL
    description: MinguoDate endpoints one chronology day apart.
    preconditions:
    - startDateInclusive is MinguoDate.of(113, 1, 1).
    - endDateExclusive is MinguoDate.of(113, 1, 2).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_WHOLE_DAY_GAP
    category: NORMAL
    description: ThaiBuddhistDate endpoints one chronology day apart.
    preconditions:
    - startDateInclusive is ThaiBuddhistDate.of(2567, 1, 1).
    - endDateExclusive is ThaiBuddhistDate.of(2567, 1, 2).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_ISO_LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: EDGE
    description: Supported mixed Temporal pair with LocalDate as the start temporal
      and LocalDateTime as the end temporal.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 23, 59).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_ISO_TO_JAPANESE_DATE
    category: EDGE
    description: Supported mixed chronology date pair representing consecutive ISO
      timeline dates.
    preconditions:
    - startDateInclusive is LocalDate.of(2019, 4, 30).
    - endDateExclusive is JapaneseDate.of(2019, 5, 1).
    expectedSourceBehavior:
    - Days.between returns getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
