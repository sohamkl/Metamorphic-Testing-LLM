InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be moved 23 days
    later and reconstructed by LocalDateRange.of(start, extendedEnd). Cover finite
    exact lengths, empty ranges, saturation to Integer.MAX_VALUE, unbounded-start
    sentinel ranges, date extremes, and representative supported construction paths.
  globalConstraints:
  - Source receiver is a non-null LocalDateRange successfully created by a documented
    construction path; no invalid construction or null receiver is supplied because
    the MR does not request invalid inputs.
  - Source end must satisfy range.getEnd() <= LocalDate.MAX.minusDays(23), so range.getEnd().plusDays(23)
    does not throw and the follow-up LocalDateRange.of(range.getStart(), extendedEnd)
    can be created.
  - Consequently, all valid ranges with end later than LocalDate.MAX.minusDays(23),
    including every unbounded-end range whose end is LocalDate.MAX, are excluded because
    RangeLengthMetamorphicSpec.generateFollowUp overflows before invoking the follow-up
    target.
  - Source start must be less than or equal to source end and must satisfy LocalDateRange
    construction restrictions; in particular, start is not LocalDate.MAX or LocalDate.MAX.minusDays(1),
    end is not LocalDate.MIN or LocalDate.MIN.plusDays(1), and empty ranges are not
    at LocalDate.MIN or LocalDate.MAX.
  diversity:
    rangeState:
    - '7'
    - bounded finite, empty, bounded saturated, unbounded-start, and follow-up-becomes-unbounded-end
      states
    - empty; finite-subthreshold; finite-at-threshold; finite-over-threshold; unbounded-start;
      bounded-follow-up-unbounded; unbounded-start-follow-up-unbounded
    lengthBoundary:
    - '8'
    - source epoch-day distance relative to Integer.MAX_VALUE
    - 0; 1; 2; 23; ordinary calendar span; Integer.MAX_VALUE-1; Integer.MAX_VALUE;
      Integer.MAX_VALUE+1
    calendarPosition:
    - '7'
    - date arithmetic position crossed by the range
    - ordinary day; month end; leap day; year boundary; BCE/CE boundary; LocalDate.MIN
      vicinity; LocalDate.MAX-minus-23 vicinity
    constructionPath:
    - '8'
    - documented LocalDateRange receiver creation path
    - of(start,end); of(start,Period); ofClosed; ofEmpty; ofUnboundedStart; parse(date/date);
      parse(date/period); parse(period/date); from(Temporal)
  scenarios:
  - id: EMPTY_ORDINARY_DATE
    category: BOUNDARY
    description: Empty bounded range at an ordinary date created with ofEmpty.
    preconditions:
    - Receiver is LocalDateRange.ofEmpty(LocalDate.of(2024, 6, 15)).
    - Source start equals source end and source end is at most LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIRECT_ONE_DAY_RANGE
    category: BOUNDARY
    description: Smallest non-empty ordinary half-open range.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 16)).
    - Source epoch-day distance is 1.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIRECT_TWENTY_THREE_DAY_RANGE
    category: NORMAL
    description: Finite range whose source length equals the MR extension amount.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1,
      24)).
    - Source epoch-day distance is 23.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - Follow-up has length 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_END_CROSSING
    category: EDGE
    description: Bounded range crossing from the final day of January into February.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 1, 31), LocalDate.of(2023,
      2, 1)).
    - Source epoch-day distance is 1 across a month boundary.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING
    category: EDGE
    description: Bounded range spanning leap day in a leap year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 1)).
    - Source epoch-day distance is 2 and includes 2024-02-29.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up has length 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_CROSSING
    category: EDGE
    description: Bounded range crossing the end of one calendar year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024,
      1, 1)).
    - Source epoch-day distance is 1 across a year boundary.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BCE_TO_CE_CROSSING
    category: EDGE
    description: Bounded range crossing from year 0 to year 1 in LocalDate's proleptic
      calendar.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(0, 12, 31), LocalDate.of(1, 1, 1)).
    - Source epoch-day distance is 1.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LONG_FINITE_MULTI_CENTURY_RANGE
    category: NORMAL
    description: Large finite range that remains well below Integer.MAX_VALUE days.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(1900, 1, 1), LocalDate.of(2100, 1,
      1)).
    - Source epoch-day distance is positive and less than Integer.MAX_VALUE minus
      23.
    expectedSourceBehavior:
    - lengthInDays() returns the exact epoch-day distance.
    - Follow-up output exceeds source output by exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_LOCALDATE_MIN_BOUNDED
    category: EDGE
    description: Finite bounded range at the earliest usable non-unbounded endpoint
      vicinity.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)).
    - Source start is LocalDate.MIN.plusDays(1) and source end is LocalDate.MIN.plusDays(2).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_LOCALDATE_MAX_FOLLOWUP_BECOMES_UNBOUNDED
    category: EDGE
    description: Finite source whose valid 23-day extension ends exactly at LocalDate.MAX.
    preconditions:
    - Source end is LocalDate.MAX.minusDays(23).
    - Source start is source end.minusDays(1).
    - Receiver is created with LocalDateRange.of(sourceStart, sourceEnd).
    expectedSourceBehavior:
    - Source lengthInDays() returns 1.
    - Follow-up end is LocalDate.MAX, so followUpOutput is Integer.MAX_VALUE and the
      relation assertion skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_MAX_MINUS_ONE
    category: BOUNDARY
    description: Largest exact finite length immediately below the saturation sentinel.
    preconditions:
    - Source start is LocalDate.of(-999999999, 1, 3).
    - Source end equals source start.plusDays(Integer.MAX_VALUE - 1L).
    - Receiver is LocalDateRange.of(sourceStart, sourceEnd).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 1.
    - Follow-up distance exceeds Integer.MAX_VALUE, so followUpOutput is Integer.MAX_VALUE
      and the assertion skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_EXACTLY_MAX
    category: BOUNDARY
    description: Bounded finite range at the implementation's Integer.MAX_VALUE saturation
      threshold.
    preconditions:
    - Source start is LocalDate.of(-999999999, 1, 3).
    - Source end equals source start.plusDays(Integer.MAX_VALUE).
    - Receiver is LocalDateRange.of(sourceStart, sourceEnd).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The sentinel causes the relation assertion to skip arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_GREATER_THAN_MAX
    category: EDGE
    description: Bounded finite range longer than Integer.MAX_VALUE days.
    preconditions:
    - Source start is LocalDate.of(-999999999, 1, 3).
    - Source end equals source start.plusDays(Integer.MAX_VALUE + 1L).
    - Receiver is LocalDateRange.of(sourceStart, sourceEnd).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE rather than the larger physical day
      count.
    - The sentinel causes the relation assertion to skip arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FINITE_END
    category: EDGE
    description: Range unbounded at the start with an ordinary finite exclusive end.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.of(2000, 1, 1)).
    - Source start is LocalDate.MIN and source end is before LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - Follow-up remains unbounded at the start and the assertion skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FOLLOWUP_UNBOUNDED_END
    category: EDGE
    description: Unbounded-start source whose extension changes its end to LocalDate.MAX.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.MAX.minusDays(23)).
    - Source start is LocalDate.MIN and source end is LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - Source lengthInDays() returns Integer.MAX_VALUE due to the unbounded start.
    - Follow-up is unbounded at both endpoints and also returns Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO_AT_ORDINARY_DATE
    category: BOUNDARY
    description: Empty range constructed through the documented start-plus-zero-Period
      path.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 15), Period.ZERO).
    - Period is non-negative and source start is an ordinary date.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_DAY
    category: NORMAL
    description: One-day range constructed through start plus Period.ofDays(1).
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 15), Period.ofDays(1)).
    - The computed end is exactly one day after the start.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_END_ADDITION
    category: EDGE
    description: Period addition from January 31, exercising calendar-based end calculation
      before length computation.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 1, 31), Period.ofMonths(1)).
    - Computed source end is LocalDate.of(2023, 2, 28).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - Follow-up has length 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_YEAR_ADDITION
    category: NORMAL
    description: One-year Period construction over a non-leap-year interval.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 3, 1), Period.ofYears(1)).
    - Computed source end is LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - lengthInDays() returns 366 because the interval includes leap day 2024-02-29.
    - Follow-up has length 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLETON
    category: BOUNDARY
    description: Closed range with equal inclusive endpoints, which becomes a one-day
      internal half-open range.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 15)).
    - Internal exclusive end is one day after the inclusive endpoint.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_TWO_INCLUDED_DATES
    category: NORMAL
    description: Closed range containing two dates, validating inclusive-end conversion.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 16)).
    - Internal exclusive end is LocalDate.of(2024, 6, 17).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up has length 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_TO_DATE
    category: NORMAL
    description: Parsed half-open range using date/date text form.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-06-15/2024-06-20").
    - Parsed source epoch-day distance is 5.
    expectedSourceBehavior:
    - lengthInDays() returns 5.
    - Follow-up has length 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_TO_PERIOD
    category: NORMAL
    description: Parsed range using date/period text form.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-01-01/P10D").
    - Parsed end is 10 days after parsed start.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up has length 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_TO_DATE
    category: NORMAL
    description: Parsed range using period/date text form.
    preconditions:
    - Receiver is LocalDateRange.parse("P10D/2024-01-11").
    - Parsed start is 10 days before parsed end.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up has length 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: Receiver obtained from a LocalDate Temporal, producing a one-day
      closed range.
    preconditions:
    - Receiver is LocalDateRange.from(LocalDate.of(2024, 6, 15)).
    - TemporalQueries.localDate() yields LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TIME
    category: NORMAL
    description: Receiver obtained from a complete temporal with a local date; time
      is ignored by from(Temporal).
    preconditions:
    - Receiver is LocalDateRange.from(LocalDateTime.of(2024, 6, 15, 23, 59, 59)).
    - TemporalQueries.localDate() yields LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: Receiver obtained from Year for a common calendar year.
    preconditions:
    - Receiver is LocalDateRange.from(Year.of(2023)).
    - Source internally spans 2023-01-01 inclusive through 2024-01-01 exclusive.
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    - Follow-up has length 388.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: EDGE
    description: Receiver obtained from Year for a leap calendar year.
    preconditions:
    - Receiver is LocalDateRange.from(Year.of(2024)).
    - Source internally spans 2024-01-01 inclusive through 2025-01-01 exclusive.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - Follow-up has length 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_FEBRUARY_YEAR_MONTH
    category: NORMAL
    description: Receiver obtained from YearMonth for February in a non-leap year.
    preconditions:
    - Receiver is LocalDateRange.from(YearMonth.of(2023, 2)).
    - Source internally spans 2023-02-01 inclusive through 2023-03-01 exclusive.
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - Follow-up has length 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEAR_MONTH
    category: EDGE
    description: Receiver obtained from YearMonth for February in a leap year.
    preconditions:
    - Receiver is LocalDateRange.from(YearMonth.of(2024, 2)).
    - Source internally spans 2024-02-01 inclusive through 2024-03-01 exclusive.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up has length 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_MINIMUM_YEAR_UNBOUNDED_START
    category: EDGE
    description: Receiver obtained from the minimum supported Year, whose first day
      is LocalDate.MIN and therefore denotes an unbounded start.
    preconditions:
    - Receiver is LocalDateRange.from(Year.of(-999999999)).
    - Source start is LocalDate.MIN and source end is within that year's December,
      before LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - Follow-up remains unbounded at the start and the assertion skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
