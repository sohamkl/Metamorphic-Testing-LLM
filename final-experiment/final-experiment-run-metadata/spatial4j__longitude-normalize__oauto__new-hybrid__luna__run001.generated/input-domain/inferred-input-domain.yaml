InputDomain:
  summary: All IEEE-754 double inputs accepted by normLonDEG, with emphasis on the
    inclusive normal interval, both modulo branches, revolution sentinels, antimeridian
    preservation, signed zero, non-finite values, and large-magnitude floating-point
    precision boundaries.
  globalConstraints:
  - Each source input is exactly one Java double value; no object construction or
    auxiliary API is required.
  - The follow-up input is computed exactly as longitudeDeg + 360.0, as required by
    the supplied metamorphic relation.
  - Finite source inputs must include values inside and outside the documented inclusive
    interval [-180.0, 180.0].
  - Non-finite IEEE-754 values are included because the supplied method accepts double
    and contains no rejection or exception path for them.
  - Source and follow-up outputs are compared only by LongitudeNormalizeMetamorphicSpec.assertRelation,
    including its 1e-9 tolerance and antimeridian exception.
  diversity:
    intervalPosition:
    - less than -180.0
    - equal to -180.0
    - strictly between -180.0 and 0.0
    - equal to 0.0
    - strictly between 0.0 and 180.0
    - equal to 180.0
    - greater than 180.0
    moduloBranch:
    - in-range early return
    - negative remainder off < 0
    - zero remainder with positive source
    - nonnegative nonzero remainder
    revolutionRelation:
    - ordinary same-normalization follow-up
    - follow-up crosses the -180/180 representation
    - source and follow-up are both antimeridian representations
    - large-value addition is precision-sensitive
    - addition leaves the floating-point value unchanged
    numericClass:
    - finite ordinary
    - finite boundary-adjacent
    - finite integral multiple of 360.0
    - finite fractional value
    - positive infinity
    - negative infinity
    - NaN
    - signed zero
  scenarios:
  - id: IN_RANGE_NEGATIVE_INTERIOR
    category: NORMAL
    description: A finite negative longitude strictly inside the documented inclusive
      range.
    preconditions:
    - '-180.0 < arg0 < 0.0; representative value: -45.0.'
    expectedSourceBehavior:
    - The first if condition is true and normLonDEG returns arg0 unchanged.
    - The follow-up arg0 + 360.0 is outside the normal interval and must exercise
      the modulo path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_ZERO
    category: NORMAL
    description: The zero meridian, including the exact boundary between negative
      and positive in-range values.
    preconditions:
    - arg0 == 0.0.
    expectedSourceBehavior:
    - The common-case branch returns 0.0 unchanged.
    - The follow-up value is 360.0 and exercises the non-in-range path while normalizing
      back to the same longitude.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_POSITIVE_INTERIOR
    category: NORMAL
    description: A finite positive longitude strictly inside the documented inclusive
      range.
    preconditions:
    - '0.0 < arg0 < 180.0; representative value: 45.0.'
    expectedSourceBehavior:
    - The first if condition is true and normLonDEG returns arg0 unchanged.
    - The follow-up exercises modulo normalization and should preserve the ordinary
      numeric output under the supplied relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_ANTIMERIDIAN_ENDPOINT
    category: BOUNDARY
    description: The inclusive lower endpoint of the documented output interval.
    preconditions:
    - arg0 == -180.0.
    expectedSourceBehavior:
    - The common-case branch returns -180.0 exactly, without modulo arithmetic.
    - The follow-up is 180.0, so the relation must use its antimeridian exception.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_ANTIMERIDIAN_ENDPOINT
    category: BOUNDARY
    description: The inclusive upper endpoint of the documented output interval.
    preconditions:
    - arg0 == 180.0.
    expectedSourceBehavior:
    - The common-case branch returns 180.0 exactly.
    - The follow-up is 540.0 and exercises the positive zero-remainder sentinel path,
      returning 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_LOWER_ENDPOINT
    category: BOUNDARY
    description: The greatest representable double greater than -180.0.
    preconditions:
    - arg0 == Math.nextUp(-180.0).
    expectedSourceBehavior:
    - The value remains in the inclusive interval and is returned unchanged.
    - This distinguishes the lower endpoint branch boundary from the adjacent representable
      interior value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_UPPER_ENDPOINT
    category: BOUNDARY
    description: The least representable double less than 180.0.
    preconditions:
    - arg0 == Math.nextDown(180.0).
    expectedSourceBehavior:
    - The value remains in the inclusive interval and is returned unchanged.
    - The follow-up uses the modulo path and tests preservation of a value immediately
      below the upper endpoint.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_LOWER_ENDPOINT
    category: EDGE
    description: The greatest representable double less than -180.0.
    preconditions:
    - arg0 == Math.nextDown(-180.0).
    expectedSourceBehavior:
    - The in-range condition is false.
    - The negative remainder branch off < 0 is exercised and produces a result just
      below 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_UPPER_ENDPOINT
    category: EDGE
    description: The least representable double greater than 180.0.
    preconditions:
    - arg0 == Math.nextUp(180.0).
    expectedSourceBehavior:
    - The in-range condition is false.
    - The nonnegative nonzero remainder path is exercised and produces a result just
      above -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_NONMULTIPLE_MODULO
    category: NORMAL
    description: A negative out-of-range longitude whose remainder is negative and
      nonzero.
    preconditions:
    - 'arg0 < -180.0 and (arg0 + 180.0) % 360.0 < 0.0; representative value: -181.0.'
    expectedSourceBehavior:
    - The modulo path is entered.
    - The off < 0 branch returns 180.0 + off, producing 179.0 for -181.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_360_MULTIPLE
    category: BOUNDARY
    description: A negative out-of-range value at an exact negative multiple of 360
      after the offset calculation.
    preconditions:
    - arg0 == -360.0.
    expectedSourceBehavior:
    - The modulo path is entered with off == -180.0.
    - The negative-remainder branch returns 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_540_SENTINEL
    category: EDGE
    description: A negative value for which (arg0 + 180.0) % 360.0 produces negative
      zero.
    preconditions:
    - arg0 == -540.0.
    expectedSourceBehavior:
    - The modulo path is entered.
    - off < 0 and off == 0 are both false for negative zero, so the final else returns
      -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_360_MULTIPLE
    category: BOUNDARY
    description: A positive out-of-range value at an exact positive multiple of 360.
    preconditions:
    - arg0 == 360.0.
    expectedSourceBehavior:
    - The modulo path computes off == 180.0, which is nonzero, and the final else
      returns 0.0.
    - The follow-up is 720.0 and tests repeated positive revolution normalization.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_540_SENTINEL
    category: EDGE
    description: A positive value for which the offset remainder is exactly zero.
    preconditions:
    - arg0 == 540.0.
    expectedSourceBehavior:
    - The modulo path computes off == 0.0.
    - Because arg0 > 0.0, the explicit off == 0.0 sentinel branch returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_NONMULTIPLE_MODULO
    category: NORMAL
    description: A positive out-of-range longitude with a positive nonzero remainder.
    preconditions:
    - 'arg0 > 180.0 and (arg0 + 180.0) % 360.0 > 0.0; representative value: 181.0.'
    expectedSourceBehavior:
    - The modulo path is entered.
    - The final else branch returns -180.0 + off, producing -179.0 for 181.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FULL_REVOLUTION_MULTIPLE
    category: EDGE
    description: A larger positive exact revolution multiple that reaches the positive
      zero-remainder sentinel.
    preconditions:
    - arg0 == 720.0.
    expectedSourceBehavior:
    - The explicit off == 0.0 and arg0 > 0.0 branch returns 180.0.
    - The follow-up is 1080.0 and exercises the same sentinel path again.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FULL_REVOLUTION_MULTIPLE
    category: EDGE
    description: A larger negative exact revolution multiple whose offset remainder
      is negative.
    preconditions:
    - arg0 == -720.0.
    expectedSourceBehavior:
    - The negative remainder branch returns 0.0.
    - The follow-up is -360.0 and tests the same negative-remainder family with a
      different quotient.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FRACTIONAL_NEGATIVE_OUT_OF_RANGE
    category: NORMAL
    description: A fractional negative longitude just beyond one lower revolution
      boundary.
    preconditions:
    - arg0 == -180.5.
    expectedSourceBehavior:
    - The negative remainder branch returns a fractional normalized longitude rather
      than an endpoint.
    - The follow-up tests the same longitude after one full revolution.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FRACTIONAL_POSITIVE_OUT_OF_RANGE
    category: NORMAL
    description: A fractional positive longitude just beyond the upper endpoint.
    preconditions:
    - arg0 == 180.5.
    expectedSourceBehavior:
    - The final modulo branch returns the corresponding fractional value just below
      -180.0.
    - The follow-up exercises the same normalization with one additional revolution.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIGNED_POSITIVE_ZERO
    category: EDGE
    description: Positive zero as an exact source representation.
    preconditions:
    - Double.doubleToRawLongBits(arg0) == Double.doubleToRawLongBits(0.0d).
    expectedSourceBehavior:
    - The common-case branch returns the supplied zero representation without modulo
      arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIGNED_NEGATIVE_ZERO
    category: EDGE
    description: Negative zero as an exact source representation.
    preconditions:
    - Double.doubleToRawLongBits(arg0) == Double.doubleToRawLongBits(-0.0d).
    expectedSourceBehavior:
    - The range comparisons are true and the method returns arg0 unchanged, preserving
      the source value rather than entering modulo arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOWUP_ANTIMERIDIAN_FROM_NEGATIVE_BOUNDARY
    category: EDGE
    description: A source at -180.0 whose +360.0 follow-up is the alternate antimeridian
      representation.
    preconditions:
    - arg0 == -180.0 and arg0 + 360.0 == 180.0.
    expectedSourceBehavior:
    - The source returns -180.0 through the early return.
    - The follow-up returns 180.0 through the early return, requiring the relation's
      bothAreAntimeridian exception.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOWUP_ANTIMERIDIAN_FROM_POSITIVE_BOUNDARY
    category: EDGE
    description: A source at +180.0 whose follow-up remains at the positive antimeridian
      representation.
    preconditions:
    - arg0 == 180.0 and arg0 + 360.0 == 540.0.
    expectedSourceBehavior:
    - The source uses the early return.
    - The follow-up uses the positive zero-remainder sentinel and returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_EXACT_FINITE_VALUE
    category: EDGE
    description: A large finite value where adding 360.0 remains representable but
      floating-point spacing is material.
    preconditions:
    - arg0 == 4503599627370496.0, which is 2^52 and is finite and greater than 180.0.
    expectedSourceBehavior:
    - The source uses the modulo path rather than the common-case branch.
    - The source and follow-up exercise floating-point remainder behavior at a magnitude
      where ulp spacing is much larger than ordinary longitude precision.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_NEAR_ADDITION_ROUNDING
    category: EDGE
    description: A finite value above 2^53 where the 360-degree follow-up is subject
      to coarse floating-point spacing.
    preconditions:
    - arg0 == 9007199254740992.0, which is 2^53 and is finite and greater than 180.0.
    expectedSourceBehavior:
    - Both invocations use the modulo path.
    - The metamorphic assertion observes the actual double results rather than assuming
      exact real-number modular arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_LARGE_POSITIVE_FINITE
    category: EDGE
    description: A very large positive finite longitude for which adding 360.0 may
      round to the same double.
    preconditions:
    - arg0 == 1.0e308 and Double.isFinite(arg0).
    expectedSourceBehavior:
    - The method enters its modulo path and applies Java double remainder arithmetic.
    - The follow-up is generated by Java addition without clamping or pre-normalization.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_LARGE_NEGATIVE_FINITE
    category: EDGE
    description: A very large negative finite longitude for which the negative remainder
      path is exercised.
    preconditions:
    - arg0 == -1.0e308 and Double.isFinite(arg0).
    expectedSourceBehavior:
    - The method enters the modulo path and evaluates the negative remainder condition.
    - The follow-up is generated by Java addition and is checked by the supplied relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INFINITY
    category: EDGE
    description: Positive infinity passed directly as the longitude.
    preconditions:
    - arg0 == Double.POSITIVE_INFINITY.
    expectedSourceBehavior:
    - The range condition is false and (arg0 + 180.0) % 360.0 evaluates through IEEE-754
      non-finite arithmetic.
    - The resulting arithmetic path reaches the final return expression with a non-finite
      result; the follow-up remains positive infinity before normalization.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INFINITY
    category: EDGE
    description: Negative infinity passed directly as the longitude.
    preconditions:
    - arg0 == Double.NEGATIVE_INFINITY.
    expectedSourceBehavior:
    - The range condition is false and the modulo computation is non-finite.
    - The follow-up remains negative infinity before normalization and reaches the
      same non-finite arithmetic path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_INPUT
    category: EDGE
    description: A NaN longitude, included because the method has no explicit NaN
      rejection.
    preconditions:
    - Double.isNaN(arg0) is true.
    expectedSourceBehavior:
    - All ordered range and remainder comparisons are false under Java NaN semantics.
    - The final arithmetic expression returns NaN, and arg0 + 360.0 remains NaN for
      the follow-up.
    targetCases: 1
    emptyOutputAllowed: false
