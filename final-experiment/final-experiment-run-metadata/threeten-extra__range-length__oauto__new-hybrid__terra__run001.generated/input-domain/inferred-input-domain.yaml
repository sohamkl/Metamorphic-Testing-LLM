InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be advanced by 23
    days and reconstructed by LocalDateRange.of(start, extendedEnd). Cover empty,
    ordinary bounded, calendar-sensitive, period-derived, parsed, Temporal-derived,
    unbounded-start, saturation, and LocalDate endpoint cases.
  globalConstraints:
  - Source receiver is non-null and is successfully created by one of the discovered
    LocalDateRange construction paths.
  - '{Source range satisfies LocalDateRange validity=start is not LocalDate.MAX or
    LocalDate.MAX.minusDays(1), end is not LocalDate.MIN or LocalDate.MIN.plusDays(1),
    and end is not before start.}'
  - Source end satisfies end <= LocalDate.MAX.minusDays(23), because generateFollowUp
    invokes range.getEnd().plusDays(23).
  - Ranges with end equal to LocalDate.MAX are excluded globally because the supplied
    follow-up transformation overflows before constructing its follow-up receiver;
    this excludes all unbounded-end and fully unbounded ranges.
  - Invalid construction inputs are excluded because the supplied metamorphic relation
    requests a valid LocalDateRange source receiver, not exception behavior.
  diversity:
    constructionPath:
    - distinct
    - measurable
    - of(start,end); of(start,Period); ofClosed; ofEmpty; ofUnboundedStart; parse(date/date);
      parse(date/period); parse(period/date); from(LocalDate); from(Year); from(YearMonth);
      from(YearHalf); from(YearQuarter); from(YearWeek)
    lengthClass:
    - distinct
    - measurable
    - 0; 1; ordinary positive; Integer.MAX_VALUE-23; Integer.MAX_VALUE; greater than
      Integer.MAX_VALUE; unbounded-start sentinel
    calendarTopology:
    - distinct
    - measurable
    - same date; adjacent dates; leap-day crossing; non-leap February; month end;
      year boundary; leap year; common year; ISO week crossing year
    followUpOutcome:
    - distinct
    - measurable
    - asserted increase of 23; skipped because source is Integer.MAX_VALUE; skipped
      because follow-up is Integer.MAX_VALUE
  scenarios:
  - id: EMPTY_RANGE_OF_EMPTY
    category: BOUNDARY
    description: Empty range created directly at an ordinary date.
    preconditions:
    - Receiver is LocalDateRange.ofEmpty(LocalDate.of(2024, 6, 15)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23, so the relation asserts an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_OF_EQUAL_ENDPOINTS
    category: BOUNDARY
    description: Empty range created through the half-open start/end factory rather
      than ofEmpty.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 15)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_ZERO_PERIOD
    category: BOUNDARY
    description: Empty range produced by a zero Period.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 15), Period.ZERO).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_DAY_HALF_OPEN
    category: BOUNDARY
    description: Smallest non-empty ordinary half-open range.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 16)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING
    category: NORMAL
    description: Bounded range crossing leap day in a leap year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up has length 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_YEAR_FEBRUARY_CROSSING
    category: NORMAL
    description: Corresponding February-to-March range in a non-leap year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 2, 28), LocalDate.of(2023,
      3, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_HALF_OPEN
    category: NORMAL
    description: One-day range whose endpoints are in different calendar years.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024,
      1, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE
    category: BOUNDARY
    description: Closed factory converts one inclusive date into a one-day internal
      half-open range.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 15)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_MONTH_END
    category: NORMAL
    description: Closed factory whose inclusive end is leap-day.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 2, 1), LocalDate.of(2024,
      2, 29)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up has length 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_MONTH_FROM_MONTH_END
    category: NORMAL
    description: Period-derived endpoint exercises LocalDate month-end period addition.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - lengthInDays() returns 29 because the calculated end is 2024-02-29.
    - Follow-up has length 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_YEAR_FROM_LEAP_DAY
    category: NORMAL
    description: Period-derived endpoint normalizes a leap-day start in the following
      common year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 2, 29), Period.ofYears(1)).
    expectedSourceBehavior:
    - lengthInDays() returns 365 because the calculated end is 2025-02-28.
    - Follow-up has length 388.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_TO_DATE
    category: NORMAL
    description: Parsed date/date representation creates a standard half-open range.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-04-01/2024-04-11").
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up has length 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_TO_PERIOD
    category: NORMAL
    description: Parsed date/period representation calculates the end from the start.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-01-31/P1M").
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up has length 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_TO_DATE
    category: NORMAL
    description: Parsed period/date representation calculates the start from the end.
    preconditions:
    - Receiver is LocalDateRange.parse("P1M/2024-02-29").
    expectedSourceBehavior:
    - lengthInDays() returns 29 because the calculated start is 2024-01-29.
    - Follow-up has length 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: Temporal conversion through the local-date query creates a closed
      one-day range.
    preconditions:
    - Receiver is LocalDateRange.from(LocalDate.of(2024, 2, 29)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: NORMAL
    description: Temporal conversion from a leap Year covers its complete calendar
      year.
    preconditions:
    - Receiver is LocalDateRange.from(Year.of(2024)).
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - Follow-up has length 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: Temporal conversion from a non-leap Year covers 365 days.
    preconditions:
    - Receiver is LocalDateRange.from(Year.of(2023)).
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    - Follow-up has length 388.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEAR_MONTH
    category: NORMAL
    description: Temporal conversion from February in a leap year.
    preconditions:
    - Receiver is LocalDateRange.from(YearMonth.of(2024, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up has length 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_FEBRUARY_YEAR_MONTH
    category: NORMAL
    description: Temporal conversion from February in a common year.
    preconditions:
    - Receiver is LocalDateRange.from(YearMonth.of(2023, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - Follow-up has length 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: Temporal conversion through the YearHalf branch.
    preconditions:
    - Receiver is LocalDateRange.from(a YearHalf representing the first half of leap
      year 2024).
    expectedSourceBehavior:
    - lengthInDays() returns 182.
    - Follow-up has length 205.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: Temporal conversion through the YearQuarter branch for leap-year
      first quarter.
    preconditions:
    - Receiver is LocalDateRange.from(a YearQuarter representing Q1 of 2024).
    expectedSourceBehavior:
    - lengthInDays() returns 91.
    - Follow-up has length 114.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK_CROSSING_YEAR
    category: NORMAL
    description: Temporal conversion through the YearWeek branch for an ISO week spanning
      calendar years.
    preconditions:
    - Receiver is LocalDateRange.from(a YearWeek whose Monday is 2019-12-30 and Sunday
      is 2020-01-05).
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - Follow-up has length 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: Range unbounded at the start with a finite ordinary end.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 6, 15)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - Follow-up also returns Integer.MAX_VALUE, so the supplied assertion skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_NEAR_MINIMUM_END
    category: EDGE
    description: Unbounded-start sentinel with the earliest permitted finite exclusive
      end.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because start equals LocalDate.MIN.
    - Follow-up remains unbounded at the start and is skipped by the assertion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_SIDE_BOUNDED_ONE_DAY
    category: EDGE
    description: Bounded one-day range immediately above the prohibited LocalDate.MIN.plusDays(1)
      end.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - lengthInDays() returns 1; the start is not LocalDate.MIN, so this is not unbounded.
    - Follow-up has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAX_MINUS_TWENTY_THREE
    category: BOUNDARY
    description: Largest bounded source length for which the follow-up reaches exactly
      Integer.MAX_VALUE.
    preconditions:
    - Start is LocalDate.MIN.plusDays(1).
    - End equals start.plusDays(Integer.MAX_VALUE - 23).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - Follow-up lengthInDays() returns Integer.MAX_VALUE, so the assertion skips because
      the follow-up output is the sentinel value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAX_EXACT_BOUNDED
    category: BOUNDARY
    description: Bounded range whose real length is exactly Integer.MAX_VALUE.
    preconditions:
    - Start is LocalDate.MIN.plusDays(1).
    - End equals start.plusDays(Integer.MAX_VALUE).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE at the saturation boundary.
    - The assertion skips because the source output equals Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAX_PLUS_ONE_BOUNDED
    category: EDGE
    description: Bounded range whose real day count exceeds the int return capacity
      by one.
    preconditions:
    - Start is LocalDate.MIN.plusDays(1).
    - End equals start.plusDays(((long) Integer.MAX_VALUE) + 1L).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE due to bounded-length saturation.
    - The assertion skips because the source output equals Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_LARGE_BOUNDED_RANGE
    category: EDGE
    description: Bounded range substantially larger than Integer.MAX_VALUE days.
    preconditions:
    - Start is LocalDate.MIN.plusDays(1).
    - End equals start.plusDays(((long) Integer.MAX_VALUE) + 1000000L).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE due to saturation rather than unboundedness.
    - The assertion skips because the source output equals Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_SIDE_ASSERTED_BOUNDARY
    category: EDGE
    description: Latest eligible bounded source whose follow-up remains finite and
      permits the arithmetic assertion.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(47), LocalDate.MAX.minusDays(24)).
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - Follow-up end is LocalDate.MAX.minusDays(1), follow-up length is 46, and the
      relation asserts an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_SIDE_FOLLOW_UP_UNBOUNDED
    category: EDGE
    description: Latest eligible one-day bounded source; extending its end reaches
      LocalDate.MAX.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has end LocalDate.MAX and returns Integer.MAX_VALUE, so the supplied
      assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
