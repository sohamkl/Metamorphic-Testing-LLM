InputDomain:
  summary: Valid LocalDateRange source receivers for lengthInDays() whose end can
    be advanced by the metamorphic generator's fixed 23 days. The cases cover finite,
    empty, unbounded-start, construction-path, calendar-boundary, and follow-up-sentinel
    behavior.
  globalConstraints:
  - Every source receiver is a non-null LocalDateRange created through one of the
    supplied valid construction paths and satisfies the class restrictions on ordering
    and forbidden LocalDate.MIN, LocalDate.MIN.plusDays(1), LocalDate.MAX, and LocalDate.MAX.minusDays(1)
    positions.
  - source.getEnd().plusDays(23) must be defined; therefore every source end is no
    later than LocalDate.MAX.minusDays(23). This excludes unbounded-end sources because
    their end is LocalDate.MAX and the supplied follow-up generator cannot add 23
    days to it.
  - The follow-up is exactly LocalDateRange.of(source.getStart(), source.getEnd().plusDays(23)).
    Consequently, the source start must also be valid for that overload.
  - Finite source and follow-up ranges are expected to differ in whole-day length
    by exactly 23 when both lengthInDays() results are not Integer.MAX_VALUE.
  - If either source or follow-up is unbounded, the supplied relation assertion returns
    without checking arithmetic; such cases are included only to exercise the documented
    sentinel path.
  - Invalid factory arguments, malformed parse text, null receivers, and construction
    failures are excluded because the supplied metamorphic relation generates only
    a valid follow-up from an existing range and does not request invalid-input testing.
  diversity:
    constructionPath:
    - of(LocalDate, LocalDate)
    - of(LocalDate, Period)
    - ofClosed(LocalDate, LocalDate)
    - ofEmpty(LocalDate)
    - from(LocalDate)
    - from(Year)
    - from(YearMonth)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    - ofUnboundedStart(LocalDate)
    lengthClass:
    - zero
    - one
    - two
    - small positive finite
    - leap-year length
    - month-period length
    - large positive finite
    - Integer.MAX_VALUE sentinel
    endpointSituation:
    - ordinary finite dates
    - start at LocalDate.MIN.plusDays(1)
    - end at LocalDate.MIN.plusDays(2)
    - end at LocalDate.MAX.minusDays(24)
    - end at LocalDate.MAX.minusDays(23)
    - follow-up end at LocalDate.MAX
    - unbounded start
    assertionPath:
    - finite source and finite follow-up
    - source sentinel and follow-up sentinel
    - finite source and follow-up sentinel
  scenarios:
  - id: TYPICAL_HALF_OPEN_RANGE
    category: NORMAL
    description: A typical finite half-open range made with the two-date of overload.
    preconditions:
    - source = LocalDateRange.of(2024-01-10, 2024-02-10)
    - source.getEnd() is 31 days after source.getStart().
    - source.getEnd().plusDays(23) is a valid finite end.
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    - The follow-up has the same start and an end 23 days later.
    - The follow-up length is 54 and the checked increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_STANDARD_LOCATION
    category: EDGE
    description: An empty range created explicitly at an ordinary date.
    preconditions:
    - source = LocalDateRange.ofEmpty(2024-06-15)
    - source.getStart() equals source.getEnd().
    - The empty location is not one of the four prohibited boundary positions.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a finite 23-day range.
    - The follow-up length is 23, so the relation performs its arithmetic check.
    targetCases: 1
    emptyOutputAllowed: true
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: The smallest positive finite range using half-open endpoints.
    preconditions:
    - source = LocalDateRange.of(2024-06-15, 2024-06-16)
    - The exclusive end is exactly one day after the inclusive start.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: BOUNDARY
    description: A finite range crossing February 29 in a leap year.
    preconditions:
    - source = LocalDateRange.of(2024-02-28, 2024-03-02)
    - The range spans 2024-02-28 through 2024-03-01.
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    - The follow-up length is 26.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_RANGE
    category: BOUNDARY
    description: A finite range crossing a calendar-year boundary.
    preconditions:
    - source = LocalDateRange.of(2023-12-31, 2024-01-02)
    - The exclusive end is two days after the start.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_CONSTRUCTION
    category: EDGE
    description: An empty range produced by the period overload of of.
    preconditions:
    - source = LocalDateRange.of(2024-06-15, Period.ZERO)
    - Period.ZERO produces an end equal to the start.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is finite with length 23.
    - The relation checks the numeric increase rather than skipping on a sentinel.
    targetCases: 1
    emptyOutputAllowed: true
  - id: MONTH_PERIOD_CONSTRUCTION
    category: NORMAL
    description: A range whose end is calculated by adding one calendar month.
    preconditions:
    - source = LocalDateRange.of(2024-01-31, Period.ofMonths(1))
    - The resulting exclusive end is 2024-02-29.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up length is 52.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE
    category: BOUNDARY
    description: A one-date closed range converted to a one-day half-open range.
    preconditions:
    - source = LocalDateRange.ofClosed(2024-06-15, 2024-06-15)
    - The inclusive start and inclusive end are equal.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A range obtained through the from(Temporal) LocalDate path.
    preconditions:
    - source = LocalDateRange.from(2024-06-15)
    - The LocalDate path creates a closed one-date range.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A range obtained through the from(Temporal) Year path.
    preconditions:
    - source = LocalDateRange.from(Year.of(2024))
    - The source covers the dates from 2024-01-01 through 2024-12-31.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - The follow-up length is 389.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: BOUNDARY
    description: A range obtained through the from(Temporal) YearMonth path for February
      in a leap year.
    preconditions:
    - source = LocalDateRange.from(YearMonth.of(2024, 2))
    - The source covers 2024-02-01 through 2024-02-29.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up length is 52.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_DATE
    category: NORMAL
    description: A finite range parsed from two explicit LocalDate components.
    preconditions:
    - source = LocalDateRange.parse("2024-04-01/2024-04-11")
    - The parsed start is 2024-04-01 and the parsed exclusive end is 2024-04-11.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up length is 33.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_PERIOD
    category: NORMAL
    description: A finite range parsed from a date followed by a Period.
    preconditions:
    - source = LocalDateRange.parse("2024-04-01/P23D")
    - The parsed period is non-negative and produces an end 23 days after the start.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_PERIOD_DATE
    category: NORMAL
    description: A finite range parsed from a Period followed by an end date.
    preconditions:
    - source = LocalDateRange.parse("P23D/2024-04-24")
    - The parsed start is 23 days before 2024-04-24.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_SENTINEL
    category: EDGE
    description: A range unbounded at the start and finite at the end.
    preconditions:
    - source = LocalDateRange.ofUnboundedStart(2024-06-15)
    - source.getStart() equals LocalDate.MIN.
    - source.getEnd() is finite and can be advanced by 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range sentinel.
    - The follow-up remains unbounded at the start and also returns Integer.MAX_VALUE.
    - The supplied assertion skips arithmetic when it sees the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIN_ADJACENT_FINITE_RANGE
    category: BOUNDARY
    description: The smallest positive finite range beginning at the first permitted
      position after LocalDate.MIN.
    preconditions:
    - source = LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2))
    - The start is LocalDate.MIN.plusDays(1).
    - The end avoids the forbidden LocalDate.MIN.plusDays(1) value.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up remains finite and has length 24.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_NEAR_MIN
    category: EDGE
    description: An unbounded-start range using the first permitted finite end after
      the LocalDate.MIN restrictions.
    preconditions:
    - source = LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2))
    - source.getEnd() equals LocalDate.MIN.plusDays(2).
    - The follow-up end is LocalDate.MIN.plusDays(25).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The follow-up also returns Integer.MAX_VALUE.
    - The supplied assertion intentionally skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_RANGE_END_MAX_MINUS_24
    category: BOUNDARY
    description: A short finite range whose follow-up end is LocalDate.MAX.minusDays(1).
    preconditions:
    - source = LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24))
    - source.getEnd().plusDays(23) equals LocalDate.MAX.minusDays(1).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up remains finite and has length 24.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_REACHES_MAX_END
    category: EDGE
    description: A finite source whose 23-day extension reaches the unbounded-end
      sentinel.
    preconditions:
    - source = LocalDateRange.of(LocalDate.MAX.minusDays(46), LocalDate.MAX.minusDays(23))
    - source.getEnd().plusDays(23) equals LocalDate.MAX.
    - The source length is 23.
    expectedSourceBehavior:
    - lengthInDays() returns 23 for the finite source.
    - The follow-up has end LocalDate.MAX and returns Integer.MAX_VALUE.
    - The supplied assertion skips arithmetic because the follow-up output is the
      sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_NEAR_MAX
    category: EDGE
    description: A closed-range construction whose converted exclusive end is LocalDate.MAX.minusDays(23).
    preconditions:
    - source = LocalDateRange.ofClosed(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24))
    - Closed conversion makes source.getEnd() equal LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up has end LocalDate.MAX and returns Integer.MAX_VALUE.
    - The supplied assertion skips arithmetic on the follow-up sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_RANGE
    category: EDGE
    description: A large but finite range whose day difference remains within the
      int result domain.
    preconditions:
    - source = LocalDateRange.of(1900-01-01, 4637-11-25)
    - The source has a large positive finite day count below Integer.MAX_VALUE.
    - source.getEnd().plusDays(23) is still a finite valid end.
    expectedSourceBehavior:
    - lengthInDays() returns the whole-day difference between the two finite endpoints.
    - The follow-up remains finite.
    - The follow-up output exceeds the source output by exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_AFTER_MIN_BOUNDARY
    category: EDGE
    description: An empty range located immediately after the restricted LocalDate.MIN
      positions.
    preconditions:
    - source = LocalDateRange.ofEmpty(LocalDate.MIN.plusDays(2))
    - The empty location is valid because it is neither LocalDate.MIN nor LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is finite with length 23.
    - The checked increase is exactly 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: EMPTY_RANGE_BEFORE_MAX_BOUNDARY
    category: EDGE
    description: An empty range located at the latest position that still permits
      the 23-day follow-up.
    preconditions:
    - source = LocalDateRange.ofEmpty(LocalDate.MAX.minusDays(23))
    - The empty location is not LocalDate.MAX or LocalDate.MAX.minusDays(1).
    - source.getEnd().plusDays(23) equals LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a finite-start range with end LocalDate.MAX and therefore returns
      Integer.MAX_VALUE.
    - The supplied assertion skips arithmetic because the follow-up is unbounded at
      the end.
    targetCases: 1
    emptyOutputAllowed: true
