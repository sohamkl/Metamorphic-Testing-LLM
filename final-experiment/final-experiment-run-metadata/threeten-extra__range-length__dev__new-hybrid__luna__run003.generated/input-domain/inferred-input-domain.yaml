InputDomain:
  summary: Valid LocalDateRange receivers whose end can be shifted 23 days later by
    RangeLengthMetamorphicSpec.generateFollowUp. The domain emphasizes finite, empty,
    unbounded-start, boundary, construction-path, and int-conversion cases for lengthInDays().
  globalConstraints:
  - The source receiver is a non-null LocalDateRange constructed by one of the supplied
    valid API paths.
  - The source range satisfies start <= end, with start != LocalDate.MAX and LocalDate.MAX.minusDays(1),
    and end != LocalDate.MIN and LocalDate.MIN.plusDays(1), as enforced by LocalDateRange.
  - The source end satisfies end <= LocalDate.MAX.minusDays(23), because generateFollowUp
    calls range.getEnd().plusDays(23); larger ends would make the supplied follow-up
    transformation fail before the relation assertion.
  - The follow-up range is constructed as LocalDateRange.of(source.start, source.end.plusDays(23));
    therefore the source start must remain valid for that construction.
  - Unbounded-end source ranges are excluded only because their end is LocalDate.MAX
    and the supplied follow-up transformation cannot add 23 days to LocalDate.MAX.
  - 'No invalid-input cases are required: the supplied metamorphic relation accepts
    a LocalDateRange receiver and does not request testing constructor exceptions
    or malformed construction arguments.'
  - For finite ranges, the expected mathematical day count is end.toEpochDay() - start.toEpochDay(),
    while lengthInDays() returns an int and may therefore expose narrowing behavior
    for counts outside the int range.
  diversity:
    constructionPath:
    - of_dates
    - of_period
    - of_closed
    - of_empty
    - from_temporal
    - parse_date_date
    - parse_date_period
    - parse_period_date
    - unbounded_start_factory
    rangeKind:
    - finite_positive
    - finite_empty
    - unbounded_start
    - finite_with_unbounded_follow_up
    - finite_output_sentinel
    dayCountClass:
    - zero
    - one
    - small_positive
    - exactly_integer_max_value
    - just_below_integer_max_value
    - just_above_integer_max_value
    - exactly_integer_wrap
    - beyond_integer_wrap
    dateBoundary:
    - near_local_date_min
    - ordinary_date
    - leap_boundary
    - near_follow_up_local_date_max
    followUpStatus:
    - finite_follow_up
    - unbounded_end_follow_up
    - source_sentinel_skip
  scenarios:
  - id: ORDINARY_MULTI_DAY_HALF_OPEN
    category: NORMAL
    description: A normal finite half-open range with several whole days.
    preconditions:
    - Construct source as LocalDateRange.of(2020-01-10, 2020-02-15).
    - The source is finite and its mathematical length is 36 days.
    - The follow-up end 2020-03-09 is a valid finite endpoint.
    expectedSourceBehavior:
    - lengthInDays() returns 36.
    - The follow-up length is 59, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_ONE_DAY_HALF_OPEN
    category: BOUNDARY
    description: A finite range containing exactly one whole day.
    preconditions:
    - Construct source as LocalDateRange.of(2020-01-10, 2020-01-11).
    - The source mathematical length is 1.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up has length 24 and satisfies the 23-day increase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_EMPTY_RANGE
    category: EDGE
    description: An empty finite range at an ordinary date.
    preconditions:
    - Construct source as LocalDateRange.ofEmpty(2020-01-10).
    - The start and end are equal and are not LocalDate.MIN or LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is non-empty with length 23, exercising the empty-to-positive
      transformation.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERIOD_ZERO_EMPTY_RANGE
    category: EDGE
    description: An empty range created through the start-plus-zero-period construction
      path.
    preconditions:
    - Construct source as LocalDateRange.of(2020-01-10, Period.ZERO).
    - The period is non-negative and produces equal start and end dates.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up length is 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERIOD_POSITIVE_DAYS
    category: NORMAL
    description: A finite range created from a positive Period measured in days.
    preconditions:
    - Construct source as LocalDateRange.of(2020-01-10, Period.ofDays(40)).
    - The resulting end is 2020-02-19 and the mathematical length is 40.
    expectedSourceBehavior:
    - lengthInDays() returns 40.
    - The follow-up length is 63.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_ACROSS_LEAP_DAY
    category: BOUNDARY
    description: A period-based range whose endpoints cross February 29 in a leap
      year.
    preconditions:
    - Construct source as LocalDateRange.of(2020-01-31, Period.ofMonths(1)).
    - The resulting end is 2020-02-29 and the actual date difference is 29 days.
    expectedSourceBehavior:
    - lengthInDays() returns 29, demonstrating that length is based on endpoint days
      rather than the Period's nominal month count.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE
    category: BOUNDARY
    description: A closed range containing one inclusive date.
    preconditions:
    - Construct source as LocalDateRange.ofClosed(2020-01-10, 2020-01-10).
    - ofClosed converts the inclusive end to the exclusive endpoint 2020-01-11.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_DAY
    category: BOUNDARY
    description: A closed range whose inclusive endpoint is February 29 of a leap
      year.
    preconditions:
    - Construct source as LocalDateRange.ofClosed(2020-02-28, 2020-02-29).
    - The exclusive endpoint is 2020-03-01 and the mathematical length is 2.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A finite range parsed from two LocalDate representations.
    preconditions:
    - Parse source with LocalDateRange.parse("2021-03-01/2021-03-15").
    - The parsed half-open range has mathematical length 14.
    expectedSourceBehavior:
    - lengthInDays() returns 14.
    - The follow-up length is 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: A finite range parsed from a date followed by a Period.
    preconditions:
    - Parse source with LocalDateRange.parse("2021-03-01/P10D").
    - The parsed end is 2021-03-11 and the mathematical length is 10.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up length is 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: A finite range parsed from a Period followed by an end date.
    preconditions:
    - Parse source with LocalDateRange.parse("P10D/2021-03-11").
    - The parsed start is 2021-03-01 and the mathematical length is 10.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up length is 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A range created from a LocalDate temporal.
    preconditions:
    - Construct source as LocalDateRange.from(LocalDate.of(2021, 3, 1)).
    - from(LocalDate) creates a closed one-date range, represented internally as one
      day.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A range created from a Year temporal.
    preconditions:
    - Construct source as LocalDateRange.from(Year.of(2020)).
    - The resulting range spans 2020-01-01 through the exclusive endpoint after 2020-12-31,
      for 366 days.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - The follow-up length is 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A range created from a YearMonth temporal.
    preconditions:
    - Construct source as LocalDateRange.from(YearMonth.of(2020, 2)).
    - The resulting range covers leap-year February and has 29 days.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A range created from a YearHalf temporal.
    preconditions:
    - Construct source from a YearHalf value supported by LocalDateRange.from.
    - The resulting range is finite, has a valid end no later than LocalDate.MAX.minusDays(23),
      and spans the half-year represented by that temporal.
    expectedSourceBehavior:
    - lengthInDays() returns the whole-day difference between the generated start
      and exclusive end.
    - The follow-up output is exactly 23 greater unless the source output is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A range created from a YearQuarter temporal.
    preconditions:
    - Construct source from a YearQuarter value supported by LocalDateRange.from.
    - The resulting quarter range is finite and its end permits plusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns the quarter's endpoint day difference.
    - The follow-up output is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A range created from a YearWeek temporal.
    preconditions:
    - Construct source from a YearWeek value supported by LocalDateRange.from.
    - The generated Monday-to-exclusive-after-Sunday range is finite and permits the
      follow-up.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up length is 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FACTORY
    category: EDGE
    description: A range unbounded at the start but bounded at a finite end.
    preconditions:
    - Construct source as LocalDateRange.ofUnboundedStart(2020-01-10).
    - The start is LocalDate.MIN and the end is finite.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range sentinel.
    - The relation assertion skips arithmetic because sourceOutput is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_WITH_MINIMUM_VALID_END
    category: BOUNDARY
    description: An unbounded-start range using the earliest endpoint permitted by
      the constructor.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.MIN, LocalDate.MIN.plusDays(2)).
    - The end is the first value above the prohibited LocalDate.MIN and LocalDate.MIN.plusDays(1)
      endpoints.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - The follow-up remains unbounded at the start and the relation skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_FINITE_ONE_DAY
    category: BOUNDARY
    description: The smallest finite one-day range near LocalDate.MIN.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.MIN.plusDays(2), LocalDate.MIN.plusDays(3)).
    - Neither endpoint is prohibited and the mathematical length is 1.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_FINITE_EMPTY_ALLOWED
    category: EDGE
    description: An empty range at the first date where an empty range is constructible
      near LocalDate.MIN.
    preconditions:
    - Construct source as LocalDateRange.ofEmpty(LocalDate.MIN.plusDays(2)).
    - The empty location is not one of the four prohibited empty-range locations.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up length is 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: FOLLOW_UP_END_BECOMES_MAX
    category: BOUNDARY
    description: A finite source whose 23-day extension reaches LocalDate.MAX and
      therefore becomes unbounded at the end.
    preconditions:
    - Use a finite source with end equal to LocalDate.MAX.minusDays(23) and a valid
      start before that end.
    - The source end is allowed, while the generated follow-up end is LocalDate.MAX.
    expectedSourceBehavior:
    - The source length is finite unless its start is LocalDate.MIN.
    - The follow-up lengthInDays() returns Integer.MAX_VALUE because the follow-up
      has an unbounded end.
    - The relation assertion skips arithmetic when it sees the follow-up sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_MAX_FINITE_FOLLOW_UP
    category: BOUNDARY
    description: A one-day finite range whose follow-up ends at LocalDate.MAX.minusDays(1),
      still a finite endpoint.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24)).
    - The source end is LocalDate.MAX.minusDays(24), so adding 23 days yields LocalDate.MAX.minusDays(1),
      not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up remains finite and lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_JUST_BELOW_INT_MAX
    category: BOUNDARY
    description: A finite range whose mathematical length is Integer.MAX_VALUE minus
      23, so the follow-up reaches the Integer.MAX_VALUE sentinel value numerically.
    preconditions:
    - Choose valid dates with end.toEpochDay() - start.toEpochDay() = 2147483624.
    - Ensure end <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 2147483624.
    - The follow-up mathematical length is Integer.MAX_VALUE, so followUpOutput equals
      the sentinel and the relation skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_EXACTLY_INT_MAX
    category: EDGE
    description: A finite range whose mathematical length is exactly Integer.MAX_VALUE.
    preconditions:
    - Choose valid dates with end.toEpochDay() - start.toEpochDay() = 2147483647 and
      end <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE even though the range is finite.
    - The relation skips because the source output equals the unbounded-range sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_JUST_ABOVE_INT_MAX
    category: EDGE
    description: A finite range whose mathematical length is Integer.MAX_VALUE plus
      one.
    preconditions:
    - Choose valid dates with end.toEpochDay() - start.toEpochDay() = 2147483648.
    - Ensure end <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() exposes the int narrowing result, Integer.MIN_VALUE.
    - The follow-up output is Integer.MIN_VALUE plus 23 and neither output is the
      sentinel, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_EXACT_INT_WRAP
    category: EDGE
    description: A finite range whose mathematical length is exactly 2^32 days, producing
      a narrowed length of zero.
    preconditions:
    - Choose valid dates with end.toEpochDay() - start.toEpochDay() = 4294967296.
    - Ensure end <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 0 despite the range being non-empty, exercising int narrowing.
    - The follow-up output is 23 and the relation observes an increase of 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: FINITE_LENGTH_BEYOND_INT_WRAP
    category: EDGE
    description: A finite range with a day count just above 2^32, producing a small
      positive narrowed result.
    preconditions:
    - Choose valid dates with end.toEpochDay() - start.toEpochDay() = 4294967297.
    - Ensure end <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 1 after int narrowing.
    - The follow-up output returns 24 and the relation observes an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_EMPTY_DATE_RANGE
    category: EDGE
    description: An empty range obtained through the date/date parsing path.
    preconditions:
    - Parse source as LocalDateRange.parse("2021-03-01/2021-03-01").
    - The parsed start equals the parsed end at an allowed empty location.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up range has length 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: ORDINARY_RANGE_STARTING_AT_LOCAL_DATE_MIN_PLUS_ONE
    category: BOUNDARY
    description: A non-empty finite range beginning at LocalDate.MIN.plusDays(1),
      which is allowed when the end is later.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)).
    - The end is not the prohibited MIN-plus-one endpoint, and the range length is
      1.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_NEAR_FOLLOW_UP_LIMIT
    category: BOUNDARY
    description: A closed range whose conversion produces the latest finite source
      end that still permits the follow-up.
    preconditions:
    - Choose a valid closed-range inclusive end of LocalDate.MAX.minusDays(24), so
      ofClosed produces exclusive end LocalDate.MAX.minusDays(23).
    - Use a start before or equal to that inclusive end.
    expectedSourceBehavior:
    - The source is finite and its follow-up reaches an unbounded end.
    - The follow-up sentinel causes the relation assertion to skip.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_RANGE_WITH_ZERO_NARROWED_OUTPUT
    category: EDGE
    description: A non-empty finite range whose day difference narrows to zero without
      using the exact 2^32 construction.
    preconditions:
    - Choose any valid finite range with a mathematical day count equal to a positive
      multiple of 2^32 and with end <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 0 even though start and end differ.
    - The follow-up result is 23 and the relation is non-vacuously checked.
    targetCases: 1
    emptyOutputAllowed: true
  - id: FINITE_RANGE_WITH_NEGATIVE_NARROWED_OUTPUT
    category: EDGE
    description: A finite range whose mathematical day count exceeds Integer.MAX_VALUE
      but is not an exact multiple of 2^32.
    preconditions:
    - Choose valid finite dates with a mathematical length in (Integer.MAX_VALUE,
      4294967296) and end <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns the corresponding negative int narrowing result.
    - The follow-up output differs by 23 under int subtraction, so the metamorphic
      assertion performs real arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
