InputDomain:
  summary: Non-null HTML body fragments and base-URI strings cleaned with every supplied
    Safelist construction family, emphasizing filtering, URL resolution, parsing normalization,
    and empty-output paths relevant to idempotence.
  globalConstraints:
  - bodyHtml is a non-null java.lang.String, because generateFollowUp rejects null
    before invoking the target.
  - baseUri is a non-null java.lang.String, because generateFollowUp rejects null
    before invoking the target; both empty and non-empty strings are included.
  - safelist is non-null and is constructed only by new Safelist(), new Safelist(existingSafelist),
    Safelist.none(), Safelist.simpleText(), Safelist.basic(), Safelist.basicWithImages(),
    or Safelist.relaxed().
  - Safelist instances must report preserveRelativeLinks() == false. The supplied
    construction metadata provides no operation for creating the true setting, so
    the DummyUri branch cannot be requested without inventing an unavailable mutator.
  - No null-input or other exception-oriented cases are included, because the metamorphic
    relation requires all three source arguments to be non-null and does not request
    invalid inputs.
  - Each source invocation and its generated follow-up reuse the same baseUri value
    and the same Safelist object, exactly as specified by generateFollowUp.
  diversity:
    bodyForm:
    - empty
    - plain text
    - whitespace-only
    - entities
    - Unicode
    - control character
    - well-formed markup
    - malformed markup
    - document-like markup
    filteringPath:
    - text only
    - allowed tag
    - disallowed tag
    - unsafe attribute
    - comment
    - script or style data
    - mixed safe and unsafe content
    safelistConstruction:
    - new Safelist()
    - copy constructor
    - none()
    - simpleText()
    - basic()
    - basicWithImages()
    - relaxed()
    baseUriClass:
    - empty
    - absolute HTTP
    - absolute HTTPS with path
    - syntactically unusual non-empty string
    urlClass:
    - absolute allowed protocol
    - relative path
    - root-relative path
    - fragment or query reference
    - protocol-relative
    - disallowed protocol
    - obfuscated protocol
    parserCondition:
    - balanced
    - misnested
    - unclosed
    - duplicate attribute
    - full-document tokens in body fragment
    outputClass:
    - empty
    - text-only
    - retained markup
    - attribute removed
    - URL resolved or removed
    - normalized serialization
  scenarios:
  - id: EMPTY_BODY
    category: BOUNDARY
    description: Clean the minimum-length body fragment.
    preconditions:
    - bodyHtml.length() == 0.
    - baseUri is either empty or a non-empty absolute HTTP URI.
    - safelist is any supplied construction.
    expectedSourceBehavior:
    - The returned body-fragment HTML is empty.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PLAIN_ASCII_TEXT
    category: NORMAL
    description: Clean non-markup ASCII text that requires no tag filtering.
    preconditions:
    - bodyHtml is non-empty ASCII text containing no '<', '>', or '&'.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - The visible text remains in the returned HTML, demonstrating a non-empty text-node
      path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WHITESPACE_ONLY_BODY
    category: BOUNDARY
    description: Clean fragments containing only HTML whitespace.
    preconditions:
    - bodyHtml consists only of spaces, tabs, carriage returns, or line feeds.
    - Use one single-line and one multi-line fragment.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Cleaning completes and serializes the whitespace-only body without introducing
      permitted elements.
    targetCases: 2
    emptyOutputAllowed: true
  - id: CHARACTER_REFERENCE_NORMALIZATION
    category: EDGE
    description: Exercise parsing and serialization of named and numeric HTML character
      references.
    preconditions:
    - One bodyHtml contains '&amp;', '&lt;', and '&gt;' in text.
    - One bodyHtml contains both a decimal and hexadecimal numeric character reference.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - The returned value is HTML text with characters escaped or normalized as required
      by body HTML serialization.
    - The returned value remains non-empty.
    targetCases: 2
    emptyOutputAllowed: false
  - id: UNICODE_TEXT
    category: EDGE
    description: Clean text containing non-ASCII characters without relying on markup.
    preconditions:
    - One bodyHtml contains accented or non-Latin BMP characters.
    - One bodyHtml contains a supplementary Unicode character represented by a surrogate
      pair.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - The Unicode text is represented in the non-empty returned HTML rather than being
      removed as an unsafe element.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EMBEDDED_NUL_TEXT
    category: EDGE
    description: Exercise parser handling of a Java string containing an embedded
      NUL character.
    preconditions:
    - bodyHtml equals a non-empty text prefix, followed by '\u0000', followed by a
      non-empty text suffix.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Cleaning completes and the parser's normalized representation retains surrounding
      text.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONE_STRIPS_ELEMENTS
    category: NORMAL
    description: Use the documented text-node-only Safelist.none policy on element
      markup.
    preconditions:
    - One bodyHtml is '<p>alpha</p>'.
    - One bodyHtml is '<div><b>beta</b></div>'.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Element tags are absent from the result while their ordinary text content remains.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NONE_ESCAPES_LITERAL_TEXT
    category: NORMAL
    description: Verify that Safelist.none returns HTML rather than unescaped plain
      text.
    preconditions:
    - bodyHtml contains '<p>5 is &lt; 6 &amp; 7 is &gt; 3.</p>'.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - The paragraph element is removed.
    - The comparison and ampersand characters are safely represented in the returned
      HTML text.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_CONSTRUCTED_SAFELIST
    category: NORMAL
    description: Exercise the public zero-argument Safelist construction independently
      of named presets.
    preconditions:
    - safelist is constructed with new Safelist().
    - bodyHtml contains nested markup and non-empty ordinary text.
    expectedSourceBehavior:
    - Cleaning applies the constructed safelist and preserves a non-empty textual
      result even if no input elements are permitted.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COPY_CONSTRUCTED_SAFELIST
    category: NORMAL
    description: Exercise a Safelist created with the supplied copy constructor.
    preconditions:
    - safelist is new Safelist(Safelist.none()).
    - bodyHtml contains an element around non-empty ordinary text.
    expectedSourceBehavior:
    - The copied text-node-only policy removes the element while retaining its ordinary
      text.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_ALLOWED_FORMATTING
    category: NORMAL
    description: Clean inline emphasis markup under the simple-text preset.
    preconditions:
    - bodyHtml contains nested '<b>', '<em>', '<i>', '<strong>', and '<u>' elements
      with text.
    - safelist is Safelist.simpleText().
    expectedSourceBehavior:
    - Permitted simple formatting remains as markup and its text remains non-empty.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_BLOCK_ELEMENT
    category: NORMAL
    description: Contrast a block element with simple inline formatting under Safelist.simpleText.
    preconditions:
    - bodyHtml contains a '<p>' wrapping a '<strong>' element and non-empty text.
    - safelist is Safelist.simpleText().
    expectedSourceBehavior:
    - The result retains the ordinary text and permitted inline formatting while filtering
      markup outside the policy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_TEXT_STRUCTURE
    category: NORMAL
    description: Exercise common body structure and inline markup under Safelist.basic.
    preconditions:
    - bodyHtml contains a paragraph, a list, emphasis, and non-empty text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The result is non-empty and retains markup permitted by the basic policy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_MIXED_SAFE_UNSAFE_TAGS
    category: NORMAL
    description: Mix basic body markup with an unknown custom element.
    preconditions:
    - bodyHtml contains a '<p>' and an '<unknown-tag>' with distinct ordinary text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The known permitted body markup remains.
    - The unknown element itself is absent while ordinary text remains available.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_REMOVES_IMAGE_ELEMENT
    category: NORMAL
    description: Exercise the distinction between basic and image-enabled policies.
    preconditions:
    - bodyHtml consists of an '<img>' with an absolute HTTPS src and alt text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The image element is removed by the non-image basic policy.
    targetCases: 1
    emptyOutputAllowed: true
  - id: BASIC_WITH_IMAGES_RETAINS_IMAGE
    category: NORMAL
    description: Clean an image with a permitted absolute URL under the image-enabled
      preset.
    preconditions:
    - bodyHtml contains an '<img>' with an absolute HTTPS src and an alt attribute.
    - safelist is Safelist.basicWithImages().
    expectedSourceBehavior:
    - The returned HTML contains a retained image element and permitted image attributes.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_RICH_STRUCTURE
    category: NORMAL
    description: Exercise richer structural markup under Safelist.relaxed.
    preconditions:
    - One bodyHtml contains a heading followed by a div and paragraph.
    - One bodyHtml contains table, row, and cell markup with cell text.
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - The result remains non-empty and retains rich structural markup permitted by
      the relaxed policy.
    targetCases: 2
    emptyOutputAllowed: false
  - id: HTML_COMMENT_REMOVAL
    category: NORMAL
    description: Clean a comment placed between two text nodes.
    preconditions:
    - bodyHtml contains non-empty text, an HTML comment, and more non-empty text.
    - safelist is any named preset.
    expectedSourceBehavior:
    - The comment is absent from the returned body HTML.
    - The surrounding ordinary text remains.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SCRIPT_AND_STYLE_FILTERING
    category: NORMAL
    description: Exercise unsafe executable or styling elements alongside safe text.
    preconditions:
    - One bodyHtml contains a '<script>' followed by a paragraph with safe text.
    - One bodyHtml contains a '<style>' followed by a paragraph with safe text.
    - safelist is Safelist.basic() or Safelist.relaxed().
    expectedSourceBehavior:
    - The script or style element is absent from the returned HTML.
    - The distinct safe paragraph text remains, preventing an empty-result-only test.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EVENT_HANDLER_ATTRIBUTE
    category: NORMAL
    description: Filter an event-handler attribute from otherwise usable markup.
    preconditions:
    - bodyHtml contains a permitted element with onclick='alert(1)' and non-empty
      text.
    - safelist is Safelist.basic() or Safelist.relaxed().
    expectedSourceBehavior:
    - The onclick attribute is absent from the result.
    - The element's ordinary text remains.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNKNOWN_ATTRIBUTE
    category: NORMAL
    description: Filter attributes that are not part of the selected policy.
    preconditions:
    - bodyHtml contains a permitted element with data-unknown='x' and class='c', plus
      non-empty text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Attributes not permitted by the safelist are absent from the cleaned markup.
    - The text remains non-empty.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ABSOLUTE_ALLOWED_LINK_PROTOCOLS
    category: NORMAL
    description: Clean links using ordinary absolute web URLs.
    preconditions:
    - One bodyHtml contains an anchor with an absolute HTTP href.
    - One bodyHtml contains an anchor with an absolute HTTPS href.
    - Each anchor contains non-empty link text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The anchor and permitted absolute href survive cleaning.
    - Any safelist-enforced anchor attributes are present in the normalized output.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DISALLOWED_LINK_PROTOCOLS
    category: NORMAL
    description: Exercise protocol filtering for unsafe or non-web link schemes.
    preconditions:
    - Use separate anchors whose href starts with 'javascript:', 'data:', and 'file:'.
    - Each anchor contains non-empty text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The disallowed href is absent from each result.
    - The anchor text remains non-empty.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OBFUSCATED_UNSAFE_PROTOCOL
    category: EDGE
    description: Exercise protocol checks after HTML parsing and normalization.
    preconditions:
    - One anchor href uses mixed letter case for the javascript scheme.
    - One anchor href uses a character reference inside the javascript scheme.
    - Each anchor contains non-empty text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The unsafe href does not survive merely because its spelling is obfuscated.
    - The ordinary link text remains.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RELATIVE_LINK_WITH_BASE_URI
    category: NORMAL
    description: Resolve relative links against a supplied non-empty base URI.
    preconditions:
    - One bodyHtml has href='child/page' and baseUri='https://example.test/root/'.
    - One bodyHtml has href='/rooted' and baseUri='http://example.test/a/b'.
    - Each anchor has non-empty text.
    - safelist is Safelist.basic().
    - safelist.preserveRelativeLinks() == false.
    expectedSourceBehavior:
    - A retained href is serialized as an absolute URL derived from baseUri.
    - The anchor text remains non-empty.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RELATIVE_LINK_WITHOUT_USABLE_BASE
    category: EDGE
    description: Clean a relative URL when no usable absolute resolution base is available.
    preconditions:
    - One case uses baseUri.length() == 0.
    - One case uses a non-empty syntactically unusual baseUri such as 'not a URI'.
    - bodyHtml contains an anchor with href='relative/path' and non-empty text.
    - safelist is Safelist.basic().
    - safelist.preserveRelativeLinks() == false.
    expectedSourceBehavior:
    - A relative href that cannot pass protocol validation through absolute resolution
      is removed.
    - The link text remains non-empty.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FRAGMENT_AND_QUERY_REFERENCES
    category: EDGE
    description: Resolve short relative references against an absolute base URI.
    preconditions:
    - One anchor has href='#section'.
    - One anchor has href='?page=2'.
    - baseUri is 'https://example.test/path/document'.
    - Each anchor has non-empty text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Any retained href is normalized through the supplied absolute base URI.
    - The returned link text remains non-empty.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PROTOCOL_RELATIVE_LINK
    category: EDGE
    description: Resolve a network-path reference using the scheme of the base URI.
    preconditions:
    - bodyHtml contains an anchor with href='//cdn.example.test/resource' and non-empty
      text.
    - baseUri begins with 'https://'.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - A retained href is normalized to an absolute HTTPS URL.
    - The anchor text remains non-empty.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_NON_HTTP_LINK_PROTOCOLS
    category: NORMAL
    description: Exercise additional link protocols admitted by the basic link policy.
    preconditions:
    - One bodyHtml contains an anchor with a 'mailto:' href.
    - One bodyHtml contains an anchor with an 'ftp:' href.
    - Each anchor contains non-empty text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The anchor and protocol-valid href remain in normalized output.
    targetCases: 2
    emptyOutputAllowed: false
  - id: IMAGE_PROTOCOL_FILTERING
    category: NORMAL
    description: Contrast allowed and disallowed image source protocols.
    preconditions:
    - One image src is an absolute HTTPS URL.
    - One image src uses the 'javascript:' scheme.
    - Each image has an alt attribute.
    - safelist is Safelist.basicWithImages().
    expectedSourceBehavior:
    - The HTTPS source is retained.
    - The unsafe source attribute is removed from its image rather than accepted as
      a URL.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INPUT_BASE_ELEMENT_RESOLUTION
    category: EDGE
    description: Exercise parser URL resolution when the body fragment declares a
      base element.
    preconditions:
    - baseUri.length() == 0.
    - bodyHtml contains '<base href="https://example.test/base/">' before an anchor
      with href='child' and non-empty text.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The base element itself is not emitted as permitted body content.
    - Its parsed base URL may qualify the relative anchor href, which is emitted only
      in safelist-valid normalized form.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MISNESTED_MARKUP
    category: EDGE
    description: Clean markup whose element close order is misnested.
    preconditions:
    - bodyHtml contains crossing inline tags such as '<b><i>text</b>tail</i>'.
    - safelist is Safelist.simpleText().
    expectedSourceBehavior:
    - The parser produces balanced normalized markup containing both text segments.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNCLOSED_MARKUP
    category: EDGE
    description: Clean a fragment ending with unclosed permitted elements.
    preconditions:
    - bodyHtml ends after nested permitted start tags and non-empty text, without
      corresponding end tags.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The returned body HTML is a balanced serialization with the text retained.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DUPLICATE_ATTRIBUTES
    category: EDGE
    description: Exercise parser normalization of duplicate attributes before safelist
      filtering.
    preconditions:
    - bodyHtml contains an anchor with two href attributes and non-empty text.
    - At least one href uses an absolute HTTP or HTTPS URL.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The returned anchor has at most one normalized href attribute.
    - Any retained href satisfies the safelist protocol policy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DOCUMENT_TOKENS_AS_BODY_FRAGMENT
    category: EDGE
    description: Pass html, head, title, and body tokens even though the target parses
      a body fragment.
    preconditions:
    - bodyHtml resembles a complete document and includes distinct title and body
      text.
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - The result is serialized only as cleaned body-fragment HTML rather than as a
      complete document.
    - Safe body text remains non-empty and structural tokens are normalized or filtered
      according to fragment parsing and the safelist.
    targetCases: 1
    emptyOutputAllowed: false
