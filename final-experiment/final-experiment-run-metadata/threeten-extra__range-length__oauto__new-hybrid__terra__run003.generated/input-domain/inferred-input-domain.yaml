InputDomain:
  summary: Valid LocalDateRange receivers whose end can be extended by exactly 23
    days; covers finite lengths, empty ranges, construction routes, LocalDate endpoint
    rules, unbounded-start sentinel behavior, and int-length saturation.
  globalConstraints:
  - Each source receiver must be a successfully constructed LocalDateRange with start
    <= end and must satisfy the class's documented endpoint restrictions.
  - The source end must satisfy end <= LocalDate.MAX.minusDays(23), because generateFollowUp
    unconditionally evaluates range.getEnd().plusDays(23).
  - Ranges with end in [LocalDate.MAX.minusDays(22), LocalDate.MAX], including ofUnbounded(),
    ofUnboundedEnd(...), ALL, and valid ranges ending at LocalDate.MAX, are excluded
    because follow-up generation throws before assertRelation can apply.
  - Invalid construction inputs are excluded because the supplied metamorphic relation
    specifies no expected exception relation for invalid source inputs.
  diversity:
    constructionRoute:
    - distinct
    - receiver factory or parser path
    - '[of(LocalDate, LocalDate), of(LocalDate, Period), ofClosed, ofEmpty, parse-date-date,
      parse-date-period, parse-period-date, from-LocalDate, from-LocalDateTime, from-Year,
      from-YearMonth, from-YearHalf, from-YearQuarter, from-YearWeek, ofUnboundedStart]'
    boundednessAndLength:
    - distinct
    - source output and relation-relevant day-count region
    - '[empty-0, finite-small, finite-calendar-dependent, unbounded-start-sentinel,
      Integer.MAX_VALUE-minus-24, Integer.MAX_VALUE-minus-23, Integer.MAX_VALUE-minus-22,
      Integer.MAX_VALUE, greater-than-Integer.MAX_VALUE]'
    datePosition:
    - distinct
    - position relative to LocalDate.MIN/MAX and calendar boundaries
    - '[ordinary, leap-day, year-boundary, LocalDate.MIN-plus-1, LocalDate.MIN, LocalDate.MAX-minus-24-end,
      far-future-within-int-boundary]'
  scenarios:
  - id: HALF_OPEN_EMPTY_ORDINARY_DATE
    category: BOUNDARY
    description: A valid empty half-open range at an ordinary date, constructed with
      of(start, end).
    preconditions:
    - start = end = LocalDate.of(2024, 6, 15).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_ONE_DAY
    category: BOUNDARY
    description: The smallest non-empty ordinary half-open range.
    preconditions:
    - start = LocalDate.of(2024, 6, 15) and end = start.plusDays(1).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_LEAP_DAY_CROSSING
    category: NORMAL
    description: A finite range crossing leap day in a leap year.
    preconditions:
    - start = LocalDate.of(2024, 2, 28) and end = LocalDate.of(2024, 3, 1).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up remains finite and is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_YEAR_BOUNDARY
    category: NORMAL
    description: A finite range crossing a calendar-year boundary.
    preconditions:
    - start = LocalDate.of(2023, 12, 31) and end = LocalDate.of(2024, 1, 2).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up remains finite and is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO_EMPTY
    category: BOUNDARY
    description: An empty range produced by the start-plus-zero-period construction
      path.
    preconditions:
    - start = LocalDate.of(2024, 6, 15) and period = Period.ZERO.
    - Receiver is LocalDateRange.of(start, period).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_ACROSS_LEAP_FEBRUARY
    category: NORMAL
    description: A positive calendar Period whose resolved end crosses leap-year February.
    preconditions:
    - start = LocalDate.of(2024, 1, 31) and period = Period.ofMonths(1).
    - Receiver is LocalDateRange.of(start, period), with computed end LocalDate.of(2024,
      2, 29).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up remains finite and is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE
    category: BOUNDARY
    description: A closed range containing exactly one date.
    preconditions:
    - startInclusive = endInclusive = LocalDate.of(2024, 6, 15).
    - Receiver is LocalDateRange.ofClosed(startInclusive, endInclusive).
    expectedSourceBehavior:
    - The internally exclusive end is 2024-06-16.
    - lengthInDays() returns 1 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DATE
    category: NORMAL
    description: A multi-day closed range, exercising conversion of an inclusive end
      to an exclusive stored end.
    preconditions:
    - startInclusive = LocalDate.of(2024, 6, 10) and endInclusive = LocalDate.of(2024,
      6, 15).
    - Receiver is LocalDateRange.ofClosed(startInclusive, endInclusive).
    expectedSourceBehavior:
    - The internally exclusive end is 2024-06-16.
    - lengthInDays() returns 6 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_EMPTY_FACTORY
    category: BOUNDARY
    description: An empty range produced through the dedicated ofEmpty factory.
    preconditions:
    - date = LocalDate.of(2024, 6, 15).
    - Receiver is LocalDateRange.ofEmpty(date).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A date/date textual range parsed as a half-open range.
    preconditions:
    - text = "2024-06-10/2024-06-15".
    - Receiver is LocalDateRange.parse(text).
    expectedSourceBehavior:
    - lengthInDays() returns 5.
    - Follow-up remains finite and is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: A date/Period textual range parsed by adding the period to its start.
    preconditions:
    - text = "2024-02-28/P3D".
    - Receiver is LocalDateRange.parse(text).
    expectedSourceBehavior:
    - The parsed end is 2024-03-02.
    - lengthInDays() returns 3 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: A Period/date textual range parsed by subtracting the period from
      its end.
    preconditions:
    - text = "P3D/2024-03-02".
    - Receiver is LocalDateRange.parse(text).
    expectedSourceBehavior:
    - The parsed start is 2024-02-28.
    - lengthInDays() returns 3 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A LocalDate temporal converted by the local-date query branch of
      from(Temporal).
    preconditions:
    - temporal = LocalDate.of(2024, 6, 15).
    - Receiver is LocalDateRange.from(temporal).
    expectedSourceBehavior:
    - from(Temporal) creates a one-day closed range for the date.
    - lengthInDays() returns 1 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TIME
    category: NORMAL
    description: A complete temporal with a time component converted through its queried
      LocalDate.
    preconditions:
    - temporal provides local date 2024-06-15 and a time component.
    - Receiver is LocalDateRange.from(temporal).
    expectedSourceBehavior:
    - from(Temporal) ignores the time component after obtaining the local date.
    - lengthInDays() returns 1 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: NORMAL
    description: A leap-year Temporal converted through the Year branch.
    preconditions:
    - temporal is Year.of(2024).
    - Receiver is LocalDateRange.from(temporal).
    expectedSourceBehavior:
    - The range spans 2024-01-01 through the exclusive end 2025-01-01.
    - lengthInDays() returns 366 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEAR_MONTH
    category: NORMAL
    description: A leap-February YearMonth converted through the YearMonth branch.
    preconditions:
    - temporal is YearMonth.of(2024, 2).
    - Receiver is LocalDateRange.from(temporal).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up remains finite and is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A first-half-of-leap-year temporal converted through the YearHalf
      branch.
    preconditions:
    - temporal is a YearHalf representing the first half of 2024.
    - Receiver is LocalDateRange.from(temporal).
    expectedSourceBehavior:
    - The range covers 2024-01-01 through the exclusive end 2024-07-01.
    - lengthInDays() returns 182 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A first-quarter leap-year temporal converted through the YearQuarter
      branch.
    preconditions:
    - temporal is a YearQuarter representing the first quarter of 2024.
    - Receiver is LocalDateRange.from(temporal).
    expectedSourceBehavior:
    - The range covers 2024-01-01 through the exclusive end 2024-04-01.
    - lengthInDays() returns 91 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_ISO_WEEK_ACROSS_YEAR
    category: NORMAL
    description: An ISO week whose Monday-through-Sunday range crosses a calendar-year
      boundary.
    preconditions:
    - temporal is a YearWeek representing ISO week 53 of 2020.
    - Receiver is LocalDateRange.from(temporal).
    expectedSourceBehavior:
    - The range covers Monday 2020-12-28 through exclusive Monday 2021-01-04.
    - lengthInDays() returns 7 and the finite follow-up is exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_NEAR_MINIMUM
    category: EDGE
    description: An unbounded-start range at the lowest valid exclusive-end boundary.
    preconditions:
    - end = LocalDate.MIN.plusDays(2).
    - Receiver is LocalDateRange.ofUnboundedStart(end).
    expectedSourceBehavior:
    - The source is unbounded at the start.
    - lengthInDays() returns Integer.MAX_VALUE, so assertRelation skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: An unbounded-start range with an ordinary finite end.
    preconditions:
    - end = LocalDate.of(2024, 6, 15).
    - Receiver is LocalDateRange.ofUnboundedStart(end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE for the unbounded range.
    - The follow-up remains unbounded at the start and assertRelation skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_HIGHEST_FOLLOWUP_SAFE_END
    category: EDGE
    description: An unbounded-start source whose end is the greatest value that can
      be extended by 23 days.
    preconditions:
    - end = LocalDate.MAX.minusDays(23).
    - Receiver is LocalDateRange.ofUnboundedStart(end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the source start is unbounded.
    - The follow-up end becomes LocalDate.MAX and remains sentinel-valued.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_RANGE_ADJACENT_TO_LOCALDATE_MIN
    category: EDGE
    description: The shortest valid bounded range near LocalDate.MIN without using
      an illegal end.
    preconditions:
    - start = LocalDate.MIN.plusDays(1) and end = LocalDate.MIN.plusDays(2).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up is valid, finite, and exactly 23 days longer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGHEST_SAFE_END_ONE_DAY_RANGE
    category: EDGE
    description: A one-day bounded source whose follow-up end becomes LocalDate.MAX.
    preconditions:
    - end = LocalDate.MAX.minusDays(23) and start = end.minusDays(1).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - Source lengthInDays() returns 1.
    - Follow-up has end LocalDate.MAX, is unbounded at the end, returns Integer.MAX_VALUE,
      and is skipped by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INTEGER_MAX_MINUS_24
    category: BOUNDARY
    description: A finite bounded range just below the follow-up saturation threshold.
    preconditions:
    - start = LocalDate.of(0, 1, 1).
    - end = start.plusDays(Integer.MAX_VALUE - 24L).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24.
    - Follow-up length is Integer.MAX_VALUE - 1, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INTEGER_MAX_MINUS_23
    category: BOUNDARY
    description: A finite bounded range whose follow-up reaches the Integer.MAX_VALUE
      result boundary exactly.
    preconditions:
    - start = LocalDate.of(0, 1, 1).
    - end = start.plusDays(Integer.MAX_VALUE - 23L).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - Follow-up lengthInDays() returns Integer.MAX_VALUE, causing assertRelation to
      skip arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INTEGER_MAX_MINUS_22
    category: BOUNDARY
    description: A finite bounded range whose follow-up exceeds the representable
      finite int length.
    preconditions:
    - start = LocalDate.of(0, 1, 1).
    - end = start.plusDays(Integer.MAX_VALUE - 22L).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 22.
    - Follow-up lengthInDays() returns Integer.MAX_VALUE and assertRelation skips
      arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INTEGER_MAX_EXACT
    category: BOUNDARY
    description: A bounded range whose actual whole-day length equals Integer.MAX_VALUE.
    preconditions:
    - start = LocalDate.of(0, 1, 1).
    - end = start.plusDays(Integer.MAX_VALUE).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The source sentinel value causes assertRelation to skip arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_GREATER_THAN_INTEGER_MAX
    category: EDGE
    description: A bounded range longer than Integer.MAX_VALUE whole days, exercising
      length saturation without unbounded endpoints.
    preconditions:
    - start = LocalDate.of(0, 1, 1).
    - end = start.plusDays(((long) Integer.MAX_VALUE) + 1L).
    - Receiver is LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - The actual day count exceeds Integer.MAX_VALUE.
    - lengthInDays() returns Integer.MAX_VALUE and assertRelation skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
