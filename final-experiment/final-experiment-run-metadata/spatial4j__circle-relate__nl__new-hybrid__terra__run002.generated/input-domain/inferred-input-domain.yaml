InputDomain:
  summary: Finite non-empty Cartesian circles and finite non-empty rectangles in a
    non-geo SpatialContext. Source cases use center C=(0,0), radius 1 unless stated
    otherwise; each follow-up translates both C and all rectangle bounds by the same
    finite non-zero vector (dx,dy), preserving radius, width, and height.
  globalConstraints:
  - Use a non-geo SpatialContext whose distance calculator and shape construction
    accept every listed source coordinate and its translated coordinate.
  - For every rectangle, minX <= maxX and minY <= maxY; all listed bounds, center
    coordinates, radius values, and translation components are finite.
  - For every scenario, construct the follow-up with C'=(dx,dy) and rectangle bounds
    [minX+dx,maxX+dx] x [minY+dy,maxY+dy], using the identical radius; require (dx,dy)
    != (0,0).
  - Circle and rectangle must be non-empty because an empty center has no finite coordinate
    to slide, and the supplied direct relate(Rectangle) overload has no explicit empty-shape
    branch.
  - Degenerate rectangles with zero width and/or zero height are included only when
    the available Rectangle construction path accepts those finite bounds.
  diversity:
    boundingBoxRelation:
    - '4'
    - enclosingBox.relate(rectangle) before phase 2
    - '[DISJOINT, WITHIN, CONTAINS, INTERSECTS]'
    closestAxisPosition:
    - '9'
    - center position relative to rectangle x and y intervals
    - '[LEFT_BELOW, LEFT_INSIDE, LEFT_ABOVE, INSIDE_BELOW, INSIDE_INSIDE, INSIDE_ABOVE,
      RIGHT_BELOW, RIGHT_INSIDE, RIGHT_ABOVE]'
    phase2Outcome:
    - '3'
    - reachable relateRectanglePhase2 result
    - '[DISJOINT, INTERSECTS, CONTAINS]'
    rectangleDimensionality:
    - '3'
    - finite rectangle extent class
    - '[AREA, LINE, POINT]'
    radiusClass:
    - '2'
    - circle radius
    - '[POSITIVE_ONE, ZERO]'
    boundaryCondition:
    - '5'
    - exact geometric equality or tangency
    - '[BBOX_EQUALITY, BBOX_CONTAINMENT_TOUCH, SIDE_TANGENCY, CORNER_TANGENCY, FARTHEST_CORNER_TANGENCY]'
  scenarios:
  - id: BBOX_DISJOINT_RIGHT
    category: NORMAL
    description: The rectangle lies wholly to the right of the positive-radius circle
      bounding box.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[2,3] x [-0.5,0.5].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT without phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_LEFT
    category: NORMAL
    description: The rectangle lies wholly to the left of the circle bounding box.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-3,-2] x [-0.5,0.5].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_ABOVE
    category: NORMAL
    description: The rectangle lies wholly above the circle bounding box.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-0.5,0.5] x [2,3].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_BELOW
    category: NORMAL
    description: The rectangle lies wholly below the circle bounding box.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-0.5,0.5] x [-3,-2].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_BBOX_OVERLAP_DISJOINT_NORTHEAST
    category: NORMAL
    description: The bounding boxes overlap in the northeast, but the nearest rectangle
      corner is outside the circle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.8,2] x [0.8,2].
    - The closest corner is (0.8,0.8), whose distance from C is greater than 1.
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - Both axes are outside the rectangle intervals and contains(0.8,0.8) is false.
    - relate(rectangle) returns DISJOINT from phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_BBOX_OVERLAP_DISJOINT_NORTHWEST
    category: NORMAL
    description: The northwest counterpart exercises center-right and center-below
      closest-coordinate selection.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-2,-0.8] x [0.8,2].
    - The closest corner is (-0.8,0.8), whose distance from C is greater than 1.
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns DISJOINT after the closest-corner containment check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_BBOX_OVERLAP_DISJOINT_SOUTHWEST
    category: NORMAL
    description: The southwest counterpart exercises center-right and center-above
      closest-coordinate selection.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-2,-0.8] x [-2,-0.8].
    - The closest corner is (-0.8,-0.8), whose distance from C is greater than 1.
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns DISJOINT after the closest-corner containment check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_BBOX_OVERLAP_DISJOINT_SOUTHEAST
    category: NORMAL
    description: The southeast counterpart exercises center-left and center-above
      closest-coordinate selection.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.8,2] x [-2,-0.8].
    - The closest corner is (0.8,-0.8), whose distance from C is greater than 1.
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns DISJOINT after the closest-corner containment check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CORNER_TANGENCY_NORTHEAST
    category: BOUNDARY
    description: The northeast nearest corner lies exactly on the circle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.6,2] x [0.8,2].
    - The closest corner (0.6,0.8) is at distance exactly 1 from C.
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - contains(0.6,0.8) is true at the circle boundary.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CORNER_TANGENCY_NORTHWEST
    category: BOUNDARY
    description: The northwest nearest corner lies exactly on the circle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-2,-0.6] x [0.8,2].
    - The closest corner (-0.6,0.8) is at distance exactly 1 from C.
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CORNER_TANGENCY_SOUTHWEST
    category: BOUNDARY
    description: The southwest nearest corner lies exactly on the circle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-2,-0.6] x [-2,-0.8].
    - The closest corner (-0.6,-0.8) is at distance exactly 1 from C.
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CORNER_TANGENCY_SOUTHEAST
    category: BOUNDARY
    description: The southeast nearest corner lies exactly on the circle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.6,2] x [-2,-0.8].
    - The closest corner (0.6,-0.8) is at distance exactly 1 from C.
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_RIGHT_AXIS_OVERLAP
    category: NORMAL
    description: The center y-axis crosses the rectangle, while the center is left
      of the rectangle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.8,2] x [-0.2,0.2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - xAxis is left of the rectangle and yAxis lies inside its y interval.
    - The phase-2 disjoint corner check is skipped because yAxis equals closestY.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_LEFT_AXIS_OVERLAP
    category: NORMAL
    description: The center y-axis crosses the rectangle, while the center is right
      of the rectangle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-2,-0.8] x [-0.2,0.2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_ABOVE_AXIS_OVERLAP
    category: NORMAL
    description: The center x-axis crosses the rectangle, while the center is below
      the rectangle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-0.2,0.2] x [0.8,2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_BELOW_AXIS_OVERLAP
    category: NORMAL
    description: The center x-axis crosses the rectangle, while the center is above
      the rectangle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-0.2,0.2] x [-2,-0.8].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_VERTICAL_STRIP_THROUGH_CENTER
    category: NORMAL
    description: A vertical strip spans both sides of the circle and crosses both
      center axes.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-0.2,0.2] x [-2,2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - Both xAxis and yAxis lie within the rectangle intervals.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_HORIZONTAL_STRIP_THROUGH_CENTER
    category: NORMAL
    description: A horizontal strip spans both sides of the circle and crosses both
      center axes.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-2,2] x [-0.2,0.2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - Both xAxis and yAxis lie within the rectangle intervals.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_STRICT_RECTANGLE
    category: NORMAL
    description: The complete circle bounding box is strictly inside a larger rectangle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-2,2] x [-2,2].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN.
    - relate(rectangle) returns WITHIN without phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_TOUCHING_RECTANGLE
    category: BOUNDARY
    description: The rectangle contains the bounding box and shares its left and right
      bounds.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-1,1] x [-2,2].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_EQUALS_RECTANGLE_SPECIAL_WITHIN
    category: EDGE
    description: The rectangle equals the calculated circle bounding box, reaching
      the explicit equality correction.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-1,1] x [-1,1].
    expectedSourceBehavior:
    - bboxSect is CONTAINS and enclosingBox.equals(rectangle) is true.
    - relate(rectangle) returns WITHIN through the explicit bbox-equality edge case.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_RECTANGLE_NORTHEAST
    category: NORMAL
    description: A small northeast rectangle is wholly inside the circle; farthest-point
      selection uses maxX and maxY.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.1,0.5] x [0.1,0.5].
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - The selected farthest corner is (0.5,0.5), which is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_RECTANGLE_NORTHWEST
    category: NORMAL
    description: A small northwest rectangle is wholly inside the circle; farthest-point
      selection uses minX and maxY.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-0.5,-0.1] x [0.1,0.5].
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - The selected farthest corner is (-0.5,0.5), which is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_RECTANGLE_SOUTHWEST
    category: NORMAL
    description: A small southwest rectangle is wholly inside the circle; farthest-point
      selection uses minX and minY.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-0.5,-0.1] x [-0.5,-0.1].
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - The selected farthest corner is (-0.5,-0.5), which is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_RECTANGLE_SOUTHEAST
    category: NORMAL
    description: A small southeast rectangle is wholly inside the circle; farthest-point
      selection uses maxX and minY.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.1,0.5] x [-0.5,-0.1].
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - The selected farthest corner is (0.5,-0.5), which is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_CENTERED_RECTANGLE_FARTHEST_TIE
    category: EDGE
    description: A centered rectangle is inside the circle and gives equal opposite-axis
      farthest distances, exercising the strict greater-than tie choice.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-0.5,0.5] x [-0.5,0.5].
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - For each axis, equal endpoint distances select the minimum bound because the
      source uses a strict greater-than comparison.
    - The selected farthest corner is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_CIRCLE_INTERSECTS
    category: NORMAL
    description: The circle bounding box contains a wide rectangle, but its farthest
      corner lies outside the circle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-1,1] x [-0.2,0.2].
    - Each farthest rectangle corner has distance greater than 1 from C.
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - The farthest-point containment test is false.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_TANGENT_CONTAINS
    category: BOUNDARY
    description: The farthest rectangle corner is exactly on the circle boundary.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0,0.6] x [0,0.8].
    - The farthest corner (0.6,0.8) is at distance exactly 1 from C.
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - contains(0.6,0.8) is true at the boundary.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIDE_TANGENCY_INTERSECTS
    category: BOUNDARY
    description: The rectangle first touches the circle at the side point (1,0).
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[1,2] x [-0.2,0.2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - The rectangle touches the circle at (1,0).
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_VERTICAL_LINE_CONTAINED
    category: EDGE
    description: A zero-width vertical rectangle segment lies entirely inside the
      circle.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.2,0.2] x [-0.4,0.4].
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - The farthest endpoint is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_HORIZONTAL_LINE_INTERSECTS
    category: EDGE
    description: A zero-height horizontal rectangle segment crosses the circle boundary.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[-2,2] x [0.2,0.2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - The segment overlaps the circle but is not wholly contained.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_CONTAINED
    category: EDGE
    description: A point rectangle strictly inside the positive-radius circle is contained.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[0.3,0.3] x [0.4,0.4].
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - The sole rectangle point is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: A point rectangle lies exactly on the positive-radius circle boundary.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[1,1] x [0,0].
    expectedSourceBehavior:
    - The sole rectangle point is contained at distance exactly 1.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_OUTSIDE_BBOX
    category: EDGE
    description: A point rectangle lies outside the circle bounding box.
    preconditions:
    - C=(0,0), radius=1.
    - Rectangle=[2,2] x [0,0].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_CENTER_STRICTLY_IN_RECTANGLE
    category: EDGE
    description: A zero-radius circle has its center strictly inside a positive-area
      rectangle.
    preconditions:
    - C=(0,0), radius=0.
    - Rectangle=[-1,1] x [-1,1].
    expectedSourceBehavior:
    - The zero-size enclosing box is WITHIN the rectangle.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_CENTER_ON_RECTANGLE_BOUNDARY
    category: BOUNDARY
    description: A zero-radius circle center lies on a positive-area rectangle boundary.
    preconditions:
    - C=(0,0), radius=0.
    - Rectangle=[0,1] x [-1,1].
    expectedSourceBehavior:
    - The zero-size enclosing box is within the rectangle at its left boundary.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUAL_POINT_RECTANGLE
    category: EDGE
    description: The zero-radius circle bounding box equals a degenerate point rectangle.
    preconditions:
    - C=(0,0), radius=0.
    - Rectangle=[0,0] x [0,0].
    expectedSourceBehavior:
    - bboxSect is CONTAINS and enclosingBox.equals(rectangle) is true.
    - relate(rectangle) returns WITHIN through the bbox-equality correction.
    targetCases: 1
    emptyOutputAllowed: false
