InputDomain:
  summary: Non-null, day-capable Temporal endpoint pairs for which both the source
    invocation and the 37-day-shifted follow-up complete normally and produce an int-representable
    whole-day count.
  globalConstraints:
  - Both source endpoints are non-null, as required by generateFollowUp and by ChronoUnit.DAYS
    operations.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) must complete normally
    and return a value in the inclusive range [-2147483648, 2147483647], because Days.between
    applies Math.toIntExact.
  - Each endpoint must support plus(37, ChronoUnit.DAYS), and that operation must
    complete without temporal-range or arithmetic overflow.
  - ChronoUnit.DAYS.between on the two shifted endpoints must also complete normally
    and return an int-representable value so that assertRelation receives two Days
    outputs.
  - The endpoint pair must be mutually compatible for ChronoUnit.DAYS.between; unsupported
    combinations such as a date-time start that cannot obtain a time from a date-only
    end are outside this normal-output domain.
  - For ZonedDateTime pairs, use the same ZoneId or two fixed-offset zones. Different
    variable-offset zones are excluded because adding 37 local calendar days in different
    zone-rule systems is not necessarily a common translation under ChronoUnit.DAYS.between,
    so the supplied MR is not generally applicable.
  - Nulls, temporals that do not support DAYS, source or follow-up range overflow,
    and other exception-producing inputs are excluded because the supplied MR requests
    non-null Days outputs rather than invalid-input behavior.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - HijrahDate
    - ThaiBuddhistDate
    - MinguoDate
    - compatibleMixedTemporals
    resultSign:
    - negative
    - zero
    - positive
    resultSentinel:
    - zeroSingletonPath
    - oneSingletonPath
    - ordinaryDaysPath
    - integerMinimum
    - integerMaximum
    calendarBoundary:
    - sameDay
    - midnight
    - monthEnd
    - yearEnd
    - leapDay
    - prolepticYearBoundary
    - temporalMinimumVicinity
    - temporalMaximumVicinity
    precisionRelationship:
    - exactWholeDay
    - positiveFractionTruncated
    - negativeFractionTruncated
    - nanosecondAligned
    zoneRelationship:
    - UTC
    - positiveOffset
    - negativeOffset
    - differingFixedOffsets
    - daylightSavingGap
    - daylightSavingOverlap
    - fixedCrossZone
    direction:
    - forward
    - equal
    - reverse
  scenarios:
  - id: LOCAL_DATE_EQUAL_ENDPOINTS
    category: EDGE
    description: Identical LocalDate endpoints exercise the zero result and Days.of(0)
      sentinel path.
    preconditions:
    - startDateInclusive and endDateExclusive are both LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_FORWARD
    category: BOUNDARY
    description: Consecutive LocalDate values exercise the positive-one and Days.of(1)
      sentinel path.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15) and endDateExclusive is LocalDate.of(2024,
      6, 16).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_REVERSE
    category: BOUNDARY
    description: Reverse consecutive LocalDate values exercise a negative result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 16) and endDateExclusive is LocalDate.of(2024,
      6, 15).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_END
    category: BOUNDARY
    description: A one-day interval crosses from the last day of January into February.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 31) and endDateExclusive is LocalDate.of(2024,
      2, 1).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_INCLUDED
    category: BOUNDARY
    description: The interval from February 28 to March 1 in a leap year includes
      two whole days.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28) and endDateExclusive is LocalDate.of(2024,
      3, 1).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: The corresponding February-to-March interval in a non-leap year contains
      one day.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 2, 28) and endDateExclusive is LocalDate.of(2023,
      3, 1).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FULL_LEAP_YEAR
    category: NORMAL
    description: A full leap-year span exercises a multi-day ordinary Days instance.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1) and endDateExclusive is LocalDate.of(2025,
      1, 1).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_REVERSE_ACROSS_LEAP_DAY
    category: EDGE
    description: A reverse interval crosses February 29 and produces a multi-day negative
      result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 3, 1) and endDateExclusive is LocalDate.of(2024,
      2, 28).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_PROLEPTIC_YEAR_BOUNDARY
    category: BOUNDARY
    description: The endpoints cross the proleptic year boundary from year -1 to year
      0.
    preconditions:
    - startDateInclusive is LocalDate.of(-1, 12, 31) and endDateExclusive is LocalDate.of(0,
      1, 1).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM
    category: BOUNDARY
    description: Both source and shifted LocalDate values remain valid near LocalDate.MAX.
    preconditions:
    - startDateInclusive equals LocalDate.MAX.minusDays(100).
    - endDateExclusive equals LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 63.
    - The shifted end is exactly LocalDate.MAX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM
    category: BOUNDARY
    description: A positive interval begins at LocalDate.MIN while retaining room
      for the follow-up shift.
    preconditions:
    - startDateInclusive equals LocalDate.MIN.
    - endDateExclusive equals LocalDate.MIN.plusDays(63).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 63.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAXIMUM_DISTANCE
    category: BOUNDARY
    description: The day difference is exactly the largest value accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive is LocalDate.of(0, 1, 1).
    - endDateExclusive equals startDateInclusive.plusDays(Integer.MAX_VALUE).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MINIMUM_DISTANCE
    category: BOUNDARY
    description: The reverse day difference is exactly the smallest int value.
    preconditions:
    - endDateExclusive is LocalDate.of(0, 1, 1).
    - startDateInclusive equals endDateExclusive.plusDays(2147483648L).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SHIFT_SIZED_INTERVAL
    category: NORMAL
    description: The source interval itself is exactly the MR shift size.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 4, 10).
    - endDateExclusive equals startDateInclusive.plusDays(37).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EQUAL_ENDPOINTS
    category: EDGE
    description: Identical LocalDateTime endpoints produce zero.
    preconditions:
    - Both endpoints are LocalDateTime.of(2024, 6, 15, 12, 30).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SAME_DATE_PARTIAL_DAY
    category: NORMAL
    description: Two times on the same date contain no whole day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 1, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 15, 23, 0).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_CROSS_MIDNIGHT_PARTIAL_DAY
    category: BOUNDARY
    description: Crossing midnight by two hours still contains no whole day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 23, 0).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 1, 0).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: Equal times on consecutive dates produce exactly one whole day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 30).
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 12, 30).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_TRUNCATION
    category: EDGE
    description: A positive 47-hour interval truncates to one whole day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 1, 1, 12, 0).
    - endDateExclusive is LocalDateTime.of(2024, 1, 3, 11, 0).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_TRUNCATION
    category: EDGE
    description: The reverse 47-hour interval truncates toward zero to negative one
      day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 1, 3, 11, 0).
    - endDateExclusive is LocalDateTime.of(2024, 1, 1, 12, 0).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NANOSECOND_ALIGNED_DAY
    category: EDGE
    description: Matching nonzero nanoseconds on consecutive dates still form exactly
      one day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 1, 1, 0, 0, 0, 500000000).
    - endDateExclusive is LocalDateTime.of(2024, 1, 2, 0, 0, 0, 500000000).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_LEAP_BOUNDARY
    category: BOUNDARY
    description: Equal local times span February 29 in a leap year.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 2, 28, 6, 45).
    - endDateExclusive is LocalDateTime.of(2024, 3, 1, 6, 45).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EQUAL_ENDPOINTS
    category: EDGE
    description: Identical Instant endpoints exercise zero on the timeline.
    preconditions:
    - Both endpoints are Instant.EPOCH.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_JUST_UNDER_ONE_DAY
    category: BOUNDARY
    description: An elapsed interval one second short of a day contains zero whole
      days.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive equals Instant.EPOCH.plusSeconds(86399).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_ONE_DAY
    category: BOUNDARY
    description: Exactly 86400 elapsed seconds produce one whole day.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive equals Instant.EPOCH.plusSeconds(86400).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_POSITIVE_PARTIAL_SECOND_DAY
    category: EDGE
    description: A 25-hour elapsed interval truncates to one whole day.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive equals Instant.EPOCH.plusSeconds(90000).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_PARTIAL_SECOND_DAY
    category: EDGE
    description: A reverse 25-hour elapsed interval truncates to negative one day.
    preconditions:
    - startDateInclusive equals Instant.EPOCH.plusSeconds(90000).
    - endDateExclusive is Instant.EPOCH.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAXIMUM_DISTANCE
    category: BOUNDARY
    description: An Instant interval contains exactly Integer.MAX_VALUE elapsed days.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive equals Instant.EPOCH.plus(Integer.MAX_VALUE, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MINIMUM_DISTANCE
    category: BOUNDARY
    description: A reverse Instant interval produces exactly Integer.MIN_VALUE days.
    preconditions:
    - endDateExclusive is Instant.EPOCH.
    - startDateInclusive equals Instant.EPOCH.plus(2147483648L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EQUAL_ENDPOINTS
    category: EDGE
    description: Identical OffsetDateTime endpoints produce zero.
    preconditions:
    - Both endpoints are OffsetDateTime.of(2024, 6, 15, 12, 0, 0, 0, ZoneOffset.UTC).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET_DAY
    category: NORMAL
    description: Equal local times on consecutive dates with the same offset produce
      one day.
    preconditions:
    - startDateInclusive is OffsetDateTime.of(2024, 6, 15, 12, 0, 0, 0, ZoneOffset.ofHours(-5)).
    - endDateExclusive is OffsetDateTime.of(2024, 6, 16, 12, 0, 0, 0, ZoneOffset.ofHours(-5)).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_MAXIMUM_POSITIVE_OFFSET
    category: BOUNDARY
    description: The maximum supported positive offset is used on an exact one-day
      interval.
    preconditions:
    - startDateInclusive is OffsetDateTime.of(2024, 1, 1, 0, 0, 0, 0, ZoneOffset.ofHours(18)).
    - endDateExclusive is OffsetDateTime.of(2024, 1, 2, 0, 0, 0, 0, ZoneOffset.ofHours(18)).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERING_OFFSETS_FORWARD
    category: EDGE
    description: Differing fixed offsets make the apparent one-date change equal two
      elapsed whole days.
    preconditions:
    - startDateInclusive is OffsetDateTime.of(2024, 1, 1, 0, 0, 0, 0, ZoneOffset.ofHours(14)).
    - endDateExclusive is OffsetDateTime.of(2024, 1, 2, 0, 0, 0, 0, ZoneOffset.ofHours(-10)).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERING_OFFSETS_REVERSE
    category: EDGE
    description: Reversing the differing-offset interval produces negative two whole
      days.
    preconditions:
    - startDateInclusive is OffsetDateTime.of(2024, 1, 2, 0, 0, 0, 0, ZoneOffset.ofHours(-10)).
    - endDateExclusive is OffsetDateTime.of(2024, 1, 1, 0, 0, 0, 0, ZoneOffset.ofHours(14)).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_UTC_DAY
    category: NORMAL
    description: A UTC ZonedDateTime interval provides a zone-aware exact day without
      transitions.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 6, 15, 12, 0, 0, 0, ZoneOffset.UTC).
    - endDateExclusive is ZonedDateTime.of(2024, 6, 16, 12, 0, 0, 0, ZoneOffset.UTC).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_SPAN
    category: EDGE
    description: Same-zone local times span the America/New_York spring daylight-saving
      transition.
    preconditions:
    - Both endpoints use ZoneId.of("America/New_York").
    - startDateInclusive is 2024-03-09T12:00 in that zone and endDateExclusive is
      2024-03-11T12:00 in that zone.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2 despite the intervening short
      civil day.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FALL_DST_SPAN
    category: EDGE
    description: Same-zone local times span the America/New_York autumn daylight-saving
      transition.
    preconditions:
    - Both endpoints use ZoneId.of("America/New_York").
    - startDateInclusive is 2024-11-02T12:00 in that zone and endDateExclusive is
      2024-11-04T12:00 in that zone.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2 despite the intervening long
      civil day.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_OVERLAP_SAME_LOCAL_TIME
    category: EDGE
    description: The two occurrences of an overlapped local time differ by an instant
      hour but by zero whole days.
    preconditions:
    - Both endpoints use ZoneId.of("America/New_York") and local date-time 2024-11-03T01:30.
    - The start uses the earlier valid overlap offset and the end uses the later valid
      overlap offset.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AFTER_SPRING_GAP
    category: BOUNDARY
    description: Equal valid local times on dates surrounding the spring gap form
      one calendar day.
    preconditions:
    - Both endpoints use ZoneId.of("America/New_York").
    - startDateInclusive is 2024-03-10T01:30 and endDateExclusive is 2024-03-11T01:30
      in that zone.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FIXED_CROSS_ZONE
    category: EDGE
    description: Different fixed-offset zones exercise zone normalization without
      variable zone rules.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 1, 1, 0, 0, 0, 0, ZoneOffset.UTC).
    - endDateExclusive is ZonedDateTime.of(2024, 1, 2, 0, 0, 0, 0, ZoneOffset.ofHours(2)).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0 because the elapsed interval
      is 22 hours.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_NON_DST_YEAR_BOUNDARY
    category: BOUNDARY
    description: A one-day year boundary is represented in a non-DST region.
    preconditions:
    - Both endpoints use ZoneId.of("Asia/Tokyo").
    - startDateInclusive is 2024-12-31T08:00 and endDateExclusive is 2025-01-01T08:00
      in that zone.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_LEAP_BOUNDARY
    category: BOUNDARY
    description: JapaneseDate endpoints corresponding to ISO leap-year dates exercise
      a non-ISO chronology.
    preconditions:
    - startDateInclusive is JapaneseDate.from(LocalDate.of(2024, 2, 28)).
    - endDateExclusive is JapaneseDate.from(LocalDate.of(2024, 3, 1)).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_CONSECUTIVE_DAYS
    category: NORMAL
    description: Consecutive HijrahDate values exercise day arithmetic in the Hijrah
      chronology.
    preconditions:
    - startDateInclusive is HijrahDate.of(1445, 9, 1).
    - endDateExclusive equals startDateInclusive.plus(1, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_LEAP_BOUNDARY
    category: BOUNDARY
    description: ThaiBuddhistDate endpoints span the leap day corresponding to ISO
      year 2024.
    preconditions:
    - startDateInclusive is ThaiBuddhistDate.of(2567, 2, 28).
    - endDateExclusive is ThaiBuddhistDate.of(2567, 3, 1).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: MinguoDate endpoints cross a chronology year boundary.
    preconditions:
    - startDateInclusive is MinguoDate.of(113, 12, 31).
    - endDateExclusive is MinguoDate.of(114, 1, 1).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: EDGE
    description: A date-only start accepts a LocalDateTime end through its date component.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1).
    - endDateExclusive is LocalDateTime.of(2024, 1, 3, 23, 59).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_INSTANT_TO_OFFSET_DATE_TIME
    category: EDGE
    description: An Instant start accepts an OffsetDateTime end through its instant
      representation.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is OffsetDateTime.of(1970, 1, 2, 12, 0, 0, 0, ZoneOffset.UTC).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_ISO_TO_JAPANESE_DATE
    category: EDGE
    description: An ISO LocalDate start and JapaneseDate end represent compatible
      epoch-day dates.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1).
    - endDateExclusive is JapaneseDate.from(LocalDate.of(2024, 1, 3)).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
