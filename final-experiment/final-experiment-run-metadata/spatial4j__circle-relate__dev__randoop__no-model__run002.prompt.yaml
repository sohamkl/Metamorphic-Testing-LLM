# Spatial4j CircleImpl.relate(Rectangle) - sliding both shapes, developer-owned oracle.
#
# Real SUT from the SBFT'23 paper (Jahangirova & Terragni, 2023). Classpath comes from
# Spatial4j's own pom. No adapter - the circle is the receiver, the rectangle is the
# argument.
#
# This is the DEV version of the same SUT and relation that prompt.yaml runs under
# MRProvider: LLM, so we can compare who owns the oracle. Both specs live in mr/.
#
# DEV run: the developer spec is the MR, so no MRInput/MROutput prose is sent to the model.
# The natural-language version of this relation lives in prompt-circle-relate-nl.yaml.

ProjectRoot: examples/spatial4j
AutomaticDiscovery: true
SUTClassFile: examples/spatial4j/src/main/java/org/locationtech/spatial4j/shape/impl/CircleImpl.java
TargetFunction: public SpatialRelation relate(Rectangle rectangle)
SUTDescription: >-
  A circle on a flat, non-geo SpatialContext. relate(Rectangle) says how the circle sits
  next to a rectangle - CONTAINS, WITHIN, INTERSECTS or DISJOINT. Non-geo means no
  antimeridian or pole to worry about here.

Count: 50
InputGenerator: RANDOOP
MavenProfiles:
  - spatial4j-randoop
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/spatial4j/mr/CircleRelateDevMetamorphicSpec.java
DeveloperFollowUpMethod: CircleRelateDevMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: CircleRelateDevMetamorphicSpec.assertRelation
GeneratedClassName: GeneratedCircleRelateRandoopMetamorphicTest
OutputRoot: examples/spatial4j/generated/circle-relate-randoop
MaxRepairAttempts: 3
