InputDomain:
  summary: Successfully constructible finite LocalDateRange values for which the exclusive
    end can be moved exactly 23 days later, with the start unchanged, and both returned
    lengths remain representable int values.
  globalConstraints:
  - The source and follow-up receivers must be constructed successfully with non-null
    inputs.
  - The source range must satisfy start <= end, because the private constructor rejects
    an end before the start.
  - The source and follow-up must not have an unbounded end. An end equal to LocalDate.MAX
    causes lengthInDays() to return Integer.MAX_VALUE as the unbounded sentinel, and
    LocalDate.MAX cannot be moved 23 days later.
  - The source must not have an unbounded start. For a finite end, lengthInDays()
    returns the unbounded sentinel rather than a finite day count, so the stated numeric
    relation is not applicable.
  - The source and follow-up must not be empty at LocalDate.MIN or LocalDate.MAX,
    and must not use LocalDate.MIN or LocalDate.MIN.plusDays(1) as an end or LocalDate.MAX.minusDays(1)
    as a start, because the constructor rejects those cases.
  - The source exclusive end must be no later than LocalDate.MAX.minusDays(24), so
    adding exactly 23 days produces a representable finite follow-up end no later
    than LocalDate.MAX.minusDays(1).
  - The start is identical in the source and follow-up; only the exclusive end changes
    by exactly 23 days.
  - The finite source length must be at most 2147483624 days, so the expected follow-up
    value lengthInDays(source) + 23 is representable as an int.
  - Invalid arguments, invalid periods, unsupported temporals, and parse failures
    are excluded because the metamorphic relation requires two successfully constructed
    receivers and does not request invalid-input behavior.
  diversity:
    constructionPath:
    - of(LocalDate, LocalDate)
    - of(LocalDate, Period)
    - ofClosed(LocalDate, LocalDate)
    - ofEmpty(LocalDate)
    - from(LocalDate)
    - from(Year)
    - from(YearMonth)
    - from(YearHalf)
    - from(YearQuarter)
    - from(YearWeek)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    sourceLengthInDays:
    - '0'
    - '1'
    - '7'
    - '23'
    - '29'
    - '365'
    - '366'
    - '2147483624'
    calendarPosition:
    - ordinary dates
    - month boundary
    - non-leap February
    - leap day
    - year boundary
    - near LocalDate.MIN
    - near LocalDate.MAX
    boundedness:
    - finite start and finite end
    - unbounded start excluded because the sentinel violates the relation
    - unbounded end excluded because the sentinel cannot be moved 23 days later
  scenarios:
  - id: HALF_OPEN_ORDINARY_RANGE
    category: NORMAL
    description: A normal finite half-open range constructed directly with two LocalDate
      endpoints.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2020, 3, 10), LocalDate.of(2020, 3,
      17)).
    - Construct the follow-up with the same start and exclusive end 2020-04-09, which
      is 23 days after 2020-03-17.
    expectedSourceBehavior:
    - The source lengthInDays() is 7.
    - The follow-up lengthInDays() is 30.
    - The follow-up result minus the source result is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_EMPTY_RANGE
    category: EDGE
    description: An empty finite range whose end initially equals its start.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2020, 4, 15), LocalDate.of(2020, 4,
      15)).
    - Construct the follow-up with start 2020-04-15 and end 2020-05-08.
    expectedSourceBehavior:
    - The source is accepted as an empty range.
    - The source lengthInDays() is 0.
    - The follow-up lengthInDays() is 23, so the difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_ONE_DAY_RANGE
    category: BOUNDARY
    description: The smallest positive finite half-open range.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2021, 1, 1), LocalDate.of(2021, 1,
      2)).
    - Move only the exclusive end to 2021-01-25.
    expectedSourceBehavior:
    - The source lengthInDays() is 1.
    - The follow-up lengthInDays() is 24.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_EXACTLY_23_DAYS
    category: BOUNDARY
    description: A finite range whose original length equals the metamorphic increment.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2021, 2, 1), LocalDate.of(2021, 2,
      24)).
    - Move only the exclusive end to 2021-03-19.
    expectedSourceBehavior:
    - The source lengthInDays() is 23.
    - The follow-up lengthInDays() is 46.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: A half-open range crossing February 29 in a leap year.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2020, 2, 27), LocalDate.of(2020, 3,
      2)).
    - Move only the exclusive end to 2020-03-25.
    expectedSourceBehavior:
    - The source lengthInDays() is 4, including February 29.
    - The follow-up lengthInDays() is 27.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: A half-open range crossing the end of February in a non-leap year.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2021, 2, 27), LocalDate.of(2021, 3,
      2)).
    - Move only the exclusive end to 2021-03-25.
    expectedSourceBehavior:
    - The source lengthInDays() is 3.
    - The follow-up lengthInDays() is 26.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_YEAR_BOUNDARY
    category: BOUNDARY
    description: A finite half-open range crossing December 31 and January 1.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2021, 12, 30), LocalDate.of(2022, 1,
      3)).
    - Move only the exclusive end to 2022-01-26.
    expectedSourceBehavior:
    - The source lengthInDays() is 4.
    - The follow-up lengthInDays() is 27.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO
    category: EDGE
    description: A zero-length range created through the Period overload.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2022, 5, 10), Period.ZERO).
    - Construct the follow-up with the same start and the source end plus 23 days.
    expectedSourceBehavior:
    - The source lengthInDays() is 0.
    - The follow-up lengthInDays() is 23.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_DAY
    category: BOUNDARY
    description: A one-day range created through the Period overload.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2022, 5, 10), Period.ofDays(1)).
    - Move only the resulting exclusive end 23 days later.
    expectedSourceBehavior:
    - The source lengthInDays() is 1.
    - The follow-up lengthInDays() is 24.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_END_ADJUSTMENT
    category: BOUNDARY
    description: A Period-derived range whose calendar-month addition adjusts January
      31 to February 28.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.of(2021, 1, 31), Period.ofMonths(1)).
    - The source exclusive end produced by LocalDate.plus(period) is 2021-02-28.
    - Construct the follow-up with the same start and end 2021-03-23.
    expectedSourceBehavior:
    - The source lengthInDays() is 28.
    - The follow-up lengthInDays() is 51.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_ORDINARY_RANGE
    category: NORMAL
    description: A normal inclusive-end range converted by ofClosed to an exclusive
      stored end.
    preconditions:
    - Construct LocalDateRange.ofClosed(LocalDate.of(2020, 3, 10), LocalDate.of(2020,
      3, 16)).
    - The stored exclusive end is 2020-03-17.
    - Construct the follow-up with the same start and exclusive end 2020-04-09.
    expectedSourceBehavior:
    - The source lengthInDays() is 7.
    - The follow-up lengthInDays() is 30.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DAY
    category: BOUNDARY
    description: A one-day inclusive range created through ofClosed.
    preconditions:
    - Construct LocalDateRange.ofClosed(LocalDate.of(2020, 6, 15), LocalDate.of(2020,
      6, 15)).
    - The stored exclusive end is 2020-06-16.
    - Move only that exclusive end to 2020-07-09.
    expectedSourceBehavior:
    - The source lengthInDays() is 1.
    - The follow-up lengthInDays() is 24.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_FACTORY
    category: EDGE
    description: An empty range created through the dedicated ofEmpty factory.
    preconditions:
    - Construct LocalDateRange.ofEmpty(LocalDate.of(2023, 7, 10)).
    - Construct the follow-up with the same start and end 2023-08-02.
    expectedSourceBehavior:
    - The source lengthInDays() is 0.
    - The follow-up lengthInDays() is 23.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: The from(Temporal) branch for a LocalDate.
    preconditions:
    - Construct LocalDateRange.from(LocalDate.of(2022, 8, 10)).
    - The LocalDate branch creates a one-day closed range with exclusive end 2022-08-11.
    - Construct the follow-up with the same start and end 2022-09-03.
    expectedSourceBehavior:
    - The source lengthInDays() is 1.
    - The follow-up lengthInDays() is 24.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: The from(Temporal) branch for a Year.
    preconditions:
    - Construct LocalDateRange.from(Year.of(2021)).
    - The source spans 2021-01-01 inclusive to 2022-01-01 exclusive.
    - Construct the follow-up with the same start and end 2022-01-24.
    expectedSourceBehavior:
    - The source lengthInDays() is 365.
    - The follow-up lengthInDays() is 388.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH_LEAP_FEBRUARY
    category: BOUNDARY
    description: The from(Temporal) YearMonth branch for leap-year February.
    preconditions:
    - Construct LocalDateRange.from(YearMonth.of(2020, 2)).
    - The source spans 2020-02-01 inclusive to 2020-03-01 exclusive.
    - Construct the follow-up with the same start and end 2020-03-24.
    expectedSourceBehavior:
    - The source lengthInDays() is 29.
    - The follow-up lengthInDays() is 52.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: The from(Temporal) YearHalf branch.
    preconditions:
    - Construct LocalDateRange.from(YearHalf.of(2021, 2)).
    - The source spans the second half of 2021, ending exclusively at 2022-01-01.
    - Construct the follow-up with the same start and end 2022-01-24.
    expectedSourceBehavior:
    - The source lengthInDays() is 184.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: The from(Temporal) YearQuarter branch for a quarter containing leap
      day.
    preconditions:
    - Construct LocalDateRange.from(YearQuarter.of(2020, 1)).
    - The source spans 2020-01-01 inclusive to 2020-04-01 exclusive.
    - Construct the follow-up with the same start and end 2020-04-24.
    expectedSourceBehavior:
    - The source lengthInDays() is 91.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: The from(Temporal) YearWeek branch.
    preconditions:
    - Construct LocalDateRange.from(YearWeek.of(2021, 10)).
    - The source spans the week's Monday through the following Monday exclusively.
    - Construct the follow-up by moving that exclusive end exactly 23 days later.
    expectedSourceBehavior:
    - The source lengthInDays() is 7.
    - The follow-up lengthInDays() is 30.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A range parsed from the date/date textual form.
    preconditions:
    - Parse LocalDateRange.parse("2020-03-10/2020-03-17").
    - Construct the follow-up with the parsed start and exclusive end 23 days after
      the parsed end.
    expectedSourceBehavior:
    - The parsed source lengthInDays() is 7.
    - The follow-up lengthInDays() is 30.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: A range parsed from the date/period textual form.
    preconditions:
    - Parse LocalDateRange.parse("2020-02-01/P1M").
    - The date/period branch computes the exclusive end as 2020-03-01.
    - Construct the follow-up with the same start and end 2020-03-24.
    expectedSourceBehavior:
    - The source lengthInDays() is 29.
    - The follow-up lengthInDays() is 52.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: A range parsed from the period/date textual form.
    preconditions:
    - Parse LocalDateRange.parse("P23D/2020-03-24").
    - The period/date branch computes the start as 2020-03-01 and the exclusive end
      as 2020-03-24.
    - Construct the follow-up with the same start and end 2020-04-16.
    expectedSourceBehavior:
    - The source lengthInDays() is 23.
    - The follow-up lengthInDays() is 46.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_LOCAL_DATE_MINIMUM
    category: BOUNDARY
    description: A finite one-day range immediately above the forbidden minimum-end
      neighborhood.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.MIN.plusDays(2), LocalDate.MIN.plusDays(3)).
    - Construct the follow-up with the same start and end LocalDate.MIN.plusDays(26).
    - Neither range ends at LocalDate.MIN or LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - The source lengthInDays() is 1.
    - The follow-up lengthInDays() is 24.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_LOCAL_DATE_MAXIMUM
    category: BOUNDARY
    description: A finite range whose follow-up end is the latest finite end permitted
      by the 23-day transformation.
    preconditions:
    - Construct LocalDateRange.of(LocalDate.MAX.minusDays(100), LocalDate.MAX.minusDays(24)).
    - Construct the follow-up with the same start and end LocalDate.MAX.minusDays(1).
    - The follow-up end is finite and is not LocalDate.MAX.
    expectedSourceBehavior:
    - The source lengthInDays() is 76.
    - The follow-up lengthInDays() is 99.
    - The difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_REPRESENTABLE_FINITE_RANGE
    category: EDGE
    description: A large finite range at the maximum source length that still permits
      the expected follow-up int result.
    preconditions:
    - Use finite endpoints whose epoch-day difference is exactly 2147483624 days and
      whose end is no later than LocalDate.MAX.minusDays(24).
    - Construct the follow-up with the same start and an exclusive end 23 days later.
    expectedSourceBehavior:
    - The source lengthInDays() is 2147483624.
    - The follow-up lengthInDays() is 2147483647.
    - The difference is exactly 23 without relying on the Integer.MAX_VALUE unbounded
      sentinel.
    targetCases: 1
    emptyOutputAllowed: false
