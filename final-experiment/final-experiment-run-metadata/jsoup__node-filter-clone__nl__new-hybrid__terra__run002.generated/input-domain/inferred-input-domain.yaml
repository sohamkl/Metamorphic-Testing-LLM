InputDomain:
  summary: Non-null detached Node roots with measured child/sibling/depth topology,
    exercised with fresh deterministic non-mutating NodeFilter policies that return
    CONTINUE, SKIP_CHILDREN, SKIP_ENTIRELY, REMOVE, or STOP at specified head or tail
    callbacks. Each source root is deep-cloned before execution and both paired executions
    record terminal result, ordered callbacks, returned actions, and final outerHtml.
  globalConstraints:
  - root is non-null and root.parentNode() is null immediately before each execution;
    null roots are excluded because the metamorphic relation explicitly requires a
    non-null detached root.
  - filter is non-null; null filters are excluded because the relation requires applying
    fresh NodeFilter instances rather than testing unspecified null handling.
  - each paired execution uses separate fresh NodeFilter instances implementing the
    same deterministic policy, with decisions based only on callback phase, depth,
    and clone-corresponding tree position.
  - source root and deep clone have equal initial outerHtml and equal recursive childNodeSize()/sibling
    order topology before filtering.
  - policies do not directly change DOM structure in callbacks; structural mutation
    is limited to FilterResult.REMOVE so observed mutations are attributable to NodeTraversor.filter.
  - every scenario configuring a non-CONTINUE result has at least one source callback
    position satisfying that policy predicate.
  - callback logs identify phase (head or tail), depth, clone-corresponding node position,
    and returned FilterResult; paired logs, terminal result, action sequence, and
    final outerHtml must be equal.
  diversity:
    rootTopology:
    - '9'
    - measurable by recursive childNodeSize()
    - maximum depth
    - and sibling counts
    - leaf; one child; multiple siblings; deep chain; branched tree; internal sibling;
      first-child target; middle-child target; last-child target
    callbackPhase:
    - '2'
    - measurable by recorded callback phase
    - head; tail
    filterResult:
    - '5'
    - measurable by returned enum value
    - CONTINUE; SKIP_CHILDREN; SKIP_ENTIRELY; REMOVE; STOP
    targetPosition:
    - '8'
    - measurable by depth and siblingIndex()
    - root; only child; first child; middle child; last child; leaf; internal node;
      deepest node
    terminalPath:
    - '5'
    - measurable by filter() return value
    - CONTINUE; SKIP_CHILDREN; SKIP_ENTIRELY; REMOVE; STOP
  scenarios:
  - id: LEAF_CONTINUE
    category: NORMAL
    description: Detached root has childNodeSize() = 0 and head and tail both return
      CONTINUE.
    preconditions:
    - root.childNodeSize() = 0.
    - policy returns CONTINUE from head(root, 0) and tail(root, 0).
    expectedSourceBehavior:
    - Callback sequence is head(root,0), tail(root,0).
    - filter returns CONTINUE and root outerHtml is unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_CHILD_CONTINUE
    category: NORMAL
    description: Root has exactly one leaf child and all callbacks continue.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() = 0.
    - policy always returns CONTINUE.
    expectedSourceBehavior:
    - Callback order is root head, child head, child tail, root tail.
    - filter returns CONTINUE without DOM removal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWO_LEAF_SIBLINGS_CONTINUE
    category: NORMAL
    description: Root has two leaf children, exercising sibling advance after tailing
      the first child.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() = 0 and root.childNode(1).childNodeSize()
      = 0.
    - policy always returns CONTINUE.
    expectedSourceBehavior:
    - Both children receive head then tail callbacks in sibling order before root
      tail.
    - filter returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THREE_LEAF_SIBLINGS_CONTINUE
    category: BOUNDARY
    description: Root has three leaf children, including a measurable middle-sibling
      traversal position.
    preconditions:
    - root.childNodeSize() = 3.
    - every root child has childNodeSize() = 0.
    - policy always returns CONTINUE.
    expectedSourceBehavior:
    - Each sibling is fully visited in childNode(0), childNode(1), childNode(2) order.
    - filter returns CONTINUE after tail(root,0).
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEPTH_TWO_CHAIN_CONTINUE
    category: NORMAL
    description: Root has one child which has one leaf child.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() = 1.
    - root.childNode(0).childNode(0).childNodeSize() = 0.
    - policy always returns CONTINUE.
    expectedSourceBehavior:
    - Callback depths are 0, 1, 2 on descent and 2, 1, 0 on tails.
    - filter returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEPTH_FOUR_CHAIN_CONTINUE
    category: BOUNDARY
    description: A single-child chain reaches depth 4 before its leaf.
    preconditions:
    - there is exactly one descendant path from root to a leaf at depth 4.
    - every non-leaf on that path has childNodeSize() = 1.
    - policy always returns CONTINUE.
    expectedSourceBehavior:
    - Traversal ascends through four no-sibling parent transitions.
    - filter returns CONTINUE after tails from depth 4 through depth 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BRANCHED_TREE_CONTINUE
    category: NORMAL
    description: Root has one leaf child and one internal child with two leaf children.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() = 0.
    - root.childNode(1).childNodeSize() = 2.
    - both descendants of root.childNode(1) have childNodeSize() = 0.
    - policy always returns CONTINUE.
    expectedSourceBehavior:
    - The first leaf is completed before traversal descends into the second child
      subtree.
    - filter returns CONTINUE with depth-first callback order.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_FIRST_SIBLING_CONTINUE
    category: NORMAL
    description: The first root child is internal and its next sibling is a leaf.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() = 1.
    - root.childNode(0).childNode(0).childNodeSize() = 0.
    - root.childNode(1).childNodeSize() = 0.
    - policy always returns CONTINUE.
    expectedSourceBehavior:
    - Traversal ascends from the first child subtree and then visits childNode(1).
    - filter returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_ELEMENT_LEAF_ROOT_CONTINUE
    category: EDGE
    description: A detached Node root with no children is used without requiring it
      to be an Element.
    preconditions:
    - root.childNodeSize() = 0.
    - root is a valid concrete Node instance that is not used as an Element-specific
      input.
    - policy always returns CONTINUE.
    expectedSourceBehavior:
    - filter relies only on Node operations and invokes head then tail at depth 0.
    - filter returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_STOP_AT_ROOT
    category: BOUNDARY
    description: head(root,0) stops before any descent or tail callback.
    preconditions:
    - root.childNodeSize() >= 1.
    - policy returns STOP only from head(root,0).
    expectedSourceBehavior:
    - Callback sequence contains only head(root,0).
    - filter immediately returns STOP and outerHtml is unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_STOP_AT_FIRST_CHILD
    category: NORMAL
    description: head stops at the first leaf child after the root has continued.
    preconditions:
    - root.childNodeSize() = 2.
    - both root children have childNodeSize() = 0.
    - policy returns STOP only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - root head occurs, then first-child head returns STOP.
    - No first-child tail, second-child callback, or root tail occurs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_STOP_AT_MIDDLE_SIBLING
    category: BOUNDARY
    description: head stops at childNode(1) of three leaf siblings.
    preconditions:
    - root.childNodeSize() = 3.
    - every root child has childNodeSize() = 0.
    - policy returns STOP only from head(root.childNode(1),1).
    expectedSourceBehavior:
    - childNode(0) is fully visited before STOP at childNode(1) head.
    - childNode(2) and root tail are not visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_STOP_AT_DEEPEST_NODE
    category: BOUNDARY
    description: head stops at a depth-3 leaf in a single-child chain.
    preconditions:
    - exactly one root-to-leaf path exists and its leaf is at depth 3.
    - policy returns STOP only from head at depth 3.
    expectedSourceBehavior:
    - All ancestor heads occur before STOP.
    - No tail callbacks occur after the STOP result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_AT_LEAF_ROOT
    category: BOUNDARY
    description: A leaf root continues at head and stops from tail.
    preconditions:
    - root.childNodeSize() = 0.
    - policy returns CONTINUE from head(root,0) and STOP from tail(root,0).
    expectedSourceBehavior:
    - Callback sequence is head(root,0), tail(root,0).
    - filter returns STOP.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_AT_FIRST_CHILD
    category: NORMAL
    description: The first leaf child stops during tail before sibling advance.
    preconditions:
    - root.childNodeSize() = 2.
    - both root children have childNodeSize() = 0.
    - policy returns STOP only from tail(root.childNode(0),1).
    expectedSourceBehavior:
    - first-child head and tail occur after root head.
    - No second-child callback or root tail occurs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_AT_LAST_CHILD_ASCENT
    category: BOUNDARY
    description: The last child stops during the no-sibling ascent path.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() = 0.
    - policy returns STOP only from tail(root.childNode(0),1).
    expectedSourceBehavior:
    - Child tail returns STOP before traversal can tail the root.
    - filter returns STOP.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_AT_INTERNAL_NODE
    category: NORMAL
    description: An internal child stops from tail after all of its descendants complete.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() = 1.
    - root.childNode(0).childNode(0).childNodeSize() = 0.
    - policy returns STOP only from tail(root.childNode(0),1).
    expectedSourceBehavior:
    - The internal child's descendant is fully visited before its tail STOP.
    - The second root child and root tail are not visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_AT_ROOT_AFTER_DESCENDANTS
    category: NORMAL
    description: Root tail stops after a complete descendant traversal.
    preconditions:
    - root.childNodeSize() = 2.
    - at least one root child has childNodeSize() > 0.
    - policy returns STOP only from tail(root,0).
    expectedSourceBehavior:
    - All descendants are visited depth-first before root tail.
    - filter returns STOP.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_CHILDREN_AT_ROOT
    category: BOUNDARY
    description: Root has descendants but root head returns SKIP_CHILDREN.
    preconditions:
    - root.childNodeSize() >= 1.
    - policy returns SKIP_CHILDREN only from head(root,0).
    expectedSourceBehavior:
    - No descendant head or tail callback occurs.
    - tail(root,0) occurs and filter returns the root-tail result, CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_CHILDREN_FIRST_INTERNAL_SIBLING
    category: NORMAL
    description: First root child is internal, skips its children, and traversal continues
      to a leaf sibling.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() >= 1.
    - root.childNode(1).childNodeSize() = 0.
    - policy returns SKIP_CHILDREN only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - No callback occurs for descendants of childNode(0).
    - tail(childNode(0),1), full visitation of childNode(1), and tail(root,0) occur.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_CHILDREN_LAST_INTERNAL_CHILD
    category: BOUNDARY
    description: Last and only root child is internal and skips its descendants before
      ascent.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() >= 1.
    - policy returns SKIP_CHILDREN only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - The skipped child receives tail despite its skipped descendants.
    - Traversal ascends and tails the root, returning CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_CHILDREN_ON_LEAF
    category: EDGE
    description: A leaf returns SKIP_CHILDREN even though it has no children.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() = 0.
    - policy returns SKIP_CHILDREN only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - The leaf still receives tail because SKIP_CHILDREN is tail-eligible.
    - filter returns CONTINUE after root tail.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_SKIP_CHILDREN_AT_ROOT
    category: EDGE
    description: Root tail returns SKIP_CHILDREN after a complete traversal.
    preconditions:
    - root.childNodeSize() >= 1.
    - policy returns SKIP_CHILDREN only from tail(root,0).
    expectedSourceBehavior:
    - All descendants are visited normally.
    - filter returns SKIP_CHILDREN at the root terminal path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_SKIP_CHILDREN_AT_FIRST_LEAF
    category: EDGE
    description: First leaf child returns SKIP_CHILDREN from tail before sibling traversal.
    preconditions:
    - root.childNodeSize() = 2.
    - both root children have childNodeSize() = 0.
    - policy returns SKIP_CHILDREN only from tail(root.childNode(0),1).
    expectedSourceBehavior:
    - The second child is still visited after the first child's tail result.
    - Parent processing continues with result reset to CONTINUE on ascent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_ENTIRELY_AT_ROOT
    category: BOUNDARY
    description: Root head returns SKIP_ENTIRELY.
    preconditions:
    - root.childNodeSize() >= 1.
    - policy returns SKIP_ENTIRELY only from head(root,0).
    expectedSourceBehavior:
    - No descendant callback and no root tail callback occurs.
    - filter returns SKIP_ENTIRELY and root outerHtml is unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_ENTIRELY_AT_FIRST_SIBLING
    category: NORMAL
    description: The first leaf child is skipped entirely and its sibling is still
      traversed.
    preconditions:
    - root.childNodeSize() = 2.
    - both root children have childNodeSize() = 0.
    - policy returns SKIP_ENTIRELY only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - childNode(0) has a head callback but no tail callback.
    - childNode(1) is fully visited and filter returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_ENTIRELY_AT_LAST_CHILD
    category: BOUNDARY
    description: The only child is skipped entirely, requiring ascent without child
      tail.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() = 0.
    - policy returns SKIP_ENTIRELY only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - No tail occurs for the skipped child.
    - Root tail occurs and filter returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_ENTIRELY_INTERNAL_SUBTREE
    category: NORMAL
    description: An internal first child is skipped entirely while a later sibling
      remains reachable.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() >= 1.
    - root.childNode(1).childNodeSize() = 0.
    - policy returns SKIP_ENTIRELY only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - Neither tail(childNode(0),1) nor callbacks for its descendants occur.
    - childNode(1) and root are subsequently completed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_DETACHED_ROOT
    category: EDGE
    description: Detached root head returns REMOVE.
    preconditions:
    - root.parentNode() is null.
    - root.childNodeSize() >= 1.
    - policy returns REMOVE only from head(root,0).
    expectedSourceBehavior:
    - No descendant or root-tail callback occurs.
    - filter returns REMOVE; removal is attempted only after the root terminal path
      is selected.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_FIRST_LEAF_SIBLING
    category: NORMAL
    description: First leaf child returns REMOVE and its next sibling must remain
      traversable.
    preconditions:
    - root.childNodeSize() = 2.
    - both root children have childNodeSize() = 0.
    - policy returns REMOVE only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - The removed child has no tail callback.
    - childNode(1) is visited after removal and final root outerHtml excludes the
      first child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_MIDDLE_LEAF_SIBLING
    category: BOUNDARY
    description: Middle leaf of three siblings returns REMOVE.
    preconditions:
    - root.childNodeSize() = 3.
    - every root child has childNodeSize() = 0.
    - policy returns REMOVE only from head(root.childNode(1),1).
    expectedSourceBehavior:
    - childNode(0) is completed, childNode(1) has no tail, and original childNode(2)
      is visited.
    - Final root outerHtml excludes exactly the targeted middle child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_LAST_ONLY_CHILD
    category: BOUNDARY
    description: The sole leaf child returns REMOVE through the no-sibling ascent
      path.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() = 0.
    - policy returns REMOVE only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - The child receives no tail callback and is removed after its parent is found.
    - Root tail occurs and final root.childNodeSize() = 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_INTERNAL_SUBTREE
    category: NORMAL
    description: An internal child with descendants returns REMOVE from head.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() >= 1.
    - root.childNode(1).childNodeSize() = 0.
    - policy returns REMOVE only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - No callback occurs for the removed node's descendants or its tail.
    - Its entire subtree is absent from final root outerHtml and the remaining sibling
      is visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_FIRST_LEAF_SIBLING
    category: NORMAL
    description: First leaf child returns REMOVE from tail before traversal advances
      to its sibling.
    preconditions:
    - root.childNodeSize() = 2.
    - both root children have childNodeSize() = 0.
    - policy returns REMOVE only from tail(root.childNode(0),1).
    expectedSourceBehavior:
    - The first child is removed after its next sibling is obtained.
    - The second child and root tail are visited; final root outerHtml excludes the
      first child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_MIDDLE_LEAF_SIBLING
    category: BOUNDARY
    description: Middle leaf of three siblings returns REMOVE from tail.
    preconditions:
    - root.childNodeSize() = 3.
    - every root child has childNodeSize() = 0.
    - policy returns REMOVE only from tail(root.childNode(1),1).
    expectedSourceBehavior:
    - Both outer siblings remain and original childNode(2) is visited after removal.
    - Final root outerHtml excludes only the middle child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_LAST_ONLY_CHILD
    category: BOUNDARY
    description: Sole leaf child returns REMOVE from tail during ascent.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() = 0.
    - policy returns REMOVE only from tail(root.childNode(0),1).
    expectedSourceBehavior:
    - Parent is found before the child is removed.
    - Root tail occurs and final root.childNodeSize() = 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_INTERNAL_SUBTREE
    category: NORMAL
    description: Internal child returns REMOVE from tail after descendants have been
      traversed.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() = 1.
    - root.childNode(0).childNode(0).childNodeSize() = 0.
    - root.childNode(1).childNodeSize() = 0.
    - policy returns REMOVE only from tail(root.childNode(0),1).
    expectedSourceBehavior:
    - Descendants of the internal child are visited before the internal tail removal.
    - The internal subtree is removed and the second child remains visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_DETACHED_ROOT
    category: EDGE
    description: Detached root returns REMOVE from tail.
    preconditions:
    - root.parentNode() is null.
    - root.childNodeSize() = 0.
    - policy returns CONTINUE from head(root,0) and REMOVE from tail(root,0).
    expectedSourceBehavior:
    - Callback sequence is root head then root tail.
    - filter returns REMOVE after the detached-root removal attempt.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_CHILDREN_THEN_REMOVE_SIBLING
    category: NORMAL
    description: First internal child skips descendants and a later leaf sibling is
      removed from head.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() >= 1.
    - root.childNode(1).childNodeSize() = 0.
    - policy returns SKIP_CHILDREN from head(root.childNode(0),1) and REMOVE from
      head(root.childNode(1),1).
    expectedSourceBehavior:
    - First-child descendants are not visited but first-child tail occurs.
    - Second child has no tail and is absent from final root outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_SKIP_ENTIRELY_THEN_CONTINUE_SIBLING
    category: NORMAL
    description: First internal sibling is skipped entirely and the second internal
      sibling is traversed normally.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() >= 1.
    - root.childNode(1).childNodeSize() >= 1.
    - policy returns SKIP_ENTIRELY only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - No callback occurs below or at tail of the first child.
    - The second subtree is completely traversed and filter returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_FIRST_CHILD_THEN_STOP_SIBLING
    category: NORMAL
    description: First leaf child is removed and head stops at the remaining sibling.
    preconditions:
    - root.childNodeSize() = 2.
    - both root children have childNodeSize() = 0.
    - policy returns REMOVE from head(root.childNode(0),1) and STOP from head(root.childNode(1),1).
    expectedSourceBehavior:
    - First child is removed without tail.
    - filter returns STOP at the second child's head and final root outerHtml excludes
      the first child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_FIRST_CHILD_THEN_STOP_SIBLING
    category: NORMAL
    description: First leaf child is removed from tail and head stops at its sibling.
    preconditions:
    - root.childNodeSize() = 2.
    - both root children have childNodeSize() = 0.
    - policy returns REMOVE from tail(root.childNode(0),1) and STOP from head(root.childNode(1),1).
    expectedSourceBehavior:
    - First child tail is logged and the child is removed.
    - filter returns STOP before the second-child tail or root tail.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_INTERNAL_THEN_TAIL_STOP_ROOT
    category: NORMAL
    description: Root skips descendants at head and then stops at root tail.
    preconditions:
    - root.childNodeSize() >= 1.
    - policy returns SKIP_CHILDREN from head(root,0) and STOP from tail(root,0).
    expectedSourceBehavior:
    - No descendant callbacks occur.
    - Root tail returns STOP and filter returns STOP.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTINUE_CHILDREN_THEN_TAIL_REMOVE_ROOT
    category: EDGE
    description: Root descendants are traversed before detached root returns REMOVE
      from tail.
    preconditions:
    - root.parentNode() is null.
    - root.childNodeSize() >= 1.
    - policy returns REMOVE only from tail(root,0).
    expectedSourceBehavior:
    - All descendants are visited before root tail.
    - filter returns REMOVE after the root terminal path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEEP_BRANCH_REMOVE_LAST_GRANDCHILD
    category: BOUNDARY
    description: Last grandchild of an internal first child is removed from tail before
      ascending to a root sibling.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() = 2.
    - both grandchildren of root.childNode(0) have childNodeSize() = 0.
    - root.childNode(1).childNodeSize() = 0.
    - policy returns REMOVE only from tail(root.childNode(0).childNode(1),2).
    expectedSourceBehavior:
    - The targeted last grandchild is removed on the no-sibling ascent path.
    - The internal parent, then root.childNode(1), then root are still processed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEEP_BRANCH_SKIP_ENTIRELY_LAST_GRANDCHILD
    category: BOUNDARY
    description: Last grandchild is skipped entirely before traversal ascends to its
      parent.
    preconditions:
    - root.childNodeSize() = 1.
    - root.childNode(0).childNodeSize() = 2.
    - both grandchildren have childNodeSize() = 0.
    - policy returns SKIP_ENTIRELY only from head(root.childNode(0).childNode(1),2).
    expectedSourceBehavior:
    - The targeted grandchild has head but no tail callback.
    - Its parent and root receive tails and filter returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEEP_BRANCH_SKIP_CHILDREN_INTERNAL
    category: NORMAL
    description: A depth-1 internal node skips a depth-2 branching subtree while its
      root sibling remains reachable.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() = 2.
    - root.childNode(1).childNodeSize() = 0.
    - policy returns SKIP_CHILDREN only from head(root.childNode(0),1).
    expectedSourceBehavior:
    - No depth-2 callbacks occur under the skipped internal node.
    - The depth-1 internal tail, leaf sibling, and root tail occur.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_STOP_AFTER_COMPLETED_LEFT_SUBTREE
    category: BOUNDARY
    description: A complete left subtree is traversed before STOP at the right internal
      sibling head.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() >= 1.
    - root.childNode(1).childNodeSize() >= 1.
    - policy returns STOP only from head(root.childNode(1),1).
    expectedSourceBehavior:
    - All callbacks for the left subtree occur before STOP.
    - No callback occurs for descendants or tail of the right subtree, nor for root
      tail.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_AFTER_COMPLETED_LEFT_SUBTREE
    category: BOUNDARY
    description: Left internal subtree completes, then its tail stops before the right
      sibling.
    preconditions:
    - root.childNodeSize() = 2.
    - root.childNode(0).childNodeSize() >= 1.
    - root.childNode(1).childNodeSize() >= 1.
    - policy returns STOP only from tail(root.childNode(0),1).
    expectedSourceBehavior:
    - Descendants of the left child are fully visited before its tail STOP.
    - The right subtree and root tail are not visited.
    targetCases: 1
    emptyOutputAllowed: false
