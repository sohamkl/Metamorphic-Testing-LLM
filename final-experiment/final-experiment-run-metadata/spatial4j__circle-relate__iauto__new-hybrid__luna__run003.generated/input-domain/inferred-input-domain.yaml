InputDomain:
  summary: Non-geodetic, same-context CircleImpl and Rectangle inputs using finite
    coordinates, nonnegative finite radii, empty-shape cases, rectangle bounding-box
    relations, phase-two closest/farthest-point branches, and boundary contacts; every
    follow-up applies the supplied translation of (+17.5, -9.25).
  globalConstraints:
  - The source context is a non-geodetic SpatialContext, and the shifted circle center
    and shifted rectangle coordinates must remain representable and constructible
    in that context.
  - For non-empty circles, the center coordinates and radius are finite, the radius
    is greater than or equal to zero, and the rectangle has ordered finite bounds
    minX <= maxX and minY <= maxY.
  - The follow-up uses the circle's own context, preserves the source radius and rectangle
    dimensions, and adds exactly +17.5 to every X coordinate and -9.25 to every Y
    coordinate.
  - Empty-shape cases are included only when the supplied SpatialContext and shape
    implementations can construct and shift the empty point or empty rectangle without
    introducing an unsupported construction.
  - No invalid-input behavior is required by the metamorphic relation, so NaN, infinities,
    negative radii, reversed rectangle bounds, null arguments, and contexts that reject
    the shifted coordinates are excluded.
  - Each source case invokes CircleImpl.relate(Rectangle) and asserts that the follow-up
    result is the identical SpatialRelation enum value returned for the source case.
  diversity:
    circleRadius:
    - '0.0'
    - positive finite radius
    - radius equal to an axis-aligned distance
    - radius larger than the rectangle extent
    centerPositionRelativeToRectangle:
    - left-and-below
    - left-and-inside-Y
    - inside-X-and-below
    - inside-both-axes
    - right-and-above
    enclosingBoxRelation:
    - DISJOINT
    - WITHIN
    - equal-to-rectangle
    - CONTAINS
    - INTERSECTS
    phaseTwoOutcome:
    - DISJOINT
    - INTERSECTS
    - CONTAINS
    - skipped-by-bounding-box-shortcut
    closestPointCondition:
    - outside-both-axes
    - on-circle boundary
    - inside-circle
    - axis-aligned
    farthestPointCondition:
    - outside-circle
    - on-circle boundary
    - inside-circle
    rectangleDimensionality:
    - positive-area
    - zero-width
    - zero-height
    - zero-area-point
    - empty
    circleState:
    - non-empty
    - zero-radius
    - empty
    sourceRelation:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
  scenarios:
  - id: EMPTY_CIRCLE
    category: EDGE
    description: The circle has an empty center point while the rectangle is a normal
      finite non-empty rectangle.
    preconditions:
    - The supplied Point reports isEmpty() as true.
    - The rectangle has ordered finite bounds and is constructible in the same non-geodetic
      context.
    expectedSourceBehavior:
    - CircleImpl constructs an empty enclosing box.
    - relate(Rectangle) follows the empty/enclosing-box path and returns DISJOINT.
    - The shifted empty circle and shifted rectangle produce the same DISJOINT result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RECTANGLE
    category: EDGE
    description: The circle is non-empty and the rectangle is an empty rectangle representation
      supported by the context.
    preconditions:
    - The circle center is finite and non-empty and its radius is finite and nonnegative.
    - The rectangle reports isEmpty() as true and can be rebuilt by the supplied shifted
      RectangleImpl construction.
    expectedSourceBehavior:
    - The rectangle contributes an empty relation to the circle's enclosing-box comparison.
    - relate(Rectangle) returns DISJOINT.
    - Translating both shapes preserves the DISJOINT result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ENCLOSING_BOX_DISJOINT_ON_X
    category: NORMAL
    description: A positive-radius circle is separated from the rectangle along X,
      with overlapping Y ranges not sufficient to create contact.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [6, 8] by [-1, 1].
    - The circle enclosing box is [-5, 5] by [-5, 5], disjoint from the rectangle.
    expectedSourceBehavior:
    - The enclosing-box shortcut returns DISJOINT without phase-two distance checks.
    - The translated source and follow-up both return DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ENCLOSING_BOX_DISJOINT_ON_Y
    category: NORMAL
    description: A positive-radius circle is separated from the rectangle along Y
      while the X ranges overlap.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-1, 1] by [6, 8].
    - The enclosing box is disjoint from the rectangle because of the Y interval.
    expectedSourceBehavior:
    - The enclosing-box shortcut returns DISJOINT.
    - The common translation leaves the DISJOINT relation unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ENCLOSING_BOX_WITHIN_LARGE_RECTANGLE
    category: NORMAL
    description: The rectangle fully contains the circle's enclosing box with strict
      margins.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-6, 6] by [-7, 7].
    - The enclosing box is strictly within the rectangle.
    expectedSourceBehavior:
    - The bounding-box relation is WITHIN.
    - relate(Rectangle) returns WITHIN through its early return.
    - The follow-up also returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ENCLOSING_BOX_EQUALS_RECTANGLE
    category: BOUNDARY
    description: The rectangle exactly equals the circle's axis-aligned enclosing
      box.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-5, 5] by [-5, 5].
    - The rectangle is value-equal to the circle's enclosing box.
    expectedSourceBehavior:
    - The enclosing-box relation is CONTAINS before the equality check.
    - The equality special case returns WITHIN rather than entering phase two.
    - The translated enclosing box and rectangle remain equal, so the follow-up returns
      WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_STRICTLY_CONTAINED_BY_CIRCLE
    category: NORMAL
    description: The rectangle is strictly inside the circle and every rectangle corner
      is inside the circle.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-3, 3] by [-3, 3].
    - The rectangle's enclosing-box relation to the circle enclosing box is CONTAINS.
    - The farthest rectangle corner has distance sqrt(18), which is less than 5.
    expectedSourceBehavior:
    - Phase two is entered with bboxSect equal to CONTAINS.
    - The farthest-point check succeeds and relate(Rectangle) returns CONTAINS.
    - The follow-up returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_CORNER_OUTSIDE_CIRCLE
    category: NORMAL
    description: The rectangle lies inside the circle's enclosing box but one farthest
      corner lies outside the circle.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-4, 4] by [-4, 4].
    - The enclosing-box relation is CONTAINS, but the corner distance sqrt(32) is
      greater than 5.
    expectedSourceBehavior:
    - Phase two reaches the farthest-point check.
    - The failed farthest-point containment check returns INTERSECTS.
    - The common translation preserves INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE_TWO_DISJOINT_FROM_LOWER_LEFT_CORNER
    category: NORMAL
    description: The rectangle overlaps the circle's enclosing box but is separated
      from the circle at its closest lower-left corner.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [4, 6] by [4, 6].
    - The enclosing boxes intersect.
    - Both circle axes lie outside the rectangle and the closest corner distance sqrt(32)
      is greater than 5.
    expectedSourceBehavior:
    - Phase two evaluates the closest corner and returns DISJOINT.
    - The translated closest-corner geometry is congruent and also returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE_TWO_INTERSECTS_X_OUTSIDE_Y_INSIDE
    category: NORMAL
    description: The circle center is left of the rectangle but vertically within
      it, producing a genuine circle-rectangle intersection.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [4, 6] by [-1, 1].
    - X axis is outside the rectangle, Y axis is inside it, and the closest point
      is at distance 4 from the center.
    - The enclosing boxes intersect.
    expectedSourceBehavior:
    - The closest-point test cannot classify the shapes as disjoint.
    - Because the rectangle is not contained by the enclosing box, phase two returns
      INTERSECTS.
    - The follow-up returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE_TWO_INTERSECTS_X_INSIDE_Y_OUTSIDE
    category: NORMAL
    description: The circle center is below the rectangle but horizontally within
      it, exercising the symmetric Y-axis branch.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-1, 1] by [4, 6].
    - X axis is inside the rectangle, Y axis is outside it, and the closest point
      is at distance 4.
    - The enclosing boxes intersect.
    expectedSourceBehavior:
    - The closest-point test establishes intersection rather than disjointness.
    - The non-CONTAINS bounding-box relation causes phase two to return INTERSECTS.
    - The translated result remains INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE_TWO_INTERSECTS_BOTH_AXES_INSIDE
    category: NORMAL
    description: Both circle axes lie inside the rectangle, but the rectangle extends
      beyond one side of the circle's enclosing box.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-6, 3] by [-1, 1].
    - Both axes are within the rectangle, while the enclosing-box relation is INTERSECTS
      rather than CONTAINS.
    expectedSourceBehavior:
    - The closest-point disjoint test is bypassed because the rectangle spans both
      axes.
    - Phase two returns INTERSECTS because bboxSect is not CONTAINS.
    - The follow-up returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXTERNAL_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at a closest corner exactly on the
      circle boundary.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [3, 5] by [4, 6].
    - Both axes are outside the rectangle and the closest corner (3, 4) has distance
      exactly 5.
    - The enclosing boxes intersect.
    expectedSourceBehavior:
    - The closest-point containment test treats the boundary contact as non-disjoint.
    - The source relation is INTERSECTS, and the follow-up remains INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle is within the circle's enclosing box and its farthest
      corner lies exactly on the circle boundary.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-3, 3] by [-4, 4].
    - The enclosing-box relation is CONTAINS and the farthest corner distance sqrt(25)
      equals the radius.
    expectedSourceBehavior:
    - The closest-point test does not return DISJOINT.
    - The farthest-point containment test accepts the boundary and relate(Rectangle)
      returns CONTAINS.
    - The translated result remains CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EDGE_TANGENCY_ON_RECTANGLE_SIDE
    category: BOUNDARY
    description: The rectangle reaches the circle's rightmost boundary along a nonzero
      vertical interval.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [5, 7] by [-5, 5].
    - The closest points include the boundary point (5, 0), and the enclosing boxes
      intersect at the X boundary.
    expectedSourceBehavior:
    - The axis-based closest-point logic recognizes contact rather than disjointness.
    - Since the rectangle is not contained by the enclosing box, the result is INTERSECTS.
    - The follow-up result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_RECTANGLE_INSIDE_CIRCLE
    category: EDGE
    description: A zero-width vertical rectangle segment lies strictly inside the
      circle.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [1, 1] by [-2, 2].
    - The rectangle has minX equal to maxX, and both endpoints are inside the circle.
    expectedSourceBehavior:
    - The enclosing-box relation is CONTAINS.
    - The farthest endpoint distance sqrt(5) is less than 5, so relate(Rectangle)
      returns CONTAINS.
    - The follow-up preserves the zero width and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_RECTANGLE_INSIDE_CIRCLE
    category: EDGE
    description: A zero-height horizontal rectangle segment lies strictly inside the
      circle.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [-2, 2] by [1, 1].
    - The rectangle has minY equal to maxY, and both endpoints are inside the circle.
    expectedSourceBehavior:
    - The enclosing-box relation is CONTAINS and the farthest endpoint is inside the
      circle.
    - relate(Rectangle) returns CONTAINS.
    - The translated result remains CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_RECTANGLE_INSIDE_CIRCLE
    category: EDGE
    description: The rectangle degenerates to one point that is not the circle center
      but is inside the circle.
    preconditions:
    - Center is (0, 0), radius is 5, and rectangle bounds are [1, 1] by [1, 1].
    - The point distance sqrt(2) is less than 5.
    expectedSourceBehavior:
    - The enclosing-box relation is CONTAINS.
    - The single farthest and closest rectangle point is inside the circle, so the
      source result is CONTAINS.
    - The follow-up remains CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_WITHIN_RECTANGLE
    category: EDGE
    description: The circle has zero radius and its center is strictly inside a positive-area
      rectangle.
    preconditions:
    - Center is (0, 0), radius is 0, and rectangle bounds are [-1, 1] by [-2, 2].
    - The circle's enclosing box is the point [0, 0] by [0, 0], strictly within the
      rectangle.
    expectedSourceBehavior:
    - The enclosing-box shortcut returns WITHIN.
    - The follow-up preserves the zero radius and returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_FROM_RECTANGLE_POINT
    category: EDGE
    description: A zero-radius circle is separated from a degenerate rectangle point.
    preconditions:
    - Center is (0, 0), radius is 0, and rectangle bounds are [1, 1] by [1, 1].
    - The circle enclosing-box point and rectangle point are disjoint.
    expectedSourceBehavior:
    - The enclosing-box shortcut returns DISJOINT.
    - The translated point separation is unchanged, so the follow-up returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_CIRCLE_CONTAINS_RECTANGLE
    category: NORMAL
    description: A large circle contains a rectangle that is far from the enclosing-box
      equality and all of whose corners are comfortably inside.
    preconditions:
    - Center is (10, -8), radius is 20, and rectangle bounds are [4, 16] by [-14,
      -2].
    - The rectangle is strictly contained by the circle's enclosing box and its farthest
      corner distance is less than 20.
    expectedSourceBehavior:
    - The phase-two CONTAINS path succeeds on the farthest-point test.
    - relate(Rectangle) returns CONTAINS.
    - Adding the supplied shift to both shapes preserves CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_PARTIALLY_OVERLAPS_CIRCLE_BOUNDING_BOX
    category: NORMAL
    description: The rectangle crosses the circle's enclosing box on one side and
      overlaps the circle itself without being contained.
    preconditions:
    - Center is (10, -8), radius is 4, and rectangle bounds are [6, 14] by [-10, -4].
    - The rectangle's enclosing-box relation is INTERSECTS and the shapes have a nonempty
      overlap.
    expectedSourceBehavior:
    - The bounding-box shortcut does not decide the result.
    - Phase two returns INTERSECTS because bboxSect is not CONTAINS.
    - The follow-up returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
