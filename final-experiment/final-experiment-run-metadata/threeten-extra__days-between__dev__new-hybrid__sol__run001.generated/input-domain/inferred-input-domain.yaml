InputDomain:
  summary: Non-null, day-capable Java temporal pairs for which both the source call
    and the common 37-day shift complete successfully and produce an int-sized whole-day
    count.
  globalConstraints:
  - Both source arguments are non-null Temporal instances, as required by the follow-up
    generator and the target's DAYS.between operation.
  - 'The source pair is compatible with ChronoUnit.DAYS.between: startDateInclusive.until(endDateExclusive,
    DAYS) completes without DateTimeException, UnsupportedTemporalTypeException, or
    type-conversion failure.'
  - Each endpoint supports endpoint.plus(37, ChronoUnit.DAYS), and that operation
    completes without DateTimeException or ArithmeticException.
  - Both the source and shifted DAYS.between results are within Integer.MIN_VALUE
    through Integer.MAX_VALUE inclusive, because Days.between applies Math.toIntExact.
  - 'The domain uses standard day-capable temporal families: LocalDate, LocalDateTime,
    Instant, OffsetDateTime, ZonedDateTime, and Java chronology-specific dates supporting
    DAYS.'
  - 'Both endpoints use the same temporal family and day coordinate system: chronology-specific
    dates have the same chronology, OffsetDateTime endpoints have the same ZoneOffset,
    and ZonedDateTime endpoints have the same ZoneId.'
  - For ZonedDateTime inputs, adding 37 days preserves each endpoint's local time;
    inputs whose shifted local date-time is adjusted because it falls in a zone gap
    are excluded because the MR assumes an equal calendar-day translation.
  - Mixed temporal families, mixed chronologies, mixed offsets, and mixed zones are
    excluded because equal-looking 37-day additions can represent unequal translations
    and therefore are outside the supplied MR's invariance premise.
  - Null, unsupported-DAYS, incompatible-pair, shift-overflow, and int-overflow cases
    are excluded because the supplied MR requests successful outputs rather than invalid-input
    or exception relations.
  diversity:
    temporalFamily:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - HijrahDate
    - ThaiBuddhistDate
    sourceDirection:
    - end-equals-start
    - end-after-start
    - end-before-start
    resultClass:
    - zero
    - one
    - negative-one
    - positive-non-singleton
    - negative-non-singleton
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    calendarFeature:
    - ordinary-date
    - month-boundary
    - year-boundary
    - leap-day
    - non-leap-February
    - chronology-era
    - chronology-calendar
    subDayRelation:
    - not-applicable
    - less-than-one-day
    - exactly-one-day
    - more-than-one-day
    - negative-fractional-day
    zoneFeature:
    - no-zone
    - fixed-offset
    - spring-gap-transition
    - autumn-overlap-transition
    shiftHeadroom:
    - ordinary
    - shifted-end-at-maximum
    - source-at-minimum
  scenarios:
  - id: LOCAL_DATE_EQUAL_ENDPOINTS
    category: EDGE
    description: Two equal LocalDate endpoints produce the Days.ZERO sentinel path.
    preconditions:
    - startDateInclusive and endDateExclusive are the same LocalDate.
    - The date is no later than LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_POSITIVE_ONE_DAY
    category: BOUNDARY
    description: A LocalDate end exactly one day after the start reaches the Days.ONE
      sentinel path.
    preconditions:
    - Both endpoints are LocalDate values.
    - endDateExclusive equals startDateInclusive.plusDays(1).
    - endDateExclusive is no later than LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_ONE_DAY
    category: BOUNDARY
    description: A LocalDate end exactly one day before the start exercises a negative
      result.
    preconditions:
    - Both endpoints are LocalDate values.
    - endDateExclusive equals startDateInclusive.minusDays(1).
    - Both endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_DAY_FORWARD
    category: NORMAL
    description: Ordinary forward LocalDate intervals exercise positive non-singleton
      Days values.
    preconditions:
    - Both endpoints are LocalDate values.
    - The endpoint epoch-day differences are respectively 37 and 400 for the two cases.
    - Both endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - The two source getAmount() values are respectively 37 and 400.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_DAY_REVERSE
    category: NORMAL
    description: Ordinary reverse LocalDate intervals exercise negative non-singleton
      Days values.
    preconditions:
    - Both endpoints are LocalDate values.
    - The endpoint epoch-day differences are respectively -37 and -400 for the two
      cases.
    - Both endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - The two source getAmount() values are respectively -37 and -400.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: EDGE
    description: Forward intervals cross February 29 in leap years.
    preconditions:
    - The cases are LocalDate intervals 2020-02-28 to 2020-03-01 and 2000-02-28 to
      2000-03-01.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY
    category: EDGE
    description: A comparable February interval in a non-leap year distinguishes the
      absent leap day.
    preconditions:
    - The endpoints are LocalDate values 2019-02-28 and 2019-03-01.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_AND_YEAR_BOUNDARIES
    category: EDGE
    description: Adjacent dates cross a month boundary and a year boundary.
    preconditions:
    - One case is LocalDate 2021-01-31 to 2021-02-01.
    - The other case is LocalDate 2020-12-31 to 2021-01-01.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_INT_GAP
    category: BOUNDARY
    description: A representable LocalDate gap reaches the largest amount accepted
      by Math.toIntExact.
    preconditions:
    - startDateInclusive is LocalDate.ofEpochDay(0).
    - endDateExclusive is LocalDate.ofEpochDay(Integer.MAX_VALUE).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_INT_GAP
    category: BOUNDARY
    description: A representable reverse LocalDate gap reaches the smallest amount
      accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive is LocalDate.ofEpochDay(0).
    - endDateExclusive is LocalDate.ofEpochDay(Integer.MIN_VALUE).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_DATE_ENDPOINT
    category: BOUNDARY
    description: The source starts at LocalDate.MIN while retaining enough forward-shift
      headroom.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SHIFT_REACHES_MAXIMUM
    category: BOUNDARY
    description: An endpoint lies exactly 37 days below LocalDate.MAX, so its follow-up
      reaches LocalDate.MAX.
    preconditions:
    - startDateInclusive equals endDateExclusive.
    - Both are LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - The source call returns normally with getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_SUBDAY
    category: EDGE
    description: Positive LocalDateTime intervals shorter than a whole day truncate
      to zero days.
    preconditions:
    - Both endpoints are LocalDateTime values.
    - The two elapsed local-time differences are positive and respectively 1 second
      and 23 hours 59 minutes 59 seconds.
    - Both endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: A LocalDateTime interval of exactly 24 local hours reaches one whole
      day.
    preconditions:
    - endDateExclusive equals startDateInclusive.plusDays(1).
    - The endpoints have the same local time.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_DAY_PLUS_FRACTION
    category: EDGE
    description: Positive LocalDateTime intervals longer than one day but shorter
      than two demonstrate whole-day truncation.
    preconditions:
    - Both endpoints are LocalDateTime values.
    - The two local differences are respectively 24 hours 1 second and 47 hours 59
      minutes 59 seconds.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_SUBDAY
    category: EDGE
    description: Negative LocalDateTime intervals shorter than one whole day truncate
      toward zero.
    preconditions:
    - Both endpoints are LocalDateTime values.
    - The two differences are respectively -1 second and -23 hours 59 minutes 59 seconds.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_WHOLE_DAY
    category: EDGE
    description: Reverse LocalDateTime intervals at and just beyond one complete day
      produce negative one.
    preconditions:
    - Both endpoints are LocalDateTime values.
    - The two differences are respectively -24 hours and -24 hours 1 second.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to -1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INSTANT_POSITIVE_SUBDAY
    category: EDGE
    description: Positive Instant durations below 86400 seconds contain no whole ChronoUnit.DAYS.
    preconditions:
    - Both endpoints are Instant values.
    - The duration differences are respectively 1 second and 86399 seconds.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_WHOLE_DAYS
    category: BOUNDARY
    description: Instant durations that are exact multiples of 86400 seconds produce
      exact whole-day amounts.
    preconditions:
    - Both endpoints are Instant values.
    - The duration differences are respectively 86400 seconds and 864000 seconds.
    expectedSourceBehavior:
    - The source getAmount() values are respectively 1 and 10.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_TRUNCATION
    category: EDGE
    description: Reverse Instant durations cover truncation immediately above and
      at negative one day.
    preconditions:
    - Both endpoints are Instant values.
    - The duration differences are respectively -86399 seconds and -86400 seconds.
    expectedSourceBehavior:
    - The source getAmount() values are respectively 0 and -1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INSTANT_INT_RESULT_LIMITS
    category: BOUNDARY
    description: Exact Instant durations reach both int-sized result limits without
      Math.toIntExact overflow.
    preconditions:
    - One case starts at Instant.EPOCH and ends Integer.MAX_VALUE times 86400 seconds
      later.
    - The other case starts at Instant.EPOCH and ends Integer.MIN_VALUE times 86400
      seconds later.
    - All endpoints remain valid after adding 37 days.
    expectedSourceBehavior:
    - The source getAmount() values are respectively Integer.MAX_VALUE and Integer.MIN_VALUE.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EQUAL
    category: EDGE
    description: Equal OffsetDateTime endpoints with the same fixed offset produce
      zero.
    preconditions:
    - startDateInclusive equals endDateExclusive as an OffsetDateTime.
    - The value can be shifted forward by 37 days.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EXACT_FORWARD_AND_REVERSE
    category: NORMAL
    description: Same-offset OffsetDateTime endpoints exercise exact positive and
      negative whole-day counts.
    preconditions:
    - Each pair has one shared ZoneOffset.
    - One end is exactly 7 local days after its start and the other is exactly 7 local
      days before its start.
    expectedSourceBehavior:
    - The source getAmount() values are respectively 7 and -7.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SUBDAY_TRUNCATION
    category: EDGE
    description: Same-offset OffsetDateTime intervals on either side of zero remain
      below one whole day.
    preconditions:
    - Each pair has one shared ZoneOffset.
    - The differences are respectively positive 23 hours and negative 23 hours.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_TRANSITION
    category: EDGE
    description: Same-zone noon-to-noon intervals cross spring daylight-saving gaps
      while remaining one calendar day apart.
    preconditions:
    - One case uses America/New_York from 2021-03-13T12:00 to 2021-03-14T12:00.
    - One case uses Europe/Berlin from 2021-03-27T12:00 to 2021-03-28T12:00.
    - Adding 37 days preserves noon for every endpoint.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_TRANSITION
    category: EDGE
    description: Same-zone noon-to-noon intervals cross autumn daylight-saving overlaps
      while remaining one calendar day apart.
    preconditions:
    - One case uses America/New_York from 2021-11-06T12:00 to 2021-11-07T12:00.
    - One case uses Europe/Berlin from 2021-10-30T12:00 to 2021-10-31T12:00.
    - Adding 37 days preserves noon for every endpoint.
    expectedSourceBehavior:
    - Each source call returns normally with getAmount() equal to 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_REVERSE_MULTI_DAY
    category: NORMAL
    description: A same-zone ZonedDateTime interval has its end several calendar days
      before its start.
    preconditions:
    - Both endpoints use UTC as their ZoneId and have the same local time.
    - endDateExclusive is 10 local days before startDateInclusive.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_BOUNDARY
    category: EDGE
    description: JapaneseDate endpoints cross the 2019 transition from the Heisei
      era to the Reiwa era.
    preconditions:
    - startDateInclusive is JapaneseDate.from(LocalDate.of(2019, 4, 30)).
    - endDateExclusive is JapaneseDate.from(LocalDate.of(2019, 5, 2)).
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MONTH_BOUNDARY
    category: EDGE
    description: A same-chronology HijrahDate interval crosses one of its month boundaries.
    preconditions:
    - Both endpoints use the same HijrahChronology.
    - The start is the final valid day of a Hijrah month.
    - The end is startDateInclusive.plus(2, DAYS).
    - Both endpoints and their 37-day shifts are within the chronology's supported
      range.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_DIRECTIONS
    category: NORMAL
    description: ThaiBuddhistDate pairs cover forward and reverse intervals in the
      same chronology.
    preconditions:
    - All endpoints are ThaiBuddhistDate values in the same chronology.
    - One endpoint epoch-day difference is 30 and the other is -30.
    - All endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - The source getAmount() values are respectively 30 and -30.
    targetCases: 2
    emptyOutputAllowed: false
