InputDomain:
  summary: Finite, non-empty, rectangular double matrices covering scalar, vector,
    rectangular, square, rank-deficient, pivot-sensitive, and EPSILON-boundary inputs;
    each source matrix is transposed by the supplied follow-up and the two returned
    ranks are required to match.
  globalConstraints:
  - The source is a non-null double[][] with at least one row.
  - The source has at least one column, because computeRank reads matrix[0].length
    and the follow-up reads source[0].
  - Every row is non-null and has exactly the same positive length as every other
    row.
  - Every entry is a finite double; NaN and positive or negative infinity are excluded
    because the supplied rank algorithm and its EPSILON comparison do not define a
    finite linear-algebra rank for non-finite values.
  - The source remains available for comparison after invocation; computeRank deep-copies
    the matrix before elimination, so source entries must be checked for non-mutation.
  - The follow-up is exactly the rectangular transpose generated by generateFollowUp,
    and assertRelation requires the source and follow-up integer ranks to be equal.
  diversity:
    shape:
    - 1x1
    - 1xN
    - Mx1
    - 2x2
    - 3x3
    - 2x3
    - 3x2
    - 3x4
    - 4x3
    - with M and N positive
    rankClass:
    - zero
    - one
    - full row rank
    - full column rank
    - full square rank
    - intermediate rank
    pivotAvailability:
    - no pivot in a column
    - first row pivot
    - later row pivot
    - pivot only after leading zero columns
    - pivot after previously marked rows
    rowInteraction:
    - all other pivot-column entries zero
    - elimination of nonzero entries in other rows
    - proportional rows
    - independent rows
    - cancellation to an exact zero
    magnitudeClass:
    - zero
    - absolute value below EPSILON
    - exactly EPSILON
    - absolute value above EPSILON
    - negative values
    - mixed finite magnitudes
    transposeShapeEffect:
    - square remains square
    - 1xN becomes Nx1
    - Mx1 becomes 1xM
    - tall becomes wide
    - wide becomes tall
    observableChecks:
    - returned rank is an integer
    - rank is bounded by the smaller dimension
    - source matrix is unchanged
    - transpose relation assertion succeeds
  scenarios:
  - id: ZERO_SINGLETON
    category: BOUNDARY
    description: A 1x1 matrix whose only entry is zero.
    preconditions:
    - matrix.length == 1
    - matrix[0].length == 1
    - matrix[0][0] == 0.0
    expectedSourceBehavior:
    - computeRank returns 0 because the only column has no nonzero pivot.
    - The 1x1 transpose has the same entry and must also return 0.
    - The source entry remains zero after invocation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONZERO_SINGLETON
    category: BOUNDARY
    description: A 1x1 matrix whose only entry is nonzero.
    preconditions:
    - matrix.length == 1
    - matrix[0].length == 1
    - matrix[0][0] != 0.0
    expectedSourceBehavior:
    - computeRank returns 1 after selecting the sole entry as a pivot.
    - The transpose has the same rank.
    - The source entry is not modified by normalization because elimination uses a
      deep copy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_ROW_VECTOR
    category: EDGE
    description: A single row with at least two columns, all entries zero.
    preconditions:
    - matrix.length == 1
    - matrix[0].length >= 2
    - Every matrix[0][c] == 0.0
    expectedSourceBehavior:
    - Every column reaches the no-pivot path and computeRank returns 0.
    - The transposed column vector also has rank 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_COLUMN_VECTOR
    category: EDGE
    description: A single column with at least two rows, all entries zero.
    preconditions:
    - matrix.length >= 2
    - matrix[0].length == 1
    - Every matrix[r][0] == 0.0
    expectedSourceBehavior:
    - The sole column reaches the no-pivot path and computeRank returns 0.
    - The transposed row vector also has rank 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RECTANGULAR_MATRIX
    category: BOUNDARY
    description: A zero matrix with both dimensions at least two.
    preconditions:
    - matrix.length >= 2
    - matrix[0].length >= 2
    - Every entry is 0.0
    expectedSourceBehavior:
    - No column has a suitable pivot, so computeRank returns 0.
    - The transpose follows the same all-no-pivot path and returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONZERO_ROW_VECTOR
    category: NORMAL
    description: A 1xN row vector with at least one nonzero entry.
    preconditions:
    - matrix.length == 1
    - matrix[0].length >= 2
    - At least one entry is nonzero
    expectedSourceBehavior:
    - The first column containing a nonzero entry selects the sole row and computeRank
      returns 1.
    - Later columns cannot select another row because the only row is marked.
    - The transposed column vector returns the same rank.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NONZERO_COLUMN_VECTOR
    category: NORMAL
    description: An Mx1 column vector with at least one nonzero entry.
    preconditions:
    - matrix.length >= 2
    - matrix[0].length == 1
    - At least one entry is nonzero
    expectedSourceBehavior:
    - The first nonzero row is selected as the sole pivot and computeRank returns
      1.
    - No second pivot can be selected because there is only one column.
    - The transpose returns rank 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: IDENTITY_TWO_BY_TWO
    category: NORMAL
    description: The 2x2 identity matrix.
    preconditions:
    - matrix has shape 2x2
    - matrix[0] == [1.0, 0.0]
    - matrix[1] == [0.0, 1.0]
    expectedSourceBehavior:
    - Each column selects a different unmarked row and computeRank returns 2.
    - Normalization has no non-pivot entries to alter for the final pivot.
    - The transpose is identical and returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IDENTITY_THREE_BY_THREE
    category: NORMAL
    description: The 3x3 identity matrix, exercising three successive pivots.
    preconditions:
    - matrix has shape 3x3
    - matrix[r][c] == 1.0 exactly when r == c, and 0.0 otherwise
    expectedSourceBehavior:
    - Each of the three columns finds a distinct unmarked pivot row.
    - computeRank returns 3 and the transpose returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULL_ROW_RANK_WIDE
    category: NORMAL
    description: A wide 2x3 matrix with two independent rows.
    preconditions:
    - matrix has shape 2x3
    - matrix[0] == [1.0, 0.0, 2.0]
    - matrix[1] == [0.0, 1.0, 3.0]
    expectedSourceBehavior:
    - The first two columns select different rows and computeRank returns 2.
    - The third column has no unmarked row available and does not increase rank.
    - The 3x2 transpose also returns 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FULL_COLUMN_RANK_TALL
    category: NORMAL
    description: A tall 3x2 matrix with two independent columns.
    preconditions:
    - matrix has shape 3x2
    - matrix[0] == [1.0, 0.0]
    - matrix[1] == [0.0, 1.0]
    - matrix[2] == [1.0, 1.0]
    expectedSourceBehavior:
    - The first column selects row 0 and the second selects another unmarked row.
    - computeRank returns 2, the maximum possible for two columns.
    - The 2x3 transpose returns 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FULL_RANK_RECTANGULAR_THREE_BY_FOUR
    category: NORMAL
    description: A 3x4 matrix with three independent rows and more columns than rows.
    preconditions:
    - matrix has shape 3x4
    - matrix[0] == [1.0, 0.0, 0.0, 1.0]
    - matrix[1] == [0.0, 1.0, 0.0, 2.0]
    - matrix[2] == [0.0, 0.0, 1.0, 3.0]
    expectedSourceBehavior:
    - The first three columns select all three rows and computeRank returns 3.
    - The fourth column executes after all rows are marked and cannot increase rank.
    - The 4x3 transpose returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_WITH_ZERO
    category: NORMAL
    description: A 3x3 diagonal matrix with exactly one zero diagonal entry.
    preconditions:
    - matrix has shape 3x3
    - matrix[0][0] and matrix[2][2] are nonzero
    - matrix[1][1] == 0.0
    - Every off-diagonal entry is 0.0
    expectedSourceBehavior:
    - Two columns select pivots and the zero diagonal column has no suitable unmarked
      row.
    - computeRank returns 2 and the transpose returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PROPORTIONAL_ROWS
    category: NORMAL
    description: A 3x3 matrix with nonzero proportional rows and rank one.
    preconditions:
    - matrix[0] == [1.0, 2.0, 3.0]
    - matrix[1] == [2.0, 4.0, 6.0]
    - matrix[2] == [-3.0, -6.0, -9.0]
    expectedSourceBehavior:
    - The first pivot eliminates the later proportional rows.
    - Subsequent columns find no suitable unmarked pivot, so computeRank returns 1.
    - The transpose also represents a rank-one matrix and must return 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DUPLICATE_ROWS_WITH_ZERO_ROW
    category: NORMAL
    description: A 3x3 matrix containing two equal nonzero rows and one zero row.
    preconditions:
    - matrix[0] == [1.0, 2.0, 0.0]
    - matrix[1] == [1.0, 2.0, 0.0]
    - matrix[2] == [0.0, 0.0, 0.0]
    expectedSourceBehavior:
    - The first pivot eliminates the duplicate row and the zero row contributes no
      pivot.
    - computeRank returns 1 and the transpose returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATE_ROW_PIVOT
    category: NORMAL
    description: A matrix whose first nonzero pivot in a column occurs below one or
      more zero entries.
    preconditions:
    - matrix has shape 3x2
    - matrix[0] == [0.0, 1.0]
    - matrix[1] == [2.0, 0.0]
    - matrix[2] == [0.0, 0.0]
    expectedSourceBehavior:
    - Column zero skips row 0 and selects the later unmarked row 1.
    - Column one then selects row 0, so computeRank returns 2.
    - The transpose returns 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LEADING_ZERO_COLUMNS
    category: EDGE
    description: A matrix with one or more all-zero leading columns before independent
      pivot columns.
    preconditions:
    - matrix has shape 2x4
    - Column 0 and column 1 are entirely zero
    - matrix[0][2] == 1.0 and matrix[1][3] == 1.0
    - All unspecified entries are 0.0
    expectedSourceBehavior:
    - The first two columns take the no-pivot path.
    - Columns two and three select distinct rows, so computeRank returns 2.
    - The transpose returns 2 despite moving zero columns to zero rows.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MARKED_ROW_SKIP
    category: NORMAL
    description: A pivot in an early column marks a row that would otherwise be the
      first nonzero row in a later column.
    preconditions:
    - matrix has shape 3x3
    - matrix[0] == [1.0, 1.0, 0.0]
    - matrix[1] == [0.0, 0.0, 1.0]
    - matrix[2] == [0.0, 2.0, 0.0]
    expectedSourceBehavior:
    - Column zero marks row 0.
    - A later column must skip marked row 0 and select an unmarked row, exercising
      the rowMarked condition.
    - computeRank returns 2 and the transpose returns 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ELIMINATION_NONZERO_OTHER_ROWS
    category: NORMAL
    description: A matrix where a selected pivot column is nonzero in multiple other
      rows, requiring elimination updates.
    preconditions:
    - matrix has shape 3x3
    - matrix[0] == [2.0, 1.0, 3.0]
    - matrix[1] == [4.0, 0.0, 6.0]
    - matrix[2] == [-2.0, 5.0, 1.0]
    expectedSourceBehavior:
    - The first pivot has nonzero entries in both other rows, so eliminateRows updates
      later columns for both.
    - The returned rank is an integer no greater than 3 and must equal the transposed
      result.
    - The caller's original entries remain unchanged.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ELIMINATION_ZERO_OTHER_ROWS
    category: EDGE
    description: A pivot column has zero entries in every non-pivot row, so elimination's
      conditional body is skipped.
    preconditions:
    - matrix has shape 3x3
    - matrix[0] == [1.0, 2.0, 3.0]
    - matrix[1] == [0.0, 4.0, 5.0]
    - matrix[2] == [0.0, 6.0, 7.0]
    expectedSourceBehavior:
    - For the first pivot, other rows fail the isZero-negation condition and receive
      no elimination update.
    - Later columns still exercise additional pivot selection.
    - Source and transpose ranks must match.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_ROW_DEPENDENCE_AFTER_ELIMINATION
    category: NORMAL
    description: Independent-looking rows become exactly dependent after pivot elimination.
    preconditions:
    - matrix has shape 3x3
    - matrix[0] == [1.0, 2.0, 3.0]
    - matrix[1] == [2.0, 4.0, 6.0]
    - matrix[2] == [1.0, 0.0, 1.0]
    expectedSourceBehavior:
    - Elimination removes the first-column components and produces exact zero patterns
      for dependent portions.
    - computeRank returns the rank produced by the pivot process, and the transpose
      must return the same integer.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPSILON_BELOW_PIVOT
    category: BOUNDARY
    description: A sole candidate pivot has magnitude strictly below EPSILON.
    preconditions:
    - matrix has shape 1x1
    - 0.0 < abs(matrix[0][0]) < 1e-10
    expectedSourceBehavior:
    - isZero treats the entry as zero because abs(value) < EPSILON.
    - computeRank returns 0 and the transpose returns 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EPSILON_EXACT_PIVOT
    category: BOUNDARY
    description: A sole candidate pivot has magnitude exactly EPSILON.
    preconditions:
    - matrix has shape 1x1
    - abs(matrix[0][0]) == 1e-10
    expectedSourceBehavior:
    - isZero does not treat the entry as zero because the comparison is strictly less
      than EPSILON.
    - computeRank returns 1 and the transpose returns 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EPSILON_ABOVE_PIVOT
    category: BOUNDARY
    description: A sole candidate pivot has magnitude strictly above EPSILON.
    preconditions:
    - matrix has shape 1x1
    - abs(matrix[0][0]) > 1e-10
    expectedSourceBehavior:
    - The entry is accepted as a pivot and computeRank returns 1.
    - The transpose preserves that result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_PIVOTS
    category: NORMAL
    description: A matrix whose pivots and eliminations use negative nonzero values.
    preconditions:
    - matrix has shape 2x2
    - matrix[0] == [-2.0, -1.0]
    - matrix[1] == [0.0, -3.0]
    expectedSourceBehavior:
    - Negative values are nonzero under isZero, so both columns select pivots.
    - computeRank returns 2 and the transpose returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_MAGNITUDES
    category: EDGE
    description: A full-rank matrix mixing values much smaller and much larger than
      one.
    preconditions:
    - matrix has shape 2x2
    - matrix[0] == [1.0e-8, 1.0e8]
    - matrix[1] == [-1.0e8, 1.0e-8]
    - The determinant is nonzero
    expectedSourceBehavior:
    - Both pivot candidates are far outside the EPSILON zero interval.
    - computeRank returns 2 and the transpose returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERMUTED_IDENTITY
    category: NORMAL
    description: A square permutation matrix whose pivots occur in different row positions
      from the diagonal identity.
    preconditions:
    - matrix has shape 3x3
    - Every row and column contains exactly one 1.0 and all other entries are 0.0
    expectedSourceBehavior:
    - Pivot selection must locate later rows when the current column's first rows
      are zero.
    - computeRank returns 3 and the transpose, also a permutation matrix, returns
      3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERMEDIATE_RANK_THREE_BY_FOUR
    category: NORMAL
    description: A 3x4 matrix with rank two and a redundant fourth column.
    preconditions:
    - matrix has shape 3x4
    - matrix[0] == [1.0, 0.0, 1.0, 2.0]
    - matrix[1] == [0.0, 1.0, 1.0, 3.0]
    - matrix[2] == [1.0, 1.0, 2.0, 5.0]
    expectedSourceBehavior:
    - The third row is the sum of the first two, and the fourth column is the sum
      of the first two columns.
    - The pivot process returns 2, while the 4x3 transpose must also return 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RECTANGULAR_SINGLE_NONZERO
    category: EDGE
    description: A non-square matrix with exactly one nonzero entry away from the
      first row and first column.
    preconditions:
    - matrix has shape 3x4
    - Exactly one entry is nonzero
    - That entry is at matrix[2][3]
    expectedSourceBehavior:
    - Leading columns take no-pivot paths until column three selects the later row.
    - computeRank returns 1 and the 4x3 transpose returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOURCE_COPY_PRESERVATION
    category: NORMAL
    description: A matrix requiring normalization and elimination, used to verify
      that computeRank does not mutate the supplied source.
    preconditions:
    - matrix has shape 2x3
    - matrix[0] == [2.0, 4.0, 6.0]
    - matrix[1] == [1.0, 3.0, 5.0]
    - Retain an exact deep snapshot before computeRank
    expectedSourceBehavior:
    - Normalization divides entries in the copied pivot row and elimination changes
      copied entries.
    - The returned rank is equal to the rank of the generated transpose.
    - Every source entry equals its pre-invocation snapshot after computeRank returns.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SQUARE_RANK_ZERO_TO_FULL_RANGE
    category: NORMAL
    description: Square matrices with dimension at least two and independently selected
      ranks represented by zero, one, and full rank cases.
    preconditions:
    - matrix is square with dimension 2 or 3
    - The selected cases are the zero matrix, a rank-one proportional-row matrix,
      or an identity matrix
    expectedSourceBehavior:
    - The cases exercise no pivots, one pivot followed by no new pivots, and a pivot
      in every column respectively.
    - Each source rank must equal the rank returned for its transpose.
    targetCases: 3
    emptyOutputAllowed: false
  - id: WIDE_TO_TALL_TRANSPOSE_PAIR
    category: NORMAL
    description: A wide matrix with at least two rows and strictly more columns than
      rows, containing both independent and redundant columns.
    preconditions:
    - matrix.length >= 2
    - matrix[0].length > matrix.length
    - At least two rows are linearly independent
    - At least one column is all zero or is a linear combination of other columns
    expectedSourceBehavior:
    - The source exercises columns beyond the maximum possible row rank.
    - The transpose changes the pivot traversal from more columns than rows to more
      rows than columns.
    - Both returned ranks must be equal and no greater than the smaller dimension.
    targetCases: 2
    emptyOutputAllowed: false
  - id: TALL_TO_WIDE_TRANSPOSE_PAIR
    category: NORMAL
    description: A tall matrix with at least two columns and strictly more rows than
      columns, containing unused rows after the maximum possible rank is reached.
    preconditions:
    - matrix.length > matrix[0].length
    - matrix[0].length >= 2
    - The columns are independent
    - At least one additional row is a linear combination of earlier rows or is zero
    expectedSourceBehavior:
    - Pivot selection must skip or mark rows while the column loop is limited by the
      number of columns.
    - computeRank reaches the number of independent columns and the transpose returns
      the same rank.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EPSILON_MIXED_COLUMN
    category: BOUNDARY
    description: A matrix containing entries both below and at or above EPSILON in
      the same columns.
    preconditions:
    - matrix has shape 2x2
    - abs(matrix[0][0]) < 1e-10
    - abs(matrix[1][0]) == 1e-10
    - abs(matrix[0][1]) > 1e-10
    - abs(matrix[1][1]) < 1e-10
    expectedSourceBehavior:
    - Pivot selection distinguishes strict-below-EPSILON values from values at or
      above EPSILON.
    - The result and the transposed result must satisfy assertRelation.
    targetCases: 2
    emptyOutputAllowed: false
