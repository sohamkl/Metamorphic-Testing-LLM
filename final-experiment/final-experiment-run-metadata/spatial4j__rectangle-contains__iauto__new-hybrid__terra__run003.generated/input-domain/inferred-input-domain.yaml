InputDomain:
  summary: Finite geographic rectangles and points with canonical longitudes, ordered
    latitude bounds, and no full-world (+360 degree) rectangle representation; covers
    latitude rejection, ordinary longitude containment/rejection, dateline unwrapping,
    shifted-longitude paths, zero-area rectangles, and antimeridian endpoint representations.
  globalConstraints:
  - rectangle.getContext().isGeo() is true; the MR rotates and normalizes longitude
    and is specified for a geo SpatialContext.
  - rectangle, point, and all rectangle/point coordinate values are non-null and finite;
    null is rejected by generateFollowUp and NaN/infinite coordinates do not provide
    a stable geometric source domain.
  - -180.0 <= rectangle.getMinX() <= 180.0, -180.0 <= rectangle.getMaxX() <= 180.0,
    and -180.0 <= point.getX() <= 180.0; these are the canonical longitude values
    preserved by DistanceUtils.normLonDEG.
  - rectangle.getMinY() <= rectangle.getMaxY(); RectangleImpl.reset explicitly requires
    this ordering except for NaN, which is excluded.
  - rectangle.getMaxX() - rectangle.getMinX() < 360.0; the +360 full-world representation
    is excluded because independently normalizing both endpoints in the supplied follow-up
    converts it into a zero-width rectangle.
  - source points are constructed from the same geo SpatialContext as the rectangle,
    so the source and follow-up use the same coordinate interpretation.
  diversity:
    longitudeTopology:
    - ordinary_minX_less_than_or_equal_to_maxX
    - dateline_wrapping_minX_greater_than_maxX
    - antimeridian_zero_width_at_minus_180
    - antimeridian_zero_width_at_plus_180
    - raw_width_minus_360_zero_width
    latitudePosition:
    - strictly_inside
    - exactly_minY
    - exactly_maxY
    - below_minY
    - above_maxY
    - zero_height
    longitudePosition:
    - strictly_inside
    - exactly_minX
    - exactly_maxX
    - left_of_interval
    - right_of_interval
    - shifted_after_pX_less_than_minX
    - shifted_after_pX_greater_than_maxX
    - dateline_gap
    rectangleArea:
    - positive_area
    - zero_width
    - zero_height
    - point_rectangle
    rotationTopology:
    - ordinary_stays_ordinary
    - ordinary_becomes_dateline_wrapping
    - dateline_wrapping_becomes_ordinary
    - wide_ordinary_becomes_dateline_wrapping
  scenarios:
  - id: ORDINARY_INTERIOR_SHORT_CIRCUIT
    category: NORMAL
    description: Positive-area ordinary rectangle with a point strictly inside both
      coordinate ranges.
    preconditions:
    - rectangle coordinates are [0.0, 10.0, 0.0, 10.0] and point coordinates are [5.0,
      5.0].
    expectedSourceBehavior:
    - relate returns CONTAINS through the geo in-range short-circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MIN_X_BOUNDARY
    category: BOUNDARY
    description: Point lies on the ordinary rectangle's west/minimum longitude edge.
    preconditions:
    - rectangle coordinates are [0.0, 10.0, 0.0, 10.0] and point coordinates are [0.0,
      5.0].
    expectedSourceBehavior:
    - relate returns CONTAINS because longitude equality is inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MAX_X_BOUNDARY
    category: BOUNDARY
    description: Point lies on the ordinary rectangle's east/maximum longitude edge.
    preconditions:
    - rectangle coordinates are [0.0, 10.0, 0.0, 10.0] and point coordinates are [10.0,
      5.0].
    expectedSourceBehavior:
    - relate returns CONTAINS because longitude equality is inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MIN_Y_BOUNDARY
    category: BOUNDARY
    description: Point lies on the minimum latitude edge while longitude is interior.
    preconditions:
    - rectangle coordinates are [0.0, 10.0, 0.0, 10.0] and point coordinates are [5.0,
      0.0].
    expectedSourceBehavior:
    - relate returns CONTAINS because latitude equality is not rejected.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MAX_Y_BOUNDARY
    category: BOUNDARY
    description: Point lies on the maximum latitude edge while longitude is interior.
    preconditions:
    - rectangle coordinates are [0.0, 10.0, 0.0, 10.0] and point coordinates are [5.0,
      10.0].
    expectedSourceBehavior:
    - relate returns CONTAINS because latitude equality is not rejected.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_LOWER_LEFT_CORNER
    category: BOUNDARY
    description: Point is exactly on both minimum coordinate boundaries.
    preconditions:
    - rectangle coordinates are [0.0, 10.0, 0.0, 10.0] and point coordinates are [0.0,
      0.0].
    expectedSourceBehavior:
    - relate returns CONTAINS at the inclusive lower-left corner.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_UPPER_RIGHT_CORNER
    category: BOUNDARY
    description: Point is exactly on both maximum coordinate boundaries.
    preconditions:
    - rectangle coordinates are [0.0, 10.0, 0.0, 10.0] and point coordinates are [10.0,
      10.0].
    expectedSourceBehavior:
    - relate returns CONTAINS at the inclusive upper-right corner.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_LONGITUDE_LEFT_DISJOINT
    category: NORMAL
    description: Point is west of an ordinary interval and enters the pX < minX shift
      path.
    preconditions:
    - rectangle coordinates are [0.0, 10.0, 0.0, 10.0] and point coordinates are [-1.0,
