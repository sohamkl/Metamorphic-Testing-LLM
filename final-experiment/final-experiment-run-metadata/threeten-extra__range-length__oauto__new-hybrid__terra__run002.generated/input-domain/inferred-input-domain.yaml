InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be advanced by 23
    days, covering bounded lengths, empty ranges, calendar boundaries, construction
    routes, unbounded-start sentinel behavior, and upper/lower representable-date
    boundaries.
  globalConstraints:
  - Source receiver is a non-null LocalDateRange successfully created by a documented
    construction candidate; invalid construction inputs are excluded because the supplied
    MR defines no invalid-input relation.
  - Source getEnd() must be no later than LocalDate.MAX.minusDays(23), because generateFollowUp()
    unconditionally evaluates range.getEnd().plusDays(23).
  - Consequently, ranges with an unbounded end, including ofUnbounded(), ofUnboundedEnd(...),
    and any range whose end is within the final 22 LocalDate values, are excluded
    because their follow-up cannot be generated without LocalDate arithmetic overflow.
  - Source and follow-up ranges must satisfy LocalDateRange construction invariants;
    in particular, start must not be LocalDate.MAX or LocalDate.MAX.minusDays(1),
    end must not be LocalDate.MIN or LocalDate.MIN.plusDays(1), and end must not precede
    start.
  diversity:
    boundedness:
    - distinct
    - measurable
    - bounded with start != LocalDate.MIN and end != LocalDate.MAX; unbounded-start
      with start == LocalDate.MIN and bounded end
    sourceLengthClass:
    - distinct
    - measurable
    - zero days; one day; ordinary multi-day; leap-month; year-sized; Integer.MAX_VALUE-23;
      Integer.MAX_VALUE; greater than Integer.MAX_VALUE; near full LocalDate domain
    constructionRoute:
    - distinct
    - measurable
    - of(LocalDate
    - LocalDate); of(LocalDate
    - Period); ofClosed; ofEmpty; ofUnboundedStart; parse date/date; parse date/period;
      parse period/date; from LocalDate; from Year; from YearMonth; from YearHalf;
      from YearQuarter; from YearWeek
    dateBoundary:
    - distinct
    - measurable
    - ordinary dates; month transition; leap day; year transition; LocalDate.MIN.plusDays(2);
      LocalDate.MAX.minusDays(24); LocalDate.MAX.minusDays(23)
    followUpOutcome:
    - distinct
    - measurable
    - bounded follow-up with numeric assertion; unbounded-start follow-up skipped
      by sentinel; follow-up ending at LocalDate.MAX skipped by sentinel
  scenarios:
  - id: ORDINARY_DIRECT_ONE_DAY
    category: NORMAL
    description: A directly constructed bounded half-open range spanning one ordinary
      day.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 10), LocalDate.of(2024,
      6, 11)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up remains bounded and its output must be 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_DIRECT_MULTI_DAY
    category: NORMAL
    description: A directly constructed bounded range with a non-boundary multi-day
      length.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 10), LocalDate.of(2024,
      6, 20)).
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_VIA_OF_EMPTY
    category: EDGE
    description: A valid empty range constructed through ofEmpty at an ordinary date.
    preconditions:
    - Receiver is LocalDateRange.ofEmpty(LocalDate.of(2024, 6, 10)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has a 23-day length.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_VIA_OF
    category: EDGE
    description: A valid empty half-open range constructed by equal direct endpoints.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 10), LocalDate.of(2024,
      6, 10)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has a 23-day length.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_END_CROSSING
    category: BOUNDARY
    description: A bounded range whose exclusive end crosses from January into February.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 1, 30), LocalDate.of(2023,
      2, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING
    category: BOUNDARY
    description: A bounded range crossing 2024-02-29.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_CROSSING
    category: BOUNDARY
    description: A bounded range crossing the end of one calendar year into the next.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024,
      1, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLETON
    category: NORMAL
    description: A closed range with equal inclusive endpoints, which becomes a one-day
      internal half-open range.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 10), LocalDate.of(2024,
      6, 10)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_DAY_PAIR
    category: BOUNDARY
    description: A closed range containing both 2024-02-28 and leap day 2024-02-29.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      2, 29)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO
    category: EDGE
    description: A zero-period range created through of(LocalDate, Period).
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 10), Period.ZERO).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has a 23-day length.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_FROM_MONTH_END
    category: BOUNDARY
    description: A period-based range starting on 2024-01-31, where adding one month
      resolves to 2024-02-29.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A date/date textual range parsed through the date-followed-by-date
      parse branch.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-06-10/2024-06-15").
    expectedSourceBehavior:
    - lengthInDays() returns 5.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: A date/period textual range parsed through the date-followed-by-period
      parse branch.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-01-31/P1M").
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: A period/date textual range parsed through the period-followed-by-date
      parse branch.
    preconditions:
    - Receiver is LocalDateRange.parse("P1M/2024-03-31").
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A one-day range created by from(LocalDate), exercising the TemporalQueries.localDate()
      path.
    preconditions:
    - Receiver is LocalDateRange.from(LocalDate.of(2024, 6, 10)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: NORMAL
    description: A range created from leap year 2024 through the Year-specific branch
      of from(Temporal).
    preconditions:
    - Receiver is created by LocalDateRange.from with a Year representing 2024.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY
    category: BOUNDARY
    description: A range created from YearMonth 2024-02 through the YearMonth-specific
      branch.
    preconditions:
    - Receiver is created by LocalDateRange.from with a YearMonth representing 2024-02.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A range created from the first half of leap year 2024 through the
      YearHalf-specific branch.
    preconditions:
    - Receiver is created by LocalDateRange.from with a YearHalf representing the
      first half of 2024.
    expectedSourceBehavior:
    - lengthInDays() returns 182.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A range created from the first quarter of leap year 2024 through
      the YearQuarter-specific branch.
    preconditions:
    - Receiver is created by LocalDateRange.from with a YearQuarter representing 2024
      quarter 1.
    expectedSourceBehavior:
    - lengthInDays() returns 91.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A range created from a valid YearWeek through the YearWeek-specific
      branch.
    preconditions:
    - Receiver is created by LocalDateRange.from with any valid YearWeek whose Monday
      and Sunday are both at most LocalDate.MAX.minusDays(24).
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: A range unbounded at its start and bounded at an ordinary exclusive
      end.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 6, 10)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because isUnboundedStart() is true.
    - Follow-up remains unbounded at the start and the supplied assertion skips numeric
      comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_MINIMUM_VALID_END
    category: BOUNDARY
    description: An unbounded-start range ending at the earliest exclusive endpoint
      permitted by LocalDateRange.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because isUnboundedStart() is true.
    - Follow-up remains unbounded at the start and the supplied assertion skips numeric
      comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIRECT_UNBOUNDED_START
    category: EDGE
    description: An unbounded-start state reached by direct half-open construction
      rather than the convenience factory.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MIN, LocalDate.of(2024, 6, 10)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the stored start equals LocalDate.MIN.
    - Follow-up remains unbounded at the start and the supplied assertion skips numeric
      comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_VALID_BOUNDED_ONE_DAY
    category: BOUNDARY
    description: A bounded one-day range immediately above the prohibited LocalDate.MIN
      and LocalDate.MIN.plusDays(1) endpoint values.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MIN.plusDays(2), LocalDate.MIN.plusDays(3)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_VALID_EMPTY
    category: BOUNDARY
    description: The earliest date at which an empty range is permitted.
    preconditions:
    - Receiver is LocalDateRange.ofEmpty(LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has a 23-day length.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATEST_FOLLOWUP_BECOMES_UNBOUNDED
    category: BOUNDARY
    description: A bounded source whose end is exactly 23 days before LocalDate.MAX,
      causing the follow-up end to become LocalDate.MAX.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns 1 for the bounded source.
    - Follow-up has end LocalDate.MAX, so followUpOutput is Integer.MAX_VALUE and
      the supplied assertion skips numeric comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_BOUNDARY_BOUNDED_FOLLOWUP
    category: BOUNDARY
    description: A range near LocalDate.MAX whose follow-up remains bounded and ends
      at LocalDate.MAX.minusDays(1).
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up remains bounded and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_UPPER_BOUNDARY
    category: BOUNDARY
    description: A closed range whose internal exclusive end is LocalDate.MAX.minusDays(23),
      the latest source end that can be extended.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up end is LocalDate.MAX, so the supplied assertion skips numeric comparison
      due to the follow-up sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAX_MINUS_TWENTY_THREE_LENGTH
    category: BOUNDARY
    description: A bounded range with an exact source length of Integer.MAX_VALUE
      minus 23 days.
    preconditions:
    - Let start be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(start, start.plusDays(Integer.MAX_VALUE - 23L)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 23.
    - Follow-up has an exact length of Integer.MAX_VALUE, causing the supplied assertion
      to skip because followUpOutput equals Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAX_MINUS_TWENTY_FOUR_LENGTH
    category: BOUNDARY
    description: A bounded range just below the Integer.MAX_VALUE output boundary
      whose follow-up remains one day below that value.
    preconditions:
    - Let start be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(start, start.plusDays(Integer.MAX_VALUE - 24L)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 24.
    - Follow-up remains below Integer.MAX_VALUE and must increase the result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAX_EXACT_FINITE_LENGTH
    category: EDGE
    description: A bounded, finite range whose mathematical day count is exactly Integer.MAX_VALUE.
    preconditions:
    - Let start be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(start, start.plusDays(Integer.MAX_VALUE)).
    expectedSourceBehavior:
    - The source is not unbounded even though an int result of Integer.MAX_VALUE is
      indistinguishable to the supplied assertion from its unbounded sentinel.
    - The supplied assertion skips if sourceOutput is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_ABOVE_INTEGER_MAX
    category: EDGE
    description: A bounded range whose mathematical day count exceeds Integer.MAX_VALUE
      while both endpoints remain valid and the follow-up is generable.
    preconditions:
    - Let start be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(start, start.plusDays(((long) Integer.MAX_VALUE)
      + 1L)).
    expectedSourceBehavior:
    - Neither isUnboundedStart() nor isUnboundedEnd() is true.
    - lengthInDays() is invoked on a valid finite range above the nominal int day-count
      boundary, and the supplied relation is applied unless either observed output
      equals Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_FULL_FINITE_LOCALDATE_DOMAIN
    category: EDGE
    description: A maximal-scale finite bounded range that approaches both LocalDate
      limits without using either unbounded sentinel endpoint.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MIN.plusDays(2), LocalDate.MAX.minusDays(23)).
    expectedSourceBehavior:
    - Neither isUnboundedStart() nor isUnboundedEnd() is true.
    - The follow-up is valid and has end LocalDate.MAX; therefore its output is Integer.MAX_VALUE
      and the supplied assertion skips numeric comparison.
    targetCases: 1
    emptyOutputAllowed: false
