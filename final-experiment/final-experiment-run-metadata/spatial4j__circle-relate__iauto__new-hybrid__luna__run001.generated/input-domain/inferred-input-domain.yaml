InputDomain:
  summary: Non-geodetic finite Cartesian circles and finite ordered rectangles, including
    empty and zero-radius circles, with source cases selected to exercise CircleImpl.relate(Rectangle)
    bounding-box shortcuts, phase-two axis selection, closest-point disjointness,
    farthest-point containment, equality, and boundary paths; every follow-up remains
    constructible after the fixed shift.
  globalConstraints:
  - Use one non-geodetic SpatialContext for each source circle and its generated follow-up;
    source coordinates, rectangle bounds, and radii are finite unless the explicitly
    empty-point scenario is used.
  - For every non-empty circle, radiusDEG is finite and greater than or equal to 0;
    negative, positive-infinite, and NaN radii are excluded because the supplied constructor
    assumes parameter validation has already occurred.
  - Every non-empty source rectangle has finite bounds with minX less than or equal
    to maxX and minY less than or equal to maxY; degenerate zero-width or zero-height
    rectangles are included where specified.
  - The generated follow-up must use the supplied SHIFT_X of 17.5 and SHIFT_Y of -9.25,
    and all shifted non-empty coordinates and rectangle bounds must remain finite
    and valid for RectangleImpl construction.
  - Each source case invokes the typed CircleImpl.relate(Rectangle) target and then
    invokes the supplied follow-up generator; the required observable assertion is
    identity equality of the source and follow-up SpatialRelation values.
  - No invalid-input scenario is included because the supplied metamorphic relation
    requires constructible CircleImpl and Rectangle inputs and does not define invalid-input
    behavior.
  diversity:
    coordinatePlacement:
    - circle center inside rectangle
    - circle center left of rectangle
    - circle center right of rectangle
    - circle center below rectangle
    - circle center above rectangle
    - circle center diagonally outside rectangle
    radiusClass:
    - positive radius
    - zero radius
    - empty-point sentinel
    boundingBoxRelation:
    - DISJOINT
    - WITHIN
    - equal-to-rectangle
    - INTERSECTS
    - CONTAINS
    phaseTwoDecision:
    - closest point outside circle
    - closest point on circle boundary
    - farthest corner inside circle
    - farthest corner outside circle
    axisBranchCoverage:
    - xAxis less than minX
    - xAxis greater than maxX
    - xAxis within X interval
    - yAxis less than minY
    - yAxis greater than maxY
    - yAxis within Y interval
    rectangleShape:
    - ordinary rectangle
    - zero-width rectangle
    - zero-height rectangle
    - point rectangle
    expectedRelationClasses:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
  scenarios:
  - id: EMPTY_POINT_SENTINEL
    category: EDGE
    description: Construct a CircleImpl from an empty Point; the constructor assigns
      NaN radius and an all-NaN enclosing box, exercising the empty-circle sentinel
      path before and after the common translation.
    preconditions:
    - The supplied Point reports isEmpty() as true.
    - The rectangle has finite ordered bounds, for example minX=-2, maxX=3, minY=-1,
      maxY=4.
    - The same non-geodetic context is used by the circle and by the generated follow-up.
    expectedSourceBehavior:
    - CircleImpl construction takes the point.isEmpty() branch and creates the NaN
      enclosing-box sentinel.
    - The source and shifted invocations both return a non-null SpatialRelation and
      the follow-up relation is identical to the source relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_CONTAINED
    category: EDGE
    description: Use zero-radius circles whose enclosing box collapses to the center
      and place each center strictly inside a rectangle.
    preconditions:
    - radiusDEG=0.
    - Source tuples are (center=(0,0), rectangle=[-2,2]x[-3,3]), (center=(10,-4),
      rectangle=[8,12]x[-6,-2]), and (center=(-7,5), rectangle=[-9,-5]x[3,7]).
    expectedSourceBehavior:
    - The enclosing-box relation is WITHIN, so relate(Rectangle) returns WITHIN without
      entering the phase-two rectangle calculation.
    - The translated source and follow-up results remain WITHIN.
    targetCases: 3
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_X
    category: NORMAL
    description: Place the rectangle strictly to the right or left of a positive-radius
      circle so the calculated enclosing box is DISJOINT.
    preconditions:
    - radiusDEG=5 and the circle center is (0,0), (10,-4), or (-10,6).
    - Rectangles are respectively [7,9]x[-1,1], [3,5]x[-6,-2], and [-15,-13]x[5,7].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) returns DISJOINT and the target returns DISJOINT
      through its bounding-box shortcut.
    - No closest- or farthest-point phase-two result is needed; the translated result
      must also be DISJOINT.
    targetCases: 3
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_Y
    category: NORMAL
    description: Place the rectangle strictly above or below the circle so the enclosing-box
      shortcut returns DISJOINT through Y separation.
    preconditions:
    - radiusDEG=5 and the circle center is (0,0), (4,4), or (-6,-3).
    - Rectangles are respectively [-1,1]x[7,9], [3,5]x[11,13], and [-8,-4]x[-10,-8].
    expectedSourceBehavior:
    - The enclosing boxes are DISJOINT in Y and relate(Rectangle) returns DISJOINT
      before phase two.
    - The common translation preserves the DISJOINT result.
    targetCases: 3
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_RECTANGLE
    category: NORMAL
    description: Surround the entire calculated circle bounding box with a strictly
      larger rectangle.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[-6,6]x[-7,7]; center=(20,-10), rectangle=[13,27]x[-17,-3];
      and center=(-12,8), rectangle=[-19,-5]x[1,15].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) returns WITHIN and the target returns WITHIN
      through the first shortcut.
    - The follow-up relation is also WITHIN.
    targetCases: 3
    emptyOutputAllowed: false
  - id: BBOX_EQUAL_RECTANGLE_IDENTITY
    category: EDGE
    description: Make the rectangle exactly equal to the positive circle's calculated
      enclosing box, exercising the explicit enclosingBox.equals(r) identity edge
      case.
    preconditions:
    - radiusDEG=5 and the circle center is (0,0), (11,-6), or (-8,9).
    - Rectangles are exactly [-5,5]x[-5,5], [6,16]x[-11,-1], and [-13,-3]x[4,14],
      respectively.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS for equality, then the equals check
      changes the result to WITHIN.
    - The translated rectangles remain equal to the translated enclosing boxes, so
      both results are WITHIN.
    targetCases: 3
    emptyOutputAllowed: false
  - id: PHASE_TWO_X_LEFT_Y_INSIDE
    category: NORMAL
    description: Put the rectangle to the circle's right while spanning the circle's
      Y axis, selecting xAxis less than minX and yAxis within the rectangle.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[4,6]x[-1,1]; center=(10,3), rectangle=[14,17]x[1,5];
      and center=(-9,-4), rectangle=[-5,-2]x[-6,-2].
    - Each rectangle intersects the circle bounding box, and its closest point to
      the center is inside the circle.
    expectedSourceBehavior:
    - Phase two takes the xAxis less-than-minX branch and yAxis-within branch.
    - Because bboxSect is INTERSECTS and the closest-point test does not establish
      disjointness, the result is INTERSECTS.
    - The translated result remains INTERSECTS.
    targetCases: 3
    emptyOutputAllowed: false
  - id: PHASE_TWO_X_RIGHT_Y_INSIDE
    category: NORMAL
    description: Put the rectangle to the circle's left while spanning the circle's
      Y axis, selecting xAxis greater than maxX and yAxis within the rectangle.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[-6,-4]x[-1,1]; center=(10,3), rectangle=[3,6]x[1,5];
      and center=(-9,-4), rectangle=[-16,-13]x[-6,-2].
    - Each rectangle intersects the circle bounding box and its closest point is within
      the circle.
    expectedSourceBehavior:
    - Phase two takes the xAxis greater-than-maxX branch and yAxis-within branch.
    - The result is INTERSECTS, followed by the same INTERSECTS result after translation.
    targetCases: 3
    emptyOutputAllowed: false
  - id: PHASE_TWO_X_INSIDE_Y_BELOW
    category: NORMAL
    description: Put the rectangle above the circle while spanning the circle's X
      axis, selecting xAxis within the rectangle and yAxis less than minY.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[-1,1]x[4,6]; center=(7,-2), rectangle=[6,8]x[2,5];
      and center=(-5,9), rectangle=[-7,-3]x[13,15].
    - Each rectangle intersects the circle bounding box and its closest point is within
      the circle.
    expectedSourceBehavior:
    - Phase two takes the xAxis-within branch and yAxis less-than-minY branch.
    - The result is INTERSECTS and remains INTERSECTS after the common shift.
    targetCases: 3
    emptyOutputAllowed: false
  - id: PHASE_TWO_X_INSIDE_Y_ABOVE
    category: NORMAL
    description: Put the rectangle below the circle while spanning the circle's X
      axis, selecting xAxis within the rectangle and yAxis greater than maxY.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[-1,1]x[-6,-4]; center=(7,-2), rectangle=[6,8]x[-8,-5];
      and center=(-5,9), rectangle=[-7,-3]x[3,5].
    - Each rectangle intersects the circle bounding box and its closest point is within
      the circle.
    expectedSourceBehavior:
    - Phase two takes the xAxis-within branch and yAxis greater-than-maxY branch.
    - The result is INTERSECTS and the follow-up result is also INTERSECTS.
    targetCases: 3
    emptyOutputAllowed: false
  - id: PHASE_TWO_DIAGONAL_CLOSEST_DISJOINT
    category: NORMAL
    description: Put the rectangle diagonally beyond a circle corner so the bounding
      boxes intersect but the closest rectangle corner lies outside the circle.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[4,6]x[4,6]; center=(10,-4), rectangle=[14,16]x[0,2];
      and center=(-7,8), rectangle=[-3,-1]x[12,14].
    - Both coordinate axes are outside the rectangle intervals and the closest corner
      has Euclidean distance greater than 5.
    expectedSourceBehavior:
    - Phase two takes both outside-axis branches and returns DISJOINT from the closest-point
      contains check.
    - The translated result remains DISJOINT.
    targetCases: 3
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_CIRCLE_CONTAINS
    category: NORMAL
    description: Place a small rectangle strictly inside the circle's bounding box
      with every farthest corner inside the circle.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[-1,1]x[-1,1]; center=(12,-3), rectangle=[10,14]x[-4,-2];
      and center=(-8,7), rectangle=[-9,-7]x[6,8].
    - The enclosing box CONTAINS each rectangle and the farthest corner distance is
      less than 5.
    expectedSourceBehavior:
    - Phase two reaches the bboxSect CONTAINS branch, accepts the farthest-point test,
      and returns CONTAINS.
    - The shifted source and follow-up results are both CONTAINS.
    targetCases: 3
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_FARTHEST_OUTSIDE
    category: NORMAL
    description: Keep the rectangle inside the circle bounding box but extend it far
      enough that its farthest corner is outside the circle.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[-4,4]x[-4,4]; center=(12,-3), rectangle=[8,16]x[-7,1];
      and center=(-8,7), rectangle=[-12,-4]x[3,11].
    - The enclosing box CONTAINS each rectangle, while at least one farthest corner
      has distance greater than 5.
    expectedSourceBehavior:
    - Phase two reaches the bboxSect CONTAINS branch but returns INTERSECTS when the
      farthest-point contains check fails.
    - The follow-up result remains INTERSECTS.
    targetCases: 3
    emptyOutputAllowed: false
  - id: CLOSEST_POINT_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: Make the closest rectangle corner lie exactly on the positive circle
      boundary while the rectangle otherwise overlaps the enclosing box.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[3,6]x[4,6]; center=(10,-4), rectangle=[13,-1]x[-1,2];
      and center=(-7,6), rectangle=[-4,-1]x[9,12].
    - The closest corner has distance exactly 5 and both rectangle axes are outside
      the circle center on the relevant side.
    expectedSourceBehavior:
    - Phase two executes the closest-point contains test at its distance boundary;
      the source relation is not DISJOINT when the supplied distance calculator treats
      the boundary as within.
    - The follow-up relation is identical to the source relation, including this boundary
      classification.
    targetCases: 3
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: Keep the rectangle within the circle bounding box and make its farthest
      corner lie exactly on the circle boundary.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[-3,3]x[-4,4]; center=(9,2), rectangle=[6,12]x[-2,6];
      and center=(-11,-5), rectangle=[-14,-8]x[-9,-1].
    - The enclosing box CONTAINS each rectangle and the selected farthest corner has
      distance exactly 5.
    expectedSourceBehavior:
    - Phase two reaches the farthest-point test with an exact boundary distance and
      returns the corresponding CONTAINS classification when contains accepts the
      boundary.
    - The translated invocation returns the same classification.
    targetCases: 3
    emptyOutputAllowed: false
  - id: DEGENERATE_RECTANGLE_BOUNDARIES
    category: EDGE
    description: Exercise zero-width, zero-height, and point rectangles while retaining
      a positive-radius circle.
    preconditions:
    - radiusDEG=5.
    - Source tuples are center=(0,0), rectangle=[1,1]x[-2,2]; center=(10,-4), rectangle=[7,13]x[-4,-4];
      and center=(-7,6), rectangle=[-7,-7]x[6,6].
    - Bounds satisfy minX less than or equal to maxX and minY less than or equal to
      maxY.
    expectedSourceBehavior:
    - The target processes degenerate rectangles through the same enclosing-box and
      phase-two logic rather than relying on rectangle area.
    - Each follow-up preserves the source SpatialRelation exactly.
    targetCases: 3
    emptyOutputAllowed: false
