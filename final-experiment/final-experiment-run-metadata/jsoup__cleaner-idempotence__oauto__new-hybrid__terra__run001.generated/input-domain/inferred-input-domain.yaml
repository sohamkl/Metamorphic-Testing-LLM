InputDomain:
  summary: Non-null HTML body fragments are cleaned with non-null base-URI strings
    and Safelist instances constructible from the supplied constructors and factory
    methods. The domain emphasizes parser normalization, safelist filtering, URL-bearing
    attributes, empty-base handling, malformed fragments, and all supplied Safelist
    construction variants.
  globalConstraints:
  - bodyHtml, baseUri, and safelist must each be non-null because the metamorphic
    follow-up generator rejects null values with Objects.requireNonNull.
  - Each source case must reuse the exact same non-null Safelist instance for its
    generated follow-up invocation, as specified by generateFollowUp.
  - '{Safelist instances are limited to public construction paths supplied in the
    metadata=new Safelist(), new Safelist(existingSafelist), basic(), basicWithImages(),
    none(), relaxed(), and simpleText().}'
  - Custom Safelist mutation/configuration, including explicitly enabling preserveRelativeLinks(boolean),
    is excluded because no such construction or configuration method was supplied;
    therefore the branch where preserveRelativeLinks() is known to be true cannot
    be required deterministically.
  - Non-empty base URIs used for URL-resolution scenarios must be syntactically absolute
    HTTP or HTTPS URI strings, such as https://example.test/root/page.html.
  diversity:
    bodyHtmlShape:
    - 36 distinct source fragment forms
    - measurable by tag structure and URL/attribute content
    - empty text whitespace entities comments malformed nesting raw-text tags URL
      protocols relative URLs images tables and duplicate attributes
    baseUriState:
    - 3 distinct states
    - measurable by string value
    - empty string valid absolute HTTP URI valid absolute HTTPS URI
    safelistConstruction:
    - 8 distinct construction forms
    - measurable by constructor or factory used
    - new Safelist() copy of relaxed none simpleText basic basicWithImages relaxed
    outputExpectation:
    - 2 distinct observability classes
    - measurable by required result condition
    - output may be empty for contentless fragments output must retain a unique plain-text
      marker
  scenarios:
  - id: EMPTY_FRAGMENT_NONE
    category: BOUNDARY
    description: Empty body fragment under the text-node-only Safelist.none policy.
    preconditions:
    - bodyHtml equals ""
    - baseUri equals ""
    - safelist is constructed by Safelist.none()
    expectedSourceBehavior:
    - The source invocation returns a non-null HTML fragment string.
    - The follow-up cleaning result must equal the source output.
    targetCases: 1
    emptyOutputAllowed: true
  - id: WHITESPACE_ONLY_NONE
    category: BOUNDARY
    description: Fragment containing only spaces tabs and line breaks under Safelist.none.
    preconditions:
    - bodyHtml contains no markup and consists only of " \t\n\r "
    - baseUri equals ""
    - safelist is constructed by Safelist.none()
    expectedSourceBehavior:
    - The source invocation returns a non-null normalized HTML fragment string.
    - The follow-up cleaning result must equal the source output.
    targetCases: 1
    emptyOutputAllowed: true
  - id: COMMENT_AND_DOCTYPE_NONE
    category: EDGE
    description: Contentless comment and doctype nodes exercise body-fragment parsing
      and cleaner handling of non-element nodes.
    preconditions:
    - bodyHtml equals "<!doctype html><!--comment-->"
    - baseUri equals ""
    - safelist is constructed by Safelist.none()
    expectedSourceBehavior:
    - The source invocation returns a non-null HTML fragment string.
    - The follow-up cleaning result must equal the source output.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PLAIN_TEXT_NONE
    category: NORMAL
    description: Plain text is cleaned without any HTML element or attribute processing.
    preconditions:
    - bodyHtml equals "plain-none-marker"
    - baseUri equals ""
    - safelist is constructed by Safelist.none()
    expectedSourceBehavior:
    - The source output contains "plain-none-marker".
    - The follow-up cleaning result must equal the source output.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TEXT_WITH_ESCAPABLE_CHARACTERS_NONE
    category: EDGE
    description: Plain text containing angle brackets ampersand quotes and an existing
      entity exercises parse-and-serialize escaping.
    preconditions:
    - '{bodyHtml equals "escape-marker=5 &lt; 6 &amp; 7 \"quoted\""}'
    - baseUri equals ""
    - safelist is constructed by Safelist.none()
    expectedSourceBehavior:
    - The source output contains "escape-marker".
    - The source invocation returns HTML serialization rather than a null value.
    - The follow-up cleaning result must equal the source output.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DISALLOWED_ELEMENT_WITH_OUTER_TEXT_NONE
    category: NORMAL
    description: A normally unsafe element is surrounded by ordinary text under Safelist.none.
    preconditions:
    - bodyHtml equals "before-none-marker<script>alert(1)</script>after-none-marker"
    - baseUri equals ""
    - safelist is constructed by Safelist.none()
    expectedSourceBehavior:
