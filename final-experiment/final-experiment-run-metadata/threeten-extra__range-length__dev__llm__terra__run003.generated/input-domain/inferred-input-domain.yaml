InputDomain:
  summary: Valid non-null LocalDateRange receivers whose stored exclusive end can
    be advanced by 23 days and reconstructed by LocalDateRange.of(start, extendedEnd).
    The domain covers exact finite lengths, empty ranges, calendar boundaries, factory/parser/from
    construction routes, unbounded-start sentinel behavior, finite integer-saturation
    behavior, and the follow-up transition to an unbounded end.
  globalConstraints:
  - Source receiver is a successfully constructed, non-null LocalDateRange; invalid
    dates, reversed bounds, nulls, and construction exceptions are outside the MR
    because generateFollowUp requires a receiver and does not request invalid-input
    testing.
  - Source getEnd() must be on or before LocalDate.MAX.minusDays(23), so getEnd().plusDays(23)
    cannot throw and LocalDateRange.of(getStart(), extendedEnd) can be constructed.
  - Consequently, all ranges unbounded at the end are excluded, including LocalDateRange.ofUnbounded(),
    LocalDateRange.ALL, and LocalDateRange.ofUnboundedEnd(...), because their getEnd()
    is LocalDate.MAX and the MR follow-up overflows before assertion.
  - '{Source bounds must satisfy LocalDateRange validity rules=start <= end, start
    is neither LocalDate.MAX nor LocalDate.MAX.minusDays(1), and end is neither LocalDate.MIN
    nor LocalDate.MIN.plusDays(1).}'
  diversity:
    constructionRoute:
    - '13'
    - measurable
    - of(LocalDate,LocalDate); of(LocalDate,Period); ofClosed; ofEmpty; ofUnboundedStart;
      parse date/date; parse date/period; parse period/date; from LocalDate; from
      LocalDateTime; from Year; from YearMonth; from YearHalf/YearQuarter/YearWeek
    lengthClass:
    - '8'
    - measurable
    - 0; 1; ordinary finite; month-crossing finite; leap-sensitive finite; Integer.MAX_VALUE-24;
      Integer.MAX_VALUE-23; Integer.MAX_VALUE-22; Integer.MAX_VALUE; greater than
      Integer.MAX_VALUE; unbounded-start sentinel
    followUpDisposition:
    - '4'
    - measurable
    - asserted exact increase of 23; skipped because source is Integer.MAX_VALUE;
      skipped because finite follow-up reaches Integer.MAX_VALUE; skipped because
      follow-up becomes unbounded at LocalDate.MAX
    dateBoundary:
    - '8'
    - measurable
    - LocalDate.MIN-plus boundary; BCE/year-zero; month end; February common year;
      February leap year; year boundary; LocalDate.MAX-minus boundary; maximum representable
      int-length boundary
  scenarios:
  - id: ORDINARY_HALF_OPEN_RANGE
    category: NORMAL
    description: Half-open range constructed with of(LocalDate, LocalDate) from 2024-06-10
      inclusive to 2024-06-20 exclusive.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2024, 6, 10), LocalDate.of(2024, 6,
      20)).
    - Source getEnd() is at least 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up has length 33, so the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: Smallest non-empty ordinary half-open range.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1,
      2)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_OF_EMPTY_FACTORY
    category: BOUNDARY
    description: Empty range constructed through ofEmpty at a date permitted by the
      constructor.
    preconditions:
    - Source is LocalDateRange.ofEmpty(LocalDate.of(2024, 1, 1)).
    - Empty location is not LocalDate.MIN, LocalDate.MIN.plusDays(1), LocalDate.MAX.minusDays(1),
      or LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up is non-empty with length 23, so the assertion evaluates an increase
      of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_HALF_OPEN_OF_FACTORY
    category: BOUNDARY
    description: Empty range constructed through of(start, end) with equal ordinary
      bounds.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2024, 5, 15), LocalDate.of(2024, 5,
      15)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_END_CROSSING
    category: EDGE
    description: Finite range crossing from January into February without using a
      Period constructor.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2023, 1, 30), LocalDate.of(2023, 2,
      2)).
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    - Follow-up has length 26 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_YEAR_FEBRUARY
    category: EDGE
    description: Finite range spanning February in a non-leap year.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2023, 2, 1), LocalDate.of(2023, 3,
      1)).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - Follow-up has length 51 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_YEAR_FEBRUARY
    category: EDGE
    description: Finite range spanning February in a leap year.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2024, 2, 1), LocalDate.of(2024, 3,
      1)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up has length 52 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_RANGE
    category: EDGE
    description: Finite range crossing a calendar-year boundary.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024, 1,
      2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up has length 25 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_ZERO_RANGE
    category: EDGE
    description: Finite range around ISO proleptic year zero.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(-1, 12, 31), LocalDate.of(0, 1, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up has length 25 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWEST_FINITE_ONE_DAY_RANGE
    category: BOUNDARY
    description: Finite one-day range immediately above the prohibited LocalDate.MIN
      end boundary.
    preconditions:
    - Source start is LocalDate.MIN.plusDays(1).
    - Source end is LocalDate.MIN.plusDays(2).
    - Source is constructed with LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up remains finite and has length 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_FINITE_RANGE_WITH_ASSERTED_FOLLOW_UP
    category: BOUNDARY
    description: One-day finite range near LocalDate.MAX whose follow-up still has
      a finite end.
    preconditions:
    - Source start is LocalDate.MAX.minusDays(25).
    - Source end is LocalDate.MAX.minusDays(24).
    - Source is constructed with LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up end is LocalDate.MAX.minusDays(1), remains finite, and has length
      24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_BECOMES_UNBOUNDED_END
    category: BOUNDARY
    description: Finite source whose legal 23-day end extension lands exactly on LocalDate.MAX.
    preconditions:
    - Source start is LocalDate.MAX.minusDays(24).
    - Source end is LocalDate.MAX.minusDays(23).
    - Source is constructed with LocalDateRange.of(start, end).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up is LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX),
      so followUpOutput is Integer.MAX_VALUE and the relation is skipped.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FINITE_END
    category: EDGE
    description: Range created by ofUnboundedStart with a finite end that can be extended
      safely.
    preconditions:
    - Source is LocalDateRange.ofUnboundedStart(LocalDate.of(2000, 1, 1)).
    - Source getEnd() is on or before LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - Follow-up also has an unbounded start; the relation is skipped by the source
      sentinel output.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INT_MAX_MINUS_24
    category: BOUNDARY
    description: Largest finite exact length for which the 23-day follow-up remains
      below Integer.MAX_VALUE.
    preconditions:
    - Anchor is LocalDate.of(0, 1, 1).
    - Source is LocalDateRange.of(anchor, anchor.plusDays(Integer.MAX_VALUE - 24L)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24.
    - Follow-up returns Integer.MAX_VALUE - 1, so the assertion evaluates an increase
      of 23 without integer overflow.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INT_MAX_MINUS_23
    category: BOUNDARY
    description: Finite exact length whose follow-up result reaches Integer.MAX_VALUE.
    preconditions:
    - Anchor is LocalDate.of(0, 1, 1).
    - Source is LocalDateRange.of(anchor, anchor.plusDays(Integer.MAX_VALUE - 23L)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - Follow-up returns Integer.MAX_VALUE, causing assertRelation to skip.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INT_MAX_MINUS_22
    category: BOUNDARY
    description: Finite exact length below the saturation threshold whose follow-up
      exceeds it.
    preconditions:
    - Anchor is LocalDate.of(0, 1, 1).
    - Source is LocalDateRange.of(anchor, anchor.plusDays(Integer.MAX_VALUE - 22L)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 22.
    - Follow-up output is Integer.MAX_VALUE, so the relation is skipped.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_EXACTLY_INT_MAX
    category: BOUNDARY
    description: Finite, bounded range whose representable length is exactly Integer.MAX_VALUE.
    preconditions:
    - Anchor is LocalDate.of(0, 1, 1).
    - Source is LocalDateRange.of(anchor, anchor.plusDays(Integer.MAX_VALUE)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The relation is skipped because the source output equals the sentinel value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_GREATER_THAN_INT_MAX
    category: EDGE
    description: Bounded range longer than Integer.MAX_VALUE days, exercising finite-length
      saturation.
    preconditions:
    - Anchor is LocalDate.of(0, 1, 1).
    - Source is LocalDateRange.of(anchor, anchor.plusDays(((long) Integer.MAX_VALUE)
      + 1L)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE rather than a larger int value.
    - The relation is skipped because the source output equals Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO
    category: BOUNDARY
    description: Empty range constructed through of(start, Period.ZERO).
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2024, 4, 10), Period.ZERO).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_DAYS
    category: NORMAL
    description: Range constructed through a positive day-based Period.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2024, 4, 10), Period.ofDays(17)).
    expectedSourceBehavior:
    - lengthInDays() returns 17.
    - Follow-up has length 40 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_END_LEAP_YEAR
    category: EDGE
    description: Period construction where LocalDate.plus(Period) resolves January
      31 plus one month in a leap year.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - lengthInDays() returns 29 because the computed exclusive end is 2024-02-29.
    - Follow-up has length 52 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_YEAR_ACROSS_LEAP_DAY
    category: EDGE
    description: Period construction of one year beginning on leap day.
    preconditions:
    - Source is LocalDateRange.of(LocalDate.of(2024, 2, 29), Period.ofYears(1)).
    expectedSourceBehavior:
    - lengthInDays() returns 365 because the computed exclusive end is 2025-02-28.
    - Follow-up has length 388 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DAY
    category: BOUNDARY
    description: One-day range created through ofClosed with equal inclusive endpoints.
    preconditions:
    - Source is LocalDateRange.ofClosed(LocalDate.of(2024, 7, 4), LocalDate.of(2024,
      7, 4)).
    expectedSourceBehavior:
    - lengthInDays() returns 1 because ofClosed stores the day after the inclusive
      end.
    - Follow-up has length 24 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_DAY_INTERVAL
    category: EDGE
    description: Closed interval whose inclusive end is leap day.
    preconditions:
    - Source is LocalDateRange.ofClosed(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      2, 29)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up has length 25 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: Range parsed through the date/date parse branch.
    preconditions:
    - Source is LocalDateRange.parse("2024-08-01/2024-08-11").
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up has length 33 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: Range parsed through the date/period parse branch.
    preconditions:
    - Source is LocalDateRange.parse("2024-08-01/P10D").
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up has length 33 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: Range parsed through the period/date parse branch.
    preconditions:
    - Source is LocalDateRange.parse("P10D/2024-08-11").
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up has length 33 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: One-day closed range produced by from(LocalDate).
    preconditions:
    - Source is LocalDateRange.from(LocalDate.of(2024, 9, 14)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up has length 24 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TIME
    category: NORMAL
    description: from(Temporal) input with a local date and time, where the documented
      conversion ignores the time component.
    preconditions:
    - Source is created by LocalDateRange.from on a LocalDateTime whose local date
      is 2024-09-14.
    expectedSourceBehavior:
    - lengthInDays() returns 1 because from converts the temporal to its local date
      and creates a closed one-day range.
    - Follow-up has length 24 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: Whole common-year range produced by from(Year).
    preconditions:
    - Source is LocalDateRange.from(Year.of(2023)).
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    - Follow-up has length 388 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: EDGE
    description: Whole leap-year range produced by from(Year).
    preconditions:
    - Source is LocalDateRange.from(Year.of(2024)).
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - Follow-up has length 389 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_FEBRUARY_YEAR_MONTH
    category: EDGE
    description: Common-year February range produced by from(YearMonth).
    preconditions:
    - Source is LocalDateRange.from(YearMonth.of(2023, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - Follow-up has length 51 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEAR_MONTH
    category: EDGE
    description: Leap-year February range produced by from(YearMonth).
    preconditions:
    - Source is LocalDateRange.from(YearMonth.of(2024, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up has length 52 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: First half of a leap year produced by from(YearHalf).
    preconditions:
    - Source is created by LocalDateRange.from using a valid YearHalf temporal representing
      the first half of 2024.
    expectedSourceBehavior:
    - lengthInDays() returns 182.
    - Follow-up has length 205 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: First quarter of a leap year produced by from(YearQuarter).
    preconditions:
    - Source is created by LocalDateRange.from using a valid YearQuarter temporal
      representing the first quarter of 2024.
    expectedSourceBehavior:
    - lengthInDays() returns 91.
    - Follow-up has length 114 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: ISO week range produced by from(YearWeek), covering Monday through
      Sunday inclusively.
    preconditions:
    - Source is created by LocalDateRange.from using a valid YearWeek temporal representing
      ISO week 53 of 2020.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - Follow-up has length 30 and the assertion evaluates an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
