InputDomain:
  summary: Non-null Temporal endpoint pairs for which ChronoUnit.DAYS can compute
    a whole-day difference, the result fits int, and both endpoints can be advanced
    by 37 days for the follow-up. The domain covers date-only, date-time, zoned, offset,
    instant, and alternate-calendar temporals, including singleton outputs, signed
    gaps, truncation of partial days, DST behavior, chronology boundaries, and int
    conversion limits.
  globalConstraints:
  - Both source endpoints are non-null Temporal instances.
  - Each endpoint must support plus(37, ChronoUnit.DAYS), and both shifted endpoints
    must be valid Temporal values.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) must complete successfully
    for both the source pair and the shifted pair.
  - The source and shifted ChronoUnit.DAYS.between results must each be in the inclusive
    int range [-2147483648, 2147483647], because Days.between uses Math.toIntExact.
  - Null endpoints and endpoint pairs for which ChronoUnit.DAYS.between or Temporal.plus(37,
    DAYS) throws are outside this MR domain because generateFollowUp requires non-null
    endpoints and must construct executable follow-up inputs.
  diversity:
    temporalRepresentation:
    - java.time.LocalDate
    - java.time.LocalDateTime
    - java.time.ZonedDateTime
    - java.time.OffsetDateTime
    - java.time.Instant
    - java.time.chrono.JapaneseDate
    - java.time.chrono.MinguoDate
    - java.time.chrono.ThaiBuddhistDate
    sourceGapClass:
    - zero days
    - positive one day
    - negative one day
    - positive multi-day
    - negative multi-day
    - partial positive day truncated to zero
    - partial negative day truncated to zero
    - Integer.MAX_VALUE days
    - Integer.MIN_VALUE days
    calendarCondition:
    - same calendar date
    - month boundary
    - leap-day boundary
    - year boundary
    - chronology era or calendar-year boundary
    - normal zone offset
    - DST spring-forward transition
    - DST fall-back transition
    - different endpoint zones
  scenarios:
  - id: LOCAL_DATE_EQUAL_ENDPOINTS
    category: NORMAL
    description: Equal LocalDate endpoints produce the zero singleton amount.
    preconditions:
    - startDateInclusive and endDateExclusive are the same java.time.LocalDate.
    - The date is at least 37 days before LocalDate.MAX so the follow-up is representable.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    - The shifted equal endpoints also produce getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FORWARD_ONE_DAY
    category: BOUNDARY
    description: Consecutive LocalDate endpoints exercise the Days.ONE sentinel result.
    preconditions:
    - endDateExclusive equals startDateInclusive.plusDays(1).
    - startDateInclusive is a java.time.LocalDate for which both endpoints remain
      valid after adding 37 days.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_BACKWARD_ONE_DAY
    category: BOUNDARY
    description: Reversed consecutive LocalDate endpoints produce a negative one-day
      result.
    preconditions:
    - endDateExclusive equals startDateInclusive.minusDays(1).
    - startDateInclusive is a java.time.LocalDate for which both endpoints remain
      valid after adding 37 days.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_BOUNDARY
    category: NORMAL
    description: Date-only intervals cross a month boundary without changing whole-day
      counting.
    preconditions:
    - Use LocalDate pairs crossing a month boundary, such as 2024-01-30 to 2024-02-02.
    - Use two source cases with positive gaps of 2 and 3 calendar days.
    expectedSourceBehavior:
    - Each source result has getAmount() equal to its calendar-day gap, respectively
      2 or 3.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_BOUNDARY
    category: EDGE
    description: Date-only intervals cover leap-year February boundaries.
    preconditions:
    - '{Use three LocalDate source pairs=2024-02-28 to 2024-02-29, 2024-02-28 to 2024-03-01,
      and 2023-02-28 to 2023-03-01.}'
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1, 2, and 1.
    targetCases: 3
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: NORMAL
    description: Date-only intervals cross December-to-January year boundaries in
      both directions.
    preconditions:
    - Use LocalDate pairs 2023-12-31 to 2024-01-02 and 2024-01-02 to 2023-12-31.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 2 and -2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INTEGER_MAX_DAY_GAP
    category: BOUNDARY
    description: The largest representable Days amount reaches the Math.toIntExact
      upper boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(0, 1, 1).
    - endDateExclusive equals startDateInclusive.plusDays(2147483647).
    - Both endpoints remain within LocalDate range after adding 37 days.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MIN_DAY_GAP
    category: BOUNDARY
    description: The smallest representable Days amount reaches the Math.toIntExact
      lower boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(0, 1, 1).
    - endDateExclusive equals startDateInclusive.minusDays(2147483648).
    - Both endpoints remain within LocalDate range after adding 37 days.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EQUAL_INSTANTS
    category: NORMAL
    description: Equal LocalDateTime endpoints produce zero while retaining time-of-day
      fields.
    preconditions:
    - startDateInclusive and endDateExclusive are the same java.time.LocalDateTime.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_PARTIAL_DAY
    category: EDGE
    description: Positive LocalDateTime gaps shorter than one complete day truncate
      to zero days.
    preconditions:
    - Use two LocalDateTime pairs with end after start by 1 hour and by 23 hours 59
      minutes.
    - Neither pair crosses a 24-hour complete-day threshold.
    expectedSourceBehavior:
    - Each source result has getAmount() 0 despite endDateExclusive being later.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_PARTIAL_DAY
    category: EDGE
    description: Negative LocalDateTime gaps with magnitude below one complete day
      truncate toward zero.
    preconditions:
    - Use two LocalDateTime pairs with end before start by 1 hour and by 23 hours
      59 minutes.
    - Neither pair reaches a negative complete-day threshold.
    expectedSourceBehavior:
    - Each source result has getAmount() 0 despite endDateExclusive being earlier.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_COMPLETE_DAY
    category: BOUNDARY
    description: An exactly 24-hour LocalDateTime interval reaches the one-day boundary.
    preconditions:
    - endDateExclusive equals startDateInclusive.plusHours(24).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_COMPLETE_DAY
    category: BOUNDARY
    description: A negative interval of at least one complete day produces a negative
      amount.
    preconditions:
    - endDateExclusive equals startDateInclusive.minusHours(25).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_MULTI_DAY_WITH_TIME_COMPONENT
    category: NORMAL
    description: Multi-day LocalDateTime intervals retain complete-day counting when
      endpoint times differ.
    preconditions:
    - Use two LocalDateTime pairs with elapsed gaps of 47 hours and 49 hours.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1 and 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_NORMAL_OFFSET
    category: NORMAL
    description: ZonedDateTime endpoints in a stable-offset period count calendar
      days normally.
    preconditions:
    - Use two same-zone ZonedDateTime pairs in UTC or in a period with no offset transition
      between endpoints.
    - Use positive whole-day gaps of 1 and 3 days.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1 and 3.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_SPRING_FORWARD
    category: EDGE
    description: A ZonedDateTime interval across a spring-forward transition remains
      executable when shifted by calendar days.
    preconditions:
    - Use ZoneId.of("America/New_York").
    - Use endpoints 2024-03-09T12:00-05:00 and 2024-03-10T12:00-04:00.
    - Use a second source case spanning 2024-03-09T12:00-05:00 to 2024-03-11T12:00-04:00.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1 and 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_FALL_BACK
    category: EDGE
    description: A ZonedDateTime interval across a fall-back transition remains executable
      when shifted by calendar days.
    preconditions:
    - Use ZoneId.of("America/New_York").
    - Use endpoints 2024-11-02T12:00-04:00 and 2024-11-03T12:00-05:00.
    - Use a second source case spanning 2024-11-02T12:00-04:00 to 2024-11-04T12:00-05:00.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1 and 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DIFFERENT_ZONES
    category: EDGE
    description: ZonedDateTime endpoints use distinct zone rules while still supporting
      DAYS.between and the common shift.
    preconditions:
    - startDateInclusive is a ZonedDateTime in America/New_York.
    - endDateExclusive is a ZonedDateTime in Asia/Tokyo.
    - Use two executable pairs whose DAYS.between results are respectively 1 and 2.
    expectedSourceBehavior:
    - The source returns non-null Days with getAmount() respectively 1 and 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_ENDPOINTS
    category: NORMAL
    description: OffsetDateTime inputs cover date-times with explicit fixed offsets.
    preconditions:
    - Use two OffsetDateTime pairs with the same explicit offset.
    - Use elapsed gaps of 36 hours and 48 hours.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1 and 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INSTANT_ENDPOINTS
    category: NORMAL
    description: Instant inputs cover timeline-based temporals rather than calendar-local
      dates.
    preconditions:
    - Use two Instant pairs separated by exactly 24 hours and exactly 72 hours.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1 and 3.
    targetCases: 2
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_BOUNDARY
    category: EDGE
    description: JapaneseDate inputs cross the 2019 Heisei-to-Reiwa era boundary.
    preconditions:
    - Use JapaneseDate.of(2019, 4, 30) to JapaneseDate.of(2019, 5, 1).
    - Use a second JapaneseDate pair spanning two days across the same boundary.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1 and 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MINGUO_DATE_LEAP_BOUNDARY
    category: EDGE
    description: MinguoDate inputs cover a leap-year February boundary in a non-ISO
      chronology.
    preconditions:
    - Use MinguoDate.of(113, 2, 28) to MinguoDate.of(113, 3, 1).
    - Use a second MinguoDate pair with a one-day reverse gap.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 2 and -1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_YEAR_BOUNDARY
    category: EDGE
    description: ThaiBuddhistDate inputs cross a chronology-specific calendar-year
      boundary.
    preconditions:
    - Use ThaiBuddhistDate.of(2567, 12, 31) to ThaiBuddhistDate.of(2568, 1, 1).
    - Use a second ThaiBuddhistDate pair spanning three days across that boundary.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 1 and 3.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: NORMAL
    description: A LocalDate start and LocalDateTime end cover an interoperable mixed
      Temporal pair.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1).
    - Use LocalDateTime end values on 2024-01-03 and 2024-01-04 with arbitrary valid
      times.
    - The LocalDate start is the receiver-compatible endpoint for DAYS.between.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 2 and 3, based on the end date component.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TO_ZONED_DATE_TIME
    category: NORMAL
    description: A LocalDate start and ZonedDateTime end cover another interoperable
      mixed Temporal pair.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 1).
    - endDateExclusive is a ZonedDateTime in UTC dated 2024-06-03 or 2024-06-04.
    - The LocalDate start is the receiver-compatible endpoint for DAYS.between.
    expectedSourceBehavior:
    - Source getAmount() values are respectively 2 and 3, based on the end date component.
    targetCases: 2
    emptyOutputAllowed: false
