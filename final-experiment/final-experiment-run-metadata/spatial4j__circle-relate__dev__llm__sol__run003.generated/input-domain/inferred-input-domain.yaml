InputDomain:
  summary: Valid flat Cartesian CircleImpl and RectangleImpl pairs, including containment,
    intersection, tangency, disjointness, zero-area shapes, and empty-shape sentinels,
    with both source and jointly shifted follow-up representable in the same non-geo
    context.
  globalConstraints:
  - The receiver is constructed as new CircleImpl(point, radius, context), where context
    is non-null, non-geo, and uses the flat Cartesian coordinate system described
    by the SUT.
  - The rectangle argument is a RectangleImpl interpreted in the same context and
    coordinate system as the receiver; this avoids changing rectangle implementation
    semantics when the follow-up is reconstructed as RectangleImpl.
  - For every non-empty circle, point.isEmpty() is false, point coordinates cx and
    cy are finite, and radius is finite and greater than or equal to 0.
  - For every non-empty rectangle, minX, maxX, minY, and maxY are finite, minX is
    less than or equal to maxX, and minY is less than or equal to maxY.
  - An empty circle is included only through a Point for which isEmpty() is true,
    matching the CircleImpl constructor's explicit empty-point path.
  - An empty rectangle is included only through the all-NaN empty RectangleImpl representation
    exercised by the supplied code; partially NaN rectangles are excluded because
    no validity or behavior for them is supplied.
  - The source circle center, source rectangle bounds, shifted center (cx + 17.5,
    cy - 9.25), and shifted rectangle bounds must all be accepted by the same context.
  - For non-empty cases, the circle bounding box and rectangle, both before and after
    shifting, remain inside any finite context world bounds so that world-bound clipping
    cannot invalidate translation invariance.
  - Double addition by 17.5 and -9.25 must preserve rectangle bound ordering and all
    scenario-defining relative comparisons and equalities. Inputs where rounding collapses
    a positive width, height, gap, or overlap are excluded because the supplied follow-up
    would no longer represent a rigid slide.
  - No null circle, null rectangle, null center, negative radius, infinity, malformed
    rectangle bounds, antimeridian crossing, pole behavior, or world wrapping is included;
    the MR does not request invalid inputs and the SUT assumes prior validation.
  - Unless a scenario states otherwise, coordinates are expressed relative to an arbitrary
    valid center (cx, cy), radius r is 5, and each listed offset is added to cx or
    cy.
  diversity:
    sourceRelation:
    - CONTAINS
    - WITHIN
    - INTERSECTS
    - DISJOINT
    boundingBoxPhase:
    - bbox_DISJOINT_shortcut
    - bbox_WITHIN_shortcut
    - bbox_equal_identity_edge
    - bbox_INTERSECTS_phase2
    - bbox_CONTAINS_phase2
    xAxisPosition:
    - left_of_rectangle
    - right_of_rectangle
    - inside_rectangle
    - on_rectangle_boundary
    yAxisPosition:
    - below_rectangle
    - above_rectangle
    - inside_rectangle
    - on_rectangle_boundary
    contactType:
    - strict_gap
    - strict_overlap
    - side_tangent
    - corner_tangent
    - internal_tangent
    - exact_bbox_equality
    rectangleDimension:
    - positive_area
    - zero_width_line
    - zero_height_line
    - point
    circleRadiusClass:
    - positive
    - zero
    sentinelState:
    - non_empty_pair
    - empty_circle
    - empty_rectangle
    - both_empty
    farthestCornerDecision:
    - maxX_selected
    - minX_selected
    - maxY_selected
    - minY_selected
    - equal_span_tie
  scenarios:
  - id: STRICT_RECTANGLE_CONTAINS_CIRCLE
    category: NORMAL
    description: A positive-area rectangle strictly surrounds the complete circle
      bounding box.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-6, cx+6] by [cy-6, cy+6].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN, so relate returns WITHIN through the
      bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_CONTAINS_CIRCLE_WITH_SIDE_TANGENCY
    category: BOUNDARY
    description: The rectangle contains the circle and shares one side with its bounding
      box.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-5, cx+6] by [cy-6, cy+6].
    expectedSourceBehavior:
    - The circle bounding box is WITHIN the rectangle, including the shared boundary,
      and the source relation is WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_CONTAINS_CIRCLE_WITH_MULTIPLE_TANGENCIES
    category: BOUNDARY
    description: The rectangle contains the circle while sharing two bounding-box
      sides.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-5, cx+6] by [cy-5, cy+6].
    expectedSourceBehavior:
    - The bounding-box WITHIN shortcut returns WITHIN despite simultaneous boundary
      contacts.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_EQUALS_CIRCLE_BOUNDING_BOX
    category: EDGE
    description: The rectangle exactly equals the calculated circle bounding box.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-5, cx+5] by [cy-5, cy+5].
    expectedSourceBehavior:
    - The explicit bboxSect == CONTAINS and enclosingBox.equals(rectangle) identity
      edge returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_BOUNDING_BOX_DISJOINT
    category: NORMAL
    description: The rectangle is wholly to the right of the circle bounding box.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+6, cx+8] by [cy-1, cy+1].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT and relate returns DISJOINT without
      phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_BOUNDING_BOX_DISJOINT
    category: NORMAL
    description: The rectangle is wholly above the circle bounding box.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-1, cx+1] by [cy+6, cy+8].
    expectedSourceBehavior:
    - The bounding-box DISJOINT shortcut returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_BOUNDING_BOX_DISJOINT
    category: NORMAL
    description: The rectangle is separated from the circle bounding box on both axes.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+6, cx+8] by [cy+6, cy+8].
    expectedSourceBehavior:
    - The bounding boxes are DISJOINT, so no distance containment test is needed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHEAST_CORNER_FALSE_POSITIVE
    category: EDGE
    description: The bounding boxes overlap, but the rectangle's nearest northeast
      corner lies outside the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+4, cx+6] by [cy+4, cy+6].
    expectedSourceBehavior:
    - xAxis is less than minX and yAxis is less than minY.
    - The closest corner (cx+4, cy+4) is not contained, so phase 2 returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHWEST_CORNER_FALSE_POSITIVE
    category: EDGE
    description: The bounding boxes overlap near the northwest corner, but the shapes
      are geometrically disjoint.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-6, cx-4] by [cy+4, cy+6].
    expectedSourceBehavior:
    - xAxis is greater than maxX and yAxis is less than minY.
    - The nearest corner is outside the circle, producing DISJOINT in phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHEAST_CORNER_FALSE_POSITIVE
    category: EDGE
    description: The bounding boxes overlap near the southeast corner, but the nearest
      rectangle corner is outside the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+4, cx+6] by [cy-6, cy-4].
    expectedSourceBehavior:
    - xAxis is less than minX and yAxis is greater than maxY.
    - The closest-corner containment test returns false and the source relation is
      DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_CORNER_FALSE_POSITIVE
    category: EDGE
    description: The bounding boxes overlap near the southwest corner without circle-rectangle
      contact.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-6, cx-4] by [cy-6, cy-4].
    expectedSourceBehavior:
    - xAxis is greater than maxX and yAxis is greater than maxY.
    - The closest corner is outside the circle, causing phase 2 to return DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RIGHT_SIDE_EXTERNAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at its rightmost axis point.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+5, cx+7] by [cy-1, cy+1].
    expectedSourceBehavior:
    - The bounding boxes are not disjoint, the rectangle spans the circle's y-axis,
      and the source relation is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEFT_SIDE_EXTERNAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at its leftmost axis point.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-7, cx-5] by [cy-1, cy+1].
    expectedSourceBehavior:
    - The xAxis > maxX branch is reached, disjointness is ruled out by y-axis overlap,
      and the result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TOP_SIDE_EXTERNAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at its top axis point.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-1, cx+1] by [cy+5, cy+7].
    expectedSourceBehavior:
    - The rectangle spans the x-axis and reaches the circle at one boundary point,
      yielding INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTTOM_SIDE_EXTERNAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at its bottom axis point.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-1, cx+1] by [cy-7, cy-5].
    expectedSourceBehavior:
    - The yAxis > maxY branch is reached and the source relation is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RIGHT_SIDE_STRICT_PENETRATION
    category: NORMAL
    description: A rectangle enters the circle through its right side while extending
      beyond the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+4.5, cx+7] by [cy-1, cy+1].
    expectedSourceBehavior:
    - The rectangle is neither disjoint nor contained, so phase 2 returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THREE_FOUR_FIVE_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at a corner exactly five units from
      the center.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+3, cx+6] by [cy+4, cy+6].
    expectedSourceBehavior:
    - The closest corner (cx+3, cy+4) is contained on the boundary, so the pair is
      not disjoint.
    - Because the rectangle is not contained by the circle bounding box, the result
      is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CORNER_STRICT_PENETRATION
    category: NORMAL
    description: The nearest rectangle corner is strictly inside the circle while
      the rest extends outward.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+3, cx+6] by [cy+3.75, cy+6].
    expectedSourceBehavior:
    - The closest-corner test confirms overlap and phase 2 returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_SECANT_LINE
    category: EDGE
    description: A zero-height rectangle line crosses the circle through its center.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-7, cx+7] by [cy, cy].
    expectedSourceBehavior:
    - The line spans both axes through the center, is not contained by the circle
      bounding box, and the result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_SECANT_LINE
    category: EDGE
    description: A zero-width rectangle line crosses the circle through its center.
    preconditions:
    - radius = 5 and rectangle bounds are [cx, cx] by [cy-7, cy+7].
    expectedSourceBehavior:
    - Axis overlap rules out disjointness and phase 2 returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TANGENT_HORIZONTAL_LINE
    category: BOUNDARY
    description: A zero-height rectangle is tangent to the top of the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-2, cx+2] by [cy+5, cy+5].
    expectedSourceBehavior:
    - The line spans the x-axis and touches the circle at (cx, cy+5), producing INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CENTERED_ASYMMETRIC_RECTANGLE_CONTAINED
    category: NORMAL
    description: The circle strictly contains a positive-area rectangle whose farther
      sides are maxX and maxY.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-1, cx+3] by [cy-1, cy+2].
    expectedSourceBehavior:
    - bboxSect is CONTAINS and the farthest selected corner is (cx+3, cy+2).
    - The farthest corner is contained, so the source relation is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CENTERED_EQUAL_SPAN_RECTANGLE_CONTAINED
    category: EDGE
    description: The circle contains a centered rectangle with equal distances to
      opposite sides.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-2, cx+2] by [cy-2, cy+2].
    expectedSourceBehavior:
    - The strict greater-than farthest-side comparisons take their tie alternatives,
      selecting minX and minY.
    - The selected corner is contained and the result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFF_AXIS_RECTANGLE_INTERNAL_TANGENCY
    category: BOUNDARY
    description: A rectangle wholly northeast of the center is contained, with its
      farthest corner on the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+1, cx+3] by [cy+1, cy+4].
    expectedSourceBehavior:
    - The closest corner is contained and the farthest corner (cx+3, cy+4) is on the
      circle.
    - Inclusive containment of the farthest corner yields CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_RECTANGLE_STRICTLY_CONTAINED
    category: NORMAL
    description: A rectangle lies wholly southwest of the center and strictly inside
      the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-3, cx-1] by [cy-3, cy-1].
    expectedSourceBehavior:
    - The xAxis > maxX and yAxis > maxY paths select the opposite bounds as farthest.
    - The farthest corner is contained, producing CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_BUT_CIRCLE_DOES_NOT
    category: EDGE
    description: The rectangle is inside the circle's square bounding box but has
      corners outside the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-4, cx+4] by [cy-4, cy+4].
    expectedSourceBehavior:
    - bboxSect is CONTAINS, but the selected farthest corner is not contained.
    - Phase 2 returns INTERSECTS rather than CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: QUADRANT_RECTANGLE_NEAR_CORNER_INSIDE_FAR_CORNER_OUTSIDE
    category: EDGE
    description: A northeast rectangle has an inside nearest corner and an outside
      farthest corner.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+1, cx+4] by [cy+1, cy+4].
    expectedSourceBehavior:
    - The closest corner prevents DISJOINT, while the farthest corner prevents CONTAINS.
    - The resulting source relation is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: X_SPAN_TIE_WITH_OUTSIDE_FARTHEST_CORNER
    category: EDGE
    description: Equal horizontal spans force the minX tie branch before an outside
      farthest-corner result.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-4.75, cx+4.75] by [cy-2, cy+2].
    expectedSourceBehavior:
    - The x farthest-side comparison ties and selects minX.
    - The selected farthest corner is outside the circle, so the relation is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: Y_SPAN_TIE_WITH_OUTSIDE_FARTHEST_CORNER
    category: EDGE
    description: Equal vertical spans force the minY tie branch before an outside
      farthest-corner result.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-2, cx+2] by [cy-4.75, cy+4.75].
    expectedSourceBehavior:
    - The y farthest-side comparison ties and selects minY.
    - The farthest corner is not contained and the result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_STRICTLY_INSIDE_CIRCLE
    category: EDGE
    description: The rectangle degenerates to a point strictly inside a positive-radius
      circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+1, cx+1] by [cy+1, cy+1].
    expectedSourceBehavior:
    - The circle bounding box contains the point rectangle and its only point is contained.
    - The source relation is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: The rectangle degenerates to the boundary point at a 3-4-5 offset.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+3, cx+3] by [cy+4, cy+4].
    expectedSourceBehavior:
    - The point passes the inclusive circle containment test and the relation is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_IN_BBOX_BUT_OUTSIDE_CIRCLE
    category: EDGE
    description: A point rectangle lies inside the square bounding box but outside
      the circular area.
    preconditions:
    - radius = 5 and rectangle bounds are [cx+4, cx+4] by [cy+4, cy+4].
    expectedSourceBehavior:
    - Both axes miss the point rectangle and contains(cx+4, cy+4) is false.
    - Phase 2 returns DISJOINT despite bboxSect being CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_LINE_STRICTLY_CONTAINED
    category: EDGE
    description: A zero-height line rectangle is wholly inside the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx-3, cx+3] by [cy+1, cy+1].
    expectedSourceBehavior:
    - The bounding box contains the line and its selected farthest endpoint is inside
      the circle.
    - The source relation is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RADIAL_LINE_ENDPOINT_INTERNAL_TANGENCY
    category: BOUNDARY
    description: A zero-height radial line is contained with its outer endpoint on
      the circle.
    preconditions:
    - radius = 5 and rectangle bounds are [cx, cx+5] by [cy, cy].
    expectedSourceBehavior:
    - The farthest endpoint is on the boundary and is contained, so the source relation
      is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_WITHIN_AREA_RECTANGLE
    category: EDGE
    description: A zero-radius circle is a point strictly inside a positive-area rectangle.
    preconditions:
    - radius = 0 and rectangle bounds are [cx-1, cx+1] by [cy-1, cy+1].
    expectedSourceBehavior:
    - The zero-size circle bounding box is WITHIN the rectangle, so the source relation
      is WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EXACT_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and point rectangle have exactly equal bounding
      boxes.
    preconditions:
    - radius = 0 and rectangle bounds are [cx, cx] by [cy, cy].
    expectedSourceBehavior:
    - The explicit equal-bounding-box identity edge returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and a distinct point rectangle are disjoint.
    preconditions:
    - radius = 0 and rectangle bounds are [cx+1, cx+1] by [cy, cy].
    expectedSourceBehavior:
    - Their zero-area bounding boxes are disjoint and the source relation is DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_WITHIN_LINE_RECTANGLE
    category: EDGE
    description: A zero-radius circle lies on the interior of a zero-height line rectangle.
    preconditions:
    - radius = 0 and rectangle bounds are [cx-2, cx+2] by [cy, cy].
    expectedSourceBehavior:
    - The point bounding box is WITHIN the line rectangle and relate returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_CIRCLE_NONEMPTY_RECTANGLE
    category: EDGE
    description: The receiver uses CircleImpl's explicit empty-center sentinel while
      the rectangle is non-empty.
    preconditions:
    - point.isEmpty() is true, causing radiusDEG to be NaN and enclosingBox to be
      the context's all-NaN empty rectangle.
    - The argument rectangle bounds are finite and define a non-empty rectangle.
    expectedSourceBehavior:
    - The empty enclosing-box relation reaches the DISJOINT sentinel result.
    - The jointly shifted follow-up remains empty because arithmetic on the empty
      center's NaN coordinates remains NaN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONEMPTY_CIRCLE_EMPTY_RECTANGLE
    category: EDGE
    description: A non-empty circle is related directly to an all-NaN empty RectangleImpl.
    preconditions:
    - The circle has finite center coordinates and radius = 5.
    - rectangle.isEmpty() is true and all four rectangle bounds are NaN.
    expectedSourceBehavior:
    - The circle bounding box is DISJOINT from the empty rectangle and the source
      relation is DISJOINT.
    - The follow-up rectangle remains all-NaN after adding the supplied shifts.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SHAPES_EMPTY
    category: EDGE
    description: Both the CircleImpl receiver and RectangleImpl argument use their
      empty sentinels.
    preconditions:
    - point.isEmpty() is true.
    - rectangle.isEmpty() is true and all four rectangle bounds are NaN.
    expectedSourceBehavior:
    - The empty bounding-box path returns DISJOINT.
    - Both follow-up shapes remain empty sentinels after the supplied transformation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIGNED_ZERO_CENTER_AND_DEGENERATE_RECTANGLE
    category: EDGE
    description: Signed-zero coordinates exercise equality and axis comparisons without
      changing geometric position.
    preconditions:
    - The non-empty circle center is (-0.0, +0.0) and radius = 5.
    - The point rectangle is at (+0.0, -0.0).
    expectedSourceBehavior:
    - The point rectangle is at the circle center and is contained, so the source
      relation is CONTAINS.
    - Loss of signed-zero notation after shifting does not alter the geometric relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_SMALL_POSITIVE_CIRCLE_WITHIN_RECTANGLE
    category: BOUNDARY
    description: A small but positive-radius circle remains distinct from the zero-radius
      cases.
    preconditions:
    - radius = 0.125 and rectangle bounds are [cx-0.25, cx+0.25] by [cy-0.25, cy+0.25].
    - The shifted doubles preserve these widths and relative offsets exactly.
    expectedSourceBehavior:
    - hasArea() would be true and the bounding-box WITHIN shortcut returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
