InputDomain:
  summary: Non-null HTML body fragments cleaned with the same non-null base-URI string
    and the same Safelist instance on both source and follow-up calls. The domain
    spans empty, text-only, parsed HTML, malformed HTML, unsafe markup, attribute
    and protocol handling, URL resolution contexts, entity serialization, and all
    disclosed Safelist construction choices.
  globalConstraints:
  - bodyHtml, baseUri, and safelist must each be non-null because the supplied implementation
    dereferences baseUri and safelist and passes bodyHtml to parsing; invalid-input
    behavior is not part of the stated metamorphic relation.
  - The follow-up invocation must use exactly the source invocation's returned String
    as bodyHtml and must preserve object identity of the source Safelist instance
    and exact equality of the source baseUri string.
  - Each source case must invoke the three-argument clean(String, String, Safelist)
    overload, not either disclosed overload with fewer arguments.
  diversity:
    bodyFragmentShape:
    - distinct
    - measurable
    - empty; whitespace-only; text-only; allowed-looking markup; unsafe markup; mixed
      markup; malformed markup; comments; declarations; entities; URL-bearing markup;
      nested markup
    baseUriClass:
    - distinct
    - measurable
    - empty string; HTTPS origin root; HTTPS directory URL; HTTP directory URL; base
      URI containing path, query, and fragment
    safelistConstruction:
    - distinct
    - measurable
    - new Safelist(); new Safelist(copy); Safelist.none(); Safelist.simpleText();
      Safelist.basic(); Safelist.basicWithImages(); Safelist.relaxed()
    sanitizationTrigger:
    - distinct
    - measurable
    - no markup; tag removal candidate; attribute removal candidate; URL protocol
      candidate; relative URL candidate; parser normalization candidate; escaping
      candidate
  scenarios:
  - id: EMPTY_FRAGMENT_NONE
    category: BOUNDARY
    description: Empty body fragment under the text-node-only Safelist.
    preconditions:
    - bodyHtml equals ""
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned cleaned body fragment is empty.
    targetCases: 1
    emptyOutputAllowed: true
  - id: WHITESPACE_ONLY_NONE
    category: BOUNDARY
    description: Body fragment containing only spaces, tab, newline, and carriage
      return under Safelist.none().
    preconditions:
    - bodyHtml contains at least one space, one tab, one newline, and one carriage
      return and contains no '<' character
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The result is a serialized body fragment produced from text nodes only.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PLAIN_ASCII_TEXT_NONE
    category: NORMAL
    description: Plain visible ASCII text without HTML delimiters.
    preconditions:
    - bodyHtml equals "Visible plain text 123"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains "Visible plain text 123".
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNICODE_TEXT_NONE
    category: EDGE
    description: Visible non-ASCII text and supplementary Unicode characters with
      no markup.
    preconditions:
    - bodyHtml equals "café 東京 😀"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains visible text content from the source.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TEXT_WITH_HTML_METACHARACTERS_NONE
    category: EDGE
    description: Text containing ampersand, angle brackets, quotes, and apostrophes
      that require HTML serialization treatment.
    preconditions:
    - bodyHtml equals "5 < 6 & 7 > 3 \"quoted\" 'apostrophe'"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned value is HTML body-fragment serialization rather than unescaped
      plain-text output.
    - The returned fragment contains the visible numeric text content.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAMED_AND_NUMERIC_ENTITIES_NONE
    category: EDGE
    description: Text containing named and numeric character references.
    preconditions:
    - bodyHtml equals "&lt;tag&gt; &amp; &#x1F600; &#169;"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned value is serialized HTML and retains nonempty text content.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_ELEMENT_NONE
    category: NORMAL
    description: A single ordinary element under the documented TextNode-only Safelist.
    preconditions:
    - bodyHtml equals "<p>VISIBLE</p>"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    - The result is produced using a Safelist documented as TextNode-only.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NESTED_ELEMENTS_NONE
    category: NORMAL
    description: Multiple nested elements with direct visible text under Safelist.none().
    preconditions:
    - bodyHtml equals "<div><p>OUTER <strong>INNER</strong></p></div>"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains both "OUTER" and "INNER".
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMENT_AND_VISIBLE_TEXT_NONE
    category: EDGE
    description: HTML comment adjacent to visible text.
    preconditions:
    - bodyHtml equals "<!-- comment --><p>VISIBLE</p>"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: DOCTYPE_AND_VISIBLE_TEXT_NONE
    category: EDGE
    description: Declaration-like input within the body-fragment parser context.
    preconditions:
    - bodyHtml equals "<!doctype html><p>VISIBLE</p>"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNTERMINATED_TAG_NONE
    category: EDGE
    description: Incomplete opening-tag syntax followed by visible text.
    preconditions:
    - bodyHtml equals "<p>VISIBLE"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The parser accepts the body fragment and the returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: MISNESTED_ELEMENTS_NONE
    category: EDGE
    description: Deliberately misnested HTML requiring body-fragment tree balancing.
    preconditions:
    - bodyHtml equals "<b><i>VISIBLE</b> AFTER</i>"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains both "VISIBLE" and "AFTER".
    targetCases: 1
    emptyOutputAllowed: false
  - id: SCRIPT_ELEMENT_NONE
    category: NORMAL
    description: Active-script element candidate plus an independent visible text
      node.
    preconditions:
    - bodyHtml equals "<script>alert(1)</script><p>VISIBLE</p>"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains the independent visible text "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: STYLE_ELEMENT_NONE
    category: NORMAL
    description: Style element candidate plus independent visible text.
    preconditions:
    - bodyHtml equals "<style>body{color:red}</style><p>VISIBLE</p>"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.none()
    expectedSourceBehavior:
    - The returned fragment contains the independent visible text "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: EVENT_HANDLER_ATTRIBUTE_BASIC
    category: NORMAL
    description: Basic Safelist with an element carrying an event-handler-like attribute
      and visible content.
    preconditions:
    - bodyHtml equals "<p onclick=\"alert(1)\">VISIBLE</p>"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    - The result is a cleaned serialization rather than the unparsed source string.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNKNOWN_ATTRIBUTE_BASIC
    category: NORMAL
    description: Basic Safelist with multiple nonstandard attributes on visible content.
    preconditions:
    - bodyHtml equals "<p data-x=\"1\" custom=\"2\" title=\"title\">VISIBLE</p>"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAVASCRIPT_LINK_BASIC
    category: NORMAL
    description: URL-bearing link whose href uses a script-like protocol.
    preconditions:
    - bodyHtml equals "<a href=\"javascript:alert(1)\">VISIBLE</a>"
    - baseUri equals "https://example.test/base/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    - The source exercises URL protocol filtering for a URL-bearing attribute if that
      attribute is permitted by the selected Safelist.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATA_URL_LINK_BASIC
    category: NORMAL
    description: URL-bearing link whose href uses a data protocol.
    preconditions:
    - bodyHtml equals "<a href=\"data:text/html,example\">VISIBLE</a>"
    - baseUri equals "https://example.test/base/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: ABSOLUTE_HTTPS_LINK_BASIC
    category: NORMAL
    description: Absolute HTTPS URL in an anchor under Safelist.basic().
    preconditions:
    - bodyHtml equals "<a href=\"https://other.example/path?q=1#f\">VISIBLE</a>"
    - baseUri equals "https://example.test/base/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELATIVE_LINK_BASIC_NONEMPTY_BASE
    category: NORMAL
    description: Relative anchor URL with a nonempty directory base URI.
    preconditions:
    - bodyHtml equals "<a href=\"child/page.html?x=1#part\">VISIBLE</a>"
    - baseUri equals "https://example.test/parent/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    - Parsing receives the supplied nonempty base URI for URL resolution.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_RELATIVE_LINK_BASIC_NONEMPTY_BASE
    category: NORMAL
    description: Root-relative anchor URL with an HTTPS base URI.
    preconditions:
    - bodyHtml equals "<a href=\"/root/item\">VISIBLE</a>"
    - baseUri equals "https://example.test/parent/page"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: FRAGMENT_ONLY_LINK_BASIC
    category: EDGE
    description: Fragment-only anchor URL under a nonempty base URI.
    preconditions:
    - bodyHtml equals "<a href=\"#section\">VISIBLE</a>"
    - baseUri equals "https://example.test/doc/page"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELATIVE_LINK_BASIC_EMPTY_BASE
    category: BOUNDARY
    description: Relative anchor URL with the empty base URI used by the explicit
      three-argument overload.
    preconditions:
    - bodyHtml equals "<a href=\"relative\">VISIBLE</a>"
    - baseUri equals ""
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    - The source reaches the clean-method condition whose first operand is baseUri.isEmpty().
    targetCases: 1
    emptyOutputAllowed: false
  - id: IMAGE_WITH_RELATIVE_SRC_BASIC_WITH_IMAGES
    category: NORMAL
    description: Relative image source under the image-oriented disclosed Safelist
      factory.
    preconditions:
    - bodyHtml equals "<img src=\"images/pic.png\" alt=\"VISIBLE\">"
    - baseUri equals "https://example.test/assets/"
    - safelist is the instance returned by Safelist.basicWithImages()
    expectedSourceBehavior:
    - The returned cleaned fragment is nonempty because the source provides an alt
      value containing "VISIBLE".
    - Parsing receives a nonempty base URI for the relative src value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IMAGE_WITH_JAVASCRIPT_SRC_BASIC_WITH_IMAGES
    category: NORMAL
    description: Image source using a script-like protocol under Safelist.basicWithImages().
    preconditions:
    - bodyHtml equals "<img src=\"javascript:alert(1)\" alt=\"VISIBLE\">"
    - baseUri equals "https://example.test/assets/"
    - safelist is the instance returned by Safelist.basicWithImages()
    expectedSourceBehavior:
    - The returned cleaned fragment is nonempty because the source provides visible
      attribute text.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_TEXT_LINK_IMAGE_RELAXED
    category: NORMAL
    description: Mixed text, anchor, image, and nested formatting markup under the
      broad disclosed Safelist.
    preconditions:
    - bodyHtml equals "<p>START <a href=\"docs/item\">LINK</a> <img src=\"img.png\"
      alt=\"ALT\"> <em>END</em></p>"
    - baseUri equals "https://example.test/base/"
    - safelist is the instance returned by Safelist.relaxed()
    expectedSourceBehavior:
    - The returned fragment contains "START", "LINK", and "END".
    targetCases: 1
    emptyOutputAllowed: false
  - id: TABLE_STRUCTURE_RELAXED
    category: NORMAL
    description: Table-like nested body fragment under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<table><tr><td>A</td><td>B</td></tr></table>"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.relaxed()
    expectedSourceBehavior:
    - The returned fragment contains both "A" and "B".
    targetCases: 1
    emptyOutputAllowed: false
  - id: LIST_STRUCTURE_RELAXED
    category: NORMAL
    description: Ordered and unordered list markup under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<ol><li>ONE</li><li>TWO<ul><li>THREE</li></ul></li></ol>"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.relaxed()
    expectedSourceBehavior:
    - The returned fragment contains "ONE", "TWO", and "THREE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: FORM_CONTROL_RELAXED
    category: NORMAL
    description: Form-control-like markup and visible label text under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<label>VISIBLE<input type=\"text\" value=\"v\"></label>"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.relaxed()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_FACTORY_FORMATTING
    category: NORMAL
    description: Formatting-style markup under the disclosed simpleText Safelist factory.
    preconditions:
    - bodyHtml equals "<p>START <b>BOLD</b> <i>ITALIC</i> END</p>"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.simpleText()
    expectedSourceBehavior:
    - The returned fragment contains "START", "BOLD", "ITALIC", and "END".
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_FACTORY_LINK_CANDIDATE
    category: NORMAL
    description: Anchor markup under Safelist.simpleText(), distinct from formatting-only
      input.
    preconditions:
    - bodyHtml equals "<a href=\"https://example.test/\">VISIBLE</a>"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.simpleText()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEFAULT_CONSTRUCTED_SAFELIST_TEXT
    category: NORMAL
    description: Plain text with a directly constructed Safelist instance.
    preconditions:
    - bodyHtml equals "VISIBLE"
    - baseUri equals ""
    - safelist is created by public Safelist()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEFAULT_CONSTRUCTED_SAFELIST_MARKUP
    category: NORMAL
    description: Markup and visible content with a directly constructed Safelist instance.
    preconditions:
    - bodyHtml equals "<p>VISIBLE <span>INNER</span></p>"
    - baseUri equals "https://example.test/"
    - safelist is created by public Safelist()
    expectedSourceBehavior:
    - The returned fragment contains visible source text "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: COPIED_NONE_SAFELIST
    category: NORMAL
    description: Text and markup using a Safelist created by the public copy constructor
      from Safelist.none().
    preconditions:
    - bodyHtml equals "<p>VISIBLE <b>INNER</b></p>"
    - baseUri equals ""
    - safelist is created by public Safelist(Safelist.none())
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE" and "INNER".
    targetCases: 1
    emptyOutputAllowed: false
  - id: COPIED_BASIC_SAFELIST_RELATIVE_LINK
    category: NORMAL
    description: Relative link using a Safelist created by copying Safelist.basic().
    preconditions:
    - bodyHtml equals "<a href=\"child\">VISIBLE</a>"
    - baseUri equals "http://example.test/dir/"
    - safelist is created by public Safelist(Safelist.basic())
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPERCASE_TAG_AND_ATTRIBUTE_BASIC
    category: EDGE
    description: Case-variant element and attribute names in HTML parser input.
    preconditions:
    - bodyHtml equals "<A HREF=\"https://example.test/\">VISIBLE</A>"
    - baseUri equals "https://base.example/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: DUPLICATE_ATTRIBUTES_BASIC
    category: EDGE
    description: Element with duplicate href attributes, exercising parser attribute
      normalization before cleaning.
    preconditions:
    - bodyHtml equals "<a href=\"https://first.example/\" href=\"javascript:alert(1)\">VISIBLE</a>"
    - baseUri equals "https://base.example/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: ATTRIBUTE_QUOTING_VARIANTS_BASIC
    category: EDGE
    description: URL-bearing markup using unquoted, single-quoted, and double-quoted
      attribute syntax.
    preconditions:
    - bodyHtml equals "<a href=https://example.test/a>ONE</a><a href='https://example.test/b'>TWO</a><a
      href=\"https://example.test/c\">THREE</a>"
    - baseUri equals "https://base.example/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "ONE", "TWO", and "THREE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMBEDDED_BASE_TAG_RELATIVE_LINK
    category: EDGE
    description: Body fragment containing a base element and a subsequent relative
      link.
    preconditions:
    - bodyHtml equals "<base href=\"https://embedded.example/root/\"><a href=\"child\">VISIBLE</a>"
    - baseUri equals "https://supplied.example/start/"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    - The source exercises body-fragment parsing with both a supplied base URI and
      an in-fragment base element.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASE_URI_WITH_QUERY_AND_FRAGMENT
    category: EDGE
    description: Relative URL with a supplied base URI containing path, query, and
      fragment components.
    preconditions:
    - bodyHtml equals "<a href=\"child\">VISIBLE</a>"
    - baseUri equals "https://example.test/dir/page?x=1#old"
    - safelist is the instance returned by Safelist.basic()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
  - id: MULTIPLE_TOP_LEVEL_NODES_RELAXED
    category: NORMAL
    description: Several sibling body nodes with text before, between, and after elements.
    preconditions:
    - bodyHtml equals "BEFORE<p>PARAGRAPH</p>BETWEEN<div>DIVTEXT</div>AFTER"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.relaxed()
    expectedSourceBehavior:
    - The returned fragment contains "BEFORE", "PARAGRAPH", "BETWEEN", "DIVTEXT",
      and "AFTER".
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEEPLY_NESTED_VISIBLE_TEXT_RELAXED
    category: EDGE
    description: Deeply nested element structure with a single leaf text node.
    preconditions:
    - bodyHtml equals "<div><section><article><p><span><em>VISIBLE</em></span></p></article></section></div>"
    - baseUri equals "https://example.test/"
    - safelist is the instance returned by Safelist.relaxed()
    expectedSourceBehavior:
    - The returned fragment contains "VISIBLE".
    targetCases: 1
    emptyOutputAllowed: false
