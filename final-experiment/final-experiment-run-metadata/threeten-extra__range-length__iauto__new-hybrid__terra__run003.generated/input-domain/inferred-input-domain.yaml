InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be advanced by 23
    days and reconstructed by LocalDateRange.of(start, extendedEnd). The domain covers
    empty, ordinary bounded, calendar-boundary, factory-derived, parsed, finite saturated-length,
    and unbounded-start sentinel ranges.
  globalConstraints:
  - Source receiver is non-null and is successfully created by a documented LocalDateRange
    construction path.
  - '{Source start and end satisfy all LocalDateRange validity rules=start <= end;
    start is neither LocalDate.MAX nor LocalDate.MAX.minusDays(1); end is neither
    LocalDate.MIN nor LocalDate.MIN.plusDays(1).}'
  - Source end must be <= LocalDate.MAX.minusDays(23), because generateFollowUp executes
    range.getEnd().plusDays(23); later ends cause LocalDate.plusDays to overflow before
    the MR can skip or assert.
  - Ranges with an unbounded end, including LocalDateRange.ofUnbounded(), LocalDateRange.ofUnboundedEnd(start),
    and any range whose end is LocalDate.MAX, are excluded because their end cannot
    be advanced by 23 days by the supplied follow-up generator.
  - Invalid construction inputs are excluded because the supplied MR requires a LocalDateRange
    receiver and does not request exception metamorphic behavior.
  diversity:
    boundedness:
    - bounded
    - unbounded-start
    sourceLengthClass:
    - zero
    - one-day
    - ordinary
    - calendar-derived
    - Integer.MAX_VALUE-minus-24
    - Integer.MAX_VALUE-minus-23
    - Integer.MAX_VALUE-minus-22
    - Integer.MAX_VALUE
    - greater-than-Integer.MAX_VALUE
    followUpOutcome:
    - ordinary-increase-of-23
    - follow-up-becomes-unbounded-end-and-is-skipped
    - source-or-follow-up-Integer.MAX_VALUE-and-is-skipped
    constructionRoute:
    - of-dates
    - of-period
    - ofClosed
    - ofEmpty
    - from-LocalDate
    - from-LocalDateTime
    - from-Year
    - from-YearMonth
    - parse-date-date
    - parse-date-period
    - parse-period-date
    - ofUnboundedStart
    calendarPosition:
    - LocalDate.MIN-adjacent
    - BCE-CE-crossing
    - leap-day
    - non-leap-century
    - leap-century
    - month-end
    - year-end
    - LocalDate.MAX-adjacent
  scenarios:
  - id: MINIMUM_VALID_BOUNDED_ONE_DAY
    category: BOUNDARY
    description: Smallest bounded range adjacent to LocalDate.MIN that is valid and
      has a real one-day length.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)).
    - Source end is LocalDate.MIN.plusDays(2), which is <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up end is 23 days later and followUpOutput equals sourceOutput + 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_INTERIOR_RANGE
    category: BOUNDARY
    description: Valid empty range at an ordinary interior date.
    preconditions:
    - Receiver is LocalDateRange.ofEmpty(LocalDate.of(2024, 6, 15)).
    - Source start equals source end and is neither LocalDate.MIN nor LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The non-empty follow-up has length 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_ONE_DAY_RANGE
    category: NORMAL
    description: Ordinary half-open one-day range created directly from start and
      exclusive end dates.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 1, 10), LocalDate.of(2024,
      1, 11)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up output is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_EXTRA_DAYS_LENGTH
    category: NORMAL
    description: Source length exactly equals the MR extension amount.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 4, 1), LocalDate.of(2024, 4,
      24)).
    - Source length is exactly 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - Follow-up output is 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING
    category: EDGE
    description: Bounded range crosses February 29 in a leap year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    - Follow-up output is 26.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_LEAP_CENTURY_CROSSING
    category: EDGE
    description: Range crosses February in century year 1900, which is not a leap
      year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(1900, 2, 28), LocalDate.of(1900,
      3, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up output is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_CENTURY_CROSSING
    category: EDGE
    description: Range crosses February in century year 2000, which is a leap year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2000, 2, 28), LocalDate.of(2000,
      3, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    - Follow-up output is 26.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_END_CROSSING
    category: EDGE
    description: Bounded range crosses from a 31-day month into the next month.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 1, 31), LocalDate.of(2023,
      2, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up output is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_END_CROSSING
    category: EDGE
    description: Bounded range crosses the calendar year boundary.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024,
      1, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up output is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BCE_TO_CE_CROSSING
    category: EDGE
    description: Range crosses the ISO proleptic-year boundary from year -1 to year
      0.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(-1, 12, 31), LocalDate.of(0, 1, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - Follow-up output is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLETON
    category: NORMAL
    description: Closed range with equal inclusive start and end, which internally
      becomes a one-day half-open range.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 5, 5), LocalDate.of(2024,
      5, 5)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up output is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_MONTH_RANGE
    category: EDGE
    description: Closed range covering all days of February in leap year 2024.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 2, 1), LocalDate.of(2024,
      2, 29)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up output is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO_EMPTY_RANGE
    category: BOUNDARY
    description: Empty range created through the start-plus-Period factory using Period.ZERO.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 7, 1), Period.ZERO).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up output is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_END_CLAMP
    category: EDGE
    description: Period-based construction from January 31 by one month, exercising
      LocalDate period addition at month end.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 1, 31), Period.ofMonths(1)).
    - The computed exclusive end is LocalDate.of(2023, 2, 28).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - Follow-up output is 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MIXED_COMPONENTS
    category: NORMAL
    description: Period-based construction with year, month, and day components.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2021, 1, 15), Period.of(1, 2, 3)).
    - The computed exclusive end is LocalDate.of(2022, 3, 18).
    expectedSourceBehavior:
    - lengthInDays() is the number of days between the computed start and end.
    - Follow-up output equals sourceOutput + 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCALDATE
    category: NORMAL
    description: One-day range constructed by from(Temporal) from a LocalDate.
    preconditions:
    - Receiver is LocalDateRange.from(LocalDate.of(2024, 8, 20)).
    expectedSourceBehavior:
    - from(LocalDate) creates a one-day closed-date range internally.
    - lengthInDays() returns 1 and follow-up output is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCALDATETIME
    category: NORMAL
    description: One-day range constructed from a temporal with a local-date query
      result, ignoring its time component.
    preconditions:
    - Receiver is LocalDateRange.from(java.time.LocalDateTime.of(2024, 8, 20, 23,
      59, 59)).
    expectedSourceBehavior:
    - The date component produces a one-day range.
    - lengthInDays() returns 1 and follow-up output is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: Full common-calendar-year range created by from(Year).
    preconditions:
    - Receiver is LocalDateRange.from(java.time.Year.of(2023)).
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    - Follow-up output is 388.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: EDGE
    description: Full leap-calendar-year range created by from(Year).
    preconditions:
    - Receiver is LocalDateRange.from(java.time.Year.of(2024)).
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - Follow-up output is 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEARMONTH
    category: EDGE
    description: Leap February range created by from(YearMonth).
    preconditions:
    - Receiver is LocalDateRange.from(java.time.YearMonth.of(2024, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up output is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: Half-open range parsed from date/date syntax.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-03-10/2024-03-15").
    expectedSourceBehavior:
    - lengthInDays() returns 5.
    - Follow-up output is 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: Range parsed from date/period syntax.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-01-31/P1M").
    - Parsed end is LocalDate.of(2024, 2, 29).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up output is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: Range parsed from period/date syntax.
    preconditions:
    - Receiver is LocalDateRange.parse("P10D/2024-03-01").
    - Parsed start is LocalDate.of(2024, 2, 20).
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up output is 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FINITE_END
    category: EDGE
    description: Range unbounded at the start and finite at the end; its source output
      is the documented sentinel.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 1, 1)).
    - Source end is finite and can be advanced by 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - Follow-up remains unbounded at the start, and the MR assertion skips because
      a sentinel output is present.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_ADJACENT_FOLLOWUP_REMAINS_BOUNDED
    category: BOUNDARY
    description: Latest finite end for which adding 23 days still leaves a bounded
      follow-up end.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24)).
    - Follow-up exclusive end is LocalDate.MAX.minusDays(1), not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up output is 24 and must satisfy the asserted increase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_ADJACENT_FOLLOWUP_BECOMES_UNBOUNDED
    category: BOUNDARY
    description: Latest permitted source end; extension reaches LocalDate.MAX and
      creates an unbounded-end follow-up.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23)).
    - Follow-up exclusive end is exactly LocalDate.MAX.
    expectedSourceBehavior:
    - Source lengthInDays() returns 1.
    - Follow-up lengthInDays() returns Integer.MAX_VALUE because its end is unbounded,
      so the supplied MR assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_24
    category: BOUNDARY
    description: Largest finite source length for which a 23-day extension remains
      below Integer.MAX_VALUE.
    preconditions:
    - Let B be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(B, B.plusDays(Integer.MAX_VALUE - 24L)).
    - Source length is Integer.MAX_VALUE - 24.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24.
    - Follow-up output is Integer.MAX_VALUE - 1, so the asserted increase is exercised
      without sentinel skipping.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_23
    category: BOUNDARY
    description: Finite source whose extension reaches exactly Integer.MAX_VALUE days.
    preconditions:
    - Let B be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(B, B.plusDays(Integer.MAX_VALUE - 23L)).
    - Source length is Integer.MAX_VALUE - 23.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - Follow-up output is Integer.MAX_VALUE, causing the supplied MR assertion to
      skip.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_22
    category: EDGE
    description: Finite source just above the prior boundary, whose follow-up exceeds
      the largest ordinary int-valued length.
    preconditions:
    - Let B be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(B, B.plusDays(Integer.MAX_VALUE - 22L)).
    - Source length is Integer.MAX_VALUE - 22.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 22.
    - Follow-up output is Integer.MAX_VALUE and the supplied MR assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX
    category: BOUNDARY
    description: Finite bounded range whose exact length equals Integer.MAX_VALUE.
    preconditions:
    - Let B be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(B, B.plusDays(Integer.MAX_VALUE)).
    - Source range is bounded and has exact length Integer.MAX_VALUE.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The MR assertion skips because the source output equals the sentinel value even
      though the source bounds are finite.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_ABOVE_INTEGER_MAX
    category: EDGE
    description: Very large but finite bounded range exceeding Integer.MAX_VALUE days.
    preconditions:
    - Let B be LocalDate.of(0, 1, 1).
    - Receiver is LocalDateRange.of(B, B.plusDays(Integer.MAX_VALUE + 1L)).
    - Source end remains <= LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE for the oversized finite length.
    - The MR assertion skips because the source output is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
