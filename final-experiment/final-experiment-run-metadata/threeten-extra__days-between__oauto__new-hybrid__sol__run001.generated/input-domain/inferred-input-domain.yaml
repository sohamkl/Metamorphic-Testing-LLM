InputDomain:
  summary: Non-null JDK Temporal endpoint pairs for which both the source call and
    the MR's 37-day-shifted follow-up call complete normally and produce an int-valued
    whole-day count.
  globalConstraints:
  - Both source endpoints are non-null, as required by generateFollowUp and by the
    temporal operations used by Days.between.
  - Each endpoint is a JDK java.time Temporal that supports plus(37, ChronoUnit.DAYS);
    unsupported day-based temporals are excluded because the supplied MR cannot construct
    their follow-up.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) must complete normally
    for both the source pair and the independently shifted pair; incompatible endpoint
    combinations are excluded because assertRelation requires two Days outputs.
  - The day count for each invocation must lie in the inclusive range [-2147483648,
    2147483647], because Days.between applies Math.toIntExact before constructing
    Days.
  - Each endpoint must be at least 37 supported calendar days below its type's maximum
    representable value so that the supplied forward shift completes normally.
  - Custom Temporal implementations are excluded because no construction metadata
    or behavioral contract was supplied for them; standard JDK date, date-time, instant,
    offset, zone, and chronology implementations remain in scope when they satisfy
    the preceding constraints.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - non-ISO_ChronoLocalDate
    - compatible_heterogeneous_pair
    sourceAmountClass:
    - zero
    - one
    - negative_one
    - positive_multi_day
    - negative_multi_day
    - Integer_MAX_VALUE
    - Integer_MIN_VALUE
    calendarFeature:
    - ordinary_date
    - month_boundary
    - common_February
    - leap_day
    - year_boundary
    - epoch_boundary
    - representable_range_boundary
    subDayPosition:
    - exact_day
    - less_than_one_day
    - more_than_one_day_with_fraction
    - reverse_fraction
    offsetOrZoneFeature:
    - same_offset
    - differing_offsets
    - international_date_line_offsets
    - ordinary_zone
    - spring_DST_gap
    - autumn_DST_overlap
    - different_zones
    direction:
    - end_equal_start
    - end_after_start
    - end_before_start
  scenarios:
  - id: ZERO_LOCAL_DATE
    category: EDGE
    description: Equal LocalDate endpoints exercise Days.of(0) and the ZERO sentinel
      path.
    preconditions:
    - startDateInclusive and endDateExclusive are the same LocalDate.
    - That date plus 37 days is representable.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_LOCAL_DATE_TIME
    category: EDGE
    description: Equal LocalDateTime endpoints produce no complete days.
    preconditions:
    - startDateInclusive and endDateExclusive are the same LocalDateTime.
    - That date-time plus 37 days is representable.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_INSTANT
    category: EDGE
    description: Equal Instant endpoints exercise zero elapsed 24-hour units.
    preconditions:
    - startDateInclusive and endDateExclusive are the same Instant.
    - That instant plus 37 days is representable.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_OFFSET_DATE_TIME
    category: EDGE
    description: Equal OffsetDateTime endpoints produce the zero-day sentinel.
    preconditions:
    - Both endpoints are the same OffsetDateTime, including offset.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_ZONED_DATE_TIME
    category: EDGE
    description: Equal ZonedDateTime endpoints produce zero even in a region-based
      zone.
    preconditions:
    - Both endpoints are the same ZonedDateTime, including zone and offset.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_LOCAL_DATE
    category: BOUNDARY
    description: Adjacent LocalDate values exercise Days.of(1) and the ONE sentinel
      path.
    preconditions:
    - endDateExclusive equals startDateInclusive plus exactly 1 day.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_INSTANT
    category: BOUNDARY
    description: Instants separated by exactly one 24-hour day exercise the ONE path.
    preconditions:
    - endDateExclusive equals startDateInclusive plus exactly 86400 seconds.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_LOCAL_DATE
    category: BOUNDARY
    description: Reverse adjacent LocalDate values exercise the negative result path.
    preconditions:
    - endDateExclusive equals startDateInclusive minus exactly 1 day.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_INSTANT
    category: BOUNDARY
    description: Reverse Instants separated by exactly 24 hours produce negative one.
    preconditions:
    - endDateExclusive equals startDateInclusive minus exactly 86400 seconds.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SHIFT_SIZED_POSITIVE_GAP
    category: NORMAL
    description: A positive gap equal to the MR shift distinguishes endpoint translation
      from the measured gap.
    preconditions:
    - Both endpoints are LocalDate values.
    - endDateExclusive equals startDateInclusive plus exactly 37 days.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SHIFT_SIZED_NEGATIVE_GAP
    category: NORMAL
    description: A negative gap whose magnitude equals the MR shift covers directed
      subtraction.
    preconditions:
    - Both endpoints are LocalDate values.
    - endDateExclusive equals startDateInclusive minus exactly 37 days.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to -37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_POSITIVE_GAP
    category: NORMAL
    description: A large but non-overflowing positive span exercises ordinary Days
      allocation rather than ZERO or ONE.
    preconditions:
    - Both endpoints are shift-safe Instants.
    - endDateExclusive equals startDateInclusive plus exactly 1000000 days.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1000000.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_GAP
    category: NORMAL
    description: A large non-overflowing reverse span exercises a large negative int
      result.
    preconditions:
    - Both endpoints are shift-safe Instants.
    - endDateExclusive equals startDateInclusive minus exactly 1000000 days.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to -1000000.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_INT_DAY_COUNT
    category: BOUNDARY
    description: The largest day count accepted by Math.toIntExact is represented
      exactly.
    preconditions:
    - Both endpoints are Instants for which the source and shifted endpoints are representable.
    - endDateExclusive equals startDateInclusive plus exactly 2147483647 days.
    expectedSourceBehavior:
    - The call returns normally with getAmount() equal to 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_INT_DAY_COUNT
    category: BOUNDARY
    description: The smallest day count accepted by Math.toIntExact is represented
      exactly.
    preconditions:
    - Both endpoints are Instants for which the source and shifted endpoints are representable.
    - endDateExclusive equals startDateInclusive minus exactly 2147483648 days.
    expectedSourceBehavior:
    - The call returns normally with getAmount() equal to -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_FORWARD
    category: BOUNDARY
    description: A LocalDate interval crosses February 29 in a leap year.
    preconditions:
    - The endpoints are February 28 and March 1 of the same ISO leap year, in ascending
      order.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_REVERSE
    category: BOUNDARY
    description: The reverse of a leap-day interval covers negative counting across
      February 29.
    preconditions:
    - The endpoints are March 1 and February 28 of the same ISO leap year, in that
      order.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_FEBRUARY_BOUNDARY
    category: BOUNDARY
    description: A common-year February boundary contrasts with the leap-year path.
    preconditions:
    - The endpoints are February 28 and March 1 of the same non-leap ISO year.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THIRTY_ONE_DAY_MONTH_BOUNDARY
    category: BOUNDARY
    description: A LocalDate span crosses the end of a 31-day month.
    preconditions:
    - startDateInclusive is January 31 and endDateExclusive is February 2 of the same
      year.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THIRTY_DAY_MONTH_BOUNDARY
    category: BOUNDARY
    description: A LocalDate span crosses the end of a 30-day month.
    preconditions:
    - startDateInclusive is April 30 and endDateExclusive is May 2 of the same year.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY
    category: BOUNDARY
    description: The interval crosses from one ISO year into the next.
    preconditions:
    - startDateInclusive is December 31 and endDateExclusive is January 2 of the following
      year.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ISO_EPOCH_BOUNDARY
    category: BOUNDARY
    description: The interval crosses the LocalDate epoch at 1970-01-01.
    preconditions:
    - startDateInclusive is 1969-12-31 and endDateExclusive is 1970-01-02.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAX_SHIFT_BOUNDARY
    category: BOUNDARY
    description: The follow-up reaches LocalDate.MAX without exceeding it.
    preconditions:
    - startDateInclusive equals LocalDate.MAX minus 38 days.
    - endDateExclusive equals LocalDate.MAX minus 37 days.
    expectedSourceBehavior:
    - The source result has getAmount() equal to 1.
    - Adding 37 days places the follow-up end exactly at LocalDate.MAX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MIN_BOUNDARY
    category: BOUNDARY
    description: The source begins exactly at LocalDate.MIN while leaving room for
      the forward transformation.
    preconditions:
    - startDateInclusive equals LocalDate.MIN.
    - endDateExclusive equals LocalDate.MIN plus 1 day.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_POSITIVE
    category: EDGE
    description: A positive LocalDateTime interval shorter than one day is truncated
      to zero whole days.
    preconditions:
    - endDateExclusive is after startDateInclusive by more than 0 but less than 24
      hours.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: A LocalDateTime interval exactly at the one-day threshold produces
      one.
    preconditions:
    - endDateExclusive is exactly 24 hours after startDateInclusive.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_DAY_PLUS_FRACTION
    category: EDGE
    description: A LocalDateTime interval longer than one day but shorter than two
      days retains only one whole day.
    preconditions:
    - endDateExclusive is after startDateInclusive by more than 24 hours and less
      than 48 hours.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_REVERSE_SUBDAY
    category: EDGE
    description: A reverse LocalDateTime interval shorter than one day truncates toward
      zero.
    preconditions:
    - endDateExclusive is before startDateInclusive by more than 0 but less than 24
      hours.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_REVERSE_DAY_PLUS_FRACTION
    category: EDGE
    description: A reverse interval between one and two days produces negative one
      whole day.
    preconditions:
    - endDateExclusive is before startDateInclusive by more than 24 hours and less
      than 48 hours.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIDNIGHT_CROSSING_UNDER_ONE_DAY
    category: EDGE
    description: Crossing a calendar date boundary does not itself constitute a whole
      LocalDateTime day.
    preconditions:
    - startDateInclusive is a LocalDateTime late on one date.
    - endDateExclusive is early on the next date and less than 24 hours later.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_POSITIVE
    category: EDGE
    description: A positive Instant duration below 86400 seconds contains no complete
      DAYS unit.
    preconditions:
    - The elapsed duration is at least 1 second and at most 86399 seconds.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: BOUNDARY
    description: Exactly 86400 elapsed seconds form one Instant-based day.
    preconditions:
    - endDateExclusive is exactly 86400 seconds after startDateInclusive.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_REVERSE_SUBDAY
    category: EDGE
    description: A negative Instant duration with magnitude below one day truncates
      to zero.
    preconditions:
    - endDateExclusive is between 1 and 86399 seconds before startDateInclusive.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET
    category: NORMAL
    description: OffsetDateTime endpoints with the same fixed offset measure an exact
      multi-day interval.
    preconditions:
    - Both endpoints have the same ZoneOffset.
    - Their local date-times differ by exactly 5 days.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS
    category: EDGE
    description: Differing fixed offsets require normalization when counting whole
      days.
    preconditions:
    - The endpoints are OffsetDateTime values with different ZoneOffset values.
    - After representing the end at the start endpoint's offset while preserving its
      instant, it is between 24 and 48 hours after the start local date-time.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_LINE_EXTREMES
    category: EDGE
    description: Extreme legal offsets can make equal local date-times more than one
      elapsed day apart.
    preconditions:
    - Both local date-times are 2024-01-01T00:00.
    - The start offset is +14:00 and the end offset is -12:00.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1 because the end instant is 26 hours
      after the start instant.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_ORDINARY_DAY
    category: NORMAL
    description: A same-zone ZonedDateTime interval away from offset transitions counts
      ordinary local days.
    preconditions:
    - Both endpoints use the same region ZoneId.
    - No offset transition occurs between them or within 37 days after either endpoint.
    - Their local date-times differ by exactly 3 days.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_SPRING_FORWARD_DAY
    category: EDGE
    description: Consecutive same-zone local times across a spring DST transition
      count one date-based day despite less than 24 elapsed hours.
    preconditions:
    - Both endpoints use the same region ZoneId with a spring-forward transition.
    - They have the same local time on consecutive dates spanning that transition.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_FALL_BACK_DAY
    category: EDGE
    description: Consecutive same-zone local times across an autumn DST transition
      count one date-based day despite more than 24 elapsed hours.
    preconditions:
    - Both endpoints use the same region ZoneId with a fall-back transition.
    - They have the same local time on consecutive dates spanning that transition.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_GAP_RESOLVED_SUBDAY
    category: EDGE
    description: A same-date ZonedDateTime interval adjacent to a spring gap remains
      below one complete date-based day.
    preconditions:
    - Both endpoints use the same region ZoneId on its spring-transition date.
    - The resolved end is after the start but both resolved local date-times are on
      the same date.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_OVERLAP_SAME_LOCAL_TIME
    category: EDGE
    description: The two occurrences of an overlapped local time have different instants
      but no whole local day between them.
    preconditions:
    - Both endpoints use the same region ZoneId during an autumn overlap.
    - They have the same local date-time but select the earlier and later valid offsets
      respectively.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DIFFERENT_REGIONS
    category: EDGE
    description: Region-based endpoints in different zones exercise conversion of
      the end to the start zone.
    preconditions:
    - The endpoints use different region ZoneId values.
    - Both plus-37-day transformations are representable.
    - After converting the end instant to the start zone, the local date-time difference
      has magnitude below 24 hours.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_SAME_INSTANT_DIFFERENT_ZONES
    category: EDGE
    description: Two ZonedDateTime values representing the same instant but different
      local dates or times have zero days between them.
    preconditions:
    - The endpoints have different ZoneId values but represent exactly the same instant.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_INTERVAL
    category: NORMAL
    description: A non-ISO JapaneseDate pair exercises ChronoUnit.DAYS through a chronology-backed
      date.
    preconditions:
    - Both endpoints are JapaneseDate values in their supported range.
    - endDateExclusive equals startDateInclusive plus exactly 10 days.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_MONTH_BOUNDARY
    category: BOUNDARY
    description: A HijrahDate pair crosses a non-ISO month boundary.
    preconditions:
    - Both endpoints are HijrahDate values in their supported range and remain supported
      after adding 37 days.
    - endDateExclusive equals startDateInclusive plus exactly 2 days.
    - The two-day interval crosses a Hijrah month boundary.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_CHRONOLOGY_SAME_EPOCH_DAY
    category: EDGE
    description: Compatible chronology-backed dates representing the same epoch day
      produce zero.
    preconditions:
    - The endpoints are different standard ChronoLocalDate implementations.
    - Both represent the same epoch day.
    - The start implementation accepts the end for ChronoUnit.DAYS.between.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: EDGE
    description: A compatible heterogeneous pair starts with LocalDate and ends with
      LocalDateTime.
    preconditions:
    - startDateInclusive is a LocalDate.
    - endDateExclusive is a LocalDateTime whose date is exactly 2 days after the start
      and whose time is not midnight.
    - ChronoUnit.DAYS.between accepts the pair in this argument order.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 2 because the LocalDate-based calculation
      uses the end date.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_TO_OFFSET_DATE_TIME
    category: EDGE
    description: A compatible heterogeneous pair starts with Instant and ends with
      OffsetDateTime.
    preconditions:
    - startDateInclusive is an Instant.
    - endDateExclusive is an OffsetDateTime representing an instant exactly 86400
      seconds later.
    - Both values remain representable after adding 37 days.
    expectedSourceBehavior:
    - The returned Days has getAmount() equal to 1.
    targetCases: 1
    emptyOutputAllowed: false
