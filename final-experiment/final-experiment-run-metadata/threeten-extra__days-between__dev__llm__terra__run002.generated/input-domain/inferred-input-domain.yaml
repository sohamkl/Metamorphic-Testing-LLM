InputDomain:
  summary: Non-null Temporal endpoint pairs for which ChronoUnit.DAYS.between succeeds,
    its long result fits int, and adding 37 ChronoUnit.DAYS to each endpoint also
    succeeds. The domain includes date-only, date-time, instant, offset, zoned, chronology-specific,
    and valid mixed-representation endpoint pairs.
  globalConstraints:
  - startDateInclusive and endDateExclusive are non-null, because the follow-up generator
    explicitly requires both values to be non-null.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) completes normally
    and Math.toIntExact of its result completes normally, because Days.between returns
    Days only through that conversion.
  - startDateInclusive.plus(37, ChronoUnit.DAYS) and endDateExclusive.plus(37, ChronoUnit.DAYS)
    both complete normally, because these are the exact follow-up inputs.
  - Endpoint pairs unsupported by the start temporal's until operation for ChronoUnit.DAYS
    are excluded; the MR does not request invalid-input behavior and cannot construct
    a valid follow-up relation for a throwing source invocation.
  - Pairs whose day difference is outside the inclusive int range [-2147483648, 2147483647]
    are excluded because Days.between uses Math.toIntExact and therefore has no Days
    source output.
  - Endpoint values within 37 days of an implementation-specific minimum or maximum
    are included only when their required plus(37, DAYS) follow-up operation remains
    in range.
  diversity:
    endpointRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - JapaneseDateTime
    - MinguoDate
    - ThaiBuddhistDate
    - HijrahDate
    - valid mixed ISO and chronology-specific Temporal pairs
    gapShape:
    - zero
    - one day singleton result
    - positive multi-day
    - negative multi-day
    - positive and negative sub-day elapsed intervals
    - exact integer-range extrema
    - calendar boundaries
    - leap-day boundaries
    - offset-normalized boundaries
    - daylight-saving transitions
    resultPath:
    - Days.ZERO via of(0)
    - Days.ONE via of(1)
    - newly constructed positive Days
    - newly constructed negative Days
    - Math.toIntExact at Integer.MAX_VALUE
    - Math.toIntExact at Integer.MIN_VALUE
  scenarios:
  - id: LOCAL_DATE_SAME_DAY_ZERO
    category: NORMAL
    description: Identical ISO LocalDate endpoints produce a zero-day result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is the same LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    - The result exercises Days.of(0), returning the ZERO value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEXT_DAY_ONE
    category: BOUNDARY
    description: Adjacent ISO dates produce the singleton one-day result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is LocalDate.of(2024, 6, 16).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    - The result exercises Days.of(1), returning the ONE value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_ONE_DAY
    category: BOUNDARY
    description: Reversed adjacent ISO dates produce a negative one-day result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 16).
    - endDateExclusive is LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_END_CROSSING
    category: BOUNDARY
    description: A one-day gap crosses from the last day of a 31-day month into the
      next month.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 31).
    - endDateExclusive is LocalDate.of(2024, 2, 1).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: A non-leap-year February-to-March transition has a one-day gap.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 2, 28).
    - endDateExclusive is LocalDate.of(2023, 3, 1).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: A leap-year February 28 to March 1 interval includes February 29.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28).
    - endDateExclusive is LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: A one-day gap crosses the ISO calendar year boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 12, 31).
    - endDateExclusive is LocalDate.of(2024, 1, 1).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_WEEK_POSITIVE
    category: NORMAL
    description: A positive ISO date-only interval spans multiple weeks.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1).
    - endDateExclusive is LocalDate.of(2024, 2, 12).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 42.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_WEEK_NEGATIVE
    category: NORMAL
    description: A negative ISO date-only interval spans multiple weeks.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 12).
    - endDateExclusive is LocalDate.of(2024, 1, 1).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -42.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_SAFE_FOR_SHIFT
    category: EDGE
    description: An ISO LocalDate near LocalDate.MIN remains valid after the required
      37-day follow-up shift.
    preconditions:
    - startDateInclusive is LocalDate.MIN.plusDays(37).
    - endDateExclusive is LocalDate.MIN.plusDays(38).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    - Both source endpoints and their 37-day follow-up endpoints remain within LocalDate's
      supported range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_SAFE_FOR_SHIFT
    category: EDGE
    description: An ISO LocalDate near LocalDate.MAX remains valid after the required
      37-day follow-up shift.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(38).
    - endDateExclusive is LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    - Both source endpoints and their 37-day follow-up endpoints remain within LocalDate's
      supported range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_POSITIVE
    category: BOUNDARY
    description: A positive 23-hour LocalDateTime interval does not contain a whole
      day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 1, 1, 0, 0).
    - endDateExclusive is LocalDateTime.of(2024, 1, 1, 23, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: An exact 24-hour LocalDateTime interval produces one whole day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 1, 1, 0, 0).
    - endDateExclusive is LocalDateTime.of(2024, 1, 2, 0, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_PARTIAL_CALENDAR_DAY
    category: BOUNDARY
    description: Crossing a calendar date without completing 24 hours yields zero
      whole LocalDateTime days.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 1, 1, 23, 0).
    - endDateExclusive is LocalDateTime.of(2024, 1, 2, 22, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_NEGATIVE
    category: BOUNDARY
    description: A negative LocalDateTime interval shorter than one whole day truncates
      to zero days.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 1, 2, 0, 0).
    - endDateExclusive is LocalDateTime.of(2024, 1, 1, 1, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_EXACT_DAY
    category: BOUNDARY
    description: A reversed exact 24-hour LocalDateTime interval produces negative
      one day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 1, 2, 0, 0).
    - endDateExclusive is LocalDateTime.of(2024, 1, 1, 0, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_POSITIVE
    category: BOUNDARY
    description: A 23-hour Instant interval is shorter than one ChronoUnit.DAYS unit.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-01T23:00:00Z").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: BOUNDARY
    description: An exact 24-hour Instant interval produces one day.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-02T00:00:00Z").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_EXACT_DAY
    category: BOUNDARY
    description: A reversed exact 24-hour Instant interval produces negative one day.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-02T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-01T00:00:00Z").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAX_DAYS
    category: EDGE
    description: The largest representable Days amount is obtained from an exact Instant
      day interval.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.plus(2147483647, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2147483647.
    - The source exercises Math.toIntExact at Integer.MAX_VALUE without overflow.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MIN_DAYS
    category: EDGE
    description: The smallest representable Days amount is obtained from an exact
      reversed Instant day interval.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.minus(2147483648L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -2147483648.
    - The source exercises Math.toIntExact at Integer.MIN_VALUE without overflow.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EQUAL_INSTANT_ZERO
    category: BOUNDARY
    description: OffsetDateTime endpoints representing the same instant but different
      local dates have zero elapsed whole days.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00+00:00").
    - endDateExclusive is OffsetDateTime.parse("2024-01-01T02:00:00+02:00").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_OFFSET_NORMALIZED_SUBDAY
    category: BOUNDARY
    description: Different offsets reduce an apparent next-local-day endpoint to a
      22-hour interval.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00+00:00").
    - endDateExclusive is OffsetDateTime.parse("2024-01-02T00:00:00+02:00").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_OFFSET_NORMALIZED_OVERDAY
    category: BOUNDARY
    description: Different offsets expand an apparent one-day interval to 26 hours
      while retaining one whole day.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00+00:00").
    - endDateExclusive is OffsetDateTime.parse("2024-01-02T00:00:00-02:00").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST
    category: EDGE
    description: A same-local-time ZonedDateTime interval crosses the America/New_York
      spring daylight-saving transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-03-09T12:00:00-05:00[America/New_York]").
    - endDateExclusive is ZonedDateTime.parse("2024-03-10T12:00:00-04:00[America/New_York]").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    - The interval covers one local calendar day despite the offset change.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_DST
    category: EDGE
    description: A same-local-time ZonedDateTime interval crosses the America/New_York
      autumn daylight-saving transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-11-02T12:00:00-04:00[America/New_York]").
    - endDateExclusive is ZonedDateTime.parse("2024-11-03T12:00:00-05:00[America/New_York]").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    - The interval covers one local calendar day despite the offset change.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SAME_ZONE_MULTIDAY
    category: NORMAL
    description: A multi-day ZonedDateTime interval remains within one fixed-offset
      zone.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-05-01T10:00:00+09:00[Asia/Tokyo]").
    - endDateExclusive is ZonedDateTime.parse("2024-05-11T10:00:00+09:00[Asia/Tokyo]").
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: NORMAL
    description: A valid mixed ISO pair uses a LocalDate start and a LocalDateTime
      end with the same resulting calendar-day distance.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1).
    - endDateExclusive is LocalDateTime.of(2024, 1, 3, 18, 0).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TO_JAPANESE_DATE
    category: NORMAL
    description: A valid mixed chronology pair starts with ISO LocalDate and ends
      with an equivalent JapaneseDate calendar date.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 1).
    - endDateExclusive is JapaneseDate.from(LocalDate.of(2024, 1, 3)).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_TO_LOCAL_DATE
    category: NORMAL
    description: A valid mixed chronology pair starts with JapaneseDate and ends with
      an equivalent ISO LocalDate calendar date.
    preconditions:
    - startDateInclusive is JapaneseDate.from(LocalDate.of(2024, 1, 1)).
    - endDateExclusive is LocalDate.of(2024, 1, 3).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_ERA_TRANSITION
    category: EDGE
    description: A JapaneseDate interval crosses the Heisei-to-Reiwa era transition.
    preconditions:
    - startDateInclusive is JapaneseDate.from(LocalDate.of(2019, 4, 30)).
    - endDateExclusive is JapaneseDate.from(LocalDate.of(2019, 5, 1)).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: A Japanese chronology date-time pair has an exact one-day interval.
    preconditions:
    - startDateInclusive is JapaneseDate.from(LocalDate.of(2024, 1, 1)).atTime(LocalTime.NOON).
    - endDateExclusive is JapaneseDate.from(LocalDate.of(2024, 1, 2)).atTime(LocalTime.NOON).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_MULTIDAY
    category: NORMAL
    description: A MinguoDate pair spans several whole calendar days.
    preconditions:
    - startDateInclusive is MinguoDate.of(113, 1, 1).
    - endDateExclusive is MinguoDate.of(113, 1, 11).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_NEGATIVE
    category: NORMAL
    description: A ThaiBuddhistDate pair verifies a negative chronology-specific date-only
      interval.
    preconditions:
    - startDateInclusive is ThaiBuddhistDate.of(2567, 1, 10).
    - endDateExclusive is ThaiBuddhistDate.of(2567, 1, 3).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MULTIDAY
    category: NORMAL
    description: A HijrahDate pair uses valid dates in the active Hijrah chronology
      and spans whole days.
    preconditions:
    - startDateInclusive is HijrahDate.of(1445, 9, 1).
    - endDateExclusive is HijrahDate.of(1445, 9, 8).
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 7.
    targetCases: 1
    emptyOutputAllowed: false
