InputDomain:
  summary: Non-null Java Temporal pairs for which ChronoUnit.DAYS.between and the
    MR follow-up shift of 37 days are both executable, with an integer-representable
    whole-day result.
  globalConstraints:
  - startDateInclusive and endDateExclusive are non-null because generateFollowUp
    rejects either null value with Objects.requireNonNull.
  - Both source temporals support plus(37, ChronoUnit.DAYS), and both shifted temporals
    remain representable; otherwise the supplied follow-up transformation cannot be
    generated.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) and the same operation
    on the shifted pair complete normally.
  - The source and follow-up day differences are within Integer.MIN_VALUE through
    Integer.MAX_VALUE because between applies Math.toIntExact before constructing
    Days.
  - Use temporal values whose supported DAYS operation and 37-day shift preserve a
    comparable temporal domain; pairs that require unsupported temporal conversion
    are outside this MR-executable domain.
  - No invalid-input scenarios are included because the supplied metamorphic relation
    defines a non-null follow-up transformation rather than an invalid-input relation.
  diversity:
    temporalType:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - HijrahDate
    - MinguoDate
    - ThaiBuddhistDate
    signedGap:
    - Integer.MIN_VALUE
    - '-37'
    - '-2'
    - '-1'
    - '0'
    - '1'
    - '2'
    - '37'
    - Integer.MAX_VALUE
    temporalBoundary:
    - ordinary dates
    - near LocalDate.MIN
    - near LocalDate.MAX
    - near Instant.MIN
    - near Instant.MAX
    - near a daylight-saving transition
    - non-ISO date chronology
    timeGranularity:
    - date-only
    - same-day date-time
    - fractional day below 24 hours
    - exact 24-hour interval
    - offset-bearing
  scenarios:
  - id: LOCAL_DATE_ZERO_GAP
    category: NORMAL
    description: Two equal LocalDate values produce a zero-day interval.
    preconditions:
    - startDateInclusive and endDateExclusive are the same ordinary LocalDate.
    - Both dates plus 37 days are representable.
    expectedSourceBehavior:
    - between returns a non-null Days whose getAmount() is 0 because DAYS.between
      is zero and of(0) returns Days.ZERO.
    - The follow-up pair is produced by adding 37 days to both equal dates.
    - assertRelation accepts the source and follow-up outputs because both amounts
      are 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_FORWARD
    category: NORMAL
    description: An adjacent LocalDate pair exercises the one-day positive result.
    preconditions:
    - endDateExclusive is exactly one calendar day after startDateInclusive.
    - Both dates and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns a non-null Days with getAmount() equal to 1.
    - The follow-up output has the same amount, exercising the Days.ONE result path
      for both executions.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_REVERSE
    category: NORMAL
    description: An adjacent LocalDate pair in reverse order exercises the one-day
      negative result.
    preconditions:
    - endDateExclusive is exactly one calendar day before startDateInclusive.
    - Both dates and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns a non-null Days with getAmount() equal to -1.
    - The follow-up output also has getAmount() equal to -1, and the relation compares
      the signed integer amounts.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SMALL_POSITIVE_NONUNIT
    category: NORMAL
    description: A positive LocalDate gap of two days exercises a non-singleton positive
      Days value.
    preconditions:
    - endDateExclusive is exactly two days after startDateInclusive.
    - Both dates and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns getAmount() equal to 2 rather than the Days.ONE sentinel.
    - The shifted pair returns the same amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SMALL_NEGATIVE_NONUNIT
    category: NORMAL
    description: A negative LocalDate gap of two days exercises a non-singleton negative
      Days value.
    preconditions:
    - endDateExclusive is exactly two days before startDateInclusive.
    - Both dates and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns getAmount() equal to -2.
    - The shifted pair preserves the negative amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SHIFT_SIZED_GAP
    category: EDGE
    description: A 37-day LocalDate interval uses the same magnitude as the follow-up
      shift.
    preconditions:
    - endDateExclusive is exactly 37 days after startDateInclusive.
    - Adding 37 days to both endpoints remains representable.
    expectedSourceBehavior:
    - The source amount is 37.
    - The follow-up still has amount 37, demonstrating that the common shift is not
      added to the gap.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM_BOUNDARY
    category: BOUNDARY
    description: A LocalDate interval close to LocalDate.MIN remains shiftable without
      crossing the supported date boundary.
    preconditions:
    - startDateInclusive is LocalDate.MIN.plusDays(37).
    - endDateExclusive is startDateInclusive.plusDays(2).
    - The source and follow-up endpoints are representable, including the follow-up
      start at LocalDate.MIN.plusDays(74).
    expectedSourceBehavior:
    - between returns the exact two-day amount without relying on ordinary mid-range
      dates.
    - The 37-day follow-up remains executable and has the same amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM_BOUNDARY
    category: BOUNDARY
    description: A LocalDate interval close to LocalDate.MAX remains shiftable without
      crossing the supported date boundary.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(100).
    - endDateExclusive is LocalDate.MAX.minusDays(50).
    - Both shifted endpoints, ending at LocalDate.MAX.minusDays(63) and LocalDate.MAX.minusDays(13),
      are representable.
    expectedSourceBehavior:
    - between returns the exact 50-day amount.
    - The follow-up output has the same amount despite proximity to the maximum date.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAXIMUM_GAP
    category: BOUNDARY
    description: A LocalDate pair has the largest positive gap that Math.toIntExact
      can accept.
    preconditions:
    - startDateInclusive is LocalDate.MIN.plusDays(37).
    - endDateExclusive is startDateInclusive.plusDays(2147483647L).
    - Both endpoints and both 37-day-shifted endpoints are representable.
    expectedSourceBehavior:
    - between returns a non-null Days with getAmount() equal to Integer.MAX_VALUE.
    - The follow-up remains within the integer result range and has the identical
      amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MINIMUM_GAP
    category: BOUNDARY
    description: A LocalDate pair has the largest-magnitude negative gap that Math.toIntExact
      can accept.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(37).
    - endDateExclusive is startDateInclusive.minusDays(2147483648L).
    - Both endpoints and both 37-day-shifted endpoints are representable.
    expectedSourceBehavior:
    - between returns a non-null Days with getAmount() equal to Integer.MIN_VALUE.
    - The follow-up preserves this signed boundary amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SAME_DATE_DIFFERENT_TIMES
    category: EDGE
    description: LocalDateTime endpoints have different times but the same calendar
      date.
    preconditions:
    - Both endpoints are LocalDateTime values on the same LocalDate, with distinct
      time-of-day values.
    - Both values and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between exercises a Temporal implementation with time components while using
      ChronoUnit.DAYS.
    - The returned amount is the whole-day result for the supplied LocalDateTime pair,
      and the shifted pair has the same getAmount().
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_FRACTIONAL_DAY
    category: EDGE
    description: LocalDateTime endpoints are separated by a date boundary but by less
      than a full 24-hour elapsed interval.
    preconditions:
    - endDateExclusive is on the next calendar date, with the selected times making
      the interval less than 24 hours.
    - Both values and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns the whole-day result defined by ChronoUnit.DAYS rather than
      a fractional value.
    - The follow-up output has the same integer amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: LocalDateTime endpoints are separated by an exact one-day interval.
    preconditions:
    - endDateExclusive is exactly one day after startDateInclusive with matching time-of-day.
    - Both values and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns getAmount() equal to 1.
    - The follow-up also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_INTERVAL
    category: EDGE
    description: Instant endpoints differ by less than 24 hours.
    preconditions:
    - endDateExclusive is after startDateInclusive by a positive duration strictly
      less than 24 hours.
    - Both Instants and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns the whole-day result produced by ChronoUnit.DAYS for the Instant
      pair.
    - The common 37-day shift leaves the getAmount() unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY_INTERVAL
    category: NORMAL
    description: Instant endpoints differ by exactly 24 hours.
    preconditions:
    - endDateExclusive equals startDateInclusive.plus(1, ChronoUnit.DAYS).
    - Both Instants and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns getAmount() equal to 1.
    - The shifted Instant pair also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS
    category: EDGE
    description: OffsetDateTime endpoints use different UTC offsets while remaining
      valid DAYS temporals.
    preconditions:
    - Both endpoints are OffsetDateTime values with deliberately different offsets.
    - The pair has a nonzero whole-day result and all four source/follow-up values
      are representable.
    expectedSourceBehavior:
    - between uses ChronoUnit.DAYS on the offset-bearing temporals and returns a non-null
      Days.
    - Adding 37 DAYS to each endpoint preserves the returned getAmount().
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_FORWARD
    category: EDGE
    description: ZonedDateTime endpoints span a daylight-saving forward transition.
    preconditions:
    - Both endpoints use the same zone with a forward daylight-saving transition between
      them.
    - The selected endpoints and their 37-day shifts are valid ZonedDateTime values.
    expectedSourceBehavior:
    - between returns the whole-day result produced by ChronoUnit.DAYS for the zoned
      pair.
    - The MR checks that shifting both zoned endpoints by 37 DAYS leaves getAmount()
      unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_BACKWARD
    category: EDGE
    description: ZonedDateTime endpoints span a daylight-saving backward transition.
    preconditions:
    - Both endpoints use the same zone with a backward daylight-saving transition
      between them.
    - The selected endpoints and their 37-day shifts are valid ZonedDateTime values.
    expectedSourceBehavior:
    - between returns a non-null Days for the backward-transition pair.
    - The shifted pair produces the same signed integer amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_NON_ISO
    category: EDGE
    description: JapaneseDate endpoints exercise a non-ISO chronology that supports
      DAYS and the follow-up shift.
    preconditions:
    - Both endpoints are JapaneseDate values in the same chronology.
    - The pair has a positive, nonzero whole-day gap and all shifted values are representable.
    expectedSourceBehavior:
    - between returns a non-null Days based on ChronoUnit.DAYS.
    - The 37-day follow-up has an equal getAmount().
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_NON_ISO
    category: EDGE
    description: HijrahDate endpoints exercise a variable-month non-ISO chronology.
    preconditions:
    - Both endpoints are HijrahDate values in the same chronology and support the
      required DAYS operations.
    - Both endpoints and their 37-day shifts are representable.
    expectedSourceBehavior:
    - between returns the chronology's whole-day difference as a Days amount.
    - The common 37-day shift preserves that amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_NON_ISO
    category: EDGE
    description: MinguoDate endpoints exercise another non-ISO chronology through
      the same target signature.
    preconditions:
    - Both endpoints are MinguoDate values in the same chronology.
    - The source and shifted pairs support ChronoUnit.DAYS and produce an integer-representable
      result.
    expectedSourceBehavior:
    - between returns a non-null Days value obtained from ChronoUnit.DAYS.between.
    - The follow-up amount equals the source amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_NON_ISO
    category: EDGE
    description: ThaiBuddhistDate endpoints exercise a non-ISO chronology with a negative
      gap.
    preconditions:
    - Both endpoints are ThaiBuddhistDate values in the same chronology.
    - endDateExclusive is before startDateInclusive, and both source and shifted pairs
      are representable.
    expectedSourceBehavior:
    - between returns a negative getAmount().
    - The 37-day common shift preserves the negative amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_TYPE_DATE_TIME_PAIR
    category: EDGE
    description: A supported cross-type pair is tested when ChronoUnit.DAYS.between
      accepts both temporals and the MR can shift both.
    preconditions:
    - startDateInclusive and endDateExclusive are different supported Temporal implementations,
      such as a date-only value and a date-time value.
    - DAYS.between succeeds for the source pair and for the 37-day-shifted pair.
    - Both shifted temporals remain representable and the result fits in int.
    expectedSourceBehavior:
    - between returns the exact Days amount supplied by ChronoUnit.DAYS for the accepted
      cross-type pair.
    - assertRelation observes equal getAmount() values for source and follow-up.
    targetCases: 1
    emptyOutputAllowed: false
