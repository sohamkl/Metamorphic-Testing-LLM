InputDomain:
  summary: IEEE-754 double longitude inputs, including in-range values, wrap boundaries,
    multiple full revolutions, large finite magnitudes, signed zero, and non-finite
    values; each follow-up is generated as sourceInput + 360.0.
  globalConstraints:
  - The source input is exactly one Java double value; no constructor, factory, or
    pre-normalization is required.
  - The follow-up input is exactly the result of Java double addition sourceInput
    + 360.0.
  - For finite source inputs, the target implementation returns a value in the inclusive
    interval [-180.0, 180.0], except that non-finite arithmetic can produce NaN.
  - The metamorphic assertion treats outputs numerically equal within 1e-9 degrees
    as equal and accepts any pair of outputs within 1e-9 degrees of either antimeridian
    representation.
  - NaN and infinities are retained as reachable double inputs; they are not classified
    as INVALID because the supplied metamorphic relation does not request invalid-input
    rejection.
  diversity:
    inputClass:
    - finite values in [-180.0, 180.0]
    - finite values just outside either inclusive bound
    - positive values greater than 180.0
    - negative values less than -180.0
    - positive exact multiples or near-multiples of 360.0
    - negative exact multiples or near-multiples of 360.0
    - signed zero and subnormal finite values
    - very large finite values near double limits
    - positive infinity
    - negative infinity
    - NaN
    sourceBranch:
    - inclusive in-range early return
    - out-of-range remainder with off < 0
    - out-of-range remainder with off > 0
    - out-of-range exact remainder zero with positive source
    - out-of-range exact remainder zero with non-positive source
    - non-finite remainder arithmetic
    wrapCount:
    - zero revolutions
    - one revolution
    - more than one revolution
    - large representable magnitude
    sign:
    - negative
    - negative zero
    - positive zero
    - positive
    - NaN
    boundaryDistance:
    - exactly 0 degrees from an in-range boundary
    - strictly less than 1e-9 degrees from an in-range boundary
    - strictly greater than 1e-9 degrees from an in-range boundary
    - exactly at an antimeridian result
    - not at an antimeridian result
  scenarios:
  - id: IN_RANGE_NEGATIVE_INTERIOR
    category: NORMAL
    description: A negative longitude strictly inside the inclusive normal interval.
    preconditions:
    - sourceInput = -90.0
    - -180.0 < sourceInput < 0.0
    expectedSourceBehavior:
    - The first condition is true and normLonDEG returns sourceInput unchanged.
    - The follow-up is 270.0 and normalizes to -90.0, so the relation compares equal
      outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_ZERO
    category: NORMAL
    description: Zero longitude follows the in-range early-return path.
    preconditions:
    - sourceInput = 0.0
    expectedSourceBehavior:
    - normLonDEG returns exactly 0.0 without remainder arithmetic.
    - The follow-up 360.0 normalizes to 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_POSITIVE_INTERIOR
    category: NORMAL
    description: A positive longitude strictly inside the inclusive normal interval.
    preconditions:
    - sourceInput = 90.0
    - 0.0 < sourceInput < 180.0
    expectedSourceBehavior:
    - The first condition is true and normLonDEG returns sourceInput unchanged.
    - The follow-up 450.0 normalizes to 90.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_NEGATIVE_BOUNDARY
    category: BOUNDARY
    description: The exact negative endpoint of the documented inclusive range.
    preconditions:
    - sourceInput = -180.0
    expectedSourceBehavior:
    - The inclusive early-return condition is true and the source output is -180.0.
    - The follow-up is 180.0 and returns 180.0; the MR accepts both as antimeridian
      outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_POSITIVE_BOUNDARY
    category: BOUNDARY
    description: The exact positive endpoint of the documented inclusive range.
    preconditions:
    - sourceInput = 180.0
    expectedSourceBehavior:
    - The inclusive early-return condition is true and the source output is 180.0.
    - The follow-up is 540.0 and normalizes to 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_NEGATIVE_ZERO
    category: EDGE
    description: Negative zero is numerically in range and exercises preservation
      by the early return.
    preconditions:
    - sourceInput = -0.0
    - Double.doubleToRawLongBits(sourceInput) = 0x8000000000000000
    expectedSourceBehavior:
    - normLonDEG returns the source signed zero rather than entering modulo arithmetic.
    - The follow-up is 360.0 and normalizes to positive zero; the MR difference remains
      zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: IN_RANGE_MINIMUM_SUBNORMAL
    category: EDGE
    description: The smallest positive finite subnormal longitude is preserved by
      the in-range path.
    preconditions:
    - sourceInput = Double.MIN_VALUE
    - 0.0 < sourceInput < 1e-9
    expectedSourceBehavior:
    - normLonDEG returns sourceInput unchanged.
    - The follow-up rounds to a value near 360.0 and normalizes to 0.0; the output
      difference is below the supplied tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_NEGATIVE_BOUNDARY
    category: BOUNDARY
    description: A finite value immediately inside the negative endpoint.
    preconditions:
    - sourceInput = Math.nextUp(-180.0)
    - -180.0 < sourceInput < -179.999999999999
    expectedSourceBehavior:
    - The inclusive early-return path returns the exact source value.
    - The follow-up is inside the positive normal interval and returns the shifted
      value, which is numerically equivalent after the 360-degree shift.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_POSITIVE_BOUNDARY
    category: BOUNDARY
    description: A finite value immediately inside the positive endpoint.
    preconditions:
    - sourceInput = Math.nextDown(180.0)
    - 179.999999999999 < sourceInput < 180.0
    expectedSourceBehavior:
    - The inclusive early-return path returns the exact source value.
    - The follow-up is outside the range and folds back to the same longitude.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_NEGATIVE_BOUNDARY
    category: BOUNDARY
    description: A finite value immediately below -180 exercises the negative-remainder
      branch.
    preconditions:
    - sourceInput = Math.nextDown(-180.0)
    - sourceInput < -180.0
    expectedSourceBehavior:
    - The early-return condition is false.
    - The remainder off is negative, so the result is 180.0 + off, slightly greater
      than -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_POSITIVE_BOUNDARY
    category: BOUNDARY
    description: A finite value immediately above 180 exercises the positive-remainder
      branch.
    preconditions:
    - sourceInput = Math.nextUp(180.0)
    - sourceInput > 180.0
    expectedSourceBehavior:
    - The early-return condition is false.
    - The remainder off is positive, so the result is -180.0 + off, slightly less
      than 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_REMAINDER_BRANCH
    category: NORMAL
    description: A positive out-of-range longitude whose remainder is strictly positive.
    preconditions:
    - sourceInput = 181.0
    - sourceInput > 180.0
    - (sourceInput + 180.0) % 360.0 > 0.0
    expectedSourceBehavior:
    - The method takes the final else branch and returns -179.0.
    - The follow-up 541.0 normalizes to -179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_REMAINDER_BRANCH
    category: NORMAL
    description: A negative out-of-range longitude whose remainder is strictly negative.
    preconditions:
    - sourceInput = -181.0
    - sourceInput < -180.0
    - (sourceInput + 180.0) % 360.0 < 0.0
    expectedSourceBehavior:
    - The method takes the off < 0 branch and returns 179.0.
    - The follow-up 179.0 is already in range and returns 179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_REVOLUTION
    category: BOUNDARY
    description: One positive full revolution produces an exact zero remainder with
      a positive source.
    preconditions:
    - sourceInput = 360.0
    - (sourceInput + 180.0) % 360.0 = 180.0
    expectedSourceBehavior:
    - The final else branch returns 0.0.
    - The follow-up 720.0 also returns 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_REVOLUTION
    category: BOUNDARY
    description: One negative full revolution produces a negative remainder.
    preconditions:
    - sourceInput = -360.0
    - (sourceInput + 180.0) % 360.0 = -180.0
    expectedSourceBehavior:
    - The off < 0 branch returns 0.0.
    - The follow-up 0.0 takes the early return and returns 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ANTIMERIDIAN_MULTIPLE
    category: BOUNDARY
    description: A positive value producing off == 0 exercises the explicit positive-antimeridian
      branch.
    preconditions:
    - sourceInput = 540.0
    - (sourceInput + 180.0) % 360.0 = 0.0
    - sourceInput > 0.0
    expectedSourceBehavior:
    - The method returns 180.0 from the off == 0 and sourceInput > 0 branch.
    - The follow-up 900.0 also returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ANTIMERIDIAN_MULTIPLE
    category: BOUNDARY
    description: A negative value producing an exact zero remainder exercises the
      fallback -180 antimeridian result.
    preconditions:
    - sourceInput = -540.0
    - (sourceInput + 180.0) % 360.0 = -0.0
    - sourceInput <= 0.0
    expectedSourceBehavior:
    - The off < 0 test is false and the positive-source test is false, so the method
      returns -180.0.
    - The follow-up -180.0 returns -180.0 through the early-return path; the MR accepts
      both antimeridian forms.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_NEAR_ANTIMERIDIAN
    category: EDGE
    description: A positive longitude just below an exact antimeridian multiple.
    preconditions:
    - sourceInput = 539.999999999
    - sourceInput > 180.0
    - 0.0 < (sourceInput + 180.0) % 360.0 < 1e-9
    expectedSourceBehavior:
    - The final else branch returns a value within 1e-9 degrees below 180.0.
    - The source output is recognized as an antimeridian representation by the MR
      tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_NEAR_ANTIMERIDIAN
    category: EDGE
    description: A negative longitude just above an exact antimeridian multiple.
    preconditions:
    - sourceInput = -539.999999999
    - sourceInput < -180.0
    - -1e-9 < (sourceInput + 180.0) % 360.0 < 0.0
    expectedSourceBehavior:
    - The off < 0 branch returns a value within 1e-9 degrees above -180.0.
    - The source output is recognized as an antimeridian representation by the MR
      tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_TWO_REVOLUTIONS
    category: NORMAL
    description: A positive value spanning two full revolutions reaches the ordinary
      remainder path.
    preconditions:
    - sourceInput = 720.0
    - sourceInput > 180.0
    expectedSourceBehavior:
    - The method returns 0.0 after applying the remainder calculation.
    - The follow-up 1080.0 also returns 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_TWO_REVOLUTIONS
    category: NORMAL
    description: A negative value spanning two full revolutions reaches the negative-remainder
      path.
    preconditions:
    - sourceInput = -720.0
    - sourceInput < -180.0
    expectedSourceBehavior:
    - The method returns 0.0 after the negative remainder is offset by 180.0.
    - The follow-up -360.0 also normalizes to 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_WRAP
    category: NORMAL
    description: A positive fractional longitude beyond one revolution.
    preconditions:
    - sourceInput = 359.5
    - sourceInput > 180.0
    - (sourceInput + 180.0) % 360.0 > 0.0
    expectedSourceBehavior:
    - The final else branch returns -0.5.
    - The follow-up 719.5 also returns -0.5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_WRAP
    category: NORMAL
    description: A negative fractional longitude beyond one revolution.
    preconditions:
    - sourceInput = -359.5
    - sourceInput < -180.0
    - (sourceInput + 180.0) % 360.0 < 0.0
    expectedSourceBehavior:
    - The off < 0 branch returns 0.5.
    - The follow-up 0.5 returns 0.5 through the early-return path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_LARGE_FINITE
    category: EDGE
    description: A large but ordinary finite positive longitude tests repeated modulo
      reduction.
    preconditions:
    - sourceInput = 1.0e12
    - Double.isFinite(sourceInput)
    - sourceInput > 180.0
    expectedSourceBehavior:
    - The early-return path is skipped and the result is computed from Java remainder
      arithmetic.
    - The follow-up is also finite and the normalized outputs should satisfy the supplied
      1e-9 relation tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_LARGE_FINITE
    category: EDGE
    description: A large but ordinary finite negative longitude tests the negative
      remainder path at magnitude.
    preconditions:
    - sourceInput = -1.0e12
    - Double.isFinite(sourceInput)
    - sourceInput < -180.0
    expectedSourceBehavior:
    - The early-return path is skipped and the negative remainder branch is eligible.
    - The follow-up is finite and the normalized outputs should satisfy the supplied
      1e-9 relation tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_FINITE
    category: EDGE
    description: The largest finite positive double tests behavior when adding 180
      or 360 is rounded back to the same representable magnitude.
    preconditions:
    - sourceInput = Double.MAX_VALUE
    - Double.isFinite(sourceInput)
    - sourceInput > 180.0
    - sourceInput + 360.0 = sourceInput
    expectedSourceBehavior:
    - The method skips the in-range return and applies the remainder expression to
      a finite value.
    - The generated follow-up is the same representable double, so both invocations
      receive the same source value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIN_FINITE
    category: EDGE
    description: The most negative finite double tests the corresponding large-negative
      path.
    preconditions:
    - sourceInput = -Double.MAX_VALUE
    - Double.isFinite(sourceInput)
    - sourceInput < -180.0
    - sourceInput + 360.0 = sourceInput
    expectedSourceBehavior:
    - The method skips the in-range return and applies Java remainder arithmetic to
      the finite negative value.
    - The generated follow-up is the same representable double, so the two source
      evaluations have identical inputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INFINITY
    category: EDGE
    description: Positive infinity reaches the remainder expression with non-finite
      intermediate arithmetic.
    preconditions:
    - sourceInput = Double.POSITIVE_INFINITY
    expectedSourceBehavior:
    - The range comparisons are false.
    - The remainder is NaN, and the final else path returns NaN.
    - The follow-up remains positive infinity and also returns NaN; the supplied assertion
      does not reject a NaN difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INFINITY
    category: EDGE
    description: Negative infinity reaches the same non-finite remainder path.
    preconditions:
    - sourceInput = Double.NEGATIVE_INFINITY
    expectedSourceBehavior:
    - The range comparisons are false.
    - The remainder is NaN, and the final else path returns NaN.
    - The follow-up remains negative infinity and also returns NaN; the supplied assertion
      does not reject a NaN difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_INPUT
    category: EDGE
    description: NaN exercises the false outcomes of every ordered comparison and
      non-finite remainder propagation.
    preconditions:
    - Double.isNaN(sourceInput)
    expectedSourceBehavior:
    - All range and remainder comparisons are false because their operands are NaN.
    - normLonDEG returns NaN.
    - The follow-up is NaN and also returns NaN; the supplied assertion's difference
      comparison is false rather than throwing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_NEAR_ZERO
    category: EDGE
    description: A small negative finite value tests the in-range early return while
      distinguishing it from negative zero.
    preconditions:
    - sourceInput = -Double.MIN_VALUE
    - -1e-9 < sourceInput < 0.0
    expectedSourceBehavior:
    - The method returns the exact negative subnormal source value.
    - The follow-up rounds to a value near 360.0 and normalizes to 0.0; the difference
      is below 1e-9 degrees.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_INTEGER_OUTSIDE_RANGE
    category: NORMAL
    description: A non-integer positive longitude exercises ordinary modulo behavior
      without an exact boundary.
    preconditions:
    - sourceInput = 12345.6789
    - sourceInput > 180.0
    - (sourceInput + 180.0) % 360.0 != 0.0
    expectedSourceBehavior:
    - The output is the value obtained from the final else branch and lies in [-180.0,
      180.0].
    - The follow-up output should match within 1e-9 degrees because the follow-up
      adds one full revolution.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_NON_INTEGER_OUTSIDE_RANGE
    category: NORMAL
    description: A non-integer negative longitude exercises ordinary negative remainder
      behavior without an exact boundary.
    preconditions:
    - sourceInput = -12345.6789
    - sourceInput < -180.0
    - (sourceInput + 180.0) % 360.0 != 0.0
    expectedSourceBehavior:
    - The output is the value obtained from the off < 0 branch and lies in [-180.0,
      180.0].
    - The follow-up output should match within 1e-9 degrees because the follow-up
      adds one full revolution.
    targetCases: 1
    emptyOutputAllowed: false
