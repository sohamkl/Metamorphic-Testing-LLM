InputDomain:
  summary: All finite Java double longitudes, spanning the unchanged interval, every
    normalization branch, wrap seams, antimeridian sentinels, signed zero, tiny magnitudes,
    and large-magnitude rounding regimes.
  globalConstraints:
  - 'The source input must be a finite Java double: !Double.isNaN(lon_deg) && !Double.isInfinite(lon_deg).
    NaN and infinities are excluded because normLonDEG produces NaN for those inputs
    and assertRelation would pass vacuously when its computed difference is NaN.'
  - The follow-up must be computed exactly as Java double addition lon_deg + 360.0,
    without decimal or arbitrary-precision substitution.
  - No source input may be discarded because adding 360.0 is rounded, quantized, or
    absorbed; those reachable finite-double behaviors are part of the test domain.
  - For every included source input, the source result must be finite and satisfy
    -180.0 <= result && result <= 180.0.
  diversity:
    sourceRegion:
    - '[-180,180] unchanged branch'
    - below -180
    - above 180
    normalizationBranch:
    - direct return
    - off < 0
    - off == 0 && lon_deg > 0
    - final else
    boundaryOrSentinel:
    - '-180'
    - '+180'
    - adjacent inside
    - adjacent outside
    - positive wrap seam
    - negative wrap seam
    numericScale:
    - subnormal
    - ordinary
    - multi-revolution
    - large exact-shift
    - quantized-shift
    - absorbed-shift
    - maximum finite
    signBehavior:
    - negative
    - positive
    - '+0.0'
    - '-0.0'
  scenarios:
  - id: EXACT_LOWER_ANTIMERIDIAN
    category: BOUNDARY
    description: The source is exactly -180 degrees and the follow-up is exactly +180
      degrees.
    preconditions:
    - lon_deg == -180.0
    expectedSourceBehavior:
    - The inclusive common-case branch returns exactly -180.0 unchanged.
    - The relation must use its antimeridian equivalence because the follow-up output
      is +180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_UPPER_ANTIMERIDIAN
    category: BOUNDARY
    description: The source is exactly +180 degrees.
    preconditions:
    - lon_deg == 180.0
    expectedSourceBehavior:
    - The inclusive common-case branch returns exactly 180.0 unchanged.
    - Adding 360.0 reaches 540.0, whose positive exact-wrap branch also returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIGNED_ZERO_INPUTS
    category: EDGE
    description: Both Java signed-zero encodings exercise the unchanged branch.
    preconditions:
    - Double.doubleToRawLongBits(lon_deg) is either the raw bits of +0.0 or the raw
      bits of -0.0
    - Select one case for each signed-zero encoding.
    expectedSourceBehavior:
    - The method returns lon_deg directly, preserving the source zero's raw sign bit.
    - The normalized numeric value is zero.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOWER_BOUNDARY_ADJACENT_INSIDE
    category: BOUNDARY
    description: The closest representable double above -180 remains in the unchanged
      interval.
    preconditions:
    - lon_deg == Math.nextUp(-180.0)
    expectedSourceBehavior:
    - The common-case branch returns the exact input unchanged.
    - The result is greater than -180.0 and less than 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_BOUNDARY_ADJACENT_INSIDE
    category: BOUNDARY
    description: The closest representable double below +180 remains in the unchanged
      interval.
    preconditions:
    - lon_deg == Math.nextDown(180.0)
    expectedSourceBehavior:
    - The common-case branch returns the exact input unchanged.
    - The result is less than 180.0 and greater than 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_BOUNDARY_ADJACENT_OUTSIDE
    category: BOUNDARY
    description: The closest representable double below -180 enters the negative-remainder
      branch.
    preconditions:
    - lon_deg == Math.nextDown(-180.0)
    expectedSourceBehavior:
    - The common-case condition is false and (lon_deg + 180.0) % 360.0 is negative.
    - The result is 180.0 plus that negative remainder and lies just below +180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_BOUNDARY_ADJACENT_OUTSIDE
    category: BOUNDARY
    description: The closest representable double above +180 enters the final remainder
      branch.
    preconditions:
    - lon_deg == Math.nextUp(180.0)
    expectedSourceBehavior:
    - The common-case condition is false and the positive nonzero remainder reaches
      the final else branch.
    - The result lies just above -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_NEGATIVE_INTERIOR
    category: NORMAL
    description: Ordinary negative longitudes strictly inside the unchanged interval.
    preconditions:
    - -180.0 < lon_deg && lon_deg < 0.0
    - Select the distinct representatives -179.0 and -1.0.
    expectedSourceBehavior:
    - The method returns each source input exactly unchanged.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ORDINARY_POSITIVE_INTERIOR
    category: NORMAL
    description: Ordinary positive longitudes strictly inside the unchanged interval.
    preconditions:
    - 0.0 < lon_deg && lon_deg < 180.0
    - Select the distinct representatives 1.0 and 179.0.
    expectedSourceBehavior:
    - The method returns each source input exactly unchanged.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MINIMUM_NONZERO_MAGNITUDES
    category: EDGE
    description: The smallest positive and negative nonzero doubles are preserved
      by the common-case branch.
    preconditions:
    - Math.abs(lon_deg) == Double.MIN_VALUE
    - Select both signs.
    expectedSourceBehavior:
    - The source output is exactly the nonzero subnormal source input.
    - The source output is not numerically equal to zero.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ANTIMERIDIAN_TOLERANCE_INTERIOR
    category: EDGE
    description: Interior values whose source outputs are within the relation's 1e-9
      antimeridian tolerance.
    preconditions:
    - lon_deg is either -180.0 + 5e-10 or 180.0 - 5e-10
    expectedSourceBehavior:
    - The source is returned unchanged.
    - Math.abs(Math.abs(sourceOutput) - 180.0) <= 1e-9.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FIRST_POSITIVE_OUTER_INTERVAL
    category: NORMAL
    description: Positive values between 180 and 540 normalize through a positive
      nonzero remainder.
    preconditions:
    - 180.0 < lon_deg && lon_deg < 540.0
    - Select the representatives 181.0 and 359.0.
    expectedSourceBehavior:
    - The final else branch returns -180.0 + ((lon_deg + 180.0) % 360.0).
    - The results are respectively -179.0 and -1.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_FULL_REVOLUTION
    category: NORMAL
    description: A source of one positive full revolution normalizes to the prime
      meridian.
    preconditions:
    - lon_deg == 360.0
    expectedSourceBehavior:
    - The positive nonzero remainder branch returns exactly 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_SEAM_BELOW_540
    category: BOUNDARY
    description: The representable value immediately below the positive 540-degree
      seam approaches +180 from below.
    preconditions:
    - lon_deg == Math.nextDown(540.0)
    expectedSourceBehavior:
    - The final else branch is used with a remainder just below 360.0.
    - The result is positive and just below 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_540_SEAM
    category: BOUNDARY
    description: The exact positive wrap seam makes the remainder zero.
    preconditions:
    - lon_deg == 540.0
    expectedSourceBehavior:
    - off == 0.0 and lon_deg > 0.0, so the dedicated branch returns exactly 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_SEAM_ABOVE_540
    category: BOUNDARY
    description: The representable value immediately above the positive 540-degree
      seam wraps to just above -180.
    preconditions:
    - lon_deg == Math.nextUp(540.0)
    expectedSourceBehavior:
    - The final else branch is used with a small positive remainder.
    - The result is negative and just above -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIRST_NEGATIVE_OUTER_INTERVAL
    category: NORMAL
    description: Negative values between -540 and -180 normalize through the negative-remainder
      branch.
    preconditions:
    - -540.0 < lon_deg && lon_deg < -180.0
    - Select the representatives -181.0 and -359.0.
    expectedSourceBehavior:
    - The off < 0 branch returns 180.0 + ((lon_deg + 180.0) % 360.0).
    - The results are respectively 179.0 and 1.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_FULL_REVOLUTION
    category: NORMAL
    description: A source of one negative full revolution normalizes to the prime
      meridian.
    preconditions:
    - lon_deg == -360.0
    expectedSourceBehavior:
    - The negative-remainder branch returns exactly 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_SEAM_ABOVE_MINUS_540
    category: BOUNDARY
    description: The representable value immediately above -540 approaches -180 from
      above.
    preconditions:
    - lon_deg == Math.nextUp(-540.0)
    expectedSourceBehavior:
    - The negative-remainder branch is used.
    - The result is negative and just above -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_MINUS_540_SEAM
    category: BOUNDARY
    description: The exact negative wrap seam produces a zero remainder but cannot
      enter the positive-seam branch.
    preconditions:
    - lon_deg == -540.0
    expectedSourceBehavior:
    - The remainder compares equal to zero and lon_deg > 0.0 is false.
    - The final else branch returns exactly -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_SEAM_BELOW_MINUS_540
    category: BOUNDARY
    description: The representable value immediately below -540 wraps to just below
      +180.
    preconditions:
    - lon_deg == Math.nextDown(-540.0)
    expectedSourceBehavior:
    - The negative-remainder branch is used with a small negative remainder.
    - The result is positive and just below 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATER_POSITIVE_EXACT_SEAM
    category: EDGE
    description: A later positive antimeridian representation confirms the positive
      zero-remainder sentinel across multiple revolutions.
    preconditions:
    - lon_deg == 900.0
    expectedSourceBehavior:
    - The positive exact-wrap branch returns exactly 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATER_NEGATIVE_EXACT_SEAM
    category: EDGE
    description: A later negative antimeridian representation confirms that negative
      exact seams select -180.
    preconditions:
    - lon_deg == -900.0
    expectedSourceBehavior:
    - The zero remainder does not satisfy lon_deg > 0.0, so the final else branch
      returns exactly -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_MULTI_REVOLUTION
    category: NORMAL
    description: Positive multi-revolution sources retain non-integer fractional longitude
      through remainder normalization.
    preconditions:
    - lon_deg is either 720.25 or 1000000.125
    expectedSourceBehavior:
    - The result is computed by the positive nonzero-remainder final branch.
    - The result is finite and within the inclusive normalized interval.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_MULTI_REVOLUTION
    category: NORMAL
    description: Negative multi-revolution sources retain non-integer fractional longitude
      through the negative remainder path.
    preconditions:
    - lon_deg is either -720.25 or -1000000.125
    expectedSourceBehavior:
    - The result is computed by the off < 0 branch.
    - The result is finite and within the inclusive normalized interval.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_SEAM_WITHIN_RELATION_TOLERANCE
    category: EDGE
    description: Values on both sides of 540 within 5e-10 normalize to opposite numeric
      signs near the same antimeridian.
    preconditions:
    - lon_deg is either 540.0 - 5e-10 or 540.0 + 5e-10
    expectedSourceBehavior:
    - The lower source normalizes near +180.0 and the upper source normalizes near
      -180.0.
    - Each result has Math.abs(Math.abs(sourceOutput) - 180.0) <= 1e-9.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_SEAM_WITHIN_RELATION_TOLERANCE
    category: EDGE
    description: Values on both sides of -540 within 5e-10 exercise the negative seam
      near both antimeridian encodings.
    preconditions:
    - lon_deg is either -540.0 - 5e-10 or -540.0 + 5e-10
    expectedSourceBehavior:
    - The lower source normalizes near +180.0 and the upper source normalizes near
      -180.0.
    - Each result has Math.abs(Math.abs(sourceOutput) - 180.0) <= 1e-9.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_POSITIVE_EXACT_SHIFT
    category: EDGE
    description: A large positive integral double still represents an added 360-degree
      shift exactly.
    preconditions:
    - lon_deg == Math.scalb(1.0, 52)
    - lon_deg + 360.0 - lon_deg == 360.0
    expectedSourceBehavior:
    - The source bypasses the common-case branch and normalizes using a nonnegative
      remainder.
    - The result is finite and within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_EXACT_SHIFT
    category: EDGE
    description: A large negative integral double retains an exact 360-degree follow-up
      increment.
    preconditions:
    - lon_deg == -Math.scalb(1.0, 52)
    - lon_deg + 360.0 - lon_deg == 360.0
    expectedSourceBehavior:
    - The source bypasses the common-case branch and normalizes according to the Java
      remainder sign.
    - The result is finite and within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_QUANTIZED_SHIFT_ULP_16
    category: EDGE
    description: At a positive magnitude with ULP 16, Java addition cannot represent
      an exact 360-degree displacement.
    preconditions:
    - lon_deg == Math.scalb(1.0, 56)
    - Math.ulp(lon_deg) == 16.0
    - lon_deg + 360.0 - lon_deg != 360.0
    expectedSourceBehavior:
    - The source normalizes through remainder logic to a finite value in [-180.0,
      180.0].
    - The case preserves the rounded follow-up rather than assuming mathematical real-number
      addition.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_QUANTIZED_SHIFT_ULP_16
    category: EDGE
    description: The negative ULP-16 regime combines quantized follow-up addition
      with negative remainder handling.
    preconditions:
    - lon_deg == -Math.scalb(1.0, 56)
    - Math.ulp(lon_deg) == 16.0
    - lon_deg + 360.0 - lon_deg != 360.0
    expectedSourceBehavior:
    - The source normalizes through the negative or zero remainder path to a finite
      value in [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_QUANTIZED_SHIFT_ULP_512
    category: EDGE
    description: A positive source with ULP 512 makes the requested revolution round
      to a different representable increment.
    preconditions:
    - lon_deg == Math.scalb(1.0, 61)
    - Math.ulp(lon_deg) == 512.0
    - lon_deg + 360.0 != lon_deg
    - lon_deg + 360.0 - lon_deg != 360.0
    expectedSourceBehavior:
    - The source result is determined by Java double remainder and remains in [-180.0,
      180.0].
    - This case can expose disagreement between real-number periodicity and the actual
      rounded follow-up.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_QUANTIZED_SHIFT_ULP_512
    category: EDGE
    description: A negative source with ULP 512 exercises both rounded follow-up displacement
      and negative-sign remainder semantics.
    preconditions:
    - lon_deg == -Math.scalb(1.0, 61)
    - Math.ulp(lon_deg) == 512.0
    - lon_deg + 360.0 != lon_deg
    - lon_deg + 360.0 - lon_deg != 360.0
    expectedSourceBehavior:
    - The source result is finite and lies in [-180.0, 180.0].
    - No assumption is made that the represented follow-up differs by exactly 360.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ABSORBED_FOLLOW_UP
    category: EDGE
    description: At sufficiently large positive magnitude, adding 360.0 is absorbed
      and produces the identical double.
    preconditions:
    - lon_deg == Math.scalb(1.0, 62)
    - Math.ulp(lon_deg) == 1024.0
    - lon_deg + 360.0 == lon_deg
    expectedSourceBehavior:
    - The source normalizes through remainder logic to a finite value in [-180.0,
      180.0].
    - Source and follow-up invocations receive identical argument bits.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ABSORBED_FOLLOW_UP
    category: EDGE
    description: At sufficiently large negative magnitude, the positive 360-degree
      addition is also absorbed.
    preconditions:
    - lon_deg == -Math.scalb(1.0, 62)
    - Math.ulp(lon_deg) == 1024.0
    - lon_deg + 360.0 == lon_deg
    expectedSourceBehavior:
    - The source normalizes through Java remainder logic to a finite value in [-180.0,
      180.0].
    - Source and follow-up invocations receive identical argument bits.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_FINITE_POSITIVE
    category: EDGE
    description: The largest finite positive double tests the extreme remainder and
      absorbed-addition regime.
    preconditions:
    - lon_deg == Double.MAX_VALUE
    expectedSourceBehavior:
    - The method does not reject or overflow the source; the finite remainder calculation
      yields a finite normalized result.
    - The result lies in [-180.0, 180.0], and lon_deg + 360.0 == lon_deg.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_FINITE_NEGATIVE
    category: EDGE
    description: The largest finite negative magnitude tests extreme negative remainder
      behavior.
    preconditions:
    - lon_deg == -Double.MAX_VALUE
    expectedSourceBehavior:
    - The finite source produces a finite normalized result through the negative-sign
      remainder path.
    - The result lies in [-180.0, 180.0], and lon_deg + 360.0 == lon_deg.
    targetCases: 1
    emptyOutputAllowed: false
