InputDomain:
  summary: Deterministic non-null detached jsoup DOM roots paired with deep clones,
    traversed by fresh NodeFilter instances whose head and tail callbacks return controlled
    FilterResult actions to exercise depth-first descent, tail processing, sibling
    movement, removal, pruning, and stopping.
  globalConstraints:
  - The original root is non-null and detached, so its parentNode is null and traversal
    is limited to that root and its descendants.
  - The cloned root is a deep clone of the original with the same node topology, node
    order, and initial outerHtml.
  - Each execution receives a fresh NodeFilter instance implementing the same deterministic
    policy; the policy is based only on observable traversal position such as callback
    kind, depth, node ordinal, or configured node role.
  - Every configured non-CONTINUE action is reached at least once in its scenario.
  - The original and clone are each executed once, and callback sequence, returned
    actions, terminal FilterResult, and final outerHtml are recorded for comparison.
  - No invalid-input case is included because the metamorphic relation requires a
    non-null detached root and does not request validation behavior for null or otherwise
    invalid arguments.
  diversity:
    rootTopology:
    - single leaf
    - root with one child
    - root with multiple leaf children
    - root with nested chain
    - root with nested siblings
    - root with removable descendants
    callbackAction:
    - CONTINUE
    - SKIP_CHILDREN
    - SKIP_ENTIRELY
    - REMOVE
    - STOP
    actionLocation:
    - root head
    - descendant head
    - leaf tail
    - internal-node head
    - final-child removal
    - root terminal path
    traversalOutcome:
    - complete traversal
    - child pruning
    - entire-node skipping
    - subtree removal
    - stop from head
    - stop from tail
    depth:
    - '0'
    - '1'
    - '2'
    - 3-or-more
    siblingPosition:
    - only child
    - first of multiple siblings
    - middle sibling
    - last sibling
  scenarios:
  - id: ROOT_LEAF_CONTINUE
    category: NORMAL
    description: A detached root has no children and the head and tail callbacks return
      CONTINUE.
    preconditions:
    - The root childNodeSize is 0.
    - The filter returns CONTINUE from head(root, 0) and tail(root, 0).
    expectedSourceBehavior:
    - filter invokes head once and tail once for the root.
    - The method returns the tail result, CONTINUE.
    - The original and clone have identical callback sequences and unchanged final
      outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_LEAF_SKIP_CHILDREN
    category: BOUNDARY
    description: A detached leaf root receives SKIP_CHILDREN from head.
    preconditions:
    - The root childNodeSize is 0.
    - head(root, 0) returns SKIP_CHILDREN and tail(root, 0) returns SKIP_CHILDREN.
    expectedSourceBehavior:
    - No descent occurs because the root has no children.
    - tail is still invoked because the source invokes tail for CONTINUE or SKIP_CHILDREN.
    - The method returns SKIP_CHILDREN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_LEAF_SKIP_ENTIRELY
    category: EDGE
    description: A detached leaf root receives SKIP_ENTIRELY from its head callback.
    preconditions:
    - The root childNodeSize is 0.
    - head(root, 0) returns SKIP_ENTIRELY.
    expectedSourceBehavior:
    - The root is not descended into and its tail callback is not invoked.
    - The method returns SKIP_ENTIRELY at the root terminal path.
    - The final outerHtml remains unchanged on both equivalent roots.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_LEAF_REMOVE
    category: EDGE
    description: A detached leaf root receives REMOVE from its head callback.
    preconditions:
    - The root childNodeSize is 0.
    - head(root, 0) returns REMOVE.
    expectedSourceBehavior:
    - No tail callback is invoked for the root because REMOVE is not CONTINUE or SKIP_CHILDREN.
    - The root reaches the node == root return path and the method returns REMOVE.
    - No parent exists from which the root can be removed, so the final root serialization
      remains observable for comparison.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_HEAD_STOP
    category: BOUNDARY
    description: A detached root stops immediately during its head callback.
    preconditions:
    - The root childNodeSize is 0 or greater than 0.
    - head(root, 0) returns STOP.
    expectedSourceBehavior:
    - head is invoked once and no tail or descendant callback is invoked.
    - The method returns STOP immediately.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_WITH_ONE_CONTINUED_CHILD
    category: NORMAL
    description: A root has exactly one child and both nodes are continued.
    preconditions:
    - root.childNodeSize is 1.
    - head(root, 0), head(child, 1), tail(child, 1), and tail(root, 0) return CONTINUE.
    expectedSourceBehavior:
    - '{Callbacks occur in depth-first order=root head, child head, child tail, root
      tail.}'
    - The method returns the root tail result, CONTINUE.
    - Both roots retain their original structure and produce equal final outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_WITH_TWO_CONTINUED_SIBLINGS
    category: NORMAL
    description: A root has two leaf children and all callbacks return CONTINUE.
    preconditions:
    - root.childNodeSize is 2 and both children have childNodeSize 0.
    - All head and tail callbacks return CONTINUE.
    expectedSourceBehavior:
    - The first child is fully tailed before the second child is headed.
    - The root tail is invoked after both sibling subtrees.
    - The method returns CONTINUE and visits both sibling positions exactly once.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_SKIP_CHILDREN_WITH_DESCENDANTS
    category: BOUNDARY
    description: A root with at least one descendant returns SKIP_CHILDREN from its
      head callback.
    preconditions:
    - root.childNodeSize is at least 1.
    - head(root, 0) returns SKIP_CHILDREN and tail(root, 0) returns SKIP_CHILDREN.
    expectedSourceBehavior:
    - No child head or descendant callback is invoked.
    - The root tail is invoked and the method returns SKIP_CHILDREN.
    - The descendant structure is not removed or traversed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ID_INTERIOR_SKIP_ENTIRELY_WITH_FOLLOWING_SIBLING
    category: NORMAL
    description: The first child of a root has a following sibling and returns SKIP_ENTIRELY.
    preconditions:
    - The root has at least two children, the first child is an interior traversal
      node, and the second child is its next sibling.
    - root head returns CONTINUE, first-child head returns SKIP_ENTIRELY, and the
      following sibling and root return CONTINUE from head and tail.
    expectedSourceBehavior:
    - The skipped child has no tail callback and no descendant callback.
    - Traversal proceeds to the following sibling without removing the skipped child.
    - The root tail is reached and the method returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERIOR_SKIP_CHILDREN_WITH_FOLLOWING_SIBLING
    category: NORMAL
    description: The first child has descendants and a following sibling, and its
      head callback returns SKIP_CHILDREN.
    preconditions:
    - The root has at least two children.
    - The first child has childNodeSize greater than 0.
    - The first child head and tail return SKIP_CHILDREN; other visited callbacks
      return CONTINUE.
    expectedSourceBehavior:
    - Descendants of the first child are not headed.
    - The first child tail is invoked before traversal proceeds to its following sibling.
    - The following sibling and root are still traversed and the terminal result is
      CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_FIRST_CHILD_WITH_FOLLOWING_SIBLING
    category: NORMAL
    description: The first of two or more root children returns REMOVE from head.
    preconditions:
    - The root has at least two children.
    - head(root, 0) returns CONTINUE and head(firstChild, 1) returns REMOVE.
    - The following sibling is reachable and its callbacks return CONTINUE.
    expectedSourceBehavior:
    - The removed child is not tailed.
    - The source finds the next sibling, then removes the previous child after finding
      that sibling.
    - The following sibling and root are traversed, and final outerHtml omits the
      removed subtree.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_LAST_CHILD
    category: NORMAL
    description: The last child of a root returns REMOVE and has no following sibling.
    preconditions:
    - The root has at least one child and the selected removable child is the last
      child.
    - head(root, 0) returns CONTINUE and head(lastChild, 1) returns REMOVE.
    expectedSourceBehavior:
    - The child is not tailed.
    - The source ascends to the parent, removes the previous child after finding the
      parent, and then tails the parent.
    - The method returns the parent tail result and final outerHtml omits the removed
      child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_ONLY_CHILD
    category: EDGE
    description: The root has exactly one child and that child returns REMOVE.
    preconditions:
    - root.childNodeSize is exactly 1.
    - head(root, 0) returns CONTINUE and head(onlyChild, 1) returns REMOVE.
    expectedSourceBehavior:
    - The only child is removed through the no-sibling ascent path.
    - The root is subsequently tailed.
    - The method returns the root tail result and the final root has no child formerly
      present.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_NESTED_SUBTREE_WITH_SIBLING
    category: NORMAL
    description: A non-leaf descendant with its own descendants returns REMOVE while
      its parent has a following sibling.
    preconditions:
    - A root child contains at least one descendant and has a following sibling.
    - The nested node head returns REMOVE before its descendants are entered.
    - The root, parent path, and following sibling use CONTINUE.
    expectedSourceBehavior:
    - The nested node's descendants and tail are skipped.
    - The nested node is removed after the traversal moves to its following sibling.
    - The following sibling and necessary ancestor tails are still processed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STOP_DESCENDANT_HEAD
    category: NORMAL
    description: A descendant head callback returns STOP after its ancestors have
      been continued.
    preconditions:
    - The root has a descendant at depth at least 1.
    - Every callback before the selected descendant returns CONTINUE.
    - head(selectedDescendant, depth greater than 0) returns STOP.
    expectedSourceBehavior:
    - Traversal stops at the selected descendant head.
    - No tail callback for that node or any ancestor is invoked after STOP.
    - The method returns STOP and leaves all later siblings unvisited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STOP_FROM_LEAF_TAIL
    category: NORMAL
    description: A continued leaf descendant returns STOP from its tail callback.
    preconditions:
    - The root has at least one descendant leaf.
    - The selected leaf head returns CONTINUE and its tail returns STOP.
    - Earlier callbacks, if any, return CONTINUE.
    expectedSourceBehavior:
    - The selected leaf head is followed by its tail.
    - The method returns STOP from tail without processing the leaf's following siblings
      or ancestor tail.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STOP_FROM_INTERNAL_TAIL
    category: EDGE
    description: An internal node is continued through its children and returns STOP
      from its tail.
    preconditions:
    - The selected internal node has at least one child.
    - Its head and all callbacks in its descendants return CONTINUE.
    - Its tail returns STOP.
    expectedSourceBehavior:
    - The complete selected subtree is visited before the internal tail.
    - The method returns STOP at that tail and does not continue to the internal node's
      sibling or parent tail.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THREE_LEVEL_CONTINUE_CHAIN
    category: BOUNDARY
    description: A detached root has a single-child chain with at least four nodes,
      all continued.
    preconditions:
    - There are nodes at depths 0, 1, 2, and at least 3.
    - Every head and tail callback returns CONTINUE.
    expectedSourceBehavior:
    - Depth increases by one for each child descent and decreases during ascent.
    - Callback order is depth-first head order followed by reverse tail order.
    - The method returns CONTINUE after the root tail.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_PRUNE_SKIP_AND_REMOVE
    category: NORMAL
    description: A root has multiple branches, with one branch skipped entirely, one
      pruned with SKIP_CHILDREN, and one removable.
    preconditions:
    - The root has at least three distinguishable child branches.
    - One selected branch head returns SKIP_ENTIRELY, another selected branch head
      returns SKIP_CHILDREN, and a later branch head returns REMOVE.
    - All other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - SKIP_ENTIRELY suppresses the selected branch tail and descendants.
    - SKIP_CHILDREN invokes the selected branch tail but suppresses its descendants.
    - REMOVE suppresses the selected branch tail and removes that branch after locating
      the next traversal position.
    - Remaining reachable siblings and the root tail are processed, producing identical
      final outerHtml for the original and clone.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_MULTIPLE_SIBLINGS
    category: EDGE
    description: A root has at least three leaf children and a deterministic policy
      removes alternating child positions.
    preconditions:
    - The root has at least three children with stable sibling ordinals.
    - head returns REMOVE for at least two selected sibling positions and CONTINUE
      for the intervening positions.
    - Non-removed visited leaves and the root return CONTINUE from applicable callbacks.
    expectedSourceBehavior:
    - Each removed leaf is removed after the source obtains the next sibling or ascends
      when it is last.
    - Non-removed siblings remain visited in traversal order.
    - The method returns the root terminal result and both final outerHtml values
      contain the same surviving siblings.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_REMOVE_WITH_DESCENDANTS
    category: EDGE
    description: A detached root with descendants returns REMOVE immediately from
      its head callback.
    preconditions:
    - root.childNodeSize is at least 1.
    - head(root, 0) returns REMOVE.
    expectedSourceBehavior:
    - No descendant or root tail callback is invoked.
    - Because the root is the terminal root node and has no parent, the method returns
      REMOVE without traversing or removing descendants.
    - The original and cloned roots retain equal final outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
