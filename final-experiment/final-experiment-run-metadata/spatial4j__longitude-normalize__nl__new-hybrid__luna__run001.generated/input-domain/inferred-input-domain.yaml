InputDomain:
  summary: Finite IEEE-754 longitude values in degrees, with each follow-up formed
    by the Java expression source + 360.0 and compared by normalized globe position,
    treating -180.0 and +180.0 as equivalent endpoint representations.
  globalConstraints:
  - source is a finite double; non-finite values are excluded because the supplied
    method does not define a finite normalized longitude for NaN or infinity and the
    metamorphic relation describes globe positions.
  - The follow-up input is exactly the Java double evaluation source + 360.0.
  - The metamorphic relation passes when the two normalized results are numerically
    equal, or when one result is -180.0 and the other is +180.0.
  - Source cases must use the supplied static method DistanceUtils.normLonDEG(double);
    no object construction is required.
  diversity:
    sourceRange:
    - (-180.0, 180.0)
    - exactly -180.0
    - exactly +180.0
    - (-infinity, -180.0)
    - (180.0, +infinity)
    controlFlowBranch:
    - inclusive in-range return
    - off < 0.0 return
    - off == 0.0 with positive source
    - final -180.0 + off return
    remainderClass:
    - negative nonzero remainder
    - positive nonzero remainder
    - positive zero remainder
    - negative zero remainder
    precisionClass:
    - ordinary integral
    - ordinary fractional
    - one-ULP boundary displacement
    - subnormal
    - large finite with distinct follow-up
    - large finite with absorbed +360.0
    endpointBehavior:
    - ordinary longitude
    - exact inclusive endpoint
    - endpoint reached through remainder sentinel
    - equivalent -180.0/+180.0 representations
  scenarios:
  - id: POSITIVE_INTERIOR
    category: NORMAL
    description: Ordinary positive longitude strictly inside the documented inclusive
      range.
    preconditions:
    - source == 37.25
    - 0.0 < source < 180.0
    expectedSourceBehavior:
    - The inclusive in-range branch returns source unchanged.
    - The follow-up input is 397.25 and normalizes to the same longitude position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INTERIOR
    category: NORMAL
    description: Ordinary negative longitude strictly inside the documented inclusive
      range.
    preconditions:
    - source == -37.25
    - -180.0 < source < 0.0
    expectedSourceBehavior:
    - The inclusive in-range branch returns source unchanged.
    - The follow-up input is 322.75 and normalizes to the same longitude position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ZERO
    category: EDGE
    description: Positive zero exercises the in-range early return at the numeric
      origin.
    preconditions:
    - raw IEEE-754 bits of source are 0x0000000000000000
    - source == 0.0
    expectedSourceBehavior:
    - The source is returned through the in-range branch.
    - The follow-up input is 360.0 and normalizes to the same globe position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO
    category: EDGE
    description: Negative zero checks sign preservation by the in-range return without
      treating zero signs as different globe positions.
    preconditions:
    - raw IEEE-754 bits of source are 0x8000000000000000
    - source == 0.0 under Java numeric comparison
    expectedSourceBehavior:
    - The source is returned through the in-range branch.
    - The follow-up is formed by source + 360.0 and is checked by numeric globe equivalence,
      ignoring the sign of zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SMALLEST_POSITIVE_SUBNORMAL
    category: EDGE
    description: Smallest positive finite longitude, which remains inside the documented
      range.
    preconditions:
    - source == Double.longBitsToDouble(0x0000000000000001L)
    - 0.0 < source < 180.0
    expectedSourceBehavior:
    - The source is returned unchanged by the in-range branch.
    - The one-turn follow-up normalizes to the same longitude position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SMALLEST_NEGATIVE_SUBNORMAL
    category: EDGE
    description: Smallest negative finite longitude, which remains inside the documented
      range.
    preconditions:
    - source == -Double.longBitsToDouble(0x0000000000000001L)
    - -180.0 < source < 0.0
    expectedSourceBehavior:
    - The source is returned unchanged by the in-range branch.
    - The one-turn follow-up normalizes to the same longitude position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_NEGATIVE_ENDPOINT
    category: BOUNDARY
    description: Source is exactly the inclusive lower endpoint.
    preconditions:
    - source == -180.0
    expectedSourceBehavior:
    - The source returns -180.0 unchanged through the in-range branch.
    - The follow-up input is +180.0 and returns the equivalent endpoint representation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_POSITIVE_ENDPOINT
    category: BOUNDARY
    description: Source is exactly the inclusive upper endpoint.
    preconditions:
    - source == 180.0
    expectedSourceBehavior:
    - The source returns +180.0 unchanged through the in-range branch.
    - The follow-up input is 540.0 and normalizes to the same endpoint position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_NEGATIVE_ENDPOINT
    category: BOUNDARY
    description: Source is the representable value immediately below -180.0.
    preconditions:
    - source == -180.0 - Math.ulp(180.0)
    - source < -180.0
    expectedSourceBehavior:
    - The in-range branch is bypassed.
    - The negative-remainder branch returns a value just below +180.0.
    - The follow-up normalizes to the same position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_POSITIVE_ENDPOINT
    category: BOUNDARY
    description: Source is the representable value immediately above +180.0.
    preconditions:
    - source == 180.0 + Math.ulp(180.0)
    - source > 180.0
    expectedSourceBehavior:
    - The in-range branch is bypassed.
    - The nonnegative nonzero remainder branch returns a value just above -180.0.
    - The follow-up normalizes to the same position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_DEGREE_OUT
    category: NORMAL
    description: Negative longitude just outside the lower endpoint with a negative
      nonzero remainder.
    preconditions:
    - source == -181.0
    - source < -180.0
    - (source + 180.0) % 360.0 < 0.0
    expectedSourceBehavior:
    - The off < 0.0 branch returns 179.0.
    - The follow-up result is globe-equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ONE_DEGREE_OUT
    category: NORMAL
    description: Positive longitude just outside the upper endpoint with a positive
      nonzero remainder.
    preconditions:
    - source == 181.0
    - source > 180.0
    - (source + 180.0) % 360.0 > 0.0
    expectedSourceBehavior:
    - The final branch returns -179.0.
    - The follow-up result is globe-equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FULL_TURN
    category: BOUNDARY
    description: Positive one-turn input exercises a nonzero remainder that normalizes
      to zero.
    preconditions:
    - source == 360.0
    - (source + 180.0) % 360.0 == 180.0
    expectedSourceBehavior:
    - The final branch returns 0.0.
    - The 720.0 follow-up also normalizes to 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FULL_TURN
    category: BOUNDARY
    description: Negative one-turn input exercises the negative remainder branch and
      reaches zero.
    preconditions:
    - source == -360.0
    - (source + 180.0) % 360.0 == -180.0
    expectedSourceBehavior:
    - The off < 0.0 branch returns 0.0.
    - The follow-up input is 0.0 and returns the same position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_HALF_TURN_MULTIPLE
    category: BOUNDARY
    description: Positive 540-degree input exercises the exact-zero remainder sentinel.
    preconditions:
    - source == 540.0
    - (source + 180.0) % 360.0 == 0.0
    - source > 0.0
    expectedSourceBehavior:
    - The off == 0.0 and source > 0.0 branch returns +180.0.
    - The follow-up result is the same endpoint position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_HALF_TURN_MULTIPLE
    category: BOUNDARY
    description: Negative -540-degree input exercises the negative-zero remainder
      sentinel.
    preconditions:
    - source == -540.0
    - (source + 180.0) % 360.0 == -0.0
    - source < 0.0
    expectedSourceBehavior:
    - The off < 0.0 test is false for negative zero.
    - The off == 0.0 and positive-source test is false.
    - The final branch returns -180.0.
    - The follow-up is globe-equivalent at the endpoint.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_MULTI_TURN
    category: NORMAL
    description: Positive multi-turn input with a fractional normalized result.
    preconditions:
    - source == 721.5
    - source > 180.0
    - (source + 180.0) % 360.0 == 181.5
    expectedSourceBehavior:
    - The final branch returns 1.5.
    - The follow-up result is globe-equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_MULTI_TURN
    category: NORMAL
    description: Negative multi-turn input with a negative fractional remainder.
    preconditions:
    - source == -721.5
    - source < -180.0
    - (source + 180.0) % 360.0 == -181.5
    expectedSourceBehavior:
    - The off < 0.0 branch returns -1.5.
    - The follow-up result is globe-equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_REMAINDER_NEAR_ZERO
    category: EDGE
    description: Positive input immediately above one full turn avoids the exact-zero
      sentinel.
    preconditions:
    - source == 360.0 + Math.ulp(360.0)
    - source > 360.0
    - (source + 180.0) % 360.0 > 0.0
    expectedSourceBehavior:
    - The off == 0.0 branch is not taken.
    - The final branch returns a small positive normalized value.
    - The follow-up remains globe-equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_REMAINDER_NEAR_ZERO
    category: EDGE
    description: Negative input immediately below one negative full turn avoids the
      negative-zero sentinel.
    preconditions:
    - source == -360.0 - Math.ulp(360.0)
    - source < -360.0
    - (source + 180.0) % 360.0 < 0.0
    expectedSourceBehavior:
    - The off < 0.0 branch returns a small negative normalized value.
    - The follow-up remains globe-equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOWUP_FROM_NEGATIVE_ENDPOINT
    category: BOUNDARY
    description: The source is the negative endpoint and the follow-up is the positive
      endpoint.
    preconditions:
    - source == -180.0
    - source + 360.0 == 180.0
    expectedSourceBehavior:
    - Both invocations use the inclusive in-range branch.
    - The results are -180.0 and +180.0, accepted as the same globe position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOWUP_FROM_POSITIVE_ENDPOINT
    category: BOUNDARY
    description: The positive endpoint followed by one turn reaches the positive exact-remainder
      sentinel.
    preconditions:
    - source == 180.0
    - source + 360.0 == 540.0
    - ((source + 360.0) + 180.0) % 360.0 == 0.0
    expectedSourceBehavior:
    - The source returns +180.0 through the in-range branch.
    - The follow-up returns +180.0 through the positive exact-zero remainder branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOWUP_FROM_ZERO
    category: BOUNDARY
    description: Zero followed by one turn reaches an ordinary zero normalization
      rather than the endpoint sentinel.
    preconditions:
    - source == 0.0
    - source + 360.0 == 360.0
    - ((source + 360.0) + 180.0) % 360.0 == 180.0
    expectedSourceBehavior:
    - The source returns 0.0 through the in-range branch.
    - The follow-up returns 0.0 through the final remainder branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_POSITIVE_DISTINCT_FOLLOWUP
    category: EDGE
    description: Large finite positive input for which adding 360.0 produces a distinct
      representable double.
    preconditions:
    - source == 1.0e12
    - source is finite
    - source > 180.0
    - source + 360.0 != source
    expectedSourceBehavior:
    - The source uses out-of-range remainder normalization.
    - The distinct follow-up normalizes to the same globe position under the supplied
      relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_DISTINCT_FOLLOWUP
    category: EDGE
    description: Large finite negative input for which adding 360.0 produces a distinct
      representable double.
    preconditions:
    - source == -1.0e12
    - source is finite
    - source < -180.0
    - source + 360.0 != source
    expectedSourceBehavior:
    - The source uses the negative remainder path.
    - The distinct follow-up normalizes to the same globe position.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_DOUBLE_PRECISION_LIMIT
    category: EDGE
    description: Positive 2^53-degree input absorbs the 360-degree addition in IEEE-754
      representation.
    preconditions:
    - source == 9007199254740992.0
    - source is finite
    - source + 360.0 == source
    expectedSourceBehavior:
    - The source uses out-of-range remainder normalization.
    - The follow-up invocation receives the same representable input, so the relation
      is checked without assuming mathematical rather than Java-double addition.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_DOUBLE_PRECISION_LIMIT
    category: EDGE
    description: Negative -2^53-degree input absorbs the 360-degree addition in IEEE-754
      representation.
    preconditions:
    - source == -9007199254740992.0
    - source is finite
    - source + 360.0 == source
    expectedSourceBehavior:
    - The source uses the negative out-of-range remainder path.
    - The follow-up receives the same representable input and must be globe-equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_FINITE_POSITIVE
    category: EDGE
    description: Maximum finite positive double tests the largest reachable positive
      remainder input.
    preconditions:
    - source == Double.MAX_VALUE
    - source is finite
    - source + 360.0 == source
    expectedSourceBehavior:
    - The in-range branch is bypassed.
    - The source and actual Java follow-up invocation are compared under the supplied
      globe-equivalence relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_FINITE_NEGATIVE
    category: EDGE
    description: Most negative finite double tests the corresponding largest-magnitude
      negative remainder input.
    preconditions:
    - source == -Double.MAX_VALUE
    - source is finite
    - source + 360.0 == source
    expectedSourceBehavior:
    - The negative remainder path is reached.
    - The source and actual Java follow-up invocation are compared under the supplied
      globe-equivalence relation.
    targetCases: 1
    emptyOutputAllowed: false
