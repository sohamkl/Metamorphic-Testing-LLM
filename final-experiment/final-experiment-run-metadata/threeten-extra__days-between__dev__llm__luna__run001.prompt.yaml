ProjectRoot: examples/threeten-extra
AutomaticDiscovery: true
SUTClassFile: examples/threeten-extra/src/main/java/org/threeten/extra/Days.java
TargetFunction: public static Days between(Temporal startDateInclusive, Temporal endDateExclusive)
SUTDescription: >-
  A day-count value from threeten-extra. Takes a start date and an end date and returns a
  Days holding how many whole days are between them, negative if the end is before the
  start. Call the getAmount() function to read it as an integer.

# DEV run: the developer spec is the MR, so no MRInput/MROutput prose is sent to the model.
# The natural-language version of this relation lives in prompt-day-between-nl.yaml.
Count: 50
InputGenerator: LLM
# Days.between takes Temporal, an interface, so Randoop needs a concrete implementation to build arguments.
RandoopTargetClasses:
  - org.threeten.extra.Days
  - java.time.LocalDate
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/threeten-extra/mr/DaysBetweenMetamorphicSpec.java
DeveloperFollowUpMethod: DaysBetweenMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: DaysBetweenMetamorphicSpec.assertRelation
GeneratedClassName: GeneratedDaysBetweenMetamorphicTest
OutputRoot: examples/threeten-extra/generated/days-between
MaxRepairAttempts: 3
MavenProfiles:
  - threeten
