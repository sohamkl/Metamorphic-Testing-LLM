InputDomain:
  summary: Finite binary64 longitudes covering the unchanged interval, both antimeridian
    representations, all three normalization branches, wrap-cycle boundaries, signed
    zero, fractional offsets, and large-magnitude inputs.
  globalConstraints:
  - The source input is exactly one Java primitive double supplied to the static method
    DistanceUtils.normLonDEG(double).
  - 'The source longitude must be finite: !Double.isNaN(longitudeDeg) && !Double.isInfinite(longitudeDeg).
    NaN and infinities are excluded because the MR does not request invalid inputs
    and its difference comparison would be vacuous for NaN.'
  - The source longitude must satisfy -9007199254740992.0 <= longitudeDeg && longitudeDeg
    <= 9007199254740992.0 (inclusive, or |longitudeDeg| <= 2^53). Larger finite doubles
    are reachable by the API but are excluded because binary64 addition may no longer
    represent a 360-degree shift faithfully, making the supplied follow-up transformation
    test floating-point spacing rather than longitude periodicity.
  - The follow-up is always the supplied transformation longitudeDeg + 360.0; source
    cases must not be filtered according to which target-method branch the follow-up
    reaches.
  diversity:
    sourceRegion:
    - inside [-180,180]
    - below -180
    - above 180
    sourceBranch:
    - unchanged common case
    - off < 0
    - off == 0 && longitudeDeg > 0
    - final else
    boundaryType:
    - -180 endpoint
    - +180 endpoint
    - adjacent representable values
    - 360-cycle boundary
    - antimeridian wrap boundary
    - 2^53 magnitude boundary
    numericForm:
    - positive
    - negative
    - '+0.0'
    - '-0.0'
    - integer
    - fractional
    - large exact value
    normalizedRegion:
    - '-180'
    - near -180
    - negative interior
    - zero
    - positive interior
    - near +180
    - '+180'
  scenarios:
  - id: ORDINARY_NEGATIVE_INTERIOR
    category: NORMAL
    description: A negative longitude strictly inside the unchanged interval.
    preconditions:
    - longitudeDeg == -45.0
    expectedSourceBehavior:
    - The initial range check succeeds and the method returns exactly -45.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ZERO
    category: EDGE
    description: Positive signed zero in the unchanged interval.
    preconditions:
    - Double.doubleToRawLongBits(longitudeDeg) == Double.doubleToRawLongBits(+0.0d)
    expectedSourceBehavior:
    - The initial range check succeeds and the returned value preserves positive zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO
    category: EDGE
    description: Negative signed zero in the unchanged interval.
    preconditions:
    - Double.doubleToRawLongBits(longitudeDeg) == Double.doubleToRawLongBits(-0.0d)
    expectedSourceBehavior:
    - The initial range check succeeds and the returned value preserves negative zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_POSITIVE_INTERIOR
    category: NORMAL
    description: A positive longitude strictly inside the unchanged interval.
    preconditions:
    - longitudeDeg == 45.0
    expectedSourceBehavior:
    - The initial range check succeeds and the method returns exactly 45.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WITHIN_TOLERANCE_BELOW_POSITIVE_ANTIMERIDIAN
    category: EDGE
    description: An unchanged value within the MR tolerance of +180.
    preconditions:
    - longitudeDeg == 179.9999999995
    expectedSourceBehavior:
    - The initial range check succeeds and the method returns the source value exactly.
    - The source output is classified as antimeridian by the supplied assertion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WITHIN_TOLERANCE_ABOVE_NEGATIVE_ANTIMERIDIAN
    category: EDGE
    description: An unchanged value within the MR tolerance of -180.
    preconditions:
    - longitudeDeg == -179.9999999995
    expectedSourceBehavior:
    - The initial range check succeeds and the method returns the source value exactly.
    - The source output is classified as antimeridian by the supplied assertion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_NEGATIVE_ANTIMERIDIAN
    category: BOUNDARY
    description: The inclusive lower endpoint of the unchanged interval.
    preconditions:
    - longitudeDeg == -180.0
    expectedSourceBehavior:
    - The initial range check succeeds and the method returns exactly -180.0.
    - The follow-up input is exactly +180.0, exercising the MR's equivalence of the
      two antimeridian representations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_POSITIVE_ANTIMERIDIAN
    category: BOUNDARY
    description: The inclusive upper endpoint of the unchanged interval.
    preconditions:
    - longitudeDeg == 180.0
    expectedSourceBehavior:
    - The initial range check succeeds and the method returns exactly +180.0.
    - The follow-up input is 540.0 and reaches the positive off-equals-zero sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_LOWER_ENDPOINT
    category: BOUNDARY
    description: The representable value immediately above -180 remains unchanged.
    preconditions:
    - longitudeDeg == Math.nextUp(-180.0)
    expectedSourceBehavior:
    - The initial range check succeeds and the exact source value is returned.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_UPPER_ENDPOINT
    category: BOUNDARY
    description: The representable value immediately below +180 remains unchanged.
    preconditions:
    - longitudeDeg == Math.nextDown(180.0)
    expectedSourceBehavior:
    - The initial range check succeeds and the exact source value is returned.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_LOWER_ENDPOINT
    category: BOUNDARY
    description: The representable value immediately below -180 enters negative wrapping.
    preconditions:
    - longitudeDeg == Math.nextDown(-180.0)
    expectedSourceBehavior:
    - The initial range check fails, off is negative, and the output is 180.0 + off.
    - The result is finite, no greater than +180.0, and close to the positive antimeridian.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_UPPER_ENDPOINT
    category: BOUNDARY
    description: The representable value immediately above +180 enters positive wrapping.
    preconditions:
    - longitudeDeg == Math.nextUp(180.0)
    expectedSourceBehavior:
    - The initial range check fails, off is positive, and the final else branch returns
      -180.0 + off.
    - The result is finite, no less than -180.0, and close to the negative antimeridian.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ONE_DEGREE_PAST_RANGE
    category: NORMAL
    description: A small positive overflow wraps to the negative side.
    preconditions:
    - longitudeDeg == 181.0
    expectedSourceBehavior:
    - The final else branch returns exactly -179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_JUST_BELOW_FULL_REVOLUTION
    category: NORMAL
    description: A positive longitude one degree below a full revolution.
    preconditions:
    - longitudeDeg == 359.0
    expectedSourceBehavior:
    - The final else branch returns exactly -1.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FULL_REVOLUTION
    category: BOUNDARY
    description: One complete positive revolution normalizes to zero.
    preconditions:
    - longitudeDeg == 360.0
    expectedSourceBehavior:
    - The final else branch returns exactly 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_JUST_BELOW_ANTIMERIDIAN_WRAP
    category: BOUNDARY
    description: A positive wrapped value one degree below the 540-degree antimeridian
      sentinel.
    preconditions:
    - longitudeDeg == 539.0
    expectedSourceBehavior:
    - The final else branch returns exactly 179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ANTIMERIDIAN_WRAP
    category: BOUNDARY
    description: A positive out-of-range longitude produces off equal to zero.
    preconditions:
    - longitudeDeg == 540.0
    expectedSourceBehavior:
    - off == 0.0 and longitudeDeg > 0.0, so the dedicated sentinel branch returns
      exactly +180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_JUST_ABOVE_ANTIMERIDIAN_WRAP
    category: BOUNDARY
    description: A positive wrapped value one degree above the 540-degree antimeridian
      sentinel.
    preconditions:
    - longitudeDeg == 541.0
    expectedSourceBehavior:
    - The final else branch returns exactly -179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWO_POSITIVE_REVOLUTIONS
    category: EDGE
    description: Two complete positive revolutions exercise repeated wrapping.
    preconditions:
    - longitudeDeg == 720.0
    expectedSourceBehavior:
    - The final else branch returns exactly 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_DEGREE_PAST_RANGE
    category: NORMAL
    description: A small negative underflow wraps to the positive side.
    preconditions:
    - longitudeDeg == -181.0
    expectedSourceBehavior:
    - off is negative and the off-less-than-zero branch returns exactly 179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_JUST_ABOVE_FULL_REVOLUTION
    category: NORMAL
    description: A negative longitude one degree short of a complete negative revolution.
    preconditions:
    - longitudeDeg == -359.0
    expectedSourceBehavior:
    - off is negative and the off-less-than-zero branch returns exactly 1.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FULL_REVOLUTION
    category: BOUNDARY
    description: One complete negative revolution normalizes to zero.
    preconditions:
    - longitudeDeg == -360.0
    expectedSourceBehavior:
    - off is negative and the off-less-than-zero branch returns exactly 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_JUST_ABOVE_ANTIMERIDIAN_WRAP
    category: BOUNDARY
    description: A negative wrapped value one degree toward zero from -540.
    preconditions:
    - longitudeDeg == -539.0
    expectedSourceBehavior:
    - off is negative and the off-less-than-zero branch returns exactly -179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ANTIMERIDIAN_WRAP
    category: BOUNDARY
    description: A negative out-of-range longitude has a zero remainder without satisfying
      the positive sentinel condition.
    preconditions:
    - longitudeDeg == -540.0
    expectedSourceBehavior:
    - off compares equal to zero but longitudeDeg > 0 is false, so the final else
      branch returns exactly -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_JUST_BELOW_ANTIMERIDIAN_WRAP
    category: BOUNDARY
    description: A negative wrapped value one degree farther from zero than -540.
    preconditions:
    - longitudeDeg == -541.0
    expectedSourceBehavior:
    - off is negative and the off-less-than-zero branch returns exactly 179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWO_NEGATIVE_REVOLUTIONS
    category: EDGE
    description: Two complete negative revolutions exercise repeated negative wrapping.
    preconditions:
    - longitudeDeg == -720.0
    expectedSourceBehavior:
    - The negative remainder path returns exactly 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_MULTI_REVOLUTION
    category: NORMAL
    description: A positive multi-revolution longitude retains a noninteger phase.
    preconditions:
    - longitudeDeg == 725.25
    expectedSourceBehavior:
    - The final else branch returns exactly 5.25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_MULTI_REVOLUTION
    category: NORMAL
    description: A negative multi-revolution longitude retains a noninteger phase.
    preconditions:
    - longitudeDeg == -725.25
    expectedSourceBehavior:
    - The off-less-than-zero branch returns exactly -5.25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REPRESENTABLE_BELOW_POSITIVE_WRAP_SENTINEL
    category: EDGE
    description: The representable value immediately below the positive 540-degree
      sentinel.
    preconditions:
    - longitudeDeg == Math.nextDown(540.0)
    expectedSourceBehavior:
    - off is positive rather than zero, so the final else branch returns a value immediately
      below +180.0.
    - The output is recognized as antimeridian by the supplied tolerance check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REPRESENTABLE_ABOVE_POSITIVE_WRAP_SENTINEL
    category: EDGE
    description: The representable value immediately above the positive 540-degree
      sentinel.
    preconditions:
    - longitudeDeg == Math.nextUp(540.0)
    expectedSourceBehavior:
    - off is positive rather than zero, so the final else branch returns a value immediately
      above -180.0.
    - The output is recognized as antimeridian by the supplied tolerance check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REPRESENTABLE_BELOW_NEGATIVE_WRAP_SENTINEL
    category: EDGE
    description: The representable value immediately below -540.
    preconditions:
    - longitudeDeg == Math.nextDown(-540.0)
    expectedSourceBehavior:
    - off is strictly negative and the off-less-than-zero branch returns a value immediately
      below +180.0.
    - The output is recognized as antimeridian by the supplied tolerance check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REPRESENTABLE_ABOVE_NEGATIVE_WRAP_SENTINEL
    category: EDGE
    description: The representable value immediately above -540.
    preconditions:
    - longitudeDeg == Math.nextUp(-540.0)
    expectedSourceBehavior:
    - off is strictly negative and the off-less-than-zero branch returns a value immediately
      above -180.0.
    - The output is recognized as antimeridian by the supplied tolerance check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_SUPPORTED_POSITIVE_MAGNITUDE
    category: BOUNDARY
    description: The positive 2^53 domain limit exercises remainder normalization
      at large binary64 magnitude.
    preconditions:
    - longitudeDeg == 9007199254740992.0
    expectedSourceBehavior:
    - The method takes the final else branch and returns exactly 32.0.
    - The output remains finite and inside the documented inclusive range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_SUPPORTED_NEGATIVE_MAGNITUDE
    category: BOUNDARY
    description: The negative -2^53 domain limit exercises the negative-remainder
      branch at large binary64 magnitude.
    preconditions:
    - longitudeDeg == -9007199254740992.0
    expectedSourceBehavior:
    - The method takes the off-less-than-zero branch and returns exactly -32.0.
    - The output remains finite and inside the documented inclusive range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_POSITIVE_EXACT_ANTIMERIDIAN
    category: EDGE
    description: A large exact positive number of revolutions plus 180 reaches the
      positive zero-remainder sentinel.
    preconditions:
    - longitudeDeg == 360.0 * 1099511627776.0 + 180.0
    expectedSourceBehavior:
    - off equals zero and the positive sentinel branch returns exactly +180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_EXACT_ANTIMERIDIAN
    category: EDGE
    description: A large exact negative number of revolutions minus 180 reaches the
      nonpositive zero-remainder path.
    preconditions:
    - longitudeDeg == -(360.0 * 1099511627776.0 + 180.0)
    expectedSourceBehavior:
    - off compares equal to zero and the final else branch returns exactly -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_POSITIVE_FRACTIONAL_PHASE
    category: EDGE
    description: A large positive longitude preserves an exactly representable fractional
      phase through remainder normalization.
    preconditions:
    - longitudeDeg == 360.0 * 1073741824.0 + 123.5
    expectedSourceBehavior:
    - The final else branch returns exactly 123.5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_FRACTIONAL_PHASE
    category: EDGE
    description: A large negative longitude preserves an exactly representable fractional
      phase through negative remainder normalization.
    preconditions:
    - longitudeDeg == -(360.0 * 1073741824.0 + 123.5)
    expectedSourceBehavior:
    - The off-less-than-zero branch returns exactly -123.5.
    targetCases: 1
    emptyOutputAllowed: false
