InputDomain:
  summary: Non-empty finite Cartesian circle/rectangle pairs in one non-geo SpatialContext,
    with finite non-negative radii and coordinate ranges that admit both the source
    shapes and the metamorphic follow-up translated by (+17.5, -9.25). The scenarios
    exercise the enclosing-box shortcuts, the equal-bounding-box sentinel, phase-2
    closest-corner disjoint test, containment farthest-corner test, tangencies, zero-radius
    circles, and degenerate rectangles.
  globalConstraints:
  - Use a non-geo SpatialContext whose valid coordinate range contains every source
    center, every source rectangle bound, and those same values after adding SHIFT_X=17.5
    and SHIFT_Y=-9.25.
  - Construct the CircleImpl with a non-empty Point having finite x and y, and a finite
    radiusDEG >= 0 accepted by that context's distance calculator.
  - Construct a non-empty Rectangle with finite bounds satisfying minX <= maxX and
    minY <= maxY; zero width and/or zero height are included where specified.
  - 'Exclude empty circles and empty rectangles: the follow-up generator obtains center
    coordinates and rectangle bounds and arithmetically translates them, so it does
    not preserve the CircleImpl empty-point representation or any empty-rectangle
    encoding.'
  - Do not use geo/dateline-crossing or world-wrapping rectangles; relateRectanglePhase2
    explicitly states that it does not work for those cases, while this SUT domain
    is flat and non-geo.
  diversity:
    relationAndControlPath:
    - distinct
    - measurable
    - bbox DISJOINT, bbox WITHIN, bbox CONTAINS with equality, bbox INTERSECTS, phase-2
      diagonal disjoint, axis-spanning intersection, strict containment, farthest-corner
      intersection, tangent containment/intersection, point and line rectangles, zero-radius
      circles, non-origin centers, and fractional radii
  scenarios:
  - id: BBOX_DISJOINT_RIGHT_OF_CIRCLE
    category: NORMAL
    description: A rectangle lies strictly to the right of the circle enclosing box.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=6, maxX=7, minY=-1, maxY=1
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT
    - relate(rectangle) returns DISJOINT without phase 2
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_ABOVE_CIRCLE
    category: NORMAL
    description: A rectangle lies strictly above the circle enclosing box.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-1, maxX=1, minY=6, maxY=7
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT
    - relate(rectangle) returns DISJOINT without phase 2
    targetCases: 1
    emptyOutputAllowed: false
  - id: STRICT_BBOX_WITHIN_RECTANGLE
    category: NORMAL
    description: A rectangle strictly surrounds the complete circle enclosing box.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-6, maxX=6, minY=-6, maxY=6
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN
    - relate(rectangle) returns WITHIN without phase 2
    targetCases: 1
    emptyOutputAllowed: false
  - id: EQUAL_ENCLOSING_BOX_SENTINEL
    category: EDGE
    description: The rectangle exactly equals the circle's Cartesian enclosing box.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-5, maxX=5, minY=-5, maxY=5
    expectedSourceBehavior:
    - enclosingBox.equals(rectangle) is true
    - relate(rectangle) returns WITHIN through the bbox CONTAINS equality special
      case
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_OVERLAP_DIAGONAL_ACTUAL_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the enclosing box only near a diagonal corner
      but is outside the disk.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=4, maxX=6, minY=4, maxY=6
    - closest rectangle corner to the center is (4, 4), whose Euclidean distance is
      greater than 5
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS
    - phase 2 returns DISJOINT after the closest-corner contains check fails
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_CORNER_TANGENCY
    category: BOUNDARY
    description: The nearest diagonal rectangle corner is exactly on the circle boundary.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=3, maxX=6, minY=4, maxY=6
    - closest rectangle corner is (3, 4), whose Euclidean distance is exactly 5
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS
    - relate(rectangle) returns INTERSECTS rather than DISJOINT
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_AXIS_SPANNING_INTERSECTION
    category: NORMAL
    description: The rectangle spans the circle's y axis while extending beyond the
      disk on the positive x side.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=4, maxX=6, minY=-1, maxY=1
    expectedSourceBehavior:
    - phase 2 takes the xAxis < rectangle.minX branch and yAxis-inside branch
    - relate(rectangle) returns INTERSECTS
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_AXIS_SPANNING_INTERSECTION
    category: NORMAL
    description: The rectangle spans the circle's x axis while extending beyond the
      disk on the positive y side.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-1, maxX=1, minY=4, maxY=6
    expectedSourceBehavior:
    - phase 2 takes the xAxis-inside branch and yAxis < rectangle.minY branch
    - relate(rectangle) returns INTERSECTS
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_CROSSES_CENTER_AND_EXITS_BBOX_VERTICALLY
    category: NORMAL
    description: The rectangle contains the center but extends past the circle enclosing
      box vertically.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-1, maxX=1, minY=-6, maxY=6
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS
    - phase 2 cannot classify the shapes as disjoint because both axes are spanned
    - relate(rectangle) returns INTERSECTS
    targetCases: 1
    emptyOutputAllowed: false
  - id: STRICT_CIRCLE_CONTAINS_RECTANGLE
    category: NORMAL
    description: Every rectangle corner is strictly inside the circle and the enclosing
      box contains the rectangle.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-3, maxX=4, minY=-2, maxY=1
    - each rectangle corner has Euclidean distance less than 5 from the center
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS
    - phase 2 farthest-corner check succeeds
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_CIRCLE_INTERSECTS_RECTANGLE
    category: NORMAL
    description: The enclosing box contains the rectangle but the rectangle's farthest
      corner is outside the disk.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-4, maxX=4, minY=-4, maxY=4
    - farthest rectangle corners have Euclidean distance greater than 5 from the center
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS
    - phase 2 farthest-corner contains check fails
    - relate(rectangle) returns INTERSECTS
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_WITH_FARTHEST_CORNER_TANGENT
    category: BOUNDARY
    description: The farthest selected rectangle corner is exactly on the circle boundary.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=0, maxX=3, minY=0, maxY=4
    - farthest rectangle corner is (3, 4), whose Euclidean distance is exactly 5
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS
    - the farthest-corner contains check succeeds at equality
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: X_FARTHEST_MAX_SELECTION
    category: NORMAL
    description: The center is inside the rectangle x range and maxX is strictly farther
      from the center than minX.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-1, maxX=4, minY=-1, maxY=1
    expectedSourceBehavior:
    - phase 2 selects farthestX=4 using the maxX distance comparison
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: X_FARTHEST_MIN_SELECTION
    category: NORMAL
    description: The center is inside the rectangle x range and minX is strictly farther
      from the center than maxX.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-4, maxX=1, minY=-1, maxY=1
    expectedSourceBehavior:
    - phase 2 selects farthestX=-4 using the minX distance comparison
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: Y_FARTHEST_MAX_SELECTION
    category: NORMAL
    description: The center is inside the rectangle y range and maxY is strictly farther
      from the center than minY.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-1, maxX=1, minY=-1, maxY=4
    expectedSourceBehavior:
    - phase 2 selects farthestY=4 using the maxY distance comparison
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: Y_FARTHEST_MIN_SELECTION
    category: NORMAL
    description: The center is inside the rectangle y range and minY is strictly farther
      from the center than maxY.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-1, maxX=1, minY=-4, maxY=1
    expectedSourceBehavior:
    - phase 2 selects farthestY=-4 using the minY distance comparison
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: X_FARTHEST_DISTANCE_TIE
    category: BOUNDARY
    description: The rectangle is symmetric around the center on x, causing the strict
      farthestX comparison to take its equality branch.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=-3, maxX=3, minY=-1, maxY=1
    expectedSourceBehavior:
    - phase 2 uses farthestX=-3 because maxX distance is not strictly greater
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_AT_CIRCLE_CENTER
    category: EDGE
    description: A zero-area rectangle is a point at the circle center.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=0, maxX=0, minY=0, maxY=0
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: A zero-area rectangle is a point exactly on the positive x circle
      boundary.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=5, maxX=5, minY=0, maxY=0
    expectedSourceBehavior:
    - the point is contained at the distance boundary
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_IN_BBOX_OUTSIDE_DISK
    category: EDGE
    description: A zero-area rectangle lies inside the enclosing box but outside the
      disk.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=4, maxX=4, minY=4, maxY=4
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS
    - phase 2 closest-point check fails because distance from (0,0) to (4,4) exceeds
      5
    - relate(rectangle) returns DISJOINT
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_LINE_RECTANGLE_CROSSING_DISK
    category: EDGE
    description: A zero-width rectangle crosses the disk and extends beyond it vertically.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=0, maxX=0, minY=-6, maxY=6
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS
    - relate(rectangle) returns INTERSECTS
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_LINE_RECTANGLE_INSIDE_DISK
    category: EDGE
    description: A zero-width rectangle is entirely inside the disk.
    preconditions:
    - circle center is (0, 0) and radius is 5
    - rectangle bounds are minX=0, maxX=0, minY=-3, maxY=3
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_WITH_SURROUNDING_RECTANGLE
    category: EDGE
    description: A radius-zero circle is a point strictly within a non-degenerate
      rectangle.
    preconditions:
    - circle center is (0, 0) and radius is 0
    - rectangle bounds are minX=-1, maxX=1, minY=-1, maxY=1
    expectedSourceBehavior:
    - the degenerate enclosing box is WITHIN the rectangle
    - relate(rectangle) returns WITHIN
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUAL_POINT_RECTANGLE
    category: EDGE
    description: A radius-zero circle and a point rectangle have identical degenerate
      enclosing boxes.
    preconditions:
    - circle center is (0, 0) and radius is 0
    - rectangle bounds are minX=0, maxX=0, minY=0, maxY=0
    expectedSourceBehavior:
    - enclosingBox.equals(rectangle) is true
    - relate(rectangle) returns WITHIN through the equal-bounding-box special case
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_POINT_RECTANGLE
    category: EDGE
    description: A radius-zero circle and a distinct point rectangle are disjoint.
    preconditions:
    - circle center is (0, 0) and radius is 0
    - rectangle bounds are minX=1, maxX=1, minY=0, maxY=0
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT
    - relate(rectangle) returns DISJOINT
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_ORIGIN_STRICT_CONTAINMENT
    category: NORMAL
    description: A non-origin circle strictly contains a rectangle, ensuring the relation
      is not tied to origin-specific values.
    preconditions:
    - circle center is (2, -3) and radius is 5
    - rectangle bounds are minX=0, maxX=4, minY=-5, maxY=-2
    - every rectangle corner has Euclidean distance less than 5 from (2,-3)
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS
    - relate(rectangle) returns CONTAINS
    targetCases: 1
    emptyOutputAllowed: false
  - id: FRACTIONAL_RADIUS_CORNER_TANGENCY
    category: BOUNDARY
    description: A fractional-radius circle has a nearest rectangle corner exactly
      on its boundary.
    preconditions:
    - circle center is (0, 0) and radius is 2.5
    - rectangle bounds are minX=1.5, maxX=4, minY=2, maxY=4
    - closest rectangle corner is (1.5, 2), whose Euclidean distance is exactly 2.5
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS
    - relate(rectangle) returns INTERSECTS rather than DISJOINT
    targetCases: 1
    emptyOutputAllowed: false
