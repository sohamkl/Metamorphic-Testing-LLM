InputDomain:
  summary: Non-null, day-compatible Temporal endpoint pairs for which Days.between
    and the metamorphic follow-up shift of 37 days are both executable, with the resulting
    day count representable as an int.
  globalConstraints:
  - Both sourceDateInclusive and endDateExclusive are non-null Temporal values.
  - ChronoUnit.DAYS.between(sourceDateInclusive, endDateExclusive) is supported for
    the selected temporal types and their chronology is compatible.
  - The long result of ChronoUnit.DAYS.between is within Integer.MIN_VALUE through
    Integer.MAX_VALUE, because between applies Math.toIntExact.
  - sourceDateInclusive.plus(37, ChronoUnit.DAYS) and endDateExclusive.plus(37, ChronoUnit.DAYS)
    both succeed and return Temporal values.
  - ChronoUnit.DAYS.between(sourceDateInclusive.plus(37, ChronoUnit.DAYS), endDateExclusive.plus(37,
    ChronoUnit.DAYS)) is also representable as an int.
  - The follow-up input is generated only by adding exactly 37 ChronoUnit.DAYS to
    both source endpoints; endpoint values are not independently regenerated.
  - The observable output is read through Days.getAmount(), and the metamorphic assertion
    requires the source and follow-up amounts to be equal.
  diversity:
    temporalType:
    - LocalDate
    - LocalDateTime
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    ordering:
    - equal endpoints
    - end after start
    - end before start
    dayCountClass:
    - zero
    - positive one
    - negative one
    - small positive
    - small negative
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    endpointGranularity:
    - date-only
    - equal local times
    - different local times within adjacent dates
    - offset-bearing date-time
    - zone-bearing date-time
    calendarCondition:
    - ordinary dates
    - month boundary
    - year boundary
    - leap-day boundary
    - daylight-saving transition vicinity
    - near LocalDate minimum
    - near LocalDate maximum
    - non-ISO Japanese chronology
  scenarios:
  - id: EQUAL_LOCAL_DATES
    category: NORMAL
    description: Both endpoints are the same LocalDate.
    preconditions:
    - sourceDateInclusive = LocalDate.of(2024, 6, 15).
    - endDateExclusive = LocalDate.of(2024, 6, 15).
    - Both shifted dates remain valid LocalDate values.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns 0.
    - Days.between returns Days whose getAmount() is 0.
    - The follow-up also has getAmount() 0, exercising the Days.of(0) result path.
    targetCases: 3
    emptyOutputAllowed: false
  - id: SMALL_POSITIVE_LOCAL_DATE_GAPS
    category: NORMAL
    description: LocalDate end points are after the start by small positive gaps.
    preconditions:
    - Use gaps of 1, 2, 6, or 13 calendar days.
    - The selected dates are ordinary valid LocalDate values and their 37-day shifts
      are valid.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns the selected positive gap.
    - Days.getAmount() equals 1, 2, 6, or 13 respectively.
    - The follow-up amount must equal the source amount, including the one-day Days.of(1)
      singleton path.
    targetCases: 4
    emptyOutputAllowed: false
  - id: SMALL_NEGATIVE_LOCAL_DATE_GAPS
    category: NORMAL
    description: LocalDate end points are before the start by small negative gaps.
    preconditions:
    - Use end dates 1, 2, 6, or 13 calendar days before the start.
    - The selected dates and their 37-day shifts are valid LocalDate values.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns the corresponding negative gap.
    - Days.getAmount() is negative, exercising the directed negative-result behavior.
    - The follow-up amount must equal the source negative amount.
    targetCases: 4
    emptyOutputAllowed: false
  - id: LOCAL_DATETIME_EXACT_DAY_BOUNDARIES
    category: BOUNDARY
    description: LocalDateTime endpoints have identical local times and differ by
      exact whole days.
    preconditions:
    - Use start times such as 09:30:00 and end times with the same local time.
    - Use positive and negative gaps of 1, 7, and 37 days.
    - All shifted LocalDateTime values are valid.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between counts the exact whole-day differences.
    - getAmount() is respectively 1, 7, 37, or the corresponding negative value.
    - The 37-day source case is compared with a follow-up that shifts both endpoints
      by another 37 days.
    targetCases: 3
    emptyOutputAllowed: false
  - id: LOCAL_DATETIME_PARTIAL_DAY_BOUNDARIES
    category: BOUNDARY
    description: LocalDateTime endpoints straddle a one-day boundary but are not separated
      by an exact whole day.
    preconditions:
    - Use start 2024-01-10T12:00 and end 2024-01-11T11:59:59.
    - Use the reverse ordering as a separate case.
    - Use start and end on the same date with different times as a separate case.
    - All shifted values support plus(37, DAYS).
    expectedSourceBehavior:
    - Days.between returns the result produced by ChronoUnit.DAYS rather than rounding
      to a calendar-date difference.
    - getAmount() is inspected for zero or the directed truncated whole-day result;
      the test must not replace it with an independently computed calendar-date difference.
    - The follow-up comparison uses the exact same endpoint time components after
      the 37-day shift.
    targetCases: 3
    emptyOutputAllowed: false
  - id: OFFSET_DATETIME_SAME_OFFSET
    category: NORMAL
    description: OffsetDateTime endpoints use the same UTC offset and have exact and
      partial day gaps.
    preconditions:
    - Use a fixed offset such as +02:00 for both endpoints.
    - Include equal endpoints, an exact seven-day gap, and a gap with differing times.
    - All shifted OffsetDateTime values remain valid.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between determines the source amount from the OffsetDateTime
      values.
    - getAmount() is read rather than inferred from date fields alone.
    - The shifted pair must produce the same getAmount() under the metamorphic assertion.
    targetCases: 3
    emptyOutputAllowed: false
  - id: OFFSET_DATETIME_DIFFERING_OFFSETS
    category: EDGE
    description: OffsetDateTime endpoints have different valid offsets, testing day
      counting when local dates and instants are not represented identically.
    preconditions:
    - Use valid OffsetDateTime values with offsets such as +14:00 and -12:00.
    - Include both end-after-start and end-before-start orderings.
    - Both endpoints support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The source result is exactly the value returned by ChronoUnit.DAYS.between for
      the offset-bearing temporals.
    - The result is converted to an int by Days.between and exposed through getAmount().
    - The relation compares the source amount with the amount from the identically
      shifted offset-bearing pair.
    targetCases: 3
    emptyOutputAllowed: false
  - id: ZONED_DATETIME_ORDINARY_ZONE
    category: NORMAL
    description: ZonedDateTime endpoints use the same ordinary time-zone region away
      from a daylight-saving transition.
    preconditions:
    - Use a region zone such as Europe/Paris or America/New_York.
    - Select dates at least 37 days away from a daylight-saving transition.
    - Include equal, positive, and negative endpoint orderings.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between supplies the source count for the zone-aware temporals.
    - getAmount() is observed for both source and shifted calls.
    - The follow-up uses ZonedDateTime.plus(37, DAYS) on each endpoint, preserving
      the temporal type.
    targetCases: 3
    emptyOutputAllowed: false
  - id: ZONED_DATETIME_DST_VICINITY
    category: EDGE
    description: ZonedDateTime endpoints are near or across daylight-saving transitions.
    preconditions:
    - Use a region zone with a documented transition, such as America/New_York.
    - Include an endpoint before the transition, an endpoint after the transition,
      and a pair spanning the transition.
    - Ensure both endpoints and both 37-day follow-up endpoints are within the zone's
      supported range.
    expectedSourceBehavior:
    - The source amount is obtained from ChronoUnit.DAYS.between rather than from
      a manually assumed 24-hour duration.
    - getAmount() is recorded because zone transitions can make date-time arithmetic
      distinct from fixed-duration arithmetic.
    - The metamorphic assertion checks whether shifting both zone-aware endpoints
      by 37 days preserves the returned amount.
    targetCases: 4
    emptyOutputAllowed: false
  - id: MONTH_AND_YEAR_BOUNDARIES
    category: BOUNDARY
    description: LocalDate pairs cross month ends, year ends, and differing month
      lengths.
    preconditions:
    - Include 2024-01-31 to 2024-02-01.
    - Include 2023-12-31 to 2024-01-01.
    - Include a 30-day month to 31-day month transition.
    - All dates and their 37-day shifts are valid.
    expectedSourceBehavior:
    - ChronoUnit.DAYS counts elapsed date days rather than treating month or year
      changes as special units.
    - getAmount() is checked against the exact day difference for each pair.
    - The corresponding shifted pair must retain the same amount.
    targetCases: 3
    emptyOutputAllowed: false
  - id: LEAP_DAY_BOUNDARIES
    category: BOUNDARY
    description: LocalDate pairs include leap-day inclusion and exclusion.
    preconditions:
    - Include 2024-02-28 to 2024-03-01.
    - Include 2024-02-29 to 2024-03-01.
    - Include a non-leap-year February boundary such as 2023-02-28 to 2023-03-01.
    - All 37-day shifts are valid.
    expectedSourceBehavior:
    - getAmount() reflects the actual ChronoUnit.DAYS difference, including whether
      February 29 lies between the endpoints.
    - The source output is not replaced by a month-based calculation.
    - The follow-up output must have the same getAmount().
    targetCases: 3
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM
    category: EDGE
    description: LocalDate endpoints are near the minimum supported LocalDate while
      leaving room for the 37-day follow-up.
    preconditions:
    - Use sourceDateInclusive = LocalDate.MIN.
    - Use an end date no later than LocalDate.MIN.plusDays(37), so both shifted endpoints
      remain valid.
    - The day difference is within the int range.
    expectedSourceBehavior:
    - Days.between returns the ChronoUnit.DAYS result without endpoint construction
      failure.
    - getAmount() is observed for a boundary-supported date pair.
    - The follow-up shifts both endpoints by exactly 37 days and is compared by getAmount().
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM
    category: EDGE
    description: LocalDate endpoints are near the maximum supported LocalDate while
      leaving room for the 37-day follow-up.
    preconditions:
    - Use endDateExclusive = LocalDate.MAX.minusDays(37).
    - Use a valid start date before that end, such as LocalDate.MAX.minusDays(100).
    - Both shifted endpoints remain within LocalDate's supported range.
    expectedSourceBehavior:
    - getAmount() equals the ChronoUnit.DAYS result for the near-maximum pair.
    - The follow-up remains executable despite proximity to LocalDate.MAX.
    - The source and follow-up amounts are compared directly.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INTEGER_MAXIMUM_DAY_COUNT
    category: BOUNDARY
    description: The LocalDate pair has exactly Integer.MAX_VALUE whole days between
      endpoints.
    preconditions:
    - sourceDateInclusive = LocalDate.of(1970, 1, 1).
    - endDateExclusive = sourceDateInclusive.plusDays(Integer.MAX_VALUE).
    - endDateExclusive.plusDays(37) remains within LocalDate's range.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns 2147483647.
    - Math.toIntExact succeeds and Days.getAmount() is Integer.MAX_VALUE.
    - The shifted pair must retain getAmount() 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MINIMUM_DAY_COUNT
    category: BOUNDARY
    description: The LocalDate pair has exactly Integer.MIN_VALUE whole days between
      endpoints.
    preconditions:
    - sourceDateInclusive = LocalDate.of(1970, 1, 1).
    - endDateExclusive = sourceDateInclusive.minusDays(2147483648L).
    - Both endpoints plus 37 days remain valid LocalDate values.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns -2147483648.
    - Math.toIntExact succeeds and Days.getAmount() is Integer.MIN_VALUE.
    - The shifted pair must retain getAmount() -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_SUPPORTED_CHRONOLOGY
    category: EDGE
    description: Chronology-compatible JapaneseDate endpoints exercise a non-ISO Temporal
      implementation.
    preconditions:
    - Both endpoints are JapaneseDate values in the supported Japanese chronology.
    - ChronoUnit.DAYS.between supports the pair and the result is within the int range.
    - JapaneseDate.plus(37, ChronoUnit.DAYS) succeeds for both endpoints.
    expectedSourceBehavior:
    - Days.between uses ChronoUnit.DAYS.between on the JapaneseDate values.
    - getAmount() exposes the returned whole-day count independent of the chronology-specific
      date representation.
    - The shifted JapaneseDate pair is checked for the same amount.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_BUT_NON_BOUNDARY_LOCAL_DATE_GAPS
    category: NORMAL
    description: LocalDate endpoints are separated by large positive and negative
      counts that remain well inside the int range.
    preconditions:
    - Include a positive gap of 1000000 days.
    - Include a negative gap of 1000000 days.
    - Choose endpoints so both 37-day shifts remain valid.
    expectedSourceBehavior:
    - getAmount() equals 1000000 or -1000000 as returned by ChronoUnit.DAYS.between.
    - The cases exercise ordinary Days construction rather than the zero or one singleton
      paths.
    - The follow-up amount must equal the corresponding large source amount.
    targetCases: 2
    emptyOutputAllowed: false
