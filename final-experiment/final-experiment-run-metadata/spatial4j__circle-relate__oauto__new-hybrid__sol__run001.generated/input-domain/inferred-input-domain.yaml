InputDomain:
  summary: Valid circles and rectangles in one flat, non-geo SpatialContext, covering
    bounding-box shortcuts, phase-2 axis and corner branches, containment, tangency,
    degeneracy, zero radius, and empty-shape sentinels under the shared shift.
  globalConstraints:
  - The circle and the rectangle use the same SpatialContext, and that context is
    flat and non-geo.
  - For every non-empty circle, the center coordinates and radius are finite, and
    the radius is greater than or equal to 0.
  - For every non-empty rectangle, minX, maxX, minY, and maxY are finite, with minX
    <= maxX and minY <= maxY.
  - Every non-empty source center, rectangle endpoint, shifted center coordinate,
    and shifted rectangle endpoint is within the coordinate bounds accepted by the
    source circle's SpatialContext.
  - 'All arithmetic used by the follow-up transformation remains finite for non-empty
    inputs: centerX + 17.5, centerY - 9.25, minX + 17.5, maxX + 17.5, minY - 9.25,
    and maxY - 9.25.'
  - A non-empty circle's calculated enclosing box is finite and constructible in the
    same context before and after the shift.
  - 'Empty inputs, when used by an EDGE scenario, use the API''s empty sentinel representation:
    an empty Point for the circle center or a Rectangle whose four bounds are NaN;
    no partially-NaN shape is included.'
  - Except where an EDGE scenario explicitly requires an empty shape, both source
    shapes are non-empty.
  - Canonical coordinate examples are relative to the circle center (cx, cy); a condition
    such as rectangle [a,b] x [d,e] means [cx+a,cx+b] x [cy+d,cy+e].
  diversity:
    circleRadius:
    - '0'
    - '5'
    - positive finite non-boundary values
    rectangleDimension:
    - positive width and height
    - zero width
    - zero height
    - zero width and zero height
    boundingBoxRelation:
    - DISJOINT
    - WITHIN
    - CONTAINS
    - INTERSECTS
    - equal-box identity edge
    sourceRelation:
    - DISJOINT
    - WITHIN
    - CONTAINS
    - INTERSECTS
    centerPositionRelativeToRectangleX:
    - left of rectangle
    - inside rectangle x-range
    - right of rectangle
    centerPositionRelativeToRectangleY:
    - below rectangle
    - inside rectangle y-range
    - above rectangle
    contactType:
    - positive gap
    - side tangency
    - corner tangency
    - positive-area overlap
    - strict containment
    sentinelState:
    - both non-empty
    - empty circle
    - empty rectangle
    - both empty
  scenarios:
  - id: BBOX_DISJOINT_LEFT
    category: NORMAL
    description: The rectangle lies strictly to the left of the circle's enclosing
      box.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-9,cx-6] x [cy-1,cy+1].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(Rectangle) returns DISJOINT without phase-2 distance checks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_ABOVE
    category: NORMAL
    description: The rectangle lies strictly above the circle's enclosing box.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-2,cx+2] x [cy+6,cy+9].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(Rectangle) returns DISJOINT by the bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_STRICTLY_WITHIN_RECTANGLE
    category: NORMAL
    description: The rectangle strictly contains the circle's complete enclosing box.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-6,cx+6] x [cy-7,cy+7].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN.
    - relate(Rectangle) returns WITHIN without entering phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_WITHIN_RECTANGLE_SHARING_BOX_EDGE
    category: BOUNDARY
    description: The circle is within a rectangle that shares one complete enclosing-box
      edge.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-5,cx+6] x [cy-6,cy+6].
    expectedSourceBehavior:
    - The circle's enclosing box is WITHIN the rectangle despite the shared x boundary.
    - relate(Rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_EQUALS_CIRCLE_BOUNDING_BOX
    category: EDGE
    description: The rectangle is exactly equal to the circle's enclosing box.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-5,cx+5] x [cy-5,cy+5].
    expectedSourceBehavior:
    - enclosingBox.equals(rectangle) is true.
    - The explicit bounding-box identity edge returns WITHIN rather than proceeding
      to geometric corner containment.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHEAST_CORNER_OVERLAP_BUT_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the bounding box in the northeast corner but
      misses the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx+4,cx+5] x [cy+4,cy+5].
    - The closest rectangle corner has squared distance 32, greater than the squared
      radius 25.
    expectedSourceBehavior:
    - The x-axis is left of the rectangle and the y-axis is below it.
    - The phase-2 closest-corner test returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHWEST_CORNER_OVERLAP_BUT_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the bounding box in the northwest corner but
      misses the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-5,cx-4] x [cy+4,cy+5].
    expectedSourceBehavior:
    - The x-axis is right of the rectangle and the y-axis is below it.
    - The closest-corner test returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHEAST_CORNER_OVERLAP_BUT_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the bounding box in the southeast corner but
      misses the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx+4,cx+5] x [cy-5,cy-4].
    expectedSourceBehavior:
    - The x-axis is left of the rectangle and the y-axis is above it.
    - The closest-corner test returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_CORNER_OVERLAP_BUT_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the bounding box in the southwest corner but
      misses the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-5,cx-4] x [cy-5,cy-4].
    expectedSourceBehavior:
    - The x-axis is right of the rectangle and the y-axis is above it.
    - The closest-corner test returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSEST_CORNER_EXACTLY_TANGENT
    category: BOUNDARY
    description: A rectangle outside both center axes touches the circle at its closest
      corner.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx+3,cx+6] x [cy+4,cy+6].
    - Its closest corner is (cx+3,cy+4), exactly distance 5 from the center.
    expectedSourceBehavior:
    - contains(closestX,closestY) is true at equality, so the rectangle is not classified
      DISJOINT.
    - Because the bounding box does not contain the whole rectangle, relate(Rectangle)
      returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RIGHT_SIDE_EXTERNAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at the rightmost point while spanning
      the horizontal center axis.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx+5,cx+7] x [cy-1,cy+1].
    expectedSourceBehavior:
    - The rectangle spans the y-axis, so phase 2 does not use a diagonal closest-corner
      rejection.
    - relate(Rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TOP_SIDE_EXTERNAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at the topmost point while spanning
      the vertical center axis.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-1,cx+1] x [cy+5,cy+7].
    expectedSourceBehavior:
    - The rectangle spans the x-axis, preventing diagonal disjoint rejection.
    - relate(Rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_AXIS_OVERLAP
    category: NORMAL
    description: The rectangle crosses the circle's vertical axis and enters the upper
      part of the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-1,cx+1] x [cy+4,cy+6].
    expectedSourceBehavior:
    - xAxis equals closestX while yAxis is below the rectangle.
    - The shapes are not disjoint, and the non-containing bounding-box relation yields
      INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_AXIS_OVERLAP
    category: NORMAL
    description: The rectangle crosses the circle's horizontal axis and enters the
      right part of the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx+4,cx+6] x [cy-1,cy+1].
    expectedSourceBehavior:
    - yAxis equals closestY while xAxis is left of the rectangle.
    - relate(Rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CENTRAL_RECTANGLE_CONTAINED
    category: NORMAL
    description: A positive-area rectangle centered on the circle is wholly contained
      by it.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-1,cx+1] x [cy-1,cy+1].
    expectedSourceBehavior:
    - The circle's bounding box CONTAINS the rectangle.
    - The tie-breaking farthest corner is within the circle, so relate(Rectangle)
      returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHEAST_RECTANGLE_CONTAINED
    category: NORMAL
    description: A rectangle wholly northeast of the center is contained by the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx+1,cx+2] x [cy+1,cy+2].
    expectedSourceBehavior:
    - Both axes lie below or left of the rectangle, selecting its maximum x and maximum
      y as the farthest corner.
    - The selected farthest corner is contained, so the result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_RECTANGLE_CONTAINED
    category: NORMAL
    description: A rectangle wholly southwest of the center is contained by the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-2,cx-1] x [cy-2,cy-1].
    expectedSourceBehavior:
    - Both axes lie above or right of the rectangle, selecting its minimum x and minimum
      y as the farthest corner.
    - relate(Rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ASYMMETRIC_CROSS_AXIS_RECTANGLE_CONTAINED
    category: NORMAL
    description: A contained rectangle crosses both center axes with unequal extents.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-1,cx+2] x [cy-2,cy+1].
    expectedSourceBehavior:
    - For x the farther side is maxX, while for y the farther side is minY.
    - The selected farthest corner is inside the circle, yielding CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SYMMETRIC_FARTHEST_CORNER_TIES
    category: EDGE
    description: A symmetric contained rectangle makes both farthest-side comparisons
      tie.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-2,cx+2] x [cy-2,cy+2].
    expectedSourceBehavior:
    - Both strict greater-than comparisons are false on equal extents, selecting minX
      and minY.
    - The selected corner remains inside the circle and the result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_EXACTLY_ON_CIRCLE
    category: BOUNDARY
    description: The rectangle is contained with its selected farthest corner exactly
      on the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx,cx+3] x [cy,cy+4].
    - The farthest corner (cx+3,cy+4) is exactly distance 5 from the center.
    expectedSourceBehavior:
    - contains(farthestX,farthestY) is true at the radius boundary.
    - relate(Rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_CIRCLE_ONLY_INTERSECTS
    category: NORMAL
    description: The bounding box contains the rectangle, but a far corner lies outside
      the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx,cx+4] x [cy,cy+4].
    - The farthest corner has squared distance 32, greater than 25.
    expectedSourceBehavior:
    - bboxSect is CONTAINS.
    - The farthest-corner containment check fails and relate(Rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RIGHT_EDGE_POSITIVE_OVERLAP
    category: NORMAL
    description: A rectangle extends through the right side of the bounding box and
      overlaps the circle with positive area.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx+4,cx+6] x [cy-2,cy+2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS rather than CONTAINS.
    - The rectangle spans the y-axis and relate(Rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEFT_EDGE_POSITIVE_OVERLAP
    category: NORMAL
    description: A rectangle extends through the left side of the bounding box and
      overlaps the circle with positive area.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-6,cx-4] x [cy-2,cy+2].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - The rectangle spans the y-axis and relate(Rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTTOM_EDGE_POSITIVE_OVERLAP
    category: NORMAL
    description: A rectangle extends through the bottom side of the bounding box and
      overlaps the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle is [cx-2,cx+2] x [cy-6,cy-4].
    expectedSourceBehavior:
    - bboxSect is INTERSECTS.
    - The rectangle spans the x-axis and relate(Rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERIOR_POINT_RECTANGLE
    category: EDGE
    description: The rectangle degenerates to a point strictly inside the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle has minX=maxX=cx+1 and minY=maxY=cy+2.
    expectedSourceBehavior:
    - The bounding box contains the degenerate rectangle.
    - The sole point is contained, so relate(Rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDARY_POINT_RECTANGLE
    category: BOUNDARY
    description: The rectangle degenerates to a point exactly on the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle has minX=maxX=cx+3 and minY=maxY=cy+4.
    expectedSourceBehavior:
    - The sole point is accepted by contains at distance exactly equal to the radius.
    - relate(Rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_INTERIOR_POINT_OUTSIDE_CIRCLE
    category: EDGE
    description: The rectangle is a point inside the enclosing box but outside the
      circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle has minX=maxX=cx+4 and minY=maxY=cy+4.
    expectedSourceBehavior:
    - The bounding box contains the point rectangle.
    - The diagonal closest-point check rejects it and relate(Rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERIOR_VERTICAL_LINE_RECTANGLE
    category: EDGE
    description: The rectangle degenerates to a vertical line segment wholly inside
      the circle.
    preconditions:
    - Circle radius is 5.
    - Rectangle has minX=maxX=cx+1 and y-range [cy-2,cy+2].
    expectedSourceBehavior:
    - The bounding box contains the zero-width rectangle.
    - Its selected farthest endpoint is within the circle, so the result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAMETER_LINE_CROSSES_CIRCLE
    category: EDGE
    description: The rectangle degenerates to a vertical line crossing the entire
      circle and extending beyond its box.
    preconditions:
    - Circle radius is 5.
    - Rectangle has minX=maxX=cx and y-range [cy-6,cy+6].
    expectedSourceBehavior:
    - The line spans both center axes but is not contained by the circle's bounding
      box.
    - relate(Rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TANGENT_VERTICAL_LINE
    category: BOUNDARY
    description: A zero-width rectangle is tangent at the circle's rightmost point.
    preconditions:
    - Circle radius is 5.
    - Rectangle has minX=maxX=cx+5 and y-range [cy-2,cy+2].
    expectedSourceBehavior:
    - The line intersects the circle only at (cx+5,cy).
    - Its farthest endpoint is outside the circle, so the result is INTERSECTS rather
      than CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_WITHIN_RECTANGLE
    category: EDGE
    description: A zero-radius circle acts as a point strictly inside a positive-area
      rectangle.
    preconditions:
    - Circle radius is 0.
    - Rectangle is [cx-1,cx+1] x [cy-1,cy+1].
    expectedSourceBehavior:
    - The zero-area enclosing box is WITHIN the rectangle.
    - relate(Rectangle) returns WITHIN through the bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_FROM_RECTANGLE
    category: EDGE
    description: A zero-radius circle point is separated from the rectangle.
    preconditions:
    - Circle radius is 0.
    - Rectangle is [cx+1,cx+2] x [cy+1,cy+2].
    expectedSourceBehavior:
    - The zero-area enclosing box is DISJOINT from the rectangle.
    - relate(Rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUALS_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle's enclosing box equals a point rectangle at
      its center.
    preconditions:
    - Circle radius is 0.
    - Rectangle has minX=maxX=cx and minY=maxY=cy.
    expectedSourceBehavior:
    - enclosingBox.equals(rectangle) is true.
    - The identity edge returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_CIRCLE_NONEMPTY_RECTANGLE
    category: EDGE
    description: The circle uses an empty center while the rectangle is non-empty.
    preconditions:
    - circle.getCenter().isEmpty() is true.
    - The circle constructor has therefore set its radius to NaN and its enclosing
      rectangle to the all-NaN empty sentinel.
    - Rectangle is finite and non-empty.
    expectedSourceBehavior:
    - The direct Rectangle overload delegates first to the empty enclosing box's relate
      operation.
    - The empty geometry is DISJOINT from the non-empty rectangle.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONEMPTY_CIRCLE_EMPTY_RECTANGLE
    category: EDGE
    description: A finite non-empty circle is related directly to the empty rectangle
      sentinel.
    preconditions:
    - Circle radius is 5 and its center is non-empty.
    - rectangle.isEmpty() is true and all four rectangle bounds are NaN.
    expectedSourceBehavior:
    - The circle's enclosing box is DISJOINT from the empty rectangle.
    - relate(Rectangle) returns DISJOINT without meaningful phase-2 coordinate calculations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SHAPES_EMPTY
    category: EDGE
    description: Both the circle center and rectangle use their empty sentinels.
    preconditions:
    - circle.getCenter().isEmpty() is true.
    - rectangle.isEmpty() is true and all four rectangle bounds are NaN.
    expectedSourceBehavior:
    - The source comparison is resolved through the empty enclosing-box relation.
    - relate(Rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
