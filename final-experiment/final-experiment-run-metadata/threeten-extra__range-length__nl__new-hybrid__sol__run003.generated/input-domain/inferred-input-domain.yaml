InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be moved exactly
    23 days later and whose int-valued length can increase by exactly 23, including
    empty, calendar-boundary, constructor-path, large-length, and sentinel-transition
    cases.
  globalConstraints:
  - The source receiver is a successfully constructed LocalDateRange with non-null
    start S = getStart() and exclusive end E = getEnd(), satisfying S <= E.
  - 'The source is bounded at the start: S != LocalDate.MIN. Unbounded-start sources
    are excluded because lengthInDays() returns Integer.MAX_VALUE before and after
    moving a finite end, rather than increasing by 23.'
  - 'The source is bounded at the end: E != LocalDate.MAX. An unbounded end cannot
    be moved 23 days later within LocalDate, and its source lengthInDays() is the
    Integer.MAX_VALUE sentinel.'
  - Let D = E.toEpochDay() - S.toEpochDay(). Require 0 <= D <= Integer.MAX_VALUE -
    23 so both the source result D and the mathematically required follow-up result
    D + 23 are representable as int without saturation or overflow.
  - Require either E <= LocalDate.MAX.minusDays(24), or E = LocalDate.MAX.minusDays(23)
    and D = Integer.MAX_VALUE - 23. The first alternative keeps the shifted end finite;
    the second is the sole included transition to LocalDate.MAX for which the follow-up
    sentinel equals D + 23.
  - The follow-up is constructed by leaving S unchanged and replacing E with E.plusDays(23),
    equivalently withEnd(E.plusDays(23)); no other bound is changed.
  - Valid sources with E > LocalDate.MAX.minusDays(23) are excluded because E.plusDays(23)
    exceeds LocalDate.MAX. Sources with E = LocalDate.MAX.minusDays(23) and D != Integer.MAX_VALUE
    - 23 are excluded because the follow-up becomes unbounded and returns Integer.MAX_VALUE,
    which is not D + 23.
  - Valid bounded sources with D > Integer.MAX_VALUE - 23 are excluded because an
    int return value cannot be exactly 23 greater without exceeding Integer.MAX_VALUE
    or encountering the method's sentinel/saturation value.
  - No invalid constructor arguments, nulls, reversed ranges, unsupported Temporal
    values, or malformed parse strings are included because the metamorphic relation
    does not request invalid inputs.
  diversity:
    sourceLengthDays:
    - '0'
    - '1'
    - '2'
    - '7'
    - '14'
    - '22'
    - '23'
    - '24'
    - '28'
    - '29'
    - '30'
    - '31'
    - '90'
    - '91'
    - '92'
    - '181'
    - '182'
    - '184'
    - '365'
    - '366'
    - Integer.MAX_VALUE - 24
    - Integer.MAX_VALUE - 23
    constructionPath:
    - of(LocalDate, LocalDate)
    - of(LocalDate, Period)
    - ofClosed(LocalDate, LocalDate)
    - ofEmpty(LocalDate)
    - from(Temporal)
    - parse(CharSequence)
    temporalShape:
    - ordinary
    - empty
    - leap-day
    - month-boundary
    - year-boundary
    - proleptic-year
    - near-LocalDate-MIN
    - near-LocalDate-MAX
    - maximum-admissible-length
    - follow-up-unbounded-sentinel
    parseForm:
    - date/date
    - date/period
    - period/date
    fromTemporalBranch:
    - local-date-query
    - Year
    - YearMonth
    - YearHalf
    - YearQuarter
    - YearWeek
    followUpEndClass:
    - ordinary-finite
    - month-crossing
    - year-crossing
    - LocalDate.MAX.minusDays(1)
    - LocalDate.MAX
  scenarios:
  - id: EMPTY_RANGE_VIA_OF_EMPTY
    category: EDGE
    description: An empty source range is created with ofEmpty at an ordinary date.
    preconditions:
    - The receiver is LocalDateRange.ofEmpty(LocalDate.of(2024, 6, 15)).
    - getStart().equals(getEnd()).
    expectedSourceBehavior:
    - isEmpty() returns true.
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_VIA_HALF_OPEN_OF
    category: EDGE
    description: An empty source range is created by equal bounds through the half-open
      factory.
    preconditions:
    - The receiver is LocalDateRange.of(d, d) for d = LocalDate.of(2000, 1, 1).
    expectedSourceBehavior:
    - isEmpty() returns true.
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_VIA_ZERO_PERIOD
    category: EDGE
    description: A zero-length source is created through the non-negative Period construction
      path.
    preconditions:
    - The receiver is LocalDateRange.of(LocalDate.of(2024, 3, 10), Period.ZERO).
    expectedSourceBehavior:
    - getStart().equals(getEnd()).
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: The smallest non-empty half-open range has adjacent start and end
      dates.
    preconditions:
    - The receiver has S = 2024-06-15 and E = 2024-06-16.
    expectedSourceBehavior:
    - isEmpty() returns false.
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_JUST_BELOW_SHIFT
    category: BOUNDARY
    description: The source length is one day less than the 23-day transformation
      amount.
    preconditions:
    - E.toEpochDay() - S.toEpochDay() = 22.
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EQUAL_TO_SHIFT
    category: BOUNDARY
    description: The source length exactly equals the 23-day transformation amount.
    preconditions:
    - E.toEpochDay() - S.toEpochDay() = 23.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_JUST_ABOVE_SHIFT
    category: BOUNDARY
    description: The source length is one day greater than the transformation amount.
    preconditions:
    - E.toEpochDay() - S.toEpochDay() = 24.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SEVEN_DAY_RANGE
    category: NORMAL
    description: A complete seven-day source range exercises an ordinary finite duration.
    preconditions:
    - E.toEpochDay() - S.toEpochDay() = 7.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOURTEEN_DAY_PERIOD_RANGE
    category: NORMAL
    description: A two-week source is created through of(LocalDate, Period).
    preconditions:
    - The receiver is LocalDateRange.of(LocalDate.of(2024, 4, 1), Period.ofWeeks(2)).
    expectedSourceBehavior:
    - lengthInDays() returns 14.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_THIRTY_ONE_DAY_MONTH_END
    category: NORMAL
    description: The source crosses from January into February.
    preconditions:
    - S = 2024-01-30 and E = 2024-02-02.
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_THIRTY_DAY_MONTH_END
    category: NORMAL
    description: The source crosses from a 30-day month into the following month.
    preconditions:
    - S = 2024-04-29 and E = 2024-05-02.
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_LEAP_FEBRUARY_BOUNDARY
    category: BOUNDARY
    description: A one-day source crosses February 28 in a non-leap year.
    preconditions:
    - S = 2023-02-28 and E = 2023-03-01.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_FEBRUARY_SPAN
    category: BOUNDARY
    description: The source includes February 28 and February 29 of a leap year.
    preconditions:
    - S = 2024-02-28 and E = 2024-03-01.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_SINGLETON
    category: EDGE
    description: The source contains only February 29.
    preconditions:
    - S = 2024-02-29 and E = 2024-03-01.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_YEAR_BOUNDARY
    category: BOUNDARY
    description: A source crosses midnight between two ordinary calendar years.
    preconditions:
    - S = 2023-12-31 and E = 2024-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PROLEPTIC_YEAR_ZERO_BOUNDARY
    category: EDGE
    description: A source crosses the boundary into proleptic year zero.
    preconditions:
    - S = -0001-12-31 and E = 0000-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNIX_EPOCH_BOUNDARY
    category: NORMAL
    description: A source straddles the LocalDate epoch-day origin.
    preconditions:
    - S = 1969-12-31 and E = 1970-01-02.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_BOUNDED_START
    category: BOUNDARY
    description: The source starts at LocalDate.MIN.plusDays(1), the earliest start
      not treated as unbounded.
    preconditions:
    - S = LocalDate.MIN.plusDays(1).
    - E = LocalDate.MIN.plusDays(2).
    expectedSourceBehavior:
    - isUnboundedStart() returns false.
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATEST_ORDINARY_SHIFTABLE_END
    category: BOUNDARY
    description: The source end is the latest end whose 23-day shift remains finite
      rather than becoming LocalDate.MAX.
    preconditions:
    - E = LocalDate.MAX.minusDays(24).
    - S = LocalDate.MAX.minusDays(25).
    expectedSourceBehavior:
    - isUnboundedEnd() returns false.
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_ENDS_AT_MAX_MINUS_ONE
    category: EDGE
    description: Moving the near-maximum source end by 23 days yields LocalDate.MAX.minusDays(1).
    preconditions:
    - E = LocalDate.MAX.minusDays(24).
    - E.plusDays(23) = LocalDate.MAX.minusDays(1).
    - E.toEpochDay() - S.toEpochDay() = 24.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_LENGTH_BELOW_INT_CEILING
    category: BOUNDARY
    description: The source length is one below the largest length that may increase
      by 23.
    preconditions:
    - E.toEpochDay() - S.toEpochDay() = Integer.MAX_VALUE - 24.
    - E <= LocalDate.MAX.minusDays(24).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_ADMISSIBLE_SOURCE_LENGTH
    category: BOUNDARY
    description: The source has the largest length whose result can increase by exactly
      23 within int.
    preconditions:
    - E.toEpochDay() - S.toEpochDay() = Integer.MAX_VALUE - 23.
    - E <= LocalDate.MAX.minusDays(24).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_UNBOUNDED_END_SENTINEL_TRANSITION
    category: EDGE
    description: The shifted end becomes LocalDate.MAX, and the follow-up sentinel
      is exactly 23 greater than the source result.
    preconditions:
    - E = LocalDate.MAX.minusDays(23).
    - E.toEpochDay() - S.toEpochDay() = Integer.MAX_VALUE - 23.
    - E.plusDays(23) = LocalDate.MAX.
    expectedSourceBehavior:
    - isUnboundedEnd() returns false.
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DAY_RANGE
    category: BOUNDARY
    description: A closed range with equal inclusive bounds becomes a non-empty one-day
      internal half-open range.
    preconditions:
    - The receiver is LocalDateRange.ofClosed(2024-06-01, 2024-06-01).
    expectedSourceBehavior:
    - isEmpty() returns false.
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_FULL_MONTH_RANGE
    category: NORMAL
    description: A closed range covers every day of a 31-day month.
    preconditions:
    - The receiver is LocalDateRange.ofClosed(2024-01-01, 2024-01-31).
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_FEBRUARY_RANGE
    category: BOUNDARY
    description: A closed range covers all 29 days of February in a leap year.
    preconditions:
    - The receiver is LocalDateRange.ofClosed(2024-02-01, 2024-02-29).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_MONTH_FROM_MONTH_END
    category: EDGE
    description: A one-month Period is added to January 31 in a leap year.
    preconditions:
    - The receiver is LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1)).
    - getEnd() = 2024-02-29.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_MONTH_FROM_SHORT_MONTH
    category: EDGE
    description: A one-month Period starts on the last day of leap-year February.
    preconditions:
    - The receiver is LocalDateRange.of(LocalDate.of(2024, 2, 29), Period.ofMonths(1)).
    - getEnd() = 2024-03-29.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_YEAR_FROM_LEAP_DAY
    category: EDGE
    description: A one-year Period adjusts a leap-day start into a non-leap year.
    preconditions:
    - The receiver is LocalDateRange.of(LocalDate.of(2024, 2, 29), Period.ofYears(1)).
    - getEnd() = 2025-02-28.
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_QUERY_BRANCH
    category: NORMAL
    description: from(Temporal) receives a Temporal that supplies a LocalDate and
      creates a one-day range.
    preconditions:
    - The receiver is LocalDateRange.from(LocalDate.of(2024, 5, 20)).
    expectedSourceBehavior:
    - getStart() = 2024-05-20 and getEnd() = 2024-05-21.
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_COMMON
    category: NORMAL
    description: from(Temporal) converts a common Year to its complete date range.
    preconditions:
    - The receiver is LocalDateRange.from(Year.of(2023)).
    expectedSourceBehavior:
    - getStart() = 2023-01-01 and getEnd() = 2024-01-01.
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_LEAP
    category: BOUNDARY
    description: from(Temporal) converts a leap Year to its complete date range.
    preconditions:
    - The receiver is LocalDateRange.from(Year.of(2024)).
    expectedSourceBehavior:
    - getStart() = 2024-01-01 and getEnd() = 2025-01-01.
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARMONTH_COMMON_FEBRUARY
    category: BOUNDARY
    description: from(Temporal) converts a non-leap February YearMonth.
    preconditions:
    - The receiver is LocalDateRange.from(YearMonth.of(2023, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARMONTH_LEAP_FEBRUARY
    category: BOUNDARY
    description: from(Temporal) converts a leap February YearMonth.
    preconditions:
    - The receiver is LocalDateRange.from(YearMonth.of(2024, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARHALF_FIRST_LEAP_HALF
    category: NORMAL
    description: from(Temporal) converts the first YearHalf of a leap year.
    preconditions:
    - The supplied Temporal is a YearHalf covering 2024-01-01 through 2024-06-30.
    - The receiver is the result of LocalDateRange.from on that Temporal.
    expectedSourceBehavior:
    - getStart() = 2024-01-01 and getEnd() = 2024-07-01.
    - lengthInDays() returns 182.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARHALF_SECOND_HALF
    category: NORMAL
    description: from(Temporal) converts a second YearHalf, covering a different month
      composition.
    preconditions:
    - The supplied Temporal is a YearHalf covering 2023-07-01 through 2023-12-31.
    - The receiver is the result of LocalDateRange.from on that Temporal.
    expectedSourceBehavior:
    - getStart() = 2023-07-01 and getEnd() = 2024-01-01.
    - lengthInDays() returns 184.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARQUARTER_LEAP_Q1
    category: BOUNDARY
    description: from(Temporal) converts a first quarter containing leap day.
    preconditions:
    - The supplied Temporal is a YearQuarter covering 2024-01-01 through 2024-03-31.
    - The receiver is the result of LocalDateRange.from on that Temporal.
    expectedSourceBehavior:
    - getStart() = 2024-01-01 and getEnd() = 2024-04-01.
    - lengthInDays() returns 91.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARQUARTER_THIRTY_DAY_MIX
    category: NORMAL
    description: from(Temporal) converts a quarter containing 30-day and 31-day months.
    preconditions:
    - The supplied Temporal is a YearQuarter covering 2024-04-01 through 2024-06-30.
    - The receiver is the result of LocalDateRange.from on that Temporal.
    expectedSourceBehavior:
    - getStart() = 2024-04-01 and getEnd() = 2024-07-01.
    - lengthInDays() returns 91.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEARWEEK
    category: NORMAL
    description: from(Temporal) converts a YearWeek from Monday through Sunday.
    preconditions:
    - The supplied Temporal is a valid YearWeek whose Monday and Sunday are at least
      23 days before LocalDate.MAX.
    - The receiver is the result of LocalDateRange.from on that Temporal.
    expectedSourceBehavior:
    - The exclusive end is the day after the YearWeek Sunday.
    - lengthInDays() returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_FORM
    category: NORMAL
    description: parse(CharSequence) uses the date/date branch with an exclusive end.
    preconditions:
    - The receiver is LocalDateRange.parse("2024-01-01/2024-01-10").
    expectedSourceBehavior:
    - getStart() = 2024-01-01 and getEnd() = 2024-01-10.
    - lengthInDays() returns 9.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD_FORM
    category: NORMAL
    description: parse(CharSequence) uses the date/period branch.
    preconditions:
    - The receiver is LocalDateRange.parse("2024-01-31/P1M").
    expectedSourceBehavior:
    - getStart() = 2024-01-31 and getEnd() = 2024-02-29.
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE_FORM
    category: NORMAL
    description: parse(CharSequence) uses the period/date branch and subtracts the
      period from the end.
    preconditions:
    - The receiver is LocalDateRange.parse("P1M/2024-03-31").
    expectedSourceBehavior:
    - getStart() = 2024-02-29 and getEnd() = 2024-03-31.
    - lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_EMPTY_DATE_DATE_FORM
    category: EDGE
    description: The date/date parser creates an empty range when both parsed dates
      are equal.
    preconditions:
    - The receiver is LocalDateRange.parse("2024-08-20/2024-08-20").
    expectedSourceBehavior:
    - isEmpty() returns true.
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NINETY_DAY_FINITE_RANGE
    category: NORMAL
    description: An ordinary multi-month source has a 90-day epoch-day difference.
    preconditions:
    - E.toEpochDay() - S.toEpochDay() = 90.
    - S and E are ordinary finite dates.
    expectedSourceBehavior:
    - lengthInDays() returns 90.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_HUNDRED_EIGHTY_ONE_DAY_RANGE
    category: NORMAL
    description: A finite source exercises a medium duration distinct from whole-year
      and constructor-derived halves.
    preconditions:
    - E.toEpochDay() - S.toEpochDay() = 181.
    expectedSourceBehavior:
    - lengthInDays() returns 181.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_COMMON_YEAR_LENGTH
    category: NORMAL
    description: A half-open source directly represents a complete common year.
    preconditions:
    - S = 2022-01-01 and E = 2023-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_LEAP_YEAR_LENGTH
    category: BOUNDARY
    description: A half-open source directly represents a complete leap year.
    preconditions:
    - S = 2024-01-01 and E = 2025-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
