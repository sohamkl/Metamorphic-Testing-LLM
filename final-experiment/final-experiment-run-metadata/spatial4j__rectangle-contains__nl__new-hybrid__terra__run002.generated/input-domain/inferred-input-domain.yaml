InputDomain:
  summary: Finite geographic rectangles and points with canonical longitude inputs,
    exercising latitude rejection, inclusive edges, non-wrapping longitude handling,
    dateline-unwrapping, longitude aliasing at ±180, degenerate rectangles, polar
    latitude limits, and rotations that change whether the rectangle crosses the dateline.
  globalConstraints:
  - Use a SpatialContext for which ctx.isGeo() is true; the target's longitude-unwrapping
    logic and the stated 150-degree longitude rotation relation are specific to this
    branch.
  - 'Receiver coordinates and point coordinates are finite doubles: minX, maxX, point.x
    in [-180, 180], and minY, maxY, point.y in [-90, 90].'
  - Use minY <= maxY, matching the reset assertion in RectangleImpl; do not generate
    inverted latitude ranges.
  - The point argument is a non-null Point instance whose getX() and getY() return
    the stated finite coordinates; relate(Point) has no null handling.
  - For every source case, construct the follow-up by applying W(v) = the unique longitude
    in [-180, 180) congruent to v + 150 modulo 360 to minX, maxX, and point.x; retain
    all latitude values unchanged.
  - Exclude rectangles with maxX - minX = 360, including [-180, 180]. They are reachable,
    but independently canonicalizing both endpoints for the required follow-up collapses
    the full-world interval to one longitude, so the supplied transformation does
    not represent the same box.
  diversity:
    longitudeTopology:
    - distinct
    - measurable
    - non-wrapping minX <= maxX; dateline-wrapping minX > maxX; zero-width; narrow
      wrap; wide wrap; ±180 longitude aliases; source-to-follow-up crossing-status
      changes
    latitudePosition:
    - distinct
    - measurable
    - strict interior; minY boundary; maxY boundary; both latitude boundaries; below
      minY; above maxY; zero-height; south pole; north pole; full [-90,90] band
    longitudeDecisionPath:
    - distinct
    - measurable
    - direct geo short-circuit; pX < minX then +360; pX > maxX then -360; shifted
      containment; shifted disjointness
    sourceOutcome:
    - distinct
    - measurable
    - SpatialRelation.CONTAINS and SpatialRelation.DISJOINT
  scenarios:
  - id: NONWRAP_STRICT_INTERIOR
    category: NORMAL
    description: A point is strictly inside an ordinary non-wrapping rectangle.
    preconditions:
    - RectangleImpl coordinates are minX=-40, maxX=40, minY=-20, maxY=20.
    - Point coordinates are x=0, y=0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the geo longitude short-circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_MIN_X_BOUNDARY
    category: BOUNDARY
    description: A point lies exactly on the western longitude edge of a non-wrapping
      rectangle.
    preconditions:
    - RectangleImpl coordinates are minX=-40, maxX=40, minY=-20, maxY=20.
    - Point coordinates are x=-40, y=0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because longitude boundaries are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_MAX_X_BOUNDARY
    category: BOUNDARY
    description: A point lies exactly on the eastern longitude edge of a non-wrapping
      rectangle.
    preconditions:
    - RectangleImpl coordinates are minX=-40, maxX=40, minY=-20, maxY=20.
    - Point coordinates are x=40, y=0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because longitude boundaries are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_MIN_Y_BOUNDARY
    category: BOUNDARY
    description: A point lies exactly on the southern latitude edge.
    preconditions:
    - RectangleImpl coordinates are minX=-40, maxX=40, minY=-20, maxY=20.
    - Point coordinates are x=0, y=-20.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because the initial latitude rejection uses strict
      comparisons.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_MAX_Y_BOUNDARY
    category: BOUNDARY
    description: A point lies exactly on the northern latitude edge.
    preconditions:
    - RectangleImpl coordinates are minX=-40, maxX=40, minY=-20, maxY=20.
    - Point coordinates are x=0, y=20.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because the initial latitude rejection uses strict
      comparisons.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_LOWER_LEFT_CORNER
    category: BOUNDARY
    description: A point equals both minimum rectangle coordinates.
    preconditions:
    - RectangleImpl coordinates are minX=-40, maxX=40, minY=-20, maxY=20.
    - Point coordinates are x=-40, y=-20.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS at the lower-left corner.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_LOWER_RIGHT_CORNER
    category: BOUNDARY
    description: A point equals maxX and minY.
    preconditions:
    - RectangleImpl coordinates are minX=-40, maxX=40, minY=-20, maxY=20.
    - Point coordinates are x=40, y=-20.
    expectedSourceBehavior:
