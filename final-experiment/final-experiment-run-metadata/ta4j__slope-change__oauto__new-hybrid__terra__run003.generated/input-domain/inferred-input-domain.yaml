InputDomain:
  summary: Valid begin-zero BarSeries inputs for public SlopeChangeSwingDetector configurations,
    emphasizing loop bounds, slope-sign transitions, persistence, extreme-price selection,
    ATR filtering, same-type pivot consolidation, index clamping, and swing construction.
    Each source series is translated by +100 according to the supplied MR.
  globalConstraints:
  - sourceSeries.getBeginIndex() == 0, including empty series, because generateFollowUp
    rejects any source series with a nonzero begin index.
  - detector is a nonnull SlopeChangeSwingDetector created through a public constructor;
    all scenarios use the observable parameters w=detector.getConfig().window(), c=detector.getConfig().confirmationBars(),
    a=detector.getConfig().atrPeriod(), m=detector.getConfig().minSlopeChange(), and
    r=detector.getConfig().minAtrReversal().
  - degree is any nonnull ElliottDegree value; retain the same degree in the source
    and follow-up invocation because the MR requires every ElliottSwing degree to
    remain equal.
  - Every nonempty series consists of successfully constructible BaseBar values with
    finite open, high, low, close, volume, and amount values; low <= min(open, close)
    <= max(open, close) <= high; and strictly increasing bar times.
  - Every source price, source amount, source volume, source price + 100, and source
    amount + 100 * source volume is finite and representable by the series Num factory.
    This is required because the follow-up builder performs those additions and assertRelation
    rejects non-finite pivot and swing prices.
  - For a nonempty series, candidate indices are exactly C = [w - 1, endIndex - w
    - c + 1], where endIndex = max(0, min(index, series.getEndIndex())). A candidate
    is eligible only when its two w-bar close slopes are finite, their absolute difference
    is at least m, their signs identify HIGH or LOW, and every required post-window
    slope has the required sign.
  - 'No NaN, infinity, malformed BaseBar, null series, null degree, or intentionally
    invalid index behavior is included: the metamorphic relation requests valid source
    inputs and does not specify an invalid-input relation.'
  diversity:
    seriesSizeAndLoopBounds:
    - empty
    - fewer than 2*w+c-1 bars
    - exactly 2*w+c-1 bars
    - multiple candidate indices
    effectiveIndex:
    - negative index clamped to 0
    - index inside series
    - index equal to end index
    - index above end clamped to end
    slopeOutcome:
    - zero one-point slopes
    - same-sign slopes
    - slope change below threshold
    - HIGH transition
    - LOW transition
    - failed HIGH persistence
    - failed LOW persistence
    pivotSelection:
    - high at transition start
    - low at transition start
    - interior extreme high
    - interior extreme low
    - tied extreme retaining earliest index
    pivotPostProcessing:
    - first pivot accepted
    - alternating pivots appended
    - stronger same-type HIGH replaces prior HIGH
    - weaker same-type HIGH retained prior HIGH
    - stronger same-type LOW replaces prior LOW
    - weaker same-type LOW retained prior LOW
    - ATR-magnitude rejection
    - zero ATR multiplier bypass
    outputShape:
    - no pivots and no swings
    - one pivot and no swings
    - two pivots and one swing
    - three pivots and two swings
  scenarios:
  - id: EMPTY_SERIES_EARLY_RETURN
    category: BOUNDARY
    description: Empty begin-zero series exercises the explicit series.isEmpty() return.
    preconditions:
    - sourceSeries.isEmpty() is true
    - sourceSeries.getBeginIndex() == 0
    - index is any int, including values below and above zero
    expectedSourceBehavior:
    - detect returns zero pivots
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: true
  - id: INDEX_BELOW_BEGIN_CLAMPS_WITHOUT_CANDIDATE
    category: EDGE
    description: A nonempty series is evaluated with a negative index, so endIndex
      clamps to zero.
    preconditions:
    - sourceSeries has at least one bar
    - index < 0
    - w >= 1
    - endIndex == 0 and lastCandidate < firstCandidate
    expectedSourceBehavior:
    - detect returns zero pivots because the candidate loop is not entered
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: true
  - id: ONE_BAR_SHORT_OF_FIRST_CANDIDATE
    category: BOUNDARY
    description: Series ends immediately before the minimum length needed for any
      candidate.
    preconditions:
    - index >= sourceSeries.getEndIndex()
    - sourceSeries.getBarCount() == 2*w+c-2
    - lastCandidate == firstCandidate-1
    expectedSourceBehavior:
    - detect returns zero pivots without evaluating slope transitions
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: true
  - id: EXACT_MINIMUM_LENGTH_SINGLE_HIGH
    category: BOUNDARY
    description: Exactly one candidate is available and confirms an initial HIGH pivot.
    preconditions:
    - index == sourceSeries.getEndIndex()
    - sourceSeries.getBarCount() == 2*w+c-1
    - C contains exactly candidate w-1
    - the before slope at candidate w-1 is positive
    - the after slope at candidate w-1 is negative
    - every required confirmation slope is negative
    - the high extreme in [w-1, 2*w-2] is finite
    expectedSourceBehavior:
    - detect returns exactly one HIGH pivot at the maximum high of the transition
      interval
    - detect returns zero swings because fewer than two pivots exist
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_MINIMUM_LENGTH_SINGLE_LOW
    category: BOUNDARY
    description: Exactly one candidate is available and confirms an initial LOW pivot.
    preconditions:
    - index == sourceSeries.getEndIndex()
    - sourceSeries.getBarCount() == 2*w+c-1
    - C contains exactly candidate w-1
    - the before slope at candidate w-1 is negative
    - the after slope at candidate w-1 is positive
    - every required confirmation slope is positive
    - the low extreme in [w-1, 2*w-2] is finite
    expectedSourceBehavior:
    - detect returns exactly one LOW pivot at the minimum low of the transition interval
    - detect returns zero swings because fewer than two pivots exist
    targetCases: 1
    emptyOutputAllowed: false
  - id: WINDOW_ONE_ZERO_SLOPE
    category: EDGE
    description: A valid detector configuration with window one makes every regression
      denominator zero.
    preconditions:
    - w == 1
    - sourceSeries has enough bars that C is nonempty
    - index >= sourceSeries.getEndIndex()
    expectedSourceBehavior:
    - every before and after slope is zero
    - detect returns zero pivots because no zero slope is positive or negative
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: true
  - id: SAME_DIRECTION_SLOPES
    category: NORMAL
    description: Candidate windows have finite slopes with the same nonzero sign.
    preconditions:
    - w > 1
    - C is nonempty
    - every candidate whose slope-change magnitude reaches m has before and after
      slopes both positive or both negative
    expectedSourceBehavior:
    - detect returns zero pivots because no candidate identifies HIGH or LOW
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_STRICTLY_BELOW_THRESHOLD
    category: BOUNDARY
    description: A sign-changing close pattern exists but its slope difference is
      strictly below minSlopeChange.
    preconditions:
    - w > 1
    - m > 0
    - C is nonempty
    - at least one candidate has opposite-sign finite before and after slopes
    - for every candidate, abs(beforeSlope-afterSlope) < m
    expectedSourceBehavior:
    - detect returns zero pivots because every candidate is rejected by the strict
      magnitude comparison
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: true
  - id: HIGH_PERSISTENCE_FAILURE
    category: NORMAL
    description: A HIGH sign transition occurs, but a required post-window slope is
      zero or nonnegative.
    preconditions:
    - w > 1
    - exactly one candidate passes the finite-slope and minimum-slope-change checks
    - that candidate has positive before slope and negative after slope
    - c > 0
    - at least one slope inspected by persists for that candidate is zero or positive
    expectedSourceBehavior:
    - detect returns zero pivots because the HIGH transition does not persist
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: true
  - id: LOW_PERSISTENCE_FAILURE
    category: NORMAL
    description: A LOW sign transition occurs, but a required post-window slope is
      zero or nonpositive.
    preconditions:
    - w > 1
    - exactly one candidate passes the finite-slope and minimum-slope-change checks
    - that candidate has negative before slope and positive after slope
    - c > 0
    - at least one slope inspected by persists for that candidate is zero or negative
    expectedSourceBehavior:
    - detect returns zero pivots because the LOW transition does not persist
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: true
  - id: HIGH_INTERIOR_EXTREME
    category: NORMAL
    description: A confirmed HIGH chooses a high strictly inside, rather than at an
      endpoint of, its transition interval.
    preconditions:
    - exactly one candidate is eligible and passes persistence
    - its type is HIGH
    - its transition interval contains a unique maximum high at an index strictly
      between candidate and candidate+w-1
    expectedSourceBehavior:
    - detect returns exactly one HIGH pivot
    - the pivot index is the unique interior maximum-high index
    - the pivot price equals that bar high
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOW_INTERIOR_EXTREME
    category: NORMAL
    description: A confirmed LOW chooses a low strictly inside, rather than at an
      endpoint of, its transition interval.
    preconditions:
    - exactly one candidate is eligible and passes persistence
    - its type is LOW
    - its transition interval contains a unique minimum low at an index strictly between
      candidate and candidate+w-1
    expectedSourceBehavior:
    - detect returns exactly one LOW pivot
    - the pivot index is the unique interior minimum-low index
    - the pivot price equals that bar low
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_TIED_EXTREME_EARLIEST_INDEX
    category: EDGE
    description: Equal maximum highs verify the strict greater-than comparison in
      extremePivot.
    preconditions:
    - exactly one candidate is eligible and passes persistence
    - its type is HIGH
    - two or more bars in its transition interval share the maximum high
    - the earliest maximum-high bar precedes every other maximum-high bar
    expectedSourceBehavior:
    - detect returns exactly one HIGH pivot
    - the pivot index is the earliest index having the maximum high
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOW_TIED_EXTREME_EARLIEST_INDEX
    category: EDGE
    description: Equal minimum lows verify the strict less-than comparison in extremePivot.
    preconditions:
    - exactly one candidate is eligible and passes persistence
    - its type is LOW
    - two or more bars in its transition interval share the minimum low
    - the earliest minimum-low bar precedes every other minimum-low bar
    expectedSourceBehavior:
    - detect returns exactly one LOW pivot
    - the pivot index is the earliest index having the minimum low
    targetCases: 1
    emptyOutputAllowed: false
  - id: ALTERNATING_HIGH_LOW_CREATES_SWING
    category: NORMAL
    description: Two accepted candidates of opposite type exercise pivot append and
      SwingDetectorResult.fromPivots.
    preconditions:
    - exactly two candidates pass all slope, persistence, extreme, and magnitude checks
    - the first accepted pivot is HIGH and the second accepted pivot is LOW
    - no other candidate is accepted
    expectedSourceBehavior:
    - detect returns two pivots in candidate order, HIGH then LOW
    - detect returns exactly one swing joining those two pivot indices
    - the swing degree equals degree
    targetCases: 1
    emptyOutputAllowed: false
  - id: THREE_ALTERNATING_PIVOTS_CREATE_TWO_SWINGS
    category: NORMAL
    description: Three accepted alternating pivots verify ordered consecutive swing
      construction.
    preconditions:
    - exactly three candidates pass all slope, persistence, extreme, and magnitude
      checks
    - accepted pivot types are HIGH, LOW, HIGH in increasing candidate order
    - no other candidate is accepted
    expectedSourceBehavior:
    - detect returns three ordered pivots with types HIGH, LOW, HIGH
    - detect returns exactly two swings joining pivot 0 to 1 and pivot 1 to 2
    - both swings retain the supplied degree
    targetCases: 1
    emptyOutputAllowed: false
  - id: STRONGER_CONSECUTIVE_HIGH_REPLACES
    category: NORMAL
    description: A later accepted HIGH is higher than the retained HIGH and replaces
      it rather than appending.
    preconditions:
    - exactly two candidates pass all checks including magnitude filtering
    - both candidate pivots have type HIGH
    - the second pivot price is greater than the first pivot price
    - no accepted LOW occurs between them
    expectedSourceBehavior:
    - detect returns exactly one pivot
    - the retained pivot is the second, higher HIGH
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: false
  - id: WEAKER_CONSECUTIVE_HIGH_IS_RETAINED
    category: NORMAL
    description: A later accepted HIGH is not higher than the retained HIGH and therefore
      changes nothing.
    preconditions:
    - exactly two candidates pass all checks including magnitude filtering
    - both candidate pivots have type HIGH
    - the second pivot price is less than or equal to the first pivot price
    - no accepted LOW occurs between them
    expectedSourceBehavior:
    - detect returns exactly one pivot
    - the retained pivot is the first HIGH
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: false
  - id: STRONGER_CONSECUTIVE_LOW_REPLACES
    category: NORMAL
    description: A later accepted LOW is lower than the retained LOW and replaces
      it rather than appending.
    preconditions:
    - exactly two candidates pass all checks including magnitude filtering
    - both candidate pivots have type LOW
    - the second pivot price is less than the first pivot price
    - no accepted HIGH occurs between them
    expectedSourceBehavior:
    - detect returns exactly one pivot
    - the retained pivot is the second, lower LOW
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: false
  - id: WEAKER_CONSECUTIVE_LOW_IS_RETAINED
    category: NORMAL
    description: A later accepted LOW is not lower than the retained LOW and therefore
      changes nothing.
    preconditions:
    - exactly two candidates pass all checks including magnitude filtering
    - both candidate pivots have type LOW
    - the second pivot price is greater than or equal to the first pivot price
    - no accepted HIGH occurs between them
    expectedSourceBehavior:
    - detect returns exactly one pivot
    - the retained pivot is the first LOW
    - detect returns zero swings
    targetCases: 1
    emptyOutputAllowed: false
  - id: ATR_FILTER_REJECTS_SECOND_PIVOT
    category: NORMAL
    description: An otherwise confirmed opposite-type candidate is rejected because
      its reversal is smaller than ATR times the configured multiplier.
    preconditions:
    - r > 0
    - one first pivot is accepted
    - exactly one later opposite-type candidate passes slope, persistence, and extreme
      selection
    - ATR at the later candidate pivot index is finite
    - abs(laterPivotPrice-firstPivotPrice) < ATR(laterPivotIndex)*r
    - no other candidate is accepted
    expectedSourceBehavior:
    - detect retains only the first pivot
    - detect returns zero swings because the ATR filter rejects the later candidate
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_ATR_MULTIPLIER_BYPASSES_FILTER
    category: EDGE
    description: A zero configured ATR multiplier accepts a small opposite-type reversal
      without requiring finite ATR.
    preconditions:
    - r == 0
    - one first pivot is accepted
    - exactly one later opposite-type candidate passes slope, persistence, and extreme
      selection
    - abs(laterPivotPrice-firstPivotPrice) is positive but arbitrarily smaller than
      any positive ATR value at the later pivot index
    - no other candidate is accepted
    expectedSourceBehavior:
    - detect returns both opposite-type pivots because multiplier.isZero() bypasses
      ATR comparison
    - detect returns exactly one swing joining the two pivots
    targetCases: 1
    emptyOutputAllowed: false
  - id: INDEX_ABOVE_END_CLAMPS_TO_FULL_SERIES
    category: EDGE
    description: An index greater than the last bar is clamped to the end while preserving
      a nonempty detected result.
    preconditions:
    - index > sourceSeries.getEndIndex()
    - sourceSeries has a nonempty pivot result when detect is evaluated at sourceSeries.getEndIndex()
    - all accepted candidates lie at or before sourceSeries.getEndIndex()
    expectedSourceBehavior:
    - detect(index) has the same pivots and swings as detect(sourceSeries.getEndIndex())
    - detect returns at least one pivot
    targetCases: 1
    emptyOutputAllowed: false
