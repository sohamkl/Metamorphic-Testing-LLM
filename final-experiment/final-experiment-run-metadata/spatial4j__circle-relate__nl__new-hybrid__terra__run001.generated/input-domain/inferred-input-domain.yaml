InputDomain:
  summary: Finite, non-empty Cartesian circle/rectangle pairs in one non-geo SpatialContext,
    with a non-zero common translation applied to the circle center and every rectangle
    bound. Cases cover bounding-box shortcuts, phase-2 closest/farthest-corner decisions,
    tangencies, degenerate rectangles, and zero-radius circles.
  globalConstraints:
  - Use one non-geo SpatialContext for the source and follow-up pair.
  - Circle center, radius, rectangle bounds, and translation components are finite
    numeric values.
  - Circle radius is greater than or equal to 0; negative-radius behavior is not defined
    by the supplied source because the constructor assumes prior parameter validation.
  - Rectangle bounds satisfy minX <= maxX and minY <= maxY.
  - Source and follow-up circles and rectangles are non-empty. Empty shapes are excluded
    because an empty circle has no finite center to slide and the supplied relation
    returns DISJOINT before geometric processing.
  - Choose a translation (dx, dy) with dx != 0 or dy != 0 such that translated center
    (cx+dx, cy+dy) and translated rectangle bounds remain valid in the same SpatialContext.
  - Construct the follow-up by adding exactly dx to circle center X, rectangle minX,
    and rectangle maxX, and exactly dy to circle center Y, rectangle minY, and rectangle
    maxY; preserve radius, rectangle width, and rectangle height.
  diversity:
    boundingBoxRelation:
    - DISJOINT
    - WITHIN
    - CONTAINS
    - INTERSECTS
    - exact enclosing-box equality
    phase2AxisLocation:
    - center left of rectangle
    - center right of rectangle
    - center below rectangle
    - center above rectangle
    - center inside X span
    - center inside Y span
    geometricOutcome:
    - DISJOINT
    - WITHIN
    - CONTAINS
    - INTERSECTS
    boundaryType:
    - strict separation
    - circle-rectangle tangency
    - farthest-corner tangency
    - zero-width rectangle
    - zero-height rectangle
    - point rectangle
    - zero-radius circle
  scenarios:
  - id: BBOX_DISJOINT_HORIZONTAL
    category: NORMAL
    description: Circle C=(0,0), radius 5, with a rectangle wholly to the right of
      the enclosing box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [6,7] x [-1,1].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT without phase-2 distance checks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_LARGE_RECTANGLE
    category: NORMAL
    description: The complete circle enclosing box lies strictly inside the rectangle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-6,6] x [-6,6].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_EQUALS_RECTANGLE_SPECIAL_WITHIN
    category: EDGE
    description: Rectangle has exactly the same bounds as the circle enclosing box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is exactly [-5,5] x [-5,5].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - enclosingBox.equals(rectangle) is true.
    - relate(rectangle) returns WITHIN through the exact-enclosing-box special case.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_DIAGONAL_DISJOINT_NORTHEAST
    category: NORMAL
    description: Rectangle overlaps the enclosing-box northeast corner but its closest
      geometric corner is outside the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [4,5] x [4,5].
    - Distance from (0,0) to closest rectangle corner (4,4) is greater than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - relateRectanglePhase2 tests closest corner (4,4).
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_DIAGONAL_DISJOINT_NORTHWEST
    category: NORMAL
    description: Northwest diagonal version of the closest-corner disjoint path.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-5,-4] x [4,5].
    - Distance from (0,0) to closest rectangle corner (-4,4) is greater than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - Phase 2 selects rectangle maxX and minY as the closest corner coordinates.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_DIAGONAL_DISJOINT_SOUTHWEST
    category: NORMAL
    description: Southwest diagonal version of the closest-corner disjoint path.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-5,-4] x [-5,-4].
    - Distance from (0,0) to closest rectangle corner (-4,-4) is greater than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - Phase 2 selects rectangle maxX and maxY as the closest corner coordinates.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_DIAGONAL_DISJOINT_SOUTHEAST
    category: NORMAL
    description: Southeast diagonal version of the closest-corner disjoint path.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [4,5] x [-5,-4].
    - Distance from (0,0) to closest rectangle corner (4,-4) is greater than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - Phase 2 selects rectangle minX and maxY as the closest corner coordinates.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_HORIZONTAL_AXIS_SPAN
    category: NORMAL
    description: Rectangle spans the circle X axis but lies above the center.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-1,1] x [4,6].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - Phase 2 has closestX equal to the circle X axis.
    - relate(rectangle) returns INTERSECTS without the diagonal closest-corner disjoint
      return.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_VERTICAL_AXIS_SPAN
    category: NORMAL
    description: Rectangle spans the circle Y axis but lies to the right of the center.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [4,6] x [-1,1].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - Phase 2 has closestY equal to the circle Y axis.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_BOTH_AXES_SPANNED
    category: NORMAL
    description: Rectangle spans both center axes but cannot contain the full enclosing
      box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-6,6] x [-1,1].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - Both closest-axis values equal the circle center coordinates.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_EXTERNAL_TANGENCY_NORTHEAST
    category: BOUNDARY
    description: Rectangle touches the circle at its southwest corner while overlapping
      the enclosing box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [3,4] x [4,5].
    - Distance from (0,0) to closest rectangle corner (3,4) equals 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - contains(3,4) is true at the circle boundary.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_EXTERNAL_TANGENCY_SOUTHWEST
    category: BOUNDARY
    description: Rectangle touches the circle at its northeast corner while overlapping
      the enclosing box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-4,-3] x [-5,-4].
    - Distance from (0,0) to closest rectangle corner (-3,-4) equals 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - contains(-3,-4) is true at the circle boundary.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_STRICT_INTERIOR_RECTANGLE
    category: NORMAL
    description: A small rectangle lies strictly inside the circle and inside its
      enclosing box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-1,1] x [-1,1].
    - Every rectangle corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - The selected farthest rectangle corner is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_FARTHEST_CORNER_TANGENT
    category: BOUNDARY
    description: The farthest rectangle corners lie exactly on the circle boundary.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-3,3] x [-4,4].
    - Each rectangle corner has distance exactly 5 from the center.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - The farthest-point contains check succeeds at equality.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_CORNER_OUTSIDE
    category: NORMAL
    description: Rectangle is inside the enclosing box but has corners outside the
      circular boundary.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-4,4] x [-4,4].
    - Distance from the center to every rectangle corner is greater than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - The farthest-point contains check fails.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_CENTER_LEFT_OF_RECTANGLE
    category: NORMAL
    description: Circle center is left of the rectangle X span and inside its Y span.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [1,2] x [-1,1].
    - Farthest rectangle corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - Phase 2 takes the xAxis < minX branch and the Y-axis-inside branch.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_CENTER_RIGHT_OF_RECTANGLE
    category: NORMAL
    description: Circle center is right of the rectangle X span and inside its Y span.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-2,-1] x [-1,1].
    - Farthest rectangle corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - Phase 2 takes the xAxis > maxX branch and the Y-axis-inside branch.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_CENTER_BELOW_RECTANGLE
    category: NORMAL
    description: Circle center is below the rectangle Y span and inside its X span.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-1,1] x [1,2].
    - Farthest rectangle corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - Phase 2 takes the X-axis-inside branch and the yAxis < minY branch.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_CENTER_ABOVE_RECTANGLE
    category: NORMAL
    description: Circle center is above the rectangle Y span and inside its X span.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-1,1] x [-2,-1].
    - Farthest rectangle corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - Phase 2 takes the X-axis-inside branch and the yAxis > maxY branch.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_CENTER_DIAGONALLY_OUTSIDE_RECTANGLE
    category: NORMAL
    description: Circle center is outside both rectangle coordinate spans, while the
      full rectangle remains inside the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [1,2] x [1,2].
    - Farthest rectangle corner (2,2) has distance less than 5 from the center.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - Phase 2 takes the xAxis < minX and yAxis < minY branches.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_AT_CENTER
    category: EDGE
    description: Degenerate zero-width, zero-height rectangle located at the circle
      center.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [0,0] x [0,0].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - The farthest point equals the center and is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: Degenerate point rectangle lies exactly on the circle boundary.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [5,5] x [0,0].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - contains(5,0) succeeds at equality with the radius.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_DIAMETER_LINE
    category: EDGE
    description: A zero-height rectangle spans the circle horizontally through its
      center.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [-6,6] x [0,0].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - The rectangle spans both center coordinates in phase 2.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_DIAMETER_LINE
    category: EDGE
    description: A zero-width rectangle spans the circle vertically through its center.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle is [0,0] x [-6,6].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - The rectangle spans both center coordinates in phase 2.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_WITHIN_NON_EQUAL_RECTANGLE
    category: EDGE
    description: A zero-radius circle is represented by a point-sized enclosing box
      strictly within a larger rectangle.
    preconditions:
    - Circle center is (0,0) and radius is 0.
    - Rectangle is [-1,1] x [-1,1].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUAL_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and a point rectangle have identical enclosing-box
      bounds.
    preconditions:
    - Circle center is (0,0) and radius is 0.
    - Rectangle is [0,0] x [0,0].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - enclosingBox.equals(rectangle) is true.
    - relate(rectangle) returns WITHIN through the exact-enclosing-box special case.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle is separated from a point rectangle.
    preconditions:
    - Circle center is (0,0) and radius is 0.
    - Rectangle is [1,1] x [0,0].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
