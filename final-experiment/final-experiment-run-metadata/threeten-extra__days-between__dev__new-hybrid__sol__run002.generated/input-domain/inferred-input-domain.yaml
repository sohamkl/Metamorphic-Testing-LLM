InputDomain:
  summary: Non-null Temporal endpoint pairs for which ChronoUnit.DAYS.between and
    addition of 37 days to both endpoints complete normally, with the source day count
    representable as an int.
  globalConstraints:
  - Both source endpoints must be non-null because generateFollowUp rejects either
    null endpoint.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) must complete normally
    for the source pair.
  - Each endpoint must support plus(37, ChronoUnit.DAYS), and both additions must
    complete normally, because the follow-up generator performs exactly those operations.
  - ChronoUnit.DAYS.between on the two shifted endpoints must complete normally so
    that assertRelation receives a follow-up Days value.
  - Both source and follow-up day counts must lie in the inclusive int range [-2147483648,
    2147483647], because Days.between applies Math.toIntExact before constructing
    the Days result.
  - Compatible mixed Temporal types are permitted; no same-runtime-type restriction
    is imposed when DAYS.between and the 37-day shifts satisfy the preceding constraints.
  - Temporals unsupported for DAYS, incompatible endpoint combinations, endpoint values
    that overflow during the 37-day shift, and pairs whose day count cannot be represented
    as an int are excluded because the supplied MR cannot produce and compare two
    Days outputs for them.
  - For every selected source case, the follow-up oracle is equality of getAmount()
    values after both endpoints are shifted forward by exactly 37 DAYS.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - HijrahDate
    - ThaiBuddhistDate
    - MinguoDate
    - compatible_mixed_temporals
    sourceAmountClass:
    - integer_minimum
    - negative_multi_day
    - negative_one
    - zero
    - positive_one
    - positive_multi_day
    - integer_maximum
    calendarFeature:
    - ordinary_day
    - month_boundary
    - year_boundary
    - leap_day
    - proleptic_year_zero
    - epoch
    - chronology_era_boundary
    - daylight_saving_gap
    - daylight_saving_overlap
    precisionRelation:
    - date_only
    - exact_whole_day
    - sub_day_truncation
    - whole_day_plus_fraction
    - whole_day_minus_fraction
    - same_instant_different_offset
    endpointRange:
    - LocalDate_MIN
    - interior
    - LocalDate_MAX_minus_shift
    - int_count_boundary
    ordering:
    - end_before_start
    - equal_endpoints
    - end_after_start
  scenarios:
  - id: LOCAL_DATE_EQUAL_INTERIOR
    category: NORMAL
    description: Two equal interior LocalDate values.
    preconditions:
    - startDateInclusive and endDateExclusive are both LocalDate 2024-06-15.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 0, exercising Days.of(0).
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_POSITIVE_ONE
    category: BOUNDARY
    description: Adjacent LocalDate values in increasing order.
    preconditions:
    - The endpoints are LocalDate 2024-06-15 and 2024-06-16, respectively.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 1, exercising Days.of(1).
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_ONE
    category: BOUNDARY
    description: Adjacent LocalDate values in decreasing order.
    preconditions:
    - The endpoints are LocalDate 2024-06-16 and 2024-06-15, respectively.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_POSITIVE_SHIFT_SIZED_GAP
    category: NORMAL
    description: Increasing LocalDate pair separated by the MR shift size.
    preconditions:
    - The endpoints are LocalDate 2024-01-01 and 2024-02-07.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_SHIFT_SIZED_GAP
    category: NORMAL
    description: Decreasing LocalDate pair separated by the MR shift size.
    preconditions:
    - The endpoints are LocalDate 2024-02-07 and 2024-01-01.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is -37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAXIMUM_DAY_COUNT
    category: BOUNDARY
    description: A LocalDate pair whose increasing separation is the largest value
      accepted by Math.toIntExact.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is exactly 2147483647.
    - Both endpoints are LocalDate values at least 37 days below LocalDate.MAX.
    expectedSourceBehavior:
    - Days.between returns normally and getAmount() is 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MINIMUM_DAY_COUNT
    category: BOUNDARY
    description: A LocalDate pair whose decreasing separation is the smallest value
      accepted by Math.toIntExact.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is exactly -2147483648.
    - Both endpoints are LocalDate values at least 37 days below LocalDate.MAX.
