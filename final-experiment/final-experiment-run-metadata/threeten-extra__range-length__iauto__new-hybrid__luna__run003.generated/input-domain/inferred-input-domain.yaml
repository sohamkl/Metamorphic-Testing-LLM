InputDomain:
  summary: Valid LocalDateRange instances whose end can be moved 23 days later by
    RangeLengthMetamorphicSpec.generateFollowUp; cover finite, empty, unbounded-start,
    sentinel, construction-path, calendar-boundary, and int-return boundary behavior.
  globalConstraints:
  - Every source input must be constructible by one of the supplied LocalDateRange
    factory or parse paths; invalid construction arguments and parse failures are
    outside this MR.
  - The source range must be non-null.
  - The source end must be on or before LocalDate.MAX.minusDays(23), because generateFollowUp
    calls range.getEnd().plusDays(23).
  - The follow-up LocalDateRange.of(range.getStart(), range.getEnd().plusDays(23))
    must be constructible; this excludes source ranges whose end is after LocalDate.MAX.minusDays(23)
    solely because the supplied follow-up transformation cannot represent them.
  - 'Source ranges must obey LocalDateRange construction restrictions: end is not
    before start, end is not LocalDate.MIN or LocalDate.MIN.plusDays(1), start is
    not LocalDate.MAX or LocalDate.MAX.minusDays(1), and an empty range is not located
    at LocalDate.MIN or LocalDate.MAX.'
  - The source-output assertion is evaluated only through the supplied relation; when
    either output is Integer.MAX_VALUE, the relation returns without checking the
    increase.
  diversity:
    constructionPath:
    - of dates
    - of Period
    - ofClosed
    - ofEmpty
    - from LocalDate
    - from Year
    - from YearMonth
    - from YearHalf
    - from YearQuarter
    - from YearWeek
    - parse date/date
    - parse date/period
    - parse period/date
    - ofUnboundedStart
    boundedness:
    - finite bounded range
    - empty range
    - unbounded start
    - follow-up becomes unbounded at end
    sourceLength:
    - zero
    - one
    - two
    - '22'
    - '23'
    - '24'
    - calendar-sized
    - just below Integer.MAX_VALUE
    - exactly Integer.MAX_VALUE
    - greater than Integer.MAX_VALUE
    calendarPosition:
    - ordinary dates
    - month boundary
    - year boundary
    - leap day
    - LocalDate.MIN vicinity
    - LocalDate.MAX vicinity
    followUpPath:
    - finite follow-up with 23-day increase
    - follow-up remains unbounded at start
    - follow-up reaches LocalDate.MAX sentinel
  scenarios:
  - id: EMPTY_ORDINARY_RANGE
    category: NORMAL
    description: An empty range created at an ordinary date.
    preconditions:
    - The source is LocalDateRange.ofEmpty(LocalDate.of(2024, 1, 15)).
    - getStart() equals getEnd(), and the date is neither LocalDate.MIN nor LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up has the same start and an end 23 days later, so its finite length
      is 23.
    - The relation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: The smallest non-empty finite half-open range.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024,
      1, 2)).
    - The end is exactly one day after the start.
    expectedSourceBehavior:
    - lengthInDays() returns 1 because the end is exclusive.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_TWO_DAY_RANGE
    category: BOUNDARY
    description: A finite range one day shorter than the metamorphic extension amount.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024,
      1, 23)).
    - The source length is 22 days.
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    - The follow-up length is 45, and the relation observes an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_THREE_DAY_RANGE
    category: BOUNDARY
    description: A finite range whose length equals EXTRA_DAYS.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024,
      1, 24)).
    - The source length is exactly 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_FOUR_DAY_RANGE
    category: BOUNDARY
    description: A finite range one day longer than the metamorphic extension amount.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024,
      1, 25)).
    - The source length is 24 days.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    - The follow-up length is 47.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_BOUNDARY_RANGE
    category: BOUNDARY
    description: A range crossing from the end of one month into the next.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 1, 31), LocalDate.of(2024,
      2, 2)).
    - The range crosses a month boundary and has length 2.
    expectedSourceBehavior:
    - lengthInDays() returns 2 using the epoch-day difference.
    - The follow-up crosses the same calendar boundary and has length 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_RANGE
    category: EDGE
    description: A range crossing February 29 in a leap year.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 2)).
    - The source includes February 28 and February 29 but excludes March 2, giving
      length 3.
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    - The follow-up length is 26.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_RANGE
    category: BOUNDARY
    description: A range crossing a calendar-year boundary.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024,
      1, 2)).
    - The source length is 2.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_CONSTRUCTION
    category: EDGE
    description: An empty range produced through the Period construction path.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 5, 10), Period.ZERO).
    - The period is zero, so the computed end equals the start.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a finite 23-day range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_PERIOD_CONSTRUCTION
    category: NORMAL
    description: A non-zero calendar Period construction whose day length depends
      on the start month.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1)).
    - The computed end is 2024-02-29 and the source length is 29 days.
    expectedSourceBehavior:
    - lengthInDays() returns 29, reflecting the constructed dates rather than a fixed
      month-to-day conversion.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE
    category: BOUNDARY
    description: A closed range whose equal inclusive endpoints become a one-day half-open
      range.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 1), LocalDate.of(2024,
      6, 1)).
    - ofClosed adds one day to the inclusive end, producing a one-day range.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DAY_RANGE
    category: NORMAL
    description: A closed range whose exclusive representation differs from its inclusive
      endpoint.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 1), LocalDate.of(2024,
      6, 30)).
    - The internal exclusive end is 2024-07-01 and the source length is 30.
    expectedSourceBehavior:
    - lengthInDays() returns 30.
    - The follow-up length is 53.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_DATE_RANGE
    category: NORMAL
    description: A range parsed from two date representations.
    preconditions:
    - The source is LocalDateRange.parse("2024-03-01/2024-03-10").
    - The parsed end is exclusive and the source length is 9.
    expectedSourceBehavior:
    - lengthInDays() returns 9.
    - The follow-up length is 32.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_PERIOD_RANGE
    category: NORMAL
    description: A range parsed from a date followed by a Period.
    preconditions:
    - The source is LocalDateRange.parse("2024-03-01/P10D").
    - The parser computes the end by adding the period to the start, giving length
      10.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up length is 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_PERIOD_DATE_RANGE
    category: NORMAL
    description: A range parsed from a Period followed by an end date.
    preconditions:
    - The source is LocalDateRange.parse("P10D/2024-03-11").
    - The parser computes the start by subtracting the period from the end, giving
      length 10.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up length is 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A range obtained from a LocalDate temporal.
    preconditions:
    - The source is LocalDateRange.from(LocalDate.of(2024, 7, 4)).
    - The from(LocalDate) path delegates to ofClosed for the same date.
    expectedSourceBehavior:
    - The resulting range has one day of length.
    - lengthInDays() returns 1 and the follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A range obtained from a Year temporal.
    preconditions:
    - The source is LocalDateRange.from(Year.of(2024)).
    - The source spans January 1 through the exclusive date after December 31, so
      its length is 366.
    expectedSourceBehavior:
    - lengthInDays() returns 366 for the leap year.
    - The follow-up length is 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A range obtained from a YearMonth temporal.
    preconditions:
    - The source is LocalDateRange.from(YearMonth.of(2024, 2)).
    - The source spans the complete leap February and has length 29.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A range obtained from a YearHalf temporal.
    preconditions:
    - The source is LocalDateRange.from(YearHalf.of(2024, 1)).
    - The temporal represents the first half of leap year 2024, so the source length
      is 182.
    expectedSourceBehavior:
    - lengthInDays() returns 182.
    - The follow-up length is 205.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A range obtained from a YearQuarter temporal.
    preconditions:
    - The source is LocalDateRange.from(YearQuarter.of(2024, 1)).
    - The first quarter of leap year 2024 has length 91 days.
    expectedSourceBehavior:
    - lengthInDays() returns 91.
    - The follow-up length is 114.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A range obtained from a YearWeek temporal.
    preconditions:
    - The source is LocalDateRange.from(YearWeek.of(2024, 1)).
    - The from(YearWeek) path uses Monday through the following Sunday as an inclusive
      week, producing length 7.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up length is 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_NEAR_MINIMUM
    category: EDGE
    description: A range with an unbounded start and the smallest permitted finite
      end above the prohibited lower sentinels.
    preconditions:
    - The source is LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2)).
    - The start equals LocalDate.MIN and the end is LocalDate.MIN.plusDays(2), which
      is permitted.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - The follow-up also has an unbounded start, so its output is Integer.MAX_VALUE
      and the relation intentionally skips arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: A range unbounded at the start with an ordinary finite end.
    preconditions:
    - The source is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 1, 1)).
    - The end is finite and at least 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is LocalDate.MIN.
    - The follow-up remains unbounded at the start and also returns Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_BELOW_INT_LIMIT
    category: BOUNDARY
    description: A finite range whose length is just below Integer.MAX_VALUE.
    preconditions:
    - Choose valid dates with end.toEpochDay() - start.toEpochDay() equal to Integer.MAX_VALUE
      - 23.
    - Choose the end no later than LocalDate.MAX.minusDays(23), so the follow-up remains
      constructible.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - The follow-up has length Integer.MAX_VALUE, and the int subtraction in the relation
      observes an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_AT_INT_LIMIT
    category: BOUNDARY
    description: A finite range whose epoch-day length is exactly Integer.MAX_VALUE.
    preconditions:
    - Choose valid dates with end.toEpochDay() - start.toEpochDay() equal to Integer.MAX_VALUE.
    - The end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns the int representation of the exact day difference, Integer.MAX_VALUE.
    - The follow-up day difference is Integer.MAX_VALUE plus 23; the returned int
      follows the target's int conversion, and the relation's Java int subtraction
      is exercised across the signed-int boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_ABOVE_INT_LIMIT
    category: EDGE
    description: A finite bounded range whose day difference exceeds Integer.MAX_VALUE.
    preconditions:
    - Choose valid dates with end.toEpochDay() - start.toEpochDay() greater than Integer.MAX_VALUE
      and end no later than LocalDate.MAX.minusDays(23).
    - Neither boundary is unbounded.
    expectedSourceBehavior:
    - lengthInDays() exercises the finite non-sentinel path for a day difference too
      large for a positive int.
    - The follow-up remains finite and increases the underlying epoch-day difference
      by exactly 23; the relation checks the resulting int values rather than a long
      length.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_REACHES_MAX_SENTINEL
    category: BOUNDARY
    description: A finite source whose 23-day extension ends exactly at LocalDate.MAX.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23)).
    - The source length is 1 and its end is exactly LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 1 because the source is finite.
    - The follow-up end is LocalDate.MAX, so the follow-up is unbounded at the end
      and lengthInDays() returns Integer.MAX_VALUE.
    - The relation intentionally returns without requiring a numeric increase because
      the follow-up output is the unbounded sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_NEAR_MAX_WITH_FINITE_FOLLOW_UP
    category: EDGE
    description: A finite range close to LocalDate.MAX whose 23-day extension remains
      finite.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MAX.minusDays(47), LocalDate.MAX.minusDays(24)).
    - The source length is 23 and the follow-up end becomes LocalDate.MAX.minusDays(1),
      which is finite.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46 and does not use the unbounded-end sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIN_START_WITH_LONG_FINITE_END
    category: EDGE
    description: A range beginning at LocalDate.MIN with a long but finite end, exercising
      unbounded-start detection independently of a short lower-boundary range.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MIN, LocalDate.of(2000, 1, 1)).
    - The end is finite and at least 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because start equals LocalDate.MIN.
    - The follow-up also has an unbounded start and returns Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_ZERO_PERIOD_RANGE
    category: EDGE
    description: An empty range produced by the date/Period parsing branch.
    preconditions:
    - The source is LocalDateRange.parse("2024-08-01/P0D").
    - The parsed period is zero, so start and end are equal at an ordinary date.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a finite 23-day range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_LEAP_MONTH_PERIOD
    category: BOUNDARY
    description: A parsed calendar period crossing a leap-day boundary.
    preconditions:
    - The source is LocalDateRange.parse("2024-01-31/P1M").
    - The parser computes the end using Period addition, producing 2024-02-29 and
      a 29-day source length.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_YEAR_BOUNDARY
    category: BOUNDARY
    description: A closed range ending on December 31, exercising conversion of the
      inclusive end at a year boundary.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2023, 12, 30), LocalDate.of(2023,
      12, 31)).
    - The internal exclusive end is 2024-01-01 and the source length is 2.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_AFTER_DIRECT_OF
    category: EDGE
    description: An empty range produced through the direct two-date of path rather
      than ofEmpty.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2025, 1, 1), LocalDate.of(2025,
      1, 1)).
    - The equal endpoints are an ordinary permitted empty location.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up changes only the end and has length 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SHORT_RANGE_AT_MINIMUM_START
    category: EDGE
    description: A two-day range starting at LocalDate.MIN, distinct from the unbounded-start
      construction with a later ordinary end.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MIN, LocalDate.MIN.plusDays(2)).
    - The end is permitted because it is neither LocalDate.MIN nor LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - The follow-up remains unbounded at the start and returns Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
