InputDomain:
  summary: Finite Java double longitudes across the identity interval, normalization
    branches, antimeridian sentinel paths, revolution classes, and floating-point
    precision limits.
  globalConstraints:
  - Each source case supplies exactly one primitive double argument to DistanceUtils.normLonDEG(double).
  - 'The source longitude must be finite: Double.isFinite(longitudeDeg) is true.'
  - NaN and positive or negative infinity are excluded because generateFollowUp and
    normLonDEG can produce NaN, for which assertRelation computes a NaN difference
    and cannot detect a violation.
  - No restriction to [-180, 180] is imposed; the target method explicitly accepts
    longitudes outside that interval and normalizes them.
  - The follow-up is generated exactly by Java double addition longitudeDeg + 360.0;
    no mathematical-real or arbitrary-precision substitution is used.
  diversity:
    sourceRegion:
    - less than -180
    - '[-180, 180]'
    - greater than 180
    sourceBranch:
    - identity return
    - off < 0
    - off == 0 and positive source
    - remaining off branch
    antimeridianRelationPath:
    - exact antimeridian
    - within 1e-9
    - outside 1e-9
    signClass:
    - negative
    - negative zero
    - positive zero
    - positive
    revolutionClass:
    - zero revolutions
    - one revolution
    - multiple revolutions
    - very large revolution count
    precisionRegime:
    - subnormal
    - minimum normal
    - ordinary fractional
    - exact-integer shift
    - rounded shift
    - shift collapses to source
  scenarios:
  - id: ORDINARY_NEGATIVE_IDENTITY
    category: NORMAL
    description: Ordinary negative longitudes strictly inside the documented output
      interval take the common identity path.
    preconditions:
    - Across the 2 cases, longitudeDeg is finite, -180.0 < longitudeDeg < 0.0, and
      one case is integral while the other has a nonzero fractional part.
    - Both cases satisfy abs(abs(longitudeDeg) - 180.0) > 2e-9.
    expectedSourceBehavior:
    - The returned double equals longitudeDeg because the inclusive range check succeeds.
    - The returned value is strictly between -180.0 and 0.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ORDINARY_POSITIVE_IDENTITY
    category: NORMAL
    description: Ordinary positive longitudes strictly inside the documented output
      interval take the common identity path.
    preconditions:
    - Across the 2 cases, longitudeDeg is finite, 0.0 < longitudeDeg < 180.0, and
      one case is integral while the other has a nonzero fractional part.
    - Both cases satisfy abs(abs(longitudeDeg) - 180.0) > 2e-9.
    expectedSourceBehavior:
    - The returned double equals longitudeDeg because the inclusive range check succeeds.
    - The returned value is strictly between 0.0 and 180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_ZERO_IDENTITY
    category: BOUNDARY
    description: Positive zero exercises the center of the identity interval without
      losing its sign bit.
    preconditions:
    - Double.doubleToRawLongBits(longitudeDeg) equals Double.doubleToRawLongBits(+0.0).
    expectedSourceBehavior:
    - The method returns the input directly.
    - The returned raw bits represent positive zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_IDENTITY
    category: EDGE
    description: Negative zero satisfies the inclusive range check and is returned
      directly.
    preconditions:
    - Double.doubleToRawLongBits(longitudeDeg) equals Double.doubleToRawLongBits(-0.0).
    expectedSourceBehavior:
    - The method returns the input directly.
    - The returned raw bits represent negative zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIGNED_MIN_SUBNORMAL_IDENTITY
    category: EDGE
    description: The smallest positive and negative subnormal longitudes test identity
      preservation while the follow-up addition rounds away the source magnitude.
    preconditions:
    - Across the 2 cases, longitudeDeg is Double.MIN_VALUE and -Double.MIN_VALUE.
    expectedSourceBehavior:
    - Each source output equals its source input exactly through the identity path.
    - Each source output has magnitude Double.MIN_VALUE and is finite.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SIGNED_MIN_NORMAL_IDENTITY
    category: EDGE
    description: The smallest positive and negative normal doubles remain valid in-range
      longitudes.
    preconditions:
    - Across the 2 cases, longitudeDeg is Double.MIN_NORMAL and -Double.MIN_NORMAL.
    expectedSourceBehavior:
    - Each source output equals its source input exactly through the identity path.
    - Each output is finite and has magnitude Double.MIN_NORMAL.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOWER_ANTIMERIDIAN_EXACT
    category: BOUNDARY
    description: The inclusive lower endpoint is preserved as -180 even though its
      follow-up is the equivalent +180 representation.
    preconditions:
    - longitudeDeg == -180.0.
    expectedSourceBehavior:
    - The method returns exactly -180.0 through the identity path.
    - The source output is recognized as antimeridian by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_ANTIMERIDIAN_EXACT
    category: BOUNDARY
    description: The inclusive upper endpoint is preserved as +180 and its shifted
      value reaches the positive exact-remainder sentinel.
    preconditions:
    - longitudeDeg == 180.0.
    expectedSourceBehavior:
    - The method returns exactly 180.0 through the identity path.
    - The source output is recognized as antimeridian by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_BOUNDARY_NEXT_INSIDE
    category: BOUNDARY
    description: The representable value immediately inside the lower endpoint remains
      unchanged.
    preconditions:
    - longitudeDeg == Math.nextUp(-180.0).
    expectedSourceBehavior:
    - The method returns longitudeDeg exactly through the identity path.
    - The output is greater than -180.0 and within 1e-9 of the antimeridian.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_BOUNDARY_NEXT_INSIDE
    category: BOUNDARY
    description: The representable value immediately inside the upper endpoint remains
      unchanged.
    preconditions:
    - longitudeDeg == Math.nextDown(180.0).
    expectedSourceBehavior:
    - The method returns longitudeDeg exactly through the identity path.
    - The output is less than 180.0 and within 1e-9 of the antimeridian.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_BOUNDARY_NEXT_OUTSIDE
    category: BOUNDARY
    description: The representable value immediately below -180 enters the negative-remainder
      branch and folds near +180.
    preconditions:
    - longitudeDeg == Math.nextDown(-180.0).
    expectedSourceBehavior:
    - With off = (longitudeDeg + 180.0) % 360.0, off is negative and the result equals
      180.0 + off.
    - The output lies within [-180.0, 180.0] and is within 1e-9 of +180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_BOUNDARY_NEXT_OUTSIDE
    category: BOUNDARY
    description: The representable value immediately above +180 enters the ordinary
      positive-remainder branch and folds near -180.
    preconditions:
    - longitudeDeg == Math.nextUp(180.0).
    expectedSourceBehavior:
    - With off = (longitudeDeg + 180.0) % 360.0, off is positive and the result equals
      -180.0 + off.
    - The output lies within [-180.0, 180.0] and is within 1e-9 of -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_ANTIMERIDIAN_TOLERANCE_INSIDE
    category: EDGE
    description: An in-range lower-antimeridian value exercises the inclusive antimeridian
      tolerance rather than exact endpoint equality.
    preconditions:
    - -180.0 < longitudeDeg < -179.999999999.
    - Math.abs(Math.abs(longitudeDeg) - 180.0) <= 1e-9.
    expectedSourceBehavior:
    - The source output equals longitudeDeg exactly.
    - The source output is classified as antimeridian by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_ANTIMERIDIAN_TOLERANCE_INSIDE
    category: EDGE
    description: An in-range upper-antimeridian value exercises the inclusive antimeridian
      tolerance rather than exact endpoint equality.
    preconditions:
    - 179.999999999 < longitudeDeg < 180.0.
    - Math.abs(Math.abs(longitudeDeg) - 180.0) <= 1e-9.
    expectedSourceBehavior:
    - The source output equals longitudeDeg exactly.
    - The source output is classified as antimeridian by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_ANTIMERIDIAN_TOLERANCE_EXCEEDED
    category: EDGE
    description: A lower-side value just beyond the relation's antimeridian tolerance
      must use the numerical-difference assertion path.
    preconditions:
    - -180.0 < longitudeDeg < -179.999999998.
    - 1e-9 < Math.abs(Math.abs(longitudeDeg) - 180.0) && Math.abs(Math.abs(longitudeDeg)
      - 180.0) <= 2e-9.
    expectedSourceBehavior:
    - The source output equals longitudeDeg exactly.
    - The source output is not classified as antimeridian by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_ANTIMERIDIAN_TOLERANCE_EXCEEDED
    category: EDGE
    description: An upper-side value just beyond the relation's antimeridian tolerance
      must use the numerical-difference assertion path.
    preconditions:
    - 179.999999998 < longitudeDeg < 180.0.
    - 1e-9 < Math.abs(Math.abs(longitudeDeg) - 180.0) && Math.abs(Math.abs(longitudeDeg)
      - 180.0) <= 2e-9.
    expectedSourceBehavior:
    - The source output equals longitudeDeg exactly.
    - The source output is not classified as antimeridian by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FULL_REVOLUTION
    category: NORMAL
    description: Negative one-revolution longitude uses the negative remainder branch
      and normalizes to the prime meridian.
    preconditions:
    - longitudeDeg == -360.0.
    expectedSourceBehavior:
    - off = (-360.0 + 180.0) % 360.0 equals -180.0.
    - The returned value equals 0.0 via 180.0 + off.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FULL_REVOLUTION
    category: NORMAL
    description: Positive one-revolution longitude uses the ordinary remainder branch
      and normalizes to the prime meridian.
    preconditions:
    - longitudeDeg == 360.0.
    expectedSourceBehavior:
    - off = (360.0 + 180.0) % 360.0 equals 180.0.
    - The returned value equals 0.0 via -180.0 + off.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ANTIMERIDIAN_REVOLUTION
    category: EDGE
    description: A negative antimeridian representation outside the identity interval
      produces a zero remainder but cannot take the positive-source sentinel.
    preconditions:
    - longitudeDeg == -540.0.
    expectedSourceBehavior:
    - off = (-540.0 + 180.0) % 360.0 compares equal to zero.
    - Because longitudeDeg is not positive, the final branch returns -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ANTIMERIDIAN_SENTINEL
    category: EDGE
    description: A positive antimeridian representation outside the identity interval
      reaches the explicit off-equals-zero sentinel.
    preconditions:
    - longitudeDeg == 540.0.
    expectedSourceBehavior:
    - off = (540.0 + 180.0) % 360.0 equals zero.
    - Because longitudeDeg is positive, the method returns exactly 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_NONZERO_REMAINDER_REGIONS
    category: NORMAL
    description: Negative out-of-range integers cover normalized results near +180,
      near zero, and below zero through the off-less-than-zero branch.
    preconditions:
    - Across the 3 cases, longitudeDeg takes each value in {-181.0, -359.0, -361.0}.
    expectedSourceBehavior:
    - For every case, off = (longitudeDeg + 180.0) % 360.0 is negative.
    - Every result equals 180.0 + off and lies within [-180.0, 180.0].
    - The three source outputs are respectively 179.0, 1.0, and -1.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: POSITIVE_NONZERO_REMAINDER_REGIONS
    category: NORMAL
    description: Positive out-of-range integers cover normalized results near -180,
      near zero, and above zero through the ordinary remainder branch.
    preconditions:
    - Across the 3 cases, longitudeDeg takes each value in {181.0, 359.0, 361.0}.
    expectedSourceBehavior:
    - For every case, off = (longitudeDeg + 180.0) % 360.0 is positive and nonzero.
    - Every result equals -180.0 + off and lies within [-180.0, 180.0].
    - The three source outputs are respectively -179.0, -1.0, and 1.0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_MULTIREVOLUTION
    category: NORMAL
    description: Negative fractional longitudes over different revolution counts test
      Java remainder without restricting inputs to integers.
    preconditions:
    - Across the 2 cases, longitudeDeg takes each value in {-181.25, -721.125}.
    expectedSourceBehavior:
    - For each case, off = (longitudeDeg + 180.0) % 360.0 is negative.
    - Each result equals 180.0 + off, preserves a nonzero fractional component, and
      lies within [-180.0, 180.0].
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_MULTIREVOLUTION
    category: NORMAL
    description: Positive fractional longitudes over different revolution counts test
      Java remainder without restricting inputs to integers.
    preconditions:
    - Across the 2 cases, longitudeDeg takes each value in {181.25, 721.125}.
    expectedSourceBehavior:
    - For each case, off = (longitudeDeg + 180.0) % 360.0 is positive and nonzero.
    - Each result equals -180.0 + off, preserves a nonzero fractional component, and
      lies within [-180.0, 180.0].
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_EXACT_HALF_UNIT_PRECISION
    category: EDGE
    description: Large signed powers at the 2^51 precision regime retain an exactly
      representable 360-degree follow-up shift.
    preconditions:
    - Across the 2 cases, longitudeDeg is Math.scalb(1.0, 51) and -Math.scalb(1.0,
      51).
    expectedSourceBehavior:
    - Each source bypasses the identity path and is normalized using the Java remainder
      expression.
    - Each source output is finite and lies within [-180.0, 180.0].
    - For this magnitude, longitudeDeg + 360.0 differs from longitudeDeg by exactly
      360.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_EXACT_INTEGER_SHIFT
    category: EDGE
    description: Signed 2^53 inputs exercise very large revolution counts while a
      360-degree integer shift remains representable.
    preconditions:
    - Across the 2 cases, longitudeDeg is Math.scalb(1.0, 53) and -Math.scalb(1.0,
      53).
    expectedSourceBehavior:
    - Each source is normalized through the remainder logic to a finite value in [-180.0,
      180.0].
    - For each case, the generated follow-up is finite and differs from the source
      by exactly 360.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_ROUNDED_SHIFT_2_POW_59
    category: EDGE
    description: Signed 2^59 inputs expose a precision regime where Java addition
      cannot represent the requested 360-degree displacement exactly.
    preconditions:
    - Across the 2 cases, longitudeDeg is Math.scalb(1.0, 59) and -Math.scalb(1.0,
      59).
    expectedSourceBehavior:
    - Each source output is computed by the applicable remainder branch and is finite
      within [-180.0, 180.0].
    - For each case, the generated follow-up is finite, but its represented displacement
      from the source is not exactly 360.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_ROUNDED_SHIFT_2_POW_60
    category: EDGE
    description: Signed 2^60 inputs test a coarser precision regime in both the normalization
      remainder and follow-up transformation.
    preconditions:
    - Across the 2 cases, longitudeDeg is Math.scalb(1.0, 60) and -Math.scalb(1.0,
      60).
    expectedSourceBehavior:
    - Each source output is finite, lies within [-180.0, 180.0], and follows the source
      code's remainder branches.
    - The represented follow-up displacement is governed by the double spacing at
      this magnitude rather than being exactly 360.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MAX_FINITE_SHIFT_COLLAPSE
    category: EDGE
    description: The largest finite positive and negative doubles cover the reachable
      regime where adding 360 is rounded back to the source.
    preconditions:
    - Across the 2 cases, longitudeDeg is Double.MAX_VALUE and -Double.MAX_VALUE.
    expectedSourceBehavior:
    - Each source is processed by the remainder logic and returns a finite value in
      [-180.0, 180.0].
    - For each case, Java double addition produces longitudeDeg + 360.0 == longitudeDeg.
    - The cases retain coverage of valid finite source inputs even though the generated
      follow-up numerically coincides with the source.
    targetCases: 2
    emptyOutputAllowed: false
