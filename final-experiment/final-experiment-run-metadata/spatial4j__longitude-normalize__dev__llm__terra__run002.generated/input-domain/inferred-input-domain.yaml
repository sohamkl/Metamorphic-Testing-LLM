InputDomain:
  summary: 'All IEEE-754 double longitudes are admissible: ordinary in-range values,
    wrap boundaries, multi-revolution values, precision-sensitive large finite values,
    and non-finite doubles. The follow-up is the Java double computation lon_deg +
    360.0.'
  globalConstraints:
  - Each source case supplies exactly one Java primitive double; the target method
    declares no input rejection or finite-range precondition, so finite values, NaN,
    +Infinity, and -Infinity are all included.
  - For every source value x, the follow-up value must be computed as the binary64
    result of x + 360.0, not as arbitrary-precision mathematical addition.
  - No INVALID scenarios are used because the metamorphic relation does not request
    invalid inputs and the supplied method has no documented invalid-input behavior.
  diversity:
    controlFlow:
    - distinct
    - 'All normLonDEG paths are covered: unchanged in-range return; negative remainder;
      zero remainder with positive input; and final -180+off path.'
    - in-range; off<0; off==0&&lon>0; final else
    longitudeBoundaries:
    - distinct
    - Exact endpoints and adjacent representable doubles are included.
    - -180.0; 180.0; nextUp(-180.0); nextDown(180.0); nextDown(-180.0); nextUp(180.0)
    periodicity:
    - distinct
    - Inputs cover one revolution, exact antimeridian-periodic values, values adjacent
      to periodic cuts, and non-integral multiple revolutions.
    - -360.0; 360.0; -540.0; 540.0; nextUp(-540.0); nextDown(540.0); -721.25; 721.25
    floatingPointSentinels:
    - distinct
    - Signed zero, subnormals, tolerance-scale values, large finite quantization thresholds,
      extrema, and non-finite values are covered.
    - -0.0; +0.0; Double.MIN_VALUE; -Double.MIN_VALUE; 1e-10; 1e-8; 2^55; 2^56; 2^60;
      Double.MAX_VALUE; NaN; infinities
  scenarios:
  - id: ORDINARY_INTERIOR_LONGITUDES
    category: NORMAL
    description: Finite longitudes strictly inside [-180, 180] that take the common
      unchanged-return path.
    preconditions:
    - Source is one of -179.25, -1.0, 1.0, or 179.25.
    - -180.0 < source < 180.0.
    expectedSourceBehavior:
    - Source output is bitwise/equality-identical to the supplied finite source value.
    - No modulo operation is reached for the source invocation.
    targetCases: 4
    emptyOutputAllowed: false
  - id: IN_RANGE_ADJACENT_TO_ENDPOINTS
    category: BOUNDARY
    description: Representable values immediately inside the documented inclusive
      longitude range.
    preconditions:
    - Source is Math.nextUp(-180.0) or Math.nextDown(180.0).
    expectedSourceBehavior:
    - Source output equals the source value exactly because both values satisfy -180.0
      <= lon_deg <= 180.0.
    - The source remains distinct from its corresponding exact endpoint.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SIGNED_ZERO_IN_RANGE
    category: EDGE
    description: Both IEEE-754 zero encodings take the in-range fast path.
    preconditions:
    - Source is +0.0 or -0.0.
    expectedSourceBehavior:
    - Source output compares equal to zero.
    - The source fast path returns the supplied zero representation without applying
      modulo; in particular, -0.0 is returned as -0.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_RANGE_ENDPOINTS
    category: BOUNDARY
    description: The two inclusive antimeridian endpoints are returned unchanged even
      though they denote the same meridian.
    preconditions:
    - Source is exactly -180.0 or exactly 180.0.
    expectedSourceBehavior:
    - Source output equals the source endpoint exactly.
    - The source does not canonicalize -180.0 to 180.0 or 180.0 to -180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: IMMEDIATELY_OUTSIDE_RANGE
    category: BOUNDARY
    description: Representable values immediately beyond each inclusive endpoint force
      normalization.
    preconditions:
    - Source is Math.nextDown(-180.0) or Math.nextUp(180.0).
    expectedSourceBehavior:
    - Math.nextDown(-180.0) takes the negative-remainder path and returns a value
      just below 180.0.
    - Math.nextUp(180.0) takes the final path and returns a value just above -180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ONE_FULL_REVOLUTION
    category: NORMAL
    description: A positive and negative full revolution normalize to zero through
      different remainder signs.
    preconditions:
    - Source is exactly 360.0 or exactly -360.0.
    expectedSourceBehavior:
    - Both source outputs compare equal to 0.0.
    - 360.0 has off = 180.0 and uses the final return path; -360.0 has off = -180.0
      and uses the off < 0 return path.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_ANTIMERIDIAN_PERIODIC_VALUES
    category: BOUNDARY
    description: Out-of-range exact periodic representations of the antimeridian exercise
      the zero-remainder cases.
    preconditions:
    - Source is exactly 540.0 or exactly -540.0.
    - For both values, (source + 180.0) % 360.0 compares equal to zero, with negative
      zero possible for the negative source.
    expectedSourceBehavior:
    - 540.0 takes off == 0 && lon_deg > 0 and returns 180.0.
    - -540.0 reaches the final return and returns -180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: VALUES_ADJACENT_TO_PERIODIC_CUTS
    category: BOUNDARY
    description: Values immediately beside out-of-range antimeridian-periodic inputs
      distinguish nearly full remainders from exact zero remainders.
    preconditions:
    - Source is Math.nextDown(540.0) or Math.nextUp(-540.0).
    expectedSourceBehavior:
    - Math.nextDown(540.0) returns a normalized value just below 180.0 rather than
      exactly 180.0.
    - Math.nextUp(-540.0) returns a normalized value just above -180.0 rather than
      exactly -180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FRACTIONAL_MULTI_REVOLUTION_POSITIVE_AND_NEGATIVE
    category: NORMAL
    description: Non-integral multi-revolution inputs cover ordinary positive and
      negative modulo remainders.
    preconditions:
    - Source is exactly 721.25 or exactly -721.25.
    - Both sources are outside [-180.0, 180.0] and are not congruent to an antimeridian
      endpoint modulo 360.
    expectedSourceBehavior:
    - 721.25 reaches the final return path and normalizes to 1.25.
    - -721.25 reaches the off < 0 path and normalizes to -1.25.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SUBNORMAL_LONGITUDES
    category: EDGE
    description: Smallest positive and negative nonzero binary64 values are valid
      in-range longitudes.
    preconditions:
    - Source is Double.MIN_VALUE or -Double.MIN_VALUE.
    expectedSourceBehavior:
    - Source output equals the source subnormal value exactly.
    - The source invocation uses the unchanged in-range path, even though adding 360.0
      for the follow-up can lose the subnormal displacement.
    targetCases: 2
    emptyOutputAllowed: false
  - id: METAMORPHIC_TOLERANCE_SCALE_LONGITUDES
    category: EDGE
    description: Small nonzero values straddle the relation's 1e-9 tolerance scale
      while remaining in the unchanged source path.
    preconditions:
    - Source is exactly 1e-10 or exactly 1e-8.
    - Both sources are finite and strictly within [-180.0, 180.0].
    expectedSourceBehavior:
    - Source output equals the source value exactly.
    - The 1e-10 case is below the relation tolerance, while the 1e-8 case is above
      it.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_FINITE_WITH_EXACT_360_SHIFT
    category: EDGE
    description: Large finite values at an exponent where adding 360.0 remains representable
      as an exact 360-degree increment.
    preconditions:
    - Source is exactly 0x1.0p55 or -0x1.0p55.
    - Math.ulp(abs(source)) is 8.0, and 360.0 is an integral multiple of that ulp.
    expectedSourceBehavior:
    - Source is outside the normal range and is normalized using the modulo computation.
    - The follow-up addition changes the binary64 input by exactly 360.0 rather than
      collapsing or rounding it to a different increment.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FIRST_COARSE_ULP_SHIFT_QUANTIZATION
    category: EDGE
    description: Large finite values at the first selected scale where 360.0 is not
      an integral number of ulps.
    preconditions:
    - Source is exactly 0x1.0p56 or -0x1.0p56.
    - Math.ulp(abs(source)) is 16.0, so the binary64 result of source + 360.0 need
      not differ from source by exactly 360.0.
    expectedSourceBehavior:
    - Source is finite, outside [-180.0, 180.0], and reaches modulo normalization.
    - This scenario exposes that the follow-up generator operates on rounded doubles
      rather than exact real-valued longitudes.
    targetCases: 2
    emptyOutputAllowed: false
  - id: COARSE_QUANTIZATION_LARGE_FINITE_VALUES
    category: EDGE
    description: Very large positive and negative finite values make the generated
      follow-up shift quantize to a substantially different binary64 increment.
    preconditions:
    - Source is exactly 0x1.0p60 or -0x1.0p60.
    - Math.ulp(abs(source)) is 256.0.
    expectedSourceBehavior:
    - Source is finite and reaches modulo normalization.
    - Adding 360.0 is rounded at this magnitude; the generated follow-up is not required
      to represent a mathematical shift of exactly 360 degrees.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MAXIMUM_MAGNITUDE_FINITE_VALUES
    category: EDGE
    description: Largest finite magnitudes verify modulo behavior when adding 360.0
      cannot change the source binary64 value.
    preconditions:
    - Source is Double.MAX_VALUE or -Double.MAX_VALUE.
    - source + 360.0 equals source in binary64 arithmetic.
    expectedSourceBehavior:
    - Source is finite, outside the normal range, and produces a finite modulo-derived
      normalized result.
    - The generated follow-up input is identical to the source input at these magnitudes.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NONFINITE_DOUBLE_SENTINELS
    category: EDGE
    description: NaN and infinities are accepted by the primitive-double signature
      and flow through Java comparison and remainder semantics.
    preconditions:
    - Source is Double.NaN, Double.POSITIVE_INFINITY, or Double.NEGATIVE_INFINITY.
    expectedSourceBehavior:
    - Source output is NaN for each case because the in-range condition is false and
      the remainder expression yields NaN.
    - These outputs must be observed explicitly because Math.abs(NaN) > 1e-9 is false
      in the supplied relation assertion.
    targetCases: 3
    emptyOutputAllowed: false
