InputDomain:
  summary: All Java double longitude values are in domain because normLonDEG declares
    no input restriction or validation. Source cases cover direct-return values in
    [-180, 180], each modulo/remainder return path outside that interval, exact wrap
    sentinels, fractional values, floating-point precision effects, and IEEE-754 non-finite
    values.
  globalConstraints:
  - arg0 may be any Java double value, including finite values, positive and negative
    zero, NaN, and positive or negative infinity; the supplied API has no documented
    rejection behavior or precondition restricting the argument.
  - Each follow-up input is generated exactly as arg0 + 360.0 using Java double arithmetic;
    at sufficiently large magnitudes this addition may round to a different representable
    value or may leave the source value unchanged.
  - Source and follow-up outputs must be assessed using the supplied relation, which
    treats outputs within 1e-9 of either -180.0 or 180.0 as equivalent antimeridian
    representations.
  diversity:
    inputClass:
    - finite-in-range
    - finite-out-of-range
    - NaN
    - positive-infinity
    - negative-infinity
    sourceBranch:
    - direct-return
    - negative-off-return-180-plus-off
    - positive-exact-wrap-return-180
    - general-return-minus-180-plus-off
    boundaryPosition:
    - minus-180
    - just-below-minus-180
    - zero
    - plus-180
    - just-above-plus-180
    wrapPosition:
    - negative-exact-multiple
    - positive-exact-multiple
    - negative-nonzero-remainder
    - positive-nonzero-remainder
    floatingPointEffect:
    - signed-zero-preservation
    - fractional-remainder
    - ordinary-large-finite
    - follow-up-rounded-differently
    - follow-up-unchanged
  scenarios:
  - id: INTERIOR_NEGATIVE
    category: NORMAL
    description: Finite longitude strictly inside the normal range on the negative
      side.
    preconditions:
    - arg0 = -90.0
    - -180.0 < arg0 < 180.0
    expectedSourceBehavior:
    - Returns arg0 directly without computing a modulo remainder.
    - Source output is exactly -90.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERIOR_POSITIVE
    category: NORMAL
    description: Finite longitude strictly inside the normal range on the positive
      side.
    preconditions:
    - arg0 = 90.0
    - -180.0 < arg0 < 180.0
    expectedSourceBehavior:
    - Returns arg0 directly without computing a modulo remainder.
    - Source output is exactly 90.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_AND_SIGNED_ZERO
    category: EDGE
    description: Both representable zero signs are inside the direct-return interval.
    preconditions:
    - arg0 is one of +0.0 or -0.0
    - -180.0 <= arg0 <= 180.0
    expectedSourceBehavior:
    - Returns the supplied zero directly.
    - The direct return avoids modulo arithmetic that could alter a signed-zero representation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOWER_INCLUSIVE_BOUNDARY
    category: BOUNDARY
    description: The documented lower endpoint is returned unchanged.
    preconditions:
    - arg0 = -180.0
    expectedSourceBehavior:
    - Takes the inclusive direct-return branch.
    - Source output is exactly -180.0.
    - The follow-up input is 180.0, so the supplied assertion accepts the two antimeridian
      endpoint representations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_INCLUSIVE_BOUNDARY
    category: BOUNDARY
    description: The documented upper endpoint is returned unchanged.
    preconditions:
    - arg0 = 180.0
    expectedSourceBehavior:
    - Takes the inclusive direct-return branch.
    - Source output is exactly 180.0.
    - The follow-up input is 540.0, which reaches the positive exact-wrap sentinel
      path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_LOWER_BOUNDARY
    category: BOUNDARY
    description: Nearest representable finite value below -180.0 enters the modulo
      path.
    preconditions:
    - arg0 = Math.nextDown(-180.0)
    - arg0 < -180.0
    expectedSourceBehavior:
    - Does not take the direct-return branch.
    - Computes off = (arg0 + 180.0) % 360.0 with a negative nonzero remainder.
    - Returns 180.0 + off, producing a value just below 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_UPPER_BOUNDARY
    category: BOUNDARY
    description: Nearest representable finite value above 180.0 enters the modulo
      path.
    preconditions:
    - arg0 = Math.nextUp(180.0)
    - arg0 > 180.0
    expectedSourceBehavior:
    - Does not take the direct-return branch.
    - Computes off = (arg0 + 180.0) % 360.0 with a positive nonzero remainder.
    - Returns -180.0 + off, producing a value just above -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_DEGREE_OUTSIDE
    category: EDGE
    description: A negative longitude immediately outside the lower range with a negative
      modulo remainder.
    preconditions:
    - arg0 = -181.0
    expectedSourceBehavior:
    - Computes off = -1.0.
    - Takes the off < 0 branch.
    - Source output is exactly 179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ONE_DEGREE_OUTSIDE
    category: EDGE
    description: A positive longitude immediately outside the upper range with a positive
      modulo remainder.
    preconditions:
    - arg0 = 181.0
    expectedSourceBehavior:
    - Computes off = 1.0.
    - Takes the general final return branch.
    - Source output is exactly -179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_HALF_TURN_WRAP
    category: EDGE
    description: Negative exact wrap whose remainder is -180.0 rather than zero.
    preconditions:
    - arg0 = -360.0
    expectedSourceBehavior:
    - Computes off = -180.0.
    - Takes the off < 0 branch.
    - Source output is exactly 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_HALF_TURN_WRAP
    category: EDGE
    description: Positive exact wrap whose remainder is 180.0 rather than zero.
    preconditions:
    - arg0 = 360.0
    expectedSourceBehavior:
    - Computes off = 180.0.
    - Takes the general final return branch.
    - Source output is exactly 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_ANTIMERIDIAN_WRAP
    category: EDGE
    description: Negative multiple-of-360 wrapping to the lower antimeridian representation.
    preconditions:
    - arg0 = -540.0
    expectedSourceBehavior:
    - Computes a zero-valued remainder from a negative dividend.
    - Does not satisfy lon_deg > 0 in the exact-wrap condition.
    - Takes the final return branch and produces -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_ANTIMERIDIAN_WRAP
    category: EDGE
    description: Positive multiple-of-360 exercising the off == 0 && lon_deg > 0 sentinel.
    preconditions:
    - arg0 = 540.0
    expectedSourceBehavior:
    - Computes off = 0.0.
    - Takes the positive exact-wrap sentinel branch.
    - Source output is exactly 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_MULTI_REVOLUTION_NONZERO_REMAINDER
    category: NORMAL
    description: Negative longitude several revolutions out of range with a nonzero
      negative remainder.
    preconditions:
    - arg0 = -901.0
    expectedSourceBehavior:
    - Computes a negative nonzero off value.
    - Takes the off < 0 branch.
    - Source output is in the documented [-180.0, 180.0] interval.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_MULTI_REVOLUTION_NONZERO_REMAINDER
    category: NORMAL
    description: Positive longitude several revolutions out of range with a nonzero
      positive remainder.
    preconditions:
    - arg0 = 901.0
    expectedSourceBehavior:
    - Computes a positive nonzero off value.
    - Takes the final return branch.
    - Source output is in the documented [-180.0, 180.0] interval.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_WRAP
    category: NORMAL
    description: Negative non-integral longitude outside the range.
    preconditions:
    - arg0 = -540.25
    expectedSourceBehavior:
    - Computes a negative fractional off value.
    - Takes the off < 0 branch.
    - Source output is -180.25 + 360.0, equivalently 179.75.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_WRAP
    category: NORMAL
    description: Positive non-integral longitude outside the range.
    preconditions:
    - arg0 = 540.25
    expectedSourceBehavior:
    - Computes a positive fractional off value.
    - Takes the final return branch.
    - Source output is -179.75.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FRACTIONAL_INTERIOR_NO_NORMALIZATION
    category: NORMAL
    description: Fractional longitude already in range, ensuring no unnecessary precision-shifting
      arithmetic.
    preconditions:
    - arg0 = 179.999999999
    - -180.0 < arg0 < 180.0
    expectedSourceBehavior:
    - Returns arg0 directly.
    - Source output is exactly the input double rather than a recomputed equivalent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_ORDINARY_WRAP
    category: EDGE
    description: Large but finite longitude for which adding 360.0 remains representably
      distinct.
    preconditions:
    - arg0 = 1000000000000.0
    - arg0 + 360.0 != arg0
    - arg0 > 180.0
    expectedSourceBehavior:
    - Takes the modulo normalization path.
    - Produces a finite normalized result in [-180.0, 180.0].
    - Exercises remainder arithmetic at a magnitude much larger than ordinary longitude
      inputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_FINITE_ORDINARY_WRAP
    category: EDGE
    description: Large negative finite longitude for which adding 360.0 remains representably
      distinct.
    preconditions:
    - arg0 = -1000000000000.0
    - arg0 + 360.0 != arg0
    - arg0 < -180.0
    expectedSourceBehavior:
    - Takes the modulo normalization path.
    - Produces a finite normalized result in [-180.0, 180.0].
    - Exercises negative large-magnitude remainder arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_ROUNDS_TO_DIFFERENT_LARGE_VALUE
    category: EDGE
    description: A finite magnitude at which the generated follow-up is rounded by
      double arithmetic and is not mathematically represented as an exact +360.0 shift.
    preconditions:
    - arg0 = Math.scalb(1.0, 61)
    - arg0 > 180.0
    - arg0 + 360.0 != arg0
    - (arg0 + 360.0) - arg0 != 360.0
    expectedSourceBehavior:
    - Source takes the modulo normalization path.
    - The source output is finite and normalized to [-180.0, 180.0].
    - This case measures whether the supplied 1e-9 relation tolerance remains meaningful
      when the transformation itself is rounded.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_COLLAPSES_TO_SAME_LARGE_VALUE
    category: EDGE
    description: A finite magnitude at which adding 360.0 does not change the representable
      double follow-up input.
    preconditions:
    - arg0 = Math.scalb(1.0, 62)
    - arg0 > 180.0
    - arg0 + 360.0 == arg0
    expectedSourceBehavior:
    - Source takes the modulo normalization path.
    - The follow-up invocation receives the exact same double as the source invocation.
    - Source and follow-up outputs are therefore produced by the same computation
      on the same argument.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FOLLOW_UP_COLLAPSES_TO_SAME_LARGE_VALUE
    category: EDGE
    description: Negative finite counterpart where the generated +360.0 follow-up
      is indistinguishable from the source double.
    preconditions:
    - arg0 = -Math.scalb(1.0, 62)
    - arg0 < -180.0
    - arg0 + 360.0 == arg0
    expectedSourceBehavior:
    - Source takes the modulo normalization path.
    - The follow-up invocation receives the same representable double value.
    - Exercises large negative remainder handling without a representable follow-up
      shift.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_FINITE_DOUBLE
    category: EDGE
    description: Greatest finite positive double accepted by the primitive parameter.
    preconditions:
    - arg0 = Double.MAX_VALUE
    - arg0 > 180.0
    - Double.isFinite(arg0)
    expectedSourceBehavior:
    - Takes the modulo normalization path.
    - The source result is determined by finite IEEE-754 addition and remainder operations.
    - The generated follow-up remains finite and may equal the source input due to
      representational spacing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIN_FINITE_DOUBLE
    category: EDGE
    description: Greatest-magnitude finite negative double accepted by the primitive
      parameter.
    preconditions:
    - arg0 = -Double.MAX_VALUE
    - arg0 < -180.0
    - Double.isFinite(arg0)
    expectedSourceBehavior:
    - Takes the modulo normalization path.
    - The source result is determined by finite IEEE-754 addition and remainder operations.
    - The generated follow-up remains finite and may equal the source input due to
      representational spacing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NOT_A_NUMBER
    category: EDGE
    description: NaN is accepted by the double parameter and fails both ordered range
      comparisons.
    preconditions:
    - Double.isNaN(arg0)
    expectedSourceBehavior:
    - Does not take the direct-return branch because ordered comparisons with NaN
      are false.
    - off is NaN after the remainder operation.
    - Neither off < 0 nor off == 0 is true, so the final return produces NaN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INFINITY
    category: EDGE
    description: Positive infinity is outside the direct-return interval and reaches
      IEEE-754 remainder behavior.
    preconditions:
    - arg0 == Double.POSITIVE_INFINITY
    expectedSourceBehavior:
    - Does not take the direct-return branch.
    - (arg0 + 180.0) % 360.0 is NaN.
    - The final return produces NaN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INFINITY
    category: EDGE
    description: Negative infinity is outside the direct-return interval and reaches
      IEEE-754 remainder behavior.
    preconditions:
    - arg0 == Double.NEGATIVE_INFINITY
    expectedSourceBehavior:
    - Does not take the direct-return branch.
    - (arg0 + 180.0) % 360.0 is NaN.
    - The final return produces NaN.
    targetCases: 1
    emptyOutputAllowed: false
