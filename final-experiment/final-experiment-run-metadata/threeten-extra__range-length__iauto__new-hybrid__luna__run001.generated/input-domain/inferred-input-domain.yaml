InputDomain:
  summary: Valid LocalDateRange sources with a finite exclusive end that can be moved
    23 days later by the supplied follow-up generator; cases cover bounded, empty,
    unbounded-start, construction-path, date-boundary, and integer-boundary behavior.
  globalConstraints:
  - The source receiver is a non-null LocalDateRange created through one of the supplied
    valid construction paths.
  - The source end is not LocalDate.MAX, because generateFollowUp calls range.getEnd().plusDays(23),
    which would be invalid for LocalDate.MAX.
  - The source end is on or before LocalDate.MAX.minusDays(23), so the follow-up end
    calculation succeeds without LocalDate overflow.
  - 'The source range satisfies LocalDateRange construction restrictions: end is not
    before start, start is not LocalDate.MAX.minusDays(1), end is not LocalDate.MIN
    or LocalDate.MIN.plusDays(1), and an empty range is not located at LocalDate.MIN
    or LocalDate.MAX.'
  - No invalid-input scenario is included because the supplied metamorphic relation
    constructs a follow-up only from a valid LocalDateRange and does not specify invalid-input
    behavior.
  - A source with LocalDate.MIN as its start is allowed when its finite end satisfies
    the other constraints; such a range is unbounded at the start and lengthInDays()
    returns the Integer.MAX_VALUE sentinel.
  diversity:
    constructionPath:
    - of(start
    - end)
    - of(start
    - Period)
    - ofClosed(start
    - end)
    - ofEmpty(date)
    - from(LocalDate)
    - from(Year)
    - from(YearMonth)
    - from(YearHalf)
    - from(YearQuarter)
    - from(YearWeek)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    - ofUnboundedStart(end)
    boundedLengthClass:
    - zero
    - one
    - small-positive
    - month-scale
    - leap-crossing
    - year-scale
    - Integer.MAX_VALUE-minus-23-or-less
    - greater-than-Integer.MAX_VALUE
    boundaryPosition:
    - ordinary-calendar-dates
    - LocalDate.MIN-start
    - near-LocalDate.MAX-follow-up
    - month-boundary
    - year-boundary
    - leap-day-boundary
    sentinelBehavior:
    - finite-bounded-source-and-follow-up
    - unbounded-start-source-and-follow-up
    - follow-up-becomes-unbounded-end
    followUpOutcome:
    - ordinary-finite-end
    - end-reaches-LocalDate.MAX
    - source-output-sentinel
  scenarios:
  - id: EMPTY_RANGE_VIA_OF
    category: BOUNDARY
    description: A valid empty half-open range whose start and exclusive end are equal
      at an ordinary date.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 6, 10), LocalDate.of(2024,
      6, 10)).
    - The source start and end are equal and are neither LocalDate.MIN nor LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 0 because the number of days between equal bounds is
      zero.
    - The follow-up has the same start and an exclusive end 23 days later, so its
      finite length is 23.
    - The relation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_RANGE_VIA_OF
    category: BOUNDARY
    description: A one-day half-open range, exercising the smallest positive bounded
      length.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 6, 10), LocalDate.of(2024,
      6, 11)).
    - The exclusive end is exactly one day after the inclusive start.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up remains finite and has length 24.
    - The relation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MULTI_DAY_RANGE
    category: NORMAL
    description: An ordinary bounded range spanning several weeks.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 2, 1), LocalDate.of(2024,
      2, 29)).
    - The source has a finite end at least 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns the whole-day difference between the two bounds, namely
      28.
    - The follow-up is finite and lengthInDays() is 51.
    - The relation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: EDGE
    description: A bounded range crossing February 29 in a leap year.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 2)).
    - The range includes the leap-day boundary in its date difference.
    expectedSourceBehavior:
    - lengthInDays() accounts for February 29 and returns 3.
    - The follow-up has finite length 26.
    - The relation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_BOUNDARY_RANGE
    category: BOUNDARY
    description: A range whose start and end lie in adjacent calendar months.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2023, 1, 31), LocalDate.of(2023,
      3, 1)).
    - The source crosses a month boundary and has a finite end.
    expectedSourceBehavior:
    - lengthInDays() returns the calendar day difference of 29.
    - The follow-up extends only the exclusive end and increases the finite length
      by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_RANGE
    category: BOUNDARY
    description: A bounded range crossing December 31 and January 1.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024,
      1, 2)).
    - The source end is finite and safely extendable by 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    - The relation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_RANGE
    category: BOUNDARY
    description: An empty range created through the start-plus-Period construction
      path.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 6, 10), Period.ZERO).
    - The period is non-negative and zero, and the resulting date is not a prohibited
      empty-range location.
    expectedSourceBehavior:
    - The period produces equal start and end dates, so lengthInDays() returns 0.
    - The follow-up is a 23-day finite range and the relation observes an increase
      of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_RANGE
    category: NORMAL
    description: A range created by adding a calendar month through Period.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 1, 15), Period.ofMonths(1)).
    - The period is non-negative and produces the finite end 2024-02-15.
    expectedSourceBehavior:
    - lengthInDays() returns the actual day difference between January 15 and February
      15, namely 31.
    - The follow-up length is 54.
    - The relation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DAY_RANGE
    category: BOUNDARY
    description: A one-day range created by the closed-range factory.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 10), LocalDate.of(2024,
      6, 10)).
    - The inclusive start and end are equal and are not prohibited boundary dates.
    expectedSourceBehavior:
    - ofClosed converts the inclusive end to the following exclusive date.
    - lengthInDays() returns 1.
    - The follow-up has length 24 and satisfies the 23-day increase relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DAY_RANGE
    category: NORMAL
    description: A multi-day range created from distinct inclusive endpoints.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2024, 2, 27), LocalDate.of(2024,
      3, 1)).
    - The closed range crosses leap day and becomes an exclusive range ending on 2024-03-02.
    expectedSourceBehavior:
    - lengthInDays() returns 4 because both closed endpoints are included.
    - The follow-up adds 23 days to the exclusive end and increases the length by
      23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_DATE_RANGE
    category: NORMAL
    description: A range parsed from two date components.
    preconditions:
    - The source is LocalDateRange.parse("2024-04-01/2024-04-10").
    - The text contains one forward slash and two valid LocalDate representations.
    expectedSourceBehavior:
    - Parsing produces a half-open range with lengthInDays() equal to 9.
    - The generated follow-up is valid and has length 32.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_PERIOD_RANGE
    category: NORMAL
    description: A range parsed from a date followed by a non-negative Period.
    preconditions:
    - The source is LocalDateRange.parse("2024-04-01/P9D").
    - The parsed period is non-negative and produces a finite end.
    expectedSourceBehavior:
    - The parsed range has a nine-day bounded length.
    - The follow-up has length 32 and the relation observes an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_PERIOD_DATE_RANGE
    category: NORMAL
    description: A range parsed from a Period followed by an end date.
    preconditions:
    - The source is LocalDateRange.parse("P9D/2024-04-10").
    - The period is non-negative and the computed start is before or equal to the
      finite end.
    expectedSourceBehavior:
    - The parsed range has a nine-day bounded length.
    - The follow-up extends the end by 23 days without changing the parsed start.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: BOUNDARY
    description: A range created from a LocalDate temporal through from(Temporal).
    preconditions:
    - The source is LocalDateRange.from(LocalDate.of(2024, 5, 20)).
    - The temporal supplies a local date, so from(Temporal) uses a closed one-day
      range.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up is finite and the relation observes an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A range created from a Year temporal.
    preconditions:
    - The source is LocalDateRange.from(Year.of(2024)).
    - The Year is a valid non-boundary year whose January 1 through December 31 dates
      form a finite range.
    expectedSourceBehavior:
    - from(Temporal) creates the closed calendar-year range.
    - lengthInDays() returns 366 for the leap year 2024.
    - The follow-up extends the exclusive end by 23 and preserves the 23-day increase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A range created from a YearMonth temporal.
    preconditions:
    - The source is LocalDateRange.from(YearMonth.of(2024, 2)).
    - The YearMonth is valid and its first and last days form a finite closed range.
    expectedSourceBehavior:
    - lengthInDays() returns 29 for February 2024.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A range created from a YearHalf temporal.
    preconditions:
    - The source is LocalDateRange.from(YearHalf.of(2024, 1)).
    - The YearHalf supplies a valid first day and end-of-half date.
    expectedSourceBehavior:
    - from(Temporal) creates the corresponding finite closed half-year range.
    - lengthInDays() returns the number of whole days in that half-year.
    - The finite follow-up increases the returned length by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A range created from a YearQuarter temporal.
    preconditions:
    - The source is LocalDateRange.from(YearQuarter.of(2024, 1)).
    - The YearQuarter supplies a valid first and last day for the quarter.
    expectedSourceBehavior:
    - from(Temporal) creates a finite closed quarter range.
    - lengthInDays() returns the actual quarter day count, including February 29.
    - The follow-up length is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A range created from a YearWeek temporal.
    preconditions:
    - The source is LocalDateRange.from(YearWeek.of(2024, 10)).
    - The YearWeek supplies a valid Monday and Sunday.
    expectedSourceBehavior:
    - from(Temporal) creates the corresponding seven-day closed week range.
    - lengthInDays() returns 7.
    - The follow-up has length 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_SENTINEL
    category: EDGE
    description: A range unbounded at the start but with a finite, safely extendable
      end.
    preconditions:
    - The source is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 1, 1)).
    - The start is LocalDate.MIN and the end is finite and at least 23 days before
      LocalDate.MAX.
    expectedSourceBehavior:
    - The source is unbounded, so lengthInDays() returns Integer.MAX_VALUE rather
      than a real day count.
    - The follow-up remains unbounded at the start and lengthInDays() also returns
      Integer.MAX_VALUE.
    - The supplied relation skips the assertion because a source or follow-up output
      is the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MIN_FINITE_NEAR_BOUNDARY
    category: EDGE
    description: A finite-length range beginning at LocalDate.MIN and ending at the
      first constructor-permitted nearby date.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MIN, LocalDate.MIN.plusDays(2)).
    - The end is not LocalDate.MIN or LocalDate.MIN.plusDays(1), and the source is
      unbounded only at the start.
    expectedSourceBehavior:
    - lengthInDays() follows the unbounded-range sentinel behavior and returns Integer.MAX_VALUE.
    - The follow-up is constructible because its end is LocalDate.MIN.plusDays(25).
    - The relation skips arithmetic because the source output is the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_REACHES_UNBOUNDED_END
    category: EDGE
    description: A finite source whose exclusive end is exactly 23 days before LocalDate.MAX,
      causing the follow-up end to become LocalDate.MAX.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.MAX.minusDays(23)).
    - The source start is before the end and is not a prohibited start boundary.
    expectedSourceBehavior:
    - The source itself has a finite end and therefore exercises the bounded source
      path.
    - The follow-up is valid but has an unbounded end because its exclusive end is
      LocalDate.MAX.
    - The follow-up lengthInDays() returns Integer.MAX_VALUE, so the supplied relation
      intentionally skips the assertion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_BOUNDED_RANGE_WITH_INT_MAX_LENGTH
    category: EDGE
    description: A valid finite range whose whole-day length is exactly Integer.MAX_VALUE.
    preconditions:
    - The source start is a representable LocalDate such as LocalDate.of(1970, 1,
      1), and the source end is exactly Integer.MAX_VALUE days after that start.
    - The resulting end is on or before LocalDate.MAX.minusDays(23), so the follow-up
      can be constructed.
    - The source end is not LocalDate.MAX, so the source is not unbounded at the end.
    expectedSourceBehavior:
    - lengthInDays() returns an int for this bounded range, at the Integer.MAX_VALUE
      numeric boundary.
    - The follow-up is finite and exercises the relation's int subtraction at the
      upper output boundary.
    - The case is retained to expose sentinel-versus-real-length ambiguity and integer
      arithmetic behavior rather than being removed as a large value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_BOUNDED_RANGE_ABOVE_INT_MAX_LENGTH
    category: EDGE
    description: A valid finite range whose date difference exceeds Integer.MAX_VALUE
      while its follow-up remains constructible.
    preconditions:
    - The source has a finite end more than Integer.MAX_VALUE days after its start
      and at least 23 days before LocalDate.MAX.
    - The source start and end satisfy all LocalDateRange constructor restrictions.
    expectedSourceBehavior:
    - lengthInDays() returns the target method's int result for a real bounded range
      beyond the int day-count boundary.
    - The follow-up remains a valid LocalDateRange with the same start and an end
      23 days later.
    - The relation evaluates the returned int values, allowing this scenario to reveal
      any overflow or collision with the Integer.MAX_VALUE sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_RANGE_NEAR_FOLLOW_UP_LIMIT
    category: BOUNDARY
    description: A finite ordinary range ending one day before the latest end that
      can be extended by 23 days without reaching LocalDate.MAX.
    preconditions:
    - The source end is LocalDate.MAX.minusDays(24), and the source start is a valid
      date before that end.
    - The follow-up end becomes LocalDate.MAX.minusDays(1), which is finite and not
      LocalDate.MAX.
    expectedSourceBehavior:
    - Both source and follow-up have finite ends.
    - The follow-up is constructible without entering the unbounded-end sentinel path.
    - The relation observes the intended 23-day increase unless the int return representation
      overflows.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_FROM_PARSE
    category: BOUNDARY
    description: An empty range represented by equal date components in the parser.
    preconditions:
    - The source is LocalDateRange.parse("2024-06-10/2024-06-10").
    - The parsed equal bounds are at an ordinary date where an empty range is permitted.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a non-empty 23-day range.
    - The relation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_RANGE_FROM_LOCAL_DATE_TIME
    category: NORMAL
    description: A range created from a complete temporal with a date component, exercising
      conversion that ignores the time component.
    preconditions:
    - The source is LocalDateRange.from(LocalDateTime.of(2024, 7, 4, 15, 30)).
    - The temporal supplies a local date and is not a MonthDay or Month lacking sufficient
      date information.
    expectedSourceBehavior:
    - from(Temporal) converts the temporal to its LocalDate and creates the corresponding
      closed one-day range.
    - lengthInDays() returns 1.
    - The follow-up has length 24 and satisfies the relation.
    targetCases: 1
    emptyOutputAllowed: false
