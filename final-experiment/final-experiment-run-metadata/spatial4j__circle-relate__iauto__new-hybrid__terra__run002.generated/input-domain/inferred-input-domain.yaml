InputDomain:
  summary: Use finite, non-empty circles and rectangles in one flat non-geo SpatialContext.
    Unless stated otherwise, use circle center C=(cx,cy), radius r=5, and rectangle
    coordinates expressed as offsets from C; both source shapes are shifted by the
    MR offset (17.5,-9.25).
  globalConstraints:
  - Use one non-geo SpatialContext for the CircleImpl, its center Point, and the source
    Rectangle.
  - Circle center and all rectangle ordinates must be finite numbers; use only non-empty
    source shapes.
  - Circle radius must be finite and non-negative.
  - For every source case, the context must accept both the source coordinates and
    the translated coordinates after adding (17.5,-9.25) to the center and every rectangle
    bound.
  - 'Each rectangle must have finite ordered bounds: minX <= maxX and minY <= maxY.'
  - 'Do not use empty/NaN-coordinate shapes: the supplied MR numerically adds offsets
    to center and rectangle getter values, while the supplied API does not establish
    that empty-coordinate translation preserves a valid equivalent follow-up shape.'
  diversity:
    bboxRelation:
    - distinct
    - Observed enclosingBox.relate(rectangle) result
    - '[DISJOINT, WITHIN, CONTAINS, INTERSECTS, CONTAINS-with-equal-bounds]'
    phase2Outcome:
    - distinct
    - Direct relateRectanglePhase2 result where phase 2 is reached
    - '[DISJOINT, INTERSECTS, CONTAINS]'
    axisPlacement:
    - distinct
    - Circle axis relative to rectangle intervals
    - '[outside-x-and-y, inside-x-only, inside-y-only, inside-both]'
    boundaryKind:
    - distinct
    - Exact geometric equality or distance boundary
    - '[strict-gap, bbox-touch, circle-tangent, farthest-corner-tangent, equal-bbox]'
    rectangleDimensionality:
    - distinct
    - Rectangle extent dimensions
    - '[area, vertical-line, horizontal-line, point]'
    radius:
    - distinct
    - Circle radius values
    - '[0, 5]'
  scenarios:
  - id: BBOX_DISJOINT_HORIZONTAL_GAP
    category: NORMAL
    description: The rectangle is strictly beyond the circle enclosing box on exactly
      one horizontal side.
    preconditions:
    - r=5; rectangle is [cx+6,cx+7] x [cy-1,cy+1], or its horizontal reflection [cx-7,cx-6]
      x [cy-1,cy+1].
    - The rectangle has positive width and height.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT without geometric phase 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_VERTICAL_GAP
    category: NORMAL
    description: The rectangle is strictly beyond the circle enclosing box on exactly
      one vertical side.
    preconditions:
    - r=5; rectangle is [cx-1,cx+1] x [cy+6,cy+7], or its vertical reflection [cx-1,cx+1]
      x [cy-7,cy-6].
    - The rectangle has positive width and height.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT before phase 2.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_DIAGONAL_GAP
    category: NORMAL
    description: The rectangle is outside the enclosing box in both coordinate directions.
    preconditions:
    - r=5; rectangle is [cx+6,cx+7] x [cy+6,cy+7], or the opposite-corner reflection
      [cx-7,cx-6] x [cy-7,cy-6].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PHASE2_DIAGONAL_DISJOINT_WITH_BBOX_CONTAINS
    category: EDGE
    description: The enclosing box contains the rectangle, but the rectangle lies
      in a circle-exterior corner.
    preconditions:
    - r=5; rectangle is [cx+4,cx+5] x [cy+4,cy+5], or its opposite-corner reflection.
    - The closest rectangle corner to C is at distance greater than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - Both circle axes are outside the rectangle intervals.
    - Phase 2 rejects the closest corner and returns DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PHASE2_DIAGONAL_DISJOINT_WITH_BBOX_INTERSECTS
    category: EDGE
    description: The rectangle overlaps only an enclosing-box corner but remains entirely
      outside the circle.
    preconditions:
    - r=5; rectangle is [cx+4,cx+6] x [cy+4,cy+6], or its opposite-corner reflection.
    - The closest rectangle corner to C is at distance greater than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - Both circle axes are outside the rectangle intervals.
    - Phase 2 returns DISJOINT after the closest-corner containment check.
    targetCases: 2
    emptyOutputAllowed: false
  - id: STRICT_CIRCLE_WITHIN_RECTANGLE
    category: NORMAL
    description: A positive-area rectangle strictly contains the full circle enclosing
      box.
    preconditions:
    - r=5; rectangle is [cx-6,cx+6] x [cy-6,cy+6].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN.
    - relate(rectangle) returns WITHIN without phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_WITHIN_RECTANGLE_AT_BBOX_BOUNDARY
    category: BOUNDARY
    description: The rectangle contains the circle, with one rectangle edge exactly
      equal to an enclosing-box edge.
    preconditions:
    - r=5; rectangle is [cx-5,cx+6] x [cy-6,cy+6], or a reflection that selects one
      of the other three enclosing-box sides.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN despite a shared boundary.
    - relate(rectangle) returns WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RECTANGLE_EQUALS_CIRCLE_ENCLOSING_BOX
    category: EDGE
    description: The rectangle has exactly the circle enclosing-box bounds, exercising
      the explicit equal-bounds identity edge case.
    preconditions:
    - r=5; rectangle is [cx-5,cx+5] x [cy-5,cy+5].
    - rectangle.equals(circle.getBoundingBox()) is true.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - The equal-bounds special case returns WITHIN rather than continuing into phase
      2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_INTERSECTS_RECTANGLE_SPANNING_Y_AXIS
    category: NORMAL
    description: The rectangle overlaps the circle on the horizontal side and spans
      the circle's vertical axis.
    preconditions:
    - r=5; rectangle is [cx+4,cx+6] x [cy-1,cy+1], or its horizontal reflection.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - The rectangle spans the y axis, so phase 2 cannot classify it as disjoint through
      the two-axis closest-corner test.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_INTERSECTS_RECTANGLE_SPANNING_X_AXIS
    category: NORMAL
    description: The rectangle overlaps the circle on the vertical side and spans
      the circle's horizontal axis.
    preconditions:
    - r=5; rectangle is [cx-1,cx+1] x [cy+4,cy+6], or its vertical reflection.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is INTERSECTS.
    - The rectangle spans the x axis.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CIRCLE_CONTAINS_STRICT_INTERIOR_RECTANGLE
    category: NORMAL
    description: A positive-area rectangle lies well inside the circle.
    preconditions:
    - r=5; rectangle is [cx-1,cx+1] x [cy-1,cy+1].
    - Every rectangle corner is strictly closer than 5 to C.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - Phase 2 finds the farthest corner contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_CIRCLE_INTERSECTS_RECTANGLE
    category: NORMAL
    description: The enclosing box contains the rectangle but the rectangle's farthest
      corner is outside the circle.
    preconditions:
    - r=5; rectangle is [cx-4,cx+4] x [cy-4,cy+4].
    - The farthest rectangle corner has distance sqrt(32), which is greater than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - Phase 2 passes non-disjointness but rejects farthest-corner containment.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: The farthest rectangle corner is exactly on the circle boundary,
      testing inclusive containment at the CONTAINS decision.
    preconditions:
    - r=5; rectangle is [cx-3,cx+3] x [cy-4,cy+4], or the equivalent rectangle with
      x and y extents swapped.
    - Each farthest corner has distance exactly 5 from C.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - The farthest-corner contains check succeeds on the distance boundary.
    - relate(rectangle) returns CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CLOSEST_CORNER_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: A corner-side rectangle is tangent to the circle at its closest corner.
    preconditions:
    - r=5; rectangle is [cx+3,cx+4] x [cy+4,cy+5], or its opposite-corner reflection.
    - The closest rectangle corner is (cx+3,cy+4), at distance exactly 5.
    expectedSourceBehavior:
    - The closest-corner check treats the tangency point as contained.
    - The farthest corner is not contained.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RECTANGLE_EDGE_TANGENT_TO_CIRCLE
    category: BOUNDARY
    description: A rectangle begins at a circle extremum and shares a tangent boundary
      point.
    preconditions:
    - r=5; rectangle is [cx+5,cx+6] x [cy-1,cy+1], or its horizontal reflection.
    - The rectangle includes exactly one circle-extremum point on its nearer vertical
      edge.
    expectedSourceBehavior:
    - The enclosing box and rectangle intersect at the bounding-box boundary.
    - The rectangle spans one circle axis, preventing the two-axis disjoint shortcut.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: VERTICAL_LINE_INSIDE_CIRCLE
    category: EDGE
    description: A zero-width rectangle is a vertical line segment wholly inside the
      circle.
    preconditions:
    - r=5; rectangle is [cx,cx] x [cy-1,cy+1].
    - The rectangle has zero width and positive height.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - The farthest endpoint is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_LINE_CROSSING_CIRCLE
    category: EDGE
    description: A zero-height rectangle is a horizontal line segment that crosses
      the circle but extends beyond it.
    preconditions:
    - r=5; rectangle is [cx-6,cx+6] x [cy,cy].
    - The rectangle has positive width and zero height.
    expectedSourceBehavior:
    - The rectangle and enclosing box intersect.
    - The farthest line endpoint is outside the circle.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_INSIDE_CIRCLE
    category: EDGE
    description: A zero-area rectangle represents a point strictly inside the circle.
    preconditions:
    - r=5; rectangle is [cx+1,cx+1] x [cy+1,cy+1], or a reflected interior point.
    - The point distance from C is strictly less than 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - The point selected as the farthest rectangle point is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: A zero-area rectangle represents a point exactly on the circle boundary.
    preconditions:
    - r=5; rectangle is [cx+5,cx+5] x [cy,cy], or one of the other three axis extrema.
    expectedSourceBehavior:
    - The point is contained under the circle distance boundary.
    - relate(rectangle) returns CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_OUTSIDE_CIRCLE_BBOX
    category: EDGE
    description: A zero-area rectangle represents a point outside the enclosing box.
    preconditions:
    - r=5; rectangle is [cx+6,cx+6] x [cy,cy], or a reflection to another axis direction.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(rectangle) returns DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_WITHIN_RECTANGLE
    category: EDGE
    description: A radius-zero circle is strictly inside a positive-area rectangle.
    preconditions:
    - r=0; rectangle is [cx-1,cx+1] x [cy-1,cy+1].
    expectedSourceBehavior:
    - The radius-zero enclosing box is within the rectangle.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUAL_POINT_RECTANGLE
    category: EDGE
    description: Both the radius-zero circle enclosing box and the rectangle are the
      same point.
    preconditions:
    - r=0; rectangle is [cx,cx] x [cy,cy].
    - rectangle.equals(circle.getBoundingBox()) is true.
    expectedSourceBehavior:
    - The explicit equal-bounds branch is reached.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_POINT_RECTANGLE
    category: EDGE
    description: A radius-zero circle and a distinct point rectangle are separated.
    preconditions:
    - r=0; rectangle is [cx+1,cx+1] x [cy,cy], or a reflection to another axis direction.
    expectedSourceBehavior:
    - The point enclosing box is disjoint from the rectangle point.
    - relate(rectangle) returns DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
