InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be advanced by exactly
    23 days; includes empty, bounded, unbounded-start, calendar-boundary, chronology-boundary,
    integer-conversion, parsing, and factory-path cases.
  globalConstraints:
  - The source receiver is non-null, as generateFollowUp rejects a null range.
  - The source receiver is a successfully constructed LocalDateRange satisfying its
    invariant that the exclusive end is on or after the inclusive start.
  - The source exclusive end satisfies range.getEnd().compareTo(LocalDate.MAX.minusDays(23))
    <= 0, so range.getEnd().plusDays(23) succeeds.
  - Consequently, ranges with an unbounded end, the fully unbounded range, and otherwise-valid
    ranges ending after LocalDate.MAX.minusDays(23) are excluded because generateFollowUp
    would fail before the relation assertion.
  - The source may have an unbounded start; these inputs are retained because adding
    23 days to their bounded end and reconstructing the range succeeds, after which
    the relation deliberately skips the Integer.MAX_VALUE sentinel.
  - No invalid or null constructor arguments are included because the metamorphic
    relation requests valid LocalDateRange inputs and defines no invalid-input relation.
  diversity:
    boundedness:
    - bounded
    - unbounded-start
    sourceLengthClass:
    - zero
    - one-day
    - below-23
    - exactly-23
    - above-23
    - Integer.MAX_VALUE-boundary
    - int-wraparound
    followUpClass:
    - bounded
    - unbounded-end-sentinel
    - skipped-because-source-sentinel
    - skipped-because-follow-up-sentinel
    chronologyRegion:
    - LocalDate.MIN-near
    - negative-year
    - epoch-near
    - modern
    - LocalDate.MAX-near
    calendarBoundary:
    - ordinary-day
    - month-end
    - year-end
    - leap-day
    - common-February
    constructionPath:
    - of-date-date
    - of-date-period
    - ofClosed
    - ofEmpty
    - ofUnboundedStart
    - from
    - parse
  scenarios:
  - id: EMPTY_ORDINARY_DATE
    category: EDGE
    description: A bounded empty range at an ordinary date.
    preconditions:
    - range.getStart().equals(LocalDate.of(2024, 6, 15))
    - range.getEnd().equals(LocalDate.of(2024, 6, 15))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN
    category: BOUNDARY
    description: The smallest non-empty bounded half-open range.
    preconditions:
    - range.getStart().equals(LocalDate.of(2024, 6, 15))
    - range.getEnd().equals(LocalDate.of(2024, 6, 16))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_TWENTY_TWO
    category: BOUNDARY
    description: A bounded range one day shorter than the 23-day extension.
    preconditions:
    - range.getStart().equals(LocalDate.of(2024, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(22))
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EXACTLY_TWENTY_THREE
    category: BOUNDARY
    description: A bounded range whose source length equals EXTRA_DAYS.
    preconditions:
    - range.getStart().equals(LocalDate.of(2024, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(23))
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_TWENTY_FOUR
    category: BOUNDARY
    description: A bounded range one day longer than the 23-day extension.
    preconditions:
    - range.getStart().equals(LocalDate.of(2024, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(24))
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_FEBRUARY_CROSSING
    category: BOUNDARY
    description: A bounded range crossing February 29 in a leap year.
    preconditions:
    - range.getStart().equals(LocalDate.of(2020, 2, 28))
    - range.getEnd().equals(LocalDate.of(2020, 3, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_FEBRUARY_CROSSING
    category: BOUNDARY
    description: A bounded range crossing the corresponding February boundary in a
      common year.
    preconditions:
    - range.getStart().equals(LocalDate.of(2021, 2, 28))
    - range.getEnd().equals(LocalDate.of(2021, 3, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_END_CROSSING
    category: BOUNDARY
    description: A one-day range crossing from December into January.
    preconditions:
    - range.getStart().equals(LocalDate.of(2023, 12, 31))
    - range.getEnd().equals(LocalDate.of(2024, 1, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPOCH_CROSSING
    category: NORMAL
    description: A bounded range containing dates on both sides of the 1970 epoch.
    preconditions:
    - range.getStart().equals(LocalDate.of(1969, 12, 31))
    - range.getEnd().equals(LocalDate.of(1970, 1, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PROLEPTIC_YEAR_ZERO_CROSSING
    category: BOUNDARY
    description: A bounded range crossing from proleptic year -1 into year 0.
    preconditions:
    - range.getStart().equals(LocalDate.of(-1, 12, 31))
    - range.getEnd().equals(LocalDate.of(0, 1, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_BOUNDED_ONE_DAY
    category: EDGE
    description: The earliest valid bounded one-day range, immediately above the forbidden
      MIN and MIN+1 end positions.
    preconditions:
    - range.getStart().equals(LocalDate.MIN.plusDays(1))
    - range.getEnd().equals(LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns 1 rather than the unbounded sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_VALID_EMPTY
    category: EDGE
    description: An empty range at the earliest date where an empty LocalDateRange
      is permitted.
    preconditions:
    - range.getStart().equals(LocalDate.MIN.plusDays(2))
    - range.getEnd().equals(LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: A range with LocalDate.MIN as its unbounded start and an ordinary
      bounded end.
    preconditions:
    - range.isUnboundedStart()
    - range.getEnd().equals(LocalDate.of(2024, 1, 1))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range flag.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_MINIMUM_END
    category: EDGE
    description: An unbounded-start range using the earliest permitted exclusive end.
    preconditions:
    - range.getStart().equals(LocalDate.MIN)
    - range.getEnd().equals(LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: END_EXACTLY_MAX_MINUS_23
    category: EDGE
    description: The latest source end accepted by the transformation; adding 23 days
      produces LocalDate.MAX.
    preconditions:
    - range.getStart().equals(LocalDate.MAX.minusDays(23))
    - range.getEnd().equals(LocalDate.MAX.minusDays(23))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The source is bounded even though its follow-up will have the unbounded-end
      sentinel representation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: END_EXACTLY_MAX_MINUS_24
    category: EDGE
    description: A bounded source one day below the transformation's maximum-end boundary.
    preconditions:
    - range.getStart().equals(LocalDate.MAX.minusDays(25))
    - range.getEnd().equals(LocalDate.MAX.minusDays(24))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_CHRONOLOGY_FINITE_RANGE
    category: EDGE
    description: A finite range near LocalDate.MAX whose follow-up remains finite.
    preconditions:
    - range.getStart().equals(LocalDate.MAX.minusDays(400))
    - range.getEnd().equals(LocalDate.MAX.minusDays(300))
    expectedSourceBehavior:
    - lengthInDays() returns 100.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_MAX_MINUS_24
    category: BOUNDARY
    description: A very long bounded range immediately below the follow-up sentinel-collision
      boundary.
    preconditions:
    - range.getStart().equals(LocalDate.of(2000, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(2147483623L))
    expectedSourceBehavior:
    - lengthInDays() returns 2147483623.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_MAX_MINUS_23
    category: BOUNDARY
    description: A bounded source whose follow-up has a mathematical length of Integer.MAX_VALUE.
    preconditions:
    - range.getStart().equals(LocalDate.of(2000, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(2147483624L))
    expectedSourceBehavior:
    - lengthInDays() returns 2147483624.
    - The source output is not a sentinel, although the follow-up output will numerically
      equal the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_MAX_MINUS_22
    category: EDGE
    description: A bounded source whose 23-day extension crosses the signed-int result
      boundary.
    preconditions:
    - range.getStart().equals(LocalDate.of(2000, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(2147483625L))
    expectedSourceBehavior:
    - lengthInDays() returns 2147483625.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_EQUALS_SENTINEL
    category: EDGE
    description: A bounded range whose finite day count numerically equals Integer.MAX_VALUE.
    preconditions:
    - range.getStart().equals(LocalDate.of(2000, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(2147483647L))
    - The range is bounded at both ends.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE even though the range is not unbounded.
    - The assertion treats this numeric collision as a skipped sentinel case.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INT_MAX_PLUS_ONE
    category: EDGE
    description: A bounded range whose day count is one beyond the largest positive
      int.
    preconditions:
    - range.getStart().equals(LocalDate.of(2000, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(2147483648L))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MIN_VALUE after conversion to int.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_TWO_TO_32
    category: EDGE
    description: A non-empty bounded range whose converted int length aliases zero.
    preconditions:
    - range.getStart().equals(LocalDate.of(2000, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(4294967296L))
    expectedSourceBehavior:
    - lengthInDays() returns 0 even though range.isEmpty() is false.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_TWO_TO_32_PLUS_ONE
    category: EDGE
    description: A very long non-empty bounded range whose converted int length aliases
      one.
    preconditions:
    - range.getStart().equals(LocalDate.of(2000, 1, 1))
    - range.getEnd().equals(range.getStart().plusDays(4294967297L))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE
    category: BOUNDARY
    description: A source produced by ofClosed with equal inclusive endpoints.
    preconditions:
    - The receiver is produced by LocalDateRange.ofClosed(LocalDate.of(2024, 5, 10),
      LocalDate.of(2024, 5, 10)).
    expectedSourceBehavior:
    - lengthInDays() returns 1 because a closed single-date range is non-empty.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_MONTH_END
    category: BOUNDARY
    description: A closed range from January 31 through February 29 of a leap year.
    preconditions:
    - The receiver is produced by LocalDateRange.ofClosed(LocalDate.of(2020, 1, 31),
      LocalDate.of(2020, 2, 29)).
    expectedSourceBehavior:
    - lengthInDays() returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_COMMON_YEAR
    category: NORMAL
    description: A full common year represented with inclusive endpoints.
    preconditions:
    - The receiver is produced by LocalDateRange.ofClosed(LocalDate.of(2021, 1, 1),
      LocalDate.of(2021, 12, 31)).
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_YEAR
    category: NORMAL
    description: A full leap year represented with inclusive endpoints.
    preconditions:
    - The receiver is produced by LocalDateRange.ofClosed(LocalDate.of(2020, 1, 1),
      LocalDate.of(2020, 12, 31)).
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_UPPER_TRANSFORMATION_BOUNDARY
    category: EDGE
    description: A one-date closed source whose internal exclusive end is LocalDate.MAX.minusDays(23).
    preconditions:
    - The receiver is produced by LocalDateRange.ofClosed(LocalDate.MAX.minusDays(24),
      LocalDate.MAX.minusDays(24)).
    - range.getEnd().equals(LocalDate.MAX.minusDays(23))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Extending the internal end by 23 days produces LocalDate.MAX and therefore a
      sentinel follow-up.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO
    category: EDGE
    description: A valid zero-period range produced by the start-and-period factory.
    preconditions:
    - The receiver is produced by LocalDateRange.of(LocalDate.of(2024, 4, 10), Period.ZERO).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_EXACTLY_23_DAYS
    category: BOUNDARY
    description: A source produced from a period equal to EXTRA_DAYS.
    preconditions:
    - The receiver is produced by LocalDateRange.of(LocalDate.of(2024, 4, 10), Period.ofDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_MONTH_FROM_LEAP_JANUARY_END
    category: BOUNDARY
    description: A one-month period whose resulting day count is determined across
      a leap-year month end.
    preconditions:
    - The receiver is produced by LocalDateRange.of(LocalDate.of(2020, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - The exclusive end is LocalDate.of(2020, 2, 29).
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_YEAR_FROM_LEAP_DAY
    category: BOUNDARY
    description: A one-year period beginning on February 29.
    preconditions:
    - The receiver is produced by LocalDateRange.of(LocalDate.of(2020, 2, 29), Period.ofYears(1)).
    expectedSourceBehavior:
    - The exclusive end is LocalDate.of(2021, 2, 28).
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_COMPOSITE_MONTH_AND_DAYS
    category: NORMAL
    description: A non-negative composite period crossing a shortened February.
    preconditions:
    - The receiver is produced by LocalDateRange.of(LocalDate.of(2021, 1, 30), Period.of(0,
      1, 2)).
    expectedSourceBehavior:
    - The exclusive end is LocalDate.of(2021, 3, 2).
    - lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_FROM_MIN_TWO_DAYS
    category: EDGE
    description: A start-and-period range using LocalDate.MIN and the minimum period
      that yields a permitted end.
    preconditions:
    - The receiver is produced by LocalDateRange.of(LocalDate.MIN, Period.ofDays(2)).
    - range.getEnd().equals(LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A one-day range produced by converting a LocalDate temporal.
    preconditions:
    - The receiver is produced by LocalDateRange.from(LocalDate.of(2024, 7, 8)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TIME
    category: NORMAL
    description: A temporal with a time component converted to its LocalDate and then
      to a one-day range.
    preconditions:
    - The receiver is produced by LocalDateRange.from(java.time.LocalDateTime.of(2024,
      7, 8, 23, 59)).
    expectedSourceBehavior:
    - The time component does not affect the represented dates.
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEARMONTH
    category: BOUNDARY
    description: A complete leap February produced from a YearMonth temporal.
    preconditions:
    - The receiver is produced by LocalDateRange.from(java.time.YearMonth.of(2020,
      2)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_FEBRUARY_YEARMONTH
    category: BOUNDARY
    description: A complete common February produced from a YearMonth temporal.
    preconditions:
    - The receiver is produced by LocalDateRange.from(java.time.YearMonth.of(2021,
      2)).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: A complete common year produced from a Year temporal.
    preconditions:
    - The receiver is produced by LocalDateRange.from(java.time.Year.of(2021)).
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: NORMAL
    description: A complete leap year produced from a Year temporal.
    preconditions:
    - The receiver is produced by LocalDateRange.from(java.time.Year.of(2020)).
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_EMPTY
    category: EDGE
    description: An empty range parsed through the date/date syntax branch.
    preconditions:
    - The receiver is produced by LocalDateRange.parse("2024-06-15/2024-06-15").
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_NONEMPTY
    category: NORMAL
    description: A non-empty range parsed through the date/date syntax branch.
    preconditions:
    - The receiver is produced by LocalDateRange.parse("2024-06-01/2024-06-24").
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: BOUNDARY
    description: A range parsed through the date/period branch across a leap-February
      month end.
    preconditions:
    - The receiver is produced by LocalDateRange.parse("2020-01-31/P1M").
    expectedSourceBehavior:
    - The exclusive end is LocalDate.of(2020, 2, 29).
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: BOUNDARY
    description: A range parsed through the period/date branch with the start derived
      by subtraction.
    preconditions:
    - The receiver is produced by LocalDateRange.parse("P1M/2020-03-31").
    expectedSourceBehavior:
    - The start is LocalDate.of(2020, 2, 29).
    - lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_NEGATIVE_YEAR_DATES
    category: EDGE
    description: A date/date parsed range using signed proleptic years.
    preconditions:
    - The receiver is produced by LocalDateRange.parse("-0001-12-31/0000-01-02").
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
