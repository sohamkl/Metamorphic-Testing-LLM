InputDomain:
  summary: Finite, constructible LocalDateRange instances whose start is unchanged
    and whose representable exclusive end can be moved exactly 23 days later; include
    empty, unbounded-start, boundary, temporal-conversion, period, closed-range, and
    parsing construction paths.
  globalConstraints:
  - The receiver must be successfully constructible by one of the supplied LocalDateRange
    construction paths; nulls, reversed ranges, prohibited LocalDate.MIN or LocalDate.MAX
    boundary combinations, and other construction failures are outside this valid-input
    MR domain.
  - The original range must have a finite end, meaning its exclusive end is not LocalDate.MAX,
    because lengthInDays() returns Integer.MAX_VALUE for an unbounded range and no
    finite end 23 days later exists for that sentinel path.
  - The follow-up exclusive end must be representable as originalEnd.plusDays(23);
    therefore originalEnd must be no later than LocalDate.MAX.minusDays(23), and cases
    producing an unbounded follow-up end are excluded because the expected finite
    increment would not hold.
  - The start date must be identical in the source and follow-up ranges.
  - The follow-up range must remain ordered with end on or after start and must satisfy
    the constructor restrictions on start and end; the source and follow-up ranges
    may be empty or non-empty.
  - '{The source and follow-up finite lengths must be representable by the int result
    and the expected arithmetic must be valid=sourceLength is at most Integer.MAX_VALUE
    - 23.}'
  - '{The source range must be valid under the half-open representation used by lengthInDays()=start
    is inclusive and end is exclusive, including the documented special handling of
    LocalDate.MIN and LocalDate.MAX.}'
  - INVALID inputs are not included because the metamorphic relation specifies a valid
    end-date shift rather than invalid-input behavior.
  diversity:
    constructionPath:
    - of(LocalDate
    - LocalDate)
    - of(LocalDate
    - Period)
    - ofClosed(LocalDate
    - LocalDate)
    - ofEmpty(LocalDate)
    - ofUnboundedStart(LocalDate)
    - from(Temporal)
    - parse(CharSequence)
    temporalFromBranch:
    - LocalDate-or-date-bearing-temporal
    - Year
    - YearMonth
    - YearHalf
    - YearQuarter
    - YearWeek
    rangeShape:
    - empty
    - one-day
    - ordinary-finite
    - multi-month
    - unbounded-start
    endpointPosition:
    - near LocalDate.MIN
    - ordinary calendar date
    - leap-day or month boundary
    - near LocalDate.MAX while still shiftable
    parsedForm:
    - date/date
    - date/period
    - period/date
    expectedLengthRelation:
    - 0-to-23 for an empty source
    - positive finite length plus 23
  scenarios:
  - id: EMPTY_RANGE_STANDARD_DATE
    category: EDGE
    description: An empty finite range created at an ordinary date, followed by the
      same start and an exclusive end 23 days later.
    preconditions:
    - Construct the source with ofEmpty(LocalDate) at 2024-06-15.
    - The source start and end are equal and are neither prohibited boundary date.
    - The follow-up has the same start and exclusive end 2024-07-08.
    expectedSourceBehavior:
    - The source lengthInDays() returns 0.
    - The follow-up lengthInDays() returns 23.
    - The follow-up result equals the source result plus exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: A minimal non-empty half-open finite range of one whole day.
    preconditions:
    - Construct the source with of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1,
      2)).
    - The source length is one day and the shifted end 2024-01-25 remains finite and
      ordered.
    expectedSourceBehavior:
    - The source lengthInDays() returns 1.
    - The follow-up lengthInDays() returns 24.
    - The difference between follow-up and source results is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_HALF_OPEN_RANGE
    category: NORMAL
    description: An ordinary multi-day half-open range constructed directly from two
      dates.
    preconditions:
    - Construct the source with of(LocalDate.of(2023, 3, 10), LocalDate.of(2023, 4,
      5)).
    - The source exclusive end plus 23 days is representable and remains after the
      unchanged start.
    expectedSourceBehavior:
    - The source lengthInDays() returns the whole-day difference between its two dates.
    - The follow-up lengthInDays() is the source result plus exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: EDGE
    description: A finite range crossing February 29 in a leap year.
    preconditions:
    - Construct the source with of(LocalDate.of(2024, 2, 27), LocalDate.of(2024, 3,
      2)).
    - The follow-up exclusive end is 2024-03-25 and the start is unchanged.
    expectedSourceBehavior:
    - The source lengthInDays() counts February 29 as a whole day.
    - The follow-up lengthInDays() is exactly 23 greater than the source result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_START_FINITE_END
    category: BOUNDARY
    description: A finite range whose start is LocalDate.MIN, exercising the documented
      unbounded-start representation without using an unbounded end.
    preconditions:
    - Construct the source with of(LocalDate.MIN, LocalDate.MIN.plusDays(2)).
    - The end is not LocalDate.MIN or LocalDate.MIN.plusDays(1).
    - The shifted end is LocalDate.MIN.plusDays(25) and remains finite.
    expectedSourceBehavior:
    - The source is constructible with an unbounded start and has finite length 2.
    - The follow-up lengthInDays() returns 25.
    - The result difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_ADMISSIBLE_FINITE_END
    category: BOUNDARY
    description: A range ending at the first finite end position after the prohibited
      LocalDate.MIN boundary values.
    preconditions:
    - Construct the source with of(LocalDate.MIN, LocalDate.MIN.plusDays(2)).
    - Treat the exclusive end as the minimum admissible finite end for a range starting
      at LocalDate.MIN.
    - Shift that end by 23 days while keeping the same start.
    expectedSourceBehavior:
    - lengthInDays() returns 2 for the source.
    - The follow-up remains valid and returns 25.
    - The metamorphic difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_RANGE
    category: EDGE
    description: A zero-length period supplied to the start-and-period construction
      path at an ordinary date.
    preconditions:
    - Construct the source with of(LocalDate.of(2022, 8, 10), Period.ZERO).
    - The resulting source is an empty range at 2022-08-10.
    - Construct the follow-up with the same start and an end 23 days later.
    expectedSourceBehavior:
    - The source lengthInDays() returns 0.
    - The follow-up lengthInDays() returns 23.
    - The relation observes an exact increment of 23 rather than a merely positive
      change.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_PERIOD_RANGE
    category: NORMAL
    description: A finite range created with a positive day-based Period.
    preconditions:
    - Construct the source with of(LocalDate.of(2021, 5, 1), Period.ofDays(40)).
    - The source end is 2021-06-10 and its shifted end is 2021-07-03.
    expectedSourceBehavior:
    - lengthInDays() returns the period's 40 whole days.
    - The follow-up lengthInDays() returns 63.
    - The result difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_BASED_PERIOD_RANGE
    category: EDGE
    description: A positive period containing months, where date arithmetic crosses
      a month boundary.
    preconditions:
    - Construct the source with of(LocalDate.of(2023, 1, 31), Period.ofMonths(1)).
    - Use the end produced by LocalDate.plus(Period), namely 2023-02-28.
    - Shift that exclusive end by 23 days without changing the start.
    expectedSourceBehavior:
    - lengthInDays() reflects the actual date difference produced by the Period.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_STANDARD
    category: NORMAL
    description: A non-empty range created through ofClosed, whose inclusive end is
      converted to an exclusive end.
    preconditions:
    - Construct the source with ofClosed(LocalDate.of(2024, 4, 10), LocalDate.of(2024,
      4, 20)).
    - Its internal exclusive end is 2024-04-21.
    - Shift the internal exclusive end to 2024-05-14 while retaining the start.
    expectedSourceBehavior:
    - lengthInDays() counts the inclusive closed interval as 11 days through its exclusive
      representation.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_LEAP_END
    category: EDGE
    description: A closed range ending on leap day, exercising conversion of an inclusive
      leap-day endpoint to the next exclusive date.
    preconditions:
    - Construct the source with ofClosed(LocalDate.of(2024, 2, 27), LocalDate.of(2024,
      2, 29)).
    - The internal exclusive end is 2024-03-01.
    - Shift the exclusive end by 23 days and leave the start unchanged.
    expectedSourceBehavior:
    - lengthInDays() returns 3 for the closed interval.
    - The follow-up lengthInDays() is exactly 26.
    - The result difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FINITE_END
    category: EDGE
    description: A range created with ofUnboundedStart, exercising the unbounded-start
      branch while retaining a finite end.
    preconditions:
    - Construct the source with ofUnboundedStart(LocalDate.of(2000, 1, 1)).
    - The exclusive end is finite and at least 23 days before LocalDate.MAX.
    - The follow-up uses the same LocalDate.MIN start and an end 23 days later.
    expectedSourceBehavior:
    - lengthInDays() returns a finite int rather than Integer.MAX_VALUE because only
      the start is unbounded.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A date-bearing Temporal supplied to from, which is converted through
      the local-date query and then to a one-day closed range.
    preconditions:
    - Construct the source with from(LocalDate.of(2024, 6, 1)).
    - Its resulting range has one day of length and a finite exclusive end.
    - Shift that exclusive end by 23 days while retaining the derived start.
    expectedSourceBehavior:
    - lengthInDays() returns 1 for the one-day range produced by from.
    - The follow-up lengthInDays() is 24.
    - The result difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A Year Temporal converted by from into the closed range covering
      the whole year.
    preconditions:
    - Construct the source with from(Year.of(2023)).
    - The resulting range covers 2023-01-01 through the exclusive end after 2023-12-31.
    - The shifted end remains representable and finite.
    expectedSourceBehavior:
    - lengthInDays() returns the actual number of days in 2023.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A YearMonth Temporal converted by from into that month's closed date
      range.
    preconditions:
    - Construct the source with from(YearMonth.of(2024, 2)).
    - The resulting range covers February 1 through the exclusive date after February
      29.
    - Shift the exclusive end by 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up lengthInDays() returns 52.
    - The result difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A YearHalf Temporal converted by from into the half-year's closed
      date range.
    preconditions:
    - Construct the source with from(YearHalf.of(2023, 1)).
    - The resulting range covers the first half of 2023 and has a finite exclusive
      end.
    - Shift that exclusive end by 23 days without changing the derived start.
    expectedSourceBehavior:
    - lengthInDays() returns the actual day count for the first half of 2023.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A YearQuarter Temporal converted by from into the quarter's closed
      date range.
    preconditions:
    - Construct the source with from(YearQuarter.of(2024, 1)).
    - The resulting range covers January through March 2024 and has a finite exclusive
      end.
    - Shift that exclusive end by 23 days.
    expectedSourceBehavior:
    - lengthInDays() includes the leap day in the quarter's source length.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A YearWeek Temporal converted by from into the Monday-through-Sunday
      closed week.
    preconditions:
    - Construct the source with from(YearWeek.of(2024, 1)).
    - The resulting range contains seven days and has a finite exclusive end.
    - Shift that exclusive end by 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up lengthInDays() returns 30.
    - The result difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_DATE
    category: NORMAL
    description: A range parsed from the date/date textual form.
    preconditions:
    - Parse the source text 2024-05-10/2024-05-20.
    - The parsed exclusive end is finite and may be replaced by that date plus 23
      days.
    - The follow-up preserves the parsed start.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up lengthInDays() returns 33.
    - The result difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_PERIOD
    category: NORMAL
    description: A range parsed from the date/period textual form.
    preconditions:
    - Parse the source text 2024-01-15/P40D.
    - The parser computes a finite end by adding the Period to the parsed start.
    - Shift the computed exclusive end by 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns 40.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_PERIOD_DATE
    category: NORMAL
    description: A range parsed from the period/date textual form.
    preconditions:
    - Parse the source text P40D/2024-03-01.
    - The parser computes the start by subtracting the Period from the parsed end.
    - Shift the parsed exclusive end by 23 days while retaining that computed start.
    expectedSourceBehavior:
    - lengthInDays() returns 40.
    - The follow-up lengthInDays() is exactly 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_FINITE_END_SHIFT_BOUNDARY
    category: BOUNDARY
    description: A finite range whose exclusive end is exactly 23 days before LocalDate.MAX,
      so the follow-up ends at the latest still-finite shifted date.
    preconditions:
    - Set the source exclusive end to LocalDate.MAX.minusDays(23).
    - Use a valid start before that end and not LocalDate.MAX or LocalDate.MAX.minusDays(1).
    - The follow-up exclusive end is LocalDate.MAX.minusDays(0) only if the shift
      is permitted by the MR domain; otherwise use the latest end no later than LocalDate.MAX.minusDays(1)
      so both lengths remain finite.
    expectedSourceBehavior:
    - The source must not be treated as unbounded merely because its end is near LocalDate.MAX.
    - For the included representable finite follow-up, lengthInDays() increases by
      exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_START_NEAR_FORBIDDEN_BOUNDARY
    category: BOUNDARY
    description: A short finite range whose start is near LocalDate.MAX while avoiding
      the prohibited start values.
    preconditions:
    - Use start LocalDate.MAX.minusDays(26) and finite end LocalDate.MAX.minusDays(24).
    - The source span is two days and the shifted end is LocalDate.MAX.minusDays(1),
      which remains finite.
    - The follow-up keeps the same start.
    expectedSourceBehavior:
    - The source lengthInDays() returns 2.
    - The follow-up lengthInDays() returns 25.
    - The result difference is exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXCLUDED_UNBOUNDED_END_SENTINEL
    category: EDGE
    description: A valid range with an unbounded end, documented as an excluded sentinel
      class because the requested finite 23-day relation cannot hold.
    preconditions:
    - Construct with ofUnboundedEnd(LocalDate.of(2024, 1, 1)) or ofUnbounded().
    - The receiver has end LocalDate.MAX and therefore no representable finite end
      exactly 23 days later.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the documented unbounded-length
      flag.
    - This class is excluded from MR assertions rather than used as a vacuous finite
      increment case.
    targetCases: 1
    emptyOutputAllowed: false
