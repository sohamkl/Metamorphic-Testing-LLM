InputDomain:
  summary: Valid, finite Cartesian/non-geo circle-rectangle inputs sharing the circle
    context. Source cases use a radius-5 circle centered at (0,0) unless stated otherwise,
    so its Cartesian enclosing box is [-5,5] x [-5,5]. Cases cover bounding-box shortcut
    returns, the exact enclosing-box equality special case, phase-2 closest-corner
    disjointness, axis-spanning intersections, farthest-corner containment decisions,
    zero-radius circles, and valid degenerate rectangles.
  globalConstraints:
  - Both arguments are non-null because generateFollowUp requires non-null circle
    and rectangle.
  - The circle context is non-geo and Cartesian/flat, matching the stated SUT domain
    and avoiding dateline or pole behavior.
  - Circle center coordinates, radius, and all rectangle bounds are finite numeric
    values; radius is non-negative; rectangle minX <= maxX and minY <= maxY.
  - The source circle center, source rectangle bounds, shifted center (x + 17.5, y
    - 9.25), and shifted rectangle bounds remain valid coordinates in the circle's
    SpatialContext.
  - The rectangle is evaluated in the same SpatialContext as the circle so that the
    source and follow-up describe the same translated Cartesian geometry.
  - '{Empty circles and empty rectangles are excluded=the follow-up performs arithmetic
    on center and rectangle-bound values and reconstructs them through context.makePoint
    and RectangleImpl; the supplied API does not establish that translating empty/NaN
    sentinel coordinates is a valid, representation-preserving transformation.}'
  diversity:
    circleRadiusAndCenter:
    - radius 5 centered at (0,0)
    - radius 0 centered at (0,0)
    rectangleDimensionality:
    - positive-area rectangle
    - vertical line rectangle with minX = maxX
    - horizontal line rectangle with minY = maxY
    - point rectangle with minX = maxX and minY = maxY
    boundingBoxRelation:
    - DISJOINT
    - WITHIN
    - CONTAINS with exact equality
    - CONTAINS without equality
    - INTERSECTS
    phase2Geometry:
    - center outside both rectangle axes
    - center outside only x range
    - center outside only y range
    - center inside both rectangle ranges
    - closest corner outside circle
    - closest corner on circle boundary
    - farthest corner inside circle
    - farthest corner on circle boundary
    - farthest corner outside circle
  scenarios:
  - id: BBOX_DISJOINT_HORIZONTAL
    category: NORMAL
    description: Rectangle lies completely beyond the circle enclosing box on the
      positive x side.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=6, maxX=7, minY=-1, maxY=1.
    expectedSourceBehavior:
    - The enclosing-box relation is DISJOINT.
    - relate(rectangle) returns DISJOINT without entering rectangle phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_VERTICAL
    category: NORMAL
    description: Rectangle lies completely beyond the circle enclosing box on the
      positive y side.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-1, maxX=1, minY=6, maxY=7.
    expectedSourceBehavior:
    - The enclosing-box relation is DISJOINT.
    - relate(rectangle) returns DISJOINT from the bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_CORNER_DISJOINT
    category: NORMAL
    description: Rectangle overlaps the enclosing box near a corner but its closest
      corner is outside the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=4, maxX=5, minY=4, maxY=5.
    - The closest rectangle point to the center is (4,4), whose Euclidean distance
      exceeds 5.
    expectedSourceBehavior:
    - The bounding boxes are not DISJOINT.
    - Phase 2 tests the closest corner and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_RECTANGLE
    category: NORMAL
    description: Rectangle strictly contains the circle enclosing box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-6, maxX=6, minY=-6, maxY=6.
    expectedSourceBehavior:
    - The circle enclosing box is WITHIN the rectangle.
    - relate(rectangle) returns WITHIN from the bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_ENCLOSING_BOX_EQUALITY
    category: EDGE
    description: Rectangle exactly equals the non-zero-radius circle enclosing box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-5, maxX=5, minY=-5, maxY=5.
    - Rectangle equals circle.getBoundingBox().
    expectedSourceBehavior:
    - The enclosing-box relation is CONTAINS while enclosingBox.equals(rectangle)
      is true.
    - relate(rectangle) takes the explicit equality edge case and returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_X_AXIS_SPANNING
    category: NORMAL
    description: Rectangle spans the circle x axis but extends beyond the enclosing
      box in y.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-1, maxX=1, minY=4, maxY=6.
    - Rectangle contains x=0 but does not contain y=0.
    expectedSourceBehavior:
    - The bounding-box relation is INTERSECTS.
    - Phase 2 cannot classify the shapes as disjoint because the rectangle spans one
      center axis.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_Y_AXIS_SPANNING
    category: NORMAL
    description: Rectangle spans the circle y axis but extends beyond the enclosing
      box in x.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=4, maxX=6, minY=-1, maxY=1.
    - Rectangle contains y=0 but does not contain x=0.
    expectedSourceBehavior:
    - The bounding-box relation is INTERSECTS.
    - Phase 2 follows the one-axis-spanning path and returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_BOTH_AXES_SPANNING
    category: NORMAL
    description: Rectangle spans both center axes but is too thin in y to contain
      the enclosing box.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-6, maxX=6, minY=-1, maxY=1.
    - Rectangle contains both x=0 and y=0.
    expectedSourceBehavior:
    - The enclosing-box relation is INTERSECTS rather than WITHIN.
    - Phase 2 follows the both-axes-spanning path and returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_CENTERED_SMALL_RECTANGLE
    category: NORMAL
    description: A small positive-area rectangle around the center is wholly inside
      the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-1, maxX=1, minY=-1, maxY=1.
    - Every rectangle corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the rectangle.
    - The phase-2 farthest corner is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_OFF_CENTER_RECTANGLE
    category: NORMAL
    description: An off-center rectangle is contained even though the center lies
      outside both of its coordinate ranges.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=1, maxX=2, minY=1, maxY=2.
    - The center is less than both minX and minY.
    - The farthest corner (2,2) has distance less than 5 from the center.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the rectangle.
    - Phase 2 selects a closest corner and a farthest corner with both axes outside
      the rectangle.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_TIED_FARTHEST_X
    category: BOUNDARY
    description: Rectangle is symmetric about the y axis, exercising the equal-distance
      farthest-x selection boundary.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-4, maxX=4, minY=-1, maxY=1.
    - The x distances from the center to minX and maxX are equal.
    - Every rectangle corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - The farthest-x comparison has equal alternatives.
    - The selected farthest corner is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_FARTHEST_CORNER_OUTSIDE
    category: NORMAL
    description: Rectangle is inside the enclosing box but a farthest corner lies
      outside the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=3, maxX=4, minY=3, maxY=4.
    - The closest corner (3,3) is inside the circle.
    - The farthest corner (4,4) is outside the circle.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the rectangle.
    - Phase 2 passes the closest-corner test and fails the farthest-corner containment
      test.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERSECTS_CLOSEST_CORNER_TANGENCY
    category: BOUNDARY
    description: Rectangle reaches the circle exactly at its closest corner and otherwise
      extends outside.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=3, maxX=4, minY=4, maxY=4.5.
    - The closest corner (3,4) has distance exactly 5 from the center.
    - At least one other rectangle corner has distance greater than 5 from the center.
    expectedSourceBehavior:
    - contains(3,4) is true at the radius boundary.
    - The farthest-corner test fails.
    - relate(rectangle) returns INTERSECTS rather than DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_ONE_AXIS_OUTSIDE_X
    category: NORMAL
    description: Rectangle is wholly inside the circle with the center outside its
      x range but inside its y range.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=1, maxX=2, minY=-1, maxY=1.
    - xAxis is less than rectangle minX and yAxis is within the rectangle y range.
    - The farthest corner (2,1) has distance less than 5 from the center.
    expectedSourceBehavior:
    - Phase 2 uses the xAxis < minX branch and the y-axis-inside branch.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_ONE_AXIS_OUTSIDE_Y
    category: NORMAL
    description: Rectangle is wholly inside the circle with the center outside its
      y range but inside its x range.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-1, maxX=1, minY=1, maxY=2.
    - xAxis is within the rectangle x range and yAxis is less than rectangle minY.
    - The farthest corner (1,2) has distance less than 5 from the center.
    expectedSourceBehavior:
    - Phase 2 uses the x-axis-inside branch and yAxis < minY branch.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EXACT_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and a point rectangle have identical degenerate
      enclosing boxes.
    preconditions:
    - Circle center is (0,0) and radius is 0.
    - Rectangle bounds are minX=0, maxX=0, minY=0, maxY=0.
    - Rectangle equals circle.getBoundingBox().
    expectedSourceBehavior:
    - The exact enclosing-box equality edge case is reachable for a zero-radius circle.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_WITHIN_POSITIVE_RECTANGLE
    category: EDGE
    description: A zero-radius circle point lies strictly inside a positive-area rectangle.
    preconditions:
    - Circle center is (0,0) and radius is 0.
    - Rectangle bounds are minX=-1, maxX=1, minY=-1, maxY=1.
    expectedSourceBehavior:
    - The degenerate circle enclosing box is WITHIN the rectangle.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle point is separate from the rectangle.
    preconditions:
    - Circle center is (0,0) and radius is 0.
    - Rectangle bounds are minX=1, maxX=2, minY=1, maxY=2.
    expectedSourceBehavior:
    - The degenerate enclosing box is DISJOINT from the rectangle.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_STRICTLY_INSIDE
    category: EDGE
    description: A non-zero-radius circle contains a degenerate point rectangle strictly
      inside it.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=1, maxX=1, minY=1, maxY=1.
    - The point rectangle has distance less than 5 from the center.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the point rectangle.
    - The farthest-point containment test succeeds.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_ON_CIRCUMFERENCE
    category: BOUNDARY
    description: A degenerate point rectangle lies exactly on the circle circumference.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=3, maxX=3, minY=4, maxY=4.
    - The point rectangle has distance exactly 5 from the center.
    expectedSourceBehavior:
    - The boundary point is considered contained by contains(x,y).
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_LINE_CONTAINED
    category: EDGE
    description: A horizontal zero-height rectangle segment is wholly contained in
      the circle.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-3, maxX=3, minY=0, maxY=0.
    - Both segment endpoints have distance less than 5 from the center.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the degenerate horizontal rectangle.
    - The farthest endpoint is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_DIAMETER_LINE_INTERSECTS
    category: EDGE
    description: A horizontal zero-height rectangle segment crosses the circle and
      extends beyond it.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=-6, maxX=6, minY=0, maxY=0.
    - Rectangle spans the center x axis and its endpoints lie outside the circle.
    expectedSourceBehavior:
    - The bounding-box relation is INTERSECTS.
    - Phase 2 cannot return DISJOINT because the rectangle spans a center axis.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_TANGENT_LINE_INTERSECTS
    category: BOUNDARY
    description: A vertical line rectangle touches the circle at one point and extends
      outside it.
    preconditions:
    - Circle center is (0,0) and radius is 5.
    - Rectangle bounds are minX=5, maxX=5, minY=-1, maxY=1.
    - The line contains the circumference point (5,0).
    - Its endpoints have distance greater than 5 from the center.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the line rectangle.
    - The farthest endpoint is outside the circle.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
