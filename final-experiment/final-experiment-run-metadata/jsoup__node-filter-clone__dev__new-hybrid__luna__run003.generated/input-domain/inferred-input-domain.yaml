InputDomain:
  summary: Non-null NodeFilter and detached, cloneable Node roots whose depth-first
    DOM structures and callback decisions exercise head, tail, descent, pruning, removal,
    sibling, ascent, and termination paths while remaining equivalent under the supplied
    deep-clone relation.
  globalConstraints:
  - filter is non-null, because generateFollowUp rejects null.
  - root is non-null, because generateFollowUp rejects null and NodeTraversor.filter
    otherwise has no null validation.
  - root.parentNode() == null before the source execution, because generateFollowUp
    rejects an attached source root.
  - root.clone() succeeds and the cloned root has parentNode() == null, as required
    by generateFollowUp.
  - 'The filter class is fresh-copyable by freshEquivalentFilter: it has an accessible
    declared no-argument constructor, or a declared constructor whose parameter count
    equals its non-static declared-field count and whose parameter types accept the
    copied field values.'
  - The fresh filter and the source filter make equivalent head and tail decisions
    for corresponding source and cloned nodes; decisions must not depend on source-only
    node identity.
  - Any filter state used for a decision is either absent or copied by the supplied
    reflection logic, so the source and follow-up executions start with equivalent
    behavior.
  - Each scenario uses a finite rooted Node tree; every child counted in a topology
    is reachable from root through childNode(), and root has no traversal-relevant
    siblings because it is detached.
  - Only NORMAL, BOUNDARY, or EDGE cases are included; invalid arguments are excluded
    because the metamorphic generator itself rejects them rather than requesting invalid-input
    behavior.
  diversity:
    rootTopology:
    - single leaf
    - root with one child
    - root with multiple children
    - two-level branching tree
    - multi-level linear tree
    - mixed branching tree with at least three depths
    headDecision:
    - CONTINUE
    - SKIP_CHILDREN
    - SKIP_ENTIRE
    - REMOVE
    - STOP
    tailDecision:
    - CONTINUE
    - SKIP_CHILDREN
    - REMOVE
    - STOP
    removalPosition:
    - root
    - non-last child with a following sibling
    - last child requiring ascent
    - internal node with descendants
    terminationPoint:
    - head of root
    - head of descendant
    - tail of leaf
    - tail of internal node
    - normal completion at root
    traversalDepth:
    - depth 0
    - depth 1
    - depth 2 or greater
    siblingCount:
    - zero
    - one
    - two or more
    cloneObservation:
    - same terminal FilterResult
    - same unchanged outerHtml
    - same subtree-pruned outerHtml
    - same child-removal outerHtml
  scenarios:
  - id: ROOT_HEAD_STOP
    category: EDGE
    description: A detached leaf root whose filter.head(root, 0) returns STOP.
    preconditions:
    - root.parentNode() == null.
    - root.childNodeSize() == 0.
    - head(root, 0) returns STOP and no callback mutation is performed.
    expectedSourceBehavior:
    - NodeTraversor.filter returns STOP immediately from the head visit.
    - No tail callback is required after the STOP result.
    - The source and cloned roots have equal outerHtml and both executions return
      STOP.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_HEAD_SKIP_ENTIRE
    category: EDGE
    description: A detached root with children whose head callback returns SKIP_ENTIRE.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 1.
    - head(root, 0) returns SKIP_ENTIRE.
    expectedSourceBehavior:
    - The traversal neither descends into children nor calls tail for the root because
      only CONTINUE and SKIP_CHILDREN permit tail processing.
    - NodeTraversor.filter returns SKIP_ENTIRE.
    - The source and clone retain equal complete DOM structures.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_HEAD_SKIP_CHILDREN
    category: BOUNDARY
    description: A detached branching root whose head callback returns SKIP_CHILDREN.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 2.
    - head(root, 0) returns SKIP_CHILDREN and tail(root, 0) returns CONTINUE.
    expectedSourceBehavior:
    - Children are not visited.
    - The root tail callback is invoked.
    - The returned terminal result is CONTINUE, with source and clone outerHtml equal.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ROOT_HEAD_REMOVE
    category: EDGE
    description: A detached root with descendants whose head callback returns REMOVE.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 1.
    - head(root, 0) returns REMOVE.
    expectedSourceBehavior:
    - The root is not descended into and its tail callback is skipped.
    - Because node == root, no parent removal operation is performed.
    - NodeTraversor.filter returns REMOVE and source and clone outerHtml remain equal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_HEAD_CONTINUE_LEAF
    category: NORMAL
    description: A detached leaf root whose head returns CONTINUE and whose tail returns
      CONTINUE.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() == 0.
    - head(root, 0) and tail(root, 0) return CONTINUE.
    expectedSourceBehavior:
    - The root head and tail callbacks are each reached once.
    - The method returns CONTINUE after the root tail.
    - The clone execution has the same callback decisions, result, and outerHtml.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ROOT_TAIL_STOP
    category: EDGE
    description: A detached leaf root whose head continues but whose tail stops.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() == 0.
    - head(root, 0) returns CONTINUE and tail(root, 0) returns STOP.
    expectedSourceBehavior:
    - The head callback is followed by the root tail callback.
    - NodeTraversor.filter returns STOP from the tail path.
    - The source and clone return STOP with equal outerHtml.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ROOT_TAIL_REMOVE
    category: EDGE
    description: A detached root with one child whose head continues and whose root
      tail returns REMOVE.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() == 1.
    - All descendant callbacks return CONTINUE.
    - tail(root, 0) returns REMOVE.
    expectedSourceBehavior:
    - The child and root are traversed before the root tail.
    - The root result is returned as REMOVE, but the root has no parent and is not
      removed by the source code.
    - Source and clone outerHtml remain equal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULL_LINEAR_CONTINUE
    category: NORMAL
    description: A detached linear tree containing a root and at least three descendant
      levels, with every callback returning CONTINUE.
    preconditions:
    - root.parentNode() == null.
    - Every non-leaf node has exactly one child and the maximum depth is at least
      3.
    - Every head and tail callback returns CONTINUE.
    expectedSourceBehavior:
    - Nodes are headed in depth-first order from depth 0 through the deepest level.
    - Leaf and ancestor tails are reached while the traversal ascends.
    - The final result is CONTINUE and no DOM structure changes.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FULL_BRANCHING_CONTINUE
    category: NORMAL
    description: A detached two-level branching tree with at least two children at
      the root and at least two children under one child, with all callbacks continuing.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 2.
    - At least one depth-1 node has childNodeSize() >= 2.
    - Every head and tail callback returns CONTINUE.
    expectedSourceBehavior:
    - The traversal visits first-child descendants, then their siblings, then ascends
      to the parent and later root.
    - Sibling and ascent paths in the inner while loop are exercised.
    - The final result is CONTINUE and source and clone outerHtml are equal.
    targetCases: 3
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_AT_DESCENDANT
    category: NORMAL
    description: A branching tree where the root continues, a depth-1 node returns
      SKIP_CHILDREN, and its parent and root tails continue.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 2.
    - head(root, 0) returns CONTINUE.
    - head of the first visited depth-1 node returns SKIP_CHILDREN and its tail returns
      CONTINUE.
    - All other callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected descendant is headed but none of its children are visited.
    - Traversal proceeds to the selected descendant's sibling and later to the root
      tail.
    - The final result is CONTINUE with unchanged equal source and clone DOMs.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SKIP_ENTIRE_AT_DESCENDANT
    category: NORMAL
    description: A branching tree where the root continues and a non-root node returns
      SKIP_ENTIRE.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 2.
    - head(root, 0) returns CONTINUE.
    - head of a depth-1 node with at least one child returns SKIP_ENTIRE.
    - All other callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected node's descendants are not visited.
    - The selected node's tail is not called.
    - Traversal continues with its following sibling or ancestor path and returns
      the root's terminal result.
    targetCases: 2
    emptyOutputAllowed: false
  - id: STOP_AT_DESCENDANT_HEAD
    category: EDGE
    description: A multi-level tree where traversal continues to a non-root descendant
      and that descendant head returns STOP.
    preconditions:
    - root.parentNode() == null and the tree has maximum depth at least 2.
    - All callbacks before the selected descendant return CONTINUE.
    - head of the selected descendant returns STOP.
    expectedSourceBehavior:
    - The selected descendant head is the terminal callback.
    - No tail or later-sibling callbacks are required after STOP.
    - Both executions return STOP and preserve equal outerHtml.
    targetCases: 2
    emptyOutputAllowed: false
  - id: STOP_AT_LEAF_TAIL
    category: EDGE
    description: A branching tree where a visited leaf's head continues and its tail
      returns STOP.
    preconditions:
    - root.parentNode() == null and at least one visited non-root leaf exists.
    - All callbacks before that leaf tail return CONTINUE.
    - The selected leaf tail returns STOP.
    expectedSourceBehavior:
    - The leaf is headed and then its tail stops the traversal before its following
      sibling or ancestor tail.
    - NodeTraversor.filter returns STOP.
    - The source and clone have equal terminal results and outerHtml.
    targetCases: 2
    emptyOutputAllowed: false
  - id: REMOVE_NONLAST_LEAF
    category: NORMAL
    description: A root with at least two children where the first child is a leaf
      and returns REMOVE from head.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 2.
    - head(root, 0) returns CONTINUE.
    - head(first child, 1) returns REMOVE; the first child has no children.
    - Callbacks for later siblings and ancestors return CONTINUE.
    expectedSourceBehavior:
    - The removed child is not tailed.
    - The child is removed after its next sibling is located, and traversal proceeds
      to the original following sibling.
    - The final result is CONTINUE and source and clone outerHtml show the same first-child
      removal.
    targetCases: 3
    emptyOutputAllowed: false
  - id: REMOVE_LAST_LEAF_ASCEND
    category: NORMAL
    description: A root with at least two children where the last child is a leaf
      and returns REMOVE from head.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 2.
    - head(root, 0) returns CONTINUE.
    - head(last child, 1) returns REMOVE; the last child has no children.
    - All other callbacks return CONTINUE.
    expectedSourceBehavior:
    - The last child is removed after the traversal finds its parent.
    - The traversal ascends and tails the parent rather than attempting to visit a
      nonexistent sibling.
    - The final result is CONTINUE and source and clone show the same last-child removal.
    targetCases: 3
    emptyOutputAllowed: false
  - id: REMOVE_INTERNAL_SUBTREE
    category: NORMAL
    description: A branching tree where a non-root internal node with descendants
      returns REMOVE from head.
    preconditions:
    - root.parentNode() == null and the selected non-root node has childNodeSize()
      >= 1.
    - All callbacks before the selected node return CONTINUE.
    - head(selected node, depth > 0) returns REMOVE.
    expectedSourceBehavior:
    - The selected node's descendants and tail are skipped.
    - The complete selected subtree is removed when the traversal resumes from its
      parent or following sibling.
    - The source and clone produce equal pruned outerHtml and the same terminal result.
    targetCases: 2
    emptyOutputAllowed: false
  - id: REMOVE_FROM_LEAF_TAIL
    category: NORMAL
    description: A branching tree where a non-root leaf returns REMOVE from tail rather
      than head.
    preconditions:
    - root.parentNode() == null and a non-root leaf has a following sibling.
    - head of every visited node returns CONTINUE.
    - tail(selected leaf, depth > 0) returns REMOVE; later callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected leaf is fully headed before its tail returns REMOVE.
    - The leaf is removed after its next sibling is obtained, and traversal continues
      with that sibling.
    - The final result is the root's terminal result, with identical source and clone
      DOMs.
    targetCases: 2
    emptyOutputAllowed: false
  - id: REMOVE_FROM_LAST_TAIL
    category: BOUNDARY
    description: A tree where a non-root node is the last child and returns REMOVE
      from tail.
    preconditions:
    - root.parentNode() == null and the selected non-root node has no next sibling.
    - All heads and earlier tails return CONTINUE.
    - tail(selected node, depth > 0) returns REMOVE.
    expectedSourceBehavior:
    - The selected node is removed after its parent has been located.
    - The traversal ascends through the no-sibling path and continues with the parent's
      tail.
    - The source and clone have equal pruned outerHtml and equal terminal results.
    targetCases: 2
    emptyOutputAllowed: false
  - id: TAIL_SKIP_CHILDREN_RESULT
    category: EDGE
    description: A tree with at least one descendant where a tail callback returns
      SKIP_CHILDREN.
    preconditions:
    - root.parentNode() == null and the selected node is reached after normal descent.
    - The selected node head returns CONTINUE.
    - tail(selected node, depth) returns SKIP_CHILDREN; all later callbacks return
      CONTINUE.
    expectedSourceBehavior:
    - The selected node's children, if any, have already been handled because the
      tail is reached only after descent or pruning decisions.
    - The SKIP_CHILDREN result is propagated to sibling or ancestor processing without
      removal.
    - The source and clone retain equal outerHtml and return the same root terminal
      result.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MIXED_DEPTH_POLICY
    category: NORMAL
    description: A mixed branching tree with deterministic depth-based decisions combining
      CONTINUE, SKIP_CHILDREN, SKIP_ENTIRE, and REMOVE without STOP.
    preconditions:
    - root.parentNode() == null, maximum depth is at least 3, and at least one node
      has a sibling.
    - The filter decision is a deterministic function of callback phase and depth,
      independent of node identity.
    - At least one depth returns CONTINUE, one returns SKIP_CHILDREN or SKIP_ENTIRE,
      and one non-root node returns REMOVE.
    expectedSourceBehavior:
    - The execution exercises descent, suppressed descent, suppressed tail, sibling
      continuation, ascent, and removal-result reset paths in one finite tree.
    - The terminal result is the result produced for the root after all applicable
      callbacks.
    - The clone receives the same decisions and produces identical terminal result
      and outerHtml.
    targetCases: 3
    emptyOutputAllowed: false
  - id: FILTER_TERMINATES_AFTER_REMOVAL
    category: EDGE
    description: A tree where a non-root removal is followed by a sibling or ancestor
      tail returning STOP.
    preconditions:
    - root.parentNode() == null and the tree contains a removable non-root node followed
      by a reachable callback after removal.
    - The selected node returns REMOVE from head or tail.
    - The first relevant callback after removal returns STOP.
    expectedSourceBehavior:
    - The removed node is structurally removed before the later STOP callback is evaluated.
    - NodeTraversor.filter returns STOP with the post-removal DOM state.
    - The source and clone return STOP and have equal post-removal outerHtml.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DEEP_SINGLE_CHILD_BOUNDARY
    category: BOUNDARY
    description: A detached chain whose maximum depth is exactly 1, distinguishing
      root descent from leaf ascent.
    preconditions:
    - root.parentNode() == null.
    - root.childNodeSize() == 1 and that only child has childNodeSize() == 0.
    - All head and tail callbacks return CONTINUE.
    expectedSourceBehavior:
    - The root descends once to depth 1, tails the child, then tails the root.
    - The terminal result is CONTINUE with no structural changes.
    - The clone follows the same two-node traversal and has equal outerHtml.
    targetCases: 2
    emptyOutputAllowed: false
  - id: WIDE_SIBLING_RANGE
    category: NORMAL
    description: A detached root with at least four leaf children and a filter that
      continues through every sibling.
    preconditions:
    - root.parentNode() == null and root.childNodeSize() >= 4.
    - Every head and tail callback returns CONTINUE.
    expectedSourceBehavior:
    - The traversal visits every child in sibling order and then tails the root.
    - The next-sibling loop is exercised repeatedly without leaving the original root
      range.
    - The final result is CONTINUE and source and clone outerHtml are equal.
    targetCases: 2
    emptyOutputAllowed: false
