InputDomain:
  summary: IEEE-754 double longitudes spanning direct-pass range values, both inclusive
    endpoints, just-outside folds, modulo seams, finite precision extremes, signed
    zero/subnormals, and non-finite doubles. The follow-up is always the supplied
    lon_deg + 360.0 transformation.
  globalConstraints:
  - Source input shall be any Java double value representable by the target parameter,
    including finite values, +0.0, -0.0, subnormals, NaN, +Infinity, and -Infinity;
    no valid double class is excluded because normLonDEG declares no input restriction.
  - Each scenario uses exactly one source longitude and its follow-up must be generated
    only as longitudeDeg + 360.0 by LongitudeNormalizeMetamorphicSpec.generateFollowUp.
  - For finite source inputs outside [-180.0, 180.0], source output is expected to
    be finite and within the documented inclusive range [-180.0, 180.0].
  diversity:
    rangePosition:
    - 10 distinct positions
    - relative to inclusive [-180.0, 180.0] bounds
    - interior, signed zero, exact endpoints, adjacent in-range values, adjacent out-of-range
      values
    moduloPath:
    - 6 distinct paths
    - source execution path through normLonDEG
    - direct return, negative off < 0, positive off regular else, positive exact-wrap
      off == 0, negative exact-wrap else
    magnitudeAndPrecision:
    - 5 distinct magnitudes
    - IEEE-754 magnitude/rounding regime
    - subnormal, ordinary finite, 2^53-scale, 1e20-scale, Double.MAX_VALUE-scale
    specialValues:
    - 3 distinct values
    - non-finite IEEE-754 class
    - NaN, positive infinity, negative infinity
  scenarios:
  - id: POSITIVE_ZERO_DIRECT
    category: NORMAL
    description: Positive zero is already in the documented range and takes the direct-return
      path.
    preconditions:
    - lon_deg == 0.0 and Double.doubleToRawLongBits(lon_deg) == Double.doubleToRawLongBits(0.0)
    expectedSourceBehavior:
    - Returns +0.0 without executing modulo arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_DIRECT
    category: EDGE
    description: Negative zero satisfies both inclusive range comparisons and is returned
      without normalization.
    preconditions:
    - Double.doubleToRawLongBits(lon_deg) == Double.doubleToRawLongBits(-0.0)
    expectedSourceBehavior:
    - Returns -0.0 by the direct-return path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INTERIOR_DIRECT
    category: NORMAL
    description: An ordinary positive fractional longitude strictly inside the normal
      range.
    preconditions:
    - lon_deg == 12.5
    expectedSourceBehavior:
    - Returns exactly 12.5 without modulo arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INTERIOR_DIRECT
    category: NORMAL
    description: An ordinary negative fractional longitude strictly inside the normal
      range.
    preconditions:
    - lon_deg == -12.5
    expectedSourceBehavior:
    - Returns exactly -12.5 without modulo arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_ENDPOINT_DIRECT
    category: BOUNDARY
    description: The inclusive lower endpoint is intentionally retained rather than
      merged with +180.
    preconditions:
    - lon_deg == -180.0
    expectedSourceBehavior:
    - Returns exactly -180.0 through the direct-return path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_ENDPOINT_DIRECT
    category: BOUNDARY
    description: The inclusive upper endpoint is intentionally retained rather than
      merged with -180.
    preconditions:
    - lon_deg == 180.0
    expectedSourceBehavior:
    - Returns exactly 180.0 through the direct-return path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_LOWER_ENDPOINT
    category: BOUNDARY
    description: The representable value immediately above -180 remains on the direct-return
      path.
    preconditions:
    - lon_deg == Math.nextUp(-180.0)
    - lon_deg > -180.0 and lon_deg < 180.0
    expectedSourceBehavior:
    - Returns the source value unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_UPPER_ENDPOINT
    category: BOUNDARY
    description: The representable value immediately below +180 remains on the direct-return
      path.
    preconditions:
    - lon_deg == Math.nextDown(180.0)
    - lon_deg > -180.0 and lon_deg < 180.0
    expectedSourceBehavior:
    - Returns the source value unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_LOWER_ENDPOINT
    category: BOUNDARY
    description: The representable value immediately below -180 enters modulo normalization
      and has negative off.
    preconditions:
    - lon_deg == Math.nextDown(-180.0)
    - lon_deg < -180.0
    expectedSourceBehavior:
    - Executes the off < 0 branch and returns 180.0 + ((lon_deg + 180.0) % 360.0).
    - Returns a finite value near +180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_UPPER_ENDPOINT
    category: BOUNDARY
    description: The representable value immediately above +180 enters modulo normalization
      with a small positive off.
    preconditions:
    - lon_deg == Math.nextUp(180.0)
    - lon_deg > 180.0
    expectedSourceBehavior:
    - Executes the final else branch and returns -180.0 + ((lon_deg + 180.0) % 360.0).
    - Returns a finite value near -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_DEGREE_OUTSIDE
    category: NORMAL
    description: A negative out-of-range longitude exercises the negative-remainder
      branch away from a seam.
    preconditions:
    - lon_deg == -181.0
    expectedSourceBehavior:
    - off is -1.0 and satisfies off < 0.
    - Returns exactly 179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ONE_DEGREE_OUTSIDE
    category: NORMAL
    description: A positive out-of-range longitude exercises the ordinary nonzero
      positive-remainder branch.
    preconditions:
    - lon_deg == 181.0
    expectedSourceBehavior:
    - off is 1.0.
    - Returns exactly -179.0 through the final else branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_WRAP_SENTINEL
    category: EDGE
    description: A positive longitude whose shifted value is an exact multiple of
      360 exercises the positive off == 0 sentinel.
    preconditions:
    - lon_deg == 540.0
    - (lon_deg + 180.0) % 360.0 == 0.0
    - lon_deg > 0.0
    expectedSourceBehavior:
    - Executes the off == 0 && lon_deg > 0 branch.
    - Returns exactly 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_WRAP_SEAM
    category: EDGE
    description: A negative exact-wrap longitude reaches the final else branch because
      it is not positive.
    preconditions:
    - lon_deg == -540.0
    - (lon_deg + 180.0) % 360.0 == 0.0
    - lon_deg < 0.0
    expectedSourceBehavior:
    - Does not satisfy off < 0 or off == 0 && lon_deg > 0.
    - Returns exactly -180.0 through the final else branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_POSITIVE_WRAP_SEAM
    category: BOUNDARY
    description: The representable value immediately below +540 reaches the regular
      final else branch with off close to +360.
    preconditions:
    - lon_deg == Math.nextDown(540.0)
    - lon_deg > 180.0
    expectedSourceBehavior:
    - off is positive and nonzero.
    - Returns a finite result near +180.0 through the final else branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_POSITIVE_WRAP_SEAM
    category: BOUNDARY
    description: The representable value immediately above +540 reaches the regular
      final else branch with a small positive off.
    preconditions:
    - lon_deg == Math.nextUp(540.0)
    - lon_deg > 180.0
    expectedSourceBehavior:
    - off is positive and nonzero.
    - Returns a finite result near -180.0 through the final else branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_NEGATIVE_WRAP_SEAM
    category: BOUNDARY
    description: A value just below -540 has a small negative remainder and uses the
      off < 0 branch.
    preconditions:
    - lon_deg == Math.nextDown(-540.0)
    - lon_deg < -180.0
    expectedSourceBehavior:
    - off is negative.
    - Returns a finite result near +180.0 through the off < 0 branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_NEGATIVE_WRAP_SEAM
    category: BOUNDARY
    description: A value just above -540 has a negative remainder close to -360 and
      uses the off < 0 branch.
    preconditions:
    - lon_deg == Math.nextUp(-540.0)
    - lon_deg < -180.0
    expectedSourceBehavior:
    - off is negative.
    - Returns a finite result near -180.0 through the off < 0 branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_MIN_SUBNORMAL
    category: EDGE
    description: The smallest positive subnormal is in range and verifies that the
      direct path does not discard a tiny finite value.
    preconditions:
    - lon_deg == Double.MIN_VALUE
    - lon_deg > 0.0 and lon_deg < 180.0
    expectedSourceBehavior:
    - Returns exactly Double.MIN_VALUE without modulo arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_MIN_SUBNORMAL
    category: EDGE
    description: The smallest negative subnormal is in range and verifies direct preservation
      of a tiny negative finite value.
    preconditions:
    - lon_deg == -Double.MIN_VALUE
    - lon_deg < 0.0 and lon_deg > -180.0
    expectedSourceBehavior:
    - Returns exactly -Double.MIN_VALUE without modulo arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_2_POW_53_PRECISION
    category: EDGE
    description: A large exactly representable integer tests modulo normalization
      where adding 360.0 is subject to coarse binary64 spacing.
    preconditions:
    - lon_deg == Math.scalb(1.0, 53)
    - lon_deg > 180.0
    expectedSourceBehavior:
    - Skips the direct-return path and performs finite remainder arithmetic.
    - Returns a finite value in [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_2_POW_53_PRECISION
    category: EDGE
    description: The negative counterpart tests the negative-remainder normalization
      path at the same precision scale.
    preconditions:
    - lon_deg == -Math.scalb(1.0, 53)
    - lon_deg < -180.0
    expectedSourceBehavior:
    - Skips the direct-return path and performs finite remainder arithmetic.
    - Returns a finite value in [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_LARGE_FINITE_SHIFT_RESOLUTION
    category: EDGE
    description: A large finite decimal magnitude tests a regime in which the 360-degree
      follow-up shift may be constrained by floating-point resolution.
    preconditions:
    - lon_deg == 1.0E20
    - Double.isFinite(lon_deg)
    expectedSourceBehavior:
    - Executes modulo normalization.
    - Returns a finite value in [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_LARGE_FINITE_SHIFT_RESOLUTION
    category: EDGE
    description: The negative large finite counterpart exercises finite modulo normalization
      with a negative dividend.
    preconditions:
    - lon_deg == -1.0E20
    - Double.isFinite(lon_deg)
    expectedSourceBehavior:
    - Executes modulo normalization.
    - Returns a finite value in [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_MAX_FINITE
    category: EDGE
    description: The greatest finite double is a valid longitude argument and tests
      normalization at maximum finite magnitude.
    preconditions:
    - lon_deg == Double.MAX_VALUE
    expectedSourceBehavior:
    - Executes modulo normalization rather than the direct-return path.
    - Returns a finite value in [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_MAX_FINITE
    category: EDGE
    description: The least finite double is a valid longitude argument and tests negative
      finite normalization at maximum magnitude.
    preconditions:
    - lon_deg == -Double.MAX_VALUE
    expectedSourceBehavior:
    - Executes modulo normalization rather than the direct-return path.
    - Returns a finite value in [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_INPUT
    category: EDGE
    description: NaN is accepted by the double parameter; all range and remainder
      comparisons are false.
    preconditions:
    - Double.isNaN(lon_deg)
    expectedSourceBehavior:
    - Does not take the direct-return path.
    - Returns NaN because the remainder is NaN and the final arithmetic result is
      NaN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INFINITY_INPUT
    category: EDGE
    description: Positive infinity is accepted by the double parameter and produces
      a NaN remainder.
    preconditions:
    - lon_deg == Double.POSITIVE_INFINITY
    expectedSourceBehavior:
    - Does not take the direct-return path.
    - Returns NaN after (+Infinity + 180.0) % 360.0 produces NaN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INFINITY_INPUT
    category: EDGE
    description: Negative infinity is accepted by the double parameter and produces
      a NaN remainder.
    preconditions:
    - lon_deg == Double.NEGATIVE_INFINITY
    expectedSourceBehavior:
    - Does not take the direct-return path.
    - Returns NaN after (-Infinity + 180.0) % 360.0 produces NaN.
    targetCases: 1
    emptyOutputAllowed: false
