InputDomain:
  summary: Valid finite LocalDateRange receivers whose exclusive end can be moved
    23 days later while remaining finite and whose source and follow-up lengths fit
    in int. The domain covers direct, period, closed, empty, parsed, and Temporal-derived
    construction paths, plus date arithmetic, calendar, numeric, and representational
    boundaries.
  globalConstraints:
  - The source receiver must be successfully constructed by one of the discovered
    LocalDateRange construction paths and must satisfy getStart() != LocalDate.MIN
    and getEnd() != LocalDate.MAX, because lengthInDays() uses Integer.MAX_VALUE as
    the unbounded-range sentinel.
  - The source exclusive end must satisfy getEnd() <= LocalDate.MAX.minusDays(24),
    so moving it exactly 23 days later produces an end no later than LocalDate.MAX.minusDays(1),
    not the unbounded-end sentinel LocalDate.MAX.
  - The finite source length L = getEnd().toEpochDay() - getStart().toEpochDay() must
    satisfy 0 <= L <= Integer.MAX_VALUE - 23, so both source lengthInDays() and follow-up
    lengthInDays() are representable int values and the expected follow-up result
    L + 23 does not overflow.
  - '{Ranges with an unbounded start, an unbounded end, or both are excluded from
    this MR domain=their source lengthInDays() result is the Integer.MAX_VALUE sentinel
    rather than a finite length, and an end at LocalDate.MAX cannot be advanced by
    23 days.}'
  - Valid bounded ranges longer than Integer.MAX_VALUE - 23 days are excluded because
    the relation requires two finite int results differing by 23, while the source
    or follow-up finite day count is outside that representable result domain.
  diversity:
    constructionPath:
    - of_dates
    - of_period
    - ofClosed
    - ofEmpty
    - parse_date_date
    - parse_date_period
    - parse_period_date
    - from_LocalDate
    - from_LocalDateTime
    - from_Year
    - from_YearMonth
    - from_YearHalf
    - from_YearQuarter
    - from_YearWeek
    finiteLength:
    - '0'
    - '1'
    - '2'
    - '7'
    - '22'
    - '23'
    - '24'
    - '28'
    - '29'
    - '30'
    - '31'
    - '59'
    - '60'
    - '90'
    - '91'
    - '181'
    - '182'
    - '365'
    - '366'
    - Integer.MAX_VALUE_minus_23
    calendarPosition:
    - LocalDate_MIN_plus_1
    - BCE
    - epoch_crossing
    - month_end
    - leap_day
    - common_year_February
    - leap_year_February
    - century_non_leap_year
    - year_boundary
    - LocalDate_MAX_minus_24
    representation:
    - half_open
    - closed_normalized_to_half_open
    - empty
    - period_computed_end
    - textual_date_date
    - textual_date_period
    - textual_period_date
    - temporal_query_localDate
    - temporal_type_branch
  scenarios:
  - id: EMPTY_RANGE_DIRECT_FACTORY
    category: BOUNDARY
    description: A valid empty half-open range built directly with equal ordinary
      start and end dates.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2000, 1, 1), LocalDate.of(2000,
      1, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Moving the exclusive end to 2000-01-24 yields lengthInDays() equal to 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: The smallest non-empty directly constructed half-open range.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2000, 1, 1), LocalDate.of(2000,
      1, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWO_DAY_HALF_OPEN_RANGE
    category: NORMAL
    description: A short non-empty range with a finite length greater than one.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2000, 1, 1), LocalDate.of(2000,
      1, 3)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_TWENTY_TWO_BELOW_DELTA
    category: BOUNDARY
    description: A finite range one day shorter than the MR's fixed 23-day end movement.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2000, 1, 1), LocalDate.of(2000,
      1, 23)).
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    - The follow-up length is 45.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_TWENTY_THREE_EQUALS_DELTA
    category: BOUNDARY
    description: A finite range whose original length equals the 23-day end movement.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2000, 1, 1), LocalDate.of(2000,
      1, 24)).
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_TWENTY_FOUR_ABOVE_DELTA
    category: BOUNDARY
    description: A finite range one day longer than the MR's fixed 23-day end movement.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2000, 1, 1), LocalDate.of(2000,
      1, 25)).
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    - The follow-up length is 47.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_DATE_LIMIT_FINITE_RANGE
    category: EDGE
    description: A finite bounded range starting at the earliest start permitted without
      becoming unbounded.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - lengthInDays() returns 1 rather than the Integer.MAX_VALUE unbounded sentinel.
    - The follow-up end is LocalDate.MIN.plusDays(25) and the follow-up length is
      24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_DATE_LIMIT_FOLLOW_UP_BOUNDARY
    category: EDGE
    description: A finite range whose source end is the latest end from which a 23-day
      movement remains bounded.
    preconditions:
    - Let end be LocalDate.MAX.minusDays(24).
    - Construct with LocalDateRange.of(end.minusDays(1), end).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Advancing the end by 23 days makes the follow-up end LocalDate.MAX.minusDays(1),
      which remains bounded, and its length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_SAFE_INT_SOURCE_LENGTH
    category: EDGE
    description: A finite range at the largest source length for which adding 23 remains
      an int result.
    preconditions:
    - Choose valid LocalDate start and end such that end.toEpochDay() - start.toEpochDay()
      equals Integer.MAX_VALUE - 23.
    - Construct with LocalDateRange.of(start, end), with end <= LocalDate.MAX.minusDays(24).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - The follow-up length is Integer.MAX_VALUE.
    - The Integer.MAX_VALUE result is reached as a finite computed length, not through
      an unbounded endpoint.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPOCH_CROSSING_RANGE
    category: NORMAL
    description: A finite range crossing the Unix epoch date.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(1969, 12, 31), LocalDate.of(1970,
      1, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BCE_TO_CE_RANGE
    category: EDGE
    description: A finite range crossing the proleptic year zero boundary.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(-1, 12, 31), LocalDate.of(0, 1,
      2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_YEAR_FEBRUARY_RANGE
    category: NORMAL
    description: A range spanning February in a common year.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2019, 2, 1), LocalDate.of(2019,
      3, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - The follow-up length is 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_YEAR_FEBRUARY_RANGE
    category: NORMAL
    description: A range spanning February in a leap year.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2020, 2, 1), LocalDate.of(2020,
      3, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: EDGE
    description: A short range whose included dates cross leap day.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2020, 2, 28), LocalDate.of(2020,
      3, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    - The follow-up length is 26.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CENTURY_COMMON_YEAR_FEBRUARY
    category: EDGE
    description: A February range in year 1900, which is divisible by 100 but not
      a leap year.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(1900, 2, 1), LocalDate.of(1900,
      3, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - The follow-up length is 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_END_TO_MONTH_END_31_DAY_RANGE
    category: NORMAL
    description: A range from the end of one 31-day month to the corresponding date
      in the next month.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2021, 1, 31), LocalDate.of(2021,
      3, 3)).
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    - The follow-up length is 54.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_RANGE
    category: NORMAL
    description: A range crossing from one calendar year into the next.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2020, 12, 31), LocalDate.of(2021,
      1, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO_EMPTY_RANGE
    category: BOUNDARY
    description: An empty range created through the start-plus-Period construction
      path.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2000, 1, 1), Period.ZERO).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up length is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_TWENTY_THREE_DAYS
    category: NORMAL
    description: A range whose end is computed from a Period of exactly 23 days.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2000, 1, 1), Period.ofDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_MONTH_COMMON_FEBRUARY
    category: NORMAL
    description: A period-derived end where one calendar month from January 31 resolves
      in common-year February.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2019, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - lengthInDays() returns 28 because the computed end is 2019-02-28.
    - The follow-up length is 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_MONTH_LEAP_FEBRUARY
    category: NORMAL
    description: A period-derived end where one calendar month from January 31 resolves
      in leap-year February.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2020, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - lengthInDays() returns 29 because the computed end is 2020-02-29.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_YEAR_ACROSS_LEAP_DAY
    category: NORMAL
    description: A period-derived annual range beginning on leap day.
    preconditions:
    - Construct with LocalDateRange.of(LocalDate.of(2020, 2, 29), Period.ofYears(1)).
    expectedSourceBehavior:
    - lengthInDays() returns 365 because the computed end is 2021-02-28.
    - The follow-up length is 388.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DAY_RANGE
    category: BOUNDARY
    description: A one-day range created through inclusive-end normalization.
    preconditions:
    - Construct with LocalDateRange.ofClosed(LocalDate.of(2000, 1, 1), LocalDate.of(2000,
      1, 1)).
    expectedSourceBehavior:
    - The closed constructor normalizes the exclusive end to 2000-01-02.
    - lengthInDays() returns 1 and the follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MONTH_RANGE
    category: NORMAL
    description: A closed range covering every day of a 30-day month.
    preconditions:
    - Construct with LocalDateRange.ofClosed(LocalDate.of(2021, 4, 1), LocalDate.of(2021,
      4, 30)).
    expectedSourceBehavior:
    - The normalized exclusive end is 2021-05-01.
    - lengthInDays() returns 30 and the follow-up length is 53.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_FACTORY_RANGE
    category: BOUNDARY
    description: An empty range created through the dedicated ofEmpty construction
      path.
    preconditions:
    - Construct with LocalDateRange.ofEmpty(LocalDate.of(2000, 6, 15)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up length is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_TO_DATE
    category: NORMAL
    description: A textual half-open date/date range.
    preconditions:
    - Construct with LocalDateRange.parse("2007-12-03/2007-12-04").
    expectedSourceBehavior:
    - Parsing selects the date-followed-by-date branch.
    - lengthInDays() returns 1 and the follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_TO_PERIOD
    category: NORMAL
    description: A textual range whose end is computed from a date followed by a period.
    preconditions:
    - Construct with LocalDateRange.parse("2020-02-01/P1M").
    expectedSourceBehavior:
    - Parsing selects the date-followed-by-period branch.
    - lengthInDays() returns 29 and the follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_TO_DATE
    category: NORMAL
    description: A textual range whose start is computed from a period followed by
      an end date.
    preconditions:
    - Construct with LocalDateRange.parse("P1M/2020-03-01").
    expectedSourceBehavior:
    - Parsing selects the period-followed-by-date branch.
    - lengthInDays() returns 29 and the follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A range created from a LocalDate Temporal using the local-date query
      branch.
    preconditions:
    - Construct with LocalDateRange.from(LocalDate.of(2020, 6, 15)).
    expectedSourceBehavior:
    - from(Temporal) creates a one-day closed range for the queried date.
    - lengthInDays() returns 1 and the follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TIME
    category: NORMAL
    description: A range created from a Temporal that supplies a LocalDate while carrying
      a time component.
    preconditions:
    - Construct with LocalDateRange.from(java.time.LocalDateTime.of(2020, 6, 15, 23,
      59, 59)).
    expectedSourceBehavior:
    - The local-date query ignores the time component and creates a one-day range
      for 2020-06-15.
    - lengthInDays() returns 1 and the follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: A full common-year range created through the Year-specific from(Temporal)
      branch.
    preconditions:
    - Construct with LocalDateRange.from(Year.of(2019)).
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    - The follow-up length is 388.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: NORMAL
    description: A full leap-year range created through the Year-specific from(Temporal)
      branch.
    preconditions:
    - Construct with LocalDateRange.from(Year.of(2020)).
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - The follow-up length is 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR_FEBRUARY_MONTH
    category: NORMAL
    description: A common-year February range created through the YearMonth-specific
      from(Temporal) branch.
    preconditions:
    - Construct with LocalDateRange.from(YearMonth.of(2019, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - The follow-up length is 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR_FEBRUARY_MONTH
    category: NORMAL
    description: A leap-year February range created through the YearMonth-specific
      from(Temporal) branch.
    preconditions:
    - Construct with LocalDateRange.from(YearMonth.of(2020, 2)).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up length is 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF_FIRST_HALF
    category: NORMAL
    description: A first-half range created through the YearHalf-specific from(Temporal)
      branch.
    preconditions:
    - Supply a valid YearHalf Temporal representing the first half of common year
      2019 to LocalDateRange.from.
    expectedSourceBehavior:
    - The range spans 2019-01-01 through the exclusive end 2019-07-01.
    - lengthInDays() returns 181 and the follow-up length is 204.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF_SECOND_HALF
    category: NORMAL
    description: A second-half range created through the YearHalf-specific from(Temporal)
      branch.
    preconditions:
    - Supply a valid YearHalf Temporal representing the second half of common year
      2019 to LocalDateRange.from.
    expectedSourceBehavior:
    - The range spans 2019-07-01 through the exclusive end 2020-01-01.
    - lengthInDays() returns 184 and the follow-up length is 207.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER_LEAP_FIRST_QUARTER
    category: NORMAL
    description: A first-quarter leap-year range created through the YearQuarter-specific
      from(Temporal) branch.
    preconditions:
    - Supply a valid YearQuarter Temporal representing the first quarter of 2020 to
      LocalDateRange.from.
    expectedSourceBehavior:
    - The range spans 2020-01-01 through the exclusive end 2020-04-01.
    - lengthInDays() returns 91 and the follow-up length is 114.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER_COMMON_SECOND_QUARTER
    category: NORMAL
    description: A second-quarter common-year range created through the YearQuarter-specific
      from(Temporal) branch.
    preconditions:
    - Supply a valid YearQuarter Temporal representing the second quarter of 2019
      to LocalDateRange.from.
    expectedSourceBehavior:
    - The range spans 2019-04-01 through the exclusive end 2019-07-01.
    - lengthInDays() returns 91 and the follow-up length is 114.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A Monday-through-Sunday week created through the YearWeek-specific
      from(Temporal) branch.
    preconditions:
    - Supply a valid YearWeek Temporal for a week whose Monday and Sunday are both
      within ordinary finite LocalDate bounds to LocalDateRange.from.
    expectedSourceBehavior:
    - The YearWeek branch creates a closed Monday-to-Sunday range, normalized to an
      exclusive end on the following Monday.
    - lengthInDays() returns 7 and the follow-up length is 30.
    targetCases: 1
    emptyOutputAllowed: false
