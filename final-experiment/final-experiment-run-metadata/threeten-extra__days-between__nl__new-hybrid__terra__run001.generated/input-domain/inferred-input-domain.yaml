InputDomain:
  summary: Valid non-null Temporal pairs for which ChronoUnit.DAYS.between produces
    an int-representable whole-day count and both temporals can independently be shifted
    forward by 37 ChronoUnit.DAYS. Source cases cover Days.of(0), Days.of(1), and
    ordinary Days construction, positive and negative gaps, date/time truncation,
    chronology, zone/offset behavior, DST, temporal-range limits, and int-result limits.
  globalConstraints:
  - Both source arguments are non-null Temporal instances.
  - DAYS.between(startDateInclusive, endDateExclusive) must complete normally and
    its long result must be in [-2147483648, 2147483647], because Days.between applies
    Math.toIntExact before constructing Days.
  - The follow-up arguments are startDateInclusive.plus(37, ChronoUnit.DAYS) and endDateExclusive.plus(37,
    ChronoUnit.DAYS); both plus calls and the follow-up DAYS.between call must complete
    normally with an int-representable result.
  - Each scenario requires source getAmount() == followUp.getAmount(); pairs that
    throw, including temporals that do not support DAYS or pairs incompatible with
    the start temporal's until implementation, are outside this MR because the MR
    requests successful shifted comparisons rather than invalid-input behavior.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - ZonedDateTime
    - OffsetDateTime
    - JapaneseDate
    - ThaiBuddhistDate
    - compatible mixed Temporal pairs
    sourceGapClass:
    - zero
    - one
    - positive
    - negative
    - exact-week
    - month-crossing
    - year-crossing
    - leap-day-crossing
    - partial-day-truncation
    - DST-calendar-day
    - offset-adjusted
    - int-minimum
    - int-maximum
    temporalRangePosition:
    - ordinary-date
    - LocalDate.MIN-near
    - LocalDate.MAX-near
    - large-span-within-LocalDate-range
  scenarios:
  - id: LOCAL_DATE_ZERO_GAP
    category: NORMAL
    description: Same LocalDate is supplied as both inclusive start and exclusive
      end.
    preconditions:
    - startDateInclusive == endDateExclusive == LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - getAmount() returns 0, exercising Days.of(0).
    - After adding 37 days to both LocalDates, follow-up getAmount() remains 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_GAP
    category: NORMAL
    description: Consecutive LocalDates produce the singleton one-day amount path.
    preconditions:
    - startDateInclusive == LocalDate.of(2024, 6, 15).
    - endDateExclusive == LocalDate.of(2024, 6, 16).
    expectedSourceBehavior:
    - getAmount() returns 1, exercising Days.of(1).
    - The shifted pair also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TWO_DAY_GAP
    category: NORMAL
    description: A positive LocalDate gap greater than one uses ordinary Days construction.
    preconditions:
    - startDateInclusive == LocalDate.of(2024, 6, 15).
    - endDateExclusive == LocalDate.of(2024, 6, 17).
    expectedSourceBehavior:
    - getAmount() returns 2.
    - The shifted pair also returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_ONE_DAY_GAP
    category: NORMAL
    description: End date precedes start date by one calendar day.
    preconditions:
    - startDateInclusive == LocalDate.of(2024, 6, 16).
    - endDateExclusive == LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - getAmount() returns -1.
    - The shifted pair also returns -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_EXACT_WEEK_GAP
    category: NORMAL
    description: A seven-day LocalDate gap verifies a non-sentinel positive whole-week
      result.
    preconditions:
    - startDateInclusive == LocalDate.of(2024, 1, 1).
    - endDateExclusive == LocalDate.of(2024, 1, 8).
    expectedSourceBehavior:
    - getAmount() returns 7.
    - The shifted pair also returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: A LocalDate interval crosses from a 31-day month into the next month.
    preconditions:
    - startDateInclusive == LocalDate.of(2024, 1, 30).
    - endDateExclusive == LocalDate.of(2024, 2, 2).
    expectedSourceBehavior:
    - getAmount() returns 3.
    - The shifted pair also returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: A LocalDate interval crosses leap day in a leap year.
    preconditions:
    - startDateInclusive == LocalDate.of(2024, 2, 28).
    - endDateExclusive == LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - getAmount() returns 2.
    - The shifted pair also returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: A LocalDate interval crosses the ISO calendar year boundary.
    preconditions:
    - startDateInclusive == LocalDate.of(2023, 12, 31).
    - endDateExclusive == LocalDate.of(2024, 1, 2).
    expectedSourceBehavior:
    - getAmount() returns 2.
    - The shifted pair also returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INT_MAXIMUM_GAP
    category: BOUNDARY
    description: A large LocalDate span produces exactly Integer.MAX_VALUE days without
      Math.toIntExact overflow.
    preconditions:
    - startDateInclusive == LocalDate.of(-999999999, 1, 1).
    - endDateExclusive == startDateInclusive.plusDays(2147483647L).
    - Both dates and their 37-day shifted forms remain within LocalDate's supported
      range.
    expectedSourceBehavior:
    - getAmount() returns 2147483647.
    - The shifted pair also returns 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INT_MINIMUM_GAP
    category: BOUNDARY
    description: A large reversed LocalDate span produces exactly Integer.MIN_VALUE
      days without Math.toIntExact overflow.
    preconditions:
    - startDateInclusive == LocalDate.of(-990000000, 1, 1).
    - endDateExclusive == startDateInclusive.minusDays(2147483648L).
    - Both dates and their 37-day shifted forms remain within LocalDate's supported
      range.
    expectedSourceBehavior:
    - getAmount() returns -2147483648.
    - The shifted pair also returns -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM_SUPPORTED_DATE
    category: EDGE
    description: A one-day interval begins at LocalDate.MIN while retaining room for
      the required forward shift.
    preconditions:
    - startDateInclusive == LocalDate.MIN.
    - endDateExclusive == LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - getAmount() returns 1.
    - The shifted pair remains representable and returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM_SUPPORTED_DATE
    category: EDGE
    description: A one-day interval is positioned near LocalDate.MAX so that the 37-day
      follow-up reaches the upper range boundary.
    preconditions:
    - startDateInclusive == LocalDate.MAX.minusDays(38).
    - endDateExclusive == LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - getAmount() returns 1.
    - The shifted pair is LocalDate.MAX.minusDays(1) to LocalDate.MAX and returns
      1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: Matching LocalDateTime clock times separated by exactly one 24-hour
      day.
    preconditions:
    - startDateInclusive == LocalDateTime.of(2024, 6, 15, 10, 30).
    - endDateExclusive == LocalDateTime.of(2024, 6, 16, 10, 30).
    expectedSourceBehavior:
    - getAmount() returns 1.
    - The shifted pair also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_PARTIAL_DAY
    category: EDGE
    description: A positive LocalDateTime interval is shorter than one complete day.
    preconditions:
    - startDateInclusive == LocalDateTime.of(2024, 6, 15, 10, 30).
    - endDateExclusive == LocalDateTime.of(2024, 6, 16, 10, 29).
    expectedSourceBehavior:
    - getAmount() returns 0 because no complete DAYS unit lies between the local date-times.
    - The shifted pair also returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_PARTIAL_DAY
    category: EDGE
    description: A negative LocalDateTime interval has magnitude shorter than one
      complete day.
    preconditions:
    - startDateInclusive == LocalDateTime.of(2024, 6, 16, 10, 29).
    - endDateExclusive == LocalDateTime.of(2024, 6, 15, 10, 30).
    expectedSourceBehavior:
    - getAmount() returns 0 because the reversed interval contains no complete DAYS
      unit.
    - The shifted pair also returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_MULTI_DAY
    category: NORMAL
    description: A reversed LocalDateTime interval contains multiple complete days
      plus a partial remainder.
    preconditions:
    - startDateInclusive == LocalDateTime.of(2024, 6, 20, 12, 0).
    - endDateExclusive == LocalDateTime.of(2024, 6, 17, 11, 0).
    expectedSourceBehavior:
    - getAmount() returns -3.
    - The shifted pair also returns -3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_24_HOUR_DAY
    category: NORMAL
    description: Instants exactly 24 elapsed hours apart are compared using ChronoUnit.DAYS.
    preconditions:
    - startDateInclusive == Instant.parse('2024-01-01T00:00:00Z').
    - endDateExclusive == Instant.parse('2024-01-02T00:00:00Z').
    expectedSourceBehavior:
    - getAmount() returns 1.
    - The shifted pair also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_PARTIAL_24_HOUR_INTERVAL
    category: EDGE
    description: Instants are 23 hours 59 minutes 59 seconds apart.
    preconditions:
    - startDateInclusive == Instant.parse('2024-01-01T00:00:00Z').
    - endDateExclusive == Instant.parse('2024-01-01T23:59:59Z').
    expectedSourceBehavior:
    - getAmount() returns 0 because the elapsed interval is shorter than one complete
      24-hour day.
    - The shifted pair also returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_MULTI_DAY_INTERVAL
    category: NORMAL
    description: Instants are reversed by two exact elapsed days.
    preconditions:
    - startDateInclusive == Instant.parse('2024-01-03T00:00:00Z').
    - endDateExclusive == Instant.parse('2024-01-01T00:00:00Z').
    expectedSourceBehavior:
    - getAmount() returns -2.
    - The shifted pair also returns -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_TRANSITION
    category: EDGE
    description: New York ZonedDateTimes use the same local noon across the spring
      DST transition, where elapsed time is 23 hours but the date-based DAYS result
      is one.
    preconditions:
    - startDateInclusive == ZonedDateTime.of(2024, 3, 9, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    - endDateExclusive == ZonedDateTime.of(2024, 3, 10, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    expectedSourceBehavior:
    - getAmount() returns 1.
    - The pair shifted by 37 calendar days also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FALL_DST_TRANSITION
    category: EDGE
    description: New York ZonedDateTimes use the same local noon across the fall DST
      transition, where elapsed time is 25 hours but the date-based DAYS result is
      one.
    preconditions:
    - startDateInclusive == ZonedDateTime.of(2024, 11, 2, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    - endDateExclusive == ZonedDateTime.of(2024, 11, 3, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    expectedSourceBehavior:
    - getAmount() returns 1.
    - The pair shifted by 37 calendar days also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_OFFSET_ADJUSTED_PARTIAL_DAY
    category: EDGE
    description: OffsetDateTimes have adjacent local dates but differ by only 23 elapsed
      hours after offset adjustment.
    preconditions:
    - startDateInclusive == OffsetDateTime.parse('2024-01-01T00:00:00+00:00').
    - endDateExclusive == OffsetDateTime.parse('2024-01-02T00:00:00+01:00').
    expectedSourceBehavior:
    - getAmount() returns 0.
    - The shifted pair also returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_BOUNDARY
    category: BOUNDARY
    description: JapaneseDate inputs cross the Heisei-to-Reiwa era boundary while
      supporting DAYS arithmetic.
    preconditions:
    - startDateInclusive == JapaneseDate.of(2019, 4, 30).
    - endDateExclusive == JapaneseDate.of(2019, 5, 2).
    expectedSourceBehavior:
    - getAmount() returns 2.
    - The shifted JapaneseDate pair also returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_NEGATIVE_GAP
    category: NORMAL
    description: ThaiBuddhistDate inputs exercise a non-ISO chronology with a negative
      whole-day result.
    preconditions:
    - startDateInclusive == ThaiBuddhistDate.of(2567, 1, 10).
    - endDateExclusive == ThaiBuddhistDate.of(2567, 1, 7).
    expectedSourceBehavior:
    - getAmount() returns -3.
    - The shifted ThaiBuddhistDate pair also returns -3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: NORMAL
    description: The start is LocalDate and the end is a compatible LocalDateTime
      whose date is two days later.
    preconditions:
    - startDateInclusive == LocalDate.of(2024, 6, 15).
    - endDateExclusive == LocalDateTime.of(2024, 6, 17, 23, 59).
    - The start temporal's DAYS-based until operation accepts the end temporal.
    expectedSourceBehavior:
    - getAmount() returns 2.
    - After independently adding 37 days while retaining each temporal type, follow-up
      getAmount() remains 2.
    targetCases: 1
    emptyOutputAllowed: false
