InputDomain:
  summary: Valid non-geo Cartesian CircleImpl and RectangleImpl pairs, including empty
    sentinels, zero-radius circles, degenerate rectangles, bounding-box shortcuts,
    corner rejection, tangencies, containment, and intersection paths; every pair
    must remain constructible after the specified translation.
  globalConstraints:
  - The receiver is exactly a CircleImpl constructed with CircleImpl(Point, double,
    SpatialContext), and the argument is a non-null Rectangle implemented as RectangleImpl
    using the constructor shown in the supplied metamorphic transformation.
  - The circle and rectangle use the same non-geo, flat SpatialContext; no antimeridian
    crossing, world wrapping, or geodetic behavior is included.
  - For every non-empty circle, center coordinates cx and cy and radius R are finite,
    R >= 0, and both context.makePoint(cx, cy) and context.makePoint(cx + 17.5, cy
    - 9.25) are accepted by that context.
  - For every non-empty rectangle, minX, maxX, minY, and maxY are finite, minX <=
    maxX, minY <= maxY, and both the source bounds and translated bounds (minX + 17.5,
    maxX + 17.5, minY - 9.25, maxY - 9.25) are accepted by the context.
  - 'Empty points and rectangles are represented only by the all-NaN empty sentinel
    supported by the supplied source: an empty point has NaN coordinates, and an empty
    rectangle has all four bounds equal to NaN.'
  - No null receiver or null rectangle is generated because generateFollowUp explicitly
    rejects either with Objects.requireNonNull.
  - Unless a scenario states otherwise, use center (cx, cy) = (0, 0) and radius R
    = 10; all listed rectangle bounds are absolute coordinates in that coordinate
    system.
  - Source and translated values must not overflow to infinity; each translated shape
    must preserve finite ordered bounds or the all-NaN empty sentinel.
  diversity:
    circleState:
    - empty
    - zero-radius
    - positive-radius
    rectangleDimension:
    - empty
    - point
    - line
    - positive-area
    boundingBoxRelation:
    - DISJOINT
    - WITHIN
    - CONTAINS-equal
    - CONTAINS-strict
    - INTERSECTS
    axisPosition:
    - left-of-rectangle
    - right-of-rectangle
    - below-rectangle
    - above-rectangle
    - inside-x-span
    - inside-y-span
    geometricOutcome:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
    boundaryType:
    - strict-separation
    - edge-touch
    - corner-touch
    - farthest-corner-touch
    - exact-bounding-box-equality
  scenarios:
  - id: EMPTY_CIRCLE_NONEMPTY_RECTANGLE
    category: EDGE
    description: An empty circle is related to an ordinary positive-area rectangle.
    preconditions:
    - The circle center is the empty NaN point, causing CircleImpl to store radius
      NaN and an all-NaN enclosing rectangle.
    - The rectangle bounds are [-1, 1] on both axes.
    expectedSourceBehavior:
    - The empty enclosing box is disjoint from the rectangle, so relate(Rectangle)
      returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONEMPTY_CIRCLE_EMPTY_RECTANGLE
    category: EDGE
    description: A positive-radius circle is related to the empty rectangle sentinel.
    preconditions:
    - The circle has center (0, 0) and radius 10.
    - All four rectangle bounds are NaN and rectangle.isEmpty() is true.
    expectedSourceBehavior:
    - The enclosing-box relation with the empty rectangle is DISJOINT, so the method
      returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SHAPES_EMPTY
    category: EDGE
    description: Both the circle and rectangle use their empty sentinels.
    preconditions:
    - The circle center is the empty NaN point.
    - All four rectangle bounds are NaN.
    expectedSourceBehavior:
    - The method returns DISJOINT through the empty enclosing-box relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STRICT_BOUNDING_BOX_DISJOINT
    category: NORMAL
    description: The rectangle lies strictly beyond the circle's right bounding-box
      edge.
    preconditions:
    - The rectangle bounds are x=[11, 12], y=[-1, 1].
    - The circle enclosing box is x=[-10, 10], y=[-10, 10], with a positive gap to
      the rectangle.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT and the method immediately returns
      DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_BOUNDING_BOX_STRICTLY_WITHIN_RECTANGLE
    category: NORMAL
    description: A rectangle strictly surrounds the complete circle bounding box.
    preconditions:
    - The rectangle bounds are x=[-11, 11], y=[-11, 11].
    expectedSourceBehavior:
    - The enclosing-box relation is WITHIN and the method immediately returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDING_BOX_WITHIN_WITH_SHARED_EDGE
    category: BOUNDARY
    description: The rectangle contains the circle bounding box while sharing one
      complete boundary edge.
    preconditions:
    - The rectangle bounds are x=[-10, 12], y=[-12, 12].
    - Its minimum x equals the enclosing box minimum x, while the other three bounds
      extend beyond the enclosing box.
    expectedSourceBehavior:
    - The enclosing box is WITHIN the rectangle, so the method returns WITHIN without
      phase 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_EQUALS_CIRCLE_BOUNDING_BOX
    category: EDGE
    description: The rectangle exactly equals the calculated circle bounding box.
    preconditions:
    - The rectangle bounds are x=[-10, 10], y=[-10, 10].
    - enclosingBox.equals(rectangle) is true.
    expectedSourceBehavior:
    - The explicit bbox-CONTAINS-and-equals identity edge case returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_INSIDE_RECTANGLE
    category: EDGE
    description: A zero-radius circle acts as a bounding-box point strictly inside
      a positive-area rectangle.
    preconditions:
    - The circle center is (0, 0) and radius is 0.
    - The rectangle bounds are x=[-1, 1], y=[-1, 1].
    expectedSourceBehavior:
    - The degenerate enclosing box is WITHIN the rectangle and the method returns
      WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUALS_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and a point rectangle have exactly equal bounds.
    preconditions:
    - The circle center is (0, 0) and radius is 0.
    - The rectangle has x=[0, 0], y=[0, 0].
    - The enclosing box equals the rectangle.
    expectedSourceBehavior:
    - The explicit equal-bounding-box edge case returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle is separated from a point rectangle.
    preconditions:
    - The circle center is (0, 0) and radius is 0.
    - The rectangle has x=[1, 1], y=[0, 0].
    expectedSourceBehavior:
    - The two degenerate bounding boxes are disjoint and the method returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHEAST_CLOSEST_CORNER_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the circle bounding box in the northeast but
      its closest corner is outside the circle.
    preconditions:
    - The rectangle bounds are x=[8, 12], y=[8, 12].
    - The closest corner is (8, 8), whose squared distance 128 exceeds radius squared
      100.
    expectedSourceBehavior:
    - Phase 2 selects minX and minY as the closest coordinates and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHWEST_CLOSEST_CORNER_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the bounding box in the northwest but misses
      the circle.
    preconditions:
    - The rectangle bounds are x=[-12, -8], y=[8, 12].
    - The closest corner is (-8, 8), whose squared distance is 128.
    expectedSourceBehavior:
    - Phase 2 exercises center-right-of-rectangle and center-below-rectangle selection,
      then returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHEAST_CLOSEST_CORNER_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the bounding box in the southeast but misses
      the circle.
    preconditions:
    - The rectangle bounds are x=[8, 12], y=[-12, -8].
    - The closest corner is (8, -8), whose squared distance is 128.
    expectedSourceBehavior:
    - Phase 2 exercises center-left-of-rectangle and center-above-rectangle selection,
      then returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_CLOSEST_CORNER_DISJOINT
    category: NORMAL
    description: The rectangle overlaps the bounding box in the southwest but misses
      the circle.
    preconditions:
    - The rectangle bounds are x=[-12, -8], y=[-12, -8].
    - The closest corner is (-8, -8), whose squared distance is 128.
    expectedSourceBehavior:
    - Phase 2 selects both maximum rectangle coordinates as the closest point and
      returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXTERNAL_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at exactly one closest corner.
    preconditions:
    - The rectangle bounds are x=[6, 12], y=[8, 12].
    - The closest corner is (6, 8), and 6^2 + 8^2 equals radius squared 100.
    expectedSourceBehavior:
    - contains(6, 8) succeeds at the boundary; because the bounding box does not contain
      the rectangle, the method returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CORNER_OVERLAP_WITH_RECTANGLE_EXTENDING_OUTSIDE_BBOX
    category: NORMAL
    description: The closest rectangle corner is strictly inside the circle while
      the rectangle extends beyond the circle bounding box.
    preconditions:
    - The rectangle bounds are x=[6, 12], y=[6, 12].
    - The closest corner squared distance is 72, less than radius squared 100.
    expectedSourceBehavior:
    - The shapes are not disjoint, but bboxSect is not CONTAINS, so the method returns
      INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_SLAB_SPANS_HORIZONTAL_AXIS
    category: NORMAL
    description: A narrow rectangle crosses the circle's horizontal axis near the
      right edge.
    preconditions:
    - The rectangle bounds are x=[9, 12], y=[-2, 2].
    - The center y-coordinate lies within the rectangle y-span, while the center is
      left of its x-span.
    expectedSourceBehavior:
    - The axis-span condition prevents corner-based disjoint rejection, and bboxSect
      is INTERSECTS, so the result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_SLAB_SPANS_VERTICAL_AXIS
    category: NORMAL
    description: A narrow rectangle crosses the circle's vertical axis near the top
      edge.
    preconditions:
    - The rectangle bounds are x=[-2, 2], y=[9, 12].
    - The center x-coordinate lies within the rectangle x-span, while the center is
      below its y-span.
    expectedSourceBehavior:
    - The axis-span condition rules out disjointness and the method returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIDE_TANGENCY_WHILE_SPANNING_AXIS
    category: BOUNDARY
    description: The rectangle touches the circle at the rightmost point while spanning
      the horizontal axis.
    preconditions:
    - The rectangle bounds are x=[10, 12], y=[-2, 2].
    - The common boundary point is (10, 0).
    expectedSourceBehavior:
    - The earlier bounding-box check does not classify the touching shapes as disjoint,
      and phase 2 returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STRICT_RECTANGLE_CONTAINED_BY_CIRCLE
    category: NORMAL
    description: A positive-area rectangle lies strictly inside the circle in one
      quadrant.
    preconditions:
    - The rectangle bounds are x=[1, 3], y=[2, 4].
    - Its selected farthest corner is (3, 4), with squared distance 25 less than 100.
    expectedSourceBehavior:
    - The circle bounding box contains the rectangle and the farthest corner is contained,
      so the method returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_TANGENT_CONTAINMENT
    category: BOUNDARY
    description: The rectangle is contained by the circle with its farthest corner
      exactly on the circumference.
    preconditions:
    - The rectangle bounds are x=[0, 6], y=[0, 8].
    - The selected farthest corner is (6, 8), whose squared distance equals 100.
    expectedSourceBehavior:
    - Boundary containment succeeds and the method returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CENTRAL_RECTANGLE_CORNERS_OUTSIDE_CIRCLE
    category: NORMAL
    description: The circle bounding box contains a central rectangle, but the rectangle's
      corners extend outside the circle.
    preconditions:
    - The rectangle bounds are x=[-8, 8], y=[-8, 8].
    - The selected farthest corner has squared distance 128, greater than 100.
    expectedSourceBehavior:
    - The shapes are not disjoint, but the farthest-corner containment test fails,
      so the method returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ASYMMETRIC_AXIS_CROSSING_FARTHEST_CORNER_OUTSIDE
    category: NORMAL
    description: An asymmetric rectangle crosses both axes and has a selected farthest
      corner outside the circle.
    preconditions:
    - The rectangle bounds are x=[-2, 7], y=[-9, 1].
    - The selected farthest corner is (7, -9), with squared distance 130.
    expectedSourceBehavior:
    - The rectangle cannot be rejected as disjoint because it spans both axes; the
      failed farthest-corner test yields INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EQUAL_DISTANCE_TIES_AT_TANGENT_CORNERS
    category: BOUNDARY
    description: A centered rectangle has equal farthest-distance choices on both
      axes and all corners lie on the circle.
    preconditions:
    - The rectangle bounds are x=[-6, 6], y=[-8, 8].
    - Both farthest-axis comparisons are ties, causing the source's strict greater-than
      expressions to select minimum bounds.
    - The selected corner (-6, -8) has squared distance 100.
    expectedSourceBehavior:
    - The tie-selected farthest corner is contained on the boundary, so the method
      returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_AT_CIRCLE_CENTER
    category: EDGE
    description: A degenerate point rectangle is located at the center of a positive-radius
      circle.
    preconditions:
    - The rectangle has x=[0, 0], y=[0, 0].
    - The circle radius is 10, so its enclosing box is not equal to this rectangle.
    expectedSourceBehavior:
    - The enclosing box contains the point rectangle and its sole point is contained,
      so the method returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_ON_CIRCUMFERENCE
    category: BOUNDARY
    description: A point rectangle lies exactly on the positive-radius circle boundary.
    preconditions:
    - The rectangle has x=[10, 10], y=[0, 0].
    expectedSourceBehavior:
    - The point is within the enclosing box and contains(10, 0) succeeds at the boundary,
      so the result is CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_INSIDE_BBOX_OUTSIDE_CIRCLE
    category: EDGE
    description: A point rectangle lies inside the circle bounding box but outside
      the circle itself.
    preconditions:
    - The rectangle has x=[9, 9], y=[9, 9].
    - Its squared distance from the center is 162, greater than 100.
    expectedSourceBehavior:
    - Phase 2 tests the point as the closest corner and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAMETER_LINE_RECTANGLE
    category: EDGE
    description: A zero-height rectangle represents a complete horizontal circle diameter.
    preconditions:
    - The rectangle bounds are x=[-10, 10], y=[0, 0].
    - The farthest-x comparison is a tie and selects minX=-10.
    expectedSourceBehavior:
    - The selected endpoint (-10, 0) is on the circumference, so the circle returns
      CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LINE_CROSSES_CIRCLE_WITH_ENDPOINTS_OUTSIDE
    category: EDGE
    description: A zero-height rectangle crosses the upper part of the circle while
      both endpoints are outside.
    preconditions:
    - The rectangle bounds are x=[-8, 8], y=[8, 8].
    - Each endpoint has squared distance 128, while points near x=0 are inside the
      circle.
    expectedSourceBehavior:
    - The line is not disjoint because it spans the vertical axis, but its selected
      farthest endpoint is outside, so the result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_CHORD_WITH_TANGENT_ENDPOINTS
    category: EDGE
    description: A zero-width rectangle is a vertical chord whose two endpoints are
      on the circumference.
    preconditions:
    - The rectangle bounds are x=[6, 6], y=[-8, 8].
    - Both endpoints (6, -8) and (6, 8) have squared distance 100.
    expectedSourceBehavior:
    - The enclosing box contains the line and the tie-selected farthest endpoint is
      contained, so the method returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
