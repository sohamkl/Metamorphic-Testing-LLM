InputDomain:
  summary: Finite, non-null, detached jsoup Node trees paired with fresh deterministic
    NodeFilter callbacks whose head and tail results exercise CONTINUE, SKIP_CHILDREN,
    SKIP_ENTIRE, REMOVE, and STOP while comparing traversal observations on the original
    and its deep clone.
  globalConstraints:
  - Each source root is non-null, detached, finite, acyclic, and has no sibling outside
    the supplied root; the root may have zero or more descendants.
  - Each filter is non-null, fresh for its execution, and implements the same deterministic
    policy for the original and deep-cloned roots.
  - The policy depends only on observable cloned-tree structure, node kind, depth,
    sibling position, and whether the callback is head or tail; it does not depend
    on object identity.
  - Every configured non-CONTINUE result is assigned to at least one callback that
    is reached during traversal.
  - The original and clone start with equivalent tree structure and equivalent outerHtml,
    and both executions use the same policy and initial DOM state.
  - For every case, compare terminal FilterResult, ordered head and tail callback
    sequence, ordered callback actions, and final root outerHtml.
  - Only valid non-null detached roots and valid NodeFilter callbacks are included;
    invalid-input behavior is outside the metamorphic relation because the relation
    explicitly requires a non-null detached root and executable fresh filters.
  diversity:
    rootChildCount:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
    maximumDepth:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
    branchingShape:
    - leaf
    - single-child-chain
    - two-leaf-siblings
    - mixed-branching
    - nested-subtree-with-sibling
    nodeKind:
    - element
    - text
    - comment
    - mixed-element-text-comment
    headAction:
    - CONTINUE
    - SKIP_CHILDREN
    - SKIP_ENTIRE
    - REMOVE
    - STOP
    tailAction:
    - CONTINUE
    - SKIP_CHILDREN
    - REMOVE
    - STOP
    actionLocation:
    - root-head
    - root-tail
    - internal-head
    - internal-tail
    - first-child
    - middle-child
    - last-child
    siblingPosition:
    - only-child
    - first-of-two
    - middle-of-three
    - last-child
    removalTarget:
    - root
    - leaf-child
    - internal-subtree
    - first-sibling
    - last-sibling
    callbackCoverage:
    - head-only
    - head-and-tail
    - descendant-head-and-tail
    - mixed-head-and-tail
  scenarios:
  - id: ROOT_LEAF_CONTINUE
    category: EDGE
    description: A detached root with no children receives CONTINUE in head and tail.
    preconditions:
    - The root has childNodeSize() == 0.
    - The head callback returns CONTINUE and the tail callback returns CONTINUE.
    expectedSourceBehavior:
    - filter calls head exactly once, then tail exactly once at depth 0.
    - The traversal returns CONTINUE and does not visit any descendant.
    - The original and clone have identical callback sequences, actions, return value,
      and final outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_LEAF_SKIP_CHILDREN
    category: BOUNDARY
    description: A leaf root receives SKIP_CHILDREN, exercising the no-descendants
      path without suppressing the root tail.
    preconditions:
    - The root has childNodeSize() == 0.
    - The root head callback returns SKIP_CHILDREN and its tail callback returns CONTINUE.
    expectedSourceBehavior:
    - filter calls head and then tail for the root; no child callback is possible.
    - The configured SKIP_CHILDREN action occurs at least once.
    - The final return is the tail result, CONTINUE, and the clone follows the same
      sequence.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_LEAF_SKIP_ENTIRE
    category: BOUNDARY
    description: A leaf root receives SKIP_ENTIRE, exercising the path that advances
      without calling tail.
    preconditions:
    - The root has childNodeSize() == 0.
    - The root head callback returns SKIP_ENTIRE.
    expectedSourceBehavior:
    - filter calls head once and does not call tail for the root.
    - The traversal returns SKIP_ENTIRE immediately from the root-level completion
      path.
    - Original and clone both record the same head-only sequence and unchanged outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_LEAF_REMOVE
    category: EDGE
    description: A detached leaf root receives REMOVE, exercising the root terminal
      path.
    preconditions:
    - The root has no parent and childNodeSize() == 0.
    - The root head callback returns REMOVE.
    expectedSourceBehavior:
    - filter returns REMOVE for the root without calling tail.
    - No descendant or sibling is visited, and the detached root has no parent from
      which it can be removed.
    - The same return, callback sequence, action, and outerHtml are observed for the
      clone.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_LEAF_STOP
    category: EDGE
    description: A detached leaf root returns STOP directly from head.
    preconditions:
    - The root has childNodeSize() == 0.
    - The root head callback returns STOP.
    expectedSourceBehavior:
    - filter returns STOP immediately and never calls tail.
    - The STOP action is reached on both executions.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_WITH_ONE_CHILD_CONTINUE
    category: NORMAL
    description: A root with one leaf child is traversed completely in depth-first
      order.
    preconditions:
    - The root has exactly one child and that child has childNodeSize() == 0.
    - All head and tail callbacks return CONTINUE.
    expectedSourceBehavior:
    - The callback order is root head, child head, child tail, root tail with depths
      0, 1, 1, 0.
    - The traversal returns CONTINUE and visits both nodes exactly once in each phase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_WITH_TWO_LEAF_SIBLINGS
    category: NORMAL
    description: A root with two leaf children exercises sibling advance after a completed
      child.
    preconditions:
    - The root has exactly two children, both leaves.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - The first child is fully tailed before the second child is headed.
    - The callback order is root head, child-0 head/tail, child-1 head/tail, root
      tail.
    - The final result is CONTINUE and both clone traversals preserve sibling order.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_WITH_THREE_SIBLINGS
    category: BOUNDARY
    description: Three leaf children exercise repeated sibling transitions and the
      middle-sibling boundary.
    preconditions:
    - The root has exactly three leaf children.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - Each child receives head and tail exactly once in positions 0, 1, and 2.
    - No callback occurs outside the original root range.
    - The original and clone have identical ordered observations and return CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_CHILD_CHAIN_DEPTH_THREE
    category: NORMAL
    description: A four-node single-child chain exercises repeated descent and ascent.
    preconditions:
    - The root has one child, that child has one child, and so on for maximum depth
      3.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - Heads occur at depths 0, 1, 2, and 3 before the deepest tail.
    - Tails then occur while ascending at depths 3, 2, 1, and 0.
    - The final result is CONTINUE with equal callback depth sequences on the clone.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_SKIP_CHILDREN_WITH_DESCENDANTS
    category: NORMAL
    description: An internal node with descendants returns SKIP_CHILDREN, pruning
      descent but still receiving tail.
    preconditions:
    - The root has one child, and that child has at least one child.
    - The internal child's head returns SKIP_CHILDREN; all tails return CONTINUE.
    expectedSourceBehavior:
    - The internal child's descendants receive no callbacks.
    - The internal child receives tail after head, then the root receives tail.
    - The configured SKIP_CHILDREN action is reached and the final result is CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_SKIP_ENTIRE_WITH_SIBLING
    category: NORMAL
    description: The first child is an internal subtree whose head returns SKIP_ENTIRE,
      followed by a sibling.
    preconditions:
    - The root has at least two children; child 0 has descendants and child 1 is present.
    - Child 0 head returns SKIP_ENTIRE; all other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - No descendant or tail callback is produced for child 0.
    - Traversal advances to child 1 and then eventually tails the root.
    - The final result is CONTINUE, while SKIP_ENTIRE is observed in both runs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_FIRST_LEAF_WITH_SIBLING
    category: NORMAL
    description: The first of two leaf children returns REMOVE, exercising removal
      after the next sibling is located.
    preconditions:
    - The root has exactly two leaf children.
    - The first child head returns REMOVE; all other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The first child is not tailed after REMOVE.
    - The second child is visited, the first child is removed from the original and
      cloned root, and the root is tailed.
    - The final root outerHtml contains only the surviving second child and both runs
      return CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_LAST_LEAF_CHILD
    category: NORMAL
    description: The last child of a root returns REMOVE, exercising removal after
      ascending with no next sibling.
    preconditions:
    - The root has at least two children and the selected removable child is the last
      child.
    - The removable child is a leaf and its head returns REMOVE; other callbacks return
      CONTINUE.
    expectedSourceBehavior:
    - The removable child is not tailed.
    - The child is removed after the traversal identifies its parent, then the parent
      is tailed.
    - The final outerHtml omits exactly that last child and the clone matches.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_INTERNAL_SUBTREE_WITH_SIBLING
    category: NORMAL
    description: A non-root internal subtree is removed as a unit while a following
      sibling remains traversable.
    preconditions:
    - The root has at least two children; child 0 has at least one descendant and
      child 1 exists.
    - Child 0 head returns REMOVE; child 1 and root callbacks return CONTINUE.
    expectedSourceBehavior:
    - No callbacks occur for descendants of the removed child.
    - The removed subtree is absent from final outerHtml, child 1 is traversed, and
      the root is tailed.
    - The same subtree removal, callback sequence, action sequence, and final result
      occur on the clone.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_LAST_INTERNAL_SUBTREE
    category: BOUNDARY
    description: The final child is a non-leaf subtree whose head returns REMOVE.
    preconditions:
    - The root has at least one child; the last child has at least one descendant.
    - The last child's head returns REMOVE and all other reached callbacks return
      CONTINUE.
    expectedSourceBehavior:
    - The removed subtree is not descended into or tailed.
    - The parent is reached for tail processing after removal.
    - The final outerHtml contains the root without the removed subtree and matches
      the clone.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_FROM_MIDDLE_OF_THREE
    category: BOUNDARY
    description: The middle child of three siblings returns REMOVE, distinguishing
      previous and next sibling handling.
    preconditions:
    - The root has exactly three leaf children.
    - Only the middle child's head returns REMOVE; all other reached callbacks return
      CONTINUE.
    expectedSourceBehavior:
    - The first child is fully visited, the middle child is headed but not tailed,
      and the third child is visited.
    - The middle child is absent from final outerHtml and the final result is CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STOP_AT_INTERNAL_HEAD
    category: NORMAL
    description: A descendant returns STOP from head before its own children or tail
      are processed.
    preconditions:
    - The root has a child with at least one descendant.
    - The selected internal child's head returns STOP; all earlier callbacks return
      CONTINUE.
    expectedSourceBehavior:
    - Traversal stops at that head callback; the selected node's children and tail
      are not visited.
    - Nodes after the stopping node are not visited.
    - Both executions return STOP with identical prefix callback observations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STOP_AT_LEAF_TAIL
    category: NORMAL
    description: A leaf child returns STOP from tail after normal head processing.
    preconditions:
    - The root has at least one leaf child.
    - The selected leaf head returns CONTINUE and its tail returns STOP; earlier callbacks
      return CONTINUE.
    expectedSourceBehavior:
    - The selected leaf receives both head and tail, and traversal stops immediately
      from tail.
    - Later siblings and the root tail are not visited.
    - The clone produces the same callback prefix and STOP result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STOP_AT_ROOT_TAIL
    category: EDGE
    description: A fully traversed root returns STOP from its tail.
    preconditions:
    - The root has at least one child and all descendant callbacks return CONTINUE.
    - The root tail callback returns STOP.
    expectedSourceBehavior:
    - All descendants are traversed, then root tail returns STOP.
    - The final result is STOP and no callback occurs after root tail.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_SKIP_CHILDREN_WITH_LARGE_SUBTREE
    category: BOUNDARY
    description: The root itself returns SKIP_CHILDREN despite having multiple levels
      of descendants.
    preconditions:
    - The root has at least two children and maximum depth is at least 2.
    - The root head returns SKIP_CHILDREN and its tail returns CONTINUE.
    expectedSourceBehavior:
    - No descendant callback occurs.
    - The root still receives tail and the final result is CONTINUE.
    - SKIP_CHILDREN is reached and both final outerHtml values remain unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_SKIP_ENTIRE_WITH_SUBTREE
    category: BOUNDARY
    description: The root with descendants returns SKIP_ENTIRE, exercising root-level
      pruning without tail.
    preconditions:
    - The root has at least one descendant.
    - The root head returns SKIP_ENTIRE.
    expectedSourceBehavior:
    - No descendant or root-tail callback occurs.
    - The traversal returns SKIP_ENTIRE and leaves outerHtml unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_REMOVE_WITH_SUBTREE
    category: EDGE
    description: A detached root with descendants returns REMOVE at root head.
    preconditions:
    - The root has at least one descendant and has no parent.
    - The root head returns REMOVE.
    expectedSourceBehavior:
    - The root is not descended into or tailed, and filter returns REMOVE.
    - Because the supplied root is detached and is the terminal root, no parent removal
      is available.
    - The original and clone retain equivalent outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_HEAD_ACTIONS_SINGLE_RUN
    category: NORMAL
    description: One tree reaches SKIP_CHILDREN, REMOVE, and STOP in distinct callback
      positions.
    preconditions:
    - 'The root has three children: child 0 has descendants, child 1 is removable,
      and child 2 is present.'
    - Child 0 head returns SKIP_CHILDREN, child 1 head returns REMOVE, child 2 tail
      returns STOP, and all other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - Child 0 is headed and tailed without descending, child 1 is headed and removed
      without tail, and child 2 reaches tail STOP.
    - The root tail is not reached after the stop.
    - Every configured non-CONTINUE action is observed and the clone has the same
      mutations, callback sequence, and STOP result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_ALL_NONCONTINUE_ACTIONS
    category: NORMAL
    description: A deterministic policy reaches SKIP_CHILDREN, SKIP_ENTIRE, REMOVE,
      and STOP on separate nodes.
    preconditions:
    - The tree has at least four ordered child positions, with enough descendants
      under the SKIP_CHILDREN and SKIP_ENTIRE nodes to distinguish pruning.
    - The policy assigns SKIP_CHILDREN to the first selected child, SKIP_ENTIRE to
      the second, REMOVE to the third, and STOP from a later reached tail; all intervening
      callbacks return CONTINUE.
    expectedSourceBehavior:
    - Each configured non-CONTINUE action is reached at least once.
    - Skipped descendants and the removed subtree are absent from callback observations;
      traversal terminates at STOP.
    - Original and clone have identical action order, terminal result, and final outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TEXT_LEAF_ROOT
    category: EDGE
    description: A detached text Node is used as a leaf root.
    preconditions:
    - The root is a text node with childNodeSize() == 0.
    - The deterministic policy returns CONTINUE from head and tail.
    expectedSourceBehavior:
    - The generic Node traversal performs one head and one tail without requiring
      an Element root.
    - The text node outerHtml and CONTINUE result match between original and clone.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMENT_LEAF_ROOT
    category: EDGE
    description: A detached comment Node is used as a leaf root.
    preconditions:
    - The root is a comment node with childNodeSize() == 0.
    - The policy returns STOP from head.
    expectedSourceBehavior:
    - filter calls only comment head and returns STOP.
    - The clone produces the same node-kind observation, action, return value, and
      outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_NODE_KINDS_DEPTH_FIRST
    category: NORMAL
    description: An element root contains text, comment, and element descendants in
      sibling order.
    preconditions:
    - The root has at least three descendants whose node kinds include text, comment,
      and element.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - Traversal order follows child order and depth-first structure without filtering
      by node kind.
    - Each reached node receives the expected head and tail callbacks and the final
      result is CONTINUE.
    - The clone preserves node-kind order, callback sequence, and outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_ELEMENT_ROOT
    category: EDGE
    description: An empty element root distinguishes an element node with zero children
      from an element with descendants.
    preconditions:
    - The root is an element with childNodeSize() == 0.
    - Head returns CONTINUE and tail returns CONTINUE.
    expectedSourceBehavior:
    - Only the root head and tail callbacks occur.
    - The traversal returns CONTINUE and no child descent branch is taken.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEEP_BRANCHING_TREE
    category: NORMAL
    description: A depth-four tree has both nested descendants and multiple sibling
      transitions.
    preconditions:
    - Maximum depth is exactly 4.
    - At least one node has two children and at least one non-root node has a following
      sibling.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - The sequence contains both descent into first children and ascent followed by
      sibling traversal.
    - Every node is visited in depth-first document order with matching head and tail
      events.
    - The clone has the same sequence and final CONTINUE result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_ON_LAST_SIBLING
    category: BOUNDARY
    description: The last child returns SKIP_CHILDREN, exercising pruning immediately
      before ascent to the parent.
    preconditions:
    - The root has at least two children and the selected last child has descendants.
    - The last child's head returns SKIP_CHILDREN; all tails return CONTINUE.
    expectedSourceBehavior:
    - The last child's descendants are not visited, its tail is called, and traversal
      ascends to root tail.
    - The final result is CONTINUE and the SKIP_CHILDREN action is observed on both
      trees.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_CHILD_WITHOUT_NEXT_SIBLING
    category: BOUNDARY
    description: A removable child is the only child of its parent, forcing the no-next-sibling
      ascent branch.
    preconditions:
    - The root has exactly one child, that child is a leaf, and the root is detached.
    - The child head returns REMOVE; the root tail returns CONTINUE.
    expectedSourceBehavior:
    - The child is headed but not tailed, then removed after its parent is identified.
    - The root is tailed with no remaining children and filter returns CONTINUE.
    - The clone has identical removal and final outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTINUE_AFTER_REMOVAL_TO_SIBLING
    category: NORMAL
    description: Removal of a non-last child is followed by continued traversal of
      the next sibling.
    preconditions:
    - The root has exactly two children and both are leaves.
    - The first child's head returns REMOVE; the second child's head and tail and
      root tail return CONTINUE.
    expectedSourceBehavior:
    - The next sibling is selected before the removed child is detached.
    - The second child is still visited, the root is tailed, and the final result
      is CONTINUE.
    - Both executions produce the same surviving outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
