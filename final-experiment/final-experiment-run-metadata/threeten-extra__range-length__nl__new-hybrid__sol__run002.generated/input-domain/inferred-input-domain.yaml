    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_LEAP_FEBRUARY_BY_DATES
    category: EDGE
    description: A direct half-open range crossing February 29.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2024, 2, 27), LocalDate.of(2024,
      3, 2)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 4.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_BCE_CE_YEAR_BOUNDARY
    category: EDGE
    description: A finite range crossing from proleptic year minus 1 into year 0.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(-1, 12, 31), LocalDate.of(0,
      1, 2)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
