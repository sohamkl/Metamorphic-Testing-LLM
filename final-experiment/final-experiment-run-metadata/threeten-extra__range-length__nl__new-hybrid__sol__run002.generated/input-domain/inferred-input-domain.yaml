InputDomain:
  summary: Valid, bounded LocalDateRange receivers whose exclusive end can move 23
    days later while remaining bounded and whose finite day count can increase by
    23 within the int result domain.
  globalConstraints:
  - The source receiver must be successfully constructed by one of the supplied LocalDateRange
    construction paths; null arguments, parse failures, reversed endpoints, and constructor-rejected
    sentinel endpoints are outside this valid-input MR.
  - 'The source must be bounded at both ends: source.getStart() != LocalDate.MIN and
    source.getEnd() != LocalDate.MAX.'
  - Unbounded sources are excluded because lengthInDays() returns Integer.MAX_VALUE
    as a flag; an unbounded-end source cannot move its end later, and an unbounded-start
    source retains the flag instead of increasing by 23.
  - The source exclusive end must satisfy source.getEnd() <= LocalDate.MAX.minusDays(24),
    so source.getEnd().plusDays(23) exists and is not LocalDate.MAX, which the class
    treats as an unbounded end.
  - Let D = source.getEnd().toEpochDay() - source.getStart().toEpochDay(); D must
    be between 0 and 2147483624 inclusive, so both D and D + 23 are representable
    nonnegative int results.
  - Finite ranges with D greater than 2147483624 are excluded because an exact result
    23 greater than the source cannot be represented by the int return type.
  - The follow-up must be source.withEnd(source.getEnd().plusDays(23)); its start
    must equal source.getStart() and no other source property may be deliberately
    adjusted.
  - For every included source, source.lengthInDays() must equal D and followUp.lengthInDays()
    must equal D + 23.
  diversity:
    constructionPath:
    - of_dates
    - of_period
    - ofClosed
    - ofEmpty
    - from_LocalDate
    - from_date_time
    - from_Year
    - from_YearMonth
    - from_YearHalf
    - from_YearQuarter
    - from_YearWeek
    - parse_date_date
    - parse_date_period
    - parse_period_date
    sourceLengthClass:
    - zero
    - one
    - below_23
    - exactly_23
    - above_23
    - near_int_upper_boundary
    endpointRegion:
    - ordinary
    - earliest_bounded_start
    - latest_transformable_end
    calendarFeature:
    - ordinary_day
    - month_boundary
    - year_boundary
    - common_February
    - leap_February
    - BCE_CE_boundary
    parseBranch:
    - date_slash_date
    - date_slash_uppercase_period
    - date_slash_lowercase_period
    - uppercase_period_slash_date
    - lowercase_period_slash_date
  scenarios:
  - id: EMPTY_ORDINARY
    category: EDGE
    description: An ordinary empty range constructed with ofEmpty.
    preconditions:
    - Construct source as LocalDateRange.ofEmpty(LocalDate.of(2023, 6, 15)).
    expectedSourceBehavior:
    - source.isEmpty() is true.
    - source.lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_EARLIEST_OFEMPTY_LOCATION
    category: BOUNDARY
    description: An empty range at the earliest location accepted by ofEmpty.
    preconditions:
    - Construct source as LocalDateRange.ofEmpty(LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - source.getStart() equals source.getEnd().
    - source.lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_LATEST_TRANSFORMABLE_END
    category: BOUNDARY
    description: An empty range whose endpoint is the latest endpoint permitted by
      the follow-up constraints.
    preconditions:
    - Construct source as LocalDateRange.ofEmpty(LocalDate.MAX.minusDays(24)).
    expectedSourceBehavior:
    - source.isEmpty() is true.
    - source.lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN
    category: BOUNDARY
    description: The smallest nonempty half-open range.
    preconditions:
    - Construct source with of(start, start.plusDays(1)) for an ordinary transformable
      start.
    expectedSourceBehavior:
    - source.isEmpty() is false.
    - source.lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_22_BELOW_SHIFT
    category: BOUNDARY
    description: A range one day shorter than the 23-day transformation amount.
    preconditions:
    - Construct source with of(start, start.plusDays(22)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 22.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EXACTLY_23
    category: BOUNDARY
    description: A range whose source length equals the transformation amount.
    preconditions:
    - Construct source with of(start, start.plusDays(23)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_24_ABOVE_SHIFT
    category: BOUNDARY
    description: A range one day longer than the transformation amount.
    preconditions:
    - Construct source with of(start, start.plusDays(24)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_LIMIT_MINUS_24
    category: BOUNDARY
    description: A very long finite range just below the largest source length boundary.
    preconditions:
    - The endpoint difference D must equal 2147483623.
    - Both endpoints must satisfy all global constraints.
    expectedSourceBehavior:
    - source.lengthInDays() returns 2147483623.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_INT_LIMIT_MINUS_23
    category: BOUNDARY
    description: The largest finite source length for which adding 23 remains representable
      as an int.
    preconditions:
    - The endpoint difference D must equal 2147483624.
    - Both endpoints must satisfy all global constraints.
    expectedSourceBehavior:
    - source.lengthInDays() returns 2147483624.
    - The expected follow-up result is Integer.MAX_VALUE as the finite numeric result
      D + 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_BOUNDED_START
    category: BOUNDARY
    description: A finite range beginning at the first date after the unbounded-start
      sentinel.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - source.isUnboundedStart() is false.
    - source.lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATEST_TRANSFORMABLE_EXCLUSIVE_END
    category: BOUNDARY
    description: A nonempty range ending at LocalDate.MAX minus 24 days.
    preconditions:
    - Construct source with end equal to LocalDate.MAX.minusDays(24) and start equal
      to end.minusDays(1).
    expectedSourceBehavior:
    - source.isUnboundedEnd() is false.
    - source.lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLETON
    category: EDGE
    description: A closed range whose inclusive start and end are the same date.
    preconditions:
    - Construct source as LocalDateRange.ofClosed(LocalDate.of(2023, 8, 10), LocalDate.of(2023,
      8, 10)).
    expectedSourceBehavior:
    - The stored exclusive end is one day after the start.
    - source.lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_ACROSS_LEAP_DAY
    category: NORMAL
    description: A closed range containing February 28, leap day, and March 1.
    preconditions:
    - Construct source as LocalDateRange.ofClosed(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 1)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_RANGE
    category: EDGE
    description: An empty range constructed from a nonnegative zero Period.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2023, 5, 20), Period.ZERO).
    expectedSourceBehavior:
    - source.isEmpty() is true.
    - source.lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_OF_DAYS_23
    category: NORMAL
    description: A range constructed from an exact 23-day Period.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2023, 5, 20), Period.ofDays(23)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_OF_TWO_WEEKS
    category: NORMAL
    description: A range constructed using Period.ofWeeks.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2023, 5, 20), Period.ofWeeks(2)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 14.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_MONTH_FROM_JANUARY_31_COMMON_YEAR
    category: EDGE
    description: A one-month Period whose date addition resolves January 31 into common-year
      February.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2023, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - source.getEnd() is LocalDate.of(2023, 2, 28).
    - source.lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_MONTH_FROM_JANUARY_31_LEAP_YEAR
    category: EDGE
    description: A one-month Period whose date addition resolves January 31 into leap-year
      February.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - source.getEnd() is LocalDate.of(2024, 2, 29).
    - source.lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_YEAR_FROM_COMMON_YEAR_START
    category: NORMAL
    description: A one-year Period beginning at the start of a common year.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2023, 1, 1), Period.ofYears(1)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_YEAR_FROM_LEAP_YEAR_START
    category: NORMAL
    description: A one-year Period beginning at the start of a leap year.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2024, 1, 1), Period.ofYears(1)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_MONTH_AND_DAY_PERIOD
    category: EDGE
    description: A range whose Period combines month and day components.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2023, 1, 30), Period.of(0,
      1, 2)).
    expectedSourceBehavior:
    - source.getEnd() is LocalDate.of(2023, 3, 2).
    - source.lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: The from(Temporal) path where the temporal directly supplies a LocalDate.
    preconditions:
    - Construct source as LocalDateRange.from(LocalDate.of(2023, 7, 12)).
    expectedSourceBehavior:
    - The resulting range is a one-day closed range.
    - source.lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_TEMPORAL_WITH_DATE_AND_TIME
    category: NORMAL
    description: The from(Temporal) local-date-query path using a temporal that also
      has a time component.
    preconditions:
    - Construct source with LocalDateRange.from applied to a LocalDateTime on 2023-07-12.
    expectedSourceBehavior:
    - The time component is ignored when constructing the range.
    - source.lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: The explicit Year branch for a common year.
    preconditions:
    - Construct source as LocalDateRange.from(Year.of(2023)).
    expectedSourceBehavior:
    - The range covers all of 2023.
    - source.lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: EDGE
    description: The explicit Year branch for a leap year.
    preconditions:
    - Construct source as LocalDateRange.from(Year.of(2024)).
    expectedSourceBehavior:
    - The range covers all of 2024.
    - source.lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_28_DAY_YEARMONTH
    category: BOUNDARY
    description: The YearMonth branch for a 28-day February.
    preconditions:
    - Construct source as LocalDateRange.from(YearMonth.of(2023, 2)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_29_DAY_YEARMONTH
    category: BOUNDARY
    description: The YearMonth branch for a leap-year February.
    preconditions:
    - Construct source as LocalDateRange.from(YearMonth.of(2024, 2)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_30_DAY_YEARMONTH
    category: NORMAL
    description: The YearMonth branch for a 30-day month.
    preconditions:
    - Construct source as LocalDateRange.from(YearMonth.of(2023, 4)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_31_DAY_YEARMONTH
    category: NORMAL
    description: The YearMonth branch for a 31-day month.
    preconditions:
    - Construct source as LocalDateRange.from(YearMonth.of(2023, 7)).
    expectedSourceBehavior:
    - source.lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_FIRST_HALF_LEAP_YEAR
    category: EDGE
    description: The YearHalf branch for a first half containing leap day.
    preconditions:
    - Construct source from the first YearHalf of 2024.
    expectedSourceBehavior:
    - The range covers January through June 2024.
    - source.lengthInDays() returns 182.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_SECOND_HALF_COMMON_YEAR
    category: NORMAL
    description: The YearHalf branch for a July-through-December half.
    preconditions:
    - Construct source from the second YearHalf of 2023.
    expectedSourceBehavior:
    - The range covers July through December 2023.
    - source.lengthInDays() returns 184.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_90_DAY_QUARTER
    category: NORMAL
    description: The YearQuarter branch for a 90-day quarter.
    preconditions:
    - Construct source from the first YearQuarter of 2023.
    expectedSourceBehavior:
    - source.lengthInDays() returns 90.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_91_DAY_QUARTER
    category: NORMAL
    description: The YearQuarter branch for a 91-day quarter.
    preconditions:
    - Construct source from the second YearQuarter of 2023.
    expectedSourceBehavior:
    - source.lengthInDays() returns 91.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_92_DAY_QUARTER
    category: NORMAL
    description: The YearQuarter branch for a 92-day quarter.
    preconditions:
    - Construct source from the third YearQuarter of 2023.
    expectedSourceBehavior:
    - source.lengthInDays() returns 92.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_ORDINARY_YEAR_WEEK
    category: NORMAL
    description: The YearWeek branch for a week wholly inside one calendar year.
    preconditions:
    - Construct source from a YearWeek whose Monday and Sunday are in the same calendar
      year.
    expectedSourceBehavior:
    - The range covers Monday through Sunday.
    - source.lengthInDays() returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_CROSS_YEAR_WEEK
    category: EDGE
    description: The YearWeek branch for a week crossing a calendar-year boundary.
    preconditions:
    - Construct source from a YearWeek whose Monday and Sunday belong to different
      calendar years.
    expectedSourceBehavior:
    - The range still covers exactly Monday through Sunday.
    - source.lengthInDays() returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_EMPTY
    category: EDGE
    description: The parse date/date branch producing an empty half-open range.
    preconditions:
    - Construct source with LocalDateRange.parse("2023-06-15/2023-06-15").
    expectedSourceBehavior:
    - source.isEmpty() is true.
    - source.lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_CROSS_YEAR
    category: NORMAL
    description: The parse date/date branch with an exclusive end in the next year.
    preconditions:
    - Construct source with LocalDateRange.parse("2023-12-20/2024-01-10").
    expectedSourceBehavior:
    - source.lengthInDays() returns 21.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_UPPERCASE_PERIOD
    category: NORMAL
    description: The parse date/period branch selected by an uppercase P.
    preconditions:
    - Construct source with LocalDateRange.parse("2024-02-01/P1M").
    expectedSourceBehavior:
    - source.getEnd() is LocalDate.of(2024, 3, 1).
    - source.lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_LOWERCASE_PERIOD
    category: EDGE
    description: The parse date/period branch selected by a lowercase p.
    preconditions:
    - Construct source with LocalDateRange.parse("2023-02-01/p1m").
    expectedSourceBehavior:
    - source.getEnd() is LocalDate.of(2023, 3, 1).
    - source.lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_UPPERCASE_PERIOD_DATE
    category: NORMAL
    description: The parse period/date branch selected by an uppercase P at the beginning.
    preconditions:
    - Construct source with LocalDateRange.parse("P1M/2023-03-31").
    expectedSourceBehavior:
    - source.getStart() is LocalDate.of(2023, 2, 28).
    - source.lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_LOWERCASE_PERIOD_DATE
    category: EDGE
    description: The parse period/date branch selected by a lowercase p at the beginning.
    preconditions:
    - Construct source with LocalDateRange.parse("p23d/2023-02-01").
    expectedSourceBehavior:
    - source.lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_COMMON_FEBRUARY_BY_DATES
    category: EDGE
    description: A direct half-open range crossing common-year February.
    preconditions:
    - Construct source as LocalDateRange.of(LocalDate.of(2023, 2, 27), LocalDate.of(2023,
      3, 2)).
    expectedSourceBehavior:
