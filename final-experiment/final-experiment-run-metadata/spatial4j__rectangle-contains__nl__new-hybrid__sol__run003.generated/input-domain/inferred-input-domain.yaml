    description: Only the maximum endpoint wraps, converting a source nonwrapping
      rectangle into a wrapped follow-up.
    preconditions:
    - (minX,maxX,minY,maxY) = (-100,50,-10,10) and (pointX,pointY) = (0,0).
    expectedSourceBehavior:
    - The source direct longitude path returns CONTAINS.
    - Rotation produces wrapped endpoints (50,-160) and point longitude 150.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_NONWRAP_TO_WRAP_DISJOINT
