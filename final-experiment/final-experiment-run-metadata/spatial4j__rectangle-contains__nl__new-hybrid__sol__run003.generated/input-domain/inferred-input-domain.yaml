    preconditions:
    - (minX,maxX,minY,maxY) = (170,-170,-10,10) and (pointX,pointY) = (-175,0).
    expectedSourceBehavior:
    - The rectangle is unwrapped, pointX receives +360, and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_CENTRAL_GAP
    category: NORMAL
    description: The point lies in the gap excluded by a narrow dateline-wrapping
