    description: A nonwrapping source becomes wrapped while an outside point remains
      outside.
    preconditions:
    - (minX,maxX,minY,maxY) = (-100,50,-10,10) and (pointX,pointY) = (100,0).
    expectedSourceBehavior:
    - The source shifted longitude test returns DISJOINT.
    - Rotation produces wrapped endpoints (50,-160) and point longitude -110.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_BOTH_ENDPOINTS_WRAP_CONTAINS
