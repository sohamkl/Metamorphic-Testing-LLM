InputDomain:
  summary: Finite canonical geographic rectangles and points, including ordinary,
    dateline-wrapping, degenerate, polar, seam, and near-world cases; each source
    is rotated east by 150 degrees with longitude normalization, and source and follow-up
    relations must agree.
  globalConstraints:
  - The receiver context ctx is non-null and ctx.isGeo() is true.
  - The point is non-null and is constructible through the same geographic SpatialContext,
    such as ctx.makePoint(pointX, pointY).
  - Receiver coordinates minX, maxX, minY, and maxY and point coordinates pointX and
    pointY are finite doubles.
  - Source longitudes satisfy -180 <= minX <= 180, -180 <= maxX <= 180, and -180 <=
    pointX <= 180.
  - Source latitudes satisfy -90 <= minY <= maxY <= 90 and -90 <= pointY <= 90.
  - The represented longitude width w is maxX - minX when maxX >= minX and maxX -
    minX + 360 otherwise, and must satisfy 0 <= w < 360.
  - Width-360 rectangles such as (-180,180) are excluded because independently normalizing
    both endpoints after a 150-degree rotation maps them to the same longitude and
    does not preserve a full-world box.
  - NaN-based empty rectangles and points are excluded because the metamorphic relation
    requests valid geographic inputs and relate(Point) has no explicit empty-point
    handling.
  - The follow-up uses N(x) = x + 150 adjusted by multiples of 360 into [-180,180),
    producing rectangle (N(minX),N(maxX),minY,maxY) and point (N(pointX),pointY) in
    a geographic context.
  - For every generated source, RectangleImpl.relate(point) and the corresponding
    follow-up invocation are both required to complete normally and return the same
    SpatialRelation.
  diversity:
    sourceRelation:
    - CONTAINS
    - DISJOINT
    latitudePosition:
    - below_minY
    - at_minY
    - interior
    - at_maxY
    - above_maxY
    - north_pole
    - south_pole
    longitudeTopology:
    - ordinary_nonwrapping
    - dateline_wrapping
    - zero_width
    - half_world
    - wider_than_half_world
    - near_full_world
    longitudePath:
    - geo_short_circuit
    - shift_plus_360
    - shift_minus_360
    - shifted_disjoint
    rotationTopology:
    - nonwrap_to_nonwrap
    - nonwrap_to_wrap
    - wrap_to_nonwrap
    - wrap_to_wrap
    seamCoverage:
    - -180_equivalent_to_180
    - rotation_maps_30_to_minus180
    - endpoint_on_rotation_seam
    rectangleDegeneracy:
    - positive_area
    - zero_height
    - zero_width
    - point_rectangle
  scenarios:
  - id: LATITUDE_ABOVE_MAX
    category: NORMAL
    description: The point is longitudinally aligned but strictly north of the rectangle.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (0,11).
    expectedSourceBehavior:
    - relate returns DISJOINT at the pointY > maxY latitude guard.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_BELOW_MIN
    category: NORMAL
    description: The point is longitudinally aligned but strictly south of the rectangle.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (0,-11).
    expectedSourceBehavior:
    - relate returns DISJOINT at the pointY < minY latitude guard.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_AT_MIN
    category: BOUNDARY
    description: The point lies on the inclusive minimum-latitude edge.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (0,-10).
    expectedSourceBehavior:
    - The latitude guard accepts equality and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_AT_MAX
    category: BOUNDARY
    description: The point lies on the inclusive maximum-latitude edge.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (0,10).
    expectedSourceBehavior:
    - The latitude guard accepts equality and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_ON_LINE
    category: EDGE
    description: A zero-height rectangle contains a point on its latitude line.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,5,5) and (pointX,pointY) = (0,5).
    expectedSourceBehavior:
    - Both inclusive latitude comparisons pass and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_OFF_LINE
    category: EDGE
    description: A point just off a zero-height rectangle is rejected by latitude.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,5,5) and (pointX,pointY) = (0,6).
    expectedSourceBehavior:
    - relate returns DISJOINT at the upper latitude guard.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTH_POLE_BOUNDARY
    category: BOUNDARY
    description: The rectangle reaches the north pole and the point is on that boundary.
    preconditions:
    - (minX,maxX,minY,maxY) = (-40,40,80,90) and (pointX,pointY) = (0,90).
    expectedSourceBehavior:
    - Latitude 90 is accepted inclusively and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTH_POLE_BOUNDARY
    category: BOUNDARY
    description: The rectangle reaches the south pole and the point is on that boundary.
    preconditions:
    - (minX,maxX,minY,maxY) = (-40,40,-90,-80) and (pointX,pointY) = (0,-90).
    expectedSourceBehavior:
    - Latitude -90 is accepted inclusively and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULL_LATITUDE_SPAN
    category: EDGE
    description: The rectangle spans all valid latitudes while retaining a bounded
      longitude interval.
    preconditions:
    - (minX,maxX,minY,maxY) = (-10,10,-90,90) and (pointX,pointY) = (0,45).
    expectedSourceBehavior:
    - The latitude guard passes and the direct longitude interval yields CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_LONGITUDE_INTERIOR
    category: NORMAL
    description: The point is strictly inside an ordinary nonwrapping rectangle.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (5,0).
    expectedSourceBehavior:
    - pointX is between minX and maxX, so the geographic short-circuit returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MIN_X_BOUNDARY
    category: BOUNDARY
    description: The point lies on the inclusive western edge.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (-20,0).
    expectedSourceBehavior:
    - Neither strict shift condition applies and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MAX_X_BOUNDARY
    category: BOUNDARY
    description: The point lies on the inclusive eastern edge.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (20,0).
    expectedSourceBehavior:
    - Neither strict shift condition applies and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_LEFT_MISS_AFTER_PLUS_SHIFT
    category: NORMAL
    description: A point just west of an ordinary rectangle is shifted by 360 but
      remains outside.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (-21,0).
    expectedSourceBehavior:
    - The pX < minX branch adds 360, and the final longitude test returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_RIGHT_MISS_AFTER_MINUS_SHIFT
    category: NORMAL
    description: A point just east of an ordinary rectangle is shifted by -360 but
      remains outside.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (21,0).
    expectedSourceBehavior:
    - The pX > maxX branch subtracts 360, and the final longitude test returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_ON_MERIDIAN
    category: EDGE
    description: A zero-width rectangle contains a point on its meridian.
    preconditions:
    - (minX,maxX,minY,maxY) = (12,12,-10,10) and (pointX,pointY) = (12,0).
    expectedSourceBehavior:
    - The direct inclusive longitude comparison returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_OFF_MERIDIAN
    category: EDGE
    description: A point away from a zero-width rectangle is disjoint.
    preconditions:
    - (minX,maxX,minY,maxY) = (12,12,-10,10) and (pointX,pointY) = (13,0).
    expectedSourceBehavior:
    - The minus-360 shift does not reach longitude 12 and relate returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_WESTERN_LOBE_DIRECT
    category: NORMAL
    description: The point is in the positive-longitude portion of a dateline-wrapping
      rectangle.
    preconditions:
    - (minX,maxX,minY,maxY) = (170,-170,-10,10) and (pointX,pointY) = (175,0).
    expectedSourceBehavior:
    - The negative raw width is unwrapped and pointX is directly within [170,190],
      yielding CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_EASTERN_LOBE_PLUS_SHIFT
    category: NORMAL
    description: The point is in the negative-longitude portion of a dateline-wrapping
