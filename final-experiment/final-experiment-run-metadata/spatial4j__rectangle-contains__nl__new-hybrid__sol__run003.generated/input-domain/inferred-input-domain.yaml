    expectedSourceBehavior:
    - The source direct longitude path returns CONTAINS.
    - Rotation produces the nonwrapping interval [-110,-60] and point longitude -85.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_BOTH_ENDPOINTS_WRAP_DISJOINT
    category: NORMAL
    description: Both endpoints wrap while an outside point remains outside.
    preconditions:
    - (minX,maxX,minY,maxY) = (100,150,-10,10) and (pointX,pointY) = (0,0).
    expectedSourceBehavior:
    - The source plus-360 path returns DISJOINT.
    - Rotation produces the nonwrapping interval [-110,-60] and point longitude 150.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_WRAP_TO_NONWRAP_CONTAINS
    category: EDGE
    description: A dateline-wrapping source becomes a broad nonwrapping follow-up.
    preconditions:
    - (minX,maxX,minY,maxY) = (100,20,-10,10) and (pointX,pointY) = (150,0).
    expectedSourceBehavior:
    - The source unwrapped direct path returns CONTAINS.
    - Rotation produces the nonwrapping interval [-110,170] and point longitude -60.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_WRAP_TO_NONWRAP_DISJOINT
    category: EDGE
    description: A point in the source wrapped rectangle's gap remains outside after
      the rectangle becomes nonwrapping.
    preconditions:
    - (minX,maxX,minY,maxY) = (100,20,-10,10) and (pointX,pointY) = (50,0).
    expectedSourceBehavior:
    - The source +360 shift overshoots the unwrapped maximum and returns DISJOINT.
    - Rotation produces interval [-110,170] and point longitude -160.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_WRAP_TO_WRAP_INTERIOR
    category: EDGE
    description: A broad wrapped rectangle remains wrapped when neither endpoint crosses
      the normalization seam.
    preconditions:
    - (minX,maxX,minY,maxY) = (-100,-120,-10,10) and (pointX,pointY) = (0,0).
    expectedSourceBehavior:
    - The source direct path in the unwrapped interval returns CONTAINS.
    - Rotation produces wrapped endpoints (50,30) and point longitude 150.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_WRAP_TO_WRAP_GAP
    category: EDGE
    description: A point in a wrapped rectangle's narrow gap remains in the rotated
      gap.
    preconditions:
    - (minX,maxX,minY,maxY) = (-100,-120,-10,10) and (pointX,pointY) = (-110,0).
    expectedSourceBehavior:
    - The source +360 shift overshoots the unwrapped maximum and returns DISJOINT.
    - Rotation produces wrapped endpoints (50,30) and point longitude 40.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_WRAPPED_BOTH_ENDPOINTS_GAP
    category: EDGE
    description: Both endpoints of a wrapped rectangle normalize across the seam,
      and a gap point remains disjoint.
    preconditions:
    - (minX,maxX,minY,maxY) = (100,50,-10,10) and (pointX,pointY) = (75,0).
    expectedSourceBehavior:
    - The source +360 shift places the point beyond the unwrapped maximum, yielding
      DISJOINT.
    - Rotation produces wrapped endpoints (-110,-160) and point longitude -135.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_WRAPPED_BOTH_ENDPOINTS_INTERIOR
    category: EDGE
    description: Both endpoints of a wrapped rectangle normalize across the seam,
      and an interior point remains contained.
    preconditions:
    - (minX,maxX,minY,maxY) = (100,50,-10,10) and (pointX,pointY) = (0,0).
    expectedSourceBehavior:
    - The source +360 shift places the point inside the unwrapped interval, yielding
      CONTAINS.
    - Rotation produces wrapped endpoints (-110,-160) and point longitude 150.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ROTATES_EXACTLY_TO_MINUS_180_INSIDE
    category: BOUNDARY
    description: A source point at longitude 30 normalizes exactly to -180 and remains
      inside.
    preconditions:
    - (minX,maxX,minY,maxY) = (20,40,-10,10) and (pointX,pointY) = (30,0).
    expectedSourceBehavior:
    - The source direct path returns CONTAINS.
    - Rotation produces wrapped endpoints (170,-170) and point longitude -180.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ROTATES_EXACTLY_TO_MINUS_180_OUTSIDE
    category: BOUNDARY
    description: A source point at longitude 30 normalizes exactly to -180 while remaining
      outside.
    preconditions:
    - (minX,maxX,minY,maxY) = (-20,20,-10,10) and (pointX,pointY) = (30,0).
    expectedSourceBehavior:
    - The source minus-360 path returns DISJOINT.
    - Rotation produces interval [130,170] and point longitude -180.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIN_ENDPOINT_ROTATES_TO_MINUS_180
    category: BOUNDARY
    description: The source minimum endpoint and point both lie at the rotation seam.
    preconditions:
    - (minX,maxX,minY,maxY) = (30,60,-10,10) and (pointX,pointY) = (30,0).
    expectedSourceBehavior:
    - The source includes its minimum endpoint and returns CONTAINS.
    - Rotation produces interval [-180,-150] with the point at -180.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_EXACT_MATCH
    category: EDGE
    description: Both rectangle dimensions are degenerate and exactly match the point.
    preconditions:
    - (minX,maxX,minY,maxY) = (7,7,3,3) and (pointX,pointY) = (7,3).
    expectedSourceBehavior:
    - Both inclusive coordinate checks pass and relate returns CONTAINS.
    - Rotation preserves the exact rectangle-point coincidence at longitude 157.
    targetCases: 1
    emptyOutputAllowed: false
