    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_MIN_X_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the stored minimum longitude of a wrapped
      rectangle.
    preconditions:
    - (minX,maxX,minY,maxY) = (170,-170,-10,10) and (pointX,pointY) = (170,0).
    expectedSourceBehavior:
    - The unwrapped interval includes its minimum and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPED_MAX_X_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the stored maximum longitude of a wrapped
      rectangle.
    preconditions:
    - (minX,maxX,minY,maxY) = (170,-170,-10,10) and (pointX,pointY) = (-170,0).
    expectedSourceBehavior:
    - Adding 360 maps pointX to the unwrapped maximum 190, yielding CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BROAD_WRAPPED_INTERIOR_DIRECT
    category: EDGE
    description: A wrapped rectangle wider than half the world contains a central
