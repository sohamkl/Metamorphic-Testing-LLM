    targetCases: 1
    emptyOutputAllowed: false
  - id: BROAD_WRAPPED_NARROW_GAP
    category: EDGE
    description: A point lies in the narrow excluded gap of a 350-degree wrapped rectangle.
    preconditions:
    - (minX,maxX,minY,maxY) = (-10,-20,-10,10) and (pointX,pointY) = (-15,0).
    expectedSourceBehavior:
    - Adding 360 produces 345, beyond the unwrapped maximum 340, so relate returns
      DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_WORLD_MAX_BOUNDARY
    category: BOUNDARY
    description: A 180-degree rectangle includes its maximum-longitude boundary.
    preconditions:
    - (minX,maxX,minY,maxY) = (-90,90,-10,10) and (pointX,pointY) = (90,0).
    expectedSourceBehavior:
    - The direct inclusive longitude path returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDER_THAN_HALF_WORLD_MISS
    category: EDGE
    description: A point is outside a nonwrapping rectangle whose width exceeds 180
