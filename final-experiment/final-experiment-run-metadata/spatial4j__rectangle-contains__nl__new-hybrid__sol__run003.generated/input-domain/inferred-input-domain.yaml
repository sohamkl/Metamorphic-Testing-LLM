    description: Neither endpoint wraps during rotation, and the point is outside.
    preconditions:
    - (minX,maxX,minY,maxY) = (-100,0,-10,10) and (pointX,pointY) = (20,0).
    expectedSourceBehavior:
    - The source minus-360 path returns DISJOINT.
    - Rotation produces the nonwrapping interval [50,150] and point longitude 170.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_NONWRAP_TO_WRAP_CONTAINS
