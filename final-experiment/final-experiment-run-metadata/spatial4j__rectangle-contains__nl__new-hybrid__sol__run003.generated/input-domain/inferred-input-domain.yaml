    preconditions:
    - (minX,maxX,minY,maxY) = (-120,120,-10,10) and (pointX,pointY) = (150,0).
    expectedSourceBehavior:
    - Subtracting 360 produces -210, still outside the interval, so relate returns
      DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_WORLD_WRAPPED_INTERIOR
    category: EDGE
    description: A 359-degree wrapped rectangle contains a point far from its one-degree
      gap.
    preconditions:
    - (minX,maxX,minY,maxY) = (1,0,-10,10) and (pointX,pointY) = (-100,0).
    expectedSourceBehavior:
    - The unwrapped interval is [1,360]; adding 360 to pointX produces 260 and returns
      CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_WORLD_WRAPPED_GAP
    category: EDGE
    description: A point lies in the narrow gap of a 359-degree wrapped rectangle.
    preconditions:
    - (minX,maxX,minY,maxY) = (1,0,-10,10) and (pointX,pointY) = (0.5,0).
    expectedSourceBehavior:
    - Adding 360 produces 360.5, beyond the unwrapped maximum, so relate returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_180_EQUIVALENT_INSIDE
    category: BOUNDARY
    description: Longitude +180 is treated as equivalent to -180 on a rectangle beginning
      at -180.
    preconditions:
    - (minX,maxX,minY,maxY) = (-180,-160,-10,10) and (pointX,pointY) = (180,0).
    expectedSourceBehavior:
    - The pX > maxX branch subtracts 360 to obtain -180 and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_180_EQUIVALENT_INSIDE
    category: BOUNDARY
    description: Longitude -180 is treated as equivalent to +180 on a rectangle ending
      at +180.
    preconditions:
    - (minX,maxX,minY,maxY) = (160,180,-10,10) and (pointX,pointY) = (-180,0).
    expectedSourceBehavior:
    - The pX < minX branch adds 360 to obtain 180 and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_MINUS_180_WITH_PLUS_180_POINT
    category: EDGE
    description: A zero-width meridian at -180 contains the equivalent +180 point.
    preconditions:
    - (minX,maxX,minY,maxY) = (-180,-180,-10,10) and (pointX,pointY) = (180,0).
    expectedSourceBehavior:
    - Subtracting 360 maps the point exactly to the zero-width interval and returns
      CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_PLUS_180_WITH_MINUS_180_POINT
    category: EDGE
    description: A zero-width meridian at +180 contains the equivalent -180 point.
    preconditions:
    - (minX,maxX,minY,maxY) = (180,180,-10,10) and (pointX,pointY) = (-180,0).
    expectedSourceBehavior:
    - Adding 360 maps the point exactly to the zero-width interval and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_EQUIVALENT_JUST_OUTSIDE_WEST
    category: BOUNDARY
    description: The dateline-equivalent point remains outside a rectangle starting
      one degree east of -180.
    preconditions:
    - (minX,maxX,minY,maxY) = (-179,-170,-10,10) and (pointX,pointY) = (180,0).
    expectedSourceBehavior:
    - Subtracting 360 produces -180, which is below minX, so relate returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_EQUIVALENT_JUST_OUTSIDE_EAST
    category: BOUNDARY
    description: The dateline-equivalent point remains outside a rectangle ending
      one degree west of +180.
    preconditions:
    - (minX,maxX,minY,maxY) = (170,179,-10,10) and (pointX,pointY) = (-180,0).
    expectedSourceBehavior:
    - Adding 360 produces 180, which exceeds maxX, so relate returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_NONWRAP_TO_NONWRAP_CONTAINS
    category: NORMAL
    description: Neither rectangle endpoint wraps during rotation, and an interior
      point is contained.
    preconditions:
    - (minX,maxX,minY,maxY) = (-100,0,-10,10) and (pointX,pointY) = (-50,0).
    expectedSourceBehavior:
    - The source direct longitude path returns CONTAINS.
    - Rotation produces the nonwrapping interval [50,150] and point longitude 100.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_NONWRAP_TO_NONWRAP_DISJOINT
