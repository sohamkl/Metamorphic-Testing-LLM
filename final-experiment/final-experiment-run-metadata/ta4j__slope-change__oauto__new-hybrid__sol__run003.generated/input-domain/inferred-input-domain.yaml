InputDomain:
  summary: Nonempty begin-index-zero BarSeries inputs, valid detector configurations,
    arbitrary clamped detection indices, and nonnull Elliott degrees, diversified
    across candidate availability, slope classification, persistence, extreme selection,
    ATR filtering, pivot replacement, and swing construction.
  globalConstraints:
  - The receiver is a nonnull SlopeChangeSwingDetector constructed either with SlopeChangeSwingDetector(int)
    or SlopeChangeSwingDetector(SlopeChangeConfig), and construction must complete
    normally.
  - The supplied BarSeries is nonnull and nonempty, and series.getBeginIndex() ==
    0 as explicitly required by generateFollowUp.
  - Empty series are excluded because the detector supports them but generateFollowUp
    rejects their nonzero begin-index sentinel before constructing the follow-up.
  - The ElliottDegree argument is a nonnull enum value, as required by both detect
    and generateFollowUp.
  - The index may be any int; detect clamps it to [series.getBeginIndex(), series.getEndIndex()]
    and therefore does not require the caller to pre-clamp it.
  - Every source bar must be readable for each index from 0 through series.getEndIndex(),
    and its time period, begin time, end time, prices, volume, amount, and trades
    must be accepted by the BaseBar constructor used in generateFollowUp.
  - For every bar, sourceBar.getAmount().plus(100 multipliedBy sourceBar.getVolume())
    and each OHLC price plus 100 must be representable by the series Num implementation
    without throwing; nonfinite Num values remain eligible only when these operations
    and follow-up BaseBar construction are supported.
  - Use only configurations admitted by the supplied detector/configuration APIs;
    no additional assumptions are made about undocumented configuration validity.
  - Let W = detector.getConfig().window(), C = detector.getConfig().confirmationBars(),
    M = detector.getConfig().minSlopeChange(), A = detector.getConfig().minAtrReversal(),
    and P = detector.getConfig().atrPeriod(); scenario formulas refer to these observable
    values.
  - A candidate c is evaluable exactly when W - 1 <= c <= endIndex - W - C + 1, where
    endIndex = max(0, min(index, series.getEndIndex())).
  - Slope conditions are measured using the least-squares calculation in the source
    over the stated inclusive close-price interval; threshold comparisons use the
    series Num comparison operations.
  - When a scenario isolates one branch, all other evaluable candidates must measurably
    fail an earlier stated detector condition so that they cannot add or replace an
    unintended pivot.
  diversity:
    receiverConstruction:
    - integer-window constructor using defaults
    - explicit SlopeChangeConfig constructor
    effectiveIndex:
    - below zero and clamped to zero
    - inside series
    - exact series end
    - above series end and clamped
    candidateCount:
    - zero
    - exactly one
    - multiple
    slopeState:
    - finite positive-to-negative
    - finite negative-to-positive
    - same sign
    - zero slope
    - below magnitude threshold
    - exactly at magnitude threshold
    - nonfinite
    persistenceState:
    - passes every confirmation slope
    - fails first confirmation
    - fails later confirmation
    - contains nonfinite confirmation slope
    extremeLocation:
    - transition start
    - transition interior
    - transition end
    - equal-extreme tie
    - nonfinite transition value
    magnitudeFilter:
    - first-pivot bypass
    - zero-multiplier bypass
    - nonfinite ATR rejection
    - below ATR threshold
    - equal ATR threshold
    - above ATR threshold
    pivotSequence:
    - no pivots
    - one HIGH
    - one LOW
    - alternating types
    - same-type replacement
    - same-type retention
    - three or more pivots
    barPayload:
    - zero volume
    - nonzero volume with amount translation
    - finite OHLC
    - constructible nonfinite close
    - constructible nonfinite high or low
    degreeSelection:
    - one nonnull ElliottDegree constant
    - a different nonnull ElliottDegree constant when the enum supplies one
  scenarios:
  - id: INDEX_BELOW_BEGIN_CLAMP
    category: BOUNDARY
    description: A negative requested index is clamped to begin index zero.
    preconditions:
    - index < 0.
    - The valid configuration has W and C such that no candidate is evaluable at effective
      endIndex 0.
    expectedSourceBehavior:
    - Detection completes normally and returns no pivots and no swings.
    targetCases: 1
    emptyOutputAllowed: true
  - id: INSUFFICIENT_BARS_BEFORE_FIRST_CANDIDATE
    category: BOUNDARY
    description: The effective prefix is one bar short of supporting any candidate.
    preconditions:
    - The effective endIndex equals 2*W + C - 3.
    - The series contains every bar through that effective endIndex.
    expectedSourceBehavior:
    - firstCandidate is greater than lastCandidate, so the result has no pivots and
      no swings.
    targetCases: 1
    emptyOutputAllowed: true
  - id: EXACTLY_ONE_EVALUABLE_CANDIDATE
    category: BOUNDARY
    description: The effective prefix has the minimum length for exactly one candidate.
    preconditions:
    - The effective endIndex equals 2*W + C - 2.
    - Candidate W - 1 has finite opposite-sign slopes, meets the slope-change threshold,
      passes persistence, and has finite required extreme values.
    expectedSourceBehavior:
    - Exactly one candidate reaches extreme-pivot and magnitude-filter processing.
    - The accepted result contains one pivot and no swings.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INDEX_INSIDE_SERIES_TRUNCATES_SCAN
    category: NORMAL
    description: Detection uses only candidates confirmed by an index strictly before
      the series end.
    preconditions:
    - 0 <= index < series.getEndIndex().
    - At least one candidate is evaluable by index.
    - Bars after index contain a reversal that would require a candidate or confirmation
      endpoint greater than index.
    expectedSourceBehavior:
    - The later reversal does not produce a pivot because lastCandidate is derived
      from the clamped index.
    targetCases: 1
    emptyOutputAllowed: true
  - id: INDEX_AT_SERIES_END
    category: BOUNDARY
    description: Detection evaluates the complete series when index equals its end.
    preconditions:
    - index == series.getEndIndex().
    - At least one candidate is evaluable.
    - At least one candidate satisfies all acceptance conditions.
    expectedSourceBehavior:
    - The qualifying candidate contributes a pivot to the result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INDEX_ABOVE_END_CLAMP
    category: EDGE
    description: An index above the series end is clamped to the series end.
    preconditions:
    - index > series.getEndIndex().
    - At least one candidate is evaluable and accepted.
    expectedSourceBehavior:
    - Detection completes normally using series.getEndIndex() as the effective end
      and returns at least one pivot.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FLAT_CLOSES_ZERO_SLOPES
    category: NORMAL
    description: All evaluated close windows are flat.
    preconditions:
    - Every close used by an evaluable candidate is the same finite Num.
    - At least one candidate is evaluable.
    expectedSourceBehavior:
    - Before and after slopes are zero, so neither HIGH nor LOW direction condition
      is met.
    - The result has no pivots and no swings.
    targetCases: 1
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_BELOW_MINIMUM
    category: BOUNDARY
    description: Opposite-sign finite slopes form a reversal weaker than minSlopeChange.
    preconditions:
    - For an isolated candidate c, before is positive and after is negative, or before
      is negative and after is positive.
    - abs(before - after) is strictly less than M.
    expectedSourceBehavior:
    - The candidate is skipped before direction classification and contributes no
      pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_EXACTLY_MINIMUM
    category: BOUNDARY
    description: An opposite-sign slope change lies exactly on the minimum threshold.
    preconditions:
    - For an isolated candidate c, before and after are finite and have the signs
      required for a HIGH or LOW.
    - abs(before - after) equals M under the series Num comparison.
    - Persistence and finite-extreme conditions pass.
    expectedSourceBehavior:
    - The candidate is not rejected by the strict isLessThan threshold check.
    - It produces a pivot when no later filter rejects it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SLOPE_CHANGE_ABOVE_MINIMUM
    category: NORMAL
    description: A strong opposite-sign slope change exceeds minSlopeChange.
    preconditions:
    - For an isolated candidate c, before and after are finite and oppositely signed.
    - abs(before - after) is strictly greater than M.
    - Persistence and finite-extreme conditions pass.
    expectedSourceBehavior:
    - The candidate reaches pivot construction and is accepted as the first pivot.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_TO_NEGATIVE_HIGH
    category: NORMAL
    description: A sustained positive-to-negative close-slope transition identifies
      a HIGH.
    preconditions:
    - For an isolated candidate c, before is positive, after is negative, and abs(before
      - after) is at least M.
    - Every required confirmation slope is finite and negative.
    - All high values from c through c + W - 1 are finite.
    expectedSourceBehavior:
    - The accepted pivot type is HIGH.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_TO_POSITIVE_LOW
    category: NORMAL
    description: A sustained negative-to-positive close-slope transition identifies
      a LOW.
    preconditions:
    - For an isolated candidate c, before is negative, after is positive, and abs(before
      - after) is at least M.
    - Every required confirmation slope is finite and positive.
    - All low values from c through c + W - 1 are finite.
    expectedSourceBehavior:
    - The accepted pivot type is LOW.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SLOPES_POSITIVE
    category: NORMAL
    description: A large change between two positive slopes is not a reversal.
    preconditions:
    - For an isolated candidate c, before and after are finite and positive.
    - abs(before - after) is at least M.
    expectedSourceBehavior:
    - Neither direction branch matches, so the candidate contributes no pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: BOTH_SLOPES_NEGATIVE
    category: NORMAL
    description: A large change between two negative slopes is not a reversal.
    preconditions:
    - For an isolated candidate c, before and after are finite and negative.
    - abs(before - after) is at least M.
    expectedSourceBehavior:
    - Neither direction branch matches, so the candidate contributes no pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: ZERO_BEFORE_SLOPE
    category: EDGE
    description: The before window is flat while the after slope is nonzero.
    preconditions:
    - For an isolated candidate c, before is exactly zero and after is finite and
      nonzero.
    - abs(before - after) is at least M.
    expectedSourceBehavior:
    - The candidate is neither HIGH nor LOW because before is not positive or negative.
    targetCases: 1
    emptyOutputAllowed: true
  - id: ZERO_AFTER_SLOPE
    category: EDGE
    description: The after window is flat while the before slope is nonzero.
    preconditions:
    - For an isolated candidate c, after is exactly zero and before is finite and
      nonzero.
    - abs(before - after) is at least M.
    expectedSourceBehavior:
    - The candidate is neither HIGH nor LOW because after has no required opposite
      sign.
    targetCases: 1
    emptyOutputAllowed: true
  - id: NONFINITE_BEFORE_WINDOW
    category: EDGE
    description: A constructible nonfinite close occurs in the candidate's before
      window.
    preconditions:
    - The BarSeries and follow-up BaseBar construction support the chosen nonfinite
      Num value.
    - For an isolated candidate c, at least one close from c - W + 1 through c is
      nonfinite.
    expectedSourceBehavior:
    - The before slope is NaN and the candidate is skipped without producing a pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: NONFINITE_AFTER_WINDOW
    category: EDGE
    description: A constructible nonfinite close occurs in the candidate's after window.
    preconditions:
    - The BarSeries and follow-up BaseBar construction support the chosen nonfinite
      Num value.
    - For an isolated candidate c, all before-window closes are finite and at least
      one close from c + 1 through c + W is nonfinite.
    expectedSourceBehavior:
    - The after slope is NaN and the candidate is skipped without producing a pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERSISTENCE_FAILS_FIRST_CONFIRMATION
    category: NORMAL
    description: The initial reversal exists, but the first required post-window slope
      has the wrong direction.
    preconditions:
    - An isolated candidate passes finite slope, threshold, and HIGH or LOW classification.
    - At offset 0, the confirmation slope is finite but is not negative for HIGH or
      not positive for LOW.
    expectedSourceBehavior:
    - persists returns false immediately and no pivot is constructed for the candidate.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERSISTENCE_FAILS_LATER_CONFIRMATION
    category: NORMAL
    description: The new direction persists initially but fails at a later confirmation
      offset.
    preconditions:
    - C is large enough for at least two confirmation offsets.
    - An isolated candidate passes classification.
    - The confirmation slope at offset 0 has the required sign, while a later offset
      has the wrong sign or zero.
    expectedSourceBehavior:
    - The candidate is rejected by persists after at least one successful confirmation
      check.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERSISTENCE_NONFINITE_SLOPE
    category: EDGE
    description: A confirmation window contains a constructible nonfinite close.
    preconditions:
    - The candidate's before and after slopes are finite and classify a HIGH or LOW.
    - At least one required confirmation slope is nonfinite because its close window
      contains a nonfinite value.
    expectedSourceBehavior:
    - persists returns false and the candidate contributes no pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: ALL_CONFIRMATION_SLOPES_PASS
    category: NORMAL
    description: Every required post-window slope has the direction demanded by the
      classified pivot.
    preconditions:
    - The candidate passes slope finiteness, threshold, and direction classification.
    - For every offset from 0 through C - 1, the confirmation slope is finite and
      negative for HIGH or positive for LOW.
    - The required high or low transition values are finite.
    expectedSourceBehavior:
    - Persistence does not reject the candidate, and an otherwise unfiltered first
      candidate is accepted.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_EXTREME_AT_TRANSITION_START
    category: BOUNDARY
    description: The largest transition high is at the candidate index.
    preconditions:
    - A HIGH candidate passes slope and persistence checks.
    - high[c] is finite and strictly greater than every high from c + 1 through c
      + W - 1.
    expectedSourceBehavior:
    - The resulting HIGH pivot index is c and its price equals high[c].
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_EXTREME_AT_TRANSITION_INTERIOR
    category: NORMAL
    description: The largest transition high lies strictly inside the transition interval.
    preconditions:
    - A HIGH candidate passes slope and persistence checks.
    - For some e with c < e < c + W - 1, high[e] is finite and strictly greater than
      every other transition high.
    expectedSourceBehavior:
    - The resulting HIGH pivot index is e and its price equals high[e].
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_EXTREME_AT_TRANSITION_END
    category: BOUNDARY
    description: The largest transition high is at the last index inspected by extremePivot.
    preconditions:
    - A HIGH candidate passes slope and persistence checks.
    - high[c + W - 1] is finite and strictly greater than every earlier transition
      high.
    expectedSourceBehavior:
    - The resulting HIGH pivot index is c + W - 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_EXTREME_TIE_KEEPS_FIRST
    category: EDGE
    description: The maximum transition high occurs at multiple indices.
    preconditions:
    - A HIGH candidate passes slope and persistence checks.
    - Two or more transition highs share the finite maximum, and e is the earliest
      index having that maximum.
    expectedSourceBehavior:
    - The HIGH pivot index is e because extremePivot updates only on a strictly greater
      value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOW_EXTREME_INTERIOR
    category: NORMAL
    description: The smallest transition low lies strictly inside the transition interval.
    preconditions:
    - A LOW candidate passes slope and persistence checks.
    - For some e with c < e < c + W - 1, low[e] is finite and strictly less than every
      other transition low.
    expectedSourceBehavior:
    - The resulting LOW pivot index is e and its price equals low[e].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOW_EXTREME_TIE_KEEPS_FIRST
    category: EDGE
    description: The minimum transition low occurs at multiple indices.
    preconditions:
    - A LOW candidate passes slope and persistence checks.
    - Two or more transition lows share the finite minimum, and e is the earliest
      index having that minimum.
    expectedSourceBehavior:
    - The LOW pivot index is e because extremePivot updates only on a strictly lower
      value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONFINITE_INITIAL_EXTREME
    category: EDGE
    description: The first required high or low in the transition interval is nonfinite.
    preconditions:
    - A candidate passes slope classification and persistence.
    - The selected high indicator for HIGH, or low indicator for LOW, is nonfinite
      at c.
    expectedSourceBehavior:
    - extremePivot returns null immediately and the candidate contributes no pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: NONFINITE_LATER_EXTREME
    category: EDGE
    description: A later required high or low in the transition interval is nonfinite.
    preconditions:
    - A candidate passes slope classification and persistence.
    - The selected extreme value at c is finite, but at least one selected value from
      c + 1 through c + W - 1 is nonfinite.
    expectedSourceBehavior:
    - extremePivot returns null and the candidate contributes no pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: FIRST_PIVOT_BYPASSES_MAGNITUDE_FILTER
    category: NORMAL
    description: The first valid pivot is accepted without an ATR-distance comparison.
    preconditions:
    - No earlier candidate has been accepted.
    - A candidate produces a finite SwingPivot after slope, persistence, and extreme
      checks.
    expectedSourceBehavior:
    - passesMagnitudeFilter returns true because the pivot list is empty.
    - The result contains the candidate pivot.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIRST_PIVOT_WITH_NONFINITE_ATR
    category: EDGE
    description: The first pivot is accepted even when ATR at its index is nonfinite.
    preconditions:
    - No earlier pivot has been accepted.
    - A candidate produces a finite SwingPivot.
    - atr.getValue(candidatePivot.index()) is nonfinite.
    expectedSourceBehavior:
    - The empty-list branch accepts the first pivot before testing ATR finiteness.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_ATR_MULTIPLIER_BYPASS
    category: BOUNDARY
    description: A valid configuration with zero minAtrReversal disables magnitude
      rejection.
    preconditions:
    - A == 0 for a configuration admitted by the supplied configuration API.
    - A previous pivot exists and a later candidate produces a finite pivot.
    expectedSourceBehavior:
    - passesMagnitudeFilter returns true through multiplier.isZero without requiring
      a finite ATR.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONFINITE_ATR_REJECTS_LATER_PIVOT
    category: EDGE
    description: A later candidate is rejected when ATR is nonfinite and the multiplier
      is nonzero.
    preconditions:
    - A is nonzero.
    - A previous pivot has been accepted.
    - A later candidate produces a finite pivot.
    - ATR at the later pivot index is nonfinite.
    expectedSourceBehavior:
    - passesMagnitudeFilter returns false and the later pivot is not added or used
      as a replacement.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REVERSAL_BELOW_ATR_THRESHOLD
    category: BOUNDARY
    description: A later finite reversal is smaller than ATR multiplied by minAtrReversal.
    preconditions:
    - A previous pivot exists and A is nonzero.
    - The later candidate and ATR are finite.
    - abs(candidate.price - previous.price) is strictly less than ATR(candidate.index)
      multiplied by A.
    expectedSourceBehavior:
    - The later candidate fails the magnitude filter and does not alter the pivot
      list.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REVERSAL_EXACTLY_ATR_THRESHOLD
    category: BOUNDARY
    description: A later reversal equals the ATR magnitude threshold.
    preconditions:
    - A previous pivot exists and A is nonzero.
    - The later candidate and ATR are finite.
    - abs(candidate.price - previous.price) equals ATR(candidate.index) multiplied
      by A under Num comparison.
    expectedSourceBehavior:
    - The inclusive isGreaterThanOrEqual check accepts the candidate.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REVERSAL_ABOVE_ATR_THRESHOLD
    category: NORMAL
    description: A later reversal exceeds the ATR magnitude threshold.
    preconditions:
    - A previous pivot exists.
    - The later candidate and ATR are finite.
    - abs(candidate.price - previous.price) is strictly greater than ATR(candidate.index)
      multiplied by A.
    expectedSourceBehavior:
    - The candidate passes the magnitude filter and reaches type-based append or replacement
      logic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ALTERNATING_TYPE_APPENDS
    category: NORMAL
    description: A qualifying pivot of the opposite type follows the current last
      pivot.
    preconditions:
    - A previous accepted pivot exists.
    - A later candidate passes the magnitude filter.
    - The candidate type differs from the previous pivot type.
    expectedSourceBehavior:
    - The candidate is appended, preserving candidate order.
    - The result contains at least two pivots and at least one ElliottSwing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_HIGH_STRICTLY_HIGHER_REPLACES
    category: NORMAL
    description: A later qualifying HIGH is more extreme than the current HIGH.
    preconditions:
    - The last accepted pivot and later candidate are both HIGH.
    - The candidate passes the magnitude filter.
    - candidate.price is strictly greater than previous.price.
    expectedSourceBehavior:
    - The last pivot is replaced by the candidate rather than appended.
    - The pivot count is unchanged and the retained HIGH has the candidate index and
      price.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_HIGH_EQUAL_OR_LOWER_RETAINED
    category: BOUNDARY
    description: A later qualifying HIGH is not strictly higher than the current HIGH.
    preconditions:
    - The last accepted pivot and later candidate are both HIGH.
    - The candidate passes the magnitude filter.
    - candidate.price is less than or equal to previous.price.
    expectedSourceBehavior:
    - The existing HIGH remains unchanged and the candidate is not appended.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_LOW_STRICTLY_LOWER_REPLACES
    category: NORMAL
    description: A later qualifying LOW is more extreme than the current LOW.
    preconditions:
    - The last accepted pivot and later candidate are both LOW.
    - The candidate passes the magnitude filter.
    - candidate.price is strictly less than previous.price.
    expectedSourceBehavior:
    - The last pivot is replaced by the candidate rather than appended.
    - The pivot count is unchanged and the retained LOW has the candidate index and
      price.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_LOW_EQUAL_OR_HIGHER_RETAINED
    category: BOUNDARY
    description: A later qualifying LOW is not strictly lower than the current LOW.
    preconditions:
    - The last accepted pivot and later candidate are both LOW.
    - The candidate passes the magnitude filter.
    - candidate.price is greater than or equal to previous.price.
    expectedSourceBehavior:
    - The existing LOW remains unchanged and the candidate is not appended.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWO_PIVOTS_CREATE_ONE_SWING
    category: NORMAL
    description: Two accepted opposite-type pivots exercise SwingDetectorResult.fromPivots.
    preconditions:
    - Exactly two candidates survive all filters.
    - Their types alternate, so both remain in the ordered pivot list.
    expectedSourceBehavior:
    - The result contains exactly two pivots and exactly one ElliottSwing.
    - The swing endpoints equal the indices and prices of the two pivots, and its
      degree equals the supplied degree.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MULTIPLE_PIVOTS_CREATE_ORDERED_SWINGS
    category: NORMAL
    description: At least three accepted alternating pivots produce a chain of Elliott
      swings.
    preconditions:
    - At least three candidates survive all filters and remain as alternating pivots.
    - Their pivot indices are strictly ordered by detection chronology.
    expectedSourceBehavior:
    - The result has one fewer swing than pivots.
    - Each swing joins consecutive pivots in result order and carries the supplied
      degree.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGREE_PROPAGATES_WITHOUT_AFFECTING_PIVOTS
    category: NORMAL
    description: A nonnull ElliottDegree is propagated to every constructed swing.
    preconditions:
    - The source input produces at least two pivots.
    - Use a nonnull ElliottDegree enum constant, varying the constant across generated
      cases when possible.
    expectedSourceBehavior:
    - Every source swing has degree equal to the supplied degree.
    - Pivot detection itself exposes no degree-dependent branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_VOLUME_BAR_PAYLOAD
    category: EDGE
    description: Bars with zero volume exercise the follow-up amount formula's zero
      product.
    preconditions:
    - At least one bar has volume equal to the series Num zero.
    - The series still contains a candidate satisfying all pivot acceptance conditions.
    expectedSourceBehavior:
    - Source detection completes normally because detector calculations use close,
      high, low, and ATR rather than volume or amount.
    - At least one pivot is returned to make translated-price assertions nonvacuous.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONZERO_VOLUME_AND_AMOUNT_PAYLOAD
    category: NORMAL
    description: Nonzero volume causes generateFollowUp to adjust amount by 100 times
      volume.
    preconditions:
    - At least one bar has finite nonzero volume and a finite amount for which amount
      plus 100 times volume is representable.
    - The series produces at least one accepted pivot.
    expectedSourceBehavior:
    - Source pivot detection is determined by price indicators and is unaffected by
      the stored amount and volume payloads.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEFAULT_CONFIG_CONSTRUCTOR
    category: NORMAL
    description: The receiver uses SlopeChangeSwingDetector(int) and therefore SlopeChangeConfig.defaults(window).
    preconditions:
    - The detector is constructed with the public integer-window constructor.
    - The series is long enough for at least one candidate under detector.getConfig().
    - At least one candidate satisfies the resulting default thresholds.
    expectedSourceBehavior:
    - Detection returns at least one pivot using the exposed default configuration.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXPLICIT_CONFIG_CONSTRUCTOR
    category: NORMAL
    description: The receiver uses the public SlopeChangeConfig constructor path.
    preconditions:
    - The detector is constructed with a nonnull configuration admitted by the supplied
      API.
    - The series is long enough under that configuration.
    - At least one candidate satisfies that configuration's slope, persistence, and
      magnitude requirements.
