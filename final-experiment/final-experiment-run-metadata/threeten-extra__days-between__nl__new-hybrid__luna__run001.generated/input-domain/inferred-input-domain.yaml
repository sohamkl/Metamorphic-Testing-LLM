InputDomain:
  summary: Domain of non-null Temporal pairs whose whole-day distance is representable
    as an int and whose two operands can both be shifted forward by 37 days while
    remaining valid.
  globalConstraints:
  - Each source operand is a non-null java.time.temporal.Temporal.
  - DAYS.between(startDateInclusive, endDateExclusive) must be supported for the operand
    pair.
  - Both operands must support adding 37 days, and the shifted operands must remain
    valid Temporal values.
  - The whole-day result of DAYS.between must be between -2147483648 and 2147483647
    inclusive so Math.toIntExact can return normally.
  - The follow-up uses the same operand types and values obtained by adding exactly
    37 DAYS to both source operands.
  - The oracle compares getAmount() from the source result with getAmount() from the
    follow-up result.
  diversity:
    temporalType:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    signedGap:
    - negative
    - zero
    - positive
    resultMagnitude:
    - zero
    - one
    - small
    - multi-month
    - multi-year
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    temporalShape:
    - date-only
    - same-day sub-day interval
    - multi-day sub-day interval
    - fixed-offset date-time
    - daylight-saving spring transition
    - daylight-saving autumn transition
    - non-ISO chronology
    calendarBoundary:
    - ordinary date
    - month boundary
    - year boundary
    - leap day
    - minimum-range interior
    - maximum-range interior
  scenarios:
  - id: ZERO_DAY_LOCAL_DATE
    category: NORMAL
    description: Identical LocalDate operands produce the zero-day sentinel path.
    preconditions:
    - startDateInclusive = 2024-06-15.
    - endDateExclusive = 2024-06-15.
    expectedSourceBehavior:
    - The source result has getAmount() = 0.
    - The follow-up operands are both 37 days after the source operands and still
      identical.
    - The follow-up result has the same getAmount(), namely 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_LOCAL_DATE
    category: NORMAL
    description: Adjacent LocalDate operands produce the one-day sentinel path.
    preconditions:
    - startDateInclusive = 2024-06-15.
    - endDateExclusive = 2024-06-16.
    expectedSourceBehavior:
    - The source result has getAmount() = 1.
    - The follow-up result has getAmount() = 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_DAY_LOCAL_DATE
    category: NORMAL
    description: Reversed adjacent LocalDate operands exercise a negative one-day
      result.
    preconditions:
    - startDateInclusive = 2024-06-16.
    - endDateExclusive = 2024-06-15.
    expectedSourceBehavior:
    - The source result has getAmount() = -1.
    - The follow-up result has getAmount() = -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SMALL_POSITIVE_LOCAL_DATE
    category: NORMAL
    description: A non-sentinel positive LocalDate gap exercises the ordinary Days
      allocation path.
    preconditions:
    - startDateInclusive = 2024-01-10.
    - endDateExclusive = 2024-01-17.
    expectedSourceBehavior:
    - The source result has getAmount() = 7.
    - The follow-up result has getAmount() = 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SMALL_NEGATIVE_LOCAL_DATE
    category: NORMAL
    description: A non-sentinel negative LocalDate gap exercises ordinary reverse
      ordering.
    preconditions:
    - startDateInclusive = 2024-01-17.
    - endDateExclusive = 2024-01-10.
    expectedSourceBehavior:
    - The source result has getAmount() = -7.
    - The follow-up result has getAmount() = -7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_BOUNDARY_LOCAL_DATE
    category: BOUNDARY
    description: A LocalDate gap crosses from the end of one month into the next.
    preconditions:
    - startDateInclusive = 2024-01-31.
    - endDateExclusive = 2024-02-01.
    expectedSourceBehavior:
    - The source result has getAmount() = 1.
    - The follow-up result has getAmount() = 1 despite both dates moving into later
      months.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_LOCAL_DATE
    category: BOUNDARY
    description: A LocalDate gap crosses an ISO calendar-year boundary.
    preconditions:
    - startDateInclusive = 2023-12-31.
    - endDateExclusive = 2024-01-02.
    expectedSourceBehavior:
    - The source result has getAmount() = 2.
    - The follow-up result has getAmount() = 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_LOCAL_DATE
    category: BOUNDARY
    description: A LocalDate gap includes February 29 in a leap year.
    preconditions:
    - startDateInclusive = 2024-02-28.
    - endDateExclusive = 2024-03-01.
    expectedSourceBehavior:
    - The source result has getAmount() = 2.
    - The follow-up result has getAmount() = 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_LEAP_FEBRUARY_LOCAL_DATE
    category: BOUNDARY
    description: A LocalDate gap crosses February in a non-leap year.
    preconditions:
    - startDateInclusive = 2023-02-28.
    - endDateExclusive = 2023-03-01.
    expectedSourceBehavior:
    - The source result has getAmount() = 1.
    - The follow-up result has getAmount() = 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATETIME_SAME_DAY_SUBDAY
    category: EDGE
    description: LocalDateTime operands are separated by less than 24 hours on the
      same calendar date.
    preconditions:
    - startDateInclusive = 2024-06-15T08:00:00.
    - endDateExclusive = 2024-06-15T23:59:59.
    expectedSourceBehavior:
    - DAYS.between yields zero whole days, so the source result has getAmount() =
      0.
    - The 37-day follow-up preserves the sub-day interval and has getAmount() = 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATETIME_TWENTY_FIVE_HOURS
    category: EDGE
    description: LocalDateTime operands span 25 hours, testing whole-day truncation
      with time components.
    preconditions:
    - startDateInclusive = 2024-06-15T23:00:00.
    - endDateExclusive = 2024-06-17T00:00:00.
    expectedSourceBehavior:
    - The source result has getAmount() = 1 whole day.
    - The follow-up result has getAmount() = 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATETIME_REVERSE_SUBDAY
    category: EDGE
    description: Reversed LocalDateTime operands have a negative interval shorter
      than one whole day.
    preconditions:
    - startDateInclusive = 2024-06-16T08:00:00.
    - endDateExclusive = 2024-06-15T23:59:59.
    expectedSourceBehavior:
    - The source result has getAmount() = 0 because the elapsed interval is less than
      one whole day.
    - The follow-up result has getAmount() = 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_MULTIPLE_DAYS
    category: NORMAL
    description: Instant operands have an exact whole-day duration.
    preconditions:
    - startDateInclusive = 2024-01-01T00:00:00Z.
    - endDateExclusive = 2024-01-04T00:00:00Z.
    expectedSourceBehavior:
    - The source result has getAmount() = 3.
    - The follow-up result has getAmount() = 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_TRUNCATION
    category: EDGE
    description: Instant operands span 36 hours, exercising whole-day conversion of
      a non-integral day count.
    preconditions:
    - startDateInclusive = 2024-01-01T00:00:00Z.
    - endDateExclusive = 2024-01-02T12:00:00Z.
    expectedSourceBehavior:
    - The source result has getAmount() = 1.
    - The follow-up result has getAmount() = 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATETIME_FIXED_OFFSET
    category: NORMAL
    description: OffsetDateTime operands with the same fixed offset exercise a date-time
      Temporal with an offset.
    preconditions:
    - startDateInclusive = 2024-03-01T10:15:00+02:00.
    - endDateExclusive = 2024-03-06T10:15:00+02:00.
    expectedSourceBehavior:
    - The source result has getAmount() = 5.
    - The follow-up result has getAmount() = 5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATETIME_SPRING_TRANSITION
    category: EDGE
    description: ZonedDateTime operands cross the America/New_York daylight-saving
      spring transition at the same local time.
    preconditions:
    - startDateInclusive = 2024-03-09T12:00:00-05:00[America/New_York].
    - endDateExclusive = 2024-03-11T12:00:00-04:00[America/New_York].
    expectedSourceBehavior:
    - The source result has getAmount() = 2.
    - Both follow-up operands remain valid in the same zone after adding 37 DAYS.
    - The follow-up result has getAmount() = 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATETIME_AUTUMN_TRANSITION
    category: EDGE
    description: ZonedDateTime operands cross the America/New_York daylight-saving
      autumn transition at the same local time.
    preconditions:
    - startDateInclusive = 2024-11-02T12:00:00-04:00[America/New_York].
    - endDateExclusive = 2024-11-04T12:00:00-05:00[America/New_York].
    expectedSourceBehavior:
    - The source result has getAmount() = 2.
    - The follow-up result has getAmount() = 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_CHRONOLOGY
    category: NORMAL
    description: JapaneseDate operands exercise a non-ISO Temporal chronology while
      retaining a day-based gap.
    preconditions:
    - startDateInclusive is JapaneseDate for 2024-01-01.
    - endDateExclusive is JapaneseDate for 2024-01-11.
    expectedSourceBehavior:
    - The source result has getAmount() = 10.
    - Adding 37 DAYS to both JapaneseDate operands preserves their chronology and
      the gap.
    - The follow-up result has getAmount() = 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_RANGE_INTERIOR
    category: BOUNDARY
    description: LocalDate operands are close to the minimum supported date without
      shifting beyond the supported range.
    preconditions:
    - startDateInclusive = -999999999-01-01.
    - endDateExclusive = -999999999-01-11.
    - Both dates plus 37 days remain within the LocalDate supported range.
    expectedSourceBehavior:
    - The source result has getAmount() = 10.
    - The follow-up result has getAmount() = 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_RANGE_INTERIOR
    category: BOUNDARY
    description: LocalDate operands are close to the maximum supported date without
      shifting beyond the supported range.
    preconditions:
    - startDateInclusive = 999999999-12-20.
    - endDateExclusive = 999999999-12-30.
    - Both dates plus 37 days remain within the LocalDate supported range.
    expectedSourceBehavior:
    - The source result has getAmount() = 10.
    - The follow-up result has getAmount() = 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAXIMUM_RESULT
    category: BOUNDARY
    description: LocalDate operands produce the largest whole-day result that Math.toIntExact
      can convert to int.
    preconditions:
    - startDateInclusive = 1970-01-01.
    - endDateExclusive = startDateInclusive plus exactly 2147483647 DAYS.
    - Both source dates and both dates after adding 37 DAYS are valid LocalDate values.
    expectedSourceBehavior:
    - The source result has getAmount() = 2147483647.
    - The follow-up result has getAmount() = 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MINIMUM_RESULT
    category: BOUNDARY
    description: Reversed LocalDate operands produce the smallest whole-day result
      that Math.toIntExact can convert to int.
    preconditions:
    - endDateExclusive = 1970-01-01.
    - startDateInclusive = endDateExclusive plus exactly 2147483648 DAYS.
    - Both source dates and both dates after adding 37 DAYS are valid LocalDate values.
    expectedSourceBehavior:
    - The source result has getAmount() = -2147483648.
    - The follow-up result has getAmount() = -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MULTI_YEAR_LOCAL_DATE
    category: NORMAL
    description: A multi-year LocalDate interval exercises a large ordinary positive
      result distinct from int boundaries.
    preconditions:
    - startDateInclusive = 2000-01-01.
    - endDateExclusive = 2025-01-01.
    expectedSourceBehavior:
    - The source result has getAmount() = 9132.
    - The follow-up result has getAmount() = 9132.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_MULTI_YEAR_LOCAL_DATE
    category: NORMAL
    description: A reversed multi-year LocalDate interval exercises a large ordinary
      negative result.
    preconditions:
    - startDateInclusive = 2025-01-01.
    - endDateExclusive = 2000-01-01.
    expectedSourceBehavior:
    - The source result has getAmount() = -9132.
    - The follow-up result has getAmount() = -9132.
    targetCases: 1
    emptyOutputAllowed: false
