InputDomain:
  summary: Domain of non-null Temporal endpoint pairs for which Days.between and the
    metamorphic follow-up are both executable, with whole-day results representable
    as int and the same 37-day translation applied to both endpoints.
  globalConstraints:
  - Both source endpoints are non-null because generateFollowUp applies Objects.requireNonNull
    to each endpoint.
  - Each endpoint supports plus(37, ChronoUnit.DAYS), and the resulting follow-up
    endpoint remains representable by its temporal type.
  - Days.between(startDateInclusive, endDateExclusive) and Days.between(startDateInclusive.plus(37,
    DAYS), endDateExclusive.plus(37, DAYS)) both complete normally; endpoint pairs
    that make ChronoUnit.DAYS unsupported or cause a date-time exception are excluded
    because the relation requires two Days outputs.
  - The whole-day difference is within the int range because between applies Math.toIntExact
    before constructing the Days result.
  - Each scenario uses endpoint values whose follow-up values remain in the same temporal
    domain and whose source and follow-up outputs are compared through getAmount().
  - No null, unsupported-temporal, date-time-overflow, or int-overflow cases are included
    because the supplied metamorphic generator and assertion require valid non-null
    source and follow-up outputs rather than invalid-input behavior.
  diversity:
    temporalType:
    - LocalDate
    - LocalDateTime
    - OffsetDateTime
    - ZonedDateTime
    - Instant
    - JapaneseDate
    - HijrahDate
    ordering:
    - end_before_start
    - end_equal_to_start
    - end_after_start
    sourceAmount:
    - Integer.MIN_VALUE
    - '-37'
    - '-1'
    - '0'
    - '1'
    - '37'
    - Integer.MAX_VALUE
    calendarPosition:
    - minimum_safe_follow_up_boundary
    - maximum_safe_follow_up_boundary
    - ordinary_date
    - leap_day
    - month_boundary
    - year_boundary
    - daylight_saving_transition
    - non_iso_chronology
    timeOfDay:
    - midnight
    - equal_non_midnight_time
    - less_than_24_hours_apart
    - exactly_24_hours_apart
    - nanosecond_precision
  scenarios:
  - id: LOCAL_DATE_EQUAL_ENDPOINTS
    category: NORMAL
    description: Two equal LocalDate endpoints produce the zero-day sentinel.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 15)
    - endDateExclusive = LocalDate.of(2024, 6, 15)
    - Both endpoints plus 37 days are valid LocalDate values.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    - The follow-up endpoints are 37 days later and the follow-up getAmount() is also
      0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ADJACENT_FORWARD
    category: BOUNDARY
    description: Consecutive LocalDate values exercise the smallest positive nonzero
      result.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 15)
    - endDateExclusive = LocalDate.of(2024, 6, 16)
    - The source difference is exactly 1 whole day.
    expectedSourceBehavior:
    - getAmount() is 1.
    - Shifting both dates by 37 days preserves getAmount() as 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ADJACENT_REVERSE
    category: BOUNDARY
    description: Consecutive LocalDate values in reverse order exercise the smallest
      negative result.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 16)
    - endDateExclusive = LocalDate.of(2024, 6, 15)
    - The source difference is exactly -1 whole day.
    expectedSourceBehavior:
    - getAmount() is -1.
    - Shifting both dates by 37 days preserves getAmount() as -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_WEEK_FORWARD
    category: NORMAL
    description: A positive interval containing multiple complete weeks and extra
      days.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 1, 1)
    - endDateExclusive = LocalDate.of(2023, 2, 15)
    - The source difference is exactly 45 whole days.
    expectedSourceBehavior:
    - getAmount() is 45.
    - The follow-up result remains 45.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_WEEK_REVERSE
    category: NORMAL
    description: A negative interval containing multiple complete weeks and extra
      days.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 2, 15)
    - endDateExclusive = LocalDate.of(2023, 1, 1)
    - The source difference is exactly -45 whole days.
    expectedSourceBehavior:
    - getAmount() is -45.
    - The follow-up result remains -45.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_INTERVAL
    category: EDGE
    description: An interval crossing February 29 exercises leap-year calendar arithmetic.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 2, 28)
    - endDateExclusive = LocalDate.of(2024, 3, 1)
    - The source difference is exactly 2 whole days.
    expectedSourceBehavior:
    - getAmount() is 2.
    - The 37-day translation remains valid and produces getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_AND_YEAR_BOUNDARY
    category: BOUNDARY
    description: An interval crosses both a month boundary and a year boundary.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 12, 31)
    - endDateExclusive = LocalDate.of(2024, 1, 2)
    - The source difference is exactly 2 whole days.
    expectedSourceBehavior:
    - getAmount() is 2.
    - The follow-up result remains 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_SAFE_FOLLOW_UP
    category: EDGE
    description: The start endpoint is at LocalDate.MIN while both source and follow-up
      operations remain valid.
    preconditions:
    - startDateInclusive = LocalDate.MIN
    - endDateExclusive = LocalDate.MIN.plusDays(1)
    - LocalDate.MIN.plusDays(37) is valid.
    expectedSourceBehavior:
    - getAmount() is 1.
    - The follow-up result remains 1 without requiring a value below LocalDate.MIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_SAFE_FOLLOW_UP
    category: EDGE
    description: Endpoints are positioned at the largest LocalDate values that can
      still be shifted forward by 37 days.
    preconditions:
    - startDateInclusive = LocalDate.MAX.minusDays(37)
    - endDateExclusive = LocalDate.MAX
    - Both follow-up endpoints are valid, with the follow-up end equal to LocalDate.MAX.
    expectedSourceBehavior:
    - getAmount() is 37.
    - The follow-up result remains 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAXIMUM_DIFFERENCE
    category: BOUNDARY
    description: The positive LocalDate difference is exactly Integer.MAX_VALUE, the
      upper successful Math.toIntExact boundary.
    preconditions:
    - startDateInclusive = LocalDate.ofEpochDay(0)
    - endDateExclusive = LocalDate.ofEpochDay(2147483647)
    - Both dates and their 37-day translations are valid LocalDate values.
    expectedSourceBehavior:
    - getAmount() is Integer.MAX_VALUE.
    - The follow-up result remains Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MINIMUM_DIFFERENCE
    category: BOUNDARY
    description: The negative LocalDate difference is exactly Integer.MIN_VALUE, the
      lower successful Math.toIntExact boundary.
    preconditions:
    - startDateInclusive = LocalDate.ofEpochDay(0)
    - endDateExclusive = LocalDate.ofEpochDay(-2147483648)
    - Both dates and their 37-day translations are valid LocalDate values.
    expectedSourceBehavior:
    - getAmount() is Integer.MIN_VALUE.
    - The follow-up result remains Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints are exactly 24 hours apart at the same local
      time.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 5, 10, 12, 30)
    - endDateExclusive = LocalDateTime.of(2024, 5, 11, 12, 30)
    - The source difference is exactly 1 whole day.
    expectedSourceBehavior:
    - getAmount() is 1.
    - Adding 37 days to both LocalDateTime values preserves getAmount() as 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_LESS_THAN_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints cross a calendar date but are less than 24
      hours apart.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 5, 10, 23, 30)
    - endDateExclusive = LocalDateTime.of(2024, 5, 11, 23, 29)
    - The elapsed whole-day difference is 0.
    expectedSourceBehavior:
    - getAmount() is 0.
    - The follow-up result remains 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_REVERSE_PARTIAL_DAY
    category: BOUNDARY
    description: Reverse LocalDateTime endpoints are less than one whole day apart.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 5, 11, 23, 29)
    - endDateExclusive = LocalDateTime.of(2024, 5, 10, 23, 30)
    - The elapsed whole-day difference is -1.
    expectedSourceBehavior:
    - getAmount() is -1.
    - The follow-up result remains -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NANOSECOND_BOUNDARY
    category: EDGE
    description: LocalDateTime endpoints differ by one nanosecond around a whole-day
      boundary.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 5, 10, 0, 0, 0, 0)
    - endDateExclusive = LocalDateTime.of(2024, 5, 10, 23, 59, 59, 999999999)
    - The source difference is 0 whole days.
    expectedSourceBehavior:
    - getAmount() is 0.
    - The 37-day translation preserves the nanosecond relationship and produces 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS
    category: NORMAL
    description: OffsetDateTime endpoints use different UTC offsets while remaining
      within the same temporal type.
    preconditions:
    - startDateInclusive = OffsetDateTime.parse("2024-01-01T00:00:00+01:00")
    - endDateExclusive = OffsetDateTime.parse("2024-01-03T00:00:00-05:00")
    - The source whole-day difference is 2.
    - Both offset date-times support plus(37, DAYS).
    expectedSourceBehavior:
    - getAmount() is 2.
    - Shifting both endpoints by 37 days preserves the whole-day difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_ZERO_AFTER_OFFSET_ADJUSTMENT
    category: EDGE
    description: Different offsets make two apparently different local times represent
      an interval shorter than one whole day.
    preconditions:
    - startDateInclusive = OffsetDateTime.parse("2024-01-01T00:00:00+01:00")
    - endDateExclusive = OffsetDateTime.parse("2024-01-01T23:00:00+00:00")
    - The elapsed whole-day difference is 0.
    expectedSourceBehavior:
    - getAmount() is 0.
    - The follow-up result remains 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FIXED_OFFSET_ZONE
    category: NORMAL
    description: ZonedDateTime endpoints in UTC exercise date-based arithmetic without
      a zone transition.
    preconditions:
    - startDateInclusive = ZonedDateTime.parse("2024-01-01T00:00:00Z")
    - endDateExclusive = ZonedDateTime.parse("2024-02-15T00:00:00Z")
    - The source difference is 45 whole days.
    expectedSourceBehavior:
    - getAmount() is 45.
    - The follow-up result remains 45.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_TRANSITION
    category: EDGE
    description: ZonedDateTime endpoints span a daylight-saving spring transition.
    preconditions:
    - startDateInclusive = ZonedDateTime.of(2024, 3, 30, 12, 0, 0, 0, ZoneId.of("Europe/Paris"))
    - endDateExclusive = ZonedDateTime.of(2024, 4, 2, 12, 0, 0, 0, ZoneId.of("Europe/Paris"))
    - Both endpoints and their 37-day translations are valid in Europe/Paris.
    expectedSourceBehavior:
    - getAmount() is 3 whole days according to ChronoUnit.DAYS.between.
    - The follow-up result has the same getAmount().
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_TRANSITION
    category: EDGE
    description: ZonedDateTime endpoints span a daylight-saving autumn transition.
    preconditions:
    - startDateInclusive = ZonedDateTime.of(2024, 10, 26, 12, 0, 0, 0, ZoneId.of("Europe/Paris"))
    - endDateExclusive = ZonedDateTime.of(2024, 10, 29, 12, 0, 0, 0, ZoneId.of("Europe/Paris"))
    - Both endpoints and their 37-day translations are valid in Europe/Paris.
    expectedSourceBehavior:
    - getAmount() is 3 whole days according to ChronoUnit.DAYS.between.
    - The follow-up result has the same getAmount().
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_INTERVAL
    category: BOUNDARY
    description: Instant endpoints differ by almost one day but include nanosecond
      precision.
    preconditions:
    - startDateInclusive = Instant.parse("2024-01-01T00:00:00Z")
    - endDateExclusive = Instant.parse("2024-01-01T23:59:59.999999999Z")
    - The source difference is 0 whole days.
    expectedSourceBehavior:
    - getAmount() is 0.
    - Adding 37 days to both instants preserves getAmount() as 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_LARGE_FORWARD_INTERVAL
    category: NORMAL
    description: Instant endpoints exercise a large positive whole-day interval while
      remaining inside the int result range.
    preconditions:
    - startDateInclusive = Instant.parse("1970-01-01T00:00:00Z")
    - endDateExclusive = Instant.parse("2030-01-01T00:00:00Z")
    - The source whole-day difference is 21915.
    expectedSourceBehavior:
    - getAmount() is 21915.
    - The follow-up result remains 21915.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_LEAP_INTERVAL
    category: EDGE
    description: JapaneseDate endpoints exercise a non-ISO chronology across a leap-day
      interval.
    preconditions:
    - startDateInclusive = JapaneseDate.of(2024, 2, 28)
    - endDateExclusive = JapaneseDate.of(2024, 3, 1)
    - Both JapaneseDate values support plus(37, DAYS) and ChronoUnit.DAYS.between.
    expectedSourceBehavior:
    - getAmount() is 2.
    - The follow-up result remains 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_FORWARD_INTERVAL
    category: NORMAL
    description: HijrahDate endpoints exercise another supported non-ISO date implementation.
    preconditions:
    - startDateInclusive = HijrahDate.of(1445, 9, 1)
    - endDateExclusive = HijrahDate.of(1445, 9, 11)
    - Both endpoints and their 37-day translations are valid HijrahDate values.
    expectedSourceBehavior:
    - getAmount() is 10.
    - The follow-up result remains 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_ISO_DATE_REVERSE_INTERVAL
    category: BOUNDARY
    description: A non-ISO chronology is tested in reverse order to preserve the negative-result
      path.
    preconditions:
    - startDateInclusive = HijrahDate.of(1445, 10, 11)
    - endDateExclusive = HijrahDate.of(1445, 10, 1)
    - Both endpoints and their 37-day translations are valid HijrahDate values.
    expectedSourceBehavior:
    - getAmount() is -10.
    - The follow-up result remains -10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SHIFT_CROSSES_YEAR
    category: NORMAL
    description: The required 37-day follow-up itself crosses a year boundary, rather
      than merely the source interval.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 12, 20)
    - endDateExclusive = LocalDate.of(2023, 12, 25)
    - The source difference is 5 and both shifted endpoints are in January 2024.
    expectedSourceBehavior:
    - getAmount() is 5.
    - The follow-up result remains 5 after crossing the year boundary.
    targetCases: 1
    emptyOutputAllowed: false
