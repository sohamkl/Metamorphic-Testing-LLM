InputDomain:
  summary: Valid flat-context CircleImpl/Rectangle pairs, including empty sentinels,
    zero-radius circles, degenerate rectangles, bounding-box shortcuts, all phase-2
    axis branches, tangencies, containment, intersection, and disjointness. For nonempty
    cases let C=(cx,cy), radius=r, and express rectangle bounds as offsets [minX-cx,maxX-cx]
    x [minY-cy,maxY-cy].
  globalConstraints:
  - The receiver is constructed as CircleImpl(point,r,context), and context is non-null,
    flat, and non-geographic.
  - The rectangle is non-null, uses ordinary non-wrapping Cartesian bounds, and is
    interpreted in the same flat coordinate system as the circle.
  - No INVALID cases are included because the metamorphic relation requests valid
    inputs and rejects null circle or rectangle arguments with requireNonNull.
  - Every nonempty point and rectangle bound is finite; every nonempty rectangle satisfies
    minX <= maxX and minY <= maxY; and every nonempty circle has finite radius r >=
    0.
  - An empty circle is represented by an empty source point as recognized by Point.isEmpty();
    an empty rectangle is represented by Rectangle.isEmpty(). These are valid sentinel
    cases explicitly recognized by the supplied shape source.
  - For each nonempty case, context.makePoint(cx+17.5,cy-9.25), the shifted RectangleImpl
    bounds, and CircleImpl with the unchanged radius must all be accepted by the same
    context.
  - For each nonempty case, the source and shifted circle bounding boxes must have
    corresponding bounds differing by exactly +17.5 on X and -9.25 on Y, so context
    clipping or world-bound truncation cannot invalidate the developer's translation
    premise.
  - 'For each nonempty case, adding the shifts must preserve rectangle ordering, width,
    height, and all center-to-bound differences used by relate: for each X bound b,
    (b+17.5)-(cx+17.5)=b-cx, and for each Y bound b, (b-9.25)-(cy-9.25)=b-cy.'
  - Finite inputs that lose relative offsets under the fixed floating-point shift,
    overflow, become non-finite, or cause context clipping are excluded because they
    are not faithful realizations of the MR's common rigid translation.
  - Unless a scenario states r=0 or gives a different radius, use r=5 and exact-shift-safe
    coordinates satisfying its listed offsets.
  diversity:
    circleState:
    - empty
    - zero-radius
    - positive-radius
    rectangleDimension:
    - empty
    - point
    - horizontal-line
    - vertical-line
    - positive-area
    boundingBoxPhase:
    - DISJOINT-shortcut
    - WITHIN-shortcut
    - equal-box-identity
    - phase2-INTERSECTS-bbox
    - phase2-CONTAINS-bbox
    axisPosition:
    - left
    - right
    - below
    - above
    - spans-X-axis
    - spans-Y-axis
    - spans-both-axes
    geometricOutcome:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
    boundaryType:
    - strict-gap
    - strict-overlap
    - side-tangent
    - corner-tangent
    - exact-bounding-box
    - farthest-corner-on-circle
  scenarios:
  - id: EMPTY_CIRCLE_NONEMPTY_RECTANGLE
    category: EDGE
    description: The source circle has an empty center point and the rectangle is
      nonempty.
    preconditions:
    - circle.getCenter().isEmpty() is true and rectangle.isEmpty() is false.
    expectedSourceBehavior:
    - The empty enclosing-box sentinel makes relate(Rectangle) return DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONEMPTY_CIRCLE_EMPTY_RECTANGLE
    category: EDGE
    description: A nonempty positive-radius circle is related to an empty rectangle
      sentinel.
    preconditions:
    - circle.isEmpty() is false, r > 0, and rectangle.isEmpty() is true.
    expectedSourceBehavior:
    - The enclosing-box relation to the empty rectangle returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SHAPES_EMPTY
    category: EDGE
    description: Both the circle center and rectangle are empty sentinels.
    preconditions:
    - circle.isEmpty() is true and rectangle.isEmpty() is true.
    expectedSourceBehavior:
    - relate(Rectangle) returns the DISJOINT sentinel relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_STRICTLY_WITHIN_RECTANGLE
    category: NORMAL
    description: The rectangle strictly contains every side of the positive-radius
      circle's enclosing box.
    preconditions:
    - r=5 and rectangle offsets are [-6,6] x [-6,6].
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN, so relate returns WITHIN without phase
      2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_WITHIN_RECTANGLE_TOUCHING_ONE_BOX_SIDE
    category: BOUNDARY
    description: The rectangle contains the circle bounding box and shares exactly
      one side with it.
    preconditions:
    - r=5 and rectangle offsets are [-5,6] x [-6,6].
    expectedSourceBehavior:
    - The bounding box is WITHIN the rectangle, and relate returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_WITHIN_RECTANGLE_TOUCHING_BOX_CORNER
    category: BOUNDARY
    description: The containing rectangle shares two adjacent sides with the circle
      bounding box.
    preconditions:
    - r=5 and rectangle offsets are [-5,6] x [-5,6].
    expectedSourceBehavior:
    - The bounding-box shortcut returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_EQUALS_CIRCLE_BOUNDING_BOX
    category: EDGE
    description: The rectangle is exactly equal to the circle's enclosing box.
    preconditions:
    - r=5 and rectangle offsets are [-5,5] x [-5,5].
    - circle.getBoundingBox().equals(rectangle) is true.
    expectedSourceBehavior:
    - The explicit equal-box identity branch converts bounding-box CONTAINS to WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_WITHIN_LARGER_RECTANGLE
    category: EDGE
    description: A zero-radius circle is a point strictly inside a positive-area rectangle.
    preconditions:
    - r=0 and rectangle offsets are [-1,1] x [-1,1].
    expectedSourceBehavior:
    - The degenerate circle bounding box is WITHIN the rectangle, so relate returns
      WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUALS_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and a point rectangle have exactly the same
      coordinates.
    preconditions:
    - r=0 and all four rectangle offsets are 0.
    - circle.getBoundingBox().equals(rectangle) is true.
    expectedSourceBehavior:
    - The equal-bounding-box identity path returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and a distinct point rectangle are separated.
    preconditions:
    - r=0 and all rectangle X offsets are 1 while all rectangle Y offsets are 0.
    expectedSourceBehavior:
    - The two degenerate bounding boxes are DISJOINT, so relate returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDING_BOX_DISJOINT_LEFT
    category: NORMAL
    description: The rectangle lies wholly left of the circle bounding box.
    preconditions:
    - r=5 and rectangle offsets are [-8,-6] x [-1,1].
    expectedSourceBehavior:
    - The bounding-box shortcut returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDING_BOX_DISJOINT_RIGHT
    category: NORMAL
    description: The rectangle lies wholly right of the circle bounding box.
    preconditions:
    - r=5 and rectangle offsets are [6,8] x [-1,1].
    expectedSourceBehavior:
    - The bounding-box shortcut returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDING_BOX_DISJOINT_BELOW
    category: NORMAL
    description: The rectangle lies wholly below the circle bounding box.
    preconditions:
    - r=5 and rectangle offsets are [-1,1] x [-8,-6].
    expectedSourceBehavior:
    - The bounding-box shortcut returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDING_BOX_DISJOINT_ABOVE
    category: NORMAL
    description: The rectangle lies wholly above the circle bounding box.
    preconditions:
    - r=5 and rectangle offsets are [-1,1] x [6,8].
    expectedSourceBehavior:
    - The bounding-box shortcut returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RIGHT_SIDE_STRICT_OVERLAP
    category: NORMAL
    description: The rectangle crosses the circle's right side and spans the horizontal
      center axis.
    preconditions:
    - r=5 and rectangle offsets are [4,7] x [-1,1].
    expectedSourceBehavior:
    - The bounding boxes intersect; phase 2 cannot declare disjoint because Y spans
      the axis, and it returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEFT_SIDE_STRICT_OVERLAP
    category: NORMAL
    description: The rectangle crosses the circle's left side and spans the horizontal
      center axis.
    preconditions:
    - r=5 and rectangle offsets are [-7,-4] x [-1,1].
    expectedSourceBehavior:
    - Phase 2 selects the rectangle maximum X as closest and returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TOP_SIDE_STRICT_OVERLAP
    category: NORMAL
    description: The rectangle crosses the circle's top side and spans the vertical
      center axis.
    preconditions:
    - r=5 and rectangle offsets are [-1,1] x [4,7].
    expectedSourceBehavior:
    - Phase 2 selects the rectangle minimum Y as closest and returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTTOM_SIDE_STRICT_OVERLAP
    category: NORMAL
    description: The rectangle crosses the circle's bottom side and spans the vertical
      center axis.
    preconditions:
    - r=5 and rectangle offsets are [-1,1] x [-7,-4].
    expectedSourceBehavior:
    - Phase 2 selects the rectangle maximum Y as closest and returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RIGHT_CARDINAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle only at its rightmost cardinal point.
    preconditions:
    - r=5 and rectangle offsets are [5,7] x [-1,1].
    expectedSourceBehavior:
    - The touching bounding boxes and axis-spanning rectangle produce INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEFT_CARDINAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle only at its leftmost cardinal point.
    preconditions:
    - r=5 and rectangle offsets are [-7,-5] x [-1,1].
    expectedSourceBehavior:
    - The source relation is INTERSECTS at the circle boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TOP_CARDINAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle only at its top cardinal point.
    preconditions:
    - r=5 and rectangle offsets are [-1,1] x [5,7].
    expectedSourceBehavior:
    - The source relation is INTERSECTS at the circle boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTTOM_CARDINAL_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle only at its bottom cardinal point.
    preconditions:
    - r=5 and rectangle offsets are [-1,1] x [-7,-5].
    expectedSourceBehavior:
    - The source relation is INTERSECTS at the circle boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_BOX_OVERLAP_BUT_CIRCLE_DISJOINT
    category: EDGE
    description: The rectangle overlaps the circle bounding box in the upper-right
      corner, but its closest corner is outside the circle.
    preconditions:
    - r=5 and rectangle offsets are [4,6] x [4,6].
    - The closest-corner distance is sqrt(32), which is greater than r.
    expectedSourceBehavior:
    - Phase 2 tests the closest corner and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_CLOSEST_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle's closest upper-right corner is exactly on the circle.
    preconditions:
    - r=5 and rectangle offsets are [3,6] x [4,7].
    - The closest corner has offsets (3,4) and distance exactly 5.
    expectedSourceBehavior:
    - The closest-corner containment test accepts the boundary, and the result is
      INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAGONAL_CLOSEST_CORNER_INSIDE
    category: NORMAL
    description: A corner-entering rectangle has its closest corner strictly inside
      and its farthest corner outside the circle.
    preconditions:
    - r=5 and rectangle offsets are [3,6] x [3,6].
    - The closest corner distance is sqrt(18) < 5.
    expectedSourceBehavior:
    - The shapes are not disjoint, but the bounding box does not contain the rectangle;
      relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_UPPER_RIGHT_RECTANGLE
    category: NORMAL
    description: A positive-area rectangle lies strictly inside the circle in the
      upper-right quadrant.
    preconditions:
    - r=5 and rectangle offsets are [1,2] x [1,2].
    expectedSourceBehavior:
    - The circle bounding box contains the rectangle and its farthest corner is inside,
      so relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_UPPER_LEFT_RECTANGLE
    category: NORMAL
    description: A positive-area rectangle lies strictly inside the circle in the
      upper-left quadrant.
    preconditions:
    - r=5 and rectangle offsets are [-2,-1] x [1,2].
    expectedSourceBehavior:
    - Phase 2 exercises center-right-of-rectangle X selection and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_LOWER_LEFT_RECTANGLE
    category: NORMAL
    description: A positive-area rectangle lies strictly inside the circle in the
      lower-left quadrant.
    preconditions:
    - r=5 and rectangle offsets are [-2,-1] x [-2,-1].
    expectedSourceBehavior:
    - The selected farthest lower-left corner is inside, so relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONTAINS_LOWER_RIGHT_RECTANGLE
    category: NORMAL
    description: A positive-area rectangle lies strictly inside the circle in the
      lower-right quadrant.
    preconditions:
    - r=5 and rectangle offsets are [1,2] x [-2,-1].
    expectedSourceBehavior:
    - Phase 2 exercises center-below/left-of-rectangle selections and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_ON_CIRCLE
    category: BOUNDARY
    description: The rectangle is contained by the circle with its farthest corner
      exactly on the circumference.
    preconditions:
    - r=5 and rectangle offsets are [0,3] x [0,4].
    - The selected farthest corner has distance exactly 5.
    expectedSourceBehavior:
    - contains(farthestX,farthestY) accepts the boundary, so relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_BUT_CIRCLE_ONLY_INTERSECTS
    category: EDGE
    description: The rectangle is wholly inside the square bounding box, while its
      near corner is inside the circle and farthest corner is outside.
    preconditions:
    - r=5 and rectangle offsets are [3,5] x [3,5].
    expectedSourceBehavior:
    - bboxSect is CONTAINS, the closest corner prevents DISJOINT, and the farthest-corner
      test returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXIS_SPANNING_FARTHEST_RIGHT_TOP
    category: NORMAL
    description: The rectangle spans both center axes and extends farther right and
      upward.
    preconditions:
    - r=5 and rectangle offsets are [-1,3] x [-1,2].
    expectedSourceBehavior:
    - Phase 2 selects maxX and maxY as farthest; that corner is inside, yielding CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXIS_SPANNING_FARTHEST_LEFT_TOP
    category: NORMAL
    description: The rectangle spans both axes and extends farther left and upward.
    preconditions:
    - r=5 and rectangle offsets are [-3,1] x [-1,2].
    expectedSourceBehavior:
    - Phase 2 selects minX and maxY as farthest and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXIS_SPANNING_FARTHEST_LEFT_BOTTOM
    category: NORMAL
    description: The rectangle spans both axes and extends farther left and downward.
    preconditions:
    - r=5 and rectangle offsets are [-3,1] x [-2,1].
    expectedSourceBehavior:
    - Phase 2 selects minX and minY as farthest and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXIS_SPANNING_FARTHEST_RIGHT_BOTTOM
    category: NORMAL
    description: The rectangle spans both axes and extends farther right and downward.
    preconditions:
    - r=5 and rectangle offsets are [-1,3] x [-2,1].
    expectedSourceBehavior:
    - Phase 2 selects maxX and minY as farthest and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SYMMETRIC_AXIS_SPANNING_TIE
    category: EDGE
    description: A symmetric rectangle spans both axes, forcing the strict-greater
      farthest-side tests into their tie branches.
    preconditions:
    - r=5 and rectangle offsets are [-3,3] x [-3,3].
    expectedSourceBehavior:
    - The tie logic selects minX and minY; the corner distance sqrt(18) is inside,
      so relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CENTER_POINT_RECTANGLE_CONTAINED
    category: EDGE
    description: The rectangle degenerates to the circle center.
    preconditions:
    - r=5 and all rectangle offsets are 0.
    expectedSourceBehavior:
    - The circle bounding box contains the point rectangle and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCUMFERENCE_POINT_RECTANGLE_CONTAINED
    category: BOUNDARY
    description: A point rectangle lies exactly on the circumference.
    preconditions:
    - r=5, both X offsets are 3, and both Y offsets are 4.
    expectedSourceBehavior:
    - The farthest point is accepted by contains at distance 5, so relate returns
      CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_INSIDE_BBOX_OUTSIDE_CIRCLE
    category: EDGE
    description: A point rectangle lies inside the circle's square bounding box but
      outside the circle itself.
    preconditions:
    - r=5, both X offsets are 4, and both Y offsets are 4.
    expectedSourceBehavior:
    - The phase-2 closest-point test rejects distance sqrt(32), so relate returns
      DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_DIAMETER_LINE_CONTAINED
    category: EDGE
    description: A horizontal line rectangle is the full diameter of the circle.
    preconditions:
    - r=5 and rectangle offsets are [-5,5] x [0,0].
    expectedSourceBehavior:
    - Both endpoint corners lie on the circle and the line rectangle is returned as
      CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_CHORD_LINE_CONTAINED
    category: EDGE
    description: A vertical line rectangle forms a chord whose endpoints lie on the
      circle.
    preconditions:
    - r=5 and rectangle offsets are [3,3] x [-4,4].
    expectedSourceBehavior:
    - The selected farthest endpoint is on the circumference, so relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_LINE_EXTENDS_BEYOND_CIRCLE
    category: EDGE
    description: A horizontal line passes through the circle but extends beyond both
      sides.
    preconditions:
    - r=5 and rectangle offsets are [-7,7] x [0,0].
    expectedSourceBehavior:
    - The circle bounding box intersects rather than contains the line rectangle,
      so relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_TANGENT_LINE_SEGMENT
    category: BOUNDARY
    description: A vertical line segment lies on the tangent X coordinate and includes
      the rightmost circle point.
    preconditions:
    - r=5 and rectangle offsets are [5,5] x [-1,1].
    expectedSourceBehavior:
    - The segment touches the circle at one point and relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_LINE_PARTLY_INSIDE_PARTLY_OUTSIDE
    category: EDGE
    description: A vertical line crosses the circle boundary with one portion inside
      and one outside.
    preconditions:
    - r=5 and rectangle offsets are [0,0] x [4,7].
    expectedSourceBehavior:
    - The line overlaps the circle near Y=4 but extends beyond its bounding box, so
      relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_LINE_PARTLY_INSIDE_PARTLY_OUTSIDE
    category: EDGE
    description: A horizontal line crosses the circle boundary with one portion inside
      and one outside.
    preconditions:
    - r=5 and rectangle offsets are [4,7] x [0,0].
    expectedSourceBehavior:
    - The line overlaps the circle near X=4 but extends outside it, so relate returns
      INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
