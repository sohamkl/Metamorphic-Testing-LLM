  - id: EAST_OF_ORDINARY_RECTANGLE
    category: NORMAL
    description: Latitude is inside but the point is east of a non-wrapping rectangle.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (21, 0).
    expectedSourceBehavior:
