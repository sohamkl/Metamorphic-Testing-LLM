InputDomain:
  summary: Finite valid geographic rectangles and points, including ordinary, dateline-wrapping,
    degenerate, polar, boundary, and near-world-width cases, for which rotating every
    longitude east by 150 degrees preserves CONTAINS versus DISJOINT.
  globalConstraints:
  - The receiver SpatialContext is non-null and ctx.isGeo() is true, because the stated
    relation uses geographic longitude wrapping and the target's geographic branch.
  - The source receiver and follow-up receiver use the same geographic SpatialContext.
  - Rectangle minX and maxX and point X are finite doubles in the closed interval
    [-180, 180].
  - Rectangle minY and maxY and point Y are finite doubles in the closed interval
    [-90, 90].
  - Rectangle minY <= maxY, matching the reset assertion and a valid latitude interval.
  - The point argument is non-null and has finite coordinates; null, NaN, and infinite
    coordinates are excluded because the MR does not request invalid inputs and longitude
    rotation is not defined for them.
  - 'The rectangle is nonempty: minX is not NaN, as RectangleImpl.isEmpty() uses that
    sentinel.'
  - minX > maxX is allowed and denotes a dateline-wrapping rectangle exactly as documented
    and implemented.
  - Zero-width and zero-height rectangles are allowed because relate(Point) handles
    their inclusive boundaries.
  - 'Exclude the source representation minX = -180 and maxX = 180: its raw width is
    360, but independently wrapping both endpoints after adding 150 maps both to -30
    and collapses the specified follow-up to zero width, so the supplied MR is false
    for that reachable representation.'
  - The longitude wrapper is W(x) = ((x + 180) modulo 360) - 180, yielding [-180,
    180); in particular W(180) = -180.
  - The follow-up rectangle coordinates are (W(minX + 150), W(maxX + 150), minY, maxY),
    and the follow-up point is (W(pointX + 150), pointY).
  - The required oracle is exact equality of source and follow-up SpatialRelation
    values; for these point inputs the observable values are CONTAINS or DISJOINT.
  diversity:
    sourceRectangleTopology:
    - non-wrapping minX <= maxX
    - dateline-wrapping minX > maxX
    - zero-width meridian
    - zero-height latitude
    - near-360-degree width
    rotationTopology:
    - non-wrapping to non-wrapping
    - non-wrapping to wrapping
    - wrapping to non-wrapping
    - wrapping to wrapping
    latitudePosition:
    - strictly below minY
    - exactly minY
    - strictly inside
    - exactly maxY
    - strictly above maxY
    - north pole
    - south pole
    longitudePosition:
    - strict interior
    - minX boundary
    - maxX boundary
    - west disjoint
    - east disjoint
    - wrapped east lobe
    - wrapped west lobe
    - excluded dateline gap
    - +180/-180 equivalent meridian
    effectiveWidthDegrees:
    - '0'
    - '0.001'
    - 30 to 60
    - '180'
    - 310 to 350
    - '359'
    expectedRelation:
    - CONTAINS
    - DISJOINT
  scenarios:
  - id: ORDINARY_STRICT_INTERIOR
    category: NORMAL
    description: A point is strictly inside an ordinary rectangle, and the rotation
      leaves the rectangle non-wrapping.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (0, 0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MIN_X_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the inclusive western longitude boundary.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (-20, 0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MAX_X_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the inclusive eastern longitude boundary.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (20, 0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIN_Y_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the inclusive minimum-latitude boundary.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (0, -10).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_Y_BOUNDARY
    category: BOUNDARY
    description: The point lies exactly on the inclusive maximum-latitude boundary.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (0, 10).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_CORNER
    category: BOUNDARY
    description: The point simultaneously lies on longitude and latitude boundaries.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (-20, -10).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because both comparisons are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ABOVE_MAX_Y_EARLY_DISJOINT
    category: BOUNDARY
    description: Longitude is inside, but latitude is just above maxY and triggers
      the first disjoint test.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (0, 10.001).
    expectedSourceBehavior:
    - relate(point) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BELOW_MIN_Y_EARLY_DISJOINT
    category: BOUNDARY
    description: Longitude is inside, but latitude is just below minY and triggers
      the first disjoint test.
    preconditions:
    - Rectangle = (-20, 20, -10, 10) and point = (0, -10.001).
    expectedSourceBehavior:
