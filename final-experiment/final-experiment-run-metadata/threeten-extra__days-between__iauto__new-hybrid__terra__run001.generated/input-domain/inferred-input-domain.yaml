InputDomain:
  summary: Valid non-null Temporal endpoint pairs for which ChronoUnit.DAYS.between
    produces an int-representable whole-day count and both endpoints can be shifted
    forward by 37 ChronoUnit.DAYS. The domain covers date-only, local date-time, instant,
    offset, zoned/DST, alternate-calendar, and compatible mixed Temporal representations.
  globalConstraints:
  - startDateInclusive and endDateExclusive are non-null Temporal instances.
  - DAYS.between(startDateInclusive, endDateExclusive) completes successfully and
    its long result is within Integer.MIN_VALUE through Integer.MAX_VALUE, because
    Days.between applies Math.toIntExact.
  - startDateInclusive.plus(37, DAYS) and endDateExclusive.plus(37, DAYS) both complete
    successfully, because the supplied follow-up generator unconditionally performs
    those operations.
  - DAYS.between on the two shifted endpoints also completes successfully and is int-representable,
    so both source and follow-up executions produce Days outputs for the relation
    assertion.
  - Null endpoints, Temporal implementations that do not support DAYS for between
    or plus, endpoint combinations rejected by the underlying Temporal implementation,
    and source gaps outside the int range are excluded because the supplied metamorphic
    generator or Days.between cannot produce the two required Days outputs.
  diversity:
    endpointRepresentation:
    - '7'
    - runtime Temporal representation
    - LocalDate; LocalDateTime; Instant; OffsetDateTime; ZonedDateTime; JapaneseDate;
      HijrahDate
    sourceAmountClass:
    - '7'
    - sourceOutput.getAmount()
    - Integer.MIN_VALUE; negative non-unit; -1; 0; 1; positive non-unit; Integer.MAX_VALUE
    calendarCondition:
    - '8'
    - endpoint relationship
    - same endpoint; adjacent date; leap day; month boundary; year boundary; era boundary;
      spring DST transition; autumn DST transition
    timeOfDayCondition:
    - '5'
    - elapsed/local-time relation
    - date-only; less than 24 hours; exactly 24 hours; multiple whole days; offset-normalized
      partial day
  scenarios:
  - id: LOCAL_DATE_SAME_DAY_ZERO
    category: NORMAL
    description: Identical ISO LocalDate endpoints exercise the Days.of(0) singleton
      path.
    preconditions:
    - startDateInclusive is LocalDate 2024-06-15.
    - endDateExclusive is the same LocalDate 2024-06-15.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ADJACENT_FORWARD_ONE
    category: NORMAL
    description: Consecutive ISO dates exercise the Days.of(1) singleton path.
    preconditions:
    - startDateInclusive is LocalDate 2024-06-15.
    - endDateExclusive is LocalDate 2024-06-16.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ADJACENT_REVERSE_MINUS_ONE
    category: NORMAL
    description: Reversed consecutive ISO dates verify the documented negative result
      direction.
    preconditions:
    - startDateInclusive is LocalDate 2024-06-16.
    - endDateExclusive is LocalDate 2024-06-15.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: An ISO date range crossing leap day verifies calendar-day counting
      in a leap year.
    preconditions:
    - startDateInclusive is LocalDate 2024-02-28.
    - endDateExclusive is LocalDate 2024-03-01.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: The corresponding non-leap-year February boundary has one intervening
      day less.
    preconditions:
    - startDateInclusive is LocalDate 2023-02-28.
    - endDateExclusive is LocalDate 2023-03-01.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_BOUNDARY
    category: NORMAL
    description: A range crossing from a 31-day month to the next month uses date
      arithmetic rather than day-of-month subtraction.
    preconditions:
    - startDateInclusive is LocalDate 2024-01-31.
    - endDateExclusive is LocalDate 2024-02-02.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: NORMAL
    description: A range crossing an ISO year boundary verifies that calendar year
      changes do not alter the day-gap rule.
    preconditions:
    - startDateInclusive is LocalDate 2023-12-31.
    - endDateExclusive is LocalDate 2024-01-02.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LARGE_POSITIVE_YEAR_SPAN
    category: NORMAL
    description: A multi-year ISO date gap exercises a non-singleton positive Days
      result.
    preconditions:
    - startDateInclusive is LocalDate 2020-01-01.
    - endDateExclusive is LocalDate 2021-01-01.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_FOLLOW_UP_SAFE
    category: EDGE
    description: The ISO LocalDate minimum is valid as a source endpoint because adding
      37 days remains within LocalDate's supported range.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is LocalDate.MIN.plus(1, DAYS).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_FOLLOW_UP_SAFE
    category: EDGE
    description: The latest ISO LocalDate endpoints that can still be shifted by 37
      days test the upper representable-date boundary.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minus(37, DAYS).
    - endDateExclusive is LocalDate.MAX.minus(36, DAYS).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_IDENTICAL_ZERO
    category: NORMAL
    description: Identical LocalDateTime endpoints produce zero whole days.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-06-15T12:30.
    - endDateExclusive is LocalDateTime 2024-06-15T12:30.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_SUBDAY_ZERO
    category: BOUNDARY
    description: A positive elapsed interval just below 24 hours has zero whole days.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-06-15T12:00.
    - endDateExclusive is LocalDateTime 2024-06-16T11:59:59.999999999.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_SUBDAY_ZERO
    category: BOUNDARY
    description: A negative elapsed interval with magnitude below 24 hours truncates
      to zero whole days.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-06-16T11:59:59.999999999.
    - endDateExclusive is LocalDateTime 2024-06-15T12:00.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY_ONE
    category: NORMAL
    description: An exact 24-hour LocalDateTime interval produces one whole day.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-06-15T12:00.
    - endDateExclusive is LocalDateTime 2024-06-16T12:00.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_TIME_OF_DAY_REDUCES_DATE_GAP
    category: NORMAL
    description: End time earlier than start time reduces a two-date-boundary LocalDateTime
      range to one whole day.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-06-15T18:00.
    - endDateExclusive is LocalDateTime 2024-06-17T06:00.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_MULTI_DAY
    category: NORMAL
    description: A reversed LocalDateTime interval spanning multiple complete days
      produces a negative non-unit amount.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-06-20T08:00.
    - endDateExclusive is LocalDateTime 2024-06-17T08:00.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is -3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NANOSECOND_BOUNDARY
    category: BOUNDARY
    description: A one-nanosecond shortfall from a full day verifies whole-day truncation
      at nanosecond precision.
    preconditions:
    - startDateInclusive is LocalDateTime 2024-01-01T00:00.
    - endDateExclusive is LocalDateTime 2024-01-01T23:59:59.999999999.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY_ONE
    category: NORMAL
    description: Two Instants exactly 24 hours apart produce one whole day on the
      timeline.
    preconditions:
    - startDateInclusive is Instant 2024-01-01T00:00:00Z.
    - endDateExclusive is Instant 2024-01-02T00:00:00Z.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_POSITIVE_SUBDAY_ZERO
    category: BOUNDARY
    description: A positive Instant interval one second short of 24 hours produces
      zero whole days.
    preconditions:
    - startDateInclusive is Instant 2024-01-01T00:00:00Z.
    - endDateExclusive is Instant 2024-01-01T23:59:59Z.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_EXACT_DAY
    category: NORMAL
    description: A reversed exact 24-hour Instant interval produces negative one.
    preconditions:
    - startDateInclusive is Instant 2024-01-02T00:00:00Z.
    - endDateExclusive is Instant 2024-01-01T00:00:00Z.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAXIMUM_DAY_GAP
    category: EDGE
    description: The largest long day count accepted by Math.toIntExact exercises
      the positive int boundary.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.plus(Integer.MAX_VALUE, DAYS).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MINIMUM_DAY_GAP
    category: EDGE
    description: The smallest int-representable day count exercises the negative int
      boundary.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.plus(Integer.MIN_VALUE, DAYS).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_MINIMUM_FOLLOW_UP_SAFE
    category: EDGE
    description: Instant.MIN is a source endpoint whose required positive 37-day follow-up
      remains representable.
    preconditions:
    - startDateInclusive is Instant.MIN.
    - endDateExclusive is Instant.MIN.plus(1, DAYS).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_MAXIMUM_FOLLOW_UP_SAFE
    category: EDGE
    description: Instants no later than 37 days below Instant.MAX exercise the upper
      Instant boundary while preserving follow-up construction.
    preconditions:
    - startDateInclusive is Instant.MAX.minus(37, DAYS).
    - endDateExclusive is Instant.MAX.minus(36, DAYS).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET_DAY
    category: NORMAL
    description: Same-offset OffsetDateTime endpoints exactly one local/timeline day
      apart produce one.
    preconditions:
    - startDateInclusive is OffsetDateTime 2024-01-01T00:00+02:00.
    - endDateExclusive is OffsetDateTime 2024-01-02T00:00+02:00.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSET_SUBDAY
    category: BOUNDARY
    description: Different offsets make apparent adjacent local midnights only 23
      timeline hours apart.
    preconditions:
    - startDateInclusive is OffsetDateTime 2024-01-01T00:00Z.
    - endDateExclusive is OffsetDateTime 2024-01-02T00:00+01:00.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSET_FULL_DAY
    category: NORMAL
    description: Different offsets with a full 24-hour instant separation produce
      one whole day.
    preconditions:
    - startDateInclusive is OffsetDateTime 2024-01-01T00:00+01:00.
    - endDateExclusive is OffsetDateTime 2024-01-02T01:00+02:00.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_REVERSED_PARTIAL_ZERO
    category: BOUNDARY
    description: A negative offset-normalized interval with magnitude below one day
      produces zero whole days.
    preconditions:
    - startDateInclusive is OffsetDateTime 2024-01-02T00:00+01:00.
    - endDateExclusive is OffsetDateTime 2024-01-01T00:00Z.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_TWO_CALENDAR_DAYS
    category: EDGE
    description: A New York range crossing the spring DST transition covers two local
      calendar days despite a 47-hour elapsed duration.
    preconditions:
    - startDateInclusive is ZonedDateTime 2024-03-09T12:00 in zone America/New_York.
    - endDateExclusive is ZonedDateTime 2024-03-11T12:00 in zone America/New_York.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_DST_TWO_CALENDAR_DAYS
    category: EDGE
    description: A New York range crossing the autumn DST transition covers two local
      calendar days despite a 49-hour elapsed duration.
    preconditions:
    - startDateInclusive is ZonedDateTime 2024-11-02T12:00 in zone America/New_York.
    - endDateExclusive is ZonedDateTime 2024-11-04T12:00 in zone America/New_York.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_SUBDAY
    category: BOUNDARY
    description: A same-zone local interval spanning the spring offset change but
      shorter than one complete local day yields zero.
    preconditions:
    - startDateInclusive is ZonedDateTime 2024-03-09T12:00 in zone America/New_York.
    - endDateExclusive is ZonedDateTime 2024-03-10T11:00 in zone America/New_York.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FIXED_OFFSET_ZONE
    category: NORMAL
    description: A ZonedDateTime in a fixed-offset ZoneId verifies zoned handling
      without a daylight-saving transition.
    preconditions:
    - startDateInclusive is ZonedDateTime 2024-01-01T00:00 in zone UTC.
    - endDateExclusive is ZonedDateTime 2024-01-04T00:00 in zone UTC.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_REVERSED_DST_RANGE
    category: EDGE
    description: Reversing a zoned range across a DST transition verifies the negative
      direction for ZonedDateTime.
    preconditions:
    - startDateInclusive is ZonedDateTime 2024-03-11T12:00 in zone America/New_York.
    - endDateExclusive is ZonedDateTime 2024-03-09T12:00 in zone America/New_York.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_BOUNDARY
    category: BOUNDARY
    description: JapaneseDate endpoints crossing the Heisei-to-Reiwa era boundary
      verify a non-ISO chronology that supports DAYS.
    preconditions:
    - startDateInclusive is JapaneseDate 2019-04-30.
    - endDateExclusive is JapaneseDate 2019-05-01.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_MULTI_DAY
    category: NORMAL
    description: A multi-day JapaneseDate range exercises non-ISO date arithmetic
      beyond an era-adjacent single day.
    preconditions:
    - startDateInclusive is JapaneseDate 2019-04-29.
    - endDateExclusive is JapaneseDate 2019-05-02.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_CONSECUTIVE_DAYS
    category: NORMAL
    description: Consecutive HijrahDate endpoints cover another Chronology-based Temporal
      implementation supporting DAYS.
    preconditions:
    - startDateInclusive is HijrahDate 1445-09-29.
    - endDateExclusive is startDateInclusive.plus(1, DAYS).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: A HijrahDate range defined by day addition crosses whatever month
      boundary follows the selected valid date without assuming Gregorian month lengths.
    preconditions:
    - startDateInclusive is HijrahDate 1445-09-29.
    - endDateExclusive is startDateInclusive.plus(3, DAYS).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: NORMAL
    description: A compatible mixed Temporal pair uses a LocalDate start and a LocalDateTime
      end whose date is one day later.
    preconditions:
    - startDateInclusive is LocalDate 2024-06-15.
    - endDateExclusive is LocalDateTime 2024-06-16T23:59:59.999999999.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_LOCAL_DATE_TO_LOCAL_DATE_TIME_SAME_DATE
    category: NORMAL
    description: A compatible mixed pair on the same calendar date verifies that LocalDate-based
      day calculation ignores the end time-of-day.
    preconditions:
    - startDateInclusive is LocalDate 2024-06-15.
    - endDateExclusive is LocalDateTime 2024-06-15T23:59:59.999999999.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
