InputDomain:
  summary: Domain of non-null Temporal pairs for which ChronoUnit.DAYS.between is
    supported, the whole-day result fits an int, and shifting both temporals forward
    by 37 supported days remains valid and preserves the measured gap.
  globalConstraints:
  - startDateInclusive and endDateExclusive are non-null Temporal instances, matching
    the method documentation.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is supported for
    both inputs; temporals that do not support the DAYS unit are excluded because
    the target delegates directly to DAYS.between.
  - The whole-day result is within [-2147483648, 2147483647], because the target applies
    Math.toIntExact before constructing Days.
  - The follow-up is formed by adding exactly 37 DAYS to both inputs, and both shifted
    temporals remain representable and support that operation.
  - Each source and follow-up pair uses temporals whose chronology, offset treatment,
    and time-zone behavior make the measured whole-day gap unchanged by the common
    37-day shift, as required by the metamorphic relation.
  - Expected observations use Days.getAmount() rather than object identity; the target
    may return the ZERO or ONE singleton for amounts 0 and 1 through Days.of.
  diversity:
    temporalKind:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime-UTC
    - ZonedDateTime-fixed-offset
    - JapaneseDate
    - ThaiBuddhistDate
    direction:
    - end-before-start
    - same-start-and-end
    - end-after-start
    resultClass:
    - zero
    - positive-one
    - negative-one
    - positive-multiple
    - negative-multiple
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    timeGranularity:
    - date-only
    - exact-whole-day-date-time
    - positive-subday
    - negative-subday
    calendarBoundary:
    - ordinary-date
    - leap-day-crossing
    - near-minimum-supported-date
    - near-maximum-supported-date
    zoneOrOffset:
    - none
    - equal-offset
    - differing-offsets
    - UTC
    - fixed-zone-without-transition
  scenarios:
  - id: LOCAL_DATE_ZERO
    category: NORMAL
    description: Two equal LocalDate values produce the zero-day sentinel, and both
      equal dates are shifted forward by 37 days.
    preconditions:
    - startDateInclusive = 2024-06-15 as a LocalDate.
    - endDateExclusive = 2024-06-15 as a LocalDate.
    - The follow-up values are 2024-07-22 and 2024-07-22.
    expectedSourceBehavior:
    - DAYS.between returns 0.
    - Math.toIntExact succeeds and Days.of(0) returns a Days whose getAmount() is
      0.
    - The follow-up getAmount() is also 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_POSITIVE_ONE
    category: BOUNDARY
    description: Consecutive LocalDate values exercise the positive-one sentinel.
    preconditions:
    - startDateInclusive = 2024-06-15.
    - endDateExclusive = 2024-06-16.
    - The follow-up pair is 2024-07-22 and 2024-07-23.
    expectedSourceBehavior:
    - The source result has getAmount() equal to 1.
    - Days.of(1) returns the ONE value, and the follow-up amount remains 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_ONE
    category: BOUNDARY
    description: Reversed consecutive LocalDate values exercise the negative-one result.
    preconditions:
    - startDateInclusive = 2024-06-16.
    - endDateExclusive = 2024-06-15.
    - The follow-up pair is 2024-07-23 and 2024-07-22.
    expectedSourceBehavior:
    - DAYS.between returns -1 and getAmount() is -1.
    - The common 37-day shift leaves the negative amount unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_POSITIVE_MULTIPLE
    category: NORMAL
    description: A positive multi-day LocalDate interval exercises the ordinary non-singleton
      Days.of path.
    preconditions:
    - startDateInclusive = 2023-01-10.
    - endDateExclusive = 2024-02-20.
    - The follow-up pair is 2023-02-16 and 2024-03-28.
    expectedSourceBehavior:
    - The source returns a Days whose getAmount() equals the whole date-day gap, 406.
    - The follow-up getAmount() is 406.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_MULTIPLE
    category: NORMAL
    description: A negative multi-day LocalDate interval verifies directed subtraction
      beyond the -1 boundary.
    preconditions:
    - startDateInclusive = 2024-02-20.
    - endDateExclusive = 2023-01-10.
    - The follow-up pair is 2024-03-28 and 2023-02-16.
    expectedSourceBehavior:
    - The source returns getAmount() equal to -406.
    - The follow-up amount is also -406.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: EDGE
    description: A LocalDate interval crosses February 29 in a leap year.
    preconditions:
    - startDateInclusive = 2024-02-28.
    - endDateExclusive = 2024-03-01.
    - The follow-up pair is 2024-04-05 and 2024-04-07.
    expectedSourceBehavior:
    - DAYS.between counts the leap day and returns getAmount() equal to 2.
    - The 37-day follow-up also returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM
    category: EDGE
    description: LocalDate values near the maximum supported date remain shiftable
      by 37 days.
    preconditions:
    - startDateInclusive = 999999998-12-01.
    - endDateExclusive = 999999998-12-10.
    - Both dates and their 37-day shifts are before LocalDate.MAX.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 9.
    - The follow-up remains valid and returns 9.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM
    category: EDGE
    description: LocalDate values near the minimum supported date remain shiftable
      by 37 days.
    preconditions:
    - startDateInclusive = -999999998-01-10.
    - endDateExclusive = -999999998-01-20.
    - Both dates and their 37-day shifts are after LocalDate.MIN.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 10.
    - The follow-up returns the same amount, 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATETIME_EXACT_WHOLE_DAY
    category: NORMAL
    description: LocalDateTime values separated by exactly 24 hours exercise whole-day
      date-time counting.
    preconditions:
    - startDateInclusive = 2024-06-15T08:30.
    - endDateExclusive = 2024-06-16T08:30.
    - The follow-up pair adds 37 calendar days to both values.
    expectedSourceBehavior:
    - DAYS.between returns a whole-day amount of 1.
    - The follow-up getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATETIME_POSITIVE_SUBDAY
    category: BOUNDARY
    description: A positive LocalDateTime interval shorter than one day exercises
      truncation to zero whole days.
    preconditions:
    - startDateInclusive = 2024-06-15T08:30.
    - endDateExclusive = 2024-06-15T20:29:59.
    - The elapsed interval is positive and less than 24 hours.
    expectedSourceBehavior:
    - DAYS.between returns 0 whole days.
    - Days.of(0) yields getAmount() 0, and the shifted pair also yields 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATETIME_NEGATIVE_SUBDAY
    category: BOUNDARY
    description: A negative LocalDateTime interval whose magnitude is less than one
      day exercises zero truncation in the reverse direction.
    preconditions:
    - startDateInclusive = 2024-06-15T20:29:59.
    - endDateExclusive = 2024-06-15T08:30.
    - The elapsed interval is negative and greater than -24 hours.
    expectedSourceBehavior:
    - DAYS.between returns 0 whole days rather than a nonzero signed day.
    - The 37-day follow-up also has getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: local_datetime_negative_exact_day
    category: NORMAL
    description: Reversed LocalDateTime values separated by exactly one day exercise
      a negative whole-day result.
    preconditions:
    - startDateInclusive = 2024-06-16T08:30.
    - endDateExclusive = 2024-06-15T08:30.
    - Both follow-up values are shifted by 37 days.
    expectedSourceBehavior:
    - The source returns getAmount() equal to -1.
    - The follow-up amount remains -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_POSITIVE_SUBDAY
    category: BOUNDARY
    description: Instants separated by less than 24 hours exercise the whole-day conversion
      at zero.
    preconditions:
    - startDateInclusive = 2024-06-15T00:00:00Z.
    - endDateExclusive = 2024-06-15T23:59:59Z.
    - The follow-up instants add exactly 37 DAYS to both endpoints.
    expectedSourceBehavior:
    - DAYS.between returns 0 whole days.
    - The follow-up getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_LARGE_POSITIVE
    category: EDGE
    description: Instants have a positive gap exactly equal to Integer.MAX_VALUE days,
      testing the upper successful Math.toIntExact boundary.
    preconditions:
    - startDateInclusive = Instant.EPOCH.
    - endDateExclusive = Instant.EPOCH plus 2147483647 DAYS.
    - The shifted end remains representable after adding 37 DAYS.
    expectedSourceBehavior:
    - DAYS.between returns 2147483647.
    - Math.toIntExact succeeds at the maximum int value.
    - The follow-up getAmount() is also 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_LARGE_NEGATIVE
    category: EDGE
    description: Reversed instants have a gap exactly equal to Integer.MIN_VALUE days,
      testing the lower successful Math.toIntExact boundary.
    preconditions:
    - startDateInclusive = Instant.EPOCH plus 2147483648 DAYS.
    - endDateExclusive = Instant.EPOCH.
    - Both endpoints and their 37-day shifts are representable Instants.
    expectedSourceBehavior:
    - DAYS.between returns -2147483648.
    - Math.toIntExact succeeds at the minimum int value.
    - The follow-up getAmount() remains -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATETIME_EQUAL_OFFSET
    category: NORMAL
    description: OffsetDateTime values with the same offset exercise date-time counting
      with an explicit fixed offset.
    preconditions:
    - startDateInclusive = 2024-06-15T10:00+02:00.
    - endDateExclusive = 2024-06-18T10:00+02:00.
    - Both values are shifted by 37 days while retaining their offset.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 3.
    - The follow-up returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATETIME_DIFFERING_OFFSETS
    category: EDGE
    description: OffsetDateTime endpoints use different explicit offsets while representing
      a two-day whole-day gap.
    preconditions:
    - startDateInclusive = 2024-06-15T12:00+02:00.
    - endDateExclusive = 2024-06-17T12:00+00:00.
    - Both offsets remain unchanged when 37 days are added.
    expectedSourceBehavior:
    - DAYS.between observes the temporal offset information and returns the applicable
      whole-day amount, 2.
    - The common shift leaves the amount at 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATETIME_UTC
    category: NORMAL
    description: ZonedDateTime values in UTC exercise a zone-aware Temporal without
      daylight-saving transitions.
    preconditions:
    - startDateInclusive = 2024-06-15T10:00Z[UTC].
    - endDateExclusive = 2024-06-20T10:00Z[UTC].
    - Both endpoints are shifted by 37 days in UTC.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 5.
    - The follow-up returns 5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATETIME_FIXED_OFFSET
    category: NORMAL
    description: ZonedDateTime values use a fixed-offset zone, avoiding a transition
      that could alter the elapsed gap after the common shift.
    preconditions:
    - startDateInclusive = 2024-06-15T10:00+05:00[+05:00].
    - endDateExclusive = 2024-06-16T10:00+05:00[+05:00].
    - The zone has no daylight-saving transition and both values remain valid after
      37 days.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 1.
    - The follow-up returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATETIME_NEGATIVE
    category: NORMAL
    description: Reversed UTC ZonedDateTime values exercise a negative zone-aware
      day count.
    preconditions:
    - startDateInclusive = 2024-06-20T10:00Z[UTC].
    - endDateExclusive = 2024-06-15T10:00Z[UTC].
    - Both values are shifted by 37 days in UTC.
    expectedSourceBehavior:
    - The source returns getAmount() equal to -5.
    - The follow-up amount is -5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_POSITIVE
    category: NORMAL
    description: JapaneseDate values with the same chronology exercise a non-ISO date-based
      Temporal.
    preconditions:
    - startDateInclusive = JapaneseDate.of(2024, 6, 15).
    - endDateExclusive = JapaneseDate.of(2024, 6, 18).
    - Both values and their 37-day shifts remain JapaneseDate values.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns 3.
    - The follow-up getAmount() is 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_NEGATIVE
    category: NORMAL
    description: Reversed JapaneseDate values verify signed counting for a non-ISO
      chronology.
    preconditions:
    - startDateInclusive = JapaneseDate.of(2024, 6, 18).
    - endDateExclusive = JapaneseDate.of(2024, 6, 15).
    - Both values are shifted by 37 supported days.
    expectedSourceBehavior:
    - The source returns getAmount() equal to -3.
    - The follow-up returns -3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_ZERO
    category: EDGE
    description: Equal ThaiBuddhistDate values exercise the zero sentinel in another
      supported chronology.
    preconditions:
    - startDateInclusive = ThaiBuddhistDate.of(2567, 6, 15).
    - endDateExclusive = ThaiBuddhistDate.of(2567, 6, 15).
    - Both equal values and their 37-day shifts remain valid ThaiBuddhistDate values.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 0.
    - The follow-up also returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_LEAP_CROSSING
    category: EDGE
    description: ThaiBuddhistDate values cross the corresponding leap-day interval
      while preserving chronology.
    preconditions:
    - startDateInclusive = ThaiBuddhistDate.of(2567, 2, 28).
    - endDateExclusive = ThaiBuddhistDate.of(2567, 3, 1).
    - Both endpoints and their 37-day shifts are valid in the same chronology.
    expectedSourceBehavior:
    - DAYS.between counts 2 whole days.
    - The follow-up getAmount() remains 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_SCALE_POSITIVE_MULTI_DAY
    category: NORMAL
    description: A long positive interval across date-only and date-time representations
      is represented using the same temporal kind at both endpoints and exercises
      a non-sentinel result.
    preconditions:
    - startDateInclusive and endDateExclusive are LocalDateTime values with identical
      local times.
    - Their local dates are exactly 37 days apart, such as 2024-06-15T06:00 and 2024-07-22T06:00.
    - The follow-up pair is shifted to 2024-07-22T06:00 and 2024-08-28T06:00.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 37.
    - The follow-up returns the same 37-day amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_SHIFT_AT_MONTH_BOUNDARY
    category: BOUNDARY
    description: A LocalDate interval whose 37-day follow-up crosses multiple month
      boundaries checks that the relation is not tied to month arithmetic.
    preconditions:
    - startDateInclusive = 2024-01-31.
    - endDateExclusive = 2024-02-29.
    - The follow-up pair is 2024-03-08 and 2024-04-06.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 29.
    - The follow-up also returns 29 despite crossing different month boundaries.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_AFTER_DATE_TIME_TRUNCATION
    category: EDGE
    description: A pair of date-times on adjacent dates but less than 24 elapsed hours
      apart verifies whole-day rather than date-label counting.
    preconditions:
    - startDateInclusive = 2024-06-15T23:30.
    - endDateExclusive = 2024-06-16T00:30.
    - The follow-up is formed by adding 37 days to each endpoint.
    expectedSourceBehavior:
    - DAYS.between returns 0 because the elapsed interval is one hour.
    - The follow-up getAmount() is also 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_TWO_DAY_DATE_TIME
    category: NORMAL
    description: Date-times separated by two exact 24-hour periods exercise a positive
      non-singleton result distinct from date-only construction.
    preconditions:
    - startDateInclusive = 2024-06-15T23:30.
    - endDateExclusive = 2024-06-17T23:30.
    - Both endpoints are shifted by 37 days.
    expectedSourceBehavior:
    - The source returns getAmount() equal to 2.
    - The follow-up returns 2.
    targetCases: 1
    emptyOutputAllowed: false
