InputDomain:
  summary: Valid finite geographic rectangles and points, covering latitude rejection,
    inclusive boundaries, ordinary and dateline-wrapping longitude paths, degenerate
    dimensions, longitude aliases, rotation-induced wrapping changes, and near-world
    widths.
  globalConstraints:
  - The RectangleImpl receiver and Point argument are non-null, as required by generateFollowUp.
  - rectangle.getContext().isGeo() is true; non-geographic contexts are excluded because
    the supplied transformation applies geographic longitude normalization and the
    stated relation is rotation on a globe.
  - The source point is constructed by the rectangle's SpatialContext so both inputs
    use the same geographic coordinate model.
  - All rectangle and point coordinates are finite doubles; NaN and infinities are
    excluded because invalid inputs are not requested and NaN is RectangleImpl's empty
    sentinel.
  - Rectangle and point longitudes are in the inclusive interval [-180, 180], and
    latitudes are in the inclusive interval [-90, 90].
  - The rectangle satisfies minY <= maxY, matching RectangleImpl.reset's asserted
    latitude ordering.
  - The rectangle's raw longitude width maxX - minX is not 360; the valid full-world
    representation (-180, 180) is excluded because independently normalizing both
    rotated endpoints collapses it to a zero-width rectangle, so the supplied follow-up
    transformation does not preserve that input class.
  diversity:
    sourceLongitudeTopology:
    - non-wrapping
    - dateline-wrapping
    - zero-width
    - nearly-full-world
    followUpLongitudeTopology:
    - non-wrapping
    - dateline-wrapping
    - zero-width
    sourceLatitudePosition:
    - below
    - lower-boundary
    - interior
    - upper-boundary
    - above
    - north-pole
    - south-pole
    sourceLongitudePosition:
    - interior
    - minimum-boundary
    - maximum-boundary
    - west-gap
    - east-gap
    - dateline-alias
    expectedRelation:
    - CONTAINS
    - DISJOINT
    longitudeBranch:
    - direct-short-circuit
    - add-360
    - subtract-360
    - post-shift-rejection
  scenarios:
  - id: LATITUDE_ABOVE_MAXIMUM
    category: BOUNDARY
    description: The point is longitudinally inside but lies immediately above the
      rectangle.
    preconditions:
    - Rectangle coordinates are (-20, 20, -10, 10) and point coordinates are (0, 11).
    expectedSourceBehavior:
    - relate returns DISJOINT through the pointY > maxY early return.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_BELOW_MINIMUM
    category: BOUNDARY
    description: The point is longitudinally inside but lies immediately below the
      rectangle.
    preconditions:
    - Rectangle coordinates are (-20, 20, -10, 10) and point coordinates are (0, -11).
    expectedSourceBehavior:
    - relate returns DISJOINT through the pointY < minY early return.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_UPPER_BOUNDARY_INCLUDED
    category: BOUNDARY
    description: The point lies exactly on the rectangle's upper latitude edge.
    preconditions:
    - Rectangle coordinates are (-20, 20, -10, 10) and point coordinates are (0, 10).
    expectedSourceBehavior:
    - relate returns CONTAINS because latitude boundaries are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_LOWER_BOUNDARY_INCLUDED
    category: BOUNDARY
    description: The point lies exactly on the rectangle's lower latitude edge.
    preconditions:
    - Rectangle coordinates are (-20, 20, -10, 10) and point coordinates are (0, -10).
    expectedSourceBehavior:
    - relate returns CONTAINS because latitude boundaries are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_RECTANGLE_MATCH
    category: EDGE
    description: A zero-height rectangle is probed at its sole latitude.
    preconditions:
    - Rectangle coordinates are (-20, 20, 5, 5) and point coordinates are (0, 5).
    expectedSourceBehavior:
    - relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_RECTANGLE_MISS
    category: EDGE
    description: A zero-height rectangle is probed at a different latitude.
    preconditions:
    - Rectangle coordinates are (-20, 20, 5, 5) and point coordinates are (0, 6).
    expectedSourceBehavior:
    - relate returns DISJOINT through the upper-latitude check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTH_POLE_BOUNDARY_INCLUDED
    category: EDGE
    description: The rectangle and point touch the geographic north-pole latitude.
    preconditions:
    - Rectangle coordinates are (-20, 20, 80, 90) and point coordinates are (0, 90).
    expectedSourceBehavior:
