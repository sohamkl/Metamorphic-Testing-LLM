    emptyOutputAllowed: false
  - id: LARGE_FINITE_PRICE_LEVEL
    category: EDGE
    description: The entire pattern is placed at a large finite absolute price level
      while its slope changes remain measurable.
    preconditions:
    - All values and values plus 100 remain finite.
    - At least one candidate exceeds slope and ATR thresholds by a positive margin.
    - At least one pivot is retained.
    expectedSourceBehavior:
    - The result contains finite pivot prices at the large source level.
    - The case stresses the absolute-plus-relative tolerance used by assertTranslated.
