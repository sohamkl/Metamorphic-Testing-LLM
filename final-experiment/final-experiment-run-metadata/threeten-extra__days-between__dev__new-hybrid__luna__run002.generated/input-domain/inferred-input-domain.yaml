InputDomain:
  summary: Domain of non-null Temporal pairs for which ChronoUnit.DAYS.between and
    the MR-generated plus-37-days follow-up both succeed, with results representable
    as int; cases emphasize zero, unit, sign, whole-day, temporal-type, chronology,
    calendar-boundary, and large-gap behavior.
  globalConstraints:
  - Both source endpoints are non-null because both the target invocation and generateFollowUp
    require non-null Temporal values.
  - Each endpoint supports plus(37, ChronoUnit.DAYS) without a date-time overflow
    or unsupported-unit failure, because generateFollowUp applies that operation to
    both endpoints.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) succeeds for the
    source pair and for the shifted pair.
  - The source and follow-up day counts are representable as int because between applies
    Math.toIntExact before constructing Days.
  - Each scenario uses a temporal pair whose chronology and temporal capabilities
    make the DAYS calculation meaningful; unsupported Temporal implementations such
    as a time-only value are not included because the target or the follow-up would
    fail before the relation can be asserted.
  - Successful cases have a non-null Days source output and follow-up output, and
    the observable comparison is sourceOutput.getAmount() == followUpOutput.getAmount().
  diversity:
    temporalType:
    - LocalDate
    - LocalDateTime
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - HijrahDate
    - Instant
    signedGap:
    - negative
    - zero
    - positive
    gapShape:
    - zero days
    - one day
    - two days
    - seven days
    - 37 days
    - 38 days
    - Integer.MAX_VALUE days
    - -Integer.MAX_VALUE days
    - sub-day positive interval
    - sub-day negative interval
    calendarPosition:
    - ordinary date
    - leap-day boundary
    - year boundary
    - near minimum supported date
    - near maximum supported date
    - daylight-saving transition
    - differing fixed offsets
    sourceBranch:
    - Days.of(0) path
    - Days.of(1) path
    - general Days.of(int) path
  scenarios:
  - id: LOCAL_DATE_ZERO_GAP
    category: BOUNDARY
    description: Identical LocalDate endpoints produce the zero-day sentinel result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 15).
    - endDateExclusive is the same LocalDate.of(2024, 1, 15).
    - Both shifted endpoints remain valid LocalDate values.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns 0.
    - Math.toIntExact accepts the result and Days.of(0) returns the zero-day value.
    - sourceOutput.getAmount() is 0.
    - Shifting both endpoints by 37 days leaves the getAmount result equal to 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY
    category: BOUNDARY
    description: Consecutive LocalDate endpoints exercise the one-day sentinel result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 15).
    - endDateExclusive is LocalDate.of(2024, 1, 16).
    - Both shifted endpoints remain valid LocalDate values.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns 1.
    - Days.of(1) returns the one-day value.
    - sourceOutput.getAmount() is 1.
    - The follow-up getAmount is also 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TWO_DAY_FORWARD
    category: NORMAL
    description: A small positive non-sentinel gap exercises the general Days.of path.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 15).
    - endDateExclusive is LocalDate.of(2024, 1, 17).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 2.
    - The follow-up result has the same amount, 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_REVERSE
    category: BOUNDARY
    description: Reversing consecutive dates exercises a negative one-day result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 16).
    - endDateExclusive is LocalDate.of(2024, 1, 15).
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns -1.
    - sourceOutput.getAmount() is -1.
    - The follow-up amount remains -1, preserving direction under the common shift.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_WEEK_GAP
    category: NORMAL
    description: A positive seven-day gap covers a week-sized whole-day interval.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 1).
    - endDateExclusive is LocalDate.of(2024, 2, 8).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 7.
    - The follow-up amount is also 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: The gap crosses the 2024 leap day.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28).
    - endDateExclusive is LocalDate.of(2024, 3, 2).
    - The 2024 leap day is included in the interval while the exclusive end date is
      not.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 3.
    - The shifted pair also produces 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: The gap crosses a calendar year boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 12, 31).
    - endDateExclusive is LocalDate.of(2024, 1, 2).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 2.
    - The common 37-day shift preserves the amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAX_INT_FORWARD
    category: EDGE
    description: The largest positive day count accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive is LocalDate.of(1970, 1, 1).
    - endDateExclusive is startDateInclusive.plusDays(Integer.MAX_VALUE).
    - Both endpoints and both 37-day-shifted endpoints are within LocalDate range.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns Integer.MAX_VALUE.
    - Math.toIntExact succeeds without overflow.
    - sourceOutput.getAmount() is Integer.MAX_VALUE.
    - The follow-up amount is also Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAX_INT_REVERSE
    category: EDGE
    description: The largest-magnitude negative day count accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive is LocalDate.of(1970, 1, 1).plusDays(Integer.MAX_VALUE).
    - endDateExclusive is LocalDate.of(1970, 1, 1).
    - Both endpoints and both shifted endpoints are within LocalDate range.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns -Integer.MAX_VALUE.
    - sourceOutput.getAmount() is -Integer.MAX_VALUE.
    - The follow-up amount remains -Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM
    category: EDGE
    description: A valid pair close to LocalDate.MIN exercises date-range lower-bound
      handling while leaving room for the follow-up shift.
    preconditions:
    - startDateInclusive is LocalDate.MIN.plusDays(37).
    - endDateExclusive is startDateInclusive.plusDays(1).
    - Both shifted endpoints are valid because at least 37 days remain above LocalDate.MIN.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    - The follow-up operation succeeds and its amount is also 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM
    category: EDGE
    description: A valid pair close to LocalDate.MAX exercises date-range upper-bound
      handling while leaving room for the follow-up shift.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(38).
    - endDateExclusive is LocalDate.MAX.minusDays(37).
    - Both shifted endpoints are valid and the follow-up end is LocalDate.MAX.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 1.
    - The shifted pair also produces 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: LocalDateTime endpoints separated by exactly 24 hours exercise date-time
      whole-day calculation.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 5, 1, 12, 30).
    - endDateExclusive is LocalDateTime.of(2024, 5, 2, 12, 30).
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns 1.
    - sourceOutput.getAmount() and the follow-up amount are both 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_FORWARD
    category: BOUNDARY
    description: LocalDateTime endpoints span a calendar-date boundary but less than
      one complete day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 5, 1, 23, 30).
    - endDateExclusive is LocalDateTime.of(2024, 5, 2, 0, 15).
    expectedSourceBehavior:
    - The result is the whole-day value returned by ChronoUnit.DAYS.between for this
      45-minute interval.
    - The follow-up getAmount equals the source getAmount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERING_OFFSETS
    category: EDGE
    description: OffsetDateTime endpoints use different UTC offsets, exercising Temporal
      calculations with offset-bearing values.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-06-01T00:00:00+01:00").
    - endDateExclusive is OffsetDateTime.parse("2024-06-03T00:00:00+03:00").
    - Both shifted endpoints retain their offsets and support plus 37 days.
    expectedSourceBehavior:
    - The source amount is the whole-day value computed by ChronoUnit.DAYS.between
      for the two offset-bearing temporals.
    - The follow-up amount equals the source amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_CROSSING
    category: EDGE
    description: ZonedDateTime endpoints span a daylight-saving transition in a zone
      with date-based plus-days behavior.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-03-29T12:00:00+01:00[Europe/Paris]").
    - endDateExclusive is ZonedDateTime.parse("2024-04-02T12:00:00+02:00[Europe/Paris]").
    - Both endpoints support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The source amount is the whole-day result produced by ChronoUnit.DAYS.between
      across the transition.
    - The common 37-day shift is applied to both zoned values and the follow-up amount
      equals the source amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_UTC_DAYS
    category: NORMAL
    description: Instant endpoints are separated by an exact multiple of 24 hours.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-04T00:00:00Z").
    - Both shifted instants support plus 37 ChronoUnit.DAYS.
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns 3.
    - sourceOutput.getAmount() and the follow-up amount are both 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_REVERSE
    category: BOUNDARY
    description: Reversed Instant endpoints have a negative interval whose magnitude
      is less than one whole day.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-02T00:00:00Z").
    - endDateExclusive is Instant.parse("2024-01-01T12:00:00Z").
    expectedSourceBehavior:
    - The result is the whole-day value returned by ChronoUnit.DAYS.between for the
      negative 12-hour interval.
    - The follow-up amount equals the source amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_FORWARD
    category: NORMAL
    description: JapaneseDate endpoints exercise a non-ISO chronology with a positive
      multi-day gap.
    preconditions:
    - startDateInclusive is JapaneseDate.from(LocalDate.of(2024, 1, 10)).
    - endDateExclusive is JapaneseDate.from(LocalDate.of(2024, 1, 20)).
    - Both JapaneseDate values support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns 10.
    - sourceOutput.getAmount() is 10.
    - The follow-up amount remains 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_REVERSE
    category: NORMAL
    description: HijrahDate endpoints exercise another supported chronology with a
      negative gap.
    preconditions:
    - startDateInclusive is HijrahDate.from(LocalDate.of(2024, 2, 10)).
    - endDateExclusive is HijrahDate.from(LocalDate.of(2024, 2, 1)).
    - Both HijrahDate values support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between returns -9.
    - sourceOutput.getAmount() is -9.
    - The follow-up amount is also -9.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_THIRTY_SEVEN_DAY_SHIFT_ALIGNMENT
    category: NORMAL
    description: The source gap equals the MR shift amount, directly checking that
      translating both endpoints does not collapse or double the interval.
    preconditions:
    - startDateInclusive is LocalDate.of(2025, 1, 1).
    - endDateExclusive is LocalDate.of(2025, 2, 7).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 37.
    - The shifted endpoints are 2025-02-07 and 2025-03-16.
    - The follow-up amount is 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_LARGE_NORMAL_GAP
    category: EDGE
    description: A large but ordinary LocalDateTime gap exercises long-to-int conversion
      away from the one-day and zero-day sentinels.
    preconditions:
    - startDateInclusive is LocalDateTime.of(1900, 1, 1, 6, 0).
    - endDateExclusive is LocalDateTime.of(2100, 1, 1, 6, 0).
    - The day count and both shifted calculations fit in int.
    expectedSourceBehavior:
    - Math.toIntExact succeeds and sourceOutput.getAmount() equals the whole-day count
      returned by ChronoUnit.DAYS.between.
    - The follow-up getAmount equals the source getAmount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_END_ALIGNMENT
    category: BOUNDARY
    description: A gap beginning and ending at month ends exercises variable month
      lengths without relying on a fixed month-to-day conversion.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 31).
    - endDateExclusive is LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 30 because the interval includes February 2024's
      29 days and the remaining day from January.
    - The follow-up amount is 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ZERO_AFTER_SHIFT
    category: BOUNDARY
    description: A zero source gap remains zero after both endpoints are shifted,
      checking the source of(0) branch twice.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 30).
    - endDateExclusive is LocalDate.of(2024, 6, 30).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0 and followUpOutput.getAmount() is 0.
    - Neither output is empty or null.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_WEEK_GAP
    category: NORMAL
    description: A negative seven-day gap checks sign preservation for a non-sentinel
      general result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 8, 8).
    - endDateExclusive is LocalDate.of(2024, 8, 1).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is -7.
    - The follow-up amount is -7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_ZERO_GAP
    category: BOUNDARY
    description: Identical offset-bearing endpoints exercise the zero result for a
      Temporal implementation with an offset.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-07-01T10:15:00+05:30").
    - endDateExclusive is the same OffsetDateTime.
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 0.
    - The follow-up amount is 0 after both values are shifted by 37 days.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_YEAR_BOUNDARY
    category: BOUNDARY
    description: ZonedDateTime endpoints cross a year boundary without crossing a
      daylight-saving transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2023-12-30T09:00:00+01:00[Europe/Paris]").
    - endDateExclusive is ZonedDateTime.parse("2024-01-03T09:00:00+01:00[Europe/Paris]").
    expectedSourceBehavior:
    - sourceOutput.getAmount() is 4.
    - The common shift preserves the amount at 4.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_EXACT_DAY
    category: NORMAL
    description: LocalDateTime endpoints are exactly one day apart in reverse order.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 9, 2, 8, 45).
    - endDateExclusive is LocalDateTime.of(2024, 9, 1, 8, 45).
    expectedSourceBehavior:
    - sourceOutput.getAmount() is -1.
    - The follow-up amount is -1.
    targetCases: 1
    emptyOutputAllowed: false
