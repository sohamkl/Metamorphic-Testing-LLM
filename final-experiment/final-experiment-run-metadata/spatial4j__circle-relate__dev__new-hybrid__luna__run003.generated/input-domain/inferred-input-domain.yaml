InputDomain:
  summary: Finite, non-geographic CircleImpl and Rectangle inputs constructed in the
    same flat SpatialContext, emphasizing empty-shape sentinels, enclosing-box relations,
    distance boundaries, axis-placement branches, degenerate rectangles, and all observable
    SpatialRelation results under the fixed common translation.
  globalConstraints:
  - Use one non-null flat (non-geographic) SpatialContext for the circle, source rectangle,
    and follow-up shapes.
  - For non-empty inputs, circle-center coordinates, rectangle bounds, and radius
    are finite doubles; radius is non-negative.
  - For non-empty rectangles, minX <= maxX and minY <= maxY; zero-width and zero-height
    rectangles are included.
  - The follow-up must be generated exactly by adding SHIFT_X = 17.5 to both X coordinates
    and SHIFT_Y = -9.25 to both Y coordinates, without changing the radius or context.
  - Choose finite non-empty coordinates so both translated shapes remain valid in
    the flat context.
  - Empty circle and empty rectangle sentinels are included only when represented
    by the supplied shape API's isEmpty() state; no null input is used because generateFollowUp
    requires non-null arguments.
  - No geodetic antimeridian, pole, world-wrap, or geodetic farthest-Y case is included
    because the SUT is specified to use a flat non-geographic SpatialContext.
  diversity:
    relationOutcome:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
    circleRadiusClass:
    - zero
    - positive-small
    - positive-large
    circleCenterAgainstRectangleX:
    - left-of
    - on-min-edge
    - inside
    - on-max-edge
    - right-of
    circleCenterAgainstRectangleY:
    - below
    - on-min-edge
    - inside
    - on-max-edge
    - above
    enclosingBoxRelationToRectangle:
    - DISJOINT
    - WITHIN
    - equal-CONTAINS-identity
    - INTERSECTS
    - CONTAINS
    phase2ClosestPointCondition:
    - both-axes-separated
    - X-axis-spanned
    - Y-axis-spanned
    - circle-boundary
    - circle-interior
    rectangleShape:
    - area-rectangle
    - vertical-degenerate
    - horizontal-degenerate
    - point-degenerate
    emptiness:
    - non-empty-circle-and-rectangle
    - empty-circle
    - empty-rectangle
    translationInvariantProperty:
    - source-relation-equals-follow-up-relation
  scenarios:
  - id: EMPTY_CIRCLE_SENTINEL
    category: EDGE
    description: The circle's center is empty, so CircleImpl.isEmpty() is true, while
      the rectangle is non-empty.
    preconditions:
    - circle.getCenter().isEmpty() is true.
    - rectangle.isEmpty() is false.
    expectedSourceBehavior:
    - relate(Rectangle) returns DISJOINT through the isEmpty() shortcut before enclosing-box
      processing.
    - The follow-up circle remains empty after the supplied coordinate translation
      and the follow-up relation is also DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RECTANGLE_SENTINEL
    category: EDGE
    description: The circle is non-empty and the rectangle is an API-defined empty
      rectangle.
    preconditions:
    - circle.isEmpty() is false.
    - rectangle.isEmpty() is true.
    expectedSourceBehavior:
    - relate(Rectangle) returns DISJOINT through the other.isEmpty() shortcut.
    - The translated rectangle remains empty under the supplied follow-up construction
      and the follow-up relation is DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT
    category: BOUNDARY
    description: 'A zero-radius circle is separated from a rectangle: circle center
      (0,0), radius 0, rectangle [2,3] x [2,3], with a second case using rectangle
      [-3,-2] x [-3,-2].'
    preconditions:
    - radiusDEG == 0.0.
    - The rectangle does not contain or touch the center.
    - The circle enclosing box and rectangle are DISJOINT.
    expectedSourceBehavior:
    - The enclosing-box shortcut returns DISJOINT.
    - The translated source and follow-up relations are both DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_WITHIN_RECTANGLE
    category: BOUNDARY
    description: 'A zero-radius circle lies inside a positive-area rectangle: center
      (0,0), radius 0, with rectangles [-2,2] x [-2,2] and [-1,1] x [-3,3].'
    preconditions:
    - radiusDEG == 0.0.
    - The rectangle strictly contains the circle's enclosing point box.
    - enclosingBox.relate(rectangle) is WITHIN.
    expectedSourceBehavior:
    - relate(Rectangle) returns WITHIN from the enclosing-box shortcut.
    - The follow-up relation remains WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_LEFT_BELOW
    category: NORMAL
    description: The rectangle is separated from the circle's enclosing box on both
      axes, with the circle center left of and below the rectangle.
    preconditions:
    - Use circle center (0,0), radius 1, and rectangles [3,4] x [3,4] and [4,5] x
      [1.5,2.5].
    - enclosingBox.relate(rectangle) is DISJOINT.
    expectedSourceBehavior:
    - relate(Rectangle) returns DISJOINT without entering relateRectanglePhase2.
    - The follow-up relation is DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_RIGHT_ABOVE
    category: NORMAL
    description: The rectangle is separated from the circle's enclosing box on both
      axes, with the circle center right of and above the rectangle.
    preconditions:
    - Use circle center (0,0), radius 1, and rectangles [-4,-3] x [-4,-3] and [-5,-4]
      x [-2.5,-1.5].
    - enclosingBox.relate(rectangle) is DISJOINT.
    expectedSourceBehavior:
    - relate(Rectangle) returns DISJOINT through the bounding-box shortcut.
    - The follow-up relation is DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_STRICT
    category: NORMAL
    description: The circle's enclosing box is strictly inside the rectangle.
    preconditions:
    - Use circle center (0,0), radius 2, and rectangles [-3,3] x [-3,3] and [-4,4]
      x [-2.5,2.5].
    - enclosingBox.relate(rectangle) is WITHIN.
    expectedSourceBehavior:
    - relate(Rectangle) returns WITHIN without entering phase 2.
    - The follow-up relation remains WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_EQUALS_RECTANGLE_IDENTITY
    category: EDGE
    description: The rectangle exactly equals the circle's calculated enclosing box.
    preconditions:
    - Use a center and radius for which the non-geographic distance calculator produces
      a finite box, and construct the rectangle with exactly that box's minX, maxX,
      minY, and maxY.
    - enclosingBox.equals(rectangle) is true and enclosingBox.relate(rectangle) is
      CONTAINS.
    expectedSourceBehavior:
    - The identity edge-case returns WITHIN.
    - The translated shapes also have equal enclosing-box and rectangle coordinates,
      so the follow-up relation is WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PHASE2_DISJOINT_CORNER
    category: BOUNDARY
    description: The enclosing boxes intersect or touch, but the rectangle's closest
      corner lies outside the circle.
    preconditions:
    - Use circle center (0,0), radius 2, and rectangles [2,3] x [2,3] and [-3,-2]
      x [2,3].
    - enclosingBox.relate(rectangle) is not DISJOINT and not WITHIN.
    - The circle center is outside the rectangle on both axes and the closest corner
      has distance greater than radius.
    expectedSourceBehavior:
    - Phase 2 returns DISJOINT after testing contains(closestX, closestY).
    - The follow-up relation remains DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PHASE2_INTERSECTS_X_AXIS_SPANNED
    category: NORMAL
    description: The rectangle spans the circle center's X axis but is separated in
      Y, and it cuts the circle without being contained by it.
    preconditions:
    - Use center (0,0), radius 2, and rectangles [-1,3] x [1.5,3] and [-3,1] x [-3,-1.5].
    - The X-axis branch selects closestX equal to the circle X axis.
    - bboxSect is INTERSECTS and the shapes overlap.
    expectedSourceBehavior:
    - Phase 2 cannot classify the shapes as DISJOINT because one axis is spanned.
    - Because bboxSect is not CONTAINS, the result is INTERSECTS.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PHASE2_INTERSECTS_Y_AXIS_SPANNED
    category: NORMAL
    description: The rectangle spans the circle center's Y axis but is separated in
      X, producing the complementary axis-placement path.
    preconditions:
    - Use center (0,0), radius 2, and rectangles [1.5,3] x [-1,3] and [-3,-1.5] x
      [-3,1].
    - The Y-axis branch selects closestY equal to the circle Y axis.
    - bboxSect is INTERSECTS.
    expectedSourceBehavior:
    - Phase 2 reaches the non-CONTAINS result path and returns INTERSECTS.
    - The follow-up relation is INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: TANGENT_TO_RECTANGLE_CORNER
    category: BOUNDARY
    description: A circle is tangent to a rectangle corner without containing the
      rectangle.
    preconditions:
    - Use center (0,0), radius 1, and rectangle [0.6,1] x [0.8,1.2], with a second
      case reflected into the negative quadrant.
    - The closest corner is exactly at distance 1 from the center, subject to the
      chosen finite coordinates.
    - bboxSect is not DISJOINT and not WITHIN.
    expectedSourceBehavior:
    - The closest-point containment test treats the boundary as intersecting rather
      than disjoint.
    - relate(Rectangle) returns INTERSECTS.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RECTANGLE_CONTAINED_BY_CIRCLE
    category: NORMAL
    description: The circle contains a positive-area rectangle, and every rectangle
      corner is inside the circle.
    preconditions:
    - Use center (0,0), radius 5, and rectangles [-2,2] x [-2,2] and [-3,1] x [-1,3].
    - bboxSect is CONTAINS.
    - The farthest rectangle corner and the other relevant corners are within the
      circle.
    expectedSourceBehavior:
    - Phase 2 passes the farthest-point test and returns CONTAINS.
    - The follow-up relation remains CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_CORNER_ESCAPES
    category: NORMAL
    description: The circle's enclosing box contains the rectangle, but a rectangle
      corner is outside the circle.
    preconditions:
    - Use center (0,0), radius 2, and rectangles [-1.5,1.5] x [-1.5,1.5] and [-1.8,1.0]
      x [-1.0,1.8].
    - bboxSect is CONTAINS.
    - At least one farthest rectangle corner is outside the circle.
    expectedSourceBehavior:
    - Phase 2 returns INTERSECTS after the farthest-point containment test fails.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CENTER_ON_RECTANGLE_MIN_X
    category: BOUNDARY
    description: The circle center lies exactly on the rectangle's minimum-X edge
      while the rectangle crosses the center in Y.
    preconditions:
    - Use center (0,0), radius 2, and rectangles [0,2] x [-1,1] and [0,3] x [-0.5,0.5].
    - circle.getXAxis() == rectangle.getMinX().
    - The source enters the X-axis else branch because the comparison is strict less-than.
    expectedSourceBehavior:
    - The result is INTERSECTS for both cases because the rectangle overlaps the circle
      but is not contained by it.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CENTER_ON_RECTANGLE_MAX_X
    category: BOUNDARY
    description: The circle center lies exactly on the rectangle's maximum-X edge
      while the rectangle crosses the center in Y.
    preconditions:
    - Use center (0,0), radius 2, and rectangles [-2,0] x [-1,1] and [-3,0] x [-0.5,0.5].
    - circle.getXAxis() == rectangle.getMaxX().
    - The source uses the X-axis else branch because the comparison is strict greater-than.
    expectedSourceBehavior:
    - The result is INTERSECTS.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CENTER_ON_RECTANGLE_MIN_Y
    category: BOUNDARY
    description: The circle center lies exactly on the rectangle's minimum-Y edge
      while the rectangle crosses the center in X.
    preconditions:
    - Use center (0,0), radius 2, and rectangles [-1,1] x [0,2] and [-0.5,0.5] x [0,3].
    - circle.getYAxis() == rectangle.getMinY().
    expectedSourceBehavior:
    - The Y-axis else branch is selected and the overlapping result is INTERSECTS.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CENTER_ON_RECTANGLE_MAX_Y
    category: BOUNDARY
    description: The circle center lies exactly on the rectangle's maximum-Y edge
      while the rectangle crosses the center in X.
    preconditions:
    - Use center (0,0), radius 2, and rectangles [-1,1] x [-2,0] and [-0.5,0.5] x
      [-3,0].
    - circle.getYAxis() == rectangle.getMaxY().
    expectedSourceBehavior:
    - The Y-axis else branch is selected and the overlapping result is INTERSECTS.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: VERTICAL_DEGENERATE_RECTANGLE_INSIDE
    category: EDGE
    description: A zero-width rectangle is a line segment contained by a circle.
    preconditions:
    - Use center (0,0), radius 3, and rectangles [1,1] x [-1,1] and [-2,-2] x [-1,1].
    - bboxSect is CONTAINS and both segment endpoints are within the circle.
    expectedSourceBehavior:
    - Phase 2 returns CONTAINS for the degenerate rectangle.
    - The follow-up relation remains CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: HORIZONTAL_DEGENERATE_RECTANGLE_INTERSECTS
    category: EDGE
    description: A zero-height rectangle crosses the circle boundary and is not fully
      contained.
    preconditions:
    - Use center (0,0), radius 2, and rectangles [-2.5,2.5] x [0.5,0.5] and [-1,3]
      x [-0.5,-0.5].
    - The rectangle has zero height and at least one endpoint is outside the circle.
    expectedSourceBehavior:
    - The result is INTERSECTS rather than CONTAINS.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POINT_DEGENERATE_RECTANGLE_AT_CENTER
    category: EDGE
    description: The rectangle degenerates to the circle center.
    preconditions:
    - Use center (0,0), radius 2, and rectangle [0,0] x [0,0].
    - The rectangle is non-empty according to the rectangle API and its point is inside
      the circle.
    expectedSourceBehavior:
    - The enclosing box contains the degenerate rectangle and phase 2 returns CONTAINS.
    - The follow-up relation remains CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_DEGENERATE_RECTANGLE_OUTSIDE
    category: EDGE
    description: The rectangle degenerates to a point outside the circle but remains
      close enough for enclosing-box processing to be exercised.
    preconditions:
    - Use center (0,0), radius 2, and rectangle [2,2] x [2,2], with the point selected
      on or outside the circle boundary according to the desired boundary case.
    - The rectangle is non-empty and the source reaches the closest-point test.
    expectedSourceBehavior:
    - The source result is DISJOINT when the degenerate point is outside the circle.
    - The follow-up relation is DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_STRADDLING_CIRCLE_AXIS
    category: NORMAL
    description: The rectangle contains the circle center in both axes but is too
      narrow or short to contain the whole circle.
    preconditions:
    - Use center (0,0), radius 3, and rectangles [-1,1] x [-4,4] and [-4,4] x [-1,1].
    - bboxSect is INTERSECTS rather than CONTAINS.
    - The rectangle spans at least one circle axis and does not contain the enclosing
      box.
    expectedSourceBehavior:
    - The source result is INTERSECTS.
    - The follow-up relation remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_COORDINATE_TRANSLATION
    category: NORMAL
    description: A non-empty circle and rectangle use large finite translated coordinates
      while preserving a simple containment relation.
    preconditions:
    - Use center (1000000, -1000000), radius 10, and rectangles [999980,1000020] x
      [-1000020,-999980] and [999995,1000005] x [-1000005,-999995].
    - The first rectangle strictly contains the circle's enclosing box; the second
      is contained by the circle.
    expectedSourceBehavior:
    - The two source cases return WITHIN and CONTAINS respectively.
    - Adding the fixed shift does not change either relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEAR_ZERO_FINITE_COORDINATES
    category: BOUNDARY
    description: Inputs use finite subnormal-scale or very small ordinary coordinates
      to exercise comparisons without relying on NaN or infinity.
    preconditions:
    - Use finite coordinates near zero, a positive finite radius, and rectangles with
      explicitly ordered bounds.
    - Choose one case with enclosingBox.relate(rectangle) DISJOINT and one with CONTAINS.
    expectedSourceBehavior:
    - The source reaches the corresponding bounding-box shortcut or phase-2 result
      without empty-shape classification.
    - The follow-up relation equals the source relation in each case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ALL_RELATION_RESULTS_TRANSLATION_CHECK
    category: NORMAL
    description: A balanced set contains one independently constructed source case
      for each of DISJOINT, WITHIN, INTERSECTS, and CONTAINS.
    preconditions:
    - Use four non-empty finite cases selected from the preceding geometric constraints,
      one for each source relation.
    - Every case uses the same flat context for circle and rectangle and remains valid
      after the fixed shift.
    expectedSourceBehavior:
    - The source outputs collectively cover all four SpatialRelation enum values returned
      by relate(Rectangle).
    - For every case, assertRelation(sourceOutput, followUpOutput) succeeds by observing
      identical enum identity.
    targetCases: 4
    emptyOutputAllowed: false
