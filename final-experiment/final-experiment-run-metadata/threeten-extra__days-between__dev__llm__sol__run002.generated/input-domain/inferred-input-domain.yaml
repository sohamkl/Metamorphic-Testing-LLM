InputDomain:
  summary: Non-null, mutually compatible Temporal endpoint pairs for which both the
    source and 37-day-shifted invocations complete and produce an int-representable
    whole-day count.
  globalConstraints:
  - Both source endpoints must be non-null, as generateFollowUp rejects null endpoints
    and assertRelation requires actual Days outputs.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) must complete normally
    and return a value in the inclusive range -2147483648 through 2147483647, because
    Days.between applies Math.toIntExact.
  - Each endpoint must support plus(37, ChronoUnit.DAYS), and the shifted value must
    remain within that Temporal implementation's representable range.
  - ChronoUnit.DAYS.between on the two shifted endpoints must also complete normally
    and return an int-representable value so that a follow-up Days output exists.
  - Endpoints must use mutually compatible Temporal representations for ChronoUnit.DAYS.between;
    scenarios use the same concrete temporal family and, for chronology-backed values,
    the same chronology.
  - Zoned temporal endpoint pairs must use the same ZoneId. Otherwise independent
    calendar-day shifts and the first endpoint's zone conversion need not represent
    a common translation, which is outside the supplied shift-invariance relation.
  - Invalid inputs, unsupported DAYS operations, nulls, source overflow, and follow-up
    range overflow are excluded because the supplied relation compares two non-null
    Days outputs and does not request exception behavior.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - same-zone ZonedDateTime
    - non-ISO chronology-backed date
    sourceAmountClass:
    - zero
    - one
    - negativeOne
    - positiveGeneral
    - negativeGeneral
    - integerMaximum
    - integerMinimum
    calendarCondition:
    - ordinaryDate
    - monthBoundary
    - yearBoundary
    - leapDay
    - nonLeapFebruary
    - centuryLeapRule
    - representableRangeBoundary
    timeCondition:
    - dateOnly
    - exactWholeDay
    - positivePartialDay
    - negativePartialDay
    - nanosecondBelowWholeDay
    zoneCondition:
    - noZone
    - UTC
    - fixedEqualOffset
    - fixedDifferentOffsets
    - springDST
    - autumnDST
    - overlap
    - gapAdjacent
  scenarios:
  - id: LOCAL_DATE_EQUAL_ENDPOINTS_ZERO
    category: EDGE
    description: Both endpoints are the same ordinary LocalDate.
    preconditions:
    - startDateInclusive equals endDateExclusive and both equal 2024-06-15.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_SENTINEL
    category: NORMAL
    description: The end LocalDate is exactly one day after the start.
    preconditions:
    - startDateInclusive is 2024-06-15 and endDateExclusive is 2024-06-16.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_REVERSED_ONE_DAY
    category: EDGE
    description: The end LocalDate is exactly one day before the start.
    preconditions:
    - startDateInclusive is 2024-06-16 and endDateExclusive is 2024-06-15.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_POSITIVE_GENERAL_GAP
    category: NORMAL
    description: Ordinary LocalDates have a positive multi-day gap distinct from the
      MR shift.
    preconditions:
    - startDateInclusive is 2024-04-01 and endDateExclusive is 2024-05-07.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 36.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_GAP_EQUALS_SHIFT
    category: NORMAL
    description: The source gap itself is exactly the 37-day transformation distance.
    preconditions:
    - startDateInclusive is 2024-04-01 and endDateExclusive is 2024-05-08.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEGATIVE_GENERAL_GAP
    category: NORMAL
    description: Reversed ordinary LocalDates have a negative gap equal in magnitude
      to the MR shift.
    preconditions:
    - startDateInclusive is 2024-05-08 and endDateExclusive is 2024-04-01.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_INCLUDED
    category: BOUNDARY
    description: The interval crosses February 29 in a leap year.
    preconditions:
    - startDateInclusive is 2024-02-28 and endDateExclusive is 2024-03-01.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: The analogous interval crosses February in a non-leap year.
    preconditions:
    - startDateInclusive is 2023-02-28 and endDateExclusive is 2023-03-01.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_VARIABLE_MONTH_LENGTH
    category: BOUNDARY
    description: The interval runs from the last day of January through leap-year
      February.
    preconditions:
    - startDateInclusive is 2024-01-31 and endDateExclusive is 2024-02-29.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: Consecutive LocalDates lie in different calendar years.
    preconditions:
    - startDateInclusive is 2023-12-31 and endDateExclusive is 2024-01-01.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_CENTURY_NON_LEAP
    category: BOUNDARY
    description: The interval exercises the non-leap century year 1900.
    preconditions:
    - startDateInclusive is 1900-02-28 and endDateExclusive is 1900-03-01.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_CENTURY_LEAP
    category: BOUNDARY
    description: The interval exercises the leap century year 2000.
    preconditions:
    - startDateInclusive is 2000-02-28 and endDateExclusive is 2000-03-01.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAXIMUM_RESULT
    category: BOUNDARY
    description: The LocalDate separation is the largest value accepted by Math.toIntExact.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) equals 2147483647.
    - Both LocalDates and both values shifted forward by 37 days are representable.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MINIMUM_RESULT
    category: BOUNDARY
    description: The reversed LocalDate separation is the smallest value accepted
      by Math.toIntExact.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) equals -2147483648.
    - Both LocalDates and both values shifted forward by 37 days are representable.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_UPPER_SHIFT_HEADROOM
    category: BOUNDARY
    description: Shifting the end reaches LocalDate.MAX exactly.
    preconditions:
    - startDateInclusive is LocalDate.MAX minus 38 days.
    - endDateExclusive is LocalDate.MAX minus 37 days.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LOWER_REPRESENTABLE_BOUNDARY
    category: BOUNDARY
    description: The source starts at LocalDate.MIN while retaining forward-shift
      headroom.
    preconditions:
    - startDateInclusive is LocalDate.MIN.
    - endDateExclusive is the LocalDate one day after LocalDate.MIN.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_IDENTICAL
    category: EDGE
    description: Identical LocalDateTime endpoints exercise the zero result with time
      fields present.
    preconditions:
    - Both endpoints are 2024-06-15T10:30:45.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_PARTIAL_DAY
    category: EDGE
    description: The end is later but less than one complete day after the start.
    preconditions:
    - startDateInclusive is 2024-06-15T12:00 and endDateExclusive is 2024-06-16T11:59.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: LocalDateTime endpoints are exactly 24 hours apart.
    preconditions:
    - startDateInclusive is 2024-06-15T12:00 and endDateExclusive is 2024-06-16T12:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NANO_BELOW_DAY
    category: BOUNDARY
    description: The interval is one nanosecond short of one complete day.
    preconditions:
    - startDateInclusive is 2024-06-15T12:00:00.000000000.
    - endDateExclusive is 2024-06-16T11:59:59.999999999.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_DAY_PLUS_NANO
    category: BOUNDARY
    description: The interval is one complete day plus one nanosecond.
    preconditions:
    - startDateInclusive is 2024-06-15T12:00:00.000000000.
    - endDateExclusive is 2024-06-16T12:00:00.000000001.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_PARTIAL_DAY
    category: EDGE
    description: The end is earlier by less than one complete day.
    preconditions:
    - startDateInclusive is 2024-06-16T12:00 and endDateExclusive is 2024-06-15T12:01.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_EXACT_DAY
    category: EDGE
    description: The end is exactly one complete day before the start.
    preconditions:
    - startDateInclusive is 2024-06-16T12:00 and endDateExclusive is 2024-06-15T12:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_LEAP_BOUNDARY
    category: BOUNDARY
    description: A whole-day LocalDateTime interval crosses February 29.
    preconditions:
    - startDateInclusive is 2024-02-28T23:30 and endDateExclusive is 2024-03-01T23:30.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_IDENTICAL
    category: EDGE
    description: Identical Instants produce no complete elapsed days.
    preconditions:
    - Both endpoints are 2024-01-01T00:00:00Z.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_86400_SECONDS
    category: NORMAL
    description: Instants differ by exactly one standard 86400-second day.
    preconditions:
    - startDateInclusive is 2024-01-01T00:00:00Z and endDateExclusive is 2024-01-02T00:00:00Z.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_ONE_NANO_BELOW_DAY
    category: BOUNDARY
    description: Instant elapsed time is one nanosecond below a complete day.
    preconditions:
    - startDateInclusive is 2024-01-01T00:00:00Z.
    - endDateExclusive is 2024-01-01T23:59:59.999999999Z.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_ONE_NANO_ABOVE_DAY
    category: BOUNDARY
    description: Instant elapsed time is one complete day plus one nanosecond.
    preconditions:
    - startDateInclusive is 2024-01-01T00:00:00Z.
    - endDateExclusive is 2024-01-02T00:00:00.000000001Z.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_PARTIAL_DAY
    category: EDGE
    description: The end Instant is less than one complete day before the start.
    preconditions:
    - startDateInclusive is 2024-01-02T00:00:00Z and endDateExclusive is 2024-01-01T00:00:00.000000001Z.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_EXACT_DAY
    category: EDGE
    description: The end Instant is exactly one standard day before the start.
    preconditions:
    - startDateInclusive is 2024-01-02T00:00:00Z and endDateExclusive is 2024-01-01T00:00:00Z.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_MULTI_DAY_WITH_REMAINDER
    category: NORMAL
    description: Elapsed instant time contains several whole days and a sub-day remainder.
    preconditions:
    - startDateInclusive is 2024-01-01T00:00:00Z and endDateExclusive is 2024-01-04T12:00:00Z.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EQUAL_OFFSET
    category: NORMAL
    description: OffsetDateTime endpoints use the same non-UTC fixed offset.
    preconditions:
    - startDateInclusive is 2024-01-01T08:00+05:30.
    - endDateExclusive is 2024-01-03T08:00+05:30.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_PARTIAL_DAY
    category: EDGE
    description: Different fixed offsets make consecutive local dates less than one
      complete day apart.
    preconditions:
    - startDateInclusive is 2024-01-01T00:00+00:00.
    - endDateExclusive is 2024-01-02T00:00+02:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_OVER_DAY
    category: EDGE
    description: Different fixed offsets make consecutive local dates more than one
      complete day apart.
    preconditions:
    - startDateInclusive is 2024-01-01T00:00+02:00.
    - endDateExclusive is 2024-01-02T00:00+01:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EXTREME_OFFSETS_ZERO
    category: BOUNDARY
    description: Equal local date-times at the minimum and maximum supported offsets
      represent a reversed partial interval.
    preconditions:
    - startDateInclusive is 2024-06-15T12:00+18:00.
    - endDateExclusive is 2024-06-15T12:00-18:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_REVERSED_OFFSETS
    category: EDGE
    description: Reversed endpoints and unequal offsets produce a negative whole-day
      count.
    preconditions:
    - startDateInclusive is 2024-01-03T00:00+00:00.
    - endDateExclusive is 2024-01-01T00:00+02:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_DAY
    category: BOUNDARY
    description: Same-zone noon endpoints straddle a spring daylight-saving transition.
    preconditions:
    - Both endpoints use America/New_York.
    - startDateInclusive has local date-time 2024-03-09T12:00 and endDateExclusive
      has local date-time 2024-03-10T12:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1 despite the offset transition.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_DST_DAY
    category: BOUNDARY
    description: Same-zone noon endpoints straddle an autumn daylight-saving transition.
    preconditions:
    - Both endpoints use America/New_York.
    - startDateInclusive has local date-time 2024-11-02T12:00 and endDateExclusive
      has local date-time 2024-11-03T12:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1 despite the offset transition.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_GAP_ADJACENT_PARTIAL_DAY
    category: EDGE
    description: Same-zone endpoints lie on opposite sides of the spring gap but on
      the same local date.
    preconditions:
    - Both endpoints use America/New_York.
    - startDateInclusive has local date-time 2024-03-10T01:30 and endDateExclusive
      has local date-time 2024-03-10T03:30.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_OVERLAP_OCCURRENCES
    category: EDGE
    description: Endpoints select the two occurrences of the same local time during
      an autumn overlap.
    preconditions:
    - Both endpoints use America/New_York.
    - Both have local date-time 2024-11-03T01:30, with the start using the earlier
      offset and the end using the later offset.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 0 because no complete calendar
      day separates the local date-times.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_MULTI_MONTH_DST_SPAN
    category: NORMAL
    description: A same-zone interval spans multiple months and a daylight-saving
      transition.
    preconditions:
    - Both endpoints use America/New_York.
    - startDateInclusive has local date-time 2024-01-15T09:00 and endDateExclusive
      has local date-time 2024-05-15T09:00.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 121.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_BOUNDARY
    category: BOUNDARY
    description: Same-chronology Japanese dates are consecutive across the 2019 era
      boundary.
    preconditions:
    - Both endpoints are Japanese chronology-backed dates.
    - They correspond to ISO dates 2019-04-30 and 2019-05-01 respectively.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: Consecutive Hijrah chronology dates cross a chronology month boundary.
    preconditions:
    - Both endpoints use the same Hijrah chronology.
    - endDateExclusive is the chronology date exactly one day after startDateInclusive
      and has a different month.
    - Both endpoints have at least 37 days of forward representable range.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_LEAP_CROSSING
    category: BOUNDARY
    description: Thai Buddhist chronology dates span the leap day corresponding to
      ISO year 2024.
    preconditions:
    - Both endpoints use the Thai Buddhist chronology.
    - They correspond to ISO dates 2024-02-28 and 2024-03-01 respectively.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_NEGATIVE_GAP
    category: EDGE
    description: Same-chronology Minguo dates are supplied in reverse order.
    preconditions:
    - Both endpoints use the Minguo chronology.
    - endDateExclusive is exactly 10 chronology days before startDateInclusive.
    - Both endpoints have at least 37 days of forward representable range.
    expectedSourceBehavior:
    - Days.between returns a Days whose getAmount() is -10.
    targetCases: 1
    emptyOutputAllowed: false
