InputDomain:
  summary: Non-null, day-capable Java Temporal endpoint pairs for which both the source
    invocation and the MR's 37-day-shifted invocation complete with an int-representable
    whole-day count.
  globalConstraints:
  - Both source arguments are non-null Temporal instances, as required by generateFollowUp.
  - Each endpoint supports plus(37, ChronoUnit.DAYS) without DateTimeException, UnsupportedTemporalTypeException,
    or arithmetic/range overflow.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) completes for both
    the source pair and the independently shifted pair.
  - Each source and follow-up DAYS.between result is within [-2147483648, 2147483647],
    because Days.between applies Math.toIntExact before returning Days.
  - Endpoint pairs that throw because their Temporal types cannot be converted or
    compared by DAYS are excluded because the supplied MR asserts only over two returned
    Days values and does not request invalid inputs.
  - Temporals that cannot be shifted by DAYS, including time-only and coarser-than-day
    standard temporal types, are excluded because generateFollowUp would not produce
    a follow-up input.
  - The concrete standard-Java coverage set is LocalDate, LocalDateTime, OffsetDateTime,
    ZonedDateTime, Instant, JapaneseDate, HijrahDate, MinguoDate, and ThaiBuddhistDate;
    arbitrary user-defined Temporal implementations are excluded because their unsupported
    or stateful semantics cannot be inferred from the supplied API and source.
  diversity:
    temporalFamily:
    - LocalDate
    - LocalDateTime
    - OffsetDateTime
    - ZonedDateTime
    - Instant
    - JapaneseDate
    - HijrahDate
    - MinguoDate
    - ThaiBuddhistDate
    - compatibleMixedTypes
    resultSign:
    - negative
    - zero
    - positive
    DaysFactoryPath:
    - ZERO_for_0
    - ONE_for_1
    - new_Days_for_other_values
    magnitude:
    - subDayTruncation
    - oneDay
    - multiDay
    - Integer_MIN_VALUE
    - Integer_MAX_VALUE
    calendarFeature:
    - ordinaryDate
    - monthBoundary
    - yearBoundary
    - leapDay
    - prolepticYear
    - chronologyBoundary
    clockFeature:
    - exactWholeDay
    - positiveFractionalDay
    - negativeFractionalDay
    - nanosecondBoundary
    zoneFeature:
    - fixedOffset
    - equalInstantDifferentOffset
    - springDSTGap
    - autumnDSTOverlap
    - skippedCivilDate
    - crossZoneDifferentDSTSchedules
    direction:
    - endAfterStart
    - equalEndpoints
    - endBeforeStart
  scenarios:
  - id: LOCAL_DATE_EQUAL_ZERO_SENTINEL
    category: EDGE
    description: Equal LocalDate endpoints exercise the zero-day result and Days.ZERO
      factory path.
    preconditions:
    - startDateInclusive = 2024-06-15 and endDateExclusive = 2024-06-15.
    expectedSourceBehavior:
    - Days.between returns a non-null Days whose getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FORWARD_ONE_SENTINEL
    category: BOUNDARY
    description: Adjacent increasing LocalDate endpoints exercise the Days.ONE factory
      path.
    preconditions:
    - startDateInclusive = 2024-06-15 and endDateExclusive = 2024-06-16.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_REVERSE_ONE
    category: BOUNDARY
    description: Adjacent decreasing LocalDate endpoints produce a negative directed
      amount.
    preconditions:
    - startDateInclusive = 2024-06-16 and endDateExclusive = 2024-06-15.
    expectedSourceBehavior:
    - The returned getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_DAY_FORWARD
    category: NORMAL
    description: An ordinary positive LocalDate interval exercises non-singleton Days
      construction.
    preconditions:
    - startDateInclusive = 2024-04-03 and endDateExclusive = 2024-05-11.
    expectedSourceBehavior:
    - The returned getAmount() is 38.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_FORWARD
    category: BOUNDARY
    description: A forward interval crosses February 29 in a leap year.
    preconditions:
    - startDateInclusive = 2024-02-28 and endDateExclusive = 2024-03-01.
    expectedSourceBehavior:
    - The returned getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_REVERSE
    category: BOUNDARY
    description: A reverse interval crosses February 29 and checks negative leap-day
      counting.
    preconditions:
    - startDateInclusive = 2024-03-01 and endDateExclusive = 2024-02-28.
    expectedSourceBehavior:
    - The returned getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: A one-day interval crosses an ordinary calendar-year boundary.
    preconditions:
    - startDateInclusive = 2023-12-31 and endDateExclusive = 2024-01-01.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_PROLEPTIC_ERA_BOUNDARY
    category: EDGE
    description: The endpoints cross from proleptic year -1 into year 0.
    preconditions:
    - startDateInclusive = -0001-12-31 and endDateExclusive = 0000-01-01.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAX_RESULT
    category: BOUNDARY
    description: The largest positive amount representable by Days is produced.
    preconditions:
    - startDateInclusive = LocalDate.of(0, 1, 1).
    - endDateExclusive = startDateInclusive.plusDays(2147483647).
    expectedSourceBehavior:
    - The returned getAmount() is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MIN_RESULT
    category: BOUNDARY
    description: The most negative amount representable by Days is produced.
    preconditions:
    - startDateInclusive = LocalDate.of(0, 1, 1).
    - endDateExclusive = startDateInclusive.plusDays(-2147483648L).
    expectedSourceBehavior:
    - The returned getAmount() is Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_UPPER_SHIFT_LIMIT
    category: BOUNDARY
    description: Both equal endpoints are exactly 37 days below LocalDate.MAX, so
      the follow-up reaches LocalDate.MAX.
    preconditions:
    - startDateInclusive = endDateExclusive = LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - The source getAmount() is 0 and the MR transformation remains in range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LOWER_RANGE_NEIGHBORS
    category: BOUNDARY
    description: Adjacent endpoints begin at LocalDate.MIN while retaining room for
      the forward shift.
    preconditions:
    - startDateInclusive = LocalDate.MIN.
    - endDateExclusive = LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EQUAL
    category: EDGE
    description: Identical LocalDateTime endpoints produce zero.
    preconditions:
    - Both endpoints equal 2024-06-15T10:20:30.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_SUBDAY
    category: EDGE
    description: A positive interval shorter than one complete day is truncated to
      zero whole days.
    preconditions:
    - startDateInclusive = 2024-06-15T00:00 and endDateExclusive = 2024-06-15T23:59:59.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: Exactly 24 hours between LocalDateTime values produces one whole
      day.
    preconditions:
    - startDateInclusive = 2024-06-15T10:20:30 and endDateExclusive = 2024-06-16T10:20:30.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_DAY_MINUS_NANO
    category: BOUNDARY
    description: An interval one nanosecond below a complete day remains zero.
    preconditions:
    - startDateInclusive = 2024-06-15T00:00.
    - endDateExclusive = 2024-06-15T23:59:59.999999999.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_DAY_PLUS_NANO
    category: BOUNDARY
    description: An interval one nanosecond above a complete day still contains exactly
      one whole day.
    preconditions:
    - startDateInclusive = 2024-06-15T00:00.
    - endDateExclusive = 2024-06-16T00:00:00.000000001.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_SUBDAY
    category: EDGE
    description: A negative interval shorter than a complete day truncates to zero.
    preconditions:
    - startDateInclusive = 2024-06-16T00:00 and endDateExclusive = 2024-06-15T01:00.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_OVER_DAY
    category: BOUNDARY
    description: A negative interval exceeding one complete day produces -1.
    preconditions:
    - startDateInclusive = 2024-06-16T02:00 and endDateExclusive = 2024-06-15T01:00.
    expectedSourceBehavior:
    - The returned getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_LEAP_MULTI_DAY
    category: BOUNDARY
    description: An exact LocalDateTime interval spans the leap day.
    preconditions:
    - startDateInclusive = 2024-02-28T12:00 and endDateExclusive = 2024-03-01T12:00.
    expectedSourceBehavior:
    - The returned getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET_DAY
    category: NORMAL
    description: Fixed-offset endpoints separated by exactly one local and elapsed
      day.
    preconditions:
    - startDateInclusive = 2024-01-10T08:00+02:00.
    - endDateExclusive = 2024-01-11T08:00+02:00.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EQUAL_INSTANT_DIFFERENT_OFFSETS
    category: EDGE
    description: Different local representations of the same instant produce zero
      days.
    preconditions:
    - startDateInclusive = 2024-01-10T00:00Z.
    - endDateExclusive = 2024-01-10T01:00+01:00.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_CROSS_OFFSET_SUBDAY
    category: EDGE
    description: Offset normalization leaves less than one complete day.
    preconditions:
    - startDateInclusive = 2024-01-10T12:00+02:00.
    - endDateExclusive = 2024-01-11T10:59+01:00.
    expectedSourceBehavior:
    - The elapsed interval is 23 hours 59 minutes and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_EXTREME_OFFSETS
    category: EDGE
    description: Large opposing fixed offsets make local-date appearance differ from
      elapsed whole-day counting.
    preconditions:
    - startDateInclusive = 2024-01-01T00:00+14:00.
    - endDateExclusive = 2024-01-02T00:00-12:00.
    expectedSourceBehavior:
    - The returned getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_NEGATIVE_EXACT
    category: NORMAL
    description: A reverse fixed-offset interval produces a negative multi-day result.
    preconditions:
    - startDateInclusive = 2024-01-12T08:00+05:30.
    - endDateExclusive = 2024-01-10T08:00+05:30.
    expectedSourceBehavior:
    - The returned getAmount() is -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DAY_PLUS_SECOND
    category: BOUNDARY
    description: A fixed-offset interval just above one day produces one whole day.
    preconditions:
    - startDateInclusive = 2024-01-10T08:00Z.
    - endDateExclusive = 2024-01-11T08:00:01Z.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_NEGATIVE_SUBDAY
    category: EDGE
    description: A reverse fixed-offset interval shorter than one complete day truncates
      to zero.
    preconditions:
    - startDateInclusive = 2024-01-11T08:00Z.
    - endDateExclusive = 2024-01-10T08:00:01Z.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_GAP
    category: BOUNDARY
    description: Consecutive New York midnights span the 23-hour spring-DST civil
      day.
    preconditions:
    - startDateInclusive = 2020-03-08T00:00-05:00[America/New_York].
    - endDateExclusive = 2020-03-09T00:00-04:00[America/New_York].
    expectedSourceBehavior:
    - Date-based DAYS counting returns getAmount() = 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_OVERLAP
    category: BOUNDARY
    description: Consecutive New York midnights span the 25-hour autumn-DST civil
      day.
    preconditions:
    - startDateInclusive = 2020-11-01T00:00-04:00[America/New_York].
    - endDateExclusive = 2020-11-02T00:00-05:00[America/New_York].
    expectedSourceBehavior:
    - Date-based DAYS counting returns getAmount() = 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_SAME_LOCAL_TIME
    category: BOUNDARY
    description: The same local clock time on consecutive dates crosses a spring offset
      change.
    preconditions:
    - startDateInclusive = 2020-03-08T01:30-05:00[America/New_York].
    - endDateExclusive = 2020-03-09T01:30-04:00[America/New_York].
    expectedSourceBehavior:
    - The returned getAmount() is 1 despite only 23 elapsed hours.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_OVERLAP_AMBIGUOUS_HOUR
    category: EDGE
    description: An explicitly offset occurrence of the repeated autumn hour is compared
      with the same local time next day.
    preconditions:
    - startDateInclusive = 2020-11-01T01:30-04:00[America/New_York].
    - endDateExclusive = 2020-11-02T01:30-05:00[America/New_York].
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_EQUAL_INSTANT_CROSS_ZONE
    category: EDGE
    description: Two ZonedDateTime values in different zones represent the same instant.
    preconditions:
    - startDateInclusive = 2024-01-10T07:00-05:00[America/New_York].
    - endDateExclusive = 2024-01-10T12:00Z[UTC].
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SKIPPED_CIVIL_DATE
    category: EDGE
    description: Pacific/Apia endpoints straddle its skipped 2011-12-30 civil date.
    preconditions:
    - startDateInclusive = 2011-12-29T00:00-10:00[Pacific/Apia].
    - endDateExclusive = 2011-12-31T00:00+14:00[Pacific/Apia].
    expectedSourceBehavior:
    - Date-based counting returns getAmount() = 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_REVERSE_SPRING
    category: BOUNDARY
    description: The reverse direction across a spring transition produces a negative
      day.
    preconditions:
    - startDateInclusive = 2020-03-09T00:00-04:00[America/New_York].
    - endDateExclusive = 2020-03-08T00:00-05:00[America/New_York].
    expectedSourceBehavior:
    - The returned getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DIFFERENT_DST_SCHEDULES
    category: EDGE
    description: Cross-zone endpoints are positioned so the 37-day shift crosses the
      US DST change but not the UK change, directly challenging the MR's location-independence
      premise.
    preconditions:
    - startDateInclusive = 2020-02-10T12:00-05:00[America/New_York].
    - endDateExclusive = 2020-02-11T16:30Z[Europe/London].
    - Both independently shifted endpoints remain valid ZonedDateTime values.
    expectedSourceBehavior:
    - After conversion to the start zone, the source interval is less than one complete
      local day and getAmount() is 0.
    - The case is retained even if assertRelation detects a changed follow-up amount,
      because both source and follow-up inputs are valid under the supplied signature
      and transformation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EQUAL
    category: EDGE
    description: Equal Instant endpoints exercise zero on the time-line implementation.
    preconditions:
    - Both endpoints equal 2024-01-10T00:00:00Z.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: BOUNDARY
    description: Instants exactly 86400 seconds apart produce one day.
    preconditions:
    - startDateInclusive = 2024-01-10T00:00:00Z.
    - endDateExclusive = 2024-01-11T00:00:00Z.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_DAY_MINUS_NANO
    category: BOUNDARY
    description: An Instant interval one nanosecond below 86400 seconds contains no
      whole day.
    preconditions:
    - startDateInclusive = 2024-01-10T00:00:00Z.
    - endDateExclusive = 2024-01-10T23:59:59.999999999Z.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_SUBDAY
    category: EDGE
    description: A one-nanosecond reverse Instant interval truncates to zero days.
    preconditions:
    - startDateInclusive = 2024-01-10T00:00:00.000000001Z.
    - endDateExclusive = 2024-01-10T00:00:00Z.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_OVER_DAY
    category: BOUNDARY
    description: A reverse Instant interval just beyond one day produces -1.
    preconditions:
    - startDateInclusive = 2024-01-11T00:00:01Z.
    - endDateExclusive = 2024-01-10T00:00:00Z.
    expectedSourceBehavior:
    - The returned getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAX_DAYS
    category: BOUNDARY
    description: Instant supports an exact Integer.MAX_VALUE-day source result while
      retaining shift range.
    preconditions:
    - startDateInclusive = Instant.EPOCH.
    - endDateExclusive = Instant.EPOCH.plus(2147483647L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The returned getAmount() is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_START_EQUAL
    category: EDGE
    description: Equal JapaneseDate values at the start of the Reiwa era produce zero.
    preconditions:
    - Both endpoints are JapaneseDate.of(2019, 5, 1).
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_BOUNDARY
    category: BOUNDARY
    description: Adjacent JapaneseDate values cross from the Heisei era to the Reiwa
      era.
    preconditions:
    - startDateInclusive = JapaneseDate.of(2019, 4, 30).
    - endDateExclusive = JapaneseDate.of(2019, 5, 1).
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: A HijrahDate and its next day exercise chronology-specific month
      rollover without assuming month length.
    preconditions:
    - startDateInclusive is a valid HijrahDate with day-of-month equal to its month's
      maximum.
    - endDateExclusive = startDateInclusive.plus(1, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_REVERSE_MULTI_DAY
    category: NORMAL
    description: A reverse MinguoDate interval exercises negative chronology-based
      counting.
    preconditions:
    - endDateExclusive is a valid MinguoDate.
    - startDateInclusive = endDateExclusive.plus(40, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - The returned getAmount() is -40.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_LEAP_CROSSING
    category: BOUNDARY
    description: ThaiBuddhistDate endpoints corresponding to ISO 2024-02-28 and 2024-03-01
      cross a leap day.
    preconditions:
    - startDateInclusive = ThaiBuddhistDate.from(LocalDate.of(2024, 2, 28)).
    - endDateExclusive = ThaiBuddhistDate.from(LocalDate.of(2024, 3, 1)).
    expectedSourceBehavior:
    - The returned getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: EDGE
    description: A LocalDate start compares with a LocalDateTime end that can be converted
      to a date by the start temporal.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 1, 10).
    - endDateExclusive = LocalDateTime.of(2024, 1, 12, 23, 59).
    expectedSourceBehavior:
    - The LocalDate-based calculation returns getAmount() = 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_LOCAL_DATE_TO_ZONED_DATE_TIME
    category: EDGE
    description: A LocalDate start compares with the local date extractable from a
      ZonedDateTime end.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 1, 10).
    - endDateExclusive = 2024-01-13T01:00+14:00[Pacific/Kiritimati].
    expectedSourceBehavior:
    - The LocalDate-based calculation returns getAmount() = 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_JAPANESE_DATE_TO_LOCAL_DATE
    category: EDGE
    description: A JapaneseDate start compares with an ISO LocalDate representing
      a later epoch day.
    preconditions:
    - startDateInclusive = JapaneseDate.from(LocalDate.of(2024, 1, 10)).
    - endDateExclusive = LocalDate.of(2024, 1, 15).
    expectedSourceBehavior:
    - The returned getAmount() is 5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_INSTANT_TO_OFFSET_DATE_TIME
    category: EDGE
    description: An Instant start compares with an OffsetDateTime end convertible
      to an instant.
    preconditions:
    - startDateInclusive = Instant.parse("2024-01-10T00:00:00Z").
    - endDateExclusive = OffsetDateTime.parse("2024-01-11T03:00:00+03:00").
    expectedSourceBehavior:
    - The endpoints are exactly one elapsed day apart and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
