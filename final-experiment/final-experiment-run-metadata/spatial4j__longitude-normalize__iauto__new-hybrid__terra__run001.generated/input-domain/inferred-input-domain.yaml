InputDomain:
  summary: Finite IEEE-754 double longitudes for which the generated follow-up represents
    an actual +360.0-degree shift; scenarios cover the in-range fast return, both
    inclusive antimeridian representations, all modulo-result branches, fractional
    wraps, multi-revolution values, signed zero, subnormal values, and large exactly-shiftable
    magnitudes.
  globalConstraints:
  - 'arg0 must be finite: !Double.isNaN(arg0) && !Double.isInfinite(arg0). NaN and
    infinities are excluded because normLonDEG reaches the modulo path and produces
    NaN, while the MR''s Math.abs(...) > 1e-9 check is false for NaN and would pass
    vacuously.'
  - 'The generated follow-up must remain a representable full revolution shift: Double.isFinite(arg0
    + 360.0) && ((arg0 + 360.0) - arg0 == 360.0). Finite values whose spacing causes
    arg0 + 360.0 to equal arg0 or differ by a value other than 360.0 are excluded
    because generateFollowUp would not actually apply the MR''s stated transformation.'
  diversity:
    normalizationPath:
    - distinct
    - measurable
    - direct return for -180.0 <= x <= 180.0; off < 0; off == 0 && x > 0; final else
      branch
    antimeridianRepresentation:
    - distinct
    - measurable
    - -180.0, 180.0, positive out-of-range exact wraps normalizing to 180.0, and negative
      out-of-range exact wraps normalizing to -180.0
    boundaryDistance:
    - distinct
    - measurable
    - exact endpoints, Math.nextUp(-180.0), Math.nextDown(-180.0), Math.nextDown(180.0),
      and Math.nextUp(180.0)
    numericForm:
    - distinct
    - measurable
    - signed zero, ordinary fractions, subnormal values, normal minimum values, integer
      revolutions, fractional revolutions, and large powers of two
    magnitudeAndPrecision:
    - distinct
    - measurable
    - small values, million-scale values, 2^20-scale values, 2^52 values, 2^55 values,
      and values whose follow-up crosses the 2^55 binade boundary
  scenarios:
  - id: LOWER_ANTIMERIDIAN_IN_RANGE
    category: BOUNDARY
    description: Exact inclusive lower endpoint uses the common in-range return.
    preconditions:
    - arg0 == -180.0
    expectedSourceBehavior:
    - Returns -180.0 directly without modulo arithmetic.
    - Output is within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_ANTIMERIDIAN_IN_RANGE
    category: BOUNDARY
    description: Exact inclusive upper endpoint uses the common in-range return.
    preconditions:
    - arg0 == 180.0
    expectedSourceBehavior:
    - Returns 180.0 directly without modulo arithmetic.
    - Output is within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_LOWER_ANTIMERIDIAN
    category: BOUNDARY
    description: Nearest representable longitude greater than -180 remains on the
      fast path.
    preconditions:
    - arg0 == Math.nextUp(-180.0)
    expectedSourceBehavior:
    - Returns the input value directly.
    - Output is greater than -180.0 and less than 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_INSIDE_UPPER_ANTIMERIDIAN
    category: BOUNDARY
    description: Nearest representable longitude less than 180 remains on the fast
      path.
    preconditions:
    - arg0 == Math.nextDown(180.0)
    expectedSourceBehavior:
    - Returns the input value directly.
    - Output is greater than -180.0 and less than 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_LOWER_ANTIMERIDIAN
    category: BOUNDARY
    description: Nearest representable longitude below -180 takes the negative-remainder
      branch.
    preconditions:
    - arg0 == Math.nextDown(-180.0)
    expectedSourceBehavior:
    - Modulo offset is negative, so the result is computed as 180.0 + off.
    - Output is just below 180.0 and within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_UPPER_ANTIMERIDIAN
    category: BOUNDARY
    description: Nearest representable longitude above 180 takes the nonnegative remainder
      final branch.
    preconditions:
    - arg0 == Math.nextUp(180.0)
    expectedSourceBehavior:
    - Modulo offset is positive and nonzero, so the result is computed as -180.0 +
      off.
    - Output is just above -180.0 and within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_IN_RANGE
    category: NORMAL
    description: Ordinary central longitude exercises the direct-return fast path.
    preconditions:
    - arg0 == 0.0
    expectedSourceBehavior:
    - Returns 0.0 directly.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_IN_RANGE
    category: EDGE
    description: IEEE-754 negative zero is within range and is returned without arithmetic
      normalization.
    preconditions:
    - Double.doubleToRawLongBits(arg0) == Double.doubleToRawLongBits(-0.0)
    expectedSourceBehavior:
    - Returns the input directly, preserving the negative-zero bit pattern.
    - Numeric output compares equal to 0.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INTERIOR_FRACTION
    category: NORMAL
    description: Positive non-boundary fractional longitude stays in range.
    preconditions:
    - arg0 == 37.25
    expectedSourceBehavior:
    - Returns 37.25 directly.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INTERIOR_FRACTION
    category: NORMAL
    description: Negative non-boundary fractional longitude stays in range.
    preconditions:
    - arg0 == -37.25
    expectedSourceBehavior:
    - Returns -37.25 directly.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_SUBNORMAL_IN_RANGE
    category: EDGE
    description: Smallest positive subnormal longitude uses the direct-return path.
    preconditions:
    - arg0 == Double.MIN_VALUE
    expectedSourceBehavior:
    - Returns the input value directly.
    - Output is positive and within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_SUBNORMAL_IN_RANGE
    category: EDGE
    description: Smallest-magnitude negative subnormal longitude uses the direct-return
      path.
    preconditions:
    - arg0 == -Double.MIN_VALUE
    expectedSourceBehavior:
    - Returns the input value directly.
    - Output is negative and within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_MIN_NORMAL_IN_RANGE
    category: EDGE
    description: Smallest positive normal longitude is distinct from subnormal input
      while still taking the fast path.
    preconditions:
    - arg0 == Double.MIN_NORMAL
    expectedSourceBehavior:
    - Returns the input value directly.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_MIN_NORMAL_IN_RANGE
    category: EDGE
    description: Smallest-magnitude negative normal longitude is distinct from negative
      subnormal input while still taking the fast path.
    preconditions:
    - arg0 == -Double.MIN_NORMAL
    expectedSourceBehavior:
    - Returns the input value directly.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DEGREE_BELOW_LOWER_RANGE
    category: BOUNDARY
    description: Simple negative out-of-range value produces a negative modulo offset.
    preconditions:
    - arg0 == -181.0
    expectedSourceBehavior:
    - Takes the off < 0 branch.
    - Returns 179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DEGREE_ABOVE_UPPER_RANGE
    category: BOUNDARY
    description: Simple positive out-of-range value produces a positive nonzero modulo
      offset.
    preconditions:
    - arg0 == 181.0
    expectedSourceBehavior:
    - Takes the final else branch.
    - Returns -179.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FULL_REVOLUTION
    category: NORMAL
    description: Positive one-revolution offset exercises the nonnegative nonzero-remainder
      branch.
    preconditions:
    - arg0 == 360.0
    expectedSourceBehavior:
    - Returns 0.0.
    - Output is within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FULL_REVOLUTION
    category: NORMAL
    description: Negative one-revolution offset exercises the negative-remainder branch.
    preconditions:
    - arg0 == -360.0
    expectedSourceBehavior:
    - Returns 0.0.
    - Output is within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_OUT_OF_RANGE_ANTIMERIDIAN
    category: BOUNDARY
    description: Positive exact antimeridian wrap reaches the explicit off == 0 &&
      lon_deg > 0 sentinel.
    preconditions:
    - arg0 == 540.0
    expectedSourceBehavior:
    - Modulo offset is exactly 0.0.
    - Returns 180.0 via the positive exact-wrap sentinel branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_OUT_OF_RANGE_ANTIMERIDIAN
    category: BOUNDARY
    description: Negative exact antimeridian wrap reaches the final branch because
      lon_deg is not positive.
    preconditions:
    - arg0 == -540.0
    expectedSourceBehavior:
    - Modulo offset compares equal to 0.0 and lon_deg > 0 is false.
    - Returns -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_FULL_REVOLUTION
    category: NORMAL
    description: Positive fractional revolution verifies non-integer remainder normalization.
    preconditions:
    - arg0 == 360.5
    expectedSourceBehavior:
    - Returns 0.5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_FULL_REVOLUTION
    category: NORMAL
    description: Negative fractional revolution verifies negative modulo correction.
    preconditions:
    - arg0 == -360.5
    expectedSourceBehavior:
    - Returns -0.5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_FRACTIONAL_ANTIMERIDIAN_WRAP
    category: BOUNDARY
    description: Positive value just beyond an out-of-range antimeridian wrap has
      a small positive offset.
    preconditions:
    - arg0 == 540.5
    expectedSourceBehavior:
    - Takes the final else branch with a positive nonzero offset.
    - Returns -179.5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_FRACTIONAL_ANTIMERIDIAN_WRAP
    category: BOUNDARY
    description: Negative value just beyond an out-of-range antimeridian wrap has
      a negative offset.
    preconditions:
    - arg0 == -540.5
    expectedSourceBehavior:
    - Takes the off < 0 branch.
    - Returns 179.5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_POSITIVE_INTEGER_AND_FRACTION
    category: EDGE
    description: Million-scale positive longitude checks modulo normalization beyond
      a few revolutions.
    preconditions:
    - arg0 == 1000000.25
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_INTEGER_AND_FRACTION
    category: EDGE
    description: Million-scale negative longitude checks negative remainder correction
      beyond a few revolutions.
    preconditions:
    - arg0 == -1000000.25
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_POWER_OF_TWO_WITH_FRACTION
    category: EDGE
    description: Power-of-two-scale positive longitude retains a representable fractional
      component before normalization.
    preconditions:
    - arg0 == 1048576.125
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_POWER_OF_TWO_WITH_FRACTION
    category: EDGE
    description: Negative counterpart exercises the negative remainder path at the
      same exponent scale.
    preconditions:
    - arg0 == -1048576.125
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_EXACTLY_SHIFTABLE_POSITIVE_2_POW_52
    category: EDGE
    description: Large positive integer at 2^52 remains eligible because adding 360.0
      is exactly representable at this scale.
    preconditions:
    - arg0 == 0x1.0p52
    - ((arg0 + 360.0) - arg0) == 360.0
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_EXACTLY_SHIFTABLE_NEGATIVE_2_POW_52
    category: EDGE
    description: Large negative integer at 2^52 checks sign-sensitive modulo behavior
      with an exact generated shift.
    preconditions:
    - arg0 == -0x1.0p52
    - ((arg0 + 360.0) - arg0) == 360.0
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_EXACTLY_SHIFTABLE_POSITIVE_2_POW_55
    category: EDGE
    description: Large positive power of two near the upper exact-shift precision
      region exercises modulo arithmetic with coarse spacing.
    preconditions:
    - arg0 == 0x1.0p55
    - ((arg0 + 360.0) - arg0) == 360.0
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_EXACTLY_SHIFTABLE_NEGATIVE_2_POW_55
    category: EDGE
    description: Large negative power of two near the upper exact-shift precision
      region exercises the negative modulo path.
    preconditions:
    - arg0 == -0x1.0p55
    - ((arg0 + 360.0) - arg0) == 360.0
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_BINade_CROSSING_EXACT_SHIFT
    category: EDGE
    description: Positive source is 360 degrees below 2^55, so its follow-up reaches
      a coarser exponent binade while preserving an exact 360-degree numerical shift.
    preconditions:
    - arg0 == 0x1.0p55 - 360.0
    - ((arg0 + 360.0) - arg0) == 360.0
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_BINade_CROSSING_EXACT_SHIFT
    category: EDGE
    description: Negative source is positioned so the generated follow-up crosses
      a large-magnitude exponent boundary while retaining an exact 360-degree shift.
    preconditions:
    - arg0 == -0x1.0p55 - 360.0
    - ((arg0 + 360.0) - arg0) == 360.0
    expectedSourceBehavior:
    - Does not take the in-range fast path.
    - Returns a finite value within [-180.0, 180.0].
    targetCases: 1
    emptyOutputAllowed: false
