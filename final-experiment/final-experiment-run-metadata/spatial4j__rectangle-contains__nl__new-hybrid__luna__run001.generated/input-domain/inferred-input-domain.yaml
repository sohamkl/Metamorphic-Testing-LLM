InputDomain:
  summary: Finite geographic RectangleImpl boxes and finite geographic Points evaluated
    by relate(Point), with both longitudes rotated exactly 150 degrees east and independently
    normalized into [-180,180], while latitudes remain unchanged.
  globalConstraints:
  - Use a geographic SpatialContext, because relate(Point) uses ctx.isGeo() to unwrap
    dateline-crossing longitude intervals and to shift point longitudes by 360 degrees.
  - Use finite longitude and latitude doubles for every rectangle endpoint and point
    coordinate.
  - Use rectangle and point longitudes in [-180,180] and latitudes in [-90,90], matching
    the geographic coordinate representation used by the source.
  - Rectangle minY must be less than or equal to maxY, as required by the assertion
    in reset(double,double,double,double).
  - The follow-up adds exactly 150 degrees to every rectangle longitude endpoint and
    to the point longitude, normalizing each resulting longitude independently into
    [-180,180]; all latitudes are unchanged.
  - Exclude NaN coordinates because reset treats NaN minX as an empty rectangle and
    relate(Point) returns DISJOINT through the empty-shape path rather than representing
    an ordinary geographic input.
  - Exclude rectangles whose raw longitudinal width is exactly 360 degrees, because
    relate(Point) has a full-world representation in which endpoint-wise 150-degree
    normalization can change the representation to a zero-width rectangle and invalidate
    the stated relation.
  - The metamorphic oracle for every case is equality of the original and follow-up
    SpatialRelation results; expectedSourceBehavior also identifies the intended source
    branch and result.
  diversity:
    context:
    - GEOGRAPHIC
    rectangleLongitudeTopology:
    - NORMAL_ORDER
    - DATELINE_WRAP
    - ZERO_WIDTH
    - NEAR_WORLD_WIDTH
    latitudeRelation:
    - BELOW_MIN_Y
    - ABOVE_MAX_Y
    - ON_MIN_Y
    - ON_MAX_Y
    - STRICTLY_INSIDE
    - ZERO_HEIGHT
    pointLongitudePath:
    - DIRECT_CONTAINS
    - SHIFT_LEFT_BY_360
    - SHIFT_RIGHT_BY_360
    - FINAL_DISJOINT
    longitudeBoundary:
    - INTERIOR
    - EQUAL_MIN_X
    - EQUAL_MAX_X
    - DATELINE_ENDPOINT
    latitudeBoundary:
    - ORDINARY
    - NORTH_POLE
    - SOUTH_POLE
    constructorPath:
    - DIRECT_COORDINATES
    - POINT_ENDPOINTS
    - RECTANGLE_COPY
    expectedRelation:
    - CONTAINS
    - DISJOINT
  scenarios:
  - id: LATITUDE_BELOW_MINIMUM
    category: NORMAL
    description: A point is strictly south of a normal-order rectangle.
    preconditions:
    - Construct the rectangle with minX=-40, maxX=40, minY=10, and maxY=30.
    - Use point coordinates (0,0), so point.y < minY and longitude is otherwise inside.
    expectedSourceBehavior:
    - relate(Point) returns DISJOINT from the first latitude comparison before longitude
      processing.
    - The rotated rectangle and point are [110,-170] by [10,30] and (150,0); the follow-up
      also returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_ABOVE_MAXIMUM
    category: NORMAL
    description: A point is strictly north of a normal-order rectangle.
    preconditions:
    - Construct the rectangle with minX=-40, maxX=40, minY=-30, and maxY=-10.
    - Use point coordinates (0,0), so point.y > maxY.
    expectedSourceBehavior:
    - relate(Point) returns DISJOINT from the first latitude comparison.
    - The follow-up rectangle is [110,-170] by [-30,-10] and the follow-up point is
      (150,0), so it also returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_ON_MINIMUM
    category: BOUNDARY
    description: A point lies exactly on minY and strictly inside the rectangle's
      longitude interval.
    preconditions:
    - Rectangle coordinates are minX=-40, maxX=40, minY=10, maxY=30.
    - Point coordinates are (0,10), so point.y == minY.
    expectedSourceBehavior:
    - Strict latitude comparisons accept equality.
    - The inclusive longitude comparison returns CONTAINS.
    - The follow-up preserves latitude 10 and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_ON_MAXIMUM
    category: BOUNDARY
    description: A point lies exactly on maxY and strictly inside the rectangle's
      longitude interval.
    preconditions:
    - Rectangle coordinates are minX=-40, maxX=40, minY=-30, maxY=-10.
    - Point coordinates are (0,-10), so point.y == maxY.
    expectedSourceBehavior:
    - Strict latitude comparisons accept equality.
    - The inclusive longitude comparison returns CONTAINS in both the original and
      rotated cases.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORMAL_INTERIOR_DIRECT_CONTAINS
    category: NORMAL
    description: A point is strictly inside a normal-order rectangle and reaches the
      direct longitude CONTAINS short-circuit.
    preconditions:
    - Rectangle coordinates are minX=-80, maxX=20, minY=-20, maxY=20.
    - Point coordinates are (-10,5), with minX < point.x < maxX and minY < point.y
      < maxY.
    expectedSourceBehavior:
    - After latitude acceptance, pX lies between minX and maxX, so relate(Point) returns
      CONTAINS before any longitude shift.
    - The follow-up rectangle is [70,170] and the follow-up point is (140,5), which
      follows the same short-circuit and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORMAL_EQUAL_MIN_X
    category: BOUNDARY
    description: A point lies exactly on minX of a normal-order rectangle.
    preconditions:
    - Rectangle coordinates are minX=-80, maxX=20, minY=-20, maxY=20.
    - Point coordinates are (-80,0), so point.x == minX and latitude is inside.
    expectedSourceBehavior:
    - The inclusive longitude test returns CONTAINS.
    - The follow-up rectangle is [70,170] and the follow-up point is (70,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORMAL_EQUAL_MAX_X
    category: BOUNDARY
    description: A point lies exactly on maxX of a normal-order rectangle.
    preconditions:
    - Rectangle coordinates are minX=-80, maxX=20, minY=-20, maxY=20.
    - Point coordinates are (20,0), so point.x == maxX.
    expectedSourceBehavior:
    - The inclusive longitude test returns CONTAINS.
    - The follow-up rectangle is [70,170] and the follow-up point is (170,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORMAL_LONGITUDE_DISJOINT_LEFT
    category: NORMAL
    description: A point is west of a normal rectangle and remains outside after the
      source's left-side longitude shift.
    preconditions:
    - Rectangle coordinates are minX=-20, maxX=40, minY=-20, maxY=20.
    - Point coordinates are (-100,0), so pX < minX and pX + 360 = 260 > maxX.
    expectedSourceBehavior:
    - The source executes the pX < minX branch and then returns DISJOINT from the
      final comparison.
    - The follow-up rectangle is [130,-170] and the follow-up point is (50,0); it
      also returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORMAL_LONGITUDE_DISJOINT_RIGHT
    category: NORMAL
    description: A point is east of a normal rectangle and remains outside after the
      source's right-side longitude shift.
    preconditions:
    - Rectangle coordinates are minX=-40, maxX=20, minY=-20, maxY=20.
    - Point coordinates are (100,0), so pX > maxX and pX - 360 = -260 < minX.
    expectedSourceBehavior:
    - The source executes the pX > maxX branch and then returns DISJOINT.
    - The follow-up rectangle is [110,170] and the follow-up point is (-150,0); it
      also returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_EASTERN_SEGMENT
    category: NORMAL
    description: A dateline-wrapping rectangle contains a point on its eastern segment.
    preconditions:
    - Rectangle coordinates are minX=170, maxX=-170, minY=-20, maxY=20, so minX >
      maxX.
    - Point coordinates are (175,0), which lies between minX and the unwrapped maxX
      of 190.
    expectedSourceBehavior:
    - The source unwraps maxX to 190 and returns CONTAINS.
    - The follow-up rectangle is [-40,-20] and the follow-up point is (-35,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_WESTERN_SEGMENT_SHIFT
    category: NORMAL
    description: A dateline-wrapping rectangle contains a point on its western segment
      through the pX < minX shift.
    preconditions:
    - Rectangle coordinates are minX=170, maxX=-170, minY=-20, maxY=20.
    - Point coordinates are (-175,0), so pX < minX and pX + 360 = 185 lies in the
      unwrapped interval [170,190].
    expectedSourceBehavior:
    - The source executes the pX < minX branch and returns CONTAINS.
    - The follow-up rectangle is [-40,-20] and the follow-up point is (-25,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_GAP_DISJOINT
    category: NORMAL
    description: A point lies in the longitude gap of a dateline-wrapping rectangle.
    preconditions:
    - Rectangle coordinates are minX=170, maxX=-170, minY=-20, maxY=20.
    - Point coordinates are (0,0), which is outside both represented longitude segments.
    expectedSourceBehavior:
    - The source shifts pX because pX < minX, then returns DISJOINT because 360 is
      greater than the unwrapped maxX of 190.
    - The follow-up rectangle is [-40,-20] and the follow-up point is (150,0), also
      returning DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_EQUAL_MIN_X
    category: BOUNDARY
    description: A point lies exactly on minX of a dateline-wrapping rectangle.
    preconditions:
    - Rectangle coordinates are minX=170, maxX=-170, minY=-20, maxY=20.
    - Point coordinates are (170,0), so pX == minX.
    expectedSourceBehavior:
    - The source does not shift pX and returns CONTAINS at the inclusive eastern boundary.
    - The follow-up rectangle is [-40,-20] and the follow-up point is (-40,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_EQUAL_MAX_X
    category: BOUNDARY
    description: A point lies exactly on maxX of a dateline-wrapping rectangle.
    preconditions:
    - Rectangle coordinates are minX=170, maxX=-170, minY=-20, maxY=20.
    - Point coordinates are (-170,0); the source shifts this to 190, equal to the
      unwrapped maxX.
    expectedSourceBehavior:
    - The source returns CONTAINS at the inclusive western boundary.
    - The follow-up rectangle is [-40,-20] and the follow-up point is (-20,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_ON_LONGITUDE
    category: EDGE
    description: A zero-width rectangle contains a point exactly on its longitude
      line.
    preconditions:
    - Rectangle coordinates are minX=30, maxX=30, minY=-20, maxY=20.
    - Point coordinates are (30,0), so point.x equals both longitude endpoints.
    expectedSourceBehavior:
    - rawWidth is zero, no dateline unwrapping occurs, and the inclusive comparison
      returns CONTAINS.
    - The follow-up rectangle is [180,180] and the follow-up point is (180,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_OFF_LONGITUDE
    category: EDGE
    description: A zero-width rectangle rejects a point with a different longitude.
    preconditions:
    - Rectangle coordinates are minX=30, maxX=30, minY=-20, maxY=20.
    - Point coordinates are (31,0), so point.x > maxX.
    expectedSourceBehavior:
    - The source executes the pX > maxX adjustment and returns DISJOINT.
    - The follow-up rectangle is [180,180] and the follow-up point is (-179,0); the
      follow-up also returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_ON_LATITUDE
    category: EDGE
    description: A zero-height rectangle contains a point on its latitude line and
      inside its longitude interval.
    preconditions:
    - Rectangle coordinates are minX=-40, maxX=40, minY=15, maxY=15.
    - Point coordinates are (0,15), so point.y equals both latitude endpoints.
    expectedSourceBehavior:
    - The strict latitude comparisons accept equality and longitude processing returns
      CONTAINS.
    - The follow-up preserves latitude 15 and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_OFF_LATITUDE
    category: EDGE
    description: A zero-height rectangle rejects a point just above its latitude line.
    preconditions:
    - Rectangle coordinates are minX=-40, maxX=40, minY=15, maxY=15.
    - Point coordinates are (0,15.000001), so point.y > maxY.
    expectedSourceBehavior:
    - relate(Point) returns DISJOINT from the latitude guard.
    - The follow-up preserves the latitude mismatch and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_MINUS_180_ENDPOINT
    category: BOUNDARY
    description: A dateline-wrapping rectangle contains the canonical -180 longitude
      endpoint.
    preconditions:
    - Rectangle coordinates are minX=170, maxX=-180, minY=-20, maxY=20.
    - Point coordinates are (-180,0), which shifts to 180 within the unwrapped interval
      [170,180].
    expectedSourceBehavior:
    - The source returns CONTAINS at the endpoint.
    - The follow-up rectangle is [-40,-30] and the follow-up point is (-30,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_PLUS_180_ENDPOINT
    category: BOUNDARY
    description: A normal-order rectangle contains the +180 longitude endpoint.
    preconditions:
    - Rectangle coordinates are minX=170, maxX=180, minY=-20, maxY=20.
    - Point coordinates are (180,0), exactly equal to maxX.
    expectedSourceBehavior:
    - The source returns CONTAINS without shifting.
    - The follow-up rectangle is [-40,-30] and the follow-up point is (-30,0), also
      returning CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_WORLD_WIDTH_INTERIOR
    category: EDGE
    description: A near-world-width rectangle contains an interior point without taking
      the rawWidth == 360 sentinel.
    preconditions:
    - Rectangle coordinates are minX=-179, maxX=179, minY=-10, maxY=10, giving raw
      width 358.
    - Point coordinates are (0,0), strictly inside the represented interval.
    expectedSourceBehavior:
    - The source does not use the full-world sentinel and returns CONTAINS.
    - The follow-up rectangle is [-29,-31], a dateline-wrapping representation of
      the same 358-degree span, and the follow-up point is (150,0); it returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_WORLD_WIDTH_EXCLUDED_GAP
    category: EDGE
    description: A near-world-width rectangle rejects a point in its narrow excluded
      longitude gap.
    preconditions:
    - Rectangle coordinates are minX=-179, maxX=179, minY=-10, maxY=10.
    - Point coordinates are (179.5,0), so pX > maxX and pX - 360 = -180.5 < minX.
    expectedSourceBehavior:
    - The source executes the pX > maxX branch and returns DISJOINT.
    - The follow-up rectangle is [-29,-31] and the follow-up point is (-30.5,0), which
      is in the corresponding excluded gap and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTH_POLE_LATITUDE_BOUNDARY
    category: BOUNDARY
    description: A point at latitude 90 is contained at the maximum latitude boundary.
    preconditions:
    - Rectangle coordinates are minX=-40, maxX=40, minY=60, maxY=90.
    - Point coordinates are (0,90), so point.y == maxY == 90.
    expectedSourceBehavior:
    - The latitude guard accepts equality at 90 and longitude processing returns CONTAINS.
    - The follow-up leaves latitude 90 unchanged and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTH_POLE_LATITUDE_BOUNDARY
    category: BOUNDARY
    description: A point at latitude -90 is contained at the minimum latitude boundary.
    preconditions:
    - Rectangle coordinates are minX=-40, maxX=40, minY=-90, maxY=-60.
    - Point coordinates are (0,-90), so point.y == minY == -90.
    expectedSourceBehavior:
    - The latitude guard accepts equality at -90 and longitude processing returns
      CONTAINS.
    - The follow-up leaves latitude -90 unchanged and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ENDPOINT_CONSTRUCTOR
    category: NORMAL
    description: A rectangle created through the supplied Point-endpoint constructor
      is tested with an interior point.
    preconditions:
    - Construct the receiver with RectangleImpl(Point lowerLeft, Point upperRight,
      SpatialContext), using endpoint coordinates (-60,-15) and (60,25).
    - Use test point coordinates (10,5), strictly inside the resulting rectangle.
    expectedSourceBehavior:
    - The convenience constructor extracts lowerLeft.x, upperRight.x, lowerLeft.y,
      and upperRight.y and produces the same rectangle as the direct-coordinate constructor.
    - relate(Point) returns CONTAINS, and the rotated follow-up also returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_COPY_CONSTRUCTOR_DATELINE_GAP
    category: NORMAL
    description: A dateline-wrapping rectangle copied through the supplied Rectangle
      constructor is tested in its longitude gap.
    preconditions:
    - Create a source Rectangle with minX=160, maxX=-160, minY=-25, and maxY=25.
    - Construct the receiver with RectangleImpl(Rectangle, SpatialContext), preserving
      the source endpoint ordering.
    - Use point coordinates (0,0), which lie in the longitude gap.
    expectedSourceBehavior:
    - The copy constructor preserves minX > maxX, so relate(Point) returns DISJOINT
      through the dateline-gap path.
    - The rotated copied rectangle and point are [-50,-10] by [-25,25] and (150,0),
      and the follow-up also returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
