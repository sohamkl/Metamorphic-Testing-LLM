InputDomain:
  summary: Domain of non-null Java temporals whose day distance is supported by ChronoUnit.DAYS,
    whose endpoints can both be shifted forward by 37 days, and whose resulting whole-day
    distance fits in an int.
  globalConstraints:
  - Both source endpoints are non-null Temporal instances because the follow-up generator
    rejects null endpoints.
  - Each endpoint supports plus(37, ChronoUnit.DAYS), and both shifted endpoints remain
    within the temporal type's valid range.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is supported for
    the endpoint pair.
  - The resulting day distance is between Integer.MIN_VALUE and Integer.MAX_VALUE
    inclusive because between applies Math.toIntExact.
  - Source and follow-up outputs are observed through getAmount().
  - Every scenario uses endpoints for which the follow-up transformation can be generated
    successfully and preserves the day distance.
  diversity:
    temporalFamilies:
    - LocalDate
    - LocalDateTime
    - OffsetDateTime
    - Instant
    - ZonedDateTime with UTC
    distanceSigns:
    - negative
    - zero
    - positive
    distanceMagnitudes:
    - zero
    - one
    - sub-day truncation
    - several days
    - Integer.MIN_VALUE
    - Integer.MAX_VALUE
    endpointRelationships:
    - same endpoint
    - adjacent dates
    - reversed order
    - same local date with different times
    - different offsets
    - exact whole-day duration
    calendarBoundaries:
    - ordinary date
    - month boundary
    - leap day
    - year boundary
    - representable int-distance extremes
  scenarios:
  - id: LOCAL_DATE_ZERO_DISTANCE
    category: NORMAL
    description: Identical LocalDate endpoints produce the zero-day sentinel result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive equals startDateInclusive.
    - Both dates and their 37-day shifts are valid LocalDate values.
    expectedSourceBehavior:
    - Days.between returns a non-null Days whose getAmount() is 0.
    - The follow-up getAmount() is also 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_FORWARD
    category: BOUNDARY
    description: The smallest positive LocalDate distance produces a one-day result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is startDateInclusive.plusDays(1).
    - Both dates and their 37-day shifts are valid LocalDate values.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    - The follow-up getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_BACKWARD
    category: BOUNDARY
    description: The smallest negative LocalDate distance produces a negative one-day
      result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15).
    - endDateExclusive is startDateInclusive.minusDays(1).
    - Both dates and their 37-day shifts are valid LocalDate values.
    expectedSourceBehavior:
    - The source getAmount() is -1.
    - The follow-up getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TYPICAL_POSITIVE_DISTANCE
    category: NORMAL
    description: A multi-week positive LocalDate interval exercises an ordinary non-sentinel
      result.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 1, 10).
    - endDateExclusive is startDateInclusive.plusDays(37).
    - Both dates and their 37-day shifts are valid LocalDate values.
    expectedSourceBehavior:
    - The source getAmount() is 37.
    - The follow-up getAmount() is 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_AND_LEAP_BOUNDARY
    category: EDGE
    description: A LocalDate interval crosses February and a leap day.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28).
    - endDateExclusive is LocalDate.of(2024, 3, 2).
    - The source interval contains February 29 and spans 3 days.
    - Both dates and their 37-day shifts are valid LocalDate values.
    expectedSourceBehavior:
    - The source getAmount() is 3.
    - The follow-up getAmount() is 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: EDGE
    description: A LocalDate interval crosses the end of a calendar year.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 12, 31).
    - endDateExclusive is LocalDate.of(2024, 1, 2).
    - Both dates and their 37-day shifts are valid LocalDate values.
    expectedSourceBehavior:
    - The source getAmount() is 2.
    - The follow-up getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAXIMUM_DISTANCE
    category: EDGE
    description: A LocalDate interval has exactly Integer.MAX_VALUE whole days.
    preconditions:
    - startDateInclusive is LocalDate.of(1970, 1, 1).
    - endDateExclusive is startDateInclusive.plusDays(Integer.MAX_VALUE).
    - The end date and both 37-day-shifted endpoints are valid LocalDate values.
    expectedSourceBehavior:
    - The source getAmount() is Integer.MAX_VALUE.
    - The follow-up getAmount() is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MINIMUM_DISTANCE
    category: EDGE
    description: A LocalDate interval has exactly Integer.MIN_VALUE whole days in
      the negative direction.
    preconditions:
    - startDateInclusive is LocalDate.of(1970, 1, 1).
    - endDateExclusive is startDateInclusive.plusDays(Integer.MIN_VALUE).
    - The end date and both 37-day-shifted endpoints are valid LocalDate values.
    expectedSourceBehavior:
    - The source getAmount() is Integer.MIN_VALUE.
    - The follow-up getAmount() is Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_ZERO_DISTANCE
    category: NORMAL
    description: Identical non-midnight LocalDateTime endpoints produce zero.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 34, 56).
    - endDateExclusive equals startDateInclusive.
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    - The follow-up getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_POSITIVE
    category: BOUNDARY
    description: A positive LocalDateTime interval shorter than one day exercises
      whole-day truncation.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 0, 0).
    - endDateExclusive is startDateInclusive.plusHours(23).
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 0 because the interval is shorter than one whole day.
    - The follow-up getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_ONE_DAY
    category: BOUNDARY
    description: A LocalDateTime interval of exactly 24 hours reaches one whole day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 6, 30).
    - endDateExclusive is startDateInclusive.plusHours(24).
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    - The follow-up getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_FORTY_SEVEN_HOURS
    category: NORMAL
    description: A LocalDateTime interval containing one complete day and a remainder
      exercises truncation beyond the one-day boundary.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 6, 30).
    - endDateExclusive is startDateInclusive.plusHours(47).
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    - The follow-up getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_SUBDAY
    category: BOUNDARY
    description: A reversed LocalDateTime interval shorter than one day exercises
      negative-direction truncation.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 23, 0).
    - endDateExclusive is startDateInclusive.minusHours(23).
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 0 because the interval is shorter than one whole day.
    - The follow-up getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_FULL_DAY
    category: BOUNDARY
    description: A reversed LocalDateTime interval exceeding one full day produces
      a negative whole-day result.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 6, 30).
    - endDateExclusive is startDateInclusive.minusHours(25).
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is -1.
    - The follow-up getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_FIXED_OFFSET
    category: NORMAL
    description: An OffsetDateTime interval with a fixed offset exercises offset-aware
      day counting.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-06-15T10:00:00+02:00").
    - endDateExclusive is startDateInclusive.plusHours(36).
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    - The follow-up getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_SUBDAY
    category: EDGE
    description: OffsetDateTime endpoints with different fixed offsets are separated
      by 23 elapsed hours.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-06-15T00:00:00+02:00").
    - endDateExclusive is OffsetDateTime.parse("2024-06-15T21:00:00Z").
    - The elapsed interval is 23 hours.
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 0.
    - The follow-up getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_TWO_DAYS
    category: NORMAL
    description: Instant endpoints separated by exactly 48 hours exercise exact duration-based
      day counting.
    preconditions:
    - startDateInclusive is Instant.parse("2024-06-15T00:00:00Z").
    - endDateExclusive is startDateInclusive.plus(48, ChronoUnit.HOURS).
    - Both instants and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 2.
    - The follow-up getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_REMAINDER
    category: BOUNDARY
    description: Instant endpoints separated by 47 hours exercise truncation after
      one complete day.
    preconditions:
    - startDateInclusive is Instant.parse("2024-06-15T00:00:00Z").
    - endDateExclusive is startDateInclusive.plus(47, ChronoUnit.HOURS).
    - Both instants and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 1.
    - The follow-up getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIXED_ZONE_ZONED_DATE_TIME
    category: NORMAL
    description: UTC ZonedDateTime endpoints exercise a zoned temporal without offset
      changes.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-06-15T10:00:00Z[UTC]").
    - endDateExclusive is startDateInclusive.plusDays(10).
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is 10.
    - The follow-up getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIXED_ZONE_ZONED_DATE_TIME_REVERSED
    category: EDGE
    description: Reversed UTC ZonedDateTime endpoints exercise negative output for
      a fixed-offset zoned temporal.
    preconditions:
    - startDateInclusive is ZonedDateTime.parse("2024-06-25T10:00:00Z[UTC]").
    - endDateExclusive is ZonedDateTime.parse("2024-06-15T10:00:00Z[UTC]").
    - Both timestamps and their 37-day shifts are valid.
    expectedSourceBehavior:
    - The source getAmount() is -10.
    - The follow-up getAmount() is -10.
    targetCases: 1
    emptyOutputAllowed: false
