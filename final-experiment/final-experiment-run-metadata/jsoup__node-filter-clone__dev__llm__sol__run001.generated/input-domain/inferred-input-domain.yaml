InputDomain:
  summary: Non-null, detached, finite jsoup DOM roots paired with fresh-copyable,
    clone-invariant NodeFilter policies covering every FilterResult, depth-first descent,
    sibling advancement, ascent, subtree pruning, removal, and STOP paths.
  globalConstraints:
  - filter is non-null and root is non-null, because generateFollowUp rejects either
    null before invoking the target.
  - root.parentNode() is null before follow-up generation, because the metamorphic
    transformation requires a detached source root.
  - root is a finite jsoup Node tree whose clone() completes and produces a detached
    root with the same initial outerHtml().
  - 'The filter''s runtime class is instantiable by freshEquivalentFilter: it either
    has an invocable declared no-argument constructor, or has an invocable declared
    constructor whose parameter sequence is compatible, after primitive boxing, with
    the reflection-order sequence of all declared non-static fields.'
  - A freshly constructed equivalent filter starts in the same policy state as the
    source filter; any callback counters or schedules are reset identically before
    the two executions.
  - Filter decisions are deterministic and invariant under deep cloning, using clone-preserved
    observations such as callback phase, depth, node content, child count, or sibling
    position rather than Java object identity.
  - The filter does not retain or compare the source root or source descendant identities,
    because those identities cannot be equivalent in the cloned execution.
  - Callbacks complete normally; throwing-filter cases are excluded because assertRelation
    is defined only for two returned FilterResult values.
  - Every head and tail callback returns a non-null NodeFilter.FilterResult.
  - Unless a scenario states otherwise, callbacks not singled out by that scenario
    return CONTINUE.
  - The source root cannot exercise the method's root == null sentinel return, because
    the metamorphic transformation rejects null roots; no INVALID scenario is requested
    by the relation.
  diversity:
    rootChildCount:
    - '0'
    - '1'
    - '2'
    - at least 3
    maximumDepth:
    - '0'
    - '1'
    - '2'
    - at least 3
    headResult:
    - CONTINUE
    - SKIP_CHILDREN
    - SKIP_ENTIRELY
    - REMOVE
    - STOP
    tailResult:
    - CONTINUE
    - SKIP_CHILDREN
    - SKIP_ENTIRELY
    - REMOVE
    - STOP
    selectedNodePosition:
    - root
    - onlyChild
    - firstSibling
    - middleSibling
    - lastSibling
    - internalSubtree
    terminalPath:
    - rootHead
    - rootTail
    - nestedHeadStop
    - nestedTailStop
    - normalCompletion
    mutationOutcome:
    - unchanged
    - leafRemoved
    - subtreeRemoved
    - multipleNodesRemoved
    - rootRetainedDespiteRemoveResult
    traversalTransition:
    - descend
    - advanceToSibling
    - ascendOneLevel
    - ascendMultipleLevels
    - returnImmediately
  scenarios:
  - id: SINGLETON_CONTINUE
    category: BOUNDARY
    description: A detached leaf root receives CONTINUE at both head and tail.
    preconditions:
    - root.childNodeSize() == 0.
    - The filter returns CONTINUE for root head and root tail.
    expectedSourceBehavior:
    - Exactly one head and one tail callback occur, both at depth 0.
    - The method returns CONTINUE and root.outerHtml() is unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_SKIP_CHILDREN
    category: EDGE
    description: A non-leaf root prunes all descendants with SKIP_CHILDREN.
    preconditions:
    - root.childNodeSize() > 0.
    - Root head returns SKIP_CHILDREN and root tail returns CONTINUE.
    expectedSourceBehavior:
    - No descendant callback occurs.
    - Root tail occurs at depth 0 and the method returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_SKIP_ENTIRELY
    category: EDGE
    description: A non-leaf root is skipped entirely at its head callback.
    preconditions:
    - root.childNodeSize() > 0.
    - Root head returns SKIP_ENTIRELY.
    expectedSourceBehavior:
    - No descendant or root tail callback occurs.
    - The method returns SKIP_ENTIRELY without changing the DOM.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_HEAD_REMOVE
    category: EDGE
    description: The detached root returns REMOVE from head.
    preconditions:
    - Root head returns REMOVE.
    expectedSourceBehavior:
    - No child or root tail callback occurs.
    - The method returns REMOVE, but the root remains present because the node ==
      root return precedes the removal step.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_HEAD_STOP
    category: EDGE
    description: Traversal stops at the first head callback.
    preconditions:
    - Root head returns STOP.
    expectedSourceBehavior:
    - Exactly one callback occurs.
    - The method immediately returns STOP and leaves the DOM unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_STOP
    category: EDGE
    description: A leaf root continues at head but stops at tail.
    preconditions:
    - root.childNodeSize() == 0.
    - Root head returns CONTINUE and root tail returns STOP.
    expectedSourceBehavior:
    - Head and tail both occur at depth 0.
    - The method immediately returns STOP from the tail path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_REMOVE
    category: EDGE
    description: A leaf root returns REMOVE from tail.
    preconditions:
    - root.childNodeSize() == 0.
    - Root head returns CONTINUE and root tail returns REMOVE.
    expectedSourceBehavior:
    - The method returns REMOVE.
    - The detached root is not removed because the root equality check occurs before
      sibling advancement and removal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_SKIP_CHILDREN
    category: EDGE
    description: A leaf root returns SKIP_CHILDREN from tail.
    preconditions:
    - root.childNodeSize() == 0.
    - Root head returns CONTINUE and root tail returns SKIP_CHILDREN.
    expectedSourceBehavior:
    - The method returns SKIP_CHILDREN after the root tail.
    - The DOM remains unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_SKIP_ENTIRELY
    category: EDGE
    description: A leaf root returns SKIP_ENTIRELY from tail.
    preconditions:
    - root.childNodeSize() == 0.
    - Root head returns CONTINUE and root tail returns SKIP_ENTIRELY.
    expectedSourceBehavior:
    - The method returns SKIP_ENTIRELY after the root tail.
    - The DOM remains unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_CHILD_FULL_TRAVERSAL
    category: NORMAL
    description: A root with one leaf child follows the basic descent and ascent path.
    preconditions:
    - root.childNodeSize() == 1 and root.childNode(0).childNodeSize() == 0.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - Callback order is root head, child head, child tail, root tail at depths 0,
      1, 1, 0.
    - The method returns CONTINUE with no DOM change.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEEP_CHAIN_ASCENT
    category: NORMAL
    description: A single-child chain forces repeated descent and multiple-level ascent.
    preconditions:
    - The tree has maximum depth at least 3 and each non-leaf on one root-to-leaf
      path has exactly one child.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - Every node receives head on descent and tail in reverse order on ascent.
    - The method returns CONTINUE after tailing the root.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWO_LEAF_SIBLINGS
    category: NORMAL
    description: Two leaf children exercise direct sibling advancement.
    preconditions:
    - root.childNodeSize() == 2 and both children are leaves.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - The first child tail is followed by the second child head without first tailing
      the root.
    - Both children and the root receive head and tail callbacks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BRANCHED_DEPTH_FIRST_ORDER
    category: NORMAL
    description: A branched tree combines child descent, sibling advancement, and
      ascent.
    preconditions:
    - Root has at least two children and at least one child has its own child.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - Each subtree is completely processed before the next root child is headed.
    - Every node receives one head and one tail, and the result is CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_SKIP_CHILDREN_WITH_NEXT_SIBLING
    category: EDGE
    description: A non-leaf first sibling skips its descendants but still receives
      tail before traversal advances.
    preconditions:
    - A depth-positive non-leaf node has a next sibling.
    - Its head returns SKIP_CHILDREN and its tail returns CONTINUE.
    expectedSourceBehavior:
    - The selected node's descendants receive no callbacks.
    - The selected node is tailed, then its next sibling is headed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_SKIP_CHILDREN_LAST_SIBLING
    category: EDGE
    description: A non-leaf last child skips descendants and then enters the upward
      tail loop.
    preconditions:
    - A depth-positive non-leaf node has no next sibling.
    - Its head returns SKIP_CHILDREN and its tail returns CONTINUE.
    expectedSourceBehavior:
    - The selected node is tailed without visiting its children.
    - Traversal ascends and continues by tailing its parent.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_SKIP_ENTIRELY_WITH_NEXT_SIBLING
    category: EDGE
    description: A first sibling is skipped without a tail callback.
    preconditions:
    - A depth-positive non-leaf node has a next sibling.
    - Its head returns SKIP_ENTIRELY.
    expectedSourceBehavior:
    - Neither descendants nor tail of the selected node are visited.
    - Traversal proceeds to the next sibling, leaving the selected subtree unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_SKIP_ENTIRELY_LAST_SIBLING
    category: EDGE
    description: A last child returns SKIP_ENTIRELY and traversal ascends without
      tailing it.
    preconditions:
    - A depth-positive node has no next sibling.
    - Its head returns SKIP_ENTIRELY.
    expectedSourceBehavior:
    - The selected node receives no tail callback.
    - Traversal ascends, resets the carried result to CONTINUE, and continues with
      the parent path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_FIRST_LEAF
    category: EDGE
    description: REMOVE at the head of a first leaf removes it after capturing its
      next sibling.
    preconditions:
    - Root has at least two leaf children.
    - The first child's head returns REMOVE.
    expectedSourceBehavior:
    - The first child receives no tail callback.
    - It is removed, and traversal continues at the original second child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_MIDDLE_LEAF
    category: EDGE
    description: REMOVE at a middle sibling preserves traversal of siblings on both
      sides.
    preconditions:
    - Root has at least three children.
    - A child with both previous and next siblings returns REMOVE from head.
    expectedSourceBehavior:
    - The selected child is removed without a tail callback.
    - Traversal continues with its original next sibling and eventually tails the
      root.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_LAST_LEAF
    category: EDGE
    description: REMOVE at the head of a last leaf uses the no-sibling ascent branch.
    preconditions:
    - A depth-positive leaf has no next sibling.
    - Its head returns REMOVE.
    expectedSourceBehavior:
    - The leaf receives no tail callback.
    - Traversal finds its parent before removing the leaf, then continues upward.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_ONLY_CHILD
    category: EDGE
    description: An only child is removed from head.
    preconditions:
    - root.childNodeSize() == 1.
    - The only child's head returns REMOVE.
    expectedSourceBehavior:
    - The child is removed after its parent is captured.
    - The root becomes childless, receives tail, and the method returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_INTERNAL_SUBTREE
    category: EDGE
    description: A non-leaf node is removed from head before any descendant is visited.
    preconditions:
    - A depth-positive non-leaf node has a next sibling.
    - Its head returns REMOVE.
    expectedSourceBehavior:
    - No descendant or tail callback occurs for the selected subtree.
    - The entire subtree is removed and traversal continues with the captured next
      sibling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_LAST_INTERNAL_SUBTREE
    category: EDGE
    description: A last non-leaf subtree is removed from head through the ascent removal
      path.
    preconditions:
    - A depth-positive non-leaf node has no next sibling.
    - Its head returns REMOVE.
    expectedSourceBehavior:
    - The selected node's descendants and tail are skipped.
    - The subtree is removed after locating its parent, and traversal continues upward.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_FIRST_LEAF
    category: EDGE
    description: A fully visited first leaf is removed by its tail result.
    preconditions:
    - A leaf at positive depth has a next sibling.
    - Its head returns CONTINUE and its tail returns REMOVE.
    expectedSourceBehavior:
    - The leaf receives both callbacks before removal.
    - Traversal captures and advances to the next sibling, then removes the leaf.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_MIDDLE_LEAF
    category: EDGE
    description: A middle leaf is removed after its tail callback.
    preconditions:
    - A leaf has both previous and next siblings.
    - Its tail returns REMOVE.
    expectedSourceBehavior:
    - The selected leaf is removed only after its complete visit.
    - The original next sibling is still visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_LAST_LEAF
    category: EDGE
    description: A last leaf is removed while traversal ascends.
    preconditions:
    - A positive-depth leaf has no next sibling.
    - Its head returns CONTINUE and its tail returns REMOVE.
    expectedSourceBehavior:
    - The parent is captured before the leaf is removed.
    - The carried result is reset to CONTINUE and upward traversal proceeds.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_INTERNAL_SUBTREE_WITH_SIBLING
    category: EDGE
    description: An internal subtree is traversed completely and removed from its
      tail.
    preconditions:
    - A non-leaf positive-depth node has a next sibling.
    - Its head and descendant callbacks return CONTINUE, and its tail returns REMOVE.
    expectedSourceBehavior:
    - All descendants are visited before removal.
    - The whole selected subtree is removed, then traversal continues at its next
      sibling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_LAST_INTERNAL_SUBTREE
    category: EDGE
    description: A fully visited last internal subtree is removed during multi-level
      ascent.
    preconditions:
    - A non-leaf positive-depth node has no next sibling.
    - Its tail returns REMOVE after all descendants complete.
    expectedSourceBehavior:
    - The subtree is removed after its parent is found.
    - Traversal continues upward and does not remove the parent unless its own callback
      returns REMOVE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NESTED_HEAD_STOP_BEFORE_DESCENT
    category: EDGE
    description: STOP at an internal node's head prevents entry into that subtree.
    preconditions:
    - A non-root node with at least one child returns STOP from head.
    expectedSourceBehavior:
    - The method immediately returns STOP.
    - The selected node receives no tail, its descendants are unvisited, and no later
      sibling is visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIBLING_HEAD_STOP
    category: EDGE
    description: Traversal completes an earlier sibling and stops at the next sibling's
      head.
    preconditions:
    - Root has at least two children.
    - The first child completes normally and the second child's head returns STOP.
    expectedSourceBehavior:
    - Callbacks for the first subtree occur before STOP.
    - The method returns STOP without tailing the stopping node or the root.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAF_TAIL_STOP_BEFORE_SIBLING
    category: EDGE
    description: STOP from a leaf tail prevents advancement to an available sibling.
    preconditions:
    - A positive-depth leaf has a next sibling.
    - Its head returns CONTINUE and its tail returns STOP.
    expectedSourceBehavior:
    - The method returns STOP immediately from tail.
    - The next sibling and all remaining nodes are unvisited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERNAL_TAIL_STOP_DURING_ASCENT
    category: EDGE
    description: STOP occurs while tailing an internal node after its descendants.
    preconditions:
    - A non-root internal node's descendants complete normally.
    - That internal node's tail returns STOP.
    expectedSourceBehavior:
    - All nodes in the selected subtree before its tail are visited.
    - The method returns STOP without visiting later siblings or tailing higher ancestors.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_THEN_TAIL_STOP
    category: EDGE
    description: SKIP_CHILDREN at head is followed by STOP at the same node's tail.
    preconditions:
    - A positive-depth non-leaf node returns SKIP_CHILDREN from head and STOP from
      tail.
    expectedSourceBehavior:
    - Its descendants are skipped.
    - Its tail is invoked and immediately terminates the method with STOP.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_THEN_TAIL_REMOVE
    category: EDGE
    description: A pruned non-leaf node is removed by its tail result.
    preconditions:
    - A positive-depth non-leaf node returns SKIP_CHILDREN from head and REMOVE from
      tail.
    - The node has a next sibling.
    expectedSourceBehavior:
    - No descendant callback occurs, but the selected node receives tail.
    - The entire untouched subtree is removed and traversal continues with the next
      sibling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_THEN_TAIL_SKIP_ENTIRELY
    category: EDGE
    description: A pruned node's tail returns SKIP_ENTIRELY.
    preconditions:
    - A positive-depth non-leaf node returns SKIP_CHILDREN from head and SKIP_ENTIRELY
      from tail.
    - The node has a next sibling.
    expectedSourceBehavior:
    - Children remain unvisited and the node remains in the DOM.
    - Traversal advances to the next sibling because only REMOVE triggers deletion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NESTED_TAIL_SKIP_CHILDREN_RESET
    category: EDGE
    description: SKIP_CHILDREN returned from the tail of a last child is reset during
      ascent.
    preconditions:
    - A positive-depth last child returns SKIP_CHILDREN from tail.
    expectedSourceBehavior:
    - The child remains in the DOM.
    - After ascent, the carried result is reset to CONTINUE and the parent is processed
      normally.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NESTED_TAIL_SKIP_ENTIRELY_RESET
    category: EDGE
    description: SKIP_ENTIRELY returned from the tail of a last child does not prune
      its already visited parent.
    preconditions:
    - A positive-depth last child returns SKIP_ENTIRELY from tail.
    expectedSourceBehavior:
    - No node is removed.
    - Ascent resets the result to CONTINUE before the parent tail path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_ONLY_CHILD_FROM_TAIL
    category: EDGE
    description: An only child completes normally and is removed from tail.
    preconditions:
    - root.childNodeSize() == 1 and the child is a leaf.
    - The child's tail returns REMOVE.
    expectedSourceBehavior:
    - The child receives head and tail before removal.
    - The root becomes childless, is tailed, and the method returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEPTH_SELECTED_PRUNING
    category: NORMAL
    description: A clone-invariant policy prunes every node at a selected positive
      depth.
    preconditions:
    - The tree reaches depth at least 3.
    - Head returns SKIP_CHILDREN exactly at depth 2 and CONTINUE at shallower depths.
    expectedSourceBehavior:
    - Depth-2 nodes receive head and tail, but no callback occurs below depth 2.
    - Traversal still visits all distinct branches up to the selected depth.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_SIBLING_HEAD_RESULTS
    category: NORMAL
    description: Different siblings exercise SKIP_CHILDREN, REMOVE, and CONTINUE in
      one traversal.
    preconditions:
    - Root has at least three non-leaf children distinguishable by clone-preserved
      DOM properties.
    - Their heads respectively return SKIP_CHILDREN, REMOVE, and CONTINUE.
    expectedSourceBehavior:
    - The first subtree remains but its descendants are skipped, the second subtree
      is removed, and the third subtree is fully traversed.
    - Traversal reaches root tail and normally returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_AND_NONEMPTY_BRANCHES
    category: NORMAL
    description: Sibling branches include both a leaf and a non-leaf node.
    preconditions:
    - One root child has childNodeSize() == 0 and another has childNodeSize() > 0.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - The leaf follows the immediate-tail path while the non-leaf follows the descent
      path.
    - Both branches complete in document order.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDE_DEEP_TREE
    category: NORMAL
    description: A tree is both wide and deep, repeatedly exercising sibling and ascent
      transitions.
    preconditions:
    - Root has at least three children.
    - Maximum depth is at least 3 and at least two internal nodes have multiple children.
    - All callbacks return CONTINUE.
    expectedSourceBehavior:
    - Every node receives exactly one head and one tail.
    - The method completes with CONTINUE and unchanged outerHtml().
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONSECUTIVE_HEAD_REMOVALS
    category: EDGE
    description: Several consecutive siblings are removed from head while traversal
      retains a valid next cursor.
    preconditions:
    - Root has at least three children.
    - The first two children return REMOVE from head and the final child returns CONTINUE.
    expectedSourceBehavior:
    - The first two children are removed without tail callbacks.
    - Traversal still reaches and fully visits the surviving final child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVE_ALL_CHILDREN_MIXED_PATHS
    category: EDGE
    description: All root children are removed using both sibling and final-child
      ascent paths.
    preconditions:
    - Root has at least two children.
    - Every child returns REMOVE from head.
    expectedSourceBehavior:
    - Non-final removals advance through captured next siblings, while the final removal
      captures the parent and ascends.
    - The root ends childless, remains detached, and is tailed normally.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STOP_AFTER_PRIOR_REMOVAL
    category: EDGE
    description: Traversal mutates an earlier subtree and later terminates with STOP.
    preconditions:
    - Root has at least two children.
    - The first child's head returns REMOVE and a later sibling's head returns STOP.
    expectedSourceBehavior:
    - The first child is absent from final outerHtml().
    - The method returns STOP at the later sibling without rolling back the completed
      removal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_REMOVE_AFTER_DESCENDANTS
    category: EDGE
    description: A non-leaf root is fully traversed and then returns REMOVE from tail.
    preconditions:
    - root.childNodeSize() > 0.
    - All descendant callbacks return CONTINUE and root tail returns REMOVE.
    expectedSourceBehavior:
    - All descendants are visited normally.
    - The method returns REMOVE but does not detach or delete the root.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_STOP_AFTER_REMOVALS
    category: EDGE
    description: The root tail stops traversal after descendant removals have completed.
    preconditions:
    - At least one descendant returns REMOVE and is removed before root tail.
    - Root tail returns STOP.
    expectedSourceBehavior:
    - Completed descendant removals remain visible in final outerHtml().
    - The method returns STOP from depth 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDER_SENSITIVE_FRESH_FILTER
    category: NORMAL
    description: A fresh-reset callback schedule makes different decisions at successive
      clone-equivalent visits.
    preconditions:
    - The tree contains enough nodes to produce at least four head callbacks.
    - The filter class satisfies freshEquivalentFilter construction and initializes
      its callback counter identically in each instance.
    - The scheduled results include at least one CONTINUE and one non-STOP pruning
      result before normal completion.
    expectedSourceBehavior:
    - The source callback sequence reaches every scheduled decision in deterministic
      depth-first order.
    - A freshly constructed equivalent filter can reproduce the same terminal result
      and final DOM on the clone.
    targetCases: 1
    emptyOutputAllowed: false
