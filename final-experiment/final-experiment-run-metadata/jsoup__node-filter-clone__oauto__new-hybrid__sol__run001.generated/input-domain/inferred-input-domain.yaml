InputDomain:
  summary: Detached finite jsoup Node trees paired with clone-equivalent, reflectively
    reproducible NodeFilter policies that exercise every FilterResult, depth-first
    descent, sibling advance, ascent, pruning, removal, stopping, and root sentinel
    behavior.
  globalConstraints:
  - arg0 filter is non-null because generateFollowUp explicitly rejects a null filter.
  - arg1 root is non-null because generateFollowUp explicitly rejects a null root;
    therefore the target's root-null fallback returning CONTINUE is outside this metamorphic
    relation.
  - root.parentNode() is null before follow-up generation because generateFollowUp
    rejects an attached source root.
  - The source root contains a finite acyclic DOM subtree so depth-first traversal
    and deep cloning terminate.
  - root.clone() produces a detached deep clone whose initial outerHtml equals the
    source root's initial outerHtml, as required for the supplied deep-clone equivalence
    relation.
  - Every reached filter.head and filter.tail call returns a non-null NodeFilter.FilterResult
    value from CONTINUE, SKIP_CHILDREN, SKIP_ENTIRELY, REMOVE, or STOP.
  - '{The filter class is reproducible by freshEquivalentFilter=it either has an accessible
    declared no-argument constructor producing the same initial policy, or has no
    no-argument constructor and has one constructor whose parameter sequence is compatible
    with all non-static declared fields in reflection order.}'
  - Source and fresh filters make equivalent decisions for clone-corresponding nodes
    and depths; decisions may use clone-preserved tree structure or content but not
    source-node object identity.
  - Any filter state, external input, or callback side effect that can affect the
    returned FilterResult or final outerHtml is initialized equivalently and evolves
    deterministically in the source and follow-up executions.
  - Callback-initiated DOM changes, if present, must be clone-equivariant and use
    only corresponding nodes; identity-specific or execution-order-external mutations
    are excluded because the asserted final DOM equality would not define clone equivalence
    for them.
  - '{No assumption is made that REMOVE detaches the supplied root=the source explicitly
    returns when node equals root before executing the sibling-removal block.}'
  diversity:
    treeShape:
    - single-node
    - one-child
    - deep-chain
    - sibling-list
    - branched-tree
    - wide-tree
    rootRuntimeKind:
    - Element
    - other-Node-subtype
    headResult:
    - CONTINUE
    - SKIP_CHILDREN
    - SKIP_ENTIRELY
    - REMOVE
    - STOP
    tailResult:
    - CONTINUE
    - SKIP_CHILDREN
    - SKIP_ENTIRELY
    - REMOVE
    - STOP
    selectedNodePosition:
    - root
    - first-child
    - middle-sibling
    - last-sibling
    - internal-node
    - deep-leaf
    terminalPath:
    - root-head
    - root-tail
    - descendant-head
    - descendant-tail
    - normal-root-completion
    removalPath:
    - none
    - sibling-advance-removal
    - ascent-removal
    - root-removal-sentinel
    filterCopyPath:
    - no-argument-constructor
    - field-compatible-parameterized-constructor
  scenarios:
  - id: SINGLE_ROOT_CONTINUE
    category: BOUNDARY
    description: A detached leaf root is fully visited and both callbacks continue.
    preconditions:
    - root.childNodeSize() equals 0.
    - filter.head(root, 0) returns CONTINUE.
    - filter.tail(root, 0) returns CONTINUE.
    expectedSourceBehavior:
    - head is called once at depth 0 and tail is called once at depth 0.
    - The method returns CONTINUE and root.outerHtml is unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_STOP
    category: EDGE
    description: A leaf root continues at head and stops from its root tail callback.
    preconditions:
    - root.childNodeSize() equals 0.
    - filter.head(root, 0) returns CONTINUE.
    - filter.tail(root, 0) returns STOP.
    expectedSourceBehavior:
    - The root tail callback is reached through the post-ascent tail block.
    - The method returns STOP without changing the root DOM.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_REMOVE_SENTINEL
    category: EDGE
    description: A leaf root requests REMOVE from tail, testing the root equality
      sentinel.
    preconditions:
    - root.childNodeSize() equals 0.
    - filter.head(root, 0) returns CONTINUE.
    - filter.tail(root, 0) returns REMOVE.
    expectedSourceBehavior:
    - The method returns REMOVE when node equals root.
    - The detached root is not removed because removal occurs only after the root
      equality check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_SKIP_CHILDREN_RESULT
    category: BOUNDARY
    description: A leaf root returns SKIP_CHILDREN from tail.
    preconditions:
    - root.childNodeSize() equals 0.
    - filter.head(root, 0) returns CONTINUE.
    - filter.tail(root, 0) returns SKIP_CHILDREN.
    expectedSourceBehavior:
    - The method returns SKIP_CHILDREN from the root tail.
    - No DOM node is removed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_TAIL_SKIP_ENTIRELY_RESULT
    category: BOUNDARY
    description: A leaf root returns SKIP_ENTIRELY from tail.
    preconditions:
    - root.childNodeSize() equals 0.
    - filter.head(root, 0) returns CONTINUE.
    - filter.tail(root, 0) returns SKIP_ENTIRELY.
    expectedSourceBehavior:
    - The method returns SKIP_ENTIRELY from the root tail.
    - The root serialization remains unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_HEAD_STOP
    category: BOUNDARY
    description: Traversal stops immediately at the detached root.
    preconditions:
    - filter.head(root, 0) returns STOP.
    expectedSourceBehavior:
    - No child head or root tail callback is reached.
    - The method returns STOP and the DOM remains unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAF_ROOT_SKIP_CHILDREN
    category: BOUNDARY
    description: A childless root returns SKIP_CHILDREN and is still tailed.
    preconditions:
    - root.childNodeSize() equals 0.
    - filter.head(root, 0) returns SKIP_CHILDREN.
    - filter.tail(root, 0) returns CONTINUE.
    expectedSourceBehavior:
    - The descent condition is false and root tail is called.
    - The method returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAF_ROOT_SKIP_ENTIRELY
    category: BOUNDARY
    description: A childless root is skipped entirely.
    preconditions:
    - root.childNodeSize() equals 0.
    - filter.head(root, 0) returns SKIP_ENTIRELY.
    expectedSourceBehavior:
    - Root tail is not called.
    - The method returns SKIP_ENTIRELY without DOM mutation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAF_ROOT_REMOVE
    category: EDGE
    description: REMOVE is returned directly by the head callback of a detached leaf
      root.
    preconditions:
    - root.childNodeSize() equals 0.
    - filter.head(root, 0) returns REMOVE.
    expectedSourceBehavior:
    - Root tail is not called.
    - The method returns REMOVE but does not detach or otherwise remove the root.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_SKIP_CHILDREN_TAIL_STOP
    category: EDGE
    description: A root with children suppresses descent and then stops from tail.
    preconditions:
    - root.childNodeSize() is greater than 0.
    - filter.head(root, 0) returns SKIP_CHILDREN.
    - filter.tail(root, 0) returns STOP.
    expectedSourceBehavior:
    - No descendant callback is reached.
    - The method returns STOP and all root children remain present.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_CHILD_FULL_TRAVERSAL
    category: NORMAL
    description: A root with exactly one leaf child completes ordinary descent and
      ascent.
    preconditions:
    - root.childNodeSize() equals 1 and root.childNode(0).childNodeSize() equals 0.
    - Every reached head and tail callback returns CONTINUE.
    expectedSourceBehavior:
    - Heads occur at depths 0 and 1, followed by tails at depths 1 and 0.
    - The method returns CONTINUE with unchanged outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEEP_CHAIN_FULL_TRAVERSAL
    category: NORMAL
    description: A chain of at least four nodes exercises repeated descent and repeated
      ascent.
    preconditions:
    - The root-to-leaf path contains at least four nodes.
    - Every non-leaf on the path has exactly one child.
    - Every reached callback returns CONTINUE.
    expectedSourceBehavior:
    - Maximum callback depth is at least 3.
    - Every node receives head before tail and the method returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWO_SIBLINGS_FULL_TRAVERSAL
    category: NORMAL
    description: Two leaf children exercise direct sibling advancement after the first
      tail.
    preconditions:
    - root.childNodeSize() equals 2.
    - Both children have childNodeSize() equal to 0.
    - Every reached callback returns CONTINUE.
    expectedSourceBehavior:
    - The first child's tail is followed by the second child's head at the same depth.
    - Root tail occurs after both children and the method returns CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BRANCHED_DEPTH_FIRST_ORDER
    category: NORMAL
    description: Multiple internal children and leaves exercise depth-first document
      order.
    preconditions:
    - root has at least two children.
    - At least one non-last child has a descendant and a later sibling.
    - Every reached callback returns CONTINUE.
    expectedSourceBehavior:
    - All descendants of the non-last internal child are completed before its later
      sibling is headed.
    - Each reached node is headed and tailed exactly once.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_INTERNAL_NONLAST
    category: NORMAL
    description: A non-last internal node skips descendants but traversal continues
      with its sibling.
    preconditions:
    - A depth-positive non-last child has at least one child of its own.
    - Its head returns SKIP_CHILDREN and its tail returns CONTINUE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - None of the selected node's descendants is visited.
    - The selected node is tailed and its next sibling is subsequently headed.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_INTERNAL_LAST
    category: EDGE
    description: A last internal child skips descendants and then enters the ascent
      loop.
    preconditions:
    - A depth-positive last child has at least one child of its own.
    - Its head returns SKIP_CHILDREN and its tail returns CONTINUE.
    - Ancestor callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected node's descendants are not visited.
    - Its tail runs before traversal ascends and eventually tails the root.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_SKIP_CHILDREN_PRESERVES_SUBTREE
    category: BOUNDARY
    description: SKIP_CHILDREN at a non-leaf root suppresses the whole descendant
      traversal.
    preconditions:
    - root.childNodeSize() is greater than 0.
    - filter.head(root, 0) returns SKIP_CHILDREN.
    - filter.tail(root, 0) returns CONTINUE.
    expectedSourceBehavior:
    - Only root head and root tail are called.
    - The method returns CONTINUE and the complete subtree is preserved.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_CHILDREN_ON_LEAF_CHILD
    category: EDGE
    description: SKIP_CHILDREN on a leaf child follows the same tail eligibility without
      descent.
    preconditions:
    - A depth-positive non-last leaf is selected.
    - Its head returns SKIP_CHILDREN and its tail returns CONTINUE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected leaf is tailed exactly once.
    - Traversal advances to its next sibling and completes normally.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_ENTIRELY_INTERNAL_NONLAST
    category: NORMAL
    description: A non-last internal subtree is skipped without a tail callback.
    preconditions:
    - A depth-positive non-last node has at least one descendant.
    - Its head returns SKIP_ENTIRELY.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - Neither descendants nor tail of the selected node are visited.
    - Its next sibling is visited and the selected subtree remains in the DOM.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_ENTIRELY_INTERNAL_LAST
    category: EDGE
    description: A last internal subtree is skipped and traversal ascends without
      tailing it.
    preconditions:
    - A depth-positive last child has at least one descendant.
    - Its head returns SKIP_ENTIRELY.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected node receives no tail callback and its descendants are untouched.
    - Traversal ascends to the parent and ultimately returns the root terminal result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_SKIP_ENTIRELY_PRESERVES_SUBTREE
    category: BOUNDARY
    description: A non-leaf root is skipped entirely.
    preconditions:
    - root.childNodeSize() is greater than 0.
    - filter.head(root, 0) returns SKIP_ENTIRELY.
    expectedSourceBehavior:
    - No descendant or tail callback is reached.
    - The method returns SKIP_ENTIRELY and preserves the entire detached tree.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_NONLAST_LEAF
    category: NORMAL
    description: A non-last leaf requests removal from head and traversal resumes
      at its sibling.
    preconditions:
    - A selected depth-positive leaf has a next sibling.
    - Its head returns REMOVE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected leaf is not tailed.
    - It is removed after its next sibling is captured, and that sibling is then visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_LAST_LEAF
    category: EDGE
    description: A last leaf requests removal from head and is removed during ascent.
    preconditions:
    - A selected depth-positive leaf has no next sibling.
    - Its head returns REMOVE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected leaf is not tailed.
    - Its parent is captured before removal, the leaf is removed, and traversal continues
      by tailing ancestors.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_NONLAST_SUBTREE
    category: NORMAL
    description: Head REMOVE prunes a non-last internal node and all of its descendants.
    preconditions:
    - A selected depth-positive internal node has descendants and a next sibling.
    - Its head returns REMOVE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - No descendant or tail callback occurs for the selected subtree.
    - The entire selected subtree is absent from final outerHtml and the next sibling
      is visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_REMOVE_LAST_SUBTREE
    category: EDGE
    description: Head REMOVE prunes a last internal subtree through the ascent-removal
      path.
    preconditions:
    - A selected depth-positive internal node has descendants and no next sibling.
    - Its head returns REMOVE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected subtree receives no descendant or tail callbacks.
    - The subtree is removed after locating its parent, then ancestor traversal continues.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_HEAD_REMOVE_PRESERVES_ROOT
    category: EDGE
    description: A non-leaf detached root returns REMOVE from head.
    preconditions:
    - root.childNodeSize() is greater than 0.
    - filter.head(root, 0) returns REMOVE.
    expectedSourceBehavior:
    - Descendants and root tail are not visited.
    - The method returns REMOVE while the root and all of its children remain serialized.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_NONLAST_LEAF
    category: NORMAL
    description: A non-last leaf is visited normally and removed by its tail result.
    preconditions:
    - A selected depth-positive leaf has a next sibling.
    - Its head returns CONTINUE and its tail returns REMOVE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The leaf receives both callbacks.
    - It is removed after the next sibling is captured, and traversal proceeds to
      that sibling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_LAST_LEAF
    category: EDGE
    description: A last leaf is removed from tail while traversal ascends.
    preconditions:
    - A selected depth-positive leaf has no next sibling.
    - Its head returns CONTINUE and its tail returns REMOVE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The ascent loop captures the parent before removing the leaf.
    - The removal result is reset to CONTINUE for subsequent parent processing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_NONLAST_INTERNAL_NODE
    category: NORMAL
    description: An internal node is removed after all descendants complete, before
      a sibling is visited.
    preconditions:
    - A selected depth-positive internal node has a next sibling.
    - Its head and descendant callbacks return CONTINUE.
    - Its tail returns REMOVE.
    expectedSourceBehavior:
    - Descendants are visited before the internal node is tailed.
    - The completed subtree is removed and traversal continues at the saved next sibling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_REMOVE_LAST_INTERNAL_NODE
    category: EDGE
    description: A last internal subtree is removed from tail during multi-level ascent.
    preconditions:
    - A selected depth-positive internal node has no next sibling.
    - Its head and descendant callbacks return CONTINUE.
    - Its tail returns REMOVE.
    expectedSourceBehavior:
    - The subtree is fully visited before removal.
    - Its parent remains available for continued ascent and root completion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_NONLAST_LEAF
    category: EDGE
    description: A non-last leaf stops traversal from the post-loop tail location.
    preconditions:
    - A selected depth-positive leaf has a next sibling.
    - Its head returns CONTINUE and its tail returns STOP.
    expectedSourceBehavior:
    - The method returns STOP immediately.
    - The selected leaf's next sibling and all later nodes are not visited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_LAST_LEAF
    category: EDGE
    description: A last leaf stops traversal from the ascent-loop tail location.
    preconditions:
    - A selected depth-positive leaf has no next sibling.
    - Its head returns CONTINUE and its tail returns STOP.
    expectedSourceBehavior:
    - STOP is returned before moving to or tailing the parent.
    - No removal is performed for the selected leaf.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_STOP_INTERNAL_AFTER_DESCENDANTS
    category: EDGE
    description: An internal node stops traversal from tail after its subtree has
      completed.
    preconditions:
    - A selected depth-positive internal node has at least one descendant.
    - Its head and all descendant callbacks return CONTINUE.
    - Its tail returns STOP.
    expectedSourceBehavior:
    - All selected descendants are visited before STOP.
    - No later sibling or ancestor tail callback is reached.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_STOP_FIRST_CHILD
    category: EDGE
    description: Traversal stops at the first child immediately after descending from
      the root.
    preconditions:
    - root.childNodeSize() is greater than 0.
    - Root head returns CONTINUE.
    - The first child's head at depth 1 returns STOP.
    expectedSourceBehavior:
    - The method returns STOP before any tail callback.
    - The first child's descendants and all later siblings remain unvisited.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_STOP_DEEP_DESCENDANT
    category: EDGE
    description: Traversal stops from head at depth at least three.
    preconditions:
    - The tree contains a root-to-node path of at least four nodes.
    - Heads on proper ancestors return CONTINUE.
    - The selected node's head returns STOP.
    expectedSourceBehavior:
    - Descent reaches depth at least 3 before termination.
    - No selected-node tail or ancestor tail is called after STOP.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HEAD_STOP_LATER_SIBLING
    category: EDGE
    description: A later sibling stops traversal after an earlier sibling has completed.
    preconditions:
    - A parent has at least two children.
    - All callbacks for the first child return CONTINUE.
    - A later child's head returns STOP.
    expectedSourceBehavior:
    - The earlier sibling receives its normal tail before the stopping head.
    - The method returns STOP and does not visit nodes after the stopping sibling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROOT_STOP_PRESERVES_CHILDREN
    category: BOUNDARY
    description: STOP at a root with descendants tests immediate termination before
      descent.
    preconditions:
    - root.childNodeSize() is greater than 0.
    - filter.head(root, 0) returns STOP.
    expectedSourceBehavior:
    - No descendant or root tail callback occurs.
    - The method returns STOP with the complete subtree unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_SKIP_CHILDREN_THEN_SIBLING
    category: EDGE
    description: SKIP_CHILDREN returned from a non-last node's tail has no removal
      or stop effect.
    preconditions:
    - A selected depth-positive node has a next sibling.
    - Its head returns CONTINUE and its tail returns SKIP_CHILDREN.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected node is retained.
    - Traversal advances to its next sibling despite the tail result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TAIL_SKIP_ENTIRELY_THEN_SIBLING
    category: EDGE
    description: SKIP_ENTIRELY returned from a non-last node's tail still permits
      sibling traversal.
    preconditions:
    - A selected depth-positive node has a next sibling.
    - Its head returns CONTINUE and its tail returns SKIP_ENTIRELY.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The selected node remains in the DOM.
    - Its next sibling is headed and traversal completes normally.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_PRUNING_RESULTS_ACROSS_SIBLINGS
    category: NORMAL
    description: Distinct sibling subtrees respectively continue, skip children, skip
      entirely, and remove.
    preconditions:
    - root has at least four ordered child subtrees identifiable by clone-preserved
      structure or content.
    - Their head results in order are CONTINUE, SKIP_CHILDREN, SKIP_ENTIRELY, and
      REMOVE.
    - Reached tails not otherwise specified return CONTINUE.
    expectedSourceBehavior:
    - The first subtree is fully traversed, the second is tailed without descendant
      traversal, and the third receives no tail.
    - The fourth subtree is removed, while the second and third remain structurally
      intact.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MULTIPLE_REMOVAL_PATHS
    category: NORMAL
    description: One non-last node is removed from head and a later last node is removed
      from tail.
    preconditions:
    - A parent has at least three children.
    - A non-last child's head returns REMOVE.
    - A later last child's head returns CONTINUE and tail returns REMOVE.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The first selected child uses sibling-advance removal.
    - The last selected child uses ascent removal, and both are absent from final
      outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PRUNED_DESCENDANT_STOP_NOT_REACHED
    category: EDGE
    description: A STOP policy located below a SKIP_CHILDREN node remains unreachable.
    preconditions:
    - An internal node's head returns SKIP_CHILDREN and its tail returns CONTINUE.
    - A descendant would return STOP if headed.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - The descendant STOP callback is never invoked.
    - Traversal continues outside the skipped subtree and does not return STOP for
      that policy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REMOVED_DESCENDANT_STOP_NOT_REACHED
    category: EDGE
    description: A STOP policy inside a subtree removed from head remains unreachable.
    preconditions:
    - An internal node's head returns REMOVE.
    - A descendant would return STOP if headed.
    - Other reached callbacks return CONTINUE.
    expectedSourceBehavior:
    - No descendant callback occurs before the subtree is removed.
    - Traversal continues with a sibling or ancestor rather than returning the unreachable
      STOP.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HETEROGENEOUS_NODE_SUBTYPES
    category: NORMAL
    description: A detached tree contains an Element root and descendants of at least
      two Node runtime classes.
    preconditions:
    - root is an Element.
    - At least two descendants have different runtime classes assignable to Node.
    - Every reached callback returns CONTINUE.
    expectedSourceBehavior:
    - Traversal treats all runtime node classes through the Node API in depth-first
      order.
    - The method returns CONTINUE and preserves exact outerHtml.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_ELEMENT_ROOT
    category: NORMAL
    description: A detached root whose runtime class is a Node subtype other than
      Element is traversed directly.
    preconditions:
    - root is not an Element.
    - The root is detached and cloneable.
    - Every reached callback returns CONTINUE.
    expectedSourceBehavior:
    - The root is headed and tailed at depth 0 without an Element cast.
    - The method returns CONTINUE with equivalent source and clone serialization.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDE_SIBLING_SEQUENCE
    category: BOUNDARY
    description: A root with many leaf children repeatedly exercises sibling advancement.
    preconditions:
    - root.childNodeSize() is at least 10.
    - Every child is a leaf.
    - Every reached callback returns CONTINUE.
    expectedSourceBehavior:
    - All children are visited in sibling order at depth 1.
    - Exactly one final ascent to the root occurs after the last child.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEEP_ASCENT_AFTER_LAST_LEAF
    category: BOUNDARY
    description: A deep last leaf triggers repeated no-sibling ascent through several
      ancestors.
    preconditions:
    - The tree contains a path reaching depth at least 10.
    - Every node on that path is the last child of its parent.
    - Every reached callback returns CONTINUE.
    expectedSourceBehavior:
    - The inner ascent loop tails nodes at successively decreasing depths.
    - Traversal terminates at the root with CONTINUE.
    targetCases: 1
    emptyOutputAllowed: false
