InputDomain:
  summary: Non-null HTML body fragments cleaned with the same non-null base URI and
    the same Safelist instance on both source and follow-up executions. Cases span
    empty, text-only, malformed, allowed, disallowed, URL-bearing, entity-bearing,
    and structural HTML across all discovered Safelist factory profiles and the public
    no-argument Safelist constructor.
  globalConstraints:
  - bodyHtml is a non-null String; null is excluded because the supplied method delegates
    it to parsing without documenting null-input behavior.
  - baseUri is a non-null String; null is excluded because the supplied source immediately
    invokes baseUri.isEmpty().
  - '{safelist is a non-null Safelist instance constructed only through public discovered
    candidates=new Safelist(), Safelist.none(), Safelist.simpleText(), Safelist.basic(),
    Safelist.basicWithImages(), Safelist.relaxed(), or a copy of one of those instances.}'
  - The follow-up input is exactly the String returned by the source invocation; follow-up
    baseUri and Safelist object identity are preserved.
  - No scenario requires a Safelist configuration method not present in the discovered
    construction metadata; in particular, preserveRelativeLinks(boolean) is not invoked.
  diversity:
    safelistProfile:
    - '6'
    - each discovered factory/no-argument profile is exercised
    - new Safelist(); none(); simpleText(); basic(); basicWithImages(); relaxed()
    baseUriForm:
    - '3'
    - empty and absolute base URI forms
    - '""; https://example.test/root/page.html; https://example.test/assets/'
    htmlStructure:
    - '10'
    - distinct parser and cleaner input structures
    - empty; text; allowed element; disallowed element; nested elements; malformed
      nesting; comments; declarations; tables; images
    attributeAndUrlForm:
    - '9'
    - distinct attribute and protocol conditions
    - no attribute; allowed attribute; unknown attribute; event handler; absolute
      http URL; relative URL; javascript URL; protocol-relative URL; encoded/whitespace-obscured
      protocol
  scenarios:
  - id: NONE_EMPTY_FRAGMENT
    category: BOUNDARY
    description: Empty body fragment under the text-node-only Safelist profile.
    preconditions:
    - bodyHtml equals ""
    - baseUri equals ""
    - safelist is Safelist.none()
    expectedSourceBehavior:
    - The source result is an empty body-fragment serialization.
    targetCases: 1
    emptyOutputAllowed: true
  - id: NONE_PLAIN_TEXT
    category: NORMAL
    description: Plain text containing comparison characters and an ampersand under
      Safelist.none().
    preconditions:
    - bodyHtml equals "5 < 6 & 7 > 3"
    - baseUri equals ""
    - safelist is Safelist.none()
    expectedSourceBehavior:
    - Text content remains represented as HTML-safe serialized text rather than as
      permitted markup.
    - The source result is non-empty.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONE_ALLOWED_LOOKING_MARKUP_REMOVED_TEXT_RETAINED
    category: NORMAL
    description: Element markup with visible text under Safelist.none().
    preconditions:
    - bodyHtml equals "<p>Hello <b>world</b></p>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.none()
    expectedSourceBehavior:
    - Element markup is not permitted by this Safelist profile.
    - Visible textual content provides a non-empty result after cleaning.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONE_SCRIPT_ONLY
    category: EDGE
    description: Script element with no surrounding visible body text under Safelist.none().
    preconditions:
    - bodyHtml equals "<script>alert(1)</script>"
    - baseUri equals ""
    - safelist is Safelist.none()
    expectedSourceBehavior:
    - The script element is not retained as safe body markup.
    targetCases: 1
    emptyOutputAllowed: true
  - id: NONE_ENTITY_TEXT
    category: EDGE
    description: Text expressed with named and numeric character references under
      Safelist.none().
    preconditions:
    - bodyHtml equals "A&amp;B &#x3C; C &#62; D"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.none()
    expectedSourceBehavior:
    - Parsed text is serialized as HTML body content.
    - The source result is non-empty.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_INLINE_FORMATTING
    category: NORMAL
    description: Simple inline formatting elements under Safelist.simpleText().
    preconditions:
    - bodyHtml equals "<b>bold</b> <em>emphasis</em> <strong>strong</strong>"
    - baseUri equals ""
    - safelist is Safelist.simpleText()
    expectedSourceBehavior:
    - The result contains non-empty cleaned body content.
    - The case exercises permitted-versus-filtered inline element handling for the
      simple-text profile.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_BLOCK_ELEMENT
    category: NORMAL
    description: Paragraph and heading structure under Safelist.simpleText().
    preconditions:
    - bodyHtml equals "<h1>Title</h1><p>Paragraph</p>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.simpleText()
    expectedSourceBehavior:
    - The result contains the input's visible text.
    - The cleaner normalizes the fragment according to the simple-text policy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_LINK_WITH_HREF
    category: NORMAL
    description: Anchor with an absolute HTTP URL under Safelist.simpleText().
    preconditions:
    - bodyHtml equals "<a href=\"https://safe.example/path\">link text</a>"
    - baseUri equals ""
    - safelist is Safelist.simpleText()
    expectedSourceBehavior:
    - The result contains non-empty link text.
    - The case distinguishes link and URL-attribute policy from plain text.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIMPLE_TEXT_UNSAFE_CONTAINER
    category: EDGE
    description: Unsafe container enclosing visible text and an inline formatting
      child.
    preconditions:
    - bodyHtml equals "<div><script>x()</script><b>kept text</b></div>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.simpleText()
    expectedSourceBehavior:
    - Unsafe script markup is not retained.
    - Visible non-script text makes the source result non-empty.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_ABSOLUTE_HTTP_LINK
    category: NORMAL
    description: Basic-profile anchor with an absolute HTTP href.
    preconditions:
    - bodyHtml equals "<a href=\"http://example.test/docs\">documentation</a>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains non-empty anchor text.
    - The case exercises an absolute URL attribute through the basic profile.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_ABSOLUTE_HTTPS_LINK
    category: NORMAL
    description: Basic-profile anchor with an absolute HTTPS href and title attribute.
    preconditions:
    - bodyHtml equals "<a href=\"https://example.test/docs?q=1\" title=\"Docs\">documentation</a>"
    - baseUri equals ""
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains non-empty anchor text.
    - The case exercises URL and non-URL attribute filtering on an allowed element.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_RELATIVE_LINK_WITH_ABSOLUTE_BASE
    category: NORMAL
    description: Relative anchor URL resolved in a fragment with an absolute base
      URI.
    preconditions:
    - bodyHtml equals "<a href=\"guide/start.html\">guide</a>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains non-empty anchor text.
    - The case exercises relative URL handling when a base URI is supplied.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_RELATIVE_LINK_WITH_EMPTY_BASE
    category: BOUNDARY
    description: Relative anchor URL with the empty base URI path in Jsoup.clean().
    preconditions:
    - bodyHtml equals "<a href=\"guide/start.html\">guide</a>"
    - baseUri equals ""
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains non-empty anchor text.
    - The case reaches the source method's baseUri.isEmpty() condition.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_JAVASCRIPT_LINK
    category: EDGE
    description: Anchor whose href uses the javascript protocol.
    preconditions:
    - bodyHtml equals "<a href=\"javascript:alert(1)\">click</a>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains non-empty visible anchor text.
    - The unsafe URL protocol is subject to Safelist URL-protocol filtering.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_WHITESPACE_OBSCURED_JAVASCRIPT_LINK
    category: EDGE
    description: Anchor whose href has leading whitespace before a javascript protocol.
    preconditions:
    - bodyHtml equals "<a href=\" \tjavascript:alert(1)\">click</a>"
    - baseUri equals ""
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains non-empty visible anchor text.
    - The case exercises protocol filtering after HTML attribute parsing and whitespace
      handling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_EVENT_HANDLER_ATTRIBUTE
    category: NORMAL
    description: Allowed-looking anchor with an event-handler attribute.
    preconditions:
    - bodyHtml equals "<a href=\"https://example.test/\" onclick=\"alert(1)\">safe
      text</a>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains non-empty visible text.
    - The event-handler attribute is subject to attribute filtering independently
      of href handling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_UNKNOWN_ATTRIBUTE
    category: NORMAL
    description: Paragraph with a nonstandard data attribute under Safelist.basic().
    preconditions:
    - bodyHtml equals "<p data-trace=\"123\" class=\"note\">paragraph</p>"
    - baseUri equals ""
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains non-empty paragraph text.
    - The case exercises filtering of attributes not established by the selected profile.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_NESTED_UNSAFE_ELEMENT
    category: EDGE
    description: Unsafe iframe nested inside visible paragraph content.
    preconditions:
    - bodyHtml equals "<p>before<iframe src=\"https://evil.example/\"></iframe>after</p>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - The result contains the visible before/after text.
    - The nested iframe is subject to element filtering.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_MALFORMED_NESTING
    category: EDGE
    description: Unbalanced inline and paragraph markup parsed as a body fragment.
    preconditions:
    - bodyHtml equals "<p>one<b>two</p>three</b>"
    - baseUri equals ""
    - safelist is Safelist.basic()
    expectedSourceBehavior:
    - Parsing produces a normalized body tree before cleaning.
    - The result contains non-empty visible text.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASIC_WITH_IMAGES_SAFE_IMAGE
    category: NORMAL
    description: Image element with an absolute HTTPS source under Safelist.basicWithImages().
    preconditions:
    - bodyHtml equals "<img src=\"https://images.example.test/a.png\" alt=\"sample\">"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.basicWithImages()
    expectedSourceBehavior:
    - The case exercises image-element and src protocol handling in the image-enabled
      profile.
    targetCases: 1
    emptyOutputAllowed: true
  - id: BASIC_WITH_IMAGES_RELATIVE_IMAGE
    category: NORMAL
    description: Image with a relative source and an absolute base URI.
    preconditions:
    - bodyHtml equals "<img src=\"images/a.png\" alt=\"sample\">"
    - baseUri equals "https://example.test/assets/"
    - safelist is Safelist.basicWithImages()
    expectedSourceBehavior:
    - The case exercises relative image URL handling with a supplied base URI.
    targetCases: 1
    emptyOutputAllowed: true
  - id: BASIC_WITH_IMAGES_DATA_IMAGE
    category: EDGE
    description: Image whose source is a data URI.
    preconditions:
    - bodyHtml equals "<img src=\"data:image/png;base64,AA==\" alt=\"inline\">"
    - baseUri equals ""
    - safelist is Safelist.basicWithImages()
    expectedSourceBehavior:
    - The image src protocol is evaluated by the selected Safelist profile.
    targetCases: 1
    emptyOutputAllowed: true
  - id: BASIC_WITH_IMAGES_SCRIPTED_IMAGE_URL
    category: EDGE
    description: Image whose source uses a javascript protocol.
    preconditions:
    - bodyHtml equals "<img src=\"javascript:alert(1)\" alt=\"bad\">caption"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.basicWithImages()
    expectedSourceBehavior:
    - The visible caption makes the source result non-empty.
    - The image URL is subject to URL-protocol filtering.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_HEADINGS_LISTS_AND_PARAGRAPHS
    category: NORMAL
    description: Mixed common structural content under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<h2>Heading</h2><p>Intro</p><ul><li>one</li><li>two</li></ul>"
    - baseUri equals ""
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty visible content from each structural region.
    - The case exercises multiple permitted structural elements in one parsed fragment.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_TABLE_STRUCTURE
    category: NORMAL
    description: Table, row, header, and data cells under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<table><thead><tr><th>A</th><th>B</th></tr></thead><tbody><tr><td>1</td><td>2</td></tr></tbody></table>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty cell text.
    - The case exercises table-tree parsing and relaxed-profile structural filtering.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_BLOCKQUOTE_AND_CODE
    category: NORMAL
    description: Quoted and preformatted-style content under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<blockquote><p>Quoted <code>x &lt; y</code></p></blockquote>"
    - baseUri equals ""
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty quoted and code text.
    - Entity parsing and nested structural content are exercised together.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_PROTOCOL_RELATIVE_LINK
    category: EDGE
    description: Anchor using a protocol-relative URL under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<a href=\"//cdn.example.test/lib.js\">cdn</a>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty anchor text.
    - The case exercises protocol-relative URL processing with an HTTPS base URI.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_MAILTO_LINK
    category: NORMAL
    description: Anchor using a mailto URL under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<a href=\"mailto:user@example.test\">email</a>"
    - baseUri equals ""
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty anchor text.
    - The mailto protocol is evaluated by the relaxed profile's URL policy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_CUSTOM_UNKNOWN_ELEMENT
    category: EDGE
    description: Unknown custom element containing allowed-looking child content.
    preconditions:
    - bodyHtml equals "<custom-card><p>inside</p></custom-card>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty visible child text.
    - The unknown container is subject to element filtering.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_COMMENT_AND_DECLARATION
    category: EDGE
    description: Comment and declaration adjacent to normal paragraph content.
    preconditions:
    - bodyHtml equals "<!doctype html><!-- hidden --><p>visible</p>"
    - baseUri equals ""
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty visible paragraph text.
    - The case exercises parser treatment of non-element nodes in a body fragment.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_STYLE_AND_VISIBLE_TEXT
    category: EDGE
    description: Style element adjacent to visible paragraph content.
    preconditions:
    - bodyHtml equals "<style>body{display:none}</style><p>visible</p>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty visible paragraph text.
    - The style element is subject to Safelist element filtering.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RELAXED_FORM_CONTROLS
    category: NORMAL
    description: Form-related elements and attributes under Safelist.relaxed().
    preconditions:
    - bodyHtml equals "<form action=\"https://example.test/post\"><input type=\"text\"
      value=\"x\"><button>Send</button></form>"
    - baseUri equals ""
    - safelist is Safelist.relaxed()
    expectedSourceBehavior:
    - The result contains non-empty button text.
    - The case exercises filtering of form-related elements, attributes, and an action
      URL.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEFAULT_SAFE_LIST_EMPTY_POLICY
    category: BOUNDARY
    description: Visible text and markup under a directly constructed Safelist instance.
    preconditions:
    - bodyHtml equals "<p>visible <b>text</b></p>"
    - baseUri equals ""
    - safelist is new Safelist()
    expectedSourceBehavior:
    - The source result is a normalized cleaned body fragment.
    - The case covers the public no-argument Safelist construction path without assuming
      its configured permissions.
    targetCases: 1
    emptyOutputAllowed: true
  - id: DEFAULT_SAFE_LIST_URL_ATTRIBUTE
    category: NORMAL
    description: Anchor with absolute URL and event-handler attribute under a directly
      constructed Safelist.
    preconditions:
    - bodyHtml equals "<a href=\"https://example.test/\" onclick=\"x()\">text</a>"
    - baseUri equals "https://example.test/root/page.html"
    - safelist is new Safelist()
    expectedSourceBehavior:
    - The source result is a normalized cleaned body fragment.
    - The case covers direct-Safelist handling of both URL and event-handler attributes
      without assuming permissions.
    targetCases: 1
    emptyOutputAllowed: true
  - id: DEFAULT_SAFE_LIST_EMPTY_BASE_RELATIVE_URL
    category: BOUNDARY
    description: Relative URL with an empty base URI under a directly constructed
      Safelist.
    preconditions:
    - bodyHtml equals "<img src=\"relative.png\" alt=\"image\">text"
    - baseUri equals ""
    - safelist is new Safelist()
    expectedSourceBehavior:
    - The source result is a normalized cleaned body fragment.
    - The case reaches the empty-base condition while exercising a URL-bearing attribute.
    targetCases: 1
    emptyOutputAllowed: true
