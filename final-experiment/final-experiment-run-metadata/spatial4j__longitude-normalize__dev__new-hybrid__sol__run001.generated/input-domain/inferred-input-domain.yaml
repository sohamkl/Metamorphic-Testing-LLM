InputDomain:
  summary: Finite double longitudes for which the implemented follow-up adds one revolution
    within the MR tolerance, covering the direct-return path, all remainder branches,
    antimeridian sentinels, multiple wraps, floating-point neighbors, and large magnitudes.
  globalConstraints:
  - The source input is exactly one Java double supplied to the static normLonDEG(double)
    method.
  - 'The source input must be finite: Double.isFinite(longitudeDeg) is true. NaN and
    infinities are excluded because normLonDEG produces NaN and assertRelation''s
    comparisons with NaN cannot detect a violation.'
  - 'The implemented shift must represent one revolution within its stated tolerance:
    Math.abs(((longitudeDeg + 360.0) - longitudeDeg) - 360.0) <= 1e-9. Larger finite
    magnitudes that fail this condition are excluded because floating-point addition
    no longer implements the developer-specified 360-degree transformation.'
  diversity:
    sourceRegion:
    - less than -180
    - exactly -180
    - strictly between -180 and 180
    - exactly 180
    - greater than 180
    sutBranch:
    - direct return
    - negative remainder off < 0
    - positive antimeridian off == 0 and longitude > 0
    - remaining off branch
    normalizedRegion:
    - near -180
    - negative interior
    - zero
    - positive interior
    - near 180
    revolutionCount:
    - zero wraps
    - first wrap
    - multiple wraps
    - large exactly shiftable magnitude
    floatingPointForm:
    - signed zero
    - subnormal
    - ordinary finite
    - adjacent representable boundary value
    - large power of two
    relationComparisonPath:
    - both outputs antimeridian
    - ordinary absolute-difference comparison
  scenarios:
  - id: SIGNED_ZERO_DIRECT_RETURN
    category: EDGE
    description: Positive and negative zero exercise the direct-return path and preservation
      of the supplied double.
    preconditions:
    - Double.doubleToRawLongBits(longitudeDeg) equals the raw bits of either +0.0
      or -0.0.
    expectedSourceBehavior:
    - The result is returned directly and has the same raw double bits as the source,
      including the sign of zero.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MINIMUM_SUBNORMAL_DIRECT_RETURN
    category: EDGE
    description: The smallest positive and negative nonzero doubles are valid in-range
      longitudes whose perturbation can be lost when 360 is added.
    preconditions:
    - longitudeDeg is either Double.MIN_VALUE or -Double.MIN_VALUE.
    expectedSourceBehavior:
    - The result is exactly the source value because it lies in [-180, 180].
    - The result is nonzero and finite.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ORDINARY_NEGATIVE_INTERIOR
    category: NORMAL
    description: Ordinary negative longitudes strictly inside the normal interval
      exercise the common direct-return path away from sentinels.
    preconditions:
    - -180.0 < longitudeDeg && longitudeDeg < 0.0.
    - Math.abs(longitudeDeg + 180.0) > 1e-9.
    expectedSourceBehavior:
    - The result equals longitudeDeg exactly.
    - The result is strictly between -180 and 0.
    targetCases: 3
    emptyOutputAllowed: false
  - id: ORDINARY_POSITIVE_INTERIOR
    category: NORMAL
    description: Ordinary positive longitudes strictly inside the normal interval
      exercise the common direct-return path away from sentinels.
    preconditions:
    - 0.0 < longitudeDeg && longitudeDeg < 180.0.
    - Math.abs(longitudeDeg - 180.0) > 1e-9.
    expectedSourceBehavior:
    - The result equals longitudeDeg exactly.
    - The result is strictly between 0 and 180.
    targetCases: 3
    emptyOutputAllowed: false
  - id: INSIDE_ANTIMERIDIAN_TOLERANCE
    category: BOUNDARY
    description: In-range values immediately inside either antimeridian endpoint exercise
      the MR's antimeridian-equivalence path.
    preconditions:
    - longitudeDeg is either -180.0 + 5e-10 or 180.0 - 5e-10.
    - Math.abs(Math.abs(longitudeDeg) - 180.0) <= 1e-9.
    expectedSourceBehavior:
    - The result equals longitudeDeg exactly via the direct-return path.
    - The result is classified as antimeridian by the supplied relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: JUST_OUTSIDE_ANTIMERIDIAN_TOLERANCE
    category: BOUNDARY
    description: In-range values close to, but measurably outside, the relation's
      antimeridian tolerance force its ordinary difference comparison.
    preconditions:
    - longitudeDeg is either -180.0 + 2e-9 or 180.0 - 2e-9.
    - Math.abs(Math.abs(longitudeDeg) - 180.0) > 1e-9.
    expectedSourceBehavior:
    - The result equals longitudeDeg exactly via the direct-return path.
    - The result is not classified as antimeridian by the supplied relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_NORMAL_RANGE_ENDPOINTS
    category: BOUNDARY
    description: The inclusive endpoints demonstrate that normLonDEG deliberately
      preserves both spellings of the antimeridian.
    preconditions:
    - longitudeDeg is either -180.0 or 180.0.
    expectedSourceBehavior:
    - The result equals longitudeDeg exactly rather than canonicalizing both endpoints
      to one sign.
    - The result is classified as antimeridian by the supplied relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ADJACENT_VALUES_INSIDE_NORMAL_RANGE
    category: BOUNDARY
    description: The closest representable values on the interior side of both inclusive
      range endpoints remain on the direct-return path.
    preconditions:
    - longitudeDeg is either Math.nextUp(-180.0) or Math.nextDown(180.0).
    expectedSourceBehavior:
    - The result equals longitudeDeg exactly.
    - The result remains strictly within (-180, 180).
    targetCases: 2
    emptyOutputAllowed: false
  - id: ADJACENT_VALUES_OUTSIDE_NORMAL_RANGE
    category: BOUNDARY
    description: The closest representable values beyond both range endpoints enter
      modulo normalization and wrap to the opposite side.
    preconditions:
    - longitudeDeg is either Math.nextDown(-180.0) or Math.nextUp(180.0).
    expectedSourceBehavior:
    - The result is finite and lies in [-180, 180].
    - A source below -180 produces a result near +180, while a source above +180 produces
      a result near -180.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FIRST_POSITIVE_WRAP_INTERIOR
    category: NORMAL
    description: Positive values between 180 and 540 use the nonnegative, nonzero
      remainder branch and wrap into the interval interior.
    preconditions:
    - longitudeDeg is selected from {181.0, 539.0}.
    expectedSourceBehavior:
    - The result equals longitudeDeg - 360.0.
    - The result lies in [-179, 179].
    targetCases: 2
    emptyOutputAllowed: false
  - id: FIRST_NEGATIVE_WRAP_INTERIOR
    category: NORMAL
    description: Negative values between -540 and -180 produce a negative remainder
      and use the off < 0 branch.
    preconditions:
    - longitudeDeg is selected from {-181.0, -539.0}.
    expectedSourceBehavior:
    - The result equals longitudeDeg + 360.0.
    - The result lies in [-179, 179].
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_FULL_REVOLUTION_ZERO
    category: EDGE
    description: Positive whole revolutions normalize to the prime-meridian value
      zero through the final remainder branch.
    preconditions:
    - longitudeDeg is selected from {360.0, 720.0}.
    expectedSourceBehavior:
    - The result is numerically 0.0.
    - The result lies in the documented interval.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_FULL_REVOLUTION_ZERO
    category: EDGE
    description: Negative whole revolutions normalize to zero through the negative-remainder
      path.
    preconditions:
    - longitudeDeg is selected from {-360.0, -720.0}.
    expectedSourceBehavior:
    - The result is numerically 0.0.
    - The result lies in the documented interval.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_ANTIMERIDIAN_SENTINEL
    category: EDGE
    description: The first positive out-of-range antimeridian representation reaches
      the explicit off == 0 and longitudeDeg > 0 sentinel.
    preconditions:
    - longitudeDeg == 540.0.
    expectedSourceBehavior:
    - The computed remainder off is zero.
    - The result is exactly 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ANTIMERIDIAN_SENTINEL
    category: EDGE
    description: The first negative out-of-range antimeridian representation has a
      zero remainder but does not satisfy the positive-longitude sentinel.
    preconditions:
    - longitudeDeg == -540.0.
    expectedSourceBehavior:
    - The computed remainder off compares equal to zero.
    - The result is exactly -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ADJACENT_TO_POSITIVE_SENTINEL
    category: BOUNDARY
    description: Representable neighbors on either side of 540 distinguish the exact
      positive sentinel from ordinary modulo results.
    preconditions:
    - longitudeDeg is either Math.nextDown(540.0) or Math.nextUp(540.0).
    expectedSourceBehavior:
    - The result is finite and in [-180, 180].
    - The lower neighbor normalizes near +180 and the upper neighbor normalizes near
      -180.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ADJACENT_TO_NEGATIVE_SENTINEL
    category: BOUNDARY
    description: Representable neighbors on either side of -540 distinguish the exact
      negative sentinel from ordinary negative-remainder results.
    preconditions:
    - longitudeDeg is either Math.nextDown(-540.0) or Math.nextUp(-540.0).
    expectedSourceBehavior:
    - The result is finite and in [-180, 180].
    - The lower neighbor normalizes near +180 and the upper neighbor normalizes near
      -180.
    targetCases: 2
    emptyOutputAllowed: false
  - id: HIGHER_POSITIVE_ANTIMERIDIAN_SENTINELS
    category: EDGE
    description: Positive antimeridian representations after multiple revolutions
      repeatedly reach the explicit positive zero-remainder sentinel.
    preconditions:
    - longitudeDeg is selected from {900.0, 1260.0}.
    - longitudeDeg > 180.0 && (longitudeDeg + 180.0) % 360.0 == 0.0.
    expectedSourceBehavior:
    - The result is exactly 180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: HIGHER_NEGATIVE_ANTIMERIDIAN_SENTINELS
    category: EDGE
    description: Negative antimeridian representations after multiple revolutions
      retain the negative endpoint convention.
    preconditions:
    - longitudeDeg is selected from {-900.0, -1260.0}.
    - longitudeDeg < -180.0 && (longitudeDeg + 180.0) % 360.0 == 0.0.
    expectedSourceBehavior:
    - The result is exactly -180.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MULTIWRAP_POSITIVE_FRACTIONS
    category: NORMAL
    description: Fractional positive longitudes after multiple revolutions test modulo
      preservation away from zero and antimeridian sentinels.
    preconditions:
    - longitudeDeg is selected from {720.25, 1081.5}.
    expectedSourceBehavior:
    - 720.25 normalizes to 0.25 and 1081.5 normalizes to 1.5.
    - The result is a positive interior longitude.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MULTIWRAP_NEGATIVE_FRACTIONS
    category: NORMAL
    description: Fractional negative longitudes after multiple revolutions exercise
      the negative-remainder branch away from its endpoint.
    preconditions:
    - longitudeDeg is selected from {-720.25, -1081.5}.
    expectedSourceBehavior:
    - -720.25 normalizes to -0.25 and -1081.5 normalizes to -1.5.
    - The result is a negative interior longitude.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_EXACT_SHIFT_AT_TWO_POW_50
    category: EDGE
    description: Large positive and negative powers of two test modulo normalization
      where 360 remains accurately addable but the magnitude is far beyond geographic
      notation.
    preconditions:
    - longitudeDeg is either 0x1.0p50 or -0x1.0p50.
    expectedSourceBehavior:
    - 0x1.0p50 normalizes to -176.0.
    - -0x1.0p50 normalizes to 176.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_EXACT_SHIFT_AT_TWO_POW_52
    category: EDGE
    description: Values at 2^52 exercise modulo arithmetic where adjacent doubles
      are one degree apart and the follow-up still adds exactly 360.
    preconditions:
    - longitudeDeg is either 0x1.0p52 or -0x1.0p52.
    expectedSourceBehavior:
    - 0x1.0p52 normalizes to 16.0.
    - -0x1.0p52 normalizes to -16.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_EXACT_SHIFT_AT_TWO_POW_55
    category: EDGE
    description: Values at 2^55 approach the floating-point magnitude limit at which
      a 360-degree shift remains exactly representable.
    preconditions:
    - longitudeDeg is either 0x1.0p55 or -0x1.0p55.
    expectedSourceBehavior:
    - 0x1.0p55 normalizes to 128.0.
    - -0x1.0p55 normalizes to -128.0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_BINade_BOUNDARY_EXACT_SHIFT
    category: EDGE
    description: The negative 2^56 binade boundary remains eligible because adding
      360 moves toward zero onto representable values, despite comparable positive
      magnitudes failing the global shift constraint.
    preconditions:
    - longitudeDeg == -0x1.0p56.
    - (longitudeDeg + 360.0) - longitudeDeg == 360.0.
    expectedSourceBehavior:
    - The result is exactly 104.0.
    - The result is finite and in [-180, 180].
    targetCases: 1
    emptyOutputAllowed: false
