InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be advanced by 23
    days, covering empty, finite bounded, saturation-sized, unbounded-start, date-limit,
    and supported construction/parse representations.
  globalConstraints:
  - Source receiver is a non-null LocalDateRange successfully created by a documented
    construction path.
  - '{Source range satisfies LocalDateRange validity=start is not LocalDate.MAX or
    LocalDate.MAX.minusDays(1), end is not LocalDate.MIN or LocalDate.MIN.plusDays(1),
    and end is not before start.}'
  - Source end is at most LocalDate.MAX.minusDays(23), so generateFollowUp can evaluate
    range.getEnd().plusDays(23) without LocalDate overflow.
  - Ranges with an unbounded end, including LocalDateRange.ofUnbounded() and ranges
    ending at LocalDate.MAX, are excluded because the follow-up transformation overflows
    before invoking the target method.
  - Valid ranges whose end is after LocalDate.MAX.minusDays(23) are excluded only
    because the prescribed follow-up transformation cannot construct them; this includes
    otherwise valid finite ranges ending at LocalDate.MAX.minusDays(22) through LocalDate.MAX.
  - INVALID scenarios are omitted because the metamorphic relation defines neither
    follow-up generation nor an output/exception relation for invalid receiver construction.
  diversity:
    boundedness:
    - '3'
    - bounded finite, unbounded-start finite-end, and follow-up becoming unbounded-end
    - finite; unbounded-start; follow-up-sentinel
    sourceLength:
    - '8'
    - 0, 1, ordinary finite, calendar-derived, Integer.MAX_VALUE-24, Integer.MAX_VALUE-23,
      Integer.MAX_VALUE-22, and at-least Integer.MAX_VALUE
    - 0; 1; 7/23/29/91/182/366; 2147483623; 2147483624; 2147483625; >=2147483647
    dateLimits:
    - '4'
    - ordinary dates, LocalDate.MIN-adjacent dates, LocalDate.MAX.minusDays(24), and
      LocalDate.MAX.minusDays(23)
    - ordinary; MIN+2; MAX-24; MAX-23
    constructionPath:
    - '7'
    - of dates, of period, ofClosed, ofEmpty, ofUnboundedStart, parse forms, and from
      supported Temporal forms
    - documented receiver factories
  scenarios:
  - id: EMPTY_ORDINARY_DATE
    category: BOUNDARY
    description: Empty bounded range at an ordinary date.
    preconditions:
    - Receiver is LocalDateRange.ofEmpty(LocalDate.of(2024, 6, 15)).
    - Source start equals source end and source end is at most LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Follow-up has length 23, so the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_DAY_HALF_OPEN
    category: BOUNDARY
    description: Smallest non-empty half-open bounded range.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 16)).
    - Source end minus source start is exactly 1 day.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_EXTRA_DAYS_LENGTH
    category: NORMAL
    description: A bounded range whose original length equals the transformation amount.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1,
      24)).
    - Source length is exactly 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - Follow-up lengthInDays() returns 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_DIRECT_DATES
    category: EDGE
    description: Finite range crossing leap day in a leap year.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 2)).
    - Source range includes 2024-02-29 and has length 3 days.
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    - Follow-up lengthInDays() returns 26.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_DIRECT_DATES
    category: EDGE
    description: Finite range crossing a calendar-year boundary.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2023, 12, 30), LocalDate.of(2024,
      1, 3)).
    - Source length is exactly 4 days.
    expectedSourceBehavior:
    - lengthInDays() returns 4.
    - Follow-up lengthInDays() returns 27.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EPOCH_DAYS
    category: EDGE
    description: Bounded range entirely before the epoch.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(1969, 12, 20), LocalDate.of(1969,
      12, 31)).
    - Both endpoints have negative epoch-day values and source length is 11 days.
    expectedSourceBehavior:
    - lengthInDays() returns 11.
    - Follow-up lengthInDays() returns 34.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIN_ADJACENT_BOUNDED_RANGE
    category: EDGE
    description: Valid bounded range adjacent to the lowest dates permitted by LocalDateRange.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MIN.plusDays(2), LocalDate.MIN.plusDays(3)).
    - Source start is LocalDate.MIN.plusDays(2), the earliest permitted bounded start
      for a one-day range.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up remains bounded and lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_MINUS_24_BOUNDED_RANGE
    category: EDGE
    description: Valid bounded range near LocalDate.MAX whose follow-up remains bounded.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24)).
    - Source end is LocalDate.MAX.minusDays(24).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up ends at LocalDate.MAX.minusDays(1) and lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_BECOMES_UNBOUNDED_END
    category: EDGE
    description: Finite source whose valid follow-up end becomes LocalDate.MAX and
      therefore unbounded.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23)).
    - Source end is exactly LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - Source lengthInDays() returns 1.
    - Follow-up is valid but has an unbounded end and lengthInDays() returns Integer.MAX_VALUE.
    - The supplied assertion skips because follow-up output is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FINITE_END
    category: EDGE
    description: Range unbounded at the start but with a finite end that can be extended.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 1, 1)).
    - Source start is LocalDate.MIN and source end is before LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - Follow-up remains unbounded at the start and also returns Integer.MAX_VALUE.
    - The supplied assertion skips because both outputs are sentinel values.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_MAX_MINUS_24
    category: BOUNDARY
    description: Largest nearby bounded length for which both source and follow-up
      remain representable non-sentinel lengths.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483623)).
    - Source length is exactly Integer.MAX_VALUE minus 24.
    expectedSourceBehavior:
    - lengthInDays() returns 2147483623.
    - Follow-up lengthInDays() returns 2147483646.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_MAX_MINUS_23
    category: BOUNDARY
    description: Largest source length for which adding 23 reaches exactly Integer.MAX_VALUE
      without sentinel saturation beyond it.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483624)).
    - Source length is exactly Integer.MAX_VALUE minus 23.
    expectedSourceBehavior:
    - lengthInDays() returns 2147483624.
    - Follow-up lengthInDays() returns Integer.MAX_VALUE.
    - The computed increase is exactly 23 and must be asserted.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_LENGTH_SATURATES
    category: BOUNDARY
    description: Bounded source with a real int length whose follow-up exceeds Integer.MAX_VALUE
      days.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483625)).
    - Source length is exactly Integer.MAX_VALUE minus 22.
    expectedSourceBehavior:
    - Source lengthInDays() returns 2147483625.
    - Follow-up bounded day count exceeds Integer.MAX_VALUE and lengthInDays() returns
      Integer.MAX_VALUE.
    - The supplied assertion skips because follow-up output is the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDED_LENGTH_ALREADY_SENTINEL
    category: EDGE
    description: Finite bounded range whose day count is at least Integer.MAX_VALUE.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483647)).
    - Source is bounded at both ends and has length exactly Integer.MAX_VALUE days.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE due to length saturation, despite both
      bounds being finite.
    - The supplied assertion skips because source output is the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_FACTORY_MONTH_LENGTH
    category: NORMAL
    description: Range created by the start-plus-Period factory using a calendar month
      period.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1)).
    - Factory-calculated end is 2024-02-29 and source length is 29 days.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up lengthInDays() returns 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_FACTORY_SINGLE_DATE
    category: NORMAL
    description: Closed range factory converts an inclusive singleton into a one-day
      internal half-open range.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 15)).
    - Internal exclusive end is 2024-06-16.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_FORM
    category: NORMAL
    description: Parsed range using the date/date grammar branch.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-04-01/2024-04-08").
    - Parsed source start is 2024-04-01, parsed exclusive end is 2024-04-08, and length
      is 7 days.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - Follow-up lengthInDays() returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD_FORM
    category: NORMAL
    description: Parsed range using the date/Period grammar branch.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-02-01/P1M").
    - Parsed source end is 2024-03-01 and source length is 29 days.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up lengthInDays() returns 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE_FORM
    category: NORMAL
    description: Parsed range using the Period/date grammar branch.
    preconditions:
    - Receiver is LocalDateRange.parse("P10D/2024-05-20").
    - Parsed source start is 2024-05-10, parsed end is 2024-05-20, and length is 10
      days.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - Follow-up lengthInDays() returns 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: Range created from a LocalDate Temporal, which is converted to a
      closed one-day range.
    preconditions:
    - Receiver is LocalDateRange.from(LocalDate.of(2024, 7, 4)).
    - Source range starts at 2024-07-04 and has exclusive end 2024-07-05.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: NORMAL
    description: Range created from a leap-year Year Temporal.
    preconditions:
    - Receiver is LocalDateRange.from(Year.of(2024)).
    - Source range spans 2024-01-01 through exclusive end 2025-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - Follow-up lengthInDays() returns 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEARMONTH
    category: NORMAL
    description: Range created from a leap-February YearMonth Temporal.
    preconditions:
    - Receiver is LocalDateRange.from(YearMonth.of(2024, 2)).
    - Source range spans 2024-02-01 through exclusive end 2024-03-01.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - Follow-up lengthInDays() returns 52.
    targetCases: 1
    emptyOutputAllowed: false
