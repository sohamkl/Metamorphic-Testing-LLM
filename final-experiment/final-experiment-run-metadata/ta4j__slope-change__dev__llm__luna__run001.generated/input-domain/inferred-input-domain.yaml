InputDomain:
  summary: Finite BarSeries inputs with begin index zero, a constructible SlopeChangeSwingDetector
    configuration, any non-null ElliottDegree, and any integer detection index; cases
    are selected to exercise candidate-window bounds, slope-direction tests, persistence,
    extreme-pivot selection, ATR filtering, pivot replacement, swing construction,
    index clamping, and the uniform price-translation metamorphic relation.
  globalConstraints:
  - The detector, series, and degree are non-null; the detector is created through
    a supplied public constructor and its configuration is usable by detect.
  - The source series has beginIndex == 0, because generateFollowUp explicitly rejects
    every other begin index.
  - Every source bar exposes finite open, high, low, close, volume, and amount values,
    and adding 100.0 to each price and adding 100.0 * volume to amount remains finite;
    this keeps the generated follow-up bars and the relation's finite numeric assertions
    defined.
  - The source series may be empty; for a non-empty series every referenced bar index
    is within 0..getEndIndex().
  - The detection index is any Java int, including values below 0, within the series,
    and above getEndIndex(); detect clamps it to the series range.
  - The same non-null ElliottDegree object is supplied to source and follow-up executions;
    no particular enum name is assumed beyond a value accepted by ElliottDegree.valueOf.
  - No source case relies on exceptions for invalid inputs; INVALID scenarios are
    omitted because the supplied metamorphic relation requires valid non-null inputs
    and a zero-based series.
  - For every case, the follow-up is generated by copying every bar while adding exactly
    100.0 to open, high, low, and close, preserving volume and changing amount to
    amount + 100.0 * volume.
  diversity:
    detectorConfiguration:
    - window = 1 or any usable positive window
    - window >= 2, allowing non-zero regression denominators
    - confirmationBars = 1
    - confirmationBars > 1
    - minSlopeChange = 0
    - minSlopeChange > 0
    - minAtrReversal = 0
    - minAtrReversal > 0
    seriesLengthRelativeToConfiguration:
    - empty series
    - n < 2*window + confirmationBars - 1
    - n = 2*window + confirmationBars - 1
    - n > 2*window + confirmationBars - 1
    - multiple candidate transition intervals
    detectionIndexClass:
    - index < 0
    - 0 <= index < getEndIndex()
    - index == getEndIndex()
    - index > getEndIndex()
    rollingSlopeRelation:
    - before and after slopes both zero
    - before and after slopes have the same positive sign
    - before and after slopes have the same negative sign
    - before positive and after negative
    - before negative and after positive
    - absolute slope difference below minSlopeChange
    - absolute slope difference equal to minSlopeChange
    - absolute slope difference above minSlopeChange
    persistenceRelation:
    - all confirmation slopes have the required post-reversal sign
    - at least one confirmation slope is zero
    - at least one confirmation slope has the old or opposite sign
    pivotExtremeRelation:
    - unique maximum high or unique minimum low in the transition interval
    - multiple equal extrema, exercising strict greater-than or less-than selection
    - extreme occurs at the first transition-interval bar
    - extreme occurs at the last transition-interval bar
    magnitudeFilterRelation:
    - no prior pivot
    - minAtrReversal == 0
    - finite ATR and price distance below ATR * minAtrReversal
    - finite ATR and price distance exactly equal to ATR * minAtrReversal
    - finite ATR and price distance above ATR * minAtrReversal
    - non-finite ATR after a prior pivot
    pivotSequence:
    - no pivots
    - one pivot
    - two alternating pivot types
    - same-type candidate more extreme than the previous pivot
    - same-type candidate not more extreme than the previous pivot
    outputDegree:
    - one accepted ElliottDegree value
    - a different accepted ElliottDegree value, when available from ElliottDegree.valueOf
  scenarios:
  - id: EMPTY_SERIES
    category: EDGE
    description: The source BarSeries contains no bars and has beginIndex == 0.
    preconditions:
    - series.isEmpty() == true.
    - index is any int and degree is non-null.
    expectedSourceBehavior:
    - detect returns a SwingDetectorResult whose pivots and swings are both empty.
    - The translated follow-up is also empty, so the relation compares two empty outputs.
    targetCases: 1
    emptyOutputAllowed: true
  - id: TOO_SHORT_FOR_ANY_CANDIDATE
    category: BOUNDARY
    description: The series is non-empty but cannot contain an index satisfying firstCandidate
      <= lastCandidate.
    preconditions:
    - n < 2 * config.window() + config.confirmationBars() - 1.
    - All bars have finite numeric fields.
    expectedSourceBehavior:
    - The candidate loop has no iterations and the result contains no pivots or swings.
    targetCases: 1
    emptyOutputAllowed: true
  - id: EXACT_MINIMUM_CANDIDATE_LENGTH
    category: BOUNDARY
    description: The series length is exactly the smallest length that permits one
      candidate transition interval.
    preconditions:
    - n == 2 * config.window() + config.confirmationBars() - 1.
    - The sole possible candidate has before and after slopes meeting a reversal condition
      and all confirmation slopes persist.
    expectedSourceBehavior:
    - At most one candidate is evaluated and, when its magnitude checks pass, at most
      one pivot is produced.
    - This isolates the firstCandidate and lastCandidate inclusive boundary.
    targetCases: 1
    emptyOutputAllowed: true
  - id: INDEX_BELOW_SERIES_RANGE
    category: BOUNDARY
    description: A sufficiently long series is queried with an index below the begin
      index.
    preconditions:
    - series is non-empty with beginIndex == 0.
    - index < 0.
    expectedSourceBehavior:
    - endIndex is clamped to 0, so candidates requiring later bars are not evaluated
      and the result is empty.
    targetCases: 1
    emptyOutputAllowed: true
  - id: INDEX_ABOVE_SERIES_RANGE
    category: BOUNDARY
    description: A series containing confirmed transitions is queried with an index
      above its end.
    preconditions:
    - index > series.getEndIndex().
    - At least one confirmed candidate exists before the series end.
    expectedSourceBehavior:
    - endIndex is clamped to series.getEndIndex().
    - The output matches the full available causal scan and contains the pivots reachable
      by the complete series.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INDEX_AT_END_BOUNDARY
    category: BOUNDARY
    description: A confirmed transition ends exactly at the queried final bar.
    preconditions:
    - index == series.getEndIndex().
    - A candidate satisfies candidate <= endIndex - window - confirmationBars + 1.
    expectedSourceBehavior:
    - The final eligible candidate is evaluated, while a transition requiring any
      later bar is not.
    targetCases: 1
    emptyOutputAllowed: true
  - id: FLAT_CLOSE_SERIES
    category: NORMAL
    description: All close prices in every regression window are equal, while high
      and low values remain finite.
    preconditions:
    - Every evaluated slope(close, start, end) is zero.
    - The configuration has minSlopeChange >= 0.
    expectedSourceBehavior:
    - No candidate satisfies either positive-to-negative or negative-to-positive direction
      test.
    - No pivots or swings are returned.
    targetCases: 1
    emptyOutputAllowed: true
  - id: SAME_SIGN_POSITIVE_SLOPES
    category: NORMAL
    description: The before and after regression slopes are both positive for a candidate.
    preconditions:
    - before.isPositive() and after.isPositive() for every tested candidate.
    - The slope difference may exceed minSlopeChange, but no sign reversal occurs.
    expectedSourceBehavior:
    - The candidate reaches the direction branches but is rejected by both pivot-type
      conditions.
    targetCases: 1
    emptyOutputAllowed: true
  - id: SAME_SIGN_NEGATIVE_SLOPES
    category: NORMAL
    description: The before and after regression slopes are both negative for a candidate.
    preconditions:
    - before.isNegative() and after.isNegative().
    expectedSourceBehavior:
    - No HIGH or LOW type is assigned because neither reversal branch is satisfied.
    targetCases: 1
    emptyOutputAllowed: true
  - id: HIGH_REVERSAL_CONFIRMED
    category: NORMAL
    description: A positive rolling close slope changes to a sufficiently negative
      slope and remains negative during confirmation.
    preconditions:
    - before.isPositive() and after.isNegative().
    - before.minus(after).abs() is greater than or equal to minSlopeChange.
    - Every slope checked by persists for the HIGH candidate is negative.
    - The high indicator is finite throughout the transition interval.
    expectedSourceBehavior:
    - A HIGH pivot is created at the greatest high from candidate through candidate
      + window - 1.
    - If it is the first accepted pivot, it is appended and the result may contain
      swings only after another pivot exists.
    targetCases: 2
    emptyOutputAllowed: true
  - id: LOW_REVERSAL_CONFIRMED
    category: NORMAL
    description: A negative rolling close slope changes to a sufficiently positive
      slope and remains positive during confirmation.
    preconditions:
    - before.isNegative() and after.isPositive().
    - before.minus(after).abs() is greater than or equal to minSlopeChange.
    - Every slope checked by persists for the LOW candidate is positive.
    - The low indicator is finite throughout the transition interval.
    expectedSourceBehavior:
    - A LOW pivot is created at the least low from candidate through candidate + window
      - 1.
    targetCases: 2
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_BELOW_THRESHOLD
    category: BOUNDARY
    description: The before and after slopes reverse signs but their absolute difference
      is too small.
    preconditions:
    - The sign pair is positive then negative or negative then positive.
    - before.minus(after).abs().isLessThan(minSlopeChange) == true.
    expectedSourceBehavior:
    - The candidate is discarded before pivot-type, persistence, extreme-pivot, and
      ATR processing.
    targetCases: 1
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_AT_THRESHOLD
    category: BOUNDARY
    description: The sign-reversing slope difference is exactly the configured minimum.
    preconditions:
    - The sign pair is a valid reversal.
    - before.minus(after).abs().isLessThan(minSlopeChange) == false because the values
      are equal at the threshold.
    - Persistence and later filters pass.
    expectedSourceBehavior:
    - The candidate is not rejected by the minimum-slope guard and proceeds to persistence
      and pivot creation.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERSISTENCE_FAILS_ON_ZERO
    category: BOUNDARY
    description: A valid slope reversal is followed by at least one confirmation-window
      slope equal to zero.
    preconditions:
    - The before/after sign reversal and minimum slope-change checks pass.
    - For some persistence offset, the slope is zero.
    expectedSourceBehavior:
    - persists returns false and the candidate produces no pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERSISTENCE_FAILS_ON_WRONG_SIGN
    category: NORMAL
    description: A valid slope reversal is followed by a confirmation slope with the
      old or opposite sign.
    preconditions:
    - The candidate passes the before/after slope checks.
    - At least one required HIGH confirmation slope is non-negative or one required
      LOW confirmation slope is non-positive.
    expectedSourceBehavior:
    - The candidate is rejected by persists before extreme-pivot selection.
    targetCases: 1
    emptyOutputAllowed: true
  - id: HIGH_EXTREME_AT_INTERVAL_START
    category: EDGE
    description: A confirmed HIGH transition has its unique greatest high at candidate.
    preconditions:
    - All HIGH transition highs are finite.
    - high(candidate) is strictly greater than every later high through candidate
      + window - 1.
    expectedSourceBehavior:
    - The returned HIGH pivot index equals candidate.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOW_EXTREME_AT_INTERVAL_END
    category: EDGE
    description: A confirmed LOW transition has its unique least low at candidate
      + window - 1.
    preconditions:
    - All LOW transition lows are finite.
    - low(candidate + window - 1) is strictly less than every earlier low in the interval.
    expectedSourceBehavior:
    - The returned LOW pivot index equals candidate + window - 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TIED_EXTREME_KEEPS_FIRST
    category: EDGE
    description: The transition interval contains equal extreme values at multiple
      positions.
    preconditions:
    - For a HIGH, the maximum high occurs at least twice; or for a LOW, the minimum
      low occurs at least twice.
    - No later tied value is strictly greater for HIGH or strictly less for LOW.
    expectedSourceBehavior:
    - Because extremePivot updates only on strict comparison, the first occurrence
      of the tied extreme is retained.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIRST_PIVOT_BYPASSES_MAGNITUDE_FILTER
    category: NORMAL
    description: The first otherwise valid pivot is evaluated when the pivot list
      is empty.
    preconditions:
    - A confirmed HIGH or LOW candidate exists.
    - The candidate reaches passesMagnitudeFilter with pivots.isEmpty() == true.
    - The ATR at the pivot may be finite or non-finite.
    expectedSourceBehavior:
    - The first candidate is accepted without comparing its price to a previous pivot.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_ATR_MULTIPLIER_ACCEPTS_LATER_PIVOT
    category: NORMAL
    description: A later confirmed pivot is processed with a zero ATR reversal multiplier.
    preconditions:
    - At least one prior pivot exists.
    - config.minAtrReversal() == 0.
    expectedSourceBehavior:
    - passesMagnitudeFilter returns true for the later pivot without requiring a finite
      ATR.
    - The later pivot proceeds to alternating-type or same-type handling.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAGNITUDE_FILTER_REJECTS_WEAK_REVERSAL
    category: NORMAL
    description: A later confirmed pivot has a finite ATR but insufficient price separation
      from the previous pivot.
    preconditions:
    - pivots is non-empty and minAtrReversal() is non-zero.
    - ATR at the candidate pivot is finite.
    - abs(candidate.price - previous.price) < ATR * minAtrReversal().
    expectedSourceBehavior:
    - The candidate is discarded by passesMagnitudeFilter and cannot replace or append
      a pivot.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAGNITUDE_FILTER_ACCEPTS_EQUAL_THRESHOLD
    category: BOUNDARY
    description: A later pivot's price distance equals the ATR threshold exactly.
    preconditions:
    - pivots is non-empty, ATR is finite, and minAtrReversal() is non-zero.
    - abs(candidate.price - previous.price) == ATR * minAtrReversal().
    expectedSourceBehavior:
    - The greater-than-or-equal comparison accepts the candidate.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONFINITE_ATR_REJECTS_LATER_PIVOT
    category: EDGE
    description: A later confirmed pivot is reached when ATR at its pivot index is
      non-finite.
    preconditions:
    - pivots is non-empty and minAtrReversal() is non-zero.
    - atr.getValue(candidate.index()) is non-finite.
    expectedSourceBehavior:
    - passesMagnitudeFilter returns false and the later pivot is omitted.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ALTERNATING_PIVOTS_CREATE_SWINGS
    category: NORMAL
    description: The scan accepts a HIGH followed by a LOW, or a LOW followed by a
      HIGH, with both candidates passing magnitude filtering.
    preconditions:
    - Two accepted pivots have different SwingPivotType values and ordered indices.
    - Both pivots have finite prices.
    expectedSourceBehavior:
    - Both pivots remain in order.
    - SwingDetectorResult.fromPivots produces an ElliottSwing joining the consecutive
      pivots, with the supplied degree.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SAME_TYPE_MORE_EXTREME_REPLACES
    category: NORMAL
    description: A later accepted pivot has the same type as the previous pivot and
      is more extreme in the required direction.
    preconditions:
    - For HIGH, candidate.price is greater than previous.price; or for LOW, candidate.price
      is less than previous.price.
    - The later candidate passes the ATR filter.
    expectedSourceBehavior:
    - The previous pivot at the last pivot-list position is replaced rather than appended.
    - The final pivot list retains the later, more extreme same-type pivot.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_TYPE_NOT_MORE_EXTREME_REMAINS
    category: NORMAL
    description: A later accepted pivot has the same type as the previous pivot but
      is not more extreme.
    preconditions:
    - For HIGH, candidate.price is less than or equal to previous.price; or for LOW,
      candidate.price is greater than or equal to previous.price.
    - The later candidate passes the ATR filter.
    expectedSourceBehavior:
    - The previous pivot remains unchanged and the later same-type pivot is not appended.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGREE_PROPAGATES_TO_SWINGS
    category: NORMAL
    description: A multi-pivot series is detected with a non-null ElliottDegree accepted
      by ElliottDegree.valueOf.
    preconditions:
    - At least two alternating pivots are accepted.
    - The same degree is supplied to both source and translated follow-up calls.
    expectedSourceBehavior:
    - Every resulting ElliottSwing reports the supplied degree.
    - The translation relation compares equal swing indices and degree values while
      requiring both endpoint prices to increase by exactly 100.0 within the specified
      tolerance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PRICE_TRANSLATION_WITH_NONZERO_VOLUME
    category: NORMAL
    description: A pivot-producing finite series has non-zero volumes, so follow-up
      amount values differ by 100.0 * volume while all prices translate uniformly.
    preconditions:
    - At least one bar has volume != 0 and all translated amounts remain finite.
    - The source produces at least one pivot.
    expectedSourceBehavior:
    - Pivot indices and types remain equal between source and follow-up.
    - Every pivot price and every ElliottSwing endpoint price increases by 100.0;
      swing indices and degrees remain equal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PRICE_TRANSLATION_WITH_ZERO_VOLUME
    category: EDGE
    description: A pivot-producing finite series has zero volume on at least one bar.
    preconditions:
    - At least one bar has volume == 0.
    - The source still contains confirmed pivots and all translated fields remain
      finite.
    expectedSourceBehavior:
    - The follow-up amount for each zero-volume bar is unchanged while all OHLC prices
      translate by 100.0.
    - The detector output still satisfies the same pivot and swing translation assertions.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TRANSLATION_PRESERVES_EMPTY_RESULT
    category: EDGE
    description: A finite, zero-based series follows a no-pivot path such as a flat
      close series or an insufficient candidate length.
    preconditions:
    - The source output has zero pivots and zero swings.
    - The follow-up construction succeeds with finite translated values.
    expectedSourceBehavior:
    - The follow-up also has zero pivots and zero swings, satisfying the relation
      without relying on translated pivot values.
    targetCases: 1
    emptyOutputAllowed: true
