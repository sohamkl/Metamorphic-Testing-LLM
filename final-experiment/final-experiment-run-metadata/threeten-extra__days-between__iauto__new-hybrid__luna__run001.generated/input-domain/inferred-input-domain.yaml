InputDomain:
  summary: Non-null, mutually compatible java.time Temporal endpoint pairs for which
    Days.between succeeds, returns an int-sized whole-day amount, and both endpoints
    can be shifted forward by exactly 37 ChronoUnit.DAYS for the metamorphic follow-up.
  globalConstraints:
  - Both source endpoints are non-null Temporal instances.
  - Each endpoint supports plus(37, ChronoUnit.DAYS), because generateFollowUp applies
    that operation to both endpoints.
  - The pair is compatible with ChronoUnit.DAYS.between and the source invocation
    completes normally.
  - The whole-day distance is within Integer.MIN_VALUE..Integer.MAX_VALUE, because
    between applies Math.toIntExact before constructing Days.
  - After adding 37 days to each endpoint, both shifted endpoints remain representable
    and the follow-up invocation completes normally.
  - The source and follow-up outputs are observed through getAmount(), and the metamorphic
    assertion requires those two int values to be equal.
  diversity:
    temporalType:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    ordering:
    - same endpoint
    - end after start
    - end before start
    resultMagnitude:
    - zero
    - sub-day truncation to zero
    - one day
    - multi-day
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    calendarBoundary:
    - ordinary date
    - month boundary
    - year boundary
    - leap-day boundary
    - minimum representable LocalDate region
    - maximum representable LocalDate region
    timeCharacteristics:
    - date-only
    - sub-day time difference
    - different UTC offsets
    - zone daylight-saving transition
  scenarios:
  - id: LOCAL_DATE_ZERO_GAP
    category: NORMAL
    description: A LocalDate is used for both endpoints and the endpoints are identical.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 15).
    - endDateExclusive = LocalDate.of(2024, 6, 15).
    - Both endpoints support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between returns a non-null Days whose getAmount() is 0.
    - The 37-day follow-up also returns getAmount() 0.
    - The source and follow-up amounts satisfy the supplied relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_FORWARD
    category: NORMAL
    description: A LocalDate pair has the smallest positive non-zero date gap.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 15).
    - endDateExclusive = LocalDate.of(2024, 6, 16).
    expectedSourceBehavior:
    - getAmount() is 1.
    - Shifting both endpoints by 37 days preserves getAmount() at 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_REVERSE
    category: NORMAL
    description: A LocalDate pair has the smallest negative non-zero date gap.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 6, 16).
    - endDateExclusive = LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - getAmount() is -1.
    - Shifting both endpoints by 37 days preserves getAmount() at -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: The date interval crosses from the last day of one month to the first
      day of the next.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 1, 31).
    - endDateExclusive = LocalDate.of(2023, 2, 1).
    expectedSourceBehavior:
    - getAmount() is 1 despite the month change.
    - The shifted interval has the same getAmount().
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: The date interval crosses a calendar-year boundary.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 12, 31).
    - endDateExclusive = LocalDate.of(2024, 1, 2).
    expectedSourceBehavior:
    - getAmount() is 2.
    - The 37-day translation preserves the two-day amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY
    category: BOUNDARY
    description: The interval crosses the leap day in a leap year.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 2, 28).
    - endDateExclusive = LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - getAmount() is 2, including February 29.
    - The follow-up amount remains 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: The analogous February interval occurs in a non-leap year.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 2, 28).
    - endDateExclusive = LocalDate.of(2023, 3, 1).
    expectedSourceBehavior:
    - getAmount() is 1.
    - The follow-up amount remains 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MULTI_DAY_NEGATIVE
    category: NORMAL
    description: A reverse LocalDate interval has a multi-day negative amount.
    preconditions:
    - startDateInclusive = LocalDate.of(2025, 1, 10).
    - endDateExclusive = LocalDate.of(2025, 1, 1).
    expectedSourceBehavior:
    - getAmount() is -9.
    - The shifted pair also produces -9.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INT_MAX_DISTANCE
    category: EDGE
    description: The LocalDate interval has the largest distance accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive = LocalDate.MIN.
    - endDateExclusive = LocalDate.MIN.plusDays(2147483647).
    - Both endpoints remain representable after plusDays(37).
    expectedSourceBehavior:
    - between completes normally and getAmount() is Integer.MAX_VALUE.
    - The follow-up also completes normally and returns Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INT_MIN_DISTANCE
    category: EDGE
    description: The LocalDate interval has the smallest distance accepted by Math.toIntExact
      while leaving room for the 37-day shift.
    preconditions:
    - startDateInclusive = LocalDate.MAX.minusDays(37).
    - endDateExclusive = startDateInclusive.minusDays(2147483648L).
    - Both endpoints and their 37-day shifts are representable LocalDate values.
    expectedSourceBehavior:
    - between completes normally and getAmount() is Integer.MIN_VALUE.
    - The follow-up also completes normally and returns Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_REGION
    category: EDGE
    description: A short interval is located at the minimum representable LocalDate
      boundary.
    preconditions:
    - startDateInclusive = LocalDate.MIN.
    - endDateExclusive = LocalDate.MIN.plusDays(37).
    - The follow-up endpoints are LocalDate.MIN.plusDays(37) and LocalDate.MIN.plusDays(74).
    expectedSourceBehavior:
    - getAmount() is 37.
    - The follow-up remains representable and has getAmount() 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAXIMUM_REGION
    category: EDGE
    description: A short interval is located immediately before the maximum representable
      LocalDate boundary.
    preconditions:
    - startDateInclusive = LocalDate.MAX.minusDays(74).
    - endDateExclusive = LocalDate.MAX.minusDays(37).
    - The shifted endpoints are LocalDate.MAX.minusDays(37) and LocalDate.MAX.
    expectedSourceBehavior:
    - getAmount() is 37.
    - The follow-up remains representable and has getAmount() 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_FORWARD
    category: NORMAL
    description: LocalDateTime endpoints are less than 24 hours apart in the forward
      direction.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 15, 10, 0).
    - endDateExclusive = LocalDateTime.of(2024, 6, 16, 9, 59).
    expectedSourceBehavior:
    - ChronoUnit.DAYS.between yields 0 whole days, so getAmount() is 0.
    - Adding 37 days to both LocalDateTime values preserves the sub-day gap and the
      amount 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_REVERSE
    category: NORMAL
    description: LocalDateTime endpoints are less than 24 hours apart in the reverse
      direction.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 16, 9, 59).
    - endDateExclusive = LocalDateTime.of(2024, 6, 15, 10, 0).
    expectedSourceBehavior:
    - The whole-day result is 0 rather than a non-zero day count.
    - The follow-up preserves the same 0 amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints are separated by exactly 24 hours.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 6, 15, 10, 0).
    - endDateExclusive = LocalDateTime.of(2024, 6, 16, 10, 0).
    expectedSourceBehavior:
    - getAmount() is 1.
    - The shifted LocalDateTime pair also produces 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_INTERVAL
    category: NORMAL
    description: Instant endpoints have a positive interval containing one whole day
      plus a sub-day remainder.
    preconditions:
    - startDateInclusive = Instant.parse('2024-01-01T00:00:00Z').
    - endDateExclusive = Instant.parse('2024-01-02T12:00:00Z').
    expectedSourceBehavior:
    - The whole-day amount is 1.
    - Adding 37 ChronoUnit.DAYS to both Instants preserves the amount 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS
    category: NORMAL
    description: OffsetDateTime endpoints use different offsets, exercising elapsed
      whole-day calculation across offsets.
    preconditions:
    - startDateInclusive = OffsetDateTime.parse('2024-01-01T00:00:00+02:00').
    - endDateExclusive = OffsetDateTime.parse('2024-01-02T00:00:00-05:00').
    expectedSourceBehavior:
    - The elapsed interval is 31 hours, so the whole-day amount is 1.
    - Adding 37 days to both offset date-times preserves their offset relationship
      and getAmount() 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_FORWARD
    category: EDGE
    description: A ZonedDateTime interval crosses the spring daylight-saving transition
      while retaining the same local time.
    preconditions:
    - startDateInclusive = ZonedDateTime.of(2024, 3, 9, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    - endDateExclusive = ZonedDateTime.of(2024, 3, 11, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    expectedSourceBehavior:
    - between completes for the zone-aware Temporal pair and returns the whole-day
      amount for the two-date interval.
    - The 37-day shift is applied to both zoned values and the follow-up getAmount()
      equals the source getAmount().
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_REVERSE
    category: EDGE
    description: A reverse ZonedDateTime interval crosses the autumn daylight-saving
      transition.
    preconditions:
    - startDateInclusive = ZonedDateTime.of(2024, 11, 4, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    - endDateExclusive = ZonedDateTime.of(2024, 11, 2, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    expectedSourceBehavior:
    - The source result is negative because the end precedes the start.
    - The shifted zoned pair returns the same negative getAmount().
    targetCases: 1
    emptyOutputAllowed: false
