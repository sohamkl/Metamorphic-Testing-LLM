InputDomain:
  summary: Non-empty rectangular double matrices with positive row and column counts,
    exercised across zero, full-rank, dependent, pivot-skipping, numerical-threshold,
    and special-double paths; each source case is paired with its dimension-swapped
    transpose.
  globalConstraints:
  - The source matrix is non-null and has at least one row.
  - Every row is non-null, every row has at least one column, and all rows have the
    same positive length.
  - Each source case supplies a double[][] directly to the public static computeRank
    method; no constructor or factory is required.
  - The transpose has dimensions columns-by-rows and contains the corresponding source
    entries, so it also satisfies the non-empty rectangular constraint.
  - The source matrix is not modified while computing either rank; the implementation
    deep-copies it before pivot processing.
  - Invalid inputs are excluded because the supplied metamorphic relation requests
    comparison of a matrix with its transpose, not behavior for invalid matrices.
  diversity:
    shape:
    - 1x1
    - 1xN
    - Mx1
    - square
    - tall M>N
    - wide M<N
    mathematicalStructure:
    - all-zero
    - single nonzero
    - full rank
    - dependent rows
    - dependent columns
    - zero leading columns
    - late independent column
    - exact cancellation
    pivotPath:
    - pivot in first eligible row
    - pivot after skipped rows
    - no pivot in a column
    - marked-row exclusion
    - elimination of multiple rows
    - normalization with non-unit pivot
    magnitude:
    - zero
    - negative zero
    - absolute value below 1e-10
    - absolute value exactly 1e-10
    - absolute value above 1e-10
    - ordinary finite values
    - large finite values
    specialDoubleValues:
    - finite only
    - NaN entry
    - positive infinity entry
    - negative infinity entry
    metamorphicOperation:
    - transpose preserves dimensions when square
    - transpose exchanges tall and wide shapes
    - transpose of a vector exchanges 1xN and Nx1
  scenarios:
  - id: SINGLE_ZERO
    category: BOUNDARY
    description: A 1x1 matrix containing positive zero reaches the no-pivot sentinel
      immediately.
    preconditions:
    - The source shape is exactly 1x1.
    - The sole entry is 0.0.
    expectedSourceBehavior:
    - computeRank(source) returns 0 because the only candidate isZero.
    - computeRank(transpose(source)) is invoked and the two returned ranks are equal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_NONZERO
    category: BOUNDARY
    description: A 1x1 matrix containing one ordinary nonzero reaches pivot selection
      and rank increment without a nontrivial normalization loop.
    preconditions:
    - The source shape is exactly 1x1.
    - The sole entry is finite and has absolute value greater than 1e-10.
    expectedSourceBehavior:
    - computeRank(source) returns 1.
    - The transposed 1x1 input returns the same rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ALL_ZERO_RECTANGLE
    category: NORMAL
    description: Every candidate in every column is zero, so every column uses the
      numRows no-pivot sentinel.
    preconditions:
    - The source is rectangular with at least 2 rows and at least 2 columns.
    - Every entry is exactly 0.0.
    expectedSourceBehavior:
    - computeRank(source) returns 0.
    - The transpose also returns 0, exercising the relation on a non-square rectangle.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SINGLE_NONZERO_ROW
    category: NORMAL
    description: A 1xN row has one independent row while later columns exercise normalization
      over remaining entries.
    preconditions:
    - The source has exactly 1 row and between 2 and 6 columns.
    - At least one entry has absolute value greater than 1e-10 and all other entries
      are finite.
    expectedSourceBehavior:
    - The first eligible column marks the sole row and later columns cannot add another
      pivot because that row is marked.
    - The source and its Nx1 transpose return equal ranks.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SINGLE_NONZERO_COLUMN
    category: NORMAL
    description: An Mx1 column has at most one pivot column and exercises row selection
      without any later-column normalization.
    preconditions:
    - The source has between 2 and 6 rows and exactly 1 column.
    - At least one entry has absolute value greater than 1e-10.
    - All entries are finite.
    expectedSourceBehavior:
    - The first unmarked nonzero row is selected and the returned rank is 1.
    - The 1xM transpose returns the same rank.
    targetCases: 2
    emptyOutputAllowed: false
  - id: IDENTITY_SQUARE
    category: NORMAL
    description: Identity matrices provide square full-rank cases with a pivot in
      the first eligible row of each successive column.
    preconditions:
    - The source is an NxN identity matrix for N in {2, 3, 4, 5}.
    expectedSourceBehavior:
    - Each column finds one previously unmarked pivot row and the returned rank is
      N.
    - The transpose is identical and returns the same rank.
    targetCases: 4
    emptyOutputAllowed: false
  - id: FULL_RANK_TALL
    category: NORMAL
    description: A tall matrix has more rows than columns and reaches a pivot in every
      column.
    preconditions:
    - The source has dimensions MxN with M>N and 2<=N<=4.
    - The leading N-by-N block is identity and the remaining entries are finite.
    expectedSourceBehavior:
    - All N columns obtain pivots, so the returned rank is N.
    - The transposed wide matrix returns the same rank.
    targetCases: 3
    emptyOutputAllowed: false
  - id: FULL_RANK_WIDE
    category: NORMAL
    description: A wide matrix has more columns than rows and reaches a pivot for
      every row before marked-row exhaustion.
    preconditions:
    - The source has dimensions MxN with M<N and 2<=M<=4.
    - The leading M-by-M block is identity and the remaining entries are finite.
    expectedSourceBehavior:
    - Exactly M rows can be marked, so the returned rank is M.
    - The transposed tall matrix returns the same rank.
    targetCases: 3
    emptyOutputAllowed: false
  - id: PROPORTIONAL_ROWS
    category: NORMAL
    description: Nonzero proportional rows exercise elimination that removes a later
      row and prevents it from becoming an additional pivot.
    preconditions:
    - The source is 2xN with N in {2, 3, 4}.
    - Row 1 equals a finite nonzero scalar multiple of row 0.
    - Row 0 contains an entry with absolute value greater than 1e-10.
    expectedSourceBehavior:
    - The first pivot eliminates the proportional row in the pivot column and no independent
      second pivot is created.
    - The source and transpose return equal ranks.
    targetCases: 3
    emptyOutputAllowed: false
  - id: PROPORTIONAL_COLUMNS
    category: NORMAL
    description: Matrices with proportional columns exercise dependent-column behavior
      and its transpose as dependent-row behavior.
    preconditions:
    - The source is Mx2 with M in {2, 3, 4}.
    - Column 1 equals a finite nonzero scalar multiple of column 0.
    - Column 0 contains an entry with absolute value greater than 1e-10.
    expectedSourceBehavior:
    - At most one independent column is counted, with the source and transpose returning
      equal ranks.
    - Elimination and later-column pivot searches are both exercised.
    targetCases: 3
    emptyOutputAllowed: false
  - id: LEADING_ZERO_COLUMNS
    category: EDGE
    description: One or more initial columns have no pivot, followed by a column whose
      first eligible row supplies a pivot.
    preconditions:
    - The source is 2x3 or 3x4.
    - Every entry in the first column is exactly 0.0.
    - At least one entry in the next column has absolute value greater than 1e-10.
    - All entries are finite.
    expectedSourceBehavior:
    - The initial column returns the numRows sentinel without changing rank.
    - A later column increments rank, and the transpose returns the same rank.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PIVOT_AFTER_MARKED_ROW
    category: EDGE
    description: The first row is marked by an earlier pivot, while a later column
      must skip it and choose a different unmarked row.
    preconditions:
    - The source is 2x2 or 3x3.
    - The first column has a nonzero entry in row 0 and zeros in all later candidate
      rows.
    - A later column has a nonzero entry in an unmarked row.
    - All entries are finite.
    expectedSourceBehavior:
    - findPivotRow must honor rowMarked and select an unmarked row rather than the
      already marked first row.
    - The source and transpose return equal ranks.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FIRST_ELIGIBLE_PIVOT_NOT_LARGEST
    category: EDGE
    description: The first eligible row has a small nonzero pivot while a later row
      has a larger value, exercising first-match rather than magnitude-based selection.
    preconditions:
    - The source is 2x2 or 3x3.
    - In at least one processed column, the first unmarked nonzero entry has smaller
      absolute value than a later unmarked nonzero entry.
    - All entries are finite and the first selected pivot has absolute value greater
      than 1e-10.
    expectedSourceBehavior:
    - The first eligible row is selected because findPivotRow scans top to bottom.
    - The source and transpose return equal ranks despite different pivot-selection
      orders.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MULTIROW_ELIMINATION
    category: NORMAL
    description: A pivot column has nonzero values in several other rows, so eliminateRows
      executes its inner subtraction for multiple rows and columns.
    preconditions:
    - The source is 3x3 or 4x4.
    - The first pivot is finite and nonzero, and at least two other rows have nonzero
      values in that pivot column.
    - There are at least two columns after the pivot column.
    expectedSourceBehavior:
    - Multiple other rows enter the elimination branch and later columns are updated.
    - The source and transpose return equal ranks.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_CANCELLATION
    category: NORMAL
    description: Elimination produces exact zeros in later pivot positions, exercising
      isZero after subtraction rather than only on original entries.
    preconditions:
    - The source is 3x3.
    - It contains finite rows such as [1.0, 2.0, 3.0], [2.0, 4.0, 6.0], and [0.0,
      1.0, 1.0], or an equivalent matrix with exact binary-representable cancellation.
    expectedSourceBehavior:
    - Elimination creates exact zero entries that are treated as zero by isZero.
    - The source and transpose return equal ranks.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BELOW_EPSILON_ENTRIES
    category: BOUNDARY
    description: Entries with magnitude strictly below EPSILON are treated as zero
      by isZero.
    preconditions:
    - The source is 2x2 or 3x3.
    - At least one candidate pivot has absolute value in (0.0, 1e-10).
    - All entries are finite.
    expectedSourceBehavior:
    - The below-threshold candidate does not become a pivot.
    - The source and transpose are both invoked and their returned ranks are compared
      for equality.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_EPSILON_ENTRIES
    category: BOUNDARY
    description: Entries with magnitude exactly EPSILON test the strict less-than
      comparison in isZero.
    preconditions:
    - The source is 2x2 or 3x3.
    - At least one candidate entry is exactly 1e-10 or -1e-10.
    - All entries are finite.
    expectedSourceBehavior:
    - The exact-EPSILON candidate is not classified as zero because isZero uses abs(value)
      < 1e-10.
    - The source and transpose return equal ranks.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ABOVE_EPSILON_ENTRIES
    category: BOUNDARY
    description: Entries just above EPSILON test the ordinary nonzero pivot path close
      to the threshold.
    preconditions:
    - The source is 2x2 or 3x3.
    - At least one candidate entry has absolute value 1e-10 plus a positive finite
      increment no greater than 1e-12.
    - All entries are finite.
    expectedSourceBehavior:
    - The above-threshold candidate is eligible for pivot selection.
    - The source and transpose return equal ranks.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_ZERO_ENTRIES
    category: EDGE
    description: Negative zero exercises the Math.abs-based zero test while remaining
      a distinct double representation.
    preconditions:
    - The source is 2x2 or 3x3.
    - At least one entry is -0.0 and the matrix also contains an ordinary finite nonzero
      entry.
    expectedSourceBehavior:
    - -0.0 is treated as zero by isZero and does not create a pivot.
    - The source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_SCALE
    category: EDGE
    description: Large finite pivots exercise normalization and elimination with values
      far from the EPSILON threshold.
    preconditions:
    - The source is 2x2 or 3x3.
    - At least one entry has absolute value between 1e100 and 1e300.
    - All intermediate arithmetic remains finite for the selected case.
    expectedSourceBehavior:
    - Pivot normalization and elimination execute on large finite values without relying
      on threshold classification.
    - The source and transpose return equal ranks.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NAN_ENTRY
    category: EDGE
    description: A Java double matrix containing NaN reaches the source's Math.abs(value)
      and arithmetic paths without adding an input-shape violation.
    preconditions:
    - The source is non-empty and rectangular, with dimensions 2x2 or 2x3.
    - Exactly one or more entries are Double.NaN and all other entries are finite.
    expectedSourceBehavior:
    - The invocation outcome and returned int from each matrix are observed rather
      than replaced by a mathematical-rank assumption.
    - If both invocations return normally, their returned ranks must be equal under
      the metamorphic relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INFINITE_ENTRY
    category: EDGE
    description: Positive or negative infinity reaches the same double-based pivot,
      normalization, and elimination implementation paths.
    preconditions:
    - The source is non-empty and rectangular, with dimensions 2x2 or 2x3.
    - At least one entry is Double.POSITIVE_INFINITY or Double.NEGATIVE_INFINITY.
    - Any remaining entries are finite.
    expectedSourceBehavior:
    - The invocation outcome and returned int from each matrix are observed without
      assuming finite arithmetic.
    - If both invocations return normally, the source and transpose ranks must be
      equal.
    targetCases: 2
    emptyOutputAllowed: false
