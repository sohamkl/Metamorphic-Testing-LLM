InputDomain:
  summary: Source cases are CircleImpl receivers and Rectangle arguments in one flat,
    non-geo SpatialContext, covering all four relations, bounding-box shortcuts, phase-2
    axis and corner branches, tangencies, degenerate shapes, zero-radius circles,
    and empty-shape sentinels.
  globalConstraints:
  - The CircleImpl receiver and source Rectangle are non-null and use the same non-geo
    SpatialContext.
  - For every non-empty circle, the center coordinates and radius are finite, the
    radius is at least 0, and new CircleImpl(center, radius, context) completes normally.
  - For every non-empty rectangle, minX, maxX, minY, and maxY are finite, minX <=
    maxX, minY <= maxY, and construction as RectangleImpl(minX, maxX, minY, maxY,
    context) completes normally.
  - Every non-empty source coordinate remains finite after adding SHIFT_X = 17.5 or
    SHIFT_Y = -9.25 as applicable, and the context accepts the shifted center produced
    by context.makePoint.
  - Empty circles are included only through a Point for which point.isEmpty() is true;
    CircleImpl then sets its radius and enclosing box to the empty sentinels shown
    in the source.
  - Empty rectangles are represented by the all-NaN rectangle sentinel used by the
    supplied source, and both source and shifted RectangleImpl construction must complete
    normally.
  - No null receiver, null rectangle, negative radius, reversed rectangle bounds,
    partially-NaN shape, infinity, or construction failure is included because the
    MR requests valid source inputs and the CircleImpl constructor explicitly assumes
    prior validation.
  diversity:
    sourceRelation:
    - CONTAINS
    - WITHIN
    - INTERSECTS
    - DISJOINT
    circleRadiusClass:
    - positive
    - zero
    - empty-sentinel
    rectangleDimension:
    - area
    - vertical-line
    - horizontal-line
    - point
    - empty-sentinel
    boundingBoxPath:
    - DISJOINT-shortcut
    - WITHIN-shortcut
    - equal-box-identity
    - INTERSECTS-phase2
    - CONTAINS-phase2
    centerVsRectangleX:
    - left-of-rectangle
    - inside-x-range
    - right-of-rectangle
    centerVsRectangleY:
    - below-rectangle
    - inside-y-range
    - above-rectangle
    contactType:
    - separated
    - overlap
    - side-tangent
    - corner-tangent
    - containment-boundary
    - exact-equality
    phase2Outcome:
    - closest-corner-DISJOINT
    - bbox-not-CONTAINS-INTERSECTS
    - farthest-corner-INTERSECTS
    - farthest-corner-CONTAINS
  scenarios:
  - id: BBOX_DISJOINT_RIGHT
    category: NORMAL
    description: A positive-radius circle and an area rectangle are separated horizontally
      to the right.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [6,8] x [-2,2].
    - The circle enclosing box [-5,5] x [-5,5] is disjoint from the rectangle.
    expectedSourceBehavior:
    - relate returns DISJOINT through the enclosing-box DISJOINT shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_LEFT
    category: NORMAL
    description: A positive-radius circle and an area rectangle are separated horizontally
      to the left.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-8,-6] x [-2,2].
    - The circle enclosing box is disjoint from the rectangle.
    expectedSourceBehavior:
    - relate returns DISJOINT through the enclosing-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_ABOVE
    category: NORMAL
    description: A positive-radius circle and an area rectangle are separated above
      the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-2,2] x [6,8].
    - The circle enclosing box is disjoint from the rectangle.
    expectedSourceBehavior:
    - relate returns DISJOINT through the enclosing-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_BELOW
    category: NORMAL
    description: A positive-radius circle and an area rectangle are separated below
      the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-2,2] x [-8,-6].
    - The circle enclosing box is disjoint from the rectangle.
    expectedSourceBehavior:
    - relate returns DISJOINT through the enclosing-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_WITHIN_ROOMY_RECTANGLE
    category: NORMAL
    description: The complete circle bounding box lies strictly inside a larger rectangle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-6,7] x [-8,6].
    - The enclosing box [-5,5] x [-5,5] is within the rectangle.
    expectedSourceBehavior:
    - relate returns WITHIN through the enclosing-box WITHIN shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_ENCLOSING_BOX_IDENTITY
    category: EDGE
    description: The rectangle is exactly equal to the circle's enclosing box.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-5,5] x [-5,5].
    - enclosingBox.equals(rectangle) is true.
    expectedSourceBehavior:
    - relate returns WITHIN through the explicit equal-enclosing-box identity edge
      case.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_WITHIN_RECTANGLE_WITH_SHARED_SIDE
    category: BOUNDARY
    description: A containing rectangle shares one side with the circle bounding box.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-5,7] x [-6,6].
    - The enclosing box is within the rectangle but is not equal to it.
    expectedSourceBehavior:
    - relate returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHEAST_CORNER_GAP
    category: NORMAL
    description: The rectangle overlaps the circle bounding box only near its northeast
      corner but misses the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [4,7] x [4,8].
    - The closest rectangle point is (4,4), whose distance from the center is greater
      than 5.
    expectedSourceBehavior:
    - Phase 2 tests the closest corner and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHWEST_CORNER_GAP
    category: NORMAL
    description: The rectangle overlaps the bounding box near the northwest corner
      but misses the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-7,-4] x [4,8].
    - The closest rectangle point is (-4,4), outside the circle.
    expectedSourceBehavior:
    - Phase 2 returns DISJOINT with the center right of and below the rectangle.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHEAST_CORNER_GAP
    category: NORMAL
    description: The rectangle overlaps the bounding box near the southeast corner
      but misses the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [4,7] x [-8,-4].
    - The closest rectangle point is (4,-4), outside the circle.
    expectedSourceBehavior:
    - Phase 2 returns DISJOINT with the center left of and above the rectangle.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_CORNER_GAP
    category: NORMAL
    description: The rectangle overlaps the bounding box near the southwest corner
      but misses the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-7,-4] x [-8,-4].
    - The closest rectangle point is (-4,-4), outside the circle.
    expectedSourceBehavior:
    - Phase 2 returns DISJOINT with the center right of and above the rectangle.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHEAST_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at its nearest northeast corner.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [3,7] x [4,8].
    - The closest point (3,4) is exactly distance 5 from the center.
    expectedSourceBehavior:
    - contains(3,4) is true at the boundary, so relate returns INTERSECTS rather than
      DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHWEST_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at its nearest northwest corner.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-7,-3] x [4,8].
    - The closest point (-3,4) is exactly distance 5 from the center.
    expectedSourceBehavior:
    - relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHEAST_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at its nearest southeast corner.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [3,7] x [-8,-4].
    - The closest point (3,-4) is exactly distance 5 from the center.
    expectedSourceBehavior:
    - relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_CORNER_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle at its nearest southwest corner.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-7,-3] x [-8,-4].
    - The closest point (-3,-4) is exactly distance 5 from the center.
    expectedSourceBehavior:
    - relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RIGHT_SIDE_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle on the positive X axis while spanning
      the circle's Y axis.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [5,7] x [-2,2].
    expectedSourceBehavior:
    - The axis-spanning phase-2 path cannot classify it as disjoint; relate returns
      INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEFT_SIDE_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle on the negative X axis.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-7,-5] x [-2,2].
    expectedSourceBehavior:
    - relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TOP_SIDE_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle on the positive Y axis.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-2,2] x [5,7].
    expectedSourceBehavior:
    - relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTTOM_SIDE_TANGENCY
    category: BOUNDARY
    description: The rectangle touches the circle on the negative Y axis.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-2,2] x [-7,-5].
    expectedSourceBehavior:
    - relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RIGHT_SIDE_AREA_OVERLAP
    category: NORMAL
    description: An area rectangle crosses the circle's right boundary and spans its
      horizontal axis.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [4,7] x [-2,2].
    expectedSourceBehavior:
    - The shapes overlap but neither contains the other, so relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TOP_SIDE_AREA_OVERLAP
    category: NORMAL
    description: An area rectangle crosses the circle's top boundary and spans its
      vertical axis.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-2,2] x [4,7].
    expectedSourceBehavior:
    - relate returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CENTERED_RECTANGLE_CONTAINED
    category: NORMAL
    description: A small centered area rectangle lies strictly inside the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-2,2] x [-2,2].
    - Every rectangle corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - The enclosing box contains the rectangle and the selected farthest corner is
      contained; relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFF_CENTER_RECTANGLE_CONTAINED
    category: NORMAL
    description: An asymmetric rectangle crossing both center axes is contained by
      the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-1,3] x [-2,3].
    - The selected farthest corner (3,3) lies inside the circle.
    expectedSourceBehavior:
    - relate returns CONTAINS while exercising unequal farthest-side selection.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTHEAST_RECTANGLE_CONTAINED
    category: NORMAL
    description: A rectangle wholly northeast of the center is contained by the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [1,3] x [1,4].
    - The farthest corner (3,4) lies on the circle.
    expectedSourceBehavior:
    - The closest-corner test succeeds and the farthest boundary corner is contained,
      so relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOUTHWEST_RECTANGLE_CONTAINED
    category: NORMAL
    description: A rectangle wholly southwest of the center is contained by the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-3,-1] x [-4,-1].
    - The farthest corner (-3,-4) lies on the circle.
    expectedSourceBehavior:
    - relate returns CONTAINS while exercising center-right and center-above phase-2
      branches.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_ON_CIRCLE
    category: BOUNDARY
    description: A rectangle starts at the circle center and has its farthest corner
      exactly on the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [0,3] x [0,4].
    expectedSourceBehavior:
    - Boundary containment of the farthest corner causes relate to return CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EQUAL_DISTANCE_FARTHEST_TIE
    category: EDGE
    description: Opposite rectangle sides are equally distant from the center, exercising
      strict farthest-side tie choices.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-3,3] x [-4,4].
    - All four corners lie exactly on the circle.
    expectedSourceBehavior:
    - The strict greater-than selections choose the minimum sides on ties, and relate
      returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_CIRCLE_DOES_NOT
    category: NORMAL
    description: The rectangle lies inside the square enclosing box but has a farthest
      corner outside the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-1,4] x [-1,4].
    - The enclosing box contains the rectangle, but the selected farthest corner (4,4)
      is outside the circle.
    expectedSourceBehavior:
    - Phase 2 reaches the farthest-corner rejection and returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_INSIDE_CIRCLE
    category: EDGE
    description: The rectangle is a point strictly inside a positive-radius circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [1,1] x [2,2].
    expectedSourceBehavior:
    - relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_ON_CIRCLE
    category: BOUNDARY
    description: The rectangle is a point exactly on the circle.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [3,3] x [4,4].
    expectedSourceBehavior:
    - Boundary-aware contains succeeds and relate returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_POINT_OUTSIDE_CIRCLE
    category: EDGE
    description: The rectangle is a point outside both the circle and its enclosing
      box.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [6,6] x [0,0].
    expectedSourceBehavior:
    - relate returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DIAMETER_LINE_CONTAINED
    category: BOUNDARY
    description: A horizontal zero-height rectangle is a full circle diameter.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-5,5] x [0,0].
    expectedSourceBehavior:
    - Both line endpoints are on the circle and the complete line is contained; relate
      returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LINE_CROSSES_CIRCLE
    category: EDGE
    description: A horizontal zero-height rectangle passes through the circle and
      extends beyond it.
    preconditions:
    - Circle center = (0,0), radius = 5, and rectangle = [-7,7] x [0,0].
    expectedSourceBehavior:
    - The line and circle overlap, but neither contains the other; relate returns
      INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_INSIDE_AREA_RECTANGLE
    category: EDGE
    description: A zero-radius circle is a point strictly inside an area rectangle.
    preconditions:
    - Circle center = (1,2), radius = 0, and rectangle = [0,3] x [0,4].
    expectedSourceBehavior:
    - The point-valued circle's enclosing box is within the rectangle, so relate returns
      WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EXACT_POINT_RECTANGLE
    category: EDGE
    description: A zero-radius circle and a point rectangle have identical bounds.
    preconditions:
    - Circle center = (1,2), radius = 0, and rectangle = [1,1] x [2,2].
    - The circle enclosing box equals the rectangle.
    expectedSourceBehavior:
    - The explicit equal-enclosing-box identity case returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_OUTSIDE_RECTANGLE
    category: EDGE
    description: A zero-radius circle is separated from an area rectangle.
    preconditions:
    - Circle center = (0,0), radius = 0, and rectangle = [1,3] x [1,3].
    expectedSourceBehavior:
    - relate returns DISJOINT through the enclosing-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_CIRCLE_NORMAL_RECTANGLE
    category: EDGE
    description: The receiver uses CircleImpl's empty-point sentinel while the rectangle
      is non-empty.
    preconditions:
    - circle.getCenter().isEmpty() is true.
    - Rectangle = [-2,2] x [-2,2].
    - The empty center remains empty after adding the supplied shifts and passing
      the results to context.makePoint.
    expectedSourceBehavior:
    - The empty enclosing-box sentinel relates as DISJOINT, so the direct rectangle
      overload returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORMAL_CIRCLE_EMPTY_RECTANGLE
    category: EDGE
    description: A non-empty circle is related directly to the all-NaN empty rectangle
      sentinel.
    preconditions:
    - Circle center = (0,0), radius = 5.
    - rectangle.isEmpty() is true and all four rectangle bounds are NaN.
    expectedSourceBehavior:
    - The enclosing-box relation with the empty rectangle is DISJOINT, so relate returns
      DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SHAPES_EMPTY
    category: EDGE
    description: Both the circle receiver and rectangle argument use their empty sentinels.
    preconditions:
    - circle.getCenter().isEmpty() is true.
    - rectangle.isEmpty() is true and all four rectangle bounds are NaN.
    - Both sentinels remain empty under the follow-up arithmetic and construction.
    expectedSourceBehavior:
    - relate returns DISJOINT rather than CONTAINS, WITHIN, or INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
