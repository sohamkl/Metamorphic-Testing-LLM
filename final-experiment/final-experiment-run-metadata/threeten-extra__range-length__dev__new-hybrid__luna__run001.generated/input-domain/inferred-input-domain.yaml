InputDomain:
  summary: Successfully constructed, non-null LocalDateRange receivers whose exclusive
    end can be increased by the supplied follow-up transformation of 23 days. The
    domain covers finite, empty, boundary-adjacent, unbounded-start, construction-
    path, parsing, temporal-conversion, and large-span ranges while retaining the
    supplied relation's sentinel-skip behavior.
  globalConstraints:
  - The source receiver must be a successfully constructed, non-null LocalDateRange.
  - The source start must be less than or equal to the source exclusive end.
  - The source end must be no later than LocalDate.MAX.minusDays(23), so range.getEnd().plusDays(23)
    succeeds.
  - The follow-up must be constructed exactly as LocalDateRange.of(source.getStart(),
    source.getEnd().plusDays(23)).
  - Both source and follow-up construction must satisfy LocalDateRange restrictions,
    including the prohibited starts and ends adjacent to LocalDate.MIN and LocalDate.MAX.
  - A source end equal to LocalDate.MAX.minusDays(23) is allowed; its follow-up end
    is LocalDate.MAX and the follow-up is therefore unbounded at the end.
  - Source ranges whose end is LocalDate.MAX are excluded because generateFollowUp
    calls LocalDate.MAX.plusDays(23), which cannot succeed; this excludes ofUnboundedEnd(...)
    and ofUnbounded() only because the supplied follow-up generator cannot process
    them.
  - Invalid construction arguments, malformed parse text, negative periods, null receivers,
    and other invalid inputs are excluded because the supplied metamorphic relation
    requires a LocalDateRange receiver and does not request invalid-input testing.
  - For finite source and follow-up outputs other than Integer.MAX_VALUE, assertRelation
    requires followUpOutput minus sourceOutput to equal 23.
  - If either output is Integer.MAX_VALUE, assertRelation intentionally skips the
    arithmetic check; those cases remain useful for exercising unbounded or sentinel-producing
    paths.
  diversity:
    constructionPath:
    - of(LocalDate, LocalDate)
    - of(LocalDate, Period)
    - ofClosed(LocalDate, LocalDate)
    - ofEmpty(LocalDate)
    - from(LocalDate)
    - from(Year)
    - from(YearMonth)
    - from(YearHalf)
    - from(YearQuarter)
    - from(YearWeek)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    - ofUnboundedStart(LocalDate)
    rangeShape:
    - empty range
    - one-day range
    - ordinary positive finite range
    - unbounded-start range
    - finite range whose follow-up becomes unbounded at the end
    - very long finite range
    temporalBoundary:
    - ordinary dates
    - leap-day crossing
    - month boundary
    - year boundary
    - start at LocalDate.MIN
    - start at LocalDate.MIN.plusDays(1)
    - end at LocalDate.MAX.minusDays(23)
    - end near LocalDate.MAX while remaining finite
    expectedLengthClass:
    - zero
    - one
    - small positive value
    - calendar-boundary-spanning positive value
    - Integer.MAX_VALUE sentinel
    - large int-returning span
  scenarios:
  - id: ORDINARY_FINITE_HALF_OPEN_RANGE
    category: NORMAL
    description: A conventional positive finite half-open range created with of(LocalDate,
      LocalDate).
    preconditions:
    - The start and end are ordinary LocalDate values.
    - The end is after the start and no later than LocalDate.MAX.minusDays(23).
    - The range is neither empty nor unbounded.
    expectedSourceBehavior:
    - lengthInDays() returns an int representing the whole-day distance from the inclusive
      start to the exclusive end.
    - If neither output is Integer.MAX_VALUE, the follow-up output is exactly 23 greater.
    targetCases: 3
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_ZERO_LENGTH
    category: EDGE
    description: An empty range created with ofEmpty(LocalDate).
    preconditions:
    - The selected date is not LocalDate.MIN, LocalDate.MIN.plusDays(1), LocalDate.MAX.minusDays(1),
      or LocalDate.MAX.
    - The source start equals the source exclusive end.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up has the same start and an end 23 days later, producing the relation's
      23-day increase.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ONE_DAY_FINITE_RANGE
    category: BOUNDARY
    description: The smallest non-empty finite half-open range.
    preconditions:
    - The source end equals source start.plusDays(1).
    - Both dates satisfy LocalDateRange construction restrictions.
    - The source end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up has a 24-day length unless a sentinel path applies.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: BOUNDARY
    description: A finite range crossing February 29 in a leap year.
    preconditions:
    - The source start is before February 29 of a leap year and the exclusive end
      is after that date.
    - The source is finite and follow-up-safe.
    expectedSourceBehavior:
    - lengthInDays() reflects the actual epoch-day distance across the leap day.
    - Extending only the exclusive end by 23 days satisfies the non-sentinel relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: MONTH_AND_YEAR_BOUNDARY_RANGE
    category: BOUNDARY
    description: A finite range crossing a month boundary and a year boundary.
    preconditions:
    - The source start and end lie in different months and different years.
    - The source is finite and follow-up-safe.
    expectedSourceBehavior:
    - lengthInDays() reflects actual day counts across variable month lengths and
      the year transition.
    - The follow-up preserves the start and extends the end by exactly 23 days.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PERIOD_ZERO_CONSTRUCTION
    category: EDGE
    description: An empty range created with of(start, Period.ZERO).
    preconditions:
    - The start is a valid location for an empty range.
    - The period is exactly Period.ZERO.
    expectedSourceBehavior:
    - The constructed start and end are equal.
    - lengthInDays() returns 0 and the follow-up is 23 days long.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_DAY_CONSTRUCTION
    category: NORMAL
    description: A range created with of(start, Period) using a positive day-based
      period.
    preconditions:
    - The period is non-negative and has a positive day component.
    - start.plus(period) succeeds and yields an end no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() measures the day span produced by Period addition.
    - The end-only follow-up increases a non-sentinel result by 23.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_OR_YEAR_CONSTRUCTION
    category: NORMAL
    description: A range created with of(start, Period) using month or year components.
    preconditions:
    - The period is non-negative and includes a month or year component.
    - start.plus(period) succeeds and produces a follow-up-safe finite end.
    expectedSourceBehavior:
    - lengthInDays() observes the actual dates produced by month or year arithmetic,
      including variable month or leap-year effects.
    - The supplied relation applies to the resulting exclusive end.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_CONVERSION
    category: NORMAL
    description: A range created with ofClosed(start, end), exercising inclusive-end
      conversion.
    preconditions:
    - The inclusive end is on or after the start.
    - The converted exclusive end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() includes the closed input's inclusive end through the converted
      half-open representation.
    - Extending the converted exclusive end by 23 produces the specified increase
      when neither output is a sentinel.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PARSED_DATE_DATE_RANGE
    category: NORMAL
    description: A finite range parsed from a date/date representation.
    preconditions:
    - The text contains a valid start date, one forward slash, and a valid exclusive
      end date.
    - The parsed range is finite and its end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - parse creates the represented half-open range.
    - lengthInDays() is measured from the parsed dates and the follow-up changes only
      the parsed end.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_PERIOD_RANGE
    category: NORMAL
    description: A finite range parsed from a date/period representation.
    preconditions:
    - The text contains a valid start date followed by a forward slash and a valid
      non-negative Period.
    - Adding the period to the parsed start succeeds and produces a follow-up-safe
      end.
    expectedSourceBehavior:
    - lengthInDays() measures the range after parse performs start-plus-period arithmetic.
    - The non-sentinel follow-up output is 23 greater.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_PERIOD_DATE_RANGE
    category: NORMAL
    description: A finite range parsed from a period/date representation.
    preconditions:
    - The text contains a valid non-negative Period followed by a forward slash and
      a valid end date.
    - Subtracting the period succeeds and produces a valid start.
    - The parsed end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() measures the range formed by subtracting the period from the
      parsed end.
    - Moving that parsed end 23 days later satisfies the relation unless a sentinel
      is returned.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A one-day range created through from(LocalDate).
    preconditions:
    - The LocalDate is valid for a closed one-day range.
    - The resulting exclusive end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns the length of the one-day range produced by from(LocalDate).
    - The follow-up extends that one-day range by 23 days.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A range created through from(Year), covering the year.
    preconditions:
    - The Year conversion produces a finite range.
    - Its exclusive end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() reflects the represented year's actual number of days.
    - The relation is checked after extending the year range's exclusive end.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A range created through from(YearMonth), covering the month.
    preconditions:
    - The YearMonth conversion produces a finite range.
    - Its exclusive end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() reflects the actual length of the represented month.
    - The follow-up increases a non-sentinel result by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A range created through from(YearHalf), covering the half-year.
    preconditions:
    - The YearHalf conversion produces a finite range.
    - Its exclusive end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() measures the dates produced from the half-year's first and last
      days.
    - The follow-up changes only the exclusive end by 23 days.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A range created through from(YearQuarter), covering the quarter.
    preconditions:
    - The YearQuarter conversion produces a finite range.
    - Its exclusive end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() reflects the quarter's actual calendar-day count.
    - The non-sentinel relation requires an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A range created through from(YearWeek), covering Monday through Sunday
      inclusively.
    preconditions:
    - The YearWeek conversion produces a valid finite range.
    - Its exclusive end is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns the seven-day span produced from the week's endpoints.
    - The follow-up output is 23 greater when neither output is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_SENTINEL
    category: EDGE
    description: A range created with ofUnboundedStart(finiteEnd).
    preconditions:
    - The source start equals LocalDate.MIN.
    - The finite end is valid, is not LocalDate.MIN or LocalDate.MIN.plusDays(1),
      and is no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE for the unbounded-start range.
    - The follow-up remains unbounded at the start, so assertRelation skips arithmetic.
    targetCases: 2
    emptyOutputAllowed: false
  - id: START_AT_MIN_PLUS_ONE
    category: BOUNDARY
    description: A finite range whose start is LocalDate.MIN.plusDays(1), immediately
      adjacent to the unbounded-start marker.
    preconditions:
    - The source start equals LocalDate.MIN.plusDays(1).
    - The source end is after the start and no later than LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() exercises the first allowed finite-start boundary.
    - A small-span instance produces a finite result and the follow-up relation checks
      an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_MAX_FINITE_END
    category: BOUNDARY
    description: A finite range whose exclusive end is close to LocalDate.MAX but
      whose follow-up remains finite.
    preconditions:
    - The source end equals LocalDate.MAX.minusDays(24).
    - The source start is valid and before the end.
    expectedSourceBehavior:
    - lengthInDays() uses the finite-end path.
    - The follow-up end is LocalDate.MAX.minusDays(1), and a non-sentinel result increases
      by 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOWUP_REACHES_MAX
    category: EDGE
    description: A finite source whose 23-day follow-up ends exactly at LocalDate.MAX.
    preconditions:
    - The source end equals LocalDate.MAX.minusDays(23).
    - The source start is valid and strictly before the end.
    expectedSourceBehavior:
    - The source has a finite end and can be measured normally.
    - The follow-up has end LocalDate.MAX and is unbounded at the end.
    - assertRelation skips arithmetic because the follow-up output is the unbounded
      sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_LONG_FINITE_RANGE
    category: EDGE
    description: A finite follow-up-safe range with a very large epoch-day span.
    preconditions:
    - The source is finite and its end is no later than LocalDate.MAX.minusDays(23).
    - The epoch-day difference is greater than or close to Integer.MAX_VALUE.
    expectedSourceBehavior:
    - lengthInDays() exercises the large-span behavior of the int-returning method.
    - The returned source and follow-up outputs are recorded; assertRelation checks
      the 23-day increase only when neither is Integer.MAX_VALUE.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LENGTH_INT_BOUNDARY
    category: BOUNDARY
    description: A finite range selected at or immediately around the Integer.MAX_VALUE
      day-span boundary.
    preconditions:
    - The source is finite and follow-up-safe.
    - The epoch-day difference is selected from values immediately below, equal to,
      or immediately above Integer.MAX_VALUE.
    expectedSourceBehavior:
    - lengthInDays() exercises the boundary of its int return type.
    - The supplied relation either checks an increase of 23 or takes its documented
      Integer.MAX_VALUE sentinel-skip path.
    targetCases: 3
    emptyOutputAllowed: false
