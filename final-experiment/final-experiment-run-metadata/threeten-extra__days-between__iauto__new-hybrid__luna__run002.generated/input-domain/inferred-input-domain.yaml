InputDomain:
  summary: Non-null Java Temporal pairs for which ChronoUnit.DAYS.between is supported,
    produces an integral result within the int range, and both endpoints can be shifted
    by 37 days as required by the metamorphic follow-up.
  globalConstraints:
  - startDateInclusive and endDateExclusive are non-null Temporal objects because
    generateFollowUp calls Objects.requireNonNull on both arguments.
  - Both endpoints support plus(37, ChronoUnit.DAYS) without failure because generateFollowUp
    applies that operation to each endpoint.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is supported and
    returns a long in the inclusive range [-2147483648, 2147483647], because between
    converts the result with Math.toIntExact before constructing Days.
  - Each scenario uses temporals with compatible chronology and day-based comparison
    semantics so that the source call returns a Days value and the shifted pair is
    also evaluable.
  - The follow-up pair is the source pair with exactly 37 days added independently
    to both endpoints; no other transformation is applied.
  - Inputs whose source computation overflows int, whose endpoints cannot be shifted
    by 37 days, or which are null are excluded because the supplied relation cannot
    produce two Days outputs for them; no invalid-input behavior beyond the relation's
    explicit null checks is assumed.
  diversity:
    endpoint_order:
    - end_before_start
    - same_endpoint
    - end_after_start
    result_class:
    - negative
    - zero
    - positive
    source_amount_branch:
    - zero_singleton
    - one_singleton
    - general_days_value
    temporal_representation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime_UTC
    - JapaneseDate
    magnitude:
    - sub_day
    - one_day
    - few_days
    - month_scale
    - year_scale
    - million_days
    - int_maximum
    - int_minimum
    calendar_boundary:
    - ordinary_day
    - month_boundary
    - year_boundary
    - leap_day
    - leap_year_boundary
    time_precision:
    - date_only
    - nanosecond_sub_day
    - exact_24_hours
    - multiple_24_hour_periods
  scenarios:
  - id: LOCAL_DATE_ZERO_GAP
    category: NORMAL
    description: A LocalDate is compared with itself, exercising the zero result and
      Days.of(0).
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 1, 15).
    - endDateExclusive = LocalDate.of(2024, 1, 15).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 0.
    expectedSourceBehavior:
    - between returns a non-null Days.
    - getAmount() is 0.
    - The 37-day-shifted pair also has getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_FORWARD
    category: NORMAL
    description: A LocalDate pair has an exact one-day forward gap, exercising Days.of(1).
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 1, 15).
    - endDateExclusive = LocalDate.of(2024, 1, 16).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 1.
    expectedSourceBehavior:
    - getAmount() is 1.
    - The follow-up output has the same getAmount(), namely 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_REVERSE
    category: NORMAL
    description: A LocalDate pair has an exact one-day reverse gap, exercising negative
      directed amounts.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 1, 16).
    - endDateExclusive = LocalDate.of(2024, 1, 15).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = -1.
    expectedSourceBehavior:
    - getAmount() is -1.
    - The follow-up output has the same getAmount(), namely -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_GENERAL_POSITIVE_GAP
    category: NORMAL
    description: A general positive LocalDate gap exercises the non-singleton Days.of
      path.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 1, 1).
    - endDateExclusive = LocalDate.of(2024, 1, 8).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 7.
    expectedSourceBehavior:
    - getAmount() is 7.
    - The follow-up output has getAmount() 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_GENERAL_NEGATIVE_GAP
    category: NORMAL
    description: A general negative LocalDate gap exercises the non-singleton path
      with a magnitude greater than one.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 1, 8).
    - endDateExclusive = LocalDate.of(2024, 1, 1).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = -7.
    expectedSourceBehavior:
    - getAmount() is -7.
    - The follow-up output has getAmount() -7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: The interval crosses from the end of January into February.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 1, 31).
    - endDateExclusive = LocalDate.of(2024, 2, 1).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 1.
    expectedSourceBehavior:
    - getAmount() is 1 despite the month change.
    - The shifted pair preserves the same one-day amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: The interval crosses a calendar-year boundary.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 12, 31).
    - endDateExclusive = LocalDate.of(2024, 1, 1).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 1.
    expectedSourceBehavior:
    - getAmount() is 1.
    - The follow-up output also has getAmount() 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: The interval crosses February 29 in a leap year.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 2, 28).
    - endDateExclusive = LocalDate.of(2024, 3, 1).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 2.
    expectedSourceBehavior:
    - getAmount() is 2, demonstrating date-based leap-day handling.
    - The follow-up output also has getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: The analogous February interval is evaluated in a non-leap year.
    preconditions:
    - startDateInclusive = LocalDate.of(2023, 2, 28).
    - endDateExclusive = LocalDate.of(2023, 3, 1).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 1.
    expectedSourceBehavior:
    - getAmount() is 1, differing from the leap-year boundary while using the same
      calendar shape.
    - The follow-up output also has getAmount() 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MILLION_DAY_GAP
    category: NORMAL
    description: A large but ordinary LocalDate gap exercises general integer-sized
      results.
    preconditions:
    - startDateInclusive = LocalDate.of(1970, 1, 1).
    - endDateExclusive = startDateInclusive.plusDays(1000000).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 1000000.
    - Both endpoints remain within the LocalDate supported range after adding 37 days.
    expectedSourceBehavior:
    - getAmount() is 1000000.
    - The follow-up output also has getAmount() 1000000.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAXIMUM
    category: EDGE
    description: The positive LocalDate gap is exactly Integer.MAX_VALUE, the largest
      result accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive = LocalDate.of(1970, 1, 1).
    - endDateExclusive = startDateInclusive.plusDays(2147483647L).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 2147483647.
    - Adding 37 days to both endpoints remains within the LocalDate range.
    expectedSourceBehavior:
    - between returns normally rather than throwing from Math.toIntExact.
    - getAmount() is 2147483647.
    - The follow-up output has the same maximum amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MINIMUM
    category: EDGE
    description: The negative LocalDate gap is exactly Integer.MIN_VALUE, the smallest
      result accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive = LocalDate.of(1970, 1, 1).
    - endDateExclusive = startDateInclusive.plusDays(-2147483648L).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = -2147483648.
    - Adding 37 days to both endpoints remains within the LocalDate range.
    expectedSourceBehavior:
    - between returns normally rather than throwing from Math.toIntExact.
    - getAmount() is -2147483648.
    - The follow-up output has the same minimum amount.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_JUST_ABOVE_ZERO
    category: BOUNDARY
    description: A two-day LocalDate gap tests the first general value above the zero
      and one singleton cases.
    preconditions:
    - startDateInclusive = LocalDate.of(2024, 4, 10).
    - endDateExclusive = LocalDate.of(2024, 4, 12).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 2.
    expectedSourceBehavior:
    - getAmount() is 2 and the result is not the documented zero or one singleton
      value.
    - The follow-up output also has getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUB_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints are separated by less than one whole day.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 1, 1, 12, 0, 0, 0).
    - endDateExclusive = LocalDateTime.of(2024, 1, 2, 11, 59, 59, 999999999).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 0.
    expectedSourceBehavior:
    - getAmount() is 0 because the gap contains no whole 24-hour day.
    - The 37-day follow-up also has getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints are exactly one day apart at the same local
      time.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 1, 1, 12, 0, 0).
    - endDateExclusive = LocalDateTime.of(2024, 1, 2, 12, 0, 0).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 1.
    expectedSourceBehavior:
    - getAmount() is 1.
    - The follow-up output also has getAmount() 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_MULTIPLE_DAYS_WITH_NANOS
    category: NORMAL
    description: LocalDateTime endpoints span multiple whole days while retaining
      nanosecond precision.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 1, 1, 0, 0, 0, 1).
    - endDateExclusive = LocalDateTime.of(2024, 1, 4, 0, 0, 0, 1).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 3.
    expectedSourceBehavior:
    - getAmount() is 3.
    - The follow-up output also has getAmount() 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUB_DAY
    category: BOUNDARY
    description: Instant endpoints are separated by less than 24 hours.
    preconditions:
    - startDateInclusive = Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive = Instant.parse("2024-01-01T23:59:59.999999999Z").
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 0.
    expectedSourceBehavior:
    - getAmount() is 0.
    - The shifted Instant pair also has getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_TWO_DAYS
    category: NORMAL
    description: Instant endpoints are separated by exactly two 24-hour periods.
    preconditions:
    - startDateInclusive = Instant.parse("2024-01-01T00:00:00Z").
    - endDateExclusive = Instant.parse("2024-01-03T00:00:00Z").
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 2.
    expectedSourceBehavior:
    - getAmount() is 2.
    - The follow-up output also has getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS
    category: NORMAL
    description: OffsetDateTime endpoints use different fixed offsets while preserving
      a whole-day-based result.
    preconditions:
    - startDateInclusive = OffsetDateTime.parse("2024-01-01T00:00:00+02:00").
    - endDateExclusive = OffsetDateTime.parse("2024-01-03T00:00:00+05:00").
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 1.
    - Both fixed-offset endpoints support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is 1.
    - Adding 37 days to both endpoints preserves the same offset relationship and
      getAmount() remains 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_UTC
    category: NORMAL
    description: ZonedDateTime endpoints use UTC, avoiding zone-offset transitions
      while exercising a zoned Temporal.
    preconditions:
    - startDateInclusive = ZonedDateTime.parse("2024-01-01T00:00:00Z").
    - endDateExclusive = ZonedDateTime.parse("2024-01-10T00:00:00Z").
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 9.
    - Both endpoints support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is 9.
    - The follow-up output also has getAmount() 9.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: JapaneseDate endpoints cross a Japanese calendar year boundary while
      retaining day-based chronology.
    preconditions:
    - startDateInclusive = JapaneseDate.of(2024, 12, 31).
    - endDateExclusive = JapaneseDate.of(2025, 1, 2).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = 2.
    - Both endpoints support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is 2.
    - The follow-up output also has getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_REVERSE_MULTI_DAY
    category: EDGE
    description: LocalDateTime endpoints are reverse ordered by more than one whole
      day.
    preconditions:
    - startDateInclusive = LocalDateTime.of(2024, 5, 10, 18, 30).
    - endDateExclusive = LocalDateTime.of(2024, 5, 7, 18, 30).
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) = -3.
    expectedSourceBehavior:
    - getAmount() is -3.
    - The follow-up output also has getAmount() -3.
    targetCases: 1
    emptyOutputAllowed: false
