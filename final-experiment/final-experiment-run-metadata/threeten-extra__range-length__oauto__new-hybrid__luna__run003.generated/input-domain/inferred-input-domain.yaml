InputDomain:
  summary: Valid LocalDateRange source instances whose exclusive end can be advanced
    by 23 days and whose follow-up can be constructed by LocalDateRange.of, covering
    finite, empty, unbounded-start, boundary, calendar, construction-path, parsing,
    and large-span behavior.
  globalConstraints:
  - The source receiver must be successfully constructed by a supplied LocalDateRange
    construction path.
  - '{The source must satisfy LocalDateRange invariants=start is not after end, start
    is not LocalDate.MAX.minusDays(1), end is not LocalDate.MIN or LocalDate.MIN.plusDays(1),
    and an empty range is not located at LocalDate.MIN or LocalDate.MAX.}'
  - The source end must be no later than LocalDate.MAX.minusDays(23), because generateFollowUp
    calls range.getEnd().plusDays(23).
  - The source end must not be LocalDate.MAX, because generateFollowUp cannot add
    23 days to that value.
  - The follow-up end must be a valid end for LocalDateRange.of; it may equal LocalDate.MAX,
    which represents an unbounded end.
  - Invalid source construction arguments and source instances that make generateFollowUp
    fail are excluded because the supplied metamorphic relation requests a constructed
    follow-up rather than invalid-input behavior.
  - A source with start LocalDate.MIN is retained because it is reachable and lengthInDays
    returns the unbounded-range sentinel Integer.MAX_VALUE.
  - The metamorphic assertion skips arithmetic whenever either output is Integer.MAX_VALUE;
    such cases are retained to exercise the sentinel path.
  diversity:
    constructionPath:
    - of_LOCALDATE_LOCALDATE
    - of_LOCALDATE_PERIOD
    - ofClosed
    - ofEmpty
    - ofUnboundedStart
    - from_LOCALDATE
    - from_YEAR
    - from_YEAR_MONTH
    - from_YEAR_HALF
    - from_YEAR_QUARTER
    - from_YEAR_WEEK
    - parse_DATE_DATE
    - parse_DATE_PERIOD
    - parse_PERIOD_DATE
    boundedness:
    - finite
    - empty
    - unbounded_start
    - follow_up_unbounded_end
    sourceLength:
    - '0'
    - '1'
    - '22'
    - '23'
    - '24'
    - '365'
    - '366'
    - multi_year
    - near_Integer_MAX_VALUE
    - greater_than_Integer_MAX_VALUE
    calendarPosition:
    - ordinary_day
    - month_boundary
    - non_leap_february
    - leap_day
    - year_boundary
    - week_boundary
    endSafety:
    - far_before_MAX
    - exactly_23_days_before_MAX
  scenarios:
  - id: EMPTY_RANGE_ZERO_LENGTH
    category: EDGE
    description: A valid empty range at an ordinary date.
    preconditions:
    - The source is LocalDateRange.ofEmpty(LocalDate.of(2020, 1, 15)).
    - The start equals the exclusive end.
    - The end is at least 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays returns 0.
    - The follow-up is a 23-day non-empty finite range.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: The smallest positive finite half-open range.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2020,
      1, 2)).
    expectedSourceBehavior:
    - lengthInDays returns 1.
    - The follow-up length is 24.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_TWO_DAY_RANGE
    category: BOUNDARY
    description: A range one day shorter than the 23-day extension.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2020,
      1, 23)).
    expectedSourceBehavior:
    - lengthInDays returns 22.
    - The follow-up remains finite and has length 45.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_THREE_DAY_RANGE
    category: BOUNDARY
    description: A range whose source length equals EXTRA_DAYS.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2020,
      1, 24)).
    expectedSourceBehavior:
    - lengthInDays returns 23.
    - The follow-up has length 46.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_FOUR_DAY_RANGE
    category: BOUNDARY
    description: A range one day longer than the 23-day extension.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2020,
      1, 25)).
    expectedSourceBehavior:
    - lengthInDays returns 24.
    - The follow-up has length 47.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_BOUNDARY_CROSSING
    category: BOUNDARY
    description: A finite range whose source and follow-up cross a month boundary.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2021, 1, 25), LocalDate.of(2021,
      1, 31)).
    - The follow-up end is in February.
    expectedSourceBehavior:
    - lengthInDays returns 6.
    - The follow-up remains constructible and finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_LEAP_FEBRUARY_CROSSING
    category: BOUNDARY
    description: A finite range crossing February in a non-leap year.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2021, 2, 20), LocalDate.of(2021,
      3, 5)).
    expectedSourceBehavior:
    - lengthInDays returns 13.
    - The follow-up remains finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING
    category: BOUNDARY
    description: A finite range spanning February 29 in a leap year.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 2, 27), LocalDate.of(2020,
      3, 3)).
    expectedSourceBehavior:
    - lengthInDays returns 5.
    - The follow-up remains constructible.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_CROSSING
    category: BOUNDARY
    description: A finite range crossing from December into January.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 12, 20), LocalDate.of(2021,
      1, 10)).
    expectedSourceBehavior:
    - lengthInDays returns 21.
    - The follow-up remains finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LONG_FINITE_RANGE
    category: NORMAL
    description: A multi-year finite range well within the int-length region.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2010, 1, 1), LocalDate.of(2020,
      1, 1)).
    - Both source and follow-up ends are far before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays returns the whole-day difference between the dates.
    - The follow-up remains finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE_RANGE
    category: NORMAL
    description: A one-day range created from an inclusive end by ofClosed.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2020, 5, 10), LocalDate.of(2020,
      5, 10)).
    expectedSourceBehavior:
    - lengthInDays returns 1.
    - The resulting exclusive end is the day after the inclusive argument.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DAY_RANGE
    category: NORMAL
    description: A multi-day inclusive range converted by ofClosed.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2020, 5, 10), LocalDate.of(2020,
      5, 20)).
    - The resulting exclusive end is 2020-05-21.
    expectedSourceBehavior:
    - lengthInDays returns 11.
    - The follow-up extends the converted exclusive end by 23 days.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_RANGE
    category: EDGE
    description: An empty range created with a zero Period.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 6, 1), Period.ZERO).
    expectedSourceBehavior:
    - lengthInDays returns 0.
    - The follow-up length is 23.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DAY_PERIOD_RANGE
    category: NORMAL
    description: A one-day range created through the Period overload.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 6, 1), Period.ofDays(1)).
    expectedSourceBehavior:
    - lengthInDays returns 1.
    - The follow-up remains finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_PERIOD_RANGE
    category: NORMAL
    description: A range whose end is obtained through calendar-month Period addition.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 1, 31), Period.ofMonths(1)).
    expectedSourceBehavior:
    - lengthInDays returns the date difference produced by LocalDate.plus(Period).
    - The follow-up extends that resulting exclusive end by 23 days.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_RANGE
    category: EDGE
    description: A range with an unbounded start and a finite source end.
    preconditions:
    - The source is LocalDateRange.ofUnboundedStart(LocalDate.of(2020, 1, 1)).
    - The source end is at least 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays returns Integer.MAX_VALUE.
    - The follow-up remains unbounded at the start.
    - assertRelation returns without arithmetic because sourceOutput is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FROM_TEMPORAL
    category: NORMAL
    description: A range obtained from a LocalDate temporal.
    preconditions:
    - The source is LocalDateRange.from(LocalDate.of(2020, 7, 15)).
    expectedSourceBehavior:
    - The from method uses the local date as both inclusive start and inclusive end
      for ofClosed.
    - lengthInDays returns 1.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_FROM_TEMPORAL
    category: NORMAL
    description: A range obtained from a Year temporal.
    preconditions:
    - The source is LocalDateRange.from(Year.of(2020)).
    expectedSourceBehavior:
    - The source spans the complete leap year through the exclusive day after its
      last day.
    - lengthInDays returns the number of days in 2020.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_MONTH_FROM_TEMPORAL
    category: NORMAL
    description: A range obtained from a leap-year February YearMonth.
    preconditions:
    - The source is LocalDateRange.from(YearMonth.of(2020, 2)).
    expectedSourceBehavior:
    - lengthInDays returns 29.
    - The follow-up remains finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_HALF_FROM_TEMPORAL
    category: NORMAL
    description: A range obtained from the first half of a leap year.
    preconditions:
    - The source is LocalDateRange.from(YearHalf.of(2020, 1)).
    expectedSourceBehavior:
    - lengthInDays returns the whole-day length of that half-year.
    - The follow-up remains finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_QUARTER_FROM_TEMPORAL
    category: NORMAL
    description: A range obtained from the first quarter of a leap year.
    preconditions:
    - The source is LocalDateRange.from(YearQuarter.of(2020, 1)).
    expectedSourceBehavior:
    - lengthInDays returns the whole-day length of that quarter.
    - The follow-up remains finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_WEEK_FROM_TEMPORAL
    category: NORMAL
    description: A range obtained from a YearWeek temporal.
    preconditions:
    - The source is LocalDateRange.from(YearWeek.of(2020, 1)).
    expectedSourceBehavior:
    - The source spans the selected Monday-through-Sunday week.
    - lengthInDays returns 7.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A finite range parsed from two date components.
    preconditions:
    - The source is LocalDateRange.parse("2020-01-01/2020-01-10").
    expectedSourceBehavior:
    - lengthInDays returns 9.
    - The follow-up extends the parsed exclusive end.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: A finite range parsed from a date followed by a Period.
    preconditions:
    - The source is LocalDateRange.parse("2020-01-01/P10D").
    expectedSourceBehavior:
    - lengthInDays returns 10.
    - The follow-up remains finite.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: A finite range parsed from a Period followed by an end date.
    preconditions:
    - The source is LocalDateRange.parse("P10D/2020-01-11").
    expectedSourceBehavior:
    - lengthInDays returns 10.
    - The parser-derived start is retained while the follow-up advances the parsed
      end.
    - assertRelation checks an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_INT_MINUS_EXTENSION_LENGTH
    category: BOUNDARY
    description: A finite range whose follow-up length is exactly Integer.MAX_VALUE.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(1970, 1, 1), LocalDate.of(1970,
      1, 1).plusDays(2147483624L)).
    - The source and follow-up ends are valid and finite.
    expectedSourceBehavior:
    - The source length is 2147483624 days.
    - The follow-up length reaches Integer.MAX_VALUE.
    - assertRelation skips because followUpOutput is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_RANGE_NEAR_INT_LIMIT
    category: BOUNDARY
    description: A large finite range whose follow-up is beyond the ordinary positive
      int-length boundary.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(1970, 1, 1), LocalDate.of(1970,
      1, 1).plusDays(2147483645L)).
    - The source end and its 23-day extension are valid LocalDate values and are not
      LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays is invoked on a finite range near the int-length boundary.
    - The follow-up is constructible.
    - If either output is Integer.MAX_VALUE, assertRelation skips; otherwise it checks
      the supplied 23-day difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: GREATER_THAN_INT_MAX_FINITE_RANGE
    category: EDGE
    description: A bounded range whose date difference exceeds Integer.MAX_VALUE days.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(1970, 1, 1), LocalDate.of(1970,
      1, 1).plusDays(2147483648L)).
    - The source and follow-up ends are valid and not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays returns an int for a finite range beyond the ordinary int-length
      boundary.
    - The follow-up is constructible.
    - assertRelation applies its supplied sentinel-skip or arithmetic behavior to
      the returned outputs.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_REACHES_LOCAL_DATE_MAX
    category: BOUNDARY
    description: A finite source whose 23-day extension reaches LocalDate.MAX and
      therefore creates an unbounded-end follow-up.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2000, 1, 1), LocalDate.MAX.minusDays(23)).
    - The source end is finite and exactly 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - The source lengthInDays is evaluated on a finite range.
    - The follow-up is constructible with exclusive end LocalDate.MAX.
    - followUpOutput is Integer.MAX_VALUE for the unbounded-end follow-up, so assertRelation
      skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_PERMITTED_UNBOUNDED_START_END
    category: BOUNDARY
    description: An unbounded-start range using the earliest permitted exclusive end.
    preconditions:
    - The source is LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2)).
    - The source end is neither LocalDate.MIN nor LocalDate.MIN.plusDays(1).
    - The source end is at least 23 days before LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays returns Integer.MAX_VALUE because the start is LocalDate.MIN.
    - The follow-up remains unbounded at the start.
    - assertRelation skips because sourceOutput is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MIN_SENTINEL_START
    category: EDGE
    description: A range directly constructed with LocalDate.MIN as its unbounded-start
      sentinel.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MIN, LocalDate.of(1970, 1, 1)).
    - The source end and its 23-day extension are valid finite dates.
    expectedSourceBehavior:
    - lengthInDays returns Integer.MAX_VALUE.
    - The follow-up remains unbounded at the start.
    - assertRelation skips because sourceOutput is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FAR_FUTURE_FINITE_END
    category: NORMAL
    description: A finite range ending close to, but safely before, the follow-up
      boundary.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2000, 1, 1), LocalDate.MAX.minusDays(24)).
    - The follow-up end is LocalDate.MAX.minusDays(1), not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays is evaluated on a very large finite date difference.
    - The follow-up remains finite and constructible.
    - assertRelation applies the supplied relation to the returned outputs.
    targetCases: 1
    emptyOutputAllowed: false
