InputDomain:
  summary: Source LocalDateRange instances whose lengthInDays() can be invoked and
    whose metamorphic follow-up can be constructed by adding 23 days to the exclusive
    end; coverage emphasizes bounded, empty, unbounded-start, construction-path, date-boundary,
    and integer-length cases.
  globalConstraints:
  - The source receiver must be constructible by one of the supplied LocalDateRange
    factory or parse paths; null receivers and failed constructions are excluded because
    the target is an instance method and the metamorphic relation does not request
    invalid inputs.
  - '{The source range must satisfy the constructor invariants=start is on or before
    end, it must not start at LocalDate.MAX.minusDays(1), and it must not end at LocalDate.MIN
    or LocalDate.MIN.plusDays(1).}'
  - The source end must be no later than LocalDate.MAX.minusDays(23), so generateFollowUp
    can evaluate getEnd().plusDays(23) without date overflow.
  - Source ranges with an unbounded end are excluded because their end is LocalDate.MAX
    and the supplied follow-up transformation calls plusDays(23), which cannot produce
    a follow-up input.
  - For bounded source ranges, the date difference must be no greater than Integer.MAX_VALUE
    - 23 so both the source and the 23-day-extended follow-up have representable int
    lengths; larger constructible ranges are excluded because lengthInDays() or its
    follow-up cannot provide the int output required by assertRelation.
  - Unbounded-start ranges remain included when their end is finite; the supplied
    relation explicitly permits the Integer.MAX_VALUE sentinel and skips arithmetic
    when either output is that sentinel.
  - Every non-sentinel bounded case must use a source end at least 23 days before
    LocalDate.MAX, and its follow-up must be a valid LocalDateRange.of(sourceStart,
    sourceEnd.plusDays(23)).
  diversity:
    constructionPath:
    - of(start
    - end)
    - of(start
    - period)
    - ofClosed(start
    - end)
    - ofEmpty(date)
    - from(LocalDate)
    - from(Year)
    - from(YearMonth)
    - from(YearHalf)
    - from(YearQuarter)
    - from(YearWeek)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    - ofUnboundedStart
    sourceLengthClass:
    - zero
    - one
    - two
    - twentyThree
    - twentyFour
    - ordinary
    - leapYear
    - monthLength
    - halfYear
    - quarterLength
    - weekLength
    - Integer.MAX_VALUE-minus-46
    - Integer.MAX_VALUE-minus-23
    - unbounded-sentinel
    temporalBoundary:
    - ordinary-date
    - month-boundary
    - leap-day
    - year-boundary
    - LocalDate.MIN-plus-two-days
    - near-maximum-follow-up-end
    followUpOutcome:
    - bounded-follow-up-with-exactly-23-day-increase
    - unbounded-follow-up-that-is-skipped-by-the-relation
    - sentinel-source-that-is-skipped-by-the-relation
  scenarios:
  - id: HALF_OPEN_EMPTY_RANGE
    category: BOUNDARY
    description: An empty bounded range created with ofEmpty at an ordinary date.
    preconditions:
    - The source is LocalDateRange.ofEmpty(LocalDate.of(2020, 1, 15)).
    - getStart() equals getEnd(), and the date difference is zero.
    - The end plus 23 days is a valid ordinary date.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a bounded 23-day range and the relation observes an increase
      of exactly 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: HALF_OPEN_ONE_DAY_RANGE
    category: BOUNDARY
    description: A minimal non-empty bounded half-open range.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2020,
      1, 2)).
    - The exclusive end is exactly one day after the inclusive start.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Extending the exclusive end by 23 days produces a 24-day range and satisfies
      the relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_TWENTY_THREE_DAY_RANGE
    category: NORMAL
    description: A bounded range whose source length equals the metamorphic extension
      amount.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2021, 3, 1), LocalDate.of(2021,
      3, 24)).
    - The source date difference is exactly 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46, an exact increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HALF_OPEN_TWENTY_FOUR_DAY_RANGE
    category: BOUNDARY
    description: A bounded range just longer than the metamorphic extension amount.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2021, 3, 1), LocalDate.of(2021,
      3, 25)).
    - The source date difference is exactly 24 days.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    - The follow-up length is 47, an exact increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: EDGE
    description: A bounded range whose day difference crosses February 29 in a leap
      year.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2020, 2, 28), LocalDate.of(2020,
      3, 2)).
    - The half-open date difference includes February 29 and is 3 days.
    expectedSourceBehavior:
    - lengthInDays() returns 3 using whole calendar days.
    - The follow-up remains bounded and must be 26 days long.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_LEAP_FEBRUARY_BOUNDARY
    category: EDGE
    description: A bounded range crossing February in a non-leap year.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2021, 2, 28), LocalDate.of(2021,
      3, 2)).
    - The half-open date difference is 2 days.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length increases to 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_RANGE
    category: EDGE
    description: A bounded range crossing the end of one year and the start of the
      next.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2019, 12, 31), LocalDate.of(2020,
      1, 2)).
    - The source date difference is 2 days.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up is bounded and has length 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO_CONSTRUCTION
    category: BOUNDARY
    description: A zero-period range made through the start-and-Period factory.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2022, 6, 15), Period.ZERO).
    - The period is non-negative and produces equal start and end dates.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The transformed range is valid and has length 23.
    targetCases: 1
    emptyOutputAllowed: true
  - id: PERIOD_MONTH_CONSTRUCTION
    category: NORMAL
    description: A bounded range made through a one-month Period.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2021, 1, 31), Period.ofMonths(1)).
    - The resulting end is 2021-02-28 and the source date difference is 28 days.
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - The follow-up has length 51.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE_RANGE
    category: BOUNDARY
    description: A one-date inclusive range made through ofClosed.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2022, 5, 10), LocalDate.of(2022,
      5, 10)).
    - ofClosed converts the inclusive endpoint to an exclusive end one day later.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_DAY_RANGE
    category: EDGE
    description: A closed range whose inclusive endpoint is February 29.
    preconditions:
    - The source is LocalDateRange.ofClosed(LocalDate.of(2020, 2, 28), LocalDate.of(2020,
      2, 29)).
    - The internally exclusive end is 2020-03-01 and the source length is 2 days.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up is bounded and has length 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A range obtained from a LocalDate temporal.
    preconditions:
    - The source is LocalDateRange.from(LocalDate.of(2023, 7, 4)).
    - The from implementation uses ofClosed for the supplied date, producing a one-day
      range.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_COMMON
    category: NORMAL
    description: A range obtained from a common Year temporal.
    preconditions:
    - The source is LocalDateRange.from(Year.of(2021)).
    - The resulting range runs from January 1 through the exclusive day after December
      31, for 365 days.
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    - The follow-up length is 388.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_LEAP
    category: EDGE
    description: A range obtained from a leap Year temporal.
    preconditions:
    - The source is LocalDateRange.from(Year.of(2020)).
    - The resulting range has a 366-day date difference.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - The follow-up length is 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A range obtained from a YearMonth temporal.
    preconditions:
    - The source is LocalDateRange.from(YearMonth.of(2021, 4)).
    - The resulting range covers April 1 through the exclusive day after April 30,
      for 30 days.
    expectedSourceBehavior:
    - lengthInDays() returns 30.
    - The follow-up length is 53.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A range obtained from a YearHalf temporal.
    preconditions:
    - The source is LocalDateRange.from(YearHalf.of(2021, 1)).
    - The resulting range covers the first half of 2021 and has a 181-day date difference.
    expectedSourceBehavior:
    - lengthInDays() returns 181.
    - The follow-up length is 204.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A range obtained from a YearQuarter temporal.
    preconditions:
    - The source is LocalDateRange.from(YearQuarter.of(2021, 2)).
    - The resulting range covers April through June 2021 and has a 91-day date difference.
    expectedSourceBehavior:
    - lengthInDays() returns 91.
    - The follow-up length is 114.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A range obtained from a YearWeek temporal.
    preconditions:
    - The source is LocalDateRange.from(YearWeek.of(2021, 1)).
    - The resulting range covers Monday through the exclusive day after Sunday, for
      7 days.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up length is 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A bounded range parsed from two ISO local dates.
    preconditions:
    - The source is LocalDateRange.parse("2022-01-10/2022-02-10").
    - The parsed half-open date difference is 31 days.
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    - The follow-up length is 54.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: NORMAL
    description: A bounded range parsed from a date followed by a Period.
    preconditions:
    - The source is LocalDateRange.parse("2022-01-10/P1M").
    - The parsed end is start.plus(Period.ofMonths(1)), giving 31 days from January
      10 to February 10.
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    - The follow-up length is 54.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: NORMAL
    description: A bounded range parsed from a Period followed by an end date.
    preconditions:
    - The source is LocalDateRange.parse("P10D/2022-01-20").
    - The parsed start is ten days before the end and the source date difference is
      10 days.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up length is 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: A range unbounded at the start but with an ordinary finite end.
    preconditions:
    - The source is LocalDateRange.ofUnboundedStart(LocalDate.of(2020, 1, 1)).
    - getStart() equals LocalDate.MIN and getEnd() is finite.
    - The finite end plus 23 days is valid.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-length sentinel.
    - The follow-up remains unbounded at the start, so assertRelation skips arithmetic
      when the source output is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_NEAR_MINIMUM
    category: BOUNDARY
    description: An unbounded-start range using the earliest permitted finite end
      near LocalDate.MIN.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MIN, LocalDate.MIN.plusDays(2)).
    - The end is two days after LocalDate.MIN, avoiding the forbidden end values LocalDate.MIN
      and LocalDate.MIN.plusDays(1).
    - The end plus 23 days is valid.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    - The relation skips the increase assertion because the source output is the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_REPRESENTABLE_FOLLOW_UP_LENGTH
    category: EDGE
    description: A bounded range whose source length is Integer.MAX_VALUE minus 23
      and whose follow-up reaches exactly Integer.MAX_VALUE.
    preconditions:
    - Let start be LocalDate.of(1970, 1, 1).plusDays(Integer.MAX_VALUE - 23 - 0L)
      and let end be start.plusDays(Integer.MAX_VALUE - 23L).
    - The source length is exactly Integer.MAX_VALUE - 23.
    - The source end equals LocalDate.MAX.minusDays(23) only if the chosen start is
      adjusted accordingly; otherwise the chosen dates must still satisfy end.plusDays(23)
      <= LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - The follow-up has length Integer.MAX_VALUE, and the relation observes the exact
      23-day increase.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_REPRESENTABLE_RANGE
    category: EDGE
    description: A bounded range near the largest length that still leaves room for
      the 23-day follow-up.
    preconditions:
    - The source start and end are chosen as valid LocalDate values with end.toEpochDay()
      - start.toEpochDay() equal to Integer.MAX_VALUE - 46.
    - The source end plus 23 days remains a valid finite LocalDate.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 46.
    - The follow-up length is Integer.MAX_VALUE - 23 and the relation observes an
      increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_BECOMES_UNBOUNDED
    category: EDGE
    description: A bounded source whose exclusive end is exactly 23 days before LocalDate.MAX,
      so the transformed end is LocalDate.MAX.
    preconditions:
    - The source end equals LocalDate.MAX.minusDays(23).
    - The source start is selected so the bounded source length is no greater than
      Integer.MAX_VALUE - 23.
    - The source end is finite, but the generated follow-up end is LocalDate.MAX.
    expectedSourceBehavior:
    - The source lengthInDays() is a finite int.
    - The follow-up is unbounded at the end and lengthInDays() returns Integer.MAX_VALUE.
    - assertRelation intentionally skips because the follow-up output is the unbounded
      sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MONTH_END_RANGE
    category: BOUNDARY
    description: A bounded range ending at a month boundary with the exclusive end
      on the first day of the next month.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2022, 1, 25), LocalDate.of(2022,
      2, 1)).
    - The source date difference is 7 days.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up length is 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LONG_ORDINARY_BOUNDED_RANGE
    category: NORMAL
    description: A multi-year bounded range that remains far below the int overflow
      threshold.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(2010, 1, 1), LocalDate.of(2020,
      1, 1)).
    - The source date difference is 3652 days, including leap-day effects.
    expectedSourceBehavior:
    - lengthInDays() returns 3652.
    - The follow-up length is 3675.
    targetCases: 1
    emptyOutputAllowed: false
