InputDomain:
  summary: Finite, non-geodetic CircleImpl centers and non-empty Rectangle inputs
    whose source and translated follow-up constructions remain valid; scenarios target
    the bounding-box shortcuts, rectangle phase-two branches, boundary tests, zero-radius
    behavior, and translation invariance.
  globalConstraints:
  - Use one non-geo SpatialContext for the source circle and rectangle, and reuse
    that same context for the follow-up as required by generateFollowUp.
  - The circle center coordinates and radius are finite; use radiusDEG >= 0 because
    the supplied constructor assumes parameter validation has already occurred and
    the metamorphic relation does not request invalid inputs.
  - The rectangle has finite minX, maxX, minY, and maxY with minX <= maxX and minY
    <= maxY; it is non-empty and its translated coordinates also satisfy these conditions.
  - Choose source coordinates so adding SHIFT_X = 17.5 and SHIFT_Y = -9.25 remains
    representable and accepted by the non-geo context and RectangleImpl construction.
  - 'Exclude empty centers, NaN, infinities, negative radii, and invalid rectangles:
    the direct relate(Rectangle) overload does not contain the empty-shape shortcut
    from relate(Shape), while the supplied code does not define the required Rectangle.relate
    behavior or invalid-input behavior for those cases.'
  - For every case, invoke the typed CircleImpl.relate(Rectangle) source operation
    and the generated shifted CircleImpl/RectangleImpl follow-up, then require identical
    SpatialRelation object values.
  diversity:
    coordinateDomain:
    - finite non-geo Cartesian coordinates
    - negative and positive coordinates
    - coordinates straddling zero
    - coordinates safely translatable by (+17.5,-9.25)
    radiusDomain:
    - '0'
    - positive radius
    - radius equal to a rectangle-corner distance
    - radius strictly larger than all relevant rectangle-corner distances
    boundingBoxRelation:
    - DISJOINT
    - WITHIN
    - CONTAINS with equal-box identity
    - CONTAINS
    - INTERSECTS
    rectanglePosition:
    - outside both center axes
    - center axis left of rectangle
    - center axis right of rectangle
    - center axis inside rectangle on one axis
    - center axes inside rectangle
    rectangleDimension:
    - positive-area rectangle
    - vertical degenerate rectangle
    - horizontal degenerate rectangle
    - point rectangle
    expectedRelation:
    - DISJOINT
    - WITHIN
    - INTERSECTS
    - CONTAINS
    translationOffset:
    - source offset (0,0)
    - follow-up offset (+17.5,-9.25)
  scenarios:
  - id: BBOX_DISJOINT_HORIZONTAL
    category: NORMAL
    description: The rectangle is wholly to the right of the circle's enclosing box,
      so the enclosing-box shortcut returns DISJOINT before rectangle phase two.
    preconditions:
    - Use circle center (0,0), radius 2, and rectangle [10,12] x [0,1].
    - The circle enclosing box is [-2,2] x [-2,2], which is disjoint from the rectangle.
    expectedSourceBehavior:
    - Source result is SpatialRelation.DISJOINT.
    - The follow-up translates both shapes by the same offset and also returns DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_VERTICAL
    category: NORMAL
    description: The rectangle is wholly above the circle's enclosing box, exercising
      the other axis of the DISJOINT bounding-box shortcut.
    preconditions:
    - Use circle center (-8,6), radius 3, and rectangle [-10,-7] x [12,14].
    - The enclosing box is [-11,-5] x [3,9], disjoint from the rectangle in Y.
    expectedSourceBehavior:
    - Source and follow-up results are DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_STRICT
    category: NORMAL
    description: The circle's enclosing box is strictly within the rectangle, so relate(Rectangle)
      returns WITHIN without phase two.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [-6,7] x [-8,6].
    - Each enclosing-box boundary lies strictly inside the corresponding rectangle
      boundary.
    expectedSourceBehavior:
    - Source result is SpatialRelation.WITHIN.
    - The translated source and rectangle also produce WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_ON_BOUNDARY
    category: BOUNDARY
    description: The enclosing box is within the rectangle while sharing rectangle
      boundaries on selected sides.
    preconditions:
    - Use center (2,-3), radius 4, and rectangle [-2,6] x [-5,3].
    - The enclosing box equals the rectangle on both dimensions, so the box is not
      strictly smaller.
    expectedSourceBehavior:
    - The enclosing-box relation is the WITHIN shortcut case or its boundary-equivalent
      result.
    - Source and follow-up results are WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EQUAL_BBOX_IDENTITY_EDGE
    category: EDGE
    description: The enclosing box and rectangle have exactly equal coordinates, targeting
      the explicit enclosingBox.equals(r) identity branch.
    preconditions:
    - Use center (1,1), radius 5, and rectangle [-4,6] x [-4,6].
    - The rectangle coordinates exactly equal the circle's calculated enclosing-box
      coordinates in the non-geo context.
    expectedSourceBehavior:
    - The enclosing-box relation reaches CONTAINS together with enclosingBox.equals(r),
      and the method returns WITHIN.
    - The follow-up preserves equality after the same translation and returns WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RECTANGLE_STRICTLY_INSIDE_CIRCLE
    category: NORMAL
    description: The rectangle is strictly inside the circle, so phase two confirms
      that all of its corners are contained.
    preconditions:
    - Use center (0,0), radius 10, and rectangle [-2,2] x [-3,3].
    - The enclosing box contains the rectangle and the farthest rectangle corner has
      distance sqrt(13), strictly less than 10.
    expectedSourceBehavior:
    - Source result is SpatialRelation.CONTAINS.
    - The translated pair also returns CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: RECTANGLE_INSIDE_CIRCLE_CORNER_BOUNDARY
    category: BOUNDARY
    description: The rectangle is contained with a farthest corner exactly on the
      circle boundary.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [-3,3] x [-4,4].
    - The farthest rectangle corners have distance exactly 5, and the enclosing box
      contains the rectangle.
    expectedSourceBehavior:
    - The inclusive within test accepts the boundary corner and the source result
      is CONTAINS.
    - The follow-up result remains CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_BUT_CORNER_OUTSIDE
    category: NORMAL
    description: The rectangle lies within the circle's enclosing box but extends
      beyond the circle at a farthest corner.
    preconditions:
    - Use center (0,0), radius 10, and rectangle [-9,9] x [-5,5].
    - The enclosing box contains the rectangle, but a farthest corner has distance
      sqrt(106), greater than 10.
    expectedSourceBehavior:
    - Phase two reaches the farthest-point test and returns SpatialRelation.INTERSECTS.
    - The translated pair also returns INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PHASE_TWO_CORNER_DISJOINT
    category: NORMAL
    description: The enclosing boxes intersect, but the closest rectangle corner is
      outside the circle and both rectangle axes are outside the circle axes.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [4,6] x [4,6].
    - The enclosing boxes overlap near (4,4), while the closest point distance sqrt(32)
      is greater than 5.
    - The circle X axis is left of the rectangle and its Y axis is below the rectangle.
    expectedSourceBehavior:
    - Phase two returns DISJOINT after testing the closest corner.
    - The follow-up result remains DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PHASE_TWO_CORNER_INTERSECTION
    category: NORMAL
    description: The enclosing boxes intersect and the closest corner is inside the
      circle, but the rectangle is not contained.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [3,6] x [3,6].
    - The closest corner distance sqrt(18) is less than 5, while the rectangle's farthest
      corner is outside.
    expectedSourceBehavior:
    - The closest-point test does not return DISJOINT; because the bounding-box relation
      is not CONTAINS, phase two returns INTERSECTS.
    - The follow-up result is INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: X_AXIS_SPANS_RECTANGLE
    category: NORMAL
    description: The rectangle spans the circle's X axis but lies above it, exercising
      the branch that cannot use a two-axis closest-corner disjoint test.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [-6,6] x [4,6].
    - The circle X axis lies inside the rectangle while the Y axis is below it; the
      closest point is (0,4), inside the circle.
    expectedSourceBehavior:
    - The method does not return DISJOINT from the two-axis corner test and returns
      INTERSECTS.
    - The translated result is INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: Y_AXIS_SPANS_RECTANGLE
    category: NORMAL
    description: The rectangle spans the circle's Y axis but lies to the right, exercising
      the symmetric X-axis branch.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [4,6] x [-6,6].
    - The circle Y axis lies inside the rectangle while the X axis is left of it;
      the closest point is (4,0), inside the circle.
    expectedSourceBehavior:
    - Source and follow-up results are INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: BOTH_AXES_INTERIOR_PHASE_TWO
    category: EDGE
    description: Both circle axes lie inside the rectangle, but the rectangle is narrower
      than the enclosing box in one dimension, forcing phase two rather than the WITHIN
      shortcut.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [-4,4] x [-6,6].
    - The rectangle contains both circle axes, the enclosing boxes intersect, and
      the rectangle's corners are outside the circle.
    expectedSourceBehavior:
    - The axis-spanning logic avoids the closest-corner disjoint return and the result
      is INTERSECTS.
    - The follow-up result remains INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXTERNAL_CORNER_TANGENCY
    category: BOUNDARY
    description: The closest rectangle corner lies exactly on the circle boundary
      while both rectangle axes are external.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [3,6] x [4,6].
    - The closest corner (3,4) has distance exactly 5; the enclosing boxes intersect.
    expectedSourceBehavior:
    - The inclusive contains test treats the tangent point as contained, so the result
      is INTERSECTS rather than DISJOINT.
    - The translated result is INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: HORIZONTAL_DEGENERATE_RECTANGLE
    category: EDGE
    description: The rectangle has zero height and crosses the circle's X axis, exercising
      rectangle boundary geometry without inventing a separate line type.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [-6,6] x [4,4].
    - The rectangle satisfies minY = maxY, its X range spans the circle axis, and
      its closest point (0,4) is inside the circle.
    expectedSourceBehavior:
    - The source result is INTERSECTS under the supplied rectangle relation logic.
    - The translated result is also INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: VERTICAL_DEGENERATE_RECTANGLE
    category: EDGE
    description: The rectangle has zero width and crosses the circle's Y axis, exercising
      the symmetric degenerate case.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [4,4] x [-6,6].
    - The rectangle satisfies minX = maxX, its Y range spans the circle axis, and
      its closest point (4,0) is inside the circle.
    expectedSourceBehavior:
    - Source and follow-up results are INTERSECTS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_INSIDE_CIRCLE
    category: EDGE
    description: The rectangle degenerates to a point strictly inside the circle.
    preconditions:
    - Use center (0,0), radius 5, and rectangle [3,3] x [4,4].
    - The rectangle has minX = maxX and minY = maxY, and its sole point has distance
      exactly 5 or choose (0,0) for strict interior.
    expectedSourceBehavior:
    - For the strict-interior variant (point (0,0)), the enclosing box contains the
      point and phase two returns CONTAINS.
    - The follow-up preserves the same relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_OUTSIDE_WITH_BBOX_DISJOINT
    category: EDGE
    description: The rectangle degenerates to a point outside the circle with disjoint
      enclosing boxes.
    preconditions:
    - Use center (-2,3), radius 1, and rectangle [4,4] x [-1,-1].
    - The point rectangle is non-empty, and the circle enclosing box is disjoint from
      it.
    expectedSourceBehavior:
    - Source and follow-up results are DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_CONTAINED
    category: EDGE
    description: The circle has zero radius, so its enclosing box collapses to its
      center while the rectangle strictly contains that point.
    preconditions:
    - Use center (2,-1), radius 0, and rectangle [1,3] x [-2,0].
    - The rectangle strictly contains the zero-radius circle center.
    expectedSourceBehavior:
    - The enclosing-box shortcut yields WITHIN for the zero-radius circle.
    - The translated pair also yields WITHIN.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_DISJOINT
    category: EDGE
    description: The zero-radius circle is separated from the rectangle, exercising
      the collapsed enclosing-box disjoint path.
    preconditions:
    - Use center (-3,4), radius 0, and rectangle [1,2] x [0,1].
    - The collapsed enclosing box at (-3,4) is disjoint from the rectangle.
    expectedSourceBehavior:
    - Source and follow-up results are DISJOINT.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_AND_POSITIVE_COORDINATES
    category: NORMAL
    description: A behaviorally ordinary intersection case uses negative and positive
      coordinates to ensure the translation relation is not tested only near the origin.
    preconditions:
    - Use center (-20,15), radius 6, and rectangle [-18,-8] x [10,20].
    - The enclosing boxes intersect and the rectangle overlaps the circle without
      containing it.
    expectedSourceBehavior:
    - Source and follow-up results are INTERSECTS.
    - The common translation changes coordinate signs or magnitudes as applicable
      but not the relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: TRANSLATION_CROSSES_ORIGIN
    category: NORMAL
    description: A disjoint case is positioned so the fixed follow-up offset moves
      coordinates across zero, testing translation invariance independently of sign.
    preconditions:
    - Use center (-10,8), radius 2, and rectangle [-1,1] x [-2,-1].
    - The source enclosing box and rectangle are disjoint, and after (+17.5,-9.25)
      the translated coordinates remain valid.
    expectedSourceBehavior:
    - Both source and follow-up results are DISJOINT despite the coordinate sign change.
    targetCases: 2
    emptyOutputAllowed: false
