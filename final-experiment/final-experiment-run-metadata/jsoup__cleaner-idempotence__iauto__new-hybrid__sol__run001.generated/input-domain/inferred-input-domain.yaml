    description: Parse and clean a table fragment under the relaxed policy.
    preconditions:
    - bodyHtml is exactly '<table><thead><tr><th>H</th></tr></thead><tbody><tr><td>D</td></tr></tbody></table>'.
    - baseUri is empty.
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - Table parser structure and Safelist tag decisions are exercised.
    - The cell texts 'H' and 'D' remain.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNSAFE_IFRAME_WITH_FALLBACK_TEXT
    category: EDGE
    description: Clean an iframe between ordinary text nodes.
    preconditions:
    - bodyHtml is exactly 'before<iframe src="https://example.test/"></iframe>after'.
    - baseUri is empty.
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - The iframe and its src are absent from safe output.
    - The surrounding texts 'before' and 'after' remain.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EVENT_ATTRIBUTE_ON_ALLOWED_TAG
    category: EDGE
    description: Mix an event attribute with a URL attribute on an allowed anchor.
    preconditions:
    - bodyHtml is exactly '<a href="https://example.test/" onclick="alert(1)">go</a>'.
    - baseUri is empty.
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - The onclick attribute is absent from safe output.
    - The tag, text, and href receive independent policy decisions.
    targetCases: 1
    emptyOutputAllowed: false
  - id: STYLE_ATTRIBUTE_FILTERING
    category: EDGE
    description: Apply the relaxed policy to inline style.
    preconditions:
    - bodyHtml is exactly '<p style="position:fixed">content</p>'.
    - baseUri is empty.
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - The style attribute is filtered according to the selected policy.
    - The paragraph text 'content' remains.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAFE_NON_URL_ATTRIBUTE
    category: NORMAL
    description: Exercise a descriptive attribute independently of URL validation.
    preconditions:
    - bodyHtml is exactly '<a href="https://example.test/" title="description">label</a>'.
    - baseUri is empty.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The title and href receive separate attribute decisions.
    - The text 'label' remains.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DUPLICATE_ATTRIBUTES
    category: EDGE
    description: Parse duplicate href attributes before cleaning.
    preconditions:
    - bodyHtml is exactly '<a href="https://one.example/" href="javascript:alert(1)">dup</a>'.
    - baseUri is empty.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - Parser duplicate-attribute normalization occurs before URL validation.
    - The output has at most one href and retains the text 'dup'.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNCLOSED_ALLOWED_ELEMENTS
    category: EDGE
    description: Clean an unclosed paragraph and formatting element.
    preconditions:
    - bodyHtml is exactly '<p>alpha <b>beta'.
    - baseUri is empty.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - The body-fragment parser balances the input into serializable HTML.
    - Both 'alpha' and 'beta' remain.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MISNESTED_FORMATTING_ELEMENTS
    category: EDGE
    description: Clean overlapping formatting tags requiring parser correction.
    preconditions:
    - bodyHtml is exactly '<b>bold <i>both</b> italic</i>'.
    - baseUri is empty.
    - safelist is Safelist.simpleText().
    expectedSourceBehavior:
    - The parser repairs the misnested structure before filtering.
    - The words 'bold', 'both', and 'italic' remain.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPERCASE_TAG_AND_ATTRIBUTE_NAMES
    category: EDGE
    description: Clean uppercase tag, attribute, and protocol spellings.
    preconditions:
    - bodyHtml is exactly '<A HREF="HTTPS://EXAMPLE.TEST/X">UPPER</A>'.
    - baseUri is empty.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - HTML-name normalization and protocol handling are exercised.
    - The text 'UPPER' remains.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ESCAPED_MARKUP_AS_TEXT
    category: NORMAL
    description: Distinguish escaped markup text from an actual script element.
    preconditions:
    - bodyHtml is exactly '&lt;script&gt;not markup&lt;/script&gt;'.
    - baseUri is empty.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - The decoded characters remain text and are safely re-escaped.
    - No script element exists in the cleaned result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NUMERIC_ENTITY_BOUNDARIES
    category: EDGE
    description: Clean decimal and hexadecimal entities for reserved characters.
    preconditions:
    - bodyHtml is exactly '5 &#60; 6 &#x26;&#x26; 7 &#62; 6'.
    - baseUri is empty.
    - safelist is Safelist.none().
    expectedSourceBehavior:
    - Entity decoding and safe HTML re-escaping are exercised.
    - The comparison characters remain text rather than becoming markup.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULL_DOCUMENT_AS_BODY_FRAGMENT
    category: EDGE
    description: Pass document-structural markup to the body-fragment target.
    preconditions:
    - bodyHtml is exactly '<html><head><title>T</title></head><body><p>B</p></body></html>'.
    - baseUri is empty.
    - safelist is Safelist.relaxed().
    expectedSourceBehavior:
    - The input is parsed using body-fragment semantics.
    - Document wrappers are not returned as complete-document output.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BASE_ELEMENT_INSIDE_FRAGMENT
    category: EDGE
    description: Include a base element and relative anchor in the fragment.
    preconditions:
    - bodyHtml is exactly '<base href="https://other.example/root/"><a href="child">child</a>'.
    - baseUri is exactly 'https://example.test/start/'.
    - safelist is Safelist.basic().
    expectedSourceBehavior:
    - URL-resolution context is processed during parsing and cleaning.
    - The base element is absent from returned safe body HTML while 'child' remains.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_SAFE_AND_UNSAFE_BATCH
    category: NORMAL
    description: Combine allowed structure, unsafe tags, unsafe attributes, and URL
      filtering.
    preconditions:
    - bodyHtml is exactly '<p>start <a href="https://example.test/" onclick="x()">link</a><script>x()</script><img
