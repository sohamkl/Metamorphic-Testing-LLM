    - The texts 'start', 'link', and 'end' remain.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_CONSTRUCTED_SAFELIST
    category: NORMAL
    description: Use the public zero-argument Safelist constructor.
    preconditions:
    - bodyHtml is exactly '<p>alpha <b>beta</b></p>'.
    - baseUri is empty.
    - safelist is created by new Safelist().
