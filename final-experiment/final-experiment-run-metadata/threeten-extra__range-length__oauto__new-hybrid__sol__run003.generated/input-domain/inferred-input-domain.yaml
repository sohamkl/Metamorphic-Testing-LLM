InputDomain:
  summary: Non-null, successfully constructed LocalDateRange receivers whose exclusive
    end can be advanced by exactly 23 days; includes empty, bounded, unbounded-start,
    calendrical-boundary, representational-limit, and supported construction-path
    cases.
  globalConstraints:
  - The source receiver is non-null, as generateFollowUp applies Objects.requireNonNull(range,
    "range").
  - 'The source is a successfully constructed LocalDateRange satisfying its constructor
    invariants: getEnd() is not before getStart(), getStart() is neither LocalDate.MAX
    nor LocalDate.MAX.minusDays(1), getEnd() is neither LocalDate.MIN nor LocalDate.MIN.plusDays(1),
    and an empty range is not located at LocalDate.MIN or LocalDate.MAX.'
  - The source exclusive end satisfies getEnd().compareTo(LocalDate.MAX.minusDays(23))
    <= 0, so getEnd().plusDays(23) used by generateFollowUp is defined.
  - Ranges with an unbounded end, including the fully unbounded range, are excluded
    because their end is LocalDate.MAX and generateFollowUp calls LocalDate.MAX.plusDays(23)
    before assertRelation can skip the sentinel output.
  - Valid bounded ranges ending from LocalDate.MAX.minusDays(22) through LocalDate.MAX
    are excluded because the specified follow-up transformation overflows LocalDate,
    not merely to simplify the assertion.
  - Unbounded-start ranges remain in-domain when their end satisfies the 23-day headroom
    constraint; lengthInDays() returns Integer.MAX_VALUE and assertRelation intentionally
    skips them.
  - No invalid or exception-producing source construction is requested because the
    metamorphic relation accepts a constructed LocalDateRange and does not define
    behavior for failed construction.
  diversity:
    boundedness:
    - bounded start and bounded end
    - unbounded start and bounded end
    - bounded source whose follow-up becomes unbounded-end
    sourceLengthClass:
    - zero days
    - one day
    - 22 days
    - 23 days
    - 24 days
    - ordinary multi-day
    - Integer.MAX_VALUE minus 24
    - Integer.MAX_VALUE minus 23
    - Integer.MAX_VALUE minus 22
    - exactly Integer.MAX_VALUE
    - greater than Integer.MAX_VALUE
    - unbounded sentinel
    calendarPosition:
    - ordinary date
    - month boundary
    - year boundary
    - leap day
    - non-leap century
    - leap century
    - epoch crossing
    - proleptic year-zero crossing
    - near LocalDate.MIN
    - near LocalDate.MAX
    constructionPath:
    - of(LocalDate, LocalDate)
    - of(LocalDate, Period)
    - ofClosed(LocalDate, LocalDate)
    - ofEmpty(LocalDate)
    - ofUnboundedStart(LocalDate)
    - from(Temporal)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    relationObservability:
    - both outputs finite and exact increase is checked
    - source output is Integer.MAX_VALUE and assertion skips
    - follow-up output is Integer.MAX_VALUE and assertion skips
  scenarios:
  - id: ORDINARY_EMPTY_RANGE
    category: EDGE
    description: An ordinary empty range created with ofEmpty.
    preconditions:
    - getStart().equals(getEnd())
    - getStart().equals(LocalDate.of(2024, 5, 10))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_ALLOWED_EMPTY_RANGE
    category: BOUNDARY
    description: An empty range at the earliest location allowed by the constructor.
    preconditions:
    - getStart().equals(LocalDate.MIN.plusDays(2))
    - getEnd().equals(LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: NORMAL
    description: A one-day half-open range constructed with of(start, end).
    preconditions:
    - getStart().equals(LocalDate.of(2024, 6, 1))
    - getEnd().equals(LocalDate.of(2024, 6, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_JUST_BELOW_EXTRA_DAYS
    category: BOUNDARY
    description: A bounded source whose length is one day less than EXTRA_DAYS.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() == 22
    - getStart() is not LocalDate.MIN
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EQUAL_TO_EXTRA_DAYS
    category: BOUNDARY
    description: A bounded source whose length equals EXTRA_DAYS.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() == 23
    - getStart() is not LocalDate.MIN
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_JUST_ABOVE_EXTRA_DAYS
    category: BOUNDARY
    description: A bounded source whose length is one day greater than EXTRA_DAYS.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() == 24
    - getStart() is not LocalDate.MIN
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_LEAP_DAY
    category: EDGE
    description: A bounded range spanning February 29 in a leap year.
    preconditions:
    - getStart().equals(LocalDate.of(2024, 2, 28))
    - getEnd().equals(LocalDate.of(2024, 3, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_LEAP_CENTURY_FEBRUARY
    category: EDGE
    description: A bounded range crossing February 1900, which has no February 29.
    preconditions:
    - getStart().equals(LocalDate.of(1900, 2, 28))
    - getEnd().equals(LocalDate.of(1900, 3, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_CENTURY_FEBRUARY
    category: EDGE
    description: A bounded range crossing February 2000, a leap-century February.
    preconditions:
    - getStart().equals(LocalDate.of(2000, 2, 28))
    - getEnd().equals(LocalDate.of(2000, 3, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SHORT_MONTH_BOUNDARY
    category: EDGE
    description: A bounded range crossing the end of a 30-day month.
    preconditions:
    - getStart().equals(LocalDate.of(2023, 4, 29))
    - getEnd().equals(LocalDate.of(2023, 5, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY
    category: EDGE
    description: A bounded range crossing December 31 into the next year.
    preconditions:
    - getStart().equals(LocalDate.of(2023, 12, 30))
    - getEnd().equals(LocalDate.of(2024, 1, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPOCH_BOUNDARY
    category: EDGE
    description: A bounded range crossing the 1970-01-01 epoch date.
    preconditions:
    - getStart().equals(LocalDate.of(1969, 12, 31))
    - getEnd().equals(LocalDate.of(1970, 1, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PROLEPTIC_YEAR_ZERO_BOUNDARY
    category: EDGE
    description: A bounded range crossing from proleptic year -1 into year 0.
    preconditions:
    - getStart().equals(LocalDate.of(-1, 12, 31))
    - getEnd().equals(LocalDate.of(0, 1, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_CONSTRUCTION
    category: EDGE
    description: An empty source constructed with of(start, Period.ZERO).
    preconditions:
    - The source is constructed by of(LocalDate.of(2024, 7, 1), Period.ZERO).
    - getStart().equals(getEnd())
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DAY_PERIOD_CONSTRUCTION
    category: NORMAL
    description: A bounded source constructed from a positive day-based Period.
    preconditions:
    - The source is constructed by of(LocalDate.of(2024, 7, 1), Period.ofDays(10)).
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_PERIOD_FROM_MONTH_END
    category: EDGE
    description: A source constructed from a one-month Period beginning at a month-end
      date.
    preconditions:
    - The source is constructed by of(LocalDate.of(2023, 1, 31), Period.ofMonths(1)).
    - getEnd().equals(LocalDate.of(2023, 2, 28))
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_PERIOD_ACROSS_LEAP_DAY
    category: EDGE
    description: A source constructed from a one-year Period beginning on leap day.
    preconditions:
    - The source is constructed by of(LocalDate.of(2024, 2, 29), Period.ofYears(1)).
    - getEnd().equals(LocalDate.of(2025, 2, 28))
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLETON_RANGE
    category: BOUNDARY
    description: A closed range with identical inclusive endpoints.
    preconditions:
    - The source is constructed by ofClosed(LocalDate.of(2024, 8, 8), LocalDate.of(2024,
      8, 8)).
    expectedSourceBehavior:
    - lengthInDays() returns 1 because ofClosed converts the inclusive end to the
      next exclusive date.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DAY_RANGE
    category: NORMAL
    description: A closed range with distinct inclusive endpoints.
    preconditions:
    - The source is constructed by ofClosed(LocalDate.of(2024, 8, 8), LocalDate.of(2024,
      8, 12)).
    expectedSourceBehavior:
    - lengthInDays() returns 5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_RANGE_AT_MAXIMUM_TRANSFORMABLE_END
    category: BOUNDARY
    description: A closed source whose converted exclusive end is LocalDate.MAX.minusDays(23).
    preconditions:
    - The source is constructed with an inclusive end equal to LocalDate.MAX.minusDays(24).
    - getEnd().equals(LocalDate.MAX.minusDays(23))
    - getStart().equals(LocalDate.MAX.minusDays(25))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_FORM
    category: NORMAL
    description: A bounded range parsed through the date/date branch.
    preconditions:
    - The source is produced by parse("2024-03-01/2024-03-11").
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD_FORM
    category: NORMAL
    description: A bounded range parsed through the date/period branch.
    preconditions:
    - The source is produced by parse("2024-03-01/P10D").
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE_FORM
    category: NORMAL
    description: A bounded range parsed through the period/date branch.
    preconditions:
    - The source is produced by parse("P10D/2024-03-11").
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_LOWERCASE_PERIOD_DISCRIMINATOR
    category: EDGE
    description: A valid parsed range exercising the source checks for a lowercase
      period discriminator.
    preconditions:
    - The parse input has a valid lowercase 'p' period representation accepted by
      Period.parse.
    - The resulting getEnd().toEpochDay() - getStart().toEpochDay() == 5.
    expectedSourceBehavior:
    - lengthInDays() returns 5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TEMPORAL
    category: NORMAL
    description: A source created by from(Temporal) when the temporal directly supplies
      a LocalDate.
    preconditions:
    - The Temporal queried by from is LocalDate.of(2024, 9, 15).
    expectedSourceBehavior:
    - lengthInDays() returns 1 because from uses ofClosed(date, date).
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_DATE_BEARING_TIME_TEMPORAL
    category: NORMAL
    description: A source created by from(Temporal) when a temporal with a time component
      supplies a local date.
    preconditions:
    - The TemporalQueries.localDate() result is LocalDate.of(2024, 9, 15).
    - The temporal is not itself a LocalDate.
    expectedSourceBehavior:
    - lengthInDays() returns 1 because the time component is ignored and a one-day
      closed range is created.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEARMONTH
    category: EDGE
    description: A source created from a YearMonth representing February in a leap
      year.
    preconditions:
    - The temporal passed to from is a YearMonth for February 2024.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: A source created from a non-leap Year.
    preconditions:
    - The temporal passed to from is Year.of(2023).
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A source exercising the YearHalf branch of from(Temporal).
    preconditions:
    - The temporal passed to from is an instance of YearHalf.
    - Its atDay(1) and atEndOfHalf() dates produce an exclusive end no later than
      LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns the exact number of dates from atDay(1) through atEndOfHalf(),
      inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A source exercising the YearQuarter branch of from(Temporal).
    preconditions:
    - The temporal passed to from is an instance of YearQuarter.
    - Its atDay(1) and atEndOfQuarter() dates produce an exclusive end no later than
      LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns the exact number of dates from atDay(1) through atEndOfQuarter(),
      inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK_CROSSING_YEAR
    category: EDGE
    description: A source exercising the YearWeek branch where Monday and Sunday cross
      a calendar-year boundary.
    preconditions:
    - The temporal passed to from is an instance of YearWeek.
    - atDay(DayOfWeek.MONDAY) and atDay(DayOfWeek.SUNDAY) belong to different calendar
      years.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_UNBOUNDED_START_RANGE
    category: BOUNDARY
    description: The shortest constructible range with an unbounded start.
    preconditions:
    - getStart().equals(LocalDate.MIN)
    - getEnd().equals(LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_UNBOUNDED_START_RANGE
    category: EDGE
    description: An unbounded-start range with an ordinary exclusive end.
    preconditions:
    - The source is constructed by ofUnboundedStart(LocalDate.of(2024, 1, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE and assertRelation skips the case.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_AT_TRANSFORMATION_LIMIT
    category: BOUNDARY
    description: An unbounded-start source at the latest end accepted by the follow-up
      transformation.
    preconditions:
    - getStart().equals(LocalDate.MIN)
    - getEnd().equals(LocalDate.MAX.minusDays(23))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_BOUNDED_ONE_DAY_RANGE
    category: BOUNDARY
    description: The earliest one-day range that is bounded at the start.
    preconditions:
    - getStart().equals(LocalDate.MIN.plusDays(1))
    - getEnd().equals(LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOURCE_END_AT_MAXIMUM_TRANSFORMABLE_DATE
    category: BOUNDARY
    description: A finite source ending exactly 23 days before LocalDate.MAX, so the
      follow-up end becomes LocalDate.MAX.
    preconditions:
    - getStart().equals(LocalDate.MAX.minusDays(24))
    - getEnd().equals(LocalDate.MAX.minusDays(23))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The source output is finite, while the generated follow-up is unbounded-end
      and is skipped by assertRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SOURCE_END_ONE_DAY_BEFORE_TRANSFORMATION_LIMIT
    category: BOUNDARY
    description: A finite source whose follow-up ends at LocalDate.MAX.minusDays(1),
      remaining bounded.
    preconditions:
    - getStart().equals(LocalDate.MAX.minusDays(25))
    - getEnd().equals(LocalDate.MAX.minusDays(24))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Both source and follow-up outputs are finite, so the exact increase is checked.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_BELOW_INT_SENTINEL_THRESHOLD
    category: BOUNDARY
    description: A finite range whose length and extended length both remain below
      Integer.MAX_VALUE.
    preconditions:
    - getStart() is not LocalDate.MIN
    - getEnd().toEpochDay() - getStart().toEpochDay() == Integer.MAX_VALUE - 24
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24.
    - The follow-up remains finite-valued at Integer.MAX_VALUE - 1, so the 23-day
      increase is checked.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_REACHES_INT_MAX_EXACTLY
    category: BOUNDARY
    description: A finite source whose mathematical follow-up length is exactly Integer.MAX_VALUE.
    preconditions:
    - getStart() is not LocalDate.MIN
    - getEnd().toEpochDay() - getStart().toEpochDay() == Integer.MAX_VALUE - 23
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    - The follow-up output equals Integer.MAX_VALUE, causing assertRelation to take
      its skip path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_EXCEEDS_INT_MAX_BY_ONE
    category: BOUNDARY
    description: A finite source whose mathematical follow-up length exceeds the int
      maximum by one day.
    preconditions:
    - getStart() is not LocalDate.MIN
    - getEnd().toEpochDay() - getStart().toEpochDay() == Integer.MAX_VALUE - 22
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 22.
    - The follow-up uses Integer.MAX_VALUE as its capped output, so assertRelation
      skips it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_EXACTLY_INT_MAX
    category: BOUNDARY
    description: A bounded range whose real day count is exactly Integer.MAX_VALUE.
    preconditions:
    - getStart() is not LocalDate.MIN
    - getEnd().toEpochDay() - getStart().toEpochDay() == Integer.MAX_VALUE
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - assertRelation skips because the finite value is indistinguishable from the
      sentinel in its guard.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_JUST_ABOVE_INT_MAX
    category: EDGE
    description: A bounded range whose real day count exceeds Integer.MAX_VALUE by
      one.
    preconditions:
    - getStart() is not LocalDate.MIN
    - getEnd().toEpochDay() - getStart().toEpochDay() == ((long) Integer.MAX_VALUE)
      + 1L
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the int-sized cap.
    - assertRelation skips the capped source output.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERY_LARGE_FINITE_RANGE
    category: EDGE
    description: A bounded finite range substantially longer than the int return type
      can represent.
    preconditions:
    - getStart() is not LocalDate.MIN
    - getEnd().toEpochDay() - getStart().toEpochDay() > ((long) Integer.MAX_VALUE)
      + 1L
    - getEnd().compareTo(LocalDate.MAX.minusDays(23)) <= 0
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the int-sized cap.
    - The source exercises the large-finite-range path rather than an unbounded endpoint.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MULTI_CENTURY_FINITE_RANGE
    category: NORMAL
    description: A long but int-representable bounded range spanning multiple Gregorian
      centuries.
    preconditions:
    - getStart().equals(LocalDate.of(1600, 1, 1))
    - getEnd().equals(LocalDate.of(2400, 1, 1))
    expectedSourceBehavior:
    - lengthInDays() returns getEnd().toEpochDay() - getStart().toEpochDay() as an
      exact positive int.
    - The output is below Integer.MAX_VALUE, so the follow-up relation is non-vacuous.
    targetCases: 1
    emptyOutputAllowed: false
