InputDomain:
  summary: Non-null geographic RectangleImpl and Point inputs created with the same
    geographic SpatialContext, using finite standard longitude and latitude coordinates,
    with additional sentinel cases for the constructor's explicitly unvalidated longitude
    fields. Cases emphasize latitude rejection, ordinary longitude containment, dateline
    unwrapping, rotation-induced wrap transitions, and equality boundaries.
  globalConstraints:
  - The rectangle and point are non-null, because the follow-up generator explicitly
    rejects null inputs.
  - The rectangle and point use the same non-null SpatialContext, and rectangle.getContext().isGeo()
    is true; the follow-up applies longitude normalization and the target's dateline
    logic is geographic.
  - For ordinary cases, all point and rectangle coordinates are finite; longitudes
    are in [-180.0, 180.0] and latitudes are in [-90.0, 90.0].
  - For ordinary rectangles, minY <= maxY, matching the assertion in RectangleImpl.reset.
  - The rectangle's raw longitude width is not exactly 360.0 degrees; the supplied
    follow-up normalizes both endpoints independently, so a full-world interval would
    not in general retain the same endpoint representation after the 150-degree rotation.
  - The source target is the direct relate(Point) overload, so the rectangle and point
    are supplied as an instance/argument pair and no assumption is made that the general
    relate(Shape) empty check runs.
  - A follow-up is generated by adding exactly 150.0 degrees to both rectangle longitudes
    and the point longitude, then applying DistanceUtils.normLonDEG; latitude is unchanged.
  diversity:
    contextMode:
    - GEOGRAPHIC
    latitudeRelation:
    - BELOW_MIN_Y
    - AT_MIN_Y
    - STRICTLY_INSIDE
    - AT_MAX_Y
    - ABOVE_MAX_Y
    longitudeRepresentation:
    - NON_WRAPPING
    - DATELINE_WRAPPING
    - ZERO_WIDTH
    - EMPTY_NAN_MIN_X
    longitudeProbePath:
    - DIRECT_IN_RANGE
    - LESS_THAN_MIN_X_SHIFTED
    - GREATER_THAN_MAX_X_SHIFTED
    - FINAL_RANGE_REJECTION
    rotationOutcome:
    - REMAINS_NON_WRAPPING
    - BECOMES_DATELINE_WRAPPING
    - CEASES_DATELINE_WRAPPING
    numericSentinel:
    - FINITE
    - NAN_RECTANGLE_MIN_X
    - NAN_POINT_X
    sourceRelation:
    - CONTAINS
    - DISJOINT
  scenarios:
  - id: NONWRAPPING_INTERIOR_DIRECT_CONTAINS
    category: NORMAL
    description: A non-wrapping rectangle contains a point strictly inside both coordinate
      ranges, so geographic longitude logic takes its direct in-range short circuit.
    preconditions:
    - Rectangle coordinates are minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=10.0, y=5.0.
    expectedSourceBehavior:
    - The latitude checks pass.
    - Because pX is between minX and maxX, relate(Point) returns SpatialRelation.CONTAINS
      before longitude shifting.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAPPING_LEFT_LONGITUDE_DISJOINT
    category: NORMAL
    description: A point is west of a non-wrapping rectangle and remains outside after
      the geographic +360 longitude adjustment.
    preconditions:
    - Rectangle coordinates are minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=-100.0, y=0.0.
    expectedSourceBehavior:
    - The latitude checks pass.
    - pX < minX causes pX to increase by 360 degrees, producing 260.0, which remains
      greater than maxX.
    - relate(Point) returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAPPING_RIGHT_LONGITUDE_DISJOINT
    category: NORMAL
    description: A point is east of a non-wrapping rectangle and remains outside after
      the geographic -360 longitude adjustment.
    preconditions:
    - Rectangle coordinates are minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=100.0, y=0.0.
    expectedSourceBehavior:
    - The latitude checks pass.
    - pX > maxX causes pX to decrease by 360 degrees, producing -260.0, which remains
      less than minX.
    - relate(Point) returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_LONGITUDE_BOUNDARY_CONTAINS
    category: BOUNDARY
    description: The point lies exactly on both non-wrapping longitude boundaries
      while remaining inside the latitude interval.
    preconditions:
    - Use rectangle minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - Run separate source cases with point (-40.0, 0.0) and point (40.0, 0.0).
    expectedSourceBehavior:
    - The inclusive comparisons do not shift either boundary point outside the interval.
    - Each source result is SpatialRelation.CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LATITUDE_BELOW_DISJOINT
    category: BOUNDARY
    description: The point is immediately below the rectangle's minimum latitude,
      exercising the first latitude rejection.
    preconditions:
    - Rectangle coordinates are minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=0.0, y=-20.0000000001.
    expectedSourceBehavior:
    - point.getY() < getMinY() is true.
    - relate(Point) returns SpatialRelation.DISJOINT without executing longitude logic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_ABOVE_DISJOINT
    category: BOUNDARY
    description: The point is immediately above the rectangle's maximum latitude,
      exercising the first latitude rejection.
    preconditions:
    - Rectangle coordinates are minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=0.0, y=20.0000000001.
    expectedSourceBehavior:
    - point.getY() > getMaxY() is true.
    - relate(Point) returns SpatialRelation.DISJOINT without executing longitude logic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_BOUNDARIES_AND_LONGITUDE_INTERIOR
    category: BOUNDARY
    description: The point is exactly on each latitude boundary while its longitude
      is strictly inside.
    preconditions:
    - Use rectangle minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - Run separate source cases with point (0.0, -20.0) and point (0.0, 20.0).
    expectedSourceBehavior:
    - The strict latitude rejection tests do not reject either point.
    - The longitude direct-in-range path returns SpatialRelation.CONTAINS for both
      cases.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DATELINE_WRAP_DIRECT_CONTAINS_NEAR_EAST_EDGE
    category: NORMAL
    description: A dateline-wrapping rectangle contains a point numerically between
      its minimum longitude and its unwrapped maximum.
    preconditions:
    - Rectangle coordinates are minX=170.0, maxX=-170.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=175.0, y=0.0.
    expectedSourceBehavior:
    - rawWidth is negative, so maxX is unwrapped from -170.0 to 190.0.
    - The point is then directly in the unwrapped [170.0,190.0] interval.
    - relate(Point) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_WRAP_LEFT_SHIFT_CONTAINS
    category: NORMAL
    description: A dateline-wrapping rectangle contains a point on the negative-longitude
      side, requiring the pX < minX + 360 shift.
    preconditions:
    - Rectangle coordinates are minX=170.0, maxX=-170.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=-175.0, y=0.0.
    expectedSourceBehavior:
    - After unwrapping, the rectangle interval is [170.0,190.0].
    - pX < minX causes -175.0 to become 185.0.
    - The shifted point is inside and relate(Point) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_WRAP_LONGITUDE_GAP_DISJOINT
    category: NORMAL
    description: A point lies in the ordinary longitude gap of a dateline-wrapping
      rectangle.
    preconditions:
    - Rectangle coordinates are minX=170.0, maxX=-170.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=0.0, y=0.0.
    expectedSourceBehavior:
    - After unwrapping, the rectangle interval is [170.0,190.0].
    - pX < minX shifts 0.0 to 360.0, which is outside the interval.
    - relate(Point) returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_WRAP_BOUNDARY_CONTAINS
    category: BOUNDARY
    description: The point is exactly on each endpoint of a dateline-wrapping rectangle's
      represented arc.
    preconditions:
    - Use rectangle minX=170.0, maxX=-170.0, minY=-20.0, maxY=20.0.
    - Run separate source cases with point (170.0, 0.0) and point (-170.0, 0.0).
    expectedSourceBehavior:
    - The inclusive comparisons preserve both endpoint cases as contained.
    - Each source result is SpatialRelation.CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DATELINE_WRAP_RIGHT_SHIFT_DISJOINT
    category: EDGE
    description: A point on the greater-than-maxX branch of a wrapping rectangle is
      shifted west by 360 degrees and remains outside.
    preconditions:
    - Rectangle coordinates are minX=170.0, maxX=-170.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=179.0, y=0.0.
    expectedSourceBehavior:
    - After unwrapping, the rectangle interval is [170.0,190.0].
    - Because 179.0 is already in that interval, this case should be paired with a
      point whose longitude is greater than the original maxX but not directly in
      the unwrapped interval when exercising the source branch; for standard geographic
      coordinates, x=0.0 is the corresponding gap case.
    - The standard-range gap case returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_PRESERVES_NONWRAPPING_CONTAINMENT
    category: NORMAL
    description: A contained point and rectangle rotate by 150 degrees without crossing
      the longitude normalization seam.
    preconditions:
    - Rectangle is minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0; point is (10.0, 5.0).
    - The follow-up longitudes are 110.0, 190.0 normalized to 110.0 and -170.0; the
      rotated rectangle is therefore dateline-wrapping, and the rotated point is 160.0.
    expectedSourceBehavior:
    - The source result is SpatialRelation.CONTAINS.
    - The follow-up reaches the dateline-unwrapping path and should also return SpatialRelation.CONTAINS
      under the supplied metamorphic relation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_PRESERVES_DATELINE_DISJOINTNESS
    category: NORMAL
    description: A point in the gap of a wrapping rectangle rotates together with
      the rectangle, preserving disjointness while the representation remains wrapping.
    preconditions:
    - Rectangle is minX=170.0, maxX=-170.0, minY=-20.0, maxY=20.0; point is (0.0,
      0.0).
    - The follow-up rectangle endpoints normalize to -40.0 and -20.0, and the follow-up
      point is 150.0.
    expectedSourceBehavior:
    - The source result is SpatialRelation.DISJOINT.
    - The follow-up point is outside the follow-up interval, so the follow-up result
      should remain SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_CROSSES_DATELINE_FROM_ORDINARY_BOX
    category: EDGE
    description: A narrow ordinary rectangle rotates across the normalization seam
      and becomes dateline-wrapping.
    preconditions:
    - Rectangle is minX=20.0, maxX=80.0, minY=-10.0, maxY=10.0; point is (50.0, 0.0).
    - The follow-up rectangle normalizes to minX=170.0 and maxX=-130.0, while the
      point normalizes to -160.0.
    expectedSourceBehavior:
    - The source point is directly inside and the source result is SpatialRelation.CONTAINS.
    - The follow-up must use the rawWidth < 0 dateline-unwrapping branch and should
      return SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_REMOVES_DATELINE_WRAP
    category: EDGE
    description: A wrapping rectangle rotates to a non-wrapping representation, exercising
      the opposite seam transition.
    preconditions:
    - Rectangle is minX=-170.0, maxX=-100.0, minY=-10.0, maxY=10.0; point is (-130.0,
      0.0).
    - The follow-up rectangle normalizes to -20.0 and 50.0, and the follow-up point
      is 20.0.
    expectedSourceBehavior:
    - The source point is inside the unwrapped wrapping interval and the source result
      is SpatialRelation.CONTAINS.
    - The follow-up is non-wrapping and contains the rotated point, so the follow-up
      result should remain SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LONGITUDE_LINE_CONTAINS
    category: EDGE
    description: The rectangle has equal minimum and maximum longitude, so containment
      depends on exact longitude equality.
    preconditions:
    - Rectangle coordinates are minX=30.0, maxX=30.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=30.0, y=0.0.
    expectedSourceBehavior:
    - rawWidth is zero, no dateline unwrap occurs, and the equality point is in range.
    - relate(Point) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LONGITUDE_LINE_DISJOINT
    category: EDGE
    description: The rectangle has zero longitude width and the point differs by the
      smallest stated decimal step.
    preconditions:
    - Rectangle coordinates are minX=30.0, maxX=30.0, minY=-20.0, maxY=20.0.
    - Point coordinates are x=30.0000000001, y=0.0.
    expectedSourceBehavior:
    - The point is outside the equal endpoint interval.
    - relate(Point) returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_NAN_MIN_X_SENTINEL
    category: EDGE
    description: The constructor receives NaN as minX, which makes isEmpty() true,
      but the direct relate(Point) overload does not itself check isEmpty().
    preconditions:
    - Rectangle coordinates are minX=NaN, maxX=40.0, minY=-20.0, maxY=20.0; this uses
      the constructor's documented lack of validation.
    - Point coordinates are x=0.0, y=0.0, and the point factory accepts these finite
      coordinates.
    expectedSourceBehavior:
    - The latitude checks pass.
    - The direct overload proceeds despite isEmpty() being true; NaN comparisons do
      not establish either longitude rejection condition, so the final longitude rejection
      is also false.
    - The observable direct-target result is SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_POINT_LONGITUDE_SENTINEL
    category: EDGE
    description: The point longitude is NaN while its latitude is inside the rectangle,
      exercising NaN behavior in all geographic longitude comparisons.
    preconditions:
    - Rectangle coordinates are minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - The point factory accepts point coordinates x=NaN, y=0.0.
    expectedSourceBehavior:
    - The latitude checks pass.
    - The NaN longitude is neither less than nor greater than the rectangle endpoints,
      and the final rejection condition is false.
    - The direct relate(Point) result is SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_POINT_LATITUDE_SENTINEL
    category: EDGE
    description: The point latitude is NaN, so neither strict latitude rejection comparison
      succeeds.
    preconditions:
    - Rectangle coordinates are minX=-40.0, maxX=40.0, minY=-20.0, maxY=20.0.
    - The point factory accepts point coordinates x=0.0, y=NaN.
    expectedSourceBehavior:
    - Both point-latitude comparisons are false for NaN.
    - The finite longitude is directly inside the longitude interval, so relate(Point)
      returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINUS_180_PLUS_180_ENDPOINTS
    category: BOUNDARY
    description: A standard geographic rectangle uses the extreme longitude endpoints,
      and the probe tests both endpoint containment cases.
    preconditions:
    - Rectangle coordinates are minX=-180.0, maxX=180.0, minY=-90.0, maxY=90.0; this
      is excluded from the domain-wide raw-width-360 MR cases, so use the narrow endpoint-boundary
      variant minX=-180.0, maxX=-179.0, minY=-90.0, maxY=90.0.
    - Run point cases (-180.0, -90.0) and (-179.0, 90.0).
    expectedSourceBehavior:
    - The latitude and longitude comparisons are inclusive at the represented boundaries.
    - Each source result is SpatialRelation.CONTAINS.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FULL_LATITUDE_RANGE_INTERIOR_LONGITUDE
    category: EDGE
    description: The rectangle spans both geographic poles in latitude while retaining
      a non-full-width longitude interval.
    preconditions:
    - Rectangle coordinates are minX=-10.0, maxX=10.0, minY=-90.0, maxY=90.0.
    - Point coordinates are x=0.0, y=90.0.
    expectedSourceBehavior:
    - The maximum-latitude boundary is accepted.
    - The longitude is directly inside, so relate(Point) returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULL_LATITUDE_RANGE_LONGITUDE_GAP
    category: EDGE
    description: The rectangle spans both poles but the point is outside its longitude
      interval, showing that latitude acceptance does not imply containment.
    preconditions:
    - Rectangle coordinates are minX=-10.0, maxX=10.0, minY=-90.0, maxY=90.0.
    - Point coordinates are x=20.0, y=-90.0.
    expectedSourceBehavior:
    - The minimum-latitude boundary is accepted.
    - The longitude is shifted by the geographic branch and remains outside, so relate(Point)
      returns SpatialRelation.DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
