InputDomain:
  summary: Valid, non-null Temporal pairs for which ChronoUnit.DAYS.between produces
    an int-representable whole-day count and both operands can be shifted forward
    by 37 DAYS. The oracle reads Days.getAmount() and requires the shifted pair to
    return the same integer.
  globalConstraints:
  - Both source operands are non-null Temporal instances accepted by ChronoUnit.DAYS.between
    for the particular pair.
  - The source value of ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive)
    is within Integer.MIN_VALUE through Integer.MAX_VALUE, because Days.between applies
    Math.toIntExact before constructing Days.
  - The follow-up operands are exactly startDateInclusive.plus(37, DAYS) and endDateExclusive.plus(37,
    DAYS), and both shifts must complete without exception.
  - Source and follow-up executions must both return Days values; pairs whose day
    count exceeds int range are excluded because the target cannot return a Days result
    for them.
  - Each test compares sourceResult.getAmount() with followUpResult.getAmount(); equality
    is required by the supplied relation.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - JapaneseDate at LocalTime
    - ThaiBuddhistDate
    - MinguoDate
    - HijrahDate
    dayCountClass:
    - zero
    - one
    - positive multi-day
    - negative one
    - negative multi-day
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    calendarCondition:
    - same date
    - ordinary month boundary
    - leap-day boundary
    - year boundary
    - proleptic pre-epoch date
    - LocalDate lower boundary
    - LocalDate upper boundary
    - fractional-day truncation
    - offset normalization
    - spring DST transition
    - autumn DST transition
    - non-ISO chronology
  scenarios:
  - id: LOCAL_DATE_SAME_DATE_ZERO
    category: NORMAL
    description: Two identical ISO LocalDate operands exercise the Days.of(0) singleton
      path.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15)
    - endDateExclusive is LocalDate.of(2024, 6, 15)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 0
    - shifting both dates by 37 DAYS yields another result with amount 0
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FORWARD_ONE_DAY
    category: BOUNDARY
    description: Consecutive ISO dates exercise the Days.of(1) singleton path.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15)
    - endDateExclusive is LocalDate.of(2024, 6, 16)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 1
    - shifting both dates by 37 DAYS preserves amount 1
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_BACKWARD_ONE_DAY
    category: BOUNDARY
    description: Reversed consecutive ISO dates produce the smallest negative day
      count.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 16)
    - endDateExclusive is LocalDate.of(2024, 6, 15)
    expectedSourceBehavior:
    - sourceResult.getAmount() is -1
    - shifting both dates by 37 DAYS preserves amount -1
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ORDINARY_WITHIN_MONTH
    category: NORMAL
    description: A positive multi-day interval entirely within an ISO calendar month.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 3)
    - endDateExclusive is LocalDate.of(2024, 6, 27)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 24
    - shifting both dates by 37 DAYS preserves amount 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ORDINARY_MONTH_BOUNDARY
    category: BOUNDARY
    description: An ISO interval crossing from a 31-day month into the next month.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 1, 31)
    - endDateExclusive is LocalDate.of(2023, 3, 1)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 29
    - shifting both dates by 37 DAYS preserves amount 29
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: An ISO interval crossing leap day in leap year 2024.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28)
    - endDateExclusive is LocalDate.of(2024, 3, 1)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 2
    - shifting both dates by 37 DAYS preserves amount 2
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NON_LEAP_FEBRUARY_CROSSING
    category: BOUNDARY
    description: An ISO interval crossing February in a non-leap year.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 2, 28)
    - endDateExclusive is LocalDate.of(2023, 3, 1)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 1
    - shifting both dates by 37 DAYS preserves amount 1
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY_FORWARD
    category: BOUNDARY
    description: A positive interval crossing an ISO year boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 12, 31)
    - endDateExclusive is LocalDate.of(2024, 1, 2)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 2
    - shifting both dates by 37 DAYS preserves amount 2
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARY_BACKWARD
    category: BOUNDARY
    description: A negative interval crossing an ISO year boundary in reverse.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 2)
    - endDateExclusive is LocalDate.of(2023, 12, 31)
    expectedSourceBehavior:
    - sourceResult.getAmount() is -2
    - shifting both dates by 37 DAYS preserves amount -2
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_PRE_EPOCH
    category: NORMAL
    description: ISO dates before 1970 verify that calendar-day calculation is not
      restricted to post-epoch dates.
    preconditions:
    - startDateInclusive is LocalDate.of(1969, 12, 20)
    - endDateExclusive is LocalDate.of(1970, 1, 10)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 21
    - shifting both dates by 37 DAYS preserves amount 21
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MINIMUM_SUPPORTED_DATE
    category: EDGE
    description: The lower LocalDate boundary remains shiftable by 37 DAYS.
    preconditions:
    - startDateInclusive is LocalDate.MIN
    - endDateExclusive is LocalDate.MIN.plusDays(1)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 1
    - shifting both dates by 37 DAYS preserves amount 1
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MAXIMUM_SUPPORTED_DATE
    category: EDGE
    description: An upper LocalDate boundary pair whose 37-day follow-up remains within
      LocalDate range.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(38)
    - endDateExclusive is LocalDate.MAX.minusDays(37)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 1
    - shifting both dates by 37 DAYS preserves amount 1
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LARGE_REPRESENTABLE_SPAN
    category: EDGE
    description: A large ISO date span exercises a non-singleton Days value near the
      practical LocalDate range limit.
    preconditions:
    - startDateInclusive is LocalDate.of(-999999999, 1, 1)
    - endDateExclusive is LocalDate.of(999999999, 11, 25)
    - endDateExclusive.plusDays(37) is within LocalDate range
    expectedSourceBehavior:
    - sourceResult.getAmount() is positive and greater than 1
    - sourceResult.getAmount() is within int range
    - shifting both dates by 37 DAYS preserves the exact source amount
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: LocalDateTime operands exactly 24 hours apart produce one whole day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 10, 30)
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 10, 30)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 1
    - shifting both date-times by 37 DAYS preserves amount 1
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_FORWARD_PARTIAL_DAY
    category: BOUNDARY
    description: LocalDateTime operands less than one full day apart verify whole-day
      truncation.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 0)
    - endDateExclusive is LocalDateTime.of(2024, 6, 16, 11, 59, 59, 999999999)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 0
    - shifting both date-times by 37 DAYS preserves amount 0
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_BACKWARD_PARTIAL_DAY
    category: BOUNDARY
    description: Reversed LocalDateTime operands less than one full day apart verify
      negative partial-day truncation.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 16, 11, 59, 59, 999999999)
    - endDateExclusive is LocalDateTime.of(2024, 6, 15, 12, 0)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 0
    - shifting both date-times by 37 DAYS preserves amount 0
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_MULTI_DAY_WITH_NANOS
    category: NORMAL
    description: LocalDateTime operands with identical nanosecond fields span several
      complete days.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 2, 27, 23, 59, 59, 1)
    - endDateExclusive is LocalDateTime.of(2024, 3, 3, 23, 59, 59, 1)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 5
    - shifting both date-times by 37 DAYS preserves amount 5
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_MULTIPLE_OF_DAYS
    category: NORMAL
    description: Instant operands separated by an exact multiple of 24-hour DAYS.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z")
    - endDateExclusive is Instant.parse("2024-02-07T00:00:00Z")
    expectedSourceBehavior:
    - sourceResult.getAmount() is 37
    - shifting both instants by 37 DAYS preserves amount 37
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_FORWARD_PARTIAL_DAY
    category: BOUNDARY
    description: Instant operands 23 hours apart verify complete-24-hour truncation
      for Instant.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T00:00:00Z")
    - endDateExclusive is Instant.parse("2024-01-01T23:00:00Z")
    expectedSourceBehavior:
    - sourceResult.getAmount() is 0
    - shifting both instants by 37 DAYS preserves amount 0
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_BACKWARD_PARTIAL_DAY
    category: BOUNDARY
    description: Reversed Instant operands 23 hours apart verify negative partial-day
      truncation.
    preconditions:
    - startDateInclusive is Instant.parse("2024-01-01T23:00:00Z")
    - endDateExclusive is Instant.parse("2024-01-01T00:00:00Z")
    expectedSourceBehavior:
    - sourceResult.getAmount() is 0
    - shifting both instants by 37 DAYS preserves amount 0
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAXIMUM_DAY_COUNT
    category: EDGE
    description: An Instant interval exactly equal to Integer.MAX_VALUE days reaches
      the largest amount accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive is Instant.EPOCH
    - endDateExclusive is Instant.EPOCH.plus(2147483647, DAYS)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 2147483647
    - shifting both instants by 37 DAYS preserves amount 2147483647
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MINIMUM_DAY_COUNT
    category: EDGE
    description: An Instant interval exactly equal to Integer.MIN_VALUE days reaches
      the smallest amount accepted by Math.toIntExact.
    preconditions:
    - startDateInclusive is Instant.EPOCH
    - endDateExclusive is Instant.EPOCH.minus(2147483648, DAYS)
    expectedSourceBehavior:
    - sourceResult.getAmount() is -2147483648
    - shifting both instants by 37 DAYS preserves amount -2147483648
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET
    category: NORMAL
    description: OffsetDateTime operands with the same fixed offset span several whole
      days.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-06-01T10:00:00+05:30")
    - endDateExclusive is OffsetDateTime.parse("2024-06-11T10:00:00+05:30")
    expectedSourceBehavior:
    - sourceResult.getAmount() is 10
    - shifting both offset date-times by 37 DAYS preserves amount 10
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_SAME_INSTANT
    category: EDGE
    description: OffsetDateTime operands with different displayed local times but
      the same instant exercise offset normalization.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00Z")
    - endDateExclusive is OffsetDateTime.parse("2024-01-01T01:00:00+01:00")
    expectedSourceBehavior:
    - sourceResult.getAmount() is 0
    - shifting both offset date-times by 37 DAYS preserves amount 0
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_EXACT_DAY
    category: EDGE
    description: OffsetDateTime operands with different offsets represent exactly
      one elapsed day.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse("2024-01-01T00:00:00Z")
    - endDateExclusive is OffsetDateTime.parse("2024-01-02T01:00:00+01:00")
    expectedSourceBehavior:
    - sourceResult.getAmount() is 1
    - shifting both offset date-times by 37 DAYS preserves amount 1
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_DAY
    category: EDGE
    description: ZonedDateTime operands cross the America/New_York spring DST offset
      transition while retaining matching local times.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 3, 9, 12, 0, 0, 0, ZoneId.of("America/New_York"))
    - endDateExclusive is ZonedDateTime.of(2024, 3, 10, 12, 0, 0, 0, ZoneId.of("America/New_York"))
    expectedSourceBehavior:
    - sourceResult.getAmount() is 1
    - shifting both zoned date-times by 37 DAYS preserves amount 1
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_DST_DAY
    category: EDGE
    description: ZonedDateTime operands cross the America/New_York autumn DST offset
      transition while retaining matching local times.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 11, 2, 12, 0, 0, 0, ZoneId.of("America/New_York"))
    - endDateExclusive is ZonedDateTime.of(2024, 11, 3, 12, 0, 0, 0, ZoneId.of("America/New_York"))
    expectedSourceBehavior:
    - sourceResult.getAmount() is 1
    - shifting both zoned date-times by 37 DAYS preserves amount 1
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_MULTI_DAY_ZONE_RULES
    category: NORMAL
    description: ZonedDateTime operands in Europe/Paris span multiple local calendar
      days without relying on UTC offset equality.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 7, 1, 8, 45, 0, 0, ZoneId.of("Europe/Paris"))
    - endDateExclusive is ZonedDateTime.of(2024, 7, 15, 8, 45, 0, 0, ZoneId.of("Europe/Paris"))
    expectedSourceBehavior:
    - sourceResult.getAmount() is 14
    - shifting both zoned date-times by 37 DAYS preserves amount 14
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_LEAP_BOUNDARY
    category: NORMAL
    description: JapaneseDate operands cross ISO leap day using a non-ISO chronology.
    preconditions:
    - startDateInclusive is JapaneseDate.of(2024, 2, 28)
    - endDateExclusive is JapaneseDate.of(2024, 3, 1)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 2
    - shifting both Japanese dates by 37 DAYS preserves amount 2
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_TIME_PARTIAL_DAY
    category: BOUNDARY
    description: Japanese chronology date-times less than a full day apart verify
      temporal-specific whole-day calculation.
    preconditions:
    - startDateInclusive is JapaneseDate.of(2024, 6, 15).atTime(LocalTime.of(12, 0))
    - endDateExclusive is JapaneseDate.of(2024, 6, 16).atTime(LocalTime.of(11, 0))
    expectedSourceBehavior:
    - sourceResult.getAmount() is 0
    - shifting both Japanese date-times by 37 DAYS preserves amount 0
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_FORWARD
    category: NORMAL
    description: ThaiBuddhistDate operands verify DAYS.between through another ChronoLocalDate
      implementation.
    preconditions:
    - startDateInclusive is ThaiBuddhistDate.of(2567, 1, 30)
    - endDateExclusive is ThaiBuddhistDate.of(2567, 2, 5)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 6
    - shifting both ThaiBuddhist dates by 37 DAYS preserves amount 6
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_BACKWARD
    category: NORMAL
    description: MinguoDate operands provide a negative non-ISO calendar interval.
    preconditions:
    - startDateInclusive is MinguoDate.of(113, 5, 20)
    - endDateExclusive is MinguoDate.of(113, 5, 3)
    expectedSourceBehavior:
    - sourceResult.getAmount() is -17
    - shifting both Minguo dates by 37 DAYS preserves amount -17
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MONTH_TRANSITION
    category: EDGE
    description: HijrahDate operands cross a Hijrah calendar month boundary, whose
      month length is chronology-defined.
    preconditions:
    - startDateInclusive is HijrahDate.of(1445, 9, 1)
    - endDateExclusive is startDateInclusive.plus(37, DAYS)
    expectedSourceBehavior:
    - sourceResult.getAmount() is 37
    - shifting both Hijrah dates by 37 DAYS preserves amount 37
    targetCases: 1
    emptyOutputAllowed: false
