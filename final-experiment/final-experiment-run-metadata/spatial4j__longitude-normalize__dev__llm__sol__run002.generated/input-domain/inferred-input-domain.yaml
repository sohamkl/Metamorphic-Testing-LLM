InputDomain:
  summary: Finite Java double longitudes spanning the direct-return interval, both
    modulo branches, exact wrap sentinels, antimeridian tolerance paths, multiple
    revolutions, and precision-sensitive magnitudes.
  globalConstraints:
  - The source input longitudeDeg must satisfy Double.isFinite(longitudeDeg); NaN
    and infinities are excluded because normLonDEG can produce NaN and the supplied
    relation's difference comparison would then pass vacuously.
  - The Java double expression longitudeDeg + 360.0 must be finite.
  - The Java double expression longitudeDeg + 360.0 must not equal longitudeDeg; magnitudes
    for which floating-point absorption makes the follow-up identical are excluded
    because they do not exercise the supplied transformation.
  - No restriction to [-180.0, 180.0] is imposed, because the target explicitly accepts
    and normalizes longitudes outside that interval.
  diversity:
    sourceControlFlow:
    - direct return
    - negative remainder
    - positive remainder
    - positive exact-wrap sentinel
    - negative exact-wrap fallback
    sourceMagnitude:
    - subnormal
    - ordinary in-range
    - one revolution
    - multiple revolutions
    - trillion-scale
    - precision-degraded
    antimeridianPosition:
    - exact -180
    - exact 180
    - within 1e-9 tolerance
    - outside 1e-9 tolerance
    numericForm:
    - signed zero
    - integer
    - fractional
    - adjacent representable value
    - large finite double
    followUpSituation:
    - direct-to-direct
    - direct-to-modulo
    - modulo-to-modulo
    - antimeridian-equivalent
    - rounded shift smaller than 360
  scenarios:
  - id: SIGNED_ZERO_DIRECT_RETURN
    category: EDGE
    description: Source is either IEEE-754 signed zero, both of which satisfy the
      target's common-case range check.
    preconditions:
    - longitudeDeg is exactly +0.0 or -0.0.
    expectedSourceBehavior:
    - normLonDEG returns longitudeDeg as-is through the inclusive [-180.0, 180.0]
      branch.
    - The result is numerically zero; the direct return preserves the source zero's
      sign.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INTERIOR_CARDINAL_REGIONS
    category: NORMAL
    description: Ordinary negative and positive longitudes strictly inside the normalization
      interval.
    preconditions:
    - longitudeDeg is one of {-179.0, -90.0, -1.0, 1.0, 90.0, 179.0}.
    expectedSourceBehavior:
    - normLonDEG returns exactly the source value without modulo arithmetic.
    - The result is finite and strictly between -180.0 and 180.0.
    targetCases: 6
    emptyOutputAllowed: false
  - id: SUBNORMAL_INTERIOR_VALUES
    category: EDGE
    description: The smallest positive and negative nonzero doubles exercise direct
      return at the representational boundary around zero.
    preconditions:
    - longitudeDeg is exactly Double.MIN_VALUE or -Double.MIN_VALUE.
    expectedSourceBehavior:
    - normLonDEG returns the exact subnormal source value through the common-case
      branch.
    - The result remains nonzero and finite.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FRACTIONAL_INTERIOR_VALUES
    category: NORMAL
    description: Non-integral longitudes already in range verify that the direct path
      does not introduce rounding.
    preconditions:
    - longitudeDeg is exactly -123.456789 or 123.456789.
    expectedSourceBehavior:
    - normLonDEG returns the source double bit-for-bit because no arithmetic is performed.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_INCLUSIVE_ANTIMERIDIANS
    category: BOUNDARY
    description: The two inclusive endpoints represent the same meridian but are intentionally
      retained as different outputs.
    preconditions:
    - longitudeDeg is exactly -180.0 or 180.0.
    expectedSourceBehavior:
    - normLonDEG returns the exact source endpoint through the common-case branch.
    - The result is classified as antimeridian by the supplied relation.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ADJACENT_REPRESENTABLE_ENDPOINT_VALUES
    category: BOUNDARY
    description: Immediate double neighbors on both sides of each inclusive endpoint
      distinguish direct return from modulo normalization.
    preconditions:
    - longitudeDeg is one of {Math.nextDown(-180.0), Math.nextUp(-180.0), Math.nextDown(180.0),
      Math.nextUp(180.0)}.
    expectedSourceBehavior:
    - Math.nextUp(-180.0) and Math.nextDown(180.0) are returned directly.
    - Math.nextDown(-180.0) takes the negative-remainder branch and normalizes near
      +180.0.
    - Math.nextUp(180.0) takes the nonnegative-remainder fallback and normalizes near
      -180.0.
    - Every result is finite and lies inclusively within [-180.0, 180.0].
    targetCases: 4
    emptyOutputAllowed: false
  - id: WITHIN_RELATION_ANTIMERIDIAN_TOLERANCE
    category: EDGE
    description: Values on either side of both endpoints normalize to outputs within
      the relation's 1e-9 antimeridian sentinel.
    preconditions:
    - longitudeDeg is one of {-180.0 - 5e-10, -180.0 + 5e-10, 180.0 - 5e-10, 180.0
      + 5e-10}.
    expectedSourceBehavior:
    - Inputs inside [-180.0, 180.0] are returned directly; inputs just outside are
      folded to the opposite numeric side of the antimeridian.
    - The normalized result satisfies Math.abs(Math.abs(result) - 180.0) <= 1e-9.
    targetCases: 4
    emptyOutputAllowed: false
  - id: OUTSIDE_RELATION_ANTIMERIDIAN_TOLERANCE
    category: EDGE
    description: Near-endpoint values beyond the supplied antimeridian tolerance exercise
      ordinary difference comparison rather than its sentinel return.
    preconditions:
    - longitudeDeg is one of {-180.0 - 2e-9, -180.0 + 2e-9, 180.0 - 2e-9, 180.0 +
      2e-9}.
    expectedSourceBehavior:
    - Inputs inside the target interval are returned directly and inputs outside it
      are folded across the antimeridian.
    - The normalized result satisfies Math.abs(Math.abs(result) - 180.0) > 1e-9.
    targetCases: 4
    emptyOutputAllowed: false
  - id: FIRST_POSITIVE_WRAP_GENERIC
    category: NORMAL
    description: Positive inputs beyond 180 degrees exercise the generic nonnegative-remainder
      return rather than the exact-wrap sentinel.
    preconditions:
    - longitudeDeg is one of {181.0, 359.0, 360.0, 539.0}.
    expectedSourceBehavior:
    - normLonDEG returns -180.0 + ((longitudeDeg + 180.0) % 360.0).
    - The respective normalized outputs are -179.0, -1.0, 0.0, and 179.0.
    targetCases: 4
    emptyOutputAllowed: false
  - id: FIRST_NEGATIVE_WRAP
    category: NORMAL
    description: Negative inputs below -180 degrees exercise the off < 0 branch.
    preconditions:
    - longitudeDeg is one of {-181.0, -359.0, -360.0, -539.0}.
    expectedSourceBehavior:
    - normLonDEG returns 180.0 + ((longitudeDeg + 180.0) % 360.0).
    - The respective normalized outputs are 179.0, 1.0, 0.0, and -179.0.
    targetCases: 4
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_WRAP_SENTINELS
    category: EDGE
    description: Positive odd-half-revolution values make the remainder exactly zero
      and reach the explicit lon_deg > 0 sentinel.
    preconditions:
    - longitudeDeg is exactly 540.0 or 900.0.
    expectedSourceBehavior:
    - (longitudeDeg + 180.0) % 360.0 is exactly zero.
    - normLonDEG returns exactly 180.0 through the off == 0 && longitudeDeg > 0 branch.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_WRAP_FALLBACK
    category: EDGE
    description: Negative odd-half-revolution values have a zero remainder but cannot
      enter the positive exact-wrap sentinel.
    preconditions:
    - longitudeDeg is exactly -540.0 or -900.0.
    expectedSourceBehavior:
    - (longitudeDeg + 180.0) % 360.0 is numerically zero.
    - The positive-input sentinel is false, so normLonDEG returns exactly -180.0 through
      the final branch.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_MERIDIAN_MULTIPLE_REVOLUTIONS
    category: NORMAL
    description: Whole positive and negative revolutions outside the common-case interval
      normalize to the zero meridian.
    preconditions:
    - longitudeDeg is one of {-720.0, -360.0, 360.0, 720.0}.
    expectedSourceBehavior:
    - normLonDEG returns a value numerically equal to 0.0.
    - The output is not classified as antimeridian by the supplied relation.
    targetCases: 4
    emptyOutputAllowed: false
  - id: STRADDLE_POSITIVE_EXACT_WRAP
    category: BOUNDARY
    description: Values measurably below and above the positive 540-degree sentinel
      exercise opposite sides of its modulo discontinuity.
    preconditions:
    - longitudeDeg is exactly 540.0 - 1e-6 or 540.0 + 1e-6.
    expectedSourceBehavior:
    - The lower value normalizes near +180.0 without taking the exact-zero sentinel.
    - The upper value normalizes near -180.0 without taking the exact-zero sentinel.
    - Both results remain in [-180.0, 180.0].
    targetCases: 2
    emptyOutputAllowed: false
  - id: STRADDLE_NEGATIVE_EXACT_WRAP
    category: BOUNDARY
    description: Values measurably below and above the negative -540-degree wrap point
      exercise the negative remainder and final fallback around its discontinuity.
    preconditions:
    - longitudeDeg is exactly -540.0 - 1e-6 or -540.0 + 1e-6.
    expectedSourceBehavior:
    - The value below -540.0 normalizes near +180.0.
    - The value above -540.0 normalizes near -180.0.
    - Neither source is the exact zero-remainder sentinel.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LARGE_MULTI_REVOLUTION_VALUES
    category: EDGE
    description: Large finite longitudes require billions of conceptual revolutions
      while retaining enough precision for the 360-degree follow-up to change the
      input.
    preconditions:
    - longitudeDeg is exactly 1.0e12 or -1.0e12.
    expectedSourceBehavior:
    - normLonDEG uses modulo normalization rather than direct return.
    - The result is finite and inclusively within [-180.0, 180.0].
    - The positive source uses the nonnegative-remainder logic and the negative source
      uses the negative-remainder logic unless its computed remainder is zero.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PRECISION_DEGRADED_FOLLOW_UP_SHIFT
    category: EDGE
    description: At magnitude 2^60, Java floating-point addition still changes the
      source but cannot represent an exact 360-degree displacement.
    preconditions:
    - longitudeDeg is exactly Math.scalb(1.0, 60) or -Math.scalb(1.0, 60).
    - longitudeDeg + 360.0 differs from longitudeDeg but (longitudeDeg + 360.0) -
      longitudeDeg is not exactly 360.0.
    expectedSourceBehavior:
    - normLonDEG performs finite modulo normalization and returns a value in [-180.0,
      180.0].
    - This case observably tests whether the supplied 1e-9 relation tolerates the
      representationally degraded follow-up shift rather than assuming exact real-number
      addition.
    targetCases: 2
    emptyOutputAllowed: false
