InputDomain:
  summary: Valid geographic RectangleImpl/Point pairs using finite degree coordinates,
    with inclusive rectangle boundaries and both ordinary and dateline-wrapping longitude
    intervals. The domain exercises latitude rejection, longitude inclusion/exclusion,
    geo longitude shifting, and rotation-induced changes between ordinary and dateline-wrapping
    representations.
  globalConstraints:
  - rectangle.getContext().isGeo() is true, and the Point is created by that same
    SpatialContext.
  - All rectangle and point coordinates are finite doubles; no coordinate is NaN or
    infinite.
  - Rectangle longitude endpoints and point longitude are within [-180.0, 180.0].
  - Rectangle latitude endpoints and point latitude are within [-90.0, 90.0], with
    minY <= maxY.
  - 'The rectangle''s circular longitude width is strictly less than 360.0 degrees:
    if minX <= maxX, maxX - minX < 360.0; otherwise maxX - minX + 360.0 < 360.0. Full-world
    [-180.0, 180.0] representations are excluded because independently normalizing
    both rotated endpoints collapses that 360-degree representation to equal endpoints.'
  - The point argument is non-null because generateFollowUp explicitly requires a
    non-null Point.
  diversity:
    longitudeTopology:
    - '3'
    - minX <= maxX versus minX > maxX and zero-width intervals
    - ordinary interval; dateline-wrapping interval; zero-width meridian
    latitudePosition:
    - '5'
    - point Y relative to inclusive [minY,maxY]
    - interior; minY boundary; maxY boundary; below minY; above maxY
    longitudePosition:
    - '7'
    - point X relative to rectangle longitude interval after geo unwrapping
    - interior; minX boundary; maxX boundary; outside west; outside east; equivalent
      +180/-180 boundary; shifted wrapped interior
    rotationTopology:
    - '2'
    - whether adding 150 degrees and normalizing changes endpoint ordering
    - source ordinary to follow-up wrapping; source wrapping to follow-up ordinary
  scenarios:
  - id: ORDINARY_INTERIOR
    category: NORMAL
    description: Ordinary non-wrapping rectangle with a point strictly inside both
      coordinate ranges.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(0.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the geo longitude short-circuit where
      minX <= pX <= maxX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MIN_LONGITUDE_BOUNDARY
    category: BOUNDARY
    description: Point lies exactly on an ordinary rectangle's minimum longitude boundary.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(-20.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because longitude boundaries are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MAX_LONGITUDE_BOUNDARY
    category: BOUNDARY
    description: Point lies exactly on an ordinary rectangle's maximum longitude boundary.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(20.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because longitude boundaries are inclusive.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MIN_LATITUDE_BOUNDARY
    category: BOUNDARY
    description: Point lies exactly on the rectangle's minimum latitude boundary.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(0.0, -10.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because the initial latitude comparison rejects
      only Y < minY.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_MAX_LATITUDE_BOUNDARY
    category: BOUNDARY
    description: Point lies exactly on the rectangle's maximum latitude boundary.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(0.0, 10.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because the initial latitude comparison rejects
      only Y > maxY.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_BELOW_MINIMUM
    category: BOUNDARY
    description: Longitude is otherwise inside, but latitude is immediately below
      minY.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(0.0, -10.1).
    expectedSourceBehavior:
    - relate(point) returns DISJOINT at the point.getY() < getMinY() guard before
      longitude processing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_ABOVE_MAXIMUM
    category: BOUNDARY
    description: Longitude is otherwise inside, but latitude is immediately above
      maxY.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(0.0, 10.1).
    expectedSourceBehavior:
    - relate(point) returns DISJOINT at the point.getY() > getMaxY() guard before
      longitude processing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_WEST_LONGITUDE_DISJOINT
    category: NORMAL
    description: Point is west of an ordinary interval and remains outside after the
      geo +360 shift.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(-21.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns DISJOINT after pX < minX causes pX += 360.0 and the shifted
      value remains greater than maxX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_EAST_LONGITUDE_DISJOINT
    category: NORMAL
    description: Point is east of an ordinary interval and remains outside after the
      geo -360 shift.
    preconditions:
    - RectangleImpl(-20.0, 20.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(21.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns DISJOINT after pX > maxX causes pX -= 360.0 and the shifted
      value remains less than minX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_LONGITUDE
    category: EDGE
    description: Degenerate rectangle with equal longitude endpoints and a point on
      that meridian.
    preconditions:
    - RectangleImpl(10.0, 10.0, -5.0, 5.0, geoContext).
    - Point is geoContext.makePoint(10.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS for the inclusive zero-width longitude interval.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_LATITUDE
    category: EDGE
    description: Degenerate rectangle with equal latitude endpoints and a point on
      that parallel.
    preconditions:
    - RectangleImpl(-5.0, 5.0, 0.0, 0.0, geoContext).
    - Point is geoContext.makePoint(0.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS for the inclusive zero-height latitude interval.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_EQUIVALENT_POSITIVE_180_POINT
    category: EDGE
    description: A point at +180 is equivalent to the rectangle's -180 minimum boundary
      after longitude shifting.
    preconditions:
    - RectangleImpl(-180.0, -170.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(180.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS after pX > maxX causes pX -= 360.0, producing
      -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DATELINE_EQUIVALENT_NEGATIVE_180_POINT
    category: EDGE
    description: A point at -180 is equivalent to the rectangle's +180 maximum boundary
      after longitude shifting.
    preconditions:
    - RectangleImpl(170.0, 180.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(-180.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS after pX < minX causes pX += 360.0, producing
      180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_DIRECT_EAST_SEGMENT_INTERIOR
    category: NORMAL
    description: Dateline-wrapping rectangle with a point in its east-side segment
      before unwrapping.
    preconditions:
    - RectangleImpl(170.0, -170.0, -10.0, 10.0, geoContext), so minX > maxX.
    - Point is geoContext.makePoint(175.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS after the rectangle unwraps maxX to 190.0 and
      the point is already within [170.0,190.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_SHIFTED_WEST_SEGMENT_INTERIOR
    category: NORMAL
    description: Dateline-wrapping rectangle with a point in its west-side segment,
      requiring point longitude shifting.
    preconditions:
    - RectangleImpl(170.0, -170.0, -10.0, 10.0, geoContext), so minX > maxX.
    - Point is geoContext.makePoint(-175.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS after rectangle unwrapping and pX < minX causes
      -175.0 to shift to 185.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_SHIFTED_MAX_BOUNDARY
    category: BOUNDARY
    description: Point is exactly at the wrapped rectangle's maximum longitude boundary
      after unwrapping.
    preconditions:
    - RectangleImpl(170.0, -170.0, -10.0, 10.0, geoContext), so the unwrapped interval
      is [170.0,190.0].
    - Point is geoContext.makePoint(-170.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS after pX shifts from -170.0 to the inclusive
      unwrapped maximum 190.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_LONGITUDE_GAP_DISJOINT
    category: NORMAL
    description: Point is in the non-covered central longitude gap of a dateline-wrapping
      rectangle.
    preconditions:
    - RectangleImpl(170.0, -170.0, -10.0, 10.0, geoContext), so minX > maxX.
    - Point is geoContext.makePoint(0.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns DISJOINT after pX < minX shifts 0.0 to 360.0, which is
      outside unwrapped [170.0,190.0].
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_JUST_OUTSIDE_WEST_SEGMENT
    category: BOUNDARY
    description: Point is immediately outside the west-side boundary of a dateline-wrapping
      rectangle.
    preconditions:
    - RectangleImpl(170.0, -170.0, -10.0, 10.0, geoContext), so the unwrapped interval
      is [170.0,190.0].
    - Point is geoContext.makePoint(-169.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns DISJOINT because -169.0 shifts to 191.0, just greater
      than unwrapped maxX 190.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_CREATES_WRAPPING_FOLLOW_UP
    category: EDGE
    description: Source is ordinary, but rotating both endpoints by 150 degrees normalizes
      it into a wrapping follow-up rectangle.
    preconditions:
    - RectangleImpl(20.0, 40.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(30.0, 0.0).
    - The generated follow-up rectangle endpoints are 170.0 and -170.0, therefore
      followUp.minX > followUp.maxX.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS in the ordinary source interval.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ROTATION_REMOVES_WRAPPING_FOLLOW_UP
    category: EDGE
    description: Source wraps across the dateline, while rotation normalizes its follow-up
      into an ordinary interval.
    preconditions:
    - RectangleImpl(170.0, -170.0, -10.0, 10.0, geoContext).
    - Point is geoContext.makePoint(-175.0, 0.0).
    - The generated follow-up rectangle endpoints are -40.0 and -20.0, therefore followUp.minX
      <= followUp.maxX.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through source dateline unwrapping and point
      shifting.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NORTH_POLE_LATITUDE_BOUNDARY
    category: BOUNDARY
    description: Valid geographic rectangle reaches the north-pole latitude limit,
      with the point on maxY.
    preconditions:
    - RectangleImpl(-30.0, 30.0, 89.0, 90.0, geoContext).
    - Point is geoContext.makePoint(0.0, 90.0).
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because maxY is inclusive and longitude is inside.
    targetCases: 1
    emptyOutputAllowed: false
