InputDomain:
  summary: Finite, non-null Point inputs and RectangleImpl receivers in a geographic
    SpatialContext, with longitudes in -180..180 and latitudes in -90..90. Rectangles
    may be ordinary or dateline-wrapping (minX > maxX); latitude ranges are ordered.
    Each source case is rotated by adding 150 degrees to rectangle endpoints and point
    longitude, then normalizing each longitude back to -180..180 while retaining latitude.
  globalConstraints:
  - ctx.isGeo() is true for every receiver, because the stated rotation relation is
    a longitude/dateline relation and relate(Point) takes its dateline-shifting path
    only when ctx.isGeo() is true.
  - The receiver is a non-null RectangleImpl constructed with finite minX, maxX, minY,
    and maxY; the argument is a non-null Point with finite X and Y.
  - Rectangle and point longitudes are within -180.0 <= longitude <= 180.0 before
    rotation; rectangle and point latitudes are within -90.0 <= latitude <= 90.0.
  - minY <= maxY, matching the ordering asserted by RectangleImpl.reset for non-NaN
    latitude bounds.
  - Dateline-wrapping rectangles with minX > maxX are included; they are valid according
    to RectangleImpl.getCrossesDateLine and are explicitly handled by relate(Point).
  - The full-world endpoint representation minX = -180.0 and maxX = 180.0 is excluded
    because independently normalizing both rotated endpoints maps it to the same longitude
    (-30.0), changing the RectangleImpl raw longitudinal width from 360.0 to 0.0;
    under the stated endpoint-by-endpoint follow-up transformation, the metamorphic
    relation would not preserve the represented box.
  - NaN, infinities, null points, unordered latitude bounds, and non-geographic contexts
    are excluded because the metamorphic relation requests a geographic longitude
    rotation rather than invalid-input behavior.
  diversity:
    longitudeTopology:
    - distinct
    - measurable
    - ordinary minX < maxX; dateline-wrapping minX > maxX; zero-width minX = maxX;
      dateline endpoint longitudes -180 and 180; source intervals that become wrapping
      after rotation; source wrapping intervals that become ordinary after rotation
    latitudePosition:
    - distinct
    - measurable
    - strictly inside; exactly minY; exactly maxY; below minY; above maxY; zero-height
      minY = maxY
    longitudeDecisionPath:
    - distinct
    - measurable
    - direct pX within current minX..maxX; pX < minX followed by +360 shift; pX >
      maxX followed by -360 shift; shifted containment; shifted disjointness
    expectedRelation:
    - distinct
    - measurable
    - CONTAINS and DISJOINT only, the two return values reachable from RectangleImpl.relate(Point)
      for finite ordered inputs
  scenarios:
  - id: INTERIOR_ORDINARY_BECOMES_WRAPPING
    category: NORMAL
    description: Ordinary source rectangle whose independently rotated endpoints cross
      the dateline.
    preconditions:
    - RectangleImpl bounds are minX=-100.0, maxX=100.0, minY=-20.0, maxY=20.0.
    - Point coordinates are X=0.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the geographic direct-longitude short-circuit.
    - The source longitude interval is ordinary, while its rotated endpoint representation
      is wrapping.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERIOR_ORDINARY_STAYS_ORDINARY
    category: NORMAL
    description: Strict interior point in an ordinary rectangle that remains ordinary
      after rotation.
    preconditions:
    - RectangleImpl bounds are minX=-20.0, maxX=20.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=0.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the direct-longitude short-circuit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ON_MIN_X_EDGE
    category: BOUNDARY
    description: Point lies exactly on the ordinary rectangle's minimum longitude
      edge.
    preconditions:
    - RectangleImpl bounds are minX=-40.0, maxX=30.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=-40.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because longitude equality is included by the
      direct path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ON_MAX_X_EDGE
    category: BOUNDARY
    description: Point lies exactly on the ordinary rectangle's maximum longitude
      edge.
    preconditions:
    - RectangleImpl bounds are minX=-40.0, maxX=30.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=30.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because longitude equality is included by the
      direct path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ON_MIN_Y_EDGE
    category: BOUNDARY
    description: Point lies exactly on the minimum latitude edge while longitude is
      strictly interior.
    preconditions:
    - RectangleImpl bounds are minX=-40.0, maxX=30.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=0.0, Y=-10.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because the initial Y comparisons are strict.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ON_MAX_Y_EDGE
    category: BOUNDARY
    description: Point lies exactly on the maximum latitude edge while longitude is
      strictly interior.
    preconditions:
    - RectangleImpl bounds are minX=-40.0, maxX=30.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=0.0, Y=10.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because the initial Y comparisons are strict.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ABOVE_MAX_Y
    category: BOUNDARY
    description: Point is immediately outside the rectangle above its maximum latitude.
    preconditions:
    - RectangleImpl bounds are minX=-40.0, maxX=30.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=0.0, Y=10.1.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT at point.getY() > getMaxY() before longitude
      processing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_BELOW_MIN_Y
    category: BOUNDARY
    description: Point is immediately outside the rectangle below its minimum latitude.
    preconditions:
    - RectangleImpl bounds are minX=-40.0, maxX=30.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=0.0, Y=-10.1.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT at point.getY() < getMinY() before longitude
      processing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_LEFT_OF_INTERVAL_DISJOINT
    category: NORMAL
    description: Point is west of an ordinary interval and remains outside after the
      pX < minX plus-360 adjustment.
    preconditions:
    - RectangleImpl bounds are minX=-100.0, maxX=-50.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=-120.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) takes the pX < minX branch, adds 360.0, and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_RIGHT_OF_INTERVAL_DISJOINT
    category: NORMAL
    description: Point is east of an ordinary interval and remains outside after the
      pX > maxX minus-360 adjustment.
    preconditions:
    - RectangleImpl bounds are minX=50.0, maxX=100.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=120.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) takes the pX > maxX branch, subtracts 360.0, and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_DIRECT_SIDE_CONTAINS
    category: EDGE
    description: Point is on the positive-longitude side of a dateline-wrapping rectangle
      and is directly within its unwrapped interval.
    preconditions:
    - RectangleImpl bounds are minX=150.0, maxX=-150.0, minY=-20.0, maxY=20.0.
    - Point coordinates are X=170.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) unwraps maxX to 210.0 and returns CONTAINS through the direct-longitude
      short-circuit.
    - The rotated rectangle becomes ordinary rather than wrapping.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_SHIFTED_SIDE_CONTAINS
    category: EDGE
    description: Point is on the negative-longitude side of a dateline-wrapping rectangle
      and requires longitude unwrapping.
    preconditions:
    - RectangleImpl bounds are minX=150.0, maxX=-150.0, minY=-20.0, maxY=20.0.
    - Point coordinates are X=-170.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) unwraps maxX to 210.0, takes pX < minX, adds 360.0, and returns
      CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_SHIFTED_SIDE_DISJOINT
    category: EDGE
    description: Point is outside the negative-longitude side of a dateline-wrapping
      rectangle after longitude shifting.
    preconditions:
    - RectangleImpl bounds are minX=150.0, maxX=-150.0, minY=-20.0, maxY=20.0.
    - Point coordinates are X=-140.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) takes pX < minX, adds 360.0 to obtain 220.0, and returns DISJOINT
      because 220.0 exceeds unwrapped maxX=210.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_MIN_X_BOUNDARY
    category: BOUNDARY
    description: Point lies exactly on minX of a dateline-wrapping rectangle.
    preconditions:
    - RectangleImpl bounds are minX=150.0, maxX=-150.0, minY=-20.0, maxY=20.0.
    - Point coordinates are X=150.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the direct path at the wrapping interval's
      minX boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAPPING_MAX_X_BOUNDARY
    category: BOUNDARY
    description: Point lies exactly on maxX of a dateline-wrapping rectangle and reaches
      it after shifting.
    preconditions:
    - RectangleImpl bounds are minX=150.0, maxX=-150.0, minY=-20.0, maxY=20.0.
    - Point coordinates are X=-150.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) unwraps maxX to 210.0, shifts point longitude to 210.0, and returns
      CONTAINS at the inclusive maximum boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EAST_DATELINE_ALIAS_CONTAINS
    category: EDGE
    description: Positive dateline point longitude is recognized as the western endpoint
      of an interval adjacent to -180.
    preconditions:
    - RectangleImpl bounds are minX=-180.0, maxX=-170.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=180.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) takes pX > maxX, subtracts 360.0 to obtain -180.0, and returns
      CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WEST_DATELINE_ALIAS_CONTAINS
    category: EDGE
    description: Negative dateline point longitude is recognized as the eastern endpoint
      of an interval adjacent to +180.
    preconditions:
    - RectangleImpl bounds are minX=170.0, maxX=180.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=-180.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) takes pX < minX, adds 360.0 to obtain 180.0, and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_DATELINE_DIRECT_BOUNDARY
    category: BOUNDARY
    description: Negative dateline longitude is directly equal to an ordinary rectangle
      minimum endpoint.
    preconditions:
    - RectangleImpl bounds are minX=-180.0, maxX=-170.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=-180.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the direct-longitude path without shifting.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_DATELINE_DIRECT_BOUNDARY
    category: BOUNDARY
    description: Positive dateline longitude is directly equal to an ordinary rectangle
      maximum endpoint.
    preconditions:
    - RectangleImpl bounds are minX=170.0, maxX=180.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=180.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS through the direct-longitude path without shifting.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_VERTICAL_LINE_CONTAINS
    category: BOUNDARY
    description: Zero-width rectangle is treated as an inclusive vertical line.
    preconditions:
    - RectangleImpl bounds are minX=20.0, maxX=20.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=20.0, Y=0.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because pX equals both longitude bounds.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_WIDTH_VERTICAL_LINE_DISJOINT
    category: BOUNDARY
    description: Point differs from a zero-width rectangle longitude while sharing
      its latitude range.
    preconditions:
    - RectangleImpl bounds are minX=20.0, maxX=20.0, minY=-10.0, maxY=10.0.
    - Point coordinates are X=20.1, Y=0.0.
    expectedSourceBehavior:
    - relate(point) takes pX > maxX, shifts longitude, and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_HORIZONTAL_LINE_CONTAINS
    category: BOUNDARY
    description: Zero-height rectangle is treated as an inclusive horizontal line.
    preconditions:
    - RectangleImpl bounds are minX=-20.0, maxX=20.0, minY=5.0, maxY=5.0.
    - Point coordinates are X=0.0, Y=5.0.
    expectedSourceBehavior:
    - relate(point) returns CONTAINS because point Y equals both latitude bounds and
      X is directly inside.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_HORIZONTAL_LINE_DISJOINT
    category: BOUNDARY
    description: Point differs from a zero-height rectangle latitude while sharing
      its longitude interval.
    preconditions:
    - RectangleImpl bounds are minX=-20.0, maxX=20.0, minY=5.0, maxY=5.0.
    - Point coordinates are X=0.0, Y=5.1.
    expectedSourceBehavior:
    - relate(point) returns DISJOINT at the initial Y-above-max comparison.
    targetCases: 1
    emptyOutputAllowed: false
