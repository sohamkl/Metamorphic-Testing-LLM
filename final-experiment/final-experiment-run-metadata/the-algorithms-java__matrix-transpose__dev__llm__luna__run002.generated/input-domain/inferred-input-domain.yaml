InputDomain:
  summary: Non-empty rectangular double matrices whose transpose is produced by generateFollowUp
    and whose rank result is checked for equality by assertRelation.
  globalConstraints:
  - The source matrix has at least 1 row and at least 1 column; source.length >= 1
    and source[0].length >= 1.
  - Every row is non-null and has exactly source[0].length elements, so the source
    is rectangular and generateFollowUp can transpose it.
  - The matrix satisfies validateInputMatrix; no additional null, empty, jagged, or
    non-rectangular cases are included because generateFollowUp directly reads source.length
    and source[0].length and the supplied metamorphic relation does not request invalid
    inputs.
  - Each follow-up is exactly the transpose generated by generateFollowUp, with follow-up
    dimensions source[0].length by source.length.
  - Matrix entries are Java double values; finite-value scenarios are always applicable,
    while NaN and infinity scenarios apply when validateInputMatrix accepts those
    double values because its implementation is not supplied.
  - Source inputs are not mutated by computeRank because the implementation operates
    on deepCopy(matrix); the original source must remain element-for-element unchanged
    after invocation.
  - Every source and follow-up result is expected to be an int and assertRelation
    requires the two returned ranks to be equal.
  diversity:
    shape:
    - 1x1
    - 1xN
    - Mx1
    - 2x2
    - 2xN
    - Mx2
    - tall MxN
    - wide MxN
    rankStructure:
    - rank 0
    - rank 1
    - full row rank
    - full column rank
    - rank deficient with dependent rows
    - rank deficient with dependent columns
    pivotPath:
    - pivot in first row
    - leading zero column with sentinel
    - pivot after skipped marked row
    - pivot in final column
    - multiple pivots
    - no pivot in any column
    eliminationPath:
    - nonzero rows eliminated
    - zero pivot-column entries skip elimination
    - normalization with later columns
    - normalization loop empty
    epsilonRelation:
    - absolute value below 1e-10
    - absolute value exactly 1e-10
    - absolute value above 1e-10
    - near-zero elimination residual
    valueClass:
    - positive finite values
    - negative finite values
    - signed zero
    - NaN when accepted
    - positive infinity when accepted
    - negative infinity when accepted
  scenarios:
  - id: ONE_BY_ONE_ZERO
    category: EDGE
    description: The smallest valid matrix contains the exact zero value.
    preconditions:
    - source has shape 1x1.
    - source[0][0] == 0.0.
    expectedSourceBehavior:
    - computeRank returns 0 because findPivotRow finds no nonzero pivot in the only
      column.
    - The transposed follow-up is identical and assertRelation succeeds with equal
      rank 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_BY_ONE_NONZERO
    category: EDGE
    description: The smallest valid matrix contains one ordinary nonzero pivot.
    preconditions:
    - source has shape 1x1.
    - source[0][0] is finite and source[0][0] != 0.0.
    expectedSourceBehavior:
    - computeRank returns 1.
    - The follow-up is identical, so the source and follow-up ranks are equal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ALL_ZERO_RECTANGLE
    category: NORMAL
    description: A rectangular matrix has no candidate pivot in any column.
    preconditions:
    - source has shape 2x3.
    - Every entry equals 0.0.
    expectedSourceBehavior:
    - findPivotRow returns numRows for every column and computeRank returns 0.
    - The 3x2 transpose also returns 0, exercising the sentinel no-pivot path in both
      orientations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_ROW_FULL_ROW_RANK
    category: NORMAL
    description: A wide one-row matrix has a pivot in its first column and later columns
      for normalization.
    preconditions:
    - source has shape 1x3.
    - source[0] is [1.0, 2.0, 3.0].
    expectedSourceBehavior:
    - computeRank returns 1.
    - normalizePivotRow processes later columns, and the 3x1 transpose also has rank
      1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_COLUMN_WITH_ZERO_ROWS
    category: NORMAL
    description: A tall one-column matrix contains zero rows around one nonzero pivot.
    preconditions:
    - source has shape 3x1.
    - source[0][0] == 0.0, source[1][0] == 2.0, and source[2][0] == 0.0.
    expectedSourceBehavior:
    - computeRank returns 1 after finding the pivot in the second row.
    - The 1x3 transpose also returns 1; the original source remains unchanged.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULL_ROW_RANK_WIDE
    category: NORMAL
    description: A wide matrix has independent rows and exercises multiple pivots
      with more columns than rows.
    preconditions:
    - source has shape 2x4.
    - source is [[1.0, 2.0, 0.0, 1.0], [0.0, 1.0, 1.0, 2.0]].
    expectedSourceBehavior:
    - computeRank returns 2, the maximum possible rank for two rows.
    - The 4x2 transpose also returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FULL_COLUMN_RANK_TALL
    category: NORMAL
    description: A tall matrix has independent columns and exercises more rows than
      columns.
    preconditions:
    - source has shape 4x2.
    - source is [[1.0, 0.0], [0.0, 1.0], [1.0, 1.0], [2.0, -1.0]].
    expectedSourceBehavior:
    - computeRank returns 2, the maximum possible rank for two columns.
    - The 2x4 transpose also returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEPENDENT_ROWS
    category: NORMAL
    description: Several rows are scalar multiples, so elimination produces a rank-one
      matrix.
    preconditions:
    - source has shape 3x3.
    - source is [[1.0, 2.0, 3.0], [2.0, 4.0, 6.0], [-3.0, -6.0, -9.0]].
    expectedSourceBehavior:
    - computeRank returns 1 after eliminating dependent rows.
    - The 3x3 transpose also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEPENDENT_COLUMNS_WIDE
    category: NORMAL
    description: A wide matrix has dependent columns and tests rank preservation across
      a shape-changing transpose.
    preconditions:
    - source has shape 2x3.
    - source is [[1.0, 2.0, 3.0], [2.0, 4.0, 6.0]].
    expectedSourceBehavior:
    - computeRank returns 1.
    - The 3x2 transpose returns 1, despite exchanging the row and column counts.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEADING_ZERO_COLUMN
    category: NORMAL
    description: The first column has no pivot, while a later column supplies the
      only pivot.
    preconditions:
    - source has shape 2x3.
    - source is [[0.0, 1.0, 2.0], [0.0, 2.0, 4.0]].
    expectedSourceBehavior:
    - findPivotRow returns numRows for column 0 and later finds a pivot in column
      1.
    - computeRank returns 1 and the transpose also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SKIP_MARKED_ROW_FOR_LATER_PIVOT
    category: NORMAL
    description: The first row is marked by an early pivot, so a later column must
      select an unmarked lower row.
    preconditions:
    - source has shape 2x2.
    - source is [[1.0, 2.0], [0.0, 3.0]].
    expectedSourceBehavior:
    - The first pivot marks row 0 and the second pivot is selected from row 1.
    - computeRank returns 2 and the transpose also returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONZERO_ELIMINATION
    category: NORMAL
    description: A pivot-column entry in another row is nonzero, so eliminateRows
      performs subtraction.
    preconditions:
    - source has shape 2x2.
    - source is [[1.0, 2.0], [3.0, 4.0]].
    expectedSourceBehavior:
    - eliminateRows executes for the second row and the remaining pivot is nonzero.
    - computeRank returns 2 and assertRelation succeeds for the transpose.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_ELIMINATION_BRANCH
    category: NORMAL
    description: A later row already has a zero in the current pivot column, so the
      elimination inner branch is skipped.
    preconditions:
    - source has shape 2x2.
    - source is [[1.0, 0.0], [0.0, 1.0]].
    expectedSourceBehavior:
    - For each pivot, the other row has a zero pivot-column value and is not eliminated
      for that pivot.
    - computeRank returns 2; normalization at the final pivot column has no later-column
      iterations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINAL_COLUMN_PIVOT
    category: EDGE
    description: A pivot is found in the last column, directly exercising the empty
      normalization loop.
    preconditions:
    - source has shape 2x2.
    - source is [[0.0, 1.0], [0.0, 0.0]].
    expectedSourceBehavior:
    - Column 0 has no pivot, and column 1 supplies a pivot whose normalization loop
      has no next column.
    - computeRank returns 1 and the 2x2 transpose also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPSILON_BELOW_ZERO
    category: BOUNDARY
    description: A finite pivot lies strictly inside the implementation's zero tolerance.
    preconditions:
    - source has shape 1x1.
    - source[0][0] == 5.0e-11, so abs(source[0][0]) < 1.0e-10.
    expectedSourceBehavior:
    - isZero treats the only entry as zero and computeRank returns 0.
    - The identical transpose returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPSILON_EXACT_BOUNDARY
    category: BOUNDARY
    description: A finite pivot is exactly at the EPSILON magnitude, where the strict
      less-than test changes behavior.
    preconditions:
    - source has shape 1x1.
    - source[0][0] == 1.0e-10.
    expectedSourceBehavior:
    - Because isZero uses abs(value) < 1.0e-10, the entry is treated as nonzero and
      computeRank returns 1.
    - The transpose returns the same rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPSILON_ABOVE_ZERO
    category: BOUNDARY
    description: A finite pivot lies just outside the implementation's zero tolerance.
    preconditions:
    - source has shape 1x1.
    - source[0][0] == -1.0e-10 - 1.0e-12.
    expectedSourceBehavior:
    - isZero treats the negative value as nonzero and computeRank returns 1.
    - The transpose preserves the result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_ZERO_ELIMINATION_RESIDUAL
    category: BOUNDARY
    description: Elimination creates a residual below EPSILON, causing the second
      pivot to be treated as zero.
    preconditions:
    - source has shape 2x2.
    - source is [[1.0, 1.0], [1.0, 1.0 + 5.0e-11]].
    expectedSourceBehavior:
    - The first pivot eliminates the second row to a residual of approximately 5.0e-11.
    - The residual is below EPSILON, so computeRank returns 1; the transpose must
      also return 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_AND_SIGNED_ZERO_VALUES
    category: NORMAL
    description: Ordinary negative values and negative zero exercise sign-preserving
      double inputs without changing zero detection.
    preconditions:
    - source has shape 2x3.
    - source is [[-1.0, -2.0, -3.0], [-0.0, 0.0, 1.0]].
    expectedSourceBehavior:
    - Signed zeros are treated as zero by isZero, while the negative first-row pivot
      is nonzero.
    - computeRank returns 2 and the 3x2 transpose is required to return 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_ENTRY_WHEN_ACCEPTED
    category: EDGE
    description: A matrix containing NaN tests the source's direct double arithmetic
      and the nonzero result of isZero(NaN).
    preconditions:
    - source has shape 1x1.
    - validateInputMatrix accepts the entry.
    - source[0][0] is NaN.
    expectedSourceBehavior:
    - isZero(NaN) evaluates false because Math.abs(NaN) is NaN and NaN < EPSILON is
      false.
    - computeRank returns 1, and the identical transpose must produce the same result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INFINITE_ENTRY_WHEN_ACCEPTED
    category: EDGE
    description: A matrix containing positive infinity tests a non-finite but nonzero
      pivot.
    preconditions:
    - source has shape 1x1.
    - validateInputMatrix accepts the entry.
    - source[0][0] is positive infinity.
    expectedSourceBehavior:
    - isZero treats positive infinity as nonzero and computeRank returns 1.
    - The identical transpose must also return 1.
    targetCases: 1
    emptyOutputAllowed: false
