InputDomain:
  summary: Non-null, day-capable standard Java Temporal endpoint pairs whose source
    and 37-day-shifted computations complete normally and produce an int-valued whole-day
    count.
  globalConstraints:
  - Both source endpoints must be non-null because the follow-up generator explicitly
    rejects null endpoints.
  - Each endpoint must support both plus(37, ChronoUnit.DAYS) and ChronoUnit.DAYS.between(start,
    end).
  - Each endpoint shifted forward by exactly 37 days must remain within that temporal
    type's supported range.
  - Both the source and shifted ChronoUnit.DAYS.between results must be within Integer.MIN_VALUE
    through Integer.MAX_VALUE because Days.between applies Math.toIntExact.
  - Inputs are limited to standard day-capable Java temporal families represented
    by LocalDate, LocalDateTime, OffsetDateTime, ZonedDateTime, Instant, ChronoLocalDate,
    and ChronoLocalDateTime implementations.
  - The two endpoints must belong to the same compatible temporal family; chronology-based
    endpoints must use the same chronology, and ZonedDateTime endpoints must use the
    same ZoneId. Mixed incompatible families and different ZonedDateTime zones are
    excluded because DAYS.between is delegated to the start temporal and may reject,
    normalize, or apply zone-transition semantics that are not translation invariant.
  - LocalTime, OffsetTime, Year, YearMonth, and other temporals that do not support
    ChronoUnit.DAYS are excluded because either the target or the required follow-up
    transformation cannot complete normally.
  - Custom Temporal implementations are excluded because no construction metadata
    or day-arithmetic semantics were supplied for them, so support for the target
    and the 37-day relation cannot be established.
  - Nulls, unsupported-unit cases, temporal-range overflow, and day-count overflow
    are excluded because the supplied metamorphic relation requests normal outputs
    rather than invalid-input behavior.
  diversity:
    temporalFamily:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - ChronoLocalDate
    - ChronoLocalDateTime
    resultSign:
    - negative
    - zero
    - positive
    resultMagnitude:
    - zero
    - one
    - multi-day
    - 37-day
    - Integer.MIN_VALUE
    - Integer.MAX_VALUE
    calendarBoundary:
    - ordinary
    - month-end
    - year-end
    - leap-day
    - non-leap-century
    - leap-century
    - chronology-era
    - chronology-month
    timeRemainder:
    - none
    - positive-subday
    - negative-subday
    offsetRelation:
    - same-offset
    - different-offset-same-instant
    - different-offset-whole-day
    zoneTransition:
    - ordinary
    - spring-gap-transition
    - autumn-overlap-transition
    temporalRangePosition:
    - ordinary
    - minimum-boundary
    - maximum-follow-up-boundary
  scenarios:
  - id: EQUAL_LOCAL_DATES
    category: EDGE
    description: Both LocalDate endpoints are the same date.
    preconditions:
    - startDateInclusive and endDateExclusive are equal LocalDate values.
    - The date is at least 37 days below LocalDate.MAX.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 0.
    - This exercises the Days.of zero sentinel path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ADJACENT_FORWARD_LOCAL_DATES
    category: BOUNDARY
    description: The exclusive LocalDate endpoint is exactly one day after the start.
    preconditions:
    - endDateExclusive equals startDateInclusive plus 1 day.
    - Both endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 1.
    - This exercises the Days.of one sentinel path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ADJACENT_REVERSE_LOCAL_DATES
    category: BOUNDARY
    description: The exclusive LocalDate endpoint is exactly one day before the start.
    preconditions:
    - endDateExclusive equals startDateInclusive minus 1 day.
    - Both endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_MULTI_DAY_LOCAL_DATE_GAPS
    category: NORMAL
    description: LocalDate endpoints have positive non-sentinel gaps.
    preconditions:
    - Use distinct cases where endDateExclusive is respectively 2 and 37 days after
      startDateInclusive.
    - Both endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - The respective getAmount() values are 2 and 37.
    - Both results use the general nonzero, non-one Days.of path.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_MULTI_DAY_LOCAL_DATE_GAPS
    category: NORMAL
    description: LocalDate endpoints have negative multi-day gaps.
    preconditions:
    - Use distinct cases where endDateExclusive is respectively 2 and 37 days before
      startDateInclusive.
    - Both endpoints can be shifted forward by 37 days.
    expectedSourceBehavior:
    - The respective getAmount() values are -2 and -37.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_BOUNDARIES
    category: BOUNDARY
    description: Adjacent LocalDate endpoints cross months of different lengths.
    preconditions:
    - Use 2024-01-31 to 2024-02-01 and 2024-04-30 to 2024-05-01.
    expectedSourceBehavior:
    - Days.between completes normally with getAmount() equal to 1 in each case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_BOUNDARIES
    category: BOUNDARY
    description: Adjacent LocalDate endpoints cross calendar years.
    preconditions:
    - Use 2023-12-31 to 2024-01-01 and 2024-12-31 to 2025-01-01.
    expectedSourceBehavior:
    - Days.between completes normally with getAmount() equal to 1 in each case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LEAP_DAY_SPANS
    category: BOUNDARY
    description: LocalDate ranges include the leap day of 2020.
    preconditions:
    - Use 2020-02-28 to 2020-03-01 and 2020-02-29 to 2020-03-01.
    expectedSourceBehavior:
    - The respective getAmount() values are 2 and 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NON_LEAP_CENTURY_BOUNDARY
    category: EDGE
    description: A LocalDate range crosses February 28 in century year 1900.
    preconditions:
    - startDateInclusive is 1900-02-28 and endDateExclusive is 1900-03-01.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 1 because 1900 has no February
      29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_CENTURY_BOUNDARY
    category: EDGE
    description: A LocalDate range crosses February 29 in century year 2000.
    preconditions:
    - startDateInclusive is 2000-02-28 and endDateExclusive is 2000-03-01.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_INT_DAY_COUNT
    category: BOUNDARY
    description: A LocalDate pair has the largest day count accepted by Math.toIntExact.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) equals Integer.MAX_VALUE.
    - Both LocalDate endpoints and their 37-day shifts are within the LocalDate range.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_INT_DAY_COUNT
    category: BOUNDARY
    description: A LocalDate pair has the smallest day count accepted by Math.toIntExact.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) equals Integer.MIN_VALUE.
    - Both LocalDate endpoints and their 37-day shifts are within the LocalDate range.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_SUBDAY
    category: EDGE
    description: A later LocalDateTime endpoint is less than one complete day after
      the start.
    preconditions:
    - Use elapsed local-time differences of 1 nanosecond and 23 hours 59 minutes 59
      seconds.
    - Neither pair crosses a complete local day according to ChronoUnit.DAYS.between.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 0 in both cases.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_SUBDAY
    category: EDGE
    description: An earlier LocalDateTime endpoint is less than one complete day before
      the start.
    preconditions:
    - Use reverse elapsed local-time differences of 1 nanosecond and 23 hours 59 minutes
      59 seconds.
    - ChronoUnit.DAYS.between truncates both differences to zero whole days.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 0 in both cases.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY_DIRECTIONS
    category: BOUNDARY
    description: LocalDateTime endpoints differ by exactly one complete local day
      in each direction.
    preconditions:
    - One case has endDateExclusive exactly 24 local hours after startDateInclusive.
    - One case has endDateExclusive exactly 24 local hours before startDateInclusive.
    expectedSourceBehavior:
    - The respective getAmount() values are 1 and -1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_CALENDAR_BOUNDARIES
    category: BOUNDARY
    description: Equal-time LocalDateTime endpoints cross a month and a year boundary.
    preconditions:
    - Use 2024-01-31T12:00 to 2024-02-01T12:00 and 2024-12-31T12:00 to 2025-01-01T12:00.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 1 in each case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY_TRUNCATION
    category: EDGE
    description: Instant endpoints differ by less than the fixed duration of one ChronoUnit
      day.
    preconditions:
    - Use one positive and one negative difference of 86399 seconds.
    - All shifted instants remain in range.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 0 in both cases.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_POSITIVE_DAYS
    category: NORMAL
    description: Instant endpoints differ by exact fixed-duration days.
    preconditions:
    - Use differences of exactly 86400 seconds and exactly 37 times 86400 seconds.
    - All shifted instants remain in range.
    expectedSourceBehavior:
    - The respective getAmount() values are 1 and 37.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_NEGATIVE_DAYS
    category: NORMAL
    description: Instant endpoints differ by exact negative fixed-duration days.
    preconditions:
    - Use differences of exactly -86400 seconds and exactly -37 times 86400 seconds.
    - All shifted instants remain in range.
    expectedSourceBehavior:
    - The respective getAmount() values are -1 and -37.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET
    category: NORMAL
    description: OffsetDateTime pairs use the same fixed offset with exact and partial-day
      differences.
    preconditions:
    - One pair differs by exactly one day at the same offset.
    - One pair differs by less than one day at the same offset.
    expectedSourceBehavior:
    - The respective getAmount() values are 1 and 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_SAME_INSTANT
    category: EDGE
    description: OffsetDateTime endpoints have different displayed local times and
      offsets but represent the same instant.
    preconditions:
    - Use 2024-01-01T00:00Z and 2024-01-01T01:00+01:00 in both endpoint orders.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 0 in both orders.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_NORMALIZED_WHOLE_DAYS
    category: EDGE
    description: Different-offset OffsetDateTime endpoints are a whole day apart after
      normalization to the start offset.
    preconditions:
    - One case uses 2024-01-01T00:00Z to 2024-01-02T02:00+02:00.
    - The other case reverses equivalent normalized endpoints to produce a negative
      day.
    expectedSourceBehavior:
    - The respective getAmount() values are 1 and -1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_SPRING_TRANSITION_DAYS
    category: EDGE
    description: Same-zone ZonedDateTime endpoints span a spring daylight-saving transition
      whose elapsed duration is not 24 hours.
    preconditions:
    - Use midnight-to-midnight around 2024-03-10 in America/New_York and around 2024-03-31
      in Europe/Berlin.
    - Each pair uses one ZoneId for both endpoints.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 1 for each calendar-day span.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_AUTUMN_TRANSITION_DAYS
    category: EDGE
    description: Same-zone ZonedDateTime endpoints span an autumn daylight-saving
      transition whose elapsed duration exceeds 24 hours.
    preconditions:
    - Use midnight-to-midnight around 2024-11-03 in America/New_York and around 2024-10-27
      in Europe/Berlin.
    - Each pair uses one ZoneId for both endpoints.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 1 for each calendar-day span.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_OVERLAP_SAME_LOCAL_TIME
    category: EDGE
    description: ZonedDateTime endpoints select the two valid offsets for the same
      repeated local date-time during an autumn overlap.
    preconditions:
    - Use one America/New_York overlap pair and one Europe/Berlin overlap pair.
    - Within each pair, local date-time and ZoneId are equal while the selected offsets
      differ.
    expectedSourceBehavior:
    - ChronoUnit.DAYS observes no complete local calendar day, so getAmount() is 0
      in each case.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NON_ISO_CHRONOLOGY_ORDINARY_DAYS
    category: NORMAL
    description: Same-chronology non-ISO ChronoLocalDate endpoints are separated by
      an ordinary multi-day amount.
    preconditions:
    - Use one MinguoDate pair separated by 2 days and one ThaiBuddhistDate pair separated
      by 37 days.
    - Each pair uses the same chronology and all shifted dates remain representable.
    expectedSourceBehavior:
    - The respective getAmount() values are 2 and 37.
    targetCases: 2
    emptyOutputAllowed: false
  - id: JAPANESE_ERA_BOUNDARY
    category: EDGE
    description: JapaneseDate endpoints cross from the final day of the Heisei era
      to the first day of the Reiwa era.
    preconditions:
    - The dates correspond to ISO 2019-04-30 and 2019-05-01.
    - Both endpoints use the Japanese chronology.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_MONTH_BOUNDARY
    category: BOUNDARY
    description: HijrahDate endpoints are adjacent dates on opposite sides of a Hijrah
      month boundary.
    preconditions:
    - endDateExclusive equals startDateInclusive plus 1 Hijrah calendar day.
    - The endpoints use the same Hijrah chronology and lie within its supported range
      after shifting.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CHRONO_LOCAL_DATE_TIME_PARTIAL_DAY
    category: EDGE
    description: Same-chronology ChronoLocalDateTime endpoints differ by more than
      one date change but less than one complete day.
    preconditions:
    - The end is on the following chronology date but its local time makes the total
      difference less than one complete day.
    - Both endpoints use the same chronology and can be shifted by 37 days.
    expectedSourceBehavior:
    - Days.between completes normally and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_SUPPORTED_RANGE_EDGES
    category: BOUNDARY
    description: LocalDate inputs exercise the lower source boundary and the highest
      endpoint that the 37-day follow-up can safely shift.
    preconditions:
    - One case uses startDateInclusive equal to LocalDate.MIN and endDateExclusive
      equal to LocalDate.MIN plus 3 days.
    - One case uses startDateInclusive equal to LocalDate.MAX minus 37 days and endDateExclusive
      equal to LocalDate.MAX minus 40 days.
    expectedSourceBehavior:
    - The respective getAmount() values are 3 and -3.
    - In the upper-range case, shifting the start by 37 days reaches LocalDate.MAX
      without overflowing.
    targetCases: 2
    emptyOutputAllowed: false
