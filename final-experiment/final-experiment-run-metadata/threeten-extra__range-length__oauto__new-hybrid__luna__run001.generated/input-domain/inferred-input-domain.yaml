InputDomain:
  summary: Valid LocalDateRange source instances whose lengthInDays() can be invoked
    and whose supplied follow-up transformation can construct LocalDateRange.of(range.getStart(),
    range.getEnd().plusDays(23)). The domain covers finite, empty, unbounded-start,
    boundary-length, boundary-date, and multiple documented construction representations.
  globalConstraints:
  - Every source range is constructed successfully and satisfies start <= end.
  - 'No source range uses a forbidden endpoint: end is not LocalDate.MIN or LocalDate.MIN.plusDays(1),
    and start is not LocalDate.MAX or LocalDate.MAX.minusDays(1).'
  - For every source case whose relation is asserted arithmetically, end.plusDays(23)
    is representable and the follow-up construction succeeds; therefore end <= LocalDate.MAX.minusDays(23).
  - For every source case whose relation is asserted arithmetically, the source and
    follow-up lengths are ordinary int results rather than Integer.MAX_VALUE; in particular,
    the source length is at most Integer.MAX_VALUE - 24.
  - Unbounded-end sources are excluded because generateFollowUp calls LocalDate.MAX.plusDays(23),
    which cannot produce a follow-up input; unbounded-start sources remain included
    when their finite end can be extended.
  - No invalid constructor, parser, temporal, null, reversed-range, or overflow input
    is included because the metamorphic relation requires a constructed LocalDateRange
    receiver and does not specify invalid-input behavior.
  diversity:
    constructionPath:
    - of(LocalDate, LocalDate)
    - of(LocalDate, Period)
    - ofClosed(LocalDate, LocalDate)
    - ofEmpty(LocalDate)
    - from(LocalDate)
    - from(Year)
    - from(YearMonth)
    - from(YearHalf)
    - from(YearQuarter)
    - from(YearWeek)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    - ofUnboundedStart(LocalDate)
    boundedness:
    - finite start and finite end
    - unbounded start with finite end
    - follow-up becomes unbounded at end
    - empty finite range
    sourceLength:
    - 0 days
    - 1 day
    - 2 days
    - 22 days
    - 23 days
    - 24 days
    - 31 days
    - 28 days
    - 90 days
    - 365 days
    - 366 days
    - Integer.MAX_VALUE - 25 days
    - Integer.MAX_VALUE - 24 days
    endpointBoundary:
    - end = LocalDate.MIN.plusDays(2)
    - end = LocalDate.MAX.minusDays(24)
    - end = LocalDate.MAX.minusDays(23)
    - ordinary mid-range dates
    relationOutcome:
    - asserted increase of exactly 23
    - source sentinel causes specified skip
    - follow-up sentinel causes specified skip
  scenarios:
  - id: EMPTY_RANGE
    category: BOUNDARY
    description: A valid empty finite range with equal ordinary start and end dates.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2020, 1, 1))
    - source start equals source end and neither endpoint is a prohibited LocalDate
      boundary.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up has the same start and an end 23 days later, so its length is
      23.
    - assertRelation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN
    category: NORMAL
    description: The smallest non-empty finite half-open range.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2020, 1, 2))
    - end - start is exactly 1 whole day.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWO_DAY_PERIOD
    category: NORMAL
    description: A short range created through the start-plus-Period construction
      path.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(2020, 1, 1), Period.ofDays(2))
    - Period.isNegative() is false and the resulting end is start.plusDays(2).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up length is 25 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_TWO_DAY_HALF_OPEN
    category: NORMAL
    description: A finite range one day shorter than the metamorphic extension.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(2021, 1, 1), LocalDate.of(2021, 1, 23))
    - source length is exactly 22 days.
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    - The follow-up length is 45 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_THREE_DAY_CLOSED
    category: BOUNDARY
    description: A 23-day range represented by inclusive endpoints.
    preconditions:
    - source = LocalDateRange.ofClosed(LocalDate.of(2021, 1, 1), LocalDate.of(2021,
      1, 23))
    - ofClosed converts the inclusive end to the exclusive end 2021-01-24.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up length is 46 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_FOUR_DAY_PARSED_DATE_PERIOD
    category: NORMAL
    description: A 24-day range parsed from a date followed by a Period.
    preconditions:
    - source = LocalDateRange.parse("2021-01-01/P24D")
    - The parsed end is 2021-01-25 and the range length is 24 days.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    - The follow-up length is 47 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THIRTY_ONE_DAY_DATE_DATE
    category: NORMAL
    description: A month-spanning range parsed from two explicit dates.
    preconditions:
    - source = LocalDateRange.parse("2021-01-01/2021-02-01")
    - The parsed half-open range contains exactly 31 whole days.
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    - The follow-up length is 54 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_EIGHT_DAY_PERIOD_DATE
    category: NORMAL
    description: A 28-day range parsed from a Period followed by its end date.
    preconditions:
    - source = LocalDateRange.parse("P28D/2021-03-01")
    - The parser computes the start as 2021-02-01 and the end as 2021-03-01.
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    - The follow-up length is 51 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NINETY_DAY_RANGE
    category: NORMAL
    description: A quarter-like finite range exercising a non-month-boundary day count.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(2021, 1, 15), LocalDate.of(2021, 4,
      15))
    - The source length is exactly 90 days.
    expectedSourceBehavior:
    - lengthInDays() returns 90.
    - The follow-up length is 113 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THREE_HUNDRED_SIXTY_FIVE_DAY_PERIOD
    category: NORMAL
    description: A one-year-minus-one-day duration created with Period.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(2019, 1, 1), Period.ofDays(365))
    - The period is non-negative and produces a finite 365-day range.
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    - The follow-up length is 388 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_YEAR_THREE_HUNDRED_SIXTY_SIX_DAYS
    category: EDGE
    description: A 366-day range crossing a leap year.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(2020, 1, 1), LocalDate.of(2021, 1, 1))
    - The source spans the leap day and has length 366.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - The follow-up length is 389 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A one-day range produced by from(LocalDate), which queries a LocalDate
      and delegates to ofClosed.
    preconditions:
    - source = LocalDateRange.from(LocalDate.of(2022, 6, 15))
    - The resulting range is the closed single-date range 2022-06-15 through 2022-06-15.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: A range produced from a Year temporal.
    preconditions:
    - source = LocalDateRange.from(Year.of(2021))
    - The resulting range starts on 2021-01-01 and ends exclusively on 2022-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 365.
    - The follow-up length is 388 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: A range produced from a YearMonth temporal.
    preconditions:
    - source = LocalDateRange.from(YearMonth.of(2020, 2))
    - The resulting range covers the leap-year month from 2020-02-01 through 2020-03-01
      exclusively.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up length is 52 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: A range produced from a YearHalf temporal.
    preconditions:
    - source = LocalDateRange.from(YearHalf.of(2021, 1))
    - The resulting range covers 2021-01-01 through 2021-07-01 exclusively.
    expectedSourceBehavior:
    - lengthInDays() returns 181.
    - The follow-up length is 204 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: A range produced from a YearQuarter temporal.
    preconditions:
    - source = LocalDateRange.from(YearQuarter.of(2021, 2))
    - The resulting range covers 2021-04-01 through 2021-07-01 exclusively.
    expectedSourceBehavior:
    - lengthInDays() returns 91.
    - The follow-up length is 114 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: A range produced from a YearWeek temporal.
    preconditions:
    - source = LocalDateRange.from(YearWeek.of(2021, 1))
    - The resulting range covers the Monday through the following Monday for ISO week
      1 of 2021.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up length is 30 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_FINITE_END
    category: EDGE
    description: The smallest permitted finite exclusive end date, with a one-day
      range immediately above it.
    preconditions:
    - source = LocalDateRange.of(LocalDate.MIN.plusDays(2), LocalDate.MIN.plusDays(3))
    - The end is LocalDate.MIN.plusDays(3), so end.plusDays(23) remains representable
      and valid.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_SENTINEL
    category: EDGE
    description: An unbounded-start range whose finite end is the first permitted
      end date.
    preconditions:
    - source = LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2))
    - source.getStart() equals LocalDate.MIN and source.getEnd() equals LocalDate.MIN.plusDays(2).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range sentinel.
    - The follow-up can still be constructed because the finite end is extended by
      23 days.
    - assertRelation skips because sourceOutput equals Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_NEAR_INT_LIMIT
    category: EDGE
    description: A finite range whose source length is Integer.MAX_VALUE - 25, leaving
      exactly two ordinary int lengths after the 23-day extension.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(1900, 1, 1), LocalDate.of(1900, 1, 1).plusDays(Integer.MAX_VALUE
      - 25L))
    - The computed source length is Integer.MAX_VALUE - 25 and the follow-up length
      is Integer.MAX_VALUE - 2.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 25.
    - The follow-up output is Integer.MAX_VALUE - 2, not the sentinel.
    - assertRelation observes an increase of exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_ASSERTABLE_FINITE_LENGTH
    category: BOUNDARY
    description: The largest finite source length for which the follow-up remains
      below the Integer.MAX_VALUE sentinel.
    preconditions:
    - source = LocalDateRange.of(LocalDate.of(1900, 1, 1), LocalDate.of(1900, 1, 1).plusDays(Integer.MAX_VALUE
      - 24L))
    - The computed source length is Integer.MAX_VALUE - 24 and the follow-up length
      is Integer.MAX_VALUE - 1.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24.
    - The follow-up output is Integer.MAX_VALUE - 1.
    - assertRelation observes an increase of exactly 23 without taking its sentinel
      skip.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_MAX_FOLLOWUP_FINITE
    category: EDGE
    description: A short finite range near LocalDate.MAX whose extended end remains
      finite.
    preconditions:
    - source = LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24))
    - source length is 1 and source.getEnd().plusDays(23) equals LocalDate.MAX.minusDays(1),
      a valid finite end.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up length is 24 and the asserted increase is 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOWUP_UNBOUNDED_END_SENTINEL
    category: EDGE
    description: A finite source whose 23-day extension reaches LocalDate.MAX and
      therefore produces an unbounded-end follow-up.
    preconditions:
    - source = LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23))
    - source length is 1 and source.getEnd().plusDays(23) equals LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 1 for the finite source.
    - The follow-up is constructed successfully with end LocalDate.MAX.
    - The follow-up length is Integer.MAX_VALUE and assertRelation skips because followUpOutput
      equals the sentinel.
    targetCases: 1
    emptyOutputAllowed: false
