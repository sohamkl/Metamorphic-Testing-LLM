InputDomain:
  summary: Valid bounded LocalDateRange receivers whose exclusive end can move 23
    days later without becoming unbounded or overflowing, and whose finite whole-day
    length does not saturate at Integer.MAX_VALUE.
  globalConstraints:
  - The source receiver must be successfully constructed by a listed construction
    path and must satisfy getStart() != LocalDate.MIN and getEnd() != LocalDate.MAX.
  - The source exclusive end must satisfy getEnd() <= LocalDate.MAX.minusDays(24),
    so getEnd().plusDays(23) is representable and remains a bounded exclusive end.
  - The finite epoch-day distance getEnd().toEpochDay() - getStart().toEpochDay()
    must be in [0, 2147483624], ensuring both source lengthInDays() and follow-up
    lengthInDays() are exact int lengths and the follow-up does not hit the Integer.MAX_VALUE
    saturation flag.
  - The follow-up is constructed as LocalDateRange.of(source.getStart(), source.getEnd().plusDays(23));
    its start is unchanged and its exclusive end is exactly 23 calendar days later.
  - Ranges with an unbounded start, an unbounded end, or both are excluded because
    lengthInDays() returns Integer.MAX_VALUE as an unbounded-length flag and their
    end cannot satisfy the required bounded 23-day movement.
  - Finite ranges longer than 2147483624 days are excluded because lengthInDays()
    saturates to Integer.MAX_VALUE, so adding 23 days cannot produce an observable
    result exactly 23 greater.
  diversity:
    constructionRoute:
    - distinct
    - measurable
    - of(LocalDate,LocalDate), ofClosed, of(LocalDate,Period), ofEmpty, parse, and
      from(Temporal)
    sourceLength:
    - distinct
    - measurable
    - 0, 1, 2, 3, 7, 23, month-derived, year-derived, half-year-derived, quarter-derived,
      week-derived, and 2147483624 days
    datePosition:
    - distinct
    - measurable
    - ordinary dates, month ends, leap-day intervals, year boundaries, LocalDate.MIN-adjacent
      values, and LocalDate.MAX-adjacent values
    temporalConversion:
    - distinct
    - measurable
    - Temporal local-date query, Year, YearMonth, YearHalf, YearQuarter, and YearWeek
      conversion branches
  scenarios:
  - id: OF_EMPTY_EQUAL_DATES
    category: NORMAL
    description: Half-open range constructed with of(date, date), producing an empty
      bounded range.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024, 6,
      15))
    expectedSourceBehavior:
    - lengthInDays() returns 0
    - follow-up lengthInDays() returns 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_EMPTY_FACTORY
    category: NORMAL
    description: Empty bounded range constructed through the dedicated ofEmpty(LocalDate)
      factory.
    preconditions:
    - source is LocalDateRange.ofEmpty(LocalDate.of(2024, 6, 15))
    expectedSourceBehavior:
    - lengthInDays() returns 0
    - follow-up lengthInDays() returns 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_SINGLE_DAY
    category: NORMAL
    description: Ordinary one-day half-open range.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024, 6,
      16))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_EXACTLY_TWENTY_THREE_DAYS
    category: NORMAL
    description: Half-open range whose source length equals the metamorphic movement
      amount.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1,
      24))
    expectedSourceBehavior:
    - lengthInDays() returns 23
    - follow-up lengthInDays() returns 46
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_MONTH_END_ONE_DAY
    category: BOUNDARY
    description: One-day range crossing from the last day of a 31-day month to the
      next month.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 31), LocalDate.of(2024, 2,
      1))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_LEAP_DAY_CROSSING
    category: BOUNDARY
    description: Range crossing the leap day in February 2024.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024, 3,
      1))
    expectedSourceBehavior:
    - lengthInDays() returns 2
    - follow-up lengthInDays() returns 25
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_YEAR_BOUNDARY
    category: BOUNDARY
    description: Range crossing from one calendar year into the next.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024, 1,
      2))
    expectedSourceBehavior:
    - lengthInDays() returns 2
    - follow-up lengthInDays() returns 25
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_MIN_ADJACENT_BOUNDED
    category: EDGE
    description: Bounded range immediately above the prohibited LocalDate.MIN and
      LocalDate.MIN.plusDays(1) end positions.
    preconditions:
    - source is LocalDateRange.of(LocalDate.MIN.plusDays(2), LocalDate.MIN.plusDays(3))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_MAX_ADJACENT_SAFE_FOLLOW_UP
    category: EDGE
    description: Bounded range near LocalDate.MAX whose shifted end becomes LocalDate.MAX.minusDays(1),
      not the unbounded sentinel.
    preconditions:
    - source is LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_MAXIMUM_EXACT_INT_FOLLOW_UP
    category: BOUNDARY
    description: Largest source length for which adding 23 days yields exactly Integer.MAX_VALUE
      without saturation.
    preconditions:
    - start is LocalDate.of(0, 1, 1)
    - end is start.plusDays(2147483624)
    - source is LocalDateRange.of(start, end)
    expectedSourceBehavior:
    - lengthInDays() returns 2147483624
    - follow-up lengthInDays() returns Integer.MAX_VALUE as an exact bounded length
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_CLOSED_SINGLE_DATE
    category: NORMAL
    description: Closed singleton range, converted internally to a one-day half-open
      range.
    preconditions:
    - source is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 15))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_CLOSED_MONTH_BOUNDARY
    category: BOUNDARY
    description: Closed range whose inclusive endpoint conversion adds one day across
      a month boundary.
    preconditions:
    - source is LocalDateRange.ofClosed(LocalDate.of(2024, 1, 31), LocalDate.of(2024,
      2, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 2
    - follow-up lengthInDays() returns 25
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_CLOSED_LEAP_INTERVAL
    category: BOUNDARY
    description: Closed range containing February 29 in a leap year.
    preconditions:
    - source is LocalDateRange.ofClosed(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 3
    - follow-up lengthInDays() returns 26
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_CLOSED_MIN_ADJACENT
    category: EDGE
    description: Closed singleton immediately above the disallowed far-past empty
      positions.
    preconditions:
    - source is LocalDateRange.ofClosed(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(1))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_PERIOD_ZERO
    category: NORMAL
    description: Zero non-negative Period creates an empty range through the start-plus-period
      construction path.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 6, 15), Period.ZERO)
    expectedSourceBehavior:
    - lengthInDays() returns 0
    - follow-up lengthInDays() returns 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_PERIOD_ONE_DAY
    category: NORMAL
    description: One-day Period produces a one-day range.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 6, 15), Period.ofDays(1))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_PERIOD_TWENTY_THREE_DAYS
    category: NORMAL
    description: Day-only Period equal to the end-shift amount.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 1), Period.ofDays(23))
    expectedSourceBehavior:
    - lengthInDays() returns 23
    - follow-up lengthInDays() returns 46
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_PERIOD_MONTH_END_LEAP_YEAR
    category: BOUNDARY
    description: Month Period added from January 31 in a leap year, yielding February
      29.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1))
    expectedSourceBehavior:
    - lengthInDays() returns 29
    - follow-up lengthInDays() returns 52
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_PERIOD_LEAP_DAY_PLUS_YEAR
    category: BOUNDARY
    description: Year Period added from leap day, yielding February 28 of the following
      non-leap year.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 2, 29), Period.ofYears(1))
    expectedSourceBehavior:
    - lengthInDays() returns 365
    - follow-up lengthInDays() returns 388
    targetCases: 1
    emptyOutputAllowed: false
  - id: OF_PERIOD_MONTH_AND_DAY
    category: NORMAL
    description: Mixed month-and-day Period exercises start.plus(period) with calendar-based
      period arithmetic.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.of(0, 1, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 30
    - follow-up lengthInDays() returns 53
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_EMPTY
    category: NORMAL
    description: Parsed date/date text representing an empty half-open range.
    preconditions:
    - source is LocalDateRange.parse("2024-06-15/2024-06-15")
    expectedSourceBehavior:
    - lengthInDays() returns 0
    - follow-up lengthInDays() returns 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_LEAP_CROSSING
    category: BOUNDARY
    description: Parsed date/date form crossing leap day.
    preconditions:
    - source is LocalDateRange.parse("2024-02-28/2024-03-01")
    expectedSourceBehavior:
    - lengthInDays() returns 2
    - follow-up lengthInDays() returns 25
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD_ZERO
    category: NORMAL
    description: Parsed date/Period form with Period.ZERO.
    preconditions:
    - source is LocalDateRange.parse("2024-06-15/P0D")
    expectedSourceBehavior:
    - lengthInDays() returns 0
    - follow-up lengthInDays() returns 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD_MONTH_END
    category: BOUNDARY
    description: Parsed date/Period form whose period addition starts at January 31
      in a leap year.
    preconditions:
    - source is LocalDateRange.parse("2024-01-31/P1M")
    expectedSourceBehavior:
    - lengthInDays() returns 29
    - follow-up lengthInDays() returns 52
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE_DAYS
    category: NORMAL
    description: Parsed Period/date form where parse subtracts a day-only Period from
      the end.
    preconditions:
    - source is LocalDateRange.parse("P23D/2024-01-24")
    expectedSourceBehavior:
    - lengthInDays() returns 23
    - follow-up lengthInDays() returns 46
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE_MONTH_END
    category: BOUNDARY
    description: Parsed Period/date form where parse subtracts one month from a leap-day
      end date.
    preconditions:
    - source is LocalDateRange.parse("P1M/2024-02-29")
    expectedSourceBehavior:
    - lengthInDays() returns 31
    - follow-up lengthInDays() returns 54
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: from(Temporal) uses a LocalDate returned by TemporalQueries.localDate
      and creates a closed one-day range.
    preconditions:
    - source is LocalDateRange.from(LocalDate.of(2024, 6, 15))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TIME
    category: NORMAL
    description: from(Temporal) receives a temporal with a local date and ignores
      its time component.
    preconditions:
    - source is LocalDateRange.from(LocalDateTime.of(2024, 6, 15, 23, 59, 59))
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up lengthInDays() returns 24
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_NON_LEAP
    category: NORMAL
    description: from(Temporal) Year branch converts a non-leap calendar year to its
      full closed range.
    preconditions:
    - source is LocalDateRange.from(Year.of(2023))
    expectedSourceBehavior:
    - lengthInDays() returns 365
    - follow-up lengthInDays() returns 388
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_LEAP
    category: BOUNDARY
    description: from(Temporal) Year branch converts a leap calendar year to its full
      closed range.
    preconditions:
    - source is LocalDateRange.from(Year.of(2024))
    expectedSourceBehavior:
    - lengthInDays() returns 366
    - follow-up lengthInDays() returns 389
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: from(Temporal) YearMonth branch uses atDay(1) and atEndOfMonth for
      non-leap February.
    preconditions:
    - source is LocalDateRange.from(YearMonth.of(2023, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 28
    - follow-up lengthInDays() returns 51
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH_LEAP_FEBRUARY
    category: BOUNDARY
    description: from(Temporal) YearMonth branch uses atDay(1) and atEndOfMonth for
      leap February.
    preconditions:
    - source is LocalDateRange.from(YearMonth.of(2024, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 29
    - follow-up lengthInDays() returns 52
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF_FIRST_LEAP
    category: NORMAL
    description: from(Temporal) YearHalf branch converts the first half of leap year
      2024 to its closed range.
    preconditions:
    - source temporal is a valid YearHalf representing the first half of 2024
    expectedSourceBehavior:
    - lengthInDays() returns 182
    - follow-up lengthInDays() returns 205
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF_SECOND_LEAP
    category: NORMAL
    description: from(Temporal) YearHalf branch converts the second half of leap year
      2024 to its closed range.
    preconditions:
    - source temporal is a valid YearHalf representing the second half of 2024
    expectedSourceBehavior:
    - lengthInDays() returns 184
    - follow-up lengthInDays() returns 207
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER_FIRST_LEAP
    category: NORMAL
    description: from(Temporal) YearQuarter branch converts the first quarter of leap
      year 2024 to its closed range.
    preconditions:
    - source temporal is a valid YearQuarter representing the first quarter of 2024
    expectedSourceBehavior:
    - lengthInDays() returns 91
    - follow-up lengthInDays() returns 114
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER_FOURTH_LEAP
    category: NORMAL
    description: from(Temporal) YearQuarter branch converts the fourth quarter of
      leap year 2024 to its closed range.
    preconditions:
    - source temporal is a valid YearQuarter representing the fourth quarter of 2024
    expectedSourceBehavior:
    - lengthInDays() returns 92
    - follow-up lengthInDays() returns 115
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: from(Temporal) YearWeek branch creates the Monday-through-Sunday
      closed week range.
    preconditions:
    - source temporal is a valid YearWeek representing an ordinary complete ISO week
      in 2024
    expectedSourceBehavior:
    - lengthInDays() returns 7
    - follow-up lengthInDays() returns 30
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_HIGH_YEAR
    category: EDGE
    description: from(Temporal) Year branch near LocalDate.MAX while retaining at
      least 23 bounded follow-up days.
    preconditions:
    - source is LocalDateRange.from(Year.of(999999998))
    expectedSourceBehavior:
    - lengthInDays() returns 365
    - follow-up lengthInDays() returns 388
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_HIGH_YEAR_MONTH
    category: EDGE
    description: from(Temporal) YearMonth branch near LocalDate.MAX with a bounded
      shifted end.
    preconditions:
    - source is LocalDateRange.from(YearMonth.of(999999999, 11))
    expectedSourceBehavior:
    - lengthInDays() returns 30
    - follow-up lengthInDays() returns 53
    targetCases: 1
    emptyOutputAllowed: false
