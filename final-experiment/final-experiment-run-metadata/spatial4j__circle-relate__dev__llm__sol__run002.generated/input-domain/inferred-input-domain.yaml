  - id: VERY_SMALL_POSITIVE_RADIUS
    category: BOUNDARY
    description: A representable positive-radius circle contains a strictly smaller
      rectangle near its center.
    preconditions:
    - R is finite, R > 0, and R is small enough that 0 and R are distinct representable
      doubles.
    - The rectangle has positive width and height.
    - Every rectangle corner has squared distance strictly less than R^2.
    - All fixed-shift relative-offset preservation constraints hold.
    expectedSourceBehavior:
