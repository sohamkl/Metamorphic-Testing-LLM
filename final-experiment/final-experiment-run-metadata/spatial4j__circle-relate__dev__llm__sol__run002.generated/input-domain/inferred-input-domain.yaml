  - id: SHIFTED_CENTER_EXACTLY_ORIGIN
    category: EDGE
    description: The source center is the inverse fixed offset, so the follow-up center
      is exactly the origin.
    preconditions:
    - cx equals -17.5 and cy equals 9.25.
    - The rectangle is a non-empty positive-area rectangle strictly contained by the
      circle.
    - The shifted center coordinates computed by generateFollowUp equal 0.0 and 0.0.
    expectedSourceBehavior:
