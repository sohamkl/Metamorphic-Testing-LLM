InputDomain:
  summary: Valid bounded LocalDateRange receivers whose exclusive end can be moved
    exactly 23 days later while both source and follow-up lengths remain representable
    as int values.
  globalConstraints:
  - The source receiver must be successfully constructed by one of the supplied LocalDateRange
    construction paths.
  - Let S = receiver.getStart() and E = receiver.getEnd(); the source must satisfy
    S <= E.
  - 'The source must be bounded at both ends: S != LocalDate.MIN and E != LocalDate.MAX.'
  - Unbounded-start ranges are excluded because lengthInDays() returns the Integer.MAX_VALUE
    sentinel before and after moving a finite end, so the stated +23 relation does
    not hold.
  - Unbounded-end ranges are excluded because LocalDate.MAX cannot be moved 23 days
    later.
  - E must be on or before LocalDate.MAX.minusDays(24), ensuring E.plusDays(23) exists
    and is not the unbounded-end sentinel LocalDate.MAX.
  - Let D = E.toEpochDay() - S.toEpochDay(); require 0 <= D <= Integer.MAX_VALUE -
    23 so both D and D + 23 are representable by the int return type.
  - Finite valid ranges with D greater than Integer.MAX_VALUE - 23 are excluded because
    the exact mathematical follow-up result cannot be represented as an int.
  - The follow-up receiver must be constructed with the same S and exclusive end E.plusDays(23),
    equivalently by receiver.withEnd(E.plusDays(23)).
  - Nulls, malformed parse text, negative periods, unsupported Temporal values, reversed
    endpoints, and constructor-prohibited endpoint combinations are excluded because
    the metamorphic relation does not request invalid inputs.
  diversity:
    constructionPath:
    - of_dates
    - of_period
    - ofClosed
    - ofEmpty
    - from_temporal
    - parse
    sourceLengthClass:
    - zero
    - one
    - below_23
    - exactly_23
    - above_23
    - calendar_scale
    - near_int_limit
    calendarFeature:
    - ordinary
    - month_boundary
    - year_boundary
    - leap_day
    - BCE_CE_boundary
    - LocalDate_lower_boundary
    - LocalDate_upper_boundary
    temporalConversionBranch:
    - local_date_query
    - Year
    - YearMonth
    - YearHalf
    - YearQuarter
    - YearWeek
    parseBranch:
    - date_date
    - date_period
    - period_date
    - lowercase_period_prefix
  scenarios:
  - id: ORDINARY_HALF_OPEN_RANGE
    category: NORMAL
    description: A non-empty half-open range made with of(LocalDate, LocalDate) using
      ordinary dates away from calendar and LocalDate limits.
    preconditions:
    - 2 <= D <= 365.
    - S and E are in the same non-leap year and E.plusDays(23) is in that year.
    expectedSourceBehavior:
    - lengthInDays() returns D, a positive value smaller than Integer.MAX_VALUE.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_VIA_OF_EMPTY
    category: BOUNDARY
    description: An empty source range made with ofEmpty(date).
    preconditions:
    - S = E.
    - The location is neither LocalDate.MIN, LocalDate.MIN.plusDays(1), LocalDate.MAX.minusDays(1),
      nor LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_VIA_HALF_OPEN_FACTORY
    category: BOUNDARY
    description: An empty source range made with of(date, date), exercising the half-open
      factory's equality case.
    preconditions:
    - S = E at an ordinary valid date.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: A half-open source range containing exactly one day.
    preconditions:
    - E = S.plusDays(1).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_JUST_BELOW_SHIFT
    category: BOUNDARY
    description: A source range whose length is one day less than the 23-day end shift.
    preconditions:
    - D = 22.
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EQUALS_SHIFT
    category: BOUNDARY
    description: A source range whose length equals the 23-day end shift.
    preconditions:
    - D = 23.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_JUST_ABOVE_SHIFT
    category: BOUNDARY
    description: A source range whose length is one day greater than the 23-day end
      shift.
    preconditions:
    - D = 24.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE_RANGE
    category: BOUNDARY
    description: A source made with ofClosed(date, date), which converts one inclusive
      date to a one-day internal half-open range.
    preconditions:
    - The supplied closed endpoints are equal and are ordinary valid dates.
    expectedSourceBehavior:
    - getEnd() is one day after getStart().
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DATE_RANGE
    category: NORMAL
    description: A non-empty source made with ofClosed(startInclusive, endInclusive).
    preconditions:
    - The supplied inclusive end is after the supplied start and is not LocalDate.MAX.
    - D equals the number of inclusive dates, namely days-between supplied endpoints
      plus 1.
    expectedSourceBehavior:
    - lengthInDays() returns D and includes both supplied closed endpoints in its
      count.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_RANGE
    category: BOUNDARY
    description: An empty source made with of(start, Period.ZERO).
    preconditions:
    - The start is an ordinary date at which an empty range is permitted.
    expectedSourceBehavior:
    - getEnd() equals getStart().
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_PERIOD_VARIABLE_DAY_COUNT
    category: EDGE
    description: A source made with of(start, a positive one-month Period), covering
      month arithmetic whose whole-day result depends on the start date.
    preconditions:
    - The period is P1M.
    - Use valid starts such as a month end and a non-month-end so start.plus(P1M)
      produces distinct day counts.
    expectedSourceBehavior:
    - lengthInDays() equals the epoch-day difference between start and start.plus(P1M),
      not a fixed nominal month length.
    targetCases: 2
    emptyOutputAllowed: false
  - id: YEAR_PERIOD_OVER_LEAP_CYCLE
    category: EDGE
    description: A source made with of(start, a positive one-year Period) spanning
      a leap-year-dependent interval.
    preconditions:
    - The period is P1Y.
    - The resulting D is either 365 or 366 according to the selected dates.
    expectedSourceBehavior:
    - lengthInDays() returns the actual whole-day difference, either 365 or 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: A source made by from(Temporal) where the Temporal supplies a LocalDate
      directly.
    preconditions:
    - The queried local date is an ordinary valid date.
    expectedSourceBehavior:
    - from() creates a closed one-date range.
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_DATE_TIME_LOCAL_DATE_QUERY
    category: EDGE
    description: A source made by from(Temporal) where the Temporal has a date and
      time component and supplies a local date through TemporalQueries.localDate().
    preconditions:
    - The Temporal is convertible to a LocalDate as documented for from().
    expectedSourceBehavior:
    - The time component is ignored and a one-day range is produced.
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_YEAR
    category: NORMAL
    description: A source made by from(Year) for a non-leap year.
    preconditions:
    - The Year is not a leap year and is far enough from LocalDate limits for the
      follow-up.
    expectedSourceBehavior:
    - The source spans January 1 through December 31 inclusively.
    - lengthInDays() returns 365.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: EDGE
    description: A source made by from(Year) for a leap year.
    preconditions:
    - The Year is a leap year and is far enough from LocalDate limits for the follow-up.
    expectedSourceBehavior:
    - The source includes February 29.
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY
    category: EDGE
    description: A source made by from(YearMonth) for February in a leap year.
    preconditions:
    - The YearMonth has 29 days.
    expectedSourceBehavior:
    - The source covers the complete month.
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_THIRTY_DAY_MONTH
    category: NORMAL
    description: A source made by from(YearMonth) for a 30-day month.
    preconditions:
    - The YearMonth has exactly 30 days.
    expectedSourceBehavior:
    - The source covers the complete month.
    - lengthInDays() returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: EDGE
    description: A source made by from(YearHalf), exercising the dedicated YearHalf
      conversion branch.
    preconditions:
    - The selected half and year produce a valid bounded range.
    - Select halves with distinct calendar lengths, including a half affected by leap
      February where possible.
    expectedSourceBehavior:
    - lengthInDays() equals the number of dates from the first through the last day
      of the selected half.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: EDGE
    description: A source made by from(YearQuarter), exercising the dedicated YearQuarter
      conversion branch.
    preconditions:
    - The selected quarter and year produce a valid bounded range.
    - Select quarters with distinct day counts.
    expectedSourceBehavior:
    - lengthInDays() equals the complete selected quarter's actual calendar-day count.
    targetCases: 2
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: EDGE
    description: A source made by from(YearWeek), covering Monday through Sunday via
      the dedicated YearWeek branch.
    preconditions:
    - The selected YearWeek is valid and away from LocalDate limits.
    expectedSourceBehavior:
    - The source starts on Monday and has an exclusive end after Sunday.
    - lengthInDays() returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE
    category: NORMAL
    description: A source parsed from the supported date/date format, whose second
      date is the exclusive end.
    preconditions:
    - The text has exactly one separating slash and two valid LocalDate representations.
    - The parsed end is on or after the parsed start.
    expectedSourceBehavior:
    - lengthInDays() returns the epoch-day difference between the two parsed dates.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD
    category: EDGE
    description: A source parsed from the supported date/period format.
    preconditions:
    - The text before the slash is a valid LocalDate.
    - The text after the slash is a nonnegative Period beginning with P.
    expectedSourceBehavior:
    - The exclusive end equals the parsed start plus the parsed Period.
    - lengthInDays() returns the resulting epoch-day difference.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE
    category: EDGE
    description: A source parsed from the supported period/date format.
    preconditions:
    - The text before the slash is a nonnegative Period beginning with P.
    - The text after the slash is a valid exclusive-end LocalDate.
    expectedSourceBehavior:
    - The start equals the parsed end minus the parsed Period.
    - lengthInDays() returns the epoch-day difference from that start to the parsed
      end.
    targetCases: 2
    emptyOutputAllowed: false
  - id: PARSE_LOWERCASE_PERIOD_PREFIX
    category: EDGE
    description: A source parsed through a branch that recognizes a lowercase p period
      prefix.
    preconditions:
    - The parse text uses a Period representation accepted by Period.parse and detected
      by LocalDateRange.parse through its lowercase p check.
    - The resulting range satisfies all global constraints.
    expectedSourceBehavior:
    - Parsing succeeds through a period-bearing format.
    - lengthInDays() returns the resulting bounded epoch-day difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_LEAP_DAY
    category: EDGE
    description: A bounded source interval crossing February 29.
    preconditions:
    - S is before February 29 of a leap year and E is after February 29.
    - Select intervals both shorter and longer than 23 days.
    expectedSourceBehavior:
    - lengthInDays() counts February 29 exactly once and returns D.
    targetCases: 2
    emptyOutputAllowed: false
  - id: CROSS_NON_LEAP_FEBRUARY
    category: EDGE
    description: A bounded source interval crossing the end of February in a non-leap
      year.
    preconditions:
    - The interval crosses from February into March in a non-leap year.
    expectedSourceBehavior:
    - lengthInDays() reflects a 28-day February and returns D.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_CALENDAR_YEAR
    category: EDGE
    description: A bounded source interval crossing December 31 to January 1.
    preconditions:
    - S and E are in adjacent calendar years.
    expectedSourceBehavior:
    - lengthInDays() returns the continuous epoch-day difference without resetting
      at the year boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_BCE_CE_BOUNDARY
    category: EDGE
    description: A bounded source interval crossing between negative and nonnegative
      proleptic years.
    preconditions:
    - S is in a negative proleptic year and E is in year 0 or later.
    - D remains at most Integer.MAX_VALUE - 23.
    expectedSourceBehavior:
    - lengthInDays() returns the nonnegative epoch-day difference across the proleptic-year
      boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CROSS_DIFFERENT_MONTH_LENGTHS
    category: EDGE
    description: A source interval crossing boundaries involving 30-day and 31-day
      months.
    preconditions:
    - S and E lie in different months.
    - Use one case ending across a 30-day month and one across a 31-day month.
    expectedSourceBehavior:
    - lengthInDays() returns the actual epoch-day difference independent of month
      length.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOWEST_BOUNDED_START
    category: BOUNDARY
    description: A source starting at the earliest date that is not treated as an
      unbounded start.
    preconditions:
    - S = LocalDate.MIN.plusDays(1).
    - E is at least LocalDate.MIN.plusDays(2).
    - D <= Integer.MAX_VALUE - 23.
    expectedSourceBehavior:
    - isUnboundedStart() is false.
    - lengthInDays() returns D rather than the Integer.MAX_VALUE unbounded sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATEST_END_ALLOWING_BOUNDED_FOLLOW_UP
    category: BOUNDARY
    description: A source whose exclusive end is as late as permitted while keeping
      the 23-day-later follow-up bounded.
    preconditions:
    - E = LocalDate.MAX.minusDays(24).
    - S <= E and D <= Integer.MAX_VALUE - 23.
    expectedSourceBehavior:
    - isUnboundedEnd() is false.
    - lengthInDays() returns D.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_ONE_BELOW_INT_RELATION_LIMIT
    category: BOUNDARY
    description: A very long bounded source range immediately below the largest source
      length admitted by the relation.
    preconditions:
    - D = Integer.MAX_VALUE - 24.
    - S and E satisfy the LocalDate endpoint constraints.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24 without using an unbounded sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_AT_INT_RELATION_LIMIT
    category: BOUNDARY
    description: The largest bounded source length for which adding 23 remains exactly
      int-representable.
    preconditions:
    - D = Integer.MAX_VALUE - 23.
    - S and E satisfy the LocalDate endpoint constraints.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_MULTI_MILLENNIAL_RANGE
    category: EDGE
    description: A large bounded range spanning many years but remaining well below
      the int relation limit.
    preconditions:
    - D is greater than 36600 and less than Integer.MAX_VALUE - 24.
    - The range is neither unbounded nor adjacent to LocalDate endpoint restrictions.
    expectedSourceBehavior:
    - lengthInDays() returns the full epoch-day difference as a positive int.
    targetCases: 1
    emptyOutputAllowed: false
