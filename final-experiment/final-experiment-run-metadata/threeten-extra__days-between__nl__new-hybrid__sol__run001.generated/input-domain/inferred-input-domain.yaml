InputDomain:
  summary: Non-null Temporal pairs for which whole-day counting and a common forward
    shift of 37 DAYS both complete, covering zero, positive, negative, truncation,
    calendar, chronology, time-zone, and integer boundaries.
  globalConstraints:
  - Both source arguments are non-null instances of java.time.temporal.Temporal.
  - ChronoUnit.DAYS.between(arg0, arg1) completes normally and is within the inclusive
    int range [-2147483648, 2147483647], as required by Math.toIntExact in Days.between.
  - Both arg0.plus(37, ChronoUnit.DAYS) and arg1.plus(37, ChronoUnit.DAYS) complete
    normally.
  - ChronoUnit.DAYS.between(arg0.plus(37, DAYS), arg1.plus(37, DAYS)) completes normally
    and is within the inclusive int range.
  - No same-runtime-type restriction is imposed; compatible mixed Temporal types are
    included when both source and follow-up invocations complete.
  - Nulls, temporals that do not support DAYS, incompatible Temporal pairs, range-overflowing
    shifts, and day counts outside int range are excluded because the relation requests
    successful shifted inputs rather than invalid-input behavior.
  diversity:
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - OffsetDateTime
    - ZonedDateTime
    - Instant
    - JapaneseDate
    - MinguoDate
    - ThaiBuddhistDate
    - HijrahDate
    - compatible_mixed_types
    resultSign:
    - negative
    - zero
    - positive
    DaysFactoryPath:
    - ZERO_for_0
    - ONE_for_1
    - ordinary_instance_for_other_values
    intervalShape:
    - equal_endpoints
    - exact_whole_days
    - positive_partial_day
    - negative_partial_day
    calendarBoundary:
    - ordinary_date
    - month_end
    - year_end
    - leap_day
    - non_leap_century
    - leap_century
    - proleptic_year_boundary
    - chronology_era_boundary
    zoneOrOffsetCondition:
    - not_applicable
    - same_offset
    - different_offsets
    - fixed_zone
    - spring_gap
    - autumn_overlap
    - different_zones
    numericBoundary:
    - ordinary_int
    - Integer_MAX_VALUE
    - Integer_MIN_VALUE
    shiftHeadroom:
    - ordinary_headroom
    - exactly_37_days_to_temporal_maximum
    - near_temporal_minimum
  scenarios:
  - id: EQUAL_LOCAL_DATES_ZERO
    category: EDGE
    description: The source LocalDate endpoints are equal.
    preconditions:
    - arg0 and arg1 are the same LocalDate.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0, exercising Days.ZERO.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CONSECUTIVE_LOCAL_DATES_ONE
    category: BOUNDARY
    description: The end LocalDate is exactly one day after the start.
    preconditions:
    - arg0 and arg1 are LocalDate values and arg1 equals arg0 plus 1 DAY.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1, exercising Days.ONE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REVERSED_CONSECUTIVE_LOCAL_DATES
    category: BOUNDARY
    description: The end LocalDate is exactly one day before the start.
    preconditions:
    - arg0 and arg1 are LocalDate values and arg1 equals arg0 minus 1 DAY.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_POSITIVE_MULTI_DAY_GAP
    category: NORMAL
    description: An ordinary forward LocalDate interval has a non-sentinel multi-day
      result.
    preconditions:
    - arg0 and arg1 are LocalDate values and arg1 equals arg0 plus 36 DAYS.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 36.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_NEGATIVE_MULTI_DAY_GAP
    category: NORMAL
    description: An ordinary reversed LocalDate interval has a negative multi-day
      result.
    preconditions:
    - arg0 and arg1 are LocalDate values and arg1 equals arg0 minus 36 DAYS.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is -36.
    targetCases: 1
    emptyOutputAllowed: false
  - id: GAP_EQUAL_TO_SHIFT_DISTANCE
    category: NORMAL
    description: The source day gap itself is exactly the relation's 37-day shift.
    preconditions:
    - arg0 and arg1 are LocalDate values and arg1 equals arg0 plus 37 DAYS.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: REVERSED_GAP_EQUAL_TO_SHIFT_DISTANCE
    category: NORMAL
    description: A reversed source gap has magnitude equal to the 37-day shift.
    preconditions:
    - arg0 and arg1 are LocalDate values and arg1 equals arg0 minus 37 DAYS.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is -37.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_INCLUDED
    category: BOUNDARY
    description: A LocalDate interval crosses February 29 in a leap year.
    preconditions:
    - arg0 is February 28 of a leap year and arg1 is March 1 of the same year.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_NON_LEAP_FEBRUARY
    category: BOUNDARY
    description: A LocalDate interval crosses February month-end in a non-leap year.
    preconditions:
    - arg0 is February 28 of a non-leap year and arg1 is March 1 of the same year.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NON_LEAP_CENTURY_1900
    category: BOUNDARY
    description: The source crosses February month-end in century year 1900.
    preconditions:
    - arg0 is LocalDate 1900-02-28 and arg1 is LocalDate 1900-03-01.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_CENTURY_2000
    category: BOUNDARY
    description: The source crosses February month-end in century year 2000.
    preconditions:
    - arg0 is LocalDate 2000-02-28 and arg1 is LocalDate 2000-03-01.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THIRTY_ONE_DAY_MONTH_END
    category: BOUNDARY
    description: Consecutive LocalDates cross the end of a 31-day month.
    preconditions:
    - arg0 is January 31 of a shift-safe year and arg1 is February 1 of that year.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_END_BOUNDARY
    category: BOUNDARY
    description: Consecutive LocalDates cross from December 31 to January 1.
    preconditions:
    - arg0 is December 31 of a shift-safe year and arg1 is January 1 of the next year.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PROLEPTIC_YEAR_ZERO_BOUNDARY
    category: BOUNDARY
    description: The LocalDate interval crosses the proleptic boundary from year -1
      to year 0.
    preconditions:
    - arg0 is LocalDate -0001-12-31 and arg1 is LocalDate 0000-01-01.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: NORMAL
    description: LocalDateTime endpoints have equal local times and differ by one
      date.
    preconditions:
    - arg0 and arg1 are LocalDateTime values, arg1's date is one day after arg0's
      date, and their local times are equal.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_SUBDAY
    category: EDGE
    description: A forward LocalDateTime interval is positive but shorter than one
      whole day.
    preconditions:
    - arg1 is after arg0 and the elapsed local timeline interval is less than 24 hours.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_PARTIAL_TEN_DATES
    category: EDGE
    description: The end date is ten dates later but its local time is earlier.
    preconditions:
    - arg0 and arg1 are LocalDateTime values, arg1's date is arg0's date plus 10 days,
      and arg1's local time is earlier than arg0's local time.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 9 whole days.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_SUBDAY
    category: EDGE
    description: A reversed LocalDateTime interval has magnitude shorter than one
      whole day.
    preconditions:
    - arg1 is before arg0 and the elapsed local timeline magnitude is less than 24
      hours.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0 due to whole-day truncation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_PARTIAL_TEN_DATES
    category: EDGE
    description: The end date is ten dates earlier but its local time is later.
    preconditions:
    - arg0 and arg1 are LocalDateTime values, arg1's date is arg0's date minus 10
      days, and arg1's local time is later than arg0's local time.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is -9 whole days.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_MIDNIGHT_BOUNDARY
    category: BOUNDARY
    description: The endpoints straddle midnight by less than one whole day.
    preconditions:
    - arg0 is a LocalDateTime late on one date and arg1 is a LocalDateTime early on
      the next date, with less than 24 hours between them.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET
    category: NORMAL
    description: OffsetDateTime endpoints use the same offset and equal local times
      on consecutive dates.
    preconditions:
    - arg0 and arg1 are OffsetDateTime values with the same ZoneOffset, and arg1 equals
      arg0 plus 1 DAY.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_SUBDAY
    category: EDGE
    description: Different endpoint offsets make consecutive local midnights less
      than one whole day apart.
    preconditions:
    - arg0 is 2024-01-01T00:00 at offset +00:00 and arg1 is 2024-01-02T00:00 at offset
      +02:00.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_FULL_DAY
    category: EDGE
    description: Different endpoint offsets still leave at least one whole day in
      the source interval.
    preconditions:
    - arg0 is 2024-01-01T00:00 at offset +02:00 and arg1 is 2024-01-02T02:00 at offset
      +00:00.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_REVERSED_DIFFERENT_OFFSETS
    category: EDGE
    description: A reversed OffsetDateTime interval exercises whole-day counting after
      offset normalization.
    preconditions:
    - arg0 is 2024-01-02T02:00 at offset +00:00 and arg1 is 2024-01-01T00:00 at offset
      +02:00.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: NORMAL
    description: Two Instant values differ by exactly 86400 seconds.
    preconditions:
    - arg0 and arg1 are Instant values and arg1 equals arg0 plus 1 DAY.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_POSITIVE_PARTIAL_DAY
    category: EDGE
    description: A positive Instant interval is one second short of a whole day.
    preconditions:
    - arg0 and arg1 are Instant values and arg1 is 86399 seconds after arg0.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_PARTIAL_DAY
    category: EDGE
    description: A negative Instant interval is one second short of a whole day in
      magnitude.
    preconditions:
    - arg0 and arg1 are Instant values and arg1 is 86399 seconds before arg0.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_MULTI_DAY_WITH_REMAINDER
    category: EDGE
    description: An Instant interval contains several whole days plus a subday remainder.
    preconditions:
    - arg0 and arg1 are Instant values and arg1 is 5 days and 1 second after arg0.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FIXED_ZONE
    category: NORMAL
    description: ZonedDateTime endpoints in UTC differ by one calendar day.
    preconditions:
    - arg0 and arg1 are ZonedDateTime values in UTC with equal local times and consecutive
      local dates.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_GAP
    category: EDGE
    description: A same-zone ZonedDateTime interval crosses a daylight-saving spring
      transition.
    preconditions:
    - arg0 and arg1 use the same region ZoneId, have equal local times on consecutive
      dates, and an offset gap occurs between them.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1 calendar day.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_OVERLAP
    category: EDGE
    description: A same-zone ZonedDateTime interval crosses a daylight-saving autumn
      transition.
    preconditions:
    - arg0 and arg1 use the same region ZoneId, have equal local times on consecutive
      dates, and an offset overlap occurs between them.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1 calendar day.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DIFFERENT_ZONES
    category: EDGE
    description: The ZonedDateTime endpoints represent local midnights in different
      region zones.
    preconditions:
    - arg0 is 2024-01-01T00:00 in Europe/Paris and arg1 is 2024-01-02T00:00 in America/New_York.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_REVERSED_DIFFERENT_ZONES
    category: EDGE
    description: A reversed pair uses different region zones.
    preconditions:
    - arg0 is 2024-01-02T00:00 in America/New_York and arg1 is 2024-01-01T00:00 in
      Europe/Paris.
    expectedSourceBehavior:
    - Days.between completes and returns a negative amount.
    - The returned getAmount() equals ChronoUnit.DAYS.between(arg0, arg1) converted
      exactly to int.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_ERA_TRANSITION
    category: BOUNDARY
    description: JapaneseDate endpoints cross the 2019 Japanese era transition.
    preconditions:
    - arg0 is the JapaneseDate corresponding to 2019-04-30 and arg1 corresponds to
      2019-05-01.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_ERA_TRANSITION_REVERSED
    category: BOUNDARY
    description: A reversed JapaneseDate pair crosses the 2019 era transition.
    preconditions:
    - arg0 is the JapaneseDate corresponding to 2019-05-01 and arg1 corresponds to
      2019-04-30.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_MONTH_BOUNDARY
    category: BOUNDARY
    description: Consecutive MinguoDate values cross a month boundary.
    preconditions:
    - arg0 and arg1 are MinguoDate values, arg1 equals arg0 plus 1 DAY, and their
      month fields differ.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_YEAR_BOUNDARY
    category: BOUNDARY
    description: Consecutive ThaiBuddhistDate values cross a year boundary.
    preconditions:
    - arg0 and arg1 are ThaiBuddhistDate values, arg1 equals arg0 plus 1 DAY, and
      their year fields differ.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_MONTH_BOUNDARY
    category: BOUNDARY
    description: Consecutive HijrahDate values cross a Hijrah month boundary.
    preconditions:
    - arg0 and arg1 are supported HijrahDate values, arg1 equals arg0 plus 1 DAY,
      and their month fields differ.
    - Both HijrahDate values and their 37-day shifts remain within the supported chronology
      range.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMPATIBLE_LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: EDGE
    description: The source uses compatible but different Temporal runtime types.
    preconditions:
    - arg0 is LocalDate 2024-01-01 and arg1 is LocalDateTime 2024-01-02T23:00.
    - Both the source and shifted mixed-type pairs are accepted by ChronoUnit.DAYS.between.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MAXIMUM_DAY_COUNT
    category: BOUNDARY
    description: The LocalDate distance is the largest value accepted by Math.toIntExact.
    preconditions:
    - arg0 and arg1 are LocalDate values and ChronoUnit.DAYS.between(arg0, arg1) is
      exactly 2147483647.
    - Both endpoints have at least 37 days of forward range.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTEGER_MINIMUM_DAY_COUNT
    category: BOUNDARY
    description: The reversed LocalDate distance is the smallest value accepted by
      Math.toIntExact.
    preconditions:
    - arg0 and arg1 are LocalDate values and ChronoUnit.DAYS.between(arg0, arg1) is
      exactly -2147483648.
    - Both endpoints have at least 37 days of forward range.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_EXACT_SHIFT_TO_MAXIMUM
    category: BOUNDARY
    description: Equal LocalDate endpoints have exactly 37 days of headroom before
      LocalDate.MAX.
    preconditions:
    - arg0 and arg1 are both LocalDate.MAX minus 37 DAYS.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0.
    - The required 37-day shift reaches LocalDate.MAX without exceeding it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_NEAR_MINIMUM
    category: BOUNDARY
    description: The source starts at the minimum supported LocalDate.
    preconditions:
    - arg0 is LocalDate.MIN and arg1 is LocalDate.MIN plus 1 DAY.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1.
    - Both required forward shifts remain representable.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_SHIFT_TO_MAXIMUM
    category: BOUNDARY
    description: Equal Instant endpoints have exactly 37 days of headroom before Instant.MAX.
    preconditions:
    - arg0 and arg1 are both Instant.MAX minus 37 DAYS.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 0.
    - The required 37-day shift reaches Instant.MAX without exceeding it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NON_BOUNDARY_POSITIVE_COUNT
    category: NORMAL
    description: A large LocalDate interval remains below the int conversion boundary.
    preconditions:
    - arg0 and arg1 are LocalDate values and ChronoUnit.DAYS.between(arg0, arg1) is
      exactly 1000000000.
    - Both endpoints have at least 37 days of forward range.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is 1000000000.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_NON_BOUNDARY_NEGATIVE_COUNT
    category: NORMAL
    description: A large reversed LocalDate interval remains above the lower int boundary.
    preconditions:
    - arg0 and arg1 are LocalDate values and ChronoUnit.DAYS.between(arg0, arg1) is
      exactly -1000000000.
    - Both endpoints have at least 37 days of forward range.
    expectedSourceBehavior:
    - Days.between completes and getAmount() is -1000000000.
    targetCases: 1
    emptyOutputAllowed: false
