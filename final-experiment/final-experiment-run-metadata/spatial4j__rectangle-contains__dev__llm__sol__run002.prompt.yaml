# Spatial4j RectangleImpl.relate(Point) - rotating the box and the point together.
#
# Real SUT from the SBFT'23 paper (Jahangirova & Terragni, 2023). Classpath comes from
# Spatial4j's own pom, nothing hand-listed. No adapter - relate(Point) is called directly,
# box as the receiver, point as the argument.
#
# DEV run: the developer spec is the MR, so no MRInput/MROutput prose is sent to the model.
# The natural-language version of this relation lives in prompt-rectangle-contains-nl.yaml.

ProjectRoot: examples/spatial4j
AutomaticDiscovery: true
SUTClassFile: examples/spatial4j/src/main/java/org/locationtech/spatial4j/shape/impl/RectangleImpl.java
TargetFunction: public SpatialRelation relate(Point point)
SUTDescription: >-
  A box on a map (a geo SpatialContext). relate(Point) says whether a point is inside the
  box - CONTAINS if it is, DISJOINT if not. If minX ends up bigger than maxX that's not
  broken, that's just how Spatial4j shows a box that wraps around the dateline.

Count: 50
InputGenerator: LLM
MavenProfiles:
  - spatial4j
JsonRequired: false
TestSuiteRequired: true
MRProvider: DEV
DeveloperMrFile: examples/spatial4j/mr/RectangleContainsPointMetamorphicSpec.java
DeveloperFollowUpMethod: RectangleContainsPointMetamorphicSpec.generateFollowUp
DeveloperAssertMethod: RectangleContainsPointMetamorphicSpec.assertRelation
GeneratedClassName: GeneratedRectangleContainsPointMetamorphicTest
OutputRoot: examples/spatial4j/generated/rectangle-contains-point
MaxRepairAttempts: 3
