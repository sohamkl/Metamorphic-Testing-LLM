InputDomain:
  summary: Non-null geographic RectangleImpl and Point pairs covering latitude rejection,
    inclusive boundaries, ordinary and dateline-wrapping longitude logic, rotation-induced
    representation changes, degenerate boxes, dateline aliases, and canonical empty
    sentinels.
  globalConstraints:
  - The receiver and point are non-null, as required by generateFollowUp through Objects.requireNonNull.
  - The receiver context satisfies rectangle.getContext().isGeo() == true; the supplied
    MR applies a normalized eastward longitude rotation on a geographic map.
  - A non-empty rectangle has finite coordinates with -180 <= minX <= 180, -180 <=
    maxX <= 180, and -90 <= minY <= maxY <= 90.
  - A non-empty point has finite coordinates with -180 <= point.x <= 180 and -90 <=
    point.y <= 90.
  - A canonical empty rectangle is represented by minX, maxX, minY, and maxY all being
    NaN; a canonical empty point has both coordinates NaN.
  - For non-empty rectangles, maxX - minX is less than 360; the valid full-world representation
    minX=-180 and maxX=180 is excluded because normalizing both endpoints after rotation
    collapses its 360-degree extent to zero width, so the supplied transformation
    does not preserve the source rectangle.
  - minX > maxX is permitted and denotes a dateline-wrapping rectangle as documented
    by RectangleImpl.
  - Zero-width and zero-height rectangles are permitted because the constructor performs
    no validation and hasArea() distinguishes them without declaring them empty.
  diversity:
    sourceRelation:
    - CONTAINS
    - DISJOINT
    latitudePosition:
    - below_minY
    - at_minY
    - interior
    - at_maxY
    - above_maxY
    - NaN
    longitudeRepresentation:
    - ordinary_nonwrapping
    - dateline_wrapping
    - zero_width
    - near_full_circle
    - dateline_alias
    - NaN
    longitudeCodePath:
    - geo_short_circuit
    - shift_plus_360
    - shift_minus_360
    - final_contains
    - final_disjoint
    followUpRectangleForm:
    - nonwrap_to_nonwrap
    - nonwrap_to_wrap
    - wrap_to_nonwrap
    - wrap_to_wrap
    - endpoint_at_normalization_seam
    geometricBoundary:
    - minimum_x
    - maximum_x
    - minimum_y
    - maximum_y
    - corner
    - degenerate_axis
    - empty_sentinel
  scenarios:
  - id: LATITUDE_ABOVE_MAXIMUM
    category: BOUNDARY
    description: The point is one degree above an ordinary rectangle.
    preconditions:
    - Rectangle coordinates are (-20, 20, -10, 10) and point coordinates are (0, 11).
    expectedSourceBehavior:
    - relate(Point) returns DISJOINT through point.y > maxY before longitude processing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATITUDE_BELOW_MINIMUM
    category: BOUNDARY
    description: The point is one degree below an ordinary rectangle.
    preconditions:
    - Rectangle coordinates are (-20, 20, -10, 10) and point coordinates are (0, -11).
    expectedSourceBehavior:
    - relate(Point) returns DISJOINT through point.y < minY before longitude processing.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ON_UPPER_LATITUDE_EDGE
    category: BOUNDARY
    description: The point lies exactly on the inclusive upper latitude edge.
    preconditions:
    - Rectangle coordinates are (-20, 20, -10, 10) and point coordinates are (0, 10).
    expectedSourceBehavior:
    - The latitude checks accept equality and relate(Point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_ON_LOWER_LATITUDE_EDGE
    category: BOUNDARY
    description: The point lies exactly on the inclusive lower latitude edge.
    preconditions:
    - Rectangle coordinates are (-20, 20, -10, 10) and point coordinates are (0, -10).
    expectedSourceBehavior:
    - The latitude checks accept equality and relate(Point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_HEIGHT_RECTANGLE_CONTAINS_POINT
    category: EDGE
    description: A horizontal zero-height rectangle is probed on its sole latitude.
    preconditions:
    - Rectangle coordinates are (-20, 20, 5, 5) and point coordinates are (0, 5).
    expectedSourceBehavior:
    - Both inclusive latitude comparisons pass and relate(Point) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_INTERIOR_SHORT_CIRCUIT
    category: NORMAL
    description: The point is strictly inside an ordinary nonwrapping rectangle.
    preconditions:
    - Rectangle coordinates are (-10, 10, -5, 5) and point coordinates are (0, 0).
    expectedSourceBehavior:
    - The point longitude lies between minX and maxX, so the geographic short-circuit
      returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_MINIMUM_LONGITUDE_EDGE
    category: BOUNDARY
    description: The point lies exactly on minX of an ordinary rectangle.
    preconditions:
    - Rectangle coordinates are (-10, 10, -5, 5) and point coordinates are (-10, 0).
