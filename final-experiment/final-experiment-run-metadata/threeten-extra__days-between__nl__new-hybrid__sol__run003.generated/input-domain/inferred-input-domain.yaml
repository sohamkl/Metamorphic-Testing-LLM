InputDomain:
  summary: Valid non-null Temporal endpoint pairs whose whole-day distance fits an
    int and for which shifting both endpoints forward by 37 DAYS is supported.
  globalConstraints:
  - Both source arguments are non-null instances implementing java.time.temporal.Temporal,
    as required by the documented non-null parameters.
  - ChronoUnit.DAYS.between(arg0, arg1) must complete normally and return a value
    in the inclusive range -2147483648 through 2147483647 so Math.toIntExact can complete
    and getAmount() is observable.
  - The follow-up endpoints are constructed exactly as arg0.plus(37, ChronoUnit.DAYS)
    and arg1.plus(37, ChronoUnit.DAYS).
  - Adding 37 DAYS to each source endpoint must complete normally and return non-null
    Temporal values.
  - ChronoUnit.DAYS.between on the two shifted endpoints must complete normally and
    return an int-representable value.
  - Temporal implementations and runtime-class pairings are not restricted beyond
    operational compatibility with DAYS.between and the required 37-day shift.
  - Null endpoints, endpoint pairings that do not support DAYS.between, and source
    distances outside the int range are excluded because the target does not return
    a Days value whose getAmount() can be compared.
  - Source pairs for which either endpoint cannot be shifted forward by 37 DAYS are
    excluded because the specified follow-up cannot be constructed, including otherwise
    valid source calls too near a Temporal upper bound.
  diversity:
    sourceOrdering:
    - end equal to start
    - end after start
    - end before start
    sourceAmountClass:
    - zero
    - one
    - negative one
    - small magnitude
    - exactly 37
    - medium magnitude
    - large magnitude
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    zeroSituation:
    - same endpoint reference
    - distinct endpoints with zero whole days
    - positive sub-day separation
    - negative sub-day separation
    temporalResolution:
    - whole-day-aligned endpoints
    - endpoints with a remainder smaller than one whole day
    runtimeClassPairing:
    - same runtime class
    - distinct DAYS-compatible runtime classes
    factoryPath:
    - Days.ZERO path for amount zero
    - Days.ONE path for amount one
    - newly valued Days path for all other amounts
  scenarios:
  - id: SAME_REFERENCE_ZERO
    category: EDGE
    description: Both source arguments reference the same Temporal object.
    preconditions:
    - arg0 and arg1 are the same object reference.
    - ChronoUnit.DAYS.between(arg0, arg1) equals 0.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned Days has getAmount() equal to 0, exercising the zero sentinel path
      in Days.of.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DISTINCT_ENDPOINTS_ZERO_WHOLE_DAYS
    category: EDGE
    description: Distinct source endpoint objects have no whole DAYS between them.
    preconditions:
    - arg0 and arg1 are different object references.
    - ChronoUnit.DAYS.between(arg0, arg1) equals 0.
    expectedSourceBehavior:
    - Days.between completes normally despite distinct endpoints.
    - The returned Days has getAmount() equal to 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_ONE_DAY
    category: BOUNDARY
    description: The exclusive end is exactly one whole day after the inclusive start
      according to DAYS.between.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) equals 1.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned Days has getAmount() equal to 1, exercising the one sentinel path
      in Days.of.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_DAY
    category: BOUNDARY
    description: The exclusive end is one whole day before the inclusive start.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) equals -1.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned Days has getAmount() equal to -1.
    targetCases: 3
    emptyOutputAllowed: false
  - id: SMALL_POSITIVE_GAP
    category: NORMAL
    description: The end follows the start by a small positive whole-day count distinct
      from the singleton amounts.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) is in the inclusive range 2 through 6.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned getAmount() equals the positive DAYS.between value.
    targetCases: 4
    emptyOutputAllowed: false
  - id: SMALL_NEGATIVE_GAP
    category: NORMAL
    description: The end precedes the start by a small whole-day count distinct from
      negative one.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) is in the inclusive range -6 through -2.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned getAmount() equals the negative DAYS.between value.
    targetCases: 4
    emptyOutputAllowed: false
  - id: POSITIVE_GAP_EQUALS_SHIFT
    category: EDGE
    description: The source gap is exactly the 37-day displacement used to construct
      the follow-up.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) equals 37.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned Days has getAmount() equal to 37.
    targetCases: 3
    emptyOutputAllowed: false
  - id: NEGATIVE_GAP_EQUALS_SHIFT
    category: EDGE
    description: The end precedes the start by exactly the 37-day follow-up displacement.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) equals -37.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned Days has getAmount() equal to -37.
    targetCases: 3
    emptyOutputAllowed: false
  - id: MEDIUM_POSITIVE_GAP
    category: NORMAL
    description: The end is moderately later than the start without using the exact
      37-day relation value.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) is in 7 through 36 or 38 through 365.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned getAmount() equals the positive source day distance.
    targetCases: 4
    emptyOutputAllowed: false
  - id: MEDIUM_NEGATIVE_GAP
    category: NORMAL
    description: The end is moderately earlier than the start without using the exact
      negative 37-day value.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) is in -365 through -38 or -36 through -7.
    expectedSourceBehavior:
    - Days.between completes normally.
    - The returned getAmount() equals the negative source day distance.
    targetCases: 4
    emptyOutputAllowed: false
  - id: LARGE_POSITIVE_GAP
    category: NORMAL
    description: The end is more than 365 whole days after the start while remaining
      below the positive int boundary.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) is in the inclusive range 366 through 2147483646.
    expectedSourceBehavior:
    - Math.toIntExact completes without overflow.
    - The returned getAmount() equals the large positive source day distance.
    targetCases: 3
    emptyOutputAllowed: false
  - id: LARGE_NEGATIVE_GAP
    category: NORMAL
    description: The end is more than 365 whole days before the start while remaining
      above the negative int boundary.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) is in the inclusive range -2147483647 through
      -366.
    expectedSourceBehavior:
    - Math.toIntExact completes without overflow.
    - The returned getAmount() equals the large negative source day distance.
    targetCases: 3
    emptyOutputAllowed: false
  - id: MAXIMUM_INT_DAY_COUNT
    category: BOUNDARY
    description: The source day distance is the largest value accepted by Math.toIntExact
      and representable by Days.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) equals 2147483647.
    expectedSourceBehavior:
    - Days.between completes normally at the positive conversion boundary.
    - The returned Days has getAmount() equal to 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_INT_DAY_COUNT
    category: BOUNDARY
    description: The source day distance is the smallest value accepted by Math.toIntExact
      and representable by Days.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) equals -2147483648.
    expectedSourceBehavior:
    - Days.between completes normally at the negative conversion boundary.
    - The returned Days has getAmount() equal to -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FORWARD_SUB_DAY_ZERO
    category: EDGE
    description: The end is later than the start, but the separation contains no complete
      day.
    preconditions:
    - The endpoints expose finer-than-day separation under their Temporal implementation.
    - ChronoUnit.DAYS.between(arg0, arg1) equals 0 for the forward separation.
    expectedSourceBehavior:
    - Days.between reports only whole days and completes normally.
    - The returned Days has getAmount() equal to 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: REVERSE_SUB_DAY_ZERO
    category: EDGE
    description: The end is earlier than the start, but the reverse separation contains
      no complete day.
    preconditions:
    - The endpoints expose finer-than-day separation under their Temporal implementation.
    - ChronoUnit.DAYS.between(arg0, arg1) equals 0 for the reverse separation.
    expectedSourceBehavior:
    - Days.between reports no complete negative day and completes normally.
    - The returned Days has getAmount() equal to 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: POSITIVE_WHOLE_DAYS_WITH_REMAINDER
    category: EDGE
    description: The end follows the start by positive whole days plus a remainder
      smaller than one day.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) is greater than 0.
    - The end is not the same endpoint value produced by adding exactly that returned
      number of DAYS to the start.
    expectedSourceBehavior:
    - Days.between returns the complete positive day count without adding another
      day for the remainder.
    - The returned getAmount() equals ChronoUnit.DAYS.between(arg0, arg1).
    targetCases: 2
    emptyOutputAllowed: false
  - id: NEGATIVE_WHOLE_DAYS_WITH_REMAINDER
    category: EDGE
    description: The end precedes the start by negative whole days with an additional
      remainder smaller than one day.
    preconditions:
    - ChronoUnit.DAYS.between(arg0, arg1) is less than 0.
    - The end is not the same endpoint value produced by adding exactly that returned
      number of DAYS to the start.
    expectedSourceBehavior:
    - Days.between returns the complete negative day count without extending its magnitude
      for the remainder.
    - The returned getAmount() equals ChronoUnit.DAYS.between(arg0, arg1).
    targetCases: 2
    emptyOutputAllowed: false
  - id: COMPATIBLE_DISTINCT_TEMPORAL_CLASSES
    category: NORMAL
    description: The two endpoints have different runtime Temporal classes that are
      nevertheless accepted together by DAYS.between and by the follow-up shift.
    preconditions:
    - arg0.getClass() is not equal to arg1.getClass().
    - ChronoUnit.DAYS.between(arg0, arg1) completes normally with an int-representable
      result.
    - Both runtime classes support plus(37, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - Days.between completes normally for the compatible heterogeneous pair.
    - The returned getAmount() equals ChronoUnit.DAYS.between(arg0, arg1).
    targetCases: 2
    emptyOutputAllowed: false
