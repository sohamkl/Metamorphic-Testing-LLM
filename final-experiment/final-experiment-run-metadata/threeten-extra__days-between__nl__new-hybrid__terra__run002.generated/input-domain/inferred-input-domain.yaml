InputDomain:
  summary: Successful, shiftable Temporal pairs for Days.between, covering Days.of
    zero/one/general-result paths, int conversion limits, date-time whole-day truncation,
    offsets, DST, mixed supported temporals, and non-ISO chronologies. For every source
    pair, the follow-up pair is formed by adding 37 ChronoUnit.DAYS to both inputs
    and must have the same getAmount().
  globalConstraints:
  - Both source arguments are non-null Temporal instances for which ChronoUnit.DAYS.between(start,
    end) completes successfully and its long result is within Integer.MIN_VALUE through
    Integer.MAX_VALUE, because Days.between applies Math.toIntExact before constructing
    Days.
  - Each source temporal must successfully support plus(37, ChronoUnit.DAYS), and
    both shifted temporals must also form a successful Days.between invocation with
    an int-range result; source inputs too near a temporal implementation's supported
    minimum or maximum are excluded only because the requested follow-up cannot be
    constructed.
  - Null inputs, temporals or temporal-pair combinations that do not support a DAYS-based
    between operation, and source intervals whose day count exceeds int range are
    excluded because the metamorphic relation requests equality of successful day-count
    outputs rather than invalid-input behavior.
  - Follow-up construction preserves each input's concrete temporal representation
    and applicable zone, offset, chronology, and local time by applying plus(37, ChronoUnit.DAYS)
    independently to start and end.
  diversity:
    resultClass:
    - zero sentinel
    - one-day sentinel
    - ordinary positive
    - ordinary negative
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    temporalRepresentation:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - mixed LocalDate/LocalDateTime
    - JapaneseDate
    - HijrahDate
    - ThaiBuddhistDate
    intervalSemantics:
    - calendar-day
    - exact whole-day
    - sub-day truncation
    - negative truncation toward zero
    - offset-normalized elapsed time
    - DST spring transition
    - DST autumn transition
  scenarios:
  - id: LOCAL_DATE_EQUAL_ZERO
    category: NORMAL
    description: Equal ISO LocalDate endpoints exercise a zero day count.
    preconditions:
    - start is LocalDate 2024-06-15 and end is the same LocalDate.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 0.
    - The 37-day-shifted pair also returns getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_EXACTLY_ONE_DAY
    category: BOUNDARY
    description: Adjacent ISO dates exercise the Days.of(1) singleton-result path.
    preconditions:
    - start is LocalDate 2024-06-15 and end is LocalDate 2024-06-16.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 1.
    - The shifted pair returns the same amount, 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_CROSS_MONTH
    category: NORMAL
    description: A positive LocalDate interval crosses a calendar-month boundary.
    preconditions:
    - start is LocalDate 2024-01-30 and end is LocalDate 2024-02-03.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 4.
    - The shifted pair returns getAmount() 4.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY
    category: EDGE
    description: A LocalDate interval includes leap day in a leap year.
    preconditions:
    - start is LocalDate 2024-02-28 and end is LocalDate 2024-03-01.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 2.
    - The shifted pair returns getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_REVERSED_NEGATIVE
    category: NORMAL
    description: End before start produces an ordinary negative day count.
    preconditions:
    - start is LocalDate 2024-06-20 and end is LocalDate 2024-06-15.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is -5.
    - The shifted pair returns getAmount() -5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MAXIMUM
    category: BOUNDARY
    description: The largest representable successful Days.between result exercises
      Math.toIntExact at Integer.MAX_VALUE.
    preconditions:
    - start is LocalDate 0000-01-01.
    - end equals start.plusDays(2147483647L).
    - start.plusDays(37) and end.plusDays(37) are supported LocalDate values.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 2147483647.
    - The shifted pair returns getAmount() 2147483647 without int-conversion overflow.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_INTEGER_MINIMUM
    category: BOUNDARY
    description: The smallest representable successful Days.between result exercises
      Math.toIntExact at Integer.MIN_VALUE.
    preconditions:
    - start is LocalDate 0000-01-01.
    - end equals start.minusDays(2147483648L).
    - start.plusDays(37) and end.plusDays(37) are supported LocalDate values.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is -2147483648.
    - The shifted pair returns getAmount() -2147483648 without int-conversion overflow.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SAME_DATE_SUBDAY
    category: EDGE
    description: LocalDateTime endpoints on the same date have a non-zero elapsed
      time but no complete day.
    preconditions:
    - start is LocalDateTime 2024-06-15T00:00.
    - end is LocalDateTime 2024-06-15T23:59:59.999999999.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 0.
    - The shifted pair returns getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints exactly 24 hours apart produce one whole
      day.
    preconditions:
    - start is LocalDateTime 2024-06-15T12:00.
    - end is LocalDateTime 2024-06-16T12:00.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 1.
    - The shifted pair returns getAmount() 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_POSITIVE_RESIDUAL
    category: NORMAL
    description: A positive LocalDateTime interval containing two complete days plus
      a residual time tests whole-day truncation.
    preconditions:
    - start is LocalDateTime 2024-06-15T12:00.
    - end is LocalDateTime 2024-06-17T13:00.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 2.
    - The shifted pair returns getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_SUBDAY
    category: EDGE
    description: A negative LocalDateTime interval of less than one complete day tests
      truncation toward zero.
    preconditions:
    - start is LocalDateTime 2024-06-16T00:00.
    - end is LocalDateTime 2024-06-15T01:00.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 0.
    - The shifted pair returns getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_MULTIDAY
    category: NORMAL
    description: A negative LocalDateTime interval with two complete days plus residual
      time produces a negative whole-day result.
    preconditions:
    - start is LocalDateTime 2024-06-18T13:00.
    - end is LocalDateTime 2024-06-16T12:00.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is -2.
    - The shifted pair returns getAmount() -2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY
    category: EDGE
    description: Instant endpoints 23 hours apart test time-line based sub-day truncation.
    preconditions:
    - start is Instant 2024-06-15T00:00:00Z.
    - end is Instant 2024-06-15T23:00:00Z.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 0.
    - The shifted pair returns getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_MULTIDAY
    category: NORMAL
    description: Instant endpoints exactly three 24-hour DAYS units apart test time-line
      whole-day counting.
    preconditions:
    - start is Instant 2024-06-15T00:00:00Z.
    - end is Instant 2024-06-18T00:00:00Z.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 3.
    - The shifted pair returns getAmount() 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_CHANGED_OFFSET_SUBDAY
    category: EDGE
    description: OffsetDateTime endpoints with different offsets represent only 23
      elapsed hours after offset normalization.
    preconditions:
    - start is OffsetDateTime 2024-01-01T00:00Z.
    - end is OffsetDateTime 2024-01-02T00:00+01:00.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 0.
    - The shifted pair returns getAmount() 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_REVERSED_OFFSET_INTERVAL
    category: NORMAL
    description: OffsetDateTime endpoints with different offsets represent a negative
      whole-day interval.
    preconditions:
    - start is OffsetDateTime 2024-01-03T00:00+01:00.
    - end is OffsetDateTime 2024-01-01T00:00Z.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is -1.
    - The shifted pair returns getAmount() -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_SPRING_FORWARD
    category: EDGE
    description: ZonedDateTime values at the same local time across the America/New_York
      spring-forward date test calendar DAYS behavior over a 23-hour day.
    preconditions:
    - start is ZonedDateTime 2024-03-09T12:00 in zone America/New_York.
    - end is ZonedDateTime 2024-03-10T12:00 in zone America/New_York.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 1.
    - The shifted pair returns getAmount() 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_DST_AUTUMN_BACK
    category: EDGE
    description: ZonedDateTime values at the same local time across the America/New_York
      autumn-back date test calendar DAYS behavior over a 25-hour day.
    preconditions:
    - start is ZonedDateTime 2024-11-02T12:00 in zone America/New_York.
    - end is ZonedDateTime 2024-11-03T12:00 in zone America/New_York.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 1.
    - The shifted pair returns getAmount() 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MIXED_LOCAL_DATE_TO_LOCAL_DATE_TIME
    category: NORMAL
    description: A supported mixed Temporal pair uses LocalDate as start and LocalDateTime
      as end.
    preconditions:
    - start is LocalDate 2024-06-15.
    - end is LocalDateTime 2024-06-17T23:59.
    - ChronoUnit.DAYS.between(start, end) completes successfully.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 2.
    - The shifted LocalDate and shifted LocalDateTime pair returns getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_TRANSITION
    category: EDGE
    description: JapaneseDate inputs crossing the Heisei-to-Reiwa era transition exercise
      a non-ISO ChronoLocalDate implementation.
    preconditions:
    - start is JapaneseDate representing ISO date 2019-04-30.
    - end is JapaneseDate representing ISO date 2019-05-02.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 2.
    - The shifted JapaneseDate pair returns getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MONTH_TRANSITION
    category: EDGE
    description: HijrahDate endpoints are separated by two DAYS units across a chronology-specific
      month boundary.
    preconditions:
    - start is a supported HijrahDate.
    - end equals start.plus(2, ChronoUnit.DAYS).
    - start.plus(37, ChronoUnit.DAYS) and end.plus(37, ChronoUnit.DAYS) are supported
      HijrahDate values.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is 2.
    - The shifted HijrahDate pair returns getAmount() 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_REVERSED
    category: NORMAL
    description: ThaiBuddhistDate inputs test a non-ISO chronology with a negative
      date-based interval.
    preconditions:
    - start is ThaiBuddhistDate representing ISO date 2024-06-20.
    - end is ThaiBuddhistDate representing ISO date 2024-06-15.
    expectedSourceBehavior:
    - Days.between(start, end).getAmount() is -5.
    - The shifted ThaiBuddhistDate pair returns getAmount() -5.
    targetCases: 1
    emptyOutputAllowed: false
