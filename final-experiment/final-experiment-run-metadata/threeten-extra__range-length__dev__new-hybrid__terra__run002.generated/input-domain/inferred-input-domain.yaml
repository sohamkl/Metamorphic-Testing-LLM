InputDomain:
  summary: Valid non-null LocalDateRange receivers whose exclusive end can be advanced
    by 23 days without LocalDate overflow. Cover empty, ordinary bounded, large bounded/saturated,
    unbounded-start sentinel, endpoint boundaries, and distinct documented receiver-construction
    paths.
  globalConstraints:
  - The source receiver must be a successfully constructed, non-null LocalDateRange.
  - The source exclusive end must satisfy range.getEnd() <= LocalDate.MAX.minusDays(23),
    because generateFollowUp unconditionally evaluates range.getEnd().plusDays(23).
  - '{Therefore all valid ranges ending in the final 22 LocalDate values, including
    every unbounded-end range with end == LocalDate.MAX and LocalDateRange.ofUnbounded(),
    are excluded=their follow-up generation throws before lengthInDays() can be invoked.}'
  - Invalid construction inputs are excluded because the metamorphic relation accepts
    a LocalDateRange receiver, requires it to be non-null, and does not specify an
    invalid-input relation.
  diversity:
    receiverState:
    - empty bounded
    - ordinary finite bounded
    - finite bounded near LocalDate.MIN
    - finite bounded near LocalDate.MAX
    - unbounded start
    - bounded length below Integer.MAX_VALUE
    - bounded length equal to Integer.MAX_VALUE
    - bounded length greater than Integer.MAX_VALUE
    lengthBoundary:
    - '0'
    - '1'
    - '2'
    - '7'
    - '10'
    - '23'
    - '29'
    - '91'
    - '182'
    - '366'
    - Integer.MAX_VALUE.minus(24)
    - Integer.MAX_VALUE.minus(23)
    - Integer.MAX_VALUE.minus(1)
    - Integer.MAX_VALUE
    - Integer.MAX_VALUE.plus(1)
    constructionPath:
    - of dates
    - of start and Period
    - ofClosed
    - ofEmpty
    - ofUnboundedStart
    - parse date/date
    - parse date/Period
    - parse Period/date
    - from LocalDate
    - from Year
    - from YearMonth
    - from YearHalf
    - from YearQuarter
    - from YearWeek
    followUpOutcome:
    - finite output exactly source plus 23
    - follow-up becomes unbounded-end sentinel
    - source or follow-up uses Integer.MAX_VALUE sentinel and assertion skips
  scenarios:
  - id: EMPTY_AT_LOWEST_VALID_EMPTY_POSITION
    category: BOUNDARY
    description: Empty range created at LocalDate.MIN.plusDays(2), the first location
      not forbidden for an empty range.
    preconditions:
    - Receiver is LocalDateRange.ofEmpty(LocalDate.MIN.plusDays(2)).
    - Source start equals source end and both equal LocalDate.MIN.plusDays(2).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a bounded 23-day range and returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_AT_LOW_DATE_BOUNDARY
    category: BOUNDARY
    description: Smallest ordinary bounded range immediately above the prohibited
      LocalDate.MIN and LocalDate.MIN.plusDays(1) end positions.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)).
    - Source range has exactly one day.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up remains bounded and returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_HALF_OPEN_TWENTY_THREE_DAYS
    category: NORMAL
    description: Ordinary half-open range whose length equals the transformation increment.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1,
      24)).
    - Source end is exactly 23 epoch-days after source start.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up returns 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_DATE_RANGE
    category: EDGE
    description: Date/date construction crossing leap day in leap year 2024.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 1)).
    - Source contains 2024-02-28 and 2024-02-29 only.
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up returns 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_CONSTRUCTION_ONE_MONTH_IN_LEAP_YEAR
    category: EDGE
    description: start-plus-Period construction where a calendar month corresponds
      to 29 whole days.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.of(2024, 2, 1), Period.ofMonths(1)).
    - Constructed end is LocalDate.of(2024, 3, 1).
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up returns 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLETON_RANGE
    category: NORMAL
    description: Closed-range construction of one included date, internally represented
      as a one-day half-open range.
    preconditions:
    - Receiver is LocalDateRange.ofClosed(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 15)).
    - Internal exclusive end is one day after the start.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_DATE_FORMAT
    category: NORMAL
    description: Parsed date/date text form, with the second date interpreted as the
      exclusive end.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-04-01/2024-04-11").
    - Parsed range has a 10-day half-open length.
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up returns 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_PERIOD_FORMAT
    category: NORMAL
    description: Parsed date/Period text form, exercising parsing of a period after
      the slash.
    preconditions:
    - Receiver is LocalDateRange.parse("2024-05-01/P7D").
    - Parsed end is seven days after parsed start.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_DATE_FORMAT
    category: NORMAL
    description: Parsed Period/date text form, exercising parsing of a period before
      the slash.
    preconditions:
    - Receiver is LocalDateRange.parse("P10D/2024-03-11").
    - Parsed start is LocalDate.of(2024, 3, 1) and parsed end is LocalDate.of(2024,
      3, 11).
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up returns 33.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: Range produced by from(Temporal) when the temporal supplies a LocalDate.
    preconditions:
    - Receiver is produced by LocalDateRange.from(LocalDate.of(2024, 7, 4)).
    - The resulting range is the one-day closed representation of that date.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: EDGE
    description: Range produced by from(Year) for leap year 2024.
    preconditions:
    - Receiver is produced by LocalDateRange.from(Year.of(2024)).
    - Resulting range spans 2024-01-01 through exclusive end 2025-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    - The follow-up returns 389.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEARMONTH
    category: EDGE
    description: Range produced by from(YearMonth) for February of a leap year.
    preconditions:
    - Receiver is produced by LocalDateRange.from(YearMonth.of(2024, 2)).
    - Resulting range spans all 29 days of February 2024.
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    - The follow-up returns 52.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR_FIRST_HALF
    category: NORMAL
    description: Range produced by from(YearHalf) for the first half of leap year
      2024.
    preconditions:
    - Receiver is produced by LocalDateRange.from for the YearHalf representing 2024-H1.
    - Resulting range spans 2024-01-01 through exclusive end 2024-07-01.
    expectedSourceBehavior:
    - lengthInDays() returns 182.
    - The follow-up returns 205.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR_FIRST_QUARTER
    category: NORMAL
    description: Range produced by from(YearQuarter) for the first quarter of leap
      year 2024.
    preconditions:
    - Receiver is produced by LocalDateRange.from for the YearQuarter representing
      2024-Q1.
    - Resulting range spans 2024-01-01 through exclusive end 2024-04-01.
    expectedSourceBehavior:
    - lengthInDays() returns 91.
    - The follow-up returns 114.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_ISO_YEAR_WEEK
    category: NORMAL
    description: Range produced by from(YearWeek), which spans Monday through the
      following Monday exclusively.
    preconditions:
    - Receiver is produced by LocalDateRange.from for a valid YearWeek not near LocalDate.MAX.
    - Resulting range covers exactly one ISO week.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_WITH_FINITE_END
    category: EDGE
    description: Range unbounded at the start but with a finite end sufficiently below
      LocalDate.MAX for follow-up generation.
    preconditions:
    - Receiver is LocalDateRange.ofUnboundedStart(LocalDate.of(2000, 1, 1)).
    - Source start equals LocalDate.MIN and source end is not LocalDate.MAX.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range sentinel.
    - The follow-up remains unbounded at the start and the relation assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_DATE_FOLLOW_UP_STAYS_BOUNDED
    category: BOUNDARY
    description: One-day bounded range whose end is LocalDate.MAX.minusDays(24), so
      adding 23 days reaches MAX.minusDays(1) without becoming unbounded.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24)).
    - Source end equals LocalDate.MAX.minusDays(24).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up remains bounded and returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_DATE_FOLLOW_UP_BECOMES_UNBOUNDED_END
    category: BOUNDARY
    description: One-day bounded range whose end is exactly LocalDate.MAX.minusDays(23),
      the largest source end for which plusDays(23) is defined.
    preconditions:
    - Receiver is LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23)).
    - Source end equals LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - Follow-up end becomes LocalDate.MAX, so follow-up lengthInDays() returns Integer.MAX_VALUE
      and the relation assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_TWENTY_FOUR
    category: BOUNDARY
    description: Largest finite length for which both source and follow-up outputs
      remain strictly below Integer.MAX_VALUE.
    preconditions:
    - Let d be LocalDate.MIN.plusDays(2).
    - Receiver is LocalDateRange.of(d, d.plusDays(Integer.MAX_VALUE - 24L)).
    - Source duration is exactly Integer.MAX_VALUE minus 24 days.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 24.
    - The follow-up returns Integer.MAX_VALUE minus 1, so the asserted increase is
      exactly 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_TWENTY_THREE
    category: BOUNDARY
    description: Finite range whose follow-up length reaches Integer.MAX_VALUE exactly.
    preconditions:
    - Let d be LocalDate.MIN.plusDays(2).
    - Receiver is LocalDateRange.of(d, d.plusDays(Integer.MAX_VALUE - 23L)).
    - Source duration is exactly Integer.MAX_VALUE minus 23 days.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 23.
    - The follow-up returns Integer.MAX_VALUE, causing the relation assertion to skip.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_ONE
    category: BOUNDARY
    description: Finite range immediately below the maximum int result, whose extended
      real duration exceeds the representable finite result.
    preconditions:
    - Let d be LocalDate.MIN.plusDays(2).
    - Receiver is LocalDateRange.of(d, d.plusDays(Integer.MAX_VALUE - 1L)).
    - Source duration is exactly Integer.MAX_VALUE minus 1 days.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 1.
    - The follow-up returns Integer.MAX_VALUE and the relation assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_VALUE
    category: BOUNDARY
    description: Bounded range whose actual day count is exactly Integer.MAX_VALUE.
    preconditions:
    - Let d be LocalDate.MIN.plusDays(2).
    - Receiver is LocalDateRange.of(d, d.plusDays((long) Integer.MAX_VALUE)).
    - Source duration is exactly Integer.MAX_VALUE days and neither endpoint is an
      unbounded sentinel endpoint.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - Although bounded, this equals the relation's sentinel value, so the relation
      assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_ABOVE_INTEGER_MAX_VALUE
    category: EDGE
    description: Bounded range with a real whole-day length greater than Integer.MAX_VALUE.
    preconditions:
    - Let d be LocalDate.MIN.plusDays(2).
    - Receiver is LocalDateRange.of(d, d.plusDays(((long) Integer.MAX_VALUE) + 1L)).
    - Source duration is Integer.MAX_VALUE plus 1 days.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE rather than a larger int value.
    - The relation assertion skips because the source output is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
