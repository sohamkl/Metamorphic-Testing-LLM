InputDomain:
  summary: Non-null Temporal endpoint pairs for which day addition and ChronoUnit.DAYS.between
    succeed before and after a 37-day shift, with the day count representable as int;
    coverage spans zero, positive, negative, truncation, calendar boundaries, time
    zones, chronologies, and int-result limits.
  globalConstraints:
  - Both source endpoints are non-null instances of java.time.temporal.Temporal.
  - Each endpoint supports plus(37, ChronoUnit.DAYS) without DateTimeException, UnsupportedTemporalTypeException,
    ArithmeticException, or temporal-range overflow.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) completes successfully
    for the source pair and for the pair obtained by adding 37 days to both endpoints.
  - Each source and follow-up ChronoUnit.DAYS.between result is in the inclusive range
    Integer.MIN_VALUE through Integer.MAX_VALUE, because Days.between applies Math.toIntExact.
  - Endpoint types, chronologies, offsets, and zones may differ when their implementations
    accept the other endpoint in ChronoUnit.DAYS.between; they are not required to
    be the same concrete Temporal type.
  - Supported custom Temporal implementations are admissible when they satisfy all
    operational constraints; the domain is not limited to the named standard Java
    temporal classes.
  - Temporals that do not support DAYS, null endpoints, incompatible endpoint pairs,
    out-of-range 37-day shifts, and day counts outside int range are excluded because
    the supplied MR requires successful source and follow-up Days outputs rather than
    invalid-input behavior.
  - Expected counts use the semantics of ChronoUnit.DAYS.between implemented by the
    endpoint Temporal, including its whole-day truncation, chronology, offset, and
    zone rules; no fixed-duration business rule is imposed on date-based temporals.
  diversity:
    temporalFamily:
    - LocalDate
    - LocalDateTime
    - Instant
    - OffsetDateTime
    - ZonedDateTime
    - JapaneseDate
    - HijrahDate
    - MinguoDate
    - ThaiBuddhistDate
    - compatible_custom_Temporal
    resultClass:
    - zero
    - one_singleton_path
    - positive_general
    - negative_general
    - Integer.MAX_VALUE
    - Integer.MIN_VALUE
    direction:
    - equal_endpoints
    - end_after_start
    - end_before_start
    subDayRelation:
    - no_time_component
    - less_than_one_day
    - exactly_one_day
    - whole_days_with_remainder
    calendarBoundary:
    - ordinary_day
    - week_multiple
    - month_end
    - common_February
    - leap_day
    - year_end
    offsetZoneRelation:
    - same_offset
    - different_offset
    - same_zone
    - different_zone
    - spring_DST_gap
    - autumn_DST_overlap
    chronologyRelation:
    - ISO
    - Japanese
    - Hijrah
    - Minguo
    - ThaiBuddhist
    - compatible_mixed_chronology
  scenarios:
  - id: EQUAL_LOCAL_DATES_ZERO
    category: EDGE
    description: Both endpoints are the same LocalDate, exercising Days.of(0) and
      the ZERO result path.
    preconditions:
    - startDateInclusive and endDateExclusive are equal LocalDate values.
    - The date is at least 37 days below LocalDate.MAX.
    expectedSourceBehavior:
    - Days.between returns a non-null Days whose getAmount() is 0.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EQUAL_INSTANTS_ZERO
    category: EDGE
    description: Both endpoints are the same Instant, covering zero on a time-line
      temporal rather than a calendar date.
    preconditions:
    - startDateInclusive and endDateExclusive are equal Instant values.
    - Adding 37 days remains in the Instant range.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_FORWARD
    category: BOUNDARY
    description: The end date is exactly one calendar day after the start, exercising
      Days.of(1) and the ONE result path.
    preconditions:
    - Both endpoints are compatible date-based temporals.
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is exactly 1.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ONE_DAY_BACKWARD
    category: BOUNDARY
    description: The end date is exactly one day before the start, covering the smallest-magnitude
      negative result.
    preconditions:
    - Both endpoints are compatible day-supporting temporals.
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is exactly -1.
    expectedSourceBehavior:
    - The returned getAmount() is -1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: GAP_EQUALS_METAMORPHIC_SHIFT
    category: NORMAL
    description: The source gap itself has magnitude 37, independently exercising
      positive and negative gaps equal to the MR shift.
    preconditions:
    - The source day count is either 37 or -37.
    expectedSourceBehavior:
    - The returned getAmount() equals the selected signed source gap.
    targetCases: 2
    emptyOutputAllowed: false
  - id: GENERAL_POSITIVE_GAP
    category: NORMAL
    description: A positive non-sentinel, non-unit day count exercises the general
      Days allocation path.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is between 2 and
      10000 inclusive.
    - The selected value is not 7, 37, or a calendar-boundary case covered separately.
    expectedSourceBehavior:
    - The returned getAmount() equals the positive ChronoUnit.DAYS count.
    - The result is neither zero nor negative.
    targetCases: 2
    emptyOutputAllowed: false
  - id: GENERAL_NEGATIVE_GAP
    category: NORMAL
    description: A negative non-unit day count covers directed intervals where the
      end precedes the start.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is between -10000
      and -2 inclusive.
    - The selected value is not -7 or -37 and is not a separately covered boundary
      case.
    expectedSourceBehavior:
    - The returned getAmount() equals the negative ChronoUnit.DAYS count.
    targetCases: 2
    emptyOutputAllowed: false
  - id: EXACT_WEEK_MULTIPLE
    category: NORMAL
    description: A date interval is an exact nonzero multiple of seven days.
    preconditions:
    - The endpoints are compatible date-based temporals.
    - The source day count is 7 or 14.
    expectedSourceBehavior:
    - The returned amount is exactly 7 or 14, with no conversion to a separate week
      unit.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_END_CROSSING
    category: BOUNDARY
    description: A short LocalDate interval crosses from the final day of a month
      into the next month.
    preconditions:
    - The start is the final valid day of a month.
    - The end is one or more days later in the immediately following month.
    - The interval does not use February, which is covered separately.
    expectedSourceBehavior:
    - The returned amount equals the epoch-day difference despite the month change.
    targetCases: 2
    emptyOutputAllowed: false
  - id: COMMON_YEAR_FEBRUARY_BOUNDARY
    category: BOUNDARY
    description: A LocalDate interval crosses February 28 in a non-leap year.
    preconditions:
    - The endpoints lie in a common year and straddle the February-to-March boundary.
    - The source day count is known from the endpoint epoch-day difference.
    expectedSourceBehavior:
    - The returned amount equals that epoch-day difference and does not account for
      a February 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_INTERVAL
    category: BOUNDARY
    description: A LocalDate interval includes or directly crosses February 29 in
      a leap year.
    preconditions:
    - The selected year contains February 29.
    - At least one endpoint or an included day is February 29.
    expectedSourceBehavior:
    - The returned amount includes the leap day in the LocalDate epoch-day difference.
    targetCases: 2
    emptyOutputAllowed: false
  - id: YEAR_END_CROSSING
    category: BOUNDARY
    description: A LocalDate interval crosses December 31 to January 1.
    preconditions:
    - The start and end are in adjacent ISO years.
    - The source interval is nonzero and remains valid after adding 37 days.
    expectedSourceBehavior:
    - The returned amount equals the whole calendar-day difference across the year
      boundary.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_SUBDAY_SAME_DATE
    category: EDGE
    description: Two LocalDateTime values on the same date differ in time but by less
      than 24 hours.
    preconditions:
    - The endpoints have the same LocalDate component.
    - Their times differ and the absolute elapsed duration is less than 24 hours.
    expectedSourceBehavior:
    - The returned getAmount() is 0 because no whole day is counted.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_CROSS_MIDNIGHT_SUBDAY
    category: EDGE
    description: A LocalDateTime interval crosses midnight but is shorter than one
      whole day.
    preconditions:
    - The end is after the start.
    - The endpoints have different dates and elapsed time is greater than 0 but less
      than 24 hours.
    expectedSourceBehavior:
    - The returned getAmount() is 0, demonstrating whole-day truncation rather than
      date-label subtraction.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: Two LocalDateTime values are exactly 24 hours apart with matching
      local times.
    preconditions:
    - endDateExclusive equals startDateInclusive plus exactly one day.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_DAY_WITH_REMAINDER
    category: EDGE
    description: A LocalDateTime interval contains whole days plus a nonzero sub-day
      remainder.
    preconditions:
    - The positive elapsed interval is greater than 24 hours and less than 72 hours.
    - The endpoint local times differ.
    expectedSourceBehavior:
    - The result is the Temporal's whole-day count, with the partial-day remainder
      omitted.
    targetCases: 2
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_NEGATIVE_TRUNCATION
    category: EDGE
    description: A negative LocalDateTime interval covers truncation toward zero for
      sub-day and day-plus-remainder magnitudes.
    preconditions:
    - The end precedes the start.
    - Select one interval with magnitude below 24 hours and one with magnitude strictly
      between 24 and 48 hours.
    expectedSourceBehavior:
    - The below-24-hour case returns 0.
    - The day-plus-remainder case returns -1.
    targetCases: 2
    emptyOutputAllowed: false
  - id: NANOSECOND_BELOW_WHOLE_DAY
    category: BOUNDARY
    description: A LocalDateTime interval ends one nanosecond short of a whole day.
    preconditions:
    - The positive interval is exactly 24 hours minus one nanosecond.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_SUBDAY
    category: EDGE
    description: Two Instant values have a nonzero elapsed duration below 86400 seconds.
    preconditions:
    - The end is after the start by at least one nanosecond and less than one ChronoUnit
      day.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_86400_SECONDS
    category: BOUNDARY
    description: Two Instant values differ by exactly one ChronoUnit day.
    preconditions:
    - The end is exactly 86400 seconds after the start.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_MULTI_DAY
    category: NORMAL
    description: An Instant end precedes its start by multiple complete 86400-second
      days.
    preconditions:
    - The elapsed difference from start to end is an exact negative multiple of 86400
      seconds.
    - The magnitude is at least two days.
    expectedSourceBehavior:
    - The returned amount is that negative whole-day multiple.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET
    category: NORMAL
    description: OffsetDateTime endpoints use the same offset, with both integral-day
      and partial-day intervals represented.
    preconditions:
    - Both endpoints have the same ZoneOffset.
    - One case has an exact whole-day interval and one has a nonzero sub-day remainder.
    expectedSourceBehavior:
    - The returned amount equals OffsetDateTime's whole-day count at the common offset.
    targetCases: 2
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_DIFFERENT_OFFSETS_SAME_INSTANT
    category: EDGE
    description: OffsetDateTime endpoints denote the same instant using different
      offsets.
    preconditions:
    - The endpoints have unequal ZoneOffset values.
    - Their represented instants are equal.
    expectedSourceBehavior:
    - The returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_LOCAL_DIFFERENT_OFFSETS
    category: EDGE
    description: OffsetDateTime endpoints have equal local date-times but different
      offsets producing a sub-day instant displacement.
    preconditions:
    - The local date-time fields are equal.
    - The offsets differ by less than 24 hours.
    expectedSourceBehavior:
    - The returned getAmount() is 0 because the normalized displacement contains no
      whole day.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_ORDINARY_DAY
    category: NORMAL
    description: ZonedDateTime endpoints in one zone span a day without crossing an
      offset transition.
    preconditions:
    - Both endpoints use the same ZoneId.
    - No zone-offset transition occurs in the interval.
    - The local date-times are exactly one day apart.
    expectedSourceBehavior:
    - The returned getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST
    category: EDGE
    description: Same-zone ZonedDateTime endpoints cross a spring daylight-saving
      gap.
    preconditions:
    - The ZoneId has a forward offset transition in the selected interval.
    - The endpoints use the same valid local time on consecutive local dates around
      the transition.
    expectedSourceBehavior:
    - The returned getAmount() is 1 even when the corresponding elapsed duration is
      23 hours.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_AUTUMN_DST
    category: EDGE
    description: Same-zone ZonedDateTime endpoints cross an autumn daylight-saving
      overlap.
    preconditions:
    - The ZoneId has a backward offset transition in the selected interval.
    - The endpoints use the same valid local time on consecutive local dates around
      the transition.
    expectedSourceBehavior:
    - The returned getAmount() is 1 even when the corresponding elapsed duration is
      25 hours.
    targetCases: 2
    emptyOutputAllowed: false
  - id: DIFFERENT_ZONES_SAME_INSTANT
    category: EDGE
    description: ZonedDateTime endpoints represent the same instant in different zones,
      allowing the MR to exercise independent local-day shifts.
    preconditions:
    - The endpoints have different ZoneId values.
    - They represent the same instant.
    - The pair remains mutually acceptable to ChronoUnit.DAYS.between after both 37-day
      additions.
    expectedSourceBehavior:
    - The source returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_GAP
    category: NORMAL
    description: JapaneseDate endpoints cover a nonzero interval using a non-ISO chronology
      implementation.
    preconditions:
    - Both endpoints are JapaneseDate values.
    - Their epoch-day difference is nonzero and representable as int.
    expectedSourceBehavior:
    - The returned amount equals the signed epoch-day difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_MONTH_BOUNDARY
    category: BOUNDARY
    description: HijrahDate endpoints cross a Hijrah month boundary.
    preconditions:
    - Both endpoints are HijrahDate values.
    - The start and end have different Hijrah month fields and a known nonzero epoch-day
      difference.
    expectedSourceBehavior:
    - The returned amount equals the signed epoch-day difference rather than assuming
      an ISO month length.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_GAP
    category: NORMAL
    description: MinguoDate endpoints provide a nonzero positive day interval.
    preconditions:
    - Both endpoints are MinguoDate values.
    - Their epoch-day difference is between 2 and 100 inclusive.
    expectedSourceBehavior:
    - The returned getAmount() equals that positive epoch-day difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_NEGATIVE_GAP
    category: NORMAL
    description: ThaiBuddhistDate endpoints provide a directed negative interval.
    preconditions:
    - Both endpoints are ThaiBuddhistDate values.
    - The end has an earlier epoch day than the start.
    expectedSourceBehavior:
    - The returned getAmount() is the negative epoch-day difference.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMPATIBLE_MIXED_CHRONOLOGY_SAME_DAY
    category: EDGE
    description: Two accepted chronology-specific date temporals denote the same epoch
      day while having different concrete types.
    preconditions:
    - The endpoint concrete types or chronologies differ.
    - They denote the same epoch day.
    - The start temporal accepts the end temporal for DAYS.between before and after
      the shift.
    expectedSourceBehavior:
    - The source returned getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_INT_DAY_COUNT
    category: BOUNDARY
    description: A very wide supported date or time-line interval produces the largest
      count accepted by Math.toIntExact.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is exactly 2147483647.
    - Both endpoints still permit addition of 37 days.
    expectedSourceBehavior:
    - Days.between succeeds and getAmount() is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_INT_DAY_COUNT
    category: BOUNDARY
    description: A very wide reversed interval produces the smallest count accepted
      by Math.toIntExact.
    preconditions:
    - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) is exactly -2147483648.
    - Both endpoints still permit addition of 37 days.
    expectedSourceBehavior:
    - Days.between succeeds and getAmount() is Integer.MIN_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
