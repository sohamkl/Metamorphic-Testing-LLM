InputDomain:
  summary: Finite IEEE-754 double longitudes. Each follow-up is formed by Java double
    evaluation of lon_deg + 360.0. Source cases cover the in-range identity path and
    every out-of-range normalization return path, including inclusive endpoints, signed
    zero, exact antimeridian sentinel values, adjacent boundaries, multi-turn fractional
    residues, and large finite floating-point addition regimes.
  globalConstraints:
  - 'Source input is finite: Double.isFinite(lon_deg) is true. NaN and infinities
    are excluded because the stated metamorphic relation requires a longitude denoting
    a globe position.'
  - Follow-up input is computed as the Java double expression lon_deg + 360.0.
  - The metamorphic assertion compares longitude-location equivalence after normalization,
    treating -180.0 and 180.0 as equivalent endpoint representations.
  diversity:
    sourceExecutionPath:
    - '4'
    - Distinct source control-flow outcomes in normLonDEG
    - in-range identity; off less than zero; off equals zero with positive source;
      final -180 plus off
    boundaryPosition:
    - '12'
    - Exact endpoints and adjacent representable values around normalization discontinuities
    - -180.0; 180.0; nextDown(-180.0); nextUp(180.0); -360.0; 360.0; nextDown(360.0);
      nextUp(360.0); -540.0; 540.0; nextDown(540.0); nextUp(540.0)
    residueAndSign:
    - '6'
    - Out-of-range exact-cycle and non-zero remainder positions
    - negative full turn; positive full turn; negative antimeridian; positive antimeridian;
      positive fractional residue; negative fractional residue
    floatingPointAdditionRegime:
    - '8'
    - Finite magnitudes where adding 360 is exact, rounded, or unchanged
    - positive and negative 2^52; positive and negative 2^53; positive and negative
      2^60; Double.MAX_VALUE; -Double.MAX_VALUE
  scenarios:
  - id: NEGATIVE_ZERO_IDENTITY
    category: BOUNDARY
    description: Source is negative signed zero within the inclusive identity interval.
    preconditions:
    - Double.doubleToRawLongBits(lon_deg) equals 0x8000000000000000L.
    expectedSourceBehavior:
    - normLonDEG returns lon_deg through the inclusive in-range return.
    - The returned result has negative-zero raw bits because the identity path performs
      no arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ZERO_IDENTITY
    category: BOUNDARY
    description: Source is positive zero within the inclusive identity interval.
    preconditions:
    - Double.doubleToRawLongBits(lon_deg) equals 0x0000000000000000L.
    expectedSourceBehavior:
    - normLonDEG returns lon_deg through the inclusive in-range return.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_SUBNORMAL_IN_RANGE
    category: EDGE
    description: Source is the smallest positive representable double in the identity
      interval.
    preconditions:
    - lon_deg equals Double.MIN_VALUE.
    expectedSourceBehavior:
    - normLonDEG returns Double.MIN_VALUE directly.
    - The Java follow-up lon_deg + 360.0 equals 360.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_SUBNORMAL_IN_RANGE
    category: EDGE
    description: Source is the smallest-magnitude negative representable double in
      the identity interval.
    preconditions:
    - lon_deg equals -Double.MIN_VALUE.
    expectedSourceBehavior:
    - normLonDEG returns -Double.MIN_VALUE directly.
    - The Java follow-up lon_deg + 360.0 equals 360.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_INTERIOR_IDENTITY
    category: NORMAL
    description: Source is a negative fractional longitude strictly inside the documented
      range.
    preconditions:
    - lon_deg equals -12.5.
    expectedSourceBehavior:
    - normLonDEG returns -12.5 through the in-range identity path.
    - The follow-up is 347.5 and requires remainder normalization.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_INTERIOR_IDENTITY
    category: NORMAL
    description: Source is a positive fractional longitude strictly inside the documented
      range.
    preconditions:
    - lon_deg equals 12.5.
    expectedSourceBehavior:
    - normLonDEG returns 12.5 through the in-range identity path.
    - The follow-up is 372.5 and requires remainder normalization.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_INCLUSIVE_ENDPOINT
    category: BOUNDARY
    description: Source is the documented inclusive lower endpoint.
    preconditions:
    - lon_deg equals -180.0.
    expectedSourceBehavior:
    - normLonDEG returns -180.0 through the in-range identity path.
    - The follow-up is 180.0, also returned directly; the two endpoint results represent
      the same location.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_INCLUSIVE_ENDPOINT
    category: BOUNDARY
    description: Source is the documented inclusive upper endpoint.
    preconditions:
    - lon_deg equals 180.0.
    expectedSourceBehavior:
    - normLonDEG returns 180.0 through the in-range identity path.
    - The follow-up is 540.0 and reaches the positive exact-cycle sentinel branch.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_LOWER_ENDPOINT
    category: BOUNDARY
    description: Source is the representable double immediately below -180.0.
    preconditions:
    - lon_deg equals Math.nextDown(-180.0).
    expectedSourceBehavior:
    - normLonDEG does not use the in-range identity path.
    - off is negative, so the off less than zero branch returns a longitude near 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_UPPER_ENDPOINT
    category: BOUNDARY
    description: Source is the representable double immediately above 180.0.
    preconditions:
    - lon_deg equals Math.nextUp(180.0).
    expectedSourceBehavior:
    - normLonDEG does not use the in-range identity path.
    - off is positive and non-zero, so the final -180 plus off branch returns a longitude
      near -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ONE_TURN
    category: NORMAL
    description: Source is exactly one negative full turn from zero.
    preconditions:
    - lon_deg equals -360.0.
    expectedSourceBehavior:
    - normLonDEG enters remainder normalization.
    - off equals -180.0, so the off less than zero branch returns zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ONE_TURN
    category: NORMAL
    description: Source is exactly one positive full turn from zero.
    preconditions:
    - lon_deg equals 360.0.
    expectedSourceBehavior:
    - normLonDEG enters remainder normalization.
    - off equals 180.0, so the final -180 plus off branch returns zero.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_POSITIVE_ONE_TURN
    category: BOUNDARY
    description: Source is immediately below 360.0.
    preconditions:
    - lon_deg equals Math.nextDown(360.0).
    expectedSourceBehavior:
    - normLonDEG uses the final -180 plus off branch.
    - The normalized result is near zero on the negative side.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_POSITIVE_ONE_TURN
    category: BOUNDARY
    description: Source is immediately above 360.0.
    preconditions:
    - lon_deg equals Math.nextUp(360.0).
    expectedSourceBehavior:
    - normLonDEG uses the final -180 plus off branch.
    - The normalized result is near zero on the positive side.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ANTIMERIDIAN_MULTI_TURN
    category: EDGE
    description: Source is a negative multi-turn representation of the antimeridian.
    preconditions:
    - lon_deg equals -540.0.
    expectedSourceBehavior:
    - normLonDEG enters remainder normalization.
    - off is zero, lon_deg is not positive, and the final branch returns -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ANTIMERIDIAN_MULTI_TURN
    category: EDGE
    description: Source is a positive multi-turn representation of the antimeridian.
    preconditions:
    - lon_deg equals 540.0.
    expectedSourceBehavior:
    - normLonDEG enters remainder normalization.
    - off equals zero and lon_deg is positive, so the positive exact-cycle sentinel
      branch returns 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_POSITIVE_ANTIMERIDIAN_CYCLE
    category: BOUNDARY
    description: Source is immediately below the positive exact-cycle antimeridian
      sentinel.
    preconditions:
    - lon_deg equals Math.nextDown(540.0).
    expectedSourceBehavior:
    - off is non-zero, so the positive exact-cycle sentinel is not selected.
    - The final -180 plus off branch returns a longitude near 180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_ABOVE_POSITIVE_ANTIMERIDIAN_CYCLE
    category: BOUNDARY
    description: Source is immediately above the positive exact-cycle antimeridian
      sentinel.
    preconditions:
    - lon_deg equals Math.nextUp(540.0).
    expectedSourceBehavior:
    - off is non-zero, so the positive exact-cycle sentinel is not selected.
    - The final -180 plus off branch returns a longitude near -180.0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_MULTI_TURN_FRACTIONAL_RESIDUE
    category: NORMAL
    description: Source is a positive longitude several turns outside range with a
      non-zero fractional residue.
    preconditions:
    - lon_deg equals 1234.5.
    expectedSourceBehavior:
    - normLonDEG uses positive remainder normalization.
    - The final -180 plus off branch returns an in-range longitude.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_MULTI_TURN_FRACTIONAL_RESIDUE
    category: NORMAL
    description: Source is a negative longitude several turns outside range with a
      non-zero fractional residue.
    preconditions:
    - lon_deg equals -1234.5.
    expectedSourceBehavior:
    - normLonDEG uses negative remainder normalization.
    - The off less than zero branch returns an in-range longitude.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_EXACT_ADDITION_AT_2_POW_52
    category: EDGE
    description: Source is positive 2^52, where adding 360.0 remains exactly representable.
    preconditions:
    - lon_deg equals 4503599627370496.0.
    expectedSourceBehavior:
    - normLonDEG uses positive remainder normalization.
    - The follow-up differs from the source by exactly 360.0 as a double.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_EXACT_ADDITION_AT_2_POW_52
    category: EDGE
    description: Source is negative 2^52, where adding 360.0 remains exactly representable.
    preconditions:
    - lon_deg equals -4503599627370496.0.
    expectedSourceBehavior:
    - normLonDEG uses negative remainder normalization.
    - The follow-up differs from the source by exactly 360.0 as a double.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_TWO_UNIT_ULP_AT_2_POW_53
    category: EDGE
    description: Source is positive 2^53, where adjacent doubles are separated by
      two units.
    preconditions:
    - lon_deg equals 9007199254740992.0.
    expectedSourceBehavior:
    - normLonDEG uses positive remainder normalization.
    - The follow-up is finite and distinct from the source.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_TWO_UNIT_ULP_AT_2_POW_53
    category: EDGE
    description: Source is negative 2^53, where adjacent doubles are separated by
      two units.
    preconditions:
    - lon_deg equals -9007199254740992.0.
    expectedSourceBehavior:
    - normLonDEG uses negative remainder normalization.
    - The follow-up is finite and distinct from the source.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POSITIVE_ROUNDED_ADDITION_AT_2_POW_60
    category: EDGE
    description: Source is positive 2^60, where the double spacing exceeds 360.0.
    preconditions:
    - lon_deg equals 1.15292150460684698E18.
    expectedSourceBehavior:
    - normLonDEG uses positive remainder normalization.
    - The Java follow-up is finite but cannot represent the exact mathematical increment
      of 360 degrees.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_ROUNDED_ADDITION_AT_2_POW_60
    category: EDGE
    description: Source is negative 2^60, where the double spacing exceeds 360.0.
    preconditions:
    - lon_deg equals -1.15292150460684698E18.
    expectedSourceBehavior:
    - normLonDEG uses negative remainder normalization.
    - The Java follow-up is finite but cannot represent the exact mathematical increment
      of 360 degrees.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_FINITE_POSITIVE_NOOP_ADDITION
    category: EDGE
    description: Source is the greatest finite double, for which adding 360.0 does
      not change the double value.
    preconditions:
    - lon_deg equals Double.MAX_VALUE.
    expectedSourceBehavior:
    - normLonDEG enters positive remainder normalization and returns a finite in-range
      result.
    - lon_deg + 360.0 equals lon_deg under Java double arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAX_FINITE_NEGATIVE_NOOP_ADDITION
    category: EDGE
    description: Source is the least finite double, for which adding 360.0 does not
      change the double value.
    preconditions:
    - lon_deg equals -Double.MAX_VALUE.
    expectedSourceBehavior:
    - normLonDEG enters negative remainder normalization and returns a finite in-range
      result.
    - lon_deg + 360.0 equals lon_deg under Java double arithmetic.
    targetCases: 1
    emptyOutputAllowed: false
