InputDomain:
  summary: Finite, non-geodetic Cartesian circles and rectangles exercised across
    CircleImpl.relate(Rectangle)'s empty, bounding-box shortcut, identity, axis-location,
    closest-point, and farthest-point paths; every source case is followed by the
    fixed joint translation (+17.5, -9.25) and must preserve the returned SpatialRelation.
  globalConstraints:
  - Use one flat, non-geodetic SpatialContext for the CircleImpl, its center, the
    source rectangle, and the generated follow-up shapes.
  - Use finite coordinates and finite radius values, with coordinate magnitudes small
    enough that adding SHIFT_X = 17.5 and SHIFT_Y = -9.25 remains finite.
  - For non-empty rectangles, require minX <= maxX and minY <= maxY.
  - Use radius values >= 0; negative, infinite, and NaN radii are excluded because
    the supplied constructor states that parameter validation is assumed to have occurred
    and the metamorphic relation does not request invalid inputs.
  - The source rectangle must be representable by the supplied Rectangle API and the
    follow-up rectangle must be constructible by RectangleImpl using the translated
    bounds.
  - For every case, invoke CircleImpl.relate(Rectangle) directly and compare its result
    with the follow-up result using identity equality of the SpatialRelation enum.
  diversity:
    coordinateGeometry:
    - circle bounding box disjoint from rectangle
    - circle bounding box strictly within rectangle
    - circle bounding box equal to rectangle
    - circle bounding box contains rectangle
    - circle bounding box intersects rectangle
    - rectangle degenerate to a point
    - rectangle degenerate to a vertical segment
    - rectangle degenerate to a horizontal segment
    axisLocation:
    - circle x-axis left of rectangle
    - circle x-axis right of rectangle
    - circle x-axis inside rectangle
    - circle y-axis below rectangle
    - circle y-axis above rectangle
    - circle y-axis inside rectangle
    - both axes outside rectangle
    distanceBoundary:
    - closest rectangle point strictly outside circle
    - closest rectangle point exactly on circle
    - farthest rectangle point strictly inside circle
    - farthest rectangle point exactly on circle
    - farthest rectangle point outside circle
    circleState:
    - non-empty positive-radius circle
    - zero-radius circle
    - empty-center circle
    sourceBranch:
    - empty enclosing-box shortcut
    - DISJOINT bounding-box shortcut
    - WITHIN bounding-box shortcut
    - equal-bounding-box identity shortcut
    - phase-two intersection result
    - phase-two containment result
  scenarios:
  - id: EMPTY_CIRCLE
    category: EDGE
    description: Construct a CircleImpl with an empty center point, causing the constructor
      to assign NaN radius state and an all-NaN enclosing box; use a finite non-empty
      rectangle.
    preconditions:
    - circle.getCenter().isEmpty() is true.
    - rectangle is non-empty with finite ordered bounds.
    expectedSourceBehavior:
    - The target returns a SpatialRelation from the enclosing-box relation without
      invoking ordinary finite-distance geometry.
    - The translated empty-center circle and translated rectangle produce the same
      SpatialRelation.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_HORIZONTAL
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [6,7] x [-1,1], so the
      circle bounding box and rectangle are disjoint horizontally.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = 6, maxX = 7, minY = -1, maxY = 1.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(Rectangle) returns DISJOINT through its bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_VERTICAL
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [-1,1] x [6,7], so the
      circle bounding box and rectangle are disjoint vertically.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = -1, maxX = 1, minY = 6, maxY = 7.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is DISJOINT.
    - relate(Rectangle) returns DISJOINT without entering relateRectanglePhase2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_WITHIN_RECTANGLE
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [-6,6] x [-6,6], which
      strictly contains the circle's enclosing box.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX < -5, maxX > 5, minY < -5, and maxY > 5.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is WITHIN.
    - relate(Rectangle) returns WITHIN through the early bounding-box result.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EQUAL_ENCLOSING_BOX
    category: EDGE
    description: Use center (0,0), radius 5, and rectangle [-5,5] x [-5,5], exactly
      equal to the circle's enclosing box.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle bounds equal the four enclosing-box bounds exactly.
    expectedSourceBehavior:
    - The bounding-box relation reaches the equality identity check.
    - The target returns WITHIN rather than entering phase two.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_AND_CIRCLE_CONTAINS
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [-1,1] x [-1,1], which
      is strictly inside the enclosing box and inside the circle.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle bounds lie strictly inside [-5,5] on both axes.
    - the rectangle's farthest corner has distance less than 5 from the center.
    expectedSourceBehavior:
    - enclosingBox.relate(rectangle) is CONTAINS.
    - phase two accepts the farthest rectangle corner and returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_CONTAINS_RECTANGLE_BUT_CORNER_OUTSIDE
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [-4,4] x [-4,4], which
      is inside the enclosing box but has corners outside the circle.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle bounds lie within [-5,5].
    - the farthest rectangle corner has distance greater than 5.
    expectedSourceBehavior:
    - The bounding-box relation is CONTAINS, so phase two is entered.
    - The farthest-corner test fails and the target returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXIS_LEFT_OVERLAPPING
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [4,6] x [-1,1], placing
      the circle axis left of the rectangle while the y-axis lies inside it.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = 4 and maxX = 6, with minY <= 0 <= maxY.
    - the bounding boxes overlap.
    expectedSourceBehavior:
    - phase two takes the xAxis < minX branch and the y-axis-inside branch.
    - Because one axis is spanned, the closest-point disjoint shortcut is not taken;
      with bboxSect INTERSECTS, the result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXIS_RIGHT_OVERLAPPING
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [-6,-4] x [-1,1], placing
      the circle axis right of the rectangle while the y-axis lies inside it.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = -6 and maxX = -4, with minY <= 0 <= maxY.
    - the bounding boxes overlap.
    expectedSourceBehavior:
    - phase two takes the xAxis > maxX branch and the y-axis-inside branch.
    - The result is INTERSECTS because bboxSect is not CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXIS_BELOW_OVERLAPPING
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [-1,1] x [4,6], placing
      the circle y-axis below the rectangle while the x-axis lies inside it.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minY = 4 and maxY = 6, with minX <= 0 <= maxX.
    - the bounding boxes overlap.
    expectedSourceBehavior:
    - phase two takes the yAxis < minY branch and the x-axis-inside branch.
    - The result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: AXIS_ABOVE_OVERLAPPING
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [-1,1] x [-6,-4], placing
      the circle y-axis above the rectangle while the x-axis lies inside it.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minY = -6 and maxY = -4, with minX <= 0 <= maxX.
    - the bounding boxes overlap.
    expectedSourceBehavior:
    - phase two takes the yAxis > maxY branch and the x-axis-inside branch.
    - The result is INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_AXES_OUTSIDE_DISJOINT_CORNER
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [4,6] x [4,6], so both
      circle axes are outside the rectangle and its closest corner is outside the
      circle.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = 4, minY = 4, and both maximum bounds are 6.
    - the closest corner distance is greater than 5.
    - the bounding boxes overlap.
    expectedSourceBehavior:
    - phase two takes both outside-axis branches.
    - The closest-corner test returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_AXES_OUTSIDE_CORNER_INTERSECTION
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [3,6] x [3,6], so both
      axes are outside but the closest corner is inside the circle.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = 3 and minY = 3.
    - the closest corner distance is less than 5.
    - the bounding boxes overlap but the rectangle is not within the circle bounding
      box.
    expectedSourceBehavior:
    - phase two rejects the closest-corner DISJOINT result.
    - Because bboxSect is INTERSECTS, the target returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSEST_CORNER_TANGENCY
    category: BOUNDARY
    description: Use center (0,0), radius 5, and rectangle [3,4] x [4,5], whose closest
      corner (3,4) lies exactly on the circle.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - both circle axes are outside the rectangle.
    - 3^2 + 4^2 = 5^2.
    - the bounding boxes overlap.
    expectedSourceBehavior:
    - The closest-point contains test is exercised at its equality boundary.
    - The target does not return DISJOINT; with an intersecting bounding box it returns
      INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FAR_CORNER_STRICTLY_INSIDE
    category: NORMAL
    description: Use center (0,0), radius 5, and rectangle [-3,3] x [-3,3], whose
      farthest corner is strictly inside the circle.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - the rectangle is strictly contained by the circle's enclosing box.
    - the farthest corner distance is less than 5.
    expectedSourceBehavior:
    - The CONTAINS bounding-box path reaches the farthest-corner test.
    - The farthest-corner test succeeds and the target returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FAR_CORNER_TANGENCY
    category: BOUNDARY
    description: Use center (0,0), radius 5, and rectangle [-3,4] x [-3,4], whose
      farthest corner (4,3) lies exactly on the circle.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle bounds are within the enclosing box.
    - 3^2 + 4^2 = 5^2.
    expectedSourceBehavior:
    - The farthest-corner contains test is exercised at equality.
    - The target returns CONTAINS if the distance calculator treats the boundary as
      within, and the translated case must return the identical enum value.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_CORNER_OUTSIDE
    category: BOUNDARY
    description: Use center (0,0), radius 5, and rectangle [-3,4.1] x [-3,4], keeping
      the rectangle inside the enclosing box while moving its farthest corner just
      outside the circle.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - all rectangle bounds lie within [-5,5].
    - the farthest corner distance is greater than 5.
    expectedSourceBehavior:
    - The CONTAINS bounding-box path reaches the farthest-corner rejection.
    - The target returns INTERSECTS rather than CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FARTHEST_AXIS_TIE
    category: EDGE
    description: Use center (0,0), radius 5, and rectangle [-4,4] x [-1,1], forcing
      equal-distance choices in both farthest-coordinate ternary conditions.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = -4, maxX = 4, minY = -1, and maxY = 1.
    - the x and y distance comparisons used for farthest-point selection are equal.
    - the selected farthest corner remains inside the circle.
    expectedSourceBehavior:
    - The false side of both strict 'greater than' farthest-coordinate comparisons
      is exercised.
    - The target returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_POINT_WITHIN_RECTANGLE
    category: EDGE
    description: Use center (0,0), radius 0, and rectangle [-1,1] x [-1,1], reducing
      the enclosing box to a point strictly inside the rectangle.
    preconditions:
    - circle radius is exactly +0.0 and center is non-empty.
    - rectangle strictly contains the center point.
    expectedSourceBehavior:
    - The zero-radius enclosing-box path is exercised without using a negative or
      NaN radius.
    - The bounding-box relation is WITHIN and the target returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_EQUAL_DEGENERATE_RECTANGLE
    category: EDGE
    description: Use center (0,0), radius 0, and the degenerate rectangle [0,0] x
      [0,0], equal to the point-sized enclosing box.
    preconditions:
    - circle radius is exactly +0.0 and center is non-empty.
    - rectangle minX = maxX = 0 and minY = maxY = 0.
    expectedSourceBehavior:
    - The equal-enclosing-box identity check is exercised for a zero-area circle.
    - The target returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_VERTICAL_RECTANGLE
    category: EDGE
    description: Use center (0,0), radius 5, and the vertical segment rectangle [3,3]
      x [-1,1], testing ordered bounds with zero width.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = maxX = 3 and minY = -1, maxY = 1.
    - the segment lies within the circle.
    expectedSourceBehavior:
    - The target handles a zero-width rectangle through the normal bounding-box and
      phase-two logic.
    - The source result is CONTAINS and the translated follow-up preserves it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEGENERATE_HORIZONTAL_RECTANGLE
    category: EDGE
    description: Use center (0,0), radius 5, and the horizontal segment rectangle
      [-1,1] x [3,3], testing ordered bounds with zero height.
    preconditions:
    - circle center is (0,0) and radius is 5.
    - rectangle minX = -1, maxX = 1 and minY = maxY = 3.
    - the segment lies within the circle.
    expectedSourceBehavior:
    - The target handles a zero-height rectangle through the normal bounding-box and
      phase-two logic.
    - The source result is CONTAINS and the translated follow-up preserves it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TRANSLATED_FINITE_EXTREME_COORDINATES
    category: BOUNDARY
    description: Use a finite non-empty circle and rectangle centered near a large
      but safe Cartesian coordinate, preserving a phase-two intersection after translation.
    preconditions:
    - circle center coordinates are (100000.0, -100000.0), radius is 5.
    - rectangle is [100004,100006] x [-100001,-99999].
    - all source and follow-up coordinates remain finite after adding (17.5,-9.25).
    expectedSourceBehavior:
    - The source exercises the same xAxis-outside/yAxis-inside intersection path as
      AXIS_LEFT_OVERLAPPING.
    - The fixed translation changes absolute coordinates but not the source relation.
    targetCases: 1
    emptyOutputAllowed: false
