InputDomain:
  summary: Valid LocalDateRange receivers whose end date can be advanced by the metamorphic
    transformation's fixed 23 days. The domain covers empty, finite, unbounded-start,
    near-minimum, near-maximum, leap-year, constructor, parser, and temporal-conversion
    paths while retaining observable int-valued length results for finite ranges.
  globalConstraints:
  - 'Every source receiver must be constructible by one of the supplied LocalDateRange
    construction paths and must satisfy the class invariants: end is on or after start,
    start is not LocalDate.MAX.minusDays(1), and end is neither LocalDate.MIN nor
    LocalDate.MIN.plusDays(1) when prohibited by the constructor.'
  - The source receiver must have getEnd().plusDays(23) representable as a LocalDate;
    therefore source getEnd() must be no later than LocalDate.MAX.minusDays(23).
  - The follow-up LocalDateRange.of(source.getStart(), source.getEnd().plusDays(23))
    must be constructible. This is ensured by the preceding end bound together with
    the source range invariants.
  - Unbounded-end source ranges are excluded because their getEnd() is LocalDate.MAX
    and the supplied follow-up generator calls LocalDate.MAX.plusDays(23), which cannot
    produce a follow-up input. This excludes ofUnbounded() and ofUnboundedEnd(...)
    for a generator failure reason, not because lengthInDays() lacks a sentinel path.
  - Finite scenarios use source lengths no greater than Integer.MAX_VALUE - 23 so
    both finite source and finite follow-up lengths remain representable by the int-valued
    metamorphic assertion. The source boundary at Integer.MAX_VALUE - 23 is included
    explicitly.
  - 'No invalid-input scenario is required: the supplied metamorphic relation transforms
    a valid LocalDateRange and does not request testing rejected construction arguments.'
  diversity:
    constructionPath:
    - of(LocalDate, LocalDate)
    - of(LocalDate, Period)
    - ofClosed(LocalDate, LocalDate)
    - ofEmpty(LocalDate)
    - ofUnboundedStart(LocalDate)
    - parse(date/date)
    - parse(date/period)
    - parse(period/date)
    - from(LocalDate)
    - from(Year)
    - from(YearMonth)
    - from(YearHalf)
    - from(YearQuarter)
    - from(YearWeek)
    lengthClass:
    - zero
    - one day
    - 23 days
    - 24 days
    - ordinary positive finite length
    - leap-day-spanning length
    - Integer.MAX_VALUE - 23 days
    - unbounded sentinel
    endpointCondition:
    - ordinary interior dates
    - start at LocalDate.MIN
    - end at LocalDate.MIN.plusDays(2)
    - follow-up end equals LocalDate.MAX
    - follow-up remains finite
    relationOutcome:
    - finite follow-up increases by exactly 23
    - source and follow-up are both unbounded-start sentinel cases
    - follow-up becomes unbounded-end sentinel and assertion skips arithmetic
  scenarios:
  - id: EMPTY_INTERIOR_HALF_OPEN_RANGE
    category: NORMAL
    description: A valid empty half-open range at an ordinary interior date.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024, 6,
      15))
    - source.getStart().equals(source.getEnd())
    - source.lengthInDays() is 0
    expectedSourceBehavior:
    - lengthInDays() returns 0
    - follow-up construction succeeds with the same start and an end 23 days later
    - follow-up length is 23 and the asserted increase is exactly 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: The smallest non-empty ordinary bounded half-open range.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024, 6,
      16))
    - source.lengthInDays() is 1
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up length is 24
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACTLY_23_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: A finite range whose source length equals the transformation amount.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1,
      24))
    - source.lengthInDays() is 23
    expectedSourceBehavior:
    - lengthInDays() returns 23
    - follow-up length is 46
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_FOUR_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: A range just beyond the 23-day transformation amount.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1,
      25))
    - source.lengthInDays() is 24
    expectedSourceBehavior:
    - lengthInDays() returns 24
    - follow-up length is 47
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: EDGE
    description: A bounded range crossing February 29 in a leap year.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024, 3,
      2))
    - source.lengthInDays() is 3
    - source.getEnd().plusDays(23) remains before LocalDate.MAX
    expectedSourceBehavior:
    - lengthInDays() counts whole elapsed days and returns 3
    - follow-up length is 26
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO_CREATES_EMPTY_RANGE
    category: NORMAL
    description: The Period overload with a zero period, producing an interior empty
      range.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 7, 1), Period.ZERO)
    - source.getStart().equals(source.getEnd())
    expectedSourceBehavior:
    - lengthInDays() returns 0
    - follow-up construction succeeds and produces a 23-day range
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_YEAR_RANGE
    category: NORMAL
    description: The Period overload with a one-year period from a leap-year boundary.
    preconditions:
    - source is LocalDateRange.of(LocalDate.of(2024, 1, 1), Period.ofYears(1))
    - source length is 366 whole days
    expectedSourceBehavior:
    - lengthInDays() returns 366
    - follow-up length is 389
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DATE_RANGE
    category: BOUNDARY
    description: A closed range whose inclusive start and end are the same date.
    preconditions:
    - source is LocalDateRange.ofClosed(LocalDate.of(2024, 5, 10), LocalDate.of(2024,
      5, 10))
    - the closed construction converts to a one-day half-open range
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up length is 24
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_MULTI_DAY_RANGE
    category: NORMAL
    description: A closed range exercising conversion of an inclusive end to the next
      exclusive date.
    preconditions:
    - source is LocalDateRange.ofClosed(LocalDate.of(2024, 3, 1), LocalDate.of(2024,
      3, 31))
    - source length is 31 whole days
    expectedSourceBehavior:
    - lengthInDays() returns 31
    - follow-up length is 54
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINIMUM_ALLOWED_END_BOUNDARY
    category: BOUNDARY
    description: A range beginning at LocalDate.MIN and ending at the first permitted
      finite end.
    preconditions:
    - source is LocalDateRange.of(LocalDate.MIN, LocalDate.MIN.plusDays(2))
    - source.getStart().equals(LocalDate.MIN)
    - source.lengthInDays() is 2
    expectedSourceBehavior:
    - lengthInDays() returns the finite difference of 2 days
    - follow-up remains unbounded at the start and has a finite end
    - follow-up length is the unbounded sentinel Integer.MAX_VALUE
    - the metamorphic assertion skips arithmetic because the source or follow-up output
      is a sentinel
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOUNDED_RANGE_AFTER_MINIMUM
    category: EDGE
    description: A bounded one-day range immediately after the unbounded-start boundary.
    preconditions:
    - source is LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2))
    - source.lengthInDays() is 1
    - source.getStart() is not LocalDate.MIN
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up remains bounded and length is 24
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_OVER_DATE
    category: NORMAL
    description: A range parsed from the date/date format with an ordinary finite
      length.
    preconditions:
    - source is LocalDateRange.parse("2024-04-01/2024-04-11")
    - parsed start is 2024-04-01 and parsed exclusive end is 2024-04-11
    expectedSourceBehavior:
    - lengthInDays() returns 10
    - follow-up length is 33
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_OVER_PERIOD
    category: NORMAL
    description: A range parsed from a date followed by a Period.
    preconditions:
    - source is LocalDateRange.parse("2024-01-01/P1M")
    - parsed end is 2024-02-01 and source length is 31
    expectedSourceBehavior:
    - lengthInDays() returns 31
    - follow-up length is 54
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_PERIOD_OVER_DATE
    category: NORMAL
    description: A range parsed from a Period followed by a date.
    preconditions:
    - source is LocalDateRange.parse("P10D/2024-05-11")
    - parsed start is 2024-05-01 and parsed end is 2024-05-11
    expectedSourceBehavior:
    - lengthInDays() returns 10
    - follow-up length is 33
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_LOWERCASE_PERIOD
    category: EDGE
    description: A parser input using the documented lowercase period discriminator.
    preconditions:
    - source is LocalDateRange.parse("2024-05-01/p10d")
    - parsed range is finite and has length 10
    expectedSourceBehavior:
    - lengthInDays() returns 10
    - follow-up length is 33
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: The from(Temporal) branch for a temporal that directly supplies a
      LocalDate.
    preconditions:
    - source is LocalDateRange.from(LocalDate.of(2024, 8, 20))
    - from(LocalDate) produces a closed one-date range
    expectedSourceBehavior:
    - lengthInDays() returns 1
    - follow-up length is 24
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR
    category: NORMAL
    description: The from(Temporal) Year branch.
    preconditions:
    - source is LocalDateRange.from(Year.of(2024))
    - the converted range covers 2024-01-01 through 2024-12-31 inclusively
    expectedSourceBehavior:
    - lengthInDays() returns 366
    - follow-up length is 389
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_MONTH
    category: NORMAL
    description: The from(Temporal) YearMonth branch for a leap February.
    preconditions:
    - source is LocalDateRange.from(YearMonth.of(2024, 2))
    - the converted range covers 2024-02-01 through 2024-02-29 inclusively
    expectedSourceBehavior:
    - lengthInDays() returns 29
    - follow-up length is 52
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: The from(Temporal) YearHalf branch.
    preconditions:
    - source is LocalDateRange.from(YearHalf.of(2024, 1))
    - the converted first half of 2024 has 182 days
    expectedSourceBehavior:
    - lengthInDays() returns 182
    - follow-up length is 205
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: The from(Temporal) YearQuarter branch.
    preconditions:
    - source is LocalDateRange.from(YearQuarter.of(2024, 1))
    - the converted first quarter of 2024 has 91 days
    expectedSourceBehavior:
    - lengthInDays() returns 91
    - follow-up length is 114
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: NORMAL
    description: The from(Temporal) YearWeek branch.
    preconditions:
    - source is LocalDateRange.from(YearWeek.of(2024, 1))
    - the converted Monday-through-Sunday week has 7 days
    expectedSourceBehavior:
    - lengthInDays() returns 7
    - follow-up length is 30
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: MAXIMUM_SAFE_FINITE_LENGTH
    category: BOUNDARY
    description: A bounded range whose source length is the largest value that can
      be extended by 23 while retaining an int-valued finite follow-up length.
    preconditions:
    - source is bounded at both ends
    - source.lengthInDays() equals Integer.MAX_VALUE - 23
    - source.getEnd().plusDays(23) is still less than LocalDate.MAX
    - follow-up.lengthInDays() equals Integer.MAX_VALUE
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23
    - follow-up remains finite and returns Integer.MAX_VALUE
    - the int subtraction in assertRelation yields exactly 23 without overflow
    targetCases: 1
    emptyOutputAllowed: false
  - id: END_ADVANCE_REACHES_MAX_SENTINEL
    category: EDGE
    description: A short bounded range whose end is exactly 23 days before LocalDate.MAX.
    preconditions:
    - source is LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(23))
    - source.lengthInDays() is 2
    - source.getEnd().plusDays(23).equals(LocalDate.MAX)
    expectedSourceBehavior:
    - source lengthInDays() returns 2
    - follow-up construction succeeds with an unbounded end
    - follow-up lengthInDays() returns Integer.MAX_VALUE
    - the metamorphic assertion skips the increase check because the follow-up output
      is the unbounded sentinel
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_RANGE_NEAR_MAXIMUM
    category: BOUNDARY
    description: A finite range ending just before the follow-up reaches LocalDate.MAX.
    preconditions:
    - source is LocalDateRange.of(LocalDate.MAX.minusDays(26), LocalDate.MAX.minusDays(24))
    - source.lengthInDays() is 2
    - source.getEnd().plusDays(23).equals(LocalDate.MAX.minusDays(1))
    expectedSourceBehavior:
    - source lengthInDays() returns 2
    - follow-up remains finite with length 25
    - the metamorphic assertion observes an increase of 23
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FACTORY
    category: EDGE
    description: A range explicitly created through ofUnboundedStart with a finite
      end.
    preconditions:
    - source is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 1, 1))
    - source.isUnboundedStart() is true
    - source.isUnboundedEnd() is false
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded sentinel
    - follow-up remains unbounded at the start
    - follow-up lengthInDays() also returns Integer.MAX_VALUE
    - the metamorphic assertion skips arithmetic for the sentinel output
    targetCases: 1
    emptyOutputAllowed: false
