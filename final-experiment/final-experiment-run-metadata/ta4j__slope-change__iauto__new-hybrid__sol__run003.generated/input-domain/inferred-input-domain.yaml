InputDomain:
  summary: Nonempty begin-index-zero BarSeries inputs with finite reconstructible
    bars, nonnull Elliott degrees, accepted detector configurations, varied causal
    index bounds, slope-change branches, persistence outcomes, extreme locations,
    ATR thresholds, and repeated-pivot handling.
  globalConstraints:
  - The receiver is a nonnull SlopeChangeSwingDetector successfully constructed through
    SlopeChangeSwingDetector(int) or SlopeChangeSwingDetector(SlopeChangeConfig).
  - The source BarSeries is nonnull, nonempty, and has getBeginIndex() == 0, as explicitly
    required by generateFollowUp.
  - Empty series are excluded because generateFollowUp rejects any source whose begin
    index is not zero, and an empty series is not guaranteed by the supplied API to
    have begin index zero.
  - The ElliottDegree argument is nonnull and is a valid ElliottDegree obtainable
    from a valid valueOf(String) name.
  - Every source bar can be read for every index from 0 through series.getEndIndex()
    and can be reconstructed by the BaseBar constructor used in generateFollowUp.
  - Each bar has finite open, high, low, close, volume, and amount values; adding
    100 to every OHLC value and adding 100 multiplied by volume to amount also yields
    finite values accepted by BaseBar.
  - Nonfinite OHLC inputs are excluded because their acceptance by BaseBar is unspecified,
    slope or extremePivot can return NaN/null, and assertRelation explicitly rejects
    nonfinite translated pivot or swing prices.
  - Bar time periods, begin times, end times, trade counts, and OHLC ordering satisfy
    the validity requirements already enforced by the supplied Bar and BarSeries implementations;
    no additional market rule is imposed.
  - The source and translated series use the source series numFactory(), exactly as
    required by generateFollowUp.
  - The detector configuration is one accepted by its supplied constructor. Its measurable
    values are denoted w = getConfig().window(), c = getConfig().confirmationBars(),
    a = getConfig().atrPeriod(), q = getConfig().minSlopeChange(), and m = getConfig().minAtrReversal().
  - For scenario preconditions, effectiveEnd means max(0, min(index, series.getEndIndex()));
    the first candidate is w - 1 and the last candidate is effectiveEnd - w - c +
    1, exactly as computed by detect.
  - A stated before or after slope is the least-squares slope over the exact close-price
    window used by slope(); a stated persistence slope is over the exact post-window
    range used by persists().
  - Unless a scenario explicitly targets interactions among candidates, its bars are
    chosen so that every other scanned candidate either lacks the required positive-to-negative
    or negative-to-positive sign change, is below q, or fails persistence.
  - Whenever a scenario requires a returned pivot, all high or low values in its extremePivot
    interval are finite, and the stated extreme is measured using the strict greater-than
    or less-than comparisons in extremePivot.
  - Whenever a scenario refers to an ATR threshold, the ATR at the candidate pivot
    index is finite and the comparison is against ATR multiplied by m, exactly as
    used by passesMagnitudeFilter.
  diversity:
    detectorConstruction:
    - SlopeChangeSwingDetector(int) using defaults
    - SlopeChangeSwingDetector(SlopeChangeConfig) with an accepted supplied config
    windowScale:
    - small accepted w such as 2
    - medium accepted w
    - w large relative to series length
    evaluationIndex:
    - negative or below begin index
    - first index permitting a candidate
    - interior index
    - end index
    - greater than end index
    - Integer.MIN_VALUE or Integer.MAX_VALUE where applicable
    slopeTransition:
    - positive to negative
    - negative to positive
    - same-sign positive
    - same-sign negative
    - transition containing zero
    - change below q
    - change equal to q
    - change above q
    persistence:
    - fails on first confirmation slope
    - fails on a later confirmation slope
    - passes every confirmation slope
    extremeLocation:
    - transition start
    - transition interior
    - transition end
    - equal extrema retaining earliest index
    magnitudeFilter:
    - first-pivot bypass
    - m equal to zero bypass
    - reversal below ATR threshold
    - reversal equal to ATR threshold
    - reversal above ATR threshold
    pivotSequence:
    - no pivots
    - one HIGH
    - one LOW
    - HIGH then LOW
    - LOW then HIGH
    - three alternating pivots
    - consecutive same-type candidates
    barGeometry:
    - close equals relevant high or low
    - high and low extremes differ from close extrema
    - nonzero intrabar ranges
    numericRepresentation:
    - source numFactory values with exact simple decimals
    - fractional finite values
    - larger finite values whose translated values remain finite
    degree:
    - one valid ElliottDegree value
    - a distinct valid ElliottDegree value
    volumeAndAmount:
    - zero volume with finite amount
    - positive finite volume and amount
    - varying finite volume and amount
  scenarios:
  - id: INDEX_BELOW_BEGIN_CLAMPS_TO_ZERO
    category: BOUNDARY
    description: The requested index is below the begin index, so detect clamps evaluation
      to bar zero.
    preconditions:
    - index < 0, including a case with index == Integer.MIN_VALUE.
    - The series contains at least one bar.
    expectedSourceBehavior:
    - No candidate can be scanned because lastCandidate is less than firstCandidate.
    - The result has zero pivots and zero swings.
    targetCases: 2
    emptyOutputAllowed: true
  - id: SERIES_TOO_SHORT_FOR_ANY_CANDIDATE
    category: BOUNDARY
    description: The effective prefix ends strictly before the first index that can
      supply both slope windows and all confirmation bars.
    preconditions:
    - effectiveEnd < 2 * w + c - 2.
    - Use distinct cases where the entire series is short and where the series is
      longer but index truncates the evaluated prefix.
    expectedSourceBehavior:
    - The candidate loop executes zero times.
    - The result has zero pivots and zero swings.
    targetCases: 2
    emptyOutputAllowed: true
  - id: FIRST_SCANNABLE_CANDIDATE_NO_REVERSAL
    category: BOUNDARY
    description: Exactly enough bars are visible for one candidate, but its adjacent
      slopes do not reverse direction.
    preconditions:
    - effectiveEnd == 2 * w + c - 2.
    - The sole candidate has finite slopes whose absolute difference is at least q.
    - Its slopes are either both positive or both negative.
    expectedSourceBehavior:
    - Exactly one candidate is examined and rejected by the direction test.
    - The result has zero pivots and zero swings.
    targetCases: 2
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_STRICTLY_BELOW_MINIMUM
    category: BOUNDARY
    description: A sign reversal exists but its measured slope change is strictly
      smaller than the configured minimum.
    preconditions:
    - A scanned candidate has finite before and after slopes of opposite signs.
    - abs(before - after) < q.
    expectedSourceBehavior:
    - The candidate is skipped by the minSlopeChange check before persistence or extreme
      selection.
    - No pivot is produced by that candidate.
    targetCases: 2
    emptyOutputAllowed: true
  - id: SLOPE_CHANGE_EXACTLY_AT_MINIMUM
    category: BOUNDARY
    description: A directional reversal has slope-change magnitude exactly equal to
      q.
    preconditions:
    - A scanned candidate has finite opposite-sign before and after slopes.
    - abs(before - after) compares equal to q in the series Num representation.
    - All required persistence slopes have the new direction.
    expectedSourceBehavior:
    - The candidate is not rejected by the strict isLessThan(q) check.
    - It reaches extreme selection and can produce a pivot.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SLOPES_POSITIVE
    category: NORMAL
    description: Adjacent regression windows both rise despite a sufficiently large
      slope difference.
    preconditions:
    - A scanned candidate has before > 0 and after > 0.
    - abs(before - after) >= q.
    expectedSourceBehavior:
    - The candidate is rejected because it is neither a HIGH nor a LOW transition.
    - No pivot is produced by that candidate.
    targetCases: 1
    emptyOutputAllowed: true
  - id: BOTH_SLOPES_NEGATIVE
    category: NORMAL
    description: Adjacent regression windows both fall despite a sufficiently large
      slope difference.
    preconditions:
    - A scanned candidate has before < 0 and after < 0.
    - abs(before - after) >= q.
    expectedSourceBehavior:
    - The candidate is rejected by the direction test.
    - No pivot is produced by that candidate.
    targetCases: 1
    emptyOutputAllowed: true
  - id: ZERO_BEFORE_SLOPE_NOT_A_REVERSAL
    category: EDGE
    description: The first slope is exactly zero and the second slope is directional.
    preconditions:
    - A scanned candidate has before == 0 and finite nonzero after.
    - abs(before - after) >= q.
    expectedSourceBehavior:
    - Neither strict positive-to-negative nor strict negative-to-positive condition
      holds.
    - The candidate produces no pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: ZERO_AFTER_SLOPE_NOT_A_REVERSAL
    category: EDGE
    description: The second slope is exactly zero after a directional first slope.
    preconditions:
    - A scanned candidate has finite nonzero before and after == 0.
    - abs(before - after) >= q.
    expectedSourceBehavior:
    - The candidate is rejected because the new slope is not strictly opposite in
      sign.
    - The candidate produces no pivot.
    targetCases: 1
    emptyOutputAllowed: true
  - id: HIGH_REVERSAL_FAILS_FIRST_CONFIRMATION
    category: NORMAL
    description: A positive-to-negative reversal is detected, but the first required
      persistence slope is nonnegative.
    preconditions:
    - A scanned candidate has before > 0, after < 0, and abs(before - after) >= q.
    - c > 0.
    - The persistence slope at offset zero is zero or positive.
    expectedSourceBehavior:
    - persists() returns false on its first iteration.
    - No HIGH pivot is produced by the candidate.
    targetCases: 2
    emptyOutputAllowed: true
  - id: LOW_REVERSAL_FAILS_LATER_CONFIRMATION
    category: NORMAL
    description: A negative-to-positive reversal initially persists but fails at a
      later confirmation bar.
    preconditions:
    - A scanned candidate has before < 0, after > 0, and abs(before - after) >= q.
    - c >= 2.
    - The first persistence slope is positive, while a later required persistence
      slope is zero or negative.
    expectedSourceBehavior:
    - persists() advances beyond its first iteration and then returns false.
    - No LOW pivot is produced by the candidate.
    targetCases: 2
    emptyOutputAllowed: true
  - id: ACCEPTED_HIGH_EXTREME_AT_START
    category: NORMAL
    description: A confirmed HIGH transition has its greatest high at the first bar
      of the transition interval.
    preconditions:
    - A scanned candidate has a qualifying positive-to-negative reversal and all c
      persistence slopes are negative.
    - The high at candidate is strictly greater than every high from candidate + 1
      through candidate + w - 1.
    - This is the first accepted pivot.
    expectedSourceBehavior:
    - One HIGH pivot is returned at the candidate index with that bar's high price.
    - With only that accepted pivot, the result has zero swings.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ACCEPTED_HIGH_EXTREME_IN_INTERIOR
    category: NORMAL
    description: A confirmed HIGH transition assigns the pivot to an interior high
      rather than the slope-change boundary.
    preconditions:
    - A scanned candidate has a qualifying positive-to-negative reversal and passes
      persistence.
    - For w >= 3, a unique greatest high occurs at an index strictly between candidate
      and candidate + w - 1.
    - This is the first accepted pivot.
    expectedSourceBehavior:
    - One HIGH pivot is returned at the interior extreme index.
    - The pivot price equals the high at that index, not necessarily its close.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ACCEPTED_HIGH_EXTREME_AT_END
    category: BOUNDARY
    description: A confirmed HIGH transition has its greatest high at the final index
      searched by extremePivot.
    preconditions:
    - A scanned candidate has a qualifying positive-to-negative reversal and passes
      persistence.
    - The high at candidate + w - 1 is strictly greater than every earlier high in
      the transition interval.
    - This is the first accepted pivot.
    expectedSourceBehavior:
    - One HIGH pivot is returned at candidate + w - 1.
    - The endpoint of the extreme search is included.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TIED_HIGH_EXTREMES_KEEP_EARLIEST
    category: EDGE
    description: A confirmed HIGH transition contains equal maximum highs at multiple
      indices.
    preconditions:
    - A qualifying HIGH candidate passes persistence.
    - The maximum high occurs at least twice in the transition interval.
    - No earlier high exceeds that tied value.
    expectedSourceBehavior:
    - The HIGH pivot uses the first index having the maximum because replacement requires
      isGreaterThan.
    - The returned pivot price equals the tied maximum.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ACCEPTED_LOW_EXTREME_AT_START
    category: NORMAL
    description: A confirmed LOW transition has its least low at the first transition
      bar.
    preconditions:
    - A scanned candidate has before < 0, after > 0, abs(before - after) >= q, and
      all persistence slopes are positive.
    - The low at candidate is strictly less than every later low through candidate
      + w - 1.
    - This is the first accepted pivot.
    expectedSourceBehavior:
    - One LOW pivot is returned at the candidate index with that bar's low price.
    - The result has zero swings when this is the only accepted pivot.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ACCEPTED_LOW_EXTREME_IN_INTERIOR
    category: NORMAL
    description: A confirmed LOW transition assigns the pivot to an interior low.
    preconditions:
    - A qualifying LOW candidate passes persistence.
    - For w >= 3, a unique least low occurs strictly inside the transition interval.
    - This is the first accepted pivot.
    expectedSourceBehavior:
    - One LOW pivot is returned at the interior low index.
    - The pivot price comes from LowPriceIndicator and may differ from the close.
    targetCases: 2
    emptyOutputAllowed: false
  - id: TIED_LOW_EXTREMES_KEEP_EARLIEST
    category: EDGE
    description: A confirmed LOW transition contains equal minimum lows at multiple
      indices.
    preconditions:
    - A qualifying LOW candidate passes persistence.
    - The minimum low occurs at least twice in the transition interval.
    expectedSourceBehavior:
    - The LOW pivot uses the earliest tied index because replacement requires isLessThan.
    - The returned pivot price equals the tied minimum.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FIRST_PIVOT_BYPASSES_ATR_MAGNITUDE
    category: NORMAL
    description: The first confirmed pivot is accepted without comparing its magnitude
      to ATR.
    preconditions:
    - A qualifying HIGH or LOW candidate passes persistence and extreme selection.
    - The pivot list is empty when passesMagnitudeFilter is called.
    - m may be nonzero.
    expectedSourceBehavior:
    - The pivot is accepted through the pivots.isEmpty() branch.
    - Exactly one pivot and zero swings result when no later pivot qualifies.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ZERO_MULTIPLIER_BYPASSES_MAGNITUDE
    category: EDGE
    description: A later confirmed reversal is accepted through the zero-multiplier
      branch.
    preconditions:
    - The accepted detector configuration has m == 0.
    - At least one pivot already exists and a later qualifying opposite-type candidate
      passes persistence.
    expectedSourceBehavior:
    - The later candidate passes the magnitude filter without requiring a positive
      reversal distance.
    - At least two alternating pivots and one swing are returned.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ATR_REVERSAL_STRICTLY_BELOW_THRESHOLD
    category: BOUNDARY
    description: A later confirmed candidate reverses by less than ATR multiplied
      by m.
    preconditions:
    - At least one pivot already exists, m is nonzero, and ATR at the new pivot index
      is finite.
    - abs(candidate.price - previous.price) < ATR(candidate.index) * m.
    expectedSourceBehavior:
    - passesMagnitudeFilter returns false.
    - The candidate is absent from the returned pivots and creates no swing.
    targetCases: 2
    emptyOutputAllowed: false
  - id: ATR_REVERSAL_EXACTLY_AT_THRESHOLD
    category: BOUNDARY
    description: A later confirmed candidate has reversal magnitude exactly equal
      to its ATR threshold.
    preconditions:
    - At least one pivot already exists, m is nonzero, and ATR at the candidate pivot
      index is finite.
    - The reversal magnitude compares equal to ATR(candidate.index) * m in the Num
      representation.
    - The candidate type differs from the previous accepted pivot type.
    expectedSourceBehavior:
    - The candidate passes the isGreaterThanOrEqual threshold.
    - It is appended, yielding an additional swing between consecutive pivots.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ATR_REVERSAL_ABOVE_THRESHOLD
    category: NORMAL
    description: A later opposite-type pivot exceeds the configured ATR reversal threshold.
    preconditions:
    - At least one pivot already exists, m is nonzero, and ATR at the new pivot index
      is finite.
    - abs(candidate.price - previous.price) > ATR(candidate.index) * m.
    - The new pivot type differs from the previous type.
    expectedSourceBehavior:
    - The candidate passes the magnitude filter and is appended.
    - The output contains a swing joining the previous and new pivot indices and carrying
      the requested degree.
    targetCases: 2
    emptyOutputAllowed: false
  - id: SAME_TYPE_HIGH_REPLACED_BY_HIGHER_HIGH
    category: NORMAL
    description: Two accepted HIGH candidates occur without an intervening accepted
      LOW, and the later HIGH is higher.
    preconditions:
    - Both HIGH candidates pass slope, persistence, extreme, and magnitude checks.
    - The later HIGH price is strictly greater than the stored HIGH price.
    - No accepted opposite-type pivot occurs between them.
    expectedSourceBehavior:
    - The later HIGH replaces the previous final pivot rather than being appended.
    - The pivot count does not increase at replacement, and the stored HIGH has the
      later index and higher price.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_TYPE_HIGH_NOT_REPLACED
    category: EDGE
    description: A later accepted-by-filter HIGH is not higher than the currently
      stored HIGH.
    preconditions:
    - The later HIGH passes the magnitude filter.
    - Its price is less than or equal to the previous HIGH price.
    - No accepted opposite-type pivot separates the two.
    expectedSourceBehavior:
    - The existing HIGH remains unchanged because the strict higher-price replacement
      condition is false.
    - No additional pivot or swing is created.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_TYPE_LOW_REPLACED_BY_LOWER_LOW
    category: NORMAL
    description: Two accepted LOW candidates occur without an intervening accepted
      HIGH, and the later LOW is lower.
    preconditions:
    - Both LOW candidates pass slope, persistence, extreme, and magnitude checks.
    - The later LOW price is strictly less than the stored LOW price.
    expectedSourceBehavior:
    - The later LOW replaces the prior final LOW without increasing the pivot count.
    - The stored LOW has the later index and lower price.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SAME_TYPE_LOW_NOT_REPLACED
    category: EDGE
    description: A later accepted-by-filter LOW is not lower than the currently stored
      LOW.
    preconditions:
    - The later LOW passes the magnitude filter.
    - Its price is greater than or equal to the previous LOW price.
    - No accepted HIGH separates the candidates.
    expectedSourceBehavior:
    - The prior LOW remains the final stored pivot.
    - No additional swing is created.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIGH_THEN_LOW_CREATES_SWING
    category: NORMAL
    description: The evaluated prefix contains one accepted HIGH followed by one accepted
      LOW.
    preconditions:
    - Both candidates pass all applicable checks.
    - The LOW reversal meets or exceeds its ATR threshold unless m == 0.
    - No additional candidate is accepted.
    expectedSourceBehavior:
    - The result contains two ordered pivots, HIGH then LOW.
    - Exactly one ElliottSwing joins their indices and prices and has the requested
      degree.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOW_THEN_HIGH_CREATES_SWING
    category: NORMAL
    description: The evaluated prefix contains one accepted LOW followed by one accepted
      HIGH.
    preconditions:
    - Both candidates pass all applicable checks.
    - The HIGH reversal meets or exceeds its ATR threshold unless m == 0.
    - No additional candidate is accepted.
    expectedSourceBehavior:
    - The result contains two ordered pivots, LOW then HIGH.
    - Exactly one swing joins the consecutive pivots and carries the requested degree.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THREE_ALTERNATING_PIVOTS_CREATE_TWO_SWINGS
    category: NORMAL
    description: Three confirmed, sufficiently large reversals alternate in type.
    preconditions:
    - The accepted sequence is HIGH-LOW-HIGH or LOW-HIGH-LOW.
    - Each later candidate passes its ATR magnitude test.
    - No same-type replacement or additional accepted candidate occurs.
    expectedSourceBehavior:
    - The result contains exactly three pivots in increasing detection order.
    - Exactly two swings join consecutive pivot pairs, and both swings carry the supplied
      degree.
    targetCases: 2
    emptyOutputAllowed: false
  - id: INDEX_EXCLUDES_FUTURE_REVERSAL
    category: EDGE
    description: A reversal exists later in the series but lies beyond the causal
      evaluation prefix.
    preconditions:
    - index is inside the series.
    - Bars through index contain no accepted candidate requiring only data through
      index.
    - Bars after index would complete at least one qualifying reversal if a later
      index were requested.
    expectedSourceBehavior:
    - No pivot depending on a bar after index appears in the result.
    - The result reflects only candidates through lastCandidate derived from effectiveEnd.
    targetCases: 2
    emptyOutputAllowed: true
  - id: INDEX_AT_OR_BEYOND_END_USES_FULL_SERIES
    category: BOUNDARY
    description: The requested index is the end index or exceeds it, including an
      extreme positive integer.
    preconditions:
    - Use one case with index == series.getEndIndex() and one with index > series.getEndIndex(),
      including Integer.MAX_VALUE where practical.
    - The full series contains at least one qualifying confirmed pivot.
    expectedSourceBehavior:
    - effectiveEnd equals series.getEndIndex().
    - Qualifying pivots in the complete series are returned; no out-of-range bar is
      read.
    targetCases: 2
    emptyOutputAllowed: false
