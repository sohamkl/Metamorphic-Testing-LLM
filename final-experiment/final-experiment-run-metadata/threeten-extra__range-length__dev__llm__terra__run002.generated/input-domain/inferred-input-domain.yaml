InputDomain:
  summary: Valid LocalDateRange receivers whose exclusive end can be advanced by 23
    days and reconstructed by the supplied follow-up generator. The domain covers
    ordinary bounded lengths, empty ranges, endpoint restrictions, unbounded-start
    sentinel results, finite-length saturation, all supplied successful construction
    routes, and follow-ups that become unbounded.
  globalConstraints:
  - The source receiver is a non-null LocalDateRange successfully created by a documented
    construction path and therefore satisfies start <= end plus LocalDateRange endpoint
    restrictions.
  - The source exclusive end must satisfy range.getEnd() <= LocalDate.MAX.minusDays(23),
    because generateFollowUp invokes range.getEnd().plusDays(23).
  - Valid ranges with an unbounded end, including ofUnbounded(), ofUnboundedEnd(...),
    and any range whose end is LocalDate.MAX, are excluded because the supplied follow-up
    generator overflows before it can construct a follow-up receiver.
  - No invalid construction inputs are included because the metamorphic relation specifies
    behavior only after a source LocalDateRange has been created and does not assert
    exception behavior.
  diversity:
    resultClass:
    - distinct
    - measurable
    - zero length; finite lengths below Integer.MAX_VALUE; Integer.MAX_VALUE minus
      24; Integer.MAX_VALUE minus 23; Integer.MAX_VALUE minus 1; Integer.MAX_VALUE
      exact; greater-than-Integer.MAX_VALUE saturation; unbounded-start sentinel
    endpointPosition:
    - distinct
    - measurable
    - LocalDate.MIN; LocalDate.MIN.plusDays(1); LocalDate.MIN.plusDays(2); ordinary
      dates; LocalDate.MAX.minusDays(25); LocalDate.MAX.minusDays(24); LocalDate.MAX.minusDays(23)
    constructionRoute:
    - distinct
    - measurable
    - of(LocalDate,LocalDate); of(LocalDate,Period); ofClosed; ofEmpty; ofUnboundedStart;
      from(LocalDate); from(LocalDateTime); from(Year); from(YearMonth); from(YearHalf);
      from(YearQuarter); from(YearWeek); parse(date/date); parse(date/period); parse(period/date)
    followUpOutcome:
    - distinct
    - measurable
    - finite follow-up with output increase 23; follow-up output Integer.MAX_VALUE
      due to finite-length saturation; follow-up unbounded-end sentinel; source unbounded-start
      sentinel
  scenarios:
  - id: ORDINARY_BOUNDED_TEN_DAY_RANGE
    category: NORMAL
    description: Half-open ordinary range constructed with of(start,end) and having
      a ten-day finite length.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 1, 10), LocalDate.of(2024, 1, 20))
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    - The follow-up end is 2024-02-12 and the follow-up remains bounded.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_RANGE_AT_ORDINARY_DATE
    category: EDGE
    description: Empty range at a permitted ordinary date.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024, 6, 15))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a bounded 23-day range.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_BOUNDED_RANGE
    category: BOUNDARY
    description: Smallest non-empty ordinary half-open range.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 6, 15), LocalDate.of(2024, 6, 16))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_TWO_DAY_RANGE
    category: BOUNDARY
    description: Finite range one day shorter than the follow-up extension amount.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1, 23))
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    - The bounded follow-up length is 45.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_THREE_DAY_RANGE
    category: BOUNDARY
    description: Finite range whose source length equals EXTRA_DAYS.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1, 24))
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The bounded follow-up length is 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TWENTY_FOUR_DAY_RANGE
    category: BOUNDARY
    description: Finite range one day longer than EXTRA_DAYS.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 1, 1), LocalDate.of(2024, 1, 25))
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    - The bounded follow-up length is 47.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_CROSSING_RANGE
    category: EDGE
    description: Bounded range crossing 2024-02-29.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 2, 28), LocalDate.of(2024, 3, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_END_CROSSING_RANGE
    category: EDGE
    description: Bounded range crossing the end of a 31-day month.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 1, 31), LocalDate.of(2024, 2, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY_CROSSING_RANGE
    category: EDGE
    description: Bounded range crossing from one calendar year into the next.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2023, 12, 31), LocalDate.of(2024, 1,
      2))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPOCH_DAY_ZERO_CROSSING_RANGE
    category: EDGE
    description: Bounded range spanning dates on opposite sides of epoch day zero.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(1969, 12, 31), LocalDate.of(1970, 1,
      2))
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_NON_SATURATING_RANGE
    category: NORMAL
    description: Large bounded range whose day count remains strictly below Integer.MAX_VALUE.
    preconditions:
    - range = LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(100000))
    expectedSourceBehavior:
    - lengthInDays() returns 100000.
    - The follow-up remains finite and has length 100023.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWEST_PERMITTED_BOUNDED_START_RANGE
    category: BOUNDARY
    description: Bounded one-day range beginning at the lowest date that is not interpreted
      as an unbounded start.
    preconditions:
    - range = LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWEST_PERMITTED_EMPTY_RANGE
    category: BOUNDARY
    description: Empty range at the earliest location permitted for an empty range.
    preconditions:
    - range = LocalDateRange.ofEmpty(LocalDate.MIN.plusDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_BOUND_FOLLOW_UP_REMAINS_BOUNDED
    category: BOUNDARY
    description: Near-maximum bounded range whose extended end is LocalDate.MAX.minusDays(1),
      still bounded.
    preconditions:
    - range = LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up end is LocalDate.MAX.minusDays(1), so neither receiver is unbounded.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_BOUND_FOLLOW_UP_BECOMES_UNBOUNDED
    category: BOUNDARY
    description: Near-maximum bounded range whose extended end becomes LocalDate.MAX.
    preconditions:
    - range = LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up has end LocalDate.MAX and lengthInDays() returns Integer.MAX_VALUE,
      causing the relation assertion to skip.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_FACTORY_RANGE
    category: EDGE
    description: Unbounded-start range with a finite, extendable end.
    preconditions:
    - range = LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 1, 1))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is LocalDate.MIN.
    - The follow-up is constructible but the relation assertion skips because the
      source output is Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_ABOVE_INTEGER_MAX
    category: BOUNDARY
    description: Bounded range whose actual day count exceeds Integer.MAX_VALUE.
    preconditions:
    - range = LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483648L))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE for the oversized finite length.
    - The follow-up is constructible and the relation assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_EXACTLY_INTEGER_MAX
    category: BOUNDARY
    description: Bounded range with actual length exactly Integer.MAX_VALUE.
    preconditions:
    - range = LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483647L))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The follow-up is oversized and also returns Integer.MAX_VALUE.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_ONE
    category: BOUNDARY
    description: Largest finite bounded output below the Integer.MAX_VALUE sentinel.
    preconditions:
    - range = LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483646L))
    expectedSourceBehavior:
    - lengthInDays() returns 2147483646.
    - The follow-up reaches the Integer.MAX_VALUE result and the relation assertion
      skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_TWENTY_FOUR
    category: BOUNDARY
    description: Largest source length for which adding 23 days remains below Integer.MAX_VALUE.
    preconditions:
    - range = LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483623L))
    expectedSourceBehavior:
    - lengthInDays() returns 2147483623.
    - The bounded follow-up length is 2147483646, an increase of 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FINITE_LENGTH_INTEGER_MAX_MINUS_TWENTY_THREE
    category: BOUNDARY
    description: Source length immediately below the point where the follow-up result
      reaches Integer.MAX_VALUE.
    preconditions:
    - range = LocalDateRange.of(LocalDate.ofEpochDay(0), LocalDate.ofEpochDay(2147483624L))
    expectedSourceBehavior:
    - lengthInDays() returns 2147483624.
    - The follow-up length is Integer.MAX_VALUE, so the relation assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLETON_RANGE
    category: NORMAL
    description: Closed singleton constructed by ofClosed, which is internally a one-day
      half-open range.
    preconditions:
    - range = LocalDateRange.ofClosed(LocalDate.of(2024, 6, 15), LocalDate.of(2024,
      6, 15))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_LEAP_DAY_SPAN
    category: EDGE
    description: Closed range including leap day and both specified endpoints.
    preconditions:
    - range = LocalDateRange.ofClosed(LocalDate.of(2024, 2, 28), LocalDate.of(2024,
      3, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 3.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_UNBOUNDED_START_RANGE
    category: BOUNDARY
    description: Closed construction whose start is LocalDate.MIN and whose internal
      end is permitted.
    preconditions:
    - range = LocalDateRange.ofClosed(LocalDate.MIN, LocalDate.MIN.plusDays(1))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ZERO_RANGE
    category: EDGE
    description: Zero-period construction through of(start,Period).
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 6, 15), Period.ZERO)
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_ONE_DAY_RANGE
    category: NORMAL
    description: One-day Period construction through of(start,Period).
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 6, 15), Period.ofDays(1))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_MONTH_END_RESOLUTION
    category: EDGE
    description: Period addition from January 31 in a leap year, resolving to February
      29.
    preconditions:
    - range = LocalDateRange.of(LocalDate.of(2024, 1, 31), Period.ofMonths(1))
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PERIOD_UNBOUNDED_START_RANGE
    category: BOUNDARY
    description: Period construction beginning at LocalDate.MIN with a permitted two-day
      period.
    preconditions:
    - range = LocalDateRange.of(LocalDate.MIN, Period.ofDays(2))
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE because the start is unbounded.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE
    category: NORMAL
    description: from(Temporal) using LocalDate, which creates a closed one-day range.
    preconditions:
    - range = LocalDateRange.from(LocalDate.of(2024, 6, 15))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TIME
    category: NORMAL
    description: from(Temporal) using a LocalDateTime, whose time component is ignored
      by the local-date query.
    preconditions:
    - range = LocalDateRange.from(LocalDateTime.of(2024, 6, 15, 23, 59, 59))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR
    category: EDGE
    description: from(Temporal) using leap Year 2024.
    preconditions:
    - range = LocalDateRange.from(Year.of(2024))
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_FEBRUARY_YEAR_MONTH
    category: EDGE
    description: from(Temporal) using YearMonth for leap-year February.
    preconditions:
    - range = LocalDateRange.from(YearMonth.of(2024, 2))
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF
    category: NORMAL
    description: from(Temporal) using the first half of leap year 2024.
    preconditions:
    - range = LocalDateRange.from(YearHalf.of(2024, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 182.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER
    category: NORMAL
    description: from(Temporal) using the first quarter of leap year 2024.
    preconditions:
    - range = LocalDateRange.from(YearQuarter.of(2024, 1))
    expectedSourceBehavior:
    - lengthInDays() returns 91.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK
    category: EDGE
    description: from(Temporal) using ISO week 53 of 2020.
    preconditions:
    - range = LocalDateRange.from(YearWeek.of(2020, 53))
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_TO_DATE
    category: NORMAL
    description: parse(CharSequence) date/date form.
    preconditions:
    - range = LocalDateRange.parse("2024-01-10/2024-01-20")
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_DATE_TO_PERIOD
    category: EDGE
    description: parse(CharSequence) date/period form with month-end period resolution.
    preconditions:
    - range = LocalDateRange.parse("2024-01-31/P1M")
    expectedSourceBehavior:
    - lengthInDays() returns 29.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_PERIOD_TO_DATE
    category: EDGE
    description: parse(CharSequence) period/date form, which derives the start by
      subtracting the period.
    preconditions:
    - range = LocalDateRange.parse("P1M/2024-03-31")
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_EMPTY_DATE_TO_DATE
    category: EDGE
    description: parse(CharSequence) date/date form representing a permitted empty
      range.
    preconditions:
    - range = LocalDateRange.parse("2024-06-15/2024-06-15")
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSE_UPPER_BOUND_FOLLOW_UP_UNBOUNDED
    category: BOUNDARY
    description: Parsed bounded range at the highest source end that can be extended,
      producing an unbounded-end follow-up.
    preconditions:
    - range = LocalDateRange.parse("+999999999-12-07/+999999999-12-08")
    - range.getEnd().equals(LocalDate.MAX.minusDays(23))
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up end is LocalDate.MAX and its output is Integer.MAX_VALUE, so the
      relation assertion skips.
    targetCases: 1
    emptyOutputAllowed: false
