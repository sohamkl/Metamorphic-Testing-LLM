InputDomain:
  summary: Non-null, valid LocalDateRange receivers whose exclusive end can be advanced
    by 23 days and whose bounded source and follow-up lengths remain representable
    as int, plus executable unbounded-start and bounded-to-unbounded sentinel cases.
  globalConstraints:
  - The source receiver is a non-null LocalDateRange successfully created through
    one of the supplied public construction paths.
  - The source range satisfies getStart().compareTo(getEnd()) <= 0, as enforced by
    LocalDateRange construction.
  - The source exclusive end satisfies getEnd().compareTo(LocalDate.MAX.minusDays(23))
    <= 0, so generateFollowUp can execute getEnd().plusDays(23) without exceeding
    LocalDate.MAX.
  - Sources unbounded at the end, including ofUnbounded(), ofUnboundedEnd(...), and
    any range with getEnd() equal to LocalDate.MAX, are excluded because generateFollowUp
    calls LocalDate.MAX.plusDays(23) before the assertion can skip the sentinel.
  - For a bounded source with getEnd() before LocalDate.MAX.minusDays(23), the epoch-day
    difference getEnd().toEpochDay() - getStart().toEpochDay() is at most Integer.MAX_VALUE
    - 23, so both source and follow-up have int-representable lengths and the asserted
    subtraction can equal 23.
  - A bounded source whose getEnd() equals LocalDate.MAX.minusDays(23) is admitted
    only as the explicit bounded-to-unbounded sentinel scenario; its source length
    must itself be int-representable.
  - A source with getStart() equal to LocalDate.MIN is admitted as an unbounded-start
    sentinel case even though its mathematical epoch-day span is large, because lengthInDays()
    returns Integer.MAX_VALUE for that branch.
  - No null factory arguments, reversed endpoints, negative periods, prohibited endpoint
    combinations, parse failures, or other invalid construction attempts are included
    because the metamorphic relation does not request invalid inputs.
  - Bounded ranges longer than Integer.MAX_VALUE - 23 days are excluded because extending
    them by 23 days cannot provide two ordinary int lengths on which assertRelation
    can reliably check an increase of 23.
  diversity:
    boundedness:
    - bounded
    - unbounded-start
    - follow-up-becomes-unbounded-end
    sourceLengthClass:
    - zero
    - one-day
    - below-23
    - exactly-23
    - above-23
    - largest-follow-up-safe
    calendarPosition:
    - ordinary-date
    - month-boundary
    - year-boundary
    - leap-February
    - common-February
    - proleptic-negative-year
    - near-LocalDate-MIN
    - near-LocalDate-MAX
    constructionPath:
    - of-dates
    - of-period
    - ofClosed
    - ofEmpty
    - from-Temporal
    - parse-date-date
    - parse-date-period
    - parse-period-date
    - ofUnboundedStart
    sourceOutputClass:
    - zero
    - small-positive
    - large-positive
    - Integer-MAX-sentinel
  scenarios:
  - id: EMPTY_RANGE_FACTORY
    category: EDGE
    description: An ordinary empty range created with ofEmpty.
    preconditions:
    - The source is LocalDateRange.ofEmpty(LocalDate.of(2024, 6, 15)).
    - getStart() equals getEnd().
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EMPTY_HALF_OPEN_RANGE
    category: EDGE
    description: An empty half-open range created by equal endpoints.
    preconditions:
    - The source is LocalDateRange.of(d, d) for an ordinary date d, such as 2000-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_DAY_HALF_OPEN_RANGE
    category: BOUNDARY
    description: The smallest non-empty half-open bounded range.
    preconditions:
    - The source is LocalDateRange.of(2024-04-10, 2024-04-11).
    - The exclusive end is exactly one day after the start.
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CLOSED_SINGLE_DAY_RANGE
    category: BOUNDARY
    description: A closed range whose equal inclusive endpoints become a one-day internal
      half-open range.
    preconditions:
    - The source is LocalDateRange.ofClosed(2024-04-10, 2024-04-10).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_JUST_BELOW_EXTRA_DAYS
    category: BOUNDARY
    description: A bounded range one day shorter than the 23-day follow-up extension.
    preconditions:
    - getEnd() equals getStart().plusDays(22).
    - The endpoints are ordinary dates satisfying the global constraints.
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_EQUALS_EXTRA_DAYS
    category: BOUNDARY
    description: A bounded range whose source length equals EXTRA_DAYS.
    preconditions:
    - getEnd() equals getStart().plusDays(23).
    - The endpoints are ordinary dates satisfying the global constraints.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LENGTH_JUST_ABOVE_EXTRA_DAYS
    category: BOUNDARY
    description: A bounded range one day longer than the 23-day extension.
    preconditions:
    - getEnd() equals getStart().plusDays(24).
    - The endpoints are ordinary dates satisfying the global constraints.
    expectedSourceBehavior:
    - lengthInDays() returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LEAP_DAY_INCLUDED
    category: EDGE
    description: A bounded range crossing February 29 in a leap year.
    preconditions:
    - The source is LocalDateRange.of(2020-02-28, 2020-03-01).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: COMMON_YEAR_FEBRUARY
    category: EDGE
    description: The analogous February interval in a non-leap year.
    preconditions:
    - The source is LocalDateRange.of(2019-02-28, 2019-03-01).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_BOUNDARY
    category: NORMAL
    description: A one-day range crossing from the last day of a month to the first
      day of the next.
    preconditions:
    - The source is LocalDateRange.of(2024-01-31, 2024-02-01).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_BOUNDARY
    category: NORMAL
    description: A one-day range crossing a calendar-year boundary.
    preconditions:
    - The source is LocalDateRange.of(2023-12-31, 2024-01-01).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PROLEPTIC_NEGATIVE_YEAR
    category: EDGE
    description: A bounded range in the supported proleptic calendar before year zero.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.of(-1, 12, 31), LocalDate.of(0, 1,
      2)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_PERIOD_RANGE
    category: EDGE
    description: An empty range created by the supplied start-and-Period factory with
      a zero period.
    preconditions:
    - The source is LocalDateRange.of(2024-05-20, Period.ZERO).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DAY_BASED_PERIOD_RANGE
    category: NORMAL
    description: A non-empty range created from a positive day-based Period.
    preconditions:
    - The source is LocalDateRange.of(2024-05-20, Period.ofDays(10)).
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MONTH_BASED_PERIOD_OVER_LEAP_FEBRUARY
    category: EDGE
    description: A month-based Period whose resulting whole-day length depends on
      the calendar month.
    preconditions:
    - The source is LocalDateRange.of(2020-01-29, Period.ofMonths(1)).
    - The resulting exclusive end is 2020-02-29.
    expectedSourceBehavior:
    - lengthInDays() returns 31.
    targetCases: 1
    emptyOutputAllowed: false
  - id: YEAR_PERIOD_CONTAINING_LEAP_DAY
    category: EDGE
    description: A one-year Period whose resulting range contains February 29.
    preconditions:
    - The source is LocalDateRange.of(2019-03-01, Period.ofYears(1)).
    - The resulting exclusive end is 2020-03-01.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MULTI_DAY_CLOSED_RANGE
    category: NORMAL
    description: A closed range exercising conversion from an inclusive end to the
      stored exclusive end.
    preconditions:
    - The source is LocalDateRange.ofClosed(2024-06-01, 2024-06-10).
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_DATE_RANGE
    category: NORMAL
    description: A range produced by the date/date parsing branch.
    preconditions:
    - The source is LocalDateRange.parse("2007-12-03/2007-12-04").
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_DATE_PERIOD_RANGE
    category: NORMAL
    description: A range produced by the date/Period parsing branch.
    preconditions:
    - The source is LocalDateRange.parse("2024-01-01/P23D").
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PARSED_PERIOD_DATE_RANGE
    category: NORMAL
    description: A range produced by the Period/date parsing branch.
    preconditions:
    - The source is LocalDateRange.parse("P10D/2024-01-11").
    expectedSourceBehavior:
    - lengthInDays() returns 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LOCAL_DATE_TEMPORAL
    category: NORMAL
    description: A one-day range created by from(Temporal) when the temporal supplies
      a local date.
    preconditions:
    - The source is LocalDateRange.from(LocalDate.of(2024, 8, 5)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_LEAP_YEAR_TEMPORAL
    category: EDGE
    description: A full leap-year range produced by the Year branch of from(Temporal).
    preconditions:
    - The source is LocalDateRange.from(Year.of(2020)).
    - The resulting range starts on 2020-01-01 and has exclusive end 2021-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 366.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_COMMON_FEBRUARY_YEAR_MONTH
    category: EDGE
    description: A complete non-leap February produced by the YearMonth branch of
      from(Temporal).
    preconditions:
    - The source is LocalDateRange.from(YearMonth.of(2019, 2)).
    - The resulting range starts on 2019-02-01 and has exclusive end 2019-03-01.
    expectedSourceBehavior:
    - lengthInDays() returns 28.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_HALF_TEMPORAL
    category: NORMAL
    description: A complete half-year produced by the YearHalf branch of from(Temporal).
    preconditions:
    - The temporal passed to from is a YearHalf whose first day is 2020-07-01 and
      whose last day is 2020-12-31.
    - The resulting source has start 2020-07-01 and exclusive end 2021-01-01.
    expectedSourceBehavior:
    - lengthInDays() returns 184.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_QUARTER_TEMPORAL
    category: NORMAL
    description: A complete quarter produced by the YearQuarter branch of from(Temporal).
    preconditions:
    - The temporal passed to from is a YearQuarter whose first day is 2021-01-01 and
      whose last day is 2021-03-31.
    - The resulting source has exclusive end 2021-04-01.
    expectedSourceBehavior:
    - lengthInDays() returns 90.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FROM_YEAR_WEEK_TEMPORAL
    category: EDGE
    description: A complete Monday-through-Sunday week crossing a calendar-year boundary.
    preconditions:
    - The temporal passed to from is a YearWeek whose Monday is 2020-12-28 and whose
      Sunday is 2021-01-03.
    - The resulting source has exclusive end 2021-01-04.
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWEST_BOUNDED_START
    category: BOUNDARY
    description: A finite one-day range using the earliest start that is not interpreted
      as unbounded.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MIN.plusDays(1), LocalDate.MIN.plusDays(2)).
    - The end avoids the constructor-prohibited LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - lengthInDays() returns 1 rather than the unbounded sentinel.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_NEAR_MINIMUM_END
    category: BOUNDARY
    description: An unbounded-start range with the earliest exclusive end accepted
      by the constructor.
    preconditions:
    - The source is LocalDateRange.ofUnboundedStart(LocalDate.MIN.plusDays(2)).
    - getStart() equals LocalDate.MIN.
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range flag.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: An unbounded-start range ending at an ordinary date; generation remains
      executable because its end is finite.
    preconditions:
    - The source is LocalDateRange.ofUnboundedStart(LocalDate.of(2024, 1, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range flag.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGEST_SAFE_FINITE_SOURCE_LENGTH
    category: BOUNDARY
    description: The largest ordinary source length whose 23-day extension remains
      int-representable.
    preconditions:
    - The source start is an ordinary date s for which s.plusDays(Integer.MAX_VALUE
      - 23L) is valid.
    - getEnd() equals s.plusDays(Integer.MAX_VALUE - 23L).
    - getEnd() is before LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JUST_BELOW_LARGEST_SAFE_LENGTH
    category: BOUNDARY
    description: A very large bounded source immediately below the maximum follow-up-safe
      length.
    preconditions:
    - The source start is an ordinary date s for which s.plusDays(Integer.MAX_VALUE
      - 24L) is valid.
    - getEnd() equals s.plusDays(Integer.MAX_VALUE - 24L).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE - 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LATEST_FINITE_FOLLOW_UP_END
    category: BOUNDARY
    description: A bounded source whose follow-up ends at LocalDate.MAX.minusDays(1)
      and remains finite.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MAX.minusDays(25), LocalDate.MAX.minusDays(24)).
    - Advancing the exclusive end by 23 days yields LocalDate.MAX.minusDays(1).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: FOLLOW_UP_BECOMES_UNBOUNDED_END
    category: EDGE
    description: A bounded source at the transformation boundary whose extended end
      becomes LocalDate.MAX.
    preconditions:
    - The source is LocalDateRange.of(LocalDate.MAX.minusDays(24), LocalDate.MAX.minusDays(23)).
    - The source is bounded and has length one.
    - Advancing getEnd() by 23 days yields LocalDate.MAX, which the follow-up range
      treats as an unbounded end.
    expectedSourceBehavior:
    - The source lengthInDays() returns 1.
    - The generated follow-up reaches the Integer.MAX_VALUE sentinel path, causing
      assertRelation to skip arithmetic as specified.
    targetCases: 1
    emptyOutputAllowed: false
