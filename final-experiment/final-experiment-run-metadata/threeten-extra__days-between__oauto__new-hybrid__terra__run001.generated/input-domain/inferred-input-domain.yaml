InputDomain:
  summary: Valid non-null java.time Temporal endpoint pairs for which ChronoUnit.DAYS.between
    completes successfully, its long result fits in int, and both endpoints can be
    shifted forward by 37 DAYS. The domain emphasizes Days.ZERO, Days.ONE, ordinary
    positive and negative results, complete-day truncation for time-bearing temporals,
    calendar boundaries, chronology-specific dates, zone/offset normalization, and
    int-result limits.
  globalConstraints:
  - Both source arguments are non-null Temporal instances.
  - Each source endpoint must support plus(37, ChronoUnit.DAYS) without throwing,
    because the supplied follow-up generator performs exactly that operation.
  - ChronoUnit.DAYS.between(startDateInclusive, endDateExclusive) must complete successfully
    and return a value in [-2147483648, 2147483647], because Days.between applies
    Math.toIntExact.
  - The transformed endpoints produced by adding 37 DAYS must also be valid inputs
    to Days.between and produce an int-range day count.
  - Use endpoint types and type combinations for which the start temporal accepts
    the end temporal in its DAYS-based until calculation; exclude incompatible temporal
    combinations because the MR requests only valid source inputs, not exception relations.
  - Do not use null endpoints, temporals that do not support DAYS arithmetic, or endpoints
    too near their maximum supported value to be advanced by 37 DAYS.
  diversity:
    resultAmount:
    - distinct
    - measurable
    - 0, 1, positive values greater than 1, negative values, Integer.MAX_VALUE, Integer.MIN_VALUE
    temporalRepresentation:
    - distinct
    - measurable
    - LocalDate, LocalDateTime, ZonedDateTime, OffsetDateTime, Instant, JapaneseDate,
      ThaiBuddhistDate, MinguoDate, HijrahDate
    calendarAndTimeBoundaries:
    - distinct
    - measurable
    - month end, year end, leap day, BCE/CE year zero, chronology era boundary, less
      than one day, exactly one day, DST transitions
    normalizationMode:
    - distinct
    - measurable
    - same local representation, differing offsets for the same instant, differing
      zones for the same instant
  scenarios:
  - id: LOCAL_DATE_EQUAL_ZERO
    category: NORMAL
    description: Identical ISO LocalDate endpoints.
    preconditions:
    - startDateInclusive and endDateExclusive are LocalDate.of(2024, 6, 15).
    expectedSourceBehavior:
    - Days.between returns Days.ZERO and getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_ONE_DAY_SINGLETON
    category: BOUNDARY
    description: Consecutive ISO dates exercise the Days.of(1) singleton path.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 6, 15) and endDateExclusive is LocalDate.of(2024,
      6, 16).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_FORWARD_MULTI_DAY
    category: NORMAL
    description: Ordinary forward ISO date interval larger than one day.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 10) and endDateExclusive is LocalDate.of(2024,
      2, 20).
    expectedSourceBehavior:
    - getAmount() is 41.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_REVERSE_MULTI_DAY
    category: NORMAL
    description: End date precedes start date for a negative date-only result.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 20) and endDateExclusive is LocalDate.of(2024,
      1, 10).
    expectedSourceBehavior:
    - getAmount() is -41.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MONTH_END
    category: BOUNDARY
    description: ISO interval crossing a 31-day month boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 1, 31) and endDateExclusive is LocalDate.of(2024,
      2, 1).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_END
    category: BOUNDARY
    description: ISO interval crossing the calendar-year boundary.
    preconditions:
    - startDateInclusive is LocalDate.of(2023, 12, 31) and endDateExclusive is LocalDate.of(2024,
      1, 1).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_LEAP_DAY
    category: BOUNDARY
    description: ISO interval containing leap-day progression.
    preconditions:
    - startDateInclusive is LocalDate.of(2024, 2, 28) and endDateExclusive is LocalDate.of(2024,
      3, 1).
    expectedSourceBehavior:
    - getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_YEAR_ZERO_CROSSING
    category: EDGE
    description: Proleptic ISO LocalDate interval crossing from year -1 to year 0.
    preconditions:
    - startDateInclusive is LocalDate.of(-1, 12, 31) and endDateExclusive is LocalDate.of(0,
      1, 1).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MIN_SAFE_FOR_SHIFT
    category: EDGE
    description: ISO LocalDate near its minimum range limit while retaining room for
      the required positive shift.
    preconditions:
    - startDateInclusive is LocalDate.MIN and endDateExclusive is LocalDate.MIN.plusDays(1).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_MAX_SAFE_FOR_SHIFT
    category: EDGE
    description: ISO LocalDate near its maximum range limit with both source endpoints
      still shiftable by 37 days.
    preconditions:
    - startDateInclusive is LocalDate.MAX.minusDays(38) and endDateExclusive is LocalDate.MAX.minusDays(37).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EQUAL
    category: NORMAL
    description: Identical LocalDateTime endpoints.
    preconditions:
    - startDateInclusive and endDateExclusive are LocalDateTime.of(2024, 6, 15, 12,
      0).
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_FORWARD_UNDER_DAY
    category: BOUNDARY
    description: Positive LocalDateTime elapsed time strictly less than one complete
      day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 0) and endDateExclusive
      is LocalDateTime.of(2024, 6, 16, 11, 59, 59).
    expectedSourceBehavior:
    - getAmount() is 0 because no complete day is between the endpoints.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_EXACT_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints exactly one complete day apart.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 0) and endDateExclusive
      is LocalDateTime.of(2024, 6, 16, 12, 0).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_OVER_DAY
    category: NORMAL
    description: LocalDateTime elapsed time containing one complete day plus an additional
      hour.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 15, 12, 0) and endDateExclusive
      is LocalDateTime.of(2024, 6, 16, 13, 0).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_REVERSE_UNDER_DAY
    category: BOUNDARY
    description: Negative LocalDateTime elapsed time with magnitude strictly below
      one complete day.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 16, 11, 59, 59) and endDateExclusive
      is LocalDateTime.of(2024, 6, 15, 12, 0).
    expectedSourceBehavior:
    - getAmount() is 0 because the negative interval contains no complete day.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOCAL_DATE_TIME_REVERSE_EXACT_DAY
    category: BOUNDARY
    description: LocalDateTime endpoints exactly one complete day apart in reverse
      order.
    preconditions:
    - startDateInclusive is LocalDateTime.of(2024, 6, 16, 12, 0) and endDateExclusive
      is LocalDateTime.of(2024, 6, 15, 12, 0).
    expectedSourceBehavior:
    - getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_NORMAL_DAY
    category: NORMAL
    description: Same-zone ZonedDateTime interval outside daylight-saving transitions.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 1, 10, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    - endDateExclusive is startDateInclusive.plusDays(5).
    expectedSourceBehavior:
    - getAmount() is 5.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SPRING_DST_DAY
    category: EDGE
    description: Same local time across the America/New_York spring DST transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 3, 9, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    - endDateExclusive is ZonedDateTime.of(2024, 3, 10, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_FALL_DST_DAY
    category: EDGE
    description: Same local time across the America/New_York fall DST transition.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 11, 2, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    - endDateExclusive is ZonedDateTime.of(2024, 11, 3, 12, 0, 0, 0, ZoneId.of('America/New_York')).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_UNDER_LOCAL_DAY
    category: BOUNDARY
    description: Same-zone ZonedDateTime interval strictly shorter than one complete
      day.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 1, 10, 12, 0, 0, 0, ZoneId.of('Europe/Paris')).
    - endDateExclusive is ZonedDateTime.of(2024, 1, 11, 11, 59, 59, 0, ZoneId.of('Europe/Paris')).
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZONED_DATE_TIME_SAME_INSTANT_DIFFERENT_ZONE
    category: EDGE
    description: ZonedDateTime endpoints in different zones denoting the same instant.
    preconditions:
    - startDateInclusive is ZonedDateTime.of(2024, 1, 1, 0, 0, 0, 0, ZoneId.of('UTC')).
    - endDateExclusive is ZonedDateTime.of(2023, 12, 31, 19, 0, 0, 0, ZoneId.of('America/New_York')).
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_OFFSET_DAY
    category: NORMAL
    description: OffsetDateTime endpoints one day apart with an unchanged offset.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse('2024-06-15T12:00:00+05:30').
    - endDateExclusive is OffsetDateTime.parse('2024-06-16T12:00:00+05:30').
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_OFFSET_NORMALIZATION_UNDER_DAY
    category: EDGE
    description: OffsetDateTime endpoints whose local calendar dates differ by one
      but whose instant gap is only 23 hours.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse('2024-01-01T00:00:00Z').
    - endDateExclusive is OffsetDateTime.parse('2024-01-02T00:00:00+01:00').
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: OFFSET_DATE_TIME_SAME_INSTANT_DIFFERENT_OFFSET
    category: EDGE
    description: OffsetDateTime endpoints with different offsets representing exactly
      the same instant.
    preconditions:
    - startDateInclusive is OffsetDateTime.parse('2024-01-01T00:00:00+18:00').
    - endDateExclusive is OffsetDateTime.parse('2023-12-31T06:00:00Z').
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EQUAL_ZERO
    category: NORMAL
    description: Identical Instant endpoints.
    preconditions:
    - startDateInclusive and endDateExclusive are Instant.EPOCH.
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_UNDER_DAY
    category: BOUNDARY
    description: Instant interval one second shorter than a complete 24-hour day.
    preconditions:
    - startDateInclusive is Instant.EPOCH and endDateExclusive is Instant.EPOCH.plusSeconds(86399).
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_EXACT_DAY
    category: BOUNDARY
    description: Instant interval of exactly 24 elapsed hours.
    preconditions:
    - startDateInclusive is Instant.EPOCH and endDateExclusive is Instant.EPOCH.plusSeconds(86400).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NEGATIVE_EXACT_DAY
    category: BOUNDARY
    description: Reverse Instant interval of exactly 24 elapsed hours.
    preconditions:
    - startDateInclusive is Instant.EPOCH and endDateExclusive is Instant.EPOCH.minusSeconds(86400).
    expectedSourceBehavior:
    - getAmount() is -1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_NANOSECOND_BELOW_DAY
    category: BOUNDARY
    description: Instant interval one nanosecond shorter than one complete day.
    preconditions:
    - startDateInclusive is Instant.EPOCH and endDateExclusive is Instant.EPOCH.plusSeconds(86399).plusNanos(999999999).
    expectedSourceBehavior:
    - getAmount() is 0.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MAX_DAYS
    category: EDGE
    description: Largest successful positive Days amount representable by the int-backed
      Days result.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.plus(2147483647L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is 2147483647.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INSTANT_INTEGER_MIN_DAYS
    category: EDGE
    description: Smallest successful negative Days amount representable by the int-backed
      Days result.
    preconditions:
    - startDateInclusive is Instant.EPOCH.
    - endDateExclusive is Instant.EPOCH.minus(2147483648L, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is -2147483648.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_NORMAL_INTERVAL
    category: NORMAL
    description: Same-chronology JapaneseDate interval away from an era transition.
    preconditions:
    - startDateInclusive is JapaneseDate.of(2024, 6, 1) and endDateExclusive is JapaneseDate.of(2024,
      6, 11).
    expectedSourceBehavior:
    - getAmount() is 10.
    targetCases: 1
    emptyOutputAllowed: false
  - id: JAPANESE_DATE_ERA_TRANSITION
    category: EDGE
    description: JapaneseDate interval crossing the Heisei-to-Reiwa era boundary.
    preconditions:
    - startDateInclusive is JapaneseDate.of(2019, 4, 30) and endDateExclusive is JapaneseDate.of(2019,
      5, 1).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: THAI_BUDDHIST_DATE_LEAP_YEAR
    category: EDGE
    description: ThaiBuddhistDate interval spanning the corresponding ISO leap-day
      period.
    preconditions:
    - startDateInclusive is ThaiBuddhistDate.of(2567, 2, 28) and endDateExclusive
      is ThaiBuddhistDate.of(2567, 3, 1).
    expectedSourceBehavior:
    - getAmount() is 2.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MINGUO_DATE_YEAR_BOUNDARY
    category: BOUNDARY
    description: MinguoDate interval crossing its calendar-year boundary.
    preconditions:
    - startDateInclusive is MinguoDate.of(112, 12, 31) and endDateExclusive is MinguoDate.of(113,
      1, 1).
    expectedSourceBehavior:
    - getAmount() is 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HIJRAH_DATE_FORWARD_INTERVAL
    category: NORMAL
    description: Same-chronology HijrahDate interval constructed by supported day
      arithmetic.
    preconditions:
    - startDateInclusive is HijrahDate.of(1445, 9, 1).
    - endDateExclusive is startDateInclusive.plus(29, ChronoUnit.DAYS).
    expectedSourceBehavior:
    - getAmount() is 29.
    targetCases: 1
    emptyOutputAllowed: false
