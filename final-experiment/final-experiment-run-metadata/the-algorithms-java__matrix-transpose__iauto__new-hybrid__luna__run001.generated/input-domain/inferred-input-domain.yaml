InputDomain:
  summary: Non-empty rectangular double matrices whose transpose is also a valid input
    to computeRank; cases emphasize pivot discovery, marked-row skipping, normalization,
    elimination, zero detection at EPSILON, rectangular shapes, and sentinel no-pivot
    paths.
  globalConstraints:
  - matrix is non-null and has at least 1 row because computeRank reads matrix.length
    and matrix[0].
  - matrix[0] is non-null and has at least 1 column because computeRank allocates
    column-dependent structures and the follow-up reads source[0].length.
  - every row is non-null and has exactly matrix[0].length elements so both computeRank
    and generateFollowUp receive rectangular matrices.
  - each source case is transformed only by generateFollowUp, which produces a matrix
    with matrix[0].length rows and matrix.length columns without changing any element.
  - no INVALID cases are included because the supplied metamorphic relation requires
    a non-empty rectangular source and does not request invalid-input behavior.
  diversity:
    shape:
    - 1x1
    - 1xN
    - Nx1
    - square
    - tall with rows greater than columns
    - wide with columns greater than rows
    rankStructure:
    - zero rank
    - rank one
    - intermediate rank
    - full row rank
    - full column rank
    - full square rank
    pivotPath:
    - pivot in first row
    - pivot below an initially zero entry
    - previously marked row skipped
    - no pivot in a column
    - pivot in every processed column
    numericRegime:
    - zero
    - ordinary finite integers
    - negative pivots
    - exact cancellation
    - absolute value below 1e-10
    - absolute value exactly 1e-10
    - absolute value above 1e-10
    - NaN
    - positive infinity
    storageLayout:
    - independent row arrays
    - multiple rows sharing the same row array
  scenarios:
  - id: SINGLE_NONZERO_SCALAR
    category: NORMAL
    description: A 1x1 matrix containing an ordinary nonzero finite value.
    preconditions:
    - matrix has exactly 1 row and 1 column.
    - matrix[0][0] is finite and nonzero.
    expectedSourceBehavior:
    - findPivotRow finds row 0 in the only column and rank becomes 1.
    - computeRank returns 1 for both the source and its 1x1 transpose.
    - the source array remains unchanged because computeRank operates on deepCopy(matrix).
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_ZERO_SCALAR
    category: BOUNDARY
    description: A 1x1 all-zero matrix that exercises the no-pivot sentinel.
    preconditions:
    - matrix has exactly 1 row and 1 column.
    - matrix[0][0] is exactly 0.0.
    expectedSourceBehavior:
    - findPivotRow returns numRows for the only column.
    - computeRank returns 0 for both source and transpose.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_ROW_NONZERO
    category: NORMAL
    description: A single row with several columns and at least one nonzero entry.
    preconditions:
    - matrix has 1 row and at least 2 columns.
    - the row contains both zero and nonzero finite values.
    expectedSourceBehavior:
    - at most one row can be marked, so the returned rank is 1.
    - the transposed matrix is a column matrix and has the same rank 1.
    - the case exercises normalization over multiple entries after the pivot column.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_ZERO_ROW
    category: BOUNDARY
    description: A single row containing only zeros.
    preconditions:
    - matrix has 1 row and at least 2 columns.
    - every entry is exactly 0.0.
    expectedSourceBehavior:
    - every column takes the no-pivot sentinel path.
    - computeRank returns 0 for source and transpose.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_COLUMN_NONZERO
    category: NORMAL
    description: A column matrix with one or more nonzero entries.
    preconditions:
    - matrix has at least 2 rows and exactly 1 column.
    - at least one entry is nonzero and finite.
    expectedSourceBehavior:
    - the first nonzero row is selected as the only possible pivot.
    - computeRank returns 1.
    - the transposed single-row matrix also returns 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SINGLE_ZERO_COLUMN
    category: BOUNDARY
    description: A multi-row column containing only zeros.
    preconditions:
    - matrix has at least 2 rows and exactly 1 column.
    - every entry is exactly 0.0.
    expectedSourceBehavior:
    - findPivotRow returns numRows because no row has a nonzero entry.
    - computeRank returns 0 for source and transpose.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGULAR_ZERO_MATRIX
    category: BOUNDARY
    description: A zero matrix with unequal row and column counts.
    preconditions:
    - matrix has at least 2 rows and at least 2 columns.
    - matrix.length is not equal to matrix[0].length.
    - every entry is exactly 0.0.
    expectedSourceBehavior:
    - every source and follow-up column takes the no-pivot sentinel path.
    - computeRank returns 0 in both orientations.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SQUARE_IDENTITY_FULL_RANK
    category: NORMAL
    description: An identity matrix that selects a fresh pivot for every column.
    preconditions:
    - matrix is n by n for n at least 2.
    - diagonal entries are 1.0 and all off-diagonal entries are 0.0.
    expectedSourceBehavior:
    - each column finds an unmarked pivot row.
    - normalization leaves each pivot row valid and elimination encounters zero entries
      in the other rows.
    - computeRank returns n for source and transpose.
    targetCases: 1
    emptyOutputAllowed: false
  - id: TALL_FULL_COLUMN_RANK
    category: NORMAL
    description: A tall matrix with more rows than columns and independent columns.
    preconditions:
    - matrix has m rows and n columns with m greater than n and n at least 2.
    - the first n rows form an n by n identity matrix.
    - remaining rows are all zero.
    expectedSourceBehavior:
    - every source column obtains a pivot and rank is n.
    - the transposed wide matrix has the same rank n.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WIDE_FULL_ROW_RANK
    category: NORMAL
    description: A wide matrix with more columns than rows and independent rows.
    preconditions:
    - matrix has m rows and n columns with n greater than m and m at least 2.
    - the first m columns form an m by m identity matrix.
    - remaining columns are zero.
    expectedSourceBehavior:
    - each row contributes a pivot and rank is m.
    - columns after all rows are marked take the no-pivot sentinel path.
    - transpose has the same rank m.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DEPENDENT_MULTIPLE_ROWS
    category: NORMAL
    description: A rectangular matrix whose nonzero rows are scalar multiples of one
      another.
    preconditions:
    - matrix has at least 2 rows and at least 2 columns.
    - one row is nonzero and every other row is a finite scalar multiple of it.
    - at least one other row is a nonzero multiple, not merely a duplicate zero row.
    expectedSourceBehavior:
    - the first usable pivot is found, while later dependent rows do not create an
      additional independent pivot.
    - computeRank returns 1.
    - transpose also has rank 1.
    targetCases: 1
    emptyOutputAllowed: false
  - id: DUPLICATE_ROWS_WITH_INDEPENDENT_ROW
    category: NORMAL
    description: A matrix containing duplicate rows and an additional independent
      row.
    preconditions:
    - matrix has at least 3 rows and at least 2 columns.
    - two rows are identical and nonzero.
    - another row is not a scalar multiple of that duplicated row.
    expectedSourceBehavior:
    - elimination processes a nonzero entry in the duplicate row and prevents it from
      contributing a second independent pivot.
    - the independent row contributes another pivot, yielding rank 2 when the remaining
      dimensions permit.
    - transpose preserves the rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LOWER_ROW_FIRST_PIVOT
    category: NORMAL
    description: The first column is zero in the top rows and nonzero in a lower row.
    preconditions:
    - matrix has at least 2 rows and at least 2 columns.
    - matrix[0][0] is 0.0.
    - some lower row has a nonzero finite value in column 0.
    - the matrix has at least one additional independent pivot opportunity.
    expectedSourceBehavior:
    - findPivotRow scans past at least one row before selecting the lower pivot row.
    - the selected lower row is marked and later columns must skip it.
    - source and transpose return the same rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: MARKED_ROW_SKIPPED
    category: NORMAL
    description: The first pivot row remains nonzero in a later column, forcing findPivotRow
      to skip it.
    preconditions:
    - matrix is at least 2x2.
    - row 0 has nonzero entries in columns 0 and 1.
    - row 1 has a nonzero entry in column 1.
    - rows are not scalar multiples.
    expectedSourceBehavior:
    - column 0 marks row 0.
    - in column 1, findPivotRow skips marked row 0 and can select row 1.
    - normalization and elimination execute for both pivots, and the rank is 2 for
      the 2x2 instance.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_LEADING_COLUMN_THEN_PIVOT
    category: BOUNDARY
    description: One or more leading columns contain no usable pivot, followed by
      a column that does.
    preconditions:
    - matrix has at least 2 rows and at least 2 columns.
    - every entry in column 0 is exactly 0.0.
    - a later column contains at least one nonzero finite entry.
    expectedSourceBehavior:
    - the leading column returns the no-pivot sentinel without changing rank.
    - a later column selects a pivot and increases rank.
    - transpose exercises the corresponding zero leading row/column structure and
      returns the same rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ELIMINATION_NONZERO_AND_ZERO_TARGETS
    category: NORMAL
    description: A pivot column has both nonzero and zero entries in non-pivot rows.
    preconditions:
    - matrix is at least 3x2.
    - the selected pivot row has a nonzero finite value in the pivot column.
    - at least one other row has a nonzero value in that column and at least one other
      row has exactly 0.0 there.
    expectedSourceBehavior:
    - eliminateRows enters its nonzero-target branch for one row.
    - eliminateRows skips another row because isZero reports its pivot-column value
      as zero.
    - source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_ELIMINATION_CANCELLATION
    category: NORMAL
    description: Integer-valued rows cause an exact finite cancellation during elimination.
    preconditions:
    - matrix is at least 2x2.
    - the first pivot is 1.0 in column 0.
    - another row has a nonzero column-0 value and its later-column value is exactly
      the pivot-row later value multiplied by that value.
    expectedSourceBehavior:
    - elimination produces an exact 0.0 in at least one later entry.
    - the resulting rows have a predictable dependent relationship and source and
      transpose return the same rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEGATIVE_PIVOTS
    category: NORMAL
    description: Independent rows and columns use negative pivot values.
    preconditions:
    - matrix is at least 2x2.
    - at least one pivot candidate is negative and finite.
    - the matrix has full rank for its smaller dimension.
    expectedSourceBehavior:
    - isZero uses Math.abs, so negative nonzero pivots are selected.
    - normalizePivotRow divides by the negative pivot and elimination runs normally.
    - source and transpose return the full smaller dimension as rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BELOW_EPSILON_ENTRIES
    category: BOUNDARY
    description: Candidate pivot values have absolute value strictly below EPSILON.
    preconditions:
    - at least one candidate value is finite and satisfies 0.0 < abs(value) < 1e-10.
    - the matrix otherwise contains a clearly nonzero pivot in another location.
    expectedSourceBehavior:
    - isZero treats every below-threshold candidate as zero.
    - below-threshold entries do not themselves increment rank.
    - the source and transposed follow-up are compared under the same EPSILON rule.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EPSILON_EXACT_BOUNDARY
    category: BOUNDARY
    description: Candidate pivot values have absolute value exactly EPSILON.
    preconditions:
    - at least one candidate value is exactly 1e-10 or -1e-10.
    - no selected candidate in the case relies on a value whose absolute value is
      strictly below 1e-10.
    expectedSourceBehavior:
    - because isZero uses a strict less-than comparison, an exact EPSILON value is
      treated as nonzero.
    - the boundary candidate can be selected and normalized.
    - source and transpose outputs are asserted equal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ABOVE_EPSILON_ENTRIES
    category: BOUNDARY
    description: Candidate pivot values are just above the zero threshold.
    preconditions:
    - at least one candidate value is finite and satisfies abs(value) > 1e-10.
    - the case includes a value close enough to the threshold to distinguish it from
      the below-threshold scenario.
    expectedSourceBehavior:
    - isZero treats the candidate as nonzero.
    - the candidate can increase rank when its row is not already marked.
    - source and transpose return equal ranks.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INTERMEDIATE_RANK_RECTANGLE
    category: NORMAL
    description: A rectangular matrix has rank strictly between zero and its smaller
      dimension.
    preconditions:
    - matrix has at least 3 rows and at least 3 columns.
    - 0 is less than the intended rank and the intended rank is less than min(matrix.length,
      matrix[0].length).
    - the remaining rows or columns are finite linear combinations of the independent
      portion.
    expectedSourceBehavior:
    - some columns obtain pivots and at least one later column reaches the no-pivot
      sentinel.
    - computeRank returns an intermediate rank rather than zero or full smaller dimension.
    - transpose returns the same intermediate rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SPARSE_PERMUTED_PIVOTS
    category: NORMAL
    description: Nonzero entries are sparse and arranged so pivot rows and columns
      are not aligned in index order.
    preconditions:
    - matrix is at least 3x3.
    - each of at least three distinct rows has a nonzero entry in a different column.
    - at least one earlier row has zero in the column where a later row supplies a
      pivot.
    expectedSourceBehavior:
    - pivot search scans different row prefixes in different columns.
    - marked-row checks and zero-entry skips are both exercised.
    - source and transpose return the same rank.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGULAR_TRANSPOSE_DIMENSION_SWAP
    category: NORMAL
    description: A non-square finite matrix is chosen specifically to make the follow-up
      dimensions differ from the source dimensions.
    preconditions:
    - matrix has m rows and n columns with m not equal to n.
    - both m and n are at least 2.
    - the matrix contains at least one pivot and at least one non-pivot column or
      row.
    expectedSourceBehavior:
    - generateFollowUp produces an n by m matrix with every element transposed exactly
      once.
    - computeRank is invoked on both orientations rather than only on a square self-transpose.
    - the returned source and follow-up ranks are asserted equal.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SHARED_ROW_ARRAYS
    category: EDGE
    description: Multiple matrix rows reference the same underlying double[] array.
    preconditions:
    - matrix is rectangular and has at least 2 rows.
    - at least two row references are identical by Java reference identity.
    - the shared row contains at least one nonzero finite value.
    expectedSourceBehavior:
    - deepCopy copies each row into separate destination rows, so computeRank does
      not mutate the shared source row.
    - duplicate shared rows exercise dependent-row handling.
    - generateFollowUp reads the shared values consistently and the source and transpose
      ranks are compared.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_FINITE_MAGNITUDES
    category: EDGE
    description: A finite matrix contains values near Double.MAX_VALUE while remaining
      representable as input doubles.
    preconditions:
    - every entry is finite.
    - at least one absolute entry is greater than 1e300.
    - the matrix has at least 2 rows and 2 columns and includes a simple independent
      or dependent structure.
    expectedSourceBehavior:
    - values are copied and tested by isZero without being classified as zero solely
      because of magnitude.
    - normalization and elimination execute on large finite operands.
    - source and transpose outputs are compared for equality.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NAN_ENTRY
    category: EDGE
    description: A rectangular matrix contains a NaN value while retaining otherwise
      valid dimensions.
    preconditions:
    - matrix is non-empty and rectangular.
    - at least one entry is Double.NaN.
    - all other entries are finite and the matrix has at least 2 rows and 2 columns.
    expectedSourceBehavior:
    - under Java Math.abs comparison, isZero(Double.NaN) is false, so a NaN entry
      is treated as a nonzero pivot candidate if encountered.
    - normalization or elimination may propagate NaN through the copied working matrix;
      the returned int and the follow-up returned int are still compared by the supplied
      relation.
    - the original source contents remain unchanged by deepCopy.
    targetCases: 1
    emptyOutputAllowed: false
  - id: INFINITE_ENTRY
    category: EDGE
    description: A rectangular matrix contains positive infinity while retaining otherwise
      valid dimensions.
    preconditions:
    - matrix is non-empty and rectangular.
    - at least one entry is Double.POSITIVE_INFINITY.
    - all other entries are finite and the matrix has at least 2 rows and 2 columns.
    expectedSourceBehavior:
    - Math.abs of the infinite entry is not less than EPSILON, so it is not classified
      as zero by isZero.
    - normalization and elimination can encounter infinite or NaN intermediate values.
    - computeRank is invoked on both the source and exact transpose, and assertRelation
      compares their returned ints.
    targetCases: 1
    emptyOutputAllowed: false
