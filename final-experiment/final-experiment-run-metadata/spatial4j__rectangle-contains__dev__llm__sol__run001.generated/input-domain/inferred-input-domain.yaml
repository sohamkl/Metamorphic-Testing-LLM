InputDomain:
  summary: Valid finite geographic rectangles and points, including ordinary, dateline-wrapping,
    degenerate, pole-touching, and longitude-normalization boundary cases; source
    rectangles exclude only the full-world longitude encoding that the supplied follow-up
    cannot preserve.
  globalConstraints:
  - Use one non-null SpatialContext with context.isGeo() == true for both the RectangleImpl
    receiver and the source Point.
  - Construct the receiver with RectangleImpl(minX, maxX, minY, maxY, context) and
    the point with context.makePoint(pointX, pointY).
  - 'All source coordinates are finite doubles: !Double.isNaN(value) and !Double.isInfinite(value).'
  - Rectangle and point longitudes are in the inclusive geographic range [-180.0,
    180.0].
  - Rectangle latitude bounds and point latitude are in [-90.0, 90.0], with minY <=
    maxY.
  - Both minX <= maxX non-wrapping rectangles and minX > maxX dateline-wrapping rectangles
    are valid and must be generated.
  - 'Exclude the source rectangle minX == -180.0 and maxX == 180.0: it has raw width
    360, but the supplied transformation normalizes both rotated endpoints to the
    same longitude and therefore does not preserve the full-world rectangle.'
  - Do not generate null receivers or null points because the supplied transformation
    explicitly rejects them with Objects.requireNonNull and the MR does not request
    invalid inputs.
  diversity:
    sourceLongitudeTopology:
    - non_wrapping
    - dateline_wrapping
    - zero_width
    - nearly_full_world
    rotationTopologyTransition:
    - nonwrap_to_nonwrap
    - nonwrap_to_wrap
    - wrap_to_nonwrap
    - wrap_to_wrap
    latitudePosition:
    - below_min
    - at_min
    - interior
    - at_max
    - above_max
    - north_pole
    - south_pole
    longitudeDecisionPath:
    - direct_interval_short_circuit
    - shift_plus_360
    - shift_minus_360
    - shifted_disjoint
    sourceRelation:
    - CONTAINS
    - DISJOINT
    rectangleAreaClass:
    - positive_area
    - zero_width
    - zero_height
    - point_rectangle
    longitudeBoundary:
    - minus_180
    - plus_180
    - rotation_seam_30
    - ordinary_endpoint
    - just_outside_endpoint
  scenarios:
  - id: NONWRAP_INTERIOR_ROTATES_TO_WRAP
    category: NORMAL
    description: An interior point in an ordinary rectangle whose rotated endpoints
      cross the longitude normalization seam.
    preconditions:
    - Rectangle is [-20.0, 40.0] x [-10.0, 20.0].
    - Point is (0.0, 5.0).
    expectedSourceBehavior:
    - relate(point) returns SpatialRelation.CONTAINS through the direct longitude-interval
      short circuit.
    - The generated rectangle has minX > maxX, exercising dateline unwrapping in the
      follow-up.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONWRAP_INTERIOR_REMAINS_NONWRAP
    category: NORMAL
    description: An interior point in a rectangle that remains non-wrapping after
      rotation.
    preconditions:
    - Rectangle is [-100.0, -50.0] x [-20.0, 20.0].
    - Point is (-75.0, 0.0).
    expectedSourceBehavior:
    - relate(point) returns SpatialRelation.CONTAINS.
    - The generated rectangle remains non-wrapping.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAP_POSITIVE_LOBE_ROTATES_TO_NONWRAP
    category: NORMAL
    description: A point lies in the positive-longitude portion of a dateline-wrapping
      rectangle.
    preconditions:
    - Rectangle is [170.0, -170.0] x [-20.0, 20.0].
    - Point is (175.0, 0.0).
    expectedSourceBehavior:
    - relate(point) unwraps the rectangle and returns SpatialRelation.CONTAINS.
    - The generated rectangle is non-wrapping.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAP_NEGATIVE_LOBE_REQUIRES_PLUS_360
    category: NORMAL
    description: A point lies in the negative-longitude portion of a dateline-wrapping
      rectangle.
    preconditions:
    - Rectangle is [170.0, -170.0] x [-20.0, 20.0].
    - Point is (-175.0, 0.0).
    expectedSourceBehavior:
    - The source longitude is less than minX, is shifted by +360, and relate(point)
      returns SpatialRelation.CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAP_REMAINS_WRAP_AFTER_ROTATION
    category: NORMAL
    description: A broad dateline-wrapping rectangle remains wrapping after the supplied
      rotation.
    preconditions:
    - Rectangle is [170.0, 100.0] x [-30.0, 30.0].
    - Point is (-150.0, 10.0).
    expectedSourceBehavior:
    - After source dateline unwrapping and point shifting, relate(point) returns SpatialRelation.CONTAINS.
    - The generated rectangle also has minX > maxX.
    targetCases: 1
    emptyOutputAllowed: false
  - id: WRAP_CENTRAL_GAP_DISJOINT
    category: NORMAL
    description: The latitude matches, but the point lies in the excluded central
      longitude gap of a wrapping rectangle.
    preconditions:
    - Rectangle is [170.0, -170.0] x [-20.0, 20.0].
    - Point is (0.0, 0.0).
    expectedSourceBehavior:
    - The source point is shifted by +360 and remains beyond the unwrapped maxX.
