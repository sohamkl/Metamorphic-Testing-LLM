InputDomain:
  summary: Valid flat/non-geo CircleImpl and Rectangle inputs constructed in the same
    usable SpatialContext, emphasizing bbox shortcuts, phase-2 closest/farthest-corner
    logic, empty-shape sentinels, zero-area rectangles, zero radius, equality of the
    rectangle and enclosing box, and exact contact.
  globalConstraints:
  - Use a non-geo SpatialContext whose distance calculator is the flat Cartesian calculator
    assumed by the SUT description.
  - Circle and rectangle coordinates must be accepted by the source context and by
    the follow-up construction after adding SHIFT_X=17.5 and SHIFT_Y=-9.25 to every
    finite coordinate.
  - For non-empty circles, use a finite radiusDEG >= 0 and a non-empty center Point;
    for non-empty rectangles, use finite ordered bounds minX <= maxX and minY <= maxY.
  - Use the circle's own SpatialContext for the source rectangle as well as the follow-up
    shapes, so source and follow-up use the same flat coordinate semantics.
  - Empty-circle and empty-rectangle scenarios are included only when the available
    context/shape construction represents them such that isEmpty() is true both before
    and after the metamorphic follow-up transformation; otherwise they cannot form
    an executable MR pair.
  - For exact-contact scenarios, use the stated dyadic/integer coordinates so that
    adding 17.5 and -9.25 preserves the intended coordinate differences exactly.
  diversity:
    circleState:
    - distinct
    - measurable
    - empty; non-empty radius 0; non-empty radius 4; non-empty radius 5
    rectangleArea:
    - distinct
    - measurable
    - positive-area rectangle; zero-width vertical segment; zero-height horizontal
      segment; zero-area point rectangle; empty rectangle
    bboxRelation:
    - distinct
    - measurable
    - DISJOINT; WITHIN; CONTAINS with equal bounds; CONTAINS with strict bounds; INTERSECTS
    phase2Outcome:
    - distinct
    - measurable
    - diagonal closest-corner DISJOINT; axis-spanning INTERSECTS; farthest-corner
      INTERSECTS; CONTAINS; exact tangency INTERSECTS
    expectedRelation:
    - distinct
    - measurable
    - DISJOINT; WITHIN; INTERSECTS; CONTAINS
  scenarios:
  - id: EMPTY_CIRCLE_NONEMPTY_RECTANGLE
    category: EDGE
    description: The CircleImpl center is empty and the rectangle has finite positive
      area.
    preconditions:
    - circle.isEmpty() is true.
    - rectangle.isEmpty() is false.
    expectedSourceBehavior:
    - relate(rectangle) returns DISJOINT through the isEmpty() shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NONEMPTY_CIRCLE_EMPTY_RECTANGLE
    category: EDGE
    description: A finite non-empty circle is related to an empty rectangle.
    preconditions:
    - circle.isEmpty() is false.
    - rectangle.isEmpty() is true.
    expectedSourceBehavior:
    - relate(rectangle) returns DISJOINT through the other.isEmpty() shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BOTH_SHAPES_EMPTY
    category: EDGE
    description: Both source shapes are empty sentinel shapes.
    preconditions:
    - circle.isEmpty() is true.
    - rectangle.isEmpty() is true.
    expectedSourceBehavior:
    - relate(rectangle) returns DISJOINT without entering bounding-box or distance
      logic.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_ON_X_AXIS
    category: NORMAL
    description: A radius-4 circle centered at (0,0) has an enclosing box disjoint
      from a rectangle entirely to its right.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=5, maxX=6, minY=-1, maxY=1.
    expectedSourceBehavior:
    - The enclosing box [-4,4] x [-4,4] is DISJOINT from the rectangle.
    - relate(rectangle) returns DISJOINT from the bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: BBOX_DISJOINT_ON_Y_AXIS
    category: NORMAL
    description: A radius-4 circle centered at (0,0) has an enclosing box disjoint
      from a rectangle entirely above it.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-1, maxX=1, minY=5, maxY=6.
    expectedSourceBehavior:
    - The enclosing box [-4,4] x [-4,4] is DISJOINT from the rectangle.
    - relate(rectangle) returns DISJOINT from the bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CIRCLE_BBOX_STRICTLY_WITHIN_RECTANGLE
    category: NORMAL
    description: A positive-area rectangle strictly contains the entire enclosing
      box of a radius-4 circle.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-5, maxX=5, minY=-5, maxY=5.
    expectedSourceBehavior:
    - The circle enclosing box is WITHIN the rectangle.
    - relate(rectangle) returns WITHIN through the bounding-box shortcut.
    targetCases: 1
    emptyOutputAllowed: false
  - id: RECTANGLE_EQUALS_CIRCLE_ENCLOSING_BOX
    category: EDGE
    description: The rectangle has exactly the same bounds as the radius-4 circle's
      enclosing box.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-4, maxX=4, minY=-4, maxY=4.
    - rectangle.equals(circle.getBoundingBox()) is true.
    expectedSourceBehavior:
    - The enclosing-box relation is CONTAINS while enclosingBox.equals(rectangle)
      is true.
    - relate(rectangle) returns WITHIN through the explicit equal-bounds edge case.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_DIAGONAL_CLOSEST_CORNER_DISJOINT
    category: NORMAL
    description: Bounding boxes overlap at a corner, but the nearest rectangle corner
      is outside the circle.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=3, maxX=5, minY=3, maxY=5.
    - The closest rectangle point to the center is (3,3), whose Euclidean distance
      is greater than 4.
    expectedSourceBehavior:
    - The enclosing boxes are not DISJOINT.
    - Phase 2 tests closestX=3 and closestY=3 and returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_X_SEPARATED_Y_SPANNING_INTERSECTS
    category: NORMAL
    description: The rectangle lies to one side of the circle center on X but spans
      the circle center on Y.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=3, maxX=5, minY=-1, maxY=1.
    - xAxis < rectangle.minX and rectangle.minY <= yAxis <= rectangle.maxY.
    expectedSourceBehavior:
    - The bounding boxes intersect.
    - Phase 2 cannot return DISJOINT because the rectangle spans the Y axis.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_Y_SEPARATED_X_SPANNING_INTERSECTS
    category: NORMAL
    description: The rectangle lies above the circle center on Y but spans the circle
      center on X.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-1, maxX=1, minY=3, maxY=5.
    - rectangle.minX <= xAxis <= rectangle.maxX and yAxis < rectangle.minY.
    expectedSourceBehavior:
    - The bounding boxes intersect.
    - Phase 2 cannot return DISJOINT because the rectangle spans the X axis.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_RECTANGLE_SPANS_BOTH_AXES
    category: NORMAL
    description: A rectangle spans both center axes and is strictly inside the circle
      bounding box.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-3, maxX=3, minY=-3, maxY=3.
    - The farthest selected corner has distance sqrt(18), which is greater than 4.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the rectangle.
    - Phase 2 reaches the farthest-corner check and returns INTERSECTS because (3,3)
      is outside the circle.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_BBOX_CONTAINS_RECTANGLE_BUT_CORNER_OUTSIDE
    category: NORMAL
    description: The circle bounding box contains a smaller rectangle, but the circle
      does not contain its farthest corner.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-3, maxX=3, minY=-3, maxY=3.
    - enclosingBox.relate(rectangle) is CONTAINS.
    expectedSourceBehavior:
    - The farthest-corner containment test fails.
    - relate(rectangle) returns INTERSECTS rather than CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: PHASE2_CIRCLE_CONTAINS_RECTANGLE
    category: NORMAL
    description: A rectangle is strictly inside both the enclosing box and the circular
      area.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-2, maxX=2, minY=-2, maxY=2.
    - The farthest rectangle corner has distance sqrt(8), which is less than 4.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the rectangle.
    - The farthest-corner containment test succeeds.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SIDE_TANGENCY_INTERSECTS
    category: BOUNDARY
    description: A rectangle touches the circle at the side point (4,0) and otherwise
      extends outside.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=4, maxX=6, minY=-1, maxY=1.
    - The closest point (4,0) is exactly at distance 4 from the center.
    expectedSourceBehavior:
    - The shapes are not DISJOINT at exact contact.
    - Because the bounding box does not contain the rectangle, relate(rectangle) returns
      INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: CORNER_TANGENCY_INTERSECTS
    category: BOUNDARY
    description: A rectangle's nearest corner touches a radius-5 circle exactly at
      the 3-4-5 point.
    preconditions:
    - circle center is (0,0) and radiusDEG is 5.
    - rectangle bounds are minX=3, maxX=6, minY=4, maxY=6.
    - The closest rectangle point is (3,4), whose distance from the center is exactly
      5.
    expectedSourceBehavior:
    - The phase-2 closest-corner check recognizes exact contact as contained rather
      than disjoint.
    - The enclosing box does not contain the rectangle.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_WITH_CENTER_STRICTLY_INSIDE_RECTANGLE
    category: BOUNDARY
    description: A non-empty zero-radius circle is enclosed by a positive-area rectangle.
    preconditions:
    - circle center is (0,0) and radiusDEG is 0.
    - rectangle bounds are minX=-1, maxX=1, minY=-1, maxY=1.
    expectedSourceBehavior:
    - circle.hasArea() is false.
    - The degenerate enclosing box is WITHIN the rectangle.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_CENTER_ON_RECTANGLE_BOUNDARY
    category: BOUNDARY
    description: A zero-radius circle center lies on, rather than strictly inside,
      a rectangle boundary.
    preconditions:
    - circle center is (0,0) and radiusDEG is 0.
    - rectangle bounds are minX=0, maxX=1, minY=-1, maxY=1.
    expectedSourceBehavior:
    - The degenerate enclosing box is within or boundary-contained by the rectangle.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_RECTANGLE_EQUALS_DEGENERATE_BBOX
    category: EDGE
    description: Both the circle bounding box and rectangle are the same zero-area
      point at the circle center.
    preconditions:
    - circle center is (0,0) and radiusDEG is 0.
    - rectangle bounds are minX=0, maxX=0, minY=0, maxY=0.
    - rectangle.equals(circle.getBoundingBox()) is true.
    expectedSourceBehavior:
    - The equal-bounds enclosing-box edge case is exercised with no-area shapes.
    - relate(rectangle) returns WITHIN.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ZERO_RADIUS_DISJOINT_POINT_RECTANGLE
    category: BOUNDARY
    description: A zero-radius circle is separated from a zero-area point rectangle.
    preconditions:
    - circle center is (0,0) and radiusDEG is 0.
    - rectangle bounds are minX=1, maxX=1, minY=0, maxY=0.
    expectedSourceBehavior:
    - The degenerate circle bounding box is DISJOINT from the rectangle.
    - relate(rectangle) returns DISJOINT.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_STRICTLY_INSIDE_CIRCLE
    category: EDGE
    description: A zero-area point rectangle lies strictly inside a positive-radius
      circle.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=1, maxX=1, minY=1, maxY=1.
    - The point rectangle location has distance sqrt(2), which is less than 4.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the point rectangle.
    - The farthest-point test succeeds.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: POINT_RECTANGLE_ON_CIRCLE_BOUNDARY
    category: BOUNDARY
    description: A zero-area point rectangle lies exactly on the circle boundary.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=4, maxX=4, minY=0, maxY=0.
    - The point rectangle location is exactly distance 4 from the center.
    expectedSourceBehavior:
    - The boundary point is contained according to contains(4,0).
    - The enclosing box contains the point rectangle.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_TANGENT_LINE_RECTANGLE
    category: BOUNDARY
    description: A zero-height rectangle is a horizontal segment tangent to the top
      of the circle.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-1, maxX=1, minY=4, maxY=4.
    - Every rectangle point has y=4, and (0,4) is exactly on the circle boundary.
    expectedSourceBehavior:
    - The shapes touch but are not disjoint.
    - The circle cannot contain the whole tangent segment.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: VERTICAL_CHORD_LINE_RECTANGLE
    category: EDGE
    description: A zero-width rectangle is a vertical chord segment fully inside the
      circle.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=0, maxX=0, minY=-3, maxY=3.
    - Both segment endpoints have distance 3 from the center, less than 4.
    expectedSourceBehavior:
    - The enclosing box CONTAINS the vertical segment.
    - The selected farthest endpoint is contained.
    - relate(rectangle) returns CONTAINS.
    targetCases: 1
    emptyOutputAllowed: false
  - id: HORIZONTAL_LINE_CROSSES_CIRCLE_AND_EXTENDS_OUTSIDE
    category: EDGE
    description: A zero-height rectangle crosses the center but extends beyond both
      circle sides.
    preconditions:
    - circle center is (0,0) and radiusDEG is 4.
    - rectangle bounds are minX=-5, maxX=5, minY=0, maxY=0.
    - The rectangle spans xAxis, and its endpoints are at distance 5 from the center.
    expectedSourceBehavior:
    - The shapes overlap because the segment spans the center.
    - The circle does not contain the farthest selected endpoint.
    - relate(rectangle) returns INTERSECTS.
    targetCases: 1
    emptyOutputAllowed: false
