  - id: NON_LEAP_FEBRUARY
    category: EDGE
    description: A complete February in an ordinary non-leap year.
    preconditions:
    - getStart().equals(LocalDate.of(2023, 2, 1)) and getEnd().equals(LocalDate.of(2023,
