InputDomain:
  summary: Non-null, valid LocalDateRange receivers whose exclusive end can be advanced
    by 23 days; bounded ranges cover empty, ordinary, calendar-boundary, representability-boundary,
    and LocalDate-limit cases, while eligible unbounded-start ranges cover the Integer.MAX_VALUE
    sentinel path.
  globalConstraints:
  - The source receiver must be a non-null LocalDateRange successfully created by
    one of the supplied public construction paths.
  - 'The source bounds must satisfy getStart() <= getEnd() and all constructor restrictions:
    the start is neither LocalDate.MAX nor LocalDate.MAX.minusDays(1), the end is
    neither LocalDate.MIN nor LocalDate.MIN.plusDays(1), and an empty range is not
    located at LocalDate.MIN or LocalDate.MAX.'
  - getEnd() must be on or before LocalDate.MAX.minusDays(23), so generateFollowUp
    can evaluate getEnd().plusDays(23) without DateTimeException.
  - Consequently, ranges unbounded at the end, including ofUnbounded(), are excluded
    because their end is LocalDate.MAX and the supplied follow-up transformation overflows
    before its sentinel-skip assertion can run.
  - For every bounded-start source, getEnd().toEpochDay() - getStart().toEpochDay()
    must be between 0 and Integer.MAX_VALUE minus 23 inclusive.
  - Bounded finite ranges longer than Integer.MAX_VALUE minus 23 days are excluded
    because adding 23 cannot be represented as the exact required increase in the
    int output domain; the assertion also performs int subtraction.
  - A source with bounded start and length at most Integer.MAX_VALUE minus 24 must
    normally produce finite outputs L and L + 23; sources whose follow-up ends at
    LocalDate.MAX or whose follow-up length is exactly Integer.MAX_VALUE reach the
    assertion's sentinel-skip path.
  - Unbounded-start sources are retained when their end satisfies the transformation
    bound; lengthInDays() must return Integer.MAX_VALUE for both source and follow-up,
    so the supplied assertion intentionally skips them.
  - No null, malformed, reversed, or otherwise construction-invalid source is included
    because the metamorphic relation does not request invalid inputs.
  diversity:
    boundedness:
    - bounded-finite
    - unbounded-start
    sourceLengthDays:
    - '0'
    - '1'
    - '7'
    - '22'
    - '23'
    - '24'
    - '28'
    - '29'
    - '30'
    - '31'
    - '90'
    - '91'
    - '92'
    - '181'
    - '182'
    - '183'
    - '184'
    - '365'
    - '366'
    - '731'
    - '146097'
    - Integer.MAX_VALUE-minus-25
    - Integer.MAX_VALUE-minus-24
    - Integer.MAX_VALUE-minus-23
    calendarFeature:
    - ordinary-date
    - month-boundary
    - year-boundary
    - leap-day
    - non-leap-century
    - leap-century
    - epoch-crossing
    - BCE-to-year-zero
    - Gregorian-400-year-cycle
    localDateBoundary:
    - MIN-plus-1-start
    - MIN-plus-2-empty
    - MAX-minus-25-end
    - MAX-minus-24-end
    - MAX-minus-23-end
    followUpDisposition:
    - bounded-finite
    - exact-Integer.MAX_VALUE-output
    - unbounded-end-sentinel
    - unbounded-start-sentinel
  scenarios:
  - id: ORDINARY_EMPTY_RANGE
    category: EDGE
    description: A bounded empty range at an ordinary date.
    preconditions:
    - getStart().equals(getEnd()) and getStart().equals(LocalDate.of(2024, 5, 15)).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - The follow-up is a bounded 23-day range and returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_LEGAL_EMPTY_RANGE
    category: BOUNDARY
    description: An empty range at the earliest date permitted for an empty LocalDateRange.
    preconditions:
    - getStart().equals(LocalDate.MIN.plusDays(2)) and getEnd().equals(getStart()).
    expectedSourceBehavior:
    - lengthInDays() returns 0 without treating the bounded range as unbounded.
    - The follow-up returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_LIMIT_EMPTY_RANGE
    category: BOUNDARY
    description: An empty bounded range close to the largest transformable exclusive
      end.
    preconditions:
    - getStart().equals(LocalDate.MAX.minusDays(25)) and getEnd().equals(getStart()).
    expectedSourceBehavior:
    - lengthInDays() returns 0.
    - Advancing the end by 23 remains bounded and the follow-up returns 23.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ORDINARY_ONE_DAY_RANGE
    category: NORMAL
    description: A normal one-day half-open range.
    preconditions:
    - getStart().equals(LocalDate.of(2024, 5, 15)) and getEnd().equals(LocalDate.of(2024,
      5, 16)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EARLIEST_FINITE_ONE_DAY_RANGE
    category: BOUNDARY
    description: The earliest legal bounded finite range, starting one day after LocalDate.MIN.
    preconditions:
    - getStart().equals(LocalDate.MIN.plusDays(1)) and getEnd().equals(LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up returns 24 without entering the unbounded-start sentinel path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: SEVEN_DAY_RANGE
    category: NORMAL
    description: A bounded range spanning exactly one seven-day interval.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() == 7.
    - getStart() is not LocalDate.MIN and getEnd() is before LocalDate.MAX.minusDays(23).
    expectedSourceBehavior:
    - lengthInDays() returns 7.
    - The follow-up returns 30.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_BELOW_EXTRA_DAYS
    category: BOUNDARY
    description: A source length one day below the transformation increment.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() == 22.
    - Both bounds are ordinary bounded dates.
    expectedSourceBehavior:
    - lengthInDays() returns 22.
    - The follow-up returns 45.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_EXTRA_DAYS
    category: BOUNDARY
    description: A source whose length equals the 23-day transformation increment.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() == 23.
    - Both bounds are ordinary bounded dates.
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up returns 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: ONE_ABOVE_EXTRA_DAYS
    category: BOUNDARY
    description: A source length one day above the transformation increment.
    preconditions:
    - getEnd().toEpochDay() - getStart().toEpochDay() == 24.
