  - id: LEAP_DAY_AS_LAST_INCLUDED_DATE
    category: EDGE
    description: A bounded range whose last included date is February 29.
    preconditions:
    - getStart().equals(LocalDate.of(2024, 2, 28)) and getEnd().equals(LocalDate.of(2024,
      3, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns 2.
    - The follow-up returns 25.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGE_LENGTH_BELOW_INT_FOLLOWUP_BOUNDARY
    category: BOUNDARY
    description: A very large finite range two days below the largest source length
      that can be increased by 23 within int.
    preconditions:
    - getStart() is not LocalDate.MIN.
    - getEnd().toEpochDay() - getStart().toEpochDay() == Integer.MAX_VALUE - 25.
    - getEnd().isBefore(LocalDate.MAX.minusDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 25.
    - The follow-up returns Integer.MAX_VALUE minus 2 and the assertion compares finite
      values.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGEST_NON_SENTINEL_FOLLOWUP_LENGTH
    category: BOUNDARY
    description: The largest finite source length whose follow-up length remains below
      Integer.MAX_VALUE.
    preconditions:
    - getStart() is not LocalDate.MIN.
    - getEnd().toEpochDay() - getStart().toEpochDay() == Integer.MAX_VALUE - 24.
    - getEnd().isBefore(LocalDate.MAX.minusDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 24.
    - The follow-up returns Integer.MAX_VALUE minus 1, allowing a non-skipped exact
      increase check.
    targetCases: 1
    emptyOutputAllowed: false
  - id: EXACT_INT_MAX_FOLLOWUP_COLLISION
    category: BOUNDARY
    description: The largest admitted finite source length; adding 23 yields the int
      value also used as the unbounded sentinel.
    preconditions:
    - getStart() is not LocalDate.MIN.
    - getEnd().toEpochDay() - getStart().toEpochDay() == Integer.MAX_VALUE - 23.
    - getEnd().isBefore(LocalDate.MAX.minusDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE minus 23.
    - The follow-up's mathematical finite length is Integer.MAX_VALUE, causing the
      supplied assertion to take its sentinel-skip path.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_END_TWO_DAYS_INSIDE_TRANSFORM_LIMIT
    category: BOUNDARY
    description: A one-day source ending two days inside the largest transformable
      exclusive end.
    preconditions:
    - getStart().equals(LocalDate.MAX.minusDays(26)) and getEnd().equals(LocalDate.MAX.minusDays(25)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up remains bounded, ends at LocalDate.MAX.minusDays(2), and returns
      24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UPPER_END_ONE_DAY_INSIDE_TRANSFORM_LIMIT
    category: BOUNDARY
    description: A one-day source whose transformed end is LocalDate.MAX.minusDays(1).
    preconditions:
    - getStart().equals(LocalDate.MAX.minusDays(25)) and getEnd().equals(LocalDate.MAX.minusDays(24)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up remains bounded and returns 24.
    targetCases: 1
    emptyOutputAllowed: false
  - id: LARGEST_TRANSFORMABLE_END
    category: BOUNDARY
    description: A one-day bounded source at the exact end boundary where adding 23
      produces LocalDate.MAX.
    preconditions:
    - getStart().equals(LocalDate.MAX.minusDays(24)) and getEnd().equals(LocalDate.MAX.minusDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns 1.
    - The follow-up has an unbounded end, returns Integer.MAX_VALUE, and is skipped
      by the assertion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: NEAR_MIN_TWENTY_THREE_DAY_RANGE
    category: BOUNDARY
    description: A finite 23-day range beginning at the earliest permitted bounded
      start.
    preconditions:
    - getStart().equals(LocalDate.MIN.plusDays(1)) and getEnd().equals(LocalDate.MIN.plusDays(24)).
    expectedSourceBehavior:
    - lengthInDays() returns 23.
    - The follow-up remains bounded and returns 46.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_EARLIEST_END
    category: BOUNDARY
    description: An unbounded-start range with the earliest legal exclusive end.
    preconditions:
    - getStart().equals(LocalDate.MIN) and getEnd().equals(LocalDate.MIN.plusDays(2)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE as the unbounded-range flag.
    - The follow-up is also unbounded at the start and the assertion skips it.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_ORDINARY_END
    category: EDGE
    description: An unbounded-start range ending at an ordinary date.
    preconditions:
    - getStart().equals(LocalDate.MIN) and getEnd().equals(LocalDate.of(2024, 1, 1)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The follow-up remains unbounded at the start and is skipped by the assertion.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_NEAR_MAX_END
    category: BOUNDARY
    description: An unbounded-start source ending one day below the transformation
      limit.
    preconditions:
    - getStart().equals(LocalDate.MIN) and getEnd().equals(LocalDate.MAX.minusDays(24)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The follow-up still has an unbounded start, ends at LocalDate.MAX.minusDays(1),
      and is skipped.
    targetCases: 1
    emptyOutputAllowed: false
  - id: UNBOUNDED_START_TO_LARGEST_TRANSFORMABLE_END
    category: BOUNDARY
    description: An unbounded-start source whose follow-up becomes unbounded at both
      ends.
    preconditions:
    - getStart().equals(LocalDate.MIN) and getEnd().equals(LocalDate.MAX.minusDays(23)).
    expectedSourceBehavior:
    - lengthInDays() returns Integer.MAX_VALUE.
    - The follow-up has start LocalDate.MIN and end LocalDate.MAX, returns Integer.MAX_VALUE,
      and is skipped.
    targetCases: 1
    emptyOutputAllowed: false
